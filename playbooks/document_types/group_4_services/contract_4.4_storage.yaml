      store_payload: true

  - id: storage_conditions
    name: "Условия хранения: температура, влажность, режим (ст. 891 ГК РФ)"
    description: >
      Фактографическая проверка наличия требований к условиям хранения:
      температурный режим, влажность, освещённость, вентиляция, специальные
      условия. Правовой ориентир — ст. 891 ГК РФ (обязанность хранителя
      обеспечить сохранность вещи).
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "условия хранения"
        - "температурный режим"
        - "влажность"
        - "влажностный режим"
        - "освещённость"
        - "вентиляция"
        - "специальные условия"
        - "микроклимат"
        - "ст. 891"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)услови(я|ях)\\s+хранени"
        - "(?i)температур(а|ы|е).*режим"
        - "(?i)(?:от\\s+)?[\\+\\-]?\\d+\\s*°"
        - "(?i)влажност(ь|и).*\\d+\\s*%"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор хранения (ст. 891 ГК РФ).
        Проверяется один вопрос: наличие и состав требований к условиям
        хранения вещи.
        Нормативный ориентир:
        - ст. 891 ГК РФ — хранитель обязан принять все меры для сохранности
          вещи; если условия хранения прямо не указаны — обеспечить меры,
          соответствующие обычаям и существу обязательства.
        Важно:
        - Твоя задача — не оценивать серьёзность риска.
        - Только установить, что прямо есть в тексте договора, а чего прямо нет.
        - Не выводи требования из ст. 891 ГК РФ — фиксируй только то,
          что прямо написано в договоре.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Указаны ли требования к условиям хранения.
        2. Какие типы условий упомянуты (температура / влажность / освещение /
          вентиляция / специальные / иные).
        3. Конкретные значения параметров (числа, диапазоны, единицы).

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Для отсутствующих данных:
          - сигнальное поле (storage_conditions_status) → "not_defined";
          - текстовые поля (storage_conditions_types /
            storage_conditions_details) → "Данные не определены".
        3. Запрещено возвращать "None", "null", пустую строку "" или пропускать ключ.
        4. storage_conditions_types — перечисли через "; " все упомянутые типы
          из фиксированного словаря: temperature; humidity; light; ventilation;
          special; other. Пример: "temperature; humidity; ventilation".
          Если условия упомянуты обобщённо, без указания типа — "other".
        5. storage_conditions_details — конкретные параметры с числами /
          единицами измерения / диапазонами. Пример: "температура от +2 до +8 °C,
          влажность не более 60%, приточно-вытяжная вентиляция". Если числа
          не указаны, но общее требование есть — перескажи формулировку
          (например, "соблюдение температурного режима, установленного
          производителем").
        6. В evidence — только цитаты из документа, каждая с clause_ref.
        7. Верни ТОЛЬКО один валидный JSON-объект, пригодный для json.loads().
          Без markdown, без ```json, без комментариев, без текста до или после.

        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1 (полный — температура + влажность + вентиляция):
        Фрагмент:
        "Хранитель обязан обеспечить хранение вещи при температуре
        от +2 до +8 °C, влажности не более 60% и круглосуточной
        приточно-вытяжной вентиляции."
        Ответ:
        {
          "storage_conditions_status": "defined",
          "storage_conditions_types": "temperature; humidity; ventilation",
          "storage_conditions_details": "температура от +2 до +8 °C, влажность не более 60%, круглосуточная приточно-вытяжная вентиляция",
          "evidence": [
            {
              "clause_ref": "п. X.Y",
              "quote": "Хранитель обязан обеспечить хранение вещи при температуре от +2 до +8 °C, влажности не более 60% и круглосуточной приточно-вытяжной вентиляции."
            }
          ]
        }

        Пример 2 (без чисел — общая формулировка):
        Фрагмент:
        "Хранитель обеспечивает соблюдение температурного режима,
        установленного производителем товара."
        Ответ:
        {
          "storage_conditions_status": "defined",
          "storage_conditions_types": "temperature",
          "storage_conditions_details": "соблюдение температурного режима, установленного производителем товара",
          "evidence": [
            {
              "clause_ref": "п. X.Y",
              "quote": "Хранитель обеспечивает соблюдение температурного режима, установленного производителем товара."
            }
          ]
        }

        Пример 3 (специальные условия без детализации):
        Фрагмент:
        "Хранитель принимает все необходимые меры для сохранности вещи,
        включая специальные условия хранения."
        Ответ:
        {
          "storage_conditions_status": "defined",
          "storage_conditions_types": "special",
          "storage_conditions_details": "специальные условия хранения (без детализации)",
          "evidence": [
            {
              "clause_ref": "п. X.Y",
              "quote": "Хранитель принимает все необходимые меры для сохранности вещи, включая специальные условия хранения."
            }
          ]
        }

        Пример 4 (ничего не указано):
        Фрагмент:
        "Хранитель принимает вещь Поклажедателя на хранение."
        Ответ:
        {
          "storage_conditions_status": "not_defined",
          "storage_conditions_types": "Данные не определены",
          "storage_conditions_details": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Указаны ли требования к условиям хранения?
        2. Какие типы условий упомянуты (температура / влажность / освещение /
          вентиляция / специальные / иные)?
        3. Приведены ли конкретные значения параметров?
        4. Выведены ли требования из текста договора, а не из ст. 891 ГК РФ?
        5. Проверь, что все 4 ключа (3 поля + evidence) присутствуют в JSON.
        6. Если ничего нет — "not_defined" для сигнального поля
          и "Данные не определены" для текстовых.
        7. Убедись, что ответ — валидный JSON, пригодный для json.loads().
        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "storage_conditions_status": "<defined / not_defined>",
          "storage_conditions_types": "<текст или 'Данные не определены'>",
          "storage_conditions_details": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 8
      temperature: 0.0
      max_tokens: 650
    retrieval:
      retrieval_profile: "technical_documentation_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "условия хранения температурный режим температура влажность влажностный режим освещённость вентиляция специальные условия микроклимат ст. 891"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
      negative_keywords:
        - "вознаграждение"
        - "ответственность"
        - "страхование"
        - "штраф"
        - "пеня"
        - "неустойка"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.15, 0.55]
        boost: 0.12
        scope: segment
      context_k: 8
      max_chunks: 10
      rerank: true
      enrichment_hints:
        preferred_segment_types:
          - "contract"
          - "amendment"
        excluded_segment_types:
          - "technical_specification"
          - "price_list"
        preferred_clause_functions:
          - "obligations"
        confidence_bonus_on_match: 0.08
        confidence_penalty_on_excluded_segment: 0.10
    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 500
    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 700

      compact_output: false

      presence_signal:
        field: "storage_conditions_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из договора хранения сведения
        о требованиях к условиям хранения вещи — их типах и конкретных значениях.
        Не анализируй иные темы.
        Не оценивай риски.
        Анализируй только текст договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. storage_conditions_presence:
           Агрегатное signal-поле — наличие требований к условиям хранения.
           - "present" — если storage_conditions_status ≠ "not_defined";
           - "missing" — если storage_conditions_status = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - storage_conditions_status = "not_defined";
           - storage_conditions_types = "Данные не определены";
           - storage_conditions_details = "Данные не определены";
           - не выполняй остальные шаги.

        1. storage_conditions_status:
           - "defined" — если в тексте прямо указаны требования к условиям
             хранения (температура, влажность, освещение, вентиляция, специальные
             условия, микроклимат), либо прямо указано, что специальные условия
             не устанавливаются (это тоже регулирование);
           - "not_defined" — если прямого указания нет.

        2. storage_conditions_types:
           Краткая user-facing формулировка типов условий через "; "
           из фиксированного словаря: "temperature; humidity; light;
           ventilation; special; other".
           Если условия упомянуты обобщённо, без указания типа — "other".
           Fallback: "Данные не определены" / "Не удалось определить".

        3. storage_conditions_details:
           Краткая user-facing формулировка конкретных параметров
           с числами / единицами измерения / диапазонами, если они есть
           в тексте; иначе — пересказ формулировки.
           Fallback: "Данные не определены" / "Не удалось определить".

        Если данные отсутствуют в тексте:
        - сигнальное поле → "not_defined";
        - текстовые поля → "Данные не определены".

        Если данные есть, но противоречивы:
        - сигнальное поле → "not_defined";
        - текстовые поля → "Не удалось определить".
        </task>

        <context_rules>
        - Перед остальными полями заполни storage_conditions_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — storage_conditions_status = "not_defined", все текстовые поля = "Данные не определены".
        - Используй только релевантные фрагменты контекста.
        - Не подставляй нормы закона, обычную практику или предположения вместо текста договора.
        - Не извлекай вознаграждение, ответственность, страхование, штрафы
          и иные нерелевантные темы.
        - Не выводи требования из ст. 891 ГК РФ — только из текста.
        - storage_conditions_types — только из фиксированного словаря
          (temperature; humidity; light; ventilation; special; other),
          разделитель — "; ". Обобщённые условия без типа → "other".
        - Если в разных фрагментах указаны противоречивые данные — верни
          "Не удалось определить" для текстовых полей, "not_defined" для сигнального.
        - Не используй пустые строки.
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни требований к условиям хранения, ни указания
           на температурный режим, влажность, освещение, вентиляцию.
           → presence = "missing";
             storage_conditions_status = "not_defined";
             storage_conditions_types = "Данные не определены";
             storage_conditions_details = "Данные не определены".

        2. Условия упомянуты обобщённо, без детализации.
           Например: "Хранитель обеспечивает надлежащие условия хранения",
           без указания типа и конкретных параметров.
           → presence = "present";
             storage_conditions_status = "defined";
             storage_conditions_types = "other";
             storage_conditions_details содержит пересказ формулировки.

        3. Противоречие между фрагментами.
           В разных частях договора указаны разные режимы хранения
           (например, разные температуры).
           → presence = "unclear";
             storage_conditions_status = "not_defined";
             storage_conditions_types = "Не удалось определить";
             storage_conditions_details = "Не удалось определить".

        4. Прямое указание на отсутствие специальных условий.
           В договоре прямо указано, что специальные условия хранения
           не устанавливаются и хранитель обеспечивает обычные меры
           для сохранности.
           → presence = "present";
             storage_conditions_status = "defined" (прямое регулирование);
             storage_conditions_types = "other";
             storage_conditions_details содержит дословную цитату об отсутствии
             специальных условий.
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для storage_conditions_presence используй только: "present", "missing", "unclear".
        - Для storage_conditions_status используй только: "defined", "not_defined".
        - Fallback при отсутствии данных:
          * storage_conditions_types, storage_conditions_details → "Данные не определены".
        - Fallback при противоречии или неоднозначности:
          * storage_conditions_types, storage_conditions_details → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "storage_conditions_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие требований к условиям хранения. Внутреннее агрегатное signal-поле."
          required: true

        - name: "storage_conditions_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Наличие требований к условиям хранения. Внутреннее enum-поле."
          label: "Условия хранения"
          required: true
          display_in_grid: true
          display_priority: 1

        - name: "storage_conditions_types"
          type: "string"
          presentation: "fact"
          label: "Типы условий"
          description: >
            Типы условий хранения через '; ': temperature; humidity; light; ventilation; special; other. Fallback: "Не установлено" / "Не удалось определить".
          required: true
          display_in_grid: true
          display_priority: 2

        - name: "storage_conditions_details"
          type: "string"
          presentation: "fact"
          label: "Параметры условий"
          description: >
            Конкретные значения параметров условий хранения. Fallback: "Не установлено" / "Не удалось определить".
          required: true
          display_in_grid: true
          display_priority: 3

      store_payload: true

  - id: return_procedure
    name: "Порядок выдачи вещи (ст. 900 ГК РФ)"
    description: >
      Фактографическая проверка процедуры выдачи вещи поклажедателю
      или указанному им получателю: тип документа выдачи (форма МХ-3 /
      иной акт / расписка), проверка правомочий получателя, условия
      возврата. Правовой ориентир — ст. 900 ГК РФ.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "выдача вещи"
        - "возврат вещи"
        - "акт выдачи"
        - "акт возврата"
        - "форма МХ-3"
        - "проверка правомочий"
        - "предъявление документа"
        - "уполномоченное лицо"
        - "получатель вещи"
        - "Постановление Госкомстата"
        - "ст. 900"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)(выдач|возврат)(а|и|у)\\s+вещ"
        - "(?i)акт\\s+(выдач|возврат)"
        - "(?i)форм(а|е)\\s+МХ[\\s-]*3"
        - "(?i)проверк(а|и)\\s+правомоч"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор хранения (ст. 900 ГК РФ).
        Проверяется один вопрос: порядок выдачи вещи поклажедателю
        или указанному им получателю.
        Нормативные ориентиры:
        - п. 1 ст. 900 ГК РФ — хранитель обязан возвратить поклажедателю
          или лицу, указанному им в качестве получателя, ту самую вещь,
          которая была передана на хранение;
        - п. 2 ст. 900 ГК РФ — вещь возвращается в том состоянии,
          в каком была принята, с учётом естественного ухудшения и убыли;
        - форма МХ-3 — акт о возврате товарно-материальных ценностей,
          сданных на хранение (утв. Постановлением Госкомстата России
          от 09.08.1999 № 66; с 2013 — необязательная форма).
        Важно:
        - Твоя задача — не оценивать серьёзность риска.
        - Только установить, что прямо есть в тексте договора, а чего прямо нет.
        - Не выводи порядок из ст. 900 ГК РФ — фиксируй только то,
          что прямо написано в договоре.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Предусмотрен ли порядок выдачи вещи.
        2. Тип документа выдачи (форма МХ-3 / иной акт / расписка).
        3. Указана ли проверка правомочий получателя.
        4. Условия возврата (место, срок, порядок, кто получает).

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Для отсутствующих данных:
          - сигнальные поля (return_procedure_status / return_document_type /
            authority_check_status) → "not_defined";
          - текстовое поле (return_conditions_details) → "Данные не определены".
        3. Запрещено возвращать "None", "null", пустую строку "" или пропускать ключ.
        4. return_document_type = "act_mh3" — если прямо указана форма МХ-3
          или «акт о возврате товарно-материальных ценностей»;
          "other_act" — если указан акт / акт приёма-передачи без формы МХ-3;
          "receipt" — если указана расписка / сохранная расписка при выдаче.
        5. authority_check_status = "yes" — если прямо указана проверка
          правомочий получателя, предъявление документа (паспорт, доверенность),
          сверка подписи. "no" — если прямо указано, что проверка не требуется.
        6. return_conditions_details — место, срок, порядок, кто получает
          (поклажедатель / указанное им лицо / представитель по доверенности).
        7. В evidence — только цитаты из документа, каждая с clause_ref.
        8. Верни ТОЛЬКО один валидный JSON-объект, пригодный для json.loads().
          Без markdown, без ```json, без комментариев, без текста до или после.

        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1 (полный):
        Фрагмент:
        "Возврат вещи оформляется актом о возврате товарно-материальных
        ценностей по форме МХ-3. Хранитель обязан проверить правомочия
        получателя — предъявление паспорта и доверенности, если получатель
        не является Поклажедателем. Возврат производится по адресу Хранителя
        в течение 3 рабочих дней с даты получения требования."
        Ответ:
        {
          "return_procedure_status": "defined",
          "return_document_type": "act_mh3",
          "authority_check_status": "yes",
          "return_conditions_details": "по адресу Хранителя в течение 3 рабочих дней с даты получения требования; проверка паспорта и доверенности, если получатель не Поклажедатель",
          "evidence": [
            {
              "clause_ref": "п. X.Y",
              "quote": "Возврат вещи оформляется актом о возврате товарно-материальных ценностей по форме МХ-3."
            }
          ]
        }

        Пример 2 (без проверки правомочий):
        Фрагмент:
        "Вещь возвращается Поклажедателю по акту приёма-передачи."
        Ответ:
        {
          "return_procedure_status": "defined",
          "return_document_type": "other_act",
          "authority_check_status": "not_defined",
          "return_conditions_details": "вещь возвращается Поклажедателю по акту приёма-передачи",
          "evidence": [
            {
              "clause_ref": "п. X.Y",
              "quote": "Вещь возвращается Поклажедателю по акту приёма-передачи."
            }
          ]
        }

        Пример 3 (расписка):
        Фрагмент:
        "При выдаче вещи Поклажедатель выдаёт Хранителю расписку
        о получении вещи."
        Ответ:
        {
          "return_procedure_status": "defined",
          "return_document_type": "receipt",
          "authority_check_status": "not_defined",
          "return_conditions_details": "при выдаче вещи Поклажедатель выдаёт расписку о получении",
          "evidence": [
            {
              "clause_ref": "п. X.Y",
              "quote": "При выдаче вещи Поклажедатель выдаёт Хранителю расписку о получении вещи."
            }
          ]
        }

        Пример 4 (ничего не указано):
        Фрагмент:
        "Хранитель хранит вещь Поклажедателя."
        Ответ:
        {
          "return_procedure_status": "not_defined",
          "return_document_type": "not_defined",
          "authority_check_status": "not_defined",
          "return_conditions_details": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Предусмотрен ли порядок выдачи вещи?
        2. Определён ли тип документа выдачи (МХ-3 / иной акт / расписка)?
        3. Указана ли проверка правомочий получателя?
        4. Приведены ли условия возврата (место, срок, порядок, кто получает)?
        5. Выведен ли порядок из текста договора, а не из ст. 900 ГК РФ?
        6. Проверь, что все 5 ключей (4 поля + evidence) присутствуют в JSON.
        7. Если ничего нет — "not_defined" для сигнальных полей
          и "Данные не определены" для текстового.
        8. Убедись, что ответ — валидный JSON, пригодный для json.loads().
        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "return_procedure_status": "<defined / not_defined>",
          "return_document_type": "<act_mh3 / other_act / receipt / not_defined>",
          "authority_check_status": "<yes / no / not_defined>",
          "return_conditions_details": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 8
      temperature: 0.0
      max_tokens: 650
    retrieval:
      retrieval_profile: "acceptance_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "выдача вещи возврат вещи акт выдачи акт возврата форма МХ-3 акт о возврате товарно-материальных ценностей проверка правомочий получателя предъявление документа паспорт доверенность уполномоченное лицо получатель вещи Постановление Госкомстата ст. 900"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - procedures
        - obligations
      negative_keywords:
        - "вознаграждение"
        - "ответственность"
        - "страхование"
        - "штраф"
        - "пеня"
        - "неустойка"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.40, 0.80]
        boost: 0.12
        scope: segment
      context_k: 8
      max_chunks: 10
      rerank: true
      enrichment_hints:
        preferred_segment_types:
          - "contract"
          - "amendment"
        excluded_segment_types:
          - "technical_specification"
          - "price_list"
        preferred_clause_functions:
          - "procedures"
          - "obligations"
        confidence_bonus_on_match: 0.08
        confidence_penalty_on_excluded_segment: 0.10
    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 500
    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 750

      compact_output: false

      presence_signal:
        field: "return_procedure_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из договора хранения сведения
        о порядке выдачи вещи: тип документа, проверка правомочий получателя,
        условия возврата.
        Не анализируй иные темы.
        Не оценивай риски.
        Анализируй только текст договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. return_procedure_presence:
           Агрегатное signal-поле — наличие порядка выдачи вещи.
           - "present" — если хотя бы одно из содержательных полей
             (return_procedure_status, return_document_type,
              authority_check_status) ≠ "not_defined";
           - "missing" — если все три содержательных поля = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - return_procedure_status = "not_defined";
           - return_document_type = "not_defined";
           - authority_check_status = "not_defined";
           - return_conditions_details = "Данные не определены";
           - не выполняй остальные шаги.

        1. return_procedure_status:
           - "defined" — если в тексте прямо указан порядок выдачи / возврата
             вещи (документ выдачи, условия возврата), либо прямо указано,
             что вещь не возвращается (это тоже регулирование);
           - "not_defined" — если прямого указания нет.

        2. return_document_type:
           - "act_mh3" — прямо указана форма МХ-3 или «акт о возврате
             товарно-материальных ценностей»;
           - "other_act" — прямо указан акт / акт приёма-передачи без формы МХ-3;
           - "receipt" — прямо указана расписка / сохранная расписка при выдаче;
           - "not_defined" — тип документа прямо не указан.

        3. authority_check_status:
           - "yes" — прямо указана проверка правомочий получателя
             (предъявление документа, сверка подписи);
           - "no" — прямо указано, что проверка не требуется;
           - "not_defined" — прямо не указано.

        4. return_conditions_details:
           Краткая user-facing формулировка условий возврата на русском языке:
           место, срок, порядок, кто получает (поклажедатель / указанное им лицо /
           представитель по доверенности).
           Fallback: "Данные не определены" / "Не удалось определить".

        Если данные отсутствуют в тексте:
        - сигнальные поля → "not_defined";
        - текстовое поле → "Данные не определены".

        Если данные есть, но противоречивы:
        - сигнальные поля → "not_defined";
        - текстовое поле → "Не удалось определить".
        </task>

        <context_rules>
        - Перед остальными полями заполни return_procedure_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status / *_type / *_check = "not_defined", return_conditions_details = "Данные не определены".
        - Используй только релевантные фрагменты контекста.
        - Не подставляй нормы закона, обычную практику или предположения вместо текста договора.
        - Не извлекай вознаграждение, ответственность, страхование, штрафы
          и иные нерелевантные темы.
        - Не выводи порядок из ст. 900 ГК РФ — только из текста.
        - return_document_type = "act_mh3" — при прямом указании формы МХ-3
          или «акта о возврате товарно-материальных ценностей».
        - return_document_type = "other_act" — при указании акта
          без формы МХ-3.
        - return_document_type = "receipt" — при указании расписки.
        - authority_check_status = "yes" — при прямом указании проверки
          правомочий; "no" — при прямом указании, что проверка не требуется.
        - Если в разных фрагментах указаны противоречивые данные — верни
          "Не удалось определить" для текстового поля, "not_defined" для сигнальных.
        - Не используй пустые строки.
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни порядка выдачи, ни типа документа,
           ни проверки правомочий, ни условий возврата.
           → presence = "missing";
             все *_status / *_type / *_check = "not_defined";
             return_conditions_details = "Данные не определены".

        2. Порядок выдачи указан, детали не раскрыты.
           Например: "Вещь возвращается Поклажедателю",
           без указания документа и условий.
           → presence = "present";
             return_procedure_status = "defined";
             return_document_type = "not_defined";
             authority_check_status = "not_defined";
             return_conditions_details содержит дословную формулировку.

        3. Противоречие между фрагментами.
           В разных частях договора указаны разные типы документов выдачи
           или разные условия возврата.
           → presence = "unclear";
             соответствующие сигнальные поля = "not_defined";
             return_conditions_details = "Не удалось определить".

        4. Прямое указание на отсутствие проверки правомочий.
           В договоре прямо указано, что вещь выдаётся любому предъявителю
           без проверки правомочий, либо что проверка не требуется.
           → presence = "present";
             return_procedure_status = "defined";
             authority_check_status = "no";
             return_document_type = "not_defined" (если прямо не назван).
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для return_procedure_presence используй только: "present", "missing", "unclear".
        - Для return_procedure_status используй только: "defined", "not_defined".
        - Для return_document_type используй только: "act_mh3", "other_act", "receipt", "not_defined".
        - Для authority_check_status используй только: "yes", "no", "not_defined".
        - Fallback при отсутствии данных:
          * return_conditions_details → "Данные не определены".
        - Fallback при противоречии или неоднозначности:
          * return_conditions_details → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "return_procedure_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие порядка выдачи вещи. Внутреннее агрегатное signal-поле."
          required: true

        - name: "return_procedure_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Наличие порядка выдачи вещи. Внутреннее enum-поле."
          label: "Порядок выдачи"
          required: true
          display_in_grid: true
          display_priority: 1

        - name: "return_document_type"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["act_mh3", "other_act", "receipt", "not_defined"]
          description: "Тип документа выдачи вещи. Внутреннее enum-поле."
          label: "Документ выдачи"
          required: true
          display_in_grid: true
          display_priority: 2

        - name: "authority_check_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Проверка правомочий получателя. Внутреннее enum-поле."
          label: "Проверка правомочий"
          required: true
          display_in_grid: true
          display_priority: 3

        - name: "return_conditions_details"
          type: "string"
          presentation: "fact"
          label: "Условия возврата"
          description: >
            Место, срок, порядок и получатель вещи. Fallback: "Не установлено" / "Не удалось определить".
          required: true
          display_in_grid: true
          display_priority: 4

      store_payload: true

  - id: inspection_upon_return
    name: "Проверка вещи при возврате (ст. 900, 902 ГК РФ)"
    description: >
      Фактографическая проверка условия о проверке вещи при возврате,
      порядке фиксации недостачи и повреждений, а также сроках предъявления
      претензий по состоянию вещи. Правовые ориентиры — п. 2 ст. 900 ГК РФ
      (возврат в том состоянии, в каком вещь была принята, с учётом
      естественного ухудшения) и ст. 902 ГК РФ (размер ответственности
      при недостаче / повреждении).
    triggers: {}
    ui_mode: "field_extraction"
    severity: "medium"
    severity_if_pass: "pass"
    severity_if_fail: "medium"
    severity_if_unclear: "low"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "проверка при возврате"
        - "осмотр при выдаче"
        - "претензии при выдаче"
        - "подписание акта возврата"
        - "фиксация недостачи"
        - "фиксация повреждений"
        - "срок претензий"
        - "приёмка по качеству"
        - "ст. 900"
        - "ст. 902"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)проверк(а|и).*при.*(возврат|выдач)"
        - "(?i)осмотр.*при.*(возврат|выдач)"
        - "(?i)(недостач|поврежден).*(фиксир|оформл|акт)"
        - "(?i)претензи.*(срок|дн|дней|период)"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор хранения (ст. 900, 902 ГК РФ).
        Проверяется один вопрос: проверка вещи при возврате, порядок
        фиксации недостачи / повреждений и срок предъявления претензий.
        Нормативные ориентиры:
        - п. 2 ст. 900 ГК РФ — вещь возвращается в том состоянии,
          в каком была принята на хранение, с учётом естественного
          ухудшения, естественной убыли или иного изменения вследствие
          её естественных свойств;
        - ст. 902 ГК РФ — размер ответственности хранителя при утрате,
          недостаче или повреждении вещи.
        Важно:
        - Твоя задача — не оценивать серьёзность риска.
        - Только установить, что прямо есть в тексте договора, а чего прямо нет.
        - Не выводи порядок из ст. 900 ГК РФ — фиксируй только то, что прямо
          написано в договоре.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Предусмотрена ли проверка / осмотр вещи при возврате.
        2. Порядок проверки (кто проводит, где, как оформляется).
        3. Порядок фиксации недостачи / повреждений (акт, комиссия, фото и т.п.).
        4. Срок предъявления претензий по состоянию вещи.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Для отсутствующих данных:
          - сигнальные поля (inspection_return_status /
            claims_deadline_status) → "not_defined";
          - текстовые поля (inspection_procedure_details /
            shortage_recording_details / claims_deadline_value) →
            "Данные не определены".
        3. Запрещено возвращать "None", "null", пустую строку "" или пропускать ключ.
        4. inspection_return_status = "defined" — если прямо указана проверка
          вещи при возврате (осмотр, сверка, приёмка) в любой формулировке.
        5. inspection_procedure_details — кто проводит, где, как оформляется
          (акт осмотра, сверка с актом приёма-передачи и т. п.).
        6. shortage_recording_details — конкретный порядок фиксации недостачи /
          повреждений: составление акта, привлечение независимого эксперта,
          фото-фиксация, комиссия и т. п.
        7. claims_deadline_status = "defined" — если прямо указан срок
          предъявления претензий по состоянию вещи. claims_deadline_value —
          конкретный срок («в течение 5 рабочих дней с даты выдачи»).
        8. В evidence — только цитаты из документа, каждая с clause_ref.
        9. Верни ТОЛЬКО один валидный JSON-объект, пригодный для json.loads().
          Без markdown, без ```json, без комментариев, без текста до или после.

        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1 (полный):
        Фрагмент:
        "При возврате вещи Поклажедатель обязан провести осмотр вещи
        в присутствии представителя Хранителя. Недостача или повреждение
        фиксируются двусторонним актом осмотра, при необходимости —
        с привлечением независимого эксперта. Претензии по состоянию
        вещи принимаются в течение 5 рабочих дней с даты выдачи."
        Ответ:
        {
          "inspection_return_status": "defined",
          "inspection_procedure_details": "осмотр Поклажедателем в присутствии представителя Хранителя",
          "shortage_recording_details": "двусторонний акт осмотра, при необходимости — независимый эксперт",
          "claims_deadline_status": "defined",
          "claims_deadline_value": "в течение 5 рабочих дней с даты выдачи",
          "evidence": [
            {
              "clause_ref": "п. X.Y",
              "quote": "При возврате вещи Поклажедатель обязан провести осмотр вещи в присутствии представителя Хранителя."
            }
          ]
        }

        Пример 2 (частичные данные — только проверка):
        Фрагмент:
        "Поклажедатель вправе осмотреть вещь при её возврате."
        Ответ:
        {
          "inspection_return_status": "defined",
          "inspection_procedure_details": "осмотр Поклажедателем при возврате вещи",
          "shortage_recording_details": "Данные не определены",
          "claims_deadline_status": "not_defined",
          "claims_deadline_value": "Данные не определены",
          "evidence": [
            {
              "clause_ref": "п. X.Y",
              "quote": "Поклажедатель вправе осмотреть вещь при её возврате."
            }
          ]
        }

        Пример 3 (только срок претензий):
        Фрагмент:
        "Претензии по состоянию вещи могут быть предъявлены в течение
        10 календарных дней после возврата вещи."
        Ответ:
        {
          "inspection_return_status": "not_defined",
          "inspection_procedure_details": "Данные не определены",
          "shortage_recording_details": "Данные не определены",
          "claims_deadline_status": "defined",
          "claims_deadline_value": "в течение 10 календарных дней после возврата вещи",
          "evidence": [
            {
              "clause_ref": "п. X.Y",
              "quote": "Претензии по состоянию вещи могут быть предъявлены в течение 10 календарных дней после возврата вещи."
            }
          ]
        }

        Пример 4 (ничего не указано):
        Фрагмент:
        "Хранитель возвращает вещь Поклажедателю."
        Ответ:
        {
          "inspection_return_status": "not_defined",
          "inspection_procedure_details": "Данные не определены",
          "shortage_recording_details": "Данные не определены",
          "claims_deadline_status": "not_defined",
          "claims_deadline_value": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Предусмотрена ли проверка / осмотр вещи при возврате?
        2. Определён ли порядок проверки?
        3. Определён ли порядок фиксации недостачи / повреждений?
        4. Указан ли срок предъявления претензий?
        5. Выведены ли условия из текста договора, а не из ст. 900 ГК РФ?
        6. Проверь, что все 6 ключей (5 полей + evidence) присутствуют в JSON.
        7. Если ничего нет — "not_defined" для сигнальных полей
          и "Данные не определены" для текстовых.
        8. Убедись, что ответ — валидный JSON, пригодный для json.loads().
        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "inspection_return_status": "<defined / not_defined>",
          "inspection_procedure_details": "<текст или 'Данные не определены'>",
          "shortage_recording_details": "<текст или 'Данные не определены'>",
          "claims_deadline_status": "<defined / not_defined>",
          "claims_deadline_value": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 700
    retrieval:
      retrieval_profile: "acceptance_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "проверка при возврате осмотр при выдаче осмотр вещи приёмка по качеству фиксация недостачи фиксация повреждений акт осмотра независимый эксперт претензии по состоянию вещи срок претензий подписание акта возврата ст. 900 ст. 902"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - procedures
        - remedies
      negative_keywords:
        - "вознаграждение"
        - "страхование"
        - "штраф"
        - "пеня"
        - "неустойка"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.40, 0.80]
        boost: 0.10
        scope: segment
      context_k: 6
      max_chunks: 8
      rerank: true
      enrichment_hints:
        preferred_segment_types:
          - "contract"
          - "amendment"
        excluded_segment_types:
          - "technical_specification"
          - "price_list"
        preferred_clause_functions:
          - "procedures"
          - "remedies"
        confidence_bonus_on_match: 0.08
        confidence_penalty_on_excluded_segment: 0.10
    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 500
    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 800

      compact_output: false

      presence_signal:
        field: "inspection_upon_return_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из договора хранения сведения
        о проверке вещи при возврате, порядке фиксации недостачи / повреждений
        и сроке предъявления претензий.
        Не анализируй иные темы.
        Не оценивай риски.
        Анализируй только текст договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. inspection_upon_return_presence:
           Агрегатное signal-поле — наличие условий проверки вещи при возврате.
           - "present" — если хотя бы одно из содержательных полей
             (inspection_return_status, claims_deadline_status) ≠ "not_defined";
           - "missing" — если оба содержательных поля = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - inspection_return_status = "not_defined";
           - claims_deadline_status = "not_defined";
           - inspection_procedure_details = "Данные не определены";
           - shortage_recording_details = "Данные не определены";
           - claims_deadline_value = "Данные не определены";
           - не выполняй остальные шаги.

        1. inspection_return_status:
           - "defined" — если в тексте прямо указана проверка / осмотр вещи
             при возврате (осмотр, сверка, приёмка) в любой формулировке,
             либо прямо указано, что проверка не требуется (это тоже
             регулирование);
           - "not_defined" — если прямого указания нет.

        2. inspection_procedure_details:
           Краткая user-facing формулировка порядка проверки на русском языке:
           кто проводит, где, как оформляется.
           Fallback: "Данные не определены" / "Не удалось определить".

        3. shortage_recording_details:
           Краткая user-facing формулировка порядка фиксации недостачи /
           повреждений (акт, комиссия, независимый эксперт, фото-фиксация).
           Fallback: "Данные не определены" / "Не удалось определить".

        4. claims_deadline_status:
           - "defined" — если в тексте прямо указан срок предъявления
             претензий по состоянию вещи;
           - "not_defined" — если прямого указания нет.

        5. claims_deadline_value:
           Краткая user-facing формулировка срока предъявления претензий.
           Fallback: "Данные не определены" / "Не удалось определить".

        Если данные отсутствуют в тексте:
        - сигнальные поля → "not_defined";
        - текстовые поля → "Данные не определены".

        Если данные есть, но противоречивы:
        - сигнальные поля → "not_defined";
        - текстовые поля → "Не удалось определить".
        </task>

        <context_rules>
        - Перед остальными полями заполни inspection_upon_return_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined", все текстовые поля = "Данные не определены".
        - Используй только релевантные фрагменты контекста.
        - Не подставляй нормы закона, обычную практику или предположения вместо текста договора.
        - Не извлекай вознаграждение, страхование, штрафы, пени, неустойки
          и иные нерелевантные темы.
        - Не выводи порядок из ст. 900 ГК РФ — только из текста.
        - inspection_return_status = "defined" — при прямом указании проверки /
          осмотра / сверки при возврате, либо при прямом указании, что проверка
          не требуется.
        - Если в разных фрагментах указаны противоречивые данные — верни
          "Не удалось определить" для текстовых полей, "not_defined" для сигнальных.
        - Не используй пустые строки.
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни проверки при возврате, ни порядка фиксации
           недостачи / повреждений, ни срока претензий.
           → presence = "missing";
             все *_status = "not_defined";
             все текстовые поля = "Данные не определены".

        2. Проверка упомянута без деталей.
           Например: "Поклажедатель вправе осмотреть вещь при возврате",
           без указания порядка фиксации и срока претензий.
           → presence = "present";
             inspection_return_status = "defined";
             shortage_recording_details = "Данные не определены";
             claims_deadline_status = "not_defined".

        3. Противоречие между фрагментами.
           В разных частях договора указаны разные сроки претензий
           или разные порядки проверки.
           → presence = "unclear";
             соответствующие *_status = "not_defined";
             соответствующие текстовые поля = "Не удалось определить".

        4. Прямое указание на отсутствие проверки.
           В договоре прямо указано, что вещь возвращается без проверки
           и претензии по состоянию вещи не принимаются.
           → presence = "present";
             inspection_return_status = "defined" (прямое регулирование);
             claims_deadline_status = "defined" (прямое указание
               об отсутствии срока / непринятии претензий);
             текстовые поля содержат дословную цитату.
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для inspection_upon_return_presence используй только: "present", "missing", "unclear".
        - Для inspection_return_status и claims_deadline_status используй только: "defined", "not_defined".
        - Fallback при отсутствии данных:
          * inspection_procedure_details, shortage_recording_details,
            claims_deadline_value → "Данные не определены".
        - Fallback при противоречии или неоднозначности:
          * все текстовые поля → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "inspection_upon_return_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие условий проверки вещи при возврате. Внутреннее агрегатное signal-поле."
          required: true

        - name: "inspection_return_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Наличие условия о проверке вещи при возврате. Внутреннее enum-поле."
          label: "Проверка при возврате"
          required: true
          display_in_grid: true
          display_priority: 1

        - name: "inspection_procedure_details"
          type: "string"
          presentation: "fact"
          label: "Порядок проверки"
          description: >
            Кто, где и как проводит проверку вещи при возврате. Fallback: "Не установлено" / "Не удалось определить".
          required: true
          display_in_grid: true
          display_priority: 2

        - name: "shortage_recording_details"
          type: "string"
          presentation: "fact"
          label: "Фиксация недостачи"
          description: >
            Порядок фиксации недостачи / повреждений. Fallback: "Не установлено" / "Не удалось определить".
          required: true
          display_in_grid: true
          display_priority: 3

        - name: "claims_deadline_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          description: "Наличие срока предъявления претензий. Внутреннее enum-поле."
          required: true

        - name: "claims_deadline_value"
          type: "string"
          presentation: "fact"
          label: "Срок претензий"
          description: >
            Срок предъявления претензий по состоянию вещи. Fallback: "Не установлено" / "Не удалось определить".
          required: true
          display_in_grid: true
          display_priority: 4

      store_payload: true

  - id: extraordinary_expenses
    name: "Чрезвычайные расходы на сохранность (ст. 898 ГК РФ)"
    description: >
      Фактографическая проверка условия возмещения чрезвычайных расходов
      на сохранность вещи (п. 1, 2 ст. 898 ГК РФ), порядка согласования /
      последующего одобрения и лимита расходов, которые хранитель вправе
      понести без согласования с поклажедателем.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "medium"
    severity_if_pass: "pass"
    severity_if_fail: "medium"
    severity_if_unclear: "low"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "чрезвычайные расходы"
        - "неотложные меры"
        - "согласие поклажедателя"
        - "одобрение поклажедателя"
        - "в интересах поклажедателя"
        - "превышают обычные расходы"
        - "лимит расходов"
        - "ст. 898"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)чрезвычайн(ые|ых)\\s+расход"
        - "(?i)неотложн(ые|ых)\\s+мер"
        - "(?i)(согласи|одобрени).*поклажедател"
        - "(?i)в\\s+интересах\\s+поклажедател"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор хранения (ст. 898 ГК РФ).
        Проверяется один вопрос: условия возмещения чрезвычайных расходов
        на сохранность вещи, порядок согласования и лимит расходов
        без согласования.
        Нормативные ориентиры:
        - п. 1 ст. 898 ГК РФ — расходы на хранение, превышающие обычные
          и произведённые в чрезвычайных обстоятельствах для сохранения
          вещи (чрезвычайные расходы), возмещаются хранителю, если
          поклажедатель дал согласие на эти расходы или одобрил их
          впоследствии;
        - п. 2 ст. 898 ГК РФ — при отсутствии согласия поклажедателя
          хранитель может требовать возмещения чрезвычайных расходов,
          если в силу закона или иного правового акта он не мог получить
          предварительное согласие и произвёл эти расходы в интересах
          поклажедателя.
        Важно:
        - Твоя задача — не оценивать серьёзность риска.
        - Только установить, что прямо есть в тексте договора, а чего прямо нет.
        - Не выводи условия из ст. 898 ГК РФ — фиксируй только то, что прямо
          написано в договоре.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Предусмотрено ли возмещение чрезвычайных расходов.
        2. Условия возмещения (при согласии / при последующем одобрении /
          при невозможности получить согласие).
        3. Порядок согласования / одобрения (письменно, устно, электронно).
        4. Указан ли лимит расходов, которые хранитель вправе понести
          без согласования.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Для отсутствующих данных:
          - сигнальные поля (extraordinary_expenses_status /
            expense_limit_status) → "not_defined";
          - текстовые поля (extraordinary_expenses_conditions /
            approval_procedure_details / expense_limit_value) →
            "Данные не определены".
        3. Запрещено возвращать "None", "null", пустую строку "" или пропускать ключ.
        4. extraordinary_expenses_status = "defined" — если прямо указано
          возмещение чрезвычайных / неотложных расходов на сохранность вещи.
        5. extraordinary_expenses_conditions — формулировка условий возмещения
          («при согласии поклажедателя», «при последующем одобрении»,
          «если расходы произведены в интересах поклажедателя» и т. п.).
        6. approval_procedure_details — порядок согласования / одобрения:
          письменная форма, устное, электронная почта, заказным письмом и т. п.
        7. expense_limit_status = "defined" — если прямо указан лимит
          расходов, которые хранитель вправе понести без согласования.
        8. expense_limit_value — конкретное значение лимита с единицей
          измерения («не более 50 000 руб.», «до 10% от стоимости вещи»).
          Не голое число.
        9. В evidence — только цитаты из документа, каждая с clause_ref.
        10. Верни ТОЛЬКО один валидный JSON-объект, пригодный для json.loads().
            Без markdown, без ```json, без комментариев, без текста до или после.

        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1 (полный — условия + порядок + лимит):
        Фрагмент:
        "Хранитель вправе произвести чрезвычайные расходы для сохранения
        вещи при предварительном письменном согласии Поклажедателя либо
        с последующим одобрением в течение 5 рабочих дней. Без согласования
        Хранитель вправе понести расходы не более 30 000 рублей."
        Ответ:
        {
          "extraordinary_expenses_status": "defined",
          "extraordinary_expenses_conditions": "при предварительном письменном согласии либо с последующим одобрением в течение 5 рабочих дней",
          "approval_procedure_details": "предварительное письменное согласие либо последующее одобрение",
          "expense_limit_status": "defined",
          "expense_limit_value": "не более 30 000 рублей без согласования",
          "evidence": [
            {
              "clause_ref": "п. X.Y",
              "quote": "Хранитель вправе произвести чрезвычайные расходы для сохранения вещи при предварительном письменном согласии Поклажедателя либо с последующим одобрением в течение 5 рабочих дней."
            }
          ]
        }

        Пример 2 (условия без лимита):
        Фрагмент:
        "Чрезвычайные расходы Хранителя возмещаются Поклажедателем,
        если Поклажедатель дал согласие на такие расходы или одобрил
        их впоследствии."
        Ответ:
        {
          "extraordinary_expenses_status": "defined",
          "extraordinary_expenses_conditions": "при согласии Поклажедателя или последующем одобрении",
          "approval_procedure_details": "Данные не определены",
          "expense_limit_status": "not_defined",
          "expense_limit_value": "Данные не определены",
          "evidence": [
            {
              "clause_ref": "п. X.Y",
              "quote": "Чрезвычайные расходы Хранителя возмещаются Поклажедателем, если Поклажедатель дал согласие на такие расходы или одобрил их впоследствии."
            }
          ]
        }

        Пример 3 (только лимит):
        Фрагмент:
        "Хранитель вправе без согласования Поклажедателя понести расходы
        на сохранность вещи в размере не более 5% от её стоимости."
        Ответ:
        {
          "extraordinary_expenses_status": "not_defined",
          "extraordinary_expenses_conditions": "Данные не определены",
          "approval_procedure_details": "Данные не определены",
          "expense_limit_status": "defined",
          "expense_limit_value": "не более 5% от стоимости вещи",
          "evidence": [
            {
              "clause_ref": "п. X.Y",
              "quote": "Хранитель вправе без согласования Поклажедателя понести расходы на сохранность вещи в размере не более 5% от её стоимости."
            }
          ]
        }

        Пример 4 (ничего не указано):
        Фрагмент:
        "Хранитель принимает вещь Поклажедателя на хранение."
        Ответ:
        {
          "extraordinary_expenses_status": "not_defined",
          "extraordinary_expenses_conditions": "Данные не определены",
          "approval_procedure_details": "Данные не определены",
          "expense_limit_status": "not_defined",
          "expense_limit_value": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Предусмотрено ли возмещение чрезвычайных расходов?
        2. Определены ли условия возмещения (согласие / последующее одобрение)?
        3. Определён ли порядок согласования / одобрения?
        4. Указан ли лимит расходов без согласования?
        5. Выведены ли условия из текста договора, а не из ст. 898 ГК РФ?
        6. Проверь, что все 6 ключей (5 полей + evidence) присутствуют в JSON.
        7. Если ничего нет — "not_defined" для сигнальных полей
          и "Данные не определены" для текстовых.
        8. Убедись, что ответ — валидный JSON, пригодный для json.loads().
        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "extraordinary_expenses_status": "<defined / not_defined>",
          "extraordinary_expenses_conditions": "<текст или 'Данные не определены'>",
          "approval_procedure_details": "<текст или 'Данные не определены'>",
          "expense_limit_status": "<defined / not_defined>",
          "expense_limit_value": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 8
      temperature: 0.0
      max_tokens: 700
    retrieval:
      retrieval_profile: "payment_terms_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "чрезвычайные расходы неотложные меры согласие поклажедателя одобрение поклажедателя последующее одобрение в интересах поклажедателя превышают обычные расходы лимит расходов без согласования ст. 898"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - procedures
        - obligations
      negative_keywords:
        - "вознаграждение"
        - "страхование"
        - "штраф"
        - "пеня"
        - "неустойка"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.25, 0.65]
        boost: 0.10
        scope: segment
      context_k: 8
      max_chunks: 10
      rerank: true
      enrichment_hints:
        preferred_segment_types:
          - "contract"
          - "amendment"
        excluded_segment_types:
          - "technical_specification"
          - "price_list"
        preferred_clause_functions:
          - "procedures"
          - "obligations"
        confidence_bonus_on_match: 0.06
        confidence_penalty_on_excluded_segment: 0.08
    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 500
    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 800

      compact_output: false

      presence_signal:
        field: "extraordinary_expenses_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из договора хранения сведения
        о чрезвычайных расходах на сохранность вещи: условия возмещения,
        порядок согласования и лимит расходов без согласования.
        Не анализируй иные темы.
        Не оценивай риски.
        Анализируй только текст договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. extraordinary_expenses_presence:
           Агрегатное signal-поле — наличие условий о чрезвычайных расходах.
           - "present" — если хотя бы одно из содержательных полей
             (extraordinary_expenses_status, expense_limit_status)
             ≠ "not_defined";
           - "missing" — если оба содержательных поля = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - extraordinary_expenses_status = "not_defined";
           - expense_limit_status = "not_defined";
           - extraordinary_expenses_conditions = "Данные не определены";
           - approval_procedure_details = "Данные не определены";
           - expense_limit_value = "Данные не определены";
           - не выполняй остальные шаги.

        1. extraordinary_expenses_status:
           - "defined" — если в тексте прямо указано возмещение чрезвычайных /
             неотложных расходов на сохранность вещи, либо прямо указано,
             что такие расходы не возмещаются (это тоже регулирование);
           - "not_defined" — если прямого указания нет.

        2. extraordinary_expenses_conditions:
           Краткая user-facing формулировка условий возмещения на русском языке
           («при согласии поклажедателя», «при последующем одобрении»,
            «если расходы произведены в интересах поклажедателя»).
           Fallback: "Данные не определены" / "Не удалось определить".

        3. approval_procedure_details:
           Краткая user-facing формулировка порядка согласования / одобрения
           (письменная форма, устное, электронная почта, заказным письмом).
           Fallback: "Данные не определены" / "Не удалось определить".

        4. expense_limit_status:
           - "defined" — если в тексте прямо указан лимит расходов, которые
             хранитель вправе понести без согласования;
           - "not_defined" — если прямого указания нет.

        5. expense_limit_value:
           Краткая user-facing формулировка значения лимита с единицей
           измерения («не более 50 000 руб.», «до 10% от стоимости вещи»).
           Fallback: "Данные не определены" / "Не удалось определить".

        Если данные отсутствуют в тексте:
        - сигнальные поля → "not_defined";
        - текстовые поля → "Данные не определены".

        Если данные есть, но противоречивы:
        - сигнальные поля → "not_defined";
        - текстовые поля → "Не удалось определить".
        </task>

        <context_rules>
        - Перед остальными полями заполни extraordinary_expenses_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined", все текстовые поля = "Данные не определены".
        - Используй только релевантные фрагменты контекста.
        - Не подставляй нормы закона, обычную практику или предположения вместо текста договора.
        - Не извлекай вознаграждение, страхование, штрафы, пени, неустойки
          и иные нерелевантные темы.
        - Не выводи условия из ст. 898 ГК РФ — только из текста.
        - extraordinary_expenses_status = "defined" — при прямом указании
          возмещения чрезвычайных / неотложных расходов, либо при прямом
          указании, что такие расходы не возмещаются.
        - expense_limit_status = "defined" — при прямом указании лимита
          расходов без согласования.
        - Если в разных фрагментах указаны противоречивые данные — верни
          "Не удалось определить" для текстовых полей, "not_defined" для сигнальных.
        - Не используй пустые строки.
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни возмещения чрезвычайных расходов, ни порядка
           согласования, ни лимита.
           → presence = "missing";
             все *_status = "not_defined";
             все текстовые поля = "Данные не определены".

        2. Возмещение указано, детали не раскрыты.
           Например: "Чрезвычайные расходы возмещаются Поклажедателем",
           без указания условий и порядка.
           → presence = "present";
             extraordinary_expenses_status = "defined";
             extraordinary_expenses_conditions = "Данные не определены";
             approval_procedure_details = "Данные не определены";
             expense_limit_status = "not_defined".

        3. Противоречие между фрагментами.
           В разных частях договора указаны разные условия возмещения
           или разные лимиты.
           → presence = "unclear";
             соответствующие *_status = "not_defined";
             соответствующие текстовые поля = "Не удалось определить".

        4. Прямое указание об отказе от возмещения.
           В договоре прямо указано, что чрезвычайные расходы хранителя
           не возмещаются и относятся на его счёт.
           → presence = "present";
             extraordinary_expenses_status = "defined" (прямое регулирование);
             extraordinary_expenses_conditions содержит дословную цитату
             об отказе от возмещения;
             expense_limit_status = "not_defined".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для extraordinary_expenses_presence используй только: "present", "missing", "unclear".
        - Для extraordinary_expenses_status и expense_limit_status используй только: "defined", "not_defined".
        - Fallback при отсутствии данных:
          * extraordinary_expenses_conditions, approval_procedure_details,
            expense_limit_value → "Данные не определены".
        - Fallback при противоречии или неоднозначности:
          * все текстовые поля → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "extraordinary_expenses_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие условий о возмещении чрезвычайных расходов. Внутреннее агрегатное signal-поле."
          required: true

        - name: "extraordinary_expenses_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Наличие условия о чрезвычайных расходах. Внутреннее enum-поле."
          label: "Чрезвычайные расходы"
          required: true
          display_in_grid: true
          display_priority: 1

        - name: "extraordinary_expenses_conditions"
          type: "string"
          presentation: "fact"
          label: "Условия возмещения"
          description: >
            Условия возмещения чрезвычайных расходов. Fallback: "Не установлено" / "Не удалось определить".
          required: true
          display_in_grid: true
          display_priority: 2

        - name: "approval_procedure_details"
          type: "string"
          presentation: "fact"
          label: "Порядок согласования"
          description: >
            Порядок согласования / одобрения чрезвычайных расходов. Fallback: "Не установлено" / "Не удалось определить".
          required: true
          display_in_grid: true
          display_priority: 3

        - name: "expense_limit_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          description: "Наличие лимита расходов без согласования. Внутреннее enum-поле."
          required: true

        - name: "expense_limit_value"
          type: "string"
          presentation: "fact"
          label: "Лимит без согласования"
          description: >
            Значение лимита расходов без согласования. Fallback: "Не установлено" / "Не удалось определить".
          required: true
          display_in_grid: true
          display_priority: 4

      store_payload: true

  - id: exclusions_from_liability
    name: "Обстоятельства, освобождающие от ответственности (п. 1 ст. 901 ГК РФ)"
    description: >
      Фактографическая проверка перечня обстоятельств, освобождающих хранителя
      от ответственности: непреодолимая сила, свойства вещи, о которых хранитель
      не знал и не должен был знать, умысел или грубая неосторожность
      поклажедателя. Правовой ориентир — п. 1 ст. 901 ГК РФ.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "непреодолимая сила"
        - "форс-мажор"
        - "свойства вещи"
        - "вина поклажедателя"
        - "умысел поклажедателя"
        - "грубая неосторожность поклажедателя"
        - "освобождается от ответственности"
        - "не несёт ответственности"
        - "ст. 901"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)освобожда(ется|ться|ют)\\s+от\\s+ответственност"
        - "(?i)не\\s+несёт\\s+ответственност"
        - "(?i)непреодолим(ая|ой)\\s+сил"
        - "(?i)свойств(а|ах)\\s+вещ"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор хранения (п. 1 ст. 901 ГК РФ).
        Проверяется один вопрос: перечень обстоятельств, освобождающих
        хранителя от ответственности за утрату, недостачу или повреждение вещи.
        Нормативные ориентиры:
        - п. 1 ст. 901 ГК РФ — хранитель отвечает за утрату, недостачу
          или повреждение вещи, если не докажет, что это произошло
          вследствие: (а) непреодолимой силы; (б) свойств вещи, о которых
          хранитель, принимая её на хранение, не знал и не должен был знать;
          (в) умысла или грубой неосторожности поклажедателя.
        Важно:
        - Твоя задача — не оценивать серьёзность риска.
        - Только установить, что прямо есть в тексте договора, а чего прямо нет.
        - Не выводи перечень из ст. 901 ГК РФ — фиксируй только то,
          что прямо написано в договоре.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Есть ли перечень обстоятельств, освобождающих от ответственности.
        2. Какие типы оснований перечислены (непреодолимая сила / свойства вещи /
          умысел поклажедателя / грубая неосторожность поклажедателя / иные).
        3. Формулировка оснований (с указанием конкретных обстоятельств).
        4. Открытый ли перечень (с оговоркой «иные обстоятельства»,
          «в том числе», «включая, но не ограничиваясь») или закрытый.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Для отсутствующих данных:
          - сигнальные поля (exclusions_status / open_list_status) →
            "not_defined";
          - текстовые поля (exclusions_types / exclusions_details) →
            "Данные не определены".
        3. Запрещено возвращать "None", "null", пустую строку "" или пропускать ключ.
        4. exclusions_status = "defined" — если прямо указан хотя бы один
          случай освобождения хранителя от ответственности.
        5. exclusions_types — перечисли через "; " все упомянутые типы
          из фиксированного словаря: force_majeure; item_properties;
          depositor_intent; depositor_gross_negligence; other.
          Пример: "force_majeure; item_properties".
          Если упоминание обобщённое — "other".
        6. exclusions_details — конкретная формулировка оснований из текста
          (с перечислением обстоятельств, если они названы).
        7. open_list_status = "yes" — если перечень прямо открытый
          («иные обстоятельства», «включая, но не ограничиваясь»,
          «в том числе»). "no" — если перечень прямо закрытый
          (исчерпывающий, только указанные основания).
        8. В evidence — только цитаты из документа, каждая с clause_ref.
        9. Верни ТОЛЬКО один валидный JSON-объект, пригодный для json.loads().
          Без markdown, без ```json, без комментариев, без текста до или после.

        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1 (полный, закрытый перечень):
        Фрагмент:
        "Хранитель освобождается от ответственности, если утрата, недостача
        или повреждение вещи произошли вследствие непреодолимой силы,
        свойств вещи, о которых Хранитель не знал и не должен был знать,
        либо умысла или грубой неосторожности Поклажедателя."
        Ответ:
        {
          "exclusions_status": "defined",
          "exclusions_types": "force_majeure; item_properties; depositor_intent; depositor_gross_negligence",
          "exclusions_details": "непреодолимая сила; свойства вещи, о которых хранитель не знал и не должен был знать; умысел или грубая неосторожность поклажедателя",
          "open_list_status": "no",
          "evidence": [
            {
              "clause_ref": "п. X.Y",
              "quote": "Хранитель освобождается от ответственности, если утрата, недостача или повреждение вещи произошли вследствие непреодолимой силы, свойств вещи, о которых Хранитель не знал и не должен был знать, либо умысла или грубой неосторожности Поклажедателя."
            }
          ]
        }

        Пример 2 (открытый перечень):
        Фрагмент:
        "Хранитель не несёт ответственности за утрату или повреждение вещи
        вследствие непреодолимой силы, а также иных обстоятельств,
        не зависящих от Хранителя."
        Ответ:
        {
          "exclusions_status": "defined",
          "exclusions_types": "force_majeure; other",
          "exclusions_details": "непреодолимая сила; иные обстоятельства, не зависящие от хранителя",
          "open_list_status": "yes",
          "evidence": [
            {
              "clause_ref": "п. X.Y",
              "quote": "Хранитель не несёт ответственности за утрату или повреждение вещи вследствие непреодолимой силы, а также иных обстоятельств, не зависящих от Хранителя."
            }
          ]
        }

        Пример 3 (только форс-мажор):
        Фрагмент:
        "Стороны освобождаются от ответственности при наступлении
        обстоятельств непреодолимой силы."
        Ответ:
        {
          "exclusions_status": "defined",
          "exclusions_types": "force_majeure",
          "exclusions_details": "обстоятельства непреодолимой силы",
          "open_list_status": "not_defined",
          "evidence": [
            {
              "clause_ref": "п. X.Y",
              "quote": "Стороны освобождаются от ответственности при наступлении обстоятельств непреодолимой силы."
            }
          ]
        }

        Пример 4 (ничего не указано):
        Фрагмент:
        "Хранитель принимает вещь Поклажедателя на хранение."
        Ответ:
        {
          "exclusions_status": "not_defined",
          "exclusions_types": "Данные не определены",
          "exclusions_details": "Данные не определены",
          "open_list_status": "not_defined",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Указан ли перечень обстоятельств, освобождающих от ответственности?
        2. Какие типы оснований перечислены (непреодолимая сила / свойства вещи /
          умысел / грубая неосторожность поклажедателя / иные)?
        3. Приведена ли конкретная формулировка оснований?
        4. Открытый ли перечень (с оговоркой «иные обстоятельства»)?
        5. Выведены ли основания из текста договора, а не из п. 1 ст. 901 ГК РФ?
        6. Проверь, что все 5 ключей (4 поля + evidence) присутствуют в JSON.
        7. Если ничего нет — "not_defined" для сигнальных полей
          и "Данные не определены" для текстовых.
        8. Убедись, что ответ — валидный JSON, пригодный для json.loads().
        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "exclusions_status": "<defined / not_defined>",
          "exclusions_types": "<текст или 'Данные не определены'>",
          "exclusions_details": "<текст или 'Данные не определены'>",
          "open_list_status": "<yes / no / not_defined>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 8
      temperature: 0.0
      max_tokens: 700
    retrieval:
      retrieval_profile: "force_majeure_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "непреодолимая сила форс-мажор свойства вещи о которых хранитель не знал умысел поклажедателя грубая неосторожность поклажедателя освобождается от ответственности не несёт ответственности иные обстоятельства ст. 901"
      preferred_unit_types:
        - liability_provision
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - limitations
        - remedies
      negative_keywords:
        - "вознаграждение"
        - "страхование"
        - "штраф"
        - "пеня"
        - "неустойка"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.45, 0.85]
        boost: 0.12
        scope: segment
      context_k: 8
      max_chunks: 10
      rerank: true
      enrichment_hints:
        preferred_segment_types:
          - "contract"
          - "amendment"
        excluded_segment_types:
          - "technical_specification"
          - "price_list"
        preferred_clause_functions:
          - "limitations"
          - "remedies"
        confidence_bonus_on_match: 0.08
        confidence_penalty_on_excluded_segment: 0.10
    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 500
    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 800

      compact_output: false

      presence_signal:
        field: "exclusions_from_liability_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из договора хранения сведения
        об обстоятельствах, освобождающих хранителя от ответственности:
        их типах, формулировке и открытости / закрытости перечня.
        Не анализируй иные темы.
        Не оценивай риски.
        Анализируй только текст договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. exclusions_from_liability_presence:
           Агрегатное signal-поле — наличие перечня обстоятельств,
           освобождающих от ответственности.
           - "present" — если хотя бы одно из содержательных полей
             (exclusions_status, open_list_status) ≠ "not_defined";
           - "missing" — если оба содержательных поля = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - exclusions_status = "not_defined";
           - open_list_status = "not_defined";
           - exclusions_types = "Данные не определены";
           - exclusions_details = "Данные не определены";
           - не выполняй остальные шаги.

        1. exclusions_status:
           - "defined" — если в тексте прямо указан хотя бы один случай
             освобождения хранителя от ответственности (непреодолимая сила,
             свойства вещи, умысел / грубая неосторожность поклажедателя,
             иные обстоятельства), либо прямо указано, что освобождения
             не применяются (это тоже регулирование);
           - "not_defined" — если прямого указания нет.

        2. exclusions_types:
           Краткая user-facing формулировка типов оснований через "; "
           из фиксированного словаря: "force_majeure; item_properties;
           depositor_intent; depositor_gross_negligence; other".
           Обобщённое упоминание без конкретного типа → "other".
           Fallback: "Данные не определены" / "Не удалось определить".

        3. exclusions_details:
           Краткая user-facing формулировка оснований из текста
           (с перечислением обстоятельств, если они названы).
           Fallback: "Данные не определены" / "Не удалось определить".

        4. open_list_status:
           - "yes" — перечень прямо открытый («иные обстоятельства»,
             «включая, но не ограничиваясь», «в том числе»);
           - "no" — перечень прямо закрытый (исчерпывающий);
           - "not_defined" — открытость / закрытость прямо не указана.

        Если данные отсутствуют в тексте:
        - сигнальные поля → "not_defined";
        - текстовые поля → "Данные не определены".

        Если данные есть, но противоречивы:
        - сигнальные поля → "not_defined";
        - текстовые поля → "Не удалось определить".
        </task>

        <context_rules>
        - Перед остальными полями заполни exclusions_from_liability_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined", все текстовые поля = "Данные не определены".
        - Используй только релевантные фрагменты контекста.
        - Не подставляй нормы закона, обычную практику или предположения вместо текста договора.
        - Не извлекай вознаграждение, страхование, штрафы, пени, неустойки
          и иные нерелевантные темы.
        - Не выводи перечень из п. 1 ст. 901 ГК РФ — только из текста.
        - exclusions_types — только из фиксированного словаря
          (force_majeure; item_properties; depositor_intent;
          depositor_gross_negligence; other), разделитель — "; ".
        - open_list_status = "yes" — при прямо открытом перечне;
          "no" — при прямо закрытом.
        - Если в разных фрагментах указаны противоречивые данные — верни
          "Не удалось определить" для текстовых полей, "not_defined" для сигнальных.
        - Не используй пустые строки.
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни одного обстоятельства, освобождающего
           от ответственности.
           → presence = "missing";
             все *_status = "not_defined";
             все текстовые поля = "Данные не определены".

        2. Перечень упомянут обобщённо, без конкретики.
           Например: "Стороны освобождаются от ответственности
           в установленных законом случаях", без перечисления.
           → presence = "present";
             exclusions_status = "defined";
             exclusions_types = "other";
             exclusions_details содержит пересказ формулировки;
             open_list_status = "not_defined".

        3. Противоречие между фрагментами.
           В разных частях договора указаны разные перечни оснований
           освобождения.
           → presence = "unclear";
             exclusions_status = "not_defined";
             exclusions_types = "Не удалось определить";
             exclusions_details = "Не удалось определить".

        4. Прямое указание на неприменение освобождений.
           В договоре прямо указано, что хранитель отвечает за сохранность
           вещи независимо от обстоятельств и освобождения
           не применяются.
           → presence = "present";
             exclusions_status = "defined" (прямое регулирование);
             exclusions_types = "other";
             exclusions_details содержит дословную цитату
             об отказе от освобождений;
             open_list_status = "no".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для exclusions_from_liability_presence используй только: "present", "missing", "unclear".
        - Для exclusions_status используй только: "defined", "not_defined".
        - Для open_list_status используй только: "yes", "no", "not_defined".
        - Fallback при отсутствии данных:
          * exclusions_types, exclusions_details → "Данные не определены".
        - Fallback при противоречии или неоднозначности:
          * exclusions_types, exclusions_details → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "exclusions_from_liability_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие перечня обстоятельств, освобождающих от ответственности. Внутреннее агрегатное signal-поле."
          required: true

        - name: "exclusions_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Наличие перечня обстоятельств, освобождающих от ответственности. Внутреннее enum-поле."
          label: "Освобождение от ответственности"
          required: true
          display_in_grid: true
          display_priority: 1

        - name: "exclusions_types"
          type: "string"
          presentation: "fact"
          label: "Типы оснований"
          description: >
            Типы оснований через '; ': force_majeure; item_properties; depositor_intent; depositor_gross_negligence; other. Fallback: "Не установлено" / "Не удалось определить".
          required: true
          display_in_grid: true
          display_priority: 2

        - name: "exclusions_details"
          type: "string"
          presentation: "fact"
          label: "Формулировка оснований"
          description: >
            Конкретная формулировка оснований освобождения из договора. Fallback: "Не установлено" / "Не удалось определить".
          required: true
          display_in_grid: true
          display_priority: 3

        - name: "open_list_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Открытый ли перечень оснований. Внутреннее enum-поле."
          label: "Перечень открытый"
          required: true
          display_in_grid: true
          display_priority: 4

      store_payload: true

  - id: third_party_claims
    name: "Требования третьих лиц к вещи (ст. 895 ГК РФ)"
    description: >
      Фактографическая проверка процедуры при предъявлении требований
      третьих лиц на вещь: обязанность хранителя уведомить поклажедателя,
      приостановление выдачи вещи до разрешения спора, форма и срок
      уведомления. Правовой ориентир — ст. 895 ГК РФ.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "требования третьих лиц"
        - "арест имущества"
        - "арест вещи"
        - "приостановление выдачи"
        - "приостановить возврат"
        - "уведомление поклажедателя"
        - "претензии третьих лиц"
        - "наложение ареста"
        - "ст. 895"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)требовани(я|й)\\s+третьих\\s+лиц"
        - "(?i)арест\\s+(имущества|вещ)"
        - "(?i)приостанов(ить|ление)\\s+(выдач|возврат)"
        - "(?i)(уведомить|известить)\\s+поклажедател"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор хранения (ст. 895 ГК РФ).
        Проверяется один вопрос: процедура при предъявлении требований
        третьих лиц на вещь.
        Нормативный ориентир:
        - ст. 895 ГК РФ — если третьи лица предъявили требования
          на вещь, переданную на хранение, хранитель обязан
          предупредить об этом поклажедателя и приостановить возврат
          вещи до разрешения спора.
        Важно:
        - Твоя задача — не оценивать серьёзность риска.
        - Только установить, что прямо есть в тексте договора, а чего прямо нет.
        - Не выводи процедуру из ст. 895 ГК РФ — фиксируй только то,
          что прямо написано в договоре.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Предусмотрена ли процедура при требованиях третьих лиц на вещь.
        2. Обязан ли хранитель уведомить поклажедателя о таких требованиях.
        3. Вправе / обязан ли хранитель приостановить выдачу вещи до разрешения спора.
        4. Форма, срок и порядок уведомления.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Для отсутствующих данных:
          - сигнальные поля (third_party_claims_status /
            notification_obligation_status / suspension_of_return_status) →
            "not_defined";
          - текстовое поле (third_party_claims_details) →
            "Данные не определены".
        3. Запрещено возвращать "None", "null", пустую строку "" или пропускать ключ.
        4. third_party_claims_status = "defined" — если прямо указана
          процедура при требованиях третьих лиц (претензии, арест,
          наложение обременений) на вещь.
        5. notification_obligation_status = "yes" — если прямо указана
          обязанность / право хранителя уведомить поклажедателя
          о требованиях третьих лиц.
        6. suspension_of_return_status = "yes" — если прямо указано
          приостановление возврата / выдачи вещи до разрешения спора.
        7. third_party_claims_details — форма, срок и порядок уведомления
          (письменно, электронно, в течение N дней).
        8. В evidence — только цитаты из документа, каждая с clause_ref.
        9. Верни ТОЛЬКО один валидный JSON-объект, пригодный для json.loads().
          Без markdown, без ```json, без комментариев, без текста до или после.

        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1 (полный):
        Фрагмент:
        "Если третьи лица предъявят требования на вещь, переданную
        на хранение, либо будет наложен арест на вещь, Хранитель обязан
        письменно уведомить Поклажедателя в течение 3 рабочих дней
        и приостановить выдачу вещи до разрешения спора."
        Ответ:
        {
          "third_party_claims_status": "defined",
          "notification_obligation_status": "yes",
          "suspension_of_return_status": "yes",
          "third_party_claims_details": "письменное уведомление в течение 3 рабочих дней; приостановление выдачи до разрешения спора",
          "evidence": [
            {
              "clause_ref": "п. X.Y",
              "quote": "Если третьи лица предъявят требования на вещь, переданную на хранение, либо будет наложен арест на вещь, Хранитель обязан письменно уведомить Поклажедателя в течение 3 рабочих дней и приостановить выдачу вещи до разрешения спора."
            }
          ]
        }

        Пример 2 (только уведомление, без приостановления):
        Фрагмент:
        "Хранитель обязан уведомить Поклажедателя о любых претензиях
        третьих лиц на хранимую вещь."
        Ответ:
        {
          "third_party_claims_status": "defined",
          "notification_obligation_status": "yes",
          "suspension_of_return_status": "not_defined",
          "third_party_claims_details": "уведомление поклажедателя о претензиях третьих лиц (форма и срок не указаны)",
          "evidence": [
            {
              "clause_ref": "п. X.Y",
              "quote": "Хранитель обязан уведомить Поклажедателя о любых претензиях третьих лиц на хранимую вещь."
            }
          ]
        }

        Пример 3 (только приостановление):
        Фрагмент:
        "При наложении ареста на вещь выдача вещи приостанавливается
        до снятия ареста."
        Ответ:
        {
          "third_party_claims_status": "defined",
          "notification_obligation_status": "not_defined",
          "suspension_of_return_status": "yes",
          "third_party_claims_details": "приостановление выдачи при аресте до снятия ареста",
          "evidence": [
            {
              "clause_ref": "п. X.Y",
              "quote": "При наложении ареста на вещь выдача вещи приостанавливается до снятия ареста."
            }
          ]
        }

        Пример 4 (ничего не указано):
        Фрагмент:
        "Хранитель хранит вещь Поклажедателя."
        Ответ:
        {
          "third_party_claims_status": "not_defined",
          "notification_obligation_status": "not_defined",
          "suspension_of_return_status": "not_defined",
          "third_party_claims_details": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Предусмотрена ли процедура при требованиях третьих лиц?
        2. Указана ли обязанность уведомить поклажедателя?
        3. Указано ли приостановление выдачи / возврата?
        4. Приведены ли форма, срок и порядок уведомления?
        5. Выведена ли процедура из текста договора, а не из ст. 895 ГК РФ?
        6. Проверь, что все 5 ключей (4 поля + evidence) присутствуют в JSON.
        7. Если ничего нет — "not_defined" для сигнальных полей
          и "Данные не определены" для текстового.
        8. Убедись, что ответ — валидный JSON, пригодный для json.loads().
        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "third_party_claims_status": "<defined / not_defined>",
          "notification_obligation_status": "<yes / no / not_defined>",
          "suspension_of_return_status": "<yes / no / not_defined>",
          "third_party_claims_details": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 8
      temperature: 0.0
      max_tokens: 650
    retrieval:
      retrieval_profile: "title_transfer_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "требования третьих лиц арест имущества арест вещи наложение ареста претензии третьих лиц приостановление выдачи приостановить возврат уведомление поклажедателя известить поклажедателя до разрешения спора ст. 895"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - procedures
        - remedies
      negative_keywords:
        - "вознаграждение"
        - "страхование"
        - "штраф"
        - "пеня"
        - "неустойка"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.40, 0.85]
        boost: 0.10
        scope: segment
      context_k: 8
      max_chunks: 10
      rerank: true
      enrichment_hints:
        preferred_segment_types:
          - "contract"
          - "amendment"
        excluded_segment_types:
          - "technical_specification"
          - "price_list"
        preferred_clause_functions:
          - "procedures"
          - "remedies"
        confidence_bonus_on_match: 0.08
        confidence_penalty_on_excluded_segment: 0.10
    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 500
    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 750

      compact_output: false

      presence_signal:
        field: "third_party_claims_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из договора хранения сведения
        о процедуре при предъявлении требований третьих лиц на вещь:
        уведомление поклажедателя, приостановление выдачи, форма и срок.
        Не анализируй иные темы.
        Не оценивай риски.
        Анализируй только текст договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. third_party_claims_presence:
           Агрегатное signal-поле — наличие процедуры при требованиях
           третьих лиц на вещь.
           - "present" — если хотя бы одно из содержательных полей
             (third_party_claims_status, notification_obligation_status,
              suspension_of_return_status) ≠ "not_defined";
           - "missing" — если все три содержательных поля = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - third_party_claims_status = "not_defined";
           - notification_obligation_status = "not_defined";
           - suspension_of_return_status = "not_defined";
           - third_party_claims_details = "Данные не определены";
           - не выполняй остальные шаги.

        1. third_party_claims_status:
           - "defined" — если в тексте прямо указана процедура при
             требованиях третьих лиц (претензии, арест, наложение
             обременений), либо прямо указано, что такая процедура
             не применяется (это тоже регулирование);
           - "not_defined" — если прямого указания нет.

        2. notification_obligation_status:
           - "yes" — прямо указана обязанность / право хранителя
             уведомить поклажедателя о требованиях третьих лиц;
           - "no" — прямо указано, что уведомление не производится;
           - "not_defined" — прямо не указано.

        3. suspension_of_return_status:
           - "yes" — прямо указано приостановление возврата / выдачи
             вещи до разрешения спора;
           - "no" — прямо указано, что выдача не приостанавливается;
           - "not_defined" — прямо не указано.

        4. third_party_claims_details:
           Краткая user-facing формулировка формы, срока и порядка
           уведомления (письменно, электронно, в течение N дней).
           Fallback: "Данные не определены" / "Не удалось определить".

        Если данные отсутствуют в тексте:
        - сигнальные поля → "not_defined";
        - текстовое поле → "Данные не определены".

        Если данные есть, но противоречивы:
        - сигнальные поля → "not_defined";
        - текстовое поле → "Не удалось определить".
        </task>

        <context_rules>
        - Перед остальными полями заполни third_party_claims_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined", third_party_claims_details = "Данные не определены".
        - Используй только релевантные фрагменты контекста.
        - Не подставляй нормы закона, обычную практику или предположения вместо текста договора.
        - Не извлекай вознаграждение, страхование, штрафы, пени, неустойки
          и иные нерелевантные темы.
        - Не выводи процедуру из ст. 895 ГК РФ — только из текста.
        - notification_obligation_status = "yes" — при прямом указании
          обязанности / права уведомить; "no" — при прямом указании, что
          уведомление не производится.
        - suspension_of_return_status = "yes" — при прямом указании
          приостановления выдачи; "no" — при прямом указании, что выдача
          не приостанавливается.
        - Если в разных фрагментах указаны противоречивые данные — верни
          "Не удалось определить" для текстового поля, "not_defined" для сигнальных.
        - Не используй пустые строки.
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни процедуры при требованиях третьих лиц,
           ни уведомления, ни приостановления выдачи.
           → presence = "missing";
             все *_status = "not_defined";
             third_party_claims_details = "Данные не определены".

        2. Процедура упомянута без деталей.
           Например: "Хранитель обязан уведомить Поклажедателя
           о претензиях третьих лиц", без указания формы и срока.
           → presence = "present";
             third_party_claims_status = "defined";
             notification_obligation_status = "yes";
             suspension_of_return_status = "not_defined";
             third_party_claims_details содержит дословную формулировку.

        3. Противоречие между фрагментами.
           В разных частях договора указаны разные порядки уведомления
           или разные условия приостановления.
           → presence = "unclear";
             соответствующие *_status = "not_defined";
             third_party_claims_details = "Не удалось определить".

        4. Прямое указание об отсутствии уведомления / приостановления.
           В договоре прямо указано, что хранитель не уведомляет
           поклажедателя о требованиях третьих лиц и выдача вещи
           не приостанавливается.
           → presence = "present";
             third_party_claims_status = "defined" (прямое регулирование);
             notification_obligation_status = "no";
             suspension_of_return_status = "no";
             third_party_claims_details содержит дословную цитату.
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для third_party_claims_presence используй только: "present", "missing", "unclear".
        - Для third_party_claims_status используй только: "defined", "not_defined".
        - Для notification_obligation_status и suspension_of_return_status используй только: "yes", "no", "not_defined".
        - Fallback при отсутствии данных:
          * third_party_claims_details → "Данные не определены".
        - Fallback при противоречии или неоднозначности:
          * third_party_claims_details → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "third_party_claims_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие процедуры при требованиях третьих лиц. Внутреннее агрегатное signal-поле."
          required: true

        - name: "third_party_claims_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Наличие процедуры при требованиях третьих лиц. Внутреннее enum-поле."
          label: "Требования третьих лиц"
          required: true
          display_in_grid: true
          display_priority: 1

        - name: "notification_obligation_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Обязанность уведомить поклажедателя. Внутреннее enum-поле."
          label: "Уведомление поклажедателя"
          required: true
          display_in_grid: true
          display_priority: 2

        - name: "suspension_of_return_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Приостановление выдачи вещи. Внутреннее enum-поле."
          label: "Приостановление выдачи"
          required: true
          display_in_grid: true
          display_priority: 3

        - name: "third_party_claims_details"
          type: "string"
          presentation: "fact"
          label: "Порядок уведомления"
          description: >
            Форма, срок и порядок уведомления поклажедателя. Fallback: "Не установлено" / "Не удалось определить".
          required: true
          display_in_grid: true
          display_priority: 4

      store_payload: true

  - id: insurance
    name: "Страхование хранимой вещи"
    description: >
      Фактографическая проверка условий страхования хранимой вещи: наличие
      обязательства застраховать, кто является страхователем (хранитель /
      поклажедатель), размер страховой суммы, выгодоприобретатель, страховые
      риски и период. Правовой ориентир — гл. 48 ГК РФ (общие нормы
      о страховании); специальной нормы в гл. 47 ГК РФ нет.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "medium"
    severity_if_pass: "pass"
    severity_if_fail: "medium"
    severity_if_unclear: "low"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "страхование"
        - "страховой полис"
        - "застраховать"
        - "страховая сумма"
        - "страховщик"
        - "выгодоприобретатель"
        - "страховые риски"
        - "страховой случай"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)страхован(ие|ия|ию)"
        - "(?i)застрахова(ть|нн)"
        - "(?i)страхов(ая|ой)\\s+сумм"
        - "(?i)(выгодоприобретател|страховщик)"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор хранения.
        Проверяется один вопрос: страхование хранимой вещи — обязанность
        застраховать, страхователь, страховая сумма, выгодоприобретатель,
        риски и период.
        Нормативный ориентир:
        - гл. 48 ГК РФ — общие нормы о страховании; специальной нормы
          о страховании вещи в гл. 47 ГК РФ нет — условие является
          договорным и определяется по соглашению сторон.
        Важно:
        - Твоя задача — не оценивать серьёзность риска.
        - Только установить, что прямо есть в тексте договора, а чего прямо нет.
        - Не выводи условия из гл. 48 ГК РФ — фиксируй только то, что прямо
          написано в договоре.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Предусмотрено ли страхование хранимой вещи.
        2. Кто обязан застраховать (хранитель / поклажедатель / оба).
        3. Размер страховой суммы.
        4. Кто является выгодоприобретателем.
        5. Конкретные детали: страховые риски, страховщик, период страхования.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Для отсутствующих данных:
          - сигнальные поля (insurance_status / insurance_obligation_party /
            insurance_amount_status / insurance_beneficiary) → "not_defined";
          - текстовые поля (insurance_amount_value / insurance_details) →
            "Данные не определены".
        3. Запрещено возвращать "None", "null", пустую строку "" или пропускать ключ.
        4. insurance_status = "defined" — если прямо предусмотрено страхование
          вещи в любой формулировке.
        5. insurance_obligation_party = "custodian" — если обязательство
          застраховать возложено на хранителя; "depositor" — на поклажедателя;
          "both" — на обе стороны (например, каждая страхует свой интерес).
        6. insurance_amount_value — фиксируй с единицей измерения
          («на сумму 1 000 000 руб.», «в размере заявленной стоимости»,
          «не менее стоимости вещи»). Не голое число.
        7. insurance_beneficiary — "custodian" / "depositor" / "both" /
          "not_defined". Фиксируй по прямому указанию в тексте.
        8. insurance_details — риски (утрата / повреждение / недостача),
          страховщик, период страхования и иные детали.
        9. В evidence — только цитаты из документа, каждая с clause_ref.
        10. Верни ТОЛЬКО один валидный JSON-объект, пригодный для json.loads().
            Без markdown, без ```json, без комментариев, без текста до или после.

        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1 (полный):
        Фрагмент:
        "Хранитель обязан застраховать вещь на сумму не менее её заявленной
        стоимости от рисков утраты, недостачи и повреждения. Выгодоприобретателем
        по договору страхования является Поклажедатель. Страхование действует
        в течение всего срока хранения."
        Ответ:
        {
          "insurance_status": "defined",
          "insurance_obligation_party": "custodian",
          "insurance_amount_status": "defined",
          "insurance_amount_value": "не менее заявленной стоимости вещи",
          "insurance_beneficiary": "depositor",
          "insurance_details": "риски утраты, недостачи и повреждения; период — весь срок хранения",
          "evidence": [
            {
              "clause_ref": "п. X.Y",
              "quote": "Хранитель обязан застраховать вещь на сумму не менее её заявленной стоимости от рисков утраты, недостачи и повреждения."
            }
          ]
        }

        Пример 2 (страхование поклажедателем):
        Фрагмент:
        "Поклажедатель вправе застраховать передаваемую на хранение вещь
        за свой счёт."
        Ответ:
        {
          "insurance_status": "defined",
          "insurance_obligation_party": "depositor",
          "insurance_amount_status": "not_defined",
          "insurance_amount_value": "Данные не определены",
          "insurance_beneficiary": "not_defined",
          "insurance_details": "страхование за счёт Поклажедателя",
          "evidence": [
            {
              "clause_ref": "п. X.Y",
              "quote": "Поклажедатель вправе застраховать передаваемую на хранение вещь за свой счёт."
            }
          ]
        }

        Пример 3 (только упоминание страхования):
        Фрагмент:
        "Вещь передаётся на хранение в застрахованном виде."
        Ответ:
        {
          "insurance_status": "defined",
          "insurance_obligation_party": "not_defined",
          "insurance_amount_status": "not_defined",
          "insurance_amount_value": "Данные не определены",
          "insurance_beneficiary": "not_defined",
          "insurance_details": "вещь передаётся в застрахованном виде",
          "evidence": [
            {
              "clause_ref": "п. X.Y",
              "quote": "Вещь передаётся на хранение в застрахованном виде."
            }
          ]
        }

        Пример 4 (ничего не указано):
        Фрагмент:
        "Хранитель хранит вещь Поклажедателя."
        Ответ:
        {
          "insurance_status": "not_defined",
          "insurance_obligation_party": "not_defined",
          "insurance_amount_status": "not_defined",
          "insurance_amount_value": "Данные не определены",
          "insurance_beneficiary": "not_defined",
          "insurance_details": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Предусмотрено ли страхование вещи?
        2. Кто обязан застраховать (хранитель / поклажедатель / оба)?
        3. Указан ли размер страховой суммы?
        4. Определён ли выгодоприобретатель?
        5. Приведены ли детали (риски, страховщик, период)?
        6. Выведены ли условия из текста договора, а не из гл. 48 ГК РФ?
        7. Проверь, что все 7 ключей (6 полей + evidence) присутствуют в JSON.
        8. Если ничего нет — "not_defined" для сигнальных полей
          и "Данные не определены" для текстовых.
        9. Убедись, что ответ — валидный JSON, пригодный для json.loads().
        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "insurance_status": "<defined / not_defined>",
          "insurance_obligation_party": "<custodian / depositor / both / not_defined>",
          "insurance_amount_status": "<defined / not_defined>",
          "insurance_amount_value": "<текст или 'Данные не определены'>",
          "insurance_beneficiary": "<custodian / depositor / both / not_defined>",
          "insurance_details": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 8
      temperature: 0.0
      max_tokens: 700
    retrieval:
      retrieval_profile: "insurance_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "страхование страховой полис застраховать страховая сумма страховщик выгодоприобретатель страховые риски страховой случай период страхования хранимая вещь"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - procedures
      negative_keywords:
        - "вознаграждение"
        - "штраф"
        - "пеня"
        - "неустойка"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.35, 0.75]
        boost: 0.10
        scope: segment
      context_k: 8
      max_chunks: 10
      rerank: true
      enrichment_hints:
        preferred_segment_types:
          - "contract"
          - "amendment"
        excluded_segment_types:
          - "technical_specification"
          - "price_list"
        preferred_clause_functions:
          - "obligations"
          - "procedures"
        confidence_bonus_on_match: 0.06
        confidence_penalty_on_excluded_segment: 0.08
    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 500
    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 850

      compact_output: false

      presence_signal:
        field: "insurance_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из договора хранения сведения
        о страховании вещи: наличие, страхователь, сумма, выгодоприобретатель
        и детали.
        Не анализируй иные темы.
        Не оценивай риски.
        Анализируй только текст договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. insurance_presence:
           Агрегатное signal-поле — наличие условий страхования вещи.
           - "present" — если хотя бы одно из содержательных полей
             (insurance_status, insurance_obligation_party,
              insurance_amount_status, insurance_beneficiary)
             ≠ "not_defined";
           - "missing" — если все четыре содержательных поля = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - insurance_status = "not_defined";
           - insurance_obligation_party = "not_defined";
           - insurance_amount_status = "not_defined";
           - insurance_beneficiary = "not_defined";
           - insurance_amount_value = "Данные не определены";
           - insurance_details = "Данные не определены";
           - не выполняй остальные шаги.

        1. insurance_status:
           - "defined" — если в тексте прямо предусмотрено страхование
             вещи в любой формулировке, либо прямо указано, что вещь
             не страхуется (это тоже регулирование);
           - "not_defined" — если прямого указания нет.

        2. insurance_obligation_party:
           - "custodian" — прямо указано, что страхование осуществляет
             хранитель;
           - "depositor" — прямо указано, что страхование осуществляет
             поклажедатель;
           - "both" — прямо указано, что каждая сторона страхует свой интерес
             или обе стороны участвуют в страховании;
           - "not_defined" — прямо не указано.

        3. insurance_amount_status:
           - "defined" — если в тексте прямо указана страховая сумма
             (числом, через заявленную стоимость, через формулу);
           - "not_defined" — если прямого указания нет.

        4. insurance_amount_value:
           Краткая user-facing формулировка страховой суммы с единицей
           измерения («на сумму 1 000 000 руб.», «не менее стоимости вещи»,
            «в размере заявленной стоимости»).
           Fallback: "Данные не определены" / "Не удалось определить".

        5. insurance_beneficiary:
           - "custodian" / "depositor" / "both" — прямо указан
             выгодоприобретатель;
           - "not_defined" — прямо не указан.

        6. insurance_details:
           Краткая user-facing формулировка деталей страхования: риски
           (утрата / повреждение / недостача), страховщик, период страхования.
           Fallback: "Данные не определены" / "Не удалось определить".

        Если данные отсутствуют в тексте:
        - сигнальные поля → "not_defined";
        - текстовые поля → "Данные не определены".

        Если данные есть, но противоречивы:
        - сигнальные поля → "not_defined";
        - текстовые поля → "Не удалось определить".
        </task>

        <context_rules>
        - Перед остальными полями заполни insurance_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status / *_party / *_beneficiary = "not_defined", все текстовые поля = "Данные не определены".
        - Используй только релевантные фрагменты контекста.
        - Не подставляй нормы закона, обычную практику или предположения вместо текста договора.
        - Не извлекай вознаграждение, штрафы, пени, неустойки
          и иные нерелевантные темы.
        - Не выводи условия из гл. 48 ГК РФ — только из текста.
        - insurance_obligation_party = "custodian" / "depositor" / "both" —
          по прямому указанию в тексте.
        - insurance_amount_value — всегда с единицей измерения.
        - insurance_beneficiary — по прямому указанию.
        - Если в разных фрагментах указаны противоречивые данные — верни
          "Не удалось определить" для текстовых полей, "not_defined" для сигнальных.
        - Не используй пустые строки.
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни страхования, ни страховой суммы,
           ни выгодоприобретателя, ни деталей.
           → presence = "missing";
             все сигнальные поля = "not_defined";
             все текстовые поля = "Данные не определены".

        2. Страхование упомянуто без деталей.
           Например: "Вещь передаётся на хранение в застрахованном виде",
           без указания страхователя и суммы.
           → presence = "present";
             insurance_status = "defined";
             insurance_obligation_party = "not_defined";
             insurance_amount_status = "not_defined";
             insurance_beneficiary = "not_defined";
             insurance_details содержит дословную формулировку.

        3. Противоречие между фрагментами.
           В разных частях договора указаны разные страховые суммы
           или разные страхователи.
           → presence = "unclear";
             соответствующие сигнальные поля = "not_defined";
             соответствующие текстовые поля = "Не удалось определить".

        4. Прямое указание на отсутствие страхования.
           В договоре прямо указано, что вещь не страхуется и расходы
           на страхование не возмещаются.
           → presence = "present";
             insurance_status = "defined" (прямое регулирование);
             insurance_details содержит дословную цитату
             об отсутствии страхования;
             остальные содержательные поля = "not_defined".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для insurance_presence используй только: "present", "missing", "unclear".
        - Для insurance_status и insurance_amount_status используй только: "defined", "not_defined".
        - Для insurance_obligation_party и insurance_beneficiary используй только: "custodian", "depositor", "both", "not_defined".
        - Fallback при отсутствии данных:
          * insurance_amount_value, insurance_details → "Данные не определены".
        - Fallback при противоречии или неоднозначности:
          * insurance_amount_value, insurance_details → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "insurance_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие условий страхования хранимой вещи. Внутреннее агрегатное signal-поле."
          required: true

        - name: "insurance_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Наличие условия о страховании. Внутреннее enum-поле."
          label: "Страхование"
          required: true
          display_in_grid: true
          display_priority: 1

        - name: "insurance_obligation_party"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["custodian", "depositor", "both", "not_defined"]
          description: "Сторона, обязанная застраховать вещь. Внутреннее enum-поле."
          label: "Страхователь"
          required: true
          display_in_grid: true
          display_priority: 2

        - name: "insurance_amount_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          description: "Наличие условия о страховой сумме. Внутреннее enum-поле."
          required: true

        - name: "insurance_amount_value"
          type: "string"
          presentation: "fact"
          label: "Страховая сумма"
          description: >
            Размер страховой суммы. Fallback: "Не установлено" / "Не удалось определить".
          required: true
          display_in_grid: true
          display_priority: 3

        - name: "insurance_beneficiary"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["custodian", "depositor", "both", "not_defined"]
          description: "Выгодоприобретатель по договору страхования. Внутреннее enum-поле."
          label: "Выгодоприобретатель"
          required: true
          display_in_grid: true
          display_priority: 4

        - name: "insurance_details"
          type: "string"
          presentation: "fact"
          label: "Детали страхования"
          description: >
            Риски, страховщик, период и иные детали. Fallback: "Не установлено" / "Не удалось определить".
          required: true
          display_in_grid: true
          display_priority: 5

      store_payload: true

  - id: pretension_order
    name: "Претензионный порядок урегулирования споров"
    description: >
      Фактографическая проверка условия об обязательном претензионном
      (досудебном) порядке: наличие, срок, форма и порядок направления
      претензии. Правовые ориентиры — ч. 5 ст. 4 АПК РФ (для споров
      между организациями / ИП), п. 4 ст. 3 ГПК РФ (для споров с участием
      граждан); при наличии договорного условия применяется согласованный
      сторонами срок.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "medium"
    severity_if_pass: "pass"
    severity_if_fail: "medium"
    severity_if_unclear: "low"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "претензионный порядок"
        - "претензия"
        - "досудебный порядок"
        - "претензионный срок"
        - "до обращения в суд"
        - "письменная претензия"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)претенз(ия|ионн)"
        - "(?i)досудебн(ый|ого)\\s+поряд"
        - "(?i)до\\s+обращени(я|е)\\s+в\\s+суд"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор хранения.
        Проверяется один вопрос: претензионный (досудебный) порядок
        урегулирования споров — наличие, срок, форма и порядок направления.
        Нормативные ориентиры:
        - ч. 5 ст. 4 АПК РФ — для споров между организациями / ИП
          претензионный порядок обязателен, если не установлен иной срок —
          30 календарных дней со дня направления претензии;
        - п. 4 ст. 3 ГПК РФ — для споров с участием граждан суд оставляет
          иск без рассмотрения при несоблюдении досудебного порядка,
          установленного договором;
        - стороны вправе предусмотреть в договоре свой срок и порядок.
        Важно:
        - Твоя задача — не оценивать серьёзность риска.
        - Только установить, что прямо есть в тексте договора, а чего прямо нет.
        - Не выводи порядок из ч. 5 ст. 4 АПК РФ / п. 4 ст. 3 ГПК РФ —
          фиксируй только то, что прямо написано в договоре.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Установлен ли претензионный (досудебный) порядок.
        2. Срок претензионного порядка (календарных / рабочих дней).
        3. Форма и порядок направления претензии (письменная, адресат,
          способ направления).

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Для отсутствующих данных:
          - сигнальные поля (pretension_status / pretension_period_status) →
            "not_defined";
          - текстовые поля (pretension_period_value / pretension_details) →
            "Данные не определены".
        3. Запрещено возвращать "None", "null", пустую строку "" или пропускать ключ.
        4. pretension_status = "defined" — если прямо установлен претензионный
          / досудебный порядок (обязанность направить претензию до обращения
          в суд, срок на ответ, порядок урегулирования).
        5. pretension_period_status = "defined" — если прямо указан срок
          претензионного порядка. pretension_period_value — конкретное
          значение с единицей («30 календарных дней», «10 рабочих дней»),
          не голое число.
        6. pretension_details — форма претензии (письменная / email),
          адресат (какой орган / должностное лицо), способ направления
          (заказным письмом, курьером, по электронной почте), порядок ответа.
        7. В evidence — только цитаты из документа, каждая с clause_ref.
        8. Верни ТОЛЬКО один валидный JSON-объект, пригодный для json.loads().
          Без markdown, без ```json, без комментариев, без текста до или после.

        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1 (полный):
        Фрагмент:
        "Стороны устанавливают обязательный претензионный порядок.
        Претензия направляется заказным письмом с уведомлением
        на юридический адрес стороны. Срок ответа на претензию —
        15 рабочих дней с даты её получения."
        Ответ:
        {
          "pretension_status": "defined",
          "pretension_period_status": "defined",
          "pretension_period_value": "15 рабочих дней с даты получения претензии",
          "pretension_details": "претензия направляется заказным письмом с уведомлением на юридический адрес стороны; срок ответа — 15 рабочих дней",
          "evidence": [
            {
              "clause_ref": "п. X.Y",
              "quote": "Стороны устанавливают обязательный претензионный порядок."
            }
          ]
        }

        Пример 2 (без срока):
        Фрагмент:
        "До обращения в суд сторона обязана направить письменную претензию
        другой стороне."
        Ответ:
        {
          "pretension_status": "defined",
          "pretension_period_status": "not_defined",
          "pretension_period_value": "Данные не определены",
          "pretension_details": "письменная претензия до обращения в суд; адресат и способ направления не указаны",
          "evidence": [
            {
              "clause_ref": "п. X.Y",
              "quote": "До обращения в суд сторона обязана направить письменную претензию другой стороне."
            }
          ]
        }

        Пример 3 (только упоминание):
        Фрагмент:
        "Все споры разрешаются с соблюдением претензионного порядка."
        Ответ:
        {
          "pretension_status": "defined",
          "pretension_period_status": "not_defined",
          "pretension_period_value": "Данные не определены",
          "pretension_details": "соблюдение претензионного порядка (без деталей)",
          "evidence": [
            {
              "clause_ref": "п. X.Y",
              "quote": "Все споры разрешаются с соблюдением претензионного порядка."
            }
          ]
        }

        Пример 4 (ничего не указано):
        Фрагмент:
        "Споры разрешаются в соответствии с законодательством РФ."
        Ответ:
        {
          "pretension_status": "not_defined",
          "pretension_period_status": "not_defined",
          "pretension_period_value": "Данные не определены",
          "pretension_details": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Установлен ли претензионный / досудебный порядок?
        2. Указан ли срок претензионного порядка?
        3. Приведены ли форма, адресат и способ направления претензии?
        4. Выведен ли порядок из текста договора, а не из ч. 5 ст. 4 АПК РФ
          / п. 4 ст. 3 ГПК РФ?
        5. Проверь, что все 5 ключей (4 поля + evidence) присутствуют в JSON.
        6. Если ничего нет — "not_defined" для сигнальных полей
          и "Данные не определены" для текстовых.
        7. Убедись, что ответ — валидный JSON, пригодный для json.loads().
        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "pretension_status": "<defined / not_defined>",
          "pretension_period_status": "<defined / not_defined>",
          "pretension_period_value": "<текст или 'Данные не определены'>",
          "pretension_details": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 650
    retrieval:
      retrieval_profile: "dispute_resolution_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "претензионный порядок претензия досудебный порядок претензионный срок ответ на претензию до обращения в суд письменная претензия заказное письмо урегулирование споров"
      preferred_unit_types:
        - dispute_resolution
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - boilerplate
        - procedures
      negative_keywords:
        - "вознаграждение"
        - "страхование"
        - "штраф"
        - "пеня"
        - "неустойка"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.60, 1.0]
        boost: 0.15
        scope: segment
      context_k: 6
      max_chunks: 8
      rerank: true
      enrichment_hints:
        preferred_segment_types:
          - "contract"
          - "amendment"
        excluded_segment_types:
          - "technical_specification"
          - "price_list"
        preferred_clause_functions:
          - "boilerplate"
          - "procedures"
        confidence_bonus_on_match: 0.06
        confidence_penalty_on_excluded_segment: 0.08
    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 500
    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 700

      compact_output: false

      presence_signal:
        field: "pretension_order_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из договора хранения сведения
        о претензионном (досудебном) порядке: наличие, срок, форма
        и порядок направления претензии.
        Не анализируй иные темы.
        Не оценивай риски.
        Анализируй только текст договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. pretension_order_presence:
           Агрегатное signal-поле — наличие претензионного (досудебного) порядка.
           - "present" — если хотя бы одно из содержательных полей
             (pretension_status, pretension_period_status) ≠ "not_defined";
           - "missing" — если оба содержательных поля = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - pretension_status = "not_defined";
           - pretension_period_status = "not_defined";
           - pretension_period_value = "Данные не определены";
           - pretension_details = "Данные не определены";
           - не выполняй остальные шаги.

        1. pretension_status:
           - "defined" — если в тексте прямо установлен претензионный /
             досудебный порядок (обязанность направить претензию до обращения
             в суд, срок ответа, порядок урегулирования), либо прямо указано,
             что претензионный порядок не применяется (это тоже регулирование);
           - "not_defined" — если прямого указания нет.

        2. pretension_period_status:
           - "defined" — если в тексте прямо указан срок претензионного
             порядка (календарных / рабочих дней);
           - "not_defined" — если прямого указания нет.

        3. pretension_period_value:
           Краткая user-facing формулировка срока с единицей измерения
           («30 календарных дней», «10 рабочих дней с даты направления»).
           Fallback: "Данные не определены" / "Не удалось определить".

        4. pretension_details:
           Краткая user-facing формулировка формы, адресата и способа
           направления претензии (письменная / email, заказным письмом,
           курьером, порядок ответа).
           Fallback: "Данные не определены" / "Не удалось определить".

        Если данные отсутствуют в тексте:
        - сигнальные поля → "not_defined";
        - текстовые поля → "Данные не определены".

        Если данные есть, но противоречивы:
        - сигнальные поля → "not_defined";
        - текстовые поля → "Не удалось определить".
        </task>

        <context_rules>
        - Перед остальными полями заполни pretension_order_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined", все текстовые поля = "Данные не определены".
        - Используй только релевантные фрагменты контекста.
        - Не подставляй нормы закона, обычную практику или предположения вместо текста договора.
        - Не извлекай вознаграждение, страхование, штрафы, пени, неустойки
          и иные нерелевантные темы.
        - Не выводи порядок из ч. 5 ст. 4 АПК РФ / п. 4 ст. 3 ГПК РФ —
          только из текста.
        - pretension_status = "defined" — при прямом указании претензионного
          / досудебного порядка, либо при прямом указании, что такой порядок
          не применяется.
        - pretension_period_status = "defined" — при прямом указании срока.
        - pretension_period_value — всегда с единицей измерения.
        - Если в разных фрагментах указаны противоречивые данные — верни
          "Не удалось определить" для текстовых полей, "not_defined" для сигнальных.
        - Не используй пустые строки.
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни претензионного порядка, ни срока, ни порядка
           направления претензии.
           → presence = "missing";
             все *_status = "not_defined";
             все текстовые поля = "Данные не определены".

        2. Претензионный порядок упомянут без деталей.
           Например: "Все споры разрешаются с соблюдением претензионного
           порядка", без указания срока и формы.
           → presence = "present";
             pretension_status = "defined";
             pretension_period_status = "not_defined";
             pretension_period_value = "Данные не определены";
             pretension_details содержит дословную формулировку.

        3. Противоречие между фрагментами.
           В разных частях договора указаны разные сроки претензионного
           порядка.
           → presence = "unclear";
             pretension_status = "not_defined";
             pretension_period_status = "not_defined";
             pretension_period_value = "Не удалось определить";
             pretension_details = "Не удалось определить".

        4. Прямое указание на неприменение претензионного порядка.
           В договоре прямо указано, что претензионный порядок
           не применяется и споры разрешаются непосредственно в суде.
           → presence = "present";
             pretension_status = "defined" (прямое регулирование);
             pretension_period_status = "not_defined";
             pretension_details содержит дословную цитату
             о неприменении претензионного порядка.
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для pretension_order_presence используй только: "present", "missing", "unclear".
        - Для pretension_status и pretension_period_status используй только: "defined", "not_defined".
        - Fallback при отсутствии данных:
          * pretension_period_value, pretension_details → "Данные не определены".
        - Fallback при противоречии или неоднозначности:
          * pretension_period_value, pretension_details → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "pretension_order_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие претензионного (досудебного) порядка. Внутреннее агрегатное signal-поле."
          required: true

        - name: "pretension_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Наличие претензионного порядка. Внутреннее enum-поле."
          label: "Претензионный порядок"
          required: true
          display_in_grid: true
          display_priority: 1

        - name: "pretension_period_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          description: "Наличие срока претензионного порядка. Внутреннее enum-поле."
          required: true

        - name: "pretension_period_value"
          type: "string"
          presentation: "fact"
          label: "Срок претензии"
          description: >
            Срок претензионного порядка. Fallback: "Не установлено" / "Не удалось определить".
          required: true
          display_in_grid: true
          display_priority: 2

        - name: "pretension_details"
          type: "string"
          presentation: "fact"
          label: "Порядок направления"
          description: >
            Форма, адресат и способ направления претензии. Fallback: "Не установлено" / "Не удалось определить".
          required: true
          display_in_grid: true
          display_priority: 3

      store_payload: true

  - id: vat_and_tax
    name: "НДС и налоговые оговорки по вознаграждению хранителя"
    description: >
      Фактографическая проверка режима НДС и налоговых оговорок в отношении
      вознаграждения хранителя: включён ли НДС в цену, ставка, освобождение
      по ст. 149 НК РФ. Правовые ориентиры — ст. 146, 149, 164, 168 НК РФ.
      В гл. 47 ГК РФ норм о налогах нет — это договорное / налоговое условие.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "medium"
    severity_if_pass: "pass"
    severity_if_fail: "medium"
    severity_if_unclear: "low"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "НДС"
        - "в том числе НДС"
        - "без НДС"
        - "НДС не облагается"
        - "освобождено от НДС"
        - "налог на добавленную стоимость"
        - "ставка НДС"
        - "счёт-фактура"
        - "ст. 149 НК РФ"
        - "ст. 164 НК РФ"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)\\bНДС\\b"
        - "(?i)налог(а|ом)?\\s+на\\s+добавленную\\s+стоимость"
        - "(?i)(без|в\\s+том\\s+числе|плюс|сверх)\\s+НДС"
        - "(?i)НДС\\s+не\\s+облага"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор хранения.
        Проверяется один вопрос: режим НДС и налоговые оговорки в отношении
        вознаграждения хранителя.
        Нормативные ориентиры:
        - ст. 146 НК РФ — объект налогообложения НДС (реализация услуг);
        - п. 3 ст. 164 НК РФ — общая ставка НДС 20%; пониженные ставки
          для отдельных операций;
        - ст. 149 НК РФ — операции, не подлежащие налогообложению
          (освобождение); в частности, для отдельных видов хранения
          (архивы, музеи, библиотеки — пп. 20 п. 2 ст. 149; банковские
          ячейки — пп. 3 п. 3 ст. 149);
        - ст. 168 НК РФ — счета-фактуры.
        Важно:
        - Твоя задача — не оценивать серьёзность риска.
        - Только установить, что прямо есть в тексте договора, а чего прямо нет.
        - Не выводи режим НДС из НК РФ — фиксируй только то, что прямо
          написано в договоре.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Указан ли режим НДС в отношении вознаграждения.
        2. Как указан НДС: включён в цену / взимается сверх / освобождение.
        3. Указана ли ставка НДС.
        4. Иные налоговые оговорки (налог на прибыль, счёт-фактура,
          ссылки на статьи НК РФ).

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Для отсутствующих данных:
          - сигнальные поля (vat_status / vat_mode) → "not_defined";
          - текстовые поля (vat_rate / tax_notes_details) →
            "Данные не определены".
        3. Запрещено возвращать "None", "null", пустую строку "" или пропускать ключ.
        4. vat_status = "defined" — если прямо упомянут НДС или налоговый
          режим вознаграждения.
        5. vat_mode = "included" — если указано «в том числе НДС»,
          «с учётом НДС», «с НДС» (цена включает налог).
          "excluded" — если указано «без НДС», «НДС не включён»,
          «плюс НДС сверху».
          "exempt" — если указано «НДС не облагается», «освобождено
          от НДС», ссылка на ст. 149 НК РФ.
        6. vat_rate — ставка с единицей («20%», «10%»). Не голое число.
          Если указано «без НДС» — «не применяется».
        7. tax_notes_details — иные налоговые оговорки: налог на прибыль,
          ссылки на конкретные статьи НК РФ, обязанность выставлять
          счёт-фактуру.
        8. В evidence — только цитаты из документа, каждая с clause_ref.
        9. Верни ТОЛЬКО один валидный JSON-объект, пригодный для json.loads().
          Без markdown, без ```json, без комментариев, без текста до или после.

        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1 (включён в цену, со ставкой):
        Фрагмент:
        "Вознаграждение Хранителя составляет 12 000 рублей в месяц,
        в том числе НДС 20%."
        Ответ:
        {
          "vat_status": "defined",
          "vat_mode": "included",
          "vat_rate": "20%",
          "tax_notes_details": "Данные не определены",
          "evidence": [
            {
              "clause_ref": "п. X.Y",
              "quote": "Вознаграждение Хранителя составляет 12 000 рублей в месяц, в том числе НДС 20%."
            }
          ]
        }

        Пример 2 (без НДС):
        Фрагмент:
        "Стоимость услуг Хранителя указана без НДС. НДС начисляется
        сверх стоимости по ставке, установленной законодательством РФ."
        Ответ:
        {
          "vat_status": "defined",
          "vat_mode": "excluded",
          "vat_rate": "по законодательству РФ",
          "tax_notes_details": "НДС начисляется сверх стоимости",
          "evidence": [
            {
              "clause_ref": "п. X.Y",
              "quote": "Стоимость услуг Хранителя указана без НДС. НДС начисляется сверх стоимости по ставке, установленной законодательством РФ."
            }
          ]
        }

        Пример 3 (освобождение):
        Фрагмент:
        "Услуги Хранителя по хранению в архиве не облагаются НДС
        на основании пп. 20 п. 2 ст. 149 НК РФ."
        Ответ:
        {
          "vat_status": "defined",
          "vat_mode": "exempt",
          "vat_rate": "не применяется",
          "tax_notes_details": "освобождение по пп. 20 п. 2 ст. 149 НК РФ (услуги архивов)",
          "evidence": [
            {
              "clause_ref": "п. X.Y",
              "quote": "Услуги Хранителя по хранению в архиве не облагаются НДС на основании пп. 20 п. 2 ст. 149 НК РФ."
            }
          ]
        }

        Пример 4 (ничего не указано):
        Фрагмент:
        "Вознаграждение Хранителя составляет 10 000 рублей в месяц."
        Ответ:
        {
          "vat_status": "not_defined",
          "vat_mode": "not_defined",
          "vat_rate": "Данные не определены",
          "tax_notes_details": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Указан ли режим НДС в отношении вознаграждения?
        2. Как указан НДС: включён в цену / взимается сверх / освобождение?
        3. Указана ли ставка НДС?
        4. Приведены ли иные налоговые оговорки?
        5. Выведен ли режим НДС из текста договора, а не из НК РФ?
        6. Проверь, что все 5 ключей (4 поля + evidence) присутствуют в JSON.
        7. Если ничего нет — "not_defined" для сигнальных полей
          и "Данные не определены" для текстовых.
        8. Убедись, что ответ — валидный JSON, пригодный для json.loads().
        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "vat_status": "<defined / not_defined>",
          "vat_mode": "<included / excluded / exempt / not_defined>",
          "vat_rate": "<текст или 'Данные не определены'>",
          "tax_notes_details": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 650
    retrieval:
      retrieval_profile: "tax_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "НДС в том числе НДС без НДС НДС не облагается освобождено от НДС налог на добавленную стоимость ставка НДС 20% 10% счёт-фактура налоговые оговорки ст. 149 НК РФ ст. 164 НК РФ ст. 168 НК РФ"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - boilerplate
      negative_keywords:
        - "вознаграждение за хранение"
        - "страхование"
        - "штраф"
        - "пеня"
        - "неустойка"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.20, 0.60]
        boost: 0.10
        scope: segment
      context_k: 6
      max_chunks: 8
      rerank: true
      enrichment_hints:
        preferred_segment_types:
          - "contract"
          - "amendment"
        excluded_segment_types:
          - "technical_specification"
          - "price_list"
        preferred_clause_functions:
          - "obligations"
          - "boilerplate"
        confidence_bonus_on_match: 0.06
        confidence_penalty_on_excluded_segment: 0.08
    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 500
    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 700

      compact_output: false

      presence_signal:
        field: "vat_and_tax_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из договора хранения сведения
        о режиме НДС и налоговых оговорках в отношении вознаграждения
        хранителя.
        Не анализируй иные темы.
        Не оценивай риски.
        Анализируй только текст договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. vat_and_tax_presence:
           Агрегатное signal-поле — наличие условий о НДС и налоговых
           оговорок.
           - "present" — если хотя бы одно из содержательных полей
             (vat_status, vat_mode) ≠ "not_defined";
           - "missing" — если оба содержательных поля = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - vat_status = "not_defined";
           - vat_mode = "not_defined";
           - vat_rate = "Данные не определены";
           - tax_notes_details = "Данные не определены";
           - не выполняй остальные шаги.

        1. vat_status:
           - "defined" — если в тексте прямо упомянут НДС или налоговый
             режим вознаграждения (включая «без НДС», «НДС не облагается»);
           - "not_defined" — если прямого упоминания нет.

        2. vat_mode:
           - "included" — «в том числе НДС», «с учётом НДС», «с НДС»
             (цена включает налог);
           - "excluded" — «без НДС», «НДС не включён», «плюс НДС сверху»;
           - "exempt" — «НДС не облагается», «освобождено от НДС»,
             ссылка на ст. 149 НК РФ;
           - "not_defined" — режим прямо не указан.

        3. vat_rate:
           Краткая user-facing формулировка ставки НДС с единицей
           («20%», «10%», «по законодательству РФ»).
           Если указано «без НДС» — «не применяется».
           Fallback: "Данные не определены" / "Не удалось определить".

        4. tax_notes_details:
           Краткая user-facing формулировка иных налоговых оговорок:
           налог на прибыль, ссылки на статьи НК РФ, обязанность
           выставлять счёт-фактуру.
           Fallback: "Данные не определены" / "Не удалось определить".

        Если данные отсутствуют в тексте:
        - сигнальные поля → "not_defined";
        - текстовые поля → "Данные не определены".

        Если данные есть, но противоречивы:
        - сигнальные поля → "not_defined";
        - текстовые поля → "Не удалось определить".
        </task>

        <context_rules>
        - Перед остальными полями заполни vat_and_tax_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined", vat_mode = "not_defined", все текстовые поля = "Данные не определены".
        - Используй только релевантные фрагменты контекста.
        - Не подставляй нормы закона, обычную практику или предположения вместо текста договора.
        - Не извлекай вознаграждение за хранение, страхование, штрафы, пени,
          неустойки и иные нерелевантные темы.
        - Не выводи режим НДС из НК РФ — только из текста.
        - vat_mode = "included" / "excluded" / "exempt" — по прямому указанию.
        - vat_rate — всегда с единицей измерения или «не применяется».
        - Если в разных фрагментах указаны противоречивые данные — верни
          "Не удалось определить" для текстовых полей, "not_defined" для сигнальных.
        - Не используй пустые строки.
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни упоминания НДС, ни налоговых оговорок.
           → presence = "missing";
             vat_status = "not_defined";
             vat_mode = "not_defined";
             все текстовые поля = "Данные не определены".

        2. НДС упомянут без деталей.
           Например: "Стоимость услуг облагается НДС",
           без указания ставки и режима.
           → presence = "present";
             vat_status = "defined";
             vat_mode = "not_defined";
             vat_rate = "Данные не определены";
             tax_notes_details содержит дословную формулировку.

        3. Противоречие между фрагментами.
           В разных частях договора указаны разные ставки НДС
           или разные режимы (включён / без НДС).
           → presence = "unclear";
             vat_status = "not_defined";
             vat_mode = "not_defined";
             vat_rate = "Не удалось определить";
             tax_notes_details = "Не удалось определить".

        4. Прямое освобождение от НДС.
           В договоре прямо указано, что услуги не облагаются НДС
           (со ссылкой на ст. 149 НК РФ или без неё).
           → presence = "present";
             vat_status = "defined";
             vat_mode = "exempt";
             vat_rate = "не применяется";
             tax_notes_details содержит дословную формулировку
             об освобождении.
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для vat_and_tax_presence используй только: "present", "missing", "unclear".
        - Для vat_status используй только: "defined", "not_defined".
        - Для vat_mode используй только: "included", "excluded", "exempt", "not_defined".
        - Fallback при отсутствии данных:
          * vat_rate, tax_notes_details → "Данные не определены".
        - Fallback при противоречии или неоднозначности:
          * vat_rate, tax_notes_details → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "vat_and_tax_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие условий о НДС и налоговых оговорок. Внутреннее агрегатное signal-поле."
          required: true

        - name: "vat_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Наличие указания на НДС. Внутреннее enum-поле."
          label: "НДС"
          required: true
          display_in_grid: true
          display_priority: 1

        - name: "vat_mode"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["included", "excluded", "exempt", "not_defined"]
          description: "Режим НДС в договоре. Внутреннее enum-поле."
          label: "Режим НДС"
          required: true
          display_in_grid: true
          display_priority: 2

        - name: "vat_rate"
          type: "string"
          presentation: "fact"
          label: "Ставка НДС"
          description: >
            Ставка НДС (20% / 10% / не применяется). Fallback: "Не установлено" / "Не удалось определить".
          required: true
          display_in_grid: true
          display_priority: 3

        - name: "tax_notes_details"
          type: "string"
          presentation: "fact"
          label: "Налоговые оговорки"
          description: >
            Иные налоговые оговорки в договоре. Fallback: "Не установлено" / "Не удалось определить".
          required: true
          display_in_grid: true
          display_priority: 4

      store_payload: true

  - id: no_use_without_consent
    name: "Запрет пользования вещью хранителем (ст. 892 ГК РФ)"
    description: >
      Фактографическая проверка запрета пользования переданной на хранение
      вещью хранителем и предоставления возможности пользования третьим
      лицам. Отсутствие прямого запрета в договоре — риск: по ст. 892 ГК РФ
      пользование допускается только для обеспечения сохранности вещи,
      если это не противоречит договору.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "не вправе пользоваться"
        - "запрет пользования"
        - "без права пользования"
        - "право пользования вещью"
        - "предоставление в пользование"
        - "использование вещи"
        - "ст. 892"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)(не\\s+вправе|запрещено|запрещается)\\s+пользоват"
        - "(?i)право\\s+пользовани(я|е)\\s+вещ"
        - "(?i)ст\\.?\\s*892"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор хранения (ст. 892 ГК РФ).
        Проверяется один вопрос: пользование вещью хранителем и предоставление
        возможности пользования третьим лицам.
        Нормативный ориентир:
        - ст. 892 ГК РФ — хранитель не вправе пользоваться переданной
          на хранение вещью, а равно предоставлять возможность пользования
          ею третьим лицам, за исключением случая, когда пользование
          необходимо для обеспечения сохранности вещи и не противоречит
          договору хранения.
        Важно:
        - Твоя задача — не оценивать серьёзность риска.
        - Только установить, что прямо есть в тексте договора, а чего прямо нет.
        - Отсутствие условия о пользовании — не "yes", а "not_defined".
          Не выводи запрет из ст. 892 ГК РФ.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Прямо ли запрещено пользование вещью хранителем.
        2. Разрешено ли пользование (полностью / частично / для сохранности).
        3. Есть ли условие о предоставлении вещи в пользование третьим лицам.
        4. Указаны ли условия пользования (для сохранности / для целей
          договора / иное).

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Для отсутствующих данных:
          - сигнальные поля (no_use_status / use_permission_status /
            third_party_use_status) → "not_defined";
          - текстовое поле (no_use_details) → "Данные не определены".
        3. Запрещено возвращать "None", "null", пустую строку "" или пропускать ключ.
        4. no_use_status = "defined" — если прямо запрещено пользование
          (в любой формулировке: «не вправе пользоваться», «без права
          пользования», «запрещено использовать»).
        5. use_permission_status = "prohibited" — запрет; "for_safety" —
          пользование допускается только для сохранности; "allowed" —
          пользование разрешено (любое / для целей договора);
          "partially" — разрешено с ограничениями.
        6. third_party_use_status = "yes" — если прямо разрешено предоставлять
          вещь в пользование третьим лицам; "no" — если прямо запрещено.
        7. no_use_details — конкретная формулировка из текста.
        8. В evidence — только цитаты из документа, каждая с clause_ref.
        9. Верни ТОЛЬКО один валидный JSON-объект, пригодный для json.loads().
          Без markdown, без ```json, без комментариев, без текста до или после.

        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1 (прямой запрет):
        Фрагмент:
        "Хранитель не вправе пользоваться вещью, переданной на хранение,
        а также предоставлять её в пользование третьим лицам."
        Ответ:
        {
          "no_use_status": "defined",
          "use_permission_status": "prohibited",
          "third_party_use_status": "no",
          "no_use_details": "хранитель не вправе пользоваться вещью и предоставлять её третьим лицам",
          "evidence": [
            {
              "clause_ref": "п. X.Y",
              "quote": "Хранитель не вправе пользоваться вещью, переданной на хранение, а также предоставлять её в пользование третьим лицам."
            }
          ]
        }

        Пример 2 (пользование для сохранности):
        Фрагмент:
        "Хранитель вправе пользоваться вещью исключительно в целях
        обеспечения её сохранности, если это не противоречит существу
        обязательства."
        Ответ:
        {
          "no_use_status": "not_defined",
          "use_permission_status": "for_safety",
          "third_party_use_status": "not_defined",
          "no_use_details": "пользование допускается только для обеспечения сохранности вещи",
          "evidence": [
            {
              "clause_ref": "п. X.Y",
              "quote": "Хранитель вправе пользоваться вещью исключительно в целях обеспечения её сохранности, если это не противоречит существу обязательства."
            }
          ]
        }

        Пример 3 (разрешено с ограничениями):
        Фрагмент:
        "Хранитель вправе использовать оборудование в процессе хранения
        для целей, соответствующих назначению вещи, с предварительного
        письменного согласия Поклажедателя."
        Ответ:
        {
          "no_use_status": "not_defined",
          "use_permission_status": "partially",
          "third_party_use_status": "not_defined",
          "no_use_details": "использование допускается для целей, соответствующих назначению вещи, с согласия Поклажедателя",
          "evidence": [
            {
              "clause_ref": "п. X.Y",
              "quote": "Хранитель вправе использовать оборудование в процессе хранения для целей, соответствующих назначению вещи, с предварительного письменного согласия Поклажедателя."
            }
          ]
        }

        Пример 4 (ничего не указано):
        Фрагмент:
        "Хранитель принимает вещь Поклажедателя на хранение."
        Ответ:
        {
          "no_use_status": "not_defined",
          "use_permission_status": "not_defined",
          "third_party_use_status": "not_defined",
          "no_use_details": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Прямо ли запрещено пользование вещью хранителем?
        2. Определён ли статус права пользования (запрет / для сохранности /
          разрешено / с ограничениями)?
        3. Указано ли право пользования третьими лицами?
        4. Приведена ли конкретная формулировка из текста?
        5. Выведен ли запрет из текста договора, а не из ст. 892 ГК РФ?
        6. Проверь, что все 5 ключей (4 поля + evidence) присутствуют в JSON.
        7. Если ничего нет — "not_defined" для сигнальных полей
          и "Данные не определены" для текстового.
        8. Убедись, что ответ — валидный JSON, пригодный для json.loads().
        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "no_use_status": "<defined / not_defined>",
          "use_permission_status": "<prohibited / for_safety / partially / allowed / not_defined>",
          "third_party_use_status": "<yes / no / not_defined>",
          "no_use_details": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 650
    retrieval:
      retrieval_profile: "scope_of_work_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "не вправе пользоваться вещью запрет пользования без права пользования право пользования вещью предоставление в пользование третьим лицам использование вещи для сохранности ст. 892"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - limitations
        - obligations
      negative_keywords:
        - "вознаграждение"
        - "страхование"
        - "штраф"
        - "пеня"
        - "неустойка"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.20, 0.60]
        boost: 0.12
        scope: segment
      context_k: 6
      max_chunks: 8
      rerank: true
      enrichment_hints:
        preferred_segment_types:
          - "contract"
          - "amendment"
        excluded_segment_types:
          - "technical_specification"
          - "price_list"
        preferred_clause_functions:
          - "limitations"
          - "obligations"
        confidence_bonus_on_match: 0.08
        confidence_penalty_on_excluded_segment: 0.10
    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 500
    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 750

      compact_output: false

      presence_signal:
        field: "no_use_without_consent_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из договора хранения сведения
        о запрете пользования вещью хранителем и передачи её в пользование
        третьим лицам.
        Не анализируй иные темы.
        Не оценивай риски.
        Анализируй только текст договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. no_use_without_consent_presence:
           Агрегатное signal-поле — наличие условий о пользовании вещью.
           - "present" — если хотя бы одно из содержательных полей
             (no_use_status, use_permission_status, third_party_use_status)
             ≠ "not_defined";
           - "missing" — если все три содержательных поля = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - no_use_status = "not_defined";
           - use_permission_status = "not_defined";
           - third_party_use_status = "not_defined";
           - no_use_details = "Данные не определены";
           - не выполняй остальные шаги.

        1. no_use_status:
           - "defined" — если в тексте прямо запрещено пользование вещью
             хранителем (в любой формулировке);
           - "not_defined" — если прямого запрета нет.

        2. use_permission_status:
           - "prohibited" — пользование прямо запрещено;
           - "for_safety" — пользование допускается только для сохранности
             вещи;
           - "partially" — пользование допускается с ограничениями
             (для целей договора, с согласия, в определённом объёме);
           - "allowed" — пользование прямо разрешено без ограничений;
           - "not_defined" — статус прямо не указан.

        3. third_party_use_status:
           - "yes" — прямо разрешено предоставлять вещь в пользование
             третьим лицам;
           - "no" — прямо запрещено;
           - "not_defined" — прямо не указано.

        4. no_use_details:
           Краткая user-facing формулировка условий пользования
           из договора.
           Fallback: "Данные не определены" / "Не удалось определить".

        Если данные отсутствуют в тексте:
        - сигнальные поля → "not_defined";
        - текстовое поле → "Данные не определены".

        Если данные есть, но противоречивы:
        - сигнальные поля → "not_defined";
        - текстовое поле → "Не удалось определить".
        </task>

        <context_rules>
        - Перед остальными полями заполни no_use_without_consent_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined", no_use_details = "Данные не определены".
        - Используй только релевантные фрагменты контекста.
        - Не подставляй нормы закона, обычную практику или предположения вместо текста договора.
        - Не извлекай вознаграждение, страхование, штрафы, пени, неустойки
          и иные нерелевантные темы.
        - Не выводи запрет из ст. 892 ГК РФ — только из текста.
        - no_use_status = "defined" — при прямом запрете пользования.
        - use_permission_status — по прямому указанию (prohibited / for_safety /
          partially / allowed).
        - Отсутствие условия о пользовании — не "yes", а "not_defined".
        - Если в разных фрагментах указаны противоречивые данные — верни
          "Не удалось определить" для текстового поля, "not_defined" для сигнальных.
        - Не используй пустые строки.
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни запрета, ни разрешения пользования,
           ни упоминания третьих лиц.
           → presence = "missing";
             все *_status = "not_defined";
             no_use_details = "Данные не определены".

        2. Прямой запрет без деталей.
           Например: "Хранитель не вправе пользоваться вещью",
           без упоминания третьих лиц.
           → presence = "present";
             no_use_status = "defined";
             use_permission_status = "prohibited";
             third_party_use_status = "not_defined";
             no_use_details содержит дословную формулировку.

        3. Противоречие между фрагментами.
           В разных частях договора указаны разные режимы пользования
           (где-то запрет, где-то разрешение).
           → presence = "unclear";
             соответствующие *_status = "not_defined";
             no_use_details = "Не удалось определить".

        4. Разрешение только для сохранности.
           В договоре прямо указано, что пользование допускается только
           для обеспечения сохранности вещи.
           → presence = "present";
             no_use_status = "not_defined";
             use_permission_status = "for_safety";
             third_party_use_status = "not_defined";
             no_use_details содержит дословную формулировку.
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для no_use_without_consent_presence используй только: "present", "missing", "unclear".
        - Для no_use_status используй только: "defined", "not_defined".
        - Для use_permission_status используй только: "prohibited", "for_safety", "partially", "allowed", "not_defined".
        - Для third_party_use_status используй только: "yes", "no", "not_defined".
        - Fallback при отсутствии данных:
          * no_use_details → "Данные не определены".
        - Fallback при противоречии или неоднозначности:
          * no_use_details → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "no_use_without_consent_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие условий о пользовании вещью. Внутреннее агрегатное signal-поле."
          required: true

        - name: "no_use_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Наличие прямого запрета пользования вещью. Внутреннее enum-поле."
          label: "Запрет пользования"
          required: true
          display_in_grid: true
          display_priority: 1

        - name: "use_permission_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["prohibited", "for_safety", "partially", "allowed", "not_defined"]
          description: "Статус права пользования вещью. Внутреннее enum-поле."
          label: "Право пользования"
          required: true
          display_in_grid: true
          display_priority: 2

        - name: "third_party_use_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Разрешено ли пользование третьими лицами. Внутреннее enum-поле."
          label: "Пользование третьими лицами"
          required: true
          display_in_grid: true
          display_priority: 3

        - name: "no_use_details"
          type: "string"
          presentation: "fact"
          label: "Формулировка о пользовании"
          description: >
            Формулировка условий пользования из договора. Fallback: "Не установлено" / "Не удалось определить".
          required: true
          display_in_grid: true
          display_priority: 4

      store_payload: true

  - id: substorage_and_assignment
    name: "Передача вещи на хранение третьему лицу (ст. 895 ГК РФ)"
    description: >
      Фактографическая проверка условий передачи вещи на хранение третьему
      лицу (субхранение), порядка согласования и обязанности уведомления
      поклажедателя. Правовой ориентир — ст. 895 ГК РФ.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "передача третьему лицу"
        - "субхранение"
        - "субхранитель"
        - "передача вещи на хранение"
        - "согласие поклажедателя"
        - "уведомление о передаче"
        - "ст. 895"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)(передач|передать).*треть(ему|ьим)"
        - "(?i)субхранени"
        - "(?i)субхранител"
        - "(?i)ст\\.?\\s*895"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор хранения (ст. 895 ГК РФ).
        Проверяется один вопрос: передача вещи на хранение третьему лицу
        (субхранение) и порядок согласования с поклажедателем.
        Нормативный ориентир:
        - ст. 895 ГК РФ — если договором не предусмотрено иное, хранитель
          не вправе без согласия поклажедателя передавать вещь на хранение
          третьему лицу, за исключением случаев, когда он вынужден к этому
          силою обстоятельств в интересах поклажедателя и лишён возможности
          получить его согласие. О передаче вещи третьему лицу хранитель
          обязан незамедлительно уведомить поклажедателя.
        Важно:
        - Твоя задача — не оценивать серьёзность риска.
        - Только установить, что прямо есть в тексте договора, а чего прямо нет.
        - Не выводи условия из ст. 895 ГК РФ — фиксируй только то, что прямо
          написано в договоре.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Разрешена ли передача вещи третьему лицу на хранение.
        2. Требуется ли согласие поклажедателя (предварительное / письменное).
        3. Есть ли обязанность уведомить поклажедателя о такой передаче.
        4. Указаны ли условия / порядок передачи.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Для отсутствующих данных:
          - сигнальные поля (substorage_allowed / consent_required_status /
            notification_required_status) → "not_defined";
          - текстовое поле (substorage_details) → "Данные не определены".
        3. Запрещено возвращать "None", "null", пустую строку "" или пропускать ключ.
        4. substorage_allowed = "yes" — если прямо разрешено субхранение;
          "no" — если прямо запрещено; "with_consent" — только с согласием
          (по умолчанию согласие нужно, если договор не отменяет это правило).
        5. consent_required_status = "yes" — если прямо указано согласие
          поклажедателя; "no" — если прямо не требуется.
        6. notification_required_status = "yes" — если прямо указано
          уведомление поклажедателя.
        7. substorage_details — форма согласия (письменное / устное / email),
          срок уведомления, кто может быть субхранителем, иные условия.
        8. В evidence — только цитаты из документа, каждая с clause_ref.
        9. Верни ТОЛЬКО один валидный JSON-объект, пригодный для json.loads().
          Без markdown, без ```json, без комментариев, без текста до или после.

        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1 (полный — с согласием и уведомлением):
        Фрагмент:
        "Хранитель вправе передать вещь на хранение третьему лицу
        только с предварительного письменного согласия Поклажедателя,
        о чём обязан уведомить Поклажедателя в течение 3 рабочих дней."
        Ответ:
        {
          "substorage_allowed": "with_consent",
          "consent_required_status": "yes",
          "notification_required_status": "yes",
          "substorage_details": "предварительное письменное согласие Поклажедателя; уведомление в течение 3 рабочих дней",
          "evidence": [
            {
              "clause_ref": "п. X.Y",
              "quote": "Хранитель вправе передать вещь на хранение третьему лицу только с предварительного письменного согласия Поклажедателя, о чём обязан уведомить Поклажедателя в течение 3 рабочих дней."
            }
          ]
        }

        Пример 2 (полный запрет):
        Фрагмент:
        "Хранитель не вправе передавать вещь на хранение третьим лицам."
        Ответ:
        {
          "substorage_allowed": "no",
          "consent_required_status": "not_defined",
          "notification_required_status": "not_defined",
          "substorage_details": "прямой запрет передачи вещи третьим лицам",
          "evidence": [
            {
              "clause_ref": "п. X.Y",
              "quote": "Хранитель не вправе передавать вещь на хранение третьим лицам."
            }
          ]
        }

        Пример 3 (разрешено без согласия):
        Фрагмент:
        "Хранитель вправе без согласия Поклажедателя передать вещь
        на хранение третьему лицу при необходимости."
        Ответ:
        {
          "substorage_allowed": "yes",
          "consent_required_status": "no",
          "notification_required_status": "not_defined",
          "substorage_details": "передача допускается без согласия Поклажедателя при необходимости",
          "evidence": [
            {
              "clause_ref": "п. X.Y",
              "quote": "Хранитель вправе без согласия Поклажедателя передать вещь на хранение третьему лицу при необходимости."
            }
          ]
        }

        Пример 4 (ничего не указано):
        Фрагмент:
        "Хранитель принимает вещь Поклажедателя на хранение."
        Ответ:
        {
          "substorage_allowed": "not_defined",
          "consent_required_status": "not_defined",
          "notification_required_status": "not_defined",
          "substorage_details": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Разрешена ли передача вещи третьему лицу?
        2. Требуется ли согласие поклажедателя?
        3. Указана ли обязанность уведомления?
        4. Приведены ли конкретные условия и порядок?
        5. Выведены ли условия из текста договора, а не из ст. 895 ГК РФ?
        6. Проверь, что все 5 ключей (4 поля + evidence) присутствуют в JSON.
        7. Если ничего нет — "not_defined" для сигнальных полей
          и "Данные не определены" для текстового.
        8. Убедись, что ответ — валидный JSON, пригодный для json.loads().
        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "substorage_allowed": "<yes / no / with_consent / not_defined>",
          "consent_required_status": "<yes / no / not_defined>",
          "notification_required_status": "<yes / no / not_defined>",
          "substorage_details": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 650
    retrieval:
      retrieval_profile: "subletting_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "передача третьему лицу субхранение субхранитель передача вещи на хранение согласие поклажедателя уведомление о передаче письменное согласие ст. 895"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - procedures
      negative_keywords:
        - "вознаграждение"
        - "страхование"
        - "штраф"
        - "пеня"
        - "неустойка"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.20, 0.65]
        boost: 0.12
        scope: segment
      context_k: 6
      max_chunks: 8
      rerank: true
      enrichment_hints:
        preferred_segment_types:
          - "contract"
          - "amendment"
        excluded_segment_types:
          - "technical_specification"
          - "price_list"
        preferred_clause_functions:
          - "obligations"
          - "procedures"
        confidence_bonus_on_match: 0.08
        confidence_penalty_on_excluded_segment: 0.10
    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 500
    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 750

      compact_output: false

      presence_signal:
        field: "substorage_and_assignment_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из договора хранения сведения
        о передаче вещи на хранение третьему лицу (субхранении).
        Не анализируй иные темы.
        Не оценивай риски.
        Анализируй только текст договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. substorage_and_assignment_presence:
           Агрегатное signal-поле — наличие условий о передаче вещи
           третьему лицу.
           - "present" — если хотя бы одно из содержательных полей
             (substorage_allowed, consent_required_status,
              notification_required_status) ≠ "not_defined";
           - "missing" — если все три содержательных поля = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - substorage_allowed = "not_defined";
           - consent_required_status = "not_defined";
           - notification_required_status = "not_defined";
           - substorage_details = "Данные не определены";
           - не выполняй остальные шаги.

        1. substorage_allowed:
           - "yes" — прямо разрешено субхранение без согласия;
           - "no" — прямо запрещено;
           - "with_consent" — только с согласием поклажедателя
             (прямо указано или оставлено по умолчанию);
           - "not_defined" — режим прямо не указан.

        2. consent_required_status:
           - "yes" — прямо указано согласие поклажедателя;
           - "no" — прямо указано, что согласие не требуется;
           - "not_defined" — прямо не указано.

        3. notification_required_status:
           - "yes" — прямо указано уведомление поклажедателя о передаче;
           - "no" — прямо указано, что уведомление не требуется;
           - "not_defined" — прямо не указано.

        4. substorage_details:
           Краткая user-facing формулировка формы согласия (письменное /
           устное / email), срока уведомления, кто может быть субхранителем
           и иных условий.
           Fallback: "Данные не определены" / "Не удалось определить".

        Если данные отсутствуют в тексте:
        - сигнальные поля → "not_defined";
        - текстовое поле → "Данные не определены".

        Если данные есть, но противоречивы:
        - сигнальные поля → "not_defined";
        - текстовое поле → "Не удалось определить".
        </task>

        <context_rules>
        - Перед остальными полями заполни substorage_and_assignment_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined", substorage_details = "Данные не определены".
        - Используй только релевантные фрагменты контекста.
        - Не подставляй нормы закона, обычную практику или предположения вместо текста договора.
        - Не извлекай вознаграждение, страхование, штрафы, пени, неустойки
          и иные нерелевантные темы.
        - Не выводи условия из ст. 895 ГК РФ — только из текста.
        - substorage_allowed = "yes" / "no" / "with_consent" — по прямому
          указанию в тексте.
        - consent_required_status = "yes" / "no" — по прямому указанию.
        - notification_required_status = "yes" / "no" — по прямому указанию.
        - Если в разных фрагментах указаны противоречивые данные — верни
          "Не удалось определить" для текстового поля, "not_defined" для сигнальных.
        - Не используй пустые строки.
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни разрешения / запрета передачи, ни согласия,
           ни уведомления.
           → presence = "missing";
             все *_status = "not_defined";
             substorage_details = "Данные не определены".

        2. Передача упомянута без деталей.
           Например: "Хранитель вправе передать вещь на хранение
           третьему лицу", без указания согласия и уведомления.
           → presence = "present";
             substorage_allowed = "yes";
             consent_required_status = "not_defined";
             notification_required_status = "not_defined";
             substorage_details содержит дословную формулировку.

        3. Противоречие между фрагментами.
           В разных частях договора указаны разные порядки передачи
           (где-то запрет, где-то разрешение).
           → presence = "unclear";
             соответствующие *_status = "not_defined";
             substorage_details = "Не удалось определить".

        4. Передача с согласием и уведомлением.
           В договоре прямо указано, что передача возможна только
           с письменного согласия поклажедателя и последующим уведомлением.
           → presence = "present";
             substorage_allowed = "with_consent";
             consent_required_status = "yes";
             notification_required_status = "yes";
             substorage_details содержит дословную формулировку.
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для substorage_and_assignment_presence используй только: "present", "missing", "unclear".
        - Для substorage_allowed используй только: "yes", "no", "with_consent", "not_defined".
        - Для consent_required_status и notification_required_status используй только: "yes", "no", "not_defined".
        - Fallback при отсутствии данных:
          * substorage_details → "Данные не определены".
        - Fallback при противоречии или неоднозначности:
          * substorage_details → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "substorage_and_assignment_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие условий о передаче вещи третьему лицу. Внутреннее агрегатное signal-поле."
          required: true

        - name: "substorage_allowed"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["yes", "no", "with_consent", "not_defined"]
          description: "Разрешена ли передача вещи третьему лицу. Внутреннее enum-поле."
          label: "Субхранение"
          required: true
          display_in_grid: true
          display_priority: 1

        - name: "consent_required_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Требуется ли согласие поклажедателя. Внутреннее enum-поле."
          label: "Согласие поклажедателя"
          required: true
          display_in_grid: true
          display_priority: 2

        - name: "notification_required_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Требуется ли уведомление поклажедателя. Внутреннее enum-поле."
          label: "Уведомление"
          required: true
          display_in_grid: true
          display_priority: 3

        - name: "substorage_details"
          type: "string"
          presentation: "fact"
          label: "Порядок передачи"
          description: >
            Форма согласия, срок уведомления и иные условия. Fallback: "Не установлено" / "Не удалось определить".
          required: true
          display_in_grid: true
          display_priority: 4

      store_payload: true

  - id: risk_transfer_moment
    name: "Момент перехода риска случайной гибели / повреждения"
    description: >
      Фактографическая проверка условия о моменте перехода риска случайной
      гибели или повреждения вещи: с момента передачи вещи хранителю /
      с момента подписания акта / иной момент. Правовые ориентиры —
      ст. 901–902 ГК РФ.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "риск случайной гибели"
        - "риск повреждения"
        - "переход риска"
        - "момент передачи"
        - "с момента подписания акта"
        - "с момента приёма"
        - "несёт риск"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)риск(а|и)?\\s+случайн(ой|ого)"
        - "(?i)риск.*(гибел|поврежден|порч)"
        - "(?i)переход.*риск"
        - "(?i)с\\s+момента\\s+(приём|принят|подписани|передач)"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор хранения (ст. 901–902 ГК РФ).
        Проверяется один вопрос: момент перехода риска случайной гибели
        или повреждения вещи.
        Нормативные ориентиры:
        - ст. 901 ГК РФ — основания ответственности хранителя: с момента
          принятия вещи на хранение хранитель отвечает за утрату, недостачу
          или повреждение вещи при наличии вины (или независимо от вины —
          для профессионального хранителя);
        - ст. 902 ГК РФ — размер ответственности хранителя.
        Важно:
        - Твоя задача — не оценивать серьёзность риска.
        - Только установить, что прямо есть в тексте договора, а чего прямо нет.
        - Не выводи момент перехода риска из ст. 901 ГК РФ — фиксируй только
          то, что прямо написано в договоре.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Указан ли момент перехода риска случайной гибели / повреждения.
        2. С какого момента риск переходит (передача вещи / подписание акта /
          иной момент).
        3. Кто несёт риск до момента передачи и после.
        4. Есть ли исключения (форс-мажор, свойства вещи).

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Для отсутствующих данных:
          - сигнальные поля (risk_transfer_status / risk_transfer_moment) →
            "not_defined";
          - текстовые поля (risk_transfer_details / risk_bearer) →
            "Данные не определены".
        3. Запрещено возвращать "None", "null", пустую строку "" или пропускать ключ.
        4. risk_transfer_status = "defined" — если прямо указан момент
          перехода риска.
        5. risk_transfer_moment = "upon_transfer" — с момента фактической
          передачи вещи; "upon_act_signing" — с момента подписания акта
          приёма-передачи; "upon_acceptance" — с момента приёма на хранение;
          "other" — иной момент; "not_defined" — не указан.
        6. risk_bearer — кто несёт риск (хранитель / поклажедатель /
          оба с распределением по этапам). Если указано — текстом.
        7. risk_transfer_details — конкретная формулировка из текста.
        8. В evidence — только цитаты из документа, каждая с clause_ref.
        9. Верни ТОЛЬКО один валидный JSON-объект, пригодный для json.loads().
          Без markdown, без ```json, без комментариев, без текста до или после.

        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1 (момент подписания акта):
        Фрагмент:
        "Риск случайной гибели или повреждения вещи переходит к Хранителю
        с момента подписания сторонами акта приёма-передачи вещи на хранение."
        Ответ:
        {
          "risk_transfer_status": "defined",
          "risk_transfer_moment": "upon_act_signing",
          "risk_bearer": "хранитель — с момента подписания акта приёма-передачи",
          "risk_transfer_details": "риск переходит к Хранителю с момента подписания акта приёма-передачи",
          "evidence": [
            {
              "clause_ref": "п. X.Y",
              "quote": "Риск случайной гибели или повреждения вещи переходит к Хранителю с момента подписания сторонами акта приёма-передачи вещи на хранение."
            }
          ]
        }

        Пример 2 (момент передачи):
        Фрагмент:
        "Хранитель несёт риск случайной гибели вещи с момента её фактической
        передачи на хранение до момента возврата Поклажедателю."
        Ответ:
        {
          "risk_transfer_status": "defined",
          "risk_transfer_moment": "upon_transfer",
          "risk_bearer": "хранитель — с момента передачи до возврата",
          "risk_transfer_details": "риск у хранителя с момента фактической передачи до момента возврата",
          "evidence": [
            {
              "clause_ref": "п. X.Y",
              "quote": "Хранитель несёт риск случайной гибели вещи с момента её фактической передачи на хранение до момента возврата Поклажедателю."
            }
          ]
        }

        Пример 3 (с исключением):
        Фрагмент:
        "Хранитель не несёт риск случайной гибели вещи, произошедшей
        вследствие непреодолимой силы или свойств самой вещи."
        Ответ:
        {
          "risk_transfer_status": "defined",
          "risk_transfer_moment": "not_defined",
          "risk_bearer": "не хранитель — при форс-мажоре и свойствах вещи",
          "risk_transfer_details": "исключение риска хранителя при непреодолимой силе и свойствах вещи",
          "evidence": [
            {
              "clause_ref": "п. X.Y",
              "quote": "Хранитель не несёт риск случайной гибели вещи, произошедшей вследствие непреодолимой силы или свойств самой вещи."
            }
          ]
        }

        Пример 4 (ничего не указано):
        Фрагмент:
        "Хранитель принимает вещь Поклажедателя на хранение."
        Ответ:
        {
          "risk_transfer_status": "not_defined",
          "risk_transfer_moment": "not_defined",
          "risk_bearer": "Данные не определены",
          "risk_transfer_details": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Указан ли момент перехода риска?
        2. Определён ли момент (передача / акт / приём / иной)?
        3. Указано ли, кто несёт риск?
        4. Приведены ли исключения (форс-мажор, свойства вещи)?
        5. Выведен ли момент из текста договора, а не из ст. 901 ГК РФ?
        6. Проверь, что все 5 ключей (4 поля + evidence) присутствуют в JSON.
        7. Если ничего нет — "not_defined" для сигнальных полей
          и "Данные не определены" для текстовых.
        8. Убедись, что ответ — валидный JSON, пригодный для json.loads().
        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "risk_transfer_status": "<defined / not_defined>",
          "risk_transfer_moment": "<upon_transfer / upon_act_signing / upon_acceptance / other / not_defined>",
          "risk_bearer": "<текст или 'Данные не определены'>",
          "risk_transfer_details": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 8
      temperature: 0.0
      max_tokens: 700
    retrieval:
      retrieval_profile: "title_transfer_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "риск случайной гибели риск повреждения переход риска момент передачи с момента подписания акта с момента приёма несёт риск риск порчи ст. 901 ст. 902"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - limitations
        - obligations
      negative_keywords:
        - "вознаграждение"
        - "страхование"
        - "штраф"
        - "пеня"
        - "неустойка"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.35, 0.75]
        boost: 0.12
        scope: segment
      context_k: 8
      max_chunks: 10
      rerank: true
      enrichment_hints:
        preferred_segment_types:
          - "contract"
          - "amendment"
        excluded_segment_types:
          - "technical_specification"
          - "price_list"
        preferred_clause_functions:
          - "limitations"
          - "obligations"
        confidence_bonus_on_match: 0.08
        confidence_penalty_on_excluded_segment: 0.10
    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 500
    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 750

      compact_output: false

      presence_signal:
        field: "risk_transfer_moment_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из договора хранения сведения
        о моменте перехода риска случайной гибели / повреждения вещи.
        Не анализируй иные темы.
        Не оценивай риски.
        Анализируй только текст договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. risk_transfer_moment_presence:
           Агрегатное signal-поле — наличие условий о моменте перехода риска.
           - "present" — если хотя бы одно из содержательных полей
             (risk_transfer_status, risk_transfer_moment) ≠ "not_defined";
           - "missing" — если оба содержательных поля = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - risk_transfer_status = "not_defined";
           - risk_transfer_moment = "not_defined";
           - risk_bearer = "Данные не определены";
           - risk_transfer_details = "Данные не определены";
           - не выполняй остальные шаги.

        1. risk_transfer_status:
           - "defined" — если в тексте прямо указан момент перехода риска
             случайной гибели / повреждения (либо прямо указано, что риск
             остаётся на поклажедателе / на хранителе);
           - "not_defined" — если прямого указания нет.

        2. risk_transfer_moment:
           - "upon_transfer" — с момента фактической передачи вещи;
           - "upon_act_signing" — с момента подписания акта приёма-передачи;
           - "upon_acceptance" — с момента приёма на хранение;
           - "other" — иной прямо названный момент;
           - "not_defined" — момент прямо не указан.

        3. risk_bearer:
           Краткая user-facing формулировка о том, кто несёт риск
           (хранитель / поклажедатель / оба с распределением по этапам).
           Fallback: "Данные не определены" / "Не удалось определить".

        4. risk_transfer_details:
           Краткая user-facing формулировка условия о риске из текста
           (с указанием момента, исключений, если названы).
           Fallback: "Данные не определены" / "Не удалось определить".

        Если данные отсутствуют в тексте:
        - сигнальные поля → "not_defined";
        - текстовые поля → "Данные не определены".

        Если данные есть, но противоречивы:
        - сигнальные поля → "not_defined";
        - текстовые поля → "Не удалось определить".
        </task>

        <context_rules>
        - Перед остальными полями заполни risk_transfer_moment_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined", risk_transfer_moment = "not_defined", все текстовые поля = "Данные не определены".
        - Используй только релевантные фрагменты контекста.
        - Не подставляй нормы закона, обычную практику или предположения вместо текста договора.
        - Не извлекай вознаграждение, страхование, штрафы, пени, неустойки
          и иные нерелевантные темы.
        - Не выводи момент перехода риска из ст. 901 ГК РФ — только из текста.
        - risk_transfer_moment — по прямому указанию в тексте.
        - Если в разных фрагментах указаны противоречивые данные — верни
          "Не удалось определить" для текстовых полей, "not_defined" для сигнальных.
        - Не используй пустые строки.
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни момента перехода риска, ни указания на риск
           у хранителя / поклажедателя.
           → presence = "missing";
             все *_status = "not_defined";
             все текстовые поля = "Данные не определены".

        2. Риск упомянут без момента.
           Например: "Хранитель не несёт риск случайной гибели вещи,
           произошедшей вследствие непреодолимой силы".
           → presence = "present";
             risk_transfer_status = "defined";
             risk_transfer_moment = "not_defined";
             risk_bearer содержит формулировку об исключении;
             risk_transfer_details содержит дословную формулировку.

        3. Противоречие между фрагментами.
           В разных частях договора указаны разные моменты перехода риска
           или разные риск-несующие стороны.
           → presence = "unclear";
             risk_transfer_status = "not_defined";
             risk_transfer_moment = "not_defined";
             все текстовые поля = "Не удалось определить".

        4. Прямое указание момента перехода риска.
           В договоре прямо сказано, что риск случайной гибели переходит
           к хранителю с определённого момента (передача, подписание акта,
           приём).
           → presence = "present";
             risk_transfer_status = "defined";
             risk_transfer_moment = "upon_transfer" / "upon_act_signing" /
               "upon_acceptance" / "other";
             risk_bearer и risk_transfer_details содержат дословную формулировку.
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для risk_transfer_moment_presence используй только: "present", "missing", "unclear".
        - Для risk_transfer_status используй только: "defined", "not_defined".
        - Для risk_transfer_moment используй только: "upon_transfer", "upon_act_signing", "upon_acceptance", "other", "not_defined".
        - Fallback при отсутствии данных:
          * risk_bearer, risk_transfer_details → "Данные не определены".
        - Fallback при противоречии или неоднозначности:
          * risk_bearer, risk_transfer_details → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "risk_transfer_moment_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие условий о моменте перехода риска. Внутреннее агрегатное signal-поле."
          required: true

        - name: "risk_transfer_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Наличие условия о моменте перехода риска. Внутреннее enum-поле."
          label: "Момент перехода риска"
          required: true
          display_in_grid: true
          display_priority: 1

        - name: "risk_transfer_moment"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["upon_transfer", "upon_act_signing", "upon_acceptance", "other", "not_defined"]
          description: "Момент перехода риска. Внутреннее enum-поле."
          label: "С какого момента"
          required: true
          display_in_grid: true
          display_priority: 2

        - name: "risk_bearer"
          type: "string"
          presentation: "fact"
          label: "Кто несёт риск"
          description: >
            Кто несёт риск (хранитель / поклажедатель). Fallback: "Не установлено" / "Не удалось определить".
          required: true
          display_in_grid: true
          display_priority: 3

        - name: "risk_transfer_details"
          type: "string"
          presentation: "fact"
          label: "Формулировка о риске"
          description: >
            Формулировка момента перехода риска из договора. Fallback: "Не установлено" / "Не удалось определить".
          required: true
          display_in_grid: true
          display_priority: 4

      store_payload: true

  - id: depositor_inspection_right
    name: "Право поклажедателя проверять состояние вещи (ст. 891 ГК РФ)"
    description: >
      Фактографическая проверка права поклажедателя проверять состояние
      и условия хранения вещи, доступа к месту хранения. Правовой ориентир —
      ст. 891 ГК РФ (обязанность хранителя обеспечить сохранность вещи;
      право проверки вытекает из существа обязательства и обычно
      закрепляется в договоре).
    triggers: {}
    ui_mode: "field_extraction"
    severity: "medium"
    severity_if_pass: "pass"
    severity_if_fail: "medium"
    severity_if_unclear: "low"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "право проверки"
        - "доступ к вещи"
        - "проверка состояния вещи"
        - "осмотр вещи"
        - "доступ на территорию"
        - "контроль хранения"
        - "ст. 891"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)(прав|возможност).*(провер|осмотр|доступ).*(вещ|хранени|территор)"
        - "(?i)доступ.*(месту|место).*хранени"
        - "(?i)ст\\.?\\s*891"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор хранения (ст. 891 ГК РФ).
        Проверяется один вопрос: право поклажедателя проверять состояние
        и условия хранения вещи, доступ к месту хранения.
        Нормативный ориентир:
        - ст. 891 ГК РФ — хранитель обязан принять все предусмотренные
          договором меры для обеспечения сохранности вещи. Право
          поклажедателя на проверку вытекает из существа обязательства
          и обычно прямо закрепляется в договоре.
        Важно:
        - Твоя задача — не оценивать серьёзность риска.
        - Только установить, что прямо есть в тексте договора, а чего прямо нет.
        - Не выводи право проверки из ст. 891 ГК РФ — фиксируй только то,
          что прямо написано в договоре.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Указано ли право поклажедателя проверять состояние вещи.
        2. Указан ли доступ к месту хранения.
        3. Указаны ли условия проверки (срок, порядок, периодичность).
        4. Указаны ли ограничения проверки.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Для отсутствующих данных:
          - сигнальные поля (inspection_right_status /
            access_right_status) → "not_defined";
          - текстовое поле (inspection_conditions_details) →
            "Данные не определены".
        3. Запрещено возвращать "None", "null", пустую строку "" или пропускать ключ.
        4. inspection_right_status = "yes" — если прямо указано право
          проверки / осмотра вещи; "no" — если прямо запрещено.
        5. access_right_status = "yes" — если прямо указан доступ
          к месту хранения; "no" — если прямо запрещён.
        6. inspection_conditions_details — порядок проверки (предварительное
          уведомление, периодичность, время, состав комиссии), ограничения.
        7. В evidence — только цитаты из документа, каждая с clause_ref.
        8. Верни ТОЛЬКО один валидный JSON-объект, пригодный для json.loads().
          Без markdown, без ```json, без комментариев, без текста до или после.

        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1 (полный):
        Фрагмент:
        "Поклажедатель вправе в любое время проверять состояние вещи
        и условия её хранения, а также иметь доступ к месту хранения
        при предварительном уведомлении Хранителя не менее чем за 1 рабочий
        день."
        Ответ:
        {
          "inspection_right_status": "yes",
          "access_right_status": "yes",
          "inspection_conditions_details": "проверка в любое время с предварительным уведомлением не менее чем за 1 рабочий день; доступ к месту хранения",
          "evidence": [
            {
              "clause_ref": "п. X.Y",
              "quote": "Поклажедатель вправе в любое время проверять состояние вещи и условия её хранения, а также иметь доступ к месту хранения при предварительном уведомлении Хранителя не менее чем за 1 рабочий день."
            }
          ]
        }

        Пример 2 (только проверка без доступа):
        Фрагмент:
        "Поклажедатель вправе требовать предоставления отчёта о состоянии
        вещи не реже одного раза в месяц."
        Ответ:
        {
          "inspection_right_status": "yes",
          "access_right_status": "no",
          "inspection_conditions_details": "проверка через отчёт о состоянии вещи, не реже 1 раза в месяц",
          "evidence": [
            {
              "clause_ref": "п. X.Y",
              "quote": "Поклажедатель вправе требовать предоставления отчёта о состоянии вещи не реже одного раза в месяц."
            }
          ]
        }

        Пример 3 (запрет проверки):
        Фрагмент:
        "Доступ Поклажедателя к месту хранения не допускается."
        Ответ:
        {
          "inspection_right_status": "not_defined",
          "access_right_status": "no",
          "inspection_conditions_details": "доступ Поклажедателя к месту хранения не допускается",
          "evidence": [
            {
              "clause_ref": "п. X.Y",
              "quote": "Доступ Поклажедателя к месту хранения не допускается."
            }
          ]
        }

        Пример 4 (ничего не указано):
        Фрагмент:
        "Хранитель принимает вещь Поклажедателя на хранение."
        Ответ:
        {
          "inspection_right_status": "not_defined",
          "access_right_status": "not_defined",
          "inspection_conditions_details": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Указано ли право проверки / осмотра вещи?
        2. Указан ли доступ к месту хранения?
        3. Приведены ли условия проверки (срок, порядок, периодичность)?
        4. Выведено ли право из текста договора, а не из ст. 891 ГК РФ?
        5. Проверь, что все 4 ключа (3 поля + evidence) присутствуют в JSON.
        6. Если ничего нет — "not_defined" для сигнальных полей
          и "Данные не определены" для текстового.
        7. Убедись, что ответ — валидный JSON, пригодный для json.loads().
        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "inspection_right_status": "<yes / no / not_defined>",
          "access_right_status": "<yes / no / not_defined>",
          "inspection_conditions_details": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 600
    retrieval:
      retrieval_profile: "scope_of_work_check"
      corpus_scope: "primary_segment"
