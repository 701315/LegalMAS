  - id: professional_custodian_liability
    name: "Ответственность хранителя: основание, объём, лимит (ст. 901, 902 ГК РФ)"
    description: >
      Фактографическая проверка условий ответственности хранителя за утрату,
      недостачу и повреждение вещи: основание ответственности (независимо от вины
      для профессионального хранителя), объём (полная стоимость / заявленная / лимит),
      исключение непреодолимой силы. Попытка ограничить ответственность
      профессионального хранителя «только при наличии вины» противоречит
      ст. 901 ГК РФ и ничтожна (ст. 168, 422 ГК РФ).
    triggers:
      any: ["professional_custodian"]
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "независимо от вины"
        - "полная материальная ответственность"
        - "профессиональный хранитель отвечает"
        - "возмещение полной стоимости"
        - "за исключением непреодолимой силы"
        - "ст. 901"
        - "ответственность за утрату"
        - "ответственность за повреждение"
        - "только при наличии вины"
        - "ограничение ответственности суммой вознаграждения"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)хранитель.*несёт.*ответственност.*независимо.*от.*вины"
        - "(?i)ст\\.?\\s*901"
        - "(?i)ответственност.*за.*(утрат|поврежден|недостач)"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор хранения (ст. 901, 902 ГК РФ).
        Проверяется только один вопрос: основание, объём и лимит ответственности
        хранителя за утрату, недостачу и повреждение вещи.
        Нормативные ориентиры:
        - ст. 901 ГК РФ — ответственность профессионального хранителя
          независимо от вины (императивная норма);
        - ст. 902 ГК РФ — размер ответственности;
        - ст. 168, 422 ГК РФ — ничтожность условия, противоречащего
          императивной норме.
        Важно:
        - Твоя задача — не оценивать серьёзность риска.
        - Только установить, что прямо есть в тексте договора, а чего прямо нет.
        - Формулировки «отвечает только при наличии вины» для профессионального
          хранителя противоречат ст. 901 ГК РФ — фиксируй как факт, но не выводи
          сам, а только если это прямо написано в договоре.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Основание ответственности (независимо от вины / только при вине / смешанная).
        2. Объём ответственности (полная стоимость / заявленная / сумма понижения /
          лимитированная).
        3. Исключение для непреодолимой силы.
        4. Наличие лимита (cap) ответственности.
        5. Формулировку об ответственности за утрату, недостачу и повреждение.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Для отсутствующих данных:
          - сигнальные поля (basis / scope / yes-no) → "not_defined";
          - текстовое поле (loss_damage_liability_details) → "Данные не определены".
        3. Запрещено возвращать "None", "null", пустую строку "" или пропускать ключ.
        4. liability_basis = "fault_based" только если прямо сказано
          «отвечает только при наличии вины» или аналогично. Не выводи
          ответственность из ст. 901 ГК РФ — только из текста.
        5. liability_scope = "depreciation_amount" — если объём определён
          как сумма, на которую понизилась стоимость вещи (ст. 902 п. 1 ГК РФ).
        6. liability_scope = "limited" — если прямо указан потолок (cap) суммы
          возмещения (например, «не более суммы вознаграждения»).
        7. liability_cap_present = "yes" — если прямо указан потолок суммы.
          Конкретное значение потолка фиксируй в evidence.
        8. В evidence — только цитаты из документа, каждая с clause_ref.
        9. Верни ТОЛЬКО один валидный JSON-объект, пригодный для json.loads().
          Без markdown, без ```json, без комментариев, без текста до или после.

        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1:
        Фрагмент:
        "Хранитель несёт ответственность за утрату, недостачу и повреждение
        вещи независимо от вины, за исключением случаев непреодолимой силы.
        Возмещение производится в размере полной стоимости вещи."
        Ответ:
        {
          "liability_basis": "strict",
          "liability_scope": "full_value",
          "force_majeure_exception": "yes",
          "liability_cap_present": "no",
          "loss_damage_liability_details": "ответственность за утрату, недостачу и повреждение независимо от вины",
          "evidence": [
            {
              "clause_ref": "п. 5.1",
              "quote": "Хранитель несёт ответственность за утрату, недостачу и повреждение вещи независимо от вины, за исключением случаев непреодолимой силы."
            }
          ]
        }

        Пример 2:
        Фрагмент:
        "Хранитель отвечает только при наличии вины."
        Ответ:
        {
          "liability_basis": "fault_based",
          "liability_scope": "not_defined",
          "force_majeure_exception": "not_defined",
          "liability_cap_present": "not_defined",
          "loss_damage_liability_details": "отвечает только при наличии вины",
          "evidence": [
            {
              "clause_ref": "п. 5.1",
              "quote": "Хранитель отвечает только при наличии вины."
            }
          ]
        }

        Пример 3 (частичные данные):
        Фрагмент:
        "Хранитель возмещает Поклажедателю убытки в размере, не превышающем
        сумму вознаграждения Хранителя за соответствующий период."
        Ответ:
        {
          "liability_basis": "not_defined",
          "liability_scope": "limited",
          "force_majeure_exception": "not_defined",
          "liability_cap_present": "yes",
          "loss_damage_liability_details": "возмещение убытков в размере, не превышающем сумму вознаграждения",
          "evidence": [
            {
              "clause_ref": "п. 5.3",
              "quote": "Хранитель возмещает Поклажедателю убытки в размере, не превышающем сумму вознаграждения Хранителя за соответствующий период."
            }
          ]
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Определено ли основание ответственности — независимо от вины или по вине?
        2. Указана ли в тексте формулировка «только при наличии вины»
          или аналогичная?
        3. Определён ли объём ответственности — полная стоимость / заявленная /
          сумма понижения / лимит?
        4. Есть ли исключение для непреодолимой силы?
        5. Указан ли в тексте потолок (cap) суммы возмещения?
        6. Проверь, что все 6 ключей (5 полей + evidence) присутствуют в JSON.
        7. Если ничего нет — "not_defined" для сигнальных полей
          и "Данные не определены" для текстового.
        8. Убедись, что ответ — валидный JSON, пригодный для json.loads().
        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "liability_basis": "<strict / fault_based / mixed / not_defined>",
          "liability_scope": "<full_value / declared_value / depreciation_amount / limited / not_defined>",
          "force_majeure_exception": "<yes / no / not_defined>",
          "liability_cap_present": "<yes / no / not_defined>",
          "loss_damage_liability_details": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 10
      temperature: 0.0
      max_tokens: 800
