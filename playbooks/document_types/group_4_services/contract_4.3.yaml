        - "(?i)договор\\s+транспортн[ойого\\s]*экспедиц[иии]"
        - "(?i)договор\\s+транспортно-?экспедиционн[огоого\\s]*обслуживан[ияия]"
        - "(?i)договор\\s+тэо\\b"
        - "(?i)договор\\s+на\\s+организац[июии]\\s+перевозок"
        - "(?i)логистическ[ийое]\\s+контракт"
        - "(?i)договор\\s+экспедиторск[огоое]\\s+обслуживан[ияия]"
        - "(?i)договор\\s+с\\s+логистическ[имим]\\s+оператор[ом]"
        - "(?i)3pl\\s+договор"
        - "(?i)договор\\s+экспедирован[ияи]"
        - "(?i)экспедитор[а-я]*"
        - "(?i)экспедирован[иеи]"
        - "(?i)организац[ияи]\\s+перевозк[ии]\\s+груз[аов]"
        - "(?i)экспедиторск[иеих]\\s+услуг[и]"
        - "(?i)транспортно-экспедиционн[аяое]\\s+деятельност[ьи]"
        - "(?i)поручен[иеия]\\s+экспедитор[у]"
        - "(?i)экспедиторск[аяое]\\s+расписк[аыу]"
        - "(?i)вознагражден[иеия]\\s+экспедитор[ауы]"

      medium:
        - "клиент экспедитора"
        - "транспортно-экспедиционные услуги"
        - "ТЭУ"
        - "логистика"
        - "возмещение расходов"
        - "выбор перевозчика"
        - "таможенное оформление"
        - "логистический оператор"
        - "3PL"
        - "складская расписка"

      low:
        - "страхование груза"
        - "упаковка"
        - "мультимодальные перевозки"
        - "экспедиторское свидетельство"
        - "трекинг груза"
        - "консолидация"

    exclusions:
