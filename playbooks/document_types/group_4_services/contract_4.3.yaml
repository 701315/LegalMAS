# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 7: DD_REQUEST_TEMPLATES
#  Читается: DDRequestTemplateLoader
#  Ключи = check_id из checks_v8 и doc_type_checks выше.
#  DDRequestTemplateLoader.render() матчит по exact или prefix.
# ════════════════════════════════════════════════════════════════════════════

dd_request_templates:

  forwarding_subject_extraction:
    text: >
      Просим подтвердить по {doc_names}: (а) полный перечень экспедиторских услуг;
      (б) маршрут/направления; (в) характеристики груза;
      (г) ссылку на Поручение экспедитору; (д) вид договора (разовый/рамочный).
    addressee: "Обе стороны"

  services_list:
    text: >
      Просим уточнить в {doc_names}: конкретный перечень экспедиторских услуг,
      стандарты качества, сроки выполнения.
    addressee: "Экспедитор"

  forwarding_receipt_check:
    text: >
      Просим уточнить в {doc_names}: (а) форму экспедиторской расписки;
      (б) порядок выдачи при приёме груза; (в) ссылку на Приказ № 23.
    addressee: "Экспедитор"

  forwarder_instructions_check:
    text: >
      Просим уточнить в {doc_names}: (а) форму Поручения экспедитору;
      (б) является ли оно неотъемлемой частью; (в) требования к содержанию;
      (г) порядок направления и подтверждения.
    addressee: "Обе стороны"

  liability_for_third_parties:
    text: >
      В {doc_names} ОБЯЗАТЕЛЬНО должно быть указано, что экспедитор отвечает
      за действия привлечённых третьих лиц (перевозчиков, таможенных брокеров)
      как за свои собственные (ст. 803, 805 ГК РФ). Просим включить/подтвердить
      наличие этого условия.
    addressee: "Юридический советник"

  forwarder_no_liability_for_third_parties:
    text: >
      КРИТИЧЕСКОЕ НАРУШЕНИЕ: в {doc_names} экспедитор не отвечает за третьих лиц.
      Это противоречит ст. 803 ГК РФ и ст. 7 ФЗ-87. Просим немедленно исправить.
    addressee: "Юридический советник"

  exclusions_from_liability:
    text: >
      Просим согласовать в {doc_names}: перечень обстоятельств, освобождающих
      от ответственности (непреодолимая сила, вина клиента, действия госорганов).
    addressee: "Юридический советник"

  remuneration_and_expenses_check:
    text: >
      Просим подтвердить по {doc_names}: (а) размер вознаграждения экспедитора;
      (б) порядок возмещения расходов; (в) наличие лимитов расходов;
      (г) процедуру согласования превышений; (д) авансирование.
    addressee: "Обе стороны"

  remuneration_and_expenses:
    text: >
      Просим уточнить в {doc_names}: вознаграждение, порядок оплаты, возмещение расходов.
    addressee: "Обе стороны"

  expenses_approval_mechanism:
    text: >
      Просим включить в {doc_names}: механизм предварительного согласования расходов,
      превышающих установленный лимит.
    addressee: "Юридический советник клиента"

  expenses_limit:
    text: >
      Просим согласовать в {doc_names}: максимальный лимит расходов экспедитора,
      последствия превышения.
    addressee: "Обе стороны"

  forwarder_report:
    text: >
      Просим уточнить в {doc_names}: (а) форму отчёта экспедитора;
      (б) сроки представления; (в) приложения (документы, подтверждающие расходы);
      (г) порядок утверждения.
    addressee: "Обе стороны"

  report_approval_mechanism:
    text: >
      Просим включить в {doc_names}: механизм «молчаливого согласия» — отчёт
      считается утверждённым при отсутствии возражений в течение N дней.
    addressee: "Юридический советник экспедитора"

  cargo_insurance_obligation:
    text: >
      Просим уточнить в {doc_names}: (а) обязательность страхования груза;
      (б) кто страхует (экспедитор/клиент); (в) вид покрытия (all risks / named perils);
      (г) минимальную страховую сумму; (д) выгодоприобретателя.
    addressee: "Обе стороны"

  cargo_insurance:
    text: >
      Просим уточнить в {doc_names}: условия страхования груза, кто несёт расходы.
    addressee: "Обе стороны"

  carrier_selection_approval:
    text: >
      Просим включить в {doc_names}: механизм согласования выбора перевозчика,
      критерии выбора, раскрытие аффилированности, право клиента на вето.
    addressee: "Юридический советник клиента"

  customs_liability_allocation:
    text: >
      В {doc_names} предусмотрено таможенное оформление. Просим подтвердить:
      (а) статус таможенного брокера; (б) распределение ответственности за штрафы;
      (в) ответственность за недостоверные данные клиента.
    addressee: "Обе стороны"

  customs_clearance_without_broker_status:
    text: >
      ВНИМАНИЕ: в {doc_names} предусмотрено таможенное оформление, но статус
      таможенного брокера не подтверждён. Просим предоставить подтверждение
      включения в реестр таможенных брокеров (ст. 12 ТК ЕАЭС).
    addressee: "Экспедитор"

  lien_right_on_cargo:
    text: >
      Просим уточнить в {doc_names}: (а) право удержания груза при неоплате;
      (б) порядок реализации удержанного; (в) распределение расходов на хранение.
    addressee: "Юридический советник"

  lien_right:
    text: >
      Просим уточнить в {doc_names}: право удержания груза, порядок реализации.
    addressee: "Юридический советник"

  unilateral_refusal_penalty:
    text: >
      Просим уточнить в {doc_names}: (а) право клиента на односторонний отказ;
      (б) штраф 10% от стоимости услуг (ст. 806 ГК РФ, ст. 6 ФЗ-87);
      (в) возмещение фактических расходов; (г) срок уведомления.
    addressee: "Юридический советник"

  pretension_order:
    text: >
      Просим согласовать в {doc_names}: претензионный порядок, сроки претензий,
      форму, порядок рассмотрения.
    addressee: "Юридический советник"

  limitation_period:
    text: >
      Просим включить в {doc_names}: указание на срок исковой давности (1 год).
    addressee: "Юридический советник"

  parties_identification:
    text: >
      Просим подтвердить полные реквизиты сторон по {doc_names}: наименование,
      ИНН, ОГРН, адрес, статус экспедитора.
    addressee: "Обе стороны"

  client_documents_provision:
    text: >
      Просим включить в {doc_names}: обязанность клиента своевременно предоставлять
      полный комплект документов, ответственность за достоверность сведений,
      право экспедитора приостановить исполнение при непредоставлении.
    addressee: "Юридический советник экспедитора"

  forwarder_license_sro:
    text: >
      Просим предоставить по {doc_names}: подтверждение статуса экспедитора
      (включение в реестр экспедиторов по ст. 2 ФЗ-87).
    addressee: "Экспедитор"

  forwarder_license_absent:
    text: >
      Просим предоставить подтверждение статуса экспедитора по {doc_names}
      (ст. 2 ФЗ-87).
    addressee: "Экспедитор"

  service_period:
    text: >
      Просим уточнить в {doc_names}: срок действия договора, условия продления.
    addressee: "Обе стороны"

  dispute_resolution:
    text: >
      Просим согласовать в {doc_names}: подсудность, претензионный порядок.
    addressee: "Юридический советник"

  confidentiality:
    text: >
      Просим включить в {doc_names}: условие о конфиденциальности коммерческих условий.
    addressee: "Юридический советник"

  vat_and_tax:
    text: >
      Просим уточнить в {doc_names}: режим НДС, порядок документооборота.
    addressee: "Бухгалтерия"

  auto_renewal:
    text: >
      Просим уточнить в {doc_names}: условия автопролонгации, срок уведомления о непродлении.
    addressee: "Юридический советник"

  anticorruption_clause:
    text: >
      Просим включить в {doc_names} антикоррупционную оговорку (ФЗ-273).
    addressee: "Юридический советник"

  liability_limits_and_cargo_value_check:
    text: >
      Просим предоставить по {doc_names}: условия ответственности за утрату/повреждение 
      груза, лимит ответственности, механизм объявления ценности, соответствие 
      лимита требованиям ст. 7 ФЗ-87, а также ответственность за просрочку.
    addressee: "Юридический советник"

  liability_cap_and_declared_value:
    text: >
      Просим уточнить в {doc_names}: лимит ответственности за утрату/повреждение груза,
      порядок объявления ценности, соответствие ст. 7 ФЗ-87.
    addressee: "Юридический советник"

  liability_cap_below_statutory:
    text: >
      В {doc_names} выявлен лимит ответственности, потенциально ниже установленного 
      ст. 7 ФЗ-87. Просим привести в соответствие или обосновать.
    addressee: "Юридический советник"

  delivery_deadline_and_delay_penalty_check:
    text: >
      Просим предоставить по {doc_names}: срок доставки (или порядок его определения),
      санкции за просрочку, лимит неустойки, исключения для форс-мажора.
    addressee: "Обе стороны"

  delivery_deadline:
    text: >
      Просим уточнить в {doc_names}: конкретный срок доставки или порядок его определения
      в Поручении экспедитору.
    addressee: "Обе стороны"

  delay_penalty:
    text: >
      Просим включить/уточнить в {doc_names}: неустойку за просрочку доставки,
      размер, лимит и порядок расчёта.
    addressee: "Юридический советник клиента"

  no_delivery_deadline_specified:
    text: >
      В {doc_names} не выявлен срок доставки. Просим установить конкретный срок 
      или порядок его определения, а также санкции за просрочку (ст. 9 ФЗ-87).
    addressee: "Юридический советник"

  forwarder_information_duties_check:
    text: >
      Просим предоставить по {doc_names}: перечень информационных обязанностей экспедитора,
      включая уведомление о задержках, повреждениях, статусе доставки, 
      а также сроки и способы уведомления.
    addressee: "Юридический советник клиента"

  information_duties_forwarder:
    text: >
      Просим включить в {doc_names}: обязанности экспедитора по информированию 
      о задержках, проблемах, статусе доставки.
    addressee: "Юридический советник"

  dangerous_cargo_duties_check:
    text: >
      По {doc_names} (опасный груз) просим предоставить: обязанности клиента 
      по раскрытию класса опасности, маркировке, упаковке, аварийной карточке;
      обязанности экспедитора по выбору сертифицированного перевозчика;
      ответственность за нераскрытие свойств.
    addressee: "Обе стороны"

  dangerous_cargo_obligations:
    text: >
      Просим включить в {doc_names}: обязанности по раскрытию опасных свойств груза,
      маркировке, упаковке и наличию разрешений (ДОПОГ/ADR).
    addressee: "Юридический советник"

  dangerous_cargo_client_duties_absent:
    text: >
      В {doc_names} выявлен риск отсутствия обязанностей клиента по раскрытию 
      опасных свойств груза. Просим немедленно включить.
    addressee: "Юридический советник"

  cmr_incoterms_reference:
    text: >
      По {doc_names} (международная экспедиция) просим подтвердить применимость 
      CMR/КДПГ, указать базис Инкотермс, распределение рисков и расходов.
    addressee: "Обе стороны"

  sla_kpi_terms:
    text: >
      Просим включить в {doc_names}: измеримые показатели качества (SLA/KPI),
      методику измерения, последствия нарушения, отчётность.
    addressee: "Обе стороны"

  acceptance_and_delivery_acts:
    text: >
      Просим уточнить в {doc_names}: форму актов приёма-передачи груза,
      порядок фиксации повреждений, сроки подписания.
    addressee: "Обе стороны"

  force_majeure_clause:
    text: >
      Просим согласовать в {doc_names}: перечень обстоятельств непреодолимой силы,
      порядок уведомления и подтверждения.
    addressee: "Юридический советник"
    
  # Generic fallback
  _default:
    text: >
      Просим предоставить дополнительную информацию по вопросу «{check_name}»
      применительно к {doc_names}.
    addressee: "Юридический советник"
    