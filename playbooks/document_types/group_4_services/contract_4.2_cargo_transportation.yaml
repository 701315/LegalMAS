  - id: vat_and_tax
    name: "НДС и налоговые оговорки"
    description: >
      Проверяет налоговые аспекты провозной платы: включён ли НДС,
      выделена ли ставка, применяется ли ставка 0% для международной
      перевозки и как это сформулировано в договоре.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "medium"
    severity_if_pass: "pass"
    severity_if_fail: "medium"
    severity_if_unclear: "low"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "НДС"
        - "в том числе НДС"
        - "без НДС"
        - "ставка 0%"
        - "международная перевозка"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)\\bНДС\\b"
        - "(?i)ставк(а|у)\\s+0\\s*%"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по транспортным договорам.
        Анализируется договор перевозки груза.
        Проверяются только налоговые оговорки, связанные с провозной платой.

        [ЗАДАЧА]
        Установи:
        1. Упоминается ли НДС в тексте договора.
        2. Включён ли НДС в цену или цена указана без НДС.
        3. Есть ли указание на ставку 0%.
        4. Указан ли конкретный размер ставки.
        5. Есть ли привязка к международной перевозке.

        [ПРАВИЛА]
        1. Используй только текст договора.
        2. Не подставляй налоговый режим из закона.
        3. Если НДС не упомянут, vat_mentioned = no и vat_included = not_found.
        4. Если прямо сказано "в том числе НДС", vat_included = yes.
        5. Если прямо сказано "без НДС", vat_included = no.
        6. Если прямо сказано "ставка 0%", vat_included = zero_rate.

        [ФОРМАТ ОТВЕТА]
        {
          "vat_mentioned": "<yes / no>",
          "vat_included": "<yes / no / zero_rate / not_applicable / not_found>",
          "vat_rate": "<текст / not_found>",
          "international_tax_reference": "<yes / no / not_found>"
        }
      context_k: 4
      temperature: 0.0
      max_tokens: 650
    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "НДС в том числе НДС без НДС ставка 0% международная перевозка VAT tax"
      preferred_unit_types:
        - payment_term
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - boilerplate
      negative_keywords:
        - "претензия"
        - "форс-мажор"
        - "коммерческий акт"
      position_bias:
        preferred_range: [0.0, 0.80]
        boost: 0.15
        scope: auto
      retrieval_profile: "tax_check"
      context_k: 4
      max_chunks: 6
      rerank: true
    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
        - "invoice"
      preferred_clause_functions:
        - "obligations"
        - "boilerplate"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10
    evidence:
      required: true
      min_snippet_length: 15
      max_snippet_length: 300
    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 700
      compact_output: false
      llm_prompt_extraction: |
        <role>
        Ты — российский юрист по транспортным договорам.
        Извлеки только налоговые условия, связанные с НДС.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни:
        - vat_mentioned: yes / no
        - vat_included: yes / no / zero_rate / not_applicable / not_found
        - vat_rate: текст ставки или "not_defined"
        - international_tax_reference: yes / no / not_found

        Ответ верни строго в JSON.
        </task>

        <rules>
        - Не подставляй налоговые последствия из закона.
        - Если НДС не упомянут, не пытайся выводить его косвенно.
        </rules>
