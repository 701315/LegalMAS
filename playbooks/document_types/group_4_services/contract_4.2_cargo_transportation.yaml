        и при просрочке доставки (ст. 797 ГК РФ, УАТ, КТМ и иные уставы).

        Общий претензионный порядок (форма, обязательность до суда, общий срок)
        НЕ проверяется в этом check-е — он покрыт отдельной проверкой.

        Нормативный ориентир:
        - ст. 797 ГК РФ
        - УАТ (ФЗ-259)
        - КТМ, КВВТ, УЖТ, ВК

        [ЗАДАЧА]
        Установи:
        1. Есть ли в договоре отдельный срок предъявления претензии при утрате или повреждении груза.
        2. Есть ли в договоре отдельный срок предъявления претензии при просрочке доставки.
        3. Есть ли общий срок предъявления претензии (если он специально выделен для транспортных споров).
        4. Есть ли срок ответа на претензию (если он специально выделен для транспортных споров).
        5. Приведи точную цитату из договора.
        6. Сформируй user-friendly значения для отображения в DD Grid.

        [ПРАВИЛА]
        1. Используй только текст договора.
        2. Не подставляй сроки из закона (ст. 797 ГК РФ, УАТ), если их нет в договоре.
        3. Не путай общий претензионный порядок с транспортной спецификой сроков.
        4. Если срок только общий (без разделения на утрату/просрочку) — фиксируй его в claim_deadline, а отдельные сроки = "not_defined".
        5. Если в договоре есть отдельные сроки для утраты/просрочки — фиксируй их в соответствующих полях.
        6. Не используй "None", "null" или пустые строки — используй "not_defined".
        7. В pretension_snippet включай только цитату из договора.
        8. Для *_display полей используй понятные русские формулировки:
