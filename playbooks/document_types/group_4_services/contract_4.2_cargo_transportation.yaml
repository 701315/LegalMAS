  - id: delivery_delay_penalty
    name: "Штрафы за просрочку доставки (ст. 793 ГК РФ, УАТ ст. 34)"
    description: >
      Проверяет наличие договорной или воспроизводимой законной неустойки
      за просрочку доставки груза, а также порядок расчёта санкции.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "штраф за просрочку доставки"
        - "неустойка за задержку"
        - "пеня за нарушение срока"
        - "за каждый день просрочки"
        - "возмещение убытков от задержки"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)неустойк(а|и|у).*за.*(задержк|просрочк).*доставк"
        - "(?i)штраф.*за.*(задержк|просрочк).*доставк"
        - "(?i)\\d+.*%.*за.*каждый.*день"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по транспортным договорам.
        Анализируется договор перевозки груза.
        Проверяется только ответственность за просрочку доставки.

        Нормативный ориентир:
        - ст. 793 ГК РФ
        - УАТ ст. 34 и иные специальные нормы

        [ЗАДАЧА]
        Установи:
        1. Есть ли в договоре санкция за просрочку доставки.
        2. Является ли она договорной или просто воспроизводит закон.
        3. Как считается санкция.
        4. Есть ли лимит/предел санкции.
        5. Приведи точную цитату из договора.
        6. Сформируй user-friendly значения для отображения в DD Grid.

        [ПРАВИЛА]
        1. Используй только текст договора.
        2. Не подставляй законную неустойку, если текст её не воспроизводит.
        3. Если в тексте есть только общая ответственность без механики, delay_penalty_present может быть yes, а delay_penalty_rate — not_defined.
        4. Не путай неустойку за просрочку доставки с санкциями за неподачу транспорта.
        5. В delay_penalty_snippet включай только цитату из договора.
        6. Для *_display полей используй понятные русские формулировки:
          - delay_penalty_present: yes → "Предусмотрена", no → "Не предусмотрена", not_defined → "Не указано"
          - penalty_type: contractual → "Договорная", statutory → "Законная", not_defined → "Не определён"
        7. Верни РОВНО один JSON-объект со всеми 7 ключами без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — договорная неустойка с лимитом:
        Фрагмент:
        "За нарушение срока доставки груза Перевозчик уплачивает Грузоотправителю неустойку в размере 0,1% от стоимости перевозки за каждый день просрочки, но не более 10% от стоимости перевозки."

        Ответ:
        {
          "delay_penalty_present": "yes",
          "delay_penalty_rate": "0,1% от стоимости перевозки за каждый день просрочки",
          "delay_penalty_cap": "не более 10% от стоимости перевозки",
          "penalty_type": "contractual",
          "delay_penalty_snippet": "За нарушение срока доставки груза Перевозчик уплачивает Грузоотправителю неустойку в размере 0,1% от стоимости перевозки за каждый день просрочки, но не более 10% от стоимости перевозки.",
          "delay_penalty_present_display": "Предусмотрена",
          "penalty_type_display": "Договорная"
        }

        Пример 2 — санкция не упомянута:
        Фрагмент:
        "Перевозчик обязуется доставить груз в пункт назначения в установленный срок."

        Ответ:
        {
          "delay_penalty_present": "not_defined",
          "delay_penalty_rate": "not_defined",
          "delay_penalty_cap": "not_defined",
          "penalty_type": "not_defined",
          "delay_penalty_snippet": "not_defined",
          "delay_penalty_present_display": "Не указано",
          "penalty_type_display": "Не определён"
        }

        Пример 3 — текст есть, но вывод невозможен (размытая формулировка без конкретики):
        Фрагмент:
        "Перевозчик несёт ответственность за нарушение сроков доставки в соответствии с действующим законодательством."

        Ответ:
        {
          "delay_penalty_present": "yes",
          "delay_penalty_rate": "not_defined",
          "delay_penalty_cap": "not_defined",
          "penalty_type": "statutory",
          "delay_penalty_snippet": "Перевозчик несёт ответственность за нарушение сроков доставки в соответствии с действующим законодательством.",
          "delay_penalty_present_display": "Предусмотрена",
          "penalty_type_display": "Законная"
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        Перед ответом внутренне проверь:
        1. Есть ли прямая цитата о неустойке за просрочку доставки.
        2. Не перепутана ли неустойка за просрочку доставки с санкциями за неподачу транспорта.
        3. Соответствуют ли значения допустимым словарям.
        4. Если прямого указания нет — верни "not_defined".
        5. Все 7 ключей присутствуют в JSON.

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь РОВНО одним JSON-объектом без какого-либо дополнительного текста до или после, со всеми 7 ключами:
        {
          "delay_penalty_present": "<yes / no / not_defined>",
          "delay_penalty_rate": "<формула/ставка или not_defined>",
          "delay_penalty_cap": "<предел санкции или not_defined>",
          "penalty_type": "<contractual / statutory / not_defined>",
          "delay_penalty_snippet": "<точная цитата или not_defined>",
          "delay_penalty_present_display": "<Предусмотрена / Не предусмотрена / Не указано>",
          "penalty_type_display": "<Договорная / Законная / Не определён>"
        }
      context_k: 5
      temperature: 0.0
      max_tokens: 700
    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "штраф за просрочку доставки неустойка за задержку пеня за нарушение срока за каждый день просрочки возмещение убытков от задержки"
      preferred_unit_types:
        - liability_provision
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - remedies
        - limitations
      negative_keywords:
        - "провозная плата"
        - "претензия"
        - "форс-мажор"
        - "неподача транспорта"
      position_bias:
        preferred_range: [0.2, 0.95]
        boost: 0.20
        scope: auto
      retrieval_profile: "liability_cap_check"
      context_k: 5
      max_chunks: 7
      rerank: true
    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
        - "invoice"
      preferred_clause_functions:
        - "remedies"
        - "limitations"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10
    evidence:
      required: true
      min_snippet_length: 20
      max_snippet_length: 450
    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1100

      compact_output: false

      presence_signal:
        field: "delivery_delay_penalty_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист по транспортным договорам.
        Извлеки только условия о санкциях за просрочку доставки груза.
        Не анализируй санкции за неподачу транспорта под погрузку, простой, иные нарушения и разделы.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. delivery_delay_penalty_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если delay_penalty_present ∈ {"yes", "no"};
           - "missing" — если delay_penalty_present = "not_defined"
             и фрагментов об ответственности за просрочку доставки в контексте нет;
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - delay_penalty_present = "not_defined";
           - delay_penalty_rate = "not_defined";
           - delay_penalty_cap = "not_defined";
           - penalty_type = "not_defined";
           - delay_penalty_snippet = "not_defined";
           - все *_display = соответствующий fallback;
           - не выполняй остальные шаги.

        1. delay_penalty_present:
           - "yes" — если санкция за просрочку доставки прямо предусмотрена;
           - "no" — если договор прямо исключает ответственность перевозчика за задержку доставки;
           - "not_defined" — если ответственность прямо не упомянута.

        2. delay_penalty_rate:
           Ставка или формула расчёта неустойки (например: "0,1% от стоимости фрахта за каждый день").
           Если ставка не названа — "not_defined".

        3. delay_penalty_cap:
           Предел/максимальный размер неустойки (например: "не более 10% от цены перевозки").
           Если не установлен — "not_defined".

        4. penalty_type:
           - "contractual" — если условия неустойки договорные (отличаются от законных);
           - "statutory" — если договор просто дублирует/воспроизводит законную ставку;
           - "not_defined" — если тип санкции неясен или условие отсутствует.

        5. delay_penalty_snippet:
           Точная цитата из договора о санкциях за задержку доставки. Если нет — "not_defined".

        6. delay_penalty_present_display:
           "Предусмотрена" / "Не предусмотрена" / "Не указано".

        7. penalty_type_display:
           "Договорная" / "Законная" / "Не определён".
        </task>

        <context_rules>
        - Перед остальными полями заполни delivery_delay_penalty_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все поля = "not_defined" / соответствующий fallback.
        - Не смешивай задержку доставки с санкциями за неподачу ТС под погрузку или за демередж (простой ТС).
        - Прямое исключение ответственности (delay_penalty_present = "no") — это presence = "present", а не "missing".
        - Не используй "None", "null" или пустые строки.
        - Все 7 ключей должны присутствовать в JSON-ответе.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В договоре нет ни единого упоминания ответственности за нарушение срока доставки груза.
           → presence = "missing";
             delay_penalty_present = "not_defined";
             all other fields = "not_defined".

        2. Абстрактная законная ответственность.
           "Перевозчик несёт ответственность за нарушение сроков доставки в соответствии с законодательством."
           → presence = "present";
             delay_penalty_present = "yes";
             penalty_type = "statutory";
             delay_penalty_rate = "not_defined".

        3. Противоречие между фрагментами.
           В одном месте пеня 0,1% за каждый час, в другом — 1% за день для одной и той же доставки.
           → presence = "unclear";
             delay_penalty_present = "yes";
             delay_penalty_rate = "Не удалось определить".

        4. Задержка доставки ≠ задержка подачи ТС.
           "За несвоевременную подачу ТС под погрузку перевозчик уплачивает штраф..."
           → presence = "missing";
             delay_penalty_present = "not_defined"
             (это санкция за неподачу ТС, а не за просрочку доставки груза).
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для delivery_delay_penalty_presence используй только: "present", "missing", "unclear".
        - Для delay_penalty_present используй только: "yes", "no", "not_defined".
        - Для penalty_type используй только: "contractual", "statutory", "not_defined".
        - Fallback при отсутствии данных:
          * все текстовые поля → "not_defined";
          * delay_penalty_present_display → "Не указано";
          * penalty_type_display → "Не определён".
        - Fallback при противоречии или неоднозначности:
          * все *_display → соответствующие fallback-строки.
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "delivery_delay_penalty_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие условий о штрафах за задержку доставки. Внутреннее агрегатное signal-поле."
          required: true

        - name: "delay_penalty_present"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Санкция за просрочку доставки предусмотрена. Внутреннее enum-поле."
          required: true
          display_in_grid: false
        - name: "delay_penalty_rate"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 1
          label: "Ставка неустойки"
          description: >
            Размер/формула неустойки. Fallback: "Не установлено" / "Не удалось определить".
          required: true
        - name: "delay_penalty_cap"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 2
          label: "Предел неустойки"
          description: >
            Предел санкции. Fallback: "Не установлено" / "Не удалось определить".
          required: true
        - name: "penalty_type"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["contractual", "statutory", "not_defined"]
          description: "Тип санкции. Внутреннее enum-поле."
          required: true
          display_in_grid: false
        - name: "delay_penalty_snippet"
          type: "string"
          presentation: "diagnostic"
          display_in_grid: false
          description: "Цитата о неустойке за просрочку доставки"
          required: true
        - name: "delay_penalty_present_display"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 3
          label: "Санкция за просрочку"
          description: >
            User-friendly отображение: предусмотрена ли санкция за просрочку доставки. Fallback: "Не установлено" / "Не удалось определить".
          required: true
        - name: "penalty_type_display"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 4
          label: "Тип санкции"
          description: >
            User-friendly отображение типа санкции (договорная/законная). Fallback: "Не установлено" / "Не удалось определить".
          required: true
      store_payload: true

  - id: vehicle_supply_penalty
    name: "Штраф за непредъявление груза / неподачу ТС (ст. 794 ГК РФ)"
    description: >
      Проверяет санкции для сторон за неподачу транспортного средства,
      непредъявление груза или неиспользование поданного транспорта.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "штраф за неподачу"
        - "штраф за непредъявление"
        - "неиспользование"
        - "отказ от заявки"
        - "неподача транспортных средств"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)штраф.*за.*(неподач|непредъявлен|неиспользован)"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по транспортным договорам.
        Анализируется договор перевозки груза.
        Проверяются санкции по ст. 794 ГК РФ за неподачу транспорта
        и непредъявление груза.

        [ЗАДАЧА]
        Установи:
        1. Есть ли санкция за неподачу ТС.
        2. Есть ли санкция за непредъявление груза.
        3. Есть ли общая ставка или отдельные ставки.
        4. Есть ли условия освобождения от этой санкции.
        5. Приведи точную цитату из договора.
        6. Сформируй user-friendly значения для отображения в DD Grid.

        [ПРАВИЛА]
        1. Используй только текст договора.
        2. Не путай эту санкцию с неустойкой за просрочку доставки.
        3. Если санкция только подразумевается, но не описана прямо — не додумывай.
        4. Если ставка не названа, но обязанность уплатить штраф есть — penalty_rate = "not_defined".
        5. Не используй "None", "null" или пустые строки — используй "not_defined".
        6. В vehicle_supply_penalty_snippet включай только цитату из договора.
        7. Для *_display полей используй понятные русские формулировки:
