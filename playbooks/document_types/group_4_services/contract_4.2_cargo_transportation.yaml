      regex_patterns:
        - "(?i)претенз(ия|ии|ионн)"
        - "(?i)досудебн(ый|ого)\\s+порядк"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по транспортным договорам.
        Анализируется договор перевозки груза.
        Проверяется только обязательный претензионный порядок.

        Нормативный ориентир:
        - ст. 797 ГК РФ

        [ЗАДАЧА]
        Установи:
        1. Есть ли в договоре обязательный претензионный порядок.
        2. Указан ли срок предъявления претензии.
        3. Указан ли срок ответа на претензию.
        4. Установлена ли письменная форма претензии.
        5. Связан ли доступ в суд с предварительным соблюдением претензионного порядка.
        6. Указан ли отдельный срок предъявления претензии при утрате или повреждении груза.
        7. Указан ли отдельный срок предъявления претензии при просрочке доставки.

        [ПРАВИЛА]
        1. Используй только текст договора.
        2. Не подставляй срок из закона, если его нет в договоре.
        3. Если есть общая фраза "споры решаются путём переговоров", это не всегда равно обязательному претензионному порядку.
        4. Если прямо сказано, что претензия обязательна до суда — mandatory_before_court = yes.
        5. Если это неясно — не додумывай.

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Есть ли прямое слово "претензия" или эквивалент.
        2. Есть ли прямой срок.
        3. Есть ли прямая связка "до обращения в суд".
        4. Если нет — ставь "not_defined".

        [ФОРМАТ ОТВЕТА]
        {
          "claim_procedure_present": "<yes / no / not_found>",
          "claim_deadline": "<срок / not_found>",
          "response_deadline": "<срок / not_found>",
          "claim_form": "<written / any / not_specified / not_found>",
          "mandatory_before_court": "<yes / no / not_found>",
          "claim_deadline_for_loss": "<количество дней или not_found>",
          "claim_deadline_for_delay": "<количество дней или not_found>"
        }
      context_k: 5
      temperature: 0.0
      max_tokens: 750
    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "претензионный порядок претензия досудебный порядок срок претензии ответ на претензию до обращения в суд срок претензии при утрате срок претензии при просрочке ст. 797"
      preferred_unit_types:
        - dispute_resolution
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - procedures
        - remedies
      negative_keywords:
        - "провозная плата"
        - "форс-мажор"
        - "страхование"
        - "качество груза"
      position_bias:
        preferred_range: [0.4, 1.0]
