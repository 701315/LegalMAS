      store_payload: true

  - id: freight_charge
    name: "Провозная плата и порядок расчётов (ст. 790 ГК РФ)"
    description: >
      Проверяет наличие размера провозной платы, тарифов, порядка оплаты,
      валюты расчётов и налоговых оговорок. Проверка предназначена для
      точного извлечения условий оплаты без подстановки диспозитивных норм
      закона вместо текста договора.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "провозная плата"
        - "стоимость перевозки"
        - "тариф"
        - "фрахт"
        - "цена перевозки"
        - "рублей"
        - "оплата"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)провозн(ая|ой)\\s+плат"
        - "(?i)стоимост(ь|и)\\s+перевозк"
        - "(?i)\\b\\d[\\d\\s]*(?:руб|рублей|₽|тыс|млн)"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по транспортным договорам.
        Анализируется договор перевозки груза по ст. 785–797 ГК РФ и применимым транспортным уставам.
        Проверяется только один вопрос: как в договоре урегулирована провозная плата и порядок расчётов.

        Нормативный ориентир:
        - ст. 790 ГК РФ

        Важно:
        - Твоя задача — не оценивать справедливость цены.
        - Твоя задача — только извлечь, что прямо сказано в тексте договора.
        - Не подставляй нормы закона вместо отсутствующего текста договора.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Установлен ли размер провозной платы / тарифа / фрахта.
        2. В какой валюте выражена цена.
        3. Включён ли НДС в цену или цена указана без НДС.
        4. Установлен ли срок оплаты.
        5. Какой порядок оплаты предусмотрен: предоплата, постоплата, частичная оплата или иной порядок.
        6. Приведи точную цитату из договора.
        7. Сформируй user-friendly значения для отображения в DD Grid.

        [ПРАВИЛА]
        1. Используй только текст договора.
        2. Не делай предположений на основании обычая делового оборота.
        3. Если условие прямо не сформулировано — возвращай "not_defined".
        4. Не заменяй отсутствие договорной цены ссылкой на "обычно взимаемую цену".
        5. Если в договоре есть несколько фрагментов, используй более конкретный и прямой.
        6. Если указано только "по тарифам перевозчика", это не является конкретной суммой, но является условием о порядке формирования цены:
          - freight_amount = "по тарифам перевозчика"
          - payment_method = "tariff_based"
        7. В freight_snippet включай только цитату из договора.
        8. Для *_display полей используй понятные русские формулировки:
          - freight_currency: RUB → "Рубли (RUB)", USD → "Доллары (USD)", EUR → "Евро (EUR)", other → "Иная валюта", not_defined → "Не указана"
          - price_includes_vat: yes → "Включён", no → "Не включён", zero_rate → "Нулевая ставка (0%)", not_defined → "Не указано"
          - payment_method: prepayment → "Предоплата", postpayment → "Постоплата", partial → "Частичная оплата", tariff_based → "По тарифам перевозчика", other → "Иной порядок", not_defined → "Не указан"
        9. Верни РОВНО один JSON-объект со всеми 9 ключами без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — все условия указаны:
        Фрагмент:
        "Провозная плата составляет 150 000 (Сто пятьдесят тысяч) рублей, включая НДС 20%. Оплата производится в течение 5 банковских дней с даты выставления счёта путём 100% предоплаты."

        Ответ:
        {
          "freight_amount": "150 000 рублей",
          "freight_currency": "RUB",
          "price_includes_vat": "yes",
          "payment_deadline": "5 банковских дней с даты выставления счёта",
          "payment_method": "prepayment",
          "freight_snippet": "Провозная плата составляет 150 000 (Сто пятьдесят тысяч) рублей, включая НДС 20%. Оплата производится в течение 5 банковских дней с даты выставления счёта путём 100% предоплаты.",
          "freight_currency_display": "Рубли (RUB)",
          "price_includes_vat_display": "Включён",
          "payment_method_display": "Предоплата"
        }

        Пример 2 — условия не упомянуты:
        Фрагмент:
        "Перевозчик обязуется доставить груз в пункт назначения."

        Ответ:
        {
          "freight_amount": "not_defined",
          "freight_currency": "not_defined",
          "price_includes_vat": "not_defined",
          "payment_deadline": "not_defined",
          "payment_method": "not_defined",
          "freight_snippet": "not_defined",
          "freight_currency_display": "Не указана",
          "price_includes_vat_display": "Не указано",
          "payment_method_display": "Не указан"
        }

        Пример 3 — текст есть, но вывод невозможен (размытая формулировка без конкретики):
        Фрагмент:
        "Стоимость перевозки определяется сторонами дополнительно для каждой перевозки."

        Ответ:
        {
          "freight_amount": "not_defined",
          "freight_currency": "not_defined",
          "price_includes_vat": "not_defined",
          "payment_deadline": "not_defined",
          "payment_method": "not_defined",
          "freight_snippet": "Стоимость перевозки определяется сторонами дополнительно для каждой перевозки.",
          "freight_currency_display": "Не указана",
          "price_includes_vat_display": "Не указано",
          "payment_method_display": "Не указан"
        }

        Пример 4 — тарифный метод:
        Фрагмент:
        "Провозная плата определяется по тарифам Перевозчика, действующим на дату перевозки. Оплата производится после завершения перевозки."

        Ответ:
        {
          "freight_amount": "по тарифам перевозчика",
          "freight_currency": "not_defined",
          "price_includes_vat": "not_defined",
          "payment_deadline": "после завершения перевозки",
          "payment_method": "tariff_based",
          "freight_snippet": "Провозная плата определяется по тарифам Перевозчика, действующим на дату перевозки. Оплата производится после завершения перевозки.",
          "freight_currency_display": "Не указана",
          "price_includes_vat_display": "Не указано",
          "payment_method_display": "По тарифам перевозчика"
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        Перед ответом внутренне проверь:
        1. Есть ли в тексте прямая сумма, тариф или формула цены.
        2. Есть ли прямая фраза про НДС.
        3. Есть ли прямая фраза о сроке и порядке оплаты.
        4. Если чего-то нет — не додумывай.
        5. Все 9 ключей присутствуют в JSON.

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь РОВНО одним JSON-объектом без какого-либо дополнительного текста до или после, со всеми 9 ключами:
        {
          "freight_amount": "<сумма / формула / not_defined>",
          "freight_currency": "<RUB / USD / EUR / other / not_defined>",
          "price_includes_vat": "<yes / no / zero_rate / not_defined>",
          "payment_deadline": "<срок / условие / not_defined>",
          "payment_method": "<prepayment / postpayment / partial / tariff_based / other / not_defined>",
          "freight_snippet": "<точная цитата или not_defined>",
          "freight_currency_display": "<Рубли (RUB) / Доллары (USD) / Евро (EUR) / Иная валюта / Не указана>",
          "price_includes_vat_display": "<Включён / Не включён / Нулевая ставка (0%) / Не указано>",
          "payment_method_display": "<Предоплата / Постоплата / Частичная оплата / По тарифам перевозчика / Иной порядок / Не указан>"
        }
      context_k: 5
      temperature: 0.0
      max_tokens: 700
    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "провозная плата стоимость перевозки тариф фрахт цена перевозки оплата НДС срок оплаты порядок оплаты"
      preferred_unit_types:
        - payment_term
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - procedures
        - boilerplate
      negative_keywords:
        - "претензия"
        - "исковая давность"
        - "форс-мажор"
        - "коммерческий акт"
      position_bias:
        preferred_range: [0.0, 0.80]
        boost: 0.25
        scope: auto
      retrieval_profile: "payment_terms_check"
      context_k: 5
      max_chunks: 8
      rerank: true
    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
        - "invoice"
        - "act"
      preferred_clause_functions:
        - "obligations"
        - "procedures"
        - "boilerplate"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10
    evidence:
      required: true
      min_snippet_length: 25
      max_snippet_length: 500
    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1100

      compact_output: false

      presence_signal:
        field: "freight_charge_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист по транспортным договорам.
        Твоя задача — извлечь из текста только условия о провозной плате и порядке расчётов.
        Не анализируй претензии, ответственность, форс-мажор, приёмку и иные разделы.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. freight_charge_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей (freight_amount, payment_deadline, payment_method)
             не равно "not_defined" (даже если цена указана по тарифам);
           - "missing" — если все эти поля равны "not_defined"
             и фрагментов о провозной плате или расчётах в контексте нет;
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - freight_amount = "not_defined";
           - freight_currency = "not_defined";
           - price_includes_vat = "not_defined";
           - payment_deadline = "not_defined";
           - payment_method = "not_defined";
           - freight_snippet = "not_defined";
           - все *_display = соответствующий fallback;
           - не выполняй остальные шаги.

        1. freight_amount:
           Размер провозной платы или способ её расчёта из текста договора
           (например: "150 000 рублей", "по тарифам перевозчика").
           Если не указан — "not_defined".

        2. freight_currency:
           - "RUB" — российские рубли;
           - "USD" — доллары США;
           - "EUR" — евро;
           - "other" — иная валюта;
           - "not_defined" — валюта прямо не указана.

        3. price_includes_vat:
           - "yes" — если НДС прямо включён в провозную плату;
           - "no" — если цена прямо указана без НДС / НДС начисляется сверху;
           - "zero_rate" — нулевая ставка (0%);
           - "not_defined" — вопрос НДС не урегулирован.

        4. payment_deadline:
           Срок оплаты из текста договора (например: "в течение 5 банковских дней с даты выставления счёта").
           Если не указан — "not_defined".

        5. payment_method:
           - "prepayment" — предоплата (аванс);
           - "postpayment" — постоплата;
           - "partial" — частичная оплата (аванс + окончательный расчёт);
           - "tariff_based" — плата рассчитывается по тарифам;
           - "other" — иной порядок оплаты;
           - "not_defined" — порядок прямо не урегулирован.

        6. freight_snippet:
           Точная цитата из договора. Если нет — "not_defined".

        7. freight_currency_display:
           "Рубли (RUB)" / "Доллары (USD)" / "Евро (EUR)" / "Иная валюта" / "Не указана".

        8. price_includes_vat_display:
           "Включён" / "Не включён" / "Нулевая ставка (0%)" / "Не указано".

        9. payment_method_display:
           "Предоплата" / "Постоплата" / "Частичная оплата" / "По тарифам перевозчика" / "Иной порядок" / "Не указан".
        </task>

        <context_rules>
        - Перед остальными полями заполни freight_charge_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все поля = "not_defined" / соответствующий fallback.
        - Не делай предположений на основании обычаев.
        - Если указано только "по тарифам перевозчика", считай параметр определённым: freight_amount = "по тарифам перевозчика" и payment_method = "tariff_based".
        - Не используй "None", "null" или пустые строки.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте вообще нет условий о провозной плате, цене или тарифах.
           → presence = "missing";
             freight_amount = "not_defined";
             все остальные поля = "not_defined";
             все *_display = соответствующий fallback.

        2. Цена согласуется в будущем.
           "Стоимость перевозки определяется сторонами дополнительно."
           → presence = "present";
             freight_amount = "not_defined";
             payment_method = "not_defined".

        3. Противоречие между фрагментами.
           В одном месте указана 100% предоплата, в другом — постоплата в течение 10 дней.
           → presence = "unclear";
             payment_method = "not_defined";
             payment_method_display = "Не указан".

        4. Тарифный метод.
           "Оплата осуществляется по тарифам Перевозчика, опубликованным на сайте."
           → presence = "present";
             freight_amount = "по тарифам перевозчика";
             payment_method = "tariff_based";
             payment_method_display = "По тарифам перевозчика".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для freight_charge_presence используй только: "present", "missing", "unclear".
        - Для freight_currency используй только: "RUB", "USD", "EUR", "other", "not_defined".
        - Для price_includes_vat используй только: "yes", "no", "zero_rate", "not_defined".
        - Для payment_method используй только: "prepayment", "postpayment", "partial", "tariff_based", "other", "not_defined".
        - Fallback при отсутствии данных:
          * freight_amount, payment_deadline, freight_snippet → "not_defined";
          * freight_currency_display → "Не указана";
          * price_includes_vat_display → "Не указано";
          * payment_method_display → "Не указан".
        - Fallback при противоречии или неоднозначности:
          * все *_display → соответствующие fallback-строки.
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "freight_charge_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие условий оплаты. Внутреннее агрегатное signal-поле."
          required: true

        - name: "freight_currency"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["RUB", "USD", "EUR", "other", "not_defined"]
          description: "Валюта расчётов. Внутреннее enum-поле."
          required: true
          display_in_grid: false
        - name: "price_includes_vat"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["yes", "no", "zero_rate", "not_defined"]
          description: "НДС включён в цену. Внутреннее enum-поле."
          required: true
          display_in_grid: false
        - name: "payment_method"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["prepayment", "postpayment", "partial", "tariff_based", "other", "not_defined"]
          description: "Порядок оплаты. Внутреннее enum-поле."
          required: true
          display_in_grid: false
        - name: "freight_amount"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 1
          label: "Провозная плата"
          description: >
            Размер провозной платы или формула цены. Fallback: "Не установлено" / "Не удалось определить".
          required: true
        - name: "payment_deadline"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 2
          label: "Срок оплаты"
          description: >
            Срок оплаты. Fallback: "Не установлено" / "Не удалось определить".
          required: true
        - name: "freight_snippet"
          type: "string"
          presentation: "diagnostic"
          display_in_grid: false
          description: "Цитата об условиях оплаты"
          required: true
        - name: "freight_currency_display"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 3
          label: "Валюта"
          description: >
            User-friendly отображение валюты расчётов. Fallback: "Не установлено" / "Не удалось определить".
          required: true
        - name: "price_includes_vat_display"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 4
          label: "НДС"
          description: >
            User-friendly отображение: включён ли НДС в цену. Fallback: "Не установлено" / "Не удалось определить".
          required: true
        - name: "payment_method_display"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 5
          label: "Порядок оплаты"
          description: >
            User-friendly отображение порядка оплаты. Fallback: "Не установлено" / "Не удалось определить".
          required: true
      store_payload: true

  - id: parties_identification
    name: "Стороны: перевозчик, грузоотправитель, грузополучатель"
    description: >
      Проверяет идентификацию сторон договора перевозки: перевозчика,
      грузоотправителя и, при наличии в тексте, грузополучателя, а также
      сведения о подписантах и основании полномочий.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "перевозчик"
        - "грузоотправитель"
        - "грузополучатель"
        - "именуем"
        - "в лице"
        - "действующего на основании"
        - "ИНН"
        - "ОГРН"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)(перевозчик|грузоотправител|грузополучател).*именуем"
        - "(?i)действующ[а-я]+\\s+на\\s+основании"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по транспортным договорам.
        Анализируется договор перевозки груза.
        Проверяется только вопрос идентификации сторон и полномочий подписантов.

        Нормативный ориентир:
        - ст. 432 ГК РФ
        - ст. 434 ГК РФ
        - ст. 785 ГК РФ

        [ЗАДАЧА]
        Установи:
        1. Кто указан как Перевозчик.
        2. Кто указан как Грузоотправитель.
        3. Указан ли в тексте Грузополучатель.
        4. Кто подписывает договор и на каком основании.
        5. Приведи точную цитату из договора.
        6. Сформируй user-friendly значение для основания полномочий.

        [ПРАВИЛА]
        1. Используй только текст договора.
        2. Не додумывай реквизиты, если они указаны частично.
        3. Если сторона не определена прямо — верни "not_defined".
        4. Если грузополучатель не указан как сторона договора, это не ошибка — верни "not_defined".
        5. Основание полномочий нормализуй только в:
          - charter
          - poa
          - order
          - other
          - not_defined
        6. В parties_snippet включай только цитату из договора.
        7. Для signatory_basis_display используй понятные русские формулировки:
          - charter → "Устав"
          - poa → "Доверенность"
          - order → "Приказ"
          - other → "Иное основание"
          - not_defined → "Не указано"
        8. Верни РОВНО один JSON-объект со всеми 6 ключами без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — все стороны и полномочия указаны:
        Фрагмент:
        "ООО 'ТрансЛогистик', именуемое в дальнейшем 'Перевозчик', в лице генерального директора Иванова И.И., действующего на основании Устава, с одной стороны, и ООО 'ГрузСервис', именуемое в дальнейшем 'Грузоотправитель', в лице директора Петрова П.П., действующего на основании доверенности №123 от 01.01.2024, с другой стороны, заключили настоящий договор о нижеследующем: Грузополучатель — ООО 'ПолучательГруза'."

        Ответ:
        {
          "carrier_details": "ООО 'ТрансЛогистик', ИНН 7701234567, ОГРН 1027700123456",
          "shipper_details": "ООО 'ГрузСервис', ИНН 7709876543, ОГРН 1037700987654",
          "consignee_details": "ООО 'ПолучательГруза'",
          "signatory_basis": "charter",
          "parties_snippet": "ООО 'ТрансЛогистик', именуемое в дальнейшем 'Перевозчик', в лице генерального директора Иванова И.И., действующего на основании Устава, с одной стороны, и ООО 'ГрузСервис', именуемое в дальнейшем 'Грузоотправитель', в лице директора Петрова П.П., действующего на основании доверенности №123 от 01.01.2024, с другой стороны, заключили настоящий договор о нижеследующем: Грузополучатель — ООО 'ПолучательГруза'.",
          "signatory_basis_display": "Устав"
        }

        Пример 2 — стороны не указаны:
        Фрагмент:
