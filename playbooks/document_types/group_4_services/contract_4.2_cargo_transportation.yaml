           - "present" — если qualification_required ∈ {"yes", "no"} ИЛИ
             tachograph_required ∈ {"yes", "no"} ИЛИ driver_replacement_clause ∈ {"yes", "no"};
           - "missing" — если все три содержательные поля равны "not_defined"
             и фрагментов о требованиях к водителям в контексте нет;
           - "unclear" — если фрагменты есть, но они противоречивы.

           Если presence = "missing":
           - qualification_required = "not_defined";
           - tachograph_required = "not_defined";
           - driver_replacement_clause = "not_defined";
           - driver_snippet = "not_defined";
           - все *_display = соответствующий fallback;
           - не выполняй остальные шаги.

        1. qualification_required:
           - "yes" — если в договоре прямо зафиксированы требования к стажу, категориям или аттестации водителя;
           - "no" — если требования к квалификации водителя прямо исключены;
           - "not_defined" — если требования к квалификации водителя прямо не упомянуты.

        2. tachograph_required:
           - "yes" — если прямо упомянуто требование об оснащении ТС тахографом и контроле режима сна/отдыха;
           - "no" — если использование тахографа прямо исключено;
           - "not_defined" — если вопрос тахографа не урегулирован.

        3. driver_replacement_clause:
           - "yes" — если в договоре прямо прописана обязанность и сроки оперативной замены водителя в случае нештатных ситуаций;
           - "no" — если замена водителя в рейсе прямо запрещена;
           - "not_defined" — если вопрос замены водителя не урегулирован.

        4. driver_snippet:
           Точная цитата из договора о водителе и его квалификации. Если нет — "not_defined".

        5. qualification_required_display:
           "Предусмотрены" / "Не предусмотрены" / "Не указано".

        6. tachograph_required_display:
           "Требуется" / "Не требуется" / "Не указано".

        7. driver_replacement_clause_display:
           "Предусмотрена" / "Не предусмотрена" / "Не указано".
        </task>

        <context_rules>
        - Перед остальными полями заполни driver_qualification_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все поля = "not_defined" / соответствующий fallback.
        - Не путай требования к водителю (физическому лицу) с требованиями к транспортному средству (техническому устройству).
        - Не используй "None", "null" или пустые строки.
        - Все 7 ключей должны присутствовать в JSON-ответе.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В договоре нет условий о водителях, тахографах или режиме труда.
           → presence = "missing";
             qualification_required = "not_defined";
             driver_snippet = "not_defined".

        2. Тахограф без требований к квалификации.
           "ТС Перевозчика должны быть укомплектованы сертифицированными тахографами." (про стаж и категории водителей ничего нет).
           → presence = "present";
             qualification_required = "not_defined";
             tachograph_required = "yes".

        3. Противоречие между фрагментами.
           В одном месте замена водителя допускается без ограничений, в другом — строго с согласия грузоотправителя.
           → presence = "unclear";
             driver_replacement_clause = "not_defined";
             driver_replacement_clause_display = "Не указано".

        4. Требования к замене водителя без иных условий.
           "Перевозчик обязуется немедленно заменить водителя при получении мотивированного требования от Клиента."
           → presence = "present";
             driver_replacement_clause = "yes";
             qualification_required = "not_defined";
             tachograph_required = "not_defined".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для driver_qualification_presence используй только: "present", "missing", "unclear".
        - Для qualification_required, tachograph_required, driver_replacement_clause используй только: "yes", "no", "not_defined".
        - Fallback при отсутствии данных:
          * driver_snippet → "not_defined";
          * все *_display → соответствующие fallback-строки.
        - Fallback при противоречии или неоднозначности:
          * все *_display → соответствующие fallback-строки.
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "driver_qualification_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие требований к квалификации водителя. Внутреннее агрегатное signal-поле."
          required: true

        - name: "qualification_required"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Требования к стажу и категориям водителя предусмотрены. Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "tachograph_required"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Оснащение тахографами и контроль ЕСТР требуются. Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "driver_replacement_clause"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Возможность оперативной замены водителя в пути. Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "driver_snippet"
          type: "string"
          presentation: "diagnostic"
          display_in_grid: false
          description: "Цитата о квалификации водителя"
          required: true

        - name: "qualification_required_display"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 1
          label: "Квалификация"
          description: >
            User-friendly: предусмотрены ли требования к квалификации водителя. Fallback: "Не установлено" / "Не удалось определить".
          required: true

        - name: "tachograph_required_display"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 2
          label: "Тахограф"
          description: >
            User-friendly: требуется ли оснащение ТС тахографом. Fallback: "Не установлено" / "Не удалось определить".
          required: true

        - name: "driver_replacement_clause_display"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 3
          label: "Замена водителя"
          description: >
            User-friendly: предусмотрен ли порядок замены водителя. Fallback: "Не установлено" / "Не удалось определить".
          required: true
      store_payload: true

  - id: customs_clearance_obligations
    name: "Таможенное оформление: обязанности и расходы"
    description: >
      Детализирует таможенные обязанности сторон при трансграничной транспортировке:
      оформление транзитных и экспортно-импортных деклараций, уплату сборов
      и пошлин, ответственность за сверхнормативную задержку на пограничных
      пунктах и порядок прохождения таможенного досмотра (ТК ЕАЭС, ФЗ «О таможенном
      регулировании»). Базовое распределение таможенных обязанностей частично
      покрыто в international_transport_provisions; данный check добавляет
      необходимую коммерческую и процедурную детализацию.
    triggers:
      any: ["international_transport"]
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "таможенное оформление"
        - "таможенная декларация"
        - "транзитная декларация"
        - "таможенные сборы"
        - "таможенный досмотр"
        - "задержка на таможне"
        - "экспортные формальности"
        - "импортные формальности"
        - "таможенные пошлины"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)таможенн(ое|ого|ой|ых)"
        - "(?i)декларац(ия|ии|ию|иями)"
        - "(?i)карнет\\s+TIR"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по международным транспортным договорам.
        Анализируется договор перевозки груза.
        Проверяются ТОЛЬКО условия таможенного оформления, декларирования, уплаты сборов и ответственности за задержку.

        Нормативный ориентир:
        - Таможенный кодекс ЕАЭС
        - Федеральный закон «О таможенном регулировании в РФ»

        [ЗАДАЧА]
        Установи:
        1. На какую сторону возложена обязанность по декларированию груза и таможенному оформлению.
        2. Кто несёт расходы по уплате таможенных пошлин, налогов и сборов.
        3. Предусмотрена ли ответственность перевозчика или грузоотправителя за сверхнормативный простой на таможне.
        4. Урегулирована ли процедура таможенного досмотра (вскрытия пломб) перевозчиком.
        5. Приведи точную цитату из договора.
        6. Сформируй user-friendly значения для отображения в DD Grid.

        [ПРАВИЛА]
        1. Используй только текст договора.
        2. Не подставляй нормы ТК ЕАЭС о декларировании, если в тексте обязательства не распределены.
        3. Если декларант прямо не определён — declarant_responsibility = "not_defined".
        4. Если пошлины не упомянуты — duties_cost_allocation = "not_defined".
        5. Не используй "None", "null" или пустые строки — используй "not_defined".
        6. В customs_snippet включай только цитату из договора.
        7. Для *_display полей используй понятные русские формулировки:
          - declarant_responsibility: shipper → "Грузоотправитель", carrier → "Перевозчик", broker → "Таможенный брокер", not_defined → "Не указано"
          - duties_cost_allocation: shipper → "Грузоотправитель", carrier → "Перевозчик", not_defined → "Не указано"
          - delay_liability: yes → "Предусмотрена", no → "Не предусмотрена", not_defined → "Не указано"
          - inspection_clause: yes → "Предусмотрено", no → "Не предусмотрено", not_defined → "Не указано"
        8. Верни РОВНО один JSON-объект со всеми 9 ключами без какого-либо дополнительного текста до или после.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — полная регламентация таможенных процедур:
        Фрагмент:
        "Экспортно-импортное таможенное оформление и декларирование груза осуществляются силами и за счёт Грузоотправителя. Перевозчик несёт ответственность за задержку ТС на границе свыше 24 часов по его вине в виде штрафа 150 евро за каждые сутки простоя. В случае таможенного досмотра Перевозчик обязан присутствовать при вскрытии грузового отсека и составить коммерческий акт."

        Ответ:
        {
          "declarant_responsibility": "shipper",
          "duties_cost_allocation": "shipper",
          "delay_liability": "yes",
          "inspection_clause": "yes",
          "customs_snippet": "Экспортно-импортное таможенное оформление и декларирование груза осуществляются силами и за счёт Грузоотправителя. Перевозчик несёт ответственность за задержку ТС на границе свыше 24 часов по его вине в виде штрафа 150 евро за каждые сутки простоя. В случае таможенного досмотра Перевозчик обязан присутствовать при вскрытии грузового отсека и составить коммерческий акт.",
          "declarant_responsibility_display": "Грузоотправитель",
          "duties_cost_allocation_display": "Грузоотправитель",
          "delay_liability_display": "Предусмотрена",
          "inspection_clause_display": "Предусмотрено"
        }

        Пример 2 — не упомянуто:
        Фрагмент:
        "Перевозка осуществляется автомобильным транспортом по территории ЕАЭС."

        Ответ:
        {
          "declarant_responsibility": "not_defined",
          "duties_cost_allocation": "not_defined",
          "delay_liability": "not_defined",
          "inspection_clause": "not_defined",
          "customs_snippet": "not_defined",
          "declarant_responsibility_display": "Не указано",
          "duties_cost_allocation_display": "Не указано",
          "delay_liability_display": "Не указано",
          "inspection_clause_display": "Не предусмотрено"
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Есть ли в документе прямое упоминание таможенных пошлин или декларирования.
        2. Различаешь ли ты общую экспортную перевозку и конкретные таможенные обязанности.
        3. Если прямого распределения пошлин нет — не додумывай.
        4. Все 9 ключей присутствуют в JSON.

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        {
          "declarant_responsibility": "<shipper / carrier / broker / not_defined>",
          "duties_cost_allocation": "<shipper / carrier / not_defined>",
          "delay_liability": "<yes / no / not_defined>",
          "inspection_clause": "<yes / no / not_defined>",
          "customs_snippet": "<точная цитата или not_defined>",
          "declarant_responsibility_display": "<Грузоотправитель / Перевозчик / Таможенный брокер / Не указано>",
          "duties_cost_allocation_display": "<Грузоотправитель / Перевозчик / Не указано>",
          "delay_liability_display": "<Предусмотрена / Не предусмотрена / Не указано>",
          "inspection_clause_display": "<Предусмотрено / Не предусмотрено / Не указано>"
        }
      context_k: 4
      temperature: 0.0
      max_tokens: 600
    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "таможенное оформление таможенная декларация транзитная декларация таможенные сборы таможенный досмотр задержка на таможне экспортные формальности импортные формальности таможенные пошлины карнет TIR"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - procedures
      negative_keywords:
        - "провозная плата"
        - "претензия"
        - "форс-мажор"
        - "неустойка за просрочку доставки"
      position_bias:
        preferred_range: [0.0, 0.90]
        boost: 0.15
        scope: auto
      retrieval_profile: "scope_of_work_check"
      context_k: 4
      max_chunks: 6
      rerank: true
    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
        - "invoice"
      preferred_clause_functions:
        - "obligations"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10
    evidence:
      required: true
      min_snippet_length: 20
      max_snippet_length: 400
    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1100

      compact_output: false

      presence_signal:
        field: "customs_clearance_obligations_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист по международным транспортным договорам.
        Извлеки только подробные условия таможенного оформления, декларирования, уплаты пошлин и ответственности за задержку.
        Не анализируй общую цену, сроки доставки, претензии и иные нерелевантные разделы.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. customs_clearance_obligations_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей (declarant_responsibility, duties_cost_allocation, delay_liability) ≠ "not_defined";
           - "missing" — если все содержательные поля равны "not_defined" и фрагментов о таможенных процедурах в контексте нет;
           - "unclear" — если фрагменты по теме есть, но из-за противоречий вывод невозможен.

           Если presence = "missing":
           - declarant_responsibility = "not_defined";
           - duties_cost_allocation = "not_defined";
           - delay_liability = "not_defined";
           - inspection_clause = "not_defined";
           - customs_snippet = "not_defined";
           - все *_display = соответствующий fallback;
           - не выполняй остальные шаги.

        1. declarant_responsibility:
           - "shipper" — грузоотправитель;
           - "carrier" — перевозчик;
           - "broker" — уполномоченный таможенный представитель (брокер);
           - "not_defined" — декларант в тексте прямо не определён.

        2. duties_cost_allocation:
           - "shipper" — таможенные пошлины и сборы уплачивает грузоотправитель;
           - "carrier" — таможенные пошлины и сборы уплачивает перевозчик;
           - "not_defined" — порядок распределения расходов на сборы не указан.

        3. delay_liability:
           - "yes" — если предусмотрена ответственность сторон за сверхнормативную задержку ТС на таможенных пунктах;
           - "no" — если ответственность за задержку прямо исключена;
           - "not_defined" — если вопрос ответственности не урегулирован.

        4. inspection_clause:
           - "yes" — если в договоре прямо прописан порядок действий водителя/перевозчика при проведении досмотра груза таможенными органами;
           - "no" — если специальный порядок проведения досмотра отсутствует;
           - "not_defined" — если вопрос досмотра прямо не затронут.

        5. customs_snippet:
           Точная цитата из договора о таможенных процедурах. Если нет — "not_defined".

        6. declarant_responsibility_display:
           "Грузоотправитель" / "Перевозчик" / "Таможенный брокер" / "Не указано".

        7. duties_cost_allocation_display:
           "Грузоотправитель" / "Перевозчик" / "Не указано".

        8. delay_liability_display:
           "Предусмотрена" / "Не предусмотрена" / "Не указано".

        9. inspection_clause_display:
           "Предусмотрено" / "Не предусмотрено" / "Не указано".
        </task>

        <context_rules>
        - Перед остальными полями заполни customs_clearance_obligations_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все поля = "not_defined" / соответствующий fallback.
        - Не выводи обязанности по таможенному оформлению из обычаев делового оборота или диспозитивных норм.
        - Не используй "None", "null" или пустые строки.
        - Все 9 ключей должны присутствовать в JSON-ответе.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В договоре нет условий об НДС, таможне, границах или пошлинах.
           → presence = "missing";
             declarant_responsibility = "not_defined";
             customs_snippet = "not_defined".

        2. Таможня упомянута без распределения затрат.
           "Перевозчик обязуется своевременно подавать ТС к таможенному оформлению." (кто платит пошлины — не указано).
           → presence = "present";
             declarant_responsibility = "carrier";
             duties_cost_allocation = "not_defined".

        3. Противоречие между фрагментами.
           В одном месте экспортные сборы платит Грузоотправитель, в другом — Перевозчик.
           → presence = "unclear";
             duties_cost_allocation = "not_defined";
             duties_cost_allocation_display = "Не указано".

        4. Оформление через таможенного представителя.
           "Все процедуры декларирования осуществляются привлеченным Грузоотправителем таможенным брокером."
           → presence = "present";
             declarant_responsibility = "broker";
             duties_cost_allocation = "not_defined".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для customs_clearance_obligations_presence используй только: "present", "missing", "unclear".
        - Для declarant_responsibility используй только: "shipper", "carrier", "broker", "not_defined".
        - Для duties_cost_allocation используй только: "shipper", "carrier", "not_defined".
        - Для delay_liability, inspection_clause используй только: "yes", "no", "not_defined".
        - Fallback при отсутствии данных:
          * customs_snippet → "not_defined";
          * все *_display → соответствующие fallback-строки.
        - Fallback при противоречии или неоднозначности:
          * все *_display → соответствующие fallback-строки.
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "customs_clearance_obligations_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие условий о таможенном оформлении груза. Внутреннее агрегатное signal-поле."
          required: true

        - name: "declarant_responsibility"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["shipper", "carrier", "broker", "not_defined"]
          description: "Ответственный за таможенное декларирование и оформление. Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "duties_cost_allocation"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["shipper", "carrier", "not_defined"]
          description: "Сторона, несущая расходы по уплате таможенных пошлин и сборов. Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "delay_liability"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Ответственность сторон за сверхнормативную задержку ТС на таможне. Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "inspection_clause"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["yes", "no", "not_defined"]
