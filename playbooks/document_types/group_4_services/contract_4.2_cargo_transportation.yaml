          "freight_currency_display": "Не указана",
          "price_includes_vat_display": "Не указано",
          "payment_method_display": "Не указан"
        }

        Пример 4 — тарифный метод:
        Фрагмент:
        "Провозная плата определяется по тарифам Перевозчика, действующим на дату перевозки. Оплата производится после завершения перевозки."

        Ответ:
        {
