            специальных категорий грузов.
            Fallback: "Не указаны" / "Не удалось определить".
          required: true
      store_payload: true

  - id: international_transport_provisions
    name: "Международная перевозка: конвенции, таможня, Incoterms"
    description: >
      Проверяет наличие условий для международных перевозок: ссылка на конвенцию
      (КДПГ/CMR, Монреальская), распределение таможенных обязанностей,
      термин Incoterms. Применимое право и подсудность проверяются отдельным
      global check-ом (governing_law_and_forum) и не дублируются здесь.
    triggers:
      any: ["international_transport"]
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "международная перевозка"
        - "CMR"
        - "КДПГ"
        - "Монреальская конвенция"
        - "таможенное оформление"
        - "инкотермс"
        - "Incoterms"
        - "TIR"
        - "карнет TIR"
        - "экспортные формальности"
        - "импортные формальности"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)\\bCMR\\b|\\bКДПГ\\b"
        - "(?i)Монреальск(ая|ой)\\s+конвенц"
        - "(?i)инкотермс|Incoterms"
        - "(?i)таможенн(ое|ого)\\s+оформлени"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по международным транспортным договорам.
        Анализируется договор перевозки груза.
        Проверяются только условия международной перевозки: конвенции, таможня, Incoterms.
        Применимое право и подсудность НЕ проверяются в этом check-е (они покрыты отдельной проверкой).

        Нормативный ориентир:
        - КДПГ (конвенция CMR) — для международных автомобильных перевозок
        - Монреальская конвенция — для международных авиаперевозок

        [ЗАДАЧА]
        Установи:
        1. Является ли перевозка международной по тексту договора.
        2. Есть ли ссылка на применимую международную конвенцию.
        3. Как распределены таможенные обязанности между сторонами.
        4. Указан ли термин Incoterms.
        5. Приведи точную цитату из договора.
        6. Сформируй user-friendly значения для отображения в DD Grid.

        [ПРАВИЛА]
        1. Используй только текст договора.
        2. Перевозка считается международной только при прямом указании маршрута через границу или прямой характеристики "международная".
        3. Не путай таможенные обязанности с общими обязанностями по предоставлению документов.
        4. Если конвенция не названа — applicable_convention = "not_defined".
        5. Не используй "None", "null" или пустые строки — используй "not_defined".
        6. В international_snippet включай только цитату из договора.
        7. Для *_display полей используй понятные русские формулировки:
          - international_transport: yes → "Да", no → "Нет"
          - applicable_convention: CMR → "КДПГ (CMR)", Montreal → "Монреальская конвенция", Hamburg → "Гамбургские правила", Hague_Visby → "Гаагско-Висбийские правила", other → "Иная конвенция", not_defined → "Не указана"
        8. Верни РОВНО один JSON-объект со всеми 8 ключами без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — международная перевозка с CMR:
        Фрагмент:
        "Перевозка является международной, на неё распространяется конвенция CMR. Экспортные формальности выполняет грузоотправитель."

        Ответ:
        {
          "international_transport": "yes",
          "applicable_convention": "CMR",
          "customs_responsibility_shipper": "yes",
          "customs_responsibility_carrier": "not_defined",
          "incoterms_term": "not_defined",
          "international_snippet": "Перевозка является международной, на неё распространяется конвенция CMR. Экспортные формальности выполняет грузоотправитель.",
          "international_transport_display": "Да",
          "applicable_convention_display": "КДПГ (CMR)"
        }

        Пример 2 — внутренняя перевозка:
        Фрагмент:
        "Груз перевозится автомобильным транспортом из пункта Москва в пункт Санкт-Петербург."

        Ответ:
        {
          "international_transport": "no",
          "applicable_convention": "not_defined",
          "customs_responsibility_shipper": "not_defined",
          "customs_responsibility_carrier": "not_defined",
          "incoterms_term": "not_defined",
          "international_snippet": "not_defined",
          "international_transport_display": "Нет",
          "applicable_convention_display": "Не указана"
        }

        Пример 3 — текст есть, но вывод невозможен (размытая формулировка):
        Фрагмент:
        "Перевозка осуществляется с соблюдением международных требований и стандартов."

        Ответ:
        {
          "international_transport": "yes",
          "applicable_convention": "not_defined",
          "customs_responsibility_shipper": "not_defined",
          "customs_responsibility_carrier": "not_defined",
          "incoterms_term": "not_defined",
          "international_snippet": "Перевозка осуществляется с соблюдением международных требований и стандартов.",
          "international_transport_display": "Да",
          "applicable_convention_display": "Не указана"
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        Перед ответом внутренне проверь:
        1. Есть ли прямое указание на международный характер перевозки.
        2. Взята ли конвенция из текста, а не из общей практики.
        3. Распределены ли таможенные обязанности именно в тексте договора.
        4. Если прямого указания нет — верни "not_defined".
        5. Все 8 ключей присутствуют в JSON.

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь РОВНО одним JSON-объектом без какого-либо дополнительного текста до или после, со всеми 8 ключами:
        {
          "international_transport": "<yes / no>",
          "applicable_convention": "<CMR / Montreal / Hamburg / Hague_Visby / other / not_defined>",
          "customs_responsibility_shipper": "<yes / no / not_defined>",
          "customs_responsibility_carrier": "<yes / no / not_defined>",
          "incoterms_term": "<термин Incoterms или not_defined>",
          "international_snippet": "<точная цитата или not_defined>",
          "international_transport_display": "<Да / Нет>",
          "applicable_convention_display": "<КДПГ (CMR) / Монреальская конвенция / Гамбургские правила / Гаагско-Висбийские правила / Иная конвенция / Не указана>"
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 650
    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "международная перевозка CMR КДПГ Монреальская конвенция таможенное оформление инкотермс Incoterms TIR карнет TIR экспортные формальности импортные формальности"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - procedures
        - boilerplate
      negative_keywords:
        - "провозная плата"
        - "претензия"
        - "неустойка"
        - "простой"
      position_bias:
        preferred_range: [0.0, 0.90]
        boost: 0.15
        scope: auto
      retrieval_profile: "scope_of_work_check"
      context_k: 6
      max_chunks: 8
      rerank: true
    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
        - "invoice"
      preferred_clause_functions:
        - "obligations"
        - "procedures"
        - "boilerplate"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10
    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 600
    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1100

      compact_output: false

      presence_signal:
        field: "international_transport_provisions_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист по международным транспортным договорам.
        Извлеки только условия международной перевозки: конвенции, таможню, Incoterms.
        Применимое право и подсудность НЕ извлекай (они покрыты отдельной проверкой).
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. international_transport_provisions_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если international_transport = "yes" ИЛИ
             applicable_convention ≠ "not_defined" ИЛИ
             customs_responsibility_shipper ≠ "not_defined" ИЛИ
             incoterms_term ≠ "not_defined";
           - "missing" — если все содержательные поля = "not_defined"/"no"
             и фрагментов о международной перевозке в контексте нет;
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - international_transport = "no";
           - applicable_convention = "not_defined";
           - customs_responsibility_shipper = "not_defined";
           - customs_responsibility_carrier = "not_defined";
           - incoterms_term = "not_defined";
           - international_snippet = "not_defined";
           - international_transport_display = "Нет";
           - applicable_convention_display = "Не указана";
           - не выполняй остальные шаги.

        1. international_transport:
           - "yes" — если перевозка прямо названа международной, указан
             трансграничный маршрут или применена конвенция CMR/Монреальская;
           - "no" — если перевозка прямо не идентифицируется как международная.

        2. applicable_convention:
           - "CMR" — КДПГ / конвенция CMR;
           - "Montreal" — Монреальская конвенция;
           - "Hamburg" — Гамбургские правила;
           - "Hague_Visby" — Гаагско-Висбийские правила;
           - "other" — иная конвенция, прямо названная в тексте;
           - "not_defined" — конвенция не названа.

        3. customs_responsibility_shipper:
           - "yes" — если таможенные обязанности грузоотправителя прямо установлены;
           - "no" — если прямо указано, что грузоотправитель не несёт таможенных обязанностей;
           - "not_defined" — если вопрос не раскрыт.

        4. customs_responsibility_carrier:
           - "yes" — если таможенные обязанности перевозчика прямо установлены;
           - "no" — если прямо указано, что перевозчик не несёт таможенных обязанностей;
           - "not_defined" — если вопрос не раскрыт.

        5. incoterms_term:
           Термин Incoterms из текста договора (например: "FCA", "CIP", "DAP").
           Если не указан — "not_defined".

        6. international_snippet:
           Точная цитата из договора. Если нет — "not_defined".

        7. international_transport_display:
           "Да" — если international_transport = "yes", иначе "Нет".

        8. applicable_convention_display:
           "КДПГ (CMR)" / "Монреальская конвенция" / "Гамбургские правила" /
           "Гаагско-Висбийские правила" / "Иная конвенция" / "Не указана".
        </task>

        <context_rules>
        - Перед остальными полями заполни international_transport_provisions_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все поля = "not_defined"/"no", все *_display = соответствующий fallback.
        - Не считай перевозку международной без прямого указания в тексте.
        - Не подставляй CMR только потому, что перевозка автомобильная.
        - Не извлекай применимое право и подсудность (они покрыты отдельным check-ом).
        - Не путай таможенные обязанности с общими обязанностями по предоставлению документов.
        - Не используй "None", "null" или пустые строки.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет упоминания международной перевозки, конвенций,
           таможни или Incoterms.
           → presence = "missing";
             international_transport = "no";
             все остальные поля = "not_defined";
             все *_display = соответствующий fallback.

        2. Внутренняя перевозка без международных элементов.
           "Груз перевозится из Москвы в Санкт-Петербург."
           → presence = "missing";
             international_transport = "no";
             applicable_convention = "not_defined".

        3. Противоречие между фрагментами.
           В одном пункте указана конвенция CMR, в другом — Монреальская
           для одного и того же рейса.
           → presence = "unclear";
             international_transport = "yes";
             applicable_convention = "not_defined";
             applicable_convention_display = "Не указана".

        4. Incoterms без явной конвенции.
           "Поставка на условиях CIP Москва по Incoterms 2020."
           → presence = "present";
             international_transport = "yes";
             applicable_convention = "not_defined";
             incoterms_term = "CIP".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для international_transport_provisions_presence используй только: "present", "missing", "unclear".
        - Для international_transport используй только: "yes", "no".
        - Для applicable_convention используй только: "CMR", "Montreal", "Hamburg", "Hague_Visby", "other", "not_defined".
        - Для customs_responsibility_shipper и customs_responsibility_carrier используй только: "yes", "no", "not_defined".
        - Fallback при отсутствии данных:
          * applicable_convention → "not_defined";
          * incoterms_term → "not_defined";
          * international_snippet → "not_defined";
          * international_transport_display → "Нет";
          * applicable_convention_display → "Не указана".
        - Fallback при противоречии или неоднозначности:
          * applicable_convention → "not_defined";
          * applicable_convention_display → "Не указана".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "international_transport_provisions_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие условий международной перевозки. Внутреннее агрегатное signal-поле."
          required: true

        - name: "international_transport"
