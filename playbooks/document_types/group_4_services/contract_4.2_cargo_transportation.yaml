  - id: parties_identification
    name: "Стороны: перевозчик, грузоотправитель, грузополучатель"
    description: >
      Проверяет идентификацию сторон договора перевозки: перевозчика,
      грузоотправителя и, при наличии в тексте, грузополучателя, а также
      сведения о подписантах и основании полномочий.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "перевозчик"
        - "грузоотправитель"
        - "грузополучатель"
        - "именуем"
        - "в лице"
        - "действующего на основании"
        - "ИНН"
        - "ОГРН"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)(перевозчик|грузоотправител|грузополучател).*именуем"
        - "(?i)действующ[а-я]+\\s+на\\s+основании"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по транспортным договорам.
        Анализируется договор перевозки груза.
        Проверяется только вопрос идентификации сторон и полномочий подписантов.

        Нормативный ориентир:
        - ст. 432 ГК РФ
        - ст. 434 ГК РФ
        - ст. 785 ГК РФ

        [ЗАДАЧА]
        Установи:
        1. Кто указан как Перевозчик.
        2. Кто указан как Грузоотправитель.
        3. Указан ли в тексте Грузополучатель.
        4. Кто подписывает договор и на каком основании.
        5. Приведи точную цитату из договора.
        6. Сформируй user-friendly значение для основания полномочий.

        [ПРАВИЛА]
        1. Используй только текст договора.
        2. Не додумывай реквизиты, если они указаны частично.
        3. Если сторона не определена прямо — верни "not_defined".
        4. Если грузополучатель не указан как сторона договора, это не ошибка — верни "not_defined".
        5. Основание полномочий нормализуй только в:
          - charter
          - poa
          - order
          - other
          - not_defined
        6. В parties_snippet включай только цитату из договора.
        7. Для signatory_basis_display используй понятные русские формулировки:
          - charter → "Устав"
          - poa → "Доверенность"
          - order → "Приказ"
          - other → "Иное основание"
          - not_defined → "Не указано"
        8. Верни РОВНО один JSON-объект со всеми 6 ключами без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — все стороны и полномочия указаны:
        Фрагмент:
        "ООО 'ТрансЛогистик', именуемое в дальнейшем 'Перевозчик', в лице генерального директора Иванова И.И., действующего на основании Устава, с одной стороны, и ООО 'ГрузСервис', именуемое в дальнейшем 'Грузоотправитель', в лице директора Петрова П.П., действующего на основании доверенности №123 от 01.01.2024, с другой стороны, заключили настоящий договор о нижеследующем: Грузополучатель — ООО 'ПолучательГруза'."

        Ответ:
        {
