    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1100

      compact_output: false

      presence_signal:
        field: "liability_limitation_explicit_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист по транспортным договорам.
        Извлеки условие об ограничении ответственности перевозчика.
        Не анализируй цену, сроки, претензии, приёмку груза и иные разделы.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. liability_limitation_explicit_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если liability_cap_present ∈ {"yes", "no"} ИЛИ cap_type ≠ "not_defined";
           - "missing" — если все поля = "not_defined" и фрагментов об ограничении ответственности в контексте нет;
           - "unclear" — если фрагменты по теме есть, но из-за противоречий вывод невозможен.

           Если presence = "missing":
           - liability_cap_present = "not_defined";
           - cap_type = "not_defined";
           - cap_amount = "not_defined";
           - statutory_reference = "not_defined";
           - liability_limitation_snippet = "not_defined";
           - все *_display = соответствующий fallback;
           - не выполняй остальные шаги.

        1. liability_cap_present:
           - "yes" — если лимит/ограничение ответственности перевозчика прямо установлено в договоре;
           - "no" — если в договоре прямо указано, что ответственность перевозчика ничем не ограничена;
           - "not_defined" — если вопрос ограничения ответственности прямо не урегулирован.

        2. cap_type:
           - "declared_value" — ограничение объявленной стоимостью груза;
           - "actual_value" — ограничение действительной (реальной) стоимостью груза;
           - "statutory" — общая ссылка на лимиты по закону/уставу без конкретной договорной суммы;
           - "contract_amount" — конкретная договорная сумма или процентный лимит;
           - "not_defined" — тип ограничения не определён.

        3. cap_amount:
           Размер или формула лимита из текста договора (например: "объявленная стоимость, но не более 500 000 руб.").
           Если не указан — "not_defined".

        4. statutory_reference:
           Ссылка на конкретный транспортный устав:
           - "УАТ" — Устав автомобильного транспорта;
           - "УЖТ" — Устав железнодорожного транспорта;
           - "КТМ" — Кодекс торгового мореплавания;
           - "КВВТ" — Кодекс внутреннего водного транспорта;
           - "other" — иной устав или нормативный акт;
           - "not_defined" — ссылка на конкретный устав отсутствует.

        5. liability_limitation_snippet:
           Точная цитата из договора об ограничении ответственности. Если нет — "not_defined".

        6. liability_cap_present_display:
           "Установлен" / "Не установлен" / "Не указано".

        7. cap_type_display:
           "Объявленная стоимость" / "Действительная стоимость" / "По закону" / "Договорная сумма" / "Не определён".

        8. statutory_reference_display:
           "УАТ (автомобильный транспорт)" / "УЖТ (железнодорожный транспорт)" / "КТМ (морской транспорт)" / "КВВТ (внутренний водный транспорт)" / "Иной устав/режим" / "Не указана".
        </task>

        <context_rules>
        - Перед остальными полями заполни liability_limitation_explicit_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все поля = "not_defined" / соответствующий fallback.
        - Не путай ограничение ответственности с полным освобождением от ответственности или перечнем форс-мажоров.
        - Если в тексте есть только ссылка "в соответствии с законодательством" — cap_type = "statutory".
        - Прямое указание на полную ответственность без ограничений (liability_cap_present = "no") — это presence = "present", а не "missing".
        - Не используй "None", "null" или пустые строки.
        - Все 8 ключей должны присутствовать в JSON-ответе.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В договоре нет упоминания лимитов ответственности перевозчика.
           → presence = "missing";
             liability_cap_present = "not_defined";
             cap_type = "not_defined".

        2. Общая ссылка на закон без конкретизации.
           "Перевозчик несёт ответственность в пределах, установленных действующим законодательством РФ."
           → presence = "present";
             liability_cap_present = "yes";
             cap_type = "statutory";
             cap_amount = "not_defined".

        3. Противоречие между фрагментами.
           В одном месте ответственность ограничена суммой 100 000 руб., в другом — объявленной стоимостью груза.
           → presence = "unclear";
             liability_cap_present = "yes";
             cap_type = "not_defined";
             cap_type_display = "Не определён".

        4. Прямое исключение лимита (полная ответственность).
           "Перевозчик возмещает убытки в полном объёме без применения ограничений ответственности."
           → presence = "present";
             liability_cap_present = "no";
             cap_type = "not_defined";
             liability_cap_present_display = "Не установлен".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для liability_limitation_explicit_presence используй только: "present", "missing", "unclear".
        - Для liability_cap_present используй только: "yes", "no", "not_defined".
        - Для cap_type используй только: "declared_value", "actual_value", "statutory", "contract_amount", "not_defined".
        - Для statutory_reference используй только: "УАТ", "УЖТ", "КТМ", "КВВТ", "other", "not_defined".
        - Fallback при отсутствии данных:
          * cap_amount, liability_limitation_snippet → "not_defined";
          * все *_display → соответствующие fallback-строки ("Не указано", "Не определён", "Не указана").
        - Fallback при противоречии или неоднозначности:
          * все *_display → соответствующие fallback-строки.
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "liability_limitation_explicit_presence"
