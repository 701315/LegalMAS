          required: true
      store_payload: true

  - id: lien_right_on_cargo
    name: "Право удержания груза и порядок реализации (ст. 790, 359 ГК РФ)"
    description: >
      Проверяет наличие условия о праве перевозчика удерживать груз
      до оплаты провозных платежей и порядка реализации удержанного груза.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "право удержания"
        - "удержание груза"
        - "до уплаты"
        - "до полной оплаты"
        - "реализация удержанного"
        - "хранение за счёт"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)удержива(ть|ет).*груз.*до.*оплат"
        - "(?i)право\\s+удержани(я|е).*груз"
        - "(?i)реализац(ия|ии)\\s+удержанн"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по транспортным договорам.
        Анализируется договор перевозки груза.
        Проверяется только право удержания груза и порядок реализации удержанного груза.

        Нормативный ориентир:
        - ст. 790 ГК РФ
        - ст. 359 ГК РФ

        [ЗАДАЧА]
        Установи:
        1. Закреплено ли в договоре право перевозчика удерживать груз до оплаты.
        2. На каких условиях груз может быть удержан.
        3. Установлен ли порядок реализации удержанного груза.
        4. За чей счёт хранится удержанный груз.
        5. Приведи точную цитату из договора.
        6. Сформируй user-friendly значения для отображения в DD Grid.

        [ПРАВИЛА]
        1. Используй только текст договора.
        2. Не считай право удержания установленным по общей фразе о неустойке или залоге без прямого указания на удержание груза.
        3. Не путай право удержания с правом приостановить оказание услуг или с залогом.
        4. Если порядок реализации прямо не описан — realization_procedure = "no".
        5. Если тема порядка реализации вообще не затронута в договоре — realization_procedure = "not_defined".
        6. Не используй "None", "null" или пустые строки — используй "not_defined".
        7. В lien_snippet включай только цитату из договора.
        8. Для *_display полей используй понятные русские формулировки:
          - lien_right_present: yes → "Да", no → "Нет", not_defined → "Не установлено"
          - realization_procedure: yes → "Установлен", no → "Не установлен", not_defined → "Не указано"
          - storage_cost_allocation: shipper → "Грузоотправитель", carrier → "Перевозчик", not_defined → "Не указано"
        9. Верни РОВНО один JSON-объект со всеми 8 ключами без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — право удержания установлено:
        Фрагмент:
        "До уплаты провозных платежей и иных сумм по договору перевозчик вправе удерживать груз."

        Ответ:
        {
          "lien_right_present": "yes",
          "lien_conditions": "удержание груза до уплаты провозных платежей и иных сумм по договору",
          "realization_procedure": "not_defined",
          "storage_cost_allocation": "not_defined",
          "lien_snippet": "До уплаты провозных платежей и иных сумм по договору перевозчик вправе удерживать груз.",
          "lien_right_present_display": "Да",
          "realization_procedure_display": "Не указано",
          "storage_cost_allocation_display": "Не указано"
        }

        Пример 2 — право удержания не упомянуто:
        Фрагмент:
        "Оплата провозной платы производится в течение 10 банковских дней с даты выставления счёта."

        Ответ:
        {
          "lien_right_present": "not_defined",
          "lien_conditions": "not_defined",
          "realization_procedure": "not_defined",
          "storage_cost_allocation": "not_defined",
          "lien_snippet": "not_defined",
          "lien_right_present_display": "Не установлено",
          "realization_procedure_display": "Не указано",
          "storage_cost_allocation_display": "Не указано"
        }

        Пример 3 — текст есть, но вывод невозможен (приостановление услуг ≠ удержание груза):
        Фрагмент:
        "При нарушении сроков оплаты перевозчик вправе приостановить оказание услуг по перевозке до погашения задолженности."

        Ответ:
        {
          "lien_right_present": "no",
          "lien_conditions": "not_defined",
          "realization_procedure": "not_defined",
          "storage_cost_allocation": "not_defined",
          "lien_snippet": "not_defined",
          "lien_right_present_display": "Нет",
          "realization_procedure_display": "Не указано",
          "storage_cost_allocation_display": "Не указано"
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        Перед ответом внутренне проверь:
        1. Есть ли прямая цитата о праве удержать именно груз (не просто приостановить услуги).
        2. Описан ли порядок реализации отдельно от права удержания.
        3. Не путаешь ли ты удержание груза с залогом или неустойкой.
        4. Если прямого указания нет — верни "not_defined".
        5. Все 8 ключей присутствуют в JSON.

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь РОВНО одним JSON-объектом без какого-либо дополнительного текста до или после, со всеми 8 ключами:
        {
          "lien_right_present": "<yes / no / not_defined>",
          "lien_conditions": "<описание условий или not_defined>",
          "realization_procedure": "<yes / no / not_defined>",
          "storage_cost_allocation": "<shipper / carrier / not_defined>",
          "lien_snippet": "<точная цитата или not_defined>",
          "lien_right_present_display": "<Да / Нет / Не установлено>",
          "realization_procedure_display": "<Установлен / Не установлен / Не указано>",
          "storage_cost_allocation_display": "<Грузоотправитель / Перевозчик / Не указано>"
        }
      context_k: 4
      temperature: 0.0
      max_tokens: 450
    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "право удержания удержание груза до уплаты до полной оплаты реализация удержанного хранение за счёт"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - remedies
        - limitations
      negative_keywords:
        - "провозная плата"
        - "претензия"
        - "форс-мажор"
        - "неустойка"
      position_bias:
        preferred_range: [0.2, 0.95]
        boost: 0.15
        scope: auto
      retrieval_profile: "security_check"
      context_k: 4
      max_chunks: 6
      rerank: true
    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
        - "invoice"
      preferred_clause_functions:
        - "remedies"
        - "limitations"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10
    evidence:
      required: true
      min_snippet_length: 30
      max_snippet_length: 500
    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 900

      compact_output: false

      presence_signal:
        field: "lien_right_on_cargo_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист по транспортным договорам.
        Извлеки только условия о праве удержания груза и реализации удержанного груза.
        Не анализируй неустойки, залоги, общие санкции и иные разделы.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. lien_right_on_cargo_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если lien_right_present ∈ {"yes", "no"}
             (включая прямое исключение права удержания);
           - "missing" — если lien_right_present = "not_defined"
             и фрагментов об удержании груза нет;
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - lien_right_present = "not_defined";
           - lien_conditions = "not_defined";
           - realization_procedure = "not_defined";
           - storage_cost_allocation = "not_defined";
           - lien_snippet = "not_defined";
           - все *_display = соответствующий fallback;
           - не выполняй остальные шаги.

        1. lien_right_present:
           - "yes" — если право удержания груза прямо закреплено в договоре;
           - "no" — если договор прямо исключает право удержания груза
             или прямо указано, что груз выдаётся без удержания;
           - "not_defined" — если право удержания прямо не упомянуто.

        2. lien_conditions:
           Краткое описание условий удержания на русском языке.
           Если не указаны — "not_defined".

        3. realization_procedure:
           - "yes" — если порядок реализации удержанного груза прямо описан;
           - "no" — если право удержания есть, но порядок реализации
             прямо не описан;
           - "not_defined" — если тема реализации не затронута.

        4. storage_cost_allocation:
           - "shipper" — если хранение за счёт грузоотправителя;
           - "carrier" — если хранение за счёт перевозчика;
           - "not_defined" — если не указано.

        5. lien_snippet:
           Точная цитата из договора. Если нет — "not_defined".

        6. lien_right_present_display:
           "Да" / "Нет" / "Не установлено".

        7. realization_procedure_display:
           "Установлен" / "Не установлен" / "Не указано".

        8. storage_cost_allocation_display:
           "Грузоотправитель" / "Перевозчик" / "Не указано".
        </task>

        <context_rules>
        - Перед остальными полями заполни lien_right_on_cargo_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все поля = "not_defined", все *_display = соответствующий fallback.
        - Не выводи право удержания из закона при отсутствии договорного условия.
        - Не путай удержание груза с залогом, неустойкой или приостановлением оказания услуг.
        - Если порядок реализации прямо не описан, но право удержания есть — realization_procedure = "no".
        - Если тема порядка реализации вообще не затронута — realization_procedure = "not_defined".
        - Прямое исключение права удержания (lien_right_present = "no") — это presence = "present", а не "missing".
        - Не используй "None", "null" или пустые строки.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет упоминания права удержания груза.
           → presence = "missing";
             lien_right_present = "not_defined";
             все остальные поля = "not_defined";
             все *_display = соответствующий fallback.

        2. Право удержания есть, но детали не раскрыты.
           "Перевозчик вправе удерживать груз до полной оплаты."
           → presence = "present";
             lien_right_present = "yes";
             realization_procedure = "no";
             storage_cost_allocation = "not_defined".

        3. Противоречие между фрагментами.
           В одном пункте — право удержания, в другом — обязанность
           выдать груз без удержания.
           → presence = "unclear";
             lien_right_present = "not_defined";
             lien_right_present_display = "Не установлено".

        4. Приостановление услуг ≠ удержание груза.
           "Перевозчик вправе приостановить оказание услуг до погашения
           задолженности."
           → presence = "missing";
             lien_right_present = "not_defined"
             (приостановление услуг — не удержание груза).
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для lien_right_on_cargo_presence используй только: "present", "missing", "unclear".
        - Для lien_right_present используй только: "yes", "no", "not_defined".
        - Для realization_procedure используй только: "yes", "no", "not_defined".
        - Для storage_cost_allocation используй только: "shipper", "carrier", "not_defined".
        - Fallback при отсутствии данных:
          * lien_conditions → "not_defined";
          * lien_snippet → "not_defined";
          * lien_right_present_display → "Не установлено";
          * realization_procedure_display → "Не указано";
          * storage_cost_allocation_display → "Не указано".
        - Fallback при противоречии или неоднозначности:
          * lien_right_present_display → "Не установлено".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "lien_right_on_cargo_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие условия о праве удержания груза. Внутреннее агрегатное signal-поле."
          required: true

        - name: "lien_right_present"
