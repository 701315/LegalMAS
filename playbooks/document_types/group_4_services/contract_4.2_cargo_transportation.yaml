          - penalty_for_non_supply_present: yes → "Предусмотрен", no → "Не предусмотрен", not_defined → "Не указано"
          - penalty_for_non_presentation_present: yes → "Предусмотрен", no → "Не предусмотрен", not_defined → "Не указано"
        8. Верни РОВНО один JSON-объект со всеми 7 ключами без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — штрафы указаны с конкретной ставкой:
        Фрагмент:
        "За неподачу транспортного средства под погрузку Перевозчик уплачивает Грузоотправителю штраф в размере 5 000 руб. за каждый факт неподачи. За непредъявление груза Грузоотправитель уплачивает Перевозчику штраф в размере 3 000 руб. Штраф не взимается, если сторона уведомила другую сторону об отмене заявки не менее чем за 24 часа."

        Ответ:
