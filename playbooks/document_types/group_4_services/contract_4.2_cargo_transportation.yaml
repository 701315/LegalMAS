      llm_prompt_extraction: |
        <role>
        Ты — российский юрист по транспортным договорам.
        Извлеки только условия об электронной транспортной накладной (ЭТрН).
        Не анализируй общий ЭДО для счетов и актов, если в нём не упоминается ЭТрН.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. electronic_waybill_terms_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если ewaybill_mentioned ∈ {"yes", "no"} ИЛИ edo_reference_present = "yes";
           - "missing" — если ewaybill_mentioned = "not_defined" И edo_reference_present = "not_defined"
             и фрагментов об ЭТрН или ЭДО в контексте нет;
           - "unclear" — если фрагменты по теме есть, но из-за противоречий вывод невозможен.

           Если presence = "missing":
           - ewaybill_mentioned = "not_defined";
           - ewaybill_mandatory = "not_defined";
           - platform_mentioned = "not_defined";
           - edo_reference_present = "not_defined";
           - ewaybill_snippet = "not_defined";
           - все *_display = соответствующий fallback;
           - не выполняй остальные шаги.

        1. ewaybill_mentioned:
           - "yes" — если электронная транспортная накладная (ЭТрН) прямо упомянута в договоре;
           - "no" — если в договоре прямо указано об отказе от оформления ЭТрН / накладная оформляется только на бумаге;
           - "not_defined" — если вопрос применения ЭТрН прямо не урегулирован.

        2. ewaybill_mandatory:
           - "yes" — если оформление электронной накладной обязательно для сторон;
           - "no" — если оформление ЭТрН прямо названо необязательным;
           - "optional" — если ЭТрН применяется по взаимному выбору / согласованию сторон;
           - "not_defined" — если обязательность прямо не урегулирована.

        3. platform_mentioned:
           - "ГИС ЭПД" — государственная информационная система электронных перевозочных документов;
           - "other" — иная платформа/оператор ЭДО, названный в тексте;
           - "not_defined" — платформа/система прямо не указана.

        4. edo_reference_present:
           - "yes" — если в договоре есть положения об электронном документообороте (ЭДО);
           - "no" — если ЭДО прямо исключён;
           - "not_defined" — если положения об ЭДО отсутствуют.

        5. ewaybill_snippet:
           Точная цитата из договора об условиях использования ЭТрН. Если нет — "not_defined".

        6. ewaybill_mentioned_display:
           "Упомянута" / "Не упомянута" / "Не указано".

        7. ewaybill_mandatory_display:
           "Обязательна" / "Не обязательна" / "По выбору сторон" / "Не указано".

        8. platform_mentioned_display:
           "ГИС ЭПД" / "Иная платформа" / "Не указана".

        9. edo_reference_present_display:
           "Есть" / "Нет" / "Не указано".
        </task>

        <context_rules>
        - Перед остальными полями заполни electronic_waybill_terms_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все поля = "not_defined" / соответствующий fallback.
        - Не считай любой общий электронный документооборот (для счетов/актов) автоматически оформлением ЭТрН.
        - Если есть только общая ссылка на ЭДО без упоминания транспортной накладной, ставь ewaybill_mentioned = "no", edo_reference_present = "yes".
        - Не используй "None", "null" или пустые строки.
        - Все 9 ключей должны присутствовать в JSON-ответе.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте договора нет ни единого упоминания ЭТрН, электронных накладных или ЭДО.
           → presence = "missing";
             ewaybill_mentioned = "not_defined";
             edo_reference_present = "not_defined".

        2. Общий ЭДО без упоминания накладных.
           "Стороны обмениваются первичными документами через Диадок." (про накладные ни слова).
           → presence = "present";
             ewaybill_mentioned = "no";
             edo_reference_present = "yes";
             platform_mentioned = "other".

        3. Противоречие между фрагментами.
           В одном месте накладная строго на бумажном носителе в 4-х экземплярах, в другом — обязательна ЭТрН.
           → presence = "unclear";
             ewaybill_mentioned = "not_defined";
             ewaybill_mandatory_display = "Не указано".

        4. ЭТрН без конкретной платформы.
           "Допускается оформление транспортной накладной в электронном виде." (платформа не названа).
           → presence = "present";
             ewaybill_mentioned = "yes";
             ewaybill_mandatory = "optional";
             platform_mentioned = "not_defined".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для electronic_waybill_terms_presence используй только: "present", "missing", "unclear".
        - Для ewaybill_mentioned, edo_reference_present используй только: "yes", "no", "not_defined".
        - Для ewaybill_mandatory используй только: "yes", "no", "optional", "not_defined".
        - Для platform_mentioned используй только: "ГИС ЭПД", "other", "not_defined".
        - Fallback при отсутствии данных:
          * ewaybill_snippet → "not_defined";
          * все *_display → соответствующие fallback-строки.
        - Fallback при противоречии или неоднозначности:
          * все *_display → соответствующие fallback-строки.
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
