        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
        - "invoice"
      preferred_clause_functions:
        - "procedures"
        - "remedies"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10
    evidence:
      required: true
      min_snippet_length: 20
      max_snippet_length: 500
    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 850
      compact_output: false
      llm_prompt_extraction: |
        <role>
        Ты — российский юрист по транспортным договорам.
        Извлеки условия претензионного порядка.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни:
        - claim_procedure_present: yes / no / not_found
        - claim_deadline: срок предъявления претензии или "not_defined"
        - response_deadline: срок ответа на претензию или "not_defined"
        - claim_form: written / any / not_specified / not_found
        - mandatory_before_court: yes / no / not_found
        - claim_deadline_for_loss: количество дней или "not_defined"
        - claim_deadline_for_delay: количество дней или "not_defined"

        Ответ верни строго в JSON.
        </task>

        <rules>
        - Не подменяй претензионный порядок "переговорами" без прямой обязанности предъявить претензию.
        - Отдельные сроки для утраты и просрочки указывай только если они специально выделены в тексте; единый общий срок фиксируй в claim_deadline.
        - Если письменная форма явно не указана, claim_form = not_specified или any только если это прямо следует из текста.
        </rules>
      fields:
        - name: "claim_procedure_present"
          type: "string"
          presentation: "signal"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Претензионный порядок установлен"
