        - name: "seasonal_restrictions_mentioned_display"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 1
          label: "Сезонные ограничения"
          description: >
            User-friendly отображение: упомянуты ли сезонные/временные ограничения движения. Fallback: "Не установлено" / "Не удалось определить".
          required: true
        - name: "responsible_party_display"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 2
          label: "Ответственная сторона"
          description: >
            User-friendly отображение стороны, ответственной за соблюдение ограничений. Fallback: "Не установлено" / "Не удалось определить".
          required: true
        - name: "permits_mentioned_display"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 3
          label: "Спецразрешения/пропуска"
          description: >
            User-friendly отображение: упомянуты ли специальные разрешения или пропуска. Fallback: "Не установлено" / "Не удалось определить".
          required: true
        - name: "cost_allocation_defined_display"
          type: "string"
          presentation: "fact"
          display_in_grid: true
