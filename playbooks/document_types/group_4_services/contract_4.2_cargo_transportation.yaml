  - id: limitation_period_notice
    name: "Срок исковой давности — транспортная специфика (ст. 797 ГК РФ)"
    description: >
      Проверяет упоминание сокращённого срока исковой давности по спорам из
      перевозки груза (1 год по ст. 797 ГК РФ вместо общего 3-летнего срока
      по ст. 196 ГК РФ) и то, как он сформулирован в договоре.
      Общий срок исковой давности проверяется отдельным global check-ом
      (limitation_periods_and_pre_claim_procedures) и не дублируется здесь.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "medium"
    severity_if_pass: "pass"
    severity_if_fail: "medium"
    severity_if_unclear: "low"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "исковая давность"
        - "срок давности"
        - "1 год"
        - "один год"
        - "12 месяцев"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)исков(ая|ой)\\s+давност"
        - "(?i)(1\\s+год|один\\s+год|12\\s+месяц)"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по транспортным договорам.
        Анализируется договор перевозки груза.
        Проверяется ТОЛЬКО транспортная специфика срока исковой давности:
        сокращённый 1-летний срок по ст. 797 ГК РФ (вместо общего 3-летнего
        срока по ст. 196 ГК РФ).

        Общий срок исковой давности НЕ проверяется в этом check-е — он покрыт
        отдельной проверкой.

        Нормативный ориентир:
        - ст. 797 ГК РФ
        - специальные транспортные уставы (УАТ, КТМ, УЖТ, ВК)

        [ЗАДАЧА]
        Установи:
        1. Упоминается ли в договоре срок исковой давности.
        2. Какое значение срока указано (особенно если это сокращённый 1-летний срок).
        3. Есть ли прямая ссылка на ст. 797 ГК РФ или иной правовой источник.
        4. Приведи точную цитату из договора.
        5. Сформируй user-friendly значения для отображения в DD Grid.

        [ПРАВИЛА]
        1. Используй только текст договора.
        2. Не подставляй "1 год" просто потому, что так сказано в законе.
        3. Если срок исковой давности не упомянут прямо — limitation_period_mentioned = "not_defined".
        4. Если срок упомянут, но его значение неясно — limitation_period_value = "not_defined".
        5. Не используй "None", "null" или пустые строки — используй "not_defined".
        6. В limitation_period_snippet включай только цитату из договора.
        7. Для *_display полей используй понятные русские формулировки:
          - limitation_period_mentioned: yes → "Да", no → "Нет", not_defined → "Не указано"
          - statutory_reference:
            * "ст. 797" → "Ст. 797 ГК РФ"
            * other → "Иной источник"
            * not_defined → "Не указан"
        8. Верни РОВНО один JSON-объект со всеми 6 ключами без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — сокращённый срок указан со ссылкой на закон:
        Фрагмент:
        "Срок исковой давности по спорам, возникающим из настоящего договора перевозки, составляет 1 (один) год с момента, определяемого в соответствии со статьёй 797 Гражданского кодекса Российской Федерации."

        Ответ:
        {
          "limitation_period_mentioned": "yes",
          "limitation_period_value": "1 год",
          "statutory_reference": "ст. 797",
          "limitation_period_snippet": "Срок исковой давности по спорам, возникающим из настоящего договора перевозки, составляет 1 (один) год с момента, определяемого в соответствии со статьёй 797 Гражданского кодекса Российской Федерации.",
          "limitation_period_mentioned_display": "Да",
          "statutory_reference_display": "Ст. 797 ГК РФ"
        }

        Пример 2 — срок исковой давности не упомянут:
        Фрагмент:
        "Перевозчик обязуется доставить груз в пункт назначения в установленный срок."

        Ответ:
        {
          "limitation_period_mentioned": "not_defined",
          "limitation_period_value": "not_defined",
          "statutory_reference": "not_defined",
          "limitation_period_snippet": "not_defined",
          "limitation_period_mentioned_display": "Не указано",
          "statutory_reference_display": "Не указан"
        }

        Пример 3 — текст есть, но вывод невозможен (размытая формулировка без конкретики):
        Фрагмент:
        "Сроки обращения в суд определяются в соответствии с действующим законодательством Российской Федерации."

        Ответ:
        {
          "limitation_period_mentioned": "yes",
          "limitation_period_value": "not_defined",
          "statutory_reference": "not_defined",
          "limitation_period_snippet": "Сроки обращения в суд определяются в соответствии с действующим законодательством Российской Федерации.",
          "limitation_period_mentioned_display": "Да",
          "statutory_reference_display": "Не указан"
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        Перед ответом внутренне проверь:
        1. Есть ли прямая цитата о сроке исковой давности.
        2. Не подставил ли ты срок из закона вместо текста договора.
        3. Есть ли прямая ссылка на конкретную статью.
        4. Если прямого указания нет — верни "not_defined".
        5. Все 6 ключей присутствуют в JSON.

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь РОВНО одним JSON-объектом без какого-либо дополнительного текста до или после, со всеми 6 ключами:
        {
          "limitation_period_mentioned": "<yes / no / not_defined>",
          "limitation_period_value": "<конкретный срок или not_defined>",
          "statutory_reference": "<ст. 797 / other / not_defined>",
          "limitation_period_snippet": "<точная цитата или not_defined>",
          "limitation_period_mentioned_display": "<Да / Нет / Не указано>",
          "statutory_reference_display": "<Ст. 797 ГК РФ / Иной источник / Не указан>"
        }
      context_k: 4
      temperature: 0.0
      max_tokens: 500
    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "исковая давность срок давности 1 год один год 12 месяцев срок обращения в суд сокращённый срок"
      preferred_unit_types:
        - dispute_resolution
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - procedures
        - boilerplate
      negative_keywords:
        - "провозная плата"
        - "форс-мажор"
        - "страхование"
        - "претензия"
        - "подсудность"
        - "арбитраж"
      position_bias:
        preferred_range: [0.4, 1.0]
        boost: 0.15
        scope: auto
      retrieval_profile: "dispute_resolution_check"
      context_k: 4
      max_chunks: 6
      rerank: true
    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
        - "invoice"
      preferred_clause_functions:
        - "procedures"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10
    evidence:
      required: true
      min_snippet_length: 15
      max_snippet_length: 300
    extraction:
      store_payload: true

      enabled: true
      mode: "hybrid"
      llm_max_tokens: 650
      compact_output: false
      llm_prompt_extraction: |
        <role>
        Ты — российский юрист по транспортным договорам.
        Извлеки условие о сроке исковой давности с акцентом на транспортную специфику
        (сокращённый 1-летний срок по ст. 797 ГК РФ).
        Не анализируй цену, сроки доставки, ответственность, претензии и иные разделы.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни:
        - limitation_period_mentioned: yes / no / not_defined
        - limitation_period_value: конкретный срок или "not_defined"
        - statutory_reference: ст. 797 / other / not_defined
        - limitation_period_snippet: точная цитата из договора или "not_defined"
        - limitation_period_mentioned_display: "Да" / "Нет" / "Не указано"
        - statutory_reference_display: "Ст. 797 ГК РФ" / "Иной источник" / "Не указан"

        Верни РОВНО один JSON-объект со всеми 6 ключами без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.
        </task>

        <rules>
        - Используй только текст документа.
        - Не подставляй срок из закона (ст. 797 ГК РФ) при отсутствии прямого упоминания в договоре.
        - Если срок упомянут, но его значение неясно — limitation_period_value = "not_defined".
        - Если срок исковой давности не упомянут прямо — limitation_period_mentioned = "not_defined".
        - Для *_display полей используй маппинг:
          * limitation_period_mentioned: yes → "Да", no → "Нет", not_defined → "Не указано"
          * statutory_reference: ст. 797 → "Ст. 797 ГК РФ", other → "Иной источник", not_defined → "Не указан"
        - Не используй "None", "null" или пустые строки.
        - Все 6 ключей должны присутствовать в JSON-ответе.
        </rules>
      fields:
