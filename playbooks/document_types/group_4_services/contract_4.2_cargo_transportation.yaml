        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист по транспортным договорам.
        Извлеки договорные транспортные основания освобождения перевозчика от ответственности:
        вина грузоотправителя, свойства груза, дефекты упаковки/тары.
        НЕ извлекай форс-мажор — он покрыт отдельной проверкой.
        Не анализируй лимиты ответственности, цену, сроки, претензии и иные разделы.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. exclusions_from_liability_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей (shipper_fault_included, cargo_properties_included, packaging_defects_included) ∈ {"yes", "no"};
           - "missing" — если все три поля равны "not_defined"
             и фрагментов о транспортных основаниях освобождения от ответственности в контексте нет;
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - shipper_fault_included = "not_defined";
           - cargo_properties_included = "not_defined";
           - packaging_defects_included = "not_defined";
           - exhaustive_list = "not_defined";
           - exclusions_snippet = "not_defined";
           - все *_display = соответствующий fallback;
           - не выполняй остальные шаги.

        1. shipper_fault_included:
           - "yes" — если вина грузоотправителя прямо названа как основание освобождения от ответственности;
           - "no" — если прямо указано, что вина грузоотправителя не освобождает перевозчика от ответственности;
           - "not_defined" — если вопрос ответственности за вину грузоотправителя прямо не упомянут.

        2. cargo_properties_included:
           - "yes" — если естественные/внутренние свойства груза прямо названы как основание освобождения перевозчика;
           - "no" — если прямо указано, что перевозчик отвечает за убытки из-за свойств груза;
           - "not_defined" — если свойства груза в качестве исключения прямо не упомянуты.

        3. packaging_defects_included:
           - "yes" — если дефекты упаковки, тары или неправильная маркировка грузоотправителя прямо названы как основание освобождения перевозчика;
           - "no" — если прямо указано, что перевозчик отвечает за дефекты тары/упаковки;
           - "not_defined" — если дефекты упаковки/тары в качестве исключения прямо не упомянуты.

        4. exhaustive_list:
           - "yes" — если перечень транспортных исключений из ответственности прямо назван исчерпывающим (закрытым);
           - "no" — если перечень прямо открыт (содержит слова "и другие", "в том числе" и т.д.);
           - "not_defined" — если характер перечня не ясен или исключения отсутствуют.

        5. exclusions_snippet:
           Точная цитата из договора со списком исключений из ответственности. Если нет — "not_defined".

        6. shipper_fault_included_display:
           "Да" / "Нет" / "Не указано".

        7. cargo_properties_included_display:
           "Да" / "Нет" / "Не указано".

        8. packaging_defects_included_display:
           "Да" / "Нет" / "Не указано".

        9. exhaustive_list_display:
           "Закрытый" / "Открытый" / "Не определён".
        </task>

        <context_rules>
        - Перед остальными полями заполни exclusions_from_liability_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все поля = "not_defined" / соответствующий fallback.
        - Не путай транспортные основания освобождения с лимитом ответственности.
        - НЕ извлекай форс-мажор — он покрыт отдельной global проверкой.
        - Если основание только подразумевается, но прямо не прописано в договоре, используй "not_defined".
        - Не используй "None", "null" или пустые строки.
        - Все 9 ключей должны присутствовать в JSON-ответе.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте договора нет упоминания оснований освобождения перевозчика от ответственности за сохранность груза.
           → presence = "missing";
             shipper_fault_included = "not_defined";
             exclusions_snippet = "not_defined".

        2. Частичные транспортные исключения.
           "Перевозчик не отвечает за утрату груза, произошедшую по вине Грузоотправителя."
           → presence = "present";
             shipper_fault_included = "yes";
             cargo_properties_included = "not_defined";
             packaging_defects_included = "not_defined".

        3. Противоречие между фрагментами.
           В одном месте перевозчик отвечает за дефекты тары, в другом — освобождается от ответственности при дефектах упаковки.
           → presence = "unclear";
             packaging_defects_included = "not_defined";
             exhaustive_list_display = "Не определён".

        4. Форс-мажор вместо транспортных оснований.
           "Перевозчик освобождается от ответственности только в случае форс-мажора (землетрясение, война)."
           → presence = "missing";
             shipper_fault_included = "not_defined"
             (это форс-мажор, не относящийся к транспортной специфике ГК РФ).
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для exclusions_from_liability_presence используй только: "present", "missing", "unclear".
        - Для shipper_fault_included, cargo_properties_included, packaging_defects_included, exhaustive_list используй только: "yes", "no", "not_defined".
        - Fallback при отсутствии данных:
          * exclusions_snippet → "not_defined";
          * все *_display → соответствующие fallback-строки.
        - Fallback при противоречии или неоднозначности:
          * все *_display → соответствующие fallback-строки.
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "exclusions_from_liability_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие условий о транспортных основаниях освобождения от ответственности. Внутреннее агрегатное signal-поле."
          required: true

        - name: "shipper_fault_included"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Вина грузоотправителя включена как основание освобождения. Внутреннее enum-поле."
          required: true
          display_in_grid: false
        - name: "cargo_properties_included"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Свойства груза включены как основание освобождения. Внутреннее enum-поле."
          required: true
          display_in_grid: false
        - name: "packaging_defects_included"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Дефекты упаковки/тары включены как основание освобождения. Внутреннее enum-поле."
          required: true
          display_in_grid: false
        - name: "exhaustive_list"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Перечень оснований закрытый. Внутреннее enum-поле."
          required: true
          display_in_grid: false
        - name: "exclusions_snippet"
          type: "string"
          presentation: "diagnostic"
          display_in_grid: false
          description: "Цитата об основаниях освобождения от ответственности"
          required: true
        - name: "shipper_fault_included_display"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 1
          label: "Вина грузоотправителя"
          description: >
            User-friendly отображение: упомянута ли вина грузоотправителя
            как основание освобождения.
            Fallback: "Не указано" / "Не удалось определить".
          required: true
        - name: "cargo_properties_included_display"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 2
          label: "Свойства груза"
          description: >
            User-friendly отображение: упомянуты ли свойства груза
            как основание освобождения.
            Fallback: "Не указано" / "Не удалось определить".
          required: true
        - name: "packaging_defects_included_display"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 3
          label: "Дефекты упаковки"
          description: >
            User-friendly отображение: упомянуты ли дефекты упаковки/тары
            как основание освобождения.
            Fallback: "Не указано" / "Не удалось определить".
          required: true
        - name: "exhaustive_list_display"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 4
          label: "Характер перечня"
          description: >
            User-friendly отображение: закрытый или открытый перечень оснований освобождения. Fallback: "Не установлено" / "Не удалось определить".
          required: true
      store_payload: true

  - id: pretension_order
    name: "Транспортный претензионный порядок: сроки при утрате, просрочке (ст. 797 ГК РФ)"
    description: >
      Проверяет транспортную специфику претензионного порядка: отдельные сроки
      предъявления претензии при утрате/повреждении груза и при просрочке доставки
      (ст. 797 ГК РФ, УАТ, КТМ и иные уставы). Общий претензионный порядок
      (форма, обязательность до суда, общий срок) проверяется отдельным
      global check-ом (limitation_periods_and_pre_claim_procedures) и не
      дублируется здесь.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "претензия при утрате"
        - "претензия при просрочке"
        - "претензия при повреждении"
        - "срок претензии по утрате"
        - "срок претензии по просрочке"
        - "претензия перевозчику"
        - "претензия грузоотправителю"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)претенз.*при.*(утрат|поврежден|просрочк|недостач)"
        - "(?i)срок.*(претенз|предъявлен).*(утрат|просрочк)"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по транспортным договорам.
        Анализируется договор перевозки груза.
        Проверяется ТОЛЬКО транспортная специфика претензионного порядка:
        отдельные сроки предъявления претензии при утрате/повреждении груза
        и при просрочке доставки (ст. 797 ГК РФ, УАТ, КТМ и иные уставы).

        Общий претензионный порядок (форма, обязательность до суда, общий срок)
        НЕ проверяется в этом check-е — он покрыт отдельной проверкой.

        Нормативный ориентир:
        - ст. 797 ГК РФ
        - УАТ (ФЗ-259)
        - КТМ, КВВТ, УЖТ, ВК

        [ЗАДАЧА]
        Установи:
        1. Есть ли в договоре отдельный срок предъявления претензии при утрате или повреждении груза.
        2. Есть ли в договоре отдельный срок предъявления претензии при просрочке доставки.
        3. Есть ли общий срок предъявления претензии (если он специально выделен для транспортных споров).
        4. Есть ли срок ответа на претензию (если он специально выделен для транспортных споров).
        5. Приведи точную цитату из договора.
        6. Сформируй user-friendly значения для отображения в DD Grid.

        [ПРАВИЛА]
        1. Используй только текст договора.
        2. Не подставляй сроки из закона (ст. 797 ГК РФ, УАТ), если их нет в договоре.
        3. Не путай общий претензионный порядок с транспортной спецификой сроков.
        4. Если срок только общий (без разделения на утрату/просрочку) — фиксируй его в claim_deadline, а отдельные сроки = "not_defined".
        5. Если в договоре есть отдельные сроки для утраты/просрочки — фиксируй их в соответствующих полях.
        6. Не используй "None", "null" или пустые строки — используй "not_defined".
        7. В pretension_snippet включай только цитату из договора.
        8. Для *_display полей используй понятные русские формулировки:
          - claim_procedure_present: yes → "Установлен", no → "Не установлен", not_defined → "Не указано"
          - claim_form: written → "Письменная", any → "Любая", not_defined → "Не указана"
          - mandatory_before_court: yes → "Обязателен", no → "Не обязателен", not_defined → "Не указано"
        9. Верни РОВНО один JSON-объект со всеми 11 ключами без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — отдельные сроки для утраты и просрочки:
        Фрагмент:
        "Претензии по утрате, недостаче или повреждению груза могут быть предъявлены в течение 6 (шести) месяцев с даты сдачи груза к перевозке. Претензии по просрочке доставки груза могут быть предъявлены в течение 2 (двух) месяцев с даты, когда груз должен был быть доставлен. Перевозчик обязан рассмотреть претензию и дать ответ в течение 30 (тридцати) дней."

        Ответ:
        {
          "claim_procedure_present": "yes",
          "claim_deadline": "not_defined",
          "response_deadline": "30 дней",
          "claim_form": "not_defined",
          "mandatory_before_court": "not_defined",
          "claim_deadline_for_loss": "6 месяцев с даты сдачи груза к перевозке",
          "claim_deadline_for_delay": "2 месяца с даты, когда груз должен был быть доставлен",
          "pretension_snippet": "Претензии по утрате, недостаче или повреждению груза могут быть предъявлены в течение 6 (шести) месяцев с даты сдачи груза к перевозке. Претензии по просрочке доставки груза могут быть предъявлены в течение 2 (двух) месяцев с даты, когда груз должен был быть доставлен. Перевозчик обязан рассмотреть претензию и дать ответ в течение 30 (тридцати) дней.",
          "claim_procedure_present_display": "Установлен",
          "claim_form_display": "Не указана",
          "mandatory_before_court_display": "Не указано"
        }

        Пример 2 — общий срок без разделения:
        Фрагмент:
        "Срок предъявления претензий по договору составляет 1 (один) год с даты нарушения обязательства."

        Ответ:
        {
          "claim_procedure_present": "yes",
          "claim_deadline": "1 год с даты нарушения обязательства",
          "response_deadline": "not_defined",
          "claim_form": "not_defined",
          "mandatory_before_court": "not_defined",
          "claim_deadline_for_loss": "not_defined",
          "claim_deadline_for_delay": "not_defined",
          "pretension_snippet": "Срок предъявления претензий по договору составляет 1 (один) год с даты нарушения обязательства.",
          "claim_procedure_present_display": "Установлен",
          "claim_form_display": "Не указана",
          "mandatory_before_court_display": "Не указано"
        }

        Пример 3 — текст есть, но вывод невозможен (размытая формулировка без конкретики):
        Фрагмент:
        "Споры по договору разрешаются в порядке, предусмотренном действующим законодательством."

        Ответ:
        {
          "claim_procedure_present": "not_defined",
          "claim_deadline": "not_defined",
          "response_deadline": "not_defined",
          "claim_form": "not_defined",
          "mandatory_before_court": "not_defined",
          "claim_deadline_for_loss": "not_defined",
          "claim_deadline_for_delay": "not_defined",
          "pretension_snippet": "Споры по договору разрешаются в порядке, предусмотренном действующим законодательством.",
          "claim_procedure_present_display": "Не указано",
          "claim_form_display": "Не указана",
          "mandatory_before_court_display": "Не указано"
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        Перед ответом внутренне проверь:
        1. Есть ли прямая цитата о сроках претензий именно по транспортным основаниям (утрата/просрочка).
        2. Не подставил ли ты сроки из закона вместо текста договора.
        3. Различаешь ли ты общий срок и специальные сроки для утраты/просрочки.
        4. Если прямого указания нет — верни "not_defined".
        5. Все 11 ключей присутствуют в JSON.

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь РОВНО одним JSON-объектом без какого-либо дополнительного текста до или после, со всеми 11 ключами:
        {
          "claim_procedure_present": "<yes / no / not_defined>",
          "claim_deadline": "<общий срок или not_defined>",
          "response_deadline": "<срок ответа или not_defined>",
          "claim_form": "<written / any / not_defined>",
          "mandatory_before_court": "<yes / no / not_defined>",
          "claim_deadline_for_loss": "<срок при утрате/повреждении или not_defined>",
          "claim_deadline_for_delay": "<срок при просрочке или not_defined>",
          "pretension_snippet": "<точная цитата или not_defined>",
          "claim_procedure_present_display": "<Установлен / Не установлен / Не указано>",
          "claim_form_display": "<Письменная / Любая / Не указана>",
          "mandatory_before_court_display": "<Обязателен / Не обязателен / Не указано>"
        }
      context_k: 5
      temperature: 0.0
      max_tokens: 750
    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "претензия при утрате претензия при просрочке претензия при повреждении претензия при недостаче срок претензии по утрате срок претензии по просрочке претензия перевозчику грузоотправителю"
      preferred_unit_types:
        - dispute_resolution
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - procedures
        - remedies
      negative_keywords:
        - "провозная плата"
        - "форс-мажор"
        - "страхование"
        - "качество груза"
        - "подсудность"
        - "арбитраж"
      position_bias:
        preferred_range: [0.4, 1.0]
        boost: 0.20
        scope: auto
      retrieval_profile: "dispute_resolution_check"
      context_k: 5
      max_chunks: 7
      rerank: true
    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
        - "invoice"
      preferred_clause_functions:
        - "procedures"
        - "remedies"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10
    evidence:
      required: true
      min_snippet_length: 20
      max_snippet_length: 500
    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1100

      compact_output: false

      presence_signal:
        field: "pretension_order_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист по транспортным договорам.
        Извлеки ТОЛЬКО транспортную специфику претензионного порядка:
        отдельные сроки предъявления претензии при утрате/повреждении груза
        и при просрочке доставки (ст. 797 ГК РФ, УАТ, КТМ и иные уставы).
        Общий претензионный порядок НЕ извлекай — он покрыт отдельной проверкой.
        Не анализируй цену, сроки доставки, ответственность, приёмку груза и иные разделы.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. pretension_order_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если claim_procedure_present = "yes" ИЛИ хотя бы одно из полей (claim_deadline, claim_deadline_for_loss, claim_deadline_for_delay) ≠ "not_defined";
           - "missing" — если все три поля равны "not_defined" И claim_procedure_present ≠ "yes", и фрагментов о претензионном порядке в контексте нет;
           - "unclear" — если фрагменты по теме есть, но из-за противоречий вывод невозможен.

           Если presence = "missing":
           - claim_procedure_present = "not_defined";
           - claim_deadline = "not_defined";
           - response_deadline = "not_defined";
           - claim_form = "not_defined";
           - mandatory_before_court = "not_defined";
           - claim_deadline_for_loss = "not_defined";
           - claim_deadline_for_delay = "not_defined";
           - pretension_snippet = "not_defined";
           - все *_display = соответствующий fallback;
           - не выполняй остальные шаги.

        1. claim_procedure_present:
           - "yes" — если специальный претензионный порядок по транспортным спорам (утрата/задержка груза) прямо установлен договором;
           - "no" — если в договоре прямо указано, что претензионный порядок исключён (для транспортных споров это нетипично);
           - "not_defined" — если порядок прямо не упомянут.

        2. claim_deadline:
           Общий срок предъявления претензии из текста договора (например: "в течение 1 года").
           Если не указан или урегулированы только специальные сроки по утрате/просрочке — "not_defined".

        3. response_deadline:
           Срок ответа на претензию, установленный специально для транспортных споров (например: "30 дней").
           Если не указан — "not_defined".

        4. claim_form:
           - "written" — письменная форма;
           - "any" — любая форма (включая устную);
           - "not_defined" — форма явно не указана.

        5. mandatory_before_court:
           - "yes" — если до обращения в суд обязательно соблюдение претензионного порядка;
           - "no" — если претензионный порядок прямо назван необязательным;
           - "not_defined" — если обязательность прямо не урегулирована.

        6. claim_deadline_for_loss:
           Специальный сокращенный срок предъявления претензии при утрате, недостаче или повреждении груза
           (например: "6 месяцев с даты выдачи").
           Если не выделен отдельно от общего срока — "not_defined".

        7. claim_deadline_for_delay:
           Специальный сокращенный срок предъявления претензии при просрочке доставки груза
           (например: "45 дней со дня нарушения").
           Если не выделен отдельно от общего срока — "not_defined".

        8. pretension_snippet:
           Точная цитата из договора со сроками претензий. Если нет — "not_defined".

        9. claim_procedure_present_display:
           "Установлен" / "Не установлен" / "Не указано".

        10. claim_form_display:
            "Письменная" / "Любая" / "Не указана".

        11. mandatory_before_court_display:
            "Обязателен" / "Не обязателен" / "Не указано".
        </task>

        <context_rules>
        - Перед остальными полями заполни pretension_order_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все поля = "not_defined" / соответствующий fallback.
        - Не путай общий претензионный порядок ( email, ЭДО в договоре) с транспортной спецификой сокращённых сроков при утрате/задержке.
        - Не подставляй законные сроки (ст. 797 ГК РФ), если они отсутствуют в тексте самого договора.
        - Если письменная форма явно не названа в связи с транспортными спорами, используй "not_defined" для claim_form.
        - Не используй "None", "null" или пустые строки.
        - Все 11 ключей должны присутствовать в JSON-ответе.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В договоре нет ни слова о транспортном претензионном порядке и специальных сроках.
           → presence = "missing";
             claim_procedure_present = "not_defined";
             все sub-поля = "not_defined".

        2. Общий срок без разделения.
           "Претензии к качеству перевозки предъявляются в течение 1 года с даты инцидента."
           → presence = "present";
             claim_deadline = "1 год";
             claim_deadline_for_loss = "not_defined";
             claim_deadline_for_delay = "not_defined".

        3. Противоречие между фрагментами.
           В одном месте указан срок 30 дней для всех претензий, в другом — 6 месяцев для претензий по утрате груза.
           → presence = "unclear";
             claim_deadline = "not_defined";
             claim_deadline_for_loss = "Не удалось определить".

        4. Претензионный порядок во внешнем документе.
           "Порядок и сроки предъявления претензий регулируются правилами, указанными на сайте Перевозчика."
           → presence = "present";
             claim_procedure_present = "yes";
             pretension_snippet содержит цитату с отсылкой к сайту.
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для pretension_order_presence используй только: "present", "missing", "unclear".
        - Для claim_procedure_present, mandatory_before_court используй только: "yes", "no", "not_defined".
        - Для claim_form используй только: "written", "any", "not_defined".
        - Fallback при отсутствии данных:
          * все текстовые поля → "not_defined";
          * все *_display → "Не указано" / "Не указана".
        - Fallback при противоречии или неоднозначности:
          * все *_display → соответствующие fallback-строки.
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "pretension_order_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие транспортного претензионного порядка. Внутреннее агрегатное signal-поле."
          required: true

        - name: "claim_procedure_present"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Претензионный порядок установлен. Внутреннее enum-поле."
          required: true
          display_in_grid: false
        - name: "claim_deadline"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 1
          label: "Общий срок претензии"
          description: >
            Общий срок предъявления претензии (если специально выделен
            для транспортных споров).
            Fallback: "not_defined" / "Не удалось определить".
          required: true
        - name: "response_deadline"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 2
          label: "Срок ответа"
          description: >
            Срок ответа на претензию. Fallback: "Не установлено" / "Не удалось определить".
          required: true
        - name: "claim_form"
          type: "string"
          presentation: "signal"
          risk_weight: "low"
          allowed_values: ["written", "any", "not_defined"]
          description: "Форма претензии. Внутреннее enum-поле."
          required: true
          display_in_grid: false
        - name: "mandatory_before_court"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Претензия обязательна до суда. Внутреннее enum-поле."
          required: true
          display_in_grid: false
        - name: "claim_deadline_for_loss"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 3
          label: "Срок претензии (утрата/повреждение)"
          description: >
            Срок предъявления претензии при утрате или повреждении груза. Fallback: "Не установлено" / "Не удалось определить".
          required: true
        - name: "claim_deadline_for_delay"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 4
          label: "Срок претензии (просрочка)"
          description: >
            Срок предъявления претензии при просрочке доставки. Fallback: "Не установлено" / "Не удалось определить".
          required: true
        - name: "pretension_snippet"
          type: "string"
          presentation: "diagnostic"
          display_in_grid: false
          description: "Цитата о претензионном порядке"
          required: true
        - name: "claim_procedure_present_display"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 5
          label: "Претензионный порядок"
          description: >
            User-friendly отображение: установлен ли претензионный порядок. Fallback: "Не установлено" / "Не удалось определить".
          required: true
        - name: "claim_form_display"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 6
          label: "Форма претензии"
          description: >
            User-friendly отображение формы претензии. Fallback: "Не установлено" / "Не удалось определить".
          required: true
        - name: "mandatory_before_court_display"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 7
          label: "Обязательность до суда"
          description: >
            User-friendly отображение: обязательна ли претензия до обращения в суд. Fallback: "Не установлено" / "Не удалось определить".
          required: true
      store_payload: true

  - id: limitation_period_notice
    name: "Срок исковой давности — transportная специфика (ст. 797 ГК РФ)"
    description: >
      Проверяет упоминание сокращённого срока исковой давности по спорам из
      перевозки груза (1 год по ст. 797 ГК РФ вместо общего 3-летнего срока
      по ст. 196 ГК РФ) и то, как он сформулирован в договоре.
      Общий срок исковой давности проверяется отдельным global check-ом
      (limitation_periods_and_pre_claim_procedures) и не дублируется здесь.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "medium"
    severity_if_pass: "pass"
    severity_if_fail: "medium"
    severity_if_unclear: "low"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "исковая давность"
        - "срок давности"
        - "1 год"
        - "один год"
        - "12 месяцев"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)исков(ая|ой)\\s+давност"
        - "(?i)(1\\s+год|один\\s+год|12\\s+месяц)"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по транспортным договорам.
        Анализируется договор перевозки груза.
        Проверяется ТОЛЬКО транспортная специфика срока исковой давности:
        сокращённый 1-летний срок по ст. 797 ГК РФ (вместо общего 3-летнего
        срока по ст. 196 ГК РФ).

        Общий срок исковой давности НЕ проверяется в этом check-е — он покрыт
        отдельной проверкой.

        Нормативный ориентир:
        - ст. 797 ГК РФ
        - специальные транспортные уставы (УАТ, КТМ, УЖТ, ВК)

        [ЗАДАЧА]
        Установи:
        1. Упоминается ли в договоре срок исковой давности.
        2. Какое значение срока указано (особенно если это сокращённый 1-летний срок).
        3. Есть ли прямая ссылка на ст. 797 ГК РФ или иной правовой источник.
        4. Приведи точную цитату из договора.
        5. Сформируй user-friendly значения для отображения в DD Grid.

        [ПРАВИЛА]
        1. Используй только текст договора.
        2. Не подставляй "1 год" просто потому, что так сказано в законе.
        3. Если срок исковой давности не упомянут прямо — limitation_period_mentioned = "not_defined".
        4. Если срок упомянут, но его значение неясно — limitation_period_value = "not_defined".
        5. Не используй "None", "null" или пустые строки — используй "not_defined".
        6. В limitation_period_snippet включай только цитату из договора.
        7. Для *_display полей используй понятные русские формулировки:
          - limitation_period_mentioned: yes → "Да", no → "Нет", not_defined → "Не указано"
          - statutory_reference:
            * "ст. 797" → "Ст. 797 ГК РФ"
            * other → "Иной источник"
            * not_defined → "Не указан"
        8. Верни РОВНО один JSON-объект со всеми 6 ключами без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — сокращённый срок указан со ссылкой на закон:
        Фрагмент:
        "Срок исковой давности по спорам, возникающим из настоящего договора перевозки, составляет 1 (один) год с момента, определяемого в соответствии со статьёй 797 Гражданского кодекса Российской Федерации."

        Ответ:
        {
          "limitation_period_mentioned": "yes",
          "limitation_period_value": "1 год",
          "statutory_reference": "ст. 797",
          "limitation_period_snippet": "Срок исковой давности по спорам, возникающим из настоящего договора перевозки, составляет 1 (один) год с момента, определяемого в соответствии со статьёй 797 Гражданского кодекса Российской Федерации.",
          "limitation_period_mentioned_display": "Да",
          "statutory_reference_display": "Ст. 797 ГК РФ"
        }

        Пример 2 — срок исковой давности не упомянут:
        Фрагмент:
        "Перевозчик обязуется доставить груз в пункт назначения в установленный срок."

        Ответ:
        {
          "limitation_period_mentioned": "not_defined",
          "limitation_period_value": "not_defined",
          "statutory_reference": "not_defined",
          "limitation_period_snippet": "not_defined",
          "limitation_period_mentioned_display": "Не указано",
          "statutory_reference_display": "Не указан"
        }

        Пример 3 — текст есть, но вывод невозможен (размытая формулировка без конкретики):
        Фрагмент:
        "Сроки обращения в суд определяются в соответствии с действующим законодательством Российской Федерации."

        Ответ:
        {
          "limitation_period_mentioned": "yes",
          "limitation_period_value": "not_defined",
          "statutory_reference": "not_defined",
          "limitation_period_snippet": "Сроки обращения в суд определяются в соответствии с действующим законодательством Российской Федерации.",
          "limitation_period_mentioned_display": "Да",
          "statutory_reference_display": "Не указан"
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        Перед ответом внутренне проверь:
        1. Есть ли прямая цитата о сроке исковой давности.
        2. Не подставил ли ты срок из закона вместо текста договора.
        3. Есть ли прямая ссылка на конкретную статью.
        4. Если прямого указания нет — верни "not_defined".
        5. Все 6 ключей присутствуют в JSON.

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь РОВНО одним JSON-объектом со всеми 6 ключами без какого-либо дополнительного текста до или после, со всеми 6 ключами:
        {
          "limitation_period_mentioned": "<yes / no / not_defined>",
          "limitation_period_value": "<конкретный срок или not_defined>",
          "statutory_reference": "<ст. 797 / other / not_defined>",
          "limitation_period_snippet": "<точная цитата или not_defined>",
          "limitation_period_mentioned_display": "<Да / Нет / Не указано>",
          "statutory_reference_display": "<Ст. 797 ГК РФ / Иной источник / Не указан>"
        }
      context_k: 4
      temperature: 0.0
      max_tokens: 500
    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "исковая давность срок давности 1 год один год 12 месяцев срок обращения в суд сокращённый срок"
      preferred_unit_types:
        - dispute_resolution
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - procedures
        - boilerplate
      negative_keywords:
        - "провозная плата"
        - "форс-мажор"
        - "страхование"
        - "претензия"
        - "подсудность"
        - "арбитраж"
      position_bias:
        preferred_range: [0.4, 1.0]
        boost: 0.15
        scope: auto
      retrieval_profile: "dispute_resolution_check"
      context_k: 4
      max_chunks: 6
      rerank: true
    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
        - "invoice"
      preferred_clause_functions:
        - "procedures"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10
    evidence:
      required: true
      min_snippet_length: 15
      max_snippet_length: 300
    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1100

      compact_output: false

      presence_signal:
        field: "limitation_period_notice_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист по транспортным договорам.
        Извлеки условие о сроке исковой давности с акцентом на транспортную специфику
        (сокращённый 1-летний срок по ст. 797 ГК РФ).
        Не анализируй цену, сроки доставки, ответственность, претензии и иные разделы.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. limitation_period_notice_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если limitation_period_mentioned ∈ {"yes", "no"};
           - "missing" — если limitation_period_mentioned = "not_defined"
             и фрагментов о сроках исковой давности в контексте нет;
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - limitation_period_mentioned = "not_defined";
           - limitation_period_value = "not_defined";
           - statutory_reference = "not_defined";
           - limitation_period_snippet = "not_defined";
           - все *_display = соответствующий fallback;
           - не выполняй остальные шаги.

        1. limitation_period_mentioned:
           - "yes" — если срок исковой давности по спорам из перевозки груза прямо упомянут в договоре;
           - "no" — если в договоре прямо указано об отсутствии договорных соглашений по исковой давности;
           - "not_defined" — если срок исковой давности прямо не упомянут.

        2. limitation_period_value:
           Конкретный размер срока давности из текста договора (например: "1 год", "12 месяцев").
           Если упомянут без конкретного срока — "not_defined".

        3. statutory_reference:
           - "ст. 797" — прямая ссылка на ст. 797 ГК РФ;
           - "other" — иная статья или ссылка на транспортный устав (УАТ, КТМ и т.д.);
           - "not_defined" — ссылка на конкретный правовой источник отсутствует.

        4. limitation_period_snippet:
           Точная цитата из договора о сроке исковой давности. Если нет — "not_defined".

        5. limitation_period_mentioned_display:
           "Да" / "Нет" / "Не указано".

        6. statutory_reference_display:
           "Ст. 797 ГК РФ" / "Иной источник" / "Не указан".
        </task>

        <context_rules>
        - Перед остальными полями заполни limitation_period_notice_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все поля = "not_defined" / соответствующий fallback.
        - Не подставляй сокращённый срок давности (1 год) из закона при его отсутствии в самом договоре.
        - Прямое указание на отсутствие ограничений срока перевозки (limitation_period_mentioned = "no") — это presence = "present", а не "missing".
        - Не используй "None", "null" или пустые строки.
        - Все 6 ключей должны присутствовать в JSON-ответе.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В договоре перевозки вообще нет упоминания срока исковой давности.
           → presence = "missing";
             limitation_period_mentioned = "not_defined";
             limitation_period_value = "not_defined".

        2. Общий 3-летний срок.
           "Срок исковой давности составляет три года в соответствии со ст. 196 ГК РФ."
           → presence = "present";
             limitation_period_mentioned = "yes";
             limitation_period_value = "3 года";
             statutory_reference = "other".

        3. Противоречие между фрагментами.
           В одном месте указан срок давности 1 год, в другом — 3 года для транспортных споров.
           → presence = "unclear";
             limitation_period_value = "Не удалось определить";
             limitation_period_mentioned = "yes".

        4. Отсылка на закон без прямого срока "1 год".
           "Исковая давность по спорам регулируется положениями ст. 797 ГК РФ."
           → presence = "present";
             limitation_period_mentioned = "yes";
             limitation_period_value = "согласно закону";
             statutory_reference = "ст. 797".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для limitation_period_notice_presence используй только: "present", "missing", "unclear".
        - Для limitation_period_mentioned используй только: "yes", "no", "not_defined".
        - Для statutory_reference используй только: "ст. 797", "other", "not_defined".
        - Fallback при отсутствии данных:
          * limitation_period_value, limitation_period_snippet → "not_defined";
          * все *_display → соответствующие fallback-строки.
        - Fallback при противоречии или неоднозначности:
          * все *_display → соответствующие fallback-строки.
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "limitation_period_notice_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие условия о сроке исковой давности. Внутреннее агрегатное signal-поле."
          required: true

        - name: "limitation_period_mentioned"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Срок исковой давности упомянут. Внутреннее enum-поле."
          required: true
          display_in_grid: false
        - name: "limitation_period_value"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 1
          label: "Срок исковой давности"
          description: >
            Значение срока исковой давности (транспортная специфика —
            1 год по ст. 797 ГК РФ).
            Fallback: "not_defined" / "Не удалось определить".
          required: true
        - name: "statutory_reference"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["ст. 797", "other", "not_defined"]
          description: "Ссылка на правовой источник. Внутреннее enum-поле."
          required: true
          display_in_grid: false
        - name: "limitation_period_snippet"
          type: "string"
          presentation: "diagnostic"
          display_in_grid: false
          description: "Цитата о сроке исковой давности"
          required: true
        - name: "limitation_period_mentioned_display"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 2
          label: "Срок давности упомянут"
          description: >
            User-friendly отображение: упомянут ли срок исковой давности в договоре. Fallback: "Не установлено" / "Не удалось определить".
          required: true
        - name: "statutory_reference_display"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 3
          label: "Правовой источник"
          description: >
            User-friendly отображение ссылки на правовой источник срока исковой давности. Fallback: "Не установлено" / "Не удалось определить".
          required: true
      store_payload: true

  - id: cargo_insurance_clause
    name: "Страхование груза"
    description: >
      Проверяет договорные условия страхования груза: обязательность,
      страхующую сторону, вид покрытия и распределение риска.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "страхование груза"
        - "страховой полис"
        - "страховая сумма"
        - "выгодоприобретатель"
        - "страховой случай"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)страхован(ие|ия)\\s+груз"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по транспортным договорам.
        Анализируется договор перевозки груза.
        Проверяются только договорные условия страхования груза.

        [ЗАДАЧА]
        Установи:
        1. Есть ли в договоре условие о страховании груза.
        2. Является ли страхование обязательным.
        3. Кто обязан страховать груз.
        4. Описан ли вид страхового покрытия.
        5. Есть ли указание на выгодоприобретателя.
        6. Установлена ли объявленная ценность (стоимость) груза.
        7. Чему равна объявленная ценность, если она указана.
        8. Приведи точную цитату из договора.
        9. Сформируй user-friendly значения для отображения в DD Grid.

        [ПРАВИЛА]
        1. Используй только текст договора.
        2. Не подменяй страхование общими словами о риске.
        3. Если договор только допускает страхование — insurance_required = "optional".
        4. Если выгодоприобретатель прямо не указан — не додумывай.
        5. Объявленную ценность груза не путай со страховой суммой.
        6. Не используй "None", "null" или пустые строки — используй "not_defined".
        7. В cargo_insurance_snippet включай только цитату из договора.
        8. Для *_display полей используй понятные русские формулировки:
          - insurance_present: yes → "Предусмотрено", no → "Не предусмотрено", not_defined → "Не указано"
          - insurance_required: yes → "Обязательно", no → "Не обязательно", optional → "По согласованию", not_defined → "Не указано"
          - who_insures: shipper → "Грузоотправитель", carrier → "Перевозчик", either → "Любая сторона", not_defined → "Не указано"
          - insurance_coverage: all_risks → "От всех рисков", named_perils → "От конкретных рисков", not_defined → "Не указан"
          - beneficiary_defined: yes → "Определён", no → "Не определён", not_defined → "Не указано"
        9. Верни РОВНО один JSON-объект со всеми 13 ключами без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — полное условие страхования с объявленной ценностью:
        Фрагмент:
        "Грузоотправитель обязан застраховать груз от всех рисков на сумму, равную объявленной ценности груза, указанной в транспортной накладной. Выгодоприобретателем по договору страхования является Перевозчик. Объявленная ценность груза составляет 5 000 000 (пять миллионов) рублей."

        Ответ:
        {
          "insurance_present": "yes",
          "insurance_required": "yes",
          "who_insures": "shipper",
          "insurance_coverage": "all_risks",
          "beneficiary_defined": "yes",
          "declared_value_present": "yes",
          "declared_value_amount": "5 000 000 рублей",
          "cargo_insurance_snippet": "Грузоотправитель обязан застраховать груз от всех рисков на сумму, равную объявленной ценности груза, указанной в транспортной накладной. Выгодоприобретателем по договору страхования является Перевозчик. Объявленная ценность груза составляет 5 000 000 (пять миллионов) рублей.",
          "insurance_present_display": "Предусмотрено",
          "insurance_required_display": "Обязательно",
          "who_insures_display": "Грузоотправитель",
          "insurance_coverage_display": "От всех рисков",
          "beneficiary_defined_display": "Определён"
        }

        Пример 2 — страхование не упомянуто:
        Фрагмент:
        "Перевозчик обязуется доставить груз в пункт назначения в установленный срок."

        Ответ:
        {
          "insurance_present": "not_defined",
          "insurance_required": "not_defined",
          "who_insures": "not_defined",
          "insurance_coverage": "not_defined",
          "beneficiary_defined": "not_defined",
          "declared_value_present": "not_defined",
          "declared_value_amount": "not_defined",
          "cargo_insurance_snippet": "not_defined",
          "insurance_present_display": "Не указано",
          "insurance_required_display": "Не указано",
          "who_insures_display": "Не указано",
          "insurance_coverage_display": "Не указан",
          "beneficiary_defined_display": "Не указано"
        }

        Пример 3 — текст есть, но вывод невозможен (размытая формулировка без конкретики):
        Фрагмент:
        "Стороны могут по взаимному согласию обеспечить страхование груза на условиях, определяемых отдельно."

        Ответ:
        {
          "insurance_present": "yes",
          "insurance_required": "optional",
          "who_insures": "not_defined",
          "insurance_coverage": "not_defined",
          "beneficiary_defined": "not_defined",
          "declared_value_present": "not_defined",
          "declared_value_amount": "not_defined",
          "cargo_insurance_snippet": "Стороны могут по взаимному согласию обеспечить страхование груза на условиях, определяемых отдельно.",
          "insurance_present_display": "Предусмотрено",
          "insurance_required_display": "По согласованию",
          "who_insures_display": "Не указано",
          "insurance_coverage_display": "Не указан",
          "beneficiary_defined_display": "Не указано"
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        Перед ответом внутренне проверь:
        1. Есть ли прямая цитата о страховании груза.
        2. Не подменил ли ты страхование общими словами о риске.
        3. Не путаешь ли ты объявленную ценность со страховой суммой.
        4. Если прямого указания нет — верни "not_defined".
        5. Все 13 ключей присутствуют в JSON.

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь РОВНО одним JSON-объектом без какого-либо дополнительного текста до или после, со всеми 13 ключами:
        {
          "insurance_present": "<yes / no / not_defined>",
          "insurance_required": "<yes / no / optional / not_defined>",
          "who_insures": "<shipper / carrier / either / not_defined>",
          "insurance_coverage": "<all_risks / named_perils / not_defined>",
          "beneficiary_defined": "<yes / no / not_defined>",
          "declared_value_present": "<yes / no / not_defined>",
          "declared_value_amount": "<сумма или not_defined>",
          "cargo_insurance_snippet": "<точная цитата или not_defined>",
          "insurance_present_display": "<Предусмотрена / Не предусмотрено / Не указано>",
          "insurance_required_display": "<Обязательно / Не обязательно / По согласованию / Не указано>",
          "who_insures_display": "<Грузоотправитель / Перевозчик / Любая сторона / Не указано>",
          "insurance_coverage_display": "<От всех рисков / От конкретных рисков / Не указан>",
          "beneficiary_defined_display": "<Определён / Не определён / Не указано>"
        }
      context_k: 5
      temperature: 0.0
      max_tokens: 700
    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "страхование груза страховой полис страховая сумма выгодоприобретатель страховой случай объявленная ценность объявленная стоимость"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - procedures
      negative_keywords:
        - "провозная плата"
        - "претензия"
        - "форс-мажор"
        - "лимит ответственности"
      position_bias:
        preferred_range: [0.0, 0.90]
        boost: 0.15
        scope: auto
      retrieval_profile: "insurance_check"
      context_k: 5
      max_chunks: 7
      rerank: true
    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
        - "invoice"
      preferred_clause_functions:
        - "obligations"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10
    evidence:
      required: true
      min_snippet_length: 20
      max_snippet_length: 450
    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1100

      compact_output: false

      presence_signal:
        field: "cargo_insurance_clause_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист по транспортным договорам.
        Извлеки только условия страхования груза.
        Не анализируй цену, сроки доставки, ответственность, претензии и иные разделы.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. cargo_insurance_clause_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из полей (insurance_present, declared_value_present) ∈ {"yes", "optional"} ИЛИ who_insures ≠ "not_defined";
           - "missing" — если все эти поля равны "not_defined" / "no"
             и фрагментов о страховании или ценности груза в контексте нет;
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - insurance_present = "not_defined";
           - insurance_required = "not_defined";
           - who_insures = "not_defined";
           - insurance_coverage = "not_defined";
           - beneficiary_defined = "not_defined";
           - declared_value_present = "not_defined";
           - declared_value_amount = "not_defined";
           - cargo_insurance_snippet = "not_defined";
           - все *_display = соответствующий fallback;
           - не выполняй остальные шаги.

        1. insurance_present:
           - "yes" — если страхование груза прямо предусмотрено договором;
           - "no" — если договор прямо исключает страхование груза;
           - "not_defined" — если вопрос страхования прямо не упомянут.

        2. insurance_required:
           - "yes" — если страхование груза обязательно для одной из сторон;
           - "no" — если страхование прямо названо необязательным;
           - "optional" — если страхование осуществляется по желанию / согласованию сторон;
           - "not_defined" — если обязательность прямо не урегулирована.

        3. who_insures:
           - "shipper" — грузоотправитель;
           - "carrier" — перевозчик;
           - "either" — любая из сторон;
           - "not_defined" — обязанная сторона не указана.

        4. insurance_coverage:
           - "all_risks" — страхование от всех рисков;
           - "named_perils" — страхование от конкретных рисков;
           - "not_defined" — объем покрытия прямо не назван.

        5. beneficiary_defined:
           - "yes" — если выгодоприобретатель прямо указан в тексте договора;
           - "no" — если выгодоприобретатель прямо не назван;
           - "not_defined" — если условия страхования отсутствуют.

        6. declared_value_present:
           - "yes" — если предусмотрена возможность объявления ценности груза;
           - "no" — если объявление ценности прямо запрещено;
           - "not_defined" — если возможность прямо не упомянута.

        7. declared_value_amount:
           Размер объявленной ценности груза, если он прямо зафиксирован в договоре.
           Если не указан — "not_defined".

        8. cargo_insurance_snippet:
           Точная цитата из договора со сведениями о страховании. Если нет — "not_defined".

        9. insurance_present_display:
           "Предусмотрено" / "Не предусмотрено" / "Не указано".

        10. insurance_required_display:
            "Обязательно" / "Не обязательно" / "По согласованию" / "Не указано".

        11. who_insures_display:
            "Грузоотправитель" / "Перевозчик" / "Любая сторона" / "Не указано".

        12. insurance_coverage_display:
            "От всех рисков" / "От конкретных рисков" / "Не указан".

        13. beneficiary_defined_display:
            "Определён" / "Не определён" / "Не указано".
        </task>

        <context_rules>
        - Перед остальными полями заполни cargo_insurance_clause_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все поля = "not_defined" / соответствующий fallback.
        - Не подменяй страхование груза общими условиями о переходе рисков повреждения груза.
        - Если в тексте прямо допускается страхование — используй "optional" для обязательности.
        - Объявленную ценность груза по транспортным накладным не приравнивай автоматически к страховой сумме.
        - Не используй "None", "null" или пустые строки.
        - Все 13 полей должны присутствовать в JSON-ответе.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте договора нет упоминаний страхования груза или объявленной ценности.
           → presence = "missing";
             insurance_present = "not_defined";
             declared_value_present = "not_defined".

        2. Опциональное страхование по соглашению сторон.
           "Стороны вправе застраховать груз по взаимному согласию."
           → presence = "present";
             insurance_present = "yes";
             insurance_required = "optional".

        3. Противоречие между фрагментами.
           В одном месте грузоотправитель обязан застраховать груз, в другом — перевозчик.
           → presence = "unclear";
             who_insures = "not_defined";
             who_insures_display = "Не указано".

        4. Объявленная ценность без условий о страховании.
           "Объявленная ценность груза составляет 100 000 рублей." (про страхование молчок).
           → presence = "present";
             declared_value_present = "yes";
             declared_value_amount = "100 000 рублей";
             insurance_present = "not_defined".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для cargo_insurance_clause_presence используй только: "present", "missing", "unclear".
        - Для insurance_present, beneficiary_defined, declared_value_present используй только: "yes", "no", "not_defined".
        - Для insurance_required используй только: "yes", "no", "optional", "not_defined".
        - Для who_insures используй только: "shipper", "carrier", "either", "not_defined".
        - Для insurance_coverage используй только: "all_risks", "named_perils", "not_defined".
        - Fallback при отсутствии данных:
          * declared_value_amount, cargo_insurance_snippet → "not_defined";
          * все *_display → "Не указано" / "Не указан".
        - Fallback при противоречии или неоднозначности:
          * все *_display → соответствующие fallback-строки.
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "cargo_insurance_clause_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие условий о страховании груза. Внутреннее агрегатное signal-поле."
