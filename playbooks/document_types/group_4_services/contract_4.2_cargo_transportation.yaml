#  БЛОК 3: SHARED PATTERNS
#  Читается: DocTypeCheckLoader через _resolve_yaml_templates()
# ════════════════════════════════════════════════════════════════════════════

shared_patterns:

  money_amount: "(?i)\\b\\d[\\d\\s]*(?:руб|рублей|₽|тыс|млн|млрд|USD|EUR|долл)"
  date_pattern: "(?i)\\b\\d{1,2}[.]\\d{1,2}[.]\\d{4}\\b"
  percentage: "(?i)\\b\\d{1,3}[,.]?\\d{0,2}\\s*%"
  weight_pattern: "(?i)\\b\\d[\\d\\s,.]*(?:кг|тонн|т\\b|kg|ton)"
  volume_pattern: "(?i)\\b\\d[\\d\\s,.]*(?:куб\\.?\\s*м|м[³3]|cbm)"
  time_hours: "(?i)\\b\\d+\\s*(?:час|ч\\.|hours|hrs)"
  vehicle_reg: "(?i)\\b[А-Я]{1}\\d{3}[А-Я]{2}\\d{2,3}\\b"

compliance_rules: []

# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 4: CHECKS_V8 — LLM/hybrid проверки (v8.1, приведено к паттерну)
#  Читается: DocTypeCheckLoader._load_doc_type_checks()
# ════════════════════════════════════════════════════════════════════════════

checks_v8:

  - id: transport_document_check
    name: "Транспортный документ: накладная / коносамент (ст. 785 ГК РФ)"
    description: >
      Проверяет наличие условия об оформлении транспортного документа.
      Заключение договора перевозки подтверждается транспортной накладной,
      коносаментом или иным документом. Без него сложно доказать факт
      заключения договора.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "транспортная накладная"
        - "товарно-транспортная накладная"
        - "ТТН"
        - "коносамент"
        - "грузовая авианакладная"
        - "CMR"
        - "AWB"
        - "железнодорожная накладная"
        - "путевой лист"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)транспортн(ая|ой)\\s+накладн"
        - "(?i)коносамент"
        - "(?i)\\bCMR\\b"
        - "(?i)\\bТТН\\b"
        - "(?i)\\bAWB\\b"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по транспортным договорам.
        Анализируется договор перевозки груза.
        Проверяется только условие об оформлении транспортного документа.

        Нормативный ориентир:
        - ст. 785 ГК РФ
        - ст. 8 УАТ (ФЗ-259)

        [ЗАДАЧА]
        Установи:
        1. Упомянут ли в договоре транспортный документ (накладная, коносамент и т.п.).
        2. Какой вид транспортного документа предусмотрен.
        3. Кто оформляет транспортный документ.
        4. Приведи точную цитату из договора.
        5. Сформируй user-friendly значения для отображения в DD Grid.

        [ПРАВИЛА]
        1. Используй только текст договора.
        2. Не считай путевой лист или акт приёма-передачи транспортной накладной, если они прямо так не названы.
        3. Если вид документа не назван — document_type = "not_defined".
        4. Если оформляющая сторона прямо не указана — who_prepares = "not_defined".
        5. Не используй "None", "null" или пустые строки — используй "not_defined".
        6. В document_snippet включай только цитату из договора.
        7. Для *_display полей используй понятные русские формулировки:
          - Если документ не упомянут → transport_document_mentioned_display = "Не указан"
          - Если вид не определён → document_type_display = "Вид не определён"
          - Если оформляющая сторона не указана → who_prepares_display = "Не указано"
        8. Верни РОВНО один JSON-объект со всеми 7 ключами без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — стандартная ситуация:
        Фрагмент:
        "На каждую перевозку грузоотправитель оформляет транспортную накладную в трёх экземплярах."

        Ответ:
        {
          "transport_document_mentioned": "yes",
          "document_type": "consignment_note",
          "who_prepares": "shipper",
          "document_snippet": "На каждую перевозку грузоотправитель оформляет транспортную накладную в трёх экземплярах.",
          "transport_document_mentioned_display": "Указан",
          "document_type_display": "Транспортная накладная",
          "who_prepares_display": "Грузоотправитель"
        }

        Пример 2 — документ не упомянут:
        Фрагмент:
        "Стороны договорились о перевозке груза по маршруту Москва — Казань."

        Ответ:
        {
          "transport_document_mentioned": "no",
          "document_type": "not_defined",
          "who_prepares": "not_defined",
          "document_snippet": "not_defined",
          "transport_document_mentioned_display": "Не указан",
          "document_type_display": "Вид не определён",
          "who_prepares_display": "Не указано"
        }

        Пример 3 — текст есть, но вывод невозможен (неоднозначная формулировка):
        Фрагмент:
        "Документы оформляются по соглашению сторон в процессе перевозки."

        Ответ:
        {
          "transport_document_mentioned": "yes",
          "document_type": "not_defined",
          "who_prepares": "not_defined",
          "document_snippet": "Документы оформляются по соглашению сторон в процессе перевозки.",
          "transport_document_mentioned_display": "Указан",
          "document_type_display": "Вид не определён",
          "who_prepares_display": "Не указано"
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        Перед ответом внутренне проверь:
        1. Есть ли в тексте прямое упоминание транспортного документа.
        2. Совпадает ли document_type с допустимым словарём.
        3. Взята ли цитата из договора, а не из закона.
        4. Если прямого указания нет — не додумывай, верни "not_defined".
        5. Все 7 ключей присутствуют в JSON.

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь РОВНО одним JSON-объектом без какого-либо дополнительного текста до или после, со всеми 7 ключами:
        {
          "transport_document_mentioned": "<yes / no>",
          "document_type": "<waybill / consignment_note / bill_of_lading / air_waybill / cmr / other / not_defined>",
          "who_prepares": "<carrier / shipper / jointly / not_defined>",
          "document_snippet": "<точная цитата или not_defined>",
          "transport_document_mentioned_display": "<Указан / Не указан>",
          "document_type_display": "<Транспортная накладная / Коносамент / Авианакладная / CMR / Железнодорожная накладная / Иной документ / Вид не определён>",
          "who_prepares_display": "<Перевозчик / Грузоотправитель / Стороны совместно / Не указано>"
        }
      context_k: 4
      temperature: 0.0
      max_tokens: 450
    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "транспортная накладная товарно-транспортная накладная ТТН коносамент грузовая авианакладная CMR AWB железнодорожная накладная путевой лист"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - procedures
        - obligations
      negative_keywords:
        - "провозная плата"
        - "претензия"
        - "форс-мажор"
        - "неустойка"
      position_bias:
        preferred_range: [0.0, 0.90]
        boost: 0.15
        scope: auto
      retrieval_profile: "technical_documentation_check"
      context_k: 4
      max_chunks: 6
      rerank: true
    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
        - "invoice"
      preferred_clause_functions:
        - "procedures"
        - "obligations"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10
    evidence:
      required: true
      min_snippet_length: 30
      max_snippet_length: 500
    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 900

      compact_output: false

      presence_signal:
        field: "transport_document_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист по транспортным договорам.
        Извлеки только условия об оформлении транспортного документа (накладной, коносамента и т.п.).
        Не анализируй цену, сроки, ответственность и иные разделы.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. transport_document_check_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если transport_document_mentioned = "yes";
           - "missing" — если transport_document_mentioned = "no" и фрагментов
             о транспортном документе в контексте нет;
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - transport_document_mentioned = "no";
           - document_type = "not_defined";
           - who_prepares = "not_defined";
           - document_snippet = "not_defined";
           - transport_document_mentioned_display = "Не указан";
           - document_type_display = "Вид не определён";
           - who_prepares_display = "Не указано";
           - не выполняй остальные шаги.

        1. transport_document_mentioned:
           - "yes" — если в тексте прямо упомянут транспортный документ
             (накладная, коносамент, CMR, AWB, ТТН и т.п.);
           - "no" — если транспортный документ прямо не упомянут.

        2. document_type:
           - "waybill" — товарно-транспортная накладная / ТТН;
           - "consignment_note" — транспортная накладная;
           - "bill_of_lading" — коносамент;
           - "air_waybill" — грузовая авианакладная / AWB;
           - "cmr" — CMR;
           - "other" — иной транспортный документ, прямо названный в тексте;
           - "not_defined" — вид не назван или документ не упомянут.

        3. who_prepares:
           - "carrier" — перевозчик;
           - "shipper" — грузоотправитель;
           - "jointly" — стороны совместно;
           - "not_defined" — оформляющая сторона прямо не указана.

        4. document_snippet:
           Точная цитата из договора об оформлении транспортного документа.
           Если цитаты нет — "not_defined".

        5. transport_document_mentioned_display:
           - "Указан" — если transport_document_mentioned = "yes";
           - "Не указан" — если "no".

        6. document_type_display:
           User-facing значение на русском языке:
           "Транспортная накладная" / "Коносамент" / "Авианакладная" /
           "CMR" / "Железнодорожная накладная" / "Иной документ" / "Вид не определён".

        7. who_prepares_display:
           User-facing значение на русском языке:
           "Перевозчик" / "Грузоотправитель" / "Стороны совместно" / "Не указано".
        </task>

        <context_rules>
        - Перед остальными полями заполни transport_document_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — transport_document_mentioned = "no", все остальные поля = "not_defined" / соответствующий fallback.
        - Используй только текст документа.
        - Не приравнивай путевой лист к транспортной накладной без прямого указания.
        - Если документ упомянут, но вид не назван — document_type = "not_defined", transport_document_mentioned = "yes".
        - Если оформляющая сторона прямо не указана — who_prepares = "not_defined".
        - Не используй "None", "null" или пустые строки.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет упоминания транспортного документа.
           → presence = "missing";
             transport_document_mentioned = "no";
             document_type = who_prepares = "not_defined";
             все *_display = соответствующий fallback.

        2. Документ упомянут, но детали не раскрыты.
           "Стороны оформляют транспортные документы в установленном порядке."
           → presence = "present";
             transport_document_mentioned = "yes";
             document_type = "not_defined";
             who_prepares = "not_defined".

        3. Противоречие между фрагментами.
           В одном пункте — "транспортная накладная", в другом — "коносамент"
           для одного и того же рейса.
           → presence = "unclear";
             transport_document_mentioned = "yes";
             document_type = "not_defined";
             document_type_display = "Вид не определён".

        4. Отсылка на внешний документ.
           "Накладная оформляется по форме Приложения №4 к настоящему договору."
           → presence = "present";
             transport_document_mentioned = "yes";
             document_type определяется по тексту;
             document_snippet содержит цитату с отсылкой.
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для transport_document_check_presence используй только: "present", "missing", "unclear".
        - Для transport_document_mentioned используй только: "yes", "no".
        - Для document_type используй только: "waybill", "consignment_note", "bill_of_lading", "air_waybill", "cmr", "other", "not_defined".
        - Для who_prepares используй только: "carrier", "shipper", "jointly", "not_defined".
        - Fallback при отсутствии данных:
          * document_type → "not_defined";
          * who_prepares → "not_defined";
          * document_snippet → "not_defined";
          * transport_document_mentioned_display → "Не указан";
          * document_type_display → "Вид не определён";
          * who_prepares_display → "Не указано".
        - Fallback при противоречии или неоднозначности:
          * document_type → "not_defined";
          * document_type_display → "Вид не определён".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "transport_document_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие условия о транспортном документе. Внутреннее агрегатное signal-поле."
          required: true

        - name: "transport_document_mentioned"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["yes", "no"]
          description: "Упоминание транспортного документа. Внутреннее enum-поле."
          required: true
          display_in_grid: false
        - name: "document_type"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["waybill", "consignment_note", "bill_of_lading", "air_waybill", "cmr", "other", "not_defined"]
          description: "Вид транспортного документа. Внутреннее enum-поле."
          required: true
          display_in_grid: false
        - name: "who_prepares"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["carrier", "shipper", "jointly", "not_defined"]
          description: "Кто оформляет транспортный документ. Внутреннее enum-поле."
          required: true
          display_in_grid: false
        - name: "document_snippet"
          type: "string"
          presentation: "diagnostic"
          description: "Цитата условия о транспортном документе"
          required: true
          display_in_grid: false
        - name: "transport_document_mentioned_display"
          type: "string"
          presentation: "fact"
          description: >
            User-friendly отображение: указан ли транспортный документ. Fallback: "Не установлено" / "Не удалось определить".
          required: true
          display_in_grid: true
          display_priority: 1
          label: "Транспортный документ"
        - name: "document_type_display"
          type: "string"
          presentation: "fact"
          description: >
            User-friendly отображение вида транспортного документа. Fallback: "Не установлено" / "Не удалось определить".
          required: true
          display_in_grid: true
          display_priority: 2
          label: "Вид документа"
        - name: "who_prepares_display"
          type: "string"
          presentation: "fact"
          description: >
            User-friendly отображение стороны, оформляющей документ. Fallback: "Не установлено" / "Не удалось определить".
          required: true
          display_in_grid: true
          display_priority: 3
          label: "Оформляет"
      store_payload: true

  - id: carrier_liability_for_cargo
    name: "Ответственность перевозчика за груз (ст. 796 ГК РФ)"
    description: >
      Проверяет условия ответственности перевозчика за утрату, недостачу и повреждение груза.
      Перевозчик отвечает независимо от вины (ст. 796 ГК РФ). Размер ограничен
      объявленной стоимостью или действительной стоимостью груза. Без чёткого
      указания возможны споры о размере возмещения.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "утрата груза"
        - "повреждение груза"
        - "недостача"
        - "ответственность перевозчика"
        - "возмещение ущерба"
        - "объявленная стоимость"
        - "действительная стоимость"
        - "независимо от вины"
        - "ст. 796"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)ответственност.*перевозчик.*за.*(утрат|поврежден|недостач)"
        - "(?i)независимо\\s+от\\s+вины"
        - "(?i)ст\\.?\\s*796"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по транспортным договорам.
        Анализируется договор перевозки груза.
        Проверяются только условия ответственности перевозчика за утрату,
        недостачу и повреждение груза.

        Нормативный ориентир:
        - ст. 796 ГК РФ

        [ЗАДАЧА]
        Установи:
        1. Есть ли в договоре условие об ответственности перевозчика за груз.
        2. На каком основании наступает ответственность: независимо от вины или при наличии вины.
        3. Как ограничен размер возмещения.
        4. Указан ли конкретный размер или формула лимита.
        5. Исключены ли косвенные убытки.
        6. Приведи точную цитату из договора.
        7. Сформируй user-friendly значения для отображения в DD Grid.

        [ПРАВИЛА]
        1. Используй только текст договора.
        2. Словарь liability_basis:
          - "strict" — ответственность независимо от вины (по ст. 796 ГК РФ)
          - "fault_based" — ответственность при наличии вины
          - "mixed" — сочетание обоих подходов
          - "not_defined" — ответственность упомянута, но основание не раскрыто, ИЛИ условие об ответственности отсутствует
        3. Не подставляй норму ст. 796 ГК РФ вместо текста договора.
        4. Если лимит не указан — liability_limit_type и liability_limit_amount = "not_defined".
        5. Не используй "None", "null" или пустые строки — используй "not_defined".
        6. В liability_snippet включай только цитату из договора.
        7. Для *_display полей используй понятные русские формулировки:
          - liability_basis: strict → "Независимо от вины", fault_based → "При наличии вины", mixed → "Смешанное", not_defined → "Не определено"
          - liability_limit_type: declared_value → "Объявленная стоимость", actual_value → "Действительная стоимость", statutory → "По закону", contract_cap → "Договорной лимит", not_defined → "Не определён"
          - indirect_damages_excluded: yes → "Исключены", no → "Не исключены", not_defined → "Не указано"
        8. Верни РОВНО один JSON-объект со всеми 9 ключами без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — стандартная ситуация с лимитом:
        Фрагмент:
        "Перевозчик несёт ответственность за утрату и повреждение груза независимо от вины в размере объявленной стоимости груза — 500 000 руб."

        Ответ:
        {
          "carrier_liability_present": "yes",
          "liability_basis": "strict",
          "liability_limit_type": "declared_value",
          "liability_limit_amount": "объявленная стоимость — 500 000 руб.",
          "indirect_damages_excluded": "not_defined",
          "liability_snippet": "Перевозчик несёт ответственность за утрату и повреждение груза независимо от вины в размере объявленной стоимости груза — 500 000 руб.",
          "liability_basis_display": "Независимо от вины",
          "liability_limit_type_display": "Объявленная стоимость",
          "indirect_damages_excluded_display": "Не указано"
        }

        Пример 2 — ответственность не упомянута:
        Фрагмент:
        "Перевозчик обязуется доставить груз в пункт назначения в срок."

        Ответ:
        {
          "carrier_liability_present": "not_defined",
          "liability_basis": "not_defined",
          "liability_limit_type": "not_defined",
          "liability_limit_amount": "not_defined",
          "indirect_damages_excluded": "not_defined",
          "liability_snippet": "not_defined",
          "liability_basis_display": "Не определено",
          "liability_limit_type_display": "Не определён",
          "indirect_damages_excluded_display": "Не указано"
        }

        Пример 3 — текст есть, но вывод невозможен (размытая формулировка):
        Фрагмент:
        "Перевозчик несёт ответственность за сохранность груза в порядке, предусмотренном законодательством."

        Ответ:
        {
          "carrier_liability_present": "yes",
          "liability_basis": "not_defined",
          "liability_limit_type": "not_defined",
          "liability_limit_amount": "not_defined",
          "indirect_damages_excluded": "not_defined",
          "liability_snippet": "Перевозчик несёт ответственность за сохранность груза в порядке, предусмотренном законодательством.",
          "liability_basis_display": "Не определено",
          "liability_limit_type_display": "Не определён",
          "indirect_damages_excluded_display": "Не указано"
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        Перед ответом внутренне проверь:
        1. Есть ли прямая цитата об ответственности за утрату/недостачу/повреждение.
        2. Следует ли основание ответственности из текста, а не из закона.
        3. Соответствуют ли значения допустимым словарям.
        4. Если прямой цитаты нет — верни "not_defined".
        5. Все 9 ключей присутствуют в JSON.

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь РОВНО одним JSON-объектом без какого-либо дополнительного текста до или после, со всеми 9 ключами:
        {
          "carrier_liability_present": "<yes / no / not_defined>",
          "liability_basis": "<strict / fault_based / mixed / not_defined>",
          "liability_limit_type": "<declared_value / actual_value / statutory / contract_cap / not_defined>",
          "liability_limit_amount": "<сумма/описание или not_defined>",
          "indirect_damages_excluded": "<yes / no / not_defined>",
          "liability_snippet": "<точная цитата или not_defined>",
          "liability_basis_display": "<Независимо от вины / При наличии вины / Смешанное / Не определено>",
          "liability_limit_type_display": "<Объявленная стоимость / Действительная стоимость / По закону / Договорной лимит / Не определён>",
          "indirect_damages_excluded_display": "<Исключены / Не исключены / Не указано>"
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 650
    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "ответственность перевозчика утрата груза повреждение груза недостача возмещение ущерба объявленная стоимость действительная стоимость независимо от вины"
      preferred_unit_types:
        - liability_provision
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - remedies
        - limitations
      negative_keywords:
        - "провозная плата"
        - "претензия"
        - "форс-мажор"
        - "приёмка груза"
      position_bias:
        preferred_range: [0.2, 0.95]
        boost: 0.20
        scope: auto
      retrieval_profile: "liability_cap_check"
      context_k: 6
      max_chunks: 8
      rerank: true
    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
        - "invoice"
      preferred_clause_functions:
        - "remedies"
        - "limitations"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10
    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 600
    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1100

      compact_output: false

      presence_signal:
        field: "carrier_liability_for_cargo_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист по транспортным договорам.
        Извлеки только условия ответственности перевозчика за утрату,
        недостачу и повреждение груза.
        Не анализируй штрафы, претензии, приёмку груза и иные разделы.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. carrier_liability_for_cargo_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если carrier_liability_present ∈ {"yes", "no"}
             (включая прямое исключение ответственности);
           - "missing" — если carrier_liability_present = "not_defined"
             и фрагментов об ответственности за груз нет;
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - carrier_liability_present = "not_defined";
           - liability_basis = "not_defined";
           - liability_limit_type = "not_defined";
           - liability_limit_amount = "not_defined";
           - indirect_damages_excluded = "not_defined";
           - liability_snippet = "not_defined";
           - все *_display = соответствующий fallback;
           - не выполняй остальные шаги.

        1. carrier_liability_present:
           - "yes" — если в тексте прямо предусмотрено условие об ответственности
             перевозчика за утрату, недостачу или повреждение груза;
           - "no" — если договор прямо исключает ответственность перевозчика
             за сохранность груза;
           - "not_defined" — если условие об ответственности прямо не упомянуто.

        2. liability_basis:
           - "strict" — ответственность независимо от вины;
           - "fault_based" — ответственность при наличии вины;
           - "mixed" — сочетание обоих подходов;
           - "not_defined" — основание не раскрыто или условие отсутствует.

        3. liability_limit_type:
           - "declared_value" — объявленная стоимость;
           - "actual_value" — действительная стоимость;
           - "statutory" — по закону;
           - "contract_cap" — договорной лимит;
           - "not_defined" — тип лимита не указан.

        4. liability_limit_amount:
           Конкретный размер или формула лимита из текста договора.
           Если не указан — "not_defined".
           Если данные противоречивы — "Не удалось определить".

        5. indirect_damages_excluded:
           - "yes" — косвенные убытки прямо исключены;
           - "no" — косвенные убытки прямо не исключены;
           - "not_defined" — вопрос косвенных убытков не поднят.

        6. liability_snippet:
           Точная цитата из договора. Если нет — "not_defined".

        7. liability_basis_display:
           "Независимо от вины" / "При наличии вины" / "Смешанное" / "Не определено".

        8. liability_limit_type_display:
           "Объявленная стоимость" / "Действительная стоимость" / "По закону" /
           "Договорной лимит" / "Не определён".

        9. indirect_damages_excluded_display:
           "Исключены" / "Не исключены" / "Не указано".
        </task>

        <context_rules>
        - Перед остальными полями заполни carrier_liability_for_cargo_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все поля = "not_defined", все *_display = соответствующий fallback.
        - "strict" ставь только при прямом указании на ответственность независимо от вины.
        - Не подставляй норму ст. 796 ГК РФ вместо текста договора.
        - Не путай общую ответственность по договору с ответственностью за сохранность груза.
        - Если основание ответственности не раскрыто явно — liability_basis = "not_defined".
        - Если лимит не указан — liability_limit_type и liability_limit_amount = "not_defined".
        - Если косвенные убытки прямо не упомянуты — indirect_damages_excluded = "not_defined".
        - Прямое исключение ответственности (carrier_liability_present = "no") — это presence = "present", а не "missing".
        - Не используй "None", "null" или пустые строки.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет условия об ответственности за утрату/повреждение груза.
           → presence = "missing";
             carrier_liability_present = "not_defined";
             все остальные поля = "not_defined";
             все *_display = соответствующий fallback.

        2. Общая формулировка без конкретики.
           "Перевозчик несёт ответственность за сохранность груза в порядке,
           предусмотренном законодательством."
           → presence = "present";
             carrier_liability_present = "yes";
             liability_basis = "not_defined";
             liability_limit_type = "not_defined".

        3. Противоречие между фрагментами.
           В одном пункте лимит 500 000 руб., в другом — объявленная стоимость.
           → presence = "unclear";
             carrier_liability_present = "yes";
             liability_limit_type = "not_defined";
             liability_limit_amount = "Не удалось определить".

        4. Прямое исключение ответственности.
           "Перевозчик не несёт ответственности за сохранность груза
           после передачи его грузополучателю."
           → presence = "present";
             carrier_liability_present = "no";
             liability_basis = "not_defined";
             liability_snippet содержит цитату об исключении.
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для carrier_liability_for_cargo_presence используй только: "present", "missing", "unclear".
        - Для carrier_liability_present используй только: "yes", "no", "not_defined".
        - Для liability_basis используй только: "strict", "fault_based", "mixed", "not_defined".
        - Для liability_limit_type используй только: "declared_value", "actual_value", "statutory", "contract_cap", "not_defined".
        - Для indirect_damages_excluded используй только: "yes", "no", "not_defined".
        - Fallback при отсутствии данных:
          * liability_limit_amount → "not_defined";
          * liability_snippet → "not_defined";
          * liability_basis_display → "Не определено";
          * liability_limit_type_display → "Не определён";
          * indirect_damages_excluded_display → "Не указано".
        - Fallback при противоречии или неоднозначности:
          * liability_limit_amount → "Не удалось определить";
          * liability_basis_display → "Не определено".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "carrier_liability_for_cargo_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие условия об ответственности перевозчика за груз. Внутреннее агрегатное signal-поле."
          required: true

        - name: "carrier_liability_present"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Условие об ответственности перевозчика за груз есть. Внутреннее enum-поле."
          required: true
          display_in_grid: false
        - name: "liability_basis"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["strict", "fault_based", "mixed", "not_defined"]
          description: "Основание ответственности. Внутреннее enum-поле."
          required: true
          display_in_grid: false
        - name: "liability_limit_type"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["declared_value", "actual_value", "statutory", "contract_cap", "not_defined"]
          description: "Тип лимита ответственности. Внутреннее enum-поле."
          required: true
          display_in_grid: false
        - name: "indirect_damages_excluded"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Косвенные убытки исключены. Внутреннее enum-поле."
          required: true
          display_in_grid: false
        - name: "liability_limit_amount"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 1
          label: "Предел возмещения"
          description: >
            Размер или формула лимита ответственности. Fallback: "Не установлено" / "Не удалось определить".
          required: true
        - name: "liability_snippet"
          type: "string"
          presentation: "diagnostic"
          display_in_grid: false
          description: "Цитата условия об ответственности"
          required: true
        - name: "liability_basis_display"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 2
          label: "Основание ответственности"
          description: >
            User-friendly отображение основания ответственности. Fallback: "Не установлено" / "Не удалось определить".
          required: true
        - name: "liability_limit_type_display"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 3
          label: "Тип лимита"
          description: >
            User-friendly отображение типа лимита ответственности. Fallback: "Не установлено" / "Не удалось определить".
          required: true
        - name: "indirect_damages_excluded_display"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 4
          label: "Косвенные убытки"
          description: >
            User-friendly отображение: исключены ли косвенные убытки. Fallback: "Не установлено" / "Не удалось определить".
          required: true
      store_payload: true

  - id: special_cargo_conditions
    name: "Специальные условия: опасные, скоропортящиеся, негабаритные грузы"
    description: >
      Проверяет наличие специальных условий для особых категорий грузов:
      ДОПОГ для опасных, температурный режим для скоропортящихся,
      разрешения для негабаритных.
    triggers:
      any: ["dangerous_cargo", "perishable_cargo", "oversized_cargo"]
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "опасный груз"
        - "ДОПОГ"
        - "ADR"
        - "класс опасности"
        - "скоропортящийся"
        - "температурный режим"
        - "рефрижератор"
        - "негабаритный"
        - "крупногабаритный"
        - "тяжеловесный"
        - "специальное разрешение"
        - "аварийная карточка"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)опасн(ый|ого|ые)\\s+груз"
        - "(?i)температурн(ый|ого)\\s+режим"
        - "(?i)негабарит|крупногабарит|тяжеловес"
        - "(?i)\\bДОПОГ\\b|\\bADR\\b"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по transportным договорам.
        Анализируется договор перевозки груза.
        Проверяются только специальные условия для особых категорий грузов.

        Нормативный ориентир:
        - ДОПОГ (ADR) — для опасных грузов
        - специальные правила перевозки скоропортящихся и негабаритных грузов

        [ЗАДАЧА]
        Установи:
        1. Является ли груз опасным; указан ли класс опасности и документы ДОПОГ.
        2. Является ли груз скоропортящимся; указаны ли температурный режим и средства контроля.
        3. Является ли груз негабаритным; упомянуто ли специальное разрешение.
        4. Приведи точную цитату из договора.
        5. Сформируй user-friendly значения для отображения в DD Grid.

        [ПРАВИЛА]
        1. Используй только текст договора.
        2. Категорию груза фиксируй только по прямому указанию в тексте.
        3. Если категория не упомянута — соответствующее поле = "no", детали = "not_defined".
        4. Не выводи класс опасности из названия груза, если он прямо не указан.
        5. Не используй "None", "null" или пустые строки — используй "not_defined".
        6. В special_cargo_snippet включай только цитату из договора.
        7. Для *_display полей используй понятные русские формулировки:
          - Если категория = "no" → соответствующий *_display = "Нет"
          - Если категория = "yes" → соответствующий *_display = "Да"
          - special_cargo_categories_display: агрегируй все упомянутые категории в одну строку, например:
            * "Опасный груз (класс 3)"
            * "Скоропортящийся груз (-18°C...+4°C)"
            * "Негабаритный груз"
            * Если ни одна категория не упомянута → "Не указаны"
        8. Верни РОВНО один JSON-объект со всеми 13 ключами без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — опасный груз:
        Фрагмент:
        "Груз — ацетон, опасный груз, класс опасности 3. На каждое ТС оформляется аварийная карточка по ДОПОГ."

        Ответ:
        {
          "dangerous_cargo": "yes",
          "dangerous_class": "3",
          "dopog_documents_mentioned": "yes",
          "perishable_cargo": "no",
          "temperature_range": "not_defined",
          "monitoring_device": "not_defined",
          "oversized_cargo": "no",
          "special_permit_mentioned": "not_defined",
          "special_cargo_snippet": "Груз — ацетон, опасный груз, класс опасности 3. На каждое ТС оформляется аварийная карточка по ДОПОГ.",
          "dangerous_cargo_display": "Да",
          "perishable_cargo_display": "Нет",
          "oversized_cargo_display": "Нет",
          "special_cargo_categories_display": "Опасный груз (класс 3)"
        }

        Пример 2 — ни одна категория не упомянута:
        Фрагмент:
        "Перевозке подлежат строительные материалы в упаковке производителя."

        Ответ:
        {
          "dangerous_cargo": "no",
          "dangerous_class": "not_defined",
          "dopog_documents_mentioned": "not_defined",
          "perishable_cargo": "no",
          "temperature_range": "not_defined",
          "monitoring_device": "not_defined",
          "oversized_cargo": "no",
          "special_permit_mentioned": "not_defined",
          "special_cargo_snippet": "not_defined",
          "dangerous_cargo_display": "Нет",
          "perishable_cargo_display": "Нет",
          "oversized_cargo_display": "Нет",
          "special_cargo_categories_display": "Не указаны"
        }

        Пример 3 — текст есть, но вывод невозможен (размытая формулировка):
        Фрагмент:
        "Груз требует особых условий перевозки."

        Ответ:
        {
          "dangerous_cargo": "no",
          "dangerous_class": "not_defined",
          "dopog_documents_mentioned": "not_defined",
          "perishable_cargo": "no",
          "temperature_range": "not_defined",
          "monitoring_device": "not_defined",
          "oversized_cargo": "no",
          "special_permit_mentioned": "not_defined",
          "special_cargo_snippet": "Груз требует особых условий перевозки.",
          "dangerous_cargo_display": "Нет",
          "perishable_cargo_display": "Нет",
          "oversized_cargo_display": "Нет",
          "special_cargo_categories_display": "Не указаны"
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        Перед ответом внутренне проверь:
        1. Есть ли прямая цитата о категории груза.
        2. Взяты ли детали (класс, температура, разрешение) из текста, а не из практики.
        3. Соответствуют ли значения допустимым словарям.
        4. Если прямого указания нет — верни "no" / "not_defined".
        5. Все 13 ключей присутствуют в JSON.

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь РОВНО одним JSON-объектом без какого-либо дополнительного текста до или после, со всеми 13 ключами:
        {
          "dangerous_cargo": "<yes / no>",
          "dangerous_class": "<класс опасности или not_defined>",
          "dopog_documents_mentioned": "<yes / no / not_defined>",
          "perishable_cargo": "<yes / no>",
          "temperature_range": "<диапазон температур или not_defined>",
          "monitoring_device": "<yes / no / not_defined>",
          "oversized_cargo": "<yes / no>",
          "special_permit_mentioned": "<yes / no / not_defined>",
          "special_cargo_snippet": "<точная цитата или not_defined>",
          "dangerous_cargo_display": "<Да / Нет>",
          "perishable_cargo_display": "<Да / Нет>",
          "oversized_cargo_display": "<Да / Нет>",
          "special_cargo_categories_display": "<агрегированное описание категорий или Не указаны>"
        }
      context_k: 5
      temperature: 0.0
      max_tokens: 650
    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "опасный груз ДОПОГ ADR класс опасности аварийная карточка скоропортящийся температурный режим рефрижератор негабаритный крупногабаритный тяжеловесный специальное разрешение"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - procedures
      negative_keywords:
        - "провозная плата"
        - "претензия"
        - "форс-мажор"
        - "неустойка"
      position_bias:
        preferred_range: [0.0, 0.80]
        boost: 0.20
        scope: auto
      retrieval_profile: "technical_documentation_check"
      context_k: 5
      max_chunks: 8
      rerank: true
    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "price_list"
        - "invoice"
      preferred_clause_functions:
        - "obligations"
        - "procedures"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10
    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 600
    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1100

      compact_output: false

      presence_signal:
        field: "special_cargo_conditions_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист по транспортным договорам.
        Извлеки только специальные условия для опасных, скоропортящихся
        и негабаритных грузов.
        Не анализируй цену, маршрут, сроки и иные разделы.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. special_cargo_conditions_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из основных полей
             (dangerous_cargo, perishable_cargo, oversized_cargo) = "yes";
           - "missing" — если все три основных поля = "no" и фрагментов
             об особых условиях в контексте нет;
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             или отсутствия конкретики (например, "груз требует особых условий"
             без уточнения класса/температуры) сделать однозначный вывод нельзя.

           Если presence = "missing":
           - dangerous_cargo = "no";
           - perishable_cargo = "no";
           - oversized_cargo = "no";
           - dopog_documents_mentioned = "not_defined";
           - monitoring_device = "not_defined";
           - special_permit_mentioned = "not_defined";
           - dangerous_class = "not_defined";
           - temperature_range = "not_defined";
           - special_cargo_snippet = "not_defined";
           - dangerous_cargo_display = "Нет";
           - perishable_cargo_display = "Нет";
           - oversized_cargo_display = "Нет";
           - special_cargo_categories_display = "Не указаны";
           - не выполняй остальные шаги.

        1. dangerous_cargo:
           - "yes" — если груз прямо назван опасным, указан класс опасности
             или упоминаются документы ДОПОГ/ADR;
           - "no" — если груз прямо не идентифицируется как опасный.

        2. dopog_documents_mentioned:
           - "yes" — если прямо упомянуты документы ДОПОГ/ADR, аварийная карточка и т.п.;
           - "no" — если документы ДОПОГ прямо не упомянуты;
           - "not_defined" — если груз не является опасным (dangerous_cargo = "no").

        3. perishable_cargo:
           - "yes" — если груз прямо назван скоропортящимся, указан конкретный
             температурный режим или упоминается рефрижератор;
           - "no" — если груз прямо не идентифицируется как скоропортящийся.

        4. monitoring_device:
           - "yes" — если прямо предусмотрено использование средств контроля
             температуры (термописцы, логгеры и т.п.);
           - "no" — если средства контроля прямо не упомянуты;
           - "not_defined" — если груз не скоропортящийся (perishable_cargo = "no").

        5. oversized_cargo:
           - "yes" — если груз прямо назван негабаритным, крупногабаритным,
             тяжеловесным или упоминается спецразрешение на перевозку;
           - "no" — если груз прямо не идентифицируется как негабаритный.

        6. special_permit_mentioned:
           - "yes" — если прямо упомянуто оформление специального разрешения
             на перевозку негабаритного/крупногабаритного груза;
           - "no" — если специальное разрешение прямо не упомянуто;
           - "not_defined" — если груз не негабаритный (oversized_cargo = "no").

        7. dangerous_class:
           Класс опасности груза (например: "3", "класс 3", "9").
           Если не указан — "not_defined".

        8. temperature_range:
           Диапазон температур транспортировки (например: "-18°C", "от 0 до +4 °C").
           Если не указан — "not_defined".

        9. special_cargo_snippet:
           Точная цитата из договора со специальными условиями.
           Если цитаты нет — "not_defined".

        10. dangerous_cargo_display:
            "Да" — если dangerous_cargo = "yes", иначе "Нет".

        11. perishable_cargo_display:
            "Да" — если perishable_cargo = "yes", иначе "Нет".

        12. oversized_cargo_display:
            "Да" — если oversized_cargo = "yes", иначе "Нет".

        13. special_cargo_categories_display:
            Агрегированное user-friendly описание всех обнаруженных категорий:
            - Если dangerous_cargo = "yes" → "Опасный груз (класс {dangerous_class})";
            - Если perishable_cargo = "yes" → "Скоропортящийся груз ({temperature_range})";
            - Если oversized_cargo = "yes" → "Негабаритный груз";
            - Если несколько категорий → объедини их через запятую;
            - Если ни одна категория не упомянута → "Не указаны".
        </task>

        <context_rules>
        - Перед остальными полями заполни special_cargo_conditions_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все основные поля = "no", все остальные поля = "not_defined", все *_display = соответствующий fallback.
        - Категорию груза определяй только по прямому тексту договора, а не по свойствам названного товара.
        - Не смешивай условия разных категорий.
        - special_cargo_categories_display формируй строго на основе извлечённых значений (dangerous_class, temperature_range и т.д.).
        - Не используй "None", "null" или пустые строки.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни слова об опасных, скоропортящихся или негабаритных грузах.
           → presence = "missing";
             dangerous_cargo = perishable_cargo = oversized_cargo = "no";
             все остальные поля = "not_defined";
             special_cargo_categories_display = "Не указаны".

        2. Общая фраза без конкретики.
           "Перевозчик обязуется соблюдать правила перевозки особых грузов."
           → presence = "unclear";
             dangerous_cargo = perishable_cargo = oversized_cargo = "no";
             special_cargo_categories_display = "Не указаны".

        3. Противоречие между фрагментами.
           В одном месте груз назван опасным (класс 3), в другом — обычным неопасным.
           → presence = "unclear";
             dangerous_cargo = "no";
             special_cargo_categories_display = "Не указаны".

        4. Несколько специальных категорий одновременно.
           Договор регулирует перевозку скоропортящегося опасного груза (например, медицинских препаратов).
           → presence = "present";
             dangerous_cargo = "yes";
             perishable_cargo = "yes";
             special_cargo_categories_display = "Опасный груз (класс 3), Скоропортящийся груз (-18°C)";
             dopog_documents_mentioned и monitoring_device определяются по тексту.
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для special_cargo_conditions_presence используй только: "present", "missing", "unclear".
        - Для dangerous_cargo, perishable_cargo, oversized_cargo используй только: "yes", "no".
        - Для dopog_documents_mentioned, monitoring_device, special_permit_mentioned используй только: "yes", "no", "not_defined".
        - Fallback при отсутствии данных:
          * все свободные текстовые поля → "not_defined";
          * special_cargo_categories_display → "Не указаны".
        - Fallback при противоречии или неоднозначности:
          * special_cargo_categories_display → "Не указаны".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "special_cargo_conditions_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие специальных условий для особых грузов. Внутреннее агрегатное signal-поле."
          required: true

        - name: "dangerous_cargo"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["yes", "no"]
          description: "Является ли груз опасным. Внутреннее enum-поле."
          required: true
          display_in_grid: false
