      llm_prompt_extraction: |
        <role>
        Ты — российский юрист по транспортным договорам.
        Извлеки только условия пригодности, санитарного и технического состояния подаваемых ТС.
        Не анализируй требования к стажу водителей, цену, сроки доставки, претензии и иные разделы.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. vehicle_condition_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если vehicle_condition_required ∈ {"yes", "no"} ИЛИ
             vehicle_type_specified ∈ {"yes", "no"} ИЛИ breakdown_liability ∈ {"yes", "no"};
           - "missing" — если все три содержательные поля равны "not_defined"
             и фрагментов о техническом состоянии ТС в контексте нет;
           - "unclear" — если фрагменты есть, но они противоречивы.

           Если presence = "missing":
           - vehicle_condition_required = "not_defined";
           - vehicle_type_specified = "not_defined";
           - breakdown_liability = "not_defined";
           - vehicle_snippet = "not_defined";
           - все *_display = соответствующий fallback;
           - не выполняй остальные шаги.

        1. vehicle_condition_required:
           - "yes" — если в договоре прямо зафиксированы требования к технической исправности, чистоте, отсутствию запахов в кузове;
           - "no" — если требования к техническому состоянию ТС прямо исключены;
           - "not_defined" — если требования к техсостоянию прямо не упомянуты.

        2. vehicle_type_specified:
           - "yes" — если прямо конкретизирован требуемый тип кузова/прицепа ТС под специфику перевозки;
           - "no" — если тип кузова/прицепа ТС прямо не конкретизирован;
           - "not_defined" — если вопрос типа кузова прямо не затронут.

        3. breakdown_liability:
           - "yes" — если в договоре прямо прописана ответственность перевозчика за технические неисправности/аварии ТС в пути, включая обязанность по предоставлению замены;
           - "no" — если перевозчик освобождён от ответственности за поломки ТС в пути;
           - "not_defined" — если вопрос поломок в пути прямо не урегулирован.

        4. vehicle_snippet:
           Точная цитата из договора о техническом состоянии ТС. Если нет — "not_defined".

        5. vehicle_condition_required_display:
           "Предусмотрены" / "Не предусмотрены" / "Не указано".

        6. vehicle_type_specified_display:
           "Указан" / "Не указан" / "Не указано".

        7. breakdown_liability_display:
           "Предусмотрена" / "Не предусмотрена" / "Не указано".
        </task>

        <context_rules>
        - Перед остальными полями заполни vehicle_condition_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все поля = "not_defined" / соответствующий fallback.
        - Не путай технические поломки ТС в пути (breakdowns) с обычным нарушением сроков доставки из-за дорожных пробок.
        - Не используй "None", "null" или пустые строки.
        - Все 7 ключей должны присутствовать в JSON-ответе.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
