          description: "НДС упоминается"
          required: true
        - name: "vat_included"
          type: "string"
          presentation: "signal"
          allowed_values: ["yes", "no", "zero_rate", "not_applicable", "not_defined"]
          description: "НДС включён в цену / применяется 0%"
          required: true
        - name: "vat_rate"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 1
          label: "Ставка НДС"
          description: "Ставка НДС"
          required: true
        - name: "international_tax_reference"
