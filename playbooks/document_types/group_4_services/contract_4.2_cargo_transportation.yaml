  - id: carrier_liability_for_cargo
    name: "Ответственность перевозчика за груз (ст. 796 ГК РФ)"
    description: >
      Проверяет условия ответственности за утрату, недостачу и повреждение груза.
      Перевозчик отвечает независимо от вины (ст. 796 ГК РФ). Размер ограничен
      объявленной стоимостью или действительной стоимостью груза. Без чёткого
      указания возможны споры о размере возмещения.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "утрата груза"
        - "повреждение груза"
        - "недостача"
        - "ответственность перевозчика"
        - "возмещение ущерба"
        - "объявленная стоимость"
        - "действительная стоимость"
        - "независимо от вины"
        - "ст. 796"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)ответственност.*перевозчик.*за.*(утрат|поврежден|недостач)"
        - "(?i)независимо\\s+от\\s+вины"
        - "(?i)ст\\.?\\s*796"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по транспортным договорам.
        Анализируется договор перевозки груза.
        Проверяются только условия ответственности перевозчика за утрату,
        недостачу и повреждение груза.

        Нормативный ориентир:
        - ст. 796 ГК РФ

        [ЗАДАЧА]
        Установи:
        1. Есть ли в договоре условие об ответственности перевозчика за груз.
        2. На каком основании наступает ответственность: независимо от вины или при наличии вины.
        3. Как ограничен размер возмещения.
        4. Указан ли конкретный размер или формула лимита.
        5. Исключены ли косвенные убытки.
        6. Приведи точную цитату из договора.

        [ПРАВИЛА]
        1. Используй только текст договора.
        2. Словарь liability_basis:
           - "strict" — ответственность независимо от вины (по ст. 796 ГК РФ)
           - "fault_based" — ответственность при наличии вины
           - "mixed" — сочетание обоих подходов
           - "not_defined" — ответственность упомянута, основание не раскрыто
           - "not_defined" — условие об ответственности отсутствует
        3. Не подставляй норму ст. 796 ГК РФ вместо текста договора.
        4. Если лимит не указан — liability_limit_type и liability_limit_amount = "not_defined".
        5. Не используй "None", "null" или пустые строки — используй "not_defined".
        6. В liability_snippet включай только цитату из договора.
        7. Верни только один JSON-объект.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1:
        Фрагмент:
        "Перевозчик несёт ответственность за утрату и повреждение груза независимо от вины в размере объявленной стоимости груза — 500 000 руб."

        Ответ:
        {
          "carrier_liability_present": "yes",
          "liability_basis": "strict",
          "liability_limit_type": "declared_value",
          "liability_limit_amount": "объявленная стоимость — 500 000 руб.",
          "indirect_damages_excluded": "not_defined",
          "liability_snippet": "Перевозчик несёт ответственность за утрату и повреждение груза независимо от вины в размере объявленной стоимости груза — 500 000 руб."
        }

        Пример 2:
        Фрагмент:
        "Перевозчик обязуется доставить груз в пункт назначения в срок."

        Ответ:
        {
          "carrier_liability_present": "not_defined",
          "liability_basis": "not_defined",
          "liability_limit_type": "not_defined",
          "liability_limit_amount": "not_defined",
          "indirect_damages_excluded": "not_defined",
          "liability_snippet": "not_defined"
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        Перед ответом внутренне проверь:
        1. Есть ли прямая цитата об ответственности за утрату/недостачу/повреждение.
        2. Следует ли основание ответственности из текста, а не из закона.
        3. Соответствуют ли значения допустимым словарям.
        4. Если прямой цитаты нет — верни "not_defined".

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        {
          "carrier_liability_present": "<yes / no / not_found>",
          "liability_basis": "<strict / fault_based / mixed / not_specified / not_found>",
          "liability_limit_type": "<declared_value / actual_value / statutory / contract_cap / not_specified / not_found>",
          "liability_limit_amount": "<сумма/описание или not_found>",
          "indirect_damages_excluded": "<yes / no / not_found>",
          "liability_snippet": "<точная цитата или not_found>"
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 650
    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "ответственность перевозчика утрата груза повреждение груза недостача возмещение ущерба объявленная стоимость действительная стоимость независимо от вины ст. 796"
      preferred_unit_types:
        - liability_provision
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - remedies
        - limitations
      negative_keywords:
        - "провозная плата"
        - "претензия"
        - "форс-мажор"
        - "приёмка груза"
      position_bias:
        preferred_range: [0.2, 0.95]
        boost: 0.20
        scope: auto
      retrieval_profile: "liability_cap_check"
      context_k: 6
      max_chunks: 8
      rerank: true
    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
        - "invoice"
      preferred_clause_functions:
        - "remedies"
        - "limitations"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10
    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 600
    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 800
      compact_output: false
      llm_prompt_extraction: |
        <role>
        Ты — российский юрист по транспортным договорам.
        Извлеки только условия ответственности перевозчика за утрату,
        недостачу и повреждение груза.
        Не анализируй штрафы, претензии, приёмку груза и иные разделы.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни:
        - carrier_liability_present: yes / no / not_found
        - liability_basis: strict / fault_based / mixed / not_specified / not_found
        - liability_limit_type: declared_value / actual_value / statutory / contract_cap / not_specified / not_found
        - liability_limit_amount: сумма/описание или "not_defined"
        - indirect_damages_excluded: yes / no / not_found
        - liability_snippet: точная цитата из договора или "not_defined"

        Ответ верни строго в JSON.
        </task>

        <rules>
        - Используй только текст документа.
        - "strict" ставь только при прямом указании на ответственность независимо от вины.
        - Не путай общую ответственность по договору с ответственностью за сохранность груза.
        </rules>
      fields:
        - name: "carrier_liability_present"
          type: "string"
          presentation: "signal"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Условие об ответственности перевозчика за груз есть"
          required: true
        - name: "liability_basis"
          type: "string"
          presentation: "signal"
          allowed_values: ["strict", "fault_based", "mixed", "not_defined", "not_defined"]
          description: "Основание ответственности"
          required: true
        - name: "liability_limit_type"
          type: "string"
          presentation: "signal"
          allowed_values: ["declared_value", "actual_value", "statutory", "contract_cap", "not_defined", "not_defined"]
          description: "Тип лимита ответственности"
          required: true
        - name: "indirect_damages_excluded"
