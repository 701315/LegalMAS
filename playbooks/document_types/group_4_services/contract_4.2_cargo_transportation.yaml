          display_in_grid: true
          display_priority: 2
          label: "Срок ответа"
          description: "Срок ответа на претензию"
          required: true
        - name: "claim_form"
          type: "string"
          presentation: "signal"
          allowed_values: ["written", "any", "not_defined", "not_defined"]
          description: "Форма претензии"
          required: true
        - name: "mandatory_before_court"
          type: "string"
          presentation: "signal"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Претензия обязательна до суда"
          required: true
        - name: "claim_deadline_for_loss"
          type: "string"
