        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Есть ли в договоре прямые оговорки о событиях на трассе/маршруте перевозки.
        2. Не перепутан ли транспортный форс-мажор с общей статьей о непреодолимой силе.
        3. Зафиксировано ли освобождение именно от демереджа (платы за простой).
        4. Если прямого текста нет — верни "not_defined".
        5. Все 12 ключей присутствуют в JSON.

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь РОВНО одним JSON-объектом без какого-либо дополнительного текста до или после, со всеми 12 ключами:
        {
          "transport_fm_clause_present": "<yes / no / not_defined>",
          "covered_transport_events": "<route_closure / natural_disasters / strikes_and_blockades / regulatory_arrest / comprehensive / not_defined>",
          "notice_deadline": "<срок или not_defined>",
          "proof_document_required": "<tpp_certificate / authority_act / any / not_defined>",
          "demurrage_waiver_present": "<yes / no / not_defined>",
          "prolonged_fm_termination_days": "<срок или not_defined>",
          "transport_fm_snippet": "<точная цитата или not_defined>",
          "transport_fm_clause_present_display": "<Предусмотрен / Не предусмотрен / Не указано>",
          "covered_transport_events_display": "<Закрытие дорог/трасс / Стихийные явления в пути / Забастовки и блокады / Регуляторные запреты / Комплексный перечень / Не конкретизирован>",
          "notice_deadline_display": "<срок / Не указан>",
          "proof_document_required_display": "<Сертификат ТПП / Акт дорожных служб/МЧС / Любой официальный документ / Не указан>",
          "demurrage_waiver_display": "<Да / Нет / Не указано>"
        }
      context_k: 5
      temperature: 0.0
      max_tokens: 700
    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "закрытие дорог закрытие движения паводок оползень забастовка карантин на маршруте справка ТПП акт дорожной службы освобождение от демереджа транспортный форс-мажор снежные заносы"
      preferred_unit_types:
        - liability_provision
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - limitations
        - remedies
        - procedures
      negative_keywords:
        - "провозная плата"
        - "претензия"
        - "страхование груза"
        - "порядок расчётов"
      position_bias:
        preferred_range: [0.3, 1.0]
        boost: 0.15
        scope: auto
      retrieval_profile: "force_majeure_check"
      context_k: 5
      max_chunks: 7
      rerank: true
    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
        - "invoice"
      preferred_clause_functions:
        - "limitations"
        - "remedies"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10
    evidence:
      required: true
      min_snippet_length: 20
      max_snippet_length: 450
    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1100

      compact_output: false

      presence_signal:
        field: "transport_force_majeure_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист по транспортным договорам.
        Извлеки только специфические условия транспортного форс-мажора
        и препятствий на маршруте перевозки (закрытие дорог, стихийные явления
        на трассе, забастовки, освобождение от демереджа, сертификаты ТПП).
        Не анализируй общие статьи о форс-мажоре (война, революция), если в них
        нет специфики перевозки и маршрута.
        Не анализируй цену, сроки доставки, претензии и иные разделы.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. transport_force_majeure_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из полей (transport_fm_clause_present, demurrage_waiver_present) ∈ {"yes", "no"}
             ИЛИ covered_transport_events ≠ "not_defined";
           - "missing" — если все содержательные поля равны "not_defined"
             и фрагментов о транспортном форс-мажоре в контексте нет;
           - "unclear" — если фрагменты по теме есть, но из-за противоречий вывод невозможен.

           Если presence = "missing":
           - transport_fm_clause_present = "not_defined";
           - covered_transport_events = "not_defined";
           - notice_deadline = "not_defined";
           - proof_document_required = "not_defined";
           - demurrage_waiver_present = "not_defined";
           - prolonged_fm_termination_days = "not_defined";
           - transport_fm_snippet = "not_defined";
           - все *_display = соответствующий fallback;
           - не выполняй остальные шаги.

        1. transport_fm_clause_present:
           - "yes" — если условия о форс-мажорных событиях на маршруте прямо предусмотрены договором;
           - "no" — если в договоре прямо указано, что дорожные/погодные условия на маршруте не освобождают перевозчика от ответственности;
           - "not_defined" — если специфика событий на маршруте прямо не урегулирована.

        2. covered_transport_events:
           Характер охваченных событий. Используй только:
           - "route_closure" — только закрытие/ремонт дорог, мостов, переправ;
           - "natural_disasters" — природные/климатические явления на трассе (паводки, оползни, снежные заносы);
           - "strikes_and_blockades" — забастовки работников транспорта, блокады путей;
           - "regulatory_arrest" — непредвиденные запреты/задержки уполномоченных органов на маршруте;
           - "comprehensive" — комплексный перечень (включает несколько указанных категорий);
           - "not_defined" — перечень не конкретизирован.

        3. notice_deadline:
           Срок уведомления контрагента о наступлении препятствия на маршруте (например: "в течение 12 часов", "не позднее 24 часов").
           Если не указан — "not_defined".

        4. proof_document_required:
           Требуемый документ для подтверждения форс-мажора. Используй только:
           - "tpp_certificate" — заключение/сертификат Торгово-промышленной палаты (ТПП);
           - "authority_act" — справка/акт дорожных служб, МЧС, ГИБДД или администрации региона;
           - "any" — любой официальный документ компетентного органа;
           - "not_defined" — вид подтверждающего документа не указан.

        5. demurrage_waiver_present:
           - "yes" — если прямо согласовано освобождение сторон от уплаты демереджа (платы за простой ТС) при форс-мажоре;
           - "no" — если простой подлежит оплате независимо от обстоятельств непреодолимой силы;
           - "not_defined" — если вопрос оплаты простоя при форс-мажоре прямо не урегулирован.

        6. prolonged_fm_termination_days:
           Срок длительности непреодолимого препятствия, дающий право на расторжение договора или изменение маршрута (например: "10 календарных дней", "30 дней").
           Если не установлен — "not_defined".

        7. transport_fm_snippet:
           Точная цитата из договора об условиях транспортного форс-мажора. Если нет — "not_defined".

        8. transport_fm_clause_present_display:
           "Предусмотрен" / "Не предусмотрен" / "Не указано".

        9. covered_transport_events_display:
           "Закрытие дорог/трасс" / "Стихийные явления в пути" / "Забастовки и блокады" / "Регуляторные запреты" / "Комплексный перечень" / "Не конкретизирован".

        10. notice_deadline_display:
            Конкретный срок из текста или "Не указан".

        11. proof_document_required_display:
            "Сертификат ТПП" / "Акт дорожных служб/МЧС" / "Любой официальный документ" / "Не указан".

        12. demurrage_waiver_display:
            "Да" / "Нет" / "Не указано".
        </task>

        <context_rules>
        - Перед остальными полями заполни transport_force_majeure_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все поля = "not_defined" / соответствующий fallback.
        - Не путай общую стандартную статью договора о форс-мажоре (война, эмбарго) с конкретными условиями транспортных препятствий на маршруте следования.
        - Не используй "None", "null" или пустые строки.
        - Все 12 ключей должны присутствовать в JSON-ответе.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте договора нет упоминания закрытия дорог, паводков на трассе, актов дорожных служб или транспортного форс-мажора.
           → presence = "missing";
             transport_fm_clause_present = "not_defined";
             covered_transport_events = "not_defined".

        2. Общий форс-мажор без транспортной специфики.
           "Стороны освобождаются от ответственности при наступлении обстоятельств непреодолимой силы (пожар, наводнение, военные действия)."
           → presence = "missing";
             transport_fm_clause_present = "not_defined" (это общегражданский форс-мажор, покрываемый global check-ом).

        3. Противоречие между фрагментами.
           В одном месте перевозчик освобождается от демереджа при закрытии трасс, в другом — простой оплачивается в любых случаях без исключений.
           → presence = "unclear";
             demurrage_waiver_present = "not_defined";
             demurrage_waiver_display = "Не указано".

        4. Освобождение от ответственности только при наличии справки ТПП.
           "Закрытие перевалов признается форс-мажором исключительно при предоставлении заключения ТПП в течение 3 дней."
           → presence = "present";
             transport_fm_clause_present = "yes";
             covered_transport_events = "route_closure";
             proof_document_required = "tpp_certificate";
             notice_deadline = "в течение 3 дней".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для transport_force_majeure_presence используй только: "present", "missing", "unclear".
        - Для transport_fm_clause_present, demurrage_waiver_present используй только: "yes", "no", "not_defined".
        - Для covered_transport_events используй только: "route_closure", "natural_disasters", "strikes_and_blockades", "regulatory_arrest", "comprehensive", "not_defined".
        - Для proof_document_required используй только: "tpp_certificate", "authority_act", "any", "not_defined".
        - Fallback при отсутствии данных:
          * notice_deadline, prolonged_fm_termination_days, transport_fm_snippet → "not_defined";
          * все *_display → соответствующие fallback-строки.
        - Fallback при противоречии или неоднозначности:
          * все *_display → соответствующие fallback-строки.
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "transport_force_majeure_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие условий о транспортном форс-мажоре на маршруте. Внутреннее агрегатное signal-поле."
          required: true

        - name: "transport_fm_clause_present"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Условия о транспортном форс-мажоре предусмотрены. Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "covered_transport_events"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["route_closure", "natural_disasters", "strikes_and_blockades", "regulatory_arrest", "comprehensive", "not_defined"]
          description: "Охват форс-мажорных событий на маршруте. Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "notice_deadline"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 1
          label: "Срок уведомления"
          description: "Срок извещения контрагента о препятствиях на маршруте. Fallback: 'Не указан'."
          required: true

        - name: "proof_document_required"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["tpp_certificate", "authority_act", "any", "not_defined"]
          description: "Документ, подтверждающий форс-мажор на транспорте. Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "demurrage_waiver_present"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Освобождение от платы за простой (демереджа) при форс-мажоре. Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "prolonged_fm_termination_days"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 2
          label: "Срок для отказа/расторжения"
          description: >
            Предельная длительность форс-мажора для расторжения
            договора перевозки.
            Fallback: "Не установлен" / "Не удалось определить".
          required: true

        - name: "transport_fm_snippet"
          type: "string"
          presentation: "diagnostic"
          display_in_grid: false
          description: "Цитата о транспортном форс-мажоре"
          required: true

        - name: "transport_fm_clause_present_display"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 3
          label: "Транспортный форс-мажор"
          description: >
            User-friendly: предусмотрены ли специальные оговорки о форс-мажоре на маршруте. Fallback: "Не установлено" / "Не удалось определить".
          required: true

        - name: "covered_transport_events_display"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 4
          label: "Охват событий"
          description: >
            User-friendly: перечень охваченных транспортных обстоятельств. Fallback: "Не установлено" / "Не удалось определить".
          required: true

        - name: "notice_deadline_display"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 5
          label: "Срок уведомления"
          description: >
            User-friendly: срок направления извещения. Fallback: "Не установлено" / "Не удалось определить".
          required: true

        - name: "proof_document_required_display"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 6
          label: "Подтверждение"
          description: >
            User-friendly: требуемый подтверждающий документ (ТПП/дорожные службы). Fallback: "Не установлено" / "Не удалось определить".
          required: true

        - name: "demurrage_waiver_display"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 7
          label: "Освобождение от демереджа"
          description: >
            User-friendly: освобождается ли сторона от платы за простой. Fallback: "Не установлено" / "Не удалось определить".
          required: true
      store_payload: true

# ════════════════════════════════════════════════════════════════════════════
# БЛОК 5: DD_REQUEST_TEMPLATES
# Читается: DDRequestTemplateLoader
# ════════════════════════════════════════════════════════════════════════════

dd_request_templates:

  cargo_transport_subject_extraction:
    text: >
      Просим подтвердить по {doc_names}: (а) наименование и характеристики груза
      (вес, объём, свойства); (б) пункты отправления и назначения;
      (в) вид транспорта; (г) тип договора (разовый/рамочный);
      (д) вид транспортного документа.
    addressee: "Обе стороны"

  transport_document_check:
    text: >
      Просим уточнить в {doc_names}: (а) вид транспортного документа (накладная/коносамент/CMR);
      (б) кто оформляет; (в) порядок передачи.
    addressee: "Перевозчик"

  carrier_liability_for_cargo:
    text: >
      Просим уточнить в {doc_names}: (а) основание ответственности за утрату/повреждение
      (вне зависимости от вины / по вине); (б) лимит ответственности;
      (в) исключены ли косвенные убытки; (г) ссылку на транспортный устав.
    addressee: "Юридический советник"

  liability_limitation_explicit:
    text: >
      Просим включить в {doc_names} явную ссылку на ограничения ответственности
      по применимому транспортному уставу (УАТ/УЖТ/ВК/КТМ/КВВТ).
    addressee: "Юридический советник перевозчика"

  claim_procedure_check:
    text: >
      Просим детализировать в {doc_names} обязательный претензионный порядок:
      (а) сроки предъявления претензий (для утраты, повреждения, просрочки);
      (б) форма претензии и прилагаемые документы;
      (в) срок ответа на претензию; (г) ссылка на ст. 797 ГК РФ;
      (д) сокращённый срок исковой давности (1 год).
    addressee: "Юридический советник"

  pretension_order:
    text: >
      В {doc_names} отсутствует/недостаточно детализирован обязательный претензионный
      порядок (ст. 797 ГК РФ). Просим включить сроки, форму, порядок рассмотрения.
    addressee: "Юридический советник"

  mandatory_pretension_procedure_missing:
    text: >
      ВНИМАНИЕ: в {doc_names} отсутствует обязательный претензионный порядок
      (ст. 797 ГК РФ). Пропуск сроков лишает права на иск. Просим немедленно
      включить порядок с указанием сроков для каждого вида претензий.
    addressee: "Юридический советник"

  cargo_value_and_insurance:
    text: >
      Просим уточнить в {doc_names}: (а) объявленную ценность груза;
      (б) обязательность страхования и кто страхует;
      (в) вид страхового покрытия (all risks / named perils);
      (г) минимальную страховую сумму; (д) выгодоприобретателя.
    addressee: "Грузоотправитель / Юридический советник"

  cargo_insurance_clause:
    text: >
      Просим уточнить в {doc_names}: условия страхования груза, кто несёт расходы,
      страховая сумма, порядок урегулирования убытков.
    addressee: "Обе стороны"

  special_cargo_conditions:
    text: >
      В {doc_names} перевозится груз особой категории. Просим предоставить:
      (а) для опасных — свидетельство ДОПОГ, аварийную карточку, класс опасности;
      (б) для скоропортящихся — температурный режим, наличие термографа;
      (в) для негабаритных — проект перевозки, специальное разрешение.
    addressee: "Грузоотправитель / Перевозчик"

  dangerous_cargo_without_dopog:
    text: >
      ВНИМАНИЕ: в {doc_names} перевозится опасный груз, но документы ДОПОГ
      не упоминаются. Просим незамедлительно предоставить: свидетельство ДОПОГ,
      аварийную карточку, специальное разрешение.
    addressee: "Перевозчик"

  international_transport_provisions:
    text: >
      В {doc_names} предусмотрена международная перевозка. Просим уточнить:
      (а) применимую конвенцию (CMR/Монреальская/иная);
      (б) распределение таможенных обязанностей; (в) базис поставки (Incoterms);
      (г) применимое право; (д) подсудность споров.
    addressee: "Юридический советник"

  international_transport_without_convention:
    text: >
      ВНИМАНИЕ: в {doc_names} — международная перевозка без ссылки на конвенцию.
      Просим указать применимую конвенцию и согласовать применимое право.
    addressee: "Юридический советник"

  lien_right_on_cargo:
    text: >
      Просим уточнить в {doc_names}: (а) право удержания груза при неоплате;
      (б) порядок реализации удержанного груза; (в) распределение расходов на хранение.
    addressee: "Юридический советник"

  demurrage_detention_check:
    text: >
      Просим согласовать в {doc_names}: (а) нормативное время погрузки/выгрузки;
      (б) ставку демереджа за сверхнормативный простой;
      (в) максимальную сумму демереджа; (г) кто оплачивает.
    addressee: "Обе стороны"

  vehicle_supply_check:
    text: >
      Просим уточнить в {doc_names}: (а) срок и порядок подачи ТС;
      (б) порядок уведомления; (в) санкции за неподачу/несвоевременную подачу;
      (г) санкции за непредъявление груза.
    addressee: "Обе стороны"

  vehicle_supply_penalty:
    text: >
      Просим согласовать в {doc_names}: размер штрафов за неподачу ТС
      и непредъявление груза (для обеих сторон), порядок уведомления.
    addressee: "Юридический советник"

  freight_charge:
    text: >
      Просим подтвердить по {doc_names}: (а) размер провозной платы;
      (б) включает ли НДС; (в) тарифная основа; (г) порядок и сроки оплаты;
      (д) реквизиты для перечисления.
    addressee: "Обе стороны"

  parties_identification:
    text: >
      Просим подтвердить полные реквизиты сторон по {doc_names}: наименование,
      ИНН, ОГРН, адрес, лицензия перевозчика, данные грузополучателя.
    addressee: "Обе стороны"

  cargo_and_route:
    text: >
      Просим уточнить в {doc_names}: полные характеристики груза и маршрут
      (пункт отправления, пункт назначения, промежуточные пункты).
    addressee: "Грузоотправитель"

  delivery_deadline:
    text: >
      Просим согласовать в {doc_names}: срок доставки, транзитное время,
      последствия нарушения сроков.
    addressee: "Обе стороны"

  delivery_delay_penalty:
    text: >
      Просим согласовать в {doc_names}: размер неустойки за просрочку доставки,
      предельный размер, порядок исчисления.
    addressee: "Юридический советник"

  cargo_acceptance_procedure:
    text: >
      Просим уточнить в {doc_names}: порядок приёмки груза, фиксации недостачи
      и повреждений (коммерческий акт), сроки предъявления претензий.
    addressee: "Обе стороны"

  exclusions_from_liability:
    text: >
      Просим согласовать в {doc_names}: перечень обстоятельств, освобождающих
      от ответственности (непреодолимая сила, вина грузоотправителя,
      свойства груза, дефекты тары, действия госорганов).
    addressee: "Юридический советник"

  limitation_period_notice:
    text: >
      Просим включить в {doc_names} указание на сокращённый срок исковой давности
      (1 год по ст. 797 ГК РФ).
    addressee: "Юридический советник"

  carrier_license_check:
    text: >
      Просим предоставить по {doc_names}: копию лицензии/разрешения перевозчика,
      подтверждение допуска к перевозкам.
    addressee: "Перевозчик"

  carrier_license_absent:
    text: >
      Просим предоставить подтверждение лицензии/допуска перевозчика по {doc_names}.
      Без лицензии деятельность перевозчика может быть признана незаконной.
    addressee: "Перевозчик"

  packaging_and_marking:
    text: >
      Просим уточнить в {doc_names}: требования к таре, упаковке и маркировке груза,
      ответственность за дефекты упаковки.
    addressee: "Грузоотправитель"

  loading_unloading_obligations:
    text: >
      Просим уточнить в {doc_names}: кто осуществляет погрузку/выгрузку,
      нормативное время, средства крепления, ответственность за сохранность.
    addressee: "Обе стороны"

  application_procedure_framework:
    text: >
      Просим согласовать в {doc_names}: форму заявки на перевозку, сроки подачи,
      порядок подтверждения/отклонения, санкции за отказ.
    addressee: "Обе стороны"

  gps_tracking:
    text: >
      Просим уточнить в {doc_names}: наличие GPS/ГЛОНАСС-мониторинга,
      доступ грузоотправителя к отслеживанию, порядок уведомлений.
    addressee: "Перевозчик"

  confidentiality:
    text: >
      Просим включить в {doc_names} условие о конфиденциальности коммерческих
      условий перевозки.
    addressee: "Юридический советник"

  vat_and_tax:
    text: >
      Просим уточнить в {doc_names}: режим НДС (в т.ч. ставка 0% для международных),
      порядок документооборота.
    addressee: "Бухгалтерия"

  auto_renewal:
    text: >
      Просим уточнить в {doc_names}: условия автопролонгации рамочного договора,
      срок уведомления о непродлении.
    addressee: "Юридический советник"

  anticorruption_clause:
    text: >
      Просим включить в {doc_names} антикоррупционную оговорку (ФЗ-273).
    addressee: "Юридический советник"

  dispute_resolution:
    text: >
      Просим согласовать в {doc_names}: подсудность, претензионный порядок,
      возможность третейского разбирательства.
    addressee: "Юридический советник"

  shipper_obligations_and_warranties_check:
    text: >
      Просим предоставить по {doc_names}: перечень обязанностей грузоотправителя  по подготовке груза, предоставлению достоверных сведений (наименование, вес,  свойства), упаковке, маркировке, а также ответственность за недостоверные данные.
    addressee: "Юридический советник"

  shipper_data_accuracy:
    text: >
      Просим включить в {doc_names}: заверение грузоотправителя о достоверности  сведений о грузе и ответственность за убытки перевозчика от недостоверных данных  (ст. 10 УАТ, ст. 27 УЖТ).
    addressee: "Юридический советник"

  shipper_false_cargo_info:
    text: >
      В {doc_names} не выявлена ответственность грузоотправителя за недостоверные  сведения о грузе. Просим включить обязанность и санкции  (ст. 10 УАТ, ст. 27 УЖТ, ст. 25 CMR).
    addressee: "Юридический советник"

  subcontracting_and_substitution_check:
    text: >
      Просим уточнить в {doc_names}: вправе ли перевозчик привлекать субперевозчика,
      требуется ли согласие, кто несёт ответственность за действия субперевозчика,
      условия замены транспорта и водителя.
    addressee: "Юридический советник"

  subcontracting_terms:
    text: >
      Просим включить в {doc_names}: условия привлечения субперевозчика —
      запрет или согласие, ответственность перевозчика за действия третьих лиц.
    addressee: "Юридический советник"

  subcontracting_without_consent:
    text: >
      В {doc_names} выявлен риск привлечения субперевозчика без согласия.
      Просим предусмотреть порядок согласования и ответственность  перевозчика за субперевозчика.
    addressee: "Юридический советник"

  redirection_in_transit_check:
    text: >
      Просим уточнить в {doc_names}: условия переадресовки (изменение пункта  назначения/грузополучателя в пути), кто вправе запросить,  распределение расходов, сроки.
    addressee: "Обе стороны"

  redirection_clause:
    text: >
      Просим включить в {doc_names}: условия переадресовки, порядок  согласования, распределение дополнительных расходов.
    addressee: "Юридический советник"

  electronic_waybill_terms:
    text: >
      Просим уточнить в {doc_names}: порядок использования электронной  транспортной накладной (ЭТрН), подключение к ГИС ЭПД,  юридическую силу электронного документа.
    addressee: "Обе стороны"

  cargo_escort_terms:
    text: >
      Просим уточнить в {doc_names}: условия сопровождения груза,
      кто обеспечивает, ответственность при повреждении во время  сопровождения, требования к охране.
    addressee: "Обе стороны"

  no_cargo_acceptance_procedure:
    text: >
      В {doc_names} не выявлен чёткий порядок приёмки груза при выдаче.
      Просим включить: осмотр, составление коммерческого акта,
      сроки предъявления замечаний.
    addressee: "Юридический советник"

  force_majeure_clause:
    text: >
      Просим согласовать в {doc_names}: перечень обстоятельств  непреодолимой силы, порядок уведомления и подтверждения.
    addressee: "Юридический советник"

  seasonal_road_restrictions:
    text: >
      Просим уточнить в {doc_names}: порядок учёта сезонных дорожных  ограничений, распределение расходов на пропуска,  последствия задержки из-за ограничений.
    addressee: "Обе стороны"

  # Generic fallback
  _default:
    text: >
      Просим предоставить дополнительную информацию по вопросу «{check_name}»
      применительно к {doc_names}.
    addressee: "Юридический советник"
