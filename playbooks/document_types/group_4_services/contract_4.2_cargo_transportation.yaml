      llm_prompt_extraction: |
        <role>
        Ты — российский юрист по транспортным договорам.
        Извлеки условия о штрафах за неподачу ТС под погрузку и непредъявление груза к перевозке.
        Не анализируй неустойку за просрочку доставки груза, простой (демередж), ответственность за сохранность груза и иные разделы.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. vehicle_supply_penalty_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из полей (penalty_for_non_supply_present, penalty_for_non_presentation_present) ∈ {"yes", "no"};
           - "missing" — если оба поля равны "not_defined"
             и фрагментов о штрафах за неподачу ТС / непредъявление груза в контексте нет;
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - penalty_for_non_supply_present = "not_defined";
           - penalty_for_non_presentation_present = "not_defined";
           - penalty_rate = "not_defined";
           - release_conditions = "not_defined";
           - vehicle_supply_penalty_snippet = "not_defined";
           - все *_display = соответствующий fallback;
           - не выполняй остальные шаги.

        1. penalty_for_non_supply_present:
           - "yes" — если штраф/санкция за неподачу перевозчиком ТС прямо предусмотрена в договоре;
           - "no" — если договор прямо исключает ответственность за неподачу ТС под погрузку;
           - "not_defined" — если ответственность перевозчика за неподачу ТС прямо не урегулирована.

        2. penalty_for_non_presentation_present:
           - "yes" — если штраф/санкция за непредъявление груза к перевозке или отказ от заявки прямо предусмотрена в договоре;
           - "no" — если договор прямо исключает ответственность грузоотправителя за непредъявление груза;
           - "not_defined" — если ответственность за непредъявление груза прямо не урегулирована.

        3. penalty_rate:
           Ставка или порядок расчёта штрафа за неподачу ТС и/или непредъявление груза (например: "5 000 руб. за каждый факт неподачи ТС").
           Если ставка не названа явно — "not_defined".

        4. release_conditions:
           Основания и условия освобождения от штрафа, согласованные сторонами (например: "при отмене заявки за 24 часа").
           Если не согласованы — "not_defined".

        5. vehicle_supply_penalty_snippet:
           Точная цитата из договора о штрафах за неподачу ТС или непредъявление груза. Если нет — "not_defined".

        6. penalty_for_non_supply_present_display:
           "Предусмотрен" / "Не предусмотрен" / "Не указано".

        7. penalty_for_non_presentation_present_display:
           "Предусмотрен" / "Не предусмотрен" / "Не указано".
        </task>

        <context_rules>
        - Перед остальными полями заполни vehicle_supply_penalty_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все поля = "not_defined" / соответствующий fallback.
        - Не путай эти санкции с неустойкой за просрочку доставки груза.
        - Прямое исключение ответственности (penalty_for_non_supply_present = "no" или penalty_for_non_presentation_present = "no") — это presence = "present", а не "missing".
        - Не используй "None", "null" или пустые строки.
        - Все 7 ключей должны присутствовать в JSON-ответе.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В договоре перевозки вообще нет упоминания санкций за неподачу ТС под погрузку или непредъявление груза.
           → presence = "missing";
             penalty_for_non_supply_present = "not_defined";
             penalty_for_non_presentation_present = "not_defined".

        2. Штрафы только названы без конкретных тарифов.
           "Стороны уплачивают штрафы за неподачу транспорта или непредъявление груза."
           → presence = "present";
             penalty_for_non_supply_present = "yes";
             penalty_for_non_presentation_present = "yes";
             penalty_rate = "not_defined".

        3. Противоречие между фрагментами.
           В одном месте указан штраф 3 000 руб., в другом — 5 000 руб. для одной и той же ситуации.
           → presence = "unclear";
             penalty_for_non_supply_present = "not_defined";
             penalty_for_non_supply_present_display = "Не указано".

        4. Неустойка за просрочку доставки груза ≠ штраф за неподачу ТС.
           "За каждый день просрочки доставки груза перевозчик выплачивает пеню..."
           → presence = "missing";
             all other fields = "not_defined"
             (это пеня за просрочку доставки, а не за неподачу ТС).
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для vehicle_supply_penalty_presence используй только: "present", "missing", "unclear".
        - Для penalty_for_non_supply_present и penalty_for_non_presentation_present используй только: "yes", "no", "not_defined".
        - Fallback при отсутствии данных:
          * все текстовые поля → "not_defined";
          * все *_display → "Не указано".
        - Fallback при противоречии или неоднозначности:
          * все *_display → "Не указано".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
