  - id: pretension_order
    name: "Претензионный порядок: сроки и процедура (ст. 797 ГК РФ)"
    description: >
      Проверяет наличие обязательного претензионного порядка с указанием
      сроков и формы претензии. Это ключевой procedural check для споров
