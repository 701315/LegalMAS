          - escort_required: yes → "Требуется", no → "Не требуется", optional → "По согласованию", not_defined → "Не указано"
          - escort_type:
            * shipper_representative → "Представитель грузоотправителя"
            * armed_guard → "Вооружённая охрана"
            * other → "Иное сопровождение"
            * not_defined → "Не указан"
          - cost_allocation: shipper → "Грузоотправитель", carrier → "Перевозчик", not_defined → "Не указано"
          - special_cases_defined: yes → "Есть", no → "Нет", not_defined → "Не указано"
        8. Верни РОВНО один JSON-объект со всеми 9 ключами без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ПРИМЕРЫ (FEW-SHOT)]

