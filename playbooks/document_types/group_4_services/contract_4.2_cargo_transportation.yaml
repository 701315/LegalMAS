        - "проверка состояния груза"
        - "осмотр при получении"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)приёмк(а|и)\\s+груз"
        - "(?i)коммерческ(ий|ого)\\s+акт"
        - "(?i)акт.*о.*(недостач|поврежден)"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по транспортным договорам.
        Анализируется договор перевозки груза.
        Проверяется только порядок приёмки груза в пункте назначения.

        Нормативный ориентир:
        - ст. 796 ГК РФ
        - применимые транспортные уставы и правила

        [ЗАДАЧА]
        Установи:
        1. Есть ли в договоре процедура приёмки груза.
        2. Предусмотрен ли коммерческий акт или аналогичный документ.
        3. Предусмотрена ли процедура фиксации повреждений.
        4. Предусмотрена ли процедура фиксации недостачи.
        5. Есть ли обязанность осмотра груза при получении.
        6. Приведи точную цитату из договора.
        7. Сформируй user-friendly значения для отображения в DD Grid.

        [ПРАВИЛА]
        1. Используй только текст договора.
        2. Не выводи процессуальные правила из закона, если их нет в тексте.
        3. Если в договоре только общая фраза "груз принимается", это не равно детальной процедуре — ставь "partial" или "not_defined".
        4. Если отдельный акт не назван, но описана письменная фиксация недостатков, это можно учитывать как процедуру фиксации.
        5. Не используй "None", "null" или пустые строки — используй "not_defined".
        6. В cargo_acceptance_snippet включай только цитату из договора.
        7. Для *_display полей используй понятные русские формулировки:
          - acceptance_procedure_present: yes → "Установлен", no → "Не установлен", partial → "Частично", not_defined → "Не указано"
          - commercial_act_mentioned: yes → "Предусмотрен", no → "Не предусмотрен", not_defined → "Не указано"
          - damage_fixing_procedure: yes → "Предусмотрена", no → "Не предусмотрена", not_defined → "Не указано"
          - shortage_fixing_procedure: yes → "Предусмотрена", no → "Не предусмотрена", not_defined → "Не указано"
          - inspection_on_receipt: yes → "Предусмотрен", no → "Не предусмотрен", not_defined → "Не указано"
        8. Верни РОВНО один JSON-объект со всеми 11 ключами без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — полная процедура с коммерческим актом:
        Фрагмент:
        "Приёмка груза осуществляется Грузополучателем в пункте назначения путём осмотра состояния груза и проверки количества мест. При выявлении недостачи или повреждений составляется коммерческий акт в трёх экземплярах. Грузополучатель обязан провести осмотр груза в момент его выдачи."

        Ответ:
        {
          "acceptance_procedure_present": "yes",
          "commercial_act_mentioned": "yes",
          "damage_fixing_procedure": "yes",
          "shortage_fixing_procedure": "yes",
          "inspection_on_receipt": "yes",
          "cargo_acceptance_snippet": "Приёмка груза осуществляется Грузополучателем в пункте назначения путём осмотра состояния груза и проверки количества мест. При выявлении недостачи или повреждений составляется коммерческий акт в трёх экземплярах. Грузополучатель обязан провести осмотр груза в момент его выдачи.",
          "acceptance_procedure_present_display": "Установлен",
          "commercial_act_mentioned_display": "Предусмотрен",
          "damage_fixing_procedure_display": "Предусмотрена",
          "shortage_fixing_procedure_display": "Предусмотрена",
          "inspection_on_receipt_display": "Предусмотрен"
        }

        Пример 2 — процедура не упомянута:
        Фрагмент:
        "Перевозчик обязуется доставить груз в пункт назначения в установленный срок."

        Ответ:
        {
          "acceptance_procedure_present": "not_defined",
          "commercial_act_mentioned": "not_defined",
          "damage_fixing_procedure": "not_defined",
          "shortage_fixing_procedure": "not_defined",
          "inspection_on_receipt": "not_defined",
          "cargo_acceptance_snippet": "not_defined",
