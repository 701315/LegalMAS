          label: "Доступ грузоотправителя"
          description: >
            User-friendly отображение: предусмотрено ли заверение
            о достоверности сведений о грузе.
            Fallback: "Не указано" / "Не удалось определить".
          required: true
      store_payload: true

  - id: shipper_data_accuracy
    name: "Достоверность сведений о грузе: ответственность грузоотправителя"
    description: >
      Проверяет наличие заверений о достоверности сведений о грузе,
      а также распределение ответственности за ложные или неполные данные.
      Базовые заверения и общая ответственность за недостоверные данные
      частично проверяются в check-е shipper_obligations_and_warranties_check;
      данный check добавляет детализацию: кто именно несёт ответственность
      (грузоотправитель/перевозчик) и какие виды данных охватываются
      (вес, свойства, документы, смешанный охват).
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "достоверность сведений"
        - "грузоотправитель несёт ответственность"
        - "недостоверные данные"
        - "сведения о грузе"
        - "вес груза"
        - "свойства груза"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)достоверност.*сведени"
        - "(?i)грузоотправител.*ответственност"
        - "(?i)ответственност.*за.*недостоверн"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по транспортным договорам.
        Анализируется договор перевозки груза.
        Проверяется ТОЛЬКО вопрос достоверности сведений о грузе
        и ответственности за неверные данные.

        Базовые заверения и общая ответственность за недостоверные данные
        НЕ проверяются в этом check-е — они покрыты отдельной проверкой
        (shipper_obligations_and_warranties_check).

        Нормативный ориентир:
        - ст. 10 ФЗ-259 (УАТ)
        - ст. 27 УЖТ
        - специальные правила перевозки

        [ЗАДАЧА]
        Установи:
        1. Есть ли в договоре заверение/обязанность по достоверности сведений.
        2. Предусмотрена ли ответственность за ложные или неполные данные.
        3. Кто именно несёт такую ответственность.
        4. Какие виды данных охватываются: вес, свойства груза, документы, иные характеристики.
        5. Приведи точную цитату из договора.
        6. Сформируй user-friendly значения для отображения в DD Grid.

        [ПРАВИЛА]
        1. Используй только текст договора.
        2. Не путай общую обязанность предоставить сведения с заверением об их достоверности.
        3. Если ответственность описана общо — liability_for_false_data = "yes", даже если размер не указан.
        4. Не подставляй нормы закона вместо текста договора.
        5. Не используй "None", "null" или пустые строки — используй "not_defined".
        6. В shipper_data_accuracy_snippet включай только цитату из договора.
        7. Для *_display полей используй понятные русские формулировки:
          - accuracy_warranty_present: yes → "Предусмотрено", no → "Не предусмотрено", not_defined → "Не указано"
          - liability_for_false_data: yes → "Предусмотрена", no → "Не предусмотрена", not_defined → "Не указано"
          - liable_party: shipper → "Грузоотправитель", carrier → "Перевозчик", not_defined → "Не указана"
          - covered_data_scope:
            * weight → "Вес груза"
            * cargo_properties → "Свойства груза"
            * documents → "Документы"
            * mixed → "Смешанный охват"
            * not_defined → "Не указан"
        8. Верни РОВНО один JSON-объект со всеми 9 ключами без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — заверение и ответственность с указанием охвата:
        Фрагмент:
        "Грузоотправитель заверяет Перевозчика в достоверности сведений о весе, свойствах и характеристиках груза, а также предоставленных документов. За недостоверность указанных сведений Грузоотправитель несёт ответственность в виде возмещения всех убытков, понесённых Перевозчиком."

        Ответ:
        {
          "accuracy_warranty_present": "yes",
          "liability_for_false_data": "yes",
          "liable_party": "shipper",
          "covered_data_scope": "mixed",
          "shipper_data_accuracy_snippet": "Грузоотправитель заверяет Перевозчика в достоверности сведений о весе, свойствах и характеристиках груза, а также предоставленных документов. За недостоверность указанных сведений Грузоотправитель несёт ответственность в виде возмещения всех убытков, понесённых Перевозчиком.",
          "accuracy_warranty_present_display": "Предусмотрено",
          "liability_for_false_data_display": "Предусмотрена",
          "liable_party_display": "Грузоотправитель",
          "covered_data_scope_display": "Смешанный охват"
        }

        Пример 2 — условия не упомянуты:
        Фрагмент:
        "Перевозчик обязуется доставить груз в пункт назначения в установленный срок."

        Ответ:
        {
          "accuracy_warranty_present": "not_defined",
          "liability_for_false_data": "not_defined",
          "liable_party": "not_defined",
          "covered_data_scope": "not_defined",
          "shipper_data_accuracy_snippet": "not_defined",
          "accuracy_warranty_present_display": "Не указано",
          "liability_for_false_data_display": "Не указано",
          "liable_party_display": "Не указана",
          "covered_data_scope_display": "Не указан"
        }

        Пример 3 — текст есть, но вывод невозможен (размытая формулировка без конкретики):
        Фрагмент:
        "Стороны обязуются предоставлять друг другу необходимую информацию в ходе исполнения договора."

        Ответ:
        {
          "accuracy_warranty_present": "not_defined",
          "liability_for_false_data": "not_defined",
          "liable_party": "not_defined",
          "covered_data_scope": "not_defined",
          "shipper_data_accuracy_snippet": "Стороны обязуются предоставлять друг другу необходимую информацию в ходе исполнения договора.",
          "accuracy_warranty_present_display": "Не указано",
          "liability_for_false_data_display": "Не указано",
          "liable_party_display": "Не указана",
          "covered_data_scope_display": "Не указан"
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        Перед ответом внутренне проверь:
        1. Есть ли прямая цитата о достоверности сведений именно о грузе.
        2. Не путаешь ли ты общую обязанность предоставить сведения с заверением об их достоверности.
        3. Не подставил ли ты нормы закона вместо текста договора.
        4. Если прямого указания нет — верни "not_defined".
        5. Все 9 ключей присутствуют в JSON.

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь РОВНО одним JSON-объектом без какого-либо дополнительного текста до или после, со всеми 9 ключами:
        {
          "accuracy_warranty_present": "<yes / no / not_defined>",
          "liability_for_false_data": "<yes / no / not_defined>",
          "liable_party": "<shipper / carrier / not_defined>",
          "covered_data_scope": "<weight / cargo_properties / documents / mixed / not_defined>",
          "shipper_data_accuracy_snippet": "<точная цитата или not_defined>",
          "accuracy_warranty_present_display": "<Предусмотрено / Не предусмотрено / Не указано>",
          "liability_for_false_data_display": "<Предусмотрена / Не предусмотрена / Не указано>",
          "liable_party_display": "<Грузоотправитель / Перевозчик / Не указана>",
          "covered_data_scope_display": "<Вес груза / Свойства груза / Документы / Смешанный охват / Не указан>"
        }
      context_k: 4
      temperature: 0.0
      max_tokens: 700
    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "достоверность сведений о грузе грузоотправитель несёт ответственность недостоверные данные вес груза свойства груза документы заверение ответственность за ложные данные"
      preferred_unit_types:
        - warranty
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - representations
        - obligations
      negative_keywords:
        - "провозная плата"
        - "претензия"
        - "форс-мажор"
        - "неустойка за просрочку"
      position_bias:
        preferred_range: [0.0, 0.90]
        boost: 0.15
        scope: auto
      retrieval_profile: "warranties_check"
      context_k: 4
      max_chunks: 6
      rerank: true
    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
        - "invoice"
      preferred_clause_functions:
        - "representations"
        - "obligations"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10
    evidence:
      required: true
      min_snippet_length: 20
      max_snippet_length: 400
    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1100

      compact_output: false

      presence_signal:
        field: "shipper_data_accuracy_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист по транспортным договорам.
        Извлеки только условия о достоверности сведений о грузе и ответственности за их недостоверность.
        Не анализируй цену, сроки доставки, ответственность за просрочку, претензии и иные разделы.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. shipper_data_accuracy_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей (accuracy_warranty_present, liability_for_false_data) ∈ {"yes", "no"};
           - "missing" — если все содержательные поля равны "not_defined" и фрагментов об ответственности за данные в контексте нет;
           - "unclear" — если фрагменты по теме есть, но из-за противоречий вывод невозможен.

           Если presence = "missing":
           - accuracy_warranty_present = "not_defined";
           - liability_for_false_data = "not_defined";
           - liable_party = "not_defined";
           - covered_data_scope = "not_defined";
           - shipper_data_accuracy_snippet = "not_defined";
           - все *_display = соответствующий fallback;
           - не выполняй остальные шаги.

        1. accuracy_warranty_present:
           - "yes" — если обязанность/заверение о достоверности сведений прямо закреплено в договоре перевозки;
           - "no" — если в договоре прямо указано на отсутствие специальных заверений грузоотправителя по данным груза;
           - "not_defined" — если заверение прямо не упомянуто.

        2. liability_for_false_data:
           - "yes" — если установлена ответственность/санкция за предоставление ложных, ошибочных или неполных сведений;
           - "no" — если договор прямо исключает ответственность грузоотправителя за достоверность сведений;
           - "not_defined" — если вопрос ответственности перевозчика или грузоотправителя не урегулирован.

        3. liable_party:
           - "shipper" — грузоотправитель;
           - "carrier" — перевозчик;
           - "not_defined" — ответственная за ущерб/несоответствия сторона не указана.

        4. covered_data_scope:
           Характер охваченных сведений. Используй строго:
           - "weight" — вес груза;
           - "cargo_properties" — свойства груза;
           - "documents" — сопроводительные документы;
           - "mixed" — смешанный охват (несколько категорий);
           - "not_defined" — охват явно не определён.

        5. shipper_data_accuracy_snippet:
           Точная цитата из договора о достоверности сведений и ответственности. Если нет — "not_defined".

        6. accuracy_warranty_present_display:
           "Предусмотрено" / "Не предусмотрено" / "Не указано".

        7. liability_for_false_data_display:
           "Предусмотрена" / "Не предусмотрена" / "Не указано".

        8. liable_party_display:
           "Грузоотправитель" / "Перевозчик" / "Не указана".

        9. covered_data_scope_display:
           "Вес груза" / "Свойства груза" / "Документы" / "Смешанный охват" / "Не указан".
        </task>

        <context_rules>
        - Перед остальными полями заполни shipper_data_accuracy_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все поля = "not_defined" / соответствующий fallback.
        - Не путай общую обязанность грузоотправителя передать данные/документы с его заверением об их достоверности.
        - Прямое указание на отсутствие ответственности за достоверность данных (liability_for_false_data = "no") — это presence = "present", а не "missing".
        - Не используй "None", "null" или пустые строки.
        - Все 9 ключей должны присутствовать в JSON-ответе.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В договоре перевозки вообще нет упоминаний о достоверности сведений о грузе или ответственности за ложные данные.
           → presence = "missing";
             accuracy_warranty_present = "not_defined";
             covered_data_scope = "not_defined".

        2. Общая обязанность предоставления документов без заверений.
           "Грузоотправитель обязуется передать все необходимые документы до погрузки ТС." (про достоверность и ответственность ничего нет).
           → presence = "missing";
             accuracy_warranty_present = "not_defined" (это обязанность по передаче документов, а не заверение об их достоверности).

        3. Противоречие между фрагментами.
           В одном месте грузоотправитель отвечает за достоверность веса груза, в другом — перевозчик несёт риски неверного взвешивания.
           → presence = "unclear";
             liable_party = "not_defined";
             covered_data_scope_display = "Не указан".

        4. Ограниченный охват ответственности.
           "Грузоотправитель несёт ответственность за предоставление недостоверных данных исключительно по весу груза."
           → presence = "present";
             accuracy_warranty_present = "yes";
             liability_for_false_data = "yes";
             covered_data_scope = "weight".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для shipper_data_accuracy_presence используй только: "present", "missing", "unclear".
        - Для accuracy_warranty_present, liability_for_false_data используй только: "yes", "no", "not_defined".
        - Для liable_party используй только: "shipper", "carrier", "not_defined".
        - Для covered_data_scope используй только: "weight", "cargo_properties", "documents", "mixed", "not_defined".
        - Fallback при отсутствии данных:
          * shipper_data_accuracy_snippet → "not_defined";
          * все *_display → соответствующие fallback-строки.
        - Fallback при противоречии или неоднозначности:
          * все *_display → соответствующие fallback-строки.
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "shipper_data_accuracy_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие условий о достоверности сведений. Внутреннее агрегатное signal-поле."
          required: true

        - name: "accuracy_warranty_present"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Заверение о достоверности сведений есть. Внутреннее enum-поле."
          required: true
          display_in_grid: false
        - name: "liability_for_false_data"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Ответственность за ложные данные предусмотрена. Внутреннее enum-поле."
          required: true
          display_in_grid: false
        - name: "liable_party"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["shipper", "carrier", "not_defined"]
          description: "Ответственная сторона. Внутреннее enum-поле."
          required: true
          display_in_grid: false
        - name: "covered_data_scope"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["weight", "cargo_properties", "documents", "mixed", "not_defined"]
          description: "Охват сведений. Внутреннее enum-поле."
          required: true
          display_in_grid: false
        - name: "shipper_data_accuracy_snippet"
          type: "string"
          presentation: "diagnostic"
          display_in_grid: false
          description: "Цитата о достоверности сведений и ответственности за недостоверные данные"
          required: true
        - name: "accuracy_warranty_present_display"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 1
          label: "Заверение о достоверности"
          description: >
            User-friendly отображение: предусмотрено ли заверение
            о достоверности сведений о грузе.
            Fallback: "Не указано" / "Не удалось определить".
          required: true
        - name: "liability_for_false_data_display"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 2
          label: "Ответственность за ложные данные"
          description: >
            User-friendly отображение: предусмотрена ли ответственность
            за ложные или неполные данные.
            Fallback: "Не указано" / "Не удалось определить".
          required: true
        - name: "liable_party_display"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 3
          label: "Ответственная сторона"
          description: >
            User-friendly отображение стороны, несущей ответственность
            за недостоверные данные.
            Fallback: "Не указана" / "Не удалось определить".
          required: true
        - name: "covered_data_scope_display"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 4
          label: "Охват сведений"
          description: >
            User-friendly отображение охвата сведений, к которым применяются
            заверения и ответственность.
            Fallback: "Не указан" / "Не удалось определить".
          required: true
      store_payload: true

  - id: subcontracting_terms
    name: "Привлечение субперевозчика: условия и ответственность"
    description: >
      Проверяет условия привлечения субперевозчиков и распределение
      ответственности перевозчика за действия привлечённых лиц.
      Специфический check для транспортных договоров: субперевозка
      (ст. 785 ГК РФ), ответственность перевозчика за субперевозчика
      (ст. 313 ГК РФ), замена транспортного средства и водителя.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "субперевозчик"
        - "привлечение третьих лиц"
        - "субподряд"
        - "замена перевозчика"
        - "с согласия"
        - "замена транспорта"
        - "замена водителя"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)субперевозчик"
        - "(?i)привлечен(ие|ия)\\s+третьих"
        - "(?i)замен(а|ы)\\s+(транспорт|водителя|перевозчик)"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по транспортным договорам.
        Анализируется договор перевозки груза.
        Проверяются ТОЛЬКО условия субперевозки и ответственность
        за привлечённых третьих лиц.

        Нормативный ориентир:
        - ст. 785 ГК РФ
        - ст. 313 ГК РФ
        - специальные транспортные режимы

        [ЗАДАЧА]
        Установи:
        1. Разрешено ли привлечение субперевозчиков.
        2. Требуется ли согласие грузоотправителя/клиента.
        3. Сохраняет ли перевозчик полную ответственность за субперевозчика.
        4. Есть ли ограничения или запреты на замену перевозчика.
        5. Есть ли условие о замене транспортного средства.
        6. Есть ли условие о замене водителя.
        7. Приведи точную цитату из договора.
        8. Сформируй user-friendly значения для отображения в DD Grid.

        [ПРАВИЛА]
        1. Используй только текст договора.
        2. Не путай субперевозку с заменой водителя/транспорта, если это отдельный вопрос.
        3. Если субперевозка допустима без оговорок — subcontracting_allowed = "yes".
        4. Если допустима только при согласии — subcontracting_allowed = "with_consent".
        5. Если вопрос не урегулирован — "not_defined".
        6. Не используй "None", "null" или пустые строки — используй "not_defined".
        7. В subcontracting_snippet включай только цитату из договора.
        8. Для *_display полей используй понятные русские формулировки:
          - subcontracting_allowed: yes → "Разрешена", no → "Запрещена", with_consent → "С согласия", not_defined → "Не указано"
          - consent_required: yes → "Требуется", no → "Не требуется", not_defined → "Не указано"
          - carrier_liability_for_sub: full → "Полная", limited → "Ограниченная", not_defined → "Не указана"
          - substitution_restrictions: yes → "Есть", no → "Нет", not_defined → "Не указано"
          - vehicle_substitution_clause: present → "Предусмотрено", absent → "Не предусмотрено", not_defined → "Не указано"
          - driver_substitution_clause: present → "Предусмотрено", absent → "Не предусмотрено", not_defined → "Не указано"
        9. Верни РОВНО один JSON-объект со всеми 13 ключами без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — субперевозка разрешена с согласия, полная ответственность:
        Фрагмент:
        "Перевозчик вправе привлекать субперевозчиков только с предварительного письменного согласия Грузоотправителя. Перевозчик несёт полную ответственность перед Грузоотправителем за действия субперевозчиков как за свои собственные. Замена транспортного средства допускается с уведомлением Грузоотправителя не позднее чем за 24 часа."

        Ответ:
        {
          "subcontracting_allowed": "with_consent",
          "consent_required": "yes",
          "carrier_liability_for_sub": "full",
          "substitution_restrictions": "no",
          "vehicle_substitution_clause": "present",
          "driver_substitution_clause": "not_defined",
          "subcontracting_snippet": "Перевозчик вправе привлекать субперевозчиков только с предварительного письменного согласия Грузоотправителя. Перевозчик несёт полную ответственность перед Грузоотправителем за действия субперевозчиков как за свои собственные. Замена транспортного средства допускается с уведомлением Грузоотправителя не позднее чем за 24 часа.",
          "subcontracting_allowed_display": "С согласия",
          "consent_required_display": "Требуется",
          "carrier_liability_for_sub_display": "Полная",
          "substitution_restrictions_display": "Нет",
          "vehicle_substitution_clause_display": "Предусмотрено",
          "driver_substitution_clause_display": "Не указано"
        }

        Пример 2 — условия не упомянуты:
        Фрагмент:
        "Перевозчик обязуется доставить груз в пункт назначения в установленный срок."

        Ответ:
        {
          "subcontracting_allowed": "not_defined",
          "consent_required": "not_defined",
          "carrier_liability_for_sub": "not_defined",
          "substitution_restrictions": "not_defined",
          "vehicle_substitution_clause": "not_defined",
          "driver_substitution_clause": "not_defined",
          "subcontracting_snippet": "not_defined",
          "subcontracting_allowed_display": "Не указано",
          "consent_required_display": "Не указано",
          "carrier_liability_for_sub_display": "Не указана",
          "substitution_restrictions_display": "Не указано",
          "vehicle_substitution_clause_display": "Не указано",
          "driver_substitution_clause_display": "Не указано"
        }

        Пример 3 — текст есть, но вывод невозможен (размытая формулировка без конкретики):
        Фрагмент:
        "Перевозчик обеспечивает исполнение договора своими силами или с привлечением третьих лиц."

        Ответ:
        {
          "subcontracting_allowed": "yes",
          "consent_required": "not_defined",
          "carrier_liability_for_sub": "not_defined",
          "substitution_restrictions": "not_defined",
          "vehicle_substitution_clause": "not_defined",
          "driver_substitution_clause": "not_defined",
          "subcontracting_snippet": "Перевозчик обеспечивает исполнение договора своими силами или с привлечением третьих лиц.",
          "subcontracting_allowed_display": "Разрешена",
          "consent_required_display": "Не указано",
          "carrier_liability_for_sub_display": "Не указана",
          "substitution_restrictions_display": "Не указано",
          "vehicle_substitution_clause_display": "Не указано",
          "driver_substitution_clause_display": "Не указано"
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        Перед ответом внутренне проверь:
        1. Есть ли прямая цитата о субперевозке или привлечении третьих лиц.
        2. Не путаешь ли ты субперевозку с обычным исполнением через работников перевозчика.
        3. Замену транспорта и замену водителя фиксируй только по прямому условию в тексте.
        4. Если прямого указания нет — верни "not_defined".
        5. Все 13 ключей присутствуют в JSON.

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь РОВНО одним JSON-объектом без какого-либо дополнительного текста до или после, со всеми 13 ключами:
        {
          "subcontracting_allowed": "<yes / no / with_consent / not_defined>",
          "consent_required": "<yes / no / not_defined>",
          "carrier_liability_for_sub": "<full / limited / not_defined>",
          "substitution_restrictions": "<yes / no / not_defined>",
          "vehicle_substitution_clause": "<present / absent / not_defined>",
          "driver_substitution_clause": "<present / absent / not_defined>",
          "subcontracting_snippet": "<точная цитата или not_defined>",
          "subcontracting_allowed_display": "<Разрешена / Запрещена / С согласия / Не указано>",
          "consent_required_display": "<Требуется / Не требуется / Не указано>",
          "carrier_liability_for_sub_display": "<Полная / Ограниченная / Не указана>",
          "substitution_restrictions_display": "<Есть / Нет / Не указано>",
          "vehicle_substitution_clause_display": "<Предусмотрено / Не предусмотрено / Не указано>",
          "driver_substitution_clause_display": "<Предусмотрено / Не предусмотрено / Не указано>"
        }
      context_k: 4
      temperature: 0.0
      max_tokens: 700
    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "субперевозчик привлечение третьих лиц субподряд замена перевозчика замена транспорта замена водителя с согласия ответственность за субперевозчика"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - limitations
      negative_keywords:
        - "провозная плата"
        - "претензия"
        - "форс-мажор"
        - "переадресовка"
      position_bias:
        preferred_range: [0.0, 0.90]
        boost: 0.15
        scope: auto
      retrieval_profile: "subcontracting_check"
      context_k: 4
      max_chunks: 6
      rerank: true
    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
        - "invoice"
      preferred_clause_functions:
        - "obligations"
        - "limitations"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10
    evidence:
      required: true
      min_snippet_length: 20
      max_snippet_length: 400
    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1100

      compact_output: false

      presence_signal:
        field: "subcontracting_terms_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист по транспортным договорам.
        Извлеки только условия о субперевозчиках, замене транспорта и водителя.
        Не анализируй цену, сроки доставки, ответственность за просрочку, претензии и иные разделы.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. subcontracting_terms_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если subcontracting_allowed ∈ {"yes", "no", "with_consent"} ИЛИ хотя бы одно из полей (vehicle_substitution_clause, driver_substitution_clause) = "present";
           - "missing" — если все содержательные поля равны "not_defined" / "absent" и фрагментов о субподряде в контексте нет;
           - "unclear" — если фрагменты по теме есть, но из-за противоречий вывод невозможен.

           Если presence = "missing":
           - subcontracting_allowed = "not_defined";
           - consent_required = "not_defined";
           - carrier_liability_for_sub = "not_defined";
           - substitution_restrictions = "not_defined";
           - vehicle_substitution_clause = "not_defined";
           - driver_substitution_clause = "not_defined";
           - subcontracting_snippet = "not_defined";
           - все *_display = соответствующий fallback;
           - не выполняй остальные шаги.

        1. subcontracting_allowed:
           - "yes" — если привлечение субперевозчиков (третьих лиц) прямо разрешено договором перевозки;
           - "no" — если привлечение субперевозчиков прямо запрещено;
           - "with_consent" — если привлечение разрешено только с согласия грузоотправителя/клиента;
           - "not_defined" — если вопрос привлечения третьих лиц прямо не урегулирован.

        2. consent_required:
           - "yes" — если требуется предварительное согласие грузоотправителя/клиента на привлечение субперевозчика;
           - "no" — если согласие прямо не требуется;
           - "not_defined" — если вопрос согласия прямо не поднят.

        3. carrier_liability_for_sub:
           - "full" — если перевозчик несёт полную ответственность за действия третьих лиц как за свои собственные;
           - "limited" — если ответственность перевозчика за действия субперевозчиков ограничена;
           - "not_defined" — если ответственность за действия третьих лиц не урегулирована.

        4. substitution_restrictions:
           - "yes" — если в договоре установлены ограничения на замену перевозчика/водителя;
           - "no" — если ограничения прямо отсутствуют;
           - "not_defined" — если вопрос ограничений на замену прямо не поднят.

        5. vehicle_substitution_clause:
           - "present" — если предусмотрена возможность замены транспортного средства в процессе перевозки;
           - "absent" — если возможность замены ТС прямо исключена / не предусмотрена;
           - "not_defined" — если вопрос замены ТС прямо не урегулирован.

        6. driver_substitution_clause:
           - "present" — если предусмотрена возможность замены водителя в процессе перевозки;
           - "absent" — если замена водителя прямо исключена;
           - "not_defined" — если вопрос замены водителя прямо не урегулирован.

        7. subcontracting_snippet:
           Точная цитата из договора об условиях субподряда. Если нет — "not_defined".

        8. subcontracting_allowed_display:
           "Разрешена" / "Запрещена" / "С согласия" / "Не указано".

        9. consent_required_display:
           "Требуется" / "Не требуется" / "Не указано".

        10. carrier_liability_for_sub_display:
            "Полная" / "Ограниченная" / "Не указана".

        11. substitution_restrictions_display:
            "Есть" / "Нет" / "Не указано".

        12. vehicle_substitution_clause_display:
            "Предусмотрено" / "Не предусмотрено" / "Не указано".

        13. driver_substitution_clause_display:
            "Предусмотрено" / "Не предусмотрено" / "Не указано".
        </task>

        <context_rules>
        - Перед остальными полями заполни subcontracting_terms_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все поля = "not_defined" / "absent" / соответствующий fallback.
        - Не путай привлечение независимых субперевозчиков с физическим использованием транспортного средства силами штатных работников.
        - Прямой запрет субподряда (subcontracting_allowed = "no") — это presence = "present", а не "missing".
        - Не используй "None", "null" или пустые строки.
        - Все 13 ключей должны присутствовать в JSON-ответе.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В договоре перевозки вообще нет упоминаний субперевозчиков, замены водителя или транспортного средства.
           → presence = "missing";
             subcontracting_allowed = "not_defined";
             vehicle_substitution_clause = "not_defined".

        2. Допуск без ограничений.
           "Перевозчик вправе оказывать услуги лично или привлекать любых третьих лиц по своему выбору." (вопросы ответственности опущены).
           → presence = "present";
             subcontracting_allowed = "yes";
             consent_required = "no";
             carrier_liability_for_sub = "not_defined".

        3. Противоречие между фрагментами.
           В одном месте разрешено свободное привлечение, в другом — написано, что третьи лица к перевозке не допускаются.
           → presence = "unclear";
             subcontracting_allowed = "not_defined";
             subcontracting_allowed_display = "Не указано".

        4. Замена ТС без права субподряда.
           "Перевозка осуществляется только силами Перевозчика. Замена транспортного средства допускается только в аварийных случаях."
           → presence = "present";
             subcontracting_allowed = "no";
             vehicle_substitution_clause = "present".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для subcontracting_terms_presence используй только: "present", "missing", "unclear".
        - Для subcontracting_allowed используй только: "yes", "no", "with_consent", "not_defined".
        - Для consent_required, substitution_restrictions используй только: "yes", "no", "not_defined".
        - Для carrier_liability_for_sub используй только: "full", "limited", "not_defined".
        - Для vehicle_substitution_clause, driver_substitution_clause используй только: "present", "absent", "not_defined".
        - Fallback при отсутствии данных:
          * subcontracting_snippet → "not_defined";
          * все *_display → соответствующие fallback-строки ("Не указано", "Не указана", "Не предусмотрено").
        - Fallback при противоречии или неоднозначности:
          * все *_display → соответствующие fallback-строки.
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "subcontracting_terms_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие условий о субперевозке. Внутреннее агрегатное signal-поле."
          required: true

        - name: "subcontracting_allowed"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["yes", "no", "with_consent", "not_defined"]
          description: "Субперевозка разрешена. Внутреннее enum-поле."
          required: true
          display_in_grid: false
        - name: "consent_required"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Требуется согласие. Внутреннее enum-поле."
          required: true
          display_in_grid: false
        - name: "carrier_liability_for_sub"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["full", "limited", "not_defined"]
          description: "Ответственность перевозчика за субперевозчика. Внутреннее enum-поле."
          required: true
          display_in_grid: false
        - name: "substitution_restrictions"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Есть ограничения на замену перевозчика. Внутреннее enum-поле."
          required: true
          display_in_grid: false
        - name: "vehicle_substitution_clause"
          type: "string"
          presentation: "signal"
          risk_weight: "low"
          allowed_values: ["present", "absent", "not_defined"]
          description: "Условие о замене транспортного средства. Внутреннее enum-поле."
          required: true
          display_in_grid: false
        - name: "driver_substitution_clause"
          type: "string"
          presentation: "signal"
          risk_weight: "low"
          allowed_values: ["present", "absent", "not_defined"]
          description: "Условие о замене водителя. Внутреннее enum-поле."
          required: true
          display_in_grid: false
        - name: "subcontracting_snippet"
          type: "string"
          presentation: "diagnostic"
          display_in_grid: false
          description: "Цитата об условиях субперевозки и замены транспорта/водителя"
          required: true
        - name: "subcontracting_allowed_display"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 1
          label: "Привлечение субперевозчика"
          description: >
            User-friendly отображение: разрешена ли субперевозка. Fallback: "Не установлено" / "Не удалось определить".
          required: true
        - name: "consent_required_display"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 2
          label: "Требуется согласие"
          description: >
            User-friendly отображение: требуется ли согласие на привлечение субперевозчика. Fallback: "Не установлено" / "Не удалось определить".
          required: true
        - name: "carrier_liability_for_sub_display"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 3
          label: "Ответственность за субперевозчика"
          description: >
            User-friendly отображение: полная или ограниченная
            ответственность перевозчика за субперевозчика.
            Fallback: "Не указана" / "Не удалось определить".
          required: true
        - name: "substitution_restrictions_display"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 4
          label: "Ограничения на замену"
          description: >
            User-friendly отображение: есть ли ограничения на замену перевозчика. Fallback: "Не установлено" / "Не удалось определить".
          required: true
        - name: "vehicle_substitution_clause_display"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 5
          label: "Замена ТС"
          description: >
            User-friendly отображение: предусмотрено ли условие
            о замене транспортного средства.
            Fallback: "Не указано" / "Не удалось определить".
          required: true
        - name: "driver_substitution_clause_display"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 6
          label: "Замена водителя"
          description: >
            User-friendly отображение: предусмотрено ли условие о замене водителя. Fallback: "Не установлено" / "Не удалось определить".
          required: true
      store_payload: true

  - id: redirection_clause
    name: "Переадресовка груза в пути"
    description: >
      Проверяет наличие условий переадресовки груза: кто вправе
      изменить пункт назначения или грузополучателя и кто несёт
      дополнительные расходы.
      Специфический check для транспортных договоров: переадресовка
      (ст. 787 ГК РФ для железнодорожных перевозок, ст. 17 УАТ для
      автомобильных перевозок).
    triggers:
      any: ["redirection_in_transit"]
    ui_mode: "field_extraction"
    severity: "medium"
    severity_if_pass: "pass"
    severity_if_fail: "medium"
    severity_if_unclear: "low"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "переадресовка"
        - "изменение пункта назначения"
        - "изменение грузополучателя"
        - "распоряжение грузом"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)переадресовк"
        - "(?i)изменени(е|я)\\s+пункт"
        - "(?i)распоряжени(е|я)\\s+грузом"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по транспортным договорам.
        Анализируется договор перевозки груза.
        Проверяется ТОЛЬКО условие о переадресовке груза в пути.

        Нормативный ориентир:
        - ст. 787 ГК РФ (железнодорожные перевозки)
        - ст. 17 УАТ (автомобильные перевозки)
        - специальные транспортные режимы

        [ЗАДАЧА]
        Установи:
        1. Есть ли условие о переадресовке.
        2. Кто вправе инициировать переадресовку.
        3. Кто оплачивает дополнительные расходы.
        4. Есть ли отдельная процедура или ограничения.
        5. Установлен ли срок для направления требования о переадресовке.
        6. Приведи точную цитату из договора.
        7. Сформируй user-friendly значения для отображения в DD Grid.

        [ПРАВИЛА]
        1. Используй только текст договора.
        2. Не подменяй изменение маршрута общим правом давать указания, если переадресовка прямо не описана.
        3. Если вопрос расходов не урегулирован — cost_allocation = "not_defined".
        4. Если переадресовка не упомянута — redirection_clause_present = "not_defined".
        5. Не используй "None", "null" или пустые строки — используй "not_defined".
        6. В redirection_snippet включай только цитату из договора.
        7. Для *_display полей используй понятные русские формулировки:
          - redirection_clause_present: yes → "Предусмотрена", no → "Не предусмотрена", not_defined → "Не указано"
          - who_can_redirect: shipper → "Грузоотправитель", consignee → "Грузополучатель", either → "Любая сторона", not_defined → "Не указано"
          - cost_allocation: shipper → "Грузоотправитель", carrier → "Перевозчик", not_defined → "Не указано"
          - procedural_limitations: yes → "Есть", no → "Нет", not_defined → "Не указано"
          - redirection_deadline: specified → "Установлен", not_defined → "Не установлен"
        8. Верни РОВНО один JSON-объект со всеми 11 ключами без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — переадресовка предусмотрена с процедурой и сроками:
        Фрагмент:
        "Грузоотправитель вправе дать распоряжение о переадресовке груза до момента прибытия груза в пункт назначения. Переадресовка оформляется письменным распоряжением Грузоотправителя не позднее чем за 24 часа до предполагаемого прибытия груза. Дополнительные расходы, связанные с переадресовкой, несёт Грузоотправитель."

        Ответ:
        {
          "redirection_clause_present": "yes",
          "who_can_redirect": "shipper",
          "cost_allocation": "shipper",
          "procedural_limitations": "yes",
          "redirection_deadline": "specified",
          "redirection_snippet": "Грузоотправитель вправе дать распоряжение о переадресовке груза до момента прибытия груза в пункт назначения. Переадресовка оформляется письменным распоряжением Грузоотправителя не позднее чем за 24 часа до предполагаемого прибытия груза. Дополнительные расходы, связанные с переадресовкой, несёт Грузоотправитель.",
          "redirection_clause_present_display": "Предусмотрена",
          "who_can_redirect_display": "Грузоотправитель",
          "cost_allocation_display": "Грузоотправитель",
          "procedural_limitations_display": "Есть",
          "redirection_deadline_display": "Установлен"
        }

        Пример 2 — условия не упомянуты:
        Фрагмент:
        "Перевозчик обязуется доставить груз в пункт назначения в установленный срок."

        Ответ:
        {
          "redirection_clause_present": "not_defined",
          "who_can_redirect": "not_defined",
          "cost_allocation": "not_defined",
          "procedural_limitations": "not_defined",
          "redirection_deadline": "not_defined",
          "redirection_snippet": "not_defined",
          "redirection_clause_present_display": "Не указано",
          "who_can_redirect_display": "Не указано",
          "cost_allocation_display": "Не указано",
          "procedural_limitations_display": "Не указано",
          "redirection_deadline_display": "Не установлен"
        }

        Пример 3 — текст есть, но вывод невозможен (размытая формулировка без конкретики):
        Фрагмент:
        "Грузоотправитель вправе давать указания перевозчику в отношении груза в соответствии с законодательством."

        Ответ:
        {
          "redirection_clause_present": "not_defined",
          "who_can_redirect": "not_defined",
          "cost_allocation": "not_defined",
          "procedural_limitations": "not_defined",
          "redirection_deadline": "not_defined",
          "redirection_snippet": "Грузоотправитель вправе давать указания перевозчику в отношении груза в соответствии с законодательством.",
          "redirection_clause_present_display": "Не указано",
          "who_can_redirect_display": "Не указано",
          "cost_allocation_display": "Не указано",
          "procedural_limitations_display": "Не указано",
          "redirection_deadline_display": "Не установлен"
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        Перед ответом внутренне проверь:
        1. Есть ли прямая цитата о переадресовке груза (не просто "указания в отношении груза").
        2. Не путаешь ли ты переадресовку с изменением маршрута по инициативе перевозчика.
        3. Конкретизирована ли сторона, которая вправе инициировать переадресовку.
        4. Если прямого указания нет — верни "not_defined".
        5. Все 11 ключей присутствуют в JSON.

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь РОВНО одним JSON-объектом без какого-либо дополнительного текста до или после, со всеми 11 ключами:
        {
          "redirection_clause_present": "<yes / no / not_defined>",
          "who_can_redirect": "<shipper / consignee / either / not_defined>",
          "cost_allocation": "<shipper / carrier / not_defined>",
          "procedural_limitations": "<yes / no / not_defined>",
          "redirection_deadline": "<specified / not_defined>",
          "redirection_snippet": "<точная цитата или not_defined>",
          "redirection_clause_present_display": "<Предусмотрена / Не предусмотрена / Не указано>",
          "who_can_redirect_display": "<Грузоотправитель / Грузополучатель / Любая сторона / Не указано>",
          "cost_allocation_display": "<Грузоотправитель / Перевозчик / Не указано>",
          "procedural_limitations_display": "<Есть / Нет / Не указано>",
          "redirection_deadline_display": "<Установлен / Не установлен>"
        }
      context_k: 4
      temperature: 0.0
      max_tokens: 550
    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "переадресовка изменение пункта назначения изменение грузополучателя дополнительные расходы распоряжение грузом переадресовка груза в пути"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - procedures
        - obligations
      negative_keywords:
        - "провозная плата"
        - "претензия"
        - "неустойка"
        - "форс-мажор"
      position_bias:
        preferred_range: [0.0, 0.90]
        boost: 0.10
        scope: auto
      retrieval_profile: "scope_of_work_check"
      context_k: 4
      max_chunks: 5
      rerank: true
    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
        - "invoice"
      preferred_clause_functions:
        - "procedures"
        - "obligations"
      confidence_bonus_on_match: 0.05
      confidence_penalty_on_excluded_segment: 0.10
    evidence:
      required: true
      min_snippet_length: 15
      max_snippet_length: 300
    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1100

      compact_output: false

      presence_signal:
        field: "redirection_clause_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист по транспортным договорам.
        Извлеки только условия переадресовки груза в пути.
        Не анализируй цену, сроки доставки, ответственность, претензии и иные разделы.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. redirection_clause_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если redirection_clause_present ∈ {"yes", "no"};
           - "missing" — если redirection_clause_present = "not_defined"
             и фрагментов о переадресовке груза в контексте нет;
           - "unclear" — если фрагменты по теме есть, но из-за противоречий вывод невозможен.

           Если presence = "missing":
           - redirection_clause_present = "not_defined";
           - who_can_redirect = "not_defined";
           - cost_allocation = "not_defined";
           - procedural_limitations = "not_defined";
           - redirection_deadline = "not_defined";
           - redirection_snippet = "not_defined";
           - все *_display = соответствующий fallback;
           - не выполняй остальные шаги.

        1. redirection_clause_present:
           - "yes" — если возможность переадресовки груза в пути (изменения пункта назначения/получателя) прямо предусмотрена в договоре;
           - "no" — если переадресовка груза в пути прямо запрещена договором;
           - "not_defined" — если условия переадресовки прямо не упомянуты.

        2. who_can_redirect:
           - "shipper" — грузоотправитель;
           - "consignee" — грузополучатель;
           - "either" — любая из сторон договора;
           - "not_defined" — управомоченное лицо не указано.

        3. cost_allocation:
           - "shipper" — грузоотправитель;
           - "carrier" — перевозчик;
           - "not_defined" — сторона, несущая дополнительные расходы, прямо не указана.

        4. procedural_limitations:
           - "yes" — если установлены процедурные требования или ограничения (например, письменное уведомление, регламент согласования);
           - "no" — если переадресовка происходит без специальных процедурных формальностей;
           - "not_defined" — если вопрос ограничений не урегулирован.

        5. redirection_deadline:
           - "specified" — если установлен конкретный предельный срок направления требования о переадресовке (например, "за 24 часа до прибытия ТС");
           - "not_defined" — если срок прямо не урегулирован.

        6. redirection_snippet:
           Точная цитата из договора об условиях переадресовки груза. Если нет — "not_defined".

        7. redirection_clause_present_display:
           "Предусмотрена" / "Не предусмотрена" / "Не указано".

        8. who_can_redirect_display:
           "Грузоотправитель" / "Грузополучатель" / "Любая сторона" / "Не указано".

        9. cost_allocation_display:
           "Грузоотправитель" / "Перевозчик" / "Не указано".

        10. procedural_limitations_display:
            "Есть" / "Нет" / "Не указано".

        11. redirection_deadline_display:
            "Установлен" / "Не установлен".
        </task>

        <context_rules>
        - Перед остальными полями заполни redirection_clause_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все поля = "not_defined" / соответствующий fallback.
        - Не подменяй переадресовку груза в пути общим правом сторон давать указания, если само право на изменение пункта назначения прямо не названо.
        - Прямой запрет переадресовки (redirection_clause_present = "no") — это presence = "present", а не "missing".
        - Не используй "None", "null" или пустые строки.
        - Все 11 ключей должны присутствовать в JSON-ответе.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В договоре перевозки вообще нет упоминаний переадресовки или права на изменение адреса погрузки/выгрузки в пути.
           → presence = "missing";
             redirection_clause_present = "not_defined";
             who_can_redirect = "not_defined".

        2. Право предусмотрено, но расходы опущены.
           "Грузоотправитель имеет право в любой момент изменить адрес выгрузки груза." (про деньги ни слова).
           → presence = "present";
             redirection_clause_present = "yes";
             who_can_redirect = "shipper";
             cost_allocation = "not_defined".

        3. Противоречие между фрагментами.
           В преамбуле указано право грузоотправителя на переадресовку в пути, а в теле договора — запрет на любое изменение маршрута.
           → presence = "unclear";
             redirection_clause_present = "not_defined";
             redirection_clause_present_display = "Не указано".

        4. Общие инструкции в отношении груза ≠ переадресовка.
           "Грузоотправитель вправе давать Перевозчику указания по обеспечению сохранности груза."
           → presence = "missing";
             redirection_clause_present = "not_defined" (сохранность не является переадресовкой).
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для redirection_clause_presence используй только: "present", "missing", "unclear".
        - Для redirection_clause_present, procedural_limitations используй только: "yes", "no", "not_defined".
        - Для who_can_redirect используй только: "shipper", "consignee", "either", "not_defined".
        - Для cost_allocation используй только: "shipper", "carrier", "not_defined".
        - Для redirection_deadline используй только: "specified", "not_defined".
        - Fallback при отсутствии данных:
          * redirection_snippet → "not_defined";
          * все *_display → соответствующие fallback-строки.
        - Fallback при противоречии или неоднозначности:
          * все *_display → соответствующие fallback-строки.
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "redirection_clause_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие условий о переадресовке груза. Внутреннее агрегатное signal-поле."
          required: true

        - name: "redirection_clause_present"
          type: "string"
