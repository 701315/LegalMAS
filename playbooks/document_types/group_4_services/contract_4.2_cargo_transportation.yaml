          required: true
  
  - id: auto_renewal
    name: "Автопролонгация рамочного договора перевозки"
    description: >
      Проверяет специфику автоматического продления рамочного договора
      перевозки: период продления, механизм отказа от продления и срок
      предварительного уведомления.
      Общий срок договора и базовая пролонгация проверяются отдельным
      global check-ом (term_and_renewal) и не дублируются здесь.
      Данный check добавляет транспортную специфику: условия продления
      именно рамочного договора перевозки (договора на организацию перевозок).
    triggers:
      any: ["framework_agreement"]
    ui_mode: "field_extraction"
    severity: "low"
    severity_if_pass: "pass"
    severity_if_fail: "low"
    severity_if_unclear: "low"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "автопролонгация"
        - "автоматическое продление"
        - "продлевается на тот же срок"
        - "пролонгация"
        - "договор на организацию перевозок"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)автоматическ(и|ое)\\s+продлева"
        - "(?i)продлевается.*на.*тот\\s+же\\s+срок"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по рамочным транспортным договорам.
        Анализируется рамочный договор перевозки груза (договор на организацию перевозок).
        Проверяется ТОЛЬКО специфика автоматического продления рамочного договора перевозки.

        Общий срок договора и базовая пролонгация НЕ проверяются в этом check-е —
        они покрыты отдельной проверкой (term_and_renewal).

        [ЗАДАЧА]
        Установи:
        1. Есть ли автопролонгация именно рамочного договора перевозки.
        2. На какой срок продлевается договор.
        3. Нужны ли действия стороны для отказа от продления.
        4. Есть ли срок предварительного уведомления об отказе.
        5. Приведи точную цитату из договора.
        6. Сформируй user-friendly значения для отображения в DD Grid.

        [ПРАВИЛА]
        1. Используй только текст договора.
        2. Не подменяй автопролонгацию общим продлением по соглашению сторон.
        3. Если договор просто может быть продлён, но автоматизма нет — auto_renewal_present = "no".
        4. Если срок продления не назван — renewal_period = "not_defined".
        5. Не используй "None", "null" или пустые строки — используй "not_defined".
        6. В auto_renewal_snippet включай только цитату из договора.
        7. Для *_display полей используй понятные русские формулировки:
          - auto_renewal_present: yes → "Предусмотрена", no → "Не предусмотрена", not_defined → "Не указано"
          - termination_notice_required: yes → "Требуется", no → "Не требуется", not_defined → "Не указано"
        8. Верни РОВНО один JSON-объект со всеми 7 ключами без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — автопролонгация с уведомлением:
        Фрагмент:
        "Настоящий договор автоматически продлевается на каждый следующий календарный год на тех же условиях, если ни одна из Сторон не заявит о своём намерении прекратить договор, направив другой Стороне письменное уведомление не позднее чем за 30 (тридцать) календарных дней до окончания текущего срока действия договора."

        Ответ:
        {
          "auto_renewal_present": "yes",
          "renewal_period": "на каждый следующий календарный год",
          "termination_notice_required": "yes",
          "notice_period": "не позднее чем за 30 календарных дней до окончания текущего срока",
          "auto_renewal_snippet": "Настоящий договор автоматически продлевается на каждый следующий календарный год на тех же условиях, если ни одна из Сторон не заявит о своём намерении прекратить договор, направив другой Стороне письменное уведомление не позднее чем за 30 (тридцать) календарных дней до окончания текущего срока действия договора.",
          "auto_renewal_present_display": "Предусмотрена",
          "termination_notice_required_display": "Требуется"
        }

        Пример 2 — автопролонгация не упомянута:
        Фрагмент:
        "Договор заключён на срок с 01.01.2026 по 31.12.2026."

        Ответ:
        {
          "auto_renewal_present": "not_defined",
          "renewal_period": "not_defined",
          "termination_notice_required": "not_defined",
          "notice_period": "not_defined",
          "auto_renewal_snippet": "not_defined",
          "auto_renewal_present_display": "Не указано",
          "termination_notice_required_display": "Не указано"
        }

        Пример 3 — текст есть, но вывод невозможен (размытая формулировка без конкретики):
        Фрагмент:
        "Стороны могут продлевать срок действия договора по взаимному согласию."

        Ответ:
        {
          "auto_renewal_present": "no",
          "renewal_period": "not_defined",
          "termination_notice_required": "not_defined",
          "notice_period": "not_defined",
          "auto_renewal_snippet": "Стороны могут продлевать срок действия договора по взаимному согласию.",
          "auto_renewal_present_display": "Не предусмотрена",
          "termination_notice_required_display": "Не указано"
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        Перед ответом внутренне проверь:
        1. Есть ли прямая цитата об автоматическом продлении договора.
        2. Не подменил ли ты автопролонгацию продлением по соглашению сторон.
        3. Соответствуют ли значения допустимым словарям.
        4. Если прямого указания нет — верни "not_defined".
        5. Все 7 ключей присутствуют в JSON.

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь РОВНО одним JSON-объектом без какого-либо дополнительного текста до или после, со всеми 7 ключами:
        {
          "auto_renewal_present": "<yes / no / not_defined>",
          "renewal_period": "<текст или not_defined>",
          "termination_notice_required": "<yes / no / not_defined>",
          "notice_period": "<текст или not_defined>",
          "auto_renewal_snippet": "<точная цитата или not_defined>",
          "auto_renewal_present_display": "<Предусмотрена / Не предусмотрена / Не указано>",
          "termination_notice_required_display": "<Требуется / Не требуется / Не указано>"
        }
      context_k: 4
      temperature: 0.0
      max_tokens: 600
    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "автопролонгация автоматическое продление пролонгация продлевается на тот же срок договор на организацию перевозок продление рамочного договора"
      preferred_unit_types:
        - general_provision
        - obligation
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - boilerplate
        - procedures
      negative_keywords:
        - "провозная плата"
        - "претензия"
        - "неустойка"
        - "форс-мажор"
      position_bias:
        preferred_range: [0.5, 1.0]
        boost: 0.15
        scope: auto
      retrieval_profile: "term_and_renewal_check"
      context_k: 4
      max_chunks: 5
      rerank: true
    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
        - "invoice"
      preferred_clause_functions:
        - "boilerplate"
        - "procedures"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10
    evidence:
      required: true
      min_snippet_length: 15
      max_snippet_length: 300
    extraction:
      store_payload: true

      enabled: true
      mode: "hybrid"
      llm_max_tokens: 650
      compact_output: false
      llm_prompt_extraction: |
        <role>
        Ты — российский юрист по рамочным транспортным договорам.
        Извлеки условие об автоматическом продлении рамочного договора перевозки.
        Не анализируй общий срок договора, цену, ответственность, претензии и иные разделы.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни:
        - auto_renewal_present: yes / no / not_defined
        - renewal_period: срок продления или "not_defined"
        - termination_notice_required: yes / no / not_defined
        - notice_period: срок уведомления или "not_defined"
        - auto_renewal_snippet: точная цитата из договора или "not_defined"
        - auto_renewal_present_display: "Предусмотрена" / "Не предусмотрена" / "Не указано"
        - termination_notice_required_display: "Требуется" / "Не требуется" / "Не указано"

        Верни РОВНО один JSON-объект со всеми 7 ключами без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.
        </task>

        <rules>
        - Используй только текст документа.
        - Не подменяй автопролонгацию общим продлением по соглашению сторон.
        - Если договор просто может быть продлён, но автоматизма нет — auto_renewal_present = "no".
        - Если срок продления не назван — renewal_period = "not_defined".
        - Для *_display полей используй маппинг:
          * auto_renewal_present: yes → "Предусмотрена", no → "Не предусмотрена", not_defined → "Не указано"
          * termination_notice_required: yes → "Требуется", no → "Не требуется", not_defined → "Не указано"
        - Не используй "None", "null" или пустые строки.
        - Все 7 ключей должны присутствовать в JSON-ответе.
        </rules>
      fields:
        - name: "auto_renewal_present"
          type: "string"
          presentation: "signal"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Автопролонгация предусмотрена"
          required: true
          display_in_grid: false
        - name: "renewal_period"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 2
          label: "Период продления"
          description: "Период, на который автоматически продлевается договор"
          required: true
        - name: "termination_notice_required"
          type: "string"
          presentation: "signal"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Нужно уведомление для отказа от продления"
          required: true
          display_in_grid: false
        - name: "notice_period"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 3
          label: "Срок уведомления"
          description: "Срок предварительного уведомления об отказе от продления"
          required: true
        - name: "auto_renewal_snippet"
          type: "string"
          presentation: "diagnostic"
          display_in_grid: false
          description: "Цитата об автопролонгации"
          required: true
        - name: "auto_renewal_present_display"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 1
          label: "Автопролонгация"
          description: "User-friendly отображение: предусмотрена ли автопролонгация рамочного договора"
          required: true
        - name: "termination_notice_required_display"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 4
          label: "Уведомление об отказе"
          description: "User-friendly отображение: требуется ли уведомление для отказа от продления"
          required: true
  
  - id: carrier_license_check
    name: "Лицензия / разрешение перевозчика"
    description: >
      Проверяет наличие в договоре ссылки на лицензию, разрешение, допуск
      либо иной регуляторный титул перевозчика на осуществление перевозок:
      лицензия на перевозки, разрешение на негабаритные/тяжеловесные перевозки,
      свидетельство о допуске к международным перевозкам, сертификат эксплуатанта,
      ДОПОГ-свидетельство и т.п.
      Общие лицензии и разрешения проверяются отдельным global check-ом
      (regulatory_licenses_and_permits) и не дублируются здесь.
      ДОПОГ-документы для опасных грузов частично пересекаются с check-ом
      special_cargo_conditions; данный check фокусируется на регуляторном
      титуле перевозчика, а не на документах к конкретной перевозке.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "лицензия"
        - "разрешение на перевозку"
        - "допуск к перевозкам"
        - "свидетельство"
        - "номер лицензии"
        - "свидетельство о допуске"
        - "карточка допуска"
        - "сертификат эксплуатанта"
        - "ДОПОГ"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)лицензи(я|и|ю)\\s+№"
        - "(?i)разрешени(е|я|ем)\\s+(на|№)"
        - "(?i)свидетельств(о|а)\\s+о\\s+допуск"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по транспортным договорам.
        Анализируется договор перевозки груза.
        Проверяется ТОЛЬКО наличие в договоре упоминания регуляторного титула
        перевозчика: лицензии, разрешения, допуска, свидетельства на осуществление
        перевозок.

        Общие лицензии и разрешения НЕ проверяются в этом check-е — они покрыты
        отдельной проверкой (regulatory_licenses_and_permits).

        [ЗАДАЧА]
        Установи:
        1. Упоминается ли лицензия, разрешение или аналогичный регуляторный документ.
        2. Какой тип документа указан (транспортная лицензия, разрешение, свидетельство, ДОПОГ и т.п.).
        3. Указан ли номер документа.
        4. Есть ли ссылка на обязанность поддерживать лицензию/разрешение в силе.
        5. Приведи точную цитату из договора.
        6. Сформируй user-friendly значения для отображения в DD Grid.

        [ПРАВИЛА]
        1. Используй только текст договора.
        2. Не подставляй обязательность лицензии из закона.
        3. Если указан только общий статус "перевозчик имеет право осуществлять перевозки", без конкретного документа — license_mentioned = "no", license_type = "not_defined".
        4. Если тип документа неясен — используй "other" или "not_defined".
        5. Не используй "None", "null" или пустые строки — используй "not_defined".
        6. В carrier_license_snippet включай только цитату из договора.
        7. Для *_display полей используй понятные русские формулировки:
          - license_mentioned: yes → "Упомянута", no → "Не упомянута", not_defined → "Не указано"
          - license_type:
            * transport_license → "Лицензия на перевозки"
            * permit → "Разрешение на перевозку"
            * certificate → "Свидетельство/допуск"
            * dopog → "ДОПОГ-свидетельство"
            * other → "Иной документ"
            * not_defined → "Не определён"
          - maintenance_obligation: yes → "Обязан поддерживать", no → "Не обязана", not_defined → "Не указано"
        8. Верни РОВНО один JSON-объект со всеми 9 ключами без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — лицензия с номером и обязанностью поддерживать:
        Фрагмент:
        "Перевозчик гарантирует наличие действующей лицензии на осуществление деятельности по перевозке пассажиров и грузов автомобильным транспортом № ЛП-0012345 от 15.03.2024, выданной Управлением транспорта. Перевозчик обязуется поддерживать лицензию в силе в течение всего срока действия договора."

        Ответ:
        {
          "license_mentioned": "yes",
          "license_type": "transport_license",
          "license_number": "ЛП-0012345 от 15.03.2024",
          "maintenance_obligation": "yes",
          "carrier_license_snippet": "Перевозчик гарантирует наличие действующей лицензии на осуществление деятельности по перевозке пассажиров и грузов автомобильным транспортом № ЛП-0012345 от 15.03.2024, выданной Управлением транспорта. Перевозчик обязуется поддерживать лицензию в силе в течение всего срока действия договора.",
          "license_mentioned_display": "Упомянута",
          "license_type_display": "Лицензия на перевозки",
          "maintenance_obligation_display": "Обязан поддерживать"
        }

        Пример 2 — лицензия не упомянута:
        Фрагмент:
        "Перевозчик обязуется доставить груз в пункт назначения в установленный срок."

        Ответ:
        {
          "license_mentioned": "not_defined",
          "license_type": "not_defined",
          "license_number": "not_defined",
          "maintenance_obligation": "not_defined",
          "carrier_license_snippet": "not_defined",
          "license_mentioned_display": "Не указано",
          "license_type_display": "Не определён",
          "maintenance_obligation_display": "Не указано"
        }

