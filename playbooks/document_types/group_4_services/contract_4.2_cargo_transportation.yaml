        - Если сказано только, что груз должен быть упакован, но без деталей — packaging_requirements_present = "yes".
        - Для *_display полей используй маппинг:
          * packaging_requirements_present: yes → "Предусмотрены", no → "Не предусмотрены", not_defined → "Не указано"
          * marking_requirements_present: yes → "Предусмотрены", no → "Не предусмотрены", not_defined → "Не указано"
          * sealing_mentioned: yes → "Предусмотрено", no → "Не предусмотрено", not_defined → "Не указано"
          * responsible_party: shipper → "Грузоотправитель", carrier → "Перевозчик", not_defined → "Не указана"
        - Не используй "None", "null" или пустые строки.
        - Все 9 ключей должны присутствовать в JSON-ответе.
        </rules>
      fields:
        - name: "packaging_requirements_present"
          type: "string"
          presentation: "signal"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Требования к упаковке есть"
          required: true
          display_in_grid: false
        - name: "marking_requirements_present"
          type: "string"
          presentation: "signal"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Требования к маркировке есть"
          required: true
          display_in_grid: false
        - name: "sealing_mentioned"
          type: "string"
          presentation: "signal"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Пломбирование упоминается"
          required: true
          display_in_grid: false
        - name: "responsible_party"
          type: "string"
          presentation: "signal"
          allowed_values: ["shipper", "carrier", "not_defined"]
          description: "Ответственная сторона"
          required: true
          display_in_grid: false
        - name: "packaging_marking_snippet"
          type: "string"
          presentation: "diagnostic"
          display_in_grid: false
          description: "Цитата о требованиях к упаковке/маркировке/пломбированию"
          required: true
        - name: "packaging_requirements_present_display"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 1
          label: "Требования к упаковке"
          description: "User-friendly отображение: предусмотрены ли требования к упаковке"
          required: true
        - name: "marking_requirements_present_display"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 2
          label: "Требования к маркировке"
          description: "User-friendly отображение: предусмотрены ли требования к маркировке"
          required: true
        - name: "sealing_mentioned_display"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 3
          label: "Пломбирование"
          description: "User-friendly отображение: предусмотрено ли пломбирование"
          required: true
        - name: "responsible_party_display"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 4
          label: "Ответственная сторона"
          description: "User-friendly отображение стороны, ответственной за соблюдение требований"
          required: true
  
  - id: gps_tracking
    name: "GPS/ГЛОНАСС-мониторинг и отслеживание груза"
    description: >
      Проверяет наличие условий о GPS/ГЛОНАСС-мониторинге транспорта,
      доступе грузоотправителя/клиента к данным отслеживания и обязательности
      такого контроля. Специфический технологический check для современных
      транспортных договоров с требованиями прозрачности перевозки.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "low"
    severity_if_pass: "pass"
    severity_if_fail: "low"
    severity_if_unclear: "low"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "GPS"
        - "ГЛОНАСС"
        - "мониторинг"
        - "отслеживание"
        - "трекинг"
        - "местоположение груза"
        - "система мониторинга транспорта"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)\\bGPS\\b|\\bГЛОНАСС\\b"
        - "(?i)отслежива(ние|ть)\\s+груз"
        - "(?i)мониторинг\\s+(транспорт|груз)"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по транспортным договорам.
        Анализируется договор перевозки груза.
        Проверяются ТОЛЬКО условия GPS/ГЛОНАСС-мониторинга транспорта
        и отслеживания груза.

        [ЗАДАЧА]
        Установи:
        1. Есть ли требование GPS/ГЛОНАСС-мониторинга.
        2. Какая система упоминается (GPS, ГЛОНАСС, комбинированная или иная).
        3. Есть ли право доступа к данным мониторинга у грузоотправителя/клиента.
        4. Приведи точную цитату из договора.
        5. Сформируй user-friendly значения для отображения в DD Grid.

        [ПРАВИЛА]
        1. Используй только текст договора.
        2. Не подменяй общую фразу о контроле транспорта наличием GPS.
        3. Если технология отслеживания не конкретизирована — monitoring_system = "not_defined".
        4. Если мониторинг не упомянут — gps_monitoring_present = "not_defined".
        5. Не используй "None", "null" или пустые строки — используй "not_defined".
        6. В gps_tracking_snippet включай только цитату из договора.
        7. Для *_display полей используй понятные русские формулировки:
          - gps_monitoring_present: yes → "Предусмотрен", no → "Не предусмотрен", not_defined → "Не указано"
          - monitoring_system:
            * GPS → "GPS"
            * GLONASS → "ГЛОНАСС"
            * combined → "GPS/ГЛОНАСС"
            * other → "Иная система"
            * not_defined → "Не указана"
          - access_for_shipper: yes → "Есть", no → "Нет", not_defined → "Не указано"
        8. Верни РОВНО один JSON-объект со всеми 8 ключами без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — мониторинг предусмотрен с доступом для грузоотправителя:
        Фрагмент:
        "Перевозчик обязан обеспечить оснащение транспортных средств системой ГЛОНАСС/GPS-мониторинга. Грузоотправитель имеет право доступа к данным мониторинга местоположения груза в режиме реального времени через личный кабинет на сайте Перевозчика."

        Ответ:
        {
          "gps_monitoring_present": "yes",
          "monitoring_system": "combined",
          "access_for_shipper": "yes",
          "gps_tracking_snippet": "Перевозчик обязан обеспечить оснащение транспортных средств системой ГЛОНАСС/GPS-мониторинга. Грузоотправитель имеет право доступа к данным мониторинга местоположения груза в режиме реального времени через личный кабинет на сайте Перевозчика.",
          "gps_monitoring_present_display": "Предусмотрен",
          "monitoring_system_display": "GPS/ГЛОНАСС",
          "access_for_shipper_display": "Есть"
        }

        Пример 2 — мониторинг не упомянут:
        Фрагмент:
        "Перевозчик обязуется доставить груз в пункт назначения в установленный срок."

        Ответ:
        {
          "gps_monitoring_present": "not_defined",
          "monitoring_system": "not_defined",
          "access_for_shipper": "not_defined",
          "gps_tracking_snippet": "not_defined",
          "gps_monitoring_present_display": "Не указано",
          "monitoring_system_display": "Не указана",
          "access_for_shipper_display": "Не указано"
        }

        Пример 3 — текст есть, но вывод невозможен (размытая формулировка без конкретики):
        Фрагмент:
        "Перевозчик обеспечивает контроль движения транспортного средства в соответствии с требованиями законодательства."

        Ответ:
        {
          "gps_monitoring_present": "not_defined",
          "monitoring_system": "not_defined",
          "access_for_shipper": "not_defined",
          "gps_tracking_snippet": "Перевозчик обеспечивает контроль движения транспортного средства в соответствии с требованиями законодательства.",
          "gps_monitoring_present_display": "Не указано",
          "monitoring_system_display": "Не указана",
          "access_for_shipper_display": "Не указано"
        }

        Пример 4 — мониторинг предусмотрен, но без доступа для грузоотправителя:
        Фрагмент:
        "Все транспортные средства Перевозчика оснащены системой GPS-мониторинга. Информация о местоположении груза предоставляется Грузоотправителю по его письменному запросу не чаще одного раза в сутки."

        Ответ:
        {
          "gps_monitoring_present": "yes",
          "monitoring_system": "GPS",
          "access_for_shipper": "yes",
          "gps_tracking_snippet": "Все транспортные средства Перевозчика оснащены системой GPS-мониторинга. Информация о местоположении груза предоставляется Грузоотправителю по его письменному запросу не чаще одного раза в сутки.",
          "gps_monitoring_present_display": "Предусмотрен",
          "monitoring_system_display": "GPS",
          "access_for_shipper_display": "Есть"
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        Перед ответом внутренне проверь:
        1. Есть ли прямая цитата о GPS/ГЛОНАСС-мониторинге (не просто "контроль транспорта").
        2. Конкретизирована ли система мониторинга.
        3. Есть ли прямое указание на доступ грузоотправителя к данным.
        4. Если прямого указания нет — верни "not_defined".
        5. Все 8 ключей присутствуют в JSON.

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь РОВНО одним JSON-объектом без какого-либо дополнительного текста до или после, со всеми 8 ключами:
        {
          "gps_monitoring_present": "<yes / no / not_defined>",
          "monitoring_system": "<GPS / GLONASS / combined / other / not_defined>",
          "access_for_shipper": "<yes / no / not_defined>",
          "gps_tracking_snippet": "<точная цитата или not_defined>",
          "gps_monitoring_present_display": "<Предусмотрен / Не предусмотрен / Не указано>",
          "monitoring_system_display": "<GPS / ГЛОНАСС / GPS/ГЛОНАСС / Иная система / Не указана>",
          "access_for_shipper_display": "<Есть / Нет / Не указано>"
        }
      context_k: 4
      temperature: 0.0
      max_tokens: 500
    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "GPS ГЛОНАСС мониторинг отслеживание трекинг местоположение груза система мониторинга транспорта личный кабинет"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - procedures
      negative_keywords:
        - "провозная плата"
        - "претензия"
        - "неустойка"
        - "форс-мажор"
      position_bias:
        preferred_range: [0.0, 0.90]
        boost: 0.10
        scope: auto
      retrieval_profile: "technical_documentation_check"
      context_k: 4
      max_chunks: 5
      rerank: true
    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
        - "invoice"
      preferred_clause_functions:
        - "obligations"
      confidence_bonus_on_match: 0.05
      confidence_penalty_on_excluded_segment: 0.10
    evidence:
      required: true
      min_snippet_length: 15
      max_snippet_length: 300
    extraction:
      store_payload: true

      enabled: true
      mode: "hybrid"
      llm_max_tokens: 600
      compact_output: false
      llm_prompt_extraction: |
        <role>
        Ты — российский юрист по транспортным договорам.
        Извлеки только условия GPS/ГЛОНАСС-мониторинга транспорта и отслеживания груза.
        Не анализируй цену, сроки доставки, ответственность, претензии и иные разделы.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни:
        - gps_monitoring_present: yes / no / not_defined
        - monitoring_system: GPS / GLONASS / combined / other / not_defined
        - access_for_shipper: yes / no / not_defined
        - gps_tracking_snippet: точная цитата из договора или "not_defined"
        - gps_monitoring_present_display: "Предусмотрен" / "Не предусмотрен" / "Не указано"
        - monitoring_system_display: "GPS" / "ГЛОНАСС" / "GPS/ГЛОНАСС" / "Иная система" / "Не указана"
        - access_for_shipper_display: "Есть" / "Нет" / "Не указано"

        Верни РОВНО один JSON-объект со всеми 8 ключами без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.
        </task>

        <rules>
        - Используй только текст документа.
        - Не подменяй общую фразу о контроле транспорта наличием GPS.
        - Если технология отслеживания не конкретизирована — monitoring_system = "not_defined".
        - Если мониторинг не упомянут — gps_monitoring_present = "not_defined".
        - Если в договоре упоминаются обе системы (GPS и ГЛОНАСС) — monitoring_system = "combined".
        - Для *_display полей используй маппинг:
          * gps_monitoring_present: yes → "Предусмотрен", no → "Не предусмотрен", not_defined → "Не указано"
          * monitoring_system: GPS → "GPS", GLONASS → "ГЛОНАСС", combined → "GPS/ГЛОНАСС", other → "Иная система", not_defined → "Не указана"
          * access_for_shipper: yes → "Есть", no → "Нет", not_defined → "Не указано"
        - Не используй "None", "null" или пустые строки.
        - Все 8 ключей должны присутствовать в JSON-ответе.
        </rules>
      fields:
        - name: "gps_monitoring_present"
          type: "string"
          presentation: "signal"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Мониторинг предусмотрен"
          required: true
          display_in_grid: false
        - name: "monitoring_system"
          type: "string"
          presentation: "signal"
          allowed_values: ["GPS", "GLONASS", "combined", "other", "not_defined"]
          description: "Система мониторинга"
          required: true
          display_in_grid: false
        - name: "access_for_shipper"
          type: "string"
          presentation: "signal"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Доступ к данным есть"
          required: true
          display_in_grid: false
        - name: "gps_tracking_snippet"
          type: "string"
          presentation: "diagnostic"
          display_in_grid: false
          description: "Цитата об условиях GPS/ГЛОНАСС-мониторинга"
          required: true
        - name: "gps_monitoring_present_display"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 1
          label: "GPS/ГЛОНАСС-мониторинг"
          description: "User-friendly отображение: предусмотрен ли мониторинг транспорта"
          required: true
        - name: "monitoring_system_display"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 2
          label: "Система мониторинга"
          description: "User-friendly отображение конкретной системы мониторинга"
          required: true
        - name: "access_for_shipper_display"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 3
          label: "Доступ грузоотправителя"
          description: "User-friendly отображение: есть ли у грузоотправителя доступ к данным мониторинга"
          required: true
  
  - id: shipper_data_accuracy
    name: "Достоверность сведений о грузе: ответственность грузоотправителя"
    description: >
      Проверяет наличие заверений о достоверности сведений о грузе,
      а также распределение ответственности за ложные или неполные данные.
      Базовые заверения и общая ответственность за недостоверные данные
      частично проверяются в check-е shipper_obligations_and_warranties_check;
      данный check добавляет детализацию: кто именно несёт ответственность
      (грузоотправитель/перевозчик) и какие виды данных охватываются
      (вес, свойства, документы, смешанный охват).
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "достоверность сведений"
        - "грузоотправитель несёт ответственность"
        - "недостоверные данные"
        - "сведения о грузе"
        - "вес груза"
        - "свойства груза"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)достоверност.*сведени"
        - "(?i)грузоотправител.*ответственност"
        - "(?i)ответственност.*за.*недостоверн"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по транспортным договорам.
        Анализируется договор перевозки груза.
        Проверяется ТОЛЬКО вопрос достоверности сведений о грузе
        и ответственности за неверные данные.

        Базовые заверения и общая ответственность за недостоверные данные
        НЕ проверяются в этом check-е — они покрыты отдельной проверкой
        (shipper_obligations_and_warranties_check).

        Нормативный ориентир:
        - ст. 10 ФЗ-259 (УАТ)
        - ст. 27 УЖТ
        - специальные правила перевозки

        [ЗАДАЧА]
        Установи:
        1. Есть ли в договоре заверение/обязанность по достоверности сведений.
        2. Предусмотрена ли ответственность за ложные или неполные данные.
        3. Кто именно несёт такую ответственность.
        4. Какие виды данных охватываются: вес, свойства груза, документы, иные характеристики.
        5. Приведи точную цитату из договора.
        6. Сформируй user-friendly значения для отображения в DD Grid.

        [ПРАВИЛА]
        1. Используй только текст договора.
        2. Не путай общую обязанность предоставить сведения с заверением об их достоверности.
        3. Если ответственность описана общо — liability_for_false_data = "yes", даже если размер не указан.
        4. Не подставляй нормы закона вместо текста договора.
        5. Не используй "None", "null" или пустые строки — используй "not_defined".
        6. В shipper_data_accuracy_snippet включай только цитату из договора.
        7. Для *_display полей используй понятные русские формулировки:
          - accuracy_warranty_present: yes → "Предусмотрено", no → "Не предусмотрено", not_defined → "Не указано"
          - liability_for_false_data: yes → "Предусмотрена", no → "Не предусмотрена", not_defined → "Не указано"
          - liable_party: shipper → "Грузоотправитель", carrier → "Перевозчик", not_defined → "Не указана"
          - covered_data_scope:
            * weight → "Вес груза"
            * cargo_properties → "Свойства груза"
