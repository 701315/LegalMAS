        Ответ:
        {
          "insurance_present": "not_defined",
          "insurance_required": "not_defined",
          "who_insures": "not_defined",
          "insurance_coverage": "not_defined",
          "beneficiary_defined": "not_defined",
          "declared_value_present": "not_defined",
          "declared_value_amount": "not_defined",
          "cargo_insurance_snippet": "not_defined",
          "insurance_present_display": "Не указано",
          "insurance_required_display": "Не указано",
