          description: >
            User-friendly отображение: установлен ли порядок подтверждения заявки. Fallback: "Не установлено" / "Не удалось определить".
          required: true
        - name: "change_or_cancellation_rules_display"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 5
          label: "Изменение/отмена заявки"
          description: >
            User-friendly отображение: установлены ли правила изменения/отмены заявки. Fallback: "Не установлено" / "Не удалось определить".
          required: true
      store_payload: true

  - id: liability_limitation_explicit
    name: "Лимит ответственности перевозчика (ст. 796 ГК РФ, уставы)"
    description: >
      Проверяет наличие явного ограничения ответственности перевозчика
      со ссылкой на договор, транспортный устав или объявленную/действительную
      стоимость груза.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "ответственность ограничена"
        - "лимит ответственности"
        - "в размере объявленной стоимости"
        - "не более реальной стоимости"
        - "согласно уставу"
        - "в соответствии с транспортным уставом"
        - "специальное право заимствования"
        - "СДР"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)ответственност.*ограничен"
        - "(?i)в\\s+соответствии\\s+с.*(УАТ|УЖТ|Воздушн|КТМ|КВВТ)"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по транспортным договорам.
        Анализируется договор перевозки груза.
        Проверяется только вопрос ограничения ответственности перевозчика.

        Нормативный ориентир:
        - ст. 796 ГК РФ
        - применимые транспортные уставы
        - специальные правила о пределах ответственности

        [ЗАДАЧА]
        Установи:
        1. Есть ли в тексте прямой лимит ответственности.
        2. Какой тип лимита используется:
          - объявленная стоимость
          - действительная стоимость
          - законный лимит
          - договорная сумма/формула
        3. Есть ли конкретный размер лимита.
        4. Есть ли ссылка на конкретный транспортный устав.
        5. Приведи точную цитату из договора.
        6. Сформируй user-friendly значения для отображения в DD Grid.

        [ПРАВИЛА]
        1. Используй только текст договора.
        2. Не путай ограничение ответственности с полным освобождением от ответственности.
        3. Если в тексте только общая ссылка на закон без раскрытия лимита — это statutory, а не contract_amount.
        4. Если лимит прямо не указан — ставь "not_defined".
        5. Не додумывай СДР, если в тексте этого нет.
        6. Не используй "None", "null" или пустые строки — используй "not_defined".
        7. В liability_limitation_snippet включай только цитату из договора.
        8. Для *_display полей используй понятные русские формулировки:
          - liability_cap_present: yes → "Установлен", no → "Не установлен", not_defined → "Не указано"
          - cap_type:
            * declared_value → "Объявленная стоимость"
            * actual_value → "Действительная стоимость"
            * statutory → "По закону"
            * contract_amount → "Договорная сумма"
            * not_defined → "Не определён"
          - statutory_reference:
            * УАТ → "УАТ (автомобильный транспорт)"
            * УЖТ → "УЖТ (железнодорожный транспорт)"
            * КТМ → "КТМ (морской транспорт)"
            * КВВТ → "КВВТ (внутренний водный транспорт)"
            * other → "Иной устав/режим"
            * not_defined → "Не указана"
        9. Верни РОВНО один JSON-объект со всеми 8 ключами без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — лимит установлен как объявленная стоимость:
        Фрагмент:
        "Ответственность Перевозчика за утрату, недостачу или повреждение груза ограничена объявленной стоимостью груза, указанной в транспортной накладной. При отсутствии объявленной стоимости возмещение производится в размере действительной стоимости груза. Порядок определяется в соответствии с УАТ."

        Ответ:
        {
          "liability_cap_present": "yes",
          "cap_type": "declared_value",
          "cap_amount": "объявленная стоимость груза, указанная в транспортной накладной; при отсутствии — действительная стоимость груза",
          "statutory_reference": "УАТ",
          "liability_limitation_snippet": "Ответственность Перевозчика за утрату, недостачу или повреждение груза ограничена объявленной стоимостью груза, указанной в транспортной накладной. При отсутствии объявленной стоимости возмещение производится в размере действительной стоимости груза. Порядок определяется в соответствии с УАТ.",
          "liability_cap_present_display": "Установлен",
          "cap_type_display": "Объявленная стоимость",
          "statutory_reference_display": "УАТ (автомобильный транспорт)"
        }

        Пример 2 — лимит не упомянут:
        Фрагмент:
        "Перевозчик обязуется доставить груз в пункт назначения в установленный срок."

        Ответ:
        {
          "liability_cap_present": "not_defined",
          "cap_type": "not_defined",
          "cap_amount": "not_defined",
          "statutory_reference": "not_defined",
          "liability_limitation_snippet": "not_defined",
          "liability_cap_present_display": "Не указано",
          "cap_type_display": "Не определён",
          "statutory_reference_display": "Не указана"
        }

        Пример 3 — текст есть, но вывод невозможен (размытая формулировка без конкретики):
        Фрагмент:
        "Ответственность сторон определяется в соответствии с действующим законодательством Российской Федерации."

        Ответ:
        {
          "liability_cap_present": "yes",
          "cap_type": "statutory",
          "cap_amount": "not_defined",
          "statutory_reference": "not_defined",
          "liability_limitation_snippet": "Ответственность сторон определяется в соответствии с действующим законодательством Российской Федерации.",
          "liability_cap_present_display": "Установлен",
          "cap_type_display": "По закону",
          "statutory_reference_display": "Не указана"
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        Перед ответом внутренне проверь:
        1. Есть ли прямая фраза об ограничении ответственности.
        2. Есть ли прямая связка с объявленной/действительной стоимостью.
        3. Есть ли конкретная сумма, формула или ссылка на устав.
        4. Не путаешь ли ты ограничение ответственности с исключением из ответственности.
        5. Если нет — не достраивай.
        6. Все 8 ключей присутствуют в JSON.

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь РОВНО одним JSON-объектом без какого-либо дополнительного текста до или после, со всеми 8 ключами:
        {
          "liability_cap_present": "<yes / no / not_defined>",
          "cap_type": "<declared_value / actual_value / statutory / contract_amount / not_defined>",
          "cap_amount": "<текст или not_defined>",
          "statutory_reference": "<УАТ / УЖТ / КТМ / КВВТ / other / not_defined>",
          "liability_limitation_snippet": "<точная цитата или not_defined>",
          "liability_cap_present_display": "<Установлен / Не установлен / Не указано>",
          "cap_type_display": "<Объявленная стоимость / Действительная стоимость / По закону / Договорная сумма / Не определён>",
          "statutory_reference_display": "<УАТ (автомобильный транспорт) / УЖТ (железнодорожный транспорт) / КТМ (морской транспорт) / КВВТ (внутренний водный транспорт) / Иной устав/режим / Не указана>"
        }
      context_k: 5
      temperature: 0.0
      max_tokens: 750
    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "лимит ответственности ответственность ограничена объявленная стоимость действительная стоимость транспортный устав УАТ УЖТ КТМ КВВТ СДР"
      preferred_unit_types:
        - liability_provision
