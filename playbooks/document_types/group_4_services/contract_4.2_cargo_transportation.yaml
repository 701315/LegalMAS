          description: "Срок для требования о переадресовке. Внутреннее enum-поле."
          required: true
          display_in_grid: false
        - name: "redirection_snippet"
          type: "string"
          presentation: "diagnostic"
          display_in_grid: false
          description: "Цитата об условиях переадресовки груза"
          required: true
        - name: "redirection_clause_present_display"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 1
          label: "Переадресовка"
          description: >
