      llm_prompt_extraction: |
        <role>
        Ты — российский юрист по транспортным договорам.
        Извлеки только условия сопровождения и охраны груза.
        Не анализируй цену, сроки доставки, ответственность, претензии и иные разделы.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. cargo_escort_terms_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если escort_required ∈ {"yes", "no", "optional"} ИЛИ escort_type ≠ "not_defined";
           - "missing" — если escort_required = "not_defined"
             и фрагментов об охране или сопровождении груза в контексте нет;
           - "unclear" — если фрагменты по теме есть, но из-за противоречий вывод невозможен.

           Если presence = "missing":
           - escort_required = "not_defined";
           - escort_type = "not_defined";
           - cost_allocation = "not_defined";
           - special_cases_defined = "not_defined";
           - escort_snippet = "not_defined";
           - все *_display = соответствующий fallback;
           - не выполняй остальные шаги.

        1. escort_required:
           - "yes" — если сопровождение/охрана груза прямо обязательна по договору;
           - "no" — если сопровождение груза прямо исключено / не требуется;
           - "optional" — если сопровождение осуществляется по согласованию/усмотрению сторон;
           - "not_defined" — если вопрос обязательности охраны прямо не урегулирован.

        2. escort_type:
           Тип сопровождения. Используй только:
           - "shipper_representative" — представитель грузоотправителя (экспедитор);
           - "armed_guard" — вооружённая или специализированная охрана;
           - "other" — иное сопровождающее лицо;
           - "not_defined" — тип сопровождения не указан.

        3. cost_allocation:
           - "shipper" — расходы несёт грузоотправитель;
           - "carrier" — расходы несёт перевозчик;
           - "not_defined" — сторона, оплачивающая сопровождение, не указана.

        4. special_cases_defined:
           - "yes" — если в договоре прямо выделены категории грузов, требующие обязательной охраны (ценные, опасные грузы);
           - "no" — если специальные категории не выделены;
           - "not_defined" — если условия охраны отсутствуют.

        5. escort_snippet:
           Точная цитата из договора об условиях сопровождения и охраны груза. Если нет — "not_defined".

        6. escort_required_display:
           "Требуется" / "Не требуется" / "По согласованию" / "Не указано".

        7. escort_type_display:
           "Представитель грузоотправителя" / "Вооружённая охрана" / "Иное сопровождение" / "Не указан".

        8. cost_allocation_display:
           "Грузоотправитель" / "Перевозчик" / "Не указано".

        9. special_cases_defined_display:
           "Есть" / "Нет" / "Не указано".
        </task>

        <context_rules>
        - Перед остальными полями заполни cargo_escort_terms_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все поля = "not_defined" / соответствующий fallback.
        - Не путай физическую охрану груза с общей правовой ответственностью перевозчика за его сохранность.
        - Если договор прямо допускает направление представителя, используй "optional" для обязательности.
        - Не используй "None", "null" или пустые строки.
        - Все 9 ключей должны присутствовать в JSON-ответе.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте договора нет упоминания охраны, вооружённого сопровождения или представителей клиента.
           → presence = "missing";
             escort_required = "not_defined";
             escort_type = "not_defined".

        2. Допуск сопровождения по желанию клиента.
           "Грузоотправитель вправе обеспечить сопровождение груза своим представителем."
           → presence = "present";
             escort_required = "optional";
             escort_type = "shipper_representative".

        3. Противоречие между фрагментами.
           В одном месте охрана оплачивается перевозчиком, в другом — включена в тариф за счёт грузоотправителя.
           → presence = "unclear";
             cost_allocation = "not_defined";
             cost_allocation_display = "Не указано".

        4. Охрана груза ≠ сохранность груза.
           "Перевозчик обязуется обеспечить полную сохранность груза во время движения." (без условий об охране).
           → presence = "missing";
             escort_required = "not_defined" (сохранность — общее обязательство, а не условие об охране/сопровождении).
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для cargo_escort_terms_presence используй только: "present", "missing", "unclear".
        - Для escort_required используй только: "yes", "no", "optional", "not_defined".
        - Для escort_type используй только: "shipper_representative", "armed_guard", "other", "not_defined".
        - Для cost_allocation используй только: "shipper", "carrier", "not_defined".
        - Для special_cases_defined используй только: "yes", "no", "not_defined".
        - Fallback при отсутствии данных:
          * escort_snippet → "not_defined";
          * все *_display → соответствующие fallback-строки.
        - Fallback при противоречии или неоднозначности:
          * все *_display → соответствующие fallback-строки.
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "cargo_escort_terms_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие условий о сопровождении груза. Внутреннее агрегатное signal-поле."
          required: true

        - name: "escort_required"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["yes", "no", "optional", "not_defined"]
          description: "Сопровождение требуется. Внутреннее enum-поле."
          required: true
          display_in_grid: false
        - name: "escort_type"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["shipper_representative", "armed_guard", "other", "not_defined"]
          description: "Тип сопровождения. Внутреннее enum-поле."
          required: true
          display_in_grid: false
        - name: "cost_allocation"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["shipper", "carrier", "not_defined"]
          description: "Кто оплачивает сопровождение. Внутреннее enum-поле."
          required: true
          display_in_grid: false
        - name: "special_cases_defined"
          type: "string"
          presentation: "signal"
          risk_weight: "low"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Есть специальные случаи обязательного сопровождения. Внутреннее enum-поле."
          required: true
          display_in_grid: false
        - name: "escort_snippet"
          type: "string"
          presentation: "diagnostic"
          display_in_grid: false
          description: "Цитата об условиях сопровождения и охраны груза"
          required: true
        - name: "escort_required_display"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 1
          label: "Сопровождение"
          description: >
            User-friendly отображение: требуется ли сопровождение груза. Fallback: "Не установлено" / "Не удалось определить".
          required: true
        - name: "escort_type_display"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 2
          label: "Тип сопровождения"
          description: >
            User-friendly отображение типа сопровождения груза. Fallback: "Не установлено" / "Не удалось определить".
          required: true
        - name: "cost_allocation_display"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 3
          label: "Расходы на сопровождение"
          description: >
            User-friendly отображение стороны, несущей расходы на сопровождение. Fallback: "Не установлено" / "Не удалось определить".
          required: true
        - name: "special_cases_defined_display"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 4
          label: "Специальные случаи"
          description: >
            User-friendly отображение: есть ли специальные случаи
            обязательного сопровождения.
            Fallback: "Не указано" / "Не удалось определить".
          required: true
      store_payload: true

  - id: seasonal_road_restrictions
    name: "Сезонные дорожные ограничения"
    description: >
      Проверяет учёт сезонных ограничений по массе, габаритам и движению
      (весенние ограничения движения тяжеловесных ТС, временные ограничения
      по регионам РФ), а также распределение обязанности получать специальные
      разрешения/пропуска и соблюдать временные дорожные ограничения.
      Специфический check для автомобильных перевозок по дорогам общего
      пользования (Постановление Правительства РФ № 258, региональные акты).
    triggers:
      any: ["road_transport", "seasonal_restrictions"]
    ui_mode: "field_extraction"
    severity: "medium"
    severity_if_pass: "pass"
    severity_if_fail: "medium"
    severity_if_unclear: "low"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "весенние ограничения"
        - "ограничения по массе"
        - "дорожные ограничения"
        - "пропуск на движение"
        - "временное ограничение"
        - "специальное разрешение"
        - "тяжеловесное транспортное средство"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)(весенн|сезонн|временн).*ограничен"
        - "(?i)ограничен.*движени.*тяжеловес"
        - "(?i)спец(иальное)?\\s+разрешен"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по транспортным договорам.
        Анализируется договор перевозки груза автомобильным транспортом.
        Проверяются ТОЛЬКО сезонные дорожные ограничения и связанные
        с ними обязанности сторон (весенние ограничения движения тяжеловесных ТС,
        временные ограничения по регионам РФ, специальные разрешения).

        [ЗАДАЧА]
        Установи:
        1. Упоминаются ли сезонные/временные ограничения движения.
        2. Кто отвечает за соблюдение этих ограничений.
        3. Упоминаются ли специальные разрешения/пропуска.
        4. Есть ли распределение риска/расходов из-за таких ограничений.
        5. Приведи точную цитату из договора.
        6. Сформируй user-friendly значения для отображения в DD Grid.

        [ПРАВИЛА]
        1. Используй только текст договора.
        2. Не выводи обязанность из закона, если она не отражена в договоре.
        3. Если ограничения упомянуты общо — фиксируй это без додумывания деталей.
        4. Если сезонные ограничения не упомянуты — seasonal_restrictions_mentioned = "not_defined".
        5. Не используй "None", "null" или пустые строки — используй "not_defined".
        6. В seasonal_restrictions_snippet включай только цитату из договора.
        7. Для *_display полей используй понятные русские формулировки:
          - seasonal_restrictions_mentioned: yes → "Упомянуты", no → "Не упомянуты", not_defined → "Не указано"
          - responsible_party: carrier → "Перевозчик", shipper → "Грузоотправитель", not_defined → "Не указана"
          - permits_mentioned: yes → "Упомянуты", no → "Не упомянуты", not_defined → "Не указано"
          - cost_allocation_defined: yes → "Определено", no → "Не определено", not_defined → "Не указано"
        8. Верни РОВНО один JSON-объект со всеми 9 ключами без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — сезонные ограничения упомянуты с распределением ответственности:
        Фрагмент:
        "В период действия временных ограничений движения тяжеловесных транспортных средств по автомобильным дорогам общего пользования (весенние ограничения) Перевозчик обязан получить специальное разрешение и обеспечить соблюдение ограничений по осевым нагрузкам. Расходы на получение специального разрешения несёт Перевозчик."

        Ответ:
        {
          "seasonal_restrictions_mentioned": "yes",
          "responsible_party": "carrier",
          "permits_mentioned": "yes",
          "cost_allocation_defined": "yes",
          "seasonal_restrictions_snippet": "В период действия временных ограничений движения тяжеловесных транспортных средств по автомобильным дорогам общего пользования (весенние ограничения) Перевозчик обязан получить специальное разрешение и обеспечить соблюдение ограничений по осевым нагрузкам. Расходы на получение специального разрешения несёт Перевозчик.",
          "seasonal_restrictions_mentioned_display": "Упомянуты",
          "responsible_party_display": "Перевозчик",
          "permits_mentioned_display": "Упомянуты",
          "cost_allocation_defined_display": "Определено"
        }

        Пример 2 — условия не упомянуты:
        Фрагмент:
        "Перевозчик обязуется доставить груз в пункт назначения в установленный срок."

        Ответ:
        {
          "seasonal_restrictions_mentioned": "not_defined",
          "responsible_party": "not_defined",
          "permits_mentioned": "not_defined",
          "cost_allocation_defined": "not_defined",
          "seasonal_restrictions_snippet": "not_defined",
          "seasonal_restrictions_mentioned_display": "Не указано",
          "responsible_party_display": "Не указана",
          "permits_mentioned_display": "Не указано",
          "cost_allocation_defined_display": "Не указано"
        }

        Пример 3 — edge-case: размытая формулировка без конкретики:
        Фрагмент:
        "Стороны обязаны соблюдать требования действующего законодательства о движении транспортных средств по автомобильным дорогам."

        Ответ:
        {
          "seasonal_restrictions_mentioned": "not_defined",
          "responsible_party": "not_defined",
          "permits_mentioned": "not_defined",
          "cost_allocation_defined": "not_defined",
          "seasonal_restrictions_snippet": "Стороны обязаны соблюдать требования действующего законодательства о движении транспортных средств по автомобильным дорогам.",
          "seasonal_restrictions_mentioned_display": "Не указано",
          "responsible_party_display": "Не указана",
          "permits_mentioned_display": "Не указано",
          "cost_allocation_defined_display": "Не указано"
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        Перед ответом внутренне проверь:
        1. Есть ли прямая цитата именно о сезонных/временных ограничениях движения (не просто общие требования к перевозке).
        2. Конкретизирована ли ответственная сторона.
        3. Упомянуты ли специальные разрешения/пропуска.
        4. Если прямого указания на сезонные ограничения нет — верни "not_defined".
        5. Все 9 ключей присутствуют в JSON.

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь РОВНО одним JSON-объектом без какого-либо дополнительного текста до или после, со всеми 9 ключами:
        {
          "seasonal_restrictions_mentioned": "<yes / no / not_defined>",
          "responsible_party": "<carrier / shipper / not_defined>",
          "permits_mentioned": "<yes / no / not_defined>",
          "cost_allocation_defined": "<yes / no / not_defined>",
          "seasonal_restrictions_snippet": "<точная цитата или not_defined>",
          "seasonal_restrictions_mentioned_display": "<Упомянуты / Не упомянуты / Не указано>",
          "responsible_party_display": "<Перевозчик / Грузоотправитель / Не указана>",
          "permits_mentioned_display": "<Упомянуты / Не упомянуты / Не указано>",
          "cost_allocation_defined_display": "<Определено / Не определено / Не указано>"
        }
      context_k: 4
      temperature: 0.0
      max_tokens: 600
    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "сезонные ограничения весенние ограничения ограничения по массе дорожные ограничения пропуск на движение временные ограничения специальное разрешение тяжеловесное транспортное средство"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - procedures
      negative_keywords:
        - "провозная плата"
        - "претензия"
        - "форс-мажор"
        - "неустойка"
      position_bias:
        preferred_range: [0.0, 0.90]
        boost: 0.10
        scope: auto
      retrieval_profile: "scope_of_work_check"
      context_k: 4
      max_chunks: 5
      rerank: true
    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
        - "invoice"
      preferred_clause_functions:
        - "obligations"
      confidence_bonus_on_match: 0.05
      confidence_penalty_on_excluded_segment: 0.10
    evidence:
      required: true
      min_snippet_length: 15
      max_snippet_length: 300
    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1100

      compact_output: false

      presence_signal:
        field: "seasonal_road_restrictions_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист по транспортным договорам.
        Извлеки только условия о сезонных дорожных ограничениях и связанных
        обязанностях сторон (весенние ограничения, временные ограничения,
        специальные разрешения).
        Не анализируй цену, сроки доставки, ответственность, претензии и иные разделы.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. seasonal_road_restrictions_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если seasonal_restrictions_mentioned ∈ {"yes", "no"} ИЛИ permits_mentioned = "yes";
           - "missing" — если seasonal_restrictions_mentioned = "not_defined"
             и фрагментов о дорожных/сезонных ограничениях в контексте нет;
           - "unclear" — если фрагменты по теме есть, но из-за противоречий вывод невозможен.

           Если presence = "missing":
           - seasonal_restrictions_mentioned = "not_defined";
           - responsible_party = "not_defined";
           - permits_mentioned = "not_defined";
           - cost_allocation_defined = "not_defined";
           - seasonal_restrictions_snippet = "not_defined";
           - все *_display = соответствующий fallback;
           - не выполняй остальные шаги.

        1. seasonal_restrictions_mentioned:
           - "yes" — если сезонные или временные ограничения движения ТС прямо упомянуты в договоре;
           - "no" — если в договоре прямо указано, что сезонные ограничения не влияют на обязательства перевозчика;
           - "not_defined" — если вопрос сезонных ограничений прямо не упомянут.

        2. responsible_party:
           - "carrier" — перевозчик;
           - "shipper" — грузоотправитель;
           - "not_defined" — сторона, ответственная за соблюдение ограничений/оформление пропусков, не указана.

        3. permits_mentioned:
           - "yes" — если необходимость оформления специальных разрешений или пропусков на движение прямо предусмотрена;
           - "no" — если оформление спецразрешений прямо исключено;
           - "not_defined" — если разрешения прямо не упомянуты.

        4. cost_allocation_defined:
           - "yes" — если порядок распределения расходов на получение пропусков/разрешений прямо определён;
           - "no" — если распределение расходов не предусмотрено;
           - "not_defined" — если вопрос расходов прямо не поднят.

        5. seasonal_restrictions_snippet:
           Точная цитата из договора об условиях сезонных дорожных ограничений. Если нет — "not_defined".

        6. seasonal_restrictions_mentioned_display:
           "Упомянуты" / "Не упомянуты" / "Не указано".

        7. responsible_party_display:
           "Перевозчик" / "Грузоотправитель" / "Не указана".

        8. permits_mentioned_display:
           "Упомянуты" / "Не упомянуты" / "Не указано".

        9. cost_allocation_defined_display:
           "Определено" / "Не определено" / "Не указано".
        </task>

        <context_rules>
        - Перед остальными полями заполни seasonal_road_restrictions_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все поля = "not_defined" / соответствующий fallback.
        - Не выводи обязанность получать спецразрешения из закона, если она прямо не предусмотрена в договоре перевозки.
        - Общая обязанность соблюдать правила дорожного движения не является оговоркой о сезонных дорожных ограничениях.
        - Не используй "None", "null" или пустые строки.
        - Все 9 ключей должны присутствовать в JSON-ответе.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В договоре нет упоминаний сезонных, весенних ограничений движения или пропусков.
           → presence = "missing";
             seasonal_restrictions_mentioned = "not_defined";
             permits_mentioned = "not_defined".

        2. Общие ссылки на ПДД без сезонных норм.
           "Перевозчик обязан соблюдать правила перевозки грузов автомобильным транспортом."
           → presence = "missing";
             seasonal_restrictions_mentioned = "not_defined".

        3. Противоречие между фрагментами.
           В одном месте расходы на спецпропуска несёт грузоотправитель, в другом — перевозчик.
           → presence = "unclear";
             responsible_party = "not_defined";
             cost_allocation_defined_display = "Не указано".

        4. Разрешение на тяжеловесные грузы без термина «весенняя просушка».
           "Перевозчик обеспечивает получение специального разрешения на движение тяжеловесного ТС."
           → presence = "present";
             seasonal_restrictions_mentioned = "yes";
             permits_mentioned = "yes";
             responsible_party = "carrier".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для seasonal_road_restrictions_presence используй только: "present", "missing", "unclear".
        - Для seasonal_restrictions_mentioned, permits_mentioned, cost_allocation_defined используй только: "yes", "no", "not_defined".
        - Для responsible_party используй только: "carrier", "shipper", "not_defined".
        - Fallback при отсутствии данных:
          * seasonal_restrictions_snippet → "not_defined";
          * все *_display → соответствующие fallback-строки.
        - Fallback при противоречии или неоднозначности:
          * все *_display → соответствующие fallback-строки.
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "seasonal_road_restrictions_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие условий о сезонных ограничениях. Внутреннее агрегатное signal-поле."
          required: true

        - name: "seasonal_restrictions_mentioned"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Сезонные ограничения упоминаются. Внутреннее enum-поле."
          required: true
          display_in_grid: false
        - name: "responsible_party"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["carrier", "shipper", "not_defined"]
          description: "Ответственная сторона. Внутреннее enum-поле."
          required: true
          display_in_grid: false
        - name: "permits_mentioned"
          type: "string"
