  - id: vat_and_tax
    name: "НДС и налоговые оговорки"
    description: >
      Проверяет налоговые аспекты провозной платы: включён ли НДС,
      выделена ли ставка, применяется ли ставка 0% для международной
      перевозки и как это сформулировано в договоре.
      Базовое включение НДС в цену также проверяется в check-е freight_charge;
      данный check добавляет налоговую специфику: конкретную ставку,
      нулевую ставку для международных перевозок (ст. 148 НК РФ)
      и ссылку на международный налоговый режим.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "medium"
    severity_if_pass: "pass"
    severity_if_fail: "medium"
    severity_if_unclear: "low"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "НДС"
        - "в том числе НДС"
        - "без НДС"
        - "ставка 0%"
        - "международная перевозка"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)\\bНДС\\b"
        - "(?i)ставк(а|у)\\s+0\\s*%"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по транспортным договорам.
        Анализируется договор перевозки груза.
        Проверяются только налоговые оговорки, связанные с провозной платой.

        [ЗАДАЧА]
        Установи:
        1. Упоминается ли НДС в тексте договора.
        2. Включён ли НДС в цену или цена указана без НДС.
        3. Есть ли указание на ставку 0%.
        4. Указан ли конкретный размер ставки.
        5. Есть ли привязка к международной перевозке.
        6. Приведи точную цитату из договора.
        7. Сформируй user-friendly значения для отображения в DD Grid.

        [ПРАВИЛА]
        1. Используй только текст договора.
        2. Не подставляй налоговый режим из закона.
        3. Если НДС не упомянут — vat_mentioned = "no", vat_included = "not_defined".
        4. Если прямо сказано "в том числе НДС" — vat_included = "yes".
        5. Если прямо сказано "без НДС" — vat_included = "no".
        6. Если прямо сказано "ставка 0%" — vat_included = "zero_rate".
        7. Если НДС не применим (например, перевозка нерезидентом без указания НДС) — vat_included = "not_applicable".
        8. Не используй "None", "null" или пустые строки — используй "not_defined".
        9. В vat_snippet включай только цитату из договора.
        10. Для *_display полей используй понятные русские формулировки:
            - vat_included:
              * yes → "Включён"
              * no → "Не включён"
              * zero_rate → "Нулевая ставка (0%)"
              * not_applicable → "Не применим"
              * not_defined → "Не указано"
            - international_tax_reference: yes → "Да", no → "Нет", not_defined → "Не указано"
        11. Верни РОВНО один JSON-объект со всеми 7 ключами без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — НДС включён, ставка 20%:
        Фрагмент:
        "Провозная плата составляет 150 000 (Сто пятьдесят тысяч) рублей, в том числе НДС 20% — 25 000 рублей."

        Ответ:
        {
          "vat_mentioned": "yes",
          "vat_included": "yes",
          "vat_rate": "20%",
          "international_tax_reference": "no",
          "vat_snippet": "Провозная плата составляет 150 000 (Сто пятьдесят тысяч) рублей, в том числе НДС 20% — 25 000 рублей.",
          "vat_included_display": "Включён",
          "international_tax_reference_display": "Нет"
        }

        Пример 2 — ставка 0% для международной перевозки:
        Фрагмент:
        "Провозная плата за международную перевозку составляет 5 000 евро без НДС. Применяется ставка НДС 0% в соответствии со статьёй 148 Налогового кодекса Российской Федерации."

        Ответ:
        {
          "vat_mentioned": "yes",
          "vat_included": "zero_rate",
          "vat_rate": "0%",
          "international_tax_reference": "yes",
          "vat_snippet": "Провозная плата за международную перевозку составляет 5 000 евро без НДС. Применяется ставка НДС 0% в соответствии со статьёй 148 Налогового кодекса Российской Федерации.",
          "vat_included_display": "Нулевая ставка (0%)",
          "international_tax_reference_display": "Да"
        }

        Пример 3 — текст есть, но вывод невозможен (размытая формулировка без конкретики):
        Фрагмент:
        "Оплата производится в соответствии с действующим налоговым законодательством."

        Ответ:
        {
          "vat_mentioned": "not_defined",
          "vat_included": "not_defined",
          "vat_rate": "not_defined",
          "international_tax_reference": "not_defined",
          "vat_snippet": "Оплата производится в соответствии с действующим налоговым законодательством.",
          "vat_included_display": "Не указано",
          "international_tax_reference_display": "Не указано"
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        Перед ответом внутренне проверь:
        1. Есть ли прямая цитата о НДС.
        2. Не подставил ли ты налоговый режим из закона вместо текста договора.
        3. Различаешь ли ты "включён", "не включён", "нулевая ставка" и "не применим".
        4. Если прямого указания нет — верни "not_defined".
        5. Все 7 ключей присутствуют в JSON.

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь РОВНО одним JSON-объектом без какого-либо дополнительного текста до или после, со всеми 7 ключами:
        {
