          "pretension_snippet": "Претензии по утрате, недостаче или повреждению груза могут быть предъявлены в течение 6 (шести) месяцев с даты сдачи груза к перевозке. Претензии по просрочке доставки груза могут быть предъявлены в течение 2 (двух) месяцев с даты, когда груз должен был быть доставлен. Перевозчик обязан рассмотреть претензию и дать ответ в течение 30 (тридцати) дней.",
          "claim_procedure_present_display": "Установлен",
