  - id: freight_charge
    name: "Провозная плата и порядок расчётов (ст. 790 ГК РФ)"
    description: >
      Проверяет наличие размера провозной платы, тарифов, порядка оплаты,
      валюты расчётов и налоговых оговорок. Проверка предназначена для
      точного извлечения условий оплаты без подстановки диспозитивных норм
      закона вместо текста договора.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "провозная плата"
        - "стоимость перевозки"
        - "тариф"
        - "фрахт"
        - "цена перевозки"
        - "рублей"
        - "оплата"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)провозн(ая|ой)\\s+плат"
        - "(?i)стоимост(ь|и)\\s+перевозк"
        - "(?i)\\b\\d[\\d\\s]*(?:руб|рублей|₽|тыс|млн)"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по транспортным договорам.
        Анализируется договор перевозки груза по ст. 785–797 ГК РФ и применимым транспортным уставам.
        Проверяется только один вопрос: как в договоре урегулирована провозная плата и порядок расчётов.

        Нормативный ориентир:
        - ст. 790 ГК РФ

        Важно:
        - Твоя задача — не оценивать справедливость цены.
        - Твоя задача — только извлечь, что прямо сказано в тексте договора.
        - Не подставляй нормы закона вместо отсутствующего текста договора.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Установлен ли размер провозной платы / тарифа / фрахта.
        2. В какой валюте выражена цена.
        3. Включён ли НДС в цену или цена указана без НДС.
        4. Установлен ли срок оплаты.
        5. Какой порядок оплаты предусмотрен: предоплата, постоплата, частичная оплата или иной порядок.

        [ПРАВИЛА]
        1. Используй только текст договора.
        2. Не делай предположений на основании обычая делового оборота.
        3. Если условие прямо не сформулировано — возвращай "not_defined".
        4. Не заменяй отсутствие договорной цены ссылкой на "обычно взимаемую цену".
        5. Если в договоре есть несколько фрагментов, используй более конкретный и прямой.
        6. Если указано только "по тарифам перевозчика", это не является конкретной суммой, но является условием о порядке формирования цены.
        7. Верни только один JSON-объект.

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        Перед ответом внутренне проверь:
        1. Есть ли в тексте прямая сумма, тариф или формула цены.
        2. Есть ли прямая фраза про НДС.
        3. Есть ли прямая фраза о сроке и порядке оплаты.
        4. Если чего-то нет — не додумывай.

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        {
          "freight_amount": "<сумма / формула / not_found>",
          "freight_currency": "<RUB / USD / EUR / other / not_found>",
          "price_includes_vat": "<yes / no / zero_rate / not_found>",
          "payment_deadline": "<срок / условие / not_found>",
          "payment_method": "<prepayment / postpayment / partial / tariff_based / other / not_found>"
        }
      context_k: 5
      temperature: 0.0
      max_tokens: 700
    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "провозная плата стоимость перевозки тариф фрахт цена перевозки оплата НДС срок оплаты порядок оплаты"
      preferred_unit_types:
        - payment_term
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - procedures
        - boilerplate
      negative_keywords:
        - "претензия"
        - "исковая давность"
        - "форс-мажор"
        - "коммерческий акт"
      position_bias:
        preferred_range: [0.0, 0.80]
        boost: 0.25
        scope: auto
      retrieval_profile: "payment_terms_check"
      context_k: 5
      max_chunks: 8
      rerank: true
    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
        - "invoice"
        - "act"
      preferred_clause_functions:
        - "obligations"
        - "procedures"
        - "boilerplate"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10
    evidence:
      required: true
      min_snippet_length: 25
      max_snippet_length: 500
    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 800
      compact_output: false
      llm_prompt_extraction: |
        <role>
        Ты — российский юрист по транспортным договорам.
        Твоя задача — извлечь из текста только условия о провозной плате и порядке расчётов.
        Не анализируй претензии, ответственность, форс-мажор, приёмку и иные разделы.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:
        1. freight_amount — конкретная сумма, формула цены или "not_defined".
        2. freight_currency — RUB / USD / EUR / other / not_found.
        3. price_includes_vat — yes / no / zero_rate / not_found.
        4. payment_deadline — текстовое описание срока оплаты или "not_defined".
        5. payment_method — prepayment / postpayment / partial / tariff_based / other / not_found.

        Если условие не указано прямо — не додумывай и ставь "not_defined".
        Ответ верни строго в JSON.
        </task>

        <rules>
        - Используй только текст договора.
        - Не подставляй закон вместо текста.
        - Если есть только "по тарифам перевозчика", то:
          - freight_amount = "по тарифам перевозчика"
          - payment_method = "tariff_based"
        - Если НДС не упомянут, price_includes_vat = "not_defined".
        </rules>
      fields:
        - name: "freight_amount"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 1
          label: "Провозная плата"
          description: "Размер провозной платы или формула цены"
          required: true
        - name: "freight_currency"
          type: "string"
          presentation: "signal"
          allowed_values: ["RUB", "USD", "EUR", "other", "not_defined"]
          description: "Валюта расчётов"
          required: true
        - name: "price_includes_vat"
          type: "string"
          presentation: "signal"
          allowed_values: ["yes", "no", "zero_rate", "not_defined"]
          description: "НДС включён в цену"
          required: true
        - name: "payment_deadline"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 2
          label: "Срок оплаты"
          description: "Срок оплаты"
          required: true
        - name: "payment_method"
          type: "string"
          presentation: "signal"
          allowed_values: ["prepayment", "postpayment", "partial", "tariff_based", "other", "not_defined"]
          description: "Порядок оплаты"
          required: true
      store_payload: true

