  - id: termination_and_cancellation
    name: "Односторонний отказ от договора перевозки"
    description: >
      Проверяет право сторон на односторонний отказ от исполнения договора
      перевозки, условия и сроки предварительного уведомления, а также
      компенсацию фактически понесённых расходов при отказе
      (ст. 782, 784 ГК РФ, ст. 31 УАТ). Отдельно от штрафов за неподачу ТС
      (vehicle_supply_penalty) и автопролонгации (auto_renewal).
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "отказ от договора"
        - "расторжение договора"
        - "односторонний отказ"
        - "компенсация расходов"
        - "фактически понесённые"
        - "право отказаться"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)отказ.*от.*договор"
        - "(?i)расторжени(е|я)"
        - "(?i)односторонн.*отказ"
        - "(?i)фактическ.*понесённ"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по транспортным договорам.
        Анализируется договор перевозки груза.
        Проверяются ТОЛЬКО условия одностороннего отказа от договора перевозки
        и связанная с этим компенсация расходов.

        Нормативный ориентир:
        - ст. 782 ГК РФ (односторонний отказ от возмездного оказания услуг)
        - ст. 784 ГК РФ
        - ст. 31 УАТ

        [ЗАДАЧА]
        Установи:
        1. Есть ли в договоре право на односторонний отказ.
        2. Какая сторона вправе отказаться.
        3. Установлен ли срок предварительного уведомления об отказе.
        4. Предусмотрена ли компенсация фактически понесённых расходов.
        5. Приведи точную цитату из договора.
        6. Сформируй user-friendly значения для DD Grid.

        [ПРАВИЛА]
        1. Используй только текст договора.
        2. Не подставляй ст. 782 ГК РФ, если договор молчит.
        3. Не путай односторонний отказ с расторжением по соглашению сторон.
        4. Не путай компенсацию при отказе со штрафами за неподачу ТС.
        5. Если право на отказ не упомянуто — termination_right_present = "not_defined".
        6. Не используй "None", "null" или пустые строки — используй "not_defined".
        7. В termination_snippet включай только цитату из договора.
        8. Для *_display полей используй понятные русские формулировки.
        9. Верни РОВНО один JSON-объект со всеми 9 ключами.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — отказ с компенсацией:
        Фрагмент:
        "Грузоотправитель вправе в одностороннем порядке отказаться от исполнения настоящего договора, направив Перевозчику письменное уведомление не позднее чем за 48 часов до планируемой даты подачи ТС. При отказе Грузоотправитель компенсирует Перевозчику фактически понесённые расходы."

        Ответ:
        {
          "termination_right_present": "yes",
          "who_can_terminate": "shipper",
          "notice_period": "48 часов до подачи ТС",
          "compensation_provided": "yes",
          "termination_snippet": "Грузоотправитель вправе в одностороннем порядке отказаться от исполнения настоящего договора, направив Перевозчику письменное уведомление не позднее чем за 48 часов до планируемой даты подачи ТС. При отказе Грузоотправитель компенсирует Перевозчику фактически понесённые расходы.",
          "termination_right_present_display": "Предусмотрено",
          "who_can_terminate_display": "Грузоотправитель",
          "notice_period_display": "48 часов до подачи ТС",
          "compensation_provided_display": "Предусмотрена"
        }

        Пример 2 — не упомянуто:
        Фрагмент:
        "Перевозчик обязуется доставить груз в пункт назначения."

        Ответ:
        {
          "termination_right_present": "not_defined",
          "who_can_terminate": "not_defined",
          "notice_period": "not_defined",
          "compensation_provided": "not_defined",
          "termination_snippet": "not_defined",
          "termination_right_present_display": "Не указано",
          "who_can_terminate_display": "Не указано",
          "notice_period_display": "Не указан",
          "compensation_provided_display": "Не указано"
        }

        [ФОРМАТ ОТВЕТА]
        {
          "termination_right_present": "<yes / no / not_defined>",
          "who_can_terminate": "<shipper / carrier / either / not_defined>",
          "notice_period": "<срок или not_defined>",
          "compensation_provided": "<yes / no / not_defined>",
          "termination_snippet": "<точная цитата или not_defined>",
          "termination_right_present_display": "<Предусмотрено / Не предусмотрено / Не указано>",
          "who_can_terminate_display": "<Грузоотправитель / Перевозчик / Любая сторона / Не указано>",
          "notice_period_display": "<срок / Не указан>",
          "compensation_provided_display": "<Предусмотрена / Не предусмотрена / Не указано>"
        }
      context_k: 4
      temperature: 0.0
      max_tokens: 600
    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "отказ от договора расторжение односторонний отказ компенсация расходов фактически понесённые право отказаться"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - remedies
        - limitations
      negative_keywords:
        - "провозная плата"
        - "претензия"
        - "форс-мажор"
        - "неподача ТС"
      position_bias:
        preferred_range: [0.5, 1.0]
        boost: 0.15
        scope: auto
      retrieval_profile: "term_and_renewal_check"
      context_k: 4
      max_chunks: 5
      rerank: true
    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
        - "invoice"
      preferred_clause_functions:
        - "remedies"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10
    evidence:
      required: true
      min_snippet_length: 20
      max_snippet_length: 400
    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1100

      compact_output: false

      presence_signal:
        field: "termination_and_cancellation_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист по транспортным договорам.
        Извлеки только условия одностороннего отказа от договора перевозки
        и компенсации фактически понесённых расходов.
        Не анализируй штрафы за неподачу ТС, автопролонгацию, цену,
        сроки доставки и иные разделы.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. termination_and_cancellation_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если termination_right_present ∈ {"yes", "no"};
           - "missing" — если termination_right_present = "not_defined"
             и фрагментов об одностороннем отказе в контексте нет;
           - "unclear" — если фрагменты есть, но противоречивы.

           Если presence = "missing":
           - termination_right_present = "not_defined";
           - who_can_terminate = "not_defined";
           - notice_period = "not_defined";
           - compensation_provided = "not_defined";
           - termination_snippet = "not_defined";
           - все *_display = соответствующий fallback;
           - не выполняй остальные шаги.

        1. termination_right_present:
           - "yes" — если право на односторонний отказ прямо предусмотрено;
           - "no" — если односторонний отказ прямо запрещён;
           - "not_defined" — если вопрос не урегулирован.

        2. who_can_terminate:
           - "shipper" — только грузоотправитель;
           - "carrier" — только перевозчик;
           - "either" — любая из сторон;
           - "not_defined" — управомоченная сторона не указана.

        3. notice_period:
           Срок предварительного уведомления об отказе из текста договора
           (например: "48 часов", "5 рабочих дней").
           Если не указан — "not_defined".

        4. compensation_provided:
           - "yes" — если компенсация фактически понесённых расходов
             прямо предусмотрена;
           - "no" — если компенсация прямо исключена;
           - "not_defined" — если вопрос компенсации не урегулирован.

        5. termination_snippet:
           Точная цитата из договора об условиях отказа. Если нет — "not_defined".

        6. termination_right_present_display:
           "Предусмотрено" / "Не предусмотрено" / "Не указано".

        7. who_can_terminate_display:
           "Грузоотправитель" / "Перевозчик" / "Любая сторона" / "Не указано".

        8. notice_period_display:
           Конкретный срок или "Не указан".

        9. compensation_provided_display:
           "Предусмотрена" / "Не предусмотрена" / "Не указано".
        </task>

        <context_rules>
        - Перед остальными полями заполни termination_and_cancellation_presence
          по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй
          "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все поля = "not_defined" /
          соответствующий fallback.
        - Не подставляй ст. 782 ГК РФ, если договор молчит об отказе.
        - Не путай односторонний отказ с расторжением по соглашению сторон
          или с автопролонгацией.
        - Не путай компенсацию при отказе со штрафами за неподачу ТС.
        - Прямой запрет на односторонний отказ (termination_right_present = "no")
          — это presence = "present", а не "missing".
        - Не используй "None", "null" или пустые строки.
        - Все 9 ключей должны присутствовать в JSON-ответе.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В договоре нет упоминания одностороннего отказа или расторжения.
           → presence = "missing";
             termination_right_present = "not_defined".

        2. Отказ без компенсации.
           "Грузоотправитель вправе отказаться от перевозки в любое время
           до подачи ТС." (про компенсацию ни слова).
           → presence = "present";
             termination_right_present = "yes";
             who_can_terminate = "shipper";
             compensation_provided = "not_defined".

        3. Противоречие между фрагментами.
           В одном месте отказ разрешён с компенсацией, в другом —
           договор назван безотзывным.
           → presence = "unclear";
             termination_right_present = "not_defined".

        4. Расторжение по соглашению ≠ односторонний отказ.
           "Договор может быть расторгнут по взаимному согласию сторон."
           → presence = "missing";
             termination_right_present = "not_defined"
             (это не односторонний отказ).
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для termination_and_cancellation_presence используй только:
          "present", "missing", "unclear".
        - Для termination_right_present, compensation_provided используй
          только: "yes", "no", "not_defined".
        - Для who_can_terminate используй только:
          "shipper", "carrier", "either", "not_defined".
        - Fallback при отсутствии данных:
          * notice_period, termination_snippet → "not_defined";
          * все *_display → соответствующие fallback-строки.
        - Fallback при противоречии или неоднозначности:
          * все *_display → соответствующие fallback-строки.
        - Технический формат JSON (value / confidence / location) задан
          отдельным контрактом — соблюдай его, но не описывай здесь.
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "termination_and_cancellation_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие условий одностороннего отказа. Внутреннее агрегатное signal-поле."
          required: true

        - name: "termination_right_present"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Право на односторонний отказ от договора. Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "who_can_terminate"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["shipper", "carrier", "either", "not_defined"]
          description: "Сторона, вправе инициировать односторонний отказ. Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "notice_period"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 1
          label: "Срок уведомления"
          description: >
            Срок предварительного уведомления об одностороннем отказе.
            Fallback: "Не указан".
          required: true

        - name: "compensation_provided"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Компенсация фактически понесённых расходов при отказе. Внутреннее enum-поле."
