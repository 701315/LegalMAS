  - id: demurrage_detention_check
    name: "Демередж / простой: нормативное время и штрафы (ст. 791, 794 ГК РФ)"
    description: >
      Проверяет наличие нормативного времени погрузки/выгрузки
      и штрафов за сверхнормативный простой (демередж/детеншн).
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "простой"
        - "демередж"
        - "детеншн"
        - "нормативное время"
        - "время погрузки"
        - "время выгрузки"
        - "сверхнормативный простой"
        - "штраф за простой"
        - "плата за простой"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)нормативн(ое|ого)\\s+врем(я|ени)"
        - "(?i)демередж|детеншн"
        - "(?i)простой.*штраф|штраф.*простой"
        - "(?i)за\\s+каждый\\s+час\\s+простоя"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по транспортным договорам.
        Анализируется договор перевозки груза.
        Проверяются только нормативное время погрузочно-разгрузочных работ
        и санкции за сверхнормативный простой.

        Нормативный ориентир:
        - ст. 791 ГК РФ
        - ст. 794 ГК РФ

        [ЗАДАЧА]
        Установи:
        1. Указано ли нормативное время погрузки.
        2. Указано ли нормативное время выгрузки.
        3. Установлена ли ставка платы за простой (демередж/детеншн).
        4. Установлен ли предельный размер платы за простой.
        5. Кто оплачивает простой.
        6. Приведи точную цитату из договора.
        7. Сформируй user-friendly значение для стороны, оплачивающей простой.

        [ПРАВИЛА]
        1. Используй только текст договора.
        2. Не путай демередж (плату за простой при погрузке/выгрузке) с неустойкой за просрочку доставки.
        3. Не путай демередж со штрафом за неподачу транспорта или непредъявление груза.
        4. Если ставка прямо не названа — demurrage_rate = "not_defined" даже при наличии упоминания простоя.
        5. Не используй "None", "null" или пустые строки — используй "not_defined".
        6. В demurrage_snippet включай только цитату из договора.
        7. Для who_pays_demurrage_display используй понятные русские формулировки:
          - shipper → "Грузоотправитель"
          - consignee → "Грузополучатель"
          - not_defined → "Не указано"
        8. Верни РОВНО один JSON-объект со всеми 7 ключами без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — стандартная ситуация:
        Фрагмент:
        "Нормативное время погрузки — 3 часа, выгрузки — 2 часа. За каждый час сверхнормативного простоя грузоотправитель уплачивает 1 500 руб."

        Ответ:
        {
          "normative_loading_time": "3 часа",
          "normative_unloading_time": "2 часа",
          "demurrage_rate": "1 500 руб. за каждый час простоя",
          "demurrage_cap": "not_defined",
          "who_pays_demurrage": "shipper",
          "demurrage_snippet": "Нормативное время погрузки — 3 часа, выгрузки — 2 часа. За каждый час сверхнормативного простоя грузоотправитель уплачивает 1 500 руб.",
          "who_pays_demurrage_display": "Грузоотправитель"
        }

        Пример 2 — условия не упомянуты:
        Фрагмент:
        "Стороны определяют порядок погрузочно-разгрузочных работ согласованно."

        Ответ:
        {
          "normative_loading_time": "not_defined",
          "normative_unloading_time": "not_defined",
          "demurrage_rate": "not_defined",
          "demurrage_cap": "not_defined",
          "who_pays_demurrage": "not_defined",
          "demurrage_snippet": "not_defined",
          "who_pays_demurrage_display": "Не указано"
        }

        Пример 3 — текст есть, но вывод невозможен (размытая формулировка без конкретики):
        Фрагмент:
        "Условия погрузки и выгрузки определяются сторонами в каждом конкретном случае с учётом специфики груза и технических возможностей."

        Ответ:
        {
          "normative_loading_time": "not_defined",
          "normative_unloading_time": "not_defined",
          "demurrage_rate": "not_defined",
          "demurrage_cap": "not_defined",
          "who_pays_demurrage": "not_defined",
          "demurrage_snippet": "Условия погрузки и выгрузки определяются сторонами в каждом конкретном случае с учётом специфики груза и технических возможностей.",
          "who_pays_demurrage_display": "Не указано"
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        Перед ответом внутренне проверь:
        1. Есть ли прямая цитата о нормативном времени или ставке простоя.
        2. Не перепутан ли демередж с неустойкой за просрочку доставки.
        3. Если прямых значений нет — верни "not_defined".
        4. Все 7 ключей присутствуют в JSON.

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь РОВНО одним JSON-объектом без какого-либо дополнительного текста до или после, со всеми 7 ключами:
        {
          "normative_loading_time": "<время или not_defined>",
          "normative_unloading_time": "<время или not_defined>",
          "demurrage_rate": "<ставка за час/день или not_defined>",
          "demurrage_cap": "<максимальная сумма или not_defined>",
          "who_pays_demurrage": "<shipper / consignee / not_defined>",
          "demurrage_snippet": "<точная цитата или not_defined>",
          "who_pays_demurrage_display": "<Грузоотправитель / Грузополучатель / Не указано>"
        }
      context_k: 5
      temperature: 0.0
      max_tokens: 550
    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "простой демередж детеншн нормативное время время погрузки время выгрузки сверхнормативный простой штраф за простой плата за простой"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - remedies
      negative_keywords:
        - "провозная плата"
        - "претензия"
        - "просрочка доставки"
        - "неподача транспорта"
      position_bias:
        preferred_range: [0.2, 0.95]
        boost: 0.15
        scope: auto
      retrieval_profile: "liability_cap_check"
      context_k: 5
      max_chunks: 8
      rerank: true
    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
        - "invoice"
      preferred_clause_functions:
        - "obligations"
        - "remedies"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10
    evidence:
      required: true
      min_snippet_length: 30
      max_snippet_length: 500
    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1100

      compact_output: false

      presence_signal:
        field: "demurrage_detention_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист по транспортным договорам.
        Извлеки только условия о нормативном времени погрузки/выгрузки
        и плате за простой (демередж/детеншн).
        Не анализируй неустойку за просрочку доставки, штрафы за неподачу транспорта и иные разделы.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. demurrage_detention_check_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (normative_loading_time, normative_unloading_time, demurrage_rate) ≠ "not_defined";
           - "missing" — если все три содержательных поля = "not_defined"
             и фрагментов о нормативном времени или простое в контексте нет;
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - normative_loading_time = "not_defined";
           - normative_unloading_time = "not_defined";
           - demurrage_rate = "not_defined";
           - demurrage_cap = "not_defined";
           - who_pays_demurrage = "not_defined";
           - demurrage_snippet = "not_defined";
           - who_pays_demurrage_display = "Не указано";
           - не выполняй остальные шаги.

        1. normative_loading_time:
           Нормативное время погрузки из текста договора
           (например: "3 часа", "24 часа", "1 рабочий день").
           Если не указано — "not_defined".

        2. normative_unloading_time:
           Нормативное время выгрузки из текста договора.
           Если не указано — "not_defined".

        3. demurrage_rate:
           Ставка платы за сверхнормативный простой
           (например: "1 500 руб. за каждый час простоя", "5 000 руб./сутки").
           Если ставка прямо не названа — "not_defined"
           (даже при упоминании простоя).

        4. demurrage_cap:
           Предельный размер платы за простой
           (например: "не более 50 000 руб.", "не более стоимости перевозки").
           Если не указан — "not_defined".

        5. who_pays_demurrage:
           - "shipper" — грузоотправитель;
           - "consignee" — грузополучатель;
           - "not_defined" — не указано.

        6. demurrage_snippet:
           Точная цитата из договора. Если нет — "not_defined".

        7. who_pays_demurrage_display:
           "Грузоотправитель" / "Грузополучатель" / "Не указано".
        </task>

        <context_rules>
        - Перед остальными полями заполни demurrage_detention_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все поля = "not_defined", who_pays_demurrage_display = "Не указано".
        - Не смешивай простой при погрузке/выгрузке с просрочкой доставки.
        - Не смешивай демередж со штрафом за неподачу транспорта или непредъявление груза.
        - Если время указано только для одной операции, второе поле = "not_defined".
        - Если ставка прямо не названа — demurrage_rate = "not_defined" даже при упоминании простоя.
        - Не используй "None", "null" or пустые строки.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет упоминания нормативного времени или простоя.
           → presence = "missing";
             все поля = "not_defined";
             who_pays_demurrage_display = "Не указано".

        2. Нормативное время без ставки простоя.
           "Время погрузки — 4 часа, время выгрузки — 2 часа."
           → presence = "present";
             normative_loading_time = "4 часа";
             normative_unloading_time = "2 часа";
             demurrage_rate = "not_defined".

        3. Противоречие между фрагментами.
           В одном пункте ставка 1 500 руб./час, в другом — 2 000 руб./час.
           → presence = "unclear";
             demurrage_rate = "Не удалось определить".

        4. Неустойка за просрочку доставки ≠ демередж.
           "За просрочку доставки перевозчик уплачивает неустойку в размере 0,1%."
           → presence = "missing";
             все поля = "not_defined"
             (это просрочка доставки, а не простой при погрузке/выгрузке).
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для demurrage_detention_check_presence используй только: "present", "missing", "unclear".
        - Для who_pays_demurrage используй только: "shipper", "consignee", "not_defined".
        - Fallback при отсутствии данных:
          * normative_loading_time, normative_unloading_time → "not_defined";
          * demurrage_rate, demurrage_cap → "not_defined";
          * demurrage_snippet → "not_defined";
          * who_pays_demurrage_display → "Не указано".
        - Fallback при противоречии или неоднозначности:
          * demurrage_rate → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "demurrage_detention_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие условий о нормативном времени и демередже. Внутреннее агрегатное signal-поле."
          required: true

        - name: "who_pays_demurrage"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["shipper", "consignee", "not_defined"]
          description: "Кто оплачивает простой. Внутреннее enum-поле."
          required: true
          display_in_grid: false
        - name: "normative_loading_time"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 1
          label: "Время погрузки"
          description: >
            Нормативное время погрузки. Fallback: "Не установлено" / "Не удалось определить".
          required: true
        - name: "normative_unloading_time"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 2
          label: "Время выгрузки"
          description: >
            Нормативное время выгрузки. Fallback: "Не установлено" / "Не удалось определить".
          required: true
        - name: "demurrage_rate"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 3
          label: "Ставка демереджа"
          description: >
            Ставка платы за простой. Fallback: "Не установлено" / "Не удалось определить".
          required: true
        - name: "demurrage_cap"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 4
          label: "Предел демереджа"
          description: >
            Предельный размер платы за простой. Fallback: "Не установлено" / "Не удалось определить".
          required: true
        - name: "demurrage_snippet"
          type: "string"
          presentation: "diagnostic"
          display_in_grid: false
          description: "Цитата о нормативном времени/простое"
          required: true
        - name: "who_pays_demurrage_display"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 5
          label: "Оплачивает"
          description: >
            User-friendly отображение стороны, оплачивающей простой. Fallback: "Не установлено" / "Не удалось определить".
          required: true
      store_payload: true

  - id: vehicle_supply_check
    name: "Подача ТС: сроки, уведомление, санкции (ст. 791, 794 ГК РФ)"
    description: >
      Проверяет наличие условий о подаче транспортного средства под погрузку:
      сроки, порядок уведомления, санкции за несвоевременную подачу
      или непредъявление груза.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "подача транспортных средств"
        - "срок подачи"
        - "график подачи"
        - "уведомление о подаче"
        - "штраф за непредъявление"
        - "неиспользование"
        - "отказ от заявки"
        - "заявка на перевозку"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)подач(а|и)\\s+транспортн"
        - "(?i)заявк(а|и|у)\\s+на\\s+перевозк"
        - "(?i)штраф.*за.*(непод|непредъявлен)"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по транспортным договорам.
        Анализируется договор перевозки груза.
        Проверяются только условия подачи транспортных средств под погрузку.

        Нормативный ориентир:
        - ст. 791 ГК РФ
        - ст. 794 ГК РФ

        [ЗАДАЧА]
        Установи:
        1. Установлен ли срок подачи ТС под погрузку.
        2. Предусмотрен ли порядок уведомления о подаче ТС.
        3. Установлена ли санкция за несвоевременную подачу ТС.
        4. Установлена ли санкция за непредъявление груза.
        5. Есть ли порядок подачи заявок на перевозку.
        6. Приведи точную цитату из договора.
        7. Сформируй user-friendly значения для отображения в DD Grid.

        [ПРАВИЛА]
        1. Используй только текст договора.
        2. Не путай срок подачи ТС со сроком доставки груза.
        3. Не путай санкции за несвоевременную подачу с неустойкой за просрочку доставки.
        4. Если санкция упомянута, но ставка не названа — соответствующее поле = "yes", детали не додумывай.
        5. Не используй "None", "null" или пустые строки — используй "not_defined".
        6. В vehicle_supply_snippet включай только цитату из договора.
        7. Для *_display полей используй понятные русские формулировки:
          - notification_procedure: yes → "Установлен", no → "Не установлен", not_defined → "Не указано"
          - penalty_for_late_supply: yes → "Установлена", no → "Не установлена", not_defined → "Не указано"
          - penalty_for_non_presentation: yes → "Установлена", no → "Не установлена", not_defined → "Не указано"
          - application_procedure: yes → "Установлен", no → "Не установлен", not_defined → "Не указано"
        8. Верни РОВНО один JSON-объект со всеми 10 ключами без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — стандартная ситуация:
        Фрагмент:
        "Перевозчик обязан подать ТС под погрузку в течение 24 часов с момента подтверждения заявки. За несвоевременную подачу ТС — штраф 10 000 руб."

        Ответ:
        {
          "vehicle_supply_deadline": "24 часа с момента подтверждения заявки",
          "notification_procedure": "not_defined",
          "penalty_for_late_supply": "yes",
          "penalty_for_non_presentation": "not_defined",
          "application_procedure": "yes",
          "vehicle_supply_snippet": "Перевозчик обязан подать ТС под погрузку в течение 24 часов с момента подтверждения заявки. За несвоевременную подачу ТС — штраф 10 000 руб.",
          "notification_procedure_display": "Не указано",
          "penalty_for_late_supply_display": "Установлена",
          "penalty_for_non_presentation_display": "Не указано",
          "application_procedure_display": "Установлен"
        }

        Пример 2 — условия не упомянуты:
        Фрагмент:
        "Стороны согласовывают дату перевозки дополнительно."

        Ответ:
        {
          "vehicle_supply_deadline": "not_defined",
          "notification_procedure": "not_defined",
          "penalty_for_late_supply": "not_defined",
          "penalty_for_non_presentation": "not_defined",
          "application_procedure": "not_defined",
          "vehicle_supply_snippet": "not_defined",
          "notification_procedure_display": "Не указано",
          "penalty_for_late_supply_display": "Не указано",
          "penalty_for_non_presentation_display": "Не указано",
          "application_procedure_display": "Не указано"
        }

        Пример 3 — текст есть, но вывод невозможен (размытая формулировка без конкретики):
        Фрагмент:
        "Подача транспортных средств осуществляется по согласованию сторон с учётом технических возможностей и графика работы."

        Ответ:
        {
          "vehicle_supply_deadline": "not_defined",
          "notification_procedure": "not_defined",
          "penalty_for_late_supply": "not_defined",
          "penalty_for_non_presentation": "not_defined",
          "application_procedure": "not_defined",
          "vehicle_supply_snippet": "Подача транспортных средств осуществляется по согласованию сторон с учётом технических возможностей и графика работы.",
          "notification_procedure_display": "Не указано",
          "penalty_for_late_supply_display": "Не указано",
          "penalty_for_non_presentation_display": "Не указано",
          "application_procedure_display": "Не указано"
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        Перед ответом внутренне проверь:
        1. Есть ли прямая цитата о подаче ТС, заявке или санкции.
        2. Не перепутана ли подача ТС со сроком доставки.
        3. Не перепутаны ли санкции за неподачу/непредъявление с неустойкой за просрочку доставки.
        4. Если прямого указания нет — верни "not_defined".
        5. Все 10 ключей присутствуют в JSON.

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь РОВНО одним JSON-объектом без какого-либо дополнительного текста до или после, со всеми 10 ключами:
        {
          "vehicle_supply_deadline": "<срок или not_defined>",
          "notification_procedure": "<yes / no / not_defined>",
          "penalty_for_late_supply": "<yes / no / not_defined>",
          "penalty_for_non_presentation": "<yes / no / not_defined>",
          "application_procedure": "<yes / no / not_defined>",
          "vehicle_supply_snippet": "<точная цитата или not_defined>",
          "notification_procedure_display": "<Установлен / Не установлен / Не указано>",
          "penalty_for_late_supply_display": "<Установлена / Не установлена / Не указано>",
          "penalty_for_non_presentation_display": "<Установлена / Не установлена / Не указано>",
          "application_procedure_display": "<Установлен / Не установлен / Не указано>"
        }
      context_k: 5
      temperature: 0.0
      max_tokens: 550
    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "подача транспортных средств срок подачи график подачи уведомление о подаче штраф за непредъявление неиспользование отказ от заявки заявка на перевозку"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - procedures
      negative_keywords:
        - "провозная плата"
        - "претензия"
        - "форс-мажор"
        - "просрочка доставки"
      position_bias:
        preferred_range: [0.0, 0.80]
        boost: 0.15
        scope: auto
      retrieval_profile: "completion_deadline_check"
      context_k: 5
      max_chunks: 6
      rerank: true
    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
        - "invoice"
      preferred_clause_functions:
        - "obligations"
        - "procedures"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10
    evidence:
      required: true
      min_snippet_length: 30
      max_snippet_length: 500
    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1100

      compact_output: false

      presence_signal:
        field: "vehicle_supply_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист по транспортным договорам.
        Извлеки только условия о подаче ТС под погрузку и связанных санкциях.
        Не анализируй неустойку за просрочку доставки, общие санкции и иные разделы.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. vehicle_supply_check_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (vehicle_supply_deadline, notification_procedure, penalty_for_late_supply, penalty_for_non_presentation, application_procedure)
             не равно "not_defined" / "no" / "absent";
           - "missing" — если все указанные поля равны "not_defined" / "no" / "absent"
             и фрагментов о подаче ТС под погрузку в контексте нет;
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - vehicle_supply_deadline = "not_defined";
           - notification_procedure = "not_defined";
           - penalty_for_late_supply = "not_defined";
           - penalty_for_non_presentation = "not_defined";
           - application_procedure = "not_defined";
           - vehicle_supply_snippet = "not_defined";
           - все *_display = соответствующий fallback;
           - не выполняй остальные шаги.

        1. vehicle_supply_deadline:
           Срок подачи ТС под погрузку из текста договора
           (например: "в течение 24 часов с момента подтверждения заявки").
           Если срок не установлен — "not_defined".

        2. notification_procedure:
           - "yes" — если порядок уведомления грузоотправителя о подаче ТС установлен;
           - "no" — если прямо указано, что уведомление не требуется;
           - "not_defined" — если порядок прямо не урегулирован.

        3. penalty_for_late_supply:
           - "yes" — если установлена санкция/штраф за просрочку подачи ТС;
           - "no" — если прямо указано, что перевозчик освобождён от ответственности;
           - "not_defined" — если ответственность за неподачу ТС не урегулирована.

        4. penalty_for_non_presentation:
           - "yes" — если установлена санкция за непредъявление груза к перевозке;
           - "no" — если прямо указано, что грузоотправитель освобождён от ответственности;
           - "not_defined" — если ответственность за непредъявление груза не урегулирована.

        5. application_procedure:
           - "yes" — если порядок подачи и согласования заявок на перевозку установлен;
           - "no" — если заявки не применяются;
           - "not_defined" — если порядок заявок прямо не урегулирован.

        6. vehicle_supply_snippet:
           Точная цитата из договора. Если нет — "not_defined".

        7. notification_procedure_display:
           "Установлен" / "Не установлен" / "Не указано".

        8. penalty_for_late_supply_display:
           "Установлена" / "Не установлена" / "Не указано".

        9. penalty_for_non_presentation_display:
           "Установлена" / "Не установлена" / "Не указано".

        10. application_procedure_display:
            "Установлен" / "Не установлен" / "Не указано".
        </task>

        <context_rules>
        - Перед остальными полями заполни vehicle_supply_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все поля = "not_defined" / соответствующий fallback.
        - Не путай срок подачи ТС со сроком доставки груза.
        - Не путай санкции за несвоевременную подачу с неустойкой за просрочку доставки.
        - Если санкция упомянута, но ставка не названа — соответствующее поле = "yes".
        - Не используй "None", "null" или пустые строки.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет упоминания сроков подачи ТС, заявок или санкций за неподачу.
           → presence = "missing";
             vehicle_supply_deadline = "not_defined";
             все остальные поля = "not_defined";
             все *_display = соответствующий fallback.

        2. Подача ТС установлена, но санкций нет.
           "Перевозчик обязан подать ТС в срок, указанный в заявке."
           → presence = "present";
             vehicle_supply_deadline = "в срок, указанный в заявке";
             penalty_for_late_supply = "not_defined";
             penalty_for_non_presentation = "not_defined".

        3. Противоречие между фрагментами.
           В одном пункте штраф 10 000 руб., в другом — 15 000 руб.
           → presence = "unclear";
             penalty_for_late_supply = "not_defined";
             penalty_for_late_supply_display = "Не указано".

        4. Неустойка за просрочку доставки ≠ просрочка подачи ТС.
           "За просрочку доставки груза перевозчик уплачивает пени."
           → presence = "missing";
             все поля = "not_defined"
             (это просрочка доставки груза, не просрочка подачи ТС).
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для vehicle_supply_check_presence используй только: "present", "missing", "unclear".
        - Для notification_procedure, penalty_for_late_supply, penalty_for_non_presentation, application_procedure используй только: "yes", "no", "not_defined".
        - Fallback при отсутствии данных:
          * vehicle_supply_deadline, vehicle_supply_snippet → "not_defined";
          * все *_display → "Не указано".
        - Fallback при противоречии или неоднозначности:
          * все *_display → "Не указано".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "vehicle_supply_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие условий о подаче ТС. Внутреннее агрегатное signal-поле."
          required: true

        - name: "notification_procedure"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Порядок уведомления о подаче ТС установлен. Внутреннее enum-поле."
          required: true
          display_in_grid: false
        - name: "penalty_for_late_supply"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Санкция за несвоевременную подачу ТС. Внутреннее enum-поле."
          required: true
          display_in_grid: false
        - name: "penalty_for_non_presentation"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Санкция за непредъявление груза. Внутреннее enum-поле."
          required: true
          display_in_grid: false
        - name: "application_procedure"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Порядок подачи заявок установлен. Внутреннее enum-поле."
          required: true
          display_in_grid: false
        - name: "vehicle_supply_deadline"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 1
          label: "Срок подачи ТС"
          description: >
            Срок подачи ТС под погрузку. Fallback: "Не установлено" / "Не удалось определить".
          required: true
        - name: "vehicle_supply_snippet"
          type: "string"
          presentation: "diagnostic"
          display_in_grid: false
          description: "Цитата о подаче ТС"
          required: true
        - name: "notification_procedure_display"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 2
          label: "Уведомление о подаче"
          description: >
            User-friendly отображение: установлен ли порядок уведомления о подаче ТС. Fallback: "Не установлено" / "Не удалось определить".
          required: true
        - name: "penalty_for_late_supply_display"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 3
          label: "Санкция за неподачу"
          description: >
            User-friendly отображение: установлена ли санкция за несвоевременную подачу ТС. Fallback: "Не установлено" / "Не удалось определить".
          required: true
        - name: "penalty_for_non_presentation_display"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 4
          label: "Санкция за непредъявление"
          description: >
            User-friendly отображение: установлена ли санкция за непредъявление груза. Fallback: "Не установлено" / "Не удалось определить".
          required: true
        - name: "application_procedure_display"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 5
          label: "Порядок заявок"
          description: >
            User-friendly отображение: установлен ли порядок подачи заявок на перевозку. Fallback: "Не установлено" / "Не удалось определить".
          required: true
      store_payload: true

  - id: shipper_obligations_and_warranties_check
    name: "Обязанности и заверения грузоотправителя (ст. 791, 10 УАТ)"
    description: >
      Проверяет обязанности грузоотправителя по подготовке груза,
      предоставлению документов, упаковке и маркировке, а также заверения
      о достоверности сведений и ответственность за их недостоверность.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "грузоотправитель обязан"
        - "достоверность сведений"
        - "подготовка груза"
        - "предоставление документов"
        - "сведения о грузе"
        - "свойства груза"
        - "вес груза"
        - "упаковка"
        - "маркировка"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)грузоотправител.*обязан"
        - "(?i)достоверност.*сведени"
        - "(?i)ответственност.*грузоотправител.*за.*сведени"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по транспортным договорам.
        Анализируется договор перевозки груза.
        Проверяются только обязанности и заверения грузоотправителя.

        Нормативный ориентир:
        - ст. 791 ГК РФ
        - ст. 10 УАТ (ФЗ-259)

        [ЗАДАЧА]
        Установи:
        1. Установлена ли обязанность грузоотправителя подготовить груз.
        2. Есть ли заверение о достоверности сведений о грузе.
        3. Установлена ли обязанность предоставить документы на груз.
        4. Установлены ли обязанности по упаковке и маркировке.
        5. Определена ли ответственность за недостоверные данные.
        6. Оцени полноту перечня обязанностей по тексту.
        7. Приведи точную цитату из договора.
        8. Сформируй user-friendly значения для отображения в DD Grid.

        [ПРАВИЛА]
        1. Используй только текст договора.
        2. Словарь полноты shipper_obligations_completeness:
          - "comprehensive" — установлены 4 и более видов обязанностей
          - "partial" — установлены 2–3 вида обязанностей
          - "minimal" — установлен 1 вид обязанностей
          - "absent" — обязанности грузоотправителя в тексте не установлены
        3. Не считай обязанности перевозчика обязанностями грузоотправителя.
        4. Если ответственность за недостоверные данные описана без конкретики — false_data_liability = "not_defined", а не "specified".
        5. Не используй "None", "null" или пустые строки — используй "not_defined" / "absent".
        6. В shipper_obligations_snippet включай только цитату из договора.
        7. Для *_display полей используй понятные русские формулировки:
          - shipper_obligations_completeness_display:
            * comprehensive → "Полный перечень"
            * partial → "Частичный перечень"
            * minimal → "Минимальный перечень"
            * absent → "Не установлены"
          - false_data_liability_display:
            * specified → "Установлена"
            * not_defined → "Не установлена"
        8. Верни РОВНО один JSON-объект со всеми 10 ключами без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — полный перечень обязанностей:
        Фрагмент:
        "Грузоотправитель обязан передать груз в упаковке, обеспечивающей сохранность, указать достоверные сведения о весе и свойствах груза и передать все необходимые документы."

        Ответ:
        {
          "shipper_cargo_preparation_duty": "present",
          "shipper_data_accuracy_warranty": "present",
          "shipper_document_provision_duty": "present",
          "shipper_packaging_duty": "present",
          "shipper_marking_duty": "absent",
          "false_data_liability": "not_defined",
          "shipper_obligations_completeness": "comprehensive",
          "shipper_obligations_snippet": "Грузоотправитель обязан передать груз в упаковке, обеспечивающей сохранность, указать достоверные сведения о весе и свойствах груза и передать все необходимые документы.",
          "shipper_obligations_completeness_display": "Полный перечень",
          "false_data_liability_display": "Не установлена"
        }

        Пример 2 — обязанности не упомянуты:
        Фрагмент:
        "Перевозчик доставляет груз в пункт назначения за установленную плату."

        Ответ:
        {
          "shipper_cargo_preparation_duty": "absent",
          "shipper_data_accuracy_warranty": "absent",
          "shipper_document_provision_duty": "absent",
          "shipper_packaging_duty": "absent",
          "shipper_marking_duty": "absent",
          "false_data_liability": "not_defined",
          "shipper_obligations_completeness": "absent",
          "shipper_obligations_snippet": "not_defined",
          "shipper_obligations_completeness_display": "Не установлены",
          "false_data_liability_display": "Не установлена"
        }

        Пример 3 — текст есть, но вывод невозможен (размытая формулировка без конкретики):
        Фрагмент:
        "Грузоотправитель обеспечивает надлежащее исполнение обязательств по договору в части, касающейся передачи груза."

        Ответ:
        {
          "shipper_cargo_preparation_duty": "not_defined",
          "shipper_data_accuracy_warranty": "not_defined",
          "shipper_document_provision_duty": "not_defined",
          "shipper_packaging_duty": "not_defined",
          "shipper_marking_duty": "not_defined",
          "false_data_liability": "not_defined",
          "shipper_obligations_completeness": "absent",
          "shipper_obligations_snippet": "Грузоотправитель обеспечивает надлежащее исполнение обязательств по договору в части, касающейся передачи груза.",
          "shipper_obligations_completeness_display": "Не установлены",
          "false_data_liability_display": "Не установлена"
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        Перед ответом внутренне проверь:
        1. Относится ли каждая обязанность именно к грузоотправителю.
        2. Есть ли прямая цитата для каждого значения "present".
        3. Соответствуют ли значения допустимым словарям.
        4. Если прямого указания нет — верни "absent" / "not_defined".
        5. Все 10 ключей присутствуют в JSON.

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь РОВНО одним JSON-объектом без какого-либо дополнительного текста до или после, со всеми 10 ключами:
        {
          "shipper_cargo_preparation_duty": "<present / absent / not_defined>",
          "shipper_data_accuracy_warranty": "<present / absent / not_defined>",
          "shipper_document_provision_duty": "<present / absent / not_defined>",
          "shipper_packaging_duty": "<present / absent / not_defined>",
          "shipper_marking_duty": "<present / absent / not_defined>",
          "false_data_liability": "<specified / not_defined>",
          "shipper_obligations_completeness": "<comprehensive / partial / minimal / absent>",
          "shipper_obligations_snippet": "<точная цитата или not_defined>",
          "shipper_obligations_completeness_display": "<Полный перечень / Частичный перечень / Минимальный перечень / Не установлены>",
          "false_data_liability_display": "<Установлена / Не установлена>"
        }
      context_k: 5
      temperature: 0.0
      max_tokens: 550
    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "грузоотправитель обязан достоверность сведений подготовка груза предоставление документов сведения о грузе свойства груза вес груза упаковка маркировка"
      preferred_unit_types:
        - warranty
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - representations
        - obligations
      negative_keywords:
        - "провозная плата"
        - "претензия"
        - "форс-мажор"
        - "неустойка"
      position_bias:
        preferred_range: [0.0, 0.90]
        boost: 0.15
        scope: auto
      retrieval_profile: "warranties_check"
      context_k: 5
      max_chunks: 8
      rerank: true
    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
        - "invoice"
      preferred_clause_functions:
        - "representations"
        - "obligations"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10
    evidence:
      required: true
      min_snippet_length: 35
      max_snippet_length: 550
    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1100

      compact_output: false

      presence_signal:
        field: "shipper_obligations_and_warranties_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист по транспортным договорам.
        Извлеки только обязанности и заверения грузоотправителя:
        подготовка груза, документы, упаковка, маркировка, достоверность сведений.
        Не анализируй обязанности перевозчика, цену, сроки и иные разделы.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. shipper_obligations_and_warranties_check_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если shipper_obligations_completeness ≠ "absent";
           - "missing" — если shipper_obligations_completeness = "absent"
             и фрагментов об обязанностях грузоотправителя в контексте нет;
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - shipper_cargo_preparation_duty = "absent";
           - shipper_data_accuracy_warranty = "absent";
           - shipper_document_provision_duty = "absent";
           - shipper_packaging_duty = "absent";
           - shipper_marking_duty = "absent";
           - false_data_liability = "not_defined";
           - shipper_obligations_completeness = "absent";
           - shipper_obligations_snippet = "not_defined";
           - все *_display = соответствующий fallback;
           - не выполняй остальные шаги.

        1. shipper_cargo_preparation_duty:
           - "present" — если установлена обязанность по подготовке груза к перевозке;
           - "absent" — если обязанность отсутствует;
           - "not_defined" — если обязанность упомянута, но не раскрыта конкретно.

        2. shipper_data_accuracy_warranty:
           - "present" — если установлено заверение о достоверности сведений о грузе;
           - "absent" — если заверение отсутствует;
           - "not_defined" — если заверение упомянуто, но не раскрыто конкретно.

        3. shipper_document_provision_duty:
           - "present" — если установлена обязанность предоставить документы на груз;
           - "absent" — если обязанность отсутствует;
           - "not_defined" — если обязанность упомянута, но не раскрыта конкретно.

        4. shipper_packaging_duty:
           - "present" — если установлена обязанность грузоотправителя упаковать груз;
           - "absent" — если обязанность отсутствует;
           - "not_defined" — если обязанность упомянута, но не раскрыта конкретно.

        5. shipper_marking_duty:
           - "present" — если установлена обязанность промаркировать груз;
           - "absent" — если обязанность отсутствует;
           - "not_defined" — если обязанность упомянута, но не раскрыта конкретно.

        6. false_data_liability:
           - "specified" — если прямо установлена ответственность (штраф, возмещение ущерба)
             за предоставление недостоверных данных о грузе;
           - "not_defined" — если ответственность прямо не предусмотрена или указана абстрактно.

        7. shipper_obligations_completeness:
           Оцени полноту перечня обязанностей:
           - "comprehensive" — если установлены 4 и более видов обязанностей;
           - "partial" — если установлены 2–3 вида обязанностей;
           - "minimal" — если установлен 1 вид обязанностей;
           - "absent" — если обязанности грузоотправителя в тексте не установлены.

        8. shipper_obligations_snippet:
           Точная цитата из договора. Если нет — "not_defined".

        9. shipper_obligations_completeness_display:
           "Полный перечень" / "Частичный перечень" / "Минимальный перечень" / "Не установлены".

        10. false_data_liability_display:
            "Установлена" — если false_data_liability = "specified", иначе "Не установлена".
        </task>

        <context_rules>
        - Перед остальными полями заполни shipper_obligations_and_warranties_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все поля = "absent" / "not_defined" / соответствующий fallback.
        - Не приписывай обязанности перевозчика грузоотправителю.
        - Полноту оценивай строго по числу установленных видов обязанностей (comprehensive/partial/minimal/absent).
        - Не используй "None", "null" или пустые строки.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет никаких обязанностей или заверений грузоотправителя.
           → presence = "missing";
             shipper_obligations_completeness = "absent";
             все *_duty = "absent".

        2. Частичные обязанности.
           "Грузоотправитель обязан только предоставить накладную."
           → presence = "present";
             shipper_document_provision_duty = "present";
             shipper_obligations_completeness = "minimal".

        3. Противоречие между фрагментами.
           В одном месте упаковка за счёт грузоотправителя, в другом — за счёт перевозчика.
           → presence = "unclear";
             shipper_packaging_duty = "not_defined";
             shipper_obligations_completeness_display = "Не установлены".

        4. Обязанности перевозчика ≠ обязанности грузоотправителя.
           "Перевозчик обязан проверить упаковку груза перед выездом."
           → presence = "missing";
             shipper_packaging_duty = "absent"
             (это обязанность перевозчика, а не грузоотправителя).
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для shipper_obligations_and_warranties_check_presence используй только: "present", "missing", "unclear".
        - Для *_duty используй только: "present", "absent", "not_defined".
        - Для false_data_liability используй только: "specified", "not_defined".
        - Для shipper_obligations_completeness используй только: "comprehensive", "partial", "minimal", "absent".
        - Fallback при отсутствии данных:
          * shipper_obligations_snippet → "not_defined";
          * shipper_obligations_completeness_display → "Не установлены";
          * false_data_liability_display → "Не установлена".
        - Fallback при противоречии или неоднозначности:
          * все *_display → "Не установлены" / "Не установлена".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "shipper_obligations_and_warranties_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие условий об обязанностях грузоотправителя. Внутреннее агрегатное signal-поле."
          required: true

        - name: "shipper_cargo_preparation_duty"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["present", "absent", "not_defined"]
          description: "Обязанность подготовить груз. Внутреннее enum-поле."
          required: true
          display_in_grid: false
        - name: "shipper_data_accuracy_warranty"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["present", "absent", "not_defined"]
          description: "Заверение о достоверности сведений. Внутреннее enum-поле."
          required: true
          display_in_grid: false
        - name: "shipper_document_provision_duty"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["present", "absent", "not_defined"]
          description: "Обязанность предоставить документы. Внутреннее enum-поле."
          required: true
          display_in_grid: false
        - name: "shipper_packaging_duty"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["present", "absent", "not_defined"]
          description: "Обязанность по упаковке. Внутреннее enum-поле."
          required: true
          display_in_grid: false
        - name: "shipper_marking_duty"
          type: "string"
          presentation: "signal"
          risk_weight: "low"
          allowed_values: ["present", "absent", "not_defined"]
          description: "Обязанность по маркировке. Внутреннее enum-поле."
          required: true
          display_in_grid: false
        - name: "false_data_liability"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
