          risk_weight: "medium"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Пропуска/разрешения упоминаются. Внутреннее enum-поле."
          required: true
          display_in_grid: false
        - name: "cost_allocation_defined"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Распределение расходов определено. Внутреннее enum-поле."
          required: true
          display_in_grid: false
        - name: "seasonal_restrictions_snippet"
          type: "string"
          presentation: "diagnostic"
          display_in_grid: false
