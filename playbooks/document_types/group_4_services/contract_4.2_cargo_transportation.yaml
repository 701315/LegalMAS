  - id: freight_charge
    name: "Провозная плата и порядок расчётов (ст. 790 ГК РФ)"
    description: >
      Проверяет наличие размера провозной платы, тарифов, порядка оплаты,
      валюты расчётов и налоговых оговорок. Проверка предназначена для
      точного извлечения условий оплаты без подстановки диспозитивных норм
      закона вместо текста договора.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "провозная плата"
        - "стоимость перевозки"
        - "тариф"
        - "фрахт"
        - "цена перевозки"
        - "рублей"
        - "оплата"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)провозн(ая|ой)\\s+плат"
        - "(?i)стоимост(ь|и)\\s+перевозк"
        - "(?i)\\b\\d[\\d\\s]*(?:руб|рублей|₽|тыс|млн)"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по транспортным договорам.
        Анализируется договор перевозки груза по ст. 785–797 ГК РФ и применимым транспортным уставам.
        Проверяется только один вопрос: как в договоре урегулирована провозная плата и порядок расчётов.

        Нормативный ориентир:
        - ст. 790 ГК РФ

        Важно:
        - Твоя задача — не оценивать справедливость цены.
        - Твоя задача — только извлечь, что прямо сказано в тексте договора.
        - Не подставляй нормы закона вместо отсутствующего текста договора.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Установлен ли размер провозной платы / тарифа / фрахта.
        2. В какой валюте выражена цена.
        3. Включён ли НДС в цену или цена указана без НДС.
        4. Установлен ли срок оплаты.
        5. Какой порядок оплаты предусмотрен: предоплата, постоплата, частичная оплата или иной порядок.
        6. Приведи точную цитату из договора.
        7. Сформируй user-friendly значения для отображения в DD Grid.

        [ПРАВИЛА]
        1. Используй только текст договора.
        2. Не делай предположений на основании обычая делового оборота.
        3. Если условие прямо не сформулировано — возвращай "not_defined".
        4. Не заменяй отсутствие договорной цены ссылкой на "обычно взимаемую цену".
        5. Если в договоре есть несколько фрагментов, используй более конкретный и прямой.
        6. Если указано только "по тарифам перевозчика", это не является конкретной суммой, но является условием о порядке формирования цены:
          - freight_amount = "по тарифам перевозчика"
          - payment_method = "tariff_based"
        7. В freight_snippet включай только цитату из договора.
        8. Для *_display полей используй понятные русские формулировки:
          - freight_currency: RUB → "Рубли (RUB)", USD → "Доллары (USD)", EUR → "Евро (EUR)", other → "Иная валюта", not_defined → "Не указана"
          - price_includes_vat: yes → "Включён", no → "Не включён", zero_rate → "Нулевая ставка (0%)", not_defined → "Не указано"
          - payment_method: prepayment → "Предоплата", postpayment → "Постоплата", partial → "Частичная оплата", tariff_based → "По тарифам перевозчика", other → "Иной порядок", not_defined → "Не указан"
        9. Верни РОВНО один JSON-объект со всеми 9 ключами без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — все условия указаны:
