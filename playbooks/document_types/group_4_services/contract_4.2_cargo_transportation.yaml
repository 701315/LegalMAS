          display_in_grid: true
          display_priority: 2
          label: "Порядок подачи заявок"
          description: >
            User-friendly отображение: установлен ли порядок подачи заявок. Fallback: "Не установлено" / "Не удалось определить".
          required: true
        - name: "application_form_display"
          type: "string"
