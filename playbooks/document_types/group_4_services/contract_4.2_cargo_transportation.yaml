           → presence = "present";
             vehicle_condition_required = "not_defined";
             vehicle_type_specified = "yes".

        3. Противоречие между фрагментами.
           В одном месте перевозчик обязуется подавать только ТС не старше 3-х лет, в другом — допускается использование любых ТС.
           → presence = "unclear";
             vehicle_condition_required = "not_defined";
             vehicle_condition_required_display = "Не указано".

        4. Ответственность за поломки без требований к типу ТС.
           "При технической неисправности ТС в пути перевозчик за свой счёт производит перегрузку груза в другое исправное ТС."
           → presence = "present";
             breakdown_liability = "yes";
             vehicle_condition_required = "not_defined";
             vehicle_type_specified = "not_defined".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для vehicle_condition_presence используй только: "present", "missing", "unclear".
        - Для vehicle_condition_required, vehicle_type_specified, breakdown_liability используй только: "yes", "no", "not_defined".
        - Fallback при отсутствии данных:
          * vehicle_snippet → "not_defined";
          * все *_display → соответствующие fallback-строки.
        - Fallback при противоречии или неоднозначности:
          * все *_display → соответствующие fallback-строки.
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
