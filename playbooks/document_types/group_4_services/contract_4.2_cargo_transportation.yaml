  - id: cargo_escort_terms
    name: "Сопровождение и охрана груза"
    description: >
      Проверяет условия сопровождения груза представителем клиента,
      охраной или иным сопровождающим лицом, а также распределение расходов.
      Специфический check для транспортных договоров с ценными, опасными
      или особо охраняемыми грузами.
    triggers:
      any: ["cargo_escort"]
    ui_mode: "field_extraction"
    severity: "medium"
    severity_if_pass: "pass"
    severity_if_fail: "medium"
    severity_if_unclear: "low"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "сопровождение груза"
        - "охрана груза"
        - "представитель грузоотправителя"
        - "вооружённая охрана"
        - "экспедирование"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)сопровожден(ие|ия)\\s+груз"
        - "(?i)охран(а|ы)\\s+груз"
        - "(?i)вооруж(ённ|енн)\\s+охран"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по транспортным договорам.
        Анализируется договор перевозки груза.
        Проверяются ТОЛЬКО условия сопровождения и охраны груза.

        [ЗАДАЧА]
        Установи:
        1. Требуется ли сопровождение груза.
        2. Какой тип сопровождения предусмотрен.
        3. Кто оплачивает сопровождение.
        4. Есть ли обязательность охраны для отдельных грузов.
        5. Приведи точную цитату из договора.
        6. Сформируй user-friendly значения для отображения в DD Grid.

        [ПРАВИЛА]
        1. Используй только текст договора.
        2. Не путай охрану груза с общей ответственностью за сохранность.
        3. Если сопровождение только допускается — escort_required = "optional".
        4. Если сопровождение не упомянуто — escort_required = "not_defined".
        5. Не используй "None", "null" или пустые строки — используй "not_defined".
        6. В escort_snippet включай только цитату из договора.
        7. Для *_display полей используй понятные русские формулировки:
          - escort_required: yes → "Требуется", no → "Не требуется", optional → "По согласованию", not_defined → "Не указано"
          - escort_type:
            * shipper_representative → "Представитель грузоотправителя"
            * armed_guard → "Вооружённая охрана"
            * other → "Иное сопровождение"
            * not_defined → "Не указан"
          - cost_allocation: shipper → "Грузоотправитель", carrier → "Перевозчик", not_defined → "Не указано"
          - special_cases_defined: yes → "Есть", no → "Нет", not_defined → "Не указано"
        8. Верни РОВНО один JSON-объект со всеми 9 ключами без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — сопровождение обязательно с вооружённой охраной:
        Фрагмент:
        "Перевозка ценного груза осуществляется с обязательным сопровождением вооружённой охраной. Расходы на сопровождение несёт Грузоотправитель. Перевозчик обязан обеспечить наличие не менее двух вооружённых охранников на каждом транспортном средстве."

        Ответ:
        {
          "escort_required": "yes",
          "escort_type": "armed_guard",
          "cost_allocation": "shipper",
          "special_cases_defined": "yes",
          "escort_snippet": "Перевозка ценного груза осуществляется с обязательным сопровождением вооружённой охраной. Расходы на сопровождение несёт Грузоотправитель. Перевозчик обязан обеспечить наличие не менее двух вооружённых охранников на каждом транспортном средстве.",
          "escort_required_display": "Требуется",
          "escort_type_display": "Вооружённая охрана",
          "cost_allocation_display": "Грузоотправитель",
          "special_cases_defined_display": "Есть"
        }

        Пример 2 — условия не упомянуты:
        Фрагмент:
        "Перевозчик обязуется доставить груз в пункт назначения в установленный срок."

        Ответ:
        {
          "escort_required": "not_defined",
          "escort_type": "not_defined",
          "cost_allocation": "not_defined",
          "special_cases_defined": "not_defined",
          "escort_snippet": "not_defined",
          "escort_required_display": "Не указано",
          "escort_type_display": "Не указан",
          "cost_allocation_display": "Не указано",
          "special_cases_defined_display": "Не указано"
        }

        Пример 3 — edge-case: сопровождение допускается, но не обязательно:
        Фрагмент:
        "Грузоотправитель вправе направить своего представителя для сопровождения груза. Расходы на проезд и проживание представителя несёт Грузоотправитель."

        Ответ:
        {
          "escort_required": "optional",
          "escort_type": "shipper_representative",
          "cost_allocation": "shipper",
          "special_cases_defined": "no",
          "escort_snippet": "Грузоотправитель вправе направить своего представителя для сопровождения груза. Расходы на проезд и проживание представителя несёт Грузоотправитель.",
          "escort_required_display": "По согласованию",
          "escort_type_display": "Представитель грузоотправителя",
          "cost_allocation_display": "Грузоотправитель",
          "special_cases_defined_display": "Нет"
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        Перед ответом внутренне проверь:
        1. Есть ли прямая цитата о сопровождении или охране груза (не просто "ответственность за сохранность").
        2. Не путаешь ли ты охрану груза с общей ответственностью перевозчика.
        3. Конкретизирован ли тип сопровождения.
        4. Если прямого указания нет — верни "not_defined".
        5. Все 9 ключей присутствуют в JSON.

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь РОВНО одним JSON-объектом без какого-либо дополнительного текста до или после, со всеми 9 ключами:
        {
          "escort_required": "<yes / no / optional / not_defined>",
          "escort_type": "<shipper_representative / armed_guard / other / not_defined>",
          "cost_allocation": "<shipper / carrier / not_defined>",
          "special_cases_defined": "<yes / no / not_defined>",
          "escort_snippet": "<точная цитата или not_defined>",
          "escort_required_display": "<Требуется / Не требуется / По согласованию / Не указано>",
          "escort_type_display": "<Представитель грузоотправителя / Вооружённая охрана / Иное сопровождение / Не указан>",
          "cost_allocation_display": "<Грузоотправитель / Перевозчик / Не указано>",
          "special_cases_defined_display": "<Есть / Нет / Не указано>"
        }
      context_k: 4
      temperature: 0.0
      max_tokens: 600
