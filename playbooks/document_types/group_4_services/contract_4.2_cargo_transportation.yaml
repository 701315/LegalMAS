      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1100

      compact_output: false

      presence_signal:
        field: "cargo_and_route_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист по транспортным договорам.
        Извлеки предмет перевозки: груз и маршрут.
        Не анализируй цену, сроки, ответственность и иные разделы.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. cargo_and_route_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей (cargo_description, origin_point, destination_point) ≠ "not_defined"
             (включая рамочный договор, где параметры отсылают к заявкам/приложениям);
           - "missing" — если все три указанных поля = "not_defined" и фрагментов в контексте нет;
           - "unclear" — если фрагменты по теме есть, но из-за противоречий вывод невозможен.

           Если presence = "missing":
           - cargo_description = "not_defined";
           - cargo_weight = "not_defined";
           - origin_point = "not_defined";
           - destination_point = "not_defined";
           - route_defined = "not_defined";
           - transport_mode = "not_defined";
           - contract_type = "not_defined";
           - cargo_route_snippet = "not_defined";
           - все *_display = соответствующий fallback;
           - не выполняй остальные шаги.

        1. cargo_description:
           Наименование и характер перевозимого груза (например: "строительные материалы").
           Если не указаны — "not_defined".

        2. cargo_weight:
           Вес, объем груза или количество грузовых мест.
           Если не указаны — "not_defined".

        3. origin_point:
           Пункт отправления / адрес погрузки груза.
           Если не указан — "not_defined".

        4. destination_point:
           Пункт назначения / адрес выгрузки груза.
           Если не указан — "not_defined".

        5. route_defined:
           - "yes" — если пункты отправления и назначения прямо определены в договоре;
           - "no" — если маршрут не определён;
           - "partial" — если определён только один пункт (отправления или назначения);
           - "not_defined" — если маршрут в договоре отсутствует.

        6. transport_mode:
           - "road" — автомобильный;
           - "rail" — железнодорожный;
           - "sea" — морской;
           - "air" — воздушный;
           - "inland_water" — внутренний водный;
           - "multimodal" — мультимодальный;
           - "not_defined" — вид транспорта не указан.

        7. contract_type:
           - "single" — разовая перевозка конкретного груза;
           - "framework" — рамочный договор / договор об организации перевозок;
           - "not_defined" — характер договора неясен.

        8. cargo_route_snippet:
           Точная цитата из договора о грузе и маршруте. Если нет — "not_defined".

        9. route_defined_display:
           "Определён" / "Не определён" / "Частично" / "Не указано".

        10. transport_mode_display:
            "Автомобильный" / "Железнодорожный" / "Морской" / "Воздушный" / "Внутренний водный" / "Мультимодальный" / "Не указан".

        11. contract_type_display:
            "Разовая перевозка" / "Рамочный договор" / "Не указан".
        </task>

        <context_rules>
        - Перед остальными полями заполни cargo_and_route_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все поля = "not_defined" / соответствующий fallback.
        - Не делай выводов о маршруте на основе юридических адресов сторон, если они прямо не указаны как пункты погрузки/выгрузки.
        - Если маршрут/груз прямо определяются спецификацией, приложением или заявкой, и это видно из текста, считай параметр определённым ( contract_type = "framework").
        - Не используй "None", "null" или пустые строки.
        - Все 11 ключей должны присутствовать в JSON-ответе.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В договоре нет ни описания груза, ни маршрута.
           → presence = "missing";
             cargo_description = "not_defined";
             route_defined = "not_defined".

        2. Только абстрактная роль груза.
           "Перевозчик перевозит вверенный ему Грузоотправителем груз..."
           → presence = "present";
             cargo_description = "not_defined";
             route_defined = "not_defined".

        3. Противоречие между фрагментами.
           В одном месте указан пункт назначения Казань, в другом — Самара.
           → presence = "unclear";
             route_defined = "not_defined";
             route_defined_display = "Не указано".

        4. Рамочный договор с отсылкой к заявкам.
           "Наименование груза и маршрут согласовываются сторонами в заявках."
           → presence = "present";
             cargo_description = "определяется заявками";
             route_defined = "yes" (через механизм заявок);
             contract_type = "framework".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для cargo_and_route_presence используй только: "present", "missing", "unclear".
        - Для route_defined используй только: "yes", "no", "partial", "not_defined".
        - Для transport_mode используй только: "road", "rail", "sea", "air", "inland_water", "multimodal", "not_defined".
        - Для contract_type используй только: "single", "framework", "not_defined".
        - Fallback при отсутствии данных:
          * все текстовые поля → "not_defined";
          * route_defined_display → "Не указано";
          * transport_mode_display → "Не указан";
          * contract_type_display → "Не указан".
        - Fallback при противоречии или неоднозначности:
          * все *_display → соответствующие fallback-строки.
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "cargo_and_route_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие условий о предмете и маршруте. Внутреннее агрегатное signal-поле."
          required: true

        - name: "route_defined"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["yes", "no", "partial", "not_defined"]
          description: "Маршрут определён. Внутреннее enum-поле."
          required: true
          display_in_grid: false
        - name: "transport_mode"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["road", "rail", "sea", "air", "inland_water", "multimodal", "not_defined"]
          description: "Вид транспорта. Внутреннее enum-поле."
          required: true
          display_in_grid: false
        - name: "contract_type"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["single", "framework", "not_defined"]
          description: "Тип договора (разовый/рамочный). Внутреннее enum-поле."
          required: true
          display_in_grid: false
        - name: "cargo_description"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 1
          label: "Описание груза"
          description: >
            Описание груза. Fallback: "Не установлено" / "Не удалось определить".
          required: true
        - name: "cargo_weight"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 2
          label: "Вес/объём груза"
          description: >
            Вес, объём или количество мест. Fallback: "Не установлено" / "Не удалось определить".
          required: true
        - name: "origin_point"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 3
          label: "Пункт отправления"
          description: >
            Пункт отправления. Fallback: "Не установлено" / "Не удалось определить".
          required: true
        - name: "destination_point"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 4
          label: "Пункт назначения"
          description: >
            Пункт назначения. Fallback: "Не установлено" / "Не удалось определить".
          required: true
        - name: "cargo_route_snippet"
          type: "string"
          presentation: "diagnostic"
          display_in_grid: false
          description: "Цитата о грузе и маршруте"
          required: true
        - name: "route_defined_display"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 5
          label: "Маршрут"
          description: >
            User-friendly отображение: определён ли маршрут. Fallback: "Не установлено" / "Не удалось определить".
          required: true
        - name: "transport_mode_display"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 6
          label: "Вид транспорта"
          description: >
            User-friendly отображение вида транспорта. Fallback: "Не установлено" / "Не удалось определить".
          required: true
        - name: "contract_type_display"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 7
          label: "Тип договора"
          description: >
            User-friendly отображение типа договора (разовый/рамочный). Fallback: "Не установлено" / "Не удалось определить".
          required: true
      store_payload: true

  - id: delivery_deadline
    name: "Срок доставки груза (ст. 792 ГК РФ)"
    description: >
      Проверяет наличие срока доставки груза, его вид и формулировку.
      Без договорного срока сложно оценить просрочку и связанные санкции.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "срок доставки"
        - "дата доставки"
        - "доставить в течение"
        - "не позднее"
        - "транзитное время"
        - "время в пути"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)срок\\s+доставк"
        - "(?i)доставить.*в\\s+течение\\s+\\d+"
        - "(?i)не\\s+позднее\\s+\\d+"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по транспортным договорам.
        Анализируется договор перевозки груза.
        Проверяется только условие о сроке доставки.

        Нормативный ориентир:
        - ст. 792 ГК РФ

        [ЗАДАЧА]
        Установи:
        1. Есть ли в тексте договорный срок доставки.
        2. Как этот срок сформулирован.
        3. В каком виде он задан:
          - календарная дата
          - срок в днях
          - транзитное время
          - иная формулировка
        4. Приведи точную цитату из договора.
        5. Сформируй user-friendly значение для типа срока.

        [ПРАВИЛА]
        1. Используй только текст договора.
        2. Если срок прямо не указан — ставь "not_defined".
        3. Не подставляй обычный срок доставки по закону или практике.
        4. В delivery_deadline_snippet включай только цитату из договора.
        5. Для deadline_type_display используй понятные русские формулировки:
          - calendar_date → "Календарная дата"
          - days_from_loading → "Срок в днях от погрузки"
          - transit_time → "Транзитное время"
          - other → "Иная формулировка"
          - not_defined → "Не указан"
        6. Верни РОВНО один JSON-объект со всеми 5 ключами без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — срок указан как календарная дата:
        Фрагмент:
        "Перевозчик обязуется доставить груз в пункт назначения не позднее 20 сентября 2026 года."

        Ответ:
        {
          "delivery_deadline_present": "yes",
          "delivery_deadline_value": "не позднее 20 сентября 2026 года",
          "deadline_type": "calendar_date",
          "delivery_deadline_snippet": "Перевозчик обязуется доставить груз в пункт назначения не позднее 20 сентября 2026 года.",
          "deadline_type_display": "Календарная дата"
        }

        Пример 2 — срок указан в днях от погрузки:
        Фрагмент:
        "Срок доставки груза составляет 5 (пять) рабочих дней с даты принятия груза к перевозке."

        Ответ:
        {
          "delivery_deadline_present": "yes",
          "delivery_deadline_value": "5 рабочих дней с даты принятия груза к перевозке",
          "deadline_type": "days_from_loading",
          "delivery_deadline_snippet": "Срок доставки груза составляет 5 (пять) рабочих дней с даты принятия груза к перевозке.",
          "deadline_type_display": "Срок в днях от погрузки"
        }

        Пример 3 — срок не упомянут:
        Фрагмент:
        "Перевозчик обязуется доставить груз в пункт назначения."

        Ответ:
        {
          "delivery_deadline_present": "no",
          "delivery_deadline_value": "not_defined",
          "deadline_type": "not_defined",
          "delivery_deadline_snippet": "not_defined",
          "deadline_type_display": "Не указан"
        }

        Пример 4 — текст есть, но вывод невозможен (размытая формулировка):
        Фрагмент:
        "Перевозка осуществляется в разумные сроки с учётом расстояния и условий перевозки."

        Ответ:
        {
          "delivery_deadline_present": "no",
          "delivery_deadline_value": "not_defined",
          "deadline_type": "not_defined",
          "delivery_deadline_snippet": "Перевозка осуществляется в разумные сроки с учётом расстояния и условий перевозки.",
          "deadline_type_display": "Не указан"
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        Перед ответом внутренне проверь:
        1. Есть ли прямая цитата о сроке доставки.
        2. Не подставил ли ты законный срок вместо договорного.
        3. Соответствует ли deadline_type допустимому словарю.
        4. Если прямого указания нет — верни "not_defined".
        5. Все 5 ключей присутствуют в JSON.

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь РОВНО одним JSON-объектом без какого-либо дополнительного текста до или после, со всеми 5 ключами:
        {
          "delivery_deadline_present": "<yes / no>",
          "delivery_deadline_value": "<текст или not_defined>",
          "deadline_type": "<calendar_date / days_from_loading / transit_time / other / not_defined>",
          "delivery_deadline_snippet": "<точная цитата или not_defined>",
          "deadline_type_display": "<Календарная дата / Срок в днях от погрузки / Транзитное время / Иная формулировка / Не указан>"
        }
      context_k: 5
      temperature: 0.0
      max_tokens: 550
    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "срок доставки дата доставки доставить в течение не позднее транзитное время время в пути"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - procedures
      negative_keywords:
        - "провозная плата"
        - "неустойка"
        - "претензия"
        - "форс-мажор"
      position_bias:
        preferred_range: [0.0, 0.80]
        boost: 0.20
        scope: auto
      retrieval_profile: "completion_deadline_check"
      context_k: 5
      max_chunks: 7
      rerank: true
    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
        - "invoice"
      preferred_clause_functions:
        - "obligations"
        - "procedures"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10
    evidence:
      required: true
      min_snippet_length: 20
      max_snippet_length: 400
    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1100

      compact_output: false

      presence_signal:
        field: "delivery_deadline_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист по транспортным договорам.
        Извлеки только условие о сроке доставки.
        Не анализируй цену, ответственность, претензии и иные разделы.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. delivery_deadline_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если delivery_deadline_present = "yes";
           - "missing" — если delivery_deadline_present = "no" и фрагментов о сроке доставки в контексте нет;
           - "unclear" — если фрагменты по теме есть, но из-за противоречий вывод невозможен.

           Если presence = "missing":
           - delivery_deadline_present = "no";
           - delivery_deadline_value = "not_defined";
           - deadline_type = "not_defined";
           - delivery_deadline_snippet = "not_defined";
           - deadline_type_display = "Не указан";
           - не выполняй остальные шаги.

        1. delivery_deadline_present:
           - "yes" — если срок доставки груза прямо установлен в договоре;
           - "no" — если срок в договоре прямо не установлен.

        2. delivery_deadline_value:
           Конкретная текстовая формулировка срока доставки из текста договора
           (например: "в течение 5 рабочих дней").
           Если не указан — "not_defined".

        3. deadline_type:
           Тип срока доставки. Используй только:
           - "calendar_date" — календарная дата;
           - "days_from_loading" — срок в днях от момента погрузки/принятия;
           - "transit_time" — транзитное время;
           - "other" — иная формулировка;
           - "not_defined" — срок не установлен.

        4. delivery_deadline_snippet:
           Точная цитата из договора со сроком доставки. Если нет — "not_defined".

        5. deadline_type_display:
           "Календарная дата" / "Срок в днях от погрузки" / "Транзитное время" / "Иная формулировка" / "Не указан".
        </task>

        <context_rules>
        - Перед остальными полями заполни delivery_deadline_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все поля = "not_defined" / соответствующий fallback.
        - Не выводи законные сроки доставки, если они отсутствуют в самом тексте договора.
        - Не используй "None", "null" или пустые строки.
        - Все 5 ключей должны присутствовать в JSON-ответе.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В договоре перевозки вообще нет упоминания срока доставки.
           → presence = "missing";
             delivery_deadline_present = "no";
             deadline_type = "not_defined".

        2. "Разумные сроки" перевозки.
           "Перевозчик осуществляет перевозку в разумные сроки."
           → presence = "present";
             delivery_deadline_present = "no" (поскольку чёткий срок отсутствует);
             delivery_deadline_value = "not_defined";
             deadline_type = "not_defined".

        3. Противоречие между фрагментами.
           В одном месте указан срок 5 дней, в другом — 10 дней для одной и той же перевозки.
           → presence = "unclear";
             delivery_deadline_present = "no";
             delivery_deadline_value = "not_defined".

        4. Отсылка на транспортный документ.
           "Сроки перевозки устанавливаются в транспортной накладной."
           → presence = "present";
             delivery_deadline_present = "yes" (срок урегулирован через механизм накладной);
             delivery_deadline_value = "согласно накладной";
             deadline_type = "other".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для delivery_deadline_presence используй только: "present", "missing", "unclear".
        - Для delivery_deadline_present используй только: "yes", "no".
        - Для deadline_type используй только: "calendar_date", "days_from_loading", "transit_time", "other", "not_defined".
        - Fallback при отсутствии данных:
          * delivery_deadline_value, delivery_deadline_snippet → "not_defined";
          * deadline_type_display → "Не указан".
        - Fallback при противоречии или неоднозначности:
          * deadline_type_display → "Не указан".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "delivery_deadline_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие условия о сроке доставки. Внутреннее агрегатное signal-поле."
          required: true

        - name: "delivery_deadline_present"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["yes", "no"]
          description: "Срок доставки установлен. Внутреннее enum-поле."
          required: true
          display_in_grid: false
        - name: "delivery_deadline_value"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 1
          label: "Срок доставки"
          description: >
            Значение срока доставки. Fallback: "Не установлено" / "Не удалось определить".
          required: true
        - name: "deadline_type"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["calendar_date", "days_from_loading", "transit_time", "other", "not_defined"]
          description: "Тип срока доставки. Внутреннее enum-поле."
          required: true
          display_in_grid: false
        - name: "delivery_deadline_snippet"
          type: "string"
          presentation: "diagnostic"
          display_in_grid: false
          description: "Цитата о сроке доставки"
          required: true
        - name: "deadline_type_display"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 2
          label: "Тип срока"
          description: >
            User-friendly отображение типа срока доставки. Fallback: "Не установлено" / "Не удалось определить".
          required: true
      store_payload: true

  - id: loading_unloading_obligations
    name: "Погрузка и выгрузка: обязанности, нормативное время"
    description: >
      Проверяет распределение обязанностей по погрузке, выгрузке, креплению
      груза и наличие нормативного времени для соответствующих операций.
      Это влияет на риск споров о простое, повреждении груза и распределении
      расходов.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "погрузка"
        - "выгрузка"
        - "нормативное время"
        - "погрузочно-разгрузочные работы"
        - "крепление груза"
        - "средства крепления"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)погруз(ка|ку|ки)"
        - "(?i)выгруз(ка|ку|ки)"
        - "(?i)нормативн(ое|ого)\\s+врем"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по транспортным договорам.
        Анализируется договор перевозки груза.
        Проверяется только вопрос распределения обязанностей по погрузке,
        выгрузке и креплению груза, а также наличие нормативного времени.

        Нормативный ориентир:
        - ст. 791 ГК РФ
        - специальные транспортные правила

        [ЗАДАЧА]
        Установи:
        1. Кто отвечает за погрузку.
        2. Кто отвечает за выгрузку.
        3. Указано ли нормативное время.
        4. Кто отвечает за крепление груза.
        5. Есть ли распределение расходов/рисков по этим операциям.
        6. Приведи точную цитату из договора.
        7. Сформируй user-friendly значения для отображения в DD Grid.

        [ПРАВИЛА]
        1. Используй только текст договора.
        2. Не подставляй типичную практику, если текст молчит.
        3. Если ответственная сторона не названа прямо — ставь "not_defined".
        4. Если сказано только, что работы выполняются, но без указания стороны — это не значит, что сторона определена.
        5. Не смешивай погрузку и выгрузку.
        6. В loading_unloading_snippet включай только цитату из договора.
        7. Для *_display полей используй понятные русские формулировки:
          - loading_responsible: carrier → "Перевозчик", shipper → "Грузоотправитель", jointly → "Совместно", not_defined → "Не указано"
          - unloading_responsible: carrier → "Перевозчик", consignee → "Грузополучатель", jointly → "Совместно", not_defined → "Не указано"
          - normative_time_present: yes → "Установлено", no → "Не установлено", not_defined → "Не указано"
          - securing_responsible: carrier → "Перевозчик", shipper → "Грузоотправитель", not_defined → "Не указано"
          - cost_allocation_defined: yes → "Определено", no → "Не определено", not_defined → "Не указано"
        8. Верни РОВНО один JSON-объект со всеми 11 ключами без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — все обязанности указаны:
        Фрагмент:
        "Погрузка груза осуществляется Грузоотправителем. Выгрузка производится Грузополучателем. Крепление груза обеспечивает Перевозчик. Нормативное время погрузки — 2 часа, выгрузки — 1 час. Расходы на погрузочно-разгрузочные работы несёт Грузоотправитель."

        Ответ:
        {
          "loading_responsible": "shipper",
          "unloading_responsible": "consignee",
          "normative_time_present": "yes",
          "securing_responsible": "carrier",
          "cost_allocation_defined": "yes",
          "loading_unloading_snippet": "Погрузка груза осуществляется Грузоотправителем. Выгрузка производится Грузополучателем. Крепление груза обеспечивает Перевозчик. Нормативное время погрузки — 2 часа, выгрузки — 1 час. Расходы на погрузочно-разгрузочные работы несёт Грузоотправитель.",
          "loading_responsible_display": "Грузоотправитель",
          "unloading_responsible_display": "Грузополучатель",
          "normative_time_present_display": "Установлено",
          "securing_responsible_display": "Перевозчик",
          "cost_allocation_defined_display": "Определено"
        }

        Пример 2 — обязанности не упомянуты:
        Фрагмент:
        "Перевозчик обязуется доставить груз в пункт назначения."

        Ответ:
        {
          "loading_responsible": "not_defined",
          "unloading_responsible": "not_defined",
          "normative_time_present": "not_defined",
          "securing_responsible": "not_defined",
          "cost_allocation_defined": "not_defined",
          "loading_unloading_snippet": "not_defined",
          "loading_responsible_display": "Не указано",
          "unloading_responsible_display": "Не указано",
          "normative_time_present_display": "Не указано",
          "securing_responsible_display": "Не указано",
          "cost_allocation_defined_display": "Не указано"
        }

        Пример 3 — текст есть, но вывод невозможен (размытая формулировка без указания стороны):
        Фрагмент:
        "Погрузочно-разгрузочные работы выполняются в соответствии с требованиями безопасности."

        Ответ:
        {
          "loading_responsible": "not_defined",
          "unloading_responsible": "not_defined",
          "normative_time_present": "not_defined",
          "securing_responsible": "not_defined",
          "cost_allocation_defined": "not_defined",
          "loading_unloading_snippet": "Погрузочно-разгрузочные работы выполняются в соответствии с требованиями безопасности.",
          "loading_responsible_display": "Не указано",
          "unloading_responsible_display": "Не указано",
          "normative_time_present_display": "Не указано",
          "securing_responsible_display": "Не указано",
          "cost_allocation_defined_display": "Не указано"
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        Перед ответом внутренне проверь:
        1. Есть ли прямая цитата о погрузке/выгрузке/креплении.
        2. Названа ли конкретная сторона для каждой обязанности.
        3. Не подставил ли ты типичную практику вместо текста договора.
        4. Если прямого указания нет — верни "not_defined".
        5. Все 11 ключей присутствуют в JSON.

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь РОВНО одним JSON-объектом без какого-либо дополнительного текста до или после, со всеми 11 ключами:
        {
          "loading_responsible": "<carrier / shipper / jointly / not_defined>",
          "unloading_responsible": "<carrier / consignee / jointly / not_defined>",
          "normative_time_present": "<yes / no / not_defined>",
          "securing_responsible": "<carrier / shipper / not_defined>",
          "cost_allocation_defined": "<yes / no / not_defined>",
          "loading_unloading_snippet": "<точная цитата или not_defined>",
          "loading_responsible_display": "<Перевозчик / Грузоотправитель / Совместно / Не указано>",
          "unloading_responsible_display": "<Перевозчик / Грузополучатель / Совместно / Не указано>",
          "normative_time_present_display": "<Установлено / Не установлено / Не указано>",
          "securing_responsible_display": "<Перевозчик / Грузоотправитель / Не указано>",
          "cost_allocation_defined_display": "<Определено / Не определено / Не указано>"
        }
      context_k: 5
      temperature: 0.0
      max_tokens: 700
    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "погрузка выгрузка нормативное время погрузочно-разгрузочные работы крепление груза средства крепления"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - procedures
      negative_keywords:
        - "провозная плата"
        - "претензия"
        - "исковая давность"
        - "форс-мажор"
      position_bias:
        preferred_range: [0.0, 0.90]
        boost: 0.15
        scope: auto
      retrieval_profile: "scope_of_work_check"
      context_k: 5
      max_chunks: 7
      rerank: true
    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
        - "invoice"
      preferred_clause_functions:
        - "obligations"
        - "procedures"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10
    evidence:
      required: true
      min_snippet_length: 20
      max_snippet_length: 450
    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1100

      compact_output: false

      presence_signal:
        field: "loading_unloading_obligations_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист по транспортным договорам.
        Извлеки только условия о погрузке, выгрузке, креплении груза и нормативном времени.
        Не анализируй цену, сроки доставки, ответственность и иные разделы.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. loading_unloading_obligations_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (loading_responsible, unloading_responsible, securing_responsible, normative_time_present) ≠ "not_defined";
           - "missing" — если все содержательные поля = "not_defined"
             и фрагментов об обязанностях погрузки/выгрузки в контексте нет;
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - loading_responsible = "not_defined";
           - unloading_responsible = "not_defined";
           - normative_time_present = "not_defined";
           - securing_responsible = "not_defined";
           - cost_allocation_defined = "not_defined";
           - loading_unloading_snippet = "not_defined";
           - все *_display = соответствующий fallback;
           - не выполняй остальные шаги.

        1. loading_responsible:
           - "carrier" — перевозчик;
           - "shipper" — грузоотправитель;
           - "jointly" — перевозчик и грузоотправитель совместно;
           - "not_defined" — ответственный за погрузку прямо не назван.

        2. unloading_responsible:
           - "carrier" — перевозчик;
           - "consignee" — грузополучатель;
           - "jointly" — перевозчик и грузополучатель совместно;
           - "not_defined" — ответственный за выгрузку прямо не назван.

        3. normative_time_present:
           - "yes" — если нормативное время на погрузку и/или выгрузку ТС установлено;
           - "no" — если прямо указано, что нормативное время не лимитируется;
           - "not_defined" — если нормативное время прямо не упомянуто.

        4. securing_responsible:
           - "carrier" — перевозчик;
           - "shipper" — грузоотправитель;
           - "not_defined" — ответственный за крепление груза прямо не назван.

        5. cost_allocation_defined:
           - "yes" — если порядок распределения расходов на погрузочно-разгрузочные работы прямо определён;
           - "no" — если распределение расходов не урегулировано;
           - "not_defined" — если вопрос расходов прямо не поднят.

        6. loading_unloading_snippet:
           Точная цитата из договора о погрузочно-разгрузочных работах. Если нет — "not_defined".

        7. loading_responsible_display:
           "Перевозчик" / "Грузоотправитель" / "Совместно" / "Не указано".

        8. unloading_responsible_display:
           "Перевозчик" / "Грузополучатель" / "Совместно" / "Не указано".

        9. normative_time_present_display:
           "Установлено" / "Не установлено" / "Не указано".

        10. securing_responsible_display:
            "Перевозчик" / "Грузоотправитель" / "Не указано".

        11. cost_allocation_defined_display:
            "Определено" / "Не определено" / "Не указано".
        </task>

        <context_rules>
        - Перед остальными полями заполни loading_unloading_obligations_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все поля = "not_defined" / соответствующий fallback.
        - Не смешивай обязанности погрузки и выгрузки.
        - Если текст говорит только о выполнении работ (например: "погрузка должна быть безопасной"), но не называет сторону, используй "not_defined".
        - Не используй "None", "null" или пустые строки.
        - Все 11 ключей должны присутствовать в JSON-ответе.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В договоре нет ни единого упоминания погрузки, выгрузки или крепления груза.
           → presence = "missing";
             loading_responsible = unloading_responsible = "not_defined";
             normative_time_present = "not_defined".

        2. Работы упоминаются, но сторона не названа.
           "Погрузочно-разгрузочные работы производятся силами квалифицированного персонала."
           → presence = "present";
             loading_responsible = "not_defined";
             unloading_responsible = "not_defined".

        3. Противоречие между фрагментами.
           В одном пункте погрузку осуществляет Перевозчик, в другом — Грузоотправитель.
           → presence = "unclear";
             loading_responsible = "not_defined";
             loading_responsible_display = "Не указано".

        4. Отсылка на внешний технический документ.
           "Обязанности по креплению и размещению груза осуществляются в соответствии с технологической картой (Приложение №3)."
           → presence = "present";
             securing_responsible = определяется по тексту Приложения, если оно приведено, иначе "not_defined";
             loading_unloading_snippet содержит цитату с отсылкой.
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для loading_unloading_obligations_presence используй только: "present", "missing", "unclear".
        - Для loading_responsible и unloading_responsible используй только: "carrier", "shipper", "consignee", "jointly", "not_defined".
        - Для normative_time_present и cost_allocation_defined используй только: "yes", "no", "not_defined".
        - Для securing_responsible используй только: "carrier", "shipper", "not_defined".
        - Fallback при отсутствии данных:
          * все текстовые поля → "not_defined";
          * все *_display → "Не указано".
        - Fallback при противоречии или неоднозначности:
          * все *_display → соответствующие fallback-строки.
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "loading_unloading_obligations_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие условий о погрузке/выгрузке. Внутреннее агрегатное signal-поле."
          required: true

        - name: "loading_responsible"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["carrier", "shipper", "jointly", "not_defined"]
          description: "Ответственный за погрузку. Внутреннее enum-поле."
          required: true
          display_in_grid: false
        - name: "unloading_responsible"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["carrier", "consignee", "jointly", "not_defined"]
          description: "Ответственный за выгрузку. Внутреннее enum-поле."
          required: true
          display_in_grid: false
        - name: "normative_time_present"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Нормативное время установлено. Внутреннее enum-поле."
          required: true
          display_in_grid: false
        - name: "securing_responsible"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["carrier", "shipper", "not_defined"]
          description: "Ответственный за крепление груза. Внутреннее enum-поле."
          required: true
