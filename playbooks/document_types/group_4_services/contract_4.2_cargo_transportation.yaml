        7. В cargo_insurance_snippet включай только цитату из договора.
        8. Для *_display полей используй понятные русские формулировки:
          - insurance_present: yes → "Предусмотрено", no → "Не предусмотрено", not_defined → "Не указано"
          - insurance_required: yes → "Обязательно", no → "Не обязательно", optional → "По согласованию", not_defined → "Не указано"
          - who_insures: shipper → "Грузоотправитель", carrier → "Перевозчик", either → "Любая сторона", not_defined → "Не указано"
          - insurance_coverage: all_risks → "От всех рисков", named_perils → "От конкретных рисков", not_defined → "Не указан"
          - beneficiary_defined: yes → "Определён", no → "Не определён", not_defined → "Не указано"
        9. Верни РОВНО один JSON-объект со всеми 13 ключами без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

