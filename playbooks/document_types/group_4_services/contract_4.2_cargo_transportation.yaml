          required: true
      store_payload: true

  - id: electronic_waybill_terms
    name: "Электронная транспортная накладная (ЭТрН)"
    description: >
      Проверяет условия использования электронной транспортной накладной (ЭТрН),
      применяемую систему ЭДО (включая ГИС ЭПД) и обязательность электронного формата.
      Специфический check для современных транспортных договоров (Приказ Минтранса № 389).
    triggers:
      any: ["electronic_waybill"]
    ui_mode: "field_extraction"
    severity: "medium"
    severity_if_pass: "pass"
    severity_if_fail: "medium"
    severity_if_unclear: "low"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "электронная транспортная накладная"
        - "ЭТрН"
        - "ГИС ЭПД"
        - "электронный документооборот"
        - "электронная подпись"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)электронн(ая|ой)\\s+транспортн"
        - "(?i)ЭТрН|ГИС\\s+ЭПД"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по транспортным договорам.
        Анализируется договор перевозки груза.
        Проверяются ТОЛЬКО условия электронной транспортной накладной (ЭТрН).

        [ЗАДАЧА]
        Установи:
        1. Упоминается ли ЭТрН / электронная транспортная накладная.
        2. Обязательна ли она или допускается как вариант.
        3. Упоминается ли конкретная платформа/система (например, ГИС ЭПД).
        4. Есть ли связь с общим электронным документооборотом (ЭДО).
        5. Приведи точную цитату из договора.
        6. Сформируй user-friendly значения для отображения в DD Grid.

        [ПРАВИЛА]
        1. Используй только текст договора.
        2. Не считай любой электронный документооборот автоматически ЭТрН.
        3. Если есть только общая ссылка на ЭДО без упоминания транспортной накладной — ewaybill_mentioned = "no".
        4. Не используй "None", "null" или пустые строки — используй "not_defined".
        5. В ewaybill_snippet включай только цитату из договора.
        6. Для *_display полей используй понятные русские формулировки:
          - ewaybill_mentioned: yes → "Упомянута", no → "Не упомянута", not_defined → "Не указано"
          - ewaybill_mandatory: yes → "Обязательна", no → "Не обязательна", optional → "По выбору сторон", not_defined → "Не указано"
          - platform_mentioned: ГИС ЭПД → "ГИС ЭПД", other → "Иная платформа", not_defined → "Не указана"
          - edo_reference_present: yes → "Есть", no → "Нет", not_defined → "Не указано"
        7. Верни РОВНО один JSON-объект со всеми 9 ключами без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — ЭТрН обязательна с указанием ГИС ЭПД:
        Фрагмент:
        "Стороны договорились об обязательном оформлении электронной транспортной накладной (ЭТрН) с использованием функционала ГИС ЭПД. Обмен документами осуществляется через оператора электронного документооборота."

        Ответ:
        {
          "ewaybill_mentioned": "yes",
          "ewaybill_mandatory": "yes",
          "platform_mentioned": "ГИС ЭПД",
          "edo_reference_present": "yes",
          "ewaybill_snippet": "Стороны договорились об обязательном оформлении электронной транспортной накладной (ЭТрН) с использованием функционала ГИС ЭПД. Обмен документами осуществляется через оператора электронного документооборота.",
          "ewaybill_mentioned_display": "Упомянута",
          "ewaybill_mandatory_display": "Обязательна",
          "platform_mentioned_display": "ГИС ЭПД",
          "edo_reference_present_display": "Есть"
        }

        Пример 2 — условия не упомянуты:
        Фрагмент:
        "Перевозчик обязуется доставить груз в пункт назначения в установленный срок."

        Ответ:
        {
          "ewaybill_mentioned": "not_defined",
          "ewaybill_mandatory": "not_defined",
          "platform_mentioned": "not_defined",
          "edo_reference_present": "not_defined",
          "ewaybill_snippet": "not_defined",
          "ewaybill_mentioned_display": "Не указано",
          "ewaybill_mandatory_display": "Не указано",
          "platform_mentioned_display": "Не указана",
          "edo_reference_present_display": "Не указано"
        }

        Пример 3 — edge-case: есть общий ЭДО, но нет ЭТрН:
        Фрагмент:
        "Стороны вправе обмениваться счетами и актами в электронном виде с использованием усиленной квалифицированной электронной подписи."

        Ответ:
        {
          "ewaybill_mentioned": "no",
          "ewaybill_mandatory": "not_defined",
          "platform_mentioned": "not_defined",
          "edo_reference_present": "yes",
          "ewaybill_snippet": "Стороны вправе обмениваться счетами и актами в электронном виде с использованием усиленной квалифицированной электронной подписи.",
          "ewaybill_mentioned_display": "Не упомянута",
          "ewaybill_mandatory_display": "Не указано",
          "platform_mentioned_display": "Не указана",
          "edo_reference_present_display": "Есть"
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        Перед ответом внутренне проверь:
        1. Есть ли прямая цитата именно об электронной транспортной накладной (ЭТрН), а не просто об ЭДО счетов/актов.
        2. Чётко ли определена обязательность использования.
        3. Указана ли конкретная платформа.
        4. Если прямого указания на ЭТрН нет — верни "no" или "not_defined" для соответствующих полей.
        5. Все 9 ключей присутствуют в JSON.

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь РОВНО одним JSON-объектом без какого-либо дополнительного текста до или после, со всеми 9 ключами:
        {
          "ewaybill_mentioned": "<yes / no / not_defined>",
