          "demurrage_waiver_display": "Не указано"
        }

        Пример 3 — только общие форс-мажорные положения:
        Фрагмент:
        "Стороны освобождаются от ответственности за неисполнение обязательств при наступлении обстоятельств непреодолимой силы: войн, стихийных бедствий, решений Правительства РФ."

        Ответ:
        {
          "transport_fm_clause_present": "not_defined",
          "covered_transport_events": "not_defined",
