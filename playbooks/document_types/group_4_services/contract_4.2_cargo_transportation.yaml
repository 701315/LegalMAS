      store_payload: true

  - id: exclusions_from_liability
    name: "Транспортные основания освобождения от ответственности (ст. 796 ГК РФ)"
    description: >
      Проверяет договорный перечень транспортных оснований, освобождающих
      перевозчика от ответственности: вина грузоотправителя, свойства груза,
      дефекты упаковки/тары, а также характер перечня (закрытый/открытый).
      Форс-мажор проверяется отдельным global check-ом и не дублируется здесь.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "вина грузоотправителя"
        - "свойства груза"
        - "дефекты тары"
        - "дефекты упаковки"
        - "действия таможенных органов"
        - "освобождается от ответственности"
        - "ответственность не несёт"
        - "не отвечает за"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)освобожда(ется|ться)\\s+от\\s+ответственност"
        - "(?i)ответственност.*не\\s+нес(ёт|ет)"
        - "(?i)не\\s+отвечает.*за"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по транспортным договорам.
        Анализируется договор перевозки груза.
        Проверяется только перечень транспортных оснований, освобождающих перевозчика
        от ответственности: вина грузоотправителя, свойства груза, дефекты упаковки/тары.
        Форс-мажор НЕ проверяется в этом check-е (он покрыт отдельной проверкой).

        Нормативный ориентир:
        - ст. 796 ГК РФ
        - специальные транспортные режимы

        [ЗАДАЧА]
        Установи:
        1. Упомянута ли вина грузоотправителя как основание освобождения.
        2. Упомянуты ли свойства груза как основание освобождения.
        3. Упомянуты ли дефекты упаковки/тары как основание освобождения.
        4. Является ли перечень оснований закрытым или открытым, если это можно понять из текста.
        5. Приведи точную цитату из договора.
        6. Сформируй user-friendly значения для отображения в DD Grid.

        [ПРАВИЛА]
        1. Используй только текст договора.
        2. Не путай исключения из ответственности с лимитом ответственности.
        3. Не путай этот check с форс-мажором — форс-мажор НЕ анализируй здесь.
        4. Если перечень оснований только частичный, так и фиксируй.
        5. Не подставляй типовые основания, если их нет в тексте.
        6. Не используй "None", "null" или пустые строки — используй "not_defined".
        7. В exclusions_snippet включай только цитату из договора.
        8. Для *_display полей используй понятные русские формулировки:
          - shipper_fault_included: yes → "Да", no → "Нет", not_defined → "Не указано"
          - cargo_properties_included: yes → "Да", no → "Нет", not_defined → "Не указано"
          - packaging_defects_included: yes → "Да", no → "Нет", not_defined → "Не указано"
          - exhaustive_list: yes → "Закрытый", no → "Открытый", not_defined → "Не определён"
        9. Верни РОВНО один JSON-объект со всеми 9 ключами без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — все основания указаны, перечень закрытый:
        Фрагмент:
        "Перевозчик не несёт ответственности за утрату, недостачу или повреждение груза, если они произошли вследствие: (а) вины Грузоотправителя; (б) естественных свойств груза; (в) дефектов упаковки, не позволяющих обеспечить сохранность груза при транспортировке. Перечень оснований является исчерпывающим."

        Ответ:
        {
          "shipper_fault_included": "yes",
          "cargo_properties_included": "yes",
          "packaging_defects_included": "yes",
          "exhaustive_list": "yes",
          "exclusions_snippet": "Перевозчик не несёт ответственности за утрату, недостачу или повреждение груза, если они произошли вследствие: (а) вины Грузоотправителя; (б) естественных свойств груза; (в) дефектов упаковки, не позволяющих обеспечить сохранность груза при транспортировке. Перечень оснований является исчерпывающим.",
          "shipper_fault_included_display": "Да",
          "cargo_properties_included_display": "Да",
          "packaging_defects_included_display": "Да",
          "exhaustive_list_display": "Закрытый"
        }

        Пример 2 — основания не упомянуты:
        Фрагмент:
        "Перевозчик обязуется доставить груз в пункт назначения в установленный срок."

        Ответ:
        {
          "shipper_fault_included": "not_defined",
          "cargo_properties_included": "not_defined",
          "packaging_defects_included": "not_defined",
          "exhaustive_list": "not_defined",
          "exclusions_snippet": "not_defined",
          "shipper_fault_included_display": "Не указано",
          "cargo_properties_included_display": "Не указано",
          "packaging_defects_included_display": "Не указано",
          "exhaustive_list_display": "Не определён"
        }

        Пример 3 — текст есть, но вывод невозможен (размытая формулировка без конкретики):
        Фрагмент:
        "Перевозчик освобождается от ответственности в случаях, предусмотренных действующим законодательством."

        Ответ:
        {
          "shipper_fault_included": "not_defined",
          "cargo_properties_included": "not_defined",
          "packaging_defects_included": "not_defined",
          "exhaustive_list": "not_defined",
          "exclusions_snippet": "Перевозчик освобождается от ответственности в случаях, предусмотренных действующим законодательством.",
          "shipper_fault_included_display": "Не указано",
          "cargo_properties_included_display": "Не указано",
          "packaging_defects_included_display": "Не указано",
          "exhaustive_list_display": "Не определён"
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        Перед ответом внутренне проверь:
        1. Есть ли прямая цитата об освобождении от ответственности именно по транспортным основаниям.
        2. Не подменил ли ты форс-мажор транспортными основаниями.
        3. Не путаешь ли ты исключения с лимитом ответственности.
        4. Если прямого указания нет — верни "not_defined".
        5. Все 9 ключей присутствуют в JSON.

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь РОВНО одним JSON-объектом без какого-либо дополнительного текста до или после, со всеми 9 ключами:
        {
          "shipper_fault_included": "<yes / no / not_defined>",
          "cargo_properties_included": "<yes / no / not_defined>",
          "packaging_defects_included": "<yes / no / not_defined>",
          "exhaustive_list": "<yes / no / not_defined>",
          "exclusions_snippet": "<точная цитата или not_defined>",
          "shipper_fault_included_display": "<Да / Нет / Не указано>",
          "cargo_properties_included_display": "<Да / Нет / Не указано>",
          "packaging_defects_included_display": "<Да / Нет / Не указано>",
          "exhaustive_list_display": "<Закрытый / Открытый / Не определён>"
        }
      context_k: 5
      temperature: 0.0
      max_tokens: 700
    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "освобождается от ответственности вина грузоотправителя свойства груза дефекты упаковки дефекты тары действия таможенных органов не несёт ответственности не отвечает за"
      preferred_unit_types:
        - liability_provision
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - limitations
        - remedies
      negative_keywords:
        - "провозная плата"
        - "претензия"
        - "лимит ответственности"
        - "страхование"
        - "форс-мажор"
        - "непреодолимая сила"
      position_bias:
        preferred_range: [0.2, 0.95]
        boost: 0.15
        scope: auto
      retrieval_profile: "force_majeure_check"
      context_k: 5
      max_chunks: 7
      rerank: true
    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
        - "invoice"
      preferred_clause_functions:
        - "limitations"
        - "remedies"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10
    evidence:
