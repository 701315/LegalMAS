    name: "Подсудность и разрешение споров"
    description: "Проверяет подсудность, арбитражную оговорку"
    legal_base: "АПК РФ, ГПК РФ"
    severity: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
      keywords:
        - "разрешение споров"
        - "подсудность"
        - "арбитражный суд"
        - "претензионный порядок"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)арбитражн(ый|ого)\\s+суд"

  - id: "cargo_insurance_clause"
    name: "Страхование груза"
    description: "Проверяет условия страхования груза"
    legal_base: "ГК РФ, глава 48"
    severity: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
      keywords:
        - "страхование груза"
        - "страховой полис"
        - "страховая сумма"
        - "выгодоприобретатель"
        - "страховой случай"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)страхован(ие|ия)\\s+груз"
    extraction:
      enabled: true
      mode: "rules"
      fields:
        - name: "insurance_required"
          type: "string"
          allowed_values: ["yes", "no", "unclear", "not_found"]
          keyword_hints: ["обязан застраховать", "страхование обязательно"]
          description: "Обязательность страхования груза"
        - name: "who_insures"
          type: "string"
          allowed_values: ["shipper", "carrier", "not_specified", "not_found"]
          keyword_hints: ["грузоотправитель страхует", "перевозчик страхует"]
          description: "Кто страхует груз"
      store_payload: true

  - id: "confidentiality"
    name: "Конфиденциальность"
    description: "Проверяет наличие условий о конфиденциальности"
    legal_base: "ст. 421 ГК РФ"
    severity: "low"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
      keywords:
        - "конфиденциальность"
        - "неразглашение"
        - "коммерческая тайна"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)конфиденциал"

  - id: "vat_and_tax"
    name: "НДС и налоговые оговорки"
    description: "Проверяет налоговые аспекты провозной платы"
    legal_base: "НК РФ"
    severity: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
      keywords:
        - "НДС"
        - "в том числе НДС"
        - "без НДС"
        - "ставка 0%"
        - "международная перевозка"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)\\bНДС\\b"
        - "(?i)ставк(а|у)\\s+0\\s*%"

  - id: "auto_renewal"
    name: "Автопролонгация (рамочный договор)"
    description: "Проверяет наличие условия об автоматическом продлении"
    legal_base: "ГК РФ"
    severity: "low"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers:
      any: ["framework_agreement"]
    rules:
      keywords:
        - "автопролонгация"
        - "автоматическое продление"
        - "продлевается на тот же срок"
        - "пролонгация"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)автоматическ(и|ое)\\s+продлева"

  - id: "anticorruption_clause"
    name: "Антикоррупционная оговорка"
    description: "Проверяет наличие антикоррупционных заверений"
    legal_base: "ФЗ № 273-ФЗ"
    severity: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
      keywords:
        - "антикоррупционная оговорка"
        - "противодействие коррупции"
        - "взятка"
        - "коммерческий подкуп"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)антикоррупц"

  - id: "carrier_license_check"
    name: "Лицензия / разрешение перевозчика"
    description: "Проверяет наличие ссылки на лицензию/разрешение перевозчика"
    legal_base: "ФЗ № 99-ФЗ, ФЗ № 259-ФЗ"
    severity: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
      keywords:
        - "лицензия"
        - "разрешение на перевозку"
        - "допуск к перевозкам"
        - "свидетельство"
        - "номер лицензии"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)лицензи(я|и|ю)\\s+№"

  - id: "packaging_and_marking"
    name: "Тара, упаковка и маркировка груза"
    description: "Проверяет требования к таре, упаковке и маркировке"
    legal_base: "ст. 791 ГК РФ, правила перевозок"
    severity: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
      keywords:
        - "тара"
        - "упаковка"
        - "маркировка"
        - "пломба"
        - "пломбирование"
        - "целостность упаковки"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)(тар(а|ы|у)|упаковк(а|и|у)|маркировк(а|и|у))"

  - id: "gps_tracking"
    name: "GPS-мониторинг и отслеживание груза"
    description: "Проверяет наличие условий о мониторинге местоположения груза"
    legal_base: "ГК РФ (общие положения)"
    severity: "low"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
      keywords:
        - "GPS"
        - "ГЛОНАСС"
        - "мониторинг"
        - "отслеживание"
        - "трекинг"
        - "местоположение груза"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)\\bGPS\\b|\\bГЛОНАСС\\b"
        - "(?i)отслежива(ние|ть)\\s+груз"

  - id: "shipper_data_accuracy"
    name: "Достоверность сведений о грузе: ответственность грузоотправителя"
    description: "Проверяет наличие ответственности за недостоверные данные о грузе"
    legal_base: "ст. 10 ФЗ-259 (УАТ), ст. 27 УЖТ"
    severity: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
      keywords:
        - "достоверность сведений"
        - "грузоотправитель несёт ответственность"
        - "недостоверные данные"
        - "сведения о грузе"
        - "вес груза"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)достоверност.*сведени"
        - "(?i)грузоотправител.*ответственност"

  - id: "subcontracting_terms"
    name: "Привлечение субперевозчика: условия и ответственность"
    description: "Проверяет условия привлечения третьих лиц для перевозки"
    legal_base: "ст. 785, 313 ГК РФ"
    severity: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
      keywords:
        - "субперевозчик"
        - "привлечение третьих лиц"
        - "субподряд"
        - "замена перевозчика"
        - "с согласия"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)субперевозчик"
        - "(?i)привлечен(ие|ия)\\s+третьих"

  - id: "redirection_clause"
    name: "Переадресовка груза в пути"
    description: "Проверяет наличие условий переадресовки"
    legal_base: "ст. 31 ФЗ-259 (УАТ)"
    severity: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers:
      any: ["redirection_in_transit"]
    rules:
      keywords:
        - "переадресовка"
        - "изменение пункта назначения"
        - "изменение грузополучателя"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)переадресовк"

  - id: "electronic_waybill_terms"
    name: "Электронная транспортная накладная (ЭТрН)"
    description: "Проверяет условия использования электронной накладной"
    legal_base: "ФЗ-259, ПП РФ № 2200"
    severity: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers:
      any: ["electronic_waybill"]
    rules:
      keywords:
        - "электронная транспортная накладная"
        - "ЭТрН"
        - "ГИС ЭПД"
        - "электронный документооборот"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)электронн(ая|ой)\\s+транспортн"
        - "(?i)ЭТрН|ГИС\\s+ЭПД"

  - id: "cargo_escort_terms"
    name: "Сопровождение и охрана груза"
    description: "Проверяет условия сопровождения груза представителем"
    legal_base: "ГК РФ, транспортные уставы"
    severity: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers:
      any: ["cargo_escort"]
    rules:
      keywords:
        - "сопровождение груза"
        - "охрана груза"
        - "представитель грузоотправителя"
        - "вооружённая охрана"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)сопровожден(ие|ия)\\s+груз"
        - "(?i)охран(а|ы)\\s+груз"

  - id: "force_majeure_clause"
    name: "Форс-мажор: обстоятельства непреодолимой силы"
    description: "Проверяет наличие оговорки о непреодолимой силе"
    legal_base: "ст. 401 ГК РФ"
    severity: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
      keywords:
        - "непреодолимая сила"
        - "форс-мажор"
        - "обстоятельства непреодолимой силы"
        - "стихийное бедствие"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)непреодолим(ая|ой)\\s+сил"
        - "(?i)форс[- ]мажор"

  - id: "seasonal_road_restrictions"
    name: "Сезонные дорожные ограничения"
    description: "Проверяет учёт сезонных ограничений по массе/габаритам"
    legal_base: "ФЗ-257, региональные НПА"
    severity: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers:
      any: ["road_transport", "seasonal_restrictions"]
    rules:
      keywords:
        - "весенние ограничения"
        - "ограничения по массе"
        - "дорожные ограничения"
        - "пропуск на движение"
        - "временное ограничение"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)(весенн|сезонн|временн).*ограничен"

# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 7: DD_REQUEST_TEMPLATES
#  Читается: DDRequestTemplateLoader
#  Ключи = check_id из checks_v8 и doc_type_checks выше.
#  DDRequestTemplateLoader.render() матчит по exact или prefix.
# ════════════════════════════════════════════════════════════════════════════

dd_request_templates:

  cargo_transport_subject_extraction:
    text: >
      Просим подтвердить по {doc_names}: (а) наименование и характеристики груза
      (вес, объём, свойства); (б) пункты отправления и назначения;
      (в) вид транспорта; (г) тип договора (разовый/рамочный);
      (д) вид транспортного документа.
    addressee: "Обе стороны"

  transport_document_check:
    text: >
      Просим уточнить в {doc_names}: (а) вид транспортного документа (накладная/коносамент/CMR);
      (б) кто оформляет; (в) порядок передачи.
    addressee: "Перевозчик"

  carrier_liability_for_cargo:
    text: >
      Просим уточнить в {doc_names}: (а) основание ответственности за утрату/повреждение
      (вне зависимости от вины / по вине); (б) лимит ответственности;
      (в) исключены ли косвенные убытки; (г) ссылку на транспортный устав.
    addressee: "Юридический советник"

  liability_limitation_explicit:
    text: >
      Просим включить в {doc_names} явную ссылку на ограничения ответственности
      по применимому транспортному уставу (УАТ/УЖТ/ВК/КТМ/КВВТ).
    addressee: "Юридический советник перевозчика"

  claim_procedure_check:
    text: >
      Просим детализировать в {doc_names} обязательный претензионный порядок:
      (а) сроки предъявления претензий (для утраты, повреждения, просрочки);
      (б) форма претензии и прилагаемые документы;
      (в) срок ответа на претензию; (г) ссылка на ст. 797 ГК РФ;
      (д) сокращённый срок исковой давности (1 год).
    addressee: "Юридический советник"

  pretension_order:
    text: >
      В {doc_names} отсутствует/недостаточно детализирован обязательный претензионный
      порядок (ст. 797 ГК РФ). Просим включить сроки, форму, порядок рассмотрения.
    addressee: "Юридический советник"

  mandatory_pretension_procedure_missing:
    text: >
      ВНИМАНИЕ: в {doc_names} отсутствует обязательный претензионный порядок
      (ст. 797 ГК РФ). Пропуск сроков лишает права на иск. Просим немедленно
      включить порядок с указанием сроков для каждого вида претензий.
    addressee: "Юридический советник"

  cargo_value_and_insurance:
    text: >
      Просим уточнить в {doc_names}: (а) объявленную ценность груза;
      (б) обязательность страхования и кто страхует;
      (в) вид страхового покрытия (all risks / named perils);
      (г) минимальную страховую сумму; (д) выгодоприобретателя.
    addressee: "Грузоотправитель / Юридический советник"

  cargo_insurance_clause:
    text: >
      Просим уточнить в {doc_names}: условия страхования груза, кто несёт расходы,
      страховая сумма, порядок урегулирования убытков.
    addressee: "Обе стороны"

  special_cargo_conditions:
    text: >
      В {doc_names} перевозится груз особой категории. Просим предоставить:
      (а) для опасных — свидетельство ДОПОГ, аварийную карточку, класс опасности;
      (б) для скоропортящихся — температурный режим, наличие термографа;
      (в) для негабаритных — проект перевозки, специальное разрешение.
    addressee: "Грузоотправитель / Перевозчик"

  dangerous_cargo_without_dopog:
    text: >
      ВНИМАНИЕ: в {doc_names} перевозится опасный груз, но документы ДОПОГ
      не упоминаются. Просим незамедлительно предоставить: свидетельство ДОПОГ,
      аварийную карточку, специальное разрешение.
    addressee: "Перевозчик"

  international_transport_provisions:
    text: >
      В {doc_names} предусмотрена международная перевозка. Просим уточнить:
      (а) применимую конвенцию (CMR/Монреальская/иная);
      (б) распределение таможенных обязанностей; (в) базис поставки (Incoterms);
      (г) применимое право; (д) подсудность споров.
    addressee: "Юридический советник"

  international_transport_without_convention:
    text: >
      ВНИМАНИЕ: в {doc_names} — международная перевозка без ссылки на конвенцию.
      Просим указать применимую конвенцию и согласовать применимое право.
    addressee: "Юридический советник"

  lien_right_on_cargo:
    text: >
      Просим уточнить в {doc_names}: (а) право удержания груза при неоплате;
      (б) порядок реализации удержанного груза; (в) распределение расходов на хранение.
    addressee: "Юридический советник"

  demurrage_detention_check:
    text: >
      Просим согласовать в {doc_names}: (а) нормативное время погрузки/выгрузки;
      (б) ставку демереджа за сверхнормативный простой;
      (в) максимальную сумму демереджа; (г) кто оплачивает.
    addressee: "Обе стороны"

  vehicle_supply_check:
    text: >
      Просим уточнить в {doc_names}: (а) срок и порядок подачи ТС;
      (б) порядок уведомления; (в) санкции за неподачу/несвоевременную подачу;
      (г) санкции за непредъявление груза.
    addressee: "Обе стороны"

  vehicle_supply_penalty:
    text: >
      Просим согласовать в {doc_names}: размер штрафов за неподачу ТС
      и непредъявление груза (для обеих сторон), порядок уведомления.
    addressee: "Юридический советник"

  freight_charge:
    text: >
      Просим подтвердить по {doc_names}: (а) размер провозной платы;
      (б) включает ли НДС; (в) тарифная основа; (г) порядок и сроки оплаты;
      (д) реквизиты для перечисления.
    addressee: "Обе стороны"

  parties_identification:
    text: >
      Просим подтвердить полные реквизиты сторон по {doc_names}: наименование,
      ИНН, ОГРН, адрес, лицензия перевозчика, данные грузополучателя.
    addressee: "Обе стороны"

  cargo_and_route:
    text: >
      Просим уточнить в {doc_names}: полные характеристики груза и маршрут
      (пункт отправления, пункт назначения, промежуточные пункты).
    addressee: "Грузоотправитель"

  delivery_deadline:
    text: >
      Просим согласовать в {doc_names}: срок доставки, транзитное время,
      последствия нарушения сроков.
    addressee: "Обе стороны"

  delivery_delay_penalty:
    text: >
      Просим согласовать в {doc_names}: размер неустойки за просрочку доставки,
      предельный размер, порядок исчисления.
    addressee: "Юридический советник"

  cargo_acceptance_procedure:
    text: >
      Просим уточнить в {doc_names}: порядок приёмки груза, фиксации недостачи
      и повреждений (коммерческий акт), сроки предъявления претензий.
    addressee: "Обе стороны"

  exclusions_from_liability:
    text: >
      Просим согласовать в {doc_names}: перечень обстоятельств, освобождающих
      от ответственности (непреодолимая сила, вина грузоотправителя,
      свойства груза, дефекты тары, действия госорганов).
    addressee: "Юридический советник"

  limitation_period_notice:
    text: >
      Просим включить в {doc_names} указание на сокращённый срок исковой давности
      (1 год по ст. 797 ГК РФ).
    addressee: "Юридический советник"

  carrier_license_check:
    text: >
      Просим предоставить по {doc_names}: копию лицензии/разрешения перевозчика,
      подтверждение допуска к перевозкам.
    addressee: "Перевозчик"

  carrier_license_absent:
    text: >
      Просим предоставить подтверждение лицензии/допуска перевозчика по {doc_names}.
      Без лицензии деятельность перевозчика может быть признана незаконной.
    addressee: "Перевозчик"

  packaging_and_marking:
    text: >
      Просим уточнить в {doc_names}: требования к таре, упаковке и маркировке груза,
      ответственность за дефекты упаковки.
    addressee: "Грузоотправитель"

  loading_unloading_obligations:
    text: >
      Просим уточнить в {doc_names}: кто осуществляет погрузку/выгрузку,
      нормативное время, средства крепления, ответственность за сохранность.
    addressee: "Обе стороны"

  application_procedure_framework:
    text: >
      Просим согласовать в {doc_names}: форму заявки на перевозку, сроки подачи,
      порядок подтверждения/отклонения, санкции за отказ.
    addressee: "Обе стороны"

  gps_tracking:
    text: >
      Просим уточнить в {doc_names}: наличие GPS/ГЛОНАСС-мониторинга,
      доступ грузоотправителя к отслеживанию, порядок уведомлений.
    addressee: "Перевозчик"

  confidentiality:
    text: >
      Просим включить в {doc_names} условие о конфиденциальности коммерческих
      условий перевозки.
    addressee: "Юридический советник"

  vat_and_tax:
    text: >
      Просим уточнить в {doc_names}: режим НДС (в т.ч. ставка 0% для международных),
      порядок документооборота.
    addressee: "Бухгалтерия"

  auto_renewal:
    text: >
      Просим уточнить в {doc_names}: условия автопролонгации рамочного договора,
      срок уведомления о непродлении.
    addressee: "Юридический советник"

  anticorruption_clause:
    text: >
      Просим включить в {doc_names} антикоррупционную оговорку (ФЗ-273).
    addressee: "Юридический советник"

  dispute_resolution:
    text: >
      Просим согласовать в {doc_names}: подсудность, претензионный порядок,
      возможность третейского разбирательства.
    addressee: "Юридический советник"

  shipper_obligations_and_warranties_check:
    text: >
      Просим предоставить по {doc_names}: перечень обязанностей грузоотправителя 
      по подготовке груза, предоставлению достоверных сведений (наименование, вес, 
      свойства), упаковке, маркировке, а также ответственность за недостоверные данные.
    addressee: "Юридический советник"

  shipper_data_accuracy:
    text: >
      Просим включить в {doc_names}: заверение грузоотправителя о достоверности 
      сведений о грузе и ответственность за убытки перевозчика от недостоверных данных 
      (ст. 10 УАТ, ст. 27 УЖТ).
    addressee: "Юридический советник"

  shipper_false_cargo_info:
    text: >
      В {doc_names} не выявлена ответственность грузоотправителя за недостоверные 
      сведения о грузе. Просим включить обязанность и санкции 
      (ст. 10 УАТ, ст. 27 УЖТ, ст. 25 CMR).
    addressee: "Юридический советник"

  subcontracting_and_substitution_check:
    text: >
      Просим уточнить в {doc_names}: вправе ли перевозчик привлекать субперевозчика,
      требуется ли согласие, кто несёт ответственность за действия субперевозчика,
      условия замены транспорта и водителя.
    addressee: "Юридический советник"

  subcontracting_terms:
    text: >
      Просим включить в {doc_names}: условия привлечения субперевозчика —
      запрет или согласие, ответственность перевозчика за действия третьих лиц.
    addressee: "Юридический советник"

  subcontracting_without_consent:
    text: >
      В {doc_names} выявлен риск привлечения субперевозчика без согласия.
      Просим предусмотреть порядок согласования и ответственность 
      перевозчика за субперевозчика.
    addressee: "Юридический советник"

  redirection_in_transit_check:
    text: >
      Просим уточнить в {doc_names}: условия переадресовки (изменение пункта 
      назначения/грузополучателя в пути), кто вправе запросить, 
      распределение расходов, сроки.
    addressee: "Обе стороны"

  redirection_clause:
    text: >
      Просим включить в {doc_names}: условия переадресовки, порядок 
      согласования, распределение дополнительных расходов.
    addressee: "Юридический советник"

  electronic_waybill_terms:
    text: >
      Просим уточнить в {doc_names}: порядок использования электронной 
      транспортной накладной (ЭТрН), подключение к ГИС ЭПД, 
      юридическую силу электронного документа.
    addressee: "Обе стороны"

  cargo_escort_terms:
    text: >
      Просим уточнить в {doc_names}: условия сопровождения груза,
      кто обеспечивает, ответственность при повреждении во время 
      сопровождения, требования к охране.
    addressee: "Обе стороны"

  no_cargo_acceptance_procedure:
    text: >
      В {doc_names} не выявлен чёткий порядок приёмки груза при выдаче.
      Просим включить: осмотр, составление коммерческого акта,
      сроки предъявления замечаний.
    addressee: "Юридический советник"

  force_majeure_clause:
    text: >
      Просим согласовать в {doc_names}: перечень обстоятельств 
      непреодолимой силы, порядок уведомления и подтверждения.
    addressee: "Юридический советник"

  seasonal_road_restrictions:
    text: >
      Просим уточнить в {doc_names}: порядок учёта сезонных дорожных 
      ограничений, распределение расходов на пропуска, 
      последствия задержки из-за ограничений.
    addressee: "Обе стороны"

  # Generic fallback
  _default:
    text: >
      Просим предоставить дополнительную информацию по вопросу «{check_name}»
      применительно к {doc_names}.
    addressee: "Юридический советник"