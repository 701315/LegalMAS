  - id: application_procedure_framework
    name: "Порядок подачи заявок (для рамочного договора)"
    description: >
      Проверяет процедуру подачи заявок на перевозку при рамочном договоре:
      форму, сроки, порядок подтверждения и отказа.
    triggers:
      any: ["framework_agreement"]
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "заявка на перевозку"
        - "форма заявки"
        - "срок подачи заявки"
        - "подтверждение заявки"
        - "отказ от заявки"
        - "график перевозок"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)заявк(а|и|у)\\s+на\\s+перевозк"
        - "(?i)подтверждени(е|я)\\s+заявк"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по рамочным транспортным договорам.
        Проверяется только процедура подачи заявок на перевозку.

        [ЗАДАЧА]
        Установи:
        1. Есть ли обязательный порядок подачи заявок.
        2. В какой форме подаются заявки.
        3. Есть ли срок подачи заявки.
        4. Есть ли порядок подтверждения или отклонения заявки.
        5. Есть ли правила изменения/отмены заявки.
        6. Приведи точную цитату из договора.
        7. Сформируй user-friendly значения для отображения в DD Grid.

        [ПРАВИЛА]
        1. Используй только текст договора.
        2. Не подменяй рамочный договор разовой перевозкой.
        3. Если порядок не детализирован, но само требование заявки есть, application_procedure_present = "yes", а отдельные элементы = "not_defined".
        4. Если есть только график перевозок без процедуры заявки, не считай это полноценной процедурой заявки.
        5. Не используй "None", "null" или пустые строки — используй "not_defined".
        6. В application_procedure_snippet включай только цитату из договора.
        7. Для *_display полей используй понятные русские формулировки:
          - application_procedure_present: yes → "Установлен", no → "Не установлен", not_defined → "Не указано"
          - application_form: written → "Письменная", electronic → "Электронная", any → "Любая", not_defined → "Не указана"
          - confirmation_procedure: yes → "Установлен", no → "Не установлен", not_defined → "Не указано"
          - change_or_cancellation_rules: yes → "Установлены", no → "Не установлены", not_defined → "Не указано"
        8. Верни РОВНО один JSON-объект со всеми 10 ключами без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — полная процедура подачи заявок:
        Фрагмент:
        "Заявки на перевозку подаются Грузоотправителем в письменной форме не позднее чем за 48 часов до планируемой даты перевозки. Перевозчик подтверждает заявку в течение 24 часов с момента получения. Отказ от заявки допускается не позднее чем за 12 часов до подачи транспортного средства."

        Ответ:
        {
          "application_procedure_present": "yes",
          "application_form": "written",
          "application_deadline": "не позднее чем за 48 часов до планируемой даты перевозки",
          "confirmation_procedure": "yes",
          "change_or_cancellation_rules": "yes",
          "application_procedure_snippet": "Заявки на перевозку подаются Грузоотправителем в письменной форме не позднее чем за 48 часов до планируемой даты перевозки. Перевозчик подтверждает заявку в течение 24 часов с момента получения. Отказ от заявки допускается не позднее чем за 12 часов до подачи транспортного средства.",
          "application_procedure_present_display": "Установлен",
          "application_form_display": "Письменная",
          "confirmation_procedure_display": "Установлен",
          "change_or_cancellation_rules_display": "Установлены"
        }

        Пример 2 — процедура не упомянута:
        Фрагмент:
        "Перевозчик обязуется доставить груз в пункт назначения в установленный срок."

        Ответ:
        {
          "application_procedure_present": "not_defined",
          "application_form": "not_defined",
          "application_deadline": "not_defined",
          "confirmation_procedure": "not_defined",
          "change_or_cancellation_rules": "not_defined",
          "application_procedure_snippet": "not_defined",
          "application_procedure_present_display": "Не указано",
          "application_form_display": "Не указана",
          "confirmation_procedure_display": "Не указано",
          "change_or_cancellation_rules_display": "Не указано"
        }

        Пример 3 — текст есть, но вывод невозможен (размытая формулировка без конкретики):
        Фрагмент:
        "Перевозки осуществляются на основании заявок, согласованных сторонами."

        Ответ:
        {
          "application_procedure_present": "yes",
          "application_form": "not_defined",
          "application_deadline": "not_defined",
          "confirmation_procedure": "not_defined",
          "change_or_cancellation_rules": "not_defined",
          "application_procedure_snippet": "Перевозки осуществляются на основании заявок, согласованных сторонами.",
          "application_procedure_present_display": "Установлен",
          "application_form_display": "Не указана",
          "confirmation_procedure_display": "Не указано",
          "change_or_cancellation_rules_display": "Не указано"
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        Перед ответом внутренне проверь:
        1. Есть ли прямая цитата о процедуре подачи заявок.
        2. Не подменил ли ты рамочный договор разовой перевозкой.
        3. Соответствуют ли значения допустимым словарям.
        4. Если прямого указания нет — верни "not_defined".
        5. Все 10 ключей присутствуют в JSON.

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь РОВНО одним JSON-объектом без какого-либо дополнительного текста до или после, со всеми 10 ключами:
        {
          "application_procedure_present": "<yes / no / not_defined>",
          "application_form": "<written / electronic / any / not_defined>",
          "application_deadline": "<текст или not_defined>",
          "confirmation_procedure": "<yes / no / not_defined>",
          "change_or_cancellation_rules": "<yes / no / not_defined>",
          "application_procedure_snippet": "<точная цитата или not_defined>",
          "application_procedure_present_display": "<Установлен / Не установлен / Не указано>",
          "application_form_display": "<Письменная / Электронная / Любая / Не указана>",
          "confirmation_procedure_display": "<Установлен / Не установлен / Не указано>",
          "change_or_cancellation_rules_display": "<Установлены / Не установлены / Не указано>"
        }
      context_k: 5
      temperature: 0.0
      max_tokens: 700
    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "заявка на перевозку форма заявки срок подачи заявки подтверждение заявки отказ от заявки график перевозок"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - procedures
        - obligations
      negative_keywords:
        - "провозная плата"
        - "претензия"
        - "форс-мажор"
        - "неустойка"
      position_bias:
        preferred_range: [0.0, 0.80]
        boost: 0.15
        scope: auto
      retrieval_profile: "scope_of_work_check"
      context_k: 5
      max_chunks: 7
      rerank: true
    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
        - "invoice"
      preferred_clause_functions:
        - "procedures"
        - "obligations"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10
    evidence:
      required: true
      min_snippet_length: 20
      max_snippet_length: 450
    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1100

      compact_output: false

      presence_signal:
        field: "application_procedure_framework_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист по рамочным транспортным договорам.
        Извлеки процедуру подачи заявок на перевозку.
        Не анализируй цену, сроки доставки, ответственность и иные разделы.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. application_procedure_framework_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если application_procedure_present = "yes" ИЛИ application_deadline ≠ "not_defined" ИЛИ confirmation_procedure = "yes";
           - "missing" — если все поля = "not_defined" / "no" и фрагментов о процедуре заявок в контексте нет;
           - "unclear" — если фрагменты по теме есть, но из-за противоречий вывод невозможен.

           Если presence = "missing":
           - application_procedure_present = "not_defined";
           - application_form = "not_defined";
           - application_deadline = "not_defined";
           - confirmation_procedure = "not_defined";
           - change_or_cancellation_rules = "not_defined";
           - application_procedure_snippet = "not_defined";
           - все *_display = соответствующий fallback;
           - не выполняй остальные шаги.

        1. application_procedure_present:
           - "yes" — если требование и порядок подачи заявок прямо предусмотрены;
           - "no" — если в договоре прямо указано, что заявки не применяются;
           - "not_defined" — если порядок подачи заявок не урегулирован.

        2. application_form:
           - "written" — письменная форма;
           - "electronic" — электронная форма (email, ЭДО, система заявок);
           - "any" — любая форма (устная/письменная/электронная);
           - "not_defined" — форма заявки не указана.

        3. application_deadline:
           Срок подачи заявки из текста договора (например: "не позднее чем за 48 часов до перевозки").
           Если не указан — "not_defined".

        4. confirmation_procedure:
           - "yes" — если предусмотрен порядок подтверждения или отклонения заявки перевозчиком;
           - "no" — если подтверждение прямо не требуется;
           - "not_defined" — если порядок подтверждения не урегулирован.

        5. change_or_cancellation_rules:
           - "yes" — если установлены правила изменения или отмены поданной заявки;
           - "no" — если отмена/изменение прямо не предусмотрены;
           - "not_defined" — если вопрос не урегулирован.

        6. application_procedure_snippet:
           Точная цитата из договора о процедуре подачи заявок. Если нет — "not_defined".

        7. application_procedure_present_display:
           "Установлен" / "Не установлен" / "Не указано".

        8. application_form_display:
           "Письменная" / "Электронная" / "Любая" / "Не указана".

        9. confirmation_procedure_display:
           "Установлен" / "Не установлен" / "Не указано".

        10. change_or_cancellation_rules_display:
            "Установлены" / "Не установлены" / "Не указано".
        </task>

        <context_rules>
        - Перед остальными полями заполни application_procedure_framework_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все поля = "not_defined" / соответствующий fallback.
        - Не подменяй рамочный договор разовой перевозкой.
        - Если порядок не детализирован, но требование заявки есть — application_procedure_present = "yes", а отдельные элементы = "not_defined".
        - Если есть только график перевозок без процедуры заявки — не считай это полноценной процедурой.
        - Не используй "None", "null" или пустые строки.
        - Все 10 ключей должны присутствовать в JSON-ответе.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В договоре нет условий о заявках или договор носит разовый характер без механизма заявок.
           → presence = "missing";
             application_procedure_present = "not_defined";
             все sub-поля = "not_defined".

        2. Требование заявки названо без детальной процедуры.
           "Перевозчик осуществляет перевозки на основании заявок Грузоотправителя."
           → presence = "present";
             application_procedure_present = "yes";
             application_form = "not_defined";
             application_deadline = "not_defined".

        3. Противоречие между фрагментами.
           В одном месте срок подачи заявки 24 часа, в другом — 48 часов.
           → presence = "unclear";
             application_deadline = "Не удалось определить";
             application_procedure_present = "yes".

        4. График перевозок вместо процедуры заявок.
           "Перевозки осуществляются строго по Графику (Приложение №1) без подачи дополнительных заявок."
           → presence = "present";
             application_procedure_present = "no";
             application_form = "not_defined";
             application_procedure_present_display = "Не установлен".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для application_procedure_framework_presence используй только: "present", "missing", "unclear".
        - Для application_procedure_present, confirmation_procedure, change_or_cancellation_rules используй только: "yes", "no", "not_defined".
        - Для application_form используй только: "written", "electronic", "any", "not_defined".
        - Fallback при отсутствии данных:
          * application_deadline, application_procedure_snippet → "not_defined";
          * все *_display → "Не указано" / "Не указана".
        - Fallback при противоречии или неоднозначности:
          * все *_display → соответствующие fallback-строки.
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "application_procedure_framework_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие процедуры подачи заявок. Внутреннее агрегатное signal-поле."
          required: true

        - name: "application_procedure_present"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Порядок подачи заявок установлен. Внутреннее enum-поле."
          required: true
          display_in_grid: false
        - name: "application_form"
          type: "string"
          presentation: "signal"
          risk_weight: "low"
          allowed_values: ["written", "electronic", "any", "not_defined"]
          description: "Форма заявки. Внутреннее enum-поле."
          required: true
          display_in_grid: false
        - name: "application_deadline"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 1
          label: "Срок подачи заявки"
          description: >
            Срок подачи заявки. Fallback: "Не установлено" / "Не удалось определить".
          required: true
        - name: "confirmation_procedure"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Порядок подтверждения заявки. Внутреннее enum-поле."
          required: true
          display_in_grid: false
        - name: "change_or_cancellation_rules"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Правила изменения/отмены заявки. Внутреннее enum-поле."
          required: true
          display_in_grid: false
        - name: "application_procedure_snippet"
          type: "string"
          presentation: "diagnostic"
          display_in_grid: false
