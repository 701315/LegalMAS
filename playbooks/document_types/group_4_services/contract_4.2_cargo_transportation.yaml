        - "форс-мажор"
        - "ответственность за сохранность"
      position_bias:
        preferred_range: [0.0, 0.90]
        boost: 0.10
        scope: auto
      retrieval_profile: "scope_of_work_check"
      context_k: 4
      max_chunks: 5
