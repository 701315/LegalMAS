          description: "Ответственность за недостоверные данные. Внутреннее enum-поле."
          required: true
          display_in_grid: false
        - name: "shipper_obligations_completeness"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["comprehensive", "partial", "minimal", "absent"]
          description: "Полнота обязанностей грузоотправителя. Внутреннее enum-поле."
