            User-friendly отображение: определено ли распределение
            расходов из-за ограничений.
            Fallback: "Не указано" / "Не удалось определить".
          required: true
      store_payload: true

  - id: unclaimed_cargo_storage
    name: "Хранение и реализация невостребованного груза"
    description: >
      Проверяет условия хранения груза при неявке грузополучателя или его
      отказе от приёмки: сроки и стоимость хранения, порядок уведомления
      грузоотправителя, право перевозчика на реализацию невостребованного
      груза и распределение выручки (ст. 790 ГК РФ п. 4, ст. 35 УАТ,
      ст. 101 УЖТ). Ключевой check для оценки риска накопления складских
      расходов и утраты груза.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "невостребованный груз"
        - "хранение груза"
        - "реализация груза"
        - "неявка грузополучателя"
        - "отказ от получения"
        - "расходы на хранение"
        - "склад временного хранения"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)невостребованн"
        - "(?i)хранени(е|я)\\s+груз"
        - "(?i)реализац(ия|ии)\\s+груз"
        - "(?i)неявк.*грузополучател"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по транспортным договорам.
        Анализируется договор перевозки груза.
        Проверяются ТОЛЬКО условия хранения и реализации невостребованного груза
        при неявке грузополучателя или его отказе от приёмки.

        Нормативный ориентир:
        - ст. 790 ГК РФ (п. 4)
        - ст. 35 УАТ (ФЗ-259)
        - ст. 101 УЖТ

        [ЗАДАЧА]
        Установи:
        1. Есть ли в договоре процедура хранения при неявке грузополучателя.
        2. Установлен ли предельный срок хранения невостребованного груза.
        3. Кто оплачивает расходы на хранение.
        4. Предусмотрено ли право перевозчика на реализацию груза.
        5. Есть ли обязанность перевозчика уведомить грузоотправителя о невостребованности.
        6. Приведи точную цитату из договора.
        7. Сформируй user-friendly значения для отображения в DD Grid.

        [ПРАВИЛА]
        1. Используй только текст договора.
        2. Не подставляй законные сроки хранения из УАТ/УЖТ, если их нет в договоре.
        3. Если хранение упомянуто, но срок не назван — storage_period = "not_defined".
        4. Если реализация не упомянута — sale_right_present = "not_defined".
        5. Не используй "None", "null" или пустые строки — используй "not_defined".
        6. В unclaimed_cargo_snippet включай только цитату из договора.
        7. Для *_display полей используй понятные русские формулировки:
          - storage_procedure_present: yes → "Предусмотрена", no → "Не предусмотрена", not_defined → "Не указано"
          - storage_cost_allocation: shipper → "Грузоотправитель", carrier → "Перевозчик", consignee → "Грузополучатель", not_defined → "Не указано"
          - sale_right_present: yes → "Предусмотрено", no → "Не предусмотрено", not_defined → "Не указано"
          - notification_obligation: yes → "Предусмотрена", no → "Не предусмотрена", not_defined → "Не указано"
        8. Верни РОВНО один JSON-объект со всеми 11 ключами без какого-либо дополнительного текста до или после.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — полные условия хранения и реализации:
        Фрагмент:
        "При неявке Грузополучателя за грузом в течение 3 (трёх) рабочих дней с момента уведомления о прибытии, Перевозчик помещает груз на склад временного хранения за счёт Грузоотправителя. Если груз не будет востребован в течение 30 (тридцати) календарных дней, Перевозчик вправе реализовать груз в порядке, предусмотренном ст. 35 УАТ. Перевозчик обязан уведомить Грузоотправителя о невостребованности груза в течение 24 часов."

        Ответ:
        {
          "storage_procedure_present": "yes",
          "storage_period": "30 календарных дней",
          "storage_cost_allocation": "shipper",
          "sale_right_present": "yes",
          "notification_obligation": "yes",
          "unclaimed_cargo_snippet": "При неявке Грузополучателя за грузом в течение 3 (трёх) рабочих дней с момента уведомления о прибытии, Перевозчик помещает груз на склад временного хранения за счёт Грузоотправителя. Если груз не будет востребован в течение 30 (тридцати) календарных дней, Перевозчик вправе реализовать груз в порядке, предусмотренном ст. 35 УАТ. Перевозчик обязан уведомить Грузоотправителя о невостребованности груза в течение 24 часов.",
          "storage_procedure_present_display": "Предусмотрена",
          "storage_period_display": "30 календарных дней",
          "storage_cost_allocation_display": "Грузоотправитель",
          "sale_right_present_display": "Предусмотрено",
          "notification_obligation_display": "Предусмотрена"
        }

        Пример 2 — условия не упомянуты:
        Фрагмент:
        "Перевозчик обязуется доставить груз в пункт назначения в установленный срок."

        Ответ:
        {
          "storage_procedure_present": "not_defined",
          "storage_period": "not_defined",
          "storage_cost_allocation": "not_defined",
          "sale_right_present": "not_defined",
          "notification_obligation": "not_defined",
          "unclaimed_cargo_snippet": "not_defined",
          "storage_procedure_present_display": "Не указано",
          "storage_period_display": "Не указан",
          "storage_cost_allocation_display": "Не указано",
          "sale_right_present_display": "Не указано",
          "notification_obligation_display": "Не указано"
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Есть ли прямая цитата о хранении невостребованного груза.
        2. Не подставил ли ты сроки из УАТ/УЖТ вместо текста договора.
        3. Если прямого указания нет — верни "not_defined".
        4. Все 11 ключей присутствуют в JSON.

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        {
          "storage_procedure_present": "<yes / no / not_defined>",
          "storage_period": "<срок или not_defined>",
          "storage_cost_allocation": "<shipper / carrier / consignee / not_defined>",
          "sale_right_present": "<yes / no / not_defined>",
          "notification_obligation": "<yes / no / not_defined>",
          "unclaimed_cargo_snippet": "<точная цитата или not_defined>",
          "storage_procedure_present_display": "<Предусмотрена / Не предусмотрена / Не указано>",
          "storage_period_display": "<срок / Не указан>",
          "storage_cost_allocation_display": "<Грузоотправитель / Перевозчик / Грузополучатель / Не указано>",
          "sale_right_present_display": "<Предусмотрено / Не предусмотрено / Не указано>",
          "notification_obligation_display": "<Предусмотрена / Не предусмотрена / Не указано>"
        }
      context_k: 4
      temperature: 0.0
      max_tokens: 650
    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "невостребованный груз хранение груза реализация груза неявка грузополучателя отказ от получения расходы на хранение склад временного хранения"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - procedures
        - remedies
      negative_keywords:
        - "провозная плата"
        - "претензия"
        - "форс-мажор"
        - "неустойка"
      position_bias:
        preferred_range: [0.3, 1.0]
        boost: 0.15
        scope: auto
      retrieval_profile: "acceptance_check"
      context_k: 4
      max_chunks: 6
      rerank: true
    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
        - "invoice"
      preferred_clause_functions:
        - "procedures"
        - "remedies"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10
    evidence:
      required: true
      min_snippet_length: 20
      max_snippet_length: 400
    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1100

      compact_output: false

      presence_signal:
        field: "unclaimed_cargo_storage_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист по транспортным договорам.
        Извлеки только условия хранения и реализации невостребованного груза
        при неявке грузополучателя или его отказе от приёмки.
        Не анализируй цену, сроки доставки, ответственность за утрату,
        претензионный порядок и иные разделы.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. unclaimed_cargo_storage_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если storage_procedure_present ∈ {"yes", "no"} ИЛИ
             sale_right_present ∈ {"yes", "no"};
           - "missing" — если все содержательные поля = "not_defined"
             и фрагментов о хранении или реализации невостребованного груза
             в контексте нет;
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - storage_procedure_present = "not_defined";
           - storage_period = "not_defined";
           - storage_cost_allocation = "not_defined";
           - sale_right_present = "not_defined";
           - notification_obligation = "not_defined";
           - unclaimed_cargo_snippet = "not_defined";
           - все *_display = соответствующий fallback;
           - не выполняй остальные шаги.

        1. storage_procedure_present:
           - "yes" — если процедура хранения при неявке грузополучателя
             прямо предусмотрена договором;
           - "no" — если договор прямо исключает хранение и обязывает
             перевозчика вернуть груз немедленно;
           - "not_defined" — если вопрос хранения невостребованного груза
             прямо не урегулирован.

        2. storage_period:
           Предельный срок хранения невостребованного груза из текста
           договора (например: "30 календарных дней", "14 рабочих дней").
           Если срок не указан — "not_defined".

        3. storage_cost_allocation:
           - "shipper" — расходы на хранение несёт грузоотправитель;
           - "carrier" — расходы несёт перевозчик;
           - "consignee" — расходы несёт грузополучатель;
           - "not_defined" — сторона, оплачивающая хранение, не указана.

        4. sale_right_present:
           - "yes" — если право перевозчика на реализацию невостребованного
             груза прямо предусмотрено;
           - "no" — если реализация прямо запрещена;
           - "not_defined" — если вопрос реализации не урегулирован.

        5. notification_obligation:
           - "yes" — если перевозчик обязан уведомить грузоотправителя
             о невостребованности груза;
           - "no" — если обязанность уведомления прямо исключена;
           - "not_defined" — если вопрос уведомления не урегулирован.

        6. unclaimed_cargo_snippet:
           Точная цитата из договора о хранении/реализации невостребованного
           груза. Если нет — "not_defined".

        7. storage_procedure_present_display:
           "Предусмотрена" / "Не предусмотрена" / "Не указано".

        8. storage_period_display:
           Конкретный срок из текста или "Не указан".

        9. storage_cost_allocation_display:
           "Грузоотправитель" / "Перевозчик" / "Грузополучатель" / "Не указано".

        10. sale_right_present_display:
            "Предусмотрено" / "Не предусмотрено" / "Не указано".

        11. notification_obligation_display:
            "Предусмотрена" / "Не предусмотрена" / "Не указано".
        </task>

        <context_rules>
        - Перед остальными полями заполни unclaimed_cargo_storage_presence
          по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй
          "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все поля = "not_defined" /
          соответствующий fallback.
        - Не подставляй законные сроки хранения из УАТ/УЖТ, если они
          отсутствуют в тексте самого договора.
        - Не путай хранение невостребованного груза с обычным хранением
          на складе перевозчика до момента выдачи.
        - Не используй "None", "null" или пустые строки.
        - Все 11 ключей должны присутствовать в JSON-ответе.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В договоре нет упоминания хранения, реализации или невостребованного
           груза.
           → presence = "missing";
             storage_procedure_present = "not_defined";
             sale_right_present = "not_defined".

        2. Хранение предусмотрено, но без срока и реализации.
           "При неявке Грузополучателя груз помещается на склад за счёт
           Грузоотправителя." (срок и реализация не названы).
           → presence = "present";
             storage_procedure_present = "yes";
             storage_period = "not_defined";
             sale_right_present = "not_defined".

        3. Противоречие между фрагментами.
           В одном месте срок хранения 30 дней, в другом — 60 дней.
           → presence = "unclear";
             storage_period = "Не удалось определить";
             storage_procedure_present = "yes".

        4. Только реализация без хранения.
           "Перевозчик вправе реализовать груз, не востребованный
           Грузополучателем, по истечении срока, установленного законом."
           → presence = "present";
             sale_right_present = "yes";
             storage_procedure_present = "not_defined";
             storage_period = "not_defined".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для unclaimed_cargo_storage_presence используй только:
          "present", "missing", "unclear".
        - Для storage_procedure_present, sale_right_present,
          notification_obligation используй только: "yes", "no", "not_defined".
        - Для storage_cost_allocation используй только:
          "shipper", "carrier", "consignee", "not_defined".
        - Fallback при отсутствии данных:
          * storage_period, unclaimed_cargo_snippet → "not_defined";
          * все *_display → соответствующие fallback-строки.
        - Fallback при противоречии или неоднозначности:
          * storage_period → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан
          отдельным контрактом — соблюдай его, но не описывай здесь.
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "unclaimed_cargo_storage_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
