          "cargo_insurance_snippet": "Грузоотправитель обязан застраховать груз от всех рисков на сумму, равную объявленной ценности груза, указанной в транспортной накладной. Выгодоприобретателем по договору страхования является Перевозчик. Объявленная ценность груза составляет 5 000 000 (пять миллионов) рублей.",
          "insurance_present_display": "Предусмотрено",
          "insurance_required_display": "Обязательно",
          "who_insures_display": "Грузоотправитель",
          "insurance_coverage_display": "От всех рисков",
          "beneficiary_defined_display": "Определён"
