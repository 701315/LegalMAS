#  БЛОК 3: SHARED PATTERNS
#  Читается: DocTypeCheckLoader через _resolve_yaml_templates()
# ════════════════════════════════════════════════════════════════════════════

shared_patterns:

  money_amount: "(?i)\\b\\d[\\d\\s]*(?:руб|рублей|₽|тыс|млн|млрд|USD|EUR|долл)"
  date_pattern: "(?i)\\b\\d{1,2}[.]\\d{1,2}[.]\\d{4}\\b"
  percentage: "(?i)\\b\\d{1,3}[,.]?\\d{0,2}\\s*%"
  weight_pattern: "(?i)\\b\\d[\\d\\s,.]*(?:кг|тонн|т\\b|kg|ton)"
  volume_pattern: "(?i)\\b\\d[\\d\\s,.]*(?:куб\\.?\\s*м|м[³3]|cbm)"
  time_hours: "(?i)\\b\\d+\\s*(?:час|ч\\.|hours|hrs)"
  vehicle_reg: "(?i)\\b[А-Я]{1}\\d{3}[А-Я]{2}\\d{2,3}\\b"

# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 4: COMPLIANCE RULES
#  Читается: DocTypeCheckLoader._exclusion_logic_to_checks()
# ════════════════════════════════════════════════════════════════════════════

compliance_rules:

  - id: "carrier_license_absent"
    name: "Отсутствие лицензии/разрешения перевозчика"
    description: |
      Для отдельных видов перевозок (пассажирские автобусные, ж/д, авиа, морские)
      требуется лицензия. Для грузовых автомобильных — допуск к международным
      перевозкам. Отсутствие необходимых разрешений делает деятельность незаконной.
    legal_base: "ФЗ от 04.05.2011 № 99-ФЗ, ФЗ от 08.11.2007 № 259-ФЗ (УАТ)"
    required_triggers: ["legal_entity_party"]
    severity: "critical"
    result_if_triggered: "warning"
    detector_type: "rules"
    rules:
      keywords:
        - "лицензия"
        - "разрешение на перевозку"
        - "допуск"
        - "свидетельство"
      keyword_mode: "any"
    retrieval:
      context_k: 5
      boost_keywords:
        - "лицензия перевозчика"
        - "разрешение"
        - "допуск к перевозкам"
      rerank: true

  - id: "dangerous_cargo_without_dopog"
    name: "Опасные грузы без документов ДОПОГ (ADR)"
    description: |
      Перевозка опасных грузов без свидетельства ДОПОГ, аварийной карточки
      и специального разрешения — административное правонарушение (ст. 12.21.2 КоАП)
      и уголовно наказуемое деяние при тяжких последствиях.
    legal_base: "ДОПОГ (ADR), ФЗ-259 (УАТ), ст. 12.21.2 КоАП РФ"
    required_triggers: ["dangerous_cargo"]
    severity: "critical"
    result_if_triggered: "fail"
    detector_type: "rules"
    rules:
      keywords:
        - "опасный груз"
        - "ДОПОГ"
        - "ADR"
        - "класс опасности"
        - "свидетельство ДОПОГ"
        - "аварийная карточка"
      keyword_mode: "any"
    retrieval:
      context_k: 5
      boost_keywords:
        - "опасный груз"
        - "ДОПОГ"
        - "свидетельство"
        - "аварийная карточка"
      rerank: true

  - id: "international_transport_without_convention"
    name: "Международная перевозка без ссылки на применимую конвенцию"
    description: |
      При международных перевозках автоматически применяются конвенции
      (КДПГ/CMR для автотранспорта, Монреальская для авиа, Гаагско-Висбийские
      правила для морских). Без ссылки на конвенцию — неопределённость
      в применимом праве и лимитах ответственности.
    legal_base: "КДПГ (CMR), Монреальская конвенция 1999, Гамбургские правила"
    required_triggers: ["international_transport"]
    severity: "critical"
    result_if_triggered: "warning"
    detector_type: "rules"
    rules:
      keywords:
        - "международная перевозка"
        - "CMR"
        - "КДПГ"
        - "Монреальская конвенция"
        - "инкотермс"
        - "применимое право"
      keyword_mode: "any"
    retrieval:
      context_k: 5
      boost_keywords:
        - "международная перевозка"
        - "конвенция"
        - "CMR"
        - "КДПГ"
      rerank: true

  - id: "mandatory_pretension_procedure_missing"
    name: "Обязательный претензионный порядок не предусмотрен (ст. 797 ГК РФ)"
    description: |
      До подачи иска к перевозчику ОБЯЗАТЕЛЬНО предъявление претензии.
      Пропуск срока (30 дней — недостача/повреждение, 45 дней — просрочка по УАТ)
      лишает права на иск. Без явного указания на претензионный порядок
      стороны рискуют пропустить сроки.
    legal_base: "ст. 797 ГК РФ, транспортные уставы"
    required_triggers: []
    severity: "critical"
    result_if_triggered: "warning"
    detector_type: "rules"
    rules:
      keywords:
        - "претензионный порядок"
        - "претензия"
        - "досудебный порядок"
        - "срок предъявления претензии"
      keyword_mode: "any"
    retrieval:
      context_k: 5
      boost_keywords:
        - "претензионный порядок"
        - "претензия"
        - "ст. 797"
      rerank: true

  - id: "shipper_false_cargo_info"
    name: "Ответственность грузоотправителя за недостоверные сведения о грузе"
    description: |
      Грузоотправитель обязан предоставить достоверные сведения о грузе 
      (наименование, вес, свойства, опасность). За убытки от недостоверных 
      сведений отвечает грузоотправитель (ст. 10 УАТ, ст. 27 УЖТ).
      Отсутствие этого условия лишает перевозчика защиты.
    legal_base: "ст. 10 ФЗ-259 (УАТ), ст. 27 УЖТ, ст. 25 КДПГ (CMR)"
    required_triggers: []
    severity: "high"
    result_if_triggered: "warning"
    detector_type: "rules"
    rules:
      keywords:
        - "достоверность сведений"
        - "сведения о грузе"
        - "информация о свойствах"
        - "ответственность грузоотправителя"
      keyword_mode: "any"
      negative_keywords:
        - "грузоотправитель несёт ответственность за достоверность"
        - "грузоотправитель гарантирует"
        - "ответственность за предоставление недостоверных"
    retrieval:
      context_k: 5
      boost_keywords:
        - "достоверность сведений"
        - "ответственность грузоотправителя"
        - "свойства груза"
      rerank: true

  - id: "subcontracting_without_consent"
    name: "Привлечение субперевозчика без согласия грузоотправителя"
    description: |
      Если перевозчик привлекает субперевозчика без согласия или 
      уведомления, грузоотправитель лишается контроля над качеством 
      и безопасностью перевозки. Необходимо урегулировать право 
      привлечения и ответственность за субперевозчика.
    legal_base: "ст. 785, 313 ГК РФ"
    required_triggers: ["subcontracting_carrier"]
    severity: "high"
    result_if_triggered: "warning"
    detector_type: "rules"
    rules:
      keywords:
        - "привлечение третьих лиц"
        - "субподряд"
        - "субперевозчик"
      keyword_mode: "any"
      negative_keywords:
        - "с согласия грузоотправителя"
        - "с письменного согласия"
        - "перевозчик отвечает за субперевозчика"
        - "запрещается привлечение"
    retrieval:
      context_k: 5
      boost_keywords:
        - "субперевозчик"
        - "привлечение"
        - "согласие"
      rerank: true

  - id: "no_cargo_acceptance_procedure"
    name: "Отсутствие порядка приёмки груза при выдаче"
    description: |
      Без чёткого порядка приёмки и фиксации повреждений при выдаче 
      грузополучателю сложно доказать факт и момент повреждения. 
      Коммерческий акт и сроки предъявления замечаний критичны.
    legal_base: "ст. 796 ГК РФ, транспортные уставы"
    required_triggers: []
    severity: "high"
    result_if_triggered: "warning"
    detector_type: "rules"
    rules:
      keywords:
        - "приёмка груза"
        - "осмотр при получении"
        - "коммерческий акт"
        - "акт о повреждении"
      keyword_mode: "any"
      negative_keywords:
        - "порядок приёмки"
        - "осмотр груза при выдаче"
        - "коммерческий акт составляется"
        - "акт о недостаче"
    retrieval:
      context_k: 5
      boost_keywords:
        - "приёмка"
        - "осмотр"
        - "коммерческий акт"
      rerank: true

# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 5: CHECKS_V8 — LLM/hybrid проверки
#  Читается: DocTypeCheckLoader._load_doc_type_checks()
# ════════════════════════════════════════════════════════════════════════════

checks_v8:

  - id: cargo_transport_subject_extraction
    name: "Перевозка: базовое извлечение предмета договора"
    description: "Извлекает характеристики груза, маршрут, вид транспорта, тип договора"
    triggers: {}
    severity: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "груз"
        - "перевозка"
        - "пункт отправления"
        - "пункт назначения"
        - "маршрут"
        - "наименование груза"
        - "вес"
        - "объём"
        - "транспортная накладная"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)(перевозчик.*обязуется.*доставить)"
        - "(?i)(из\\s+пункта.*в\\s+пункт|из\\s+г\\..*в\\s+г\\.)"
        - "(?i)(грузоотправител.*обязуется.*уплатить)"
    llm:
      prompt_template: |
        Ты — юридический ассистент, анализирующий договор перевозки груза.
        Найди в тексте сведения о предмете договора.

        Ответь строго в JSON:
        {
          "cargo_description": "<описание груза или not_found>",
          "cargo_weight": "<вес с единицей измерения или not_found>",
          "cargo_volume": "<объём или not_found>",
          "origin_point": "<пункт отправления или not_found>",
          "destination_point": "<пункт назначения или not_found>",
          "transport_mode": "<road / rail / sea / air / inland_water / multimodal / not_found>",
          "contract_type": "<single / framework / not_found>",
          "transport_document_type": "<waybill / bill_of_lading / air_waybill / cmr / not_found>"
        }

        ВАЖНО: Возвращай only_found_in_text. Если значение явно не указано — пиши "not_found".
      prompt_file: null
      context_k: 6
      temperature: 0.0
      max_tokens: 512
    retrieval:
      context_k: 6
      max_chunks: 10
      boost_keywords:
        - "груз"
        - "перевозка"
        - "пункт отправления"
        - "пункт назначения"
        - "маршрут"
        - "транспортная накладная"
      rerank: true
      filters: {}
    evidence:
      required: true
      min_snippet_length: 50
      max_snippet_length: 800
    extraction:
      enabled: true
      mode: "hybrid"
      fields:
        - name: "cargo_description"
          type: "string"
          keyword_hints: ["наименование груза", "характер груза", "род груза"]
          description: "Описание груза"
        - name: "transport_mode"
          type: "string"
          allowed_values: ["road", "rail", "sea", "air", "inland_water", "multimodal", "not_found"]
          description: "Вид транспорта"
        - name: "contract_type"
          type: "string"
          allowed_values: ["single", "framework", "not_found"]
          description: "Тип договора (разовый/рамочный)"
        - name: "transport_document_type"
          type: "string"
          allowed_values: ["waybill", "bill_of_lading", "air_waybill", "cmr", "not_found"]
          description: "Вид транспортного документа"
      store_payload: true

  - id: transport_document_check
    name: "Транспортный документ: накладная / коносамент (ст. 785 ГК РФ)"
    description: |
      Проверяет наличие условия об оформлении транспортного документа.
      Заключение договора перевозки подтверждается транспортной накладной,
      коносаментом или иным документом. Без него сложно доказать факт
      заключения договора.
    triggers: {}
    severity: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "транспортная накладная"
        - "товарно-транспортная накладная"
        - "ТТН"
        - "коносамент"
        - "грузовая авианакладная"
        - "CMR"
        - "AWB"
        - "железнодорожная накладная"
        - "путевой лист"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)транспортн(ая|ой)\\s+накладн"
        - "(?i)коносамент"
        - "(?i)\\bCMR\\b"
        - "(?i)\\bТТН\\b"
        - "(?i)\\bAWB\\b"
    llm:
      prompt_template: |
        Ты — юридический ассистент, анализирующий договор перевозки груза.
        Проверь наличие условия об оформлении транспортного документа (ст. 785 ГК РФ).

        Ответь строго в JSON:
        {
          "transport_document_mentioned": "<yes / no>",
          "document_type": "<waybill / consignment_note / bill_of_lading / air_waybill / cmr / other / not_found>",
          "who_prepares": "<carrier / shipper / jointly / not_specified / not_found>",
          "document_snippet": "<цитата или not_found>"
        }

        ВАЖНО: Если значение явно не указано — пиши "not_found".
      prompt_file: null
      context_k: 4
      temperature: 0.0
      max_tokens: 300
    retrieval:
      context_k: 4
      max_chunks: 6
      boost_keywords:
        - "транспортная накладная"
        - "коносамент"
        - "CMR"
        - "оформление документов"
      rerank: true
      filters: {}
    evidence:
      required: true
      min_snippet_length: 30
      max_snippet_length: 500
    extraction:
      enabled: true
      mode: "hybrid"
      fields:
        - name: "transport_document_mentioned"
          type: "string"
          allowed_values: ["yes", "no"]
          description: "Упоминание транспортного документа"
        - name: "document_type"
          type: "string"
          allowed_values: ["waybill", "consignment_note", "bill_of_lading", "air_waybill", "cmr", "other", "not_found"]
