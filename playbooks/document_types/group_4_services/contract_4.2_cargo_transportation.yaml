  - id: vat_and_tax
    name: "НДС и налоговые оговорки"
    description: >
      Проверяет налоговые аспекты провозной платы: включён ли НДС,
      выделена ли ставка, применяется ли ставка 0% для международной
      перевозки и как это сформулировано в договоре.
      Базовое включение НДС в цену также проверяется в check-е freight_charge;
      данный check добавляет налоговую специфику: конкретную ставку,
      нулевую ставку для международных перевозок (ст. 148 НК РФ)
      и ссылку на международный налоговый режим.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "medium"
    severity_if_pass: "pass"
    severity_if_fail: "medium"
    severity_if_unclear: "low"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "НДС"
        - "в том числе НДС"
        - "без НДС"
        - "ставка 0%"
        - "международная перевозка"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)\\bНДС\\b"
        - "(?i)ставк(а|у)\\s+0\\s*%"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по транспортным договорам.
        Анализируется договор перевозки груза.
        Проверяются только налоговые оговорки, связанные с провозной платой.

        [ЗАДАЧА]
        Установи:
        1. Упоминается ли НДС в тексте договора.
        2. Включён ли НДС в цену или цена указана без НДС.
        3. Есть ли указание на ставку 0%.
        4. Указан ли конкретный размер ставки.
        5. Есть ли привязка к международной перевозке.
        6. Приведи точную цитату из договора.
        7. Сформируй user-friendly значения для отображения в DD Grid.

        [ПРАВИЛА]
        1. Используй только текст договора.
        2. Не подставляй налоговый режим из закона.
        3. Если НДС не упомянут — vat_mentioned = "no", vat_included = "not_defined".
        4. Если прямо сказано "в том числе НДС" — vat_included = "yes".
        5. Если прямо сказано "без НДС" — vat_included = "no".
        6. Если прямо сказано "ставка 0%" — vat_included = "zero_rate".
        7. Если НДС не применим (например, перевозка нерезидентом без указания НДС) — vat_included = "not_applicable".
        8. Не используй "None", "null" или пустые строки — используй "not_defined".
        9. В vat_snippet включай только цитату из договора.
        10. Для *_display полей используй понятные русские формулировки:
            - vat_included:
              * yes → "Включён"
              * no → "Не включён"
              * zero_rate → "Нулевая ставка (0%)"
              * not_applicable → "Не применим"
              * not_defined → "Не указано"
            - international_tax_reference: yes → "Да", no → "Нет", not_defined → "Не указано"
        11. Верни РОВНО один JSON-объект со всеми 7 ключами без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — НДС включён, ставка 20%:
        Фрагмент:
        "Провозная плата составляет 150 000 (Сто пятьдесят тысяч) рублей, в том числе НДС 20% — 25 000 рублей."

        Ответ:
        {
          "vat_mentioned": "yes",
          "vat_included": "yes",
          "vat_rate": "20%",
          "international_tax_reference": "no",
          "vat_snippet": "Провозная плата составляет 150 000 (Сто пятьдесят тысяч) рублей, в том числе НДС 20% — 25 000 рублей.",
          "vat_included_display": "Включён",
          "international_tax_reference_display": "Нет"
        }

        Пример 2 — ставка 0% для международной перевозки:
        Фрагмент:
        "Провозная плата за международную перевозку составляет 5 000 евро без НДС. Применяется ставка НДС 0% в соответствии со статьёй 148 Налогового кодекса Российской Федерации."

        Ответ:
        {
          "vat_mentioned": "yes",
          "vat_included": "zero_rate",
          "vat_rate": "0%",
          "international_tax_reference": "yes",
          "vat_snippet": "Провозная плата за международную перевозку составляет 5 000 евро без НДС. Применяется ставка НДС 0% в соответствии со статьёй 148 Налогового кодекса Российской Федерации.",
          "vat_included_display": "Нулевая ставка (0%)",
          "international_tax_reference_display": "Да"
        }

        Пример 3 — текст есть, но вывод невозможен (размытая формулировка без конкретики):
        Фрагмент:
        "Оплата производится в соответствии с действующим налоговым законодательством."

        Ответ:
        {
          "vat_mentioned": "not_defined",
          "vat_included": "not_defined",
          "vat_rate": "not_defined",
          "international_tax_reference": "not_defined",
          "vat_snippet": "Оплата производится в соответствии с действующим налоговым законодательством.",
          "vat_included_display": "Не указано",
          "international_tax_reference_display": "Не указано"
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        Перед ответом внутренне проверь:
        1. Есть ли прямая цитата о НДС.
        2. Не подставил ли ты налоговый режим из закона вместо текста договора.
        3. Различаешь ли ты "включён", "не включён", "нулевая ставка" и "не применим".
        4. Если прямого указания нет — верни "not_defined".
        5. Все 7 ключей присутствуют в JSON.

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь РОВНО одним JSON-объектом без какого-либо дополнительного текста до или после, со всеми 7 ключами:
        {
          "vat_mentioned": "<yes / no / not_defined>",
          "vat_included": "<yes / no / zero_rate / not_applicable / not_defined>",
          "vat_rate": "<текст ставки или not_defined>",
          "international_tax_reference": "<yes / no / not_defined>",
          "vat_snippet": "<точная цитата или not_defined>",
          "vat_included_display": "<Включён / Не включён / Нулевая ставка (0%) / Не применим / Не указано>",
          "international_tax_reference_display": "<Да / Нет / Не указано>"
        }
      context_k: 4
      temperature: 0.0
      max_tokens: 650
    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "НДС в том числе НДС без НДС ставка 0% международная перевозка налоговая оговорка"
      preferred_unit_types:
        - payment_term
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - boilerplate
      negative_keywords:
        - "претензия"
        - "форс-мажор"
        - "коммерческий акт"
      position_bias:
        preferred_range: [0.0, 0.80]
        boost: 0.15
        scope: auto
      retrieval_profile: "tax_check"
      context_k: 4
      max_chunks: 6
      rerank: true
    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
        - "invoice"
      preferred_clause_functions:
        - "obligations"
        - "boilerplate"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10
    evidence:
      required: true
      min_snippet_length: 15
      max_snippet_length: 300
    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1100

      compact_output: false

      presence_signal:
        field: "vat_and_tax_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист по транспортным договорам.
        Извлеки только налоговые условия, связанные с НДС.
        Не анализируй цену, сроки доставки, ответственность, претензии и иные разделы.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. vat_and_tax_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей (vat_mentioned, vat_included) ∈ {"yes", "no", "zero_rate", "not_applicable"};
           - "missing" — если все содержательные поля равны "not_defined"
             и фрагментов о налогах или НДС в контексте нет;
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - vat_mentioned = "not_defined";
           - vat_included = "not_defined";
           - vat_rate = "not_defined";
           - international_tax_reference = "not_defined";
           - vat_snippet = "not_defined";
           - все *_display = соответствующий fallback;
           - не выполняй остальные шаги.

        1. vat_mentioned:
           - "yes" — если НДС прямо упоминается в договоре перевозки;
           - "no" — если НДС в договоре прямо не упомянут;
           - "not_defined" — если вопрос НДС прямо не урегулирован.

        2. vat_included:
           - "yes" — если НДС прямо включён в цену/провозную плату;
           - "no" — если цена указана без НДС (или НДС начисляется сверх цены);
           - "zero_rate" — если прямо согласовано применение ставки НДС 0%;
           - "not_applicable" — если НДС не применим по тексту договора (например, для нерезидентов РФ);
           - "not_defined" — если порядок прямо не урегулирован.

        3. vat_rate:
           Размер процентной ставки НДС, прямо указанный в договоре (например: "20%", "0%").
           Если не указан — "not_defined".

        4. international_tax_reference:
           - "yes" — если есть прямая ссылка на применение специальной налоговой ставки для международных перевозок (ст. 148 НК РФ, льготы и т.д.);
           - "no" — если специальные налоговые оговорки для трансграничных перевозок отсутствуют;
           - "not_defined" — если вопрос налоговых льгот прямо не поднят.

        5. vat_snippet:
           Точная цитата из договора о налогообложении (НДС). Если нет — "not_defined".

        6. vat_included_display:
           "Включён" / "Не включён" / "Нулевая ставка (0%)" / "Не применим" / "Не указано".

        7. international_tax_reference_display:
           "Да" / "Нет" / "Не указано".
        </task>

        <context_rules>
        - Перед остальными полями заполни vat_and_tax_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все поля = "not_defined" / соответствующий fallback.
        - Не выводи налоговые обязательства из закона, если они не указаны в самом тексте договора.
        - Если прямо сказано "без НДС", используй "no" для vat_included.
        - Если прямо сказано "НДС не облагается" — используй "not_applicable" для vat_included.
        - Не используй "None", "null" или пустые строки.
        - Все 7 ключей должны присутствовать в JSON-ответе.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В договоре перевозки вообще нет упоминания НДС или налогов.
           → presence = "missing";
             vat_mentioned = "not_defined";
             vat_included = "not_defined".

        2. Ссылка на закон без конкретики.
           "Налоги уплачиваются сторонами в соответствии с Налоговым кодексом РФ."
           → presence = "present";
             vat_mentioned = "not_defined";
             vat_included = "not_defined".

        3. Противоречие между фрагментами.
           В одном месте цена включает НДС, в другом — НДС уплачивается сверх стоимости.
           → presence = "unclear";
             vat_included = "not_defined";
             vat_included_display = "Не указано".

        4. Нулевая ставка для международной перевозки.
           "Применяется ставка НДС 0% в соответствии со ст. 148 НК РФ."
           → presence = "present";
             vat_mentioned = "yes";
             vat_included = "zero_rate";
             vat_rate = "0%";
             international_tax_reference = "yes".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для vat_and_tax_presence используй только: "present", "missing", "unclear".
        - Для vat_mentioned, international_tax_reference используй только: "yes", "no", "not_defined".
        - Для vat_included используй только: "yes", "no", "zero_rate", "not_applicable", "not_defined".
        - Fallback при отсутствии данных:
          * vat_rate, vat_snippet → "not_defined";
          * все *_display → соответствующие fallback-строки ("Не указано", "Нет").
        - Fallback при противоречии или неоднозначности:
          * все *_display → соответствующие fallback-строки.
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "vat_and_tax_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие налоговых условий. Внутреннее агрегатное signal-поле."
          required: true

        - name: "vat_mentioned"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["yes", "no", "not_defined"]
          description: "НДС упоминается. Внутреннее enum-поле."
          required: true
          display_in_grid: false
        - name: "vat_included"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["yes", "no", "zero_rate", "not_applicable", "not_defined"]
          description: "НДС включён в цену / применяется 0% / не применим. Внутреннее enum-поле."
          required: true
          display_in_grid: false
        - name: "vat_rate"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 1
          label: "Ставка НДС"
          description: >
            Конкретная ставка НДС (20%, 10%, 0% и т.д.). Fallback: "Не установлено" / "Не удалось определить".
          required: true
        - name: "international_tax_reference"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Есть ссылка на международный налоговый режим. Внутреннее enum-поле."
          required: true
          display_in_grid: false
        - name: "vat_snippet"
          type: "string"
          presentation: "diagnostic"
          display_in_grid: false
          description: "Цитата о налоговых условиях (НДС)"
          required: true
        - name: "vat_included_display"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 2
          label: "НДС в цене"
          description: >
            User-friendly отображение: включён ли НДС в цену и какая ставка применяется. Fallback: "Не установлено" / "Не удалось определить".
          required: true
        - name: "international_tax_reference_display"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 3
          label: "Международный режим"
          description: >
            User-friendly отображение: есть ли ссылка на международный налоговый режим. Fallback: "Не установлено" / "Не удалось определить".
          required: true
      store_payload: true

  - id: auto_renewal
    name: "Автопролонгация рамочного договора перевозки"
    description: >
      Проверяет специфику автоматического продления рамочного договора
      перевозки: период продления, механизм отказа от продления и срок
      предварительного уведомления.
      Общий срок договора и базовая пролонгация проверяются отдельным
      global check-ом (term_and_renewal) и не дублируются здесь.
      Данный check добавляет транспортную специфику: условия продления
      именно рамочного договора перевозки (договора на организацию перевозок).
    triggers:
      any: ["framework_agreement"]
    ui_mode: "field_extraction"
    severity: "low"
    severity_if_pass: "pass"
    severity_if_fail: "low"
    severity_if_unclear: "low"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "автопролонгация"
        - "автоматическое продление"
        - "продлевается на тот же срок"
        - "пролонгация"
        - "договор на организацию перевозок"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)автоматическ(и|ое)\\s+продлева"
        - "(?i)продлевается.*на.*тот\\s+же\\s+срок"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по рамочным транспортным договорам.
        Анализируется рамочный договор перевозки груза (договор на организацию перевозок).
        Проверяется ТОЛЬКО специфика автоматического продления рамочного договора перевозки.

        Общий срок договора и базовая пролонгация НЕ проверяются в этом check-е —
        они покрыты отдельной проверкой (term_and_renewal).

        [ЗАДАЧА]
        Установи:
        1. Есть ли автопролонгация именно рамочного договора перевозки.
        2. На какой срок продлевается договор.
        3. Нужны ли действия стороны для отказа от продления.
        4. Есть ли срок предварительного уведомления об отказе.
        5. Приведи точную цитату из договора.
        6. Сформируй user-friendly значения для отображения в DD Grid.

        [ПРАВИЛА]
        1. Используй только текст договора.
        2. Не подменяй автопролонгацию общим продлением по соглашению сторон.
        3. Если договор просто может быть продлён, но автоматизма нет — auto_renewal_present = "no".
        4. Если срок продления не назван — renewal_period = "not_defined".
        5. Не используй "None", "null" или пустые строки — используй "not_defined".
        6. В auto_renewal_snippet включай только цитату из договора.
        7. Для *_display полей используй понятные русские формулировки:
          - auto_renewal_present: yes → "Предусмотрена", no → "Не предусмотрена", not_defined → "Не указано"
          - termination_notice_required: yes → "Требуется", no → "Не требуется", not_defined → "Не указано"
        8. Верни РОВНО один JSON-объект со всеми 7 ключами без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — автопролонгация с уведомлением:
        Фрагмент:
        "Настоящий договор автоматически продлевается на каждый следующий календарный год на тех же условиях, если ни одна из Сторон не заявит о своём намерении прекратить договор, направив другой Стороне письменное уведомление не позднее чем за 30 (тридцать) календарных дней до окончания текущего срока действия договора."

        Ответ:
        {
          "auto_renewal_present": "yes",
          "renewal_period": "на каждый следующий календарный год",
          "termination_notice_required": "yes",
          "notice_period": "не позднее чем за 30 календарных дней до окончания текущего срока",
          "auto_renewal_snippet": "Настоящий договор автоматически продлевается на каждый следующий календарный год на тех же условиях, если ни одна из Сторон не заявит о своём намерении прекратить договор, направив другой Стороне письменное уведомление не позднее чем за 30 (тридцать) календарных дней до окончания текущего срока действия договора.",
          "auto_renewal_present_display": "Предусмотрена",
          "termination_notice_required_display": "Требуется"
        }

        Пример 2 — автопролонгация не упомянута:
        Фрагмент:
        "Договор заключён на срок с 01.01.2026 по 31.12.2026."

        Ответ:
        {
          "auto_renewal_present": "not_defined",
          "renewal_period": "not_defined",
          "termination_notice_required": "not_defined",
          "notice_period": "not_defined",
          "auto_renewal_snippet": "not_defined",
          "auto_renewal_present_display": "Не указано",
          "termination_notice_required_display": "Не указано"
        }

        Пример 3 — текст есть, но вывод невозможен (размытая формулировка без конкретики):
        Фрагмент:
        "Стороны могут продлевать срок действия договора по взаимному согласию."

        Ответ:
        {
          "auto_renewal_present": "no",
          "renewal_period": "not_defined",
          "termination_notice_required": "not_defined",
          "notice_period": "not_defined",
          "auto_renewal_snippet": "Стороны могут продлевать срок действия договора по взаимному согласию.",
          "auto_renewal_present_display": "Не предусмотрена",
          "termination_notice_required_display": "Не указано"
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        Перед ответом внутренне проверь:
        1. Есть ли прямая цитата об автоматическом продлении договора.
        2. Не подменил ли ты автопролонгацию продлением по соглашению сторон.
        3. Соответствуют ли значения допустимым словарям.
        4. Если прямого указания нет — верни "not_defined".
        5. Все 7 ключей присутствуют в JSON.

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь РОВНО одним JSON-объектом со всеми 7 ключами без какого-либо дополнительного текста до или после, со всеми 7 ключами:
        {
          "auto_renewal_present": "<yes / no / not_defined>",
          "renewal_period": "<текст или not_defined>",
          "termination_notice_required": "<yes / no / not_defined>",
          "notice_period": "<текст или not_defined>",
          "auto_renewal_snippet": "<точная цитата или not_defined>",
          "auto_renewal_present_display": "<Предусмотрена / Не предусмотрена / Не указано>",
          "termination_notice_required_display": "<Требуется / Не требуется / Не указано>"
        }
      context_k: 4
      temperature: 0.0
      max_tokens: 600
    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "автопролонгация автоматическое продление пролонгация продлевается на тот же срок договор на организацию перевозок продление рамочного договора"
      preferred_unit_types:
        - general_provision
        - obligation
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - boilerplate
        - procedures
      negative_keywords:
        - "провозная плата"
        - "претензия"
        - "неустойка"
        - "форс-мажор"
      position_bias:
        preferred_range: [0.5, 1.0]
        boost: 0.15
        scope: auto
      retrieval_profile: "term_and_renewal_check"
      context_k: 4
      max_chunks: 5
      rerank: true
    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
        - "invoice"
      preferred_clause_functions:
        - "boilerplate"
        - "procedures"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10
    evidence:
      required: true
      min_snippet_length: 15
      max_snippet_length: 300
    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1100

      compact_output: false

      presence_signal:
        field: "auto_renewal_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист по рамочным транспортным договорам.
        Извлеки условие об автоматическом продлении рамочного договора перевозки.
        Не анализируй общий срок договора, цену, ответственность, претензии и иные разделы.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. auto_renewal_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если auto_renewal_present ∈ {"yes", "no"};
           - "missing" — если auto_renewal_present = "not_defined"
             и фрагментов об автоматическом продлении в контексте нет;
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - auto_renewal_present = "not_defined";
           - renewal_period = "not_defined";
           - termination_notice_required = "not_defined";
           - notice_period = "not_defined";
           - auto_renewal_snippet = "not_defined";
           - все *_display = соответствующий fallback;
           - не выполняй остальные шаги.

        1. auto_renewal_present:
           - "yes" — если автоматическая пролонгация прямо предусмотрена договором;
           - "no" — если автоматическая пролонгация прямо исключена (например, требуется новое письменное соглашение);
           - "not_defined" — если вопрос продления рамочного договора прямо не упомянут.

        2. renewal_period:
           Период, на который автоматически продлевается договор из текста (например: "календарный год", "на тот же срок").
           Если не указан — "not_defined".

        3. termination_notice_required:
           - "yes" — если для прекращения договора/отказа от продления требуется направить предварительное уведомление;
           - "no" — если уведомление прямо не требуется;
           - "not_defined" — если порядок уведомления об отказе от пролонгации не урегулирован.

        4. notice_period:
           Срок предварительного уведомления об отказе от автопролонгации (например: "не менее чем за 30 календарных дней").
           Если не указан — "not_defined".

        5. auto_renewal_snippet:
           Точная цитата из договора об автопролонгации. Если нет — "not_defined".

        6. auto_renewal_present_display:
           "Предусмотрена" / "Не предусмотрена" / "Не указано".

        7. termination_notice_required_display:
           "Требуется" / "Не требуется" / "Не указано".
        </task>

        <context_rules>
        - Перед остальными полями заполни auto_renewal_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все поля = "not_defined" / соответствующий fallback.
        - Не путай автоматическую пролонгацию с продлением по взаимному письменному согласию сторон.
        - Прямое указание на отсутствие автоматического продления (auto_renewal_present = "no") — это presence = "present", а не "missing".
        - Не используй "None", "null" или пустые строки.
        - Все 7 ключей должны присутствовать в JSON-ответе.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет упоминаний продления рамочного договора перевозки.
           → presence = "missing";
             auto_renewal_present = "not_defined";
             renewal_period = "not_defined".

        2. Продление строго по взаимному согласию (без автопролонгации).
           "По окончании срока действия договор может быть продлён по письменному соглашению Сторон."
           → presence = "present";
             auto_renewal_present = "no";
             auto_renewal_present_display = "Не предусмотрена".

        3. Противоречие между фрагментами.
           В одном месте указано автопродление на 1 год, в другом — срок действия договора строго ограничен и продлению не подлежит.
           → presence = "unclear";
             auto_renewal_present = "not_defined";
             auto_renewal_present_display = "Не указано".

        4. Автопродление без указания периода.
           "Договор пролонгируется автоматически при отсутствии возражений сторон."
           → presence = "present";
             auto_renewal_present = "yes";
             renewal_period = "not_defined";
             auto_renewal_present_display = "Предусмотрена".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для auto_renewal_presence используй только: "present", "missing", "unclear".
        - Для auto_renewal_present, termination_notice_required используй только: "yes", "no", "not_defined".
        - Fallback при отсутствии данных:
          * renewal_period, notice_period, auto_renewal_snippet → "not_defined";
          * все *_display → соответствующие fallback-строки.
        - Fallback при противоречии или неоднозначности:
          * все *_display → соответствующие fallback-строки.
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "auto_renewal_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Автопролонгация предусмотрена"
          required: true

        - name: "auto_renewal_present"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Автопролонгация предусмотрена. Внутреннее enum-поле."
          required: true
          display_in_grid: false
        - name: "renewal_period"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 1
          label: "Период продления"
          description: >
            Период, на который автоматически продлевается договор. Fallback: "Не установлено" / "Не удалось определить".
          required: true
        - name: "termination_notice_required"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Нужно уведомление для отказа от продления. Внутреннее enum-поле."
          required: true
          display_in_grid: false
        - name: "notice_period"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 2
          label: "Срок уведомления"
          description: >
            Срок предварительного уведомления об отказе от продления. Fallback: "Не установлено" / "Не удалось определить".
          required: true
        - name: "auto_renewal_snippet"
          type: "string"
          presentation: "diagnostic"
          display_in_grid: false
          description: "Цитата об автопролонгации"
          required: true
        - name: "auto_renewal_present_display"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 3
          label: "Автопролонгация"
          description: >
            User-friendly отображение: предусмотрена ли автопролонгация рамочного договора. Fallback: "Не установлено" / "Не удалось определить".
          required: true
        - name: "termination_notice_required_display"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 4
          label: "Уведомление об отказе"
          description: >
            User-friendly отображение: требуется ли уведомление для отказа от продления. Fallback: "Не установлено" / "Не удалось определить".
          required: true
      store_payload: true

  - id: carrier_license_check
    name: "Лицензия / разрешение перевозчика"
    description: >
      Проверяет наличие в договоре ссылки на лицензию, разрешение, допуск
      либо иной регуляторный титул перевозчика на осуществление перевозок:
      лицензия на перевозки, разрешение на негабаритные/тяжеловесные перевозки,
      свидетельство о допуске к международным перевозкам, сертификат эксплуатанта,
      ДОПОГ-свидетельство и т.п.
      Общие лицензии и разрешения проверяются отдельным global check-ом
      (regulatory_licenses_and_permits) и не дублируются здесь.
      ДОПОГ-документы для опасных грузов частично пересекаются с check-ом
      special_cargo_conditions; данный check фокусируется на регуляторном
      титуле перевозчика, а не на документах к конкретной перевозке.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "лицензия"
        - "разрешение на перевозку"
        - "допуск к перевозкам"
        - "свидетельство"
        - "номер лицензии"
        - "свидетельство о допуске"
        - "карточка допуска"
        - "сертификат эксплуатанта"
        - "ДОПОГ"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)лицензи(я|и|ю)\\s+№"
        - "(?i)разрешени(е|я|ем)\\s+(на|№)"
        - "(?i)свидетельств(о|а)\\s+о\\s+допуск"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по транспортным договорам.
        Анализируется договор перевозки груза.
        Проверяется ТОЛЬКО наличие в договоре упоминания регуляторного титула
        перевозчика: лицензии, разрешения, допуска, свидетельства на осуществление
        перевозок.

        Общие лицензии и разрешения НЕ проверяются в этом check-е — они покрыты
        отдельной проверкой (regulatory_licenses_and_permits).

        [ЗАДАЧА]
        Установи:
        1. Упоминается ли лицензия, разрешение или аналогичный регуляторный документ.
        2. Какой тип документа указан (транспортная лицензия, разрешение, свидетельство, ДОПОГ и т.п.).
        3. Указан ли номер документа.
        4. Есть ли ссылка на обязанность поддерживать лицензию/разрешение в силе.
        5. Приведи точную цитату из договора.
        6. Сформируй user-friendly значения для отображения в DD Grid.

        [ПРАВИЛА]
        1. Используй только текст договора.
        2. Не подставляй обязательность лицензии из закона.
        3. Если указан только общий статус "перевозчик имеет право осуществлять перевозки", без конкретного документа — license_mentioned = "no", license_type = "not_defined".
        4. Если тип документа неясен — используй "other" или "not_defined".
        5. Не используй "None", "null" или пустые строки — используй "not_defined".
        6. В carrier_license_snippet включай только цитату из договора.
        7. Для *_display полей используй понятные русские формулировки:
          - license_mentioned: yes → "Упомянута", no → "Не упомянута", not_defined → "Не указано"
          - license_type:
            * transport_license → "Лицензия на перевозки"
            * permit → "Разрешение на перевозку"
            * certificate → "Свидетельство/допуск"
            * dopog → "ДОПОГ-свидетельство"
            * other → "Иной документ"
            * not_defined → "Не определён"
          - maintenance_obligation: yes → "Обязан поддерживать", no → "Не обязана", not_defined → "Не указано"
        8. Верни РОВНО один JSON-объект со всеми 9 ключами без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — лицензия с номером и обязанностью поддерживать:
        Фрагмент:
        "Перевозчик гарантирует наличие действующей лицензии на осуществление деятельности по перевозке пассажиров и грузов автомобильным транспортом № ЛП-0012345 от 15.03.2024, выданной Управлением транспорта. Перевозчик обязуется поддерживать лицензию в силе в течение всего срока действия договора."

        Ответ:
        {
          "license_mentioned": "yes",
          "license_type": "transport_license",
          "license_number": "ЛП-0012345 от 15.03.2024",
          "maintenance_obligation": "yes",
          "carrier_license_snippet": "Перевозчик гарантирует наличие действующей лицензии на осуществление деятельности по перевозке пассажиров и грузов автомобильным транспортом № ЛП-0012345 от 15.03.2024, выданной Управлением транспорта. Перевозчик обязуется поддерживать лицензию в силе в течение всего срока действия договора.",
          "license_mentioned_display": "Упомянута",
          "license_type_display": "Лицензия на перевозки",
          "maintenance_obligation_display": "Обязан поддерживать"
        }

        Пример 2 — лицензия не упомянута:
        Фрагмент:
        "Перевозчик обязуется доставить груз в пункт назначения в установленный срок."

        Ответ:
        {
          "license_mentioned": "not_defined",
          "license_type": "not_defined",
          "license_number": "not_defined",
          "maintenance_obligation": "not_defined",
          "carrier_license_snippet": "not_defined",
          "license_mentioned_display": "Не указано",
          "license_type_display": "Не определён",
          "maintenance_obligation_display": "Не указано"
        }

        Пример 3 — текст есть, но вывод невозможен (общий статус без конкретного документа):
        Фрагмент:
        "Перевозчик подтверждает, что имеет право осуществлять перевозки грузов на территории Российской Федерации в соответствии с действующим законодательством."

        Ответ:
        {
          "license_mentioned": "no",
          "license_type": "not_defined",
          "license_number": "not_defined",
          "maintenance_obligation": "not_defined",
          "carrier_license_snippet": "Перевозчик подтверждает, что имеет право осуществлять перевозки грузов на территории Российской Федерации в соответствии с действующим законодательством.",
          "license_mentioned_display": "Не упомянута",
          "license_type_display": "Не определён",
          "maintenance_obligation_display": "Не указано"
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        Перед ответом внутренне проверь:
        1. Есть ли прямая цитата о конкретном регуляторном документе (лицензии, разрешении, свидетельстве).
        2. Не подставил ли ты обязательность лицензии из закона вместо текста договора.
        3. Различаешь ли ты общий статус "имеет право осуществлять перевозки" и конкретный документ.
        4. Если прямого указания на конкретный документ нет — верни "not_defined" или "no".
        5. Все 9 ключей присутствуют в JSON.

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь РОВНО одним JSON-объектом без какого-либо дополнительного текста до или после, со всеми 9 ключами:
        {
          "license_mentioned": "<yes / no / not_defined>",
          "license_type": "<transport_license / permit / certificate / dopog / other / not_defined>",
          "license_number": "<номер или not_defined>",
          "maintenance_obligation": "<yes / no / not_defined>",
          "carrier_license_snippet": "<точная цитата или not_defined>",
          "license_mentioned_display": "<Упомянута / Не упомянута / Не указано>",
          "license_type_display": "<Лицензия на перевозки / Разрешение на перевозку / Свидетельство/допуск / ДОПОГ-свидетельство / Иной документ / Не определён>",
          "maintenance_obligation_display": "<Обязан поддерживать / Не обязана / Не указано>"
        }
      context_k: 4
      temperature: 0.0
      max_tokens: 650
    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "лицензия разрешение на перевозку допуск к перевозкам свидетельство номер лицензии свидетельство о допуске карточка допуска сертификат эксплуатанта ДОПОГ-свидетельство регуляторный титул перевозчика"
      preferred_unit_types:
        - general_provision
        - obligation
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - representations
        - boilerplate
      negative_keywords:
        - "провозная плата"
        - "претензия"
        - "форс-мажор"
        - "опасный груз"
        - "негабаритный"
      position_bias:
        preferred_range: [0.0, 0.60]
        boost: 0.15
        scope: auto
      retrieval_profile: "party_identification_check"
      context_k: 4
      max_chunks: 6
      rerank: true
    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
        - "invoice"
      preferred_clause_functions:
        - "representations"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10
    evidence:
      required: true
      min_snippet_length: 15
      max_snippet_length: 300
    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1100

      compact_output: false

      presence_signal:
        field: "carrier_license_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист по транспортным договорам.
        Извлеки только условия о регуляторном титуле перевозчика: лицензии, разрешении, допуске, свидетельстве на осуществление перевозок.
        Не анализируй цену, сроки доставки, ответственность, претензии и иные разделы.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. carrier_license_check_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если license_mentioned ∈ {"yes", "no"};
           - "missing" — если license_mentioned = "not_defined" и фрагментов о лицензиях или допусках в контексте нет;
           - "unclear" — если фрагменты по теме есть, но из-за противоречий вывод невозможен.

           Если presence = "missing":
           - license_mentioned = "not_defined";
           - license_type = "not_defined";
           - license_number = "not_defined";
           - maintenance_obligation = "not_defined";
           - carrier_license_snippet = "not_defined";
           - все *_display = соответствующий fallback;
           - не выполняй остальные шаги.

        1. license_mentioned:
           - "yes" — если конкретная лицензия, разрешение или допуск прямо упомянуты в договоре перевозки;
           - "no" — если в договоре прямо указано об отсутствии у перевозчика специальных лицензий/разрешений;
           - "not_defined" — если вопрос о наличии документов прямо не поднят.

        2. license_type:
           Тип регуляторного титула. Используй только:
           - "transport_license" — лицензия на перевозки;
           - "permit" — разрешение на перевозку;
           - "certificate" — свидетельство/допуск;
           - "dopog" — ДОПОГ-свидетельство;
           - "other" — иной документ;
           - "not_defined" — тип не определён.

        3. license_number:
           Номер и дата выдачи документа из текста договора (например: "ЛП-0012345 от 15.03.2024").
           Если не указан — "not_defined".

        4. maintenance_obligation:
           - "yes" — если зафиксировано прямое обязательство перевозчика поддерживать документ в силе;
           - "no" — если прямо указано, что перевозчик не обязан продлевать или актуализировать документ;
           - "not_defined" — если обязательство прямо не урегулировано.

        5. carrier_license_snippet:
           Точная цитата из договора о регуляторном титуле перевозчика. Если нет — "not_defined".

        6. license_mentioned_display:
           "Упомянута" / "Не упомянута" / "Не указано".

        7. license_type_display:
           "Лицензия на перевозки" / "Разрешение на перевозку" / "Свидетельство/допуск" / "ДОПОГ-свидетельство" / "Иной документ" / "Не определён".

        8. maintenance_obligation_display:
           "Обязан поддерживать" / "Не обязана" / "Не указано".
        </task>

        <context_rules>
        - Перед остальными полями заполни carrier_license_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все поля = "not_defined" / соответствующий fallback.
        - Не подставляй обязательность лицензии из закона, если она отсутствует в самом договоре.
        - Если указан только общий статус "имеет право осуществлять перевозки" без конкретного документа, считай license_mentioned = "no".
        - Не используй "None", "null" или пустые строки.
        - Все 9 ключей должны присутствовать в JSON-ответе.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В договоре перевозки вообще нет упоминания лицензий, разрешений или допусков.
           → presence = "missing";
             license_mentioned = "not_defined";
             license_type = "not_defined".

        2. Общий статус без конкретного документа.
           "Перевозчик гарантирует, что имеет законное право оказывать услуги перевозки."
           → presence = "present";
             license_mentioned = "no";
             license_type = "not_defined".

        3. Противоречие между фрагментами.
           В одном месте указана лицензия №123, в другом — написано, что лицензирование к этой перевозке неприменимо.
           → presence = "unclear";
             license_mentioned = "not_defined";
             license_type = "not_defined".

        4. Обязанность без реквизитов документа.
           "Перевозчик гарантирует наличие всех необходимых лицензий и обязуется поддерживать их в силе." (номера нет).
           → presence = "present";
             license_mentioned = "yes";
             license_number = "not_defined";
             maintenance_obligation = "yes".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для carrier_license_check_presence используй только: "present", "missing", "unclear".
        - Для license_mentioned, maintenance_obligation используй только: "yes", "no", "not_defined".
        - Для license_type используй только: "transport_license", "permit", "certificate", "dopog", "other", "not_defined".
        - Fallback при отсутствии данных:
          * license_number, carrier_license_snippet → "not_defined";
          * все *_display → соответствующие fallback-строки.
        - Fallback при противоречии или неоднозначности:
          * все *_display → соответствующие fallback-строки.
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "carrier_license_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие условий о лицензии/разрешении. Внутреннее агрегатное signal-поле."
          required: true

        - name: "license_mentioned"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Лицензия/разрешение упомянуты. Внутреннее enum-поле."
          required: true
          display_in_grid: false
        - name: "license_type"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["transport_license", "permit", "certificate", "dopog", "other", "not_defined"]
          description: "Тип регуляторного документа. Внутреннее enum-поле."
          required: true
          display_in_grid: false
        - name: "license_number"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 1
          label: "Номер документа"
          description: >
            Номер лицензии/разрешения/свидетельства. Fallback: "Не установлено" / "Не удалось определить".
          required: true
        - name: "maintenance_obligation"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Обязанность поддерживать документ в силе. Внутреннее enum-поле."
          required: true
          display_in_grid: false
        - name: "carrier_license_snippet"
          type: "string"
          presentation: "diagnostic"
          display_in_grid: false
          description: "Цитата о регуляторном титуле перевозчика"
          required: true
        - name: "license_mentioned_display"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 2
          label: "Лицензия/разрешение"
          description: >
            User-friendly отображение: упомянута ли лицензия/разрешение перевозчика. Fallback: "Не установлено" / "Не удалось определить".
          required: true
        - name: "license_type_display"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 3
          label: "Тип документа"
          description: >
            User-friendly отображение типа регуляторного документа перевозчика. Fallback: "Не установлено" / "Не удалось определить".
          required: true
        - name: "maintenance_obligation_display"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 4
          label: "Обязанность поддерживать"
          description: >
            User-friendly отображение: обязана ли сторона поддерживать документ в силе. Fallback: "Не установлено" / "Не удалось определить".
          required: true
      store_payload: true

  - id: packaging_and_marking
    name: "Тара, упаковка и маркировка груза"
    description: >
      Проверяет требования к таре, упаковке, маркировке и пломбированию
      груза, а также распределение ответственности за соблюдение таких
      требований.
      Базовые обязанности грузоотправителя по упаковке и маркировке
      частично проверяются в check-е shipper_obligations_and_warranties_check;
      данный check добавляет детализацию: требования к пломбированию,
      конкретные требования к упаковке/маркировке и распределение
      ответственности между сторонами.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "medium"
    severity_if_pass: "pass"
    severity_if_fail: "medium"
    severity_if_unclear: "low"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "тара"
        - "упаковка"
        - "маркировка"
        - "пломба"
        - "пломбирование"
        - "целостность упаковки"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)(тар(а|ы|у)|упаковк(а|и|у)|маркировк(а|и|у))"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по транспортным договорам.
        Анализируется договор перевозки груза.
        Проверяются ТОЛЬКО требования к упаковке, таре, маркировке и пломбированию груза.

        [ЗАДАЧА]
        Установи:
        1. Есть ли требования к упаковке.
        2. Есть ли требования к маркировке.
        3. Есть ли упоминание пломб/пломбирования.
        4. Кто отвечает за соблюдение этих требований.
        5. Приведи точную цитату из договора.
        6. Сформируй user-friendly значения для отображения в DD Grid.

        [ПРАВИЛА]
        1. Используй только текст договора.
        2. Не путай упаковку груза с коммерческой упаковкой товара.
        3. Если сторона ответственности прямо не названа — responsible_party = "not_defined".
        4. Если сказано только, что груз должен быть упакован, но без деталей — packaging_requirements_present = "yes".
        5. Не используй "None", "null" или пустые строки — используй "not_defined".
        6. В packaging_marking_snippet включай только цитату из договора.
        7. Для *_display полей используй понятные русские формулировки:
          - packaging_requirements_present: yes → "Предусмотрены", no → "Не предусмотрены", not_defined → "Не указано"
          - marking_requirements_present: yes → "Предусмотрены", no → "Не предусмотрены", not_defined → "Не указано"
          - sealing_mentioned: yes → "Предусмотрено", no → "Не предусмотрено", not_defined → "Не указано"
          - responsible_party: shipper → "Грузоотправитель", carrier → "Перевозчик", not_defined → "Не указана"
        8. Верни РОВНО один JSON-объект со всеми 9 ключами без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — все требования указаны с ответственной стороной:
        Фрагмент:
        "Грузоотправитель обязан обеспечить упаковку груза, соответствующую требованиям транспортной безопасности, маркировку груза с указанием наименования, веса и адреса получателя, а также пломбирование груза перед передачей Перевозчику. Перевозчик обязан проверить целостность упаковки и пломб при приёмке груза."

        Ответ:
        {
          "packaging_requirements_present": "yes",
          "marking_requirements_present": "yes",
          "sealing_mentioned": "yes",
          "responsible_party": "shipper",
          "packaging_marking_snippet": "Грузоотправитель обязан обеспечить упаковку груза, соответствующую требованиям транспортной безопасности, маркировку груза с указанием наименования, веса и адреса получателя, а также пломбирование груза перед передачей Перевозчику. Перевозчик обязан проверить целостность упаковки и пломб при приёмке груза.",
          "packaging_requirements_present_display": "Предусмотрены",
          "marking_requirements_present_display": "Предусмотрены",
          "sealing_mentioned_display": "Предусмотрено",
          "responsible_party_display": "Грузоотправитель"
        }

        Пример 2 — требования не упомянуты:
        Фрагмент:
        "Перевозчик обязуется доставить груз в пункт назначения в установленный срок."

        Ответ:
        {
          "packaging_requirements_present": "not_defined",
          "marking_requirements_present": "not_defined",
          "sealing_mentioned": "not_defined",
          "responsible_party": "not_defined",
          "packaging_marking_snippet": "not_defined",
          "packaging_requirements_present_display": "Не указано",
          "marking_requirements_present_display": "Не указано",
          "sealing_mentioned_display": "Не указано",
          "responsible_party_display": "Не указана"
        }

        Пример 3 — текст есть, но вывод невозможен (размытая формулировка без конкретики):
        Фрагмент:
        "Груз должен быть надлежащим образом подготовлен к перевозке."

        Ответ:
        {
          "packaging_requirements_present": "not_defined",
          "marking_requirements_present": "not_defined",
          "sealing_mentioned": "not_defined",
          "responsible_party": "not_defined",
          "packaging_marking_snippet": "Груз должен быть надлежащим образом подготовлен к перевозке.",
          "packaging_requirements_present_display": "Не указано",
          "marking_requirements_present_display": "Не указано",
          "sealing_mentioned_display": "Не указано",
          "responsible_party_display": "Не указана"
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        Перед ответом внутренне проверь:
        1. Есть ли прямая цитата о требованиях к упаковке/маркировке/пломбированию.
        2. Не путаешь ли ты упаковку груза с коммерческой упаковкой товара.
        3. Названа ли конкретная сторона ответственности.
        4. Если прямого указания нет — верни "not_defined".
        5. Все 9 ключей присутствуют в JSON.

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь РОВНО одним JSON-объектом со всеми 9 ключами со всеми 9 ключами:
        {
          "packaging_requirements_present": "<yes / no / not_defined>",
          "marking_requirements_present": "<yes / no / not_defined>",
          "sealing_mentioned": "<yes / no / not_defined>",
          "responsible_party": "<shipper / carrier / not_defined>",
          "packaging_marking_snippet": "<точная цитата или not_defined>",
          "packaging_requirements_present_display": "<Предусмотрены / Не предусмотрены / Не указано>",
          "marking_requirements_present_display": "<Предусмотрены / Не предусмотрены / Не указано>",
          "sealing_mentioned_display": "<Предусмотрено / Не предусмотрено / Не указано>",
          "responsible_party_display": "<Грузоотправитель / Перевозчик / Не указана>"
        }
      context_k: 4
      temperature: 0.0
      max_tokens: 600
    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "тара упаковка маркировка пломба пломбирование целостность упаковки требования к упаковке требования к маркировке"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - procedures
      negative_keywords:
        - "провозная плата"
        - "претензия"
        - "форс-мажор"
        - "коммерческая упаковка"
        - "товарная упаковка"
      position_bias:
        preferred_range: [0.0, 0.80]
        boost: 0.15
        scope: auto
      retrieval_profile: "technical_documentation_check"
      context_k: 4
      max_chunks: 6
      rerank: true
    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
        - "invoice"
      preferred_clause_functions:
        - "obligations"
        - "procedures"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10
    evidence:
      required: true
      min_snippet_length: 15
      max_snippet_length: 300
    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1100

      compact_output: false

      presence_signal:
        field: "packaging_and_marking_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист по транспортным договорам.
        Извлеки только требования к упаковке, маркировке и пломбированию груза.
        Не анализируй цену, сроки доставки, ответственность, претензии и иные разделы.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. packaging_and_marking_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей (packaging_requirements_present, marking_requirements_present, sealing_mentioned) = "yes";
           - "missing" — если все три содержательных поля равны "not_defined" / "no"
             и фрагментов об упаковке или маркировке груза в контексте нет;
           - "unclear" — если фрагменты по теме есть, но из-за противоречий вывод невозможен.

           Если presence = "missing":
           - packaging_requirements_present = "not_defined";
           - marking_requirements_present = "not_defined";
           - sealing_mentioned = "not_defined";
           - responsible_party = "not_defined";
           - packaging_marking_snippet = "not_defined";
           - все *_display = соответствующий fallback;
           - не выполняй остальные шаги.

        1. packaging_requirements_present:
           - "yes" — если конкретные требования к упаковке/таре груза прямо установлены договором;
           - "no" — если требования к упаковке груза договором прямо исключены;
           - "not_defined" — если требования прямо не упомянуты.

        2. marking_requirements_present:
           - "yes" — если конкретные требования к маркировке груза прямо установлены договором;
           - "no" — если требования к маркировке груза договором прямо исключены;
           - "not_defined" — если требования прямо не упомянуты.

        3. sealing_mentioned:
           - "yes" — если пломбирование/опечатывание груза/ТС прямо предусмотрено договором;
           - "no" — если в пломбировании прямо отказано / не предусмотрено;
           - "not_defined" — если вопрос пломб прямо не упомянут.

        4. responsible_party:
           - "shipper" — грузоотправитель;
           - "carrier" — перевозчик;
           - "not_defined" — ответственная сторона за соблюдение требований к таре/упаковке не указана.

        5. packaging_marking_snippet:
           Точная цитата из договора о таре, упаковке и маркировке. Если нет — "not_defined".

        6. packaging_requirements_present_display:
           "Предусмотрены" / "Не предусмотрены" / "Не указано".

        7. marking_requirements_present_display:
           "Предусмотрены" / "Не предусмотрены" / "Не указано".

        8. sealing_mentioned_display:
           "Предусмотрено" / "Не предусмотрено" / "Не указано".

        9. responsible_party_display:
           "Грузоотправитель" / "Перевозчик" / "Не указана".
        </task>

        <context_rules>
        - Перед остальными полями заполни packaging_and_marking_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все поля = "not_defined" / соответствующий fallback.
        - Не путай требования к физической упаковке груза для безопасной перевозки с коммерческой/товарной упаковкой (для продажи).
        - Если сторона ответственности прямо не указана в тексте, используй "not_defined".
        - Не используй "None", "null" или пустые строки.
        - Все 9 ключей должны присутствовать в JSON-ответе.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В договоре перевозки вообще нет упоминания тары, упаковки, маркировки или пломб.
           → presence = "missing";
             packaging_requirements_present = "not_defined";
             responsible_party = "not_defined".

        2. Общие правила без деталей.
           "Груз перевозится в надлежащей таре и упаковке." (без уточнения чьими силами и как именно).
           → presence = "present";
             packaging_requirements_present = "yes";
             responsible_party = "not_defined".

        3. Противоречие между фрагментами.
           В одном месте грузоотправитель пломбирует ТС, в другом — написано, что пломбирование осуществляет перевозчик.
           → presence = "unclear";
             sealing_mentioned = "not_defined";
             responsible_party = "not_defined".

        4. Отсылка к ГОСТам.
           "Упаковка и маркировка грузов должны соответствовать требованиям ГОСТ."
           → presence = "present";
             packaging_requirements_present = "yes";
             marking_requirements_present = "yes";
             packaging_marking_snippet содержит цитату со ссылкой на ГОСТ.
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для packaging_and_marking_presence используй только: "present", "missing", "unclear".
        - Для packaging_requirements_present, marking_requirements_present, sealing_mentioned используй только: "yes", "no", "not_defined".
        - Для responsible_party используй только: "shipper", "carrier", "not_defined".
        - Fallback при отсутствии данных:
          * packaging_marking_snippet → "not_defined";
          * все *_display → соответствующие fallback-строки.
        - Fallback при противоречии или неоднозначности:
          * все *_display → соответствующие fallback-строки.
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "packaging_and_marking_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие требований к упаковке/маркировке. Внутреннее агрегатное signal-поле."
          required: true

        - name: "packaging_requirements_present"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Требования к упаковке есть. Внутреннее enum-поле."
          required: true
          display_in_grid: false
        - name: "marking_requirements_present"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Требования к маркировке есть. Внутреннее enum-поле."
          required: true
          display_in_grid: false
        - name: "sealing_mentioned"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Пломбирование упоминается. Внутреннее enum-поле."
          required: true
          display_in_grid: false
        - name: "responsible_party"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["shipper", "carrier", "not_defined"]
          description: "Ответственная сторона. Внутреннее enum-поле."
          required: true
          display_in_grid: false
        - name: "packaging_marking_snippet"
          type: "string"
          presentation: "diagnostic"
          display_in_grid: false
          description: "Цитата о требованиях к упаковке/маркировке/пломбированию"
          required: true
        - name: "packaging_requirements_present_display"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 1
          label: "Требования к упаковке"
          description: >
            User-friendly отображение: предусмотрены ли требования к упаковке. Fallback: "Не установлено" / "Не удалось определить".
          required: true
        - name: "marking_requirements_present_display"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 2
          label: "Требования к маркировке"
          description: >
            User-friendly отображение: предусмотрены ли требования к маркировке. Fallback: "Не установлено" / "Не удалось определить".
          required: true
        - name: "sealing_mentioned_display"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 3
          label: "Пломбирование"
          description: >
            User-friendly отображение: предусмотрено ли пломбирование. Fallback: "Не установлено" / "Не удалось определить".
          required: true
        - name: "responsible_party_display"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 4
          label: "Ответственная сторона"
          description: >
            User-friendly отображение стороны, ответственной за соблюдение требований. Fallback: "Не установлено" / "Не удалось определить".
          required: true
      store_payload: true

  - id: gps_tracking
    name: "GPS/ГЛОНАСС-мониторинг и отслеживание груза"
    description: >
      Проверяет наличие условий о GPS/ГЛОНАСС-мониторинге транспорта,
      доступе грузоотправителя/клиента к данным отслеживания и обязательности
      такого контроля. Специфический технологический check для современных
      транспортных договоров с требованиями прозрачности перевозки.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "low"
    severity_if_pass: "pass"
    severity_if_fail: "low"
    severity_if_unclear: "low"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "GPS"
        - "ГЛОНАСС"
        - "мониторинг"
        - "отслеживание"
        - "трекинг"
        - "местоположение груза"
        - "система мониторинга транспорта"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)\\bGPS\\b|\\bГЛОНАСС\\b"
        - "(?i)отслежива(ние|ть)\\s+груз"
        - "(?i)мониторинг\\s+(транспорт|груз)"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по транспортным договорам.
        Анализируется договор перевозки груза.
        Проверяются ТОЛЬКО условия GPS/ГЛОНАСС-мониторинга транспорта
        и отслеживания груза.

        [ЗАДАЧА]
        Установи:
        1. Есть ли требование GPS/ГЛОНАСС-мониторинга.
        2. Какая система упоминается (GPS, ГЛОНАСС, комбинированная или иная).
        3. Есть ли право доступа к данным мониторинга у грузоотправителя/клиента.
        4. Приведи точную цитату из договора.
        5. Сформируй user-friendly значения для отображения в DD Grid.

        [ПРАВИЛА]
        1. Используй только текст договора.
        2. Не подменяй общую фразу о контроле транспорта наличием GPS.
        3. Если технология отслеживания не конкретизирована — monitoring_system = "not_defined".
        4. Если мониторинг не упомянут — gps_monitoring_present = "not_defined".
        5. Не используй "None", "null" или пустые строки — используй "not_defined".
        6. В gps_tracking_snippet включай только цитату из договора.
        7. Для *_display полей используй понятные русские формулировки:
          - gps_monitoring_present: yes → "Предусмотрен", no → "Не предусмотрен", not_defined → "Не указано"
          - monitoring_system:
            * GPS → "GPS"
            * GLONASS → "ГЛОНАСС"
            * combined → "GPS/ГЛОНАСС"
            * other → "Иная система"
            * not_defined → "Не указана"
          - access_for_shipper: yes → "Есть", no → "Нет", not_defined → "Не указано"
        8. Верни РОВНО один JSON-объект со всеми 8 ключами без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — мониторинг предусмотрен с доступом для грузоотправителя:
        Фрагмент:
        "Перевозчик обязан обеспечить оснащение транспортных средств системой ГЛОНАСС/GPS-мониторинга. Грузоотправитель имеет право доступа к данным мониторинга местоположения груза в режиме реального времени через личный кабинет на сайте Перевозчика."

        Ответ:
        {
          "gps_monitoring_present": "yes",
          "monitoring_system": "combined",
          "access_for_shipper": "yes",
          "gps_tracking_snippet": "Перевозчик обязан обеспечить оснащение транспортных средств системой ГЛОНАСС/GPS-мониторинга. Грузоотправитель имеет право доступа к данным мониторинга местоположения груза в режиме реального времени через личный кабинет на сайте Перевозчика.",
          "gps_monitoring_present_display": "Предусмотрен",
          "monitoring_system_display": "GPS/ГЛОНАСС",
          "access_for_shipper_display": "Есть"
        }

        Пример 2 — мониторинг не упомянут:
        Фрагмент:
        "Перевозчик обязуется доставить груз в пункт назначения в установленный срок."

        Ответ:
        {
          "gps_monitoring_present": "not_defined",
          "monitoring_system": "not_defined",
          "access_for_shipper": "not_defined",
          "gps_tracking_snippet": "not_defined",
          "gps_monitoring_present_display": "Не указано",
          "monitoring_system_display": "Не указана",
          "access_for_shipper_display": "Не указано"
        }

        Пример 3 — текст есть, но вывод невозможен (размытая формулировка без конкретики):
        Фрагмент:
        "Перевозчик обеспечивает контроль движения транспортного средства в соответствии с требованиями законодательства."

        Ответ:
        {
          "gps_monitoring_present": "not_defined",
          "monitoring_system": "not_defined",
          "access_for_shipper": "not_defined",
          "gps_tracking_snippet": "Перевозчик обеспечивает контроль движения транспортного средства в соответствии с требованиями законодательства.",
          "gps_monitoring_present_display": "Не указано",
          "monitoring_system_display": "Не указана",
          "access_for_shipper_display": "Не указано"
        }

        Пример 4 — мониторинг предусмотрен, но без доступа для грузоотправителя:
        Фрагмент:
        "Все транспортные средства Перевозчика оснащены системой GPS-мониторинга. Информация о местоположении груза предоставляется Грузоотправителю по его письменному запросу не чаще одного раза в сутки."

        Ответ:
        {
          "gps_monitoring_present": "yes",
          "monitoring_system": "GPS",
          "access_for_shipper": "yes",
          "gps_tracking_snippet": "Все транспортные средства Перевозчика оснащены системой GPS-мониторинга. Информация о местоположении груза предоставляется Грузоотправителю по его письменному запросу не чаще одного раза в сутки.",
          "gps_monitoring_present_display": "Предусмотрен",
          "monitoring_system_display": "GPS",
          "access_for_shipper_display": "Есть"
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        Перед ответом внутренне проверь:
        1. Есть ли прямая цитата о GPS/ГЛОНАСС-мониторинге (не просто "контроль транспорта").
        2. Конкретизирована ли система мониторинга.
        3. Есть ли прямое указание на доступ грузоотправителя к данным.
        4. Если прямого указания нет — верни "not_defined".
        5. Все 8 ключей присутствуют в JSON.

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь РОВНО одним JSON-объектом со всеми 8 ключами со всеми 8 ключами:
        {
          "gps_monitoring_present": "<yes / no / not_defined>",
          "monitoring_system": "<GPS / GLONASS / combined / other / not_defined>",
          "access_for_shipper": "<yes / no / not_defined>",
          "gps_tracking_snippet": "<точная цитата или not_defined>",
          "gps_monitoring_present_display": "<Предусмотрен / Не предусмотрен / Не указано>",
          "monitoring_system_display": "<GPS / ГЛОНАСС / GPS/ГЛОНАСС / Иная система / Не указана>",
          "access_for_shipper_display": "<Есть / Нет / Не указано>"
        }
      context_k: 4
      temperature: 0.0
      max_tokens: 500
    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "GPS ГЛОНАСС мониторинг отслеживание трекинг местоположение груза система мониторинга транспорта личный кабинет"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - procedures
      negative_keywords:
        - "провозная плата"
        - "претензия"
        - "неустойка"
        - "форс-мажор"
      position_bias:
        preferred_range: [0.0, 0.90]
        boost: 0.10
        scope: auto
      retrieval_profile: "technical_documentation_check"
      context_k: 4
      max_chunks: 5
      rerank: true
    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
        - "invoice"
      preferred_clause_functions:
        - "obligations"
      confidence_bonus_on_match: 0.05
      confidence_penalty_on_excluded_segment: 0.10
    evidence:
      required: true
      min_snippet_length: 15
      max_snippet_length: 300
    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1100

      compact_output: false

      presence_signal:
        field: "gps_tracking_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист по транспортным договорам.
        Извлеки только условия GPS/ГЛОНАСС-мониторинга транспорта и отслеживания груза.
        Не анализируй цену, сроки доставки, ответственность, претензии и иные разделы.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. gps_tracking_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если gps_monitoring_present ∈ {"yes", "no"};
           - "missing" — если gps_monitoring_present = "not_defined"
             и фрагментов о GPS/ГЛОНАСС или трекинге груза в контексте нет;
           - "unclear" — если фрагменты по теме есть, но из-за противоречий вывод невозможен.

           Если presence = "missing":
           - gps_monitoring_present = "not_defined";
           - monitoring_system = "not_defined";
           - access_for_shipper = "not_defined";
           - gps_tracking_snippet = "not_defined";
           - все *_display = соответствующий fallback;
           - не выполняй остальные шаги.

        1. gps_monitoring_present:
           - "yes" — если требование GPS/ГЛОНАСС-мониторинга транспорта прямо предусмотрено договором;
           - "no" — если договором прямо исключена обязанность по установке или использованию мониторинговых систем;
           - "not_defined" — если мониторинг прямо не упомянут.

        2. monitoring_system:
           Тип навигационной системы. Используй только:
           - "GPS" — система GPS;
           - "GLONASS" — система ГЛОНАСС;
           - "combined" — комбинированная навигационная система GPS/ГЛОНАСС;
           - "other" — иная система мониторинга;
           - "not_defined" — навигационная система не названа.

        3. access_for_shipper:
           - "yes" — если прямо установлено право доступа грузоотправителя к данным мониторинга (через трекер, личный кабинет, email и т.п.);
           - "no" — если право доступа грузоотправителя к навигационным данным прямо исключено;
           - "not_defined" — если вопрос предоставления доступа грузоотправителю не урегулирован.

        4. gps_tracking_snippet:
           Точная цитата из договора об условиях GPS/ГЛОНАСС-мониторинга. Если нет — "not_defined".

        5. gps_monitoring_present_display:
           "Предусмотрен" / "Не предусмотрен" / "Не указано".

        6. monitoring_system_display:
           "GPS" / "ГЛОНАСС" / "GPS/ГЛОНАСС" / "Иная система" / "Не указана".

        7. access_for_shipper_display:
           "Есть" / "Нет" / "Не указано".
        </task>

        <context_rules>
        - Перед остальными полями заполни gps_tracking_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все поля = "not_defined" / соответствующий fallback.
        - Не подменяй общую фразу о контроле движения навигационными системами GPS/ГЛОНАСС, если они прямо не названы.
        - Если в договоре упоминаются одновременно и GPS, и ГЛОНАСС — используй "combined".
        - Не используй "None", "null" или пустые строки.
        - Все 8 ключей должны присутствовать в JSON-ответе.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В договоре вообще нет упоминания GPS, ГЛОНАСС, мониторинга или трекинга транспорта.
           → presence = "missing";
             gps_monitoring_present = "not_defined";
             monitoring_system = "not_defined".

        2. Информационная обязанность без GPS.
           "Перевозчик сообщает о местонахождении груза по телефону."
           → presence = "missing";
             gps_monitoring_present = "not_defined" (телефонный звонок не является GPS/ГЛОНАСС трекингом).

        3. Противоречие между фрагментами.
           В одном месте указан обязательный ГЛОНАСС-трекинг, в другом — написано, что отслеживание силами перевозчика не осуществляется.
           → presence = "unclear";
             gps_monitoring_present = "not_defined";
             gps_monitoring_present_display = "Не указано".

        4. Комбинированная система без реквизитов доступа.
           "ТС оборудуются ГЛОНАСС/GPS." (про доступ грузоотправителя ничего не сказано).
           → presence = "present";
             gps_monitoring_present = "yes";
             monitoring_system = "combined";
             access_for_shipper = "not_defined".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для gps_tracking_presence используй только: "present", "missing", "unclear".
        - Для gps_monitoring_present, access_for_shipper используй только: "yes", "no", "not_defined".
        - Для monitoring_system используй только: "GPS", "GLONASS", "combined", "other", "not_defined".
        - Fallback при отсутствии данных:
          * gps_tracking_snippet → "not_defined";
          * все *_display → соответствующие fallback-строки.
        - Fallback при противоречии или неоднозначности:
          * все *_display → соответствующие fallback-строки.
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "gps_tracking_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие GPS/ГЛОНАСС мониторинга. Внутреннее агрегатное signal-поле."
          required: true

        - name: "gps_monitoring_present"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Мониторинг предусмотрен. Внутреннее enum-поле."
          required: true
          display_in_grid: false
        - name: "monitoring_system"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["GPS", "GLONASS", "combined", "other", "not_defined"]
          description: "Система мониторинга. Внутреннее enum-поле."
          required: true
          display_in_grid: false
        - name: "access_for_shipper"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Доступ к данным есть. Внутреннее enum-поле."
          required: true
          display_in_grid: false
        - name: "gps_tracking_snippet"
          type: "string"
          presentation: "diagnostic"
          display_in_grid: false
          description: "Цитата об условиях GPS/ГЛОНАСС-мониторинга"
          required: true
        - name: "gps_monitoring_present_display"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 1
          label: "GPS/ГЛОНАСС-мониторинг"
          description: >
            User-friendly отображение: предусмотрен ли мониторинг транспорта. Fallback: "Не установлено" / "Не удалось определить".
          required: true
        - name: "monitoring_system_display"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 2
          label: "Система мониторинга"
