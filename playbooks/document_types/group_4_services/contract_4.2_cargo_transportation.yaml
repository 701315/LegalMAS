  - id: incident_notification
    name: "Уведомление о происшествиях в пути"
    description: >
      Проверяет порядок уведомления грузоотправителя/грузополучателя
      о происшествиях в пути следования: ДТП, хищение, пожар, порча
      или утрата груза. Охватывает сроки, форму уведомления и обязанность
      вызова компетентных органов (ст. 796 ГК РФ, ст. 34 УАТ,
      ст. 118 УЖТ). Критический check для сохранения права на возмещение.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "уведомление о происшествии"
        - "ДТП"
        - "хищение груза"
        - "порча в пути"
        - "авария"
        - "немедленно уведомить"
        - "вызов полиции"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)уведомлен.*о.*(происшеств|авари|хищен|порч|утрат)"
        - "(?i)немедленн.*уведом"
        - "(?i)вызов.*(полици|милици|ГИБДД)"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по транспортным договорам.
        Анализируется договор перевозки груза.
        Проверяются ТОЛЬКО условия уведомления о происшествиях в пути
        следования (ДТП, хищение, пожар, порча, утрата груза).

        Нормативный ориентир:
        - ст. 796 ГК РФ
        - ст. 34 УАТ (ФЗ-259)
        - ст. 118 УЖТ

        [ЗАДАЧА]
        Установи:
        1. Есть ли обязанность перевозчика уведомить о происшествии.
        2. Установлен ли срок уведомления (часы, дни).
        3. Указана ли форма уведомления (телефон, email, письменная).
        4. Есть ли обязанность вызова полиции/ГИБДД или составления акта.
        5. Приведи точную цитату из договора.
        6. Сформируй user-friendly значения для DD Grid.

        [ПРАВИЛА]
        1. Используй только текст договора.
        2. Не подставляй обязанности из закона, если их нет в договоре.
        3. Не путай уведомление о происшествии с уведомлением о задержке доставки.
        4. Если срок не указан — notification_deadline = "not_defined".
        5. Не используй "None", "null" или пустые строки — используй "not_defined".
        6. В incident_snippet включай только цитату из договора.
        7. Для *_display полей используй понятные русские формулировки.
        8. Верни РОВНО один JSON-объект со всеми 9 ключами.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — полное уведомление:
        Фрагмент:
        "В случае ДТП, хищения, пожара или иного происшествия, повлёкшего утрату или повреждение груза, Перевозчик обязан немедленно, но не позднее 2 (двух) часов с момента происшествия, уведомить Грузоотправителя по телефону и в течение 24 часов направить письменное уведомление с приложением акта, составленного с участием сотрудников полиции."

        Ответ:
        {
          "notification_obligation": "yes",
          "notification_deadline": "2 часа (телефон), 24 часа (письменно)",
          "notification_form": "any",
          "police_call_required": "yes",
          "incident_snippet": "В случае ДТП, хищения, пожара или иного происшествия, повлёкшего утрату или повреждение груза, Перевозчик обязан немедленно, но не позднее 2 (двух) часов с момента происшествия, уведомить Грузоотправителя по телефону и в течение 24 часов направить письменное уведомление с приложением акта, составленного с участием сотрудников полиции.",
          "notification_obligation_display": "Предусмотрена",
          "notification_deadline_display": "2 часа (телефон), 24 часа (письменно)",
          "notification_form_display": "Любая",
          "police_call_required_display": "Требуется"
        }

        Пример 2 — не упомянуто:
        Фрагмент:
        "Перевозчик обязуется доставить груз в пункт назначения."

        Ответ:
        {
          "notification_obligation": "not_defined",
          "notification_deadline": "not_defined",
          "notification_form": "not_defined",
          "police_call_required": "not_defined",
          "incident_snippet": "not_defined",
          "notification_obligation_display": "Не указано",
          "notification_deadline_display": "Не указан",
          "notification_form_display": "Не указана",
          "police_call_required_display": "Не указано"
        }

        [ФОРМАТ ОТВЕТА]
        {
          "notification_obligation": "<yes / no / not_defined>",
          "notification_deadline": "<срок или not_defined>",
          "notification_form": "<written / phone / any / not_defined>",
          "police_call_required": "<yes / no / not_defined>",
          "incident_snippet": "<точная цитата или not_defined>",
          "notification_obligation_display": "<Предусмотрена / Не предусмотрена / Не указано>",
          "notification_deadline_display": "<срок / Не указан>",
          "notification_form_display": "<Письменная / Телефон / Любая / Не указана>",
          "police_call_required_display": "<Требуется / Не требуется / Не указано>"
        }
      context_k: 4
      temperature: 0.0
      max_tokens: 600
    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "уведомление о происшествии ДТП хищение груза порча в пути авария немедленно уведомить вызов полиции"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - procedures
        - obligations
      negative_keywords:
        - "провозная плата"
        - "претензия"
        - "форс-мажор"
        - "просрочка доставки"
      position_bias:
        preferred_range: [0.2, 0.90]
        boost: 0.15
        scope: auto
      retrieval_profile: "acceptance_check"
      context_k: 4
      max_chunks: 5
      rerank: true
    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
        - "invoice"
      preferred_clause_functions:
        - "procedures"
        - "obligations"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10
    evidence:
      required: true
      min_snippet_length: 20
      max_snippet_length: 400
    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1100

      compact_output: false

      presence_signal:
        field: "incident_notification_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист по транспортным договорам.
        Извлеки только условия уведомления о происшествиях в пути
        следования (ДТП, хищение, пожар, порча, утрата груза).
        Не анализируй уведомление о задержке доставки, цену,
        ответственность, претензии и иные разделы.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. incident_notification_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если notification_obligation ∈ {"yes", "no"};
           - "missing" — если notification_obligation = "not_defined"
             и фрагментов об уведомлении о происшествиях в контексте нет;
           - "unclear" — если фрагменты есть, но противоречивы.

           Если presence = "missing":
           - notification_obligation = "not_defined";
           - notification_deadline = "not_defined";
           - notification_form = "not_defined";
           - police_call_required = "not_defined";
           - incident_snippet = "not_defined";
           - все *_display = соответствующий fallback;
           - не выполняй остальные шаги.

        1. notification_obligation:
           - "yes" — если обязанность перевозчика уведомить грузоотправителя
             о происшествии в пути прямо предусмотрена;
           - "no" — если такая обязанность прямо исключена;
           - "not_defined" — если вопрос уведомления не урегулирован.

        2. notification_deadline:
           Срок уведомления из текста договора (например: "немедленно",
           "в течение 2 часов", "в течение 24 часов").
           Если не указан — "not_defined".

        3. notification_form:
           - "written" — письменная форма (email, письмо);
           - "phone" — телефонное уведомление;
           - "any" — любая форма (комбинированная или не конкретизирована);
           - "not_defined" — форма не указана.

        4. police_call_required:
           - "yes" — если прямо предусмотрена обязанность вызова полиции,
             ГИБДД или составления акта с участием компетентных органов;
           - "no" — если вызов полиции прямо не требуется;
           - "not_defined" — если вопрос не урегулирован.

        5. incident_snippet:
           Точная цитата из договора об уведомлении о происшествиях.
           Если нет — "not_defined".

        6. notification_obligation_display:
           "Предусмотрена" / "Не предусмотрена" / "Не указано".

        7. notification_deadline_display:
           Конкретный срок или "Не указан".

        8. notification_form_display:
           "Письменная" / "Телефон" / "Любая" / "Не указана".

        9. police_call_required_display:
           "Требуется" / "Не требуется" / "Не указано".
        </task>

        <context_rules>
        - Перед остальными полями заполни incident_notification_presence
          по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй
          "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все поля = "not_defined" /
          соответствующий fallback.
        - Не подставляй обязанности из УАТ/УЖТ, если их нет в договоре.
        - Не путай уведомление о происшествии (ДТП, хищение) с уведомлением
          о задержке доставки — это разные check-и.
        - Прямое исключение обязанности уведомления
          (notification_obligation = "no") — это presence = "present".
        - Не используй "None", "null" или пустые строки.
        - Все 9 ключей должны присутствовать в JSON-ответе.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В договоре нет упоминания уведомления о ДТП, хищении, пожаре
           или ином происшествии.
           → presence = "missing";
             notification_obligation = "not_defined".

        2. Уведомление без срока и формы.
           "Перевозчик обязан уведомить Грузоотправителя о любом
           происшествии с грузом." (срок и форма не названы).
           → presence = "present";
             notification_obligation = "yes";
             notification_deadline = "not_defined";
             notification_form = "not_defined".

        3. Противоречие между фрагментами.
           В одном месте уведомление в течение 2 часов, в другом —
           в течение 24 часов.
           → presence = "unclear";
             notification_deadline = "Не удалось определить".

        4. Уведомление о задержке ≠ уведомление о происшествии.
           "Перевозчик уведомляет о задержке доставки не позднее
           12 часов." (про ДТП/хищение ни слова).
           → presence = "missing";
             notification_obligation = "not_defined"
             (это задержка, не происшествие).
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для incident_notification_presence используй только:
          "present", "missing", "unclear".
        - Для notification_obligation, police_call_required используй
          только: "yes", "no", "not_defined".
        - Для notification_form используй только:
          "written", "phone", "any", "not_defined".
        - Fallback при отсутствии данных:
          * notification_deadline, incident_snippet → "not_defined";
          * все *_display → соответствующие fallback-строки.
        - Fallback при противоречии или неоднозначности:
          * notification_deadline → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан
          отдельным контрактом — соблюдай его, но не описывай здесь.
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "incident_notification_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие условий уведомления о происшествиях. Внутреннее агрегатное signal-поле."
          required: true

        - name: "notification_obligation"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Обязанность уведомить о происшествии в пути. Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "notification_deadline"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 1
          label: "Срок уведомления"
          description: >
            Срок уведомления грузоотправителя о происшествии.
            Fallback: "Не указан".
          required: true

        - name: "notification_form"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["written", "phone", "any", "not_defined"]
          description: "Форма уведомления о происшествии. Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "police_call_required"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Обязанность вызова полиции/ГИБДД при происшествии. Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "incident_snippet"
          type: "string"
          presentation: "diagnostic"
          display_in_grid: false
          description: "Цитата об условиях уведомления о происшествиях"
          required: true

        - name: "notification_obligation_display"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 2
          label: "Уведомление"
          description: >
            User-friendly: предусмотрена ли обязанность уведомления. Fallback: "Не установлено" / "Не удалось определить".
          required: true

        - name: "notification_deadline_display"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 3
          label: "Срок"
          description: >
            User-friendly: срок уведомления. Fallback: "Не установлено" / "Не удалось определить".
          required: true

        - name: "notification_form_display"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 4
          label: "Форма"
          description: >
            User-friendly: форма уведомления. Fallback: "Не установлено" / "Не удалось определить".
          required: true

        - name: "police_call_required_display"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 5
          label: "Полиция"
          description: >
            User-friendly: требуется ли вызов полиции. Fallback: "Не установлено" / "Не удалось определить".
          required: true
      store_payload: true

  - id: vehicle_condition
    name: "Техническое состояние транспортного средства"
    description: >
      Проверяет договорные требования к исправности ТС, кузову и прицепу
      (рефрижераторные установки, тент, цистерна), праву грузоотправителя на мотивированный
      отказ от приёма неисправного или загрязнённого ТС, а также распределение
      ответственности за технические поломки/аварии ТС в пути следования.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "medium"
    severity_if_pass: "pass"
    severity_if_fail: "medium"
    severity_if_unclear: "low"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "исправное транспортное средство"
        - "техническое состояние"
        - "рефрижератор"
        - "тент"
        - "цистерна"
        - "неисправность ТС"
        - "поломка автомобиля"
        - "пригодность ТС"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)исправн.*транспорт"
        - "(?i)рефрижератор|цистерн"
        - "(?i)поломк.*ТС|неисправност.*ТС"
        - "(?i)пригодно.*для.*перевозк"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по транспортным договорам.
        Анализируется договор перевозки груза.
        Проверяются ТОЛЬКО договорные требования к пригодности и технической исправности подаваемых ТС.

        Нормативный ориентир:
        - ст. 791 ГК РФ (подача исправных ТС, пригодных для перевозки соответствующего груза)

        [ЗАДАЧА]
        Установи:
        1. Содержит ли договор явные требования к подаче технически исправного и чистого ТС.
        2. Конкретизирован ли тип кузова/прицепа ТС под специфику груза (рефрижератор, тент, термос и т.д.).
        3. Установлена ли ответственность перевозчика за технические поломки ТС в пути следования и замену ТС.
        4. Приведи точную цитату из договора.
        5. Сформируй user-friendly значения для отображения в DD Grid.

        [ПРАВИЛА]
        1. Используй только текст договора.
        2. Не путай технические поломки в пути с общей ответственностью за просрочку доставки.
        3. Если требования к чистоте/исправности ТС отсутствуют — vehicle_condition_required = "not_defined".
        4. Если тип кузова ТС не конкретизирован — vehicle_type_specified = "not_defined".
        5. Не используй "None", "null" или пустые строки — используй "not_defined".
        6. В vehicle_snippet включай только цитату из договора.
        7. Для *_display полей используй понятные русские формулировки.
