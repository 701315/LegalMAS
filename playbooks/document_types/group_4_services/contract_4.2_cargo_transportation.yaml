          description: "Переадресовка предусмотрена. Внутреннее enum-поле."
          required: true
          display_in_grid: false
        - name: "who_can_redirect"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["shipper", "consignee", "either", "not_defined"]
          description: "Кто вправе переадресовать груз. Внутреннее enum-поле."
          required: true
          display_in_grid: false
        - name: "cost_allocation"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["shipper", "carrier", "not_defined"]
          display_in_grid: false
          description: "Кто несёт дополнительные расходы. Внутреннее enum-поле."
          required: true
        - name: "procedural_limitations"
          type: "string"
          presentation: "signal"
          risk_weight: "low"
