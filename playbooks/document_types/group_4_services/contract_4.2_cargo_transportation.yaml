          label: "Предел возмещения"
          description: "Размер или формула лимита ответственности"
          required: true
        - name: "liability_snippet"
          type: "string"
          presentation: "fact"
          display_in_grid: false
          display_priority: 2
          label: "Цитата"
          description: "Цитата условия об ответственности"
          required: true
      store_payload: true

