        7. freight_currency_display — "Рубли (RUB)" / "Доллары (USD)" / "Евро (EUR)" / "Иная валюта" / "Не указана".
        8. price_includes_vat_display — "Включён" / "Не включён" / "Нулевая ставка (0%)" / "Не указано".
        9. payment_method_display — "Предоплата" / "Постоплата" / "Частичная оплата" / "По тарифам перевозчика" / "Иной порядок" / "Не указан".

        Верни РОВНО один JSON-объект со всеми 9 ключами без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.
        </task>

        <rules>
        - Используй только текст договора.
        - Не подставляй закон вместо текста.
        - Если есть только "по тарифам перевозчика", то:
          * freight_amount = "по тарифам перевозчика"
          * payment_method = "tariff_based"
        - Если НДС не упомянут, price_includes_vat = "not_defined".
        - Для *_display полей используй маппинг:
          * freight_currency: RUB → "Рубли (RUB)", USD → "Доллары (USD)", EUR → "Евро (EUR)", other → "Иная валюта", not_defined → "Не указана"
          * price_includes_vat: yes → "Включён", no → "Не включён", zero_rate → "Нулевая ставка (0%)", not_defined → "Не указано"
          * payment_method: prepayment → "Предоплата", postpayment → "Постоплата", partial → "Частичная оплата", tariff_based → "По тарифам перевозчика", other → "Иной порядок", not_defined → "Не указан"
        - Не используй "None", "null" или пустые строки.
        - Все 9 ключей должны присутствовать в JSON-ответе.
        </rules>
      fields:
        - name: "freight_amount"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 1
          label: "Провозная плата"
