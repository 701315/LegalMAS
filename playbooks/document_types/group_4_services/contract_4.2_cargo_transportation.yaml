      temperature: 0.0
      max_tokens: 450
    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "право удержания удержание груза до уплаты до полной оплаты реализация удержанного хранение за счёт ст. 790 ст. 359"
      preferred_unit_types:
