      ответственности перевозчика за действия привлечённых лиц.
      Специфический check для транспортных договоров: субперевозка
      (ст. 785 ГК РФ), ответственность перевозчика за субперевозчика
      (ст. 313 ГК РФ), замена транспортного средства и водителя.
