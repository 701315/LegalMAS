        6. Все 6 ключей присутствуют в JSON.

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь РОВНО одним JSON-объектом без какого-либо дополнительного текста до или после, со всеми 6 ключами:
        {
          "carrier_details": "<текст или not_defined>",
          "shipper_details": "<текст или not_defined>",
          "consignee_details": "<текст или not_defined>",
          "signatory_basis": "<charter / poa / order / other / not_defined>",
          "parties_snippet": "<точная цитата или not_defined>",
          "signatory_basis_display": "<Устав / Доверенность / Приказ / Иное основание / Не указано>"
