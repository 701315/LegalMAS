          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["yes", "no"]
          description: "Перевозка является международной. Внутреннее enum-поле."
          required: true
          display_in_grid: false
        - name: "applicable_convention"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["CMR", "Montreal", "Hamburg", "Hague_Visby", "other", "not_defined"]
          description: "Применимая международная конвенция. Внутреннее enum-поле."
          required: true
          display_in_grid: false
        - name: "customs_responsibility_shipper"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Таможенные обязанности грузоотправителя установлены. Внутреннее enum-поле."
          required: true
          display_in_grid: false
        - name: "customs_responsibility_carrier"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Таможенные обязанности перевозчика установлены. Внутреннее enum-поле."
          required: true
          display_in_grid: false
        - name: "incoterms_term"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 1
          label: "Инкотермс"
          description: >
            Базис поставки по Incoterms. Fallback: "Не установлено" / "Не удалось определить".
          required: true
        - name: "international_snippet"
          type: "string"
          presentation: "diagnostic"
          display_in_grid: false
          description: "Цитата о международной перевозке"
