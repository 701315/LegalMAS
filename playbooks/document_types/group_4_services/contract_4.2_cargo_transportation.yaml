  - id: cargo_and_route
    name: "Предмет: груз и маршрут (ст. 785 ГК РФ)"
    description: >
      Проверяет наличие характеристик груза и маршрута перевозки:
      наименование груза, вес/объём, пункт отправления и пункт назначения.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "наименование груза"
        - "характер груза"
        - "вес груза"
        - "объём груза"
        - "количество мест"
        - "пункт отправления"
        - "пункт назначения"
        - "маршрут"
        - "адрес погрузки"
        - "адрес выгрузки"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)(из\\s+г\\.|пункт\\s+отправлени|пункт\\s+назначени)"
        - "(?i)\\b\\d[\\d\\s,.]*(?:кг|тонн|т\\b)"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по транспортным договорам.
        Анализируется договор перевозки груза.
        Проверяется только вопрос определения груза и маршрута перевозки.

        Нормативный ориентир:
        - ст. 785 ГК РФ

        [ЗАДАЧА]
        Установи:
        1. Как описан груз.
        2. Указан ли вес или иные количественные характеристики.
        3. Указан ли пункт отправления.
        4. Указан ли пункт назначения.
        5. Можно ли считать маршрут определённым.
        6. Каким видом транспорта осуществляется перевозка, если это прямо следует из текста.
        7. Является ли договор разовой перевозкой или рамочным (на организацию перевозок).
        8. Приведи точную цитату из договора.
        9. Сформируй user-friendly значения для отображения в DD Grid.

        [ПРАВИЛА]
        1. Используй только текст договора.
        2. Если характеристика не указана явно — ставь "not_defined".
        3. Не считай маршрут определённым только потому, что указан город одной стороны.
        4. Если есть только отправление или только назначение — route_defined = "partial".
        5. Если маршрут вообще не упоминается — route_defined = "not_defined".
        6. Вид транспорта определяй только по прямым указаниям текста; если не следует прямо — "not_defined".
        7. Рамочность фиксируй только при прямом указании на организацию перевозок или разовый характер.
        8. В cargo_route_snippet включай только цитату из договора.
        9. Для *_display полей используй понятные русские формулировки:
          - route_defined: yes → "Определён", no → "Не определён", partial → "Частично", not_defined → "Не указано"
          - transport_mode: road → "Автомобильный", rail → "Железнодорожный", sea → "Морской", air → "Воздушный", inland_water → "Внутренний водный", multimodal → "Мультимодальный", not_defined → "Не указан"
          - contract_type: single → "Разовая перевозка", framework → "Рамочный договор", not_defined → "Не указан"
        10. Верни РОВНО один JSON-объект со всеми 11 ключами без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — все условия указаны:
        Фрагмент:
        "Перевозчик обязуется доставить груз — строительные материалы (кирпич, цемент), общий вес 20 тонн, из г. Москва (склад по адресу: ул. Промышленная, д. 5) в г. Казань (склад по адресу: ул. Складская, д. 12). Перевозка осуществляется автомобильным транспортом. Настоящий договор является разовой перевозкой."

        Ответ:
        {
          "cargo_description": "строительные материалы (кирпич, цемент)",
          "cargo_weight": "20 тонн",
          "origin_point": "г. Москва, ул. Промышленная, д. 5",
          "destination_point": "г. Казань, ул. Складская, д. 12",
          "route_defined": "yes",
          "transport_mode": "road",
          "contract_type": "single",
          "cargo_route_snippet": "Перевозчик обязуется доставить груз — строительные материалы (кирпич, цемент), общий вес 20 тонн, из г. Москва (склад по адресу: ул. Промышленная, д. 5) в г. Казань (склад по адресу: ул. Складская, д. 12). Перевозка осуществляется автомобильным транспортом. Настоящий договор является разовой перевозкой.",
          "route_defined_display": "Определён",
          "transport_mode_display": "Автомобильный",
          "contract_type_display": "Разовая перевозка"
        }

        Пример 2 — условия не упомянуты:
        Фрагмент:
        "Стороны заключили настоящий договор о нижеследующем."

        Ответ:
        {
          "cargo_description": "not_defined",
          "cargo_weight": "not_defined",
          "origin_point": "not_defined",
          "destination_point": "not_defined",
          "route_defined": "not_defined",
          "transport_mode": "not_defined",
          "contract_type": "not_defined",
          "cargo_route_snippet": "not_defined",
          "route_defined_display": "Не указано",
          "transport_mode_display": "Не указан",
          "contract_type_display": "Не указан"
        }

        Пример 3 — текст есть, но вывод невозможен (размытая формулировка без конкретики):
        Фрагмент:
        "Перевозчик осуществляет перевозку грузов по заявкам Грузоотправителя в соответствии с условиями настоящего договора."

        Ответ:
        {
          "cargo_description": "not_defined",
          "cargo_weight": "not_defined",
          "origin_point": "not_defined",
          "destination_point": "not_defined",
          "route_defined": "not_defined",
          "transport_mode": "not_defined",
          "contract_type": "framework",
          "cargo_route_snippet": "Перевозчик осуществляет перевозку грузов по заявкам Грузоотправителя в соответствии с условиями настоящего договора.",
          "route_defined_display": "Не указано",
          "transport_mode_display": "Не указан",
          "contract_type_display": "Рамочный договор"
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        Перед ответом внутренне проверь:
        1. Есть ли прямое описание груза в тексте.
        2. Есть ли прямое указание на вес/объём/количество.
        3. Есть ли прямое указание на пункты отправления и назначения.
        4. Не выводи маршрут из адреса стороны, если он прямо не указан как пункт перевозки.
        5. Все 11 ключей присутствуют в JSON.

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь РОВНО одним JSON-объектом без какого-либо дополнительного текста до или после, со всеми 11 ключами:
        {
