      store_payload: true

  - id: cargo_return_procedure
    name: "Возврат груза грузоотправителю"
    description: >
      Проверяет условия возврата груза грузоотправителю при невозможности
      выдачи грузополучателю: отказ от приёмки, ликвидация получателя,
      неверный адрес, истечение срока хранения. Охватывает инициатора
      возврата, распределение расходов на обратную перевозку, сроки
      и порядок уведомления (ст. 790 ГК РФ п. 4, ст. 35 УАТ, ст. 101 УЖТ).
      Отдельно от хранения невостребованного груза (unclaimed_cargo_storage)
      и переадресовки в пути (redirection_clause).
    triggers: {}
    ui_mode: "field_extraction"
    severity: "medium"
    severity_if_pass: "pass"
    severity_if_fail: "medium"
    severity_if_unclear: "low"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "возврат груза"
        - "обратная перевозка"
        - "невозможность выдачи"
        - "вернуть грузоотправителю"
        - "отказ грузополучателя"
        - "обратный рейс"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)возврат.*груз"
        - "(?i)обратн.*перевозк"
        - "(?i)невозможн.*выдач"
        - "(?i)вернуть.*грузоотправител"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по транспортным договорам.
        Анализируется договор перевозки груза.
        Проверяются ТОЛЬКО условия возврата груза грузоотправителю
        при невозможности его выдачи грузополучателю.

        Нормативный ориентир:
        - ст. 790 ГК РФ (п. 4)
        - ст. 35 УАТ (ФЗ-259)
        - ст. 101 УЖТ

        [ЗАДАЧА]
        Установи:
        1. Есть ли в договоре условие о возврате груза грузоотправителю.
        2. Кто вправе инициировать возврат (грузоотправитель, перевозчик,
           автоматически при истечении срока).
        3. Кто оплачивает обратную перевозку.
        4. Установлен ли срок для принятия решения о возврате.
        5. Приведи точную цитату из договора.
        6. Сформируй user-friendly значения для DD Grid.

        [ПРАВИЛА]
        1. Используй только текст договора.
        2. Не путай возврат груза с переадресовкой в пути (изменение
           пункта назначения до прибытия).
        3. Не путай возврат с реализацией невостребованного груза.
        4. Если возврат не упомянут — return_clause_present = "not_defined".
        5. Не используй "None", "null" или пустые строки — используй "not_defined".
        6. В return_snippet включай только цитату из договора.
        7. Для *_display полей используй понятные русские формулировки.
        8. Верни РОВНО один JSON-объект со всеми 9 ключами.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — полный порядок возврата:
        Фрагмент:
        "В случае отказа Грузополучателя от приёмки груза или невозможности его выдачи по иным причинам, Перевозчик обязан уведомить Грузоотправителя в течение 24 часов. Грузоотправитель вправе потребовать возврата груза в течение 5 (пяти) рабочих дней. Обратная перевозка осуществляется за счёт Грузоотправителя по действующему тарифу."

        Ответ:
        {
          "return_clause_present": "yes",
          "return_initiator": "shipper",
          "return_cost_allocation": "shipper",
          "return_deadline": "5 рабочих дней",
          "return_snippet": "В случае отказа Грузополучателя от приёмки груза или невозможности его выдачи по иным причинам, Перевозчик обязан уведомить Грузоотправителя в течение 24 часов. Грузоотправитель вправе потребовать возврата груза в течение 5 (пяти) рабочих дней. Обратная перевозка осуществляется за счёт Грузоотправителя по действующему тарифу.",
          "return_clause_present_display": "Предусмотрен",
          "return_initiator_display": "Грузоотправитель",
          "return_cost_allocation_display": "Грузоотправитель",
          "return_deadline_display": "5 рабочих дней"
        }

        Пример 2 — не упомянуто:
        Фрагмент:
        "Перевозчик обязуется доставить груз в пункт назначения."

        Ответ:
        {
          "return_clause_present": "not_defined",
          "return_initiator": "not_defined",
          "return_cost_allocation": "not_defined",
          "return_deadline": "not_defined",
          "return_snippet": "not_defined",
          "return_clause_present_display": "Не предусмотрено",
          "return_initiator_display": "Не указано",
          "return_cost_allocation_display": "Не указано",
          "return_deadline_display": "Не установлен"
        }

        [ФОРМАТ ОТВЕТА]
        {
          "return_clause_present": "<yes / no / not_defined>",
          "return_initiator": "<shipper / carrier / either / not_defined>",
          "return_cost_allocation": "<shipper / carrier / not_defined>",
          "return_deadline": "<срок или not_defined>",
          "return_snippet": "<точная цитата или not_defined>",
          "return_clause_present_display": "<Предусмотрен / Не предусмотрен / Не указано>",
          "return_initiator_display": "<Грузоотправитель / Перевозчик / Любая сторона / Не указано>",
          "return_cost_allocation_display": "<Грузоотправитель / Перевозчик / Не указано>",
          "return_deadline_display": "<срок / Не установлен>"
        }
      context_k: 4
      temperature: 0.0
      max_tokens: 550
    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "возврат груза обратная перевозка невозможность выдачи вернуть грузоотправителю отказ грузополучателя обратный рейс"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - procedures
        - remedies
      negative_keywords:
        - "провозная плата"
        - "претензия"
        - "форс-мажор"
        - "переадресовка"
        - "реализация груза"
      position_bias:
        preferred_range: [0.3, 1.0]
        boost: 0.10
        scope: auto
      retrieval_profile: "acceptance_check"
      context_k: 4
      max_chunks: 5
      rerank: true
    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
        - "invoice"
      preferred_clause_functions:
        - "procedures"
      confidence_bonus_on_match: 0.05
      confidence_penalty_on_excluded_segment: 0.10
    evidence:
      required: true
      min_snippet_length: 15
      max_snippet_length: 300
    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1100

      compact_output: false

      presence_signal:
        field: "cargo_return_procedure_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист по транспортным договорам.
        Извлеки только условия возврата груза грузоотправителю при
        невозможности выдачи грузополучателю.
        Не анализируй переадресовку в пути, хранение невостребованного
        груза, реализацию, цену, сроки доставки и иные разделы.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. cargo_return_procedure_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если return_clause_present ∈ {"yes", "no"};
           - "missing" — если return_clause_present = "not_defined"
             и фрагментов о возврате груза в контексте нет;
           - "unclear" — если фрагменты есть, но противоречивы.

           Если presence = "missing":
           - return_clause_present = "not_defined";
           - return_initiator = "not_defined";
           - return_cost_allocation = "not_defined";
           - return_deadline = "not_defined";
           - return_snippet = "not_defined";
           - все *_display = соответствующий fallback;
           - не выполняй остальные шаги.

        1. return_clause_present:
           - "yes" — если возврат груза грузоотправителю прямо предусмотрен;
           - "no" — если возврат прямо исключён (груз подлежит реализации
             или утилизации);
           - "not_defined" — если вопрос возврата не урегулирован.

        2. return_initiator:
           - "shipper" — возврат по требованию грузоотправителя;
           - "carrier" — перевозчик вправе инициировать возврат;
           - "either" — любая из сторон;
           - "not_defined" — инициатор не указан.

        3. return_cost_allocation:
           - "shipper" — расходы на обратную перевозку несёт грузоотправитель;
           - "carrier" — расходы несёт перевозчик;
           - "not_defined" — распределение расходов не указано.

        4. return_deadline:
           Срок для принятия решения о возврате из текста договора
           (например: "5 рабочих дней", "10 календарных дней").
           Если не указан — "not_defined".

        5. return_snippet:
           Точная цитата из договора о возврате груза. Если нет — "not_defined".

        6. return_clause_present_display:
           "Предусмотрен" / "Не предусмотрен" / "Не указано".

        7. return_initiator_display:
           "Грузоотправитель" / "Перевозчик" / "Любая сторона" / "Не указано".

        8. return_cost_allocation_display:
           "Грузоотправитель" / "Перевозчик" / "Не указано".

        9. return_deadline_display:
           Конкретный срок или "Не установлен".
        </task>

        <context_rules>
        - Перед остальными полями заполни cargo_return_procedure_presence
          по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй
          "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все поля = "not_defined" /
          соответствующий fallback.
        - Не путай возврат груза (после прибытия в пункт назначения)
          с переадресовкой в пути (до прибытия).
        - Не путай возврат с реализацией невостребованного груза —
          это разные check-и.
        - Прямой запрет на возврат (return_clause_present = "no") —
          это presence = "present", а не "missing".
        - Не используй "None", "null" или пустые строки.
        - Все 9 ключей должны присутствовать в JSON-ответе.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В договоре нет упоминания возврата груза грузоотправителю.
           → presence = "missing";
             return_clause_present = "not_defined".

        2. Возврат предусмотрен, но без расходов и сроков.
           "При невозможности выдачи груза Грузополучателю, груз
           возвращается Грузоотправителю." (расходы и сроки не названы).
           → presence = "present";
             return_clause_present = "yes";
             return_cost_allocation = "not_defined";
             return_deadline = "not_defined".

        3. Противоречие между фрагментами.
           В одном месте возврат за счёт грузоотправителя, в другом —
           за счёт перевозчика.
           → presence = "unclear";
             return_cost_allocation = "not_defined".

        4. Возврат исключён в пользу реализации.
           "Невостребованный груз подлежит реализации в порядке ст. 35 УАТ.
           Возврат груза Грузоотправителю не предусмотрен."
           → presence = "present";
             return_clause_present = "no";
             return_clause_present_display = "Не предусмотрен".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для cargo_return_procedure_presence используй только:
          "present", "missing", "unclear".
        - Для return_clause_present используй только:
          "yes", "no", "not_defined".
        - Для return_initiator используй только:
          "shipper", "carrier", "either", "not_defined".
        - Для return_cost_allocation используй только:
          "shipper", "carrier", "not_defined".
        - Fallback при отсутствии данных:
          * return_deadline, return_snippet → "not_defined";
          * все *_display → соответствующие fallback-строки.
        - Fallback при противоречии или неоднозначности:
          * все *_display → соответствующие fallback-строки.
        - Технический формат JSON (value / confidence / location) задан
          отдельным контрактом — соблюдай его, но не описывай здесь.
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "cargo_return_procedure_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие условий возврата груза. Внутреннее агрегатное signal-поле."
          required: true

        - name: "return_clause_present"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Возврат груза грузоотправителю предусмотрен. Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "return_initiator"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["shipper", "carrier", "either", "not_defined"]
          description: "Сторона, вправе инициировать возврат груза. Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "return_cost_allocation"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["shipper", "carrier", "not_defined"]
          description: "Сторона, несущая расходы на обратную перевозку. Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "return_deadline"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 1
          label: "Срок решения"
          description: >
            Срок для принятия решения о возврате груза.
            Fallback: "Не установлен".
          required: true

        - name: "return_snippet"
          type: "string"
          presentation: "diagnostic"
          display_in_grid: false
          description: "Цитата о возврате груза"
          required: true

        - name: "return_clause_present_display"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 2
          label: "Возврат груза"
          description: >
            User-friendly: предусмотрен ли возврат груза грузоотправителю. Fallback: "Не установлено" / "Не удалось определить".
          required: true

        - name: "return_initiator_display"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 3
          label: "Инициатор"
          description: >
            User-friendly: кто вправе инициировать возврат. Fallback: "Не установлено" / "Не удалось определить".
          required: true

        - name: "return_cost_allocation_display"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 4
          label: "Расходы на возврат"
          description: >
            User-friendly: кто оплачивает обратную перевозку. Fallback: "Не установлено" / "Не удалось определить".
          required: true
      store_payload: true

  - id: multimodal_transport
    name: "Мультимодальная перевозка и перевалка"
    description: >
      Проверяет условия мультимодальной (смешанной) перевозки: распределение
      ответственности на стыке видов транспорта, порядок и стоимость перевалки,
      оформление единого транспортного документа и применимый правовой режим
      на каждом участке (гл. 40 ГК РФ, КТМ, УЖТ, УАТ, Конвенция ООН о
      международных смешанных перевозках 1980 г.). Специфический check для
      договоров, охватывающих более одного вида транспорта.
    triggers:
      any: ["multimodal_transport"]
    ui_mode: "field_extraction"
    severity: "medium"
    severity_if_pass: "pass"
    severity_if_fail: "medium"
    severity_if_unclear: "low"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "мультимодальная перевозка"
        - "смешанная перевозка"
        - "перевалка груза"
        - "стык видов транспорта"
        - "единый транспортный документ"
        - "оператор смешанной перевозки"
        - "комбинированная перевозка"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)мультимодальн"
        - "(?i)смешанн.*перевозк"
        - "(?i)перевалк"
        - "(?i)оператор.*смешанн"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по транспортным договорам.
        Анализируется договор перевозки груза.
        Проверяются ТОЛЬКО условия мультимодальной (смешанной) перевозки,
        перевалки груза между видами транспорта и оформления единого
        транспортного документа.

        Нормативный ориентир:
        - гл. 40 ГК РФ (перевозка)
        - КТМ РФ (морской участок)
        - УЖТ РФ (железнодорожный участок)
        - УАТ (автомобильный участок)
        - Конвенция ООН о международных смешанных перевозках 1980 г.

        [ЗАДАЧА]
        Установи:
        1. Предусмотрена ли мультимодальная/смешанная перевозка.
        2. Кто несёт ответственность за груз на стыке видов транспорта (перевалке).
        3. Определён ли правовой режим ответственности на каждом участке.
        4. Предусмотрено ли оформление единого транспортного документа.
        5. Приведи точную цитату из договора.
        6. Сформируй user-friendly значения для DD Grid.

        [ПРАВИЛА]
        1. Используй только текст договора.
        2. Не путай мультимодальную перевозку с обычной сменой ТС одного вида.
        3. Если смешанная перевозка не упомянута — multimodal_clause_present = "not_defined".
        4. Если ответственность на стыке не распределена — transshipment_responsibility = "not_defined".
        5. Не используй "None", "null" или пустые строки — используй "not_defined".
        6. В multimodal_snippet включай только цитату из договора.
        7. Для *_display полей используй понятные русские формулировки.
        8. Верни РОВНО один JSON-объект со всеми 9 ключами.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — полная мультимодальная схема:
        Фрагмент:
        "Перевозка осуществляется по мультимодальной схеме: автомобильным транспортом до морского порта, далее морским транспортом до порта назначения. Оператор смешанной перевозки (Перевозчик) несёт полную ответственность за груз на всех участках и в пунктах перевалки. Оформляется единый коносамент сквозной перевозки."

        Ответ:
        {
          "multimodal_clause_present": "yes",
          "transshipment_responsibility": "carrier",
          "liability_regime": "unified",
          "unified_document": "yes",
          "multimodal_snippet": "Перевозка осуществляется по мультимодальной схеме: автомобильным транспортом до морского порта, далее морским транспортом до порта назначения. Оператор смешанной перевозки (Перевозчик) несёт полную ответственность за груз на всех участках и в пунктах перевалки. Оформляется единый коносамент сквозной перевозки.",
          "multimodal_clause_present_display": "Предусмотрена",
          "transshipment_responsibility_display": "Перевозчик",
          "liability_regime_display": "Единый режим",
          "unified_document_display": "Предусмотрен"
        }

        Пример 2 — не упомянуто:
        Фрагмент:
        "Перевозка осуществляется автомобильным транспортом из Москвы в Казань."

        Ответ:
        {
          "multimodal_clause_present": "not_defined",
          "transshipment_responsibility": "not_defined",
          "liability_regime": "not_defined",
          "unified_document": "not_defined",
          "multimodal_snippet": "not_defined",
          "multimodal_clause_present_display": "Не указано",
          "transshipment_responsibility_display": "Не указано",
          "liability_regime_display": "Не указан",
          "unified_document_display": "Не предусмотрен"
        }

        [ФОРМАТ ОТВЕТА]
        {
          "multimodal_clause_present": "<yes / no / not_defined>",
          "transshipment_responsibility": "<carrier / shipper / divided / not_defined>",
          "liability_regime": "<unified / segmented / not_defined>",
          "unified_document": "<yes / no / not_defined>",
          "multimodal_snippet": "<точная цитата или not_defined>",
          "multimodal_clause_present_display": "<Предусмотрена / Не предусмотрена / Не указано>",
          "transshipment_responsibility_display": "<Перевозчик / Грузоотправитель / Разделённая / Не указано>",
          "liability_regime_display": "<Единый режим / По участкам / Не указан>",
          "unified_document_display": "<Предусмотрен / Не предусмотрен / Не указано>"
        }
      context_k: 4
      temperature: 0.0
      max_tokens: 600
    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "мультимодальная смешанная перевозка перевалка груза стык видов транспорта единый транспортный документ оператор смешанной перевозки комбинированная перевозка"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - procedures
      negative_keywords:
        - "провозная плата"
        - "претензия"
        - "форс-мажор"
        - "замена транспортного средства"
      position_bias:
        preferred_range: [0.0, 0.90]
        boost: 0.10
        scope: auto
      retrieval_profile: "scope_of_work_check"
      context_k: 4
      max_chunks: 5
      rerank: true
    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
        - "invoice"
      preferred_clause_functions:
        - "obligations"
      confidence_bonus_on_match: 0.05
      confidence_penalty_on_excluded_segment: 0.10
    evidence:
      required: true
      min_snippet_length: 15
      max_snippet_length: 300
    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1100

      compact_output: false

      presence_signal:
        field: "multimodal_transport_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист по транспортным договорам.
        Извлеки только условия мультимодальной (смешанной) перевозки,
        перевалки и единого транспортного документа.
        Не анализируй обычную смену ТС одного вида, цену, сроки,
        ответственность за просрочку и иные разделы.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. multimodal_transport_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если multimodal_clause_present ∈ {"yes", "no"};
           - "missing" — если multimodal_clause_present = "not_defined"
             и фрагментов о мультимодальной перевозке в контексте нет;
           - "unclear" — если фрагменты есть, но противоречивы.

           Если presence = "missing":
           - multimodal_clause_present = "not_defined";
           - transshipment_responsibility = "not_defined";
           - liability_regime = "not_defined";
           - unified_document = "not_defined";
           - multimodal_snippet = "not_defined";
           - все *_display = соответствующий fallback;
           - не выполняй остальные шаги.

        1. multimodal_clause_present:
           - "yes" — если мультимодальная/смешанная перевозка прямо предусмотрена
             (груз следует более чем одним видом транспорта по единому договору);
           - "no" — если договор прямо исключает смешанную перевозку;
           - "not_defined" — если вопрос не урегулирован.

        2. transshipment_responsibility:
           - "carrier" — перевозчик (оператор смешанной перевозки) несёт
             ответственность за груз в пунктах перевалки;
           - "shipper" — грузоотправитель организует и отвечает за перевалку;
           - "divided" — ответственность разделена между несколькими
             фактическими перевозчиками по участкам;
           - "not_defined" — распределение ответственности на стыке не указано.

        3. liability_regime:
           - "unified" — единый правовой режим ответственности на всех участках
             (сквозная ответственность оператора);
           - "segmented" — на каждом участке применяется свой правовой режим
             (КТМ на морском, УЖТ на железнодорожном и т.д.);
           - "not_defined" — режим ответственности не определён.

        4. unified_document:
           - "yes" — если предусмотрено оформление единого сквозного
             транспортного документа (сквозной коносамент, FBL и т.п.);
           - "no" — если на каждый участок оформляется отдельный документ;
           - "not_defined" — если вопрос документа не урегулирован.

        5. multimodal_snippet:
           Точная цитата из договора о мультимодальной перевозке.
           Если нет — "not_defined".

        6. multimodal_clause_present_display:
           "Предусмотрена" / "Не предусмотрена" / "Не указано".

        7. transshipment_responsibility_display:
           "Перевозчик" / "Грузоотправитель" / "Разделённая" / "Не указано".

        8. liability_regime_display:
           "Единый режим" / "По участкам" / "Не указан".

        9. unified_document_display:
           "Предусмотрен" / "Не предусмотрен" / "Не указано".
        </task>

        <context_rules>
        - Перед остальными полями заполни multimodal_transport_presence
          по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй
          "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все поля = "not_defined" /
          соответствующий fallback.
        - Не путай мультимодальную перевозку (разные виды транспорта)
          с обычной заменой ТС одного вида (например, смена автомобиля).
        - Не путай перевалку груза с обычной погрузкой/выгрузкой.
        - Не используй "None", "null" или пустые строки.
        - Все 9 ключей должны присутствовать в JSON-ответе.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           Договор описывает перевозку одним видом транспорта без
           упоминания перевалок или смешанных схем.
           → presence = "missing";
             multimodal_clause_present = "not_defined".

        2. Перевалка упомянута без распределения ответственности.
           "Груз следует автомобильным транспортом до порта, далее —
           морским." (кто отвечает на стыке — не указано).
           → presence = "present";
             multimodal_clause_present = "yes";
             transshipment_responsibility = "not_defined";
             liability_regime = "not_defined".

        3. Противоречие между фрагментами.
           В одном месте сквозная ответственность перевозчика, в другом —
           ответственность ограничена морским участком по КТМ.
           → presence = "unclear";
             liability_regime = "not_defined".

        4. Единый документ без явного термина «мультимодальная».
           "Оформляется сквозной коносамент от склада отправителя до
           склада получателя." (термин «мультимодальная» не использован,
           но суть ясна).
           → presence = "present";
             multimodal_clause_present = "yes";
             unified_document = "yes".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для multimodal_transport_presence используй только:
          "present", "missing", "unclear".
        - Для multimodal_clause_present, unified_document используй только:
          "yes", "no", "not_defined".
        - Для transshipment_responsibility используй только:
          "carrier", "shipper", "divided", "not_defined".
        - Для liability_regime используй только:
          "unified", "segmented", "not_defined".
        - Fallback при отсутствии данных:
          * multimodal_snippet → "not_defined";
          * все *_display → соответствующие fallback-строки.
        - Fallback при противоречии или неоднозначности:
          * все *_display → соответствующие fallback-строки.
        - Технический формат JSON (value / confidence / location) задан
          отдельным контрактом — соблюдай его, но не описывай здесь.
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "multimodal_transport_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие условий мультимодальной перевозки. Внутреннее агрегатное signal-поле."
          required: true

        - name: "multimodal_clause_present"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Мультимодальная/смешанная перевозка предусмотрена. Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "transshipment_responsibility"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["carrier", "shipper", "divided", "not_defined"]
          description: "Ответственность за груз в пунктах перевалки. Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "liability_regime"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["unified", "segmented", "not_defined"]
          description: "Правовой режим ответственности на участках перевозки. Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "unified_document"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Единый сквозной транспортный документ. Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "multimodal_snippet"
          type: "string"
          presentation: "diagnostic"
          display_in_grid: false
          description: "Цитата о мультимодальной перевозке"
          required: true

        - name: "multimodal_clause_present_display"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 1
          label: "Мультимодальность"
          description: >
            User-friendly: предусмотрена ли смешанная перевозка. Fallback: "Не установлено" / "Не удалось определить".
          required: true

        - name: "transshipment_responsibility_display"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 2
          label: "Перевалка"
          description: >
            User-friendly: кто отвечает за груз на стыке видов транспорта. Fallback: "Не установлено" / "Не удалось определить".
          required: true

        - name: "liability_regime_display"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 3
          label: "Режим ответственности"
          description: >
            User-friendly: единый или сегментированный режим. Fallback: "Не установлено" / "Не удалось определить".
          required: true

        - name: "unified_document_display"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 4
          label: "Единый документ"
          description: >
            User-friendly: предусмотрен ли сквозной транспортный документ. Fallback: "Не установлено" / "Не удалось определить".
          required: true
      store_payload: true

  - id: transport_force_majeure
    name: "Транспортный форс-мажор и обстоятельства на маршруте"
    description: >
      Проверяет условия о транспортном форс-мажоре и препятствиях на маршруте:
      закрытие дорог, мостов, перевалов, ледовая/паводковая обстановка,
      забастовки на транспорте, карантинные и таможенные ограничения не по вине
      сторон. Охватывает сроки и форму уведомления, подтверждающие документы
      (справки ТПП, акты дорожных служб), освобождение от демереджа (платы за простой)
      и право на отказ/расторжение договора при длительном препятствии в пути
      (ст. 401 ГК РФ, ст. 36 УАТ, ст. 120 УЖТ, ст. 166 КТМ).
      Общие положения о непреодолимой силе проверяются отдельным global check-ом
      (force_majeure) и не дублируются здесь.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "закрытие дорог"
        - "препятствия на маршруте"
        - "закрытие движения"
        - "паводок"
        - "оползень"
        - "забастовка"
        - "карантин на маршруте"
        - "сертификат ТПП"
        - "заключение ТПП"
        - "акт дорожной службы"
        - "освобождение от демереджа"
        - "транспортный форс-мажор"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)закрыти[ея]\\s+(дорог|движени|мост|путей|перевал)"
        - "(?i)непреодолим.*(маршрут|пути|перевозк|трасс)"
        - "(?i)(справк|заключени|сертификат).*ТПП"
        - "(?i)акты?\\s+дорожн.*(служб|орган)"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по транспортным договорам.
        Анализируется договор перевозки груза.
        Проверяются ТОЛЬКО специфические условия транспортного форс-мажора
        и обстоятельств непреодолимой силы непосредственно на маршруте перевозки
        (закрытие дорог, стихийные явления на трассе, забастовки портов/терминалов,
        карантинные блокады, подтверждающие документы дорожных органов/ТПП).

        Общий раздел о форс-мажоре (война, землетрясение общего характера)
        НЕ проверяется в этом check-е — он покрыт отдельной глобальной проверкой.

        Нормативный ориентир:
        - ст. 401 ГК РФ (основания ответственности за нарушение обязательства)
        - ст. 36 УАТ (ФЗ-259)
        - ст. 120 УЖТ
        - ст. 166 КТМ

        [ЗАДАЧА]
        Установи:
        1. Предусмотрен ли в договоре перечень транспортных форс-мажорных событий на маршруте.
        2. Какие категории событий прямо названы (закрытие дорог, стихия в пути, забастовки, регуляторные блокады).
        3. Установлен ли срок уведомления о наступлении препятствий на маршруте.
        4. Какой документ требуется для подтверждения (ТПП, акты дорожных служб/МЧС).
        5. Освобождается ли сторона от платы за простой (демереджа) при форс-мажоре на маршруте.
        6. Установлен ли срок длительности препятствия, дающий право на расторжение договора или изменение маршрута.
        7. Приведи точную цитату из договора.
        8. Сформируй user-friendly значения для отображения в DD Grid.

        [ПРАВИЛА]
        1. Используй только текст договора.
        2. Не подставляй нормы УАТ/УЖТ, если в договоре условия не прописаны.
        3. Не путай общие положения о форс-мажоре со специфическими транспортными оговорками (событиями на трассе).
        4. Если срок уведомления не назван — notice_deadline = "not_defined".
        5. Если подтверждающий документ не указан — proof_document_required = "not_defined".
        6. Не используй "None", "null" или пустые строки — используй "not_defined".
        7. В transport_fm_snippet включай только цитату из договора.
        8. Для *_display полей используй понятные русские формулировки:
          - transport_fm_clause_present: yes → "Предусмотрен", no → "Не предусмотрен", not_defined → "Не указано"
          - covered_transport_events:
            * route_closure → "Закрытие дорог/трасс"
            * natural_disasters → "Стихийные явления в пути"
            * strikes_and_blockades → "Забастовки и блокады"
            * regulatory_arrest → "Регуляторные запреты"
            * comprehensive → "Комплексный перечень"
            * not_defined → "Не конкретизирован"
          - proof_document_required:
            * tpp_certificate → "Сертификат ТПП"
            * authority_act → "Акт дорожных служб/МЧС"
            * any → "Любой официальный документ"
            * not_defined → "Не указан"
          - demurrage_waiver_present: yes → "Да", no → "Нет", not_defined → "Не указано"
        9. Верни РОВНО один JSON-объект со всеми 12 ключами без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — полная регламентация транспортного форс-мажора:
        Фрагмент:
        "Стороны освобождаются от ответственности и уплаты демереджа в случае закрытия движения по автомобильным дорогам или мостовым переходам по решению уполномоченных государственных органов, а также вследствие оползней, паводков или снежных заносов на маршруте перевозки. Перевозчик обязан уведомить Грузоотправителя в течение 12 часов с момента наступления обстоятельств и предоставить справку уполномоченного дорожного органа или Торгово-промышленной палаты. Если препятствие длится более 10 календарных дней, стороны вправе согласовать изменение маршрута либо расторгнуть договор."

        Ответ:
        {
          "transport_fm_clause_present": "yes",
          "covered_transport_events": "comprehensive",
