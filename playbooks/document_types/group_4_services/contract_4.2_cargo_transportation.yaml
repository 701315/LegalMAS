#  БЛОК 3: SHARED PATTERNS
#  Читается: DocTypeCheckLoader через _resolve_yaml_templates()
# ════════════════════════════════════════════════════════════════════════════

shared_patterns:

  money_amount: "(?i)\\b\\d[\\d\\s]*(?:руб|рублей|₽|тыс|млн|млрд|USD|EUR|долл)"
  date_pattern: "(?i)\\b\\d{1,2}[.]\\d{1,2}[.]\\d{4}\\b"
  percentage: "(?i)\\b\\d{1,3}[,.]?\\d{0,2}\\s*%"
  weight_pattern: "(?i)\\b\\d[\\d\\s,.]*(?:кг|тонн|т\\b|kg|ton)"
  volume_pattern: "(?i)\\b\\d[\\d\\s,.]*(?:куб\\.?\\s*м|м[³3]|cbm)"
  time_hours: "(?i)\\b\\d+\\s*(?:час|ч\\.|hours|hrs)"
  vehicle_reg: "(?i)\\b[А-Я]{1}\\d{3}[А-Я]{2}\\d{2,3}\\b"

compliance_rules: []

# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 4: CHECKS_V8 — LLM/hybrid проверки (v8.1, приведено к паттерну)
#  Читается: DocTypeCheckLoader._load_doc_type_checks()
# ════════════════════════════════════════════════════════════════════════════

checks_v8:

  - id: transport_document_check
    name: "Транспортный документ: накладная / коносамент (ст. 785 ГК РФ)"
    description: >
      Проверяет наличие условия об оформлении транспортного документа.
      Заключение договора перевозки подтверждается транспортной накладной,
      коносаментом или иным документом. Без него сложно доказать факт
      заключения договора.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "транспортная накладная"
        - "товарно-транспортная накладная"
        - "ТТН"
        - "коносамент"
        - "грузовая авианакладная"
        - "CMR"
        - "AWB"
        - "железнодорожная накладная"
        - "путевой лист"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)транспортн(ая|ой)\\s+накладн"
        - "(?i)коносамент"
        - "(?i)\\bCMR\\b"
        - "(?i)\\bТТН\\b"
        - "(?i)\\bAWB\\b"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по транспортным договорам.
        Анализируется договор перевозки груза.
        Проверяется только условие об оформлении транспортного документа.

        Нормативный ориентир:
        - ст. 785 ГК РФ
        - ст. 8 УАТ (ФЗ-259)

        [ЗАДАЧА]
        Установи:
        1. Упомянут ли в договоре транспортный документ (накладная, коносамент и т.п.).
        2. Какой вид транспортного документа предусмотрен.
        3. Кто оформляет транспортный документ.
        4. Приведи точную цитату из договора.
        5. Сформируй user-friendly значения для отображения в DD Grid.

        [ПРАВИЛА]
        1. Используй только текст договора.
        2. Не считай путевой лист или акт приёма-передачи транспортной накладной, если они прямо так не названы.
        3. Если вид документа не назван — document_type = "not_defined".
        4. Если оформляющая сторона прямо не указана — who_prepares = "not_defined".
        5. Не используй "None", "null" или пустые строки — используй "not_defined".
        6. В document_snippet включай только цитату из договора.
        7. Для *_display полей используй понятные русские формулировки:
          - Если документ не упомянут → transport_document_mentioned_display = "Не указан"
          - Если вид не определён → document_type_display = "Вид не определён"
          - Если оформляющая сторона не указана → who_prepares_display = "Не указано"
        8. Верни РОВНО один JSON-объект со всеми 7 ключами без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — стандартная ситуация:
        Фрагмент:
        "На каждую перевозку грузоотправитель оформляет транспортную накладную в трёх экземплярах."

        Ответ:
        {
          "transport_document_mentioned": "yes",
          "document_type": "consignment_note",
          "who_prepares": "shipper",
          "document_snippet": "На каждую перевозку грузоотправитель оформляет транспортную накладную в трёх экземплярах.",
          "transport_document_mentioned_display": "Указан",
          "document_type_display": "Транспортная накладная",
          "who_prepares_display": "Грузоотправитель"
        }

        Пример 2 — документ не упомянут:
        Фрагмент:
        "Стороны договорились о перевозке груза по маршруту Москва — Казань."

        Ответ:
        {
          "transport_document_mentioned": "no",
          "document_type": "not_defined",
          "who_prepares": "not_defined",
          "document_snippet": "not_defined",
          "transport_document_mentioned_display": "Не указан",
          "document_type_display": "Вид не определён",
          "who_prepares_display": "Не указано"
        }

        Пример 3 — текст есть, но вывод невозможен (неоднозначная формулировка):
        Фрагмент:
        "Документы оформляются по соглашению сторон в процессе перевозки."

        Ответ:
        {
          "transport_document_mentioned": "yes",
          "document_type": "not_defined",
          "who_prepares": "not_defined",
          "document_snippet": "Документы оформляются по соглашению сторон в процессе перевозки.",
          "transport_document_mentioned_display": "Указан",
          "document_type_display": "Вид не определён",
          "who_prepares_display": "Не указано"
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        Перед ответом внутренне проверь:
        1. Есть ли в тексте прямое упоминание транспортного документа.
        2. Совпадает ли document_type с допустимым словарём.
        3. Взята ли цитата из договора, а не из закона.
        4. Если прямого указания нет — не додумывай, верни "not_defined".
        5. Все 7 ключей присутствуют в JSON.

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь РОВНО одним JSON-объектом без какого-либо дополнительного текста до или после, со всеми 7 ключами:
        {
          "transport_document_mentioned": "<yes / no>",
          "document_type": "<waybill / consignment_note / bill_of_lading / air_waybill / cmr / other / not_defined>",
          "who_prepares": "<carrier / shipper / jointly / not_defined>",
          "document_snippet": "<точная цитата или not_defined>",
          "transport_document_mentioned_display": "<Указан / Не указан>",
          "document_type_display": "<Транспортная накладная / Коносамент / Авианакладная / CMR / Железнодорожная накладная / Иной документ / Вид не определён>",
          "who_prepares_display": "<Перевозчик / Грузоотправитель / Стороны совместно / Не указано>"
        }
      context_k: 4
      temperature: 0.0
      max_tokens: 450
    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "транспортная накладная товарно-транспортная накладная ТТН коносамент грузовая авианакладная CMR AWB железнодорожная накладная путевой лист"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - procedures
        - obligations
      negative_keywords:
        - "провозная плата"
        - "претензия"
        - "форс-мажор"
        - "неустойка"
      position_bias:
        preferred_range: [0.0, 0.90]
        boost: 0.15
        scope: auto
      retrieval_profile: "technical_documentation_check"
      context_k: 4
      max_chunks: 6
      rerank: true
    enrichment_hints:
      preferred_segment_types:
