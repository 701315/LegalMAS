#  БЛОК 3: SHARED PATTERNS
#  Читается: DocTypeCheckLoader через _resolve_yaml_templates()
# ════════════════════════════════════════════════════════════════════════════

shared_patterns:

  money_amount: "(?i)\\b\\d[\\d\\s]*(?:руб|рублей|₽|тыс|млн|млрд|USD|EUR|долл)"
  date_pattern: "(?i)\\b\\d{1,2}[.]\\d{1,2}[.]\\d{4}\\b"
  percentage: "(?i)\\b\\d{1,3}[,.]?\\d{0,2}\\s*%"
  weight_pattern: "(?i)\\b\\d[\\d\\s,.]*(?:кг|тонн|т\\b|kg|ton)"
  volume_pattern: "(?i)\\b\\d[\\d\\s,.]*(?:куб\\.?\\s*м|м[³3]|cbm)"
  time_hours: "(?i)\\b\\d+\\s*(?:час|ч\\.|hours|hrs)"
  vehicle_reg: "(?i)\\b[А-Я]{1}\\d{3}[А-Я]{2}\\d{2,3}\\b"

compliance_rules: []

# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 4: CHECKS_V8 — LLM/hybrid проверки (v8.1, приведено к паттерну)
#  Читается: DocTypeCheckLoader._load_doc_type_checks()
#
#  ИСТОРИЯ ИЗМЕНЕНИЙ (приведение к паттерну):
#  - Удалены 5 чеков-дублей (поля перенесены в новые версии):
#      cargo_transport_subject_extraction → transport_mode/contract_type в cargo_and_route
#      claim_procedure_check              → claim_deadline_for_loss/delay в pretension_order
#      cargo_value_and_insurance          → declared_value_* в cargo_insurance_clause
#      subcontracting_and_substitution_check → vehicle/driver substitution в subcontracting_terms
#      redirection_in_transit_check       → redirection_deadline в redirection_clause
#  - 8 устаревших чеков переписаны в полный формат паттерна
#    (секции [КОНТЕКСТ]/[ЗАДАЧА]/[ПРАВИЛА]/[FEW-SHOT]/[CoVe]/[ФОРМАТ ОТВЕТА],
#     полный retrieval, enrichment_hints, llm_prompt_extraction, presentation-поля)
#  - Всем fields[] добавлены presentation (signal/fact), label, display_in_grid, display_priority
#  - Удалены legacy-ключи: prompt_file, retrieval.filters, boost_keywords, keyword_hints
# ════════════════════════════════════════════════════════════════════════════

checks_v8:

  - id: transport_document_check
    name: "Транспортный документ: накладная / коносамент (ст. 785 ГК РФ)"
    description: >
      Проверяет наличие условия об оформлении транспортного документа.
      Заключение договора перевозки подтверждается транспортной накладной,
      коносаментом или иным документом. Без него сложно доказать факт
      заключения договора.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "транспортная накладная"
        - "товарно-транспортная накладная"
        - "ТТН"
        - "коносамент"
        - "грузовая авианакладная"
        - "CMR"
        - "AWB"
        - "железнодорожная накладная"
        - "путевой лист"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)транспортн(ая|ой)\\s+накладн"
        - "(?i)коносамент"
        - "(?i)\\bCMR\\b"
        - "(?i)\\bТТН\\b"
        - "(?i)\\bAWB\\b"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по транспортным договорам.
        Анализируется договор перевозки груза.
        Проверяется только условие об оформлении транспортного документа.

        Нормативный ориентир:
        - ст. 785 ГК РФ
        - ст. 8 УАТ (ФЗ-259)

        [ЗАДАЧА]
        Установи:
        1. Упомянут ли в договоре транспортный документ (накладная, коносамент и т.п.).
        2. Какой вид транспортного документа предусмотрен.
        3. Кто оформляет транспортный документ.
        4. Приведи точную цитату из договора.

        [ПРАВИЛА]
        1. Используй только текст договора.
        2. Не считай путевой лист или акт приёма-передачи транспортной накладной, если они прямо так не названы.
        3. Если вид документа не назван — document_type = "not_defined".
        4. Если оформляющая сторона прямо не указана — who_prepares = "not_defined".
        5. Не используй "None", "null", "not_defined" (кроме словаря who_prepares) или пустые строки — используй "not_defined".
        6. В document_snippet включай только цитату из договора.
        7. Верни только один JSON-объект.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1:
        Фрагмент:
        "На каждую перевозку грузоотправитель оформляет транспортную накладную в трёх экземплярах."

        Ответ:
        {
          "transport_document_mentioned": "yes",
          "document_type": "consignment_note",
          "who_prepares": "shipper",
          "document_snippet": "На каждую перевозку грузоотправитель оформляет транспортную накладную в трёх экземплярах."
        }

        Пример 2:
        Фрагмент:
        "Стороны договорились о перевозке груза по маршруту Москва — Казань."

        Ответ:
        {
          "transport_document_mentioned": "no",
          "document_type": "not_defined",
          "who_prepares": "not_defined",
          "document_snippet": "not_defined"
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        Перед ответом внутренне проверь:
        1. Есть ли в тексте прямое упоминание транспортного документа.
        2. Совпадает ли document_type с допустимым словарём.
        3. Взята ли цитата из договора, а не из закона.
        4. Если прямого указания нет — не додумывай, верни "not_defined".

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        {
          "transport_document_mentioned": "<yes / no>",
          "document_type": "<waybill / consignment_note / bill_of_lading / air_waybill / cmr / other / not_found>",
          "who_prepares": "<carrier / shipper / jointly / not_specified / not_found>",
          "document_snippet": "<точная цитата или not_found>"
        }
      context_k: 4
      temperature: 0.0
      max_tokens: 450
    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "транспортная накладная товарно-транспортная накладная ТТН коносамент грузовая авианакладная CMR AWB железнодорожная накладная путевой лист оформление документов"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - procedures
        - obligations
      negative_keywords:
        - "провозная плата"
        - "претензия"
        - "форс-мажор"
        - "неустойка"
      position_bias:
        preferred_range: [0.0, 0.90]
        boost: 0.15
        scope: auto
      retrieval_profile: "technical_documentation_check"
      context_k: 4
      max_chunks: 6
      rerank: true
    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
        - "invoice"
      preferred_clause_functions:
        - "procedures"
        - "obligations"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10
    evidence:
      required: true
      min_snippet_length: 30
      max_snippet_length: 500
    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 600
      compact_output: false
      llm_prompt_extraction: |
        <role>
        Ты — российский юрист по транспортным договорам.
        Извлеки только условия об оформлении транспортного документа (накладной, коносамента и т.п.).
        Не анализируй цену, сроки, ответственность и иные разделы.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни:
        - transport_document_mentioned: yes / no
        - document_type: waybill / consignment_note / bill_of_lading / air_waybill / cmr / other / not_found
        - who_prepares: carrier / shipper / jointly / not_specified / not_found
        - document_snippet: точная цитата из договора или "not_defined"

        Ответ верни строго в JSON.
        </task>

        <rules>
