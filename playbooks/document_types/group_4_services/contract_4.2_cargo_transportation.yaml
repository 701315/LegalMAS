  - id: cargo_acceptance_procedure
    name: "Порядок приёмки груза в пункте назначения"
    description: >
      Проверяет процедуру приёмки груза, фиксации недостачи и повреждений
      при выдаче. Это ключевой check для последующего предъявления претензий.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "приёмка груза"
        - "выдача груза"
        - "акт о недостаче"
        - "акт о повреждении"
