  - id: liability_limitation_explicit
    name: "Лимит ответственности перевозчика (ст. 796 ГК РФ, уставы)"
    description: >
      Проверяет наличие явного ограничения ответственности перевозчика
      со ссылкой на договор, транспортный устав или объявленную/действительную
      стоимость груза.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "ответственность ограничена"
        - "лимит ответственности"
        - "в размере объявленной стоимости"
        - "не более реальной стоимости"
        - "согласно уставу"
        - "в соответствии с транспортным уставом"
        - "специальное право заимствования"
        - "СДР"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)ответственност.*ограничен"
        - "(?i)в\\s+соответствии\\s+с.*(УАТ|УЖТ|Воздушн|КТМ|КВВТ)"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по транспортным договорам.
        Анализируется договор перевозки груза.
        Проверяется только вопрос ограничения ответственности перевозчика.

        Нормативный ориентир:
        - ст. 796 ГК РФ
        - применимые транспортные уставы
        - специальные правила о пределах ответственности

        [ЗАДАЧА]
        Установи:
        1. Есть ли в тексте прямой лимит ответственности.
        2. Какой тип лимита используется:
          - объявленная стоимость
          - действительная стоимость
          - законный лимит
          - договорная сумма/формула
        3. Есть ли конкретный размер лимита.
        4. Есть ли ссылка на конкретный транспортный устав.
        5. Приведи точную цитату из договора.
        6. Сформируй user-friendly значения для отображения в DD Grid.

        [ПРАВИЛА]
        1. Используй только текст договора.
        2. Не путай ограничение ответственности с полным освобождением от ответственности.
        3. Если в тексте только общая ссылка на закон без раскрытия лимита — это statutory, а не contract_amount.
        4. Если лимит прямо не указан — ставь "not_defined".
        5. Не додумывай СДР, если в тексте этого нет.
        6. Не используй "None", "null" или пустые строки — используй "not_defined".
        7. В liability_limitation_snippet включай только цитату из договора.
        8. Для *_display полей используй понятные русские формулировки:
