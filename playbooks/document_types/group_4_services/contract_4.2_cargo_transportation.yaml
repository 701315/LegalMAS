      llm_prompt_extraction: |
        <role>
        Ты — российский юрист по транспортным договорам.
        Извлеки идентификацию сторон и основания полномочий подписантов.
        Не анализируй цену, маршрут, сроки, ответственность и иные разделы.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. parties_identification_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из основных полей (carrier_details, shipper_details) ≠ "not_defined";
           - "missing" — если оба основных поля = "not_defined" и фрагментов об идентификации сторон в контексте нет;
           - "unclear" — если фрагменты по теме есть, но из-за противоречий вывод невозможен.

           Если presence = "missing":
           - carrier_details = "not_defined";
           - shipper_details = "not_defined";
           - consignee_details = "not_defined";
           - signatory_basis = "not_defined";
           - parties_snippet = "not_defined";
           - signatory_basis_display = "Не указано";
           - не выполняй остальные шаги.

        1. carrier_details:
           Наименование и реквизиты Перевозчика из преамбулы или раздела реквизитов
           (например: "ООО 'ТрансЛогистик', ИНН 7701234567").
           Если не указаны — "not_defined".

        2. shipper_details:
           Наименование и реквизиты Грузоотправителя из преамбулы или раздела реквизитов.
           Если не указаны — "not_defined".

        3. consignee_details:
           Наименование или описание Грузополучателя, если он прямо упомянут в тексте договора.
           Если не указан — "not_defined" (для рамочных договоров это частая норма).

        4. signatory_basis:
           Основание полномочий подписантов. Используй только:
           - "charter" — устав;
           - "poa" — доверенность;
           - "order" — приказ;
           - "other" — иное основание;
           - "not_defined" — основание прямо не указано или его нельзя определить.

        5. parties_snippet:
           Точная цитата из договора со сведениями о сторонах. Если нет — "not_defined".

        6. signatory_basis_display:
           "Устав" / "Доверенность" / "Приказ" / "Иное основание" / "Не указано".
        </task>

        <context_rules>
        - Перед остальными полями заполни parties_identification_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все поля = "not_defined", а signatory_basis_display = "Не указано".
        - Не делай предположений и не додумывай реквизиты, если они указаны частично.
        - Если в тексте основание полномочий не указано прямо, используй "not_defined".
        - Не используй "None", "null" или пустые строки.
        - Все 6 ключей должны присутствовать в JSON-ответе.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни наименований сторон, ни реквизитов, ни подписантов.
           → presence = "missing";
             carrier_details = shipper_details = "not_defined";
             signatory_basis = "not_defined";
             signatory_basis_display = "Не указано".

        2. Только роли сторон без реквизитов.
           "Перевозчик и Грузоотправитель заключили настоящий договор..."
           → presence = "present";
             carrier_details = "not_defined";
             shipper_details = "not_defined";
             signatory_basis = "not_defined".

        3. Противоречие между фрагментами.
           В преамбуле указан один перевозчик, а в реквизитах и подписях — совершенно другое юрлицо.
           → presence = "unclear";
             carrier_details = "not_defined";
             signatory_basis_display = "Не указано".

        4. Только две стороны без грузополучателя.
           В договоре детально описаны Перевозчик и Грузоотправитель, но получатель не упомянут.
           → presence = "present";
             carrier_details = "определён по тексту";
             shipper_details = "определён по тексту";
             consignee_details = "not_defined".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для parties_identification_presence используй только: "present", "missing", "unclear".
        - Для signatory_basis используй только: "charter", "poa", "order", "other", "not_defined".
        - Fallback при отсутствии данных:
          * carrier_details, shipper_details, consignee_details, parties_snippet → "not_defined";
          * signatory_basis_display → "Не указано".
        - Fallback при противоречии или неоднозначности:
          * signatory_basis_display → "Не указано".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
