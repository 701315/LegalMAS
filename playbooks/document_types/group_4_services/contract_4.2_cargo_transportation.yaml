      llm_prompt_extraction: |
        <role>
        Ты — российский юрист по транспортным договорам.
        Извлеки порядок приёмки груза в пункте назначения.
        Не анализируй цену, сроки доставки, ответственность, претензионный порядок и иные разделы.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. cargo_acceptance_procedure_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если acceptance_procedure_present ∈ {"yes", "partial"} ИЛИ хотя бы одно из полей (commercial_act_mentioned, damage_fixing_procedure, shortage_fixing_procedure, inspection_on_receipt) = "yes";
           - "missing" — если все поля = "not_defined" / "no" и фрагментов о порядке приёмки груза в контексте нет;
           - "unclear" — если фрагменты по теме есть, но из-за противоречий вывод невозможен.

           Если presence = "missing":
           - acceptance_procedure_present = "not_defined";
           - commercial_act_mentioned = "not_defined";
           - damage_fixing_procedure = "not_defined";
           - shortage_fixing_procedure = "not_defined";
           - inspection_on_receipt = "not_defined";
           - cargo_acceptance_snippet = "not_defined";
           - все *_display = соответствующий fallback;
           - не выполняй остальные шаги.

        1. acceptance_procedure_present:
           - "yes" — если процедура приёмки груза прямо и детально урегулирована договором;
           - "partial" — если процедура упоминается общей фразой без детальных правил;
           - "no" — если в договоре прямо указано об отсутствии специального порядка;
           - "not_defined" — если порядок приёмки не упомянут.

        2. commercial_act_mentioned:
           - "yes" — если составление коммерческого акта прямо предусмотрено;
           - "no" — если коммерческий акт не требуется / заменён другим документом;
           - "not_defined" — если коммерческий акт не упомянут.

        3. damage_fixing_procedure:
           - "yes" — если предусмотрена процедура фиксации повреждений / порчи груза;
           - "no" — если процедура фиксации повреждений отсутствует;
           - "not_defined" — если вопрос не урегулирован.

        4. shortage_fixing_procedure:
           - "yes" — если предусмотрена процедура фиксации недостачи мест или веса груза;
           - "no" — если процедура фиксации недостачи отсутствует;
           - "not_defined" — если вопрос не урегулирован.

        5. inspection_on_receipt:
           - "yes" — если установлена обязанность грузополучателя осмотреть груз при выдаче;
           - "no" — если осмотр при получении прямо не обязателен;
           - "not_defined" — если вопрос осмотра не урегулирован.

        6. cargo_acceptance_snippet:
           Точная цитата из договора о порядке приёмки груза. Если нет — "not_defined".

        7. acceptance_procedure_present_display:
           "Установлен" / "Не установлен" / "Частично" / "Не указано".

        8. commercial_act_mentioned_display:
           "Предусмотрен" / "Не предусмотрен" / "Не указано".

        9. damage_fixing_procedure_display:
           "Предусмотрена" / "Не предусмотрена" / "Не указано".

        10. shortage_fixing_procedure_display:
            "Предусмотрена" / "Не предусмотрена" / "Не указано".

        11. inspection_on_receipt_display:
            "Предусмотрен" / "Не предусмотрен" / "Не указано".
        </task>

        <context_rules>
        - Перед остальными полями заполни cargo_acceptance_procedure_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все поля = "not_defined" / соответствующий fallback.
        - Не путай претензионный порядок с процедурой приёмки груза.
        - Не выводи процессуальные правила из закона, если их нет в договоре.
        - Если в договоре только общая фраза "груз принимается" без детальных правил — acceptance_procedure_present = "partial".
        - Если отдельный акт не назван, но описана письменная отметка в накладной — считай это процедурой фиксации.
        - Не используй "None", "null" или пустые строки.
        - Все 11 ключей должны присутствовать в JSON-ответе.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте договора нет ни одного упоминания приёмки, выдачи груза или составления актов.
           → presence = "missing";
             acceptance_procedure_present = "not_defined";
             все sub-поля = "not_defined".

        2. Общая фраза без конкретных механизмов.
           "Выдача груза Получателю производится по общим правилам перевозки."
           → presence = "present";
             acceptance_procedure_present = "partial";
             commercial_act_mentioned = "not_defined";
             damage_fixing_procedure = "not_defined".

        3. Противоречие между фрагментами.
           В одном месте акт составляется в день выдачи, в другом — в течение 3 рабочих дней.
           → presence = "unclear";
             acceptance_procedure_present = "partial";
             damage_fixing_procedure = "not_defined".

        4. Отсылка на транспортный устав или правила перевозок.
           "Приёмка груза и составление коммерческого акта осуществляются в порядке, предусмотренном УАТ РФ."
           → presence = "present";
             acceptance_procedure_present = "yes";
             commercial_act_mentioned = "yes";
             cargo_acceptance_snippet содержит цитату с отсылкой.
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для cargo_acceptance_procedure_presence используй только: "present", "missing", "unclear".
        - Для acceptance_procedure_present используй только: "yes", "no", "partial", "not_defined".
        - Для commercial_act_mentioned, damage_fixing_procedure, shortage_fixing_procedure, inspection_on_receipt используй только: "yes", "no", "not_defined".
        - Fallback при отсутствии данных:
          * cargo_acceptance_snippet → "not_defined";
          * все *_display → "Не указано".
        - Fallback при противоречии или неоднозначности:
          * все *_display → соответствующие fallback-строки.
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

