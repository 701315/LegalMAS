shared_patterns:

  money_amount: "(?i)\\b\\d[\\d\\s]*(?:руб|рублей|₽|тыс|млн|млрд)"
  date_pattern: "(?i)\\b\\d{1,2}[.]\\d{1,2}[.]\\d{4}\\b"
  percentage: "(?i)\\b\\d{1,3}[,.]?\\d{0,2}\\s*%"
  working_days: "(?i)\\b\\d+\\s*(рабочих|календарных)\\s+дн"
  hourly_rate_pattern: "(?i)\\b\\d[\\d\\s]*(?:руб|₽).*?(?:час|ч\\.|man[\\s-]?hour)"
  inn_pattern: "(?i)\\bИНН\\s*\\d{10,12}\\b"

# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 4: COMPLIANCE RULES
#  Читается: DocTypeCheckLoader._exclusion_logic_to_checks()
# ════════════════════════════════════════════════════════════════════════════

compliance_rules:

  - id: "labor_contract_requalification_risk"
    name: "Риск переквалификации в трудовой договор (ТК РФ)"
    description: |
      Если договор содержит признаки трудовых отношений (подчинение ПВТР,
      трудовая функция, рабочее место, режим работы), он может быть
      переквалифицирован судом в трудовой с начислением НДФЛ, страховых взносов
      и штрафов. Особенно актуально для физлиц-исполнителей и самозанятых.
    legal_base: "ст. 15, 19.1 ТК РФ, ст. 5.27 КоАП РФ"
    required_triggers: ["individual_party"]
    severity: "critical"
    result_if_triggered: "warning"
    detector_type: "rules"
    rules:
      keywords:
        - "трудовая функция"
        - "рабочее место"
        - "правила внутреннего трудового распорядка"
        - "подчинение"
        - "режим работы"
        - "должностная инструкция"
        - "табель учёта рабочего времени"
      keyword_mode: "any"
    retrieval:
      context_k: 5
      boost_keywords:
        - "трудовая функция"
        - "подчинение"
        - "режим работы"
        - "рабочее место"
      rerank: true

  - id: "personal_data_processing_without_agreement"
    name: "Обработка ПДн без поручения на обработку (ФЗ-152)"
    description: |
      Если исполнитель получает доступ к персональным данным заказчика
      или его клиентов, необходимо поручение на обработку ПДн (ст. 6 ФЗ-152).
      Отсутствие поручения — административное правонарушение (ст. 13.11 КоАП).
    legal_base: "ФЗ от 27.07.2006 № 152-ФЗ «О персональных данных», ст. 6"
    required_triggers: ["personal_data_processing"]
    severity: "critical"
    result_if_triggered: "fail"
    detector_type: "rules"
    rules:
      keywords:
        - "персональные данные"
        - "обработка персональных данных"
        - "поручение на обработку"
        - "оператор персональных данных"
      keyword_mode: "any"
    retrieval:
      context_k: 5
      boost_keywords:
        - "персональные данные"
        - "поручение на обработку"
        - "ФЗ-152"
      rerank: true

  - id: "licensed_activity_without_confirmation"
    name: "Лицензируемая деятельность без подтверждения лицензии"
    description: |
      Отдельные виды услуг (аудит, оценка, охранная деятельность, медицинские,
      образовательные услуги) требуют лицензии или аккредитации. Оказание услуг
      без лицензии влечёт ничтожность договора и административную/уголовную
      ответственность.
    legal_base: "ФЗ от 04.05.2011 № 99-ФЗ «О лицензировании отдельных видов деятельности»"
    required_triggers: ["licensed_activity"]
    severity: "critical"
    result_if_triggered: "fail"
    detector_type: "rules"
    rules:
      keywords:
        - "лицензия"
        - "лицензируемая деятельность"
        - "аккредитация"
        - "допуск"
        - "сертификат"
      keyword_mode: "any"
    retrieval:
      context_k: 5
      boost_keywords:
        - "лицензия"
        - "аккредитация"
        - "допуск"
      rerank: true

  - id: "consumer_punitive_clause_prohibition"
    name: "Ничтожность условий, ущемляющих права потребителя (ст. 16 ЗоЗПП)"
    description: |
      Условия, ограничивающие право потребителя на отказ от услуг, навязывающие
      штрафы за расторжение или ограничивающие выбор подсудности, являются
      ничтожными. Штраф в пользу потребителя — 50 % от присуждённой суммы.
    legal_base: "ст. 16, 28, 29, 32 Закона РФ от 07.02.1992 № 2300-1 «О ЗПП»"
    required_triggers: ["consumer_party"]
    severity: "critical"
    result_if_triggered: "fail"
    detector_type: "rules"
    rules:
      keywords:
        - "штраф за отказ потребителя"
        - "ограничение прав потребителя"
        - "потребитель обязан"
        - "невозвратный"
        - "без возврата"
        - "подсудность по месту нахождения исполнителя"
      keyword_mode: "any"
    retrieval:
      context_k: 5
      boost_keywords:
        - "потребитель"
        - "штраф за отказ"
        - "невозвратный"
        - "ЗоЗПП"
      rerank: true

  - id: "illegal_staff_leasing"
    name: "Незаконный заёмный труд / аутстаффинг без аккредитации (ФЗ-116)"
    description: |
      Предоставление персонала допускается только аккредитованными частными
      агентствами занятости (ФЗ от 05.05.2014 № 116-ФЗ). Фактическое предоставление
      работников без аккредитации — незаконный заёмный труд (ст. 56.1 ТК РФ).
    legal_base: "ст. 56.1 ТК РФ, ФЗ от 05.05.2014 № 116-ФЗ"
    required_triggers: ["outsourcing"]
    severity: "critical"
    result_if_triggered: "warning"
    detector_type: "rules"
    rules:
      keywords:
        - "предоставление персонала"
        - "аутстаффинг"
        - "заёмный труд"
        - "направление работников"
        - "работники исполнителя на территории заказчика"
        - "под руководством заказчика"
      keyword_mode: "any"
    retrieval:
      context_k: 5
      boost_keywords:
        - "предоставление персонала"
        - "аутстаффинг"
        - "заёмный труд"
        - "аккредитация"
      rerank: true

