      store_payload: true

  - id: personal_performance_subcontracting
    name: "Личное исполнение и право привлечения третьих лиц (ст. 780 ГК РФ)"
    description: >
      Фактографическая проверка наличия в договоре условия о личном исполнении,
      допустимости привлечения третьих лиц, необходимости согласия заказчика
      и сохранения ответственности исполнителя. Результат предназначен для
      табличного сравнения нескольких договоров.
    triggers: ~
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "лично"
        - "личное исполнение"
        - "привлечение третьих лиц"
        - "субисполнитель"
        - "соисполнитель"
        - "своими силами"
        - "вправе привлекать"
        - "с согласия заказчика"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)исполнитель.*оказывает.*услуги.*лично"
        - "(?i)вправе.*привлек(ать|ать).*третьих\\s+лиц"
        - "(?i)без\\s+права\\s+привлечени"
        - "(?i)с\\s+согласия\\s+заказчик"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор возмездного оказания услуг.
        Проверяется только один вопрос: должен ли исполнитель оказывать услуги лично,
        можно ли привлекать третьих лиц, нужно ли согласие заказчика и сохраняет ли
        исполнитель ответственность за действия привлечённых лиц.

        Нормативный ориентир:
        - ст. 780 ГК РФ — личное оказание услуг
        - общие положения об исполнении обязательств третьими лицами

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора, а чего прямо нет.
        - Не оценивай серьёзность риска.
        - Юрист будет использовать результат в сравнительной таблице.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Требуется ли личное исполнение.
        2. Допускается ли привлечение третьих лиц.
        3. Требуется ли согласие заказчика для такого привлечения.
        4. Сохраняет ли исполнитель ответственность за действия третьих лиц.
        5. Требуется ли уведомление / раскрытие информации о привлечённых лицах.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Если условие не указано прямо — возвращай "not_defined" для всех enum-полей.
        4. Строго запрещено использовать "None", "null" или пустые строки "".
        5. personal_performance_required_display:
           - Если personal_performance_required = "yes" — "Да, личное исполнение требуется".
           - Если "no" — "Нет, личное исполнение не требуется".
           - Если "not_defined" — "Не определено".
        6. subcontracting_allowed_display:
           - Если subcontracting_allowed = "yes_without_consent" — "Да, без согласия заказчика".
           - Если "yes_with_consent" — "Да, с согласия заказчика".
           - Если "prohibited" — "Запрещено".
           - Если "not_defined" — "Не определено".
        7. provider_remains_liable_display:
           - Если provider_remains_liable = "yes" — "Да, сохраняет ответственность".
           - Если "no" — "Нет, не сохраняет".
           - Если "not_defined" — "Не определено".
        8. Не путай право привлекать сотрудников исполнителя с правом привлекать внешних третьих лиц.
        9. В evidence включай только точный текст договора.
        10. Верни только один валидный JSON-объект, содержащий все указанные ключи.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — привлечение допускается с согласия:
        Фрагмент:
        "Исполнитель оказывает услуги лично, однако вправе привлекать третьих лиц
        только с предварительного письменного согласия Заказчика. Исполнитель
        несет полную ответственность за действия привлеченных лиц."

        Ответ:
        {
          "personal_performance_required": "yes",
          "personal_performance_required_display": "Да, личное исполнение требуется",
          "subcontracting_allowed": "yes_with_consent",
          "subcontracting_allowed_display": "Да, с согласия заказчика",
          "provider_remains_liable": "yes",
          "provider_remains_liable_display": "Да, сохраняет ответственность",
          "subcontractor_disclosure_required": "defined",
          "evidence": [
            {
              "clause_ref": "п. 2.3",
              "quote": "Исполнитель оказывает услуги лично, однако вправе привлекать третьих лиц только с предварительного письменного согласия Заказчика. Исполнитель несет полную ответственность за действия привлеченных лиц."
            }
          ]
        }

        Пример 2 — привлечение запрещено:
        Фрагмент:
        "Исполнитель обязан оказать услуги лично. Привлечение третьих лиц, субисполнителей
        или соисполнителей не допускается."

        Ответ:
        {
          "personal_performance_required": "yes",
          "personal_performance_required_display": "Да, личное исполнение требуется",
          "subcontracting_allowed": "prohibited",
          "subcontracting_allowed_display": "Запрещено",
          "provider_remains_liable": "not_defined",
          "provider_remains_liable_display": "Не определено",
          "subcontractor_disclosure_required": "not_defined",
          "evidence": [
            {
              "clause_ref": "п. 3.1",
              "quote": "Исполнитель обязан оказать услуги лично. Привлечение третьих лиц, субисполнителей или соисполнителей не допускается."
            }
          ]
        }

        Пример 3 — привлечение допускается без согласия:
        Фрагмент:
        "Исполнитель вправе привлекать третьих лиц для оказания услуг без предварительного
        согласования с Заказчиком. Исполнитель несет ответственность за действия привлеченных
        третьих лиц как за свои собственные."

        Ответ:
        {
          "personal_performance_required": "no",
          "personal_performance_required_display": "Нет, личное исполнение не требуется",
          "subcontracting_allowed": "yes_without_consent",
          "subcontracting_allowed_display": "Да, без согласия заказчика",
          "provider_remains_liable": "yes",
          "provider_remains_liable_display": "Да, сохраняет ответственность",
          "subcontractor_disclosure_required": "not_defined",
          "evidence": [
            {
              "clause_ref": "п. 4.2",
              "quote": "Исполнитель вправе привлекать третьих лиц для оказания услуг без предварительного согласования с Заказчиком. Исполнитель несет ответственность за действия привлеченных третьих лиц как за свои собственные."
            }
          ]
        }

        Пример 4 — данные отсутствуют:
        Фрагмент:
        "Исполнитель оказывает услуги Заказчику."

        Ответ:
        {
          "personal_performance_required": "not_defined",
          "personal_performance_required_display": "Не определено",
          "subcontracting_allowed": "not_defined",
          "subcontracting_allowed_display": "Не определено",
          "provider_remains_liable": "not_defined",
          "provider_remains_liable_display": "Не определено",
          "subcontractor_disclosure_required": "not_defined",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Есть ли прямое указание на личное исполнение.
        2. Есть ли прямое указание на право привлекать третьих лиц.
        3. Есть ли прямое указание на необходимость согласия заказчика.
        4. Есть ли прямое указание на сохранение ответственности исполнителя.
        5. Если прямой цитаты нет — верни "not_defined" для всех enum-полей. Не додумывай условия.

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        {
          "personal_performance_required": "<yes / no / not_defined>",
          "personal_performance_required_display": "<Да, личное исполнение требуется / Нет, личное исполнение не требуется / Не определено>",
          "subcontracting_allowed": "<yes_without_consent / yes_with_consent / prohibited / not_defined>",
          "subcontracting_allowed_display": "<Да, без согласия заказчика / Да, с согласия заказчика / Запрещено / Не определено>",
          "provider_remains_liable": "<yes / no / not_defined>",
          "provider_remains_liable_display": "<Да, сохраняет ответственность / Нет, не сохраняет / Не определено>",
          "subcontractor_disclosure_required": "<defined / not_defined>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 4
      temperature: 0.0
      max_tokens: 620

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "личное исполнение привлечение третьих лиц субисполнитель соисполнитель своими силами с согласия заказчика ответственность за действия третьих лиц"
      retrieval_profile: "subcontracting_check"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
      negative_keywords:
        - "персональные данные"
        - "неустойка"
        - "оплата"
        - "форс-мажор"
      position_bias:
        preferred_range: [0.15, 0.55]
        boost: 0.16
        scope: segment
      context_k: 4
      max_chunks: 6
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "obligations"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 650

    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false

      llm_max_tokens: 450

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора условия о личном
        исполнении, привлечении третьих лиц, согласии заказчика и ответственности
        исполнителя за действия таких лиц. Не анализируй цену, сроки, споры
        или санкции.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля. Верни все ключи, даже если данные отсутствуют.

        1. personal_performance_required — "yes", "no" или "not_defined".
        2. personal_performance_required_display — user-friendly: "Да, личное исполнение требуется", "Нет, личное исполнение не требуется" или "Не определено".
        3. subcontracting_allowed — "yes_without_consent", "yes_with_consent", "prohibited" или "not_defined".
        4. subcontracting_allowed_display — user-friendly: "Да, без согласия заказчика", "Да, с согласия заказчика", "Запрещено" или "Не определено".
        5. provider_remains_liable — "yes", "no" или "not_defined".
        6. provider_remains_liable_display — user-friendly: "Да, сохраняет ответственность", "Нет, не сохраняет" или "Не определено".
        7. subcontractor_disclosure_required — "defined" или "not_defined".

        Правила заполнения при отсутствии данных:
        - Для всех enum-полей (personal_performance_required, subcontracting_allowed, provider_remains_liable) возвращай строго "not_defined".
        - Для всех *_display полей возвращай соответствующий user-friendly текст или "Не определено".
        - Для subcontractor_disclosure_required возвращай "not_defined".
        </task>

        <rules>
        - Используй только текст договора.
        - personal_performance_required:
            - "yes" — личное исполнение прямо требуется (например, "Исполнитель оказывает услуги лично").
            - "no" — прямо указано, что личное исполнение не требуется (например, "Исполнитель вправе привлекать третьих лиц").
            - "not_defined" — вопрос прямо не урегулирован.
        - subcontracting_allowed:
            - "yes_without_consent" — третьи лица допускаются без согласия заказчика.
            - "yes_with_consent" — требуется согласие заказчика (письменное или иное).
            - "prohibited" — привлечение третьих лиц прямо запрещено.
            - "not_defined" — вопрос прямо не урегулирован.
        - provider_remains_liable:
            - "yes" — исполнитель прямо сохраняет ответственность за действия привлечённых лиц.
            - "no" — прямо указано, что ответственность не сохраняется.
            - "not_defined" — вопрос прямо не урегулирован.
        - subcontractor_disclosure_required:
            - "defined" — есть требование уведомления / раскрытия / согласования привлечения третьих лиц.
            - "not_defined" — такого требования прямо нет.
        - Не путай право привлекать сотрудников исполнителя (трудовые отношения) с правом привлекать внешних третьих лиц (гражданско-правовые отношения).
        - Верни только валидный JSON-объект без markdown-обёртки или с ней, но парсящийся через json.loads.
        </rules>
      fields:
        - name: "personal_performance_required"
          type: "string"
          presentation: "signal"
          allowed_values:
            - "yes"
            - "no"
            - "not_defined"
          description: "Требуется ли личное исполнение."
          required: true
          display_in_grid: false

        - name: "personal_performance_required_display"
          type: "string"
          presentation: "fact"
          label: "Личное исполнение"
          description: "User-friendly описание требования личного исполнения."
          required: true
          display_in_grid: true
          display_priority: 1

        - name: "subcontracting_allowed"
          type: "string"
          presentation: "signal"
          allowed_values:
            - "yes_without_consent"
            - "yes_with_consent"
            - "prohibited"
            - "not_defined"
          description: "Допустимость привлечения третьих лиц."
          required: true
          display_in_grid: false

        - name: "subcontracting_allowed_display"
          type: "string"
          presentation: "fact"
          label: "Привлечение третьих лиц"
          description: "User-friendly описание допустимости привлечения третьих лиц."
          required: true
          display_in_grid: true
          display_priority: 2

        - name: "provider_remains_liable"
          type: "string"
          presentation: "signal"
          allowed_values:
            - "yes"
            - "no"
            - "not_defined"
          description: "Сохраняет ли исполнитель ответственность за действия третьих лиц."
          required: true
          display_in_grid: false

        - name: "provider_remains_liable_display"
          type: "string"
          presentation: "fact"
          label: "Ответственность за третьих лиц"
          description: "User-friendly описание сохранения ответственности исполнителя."
          required: true
          display_in_grid: true
          display_priority: 3

        - name: "subcontractor_disclosure_required"
          type: "string"
          presentation: "signal"
          allowed_values:
            - "defined"
            - "not_defined"
          description: "Требуется ли уведомление / согласование привлечения третьих лиц."
          required: true
          display_in_grid: false
      store_payload: true

  - id: ip_rights_on_service_results
    name: "ИП на результаты услуг (ст. 1296, 1297 ГК РФ)"
    description: >
      Фактографическая проверка наличия в договоре условий о правах на
      результаты интеллектуальной деятельности, типе передачи прав, моменте
      перехода прав и описании объектов ИС. Результат предназначен для
      табличного сравнения нескольких договоров.
    triggers:
      any: ["ip_creation_services"]
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "исключительные права"
        - "интеллектуальная собственность"
        - "авторские права"
        - "передача прав"
        - "отчуждение прав"
        - "результаты интеллектуальной деятельности"
        - "лицензия"
        - "право использования"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)исключительн(ые|ое|ых)\\s+прав"
        - "(?i)интеллектуальн(ой|ую|ая)\\s+собственност"
        - "(?i)передач(а|и)\\s+прав"
        - "(?i)право\\s+использовани"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор возмездного оказания услуг, в котором возможно
        создание результатов интеллектуальной деятельности.
        Проверяется только один вопрос: есть ли в договоре условие о правах на
        результат, какой тип передачи прав предусмотрен, когда переходят права
        и описаны ли объекты ИС.

        Нормативный ориентир:
        - ст. 1225 ГК РФ — объекты интеллектуальных прав
        - ст. 1234 ГК РФ — отчуждение исключительного права
        - ст. 1235 ГК РФ — лицензионный договор
        - ст. 1296–1297 ГК РФ — права на результаты по договору

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора, а чего прямо нет.
        - Не оценивай серьёзность риска.
        - Юрист будет использовать результат в сравнительной таблице.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Есть ли IP clause.
        2. Какой тип передачи прав предусмотрен.
        3. В какой момент переходят права.
        4. Перечислены ли объекты ИС.
        5. Как описаны объекты ИС.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Если условие не указано прямо:
           - для статусных полей (*_present, *_listed) возвращай "not_defined";
           - для enum-полей (ip_transfer_type, ip_transfer_moment) возвращай "not_defined";
           - для текстовых полей (ip_objects_description) возвращай "Не установлено".
        4. Строго запрещено использовать "None", "null", "not_defined" (в текстовых полях) или пустые строки "".
        5. ip_transfer_type_display:
           - Если ip_transfer_type = "full_transfer" — "Полное отчуждение исключительного права".
           - Если "license" — "Лицензия (право использования)".
           - Если "retained_by_provider" — "Права остаются у исполнителя".
           - Если "not_defined" — "Не определено".
        6. ip_transfer_moment_display:
           - Если ip_transfer_moment = "upon_payment" — "После полной оплаты".
           - Если "upon_creation" — "С момента создания результата".
           - Если "upon_acceptance" — "После приёмки по акту".
           - Если "upon_signing" — "С момента подписания договора".
           - Если "upon_delivery" — "С момента передачи результата".
           - Если "not_defined" — "Не определено".
        7. Не путай передачу материальных носителей с передачей исключительных прав.
        8. Если объекты ИС определяются по приложению/ТЗ/спецификации — укажи это в ip_objects_description.
        9. В evidence включай только точный текст договора.
        10. Верни только один валидный JSON-объект, содержащий все указанные ключи.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — полное отчуждение после оплаты:
        Фрагмент:
        "Исключительные права на созданные Исполнителем отчеты, дизайн-макеты
        и иные результаты работ переходят к Заказчику в полном объеме с момента
        полной оплаты услуг."

        Ответ:
        {
          "ip_clause_present": "defined",
          "ip_transfer_type": "full_transfer",
          "ip_transfer_type_display": "Полное отчуждение исключительного права",
          "ip_transfer_moment": "upon_payment",
          "ip_transfer_moment_display": "После полной оплаты",
          "ip_objects_listed": "defined",
          "ip_objects_description": "отчеты, дизайн-макеты и иные результаты работ",
          "evidence": [
            {
              "clause_ref": "п. 6.1",
              "quote": "Исключительные права на созданные Исполнителем отчеты, дизайн-макеты и иные результаты работ переходят к Заказчику в полном объеме с момента полной оплаты услуг."
            }
          ]
        }

        Пример 2 — лицензия с момента создания:
        Фрагмент:
        "Исполнитель предоставляет Заказчику неисключительную лицензию на использование
        созданных программ для ЭВМ и баз данных на территории всего мира на весь срок
        действия исключительного права. Права на результаты возникают с момента их создания."

        Ответ:
        {
          "ip_clause_present": "defined",
          "ip_transfer_type": "license",
          "ip_transfer_type_display": "Лицензия (право использования)",
          "ip_transfer_moment": "upon_creation",
          "ip_transfer_moment_display": "С момента создания результата",
          "ip_objects_listed": "defined",
          "ip_objects_description": "программы для ЭВМ и базы данных",
          "evidence": [
            {
              "clause_ref": "п. 7.2",
              "quote": "Исполнитель предоставляет Заказчику неисключительную лицензию на использование созданных программ для ЭВМ и баз данных на территории всего мира на весь срок действия исключительного права. Права на результаты возникают с момента их создания."
            }
          ]
        }

        Пример 3 — права остаются у исполнителя:
        Фрагмент:
        "Все исключительные права на результаты, созданные в процессе оказания услуг,
        принадлежат Исполнителю. Заказчику предоставляется право использования результатов
        исключительно для внутренних целей."

        Ответ:
        {
          "ip_clause_present": "defined",
          "ip_transfer_type": "retained_by_provider",
          "ip_transfer_type_display": "Права остаются у исполнителя",
          "ip_transfer_moment": "not_defined",
          "ip_transfer_moment_display": "Не определено",
          "ip_objects_listed": "not_defined",
          "ip_objects_description": "Не установлено",
          "evidence": [
            {
              "clause_ref": "п. 8.1",
              "quote": "Все исключительные права на результаты, созданные в процессе оказания услуг, принадлежат Исполнителю. Заказчику предоставляется право использования результатов исключительно для внутренних целей."
            }
          ]
        }

        Пример 4 — объекты определяются по приложению:
        Фрагмент:
        "Исключительные права на результаты, перечисленные в Приложении № 4 (Перечень
        объектов ИС), переходят к Заказчику с момента подписания акта приёмки услуг."

        Ответ:
        {
          "ip_clause_present": "defined",
          "ip_transfer_type": "full_transfer",
          "ip_transfer_type_display": "Полное отчуждение исключительного права",
          "ip_transfer_moment": "upon_acceptance",
          "ip_transfer_moment_display": "После приёмки по акту",
          "ip_objects_listed": "defined",
          "ip_objects_description": "Определяются по Приложению № 4 (Перечень объектов ИС)",
          "evidence": [
            {
              "clause_ref": "п. 9.3",
              "quote": "Исключительные права на результаты, перечисленные в Приложении № 4 (Перечень объектов ИС), переходят к Заказчику с момента подписания акта приёмки услуг."
            }
          ]
        }

        Пример 5 — данные отсутствуют:
        Фрагмент:
        "Результаты услуг передаются Заказчику по акту."

        Ответ:
        {
          "ip_clause_present": "not_defined",
          "ip_transfer_type": "not_defined",
          "ip_transfer_type_display": "Не определено",
          "ip_transfer_moment": "not_defined",
          "ip_transfer_moment_display": "Не определено",
          "ip_objects_listed": "not_defined",
          "ip_objects_description": "Не установлено",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Есть ли прямое указание именно на права ИС (не на передачу материальных носителей).
        2. Есть ли прямое указание на тип передачи прав (отчуждение / лицензия / сохранение у исполнителя).
        3. Есть ли прямое указание на момент перехода прав.
        4. Есть ли перечисление объектов ИС или ссылка на приложение/ТЗ.
        5. Если прямой цитаты нет — верни "not_defined" для enum/status и "Не установлено" для текста. Не додумывай условия.

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        {
          "ip_clause_present": "<defined / not_defined>",
          "ip_transfer_type": "<full_transfer / license / retained_by_provider / not_defined>",
          "ip_transfer_type_display": "<Полное отчуждение исключительного права / Лицензия (право использования) / Права остаются у исполнителя / Не определено>",
          "ip_transfer_moment": "<upon_payment / upon_creation / upon_acceptance / upon_signing / upon_delivery / not_defined>",
          "ip_transfer_moment_display": "<После полной оплаты / С момента создания результата / После приёмки по акту / С момента подписания договора / С момента передачи результата / Не определено>",
          "ip_objects_listed": "<defined / not_defined>",
          "ip_objects_description": "<текст / 'Определяются по ...' / 'Не установлено'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 5
      temperature: 0.0
      max_tokens: 650

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "исключительные права интеллектуальная собственность авторские права передача прав отчуждение лицензия право использования результаты интеллектуальной деятельности"
      retrieval_profile: "ip_ownership_check"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - technical_fragment
        - structural_anchor
        - definition
      preferred_clause_functions:
        - obligations
      negative_keywords:
        - "конфиденциальность"
        - "персональные данные"
        - "неустойка"
        - "оплата"
      position_bias:
        preferred_range: [0.35, 0.80]
        boost: 0.16
        scope: segment
      context_k: 5
      max_chunks: 7
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "price_list"
        - "technical_specification"
      preferred_clause_functions:
        - "obligations"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 650

    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false

      llm_max_tokens: 600

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора условия о правах
        на результаты интеллектуальной деятельности, тип передачи прав,
        момент перехода прав и описание объектов ИС. Не анализируй цену,
        санкции, сроки или споры.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля. Верни все ключи, даже если данные отсутствуют.

        1. ip_clause_present — "defined" или "not_defined".
        2. ip_transfer_type — "full_transfer", "license", "retained_by_provider" или "not_defined".
        3. ip_transfer_type_display — user-friendly: "Полное отчуждение исключительного права", "Лицензия (право использования)", "Права остаются у исполнителя" или "Не определено".
        4. ip_transfer_moment — "upon_payment", "upon_creation", "upon_acceptance", "upon_signing", "upon_delivery" или "not_defined".
        5. ip_transfer_moment_display — user-friendly: "После полной оплаты", "С момента создания результата", "После приёмки по акту", "С момента подписания договора", "С момента передачи результата" или "Не определено".
        6. ip_objects_listed — "defined" или "not_defined".
        7. ip_objects_description — описание объектов ИС (текст или "Определяются по ..." или "Не установлено").

        Правила заполнения при отсутствии данных:
        - Для ip_clause_present и ip_objects_listed возвращай строго "not_defined".
        - Для ip_transfer_type и ip_transfer_moment возвращай "not_defined".
        - Для ip_objects_description возвращай "Не установлено".
        - Для *_display полей возвращай соответствующий user-friendly текст или "Не определено".
        </task>

        <rules>
        - Используй только текст договора.
        - ip_transfer_type:
            - "full_transfer" — полное отчуждение исключительного права (ст. 1234 ГК РФ).
            - "license" — предоставление права использования (лицензия, ст. 1235 ГК РФ).
            - "retained_by_provider" — права остаются у исполнителя, заказчику предоставляется только право использования.
            - "not_defined" — IP clause есть, но тип передачи не ясен.
        - ip_transfer_moment:
            - "upon_payment" — после полной оплаты услуг.
            - "upon_creation" — с момента создания результата.
            - "upon_acceptance" — после приёмки по акту.
            - "upon_signing" — с момента подписания договора.
            - "upon_delivery" — с момента передачи результата заказчику.
            - "not_defined" — момент не раскрыт при наличии IP clause.
        - ip_objects_description:
            - Если объекты ИС перечислены прямо — укажи их.
            - Если объекты определяются по приложению/ТЗ/спецификации — укажи "Определяются по [название документа]".
        - Не путай передачу материальных носителей с передачей исключительных прав.
        - Верни только валидный JSON-объект без markdown-обёртки или с ней, но парсящийся через json.loads.
        </rules>
      fields:
        - name: "ip_clause_present"
          type: "string"
          presentation: "signal"
          allowed_values:
            - "defined"
            - "not_defined"
          description: "Есть ли в договоре условие о правах на результат ИС."
          required: true
          display_in_grid: false

        - name: "ip_transfer_type"
          type: "string"
          presentation: "signal"
          allowed_values:
            - "full_transfer"
            - "license"
            - "retained_by_provider"
            - "not_defined"
          description: "Тип передачи прав на результаты ИС."
          required: true
          display_in_grid: false

        - name: "ip_transfer_type_display"
          type: "string"
          presentation: "fact"
          label: "Тип передачи прав ИС"
          description: "User-friendly описание типа передачи прав на результаты ИС."
          required: true
          display_in_grid: true
          display_priority: 1

        - name: "ip_transfer_moment"
          type: "string"
          presentation: "signal"
          allowed_values:
            - "upon_payment"
            - "upon_creation"
            - "upon_acceptance"
            - "upon_signing"
            - "upon_delivery"
            - "not_defined"
          description: "Момент перехода прав на результаты ИС."
          required: true
          display_in_grid: false

        - name: "ip_transfer_moment_display"
          type: "string"
          presentation: "fact"
          label: "Момент перехода прав"
          description: "User-friendly описание момента перехода прав на результаты ИС."
          required: true
          display_in_grid: true
          display_priority: 2

        - name: "ip_objects_listed"
          type: "string"
          presentation: "signal"
          allowed_values:
            - "defined"
            - "not_defined"
          description: "Перечислены ли объекты ИС."
          required: true
          display_in_grid: false

        - name: "ip_objects_description"
          type: "string"
          presentation: "fact"
          label: "Объекты ИС"
          description: "Описание объектов интеллектуальной собственности из текста договора."
          required: false
          display_in_grid: true
          display_priority: 3
      store_payload: true

  - id: sla_kpi_metrics_check
    name: "SLA/KPI: метрики качества обслуживания"
    description: >
      Фактографическая проверка наличия в договоре SLA / KPI, измеримых
      метрик качества, периода пересмотра SLA и санкций / service credits
      за нарушение показателей. Результат предназначен для табличного
      сравнения нескольких договоров.
    triggers:
      any: ["sla_based", "it_services"]
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "SLA"
        - "Service Level Agreement"
        - "KPI"
        - "уровень обслуживания"
        - "время реакции"
        - "время решения"
        - "доступность"
        - "uptime"
        - "service credit"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)\\bSLA\\b"
        - "(?i)\\bKPI\\b"
        - "(?i)время\\s+реакции"
        - "(?i)доступност.*\\d+.*%"
        - "(?i)uptime"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор услуг, в котором возможно использование SLA / KPI.
        Проверяется только один вопрос: есть ли измеримые метрики качества
        обслуживания, период пересмотра SLA и санкции / service credits
        за нарушение метрик.

        Нормативный ориентир:
        - договорные условия об уровне сервиса
        - условия об ответственности за нарушение согласованных метрик

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора, а чего прямо нет.
        - Не оценивай серьёзность риска.
        - Юрист будет использовать результат в сравнительной таблице.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Есть ли SLA / KPI.
        2. Какие метрики качества указаны.
        3. Есть ли метрика времени реакции.
        4. Есть ли метрика доступности / uptime.
        5. Есть ли service credits / санкции за нарушение SLA.
        6. Какой период пересмотра SLA указан.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Если условие не указано прямо:
           - для статусных полей (*_present, *_defined) возвращай "not_defined";
           - для enum-полей (sla_review_period) возвращай "not_defined";
           - для текстовых полей (sla_metrics_summary) возвращай "Не установлено".
        4. Строго запрещено использовать "None", "null", "not_defined" (в текстовых полях) или пустые строки "".
        5. sla_present_display:
           - Если sla_present = "defined" — "Да".
           - Если "not_defined" — "Нет".
        6. service_credit_or_penalty_display:
           - Если service_credit_or_penalty_defined = "defined" — "Да".
           - Если "not_defined" — "Нет".
        7. sla_review_period_display:
           - Если sla_review_period = "monthly" — "Ежемесячно".
           - Если "quarterly" — "Ежеквартально".
           - Если "annual" — "Ежегодно".
           - Если "other" — укажи конкретный период из текста (например, "Раз в 2 года").
           - Если "not_defined" — "Не определено".
        8. Не считай обычные сроки оказания услуг эквивалентом SLA, если нет измеримой метрики обслуживания.
        9. Если SLA определяется по приложению/политике/регламенту — укажи это в sla_metrics_summary.
        10. В evidence включай только точный текст договора.
        11. Верни только один валидный JSON-объект, содержащий все указанные ключи.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — SLA есть:
        Фрагмент:
        "SLA включает время реакции на инцидент не более 30 минут, время решения
        критического инцидента — до 4 часов, доступность сервиса — 99,5%.
        При нарушении показателей Исполнитель предоставляет service credit.
        SLA пересматривается ежеквартально."

        Ответ:
        {
          "sla_present": "defined",
          "sla_present_display": "Да",
          "sla_metrics_summary": "время реакции не более 30 минут; время решения критического инцидента до 4 часов; доступность сервиса 99,5%",
          "response_time_metric_defined": "defined",
          "availability_metric_defined": "defined",
          "service_credit_or_penalty_defined": "defined",
          "service_credit_or_penalty_display": "Да",
          "sla_review_period": "quarterly",
          "sla_review_period_display": "Ежеквартально",
          "evidence": [
            {
              "clause_ref": "Приложение SLA",
              "quote": "SLA включает время реакции на инцидент не более 30 минут, время решения критического инцидента — до 4 часов, доступность сервиса — 99,5%. При нарушении показателей Исполнитель предоставляет service credit. SLA пересматривается ежеквартально."
            }
          ]
        }

        Пример 2 — SLA определяется по приложению:
        Фрагмент:
        "Уровень обслуживания определяется согласно Регламенту оказания услуг (Приложение № 3).
        Показатели SLA пересматриваются Сторонами ежегодно."

        Ответ:
        {
          "sla_present": "defined",
          "sla_present_display": "Да",
          "sla_metrics_summary": "Определяется по Регламенту оказания услуг (Приложение № 3)",
          "response_time_metric_defined": "not_defined",
          "availability_metric_defined": "not_defined",
          "service_credit_or_penalty_defined": "not_defined",
          "service_credit_or_penalty_display": "Нет",
          "sla_review_period": "annual",
          "sla_review_period_display": "Ежегодно",
          "evidence": [
            {
              "clause_ref": "п. 5.1",
              "quote": "Уровень обслуживания определяется согласно Регламенту оказания услуг (Приложение № 3). Показатели SLA пересматриваются Сторонами ежегодно."
            }
          ]
        }

        Пример 3 — период пересмотра иной:
        Фрагмент:
        "Показатели SLA пересматриваются Сторонами раз в 2 года или по взаимному согласию."

        Ответ:
        {
          "sla_present": "defined",
          "sla_present_display": "Да",
          "sla_metrics_summary": "Не установлено",
          "response_time_metric_defined": "not_defined",
          "availability_metric_defined": "not_defined",
          "service_credit_or_penalty_defined": "not_defined",
          "service_credit_or_penalty_display": "Нет",
          "sla_review_period": "other",
          "sla_review_period_display": "Раз в 2 года",
          "evidence": [
            {
              "clause_ref": "п. 7.3",
