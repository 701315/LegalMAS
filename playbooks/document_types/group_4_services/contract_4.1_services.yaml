        3. response_time_metric_defined — "defined" / "not_defined".
        4. availability_metric_defined — "defined" / "not_defined".
        5. service_credit_or_penalty_defined — "defined" / "not_defined".
        6. sla_review_period — "monthly" / "quarterly" / "annual" / "other" /
           "not_defined".
