        - name: "result_retention_summary"
          type: "string"
          presentation: "fact"
          label: "Удержание результата"
          description: >
            Краткое описание права удержания результатов до оплаты. Fallback: "Не установлено" / "Не удалось определить".
          required: false
          display_in_grid: true
          display_priority: 5
      store_payload: true

  - id: service_period_defined
    name: "Срок оказания услуг (ст. 708 ГК РФ по аналогии)"
    description: >
      Фактографическая проверка наличия в договоре срока оказания услуг,
      начального и конечного момента, этапности и определённости срока.
      Результат предназначен для табличного сравнения нескольких договоров.
    triggers:
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "срок оказания"
        - "период оказания"
        - "дата начала"
        - "дата окончания"
        - "в течение"
        - "с момента"
        - "этап"
        - "календарный план"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)срок\\s+оказани"
        - "(?i)\\b\\d{1,2}[.]\\d{1,2}[.]\\d{4}\\b"
        - "(?i)(в\\s+течение|с\\s+момента)\\s+\\d+"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор возмездного оказания услуг.
        Проверяется только один вопрос: срок оказания услуг, начальный и конечный
        момент, этапы и определённость срока.

        Нормативный ориентир:
        - ст. 190 ГК РФ — определение сроков
        - ст. 708 ГК РФ по аналогии — сроки выполнения

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора, а чего прямо нет.
        - Не оценивай серьёзность риска.
        - Юрист будет использовать результат в сравнительной таблице.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Определён ли срок оказания услуг.
        2. Как сформулирован срок.
        3. Какой начальный момент указан.
        4. Какой конечный момент указан.
        5. Есть ли этапы / milestones.
        6. Насколько определён срок.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Если условие не указано прямо:
           - для статусных полей (*_status, milestones_present) возвращай "not_defined";
           - для текстовых полей (service_period_value, service_start_moment, service_end_moment) возвращай "Не установлено";
           - для enum-полей (term_definiteness) возвращай "not_defined".
        4. Строго запрещено использовать "None", "null", "not_defined" (в текстовых полях) или пустые строки "".
        5. Если срок оказания услуг определяется по календарному плану, графику, приложению или иному документу — укажи это в service_period_value (например, "Определяется по Календарному плану (Приложение № 3)").
        6. Не путай срок оказания услуг со сроком действия договора, сроком оплаты или сроком уведомления.
        7. В evidence включай только точный текст договора.
        8. Верни только один валидный JSON-объект, содержащий все указанные ключи.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — срок определён конкретными датами:
        Фрагмент:
        "Услуги оказываются с 01.03.2024 по 31.12.2024. Отчеты предоставляются
        ежемесячно. Первый этап завершается 31.05.2024."

        Ответ:
        {
          "service_period_status": "defined",
          "service_period_value": "с 01.03.2024 по 31.12.2024",
          "service_start_moment": "01.03.2024",
          "service_end_moment": "31.12.2024",
          "milestones_present": "defined",
          "term_definiteness": "fixed_date",
          "evidence": [
            {
              "clause_ref": "п. 2.1",
              "quote": "Услуги оказываются с 01.03.2024 по 31.12.2024. Отчеты предоставляются ежемесячно. Первый этап завершается 31.05.2024."
            }
          ]
        }

        Пример 2 — срок определяется по календарному плану:
        Фрагмент:
        "Срок оказания услуг определяется согласно Календарному плану (Приложение № 3
        к настоящему Договору). Исполнитель обязуется завершить все этапы работ в сроки,
        установленные указанным Календарным планом."

        Ответ:
        {
          "service_period_status": "defined",
          "service_period_value": "Определяется по Календарному плану (Приложение № 3)",
          "service_start_moment": "Не установлено",
          "service_end_moment": "Не установлено",
          "milestones_present": "defined",
          "term_definiteness": "event_based",
          "evidence": [
            {
              "clause_ref": "п. 3.1",
              "quote": "Срок оказания услуг определяется согласно Календарному плану (Приложение № 3 к настоящему Договору). Исполнитель обязуется завершить все этапы работ в сроки, установленные указанным Календарным планом."
            }
          ]
        }

        Пример 3 — срок привязан к событию:
        Фрагмент:
        "Исполнитель обязуется оказать услуги в течение 30 календарных дней с момента
        получения полного комплекта исходных данных от Заказчика."

        Ответ:
        {
          "service_period_status": "defined",
          "service_period_value": "в течение 30 календарных дней с момента получения полного комплекта исходных данных",
          "service_start_moment": "с момента получения полного комплекта исходных данных",
          "service_end_moment": "через 30 календарных дней после начала",
          "milestones_present": "not_defined",
          "term_definiteness": "event_based",
          "evidence": [
            {
              "clause_ref": "п. 2.2",
              "quote": "Исполнитель обязуется оказать услуги в течение 30 календарных дней с момента получения полного комплекта исходных данных от Заказчика."
            }
          ]
        }

        Пример 4 — данные отсутствуют:
        Фрагмент:
        "Исполнитель оказывает услуги в период действия договора."

        Ответ:
        {
          "service_period_status": "not_defined",
          "service_period_value": "Не установлено",
          "service_start_moment": "Не установлено",
          "service_end_moment": "Не установлено",
          "milestones_present": "not_defined",
          "term_definiteness": "not_defined",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Есть ли прямая формулировка срока оказания услуг (не срока действия договора).
        2. Есть ли отдельный начальный момент.
        3. Есть ли отдельный конечный момент.
        4. Есть ли этапы или milestones.
        5. Если срок определяется по календарному плану / графику / приложению — это не "Не установлено", а "Определяется по ...".
        6. Если прямой цитаты нет — верни "not_defined" для статусов и "Не установлено" для текста. Не додумывай условия.

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        {
          "service_period_status": "<defined / not_defined>",
          "service_period_value": "<текст / 'Определяется по ...' / 'Не установлено'>",
          "service_start_moment": "<текст или 'Не установлено'>",
          "service_end_moment": "<текст или 'Не установлено'>",
          "milestones_present": "<defined / not_defined>",
          "term_definiteness": "<fixed_date / event_based / vague / not_defined>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 5
      temperature: 0.0
      max_tokens: 600

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "срок оказания услуг дата начала дата окончания период оказания этап календарный план график milestone"
      retrieval_profile: "term_and_renewal_check"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - technical_fragment
        - structural_anchor
      preferred_clause_functions:
        - obligations
      negative_keywords:
        - "срок оплаты"
        - "срок рассмотрения акта"
        - "срок уведомления"
        - "неустойка"
      position_bias:
        preferred_range: [0.10, 0.45]
        boost: 0.18
        scope: segment
      context_k: 5
      max_chunks: 7
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
      preferred_clause_functions:
        - "obligations"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 650

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 700

      compact_output: false

      presence_signal:
        field: "service_period_defined_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора срок оказания услуг,
        начальный и конечный момент, этапы и определённость срока.
        Не анализируй цену, приёмку, санкции или споры.
        Не оценивай риски. Анализируй только текст договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. service_period_defined_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (service_period_status, milestones_present,
              term_definiteness) ≠ "not_defined";
           - "missing" — если все три содержательных поля = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - service_period_status = "not_defined";
           - milestones_present = "not_defined";
           - term_definiteness = "not_defined";
           - service_period_value = "Не установлено";
           - service_start_moment = "Не установлено";
           - service_end_moment = "Не установлено";
           - не выполняй остальные шаги.

        1. service_period_status:
           - "defined" — если в тексте прямо указан срок оказания услуг
             (конкретные даты, период, привязка к событию или календарному плану);
           - "not_defined" — если срок оказания услуг прямо не определён.
           Важно: не путай срок оказания услуг со сроком действия договора,
           сроком оплаты или сроком уведомления.

        2. service_period_value:
           Краткое user-facing описание срока на русском языке.
           - Если срок указан прямо — укажи формулировку, например: "с 01.03.2024 по 31.12.2024".
           - Если срок определяется по документу — укажи: "Определяется по Календарному плану (Приложение № 3)".
           - Если данных нет — "Не установлено".
           - Если данные противоречивы — "Не удалось определить".

        3. service_start_moment:
           Начальный момент срока оказания услуг.
           Если данных нет — "Не установлено".
           Если данные противоречивы — "Не удалось определить".

        4. service_end_moment:
           Конечный момент срока оказания услуг.
           Если данных нет — "Не установлено".
           Если данные противоречивы — "Не удалось определить".

        5. milestones_present:
           - "defined" — есть этапы, milestones, график, календарный план;
           - "not_defined" — этапы прямо не указаны.

        6. term_definiteness:
           Степень определённости срока. Используй только:
           - "fixed_date" — конкретные даты или чёткий период;
           - "event_based" — срок привязан к событию или документу;
           - "vague" — неопределённая формулировка ("в разумный срок", "в период действия договора");
           - "not_defined" — срок прямо не определён.
        </task>

        <context_rules>
        - Перед остальными полями заполни service_period_defined_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status / enum = "not_defined", все текстовые поля = "Не установлено".
        - Используй только релевантные фрагменты контекста.
        - Не подставляй нормы закона, обычную практику или предположения вместо текста договора.
        - Не путай срок оказания услуг со сроком действия договора, сроком оплаты или сроком уведомления.
        - Если срок определяется по календарному плану, графику, приложению или иному названному документу и это прямо видно из текста, считай срок определённым и отрази в service_period_value.
        - Если в разных фрагментах указаны разные даты и конфликт нельзя разрешить по тексту: статус → "not_defined", текстовое поле → "Не удалось определить".
        - Не используй пустые строки.
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни срока оказания, ни дат, ни этапов.
           → presence = "missing";
             все *_status / enum = "not_defined";
             все текстовые поля = "Не установлено".

        2. Срок определяется по внешнему документу.
           "Срок оказания определяется согласно Календарному плану (Приложение № 3)".
           → presence = "present";
             service_period_status = "defined";
             term_definiteness = "event_based";
             service_period_value = "Определяется по Календарному плану (Приложение № 3)".

        3. Противоречие в датах.
           В разных частях договора указаны разные сроки оказания.
           → presence = "unclear";
             service_period_status = "not_defined";
             service_period_value = "Не удалось определить".

        4. Неопределённая формулировка.
           "Услуги оказываются в период действия договора" или "в разумный срок".
           → presence = "present";
             service_period_status = "not_defined";
             term_definiteness = "vague";
             service_period_value = "Не установлено".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для service_period_defined_presence используй только: "present", "missing", "unclear".
        - Для status-полей используй только: "defined", "not_defined".
        - Для term_definiteness используй только: "fixed_date", "event_based", "vague", "not_defined".
        - Fallback при отсутствии данных:
          * service_period_value → "Не установлено";
          * service_start_moment → "Не установлено";
          * service_end_moment → "Не установлено".
        - Fallback при противоречии или неоднозначности:
          * все текстовые поля → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "service_period_defined_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования по сроку оказания услуг. Внутреннее агрегатное signal-поле."
          required: true

        - name: "service_period_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values:
            - "defined"
            - "not_defined"
          description: "Статус указания срока оказания услуг. Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "service_period_value"
          type: "string"
          presentation: "fact"
          label: "Срок услуг"
          description: >
            Срок оказания услуг. Fallback: "Не установлено" / "Не удалось определить".
          required: true
          display_in_grid: true
          display_priority: 1

        - name: "service_start_moment"
          type: "string"
          presentation: "fact"
          label: "Начало услуг"
          description: >
            Начальный момент срока услуг. Fallback: "Не установлено" / "Не удалось определить".
          required: false
          display_in_grid: false

        - name: "service_end_moment"
          type: "string"
          presentation: "fact"
          label: "Окончание услуг"
          description: >
            Конечный момент срока услуг. Fallback: "Не установлено" / "Не удалось определить".
          required: false
          display_in_grid: false

        - name: "milestones_present"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values:
            - "defined"
            - "not_defined"
          description: "Есть ли этапы оказания услуг. Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "term_definiteness"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values:
            - "fixed_date"
            - "event_based"
            - "vague"
            - "not_defined"
          description: "Степень определенности срока услуг. Внутреннее enum-поле."
          required: true
          display_in_grid: false
      store_payload: true

  - id: payment_acceptance_link_check
    name: "Привязка оплаты к акту/отчёту (ст. 781 ГК РФ)"
    description: >
      Фактографическая проверка наличия в договоре акта оказанных услуг,
      отчётности исполнителя, срока рассмотрения, мотивированного отказа и
      привязки оплаты к приемке. Результат предназначен для табличного
      сравнения нескольких договоров.
    triggers:
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "акт об оказании услуг"
        - "акт оказанных услуг"
        - "акт сдачи-приёмки"
        - "отчёт об оказанных услугах"
        - "детализация услуг"
        - "мотивированный отказ"
        - "срок рассмотрения"
        - "оплата после подписания"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)акт.*оказ(ания|анных).*услуг"
        - "(?i)оплат(а|ы).*после.*подписани.*акт"
        - "(?i)отч(е|ё)т.*услуг"
        - "(?i)мотивированн(ый|ого)\\s+отказ"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор возмездного оказания услуг.
        Проверяется только один вопрос: порядок приемки услуг, акт, отчетность
        исполнителя и привязка оплаты к приемке.

        Нормативный ориентир:
        - ст. 781 ГК РФ — оплата услуг
        - общие положения о приемке результата и подтверждающих документах

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора, а чего прямо нет.
        - Не оценивай серьёзность риска.
        - Юрист будет использовать результат в сравнительной таблице.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Требуется ли акт.
        2. Требуется ли детализированный акт.
        3. Требуется ли отчет.
        4. Требуется ли детализированный отчет.
        5. Привязана ли оплата к акту или отчету.
        6. Какой срок рассмотрения документов указан.
        7. Есть ли автоприемка.
        8. Есть ли процедура мотивированного отказа.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Если условие не указано прямо:
           - для статусных полей (все *_required, *_detailed, *_linked, *_status, *_clause, *_procedure) возвращай "not_defined";
           - для текстовых полей (review_period_value) возвращай "Не установлено".
        4. Строго запрещено использовать "None", "null", "not_defined" (в текстовых полях) или пустые строки "".
        5. acceptance_documents_summary:
           - Если требуется и акт, и отчёт — "Акт + отчёт".
           - Если требуется только акт — "Только акт".
           - Если требуется только отчёт — "Только отчёт".
           - Если ничего не требуется — "Не определено".
           - Если требуется детализация — добавь " (с детализацией)".
        6. payment_linked_to_acceptance_display:
           - Если оплата привязана к приемке — "Оплата после подписания акта/отчёта".
           - Если оплата не привязана — "Оплата не привязана к приемке".
           - Если не определено — "Не определено".
        7. auto_acceptance_clause_display:
           - Если есть автоприемка — укажи срок (например, "Автоприемка через 5 рабочих дней").
           - Если автоприемки нет — "Автоприемка не предусмотрена".
           - Если не определено — "Не определено".
        8. Не путай акт приемки услуг с актом сверки или иным документом.
        9. В evidence включай только точный текст договора.
        10. Верни только один валидный JSON-объект, содержащий все указанные ключи.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — порядок приемки определён:
        Фрагмент:
        "Исполнитель ежемесячно направляет акт оказанных услуг и отчет с
        детализацией выполненных действий. Заказчик обязан в течение 5 рабочих
        дней подписать акт либо направить мотивированный отказ. Оплата
        производится после подписания акта."

        Ответ:
        {
          "act_required": "defined",
          "act_detailed": "defined",
          "report_required": "defined",
          "report_detailed": "defined",
          "acceptance_documents_summary": "Акт + отчёт (с детализацией)",
          "payment_linked_to_acceptance": "defined",
          "payment_linked_to_acceptance_display": "Оплата после подписания акта",
          "review_period_status": "defined",
          "review_period_value": "5 рабочих дней",
          "auto_acceptance_clause": "not_defined",
          "auto_acceptance_clause_display": "Автоприемка не предусмотрена",
          "motivated_refusal_procedure": "defined",
          "evidence": [
            {
              "clause_ref": "п. 4.1",
              "quote": "Исполнитель ежемесячно направляет акт оказанных услуг и отчет с детализацией выполненных действий. Заказчик обязан в течение 5 рабочих дней подписать акт либо направить мотивированный отказ. Оплата производится после подписания акта."
            }
          ]
        }

        Пример 2 — автоприемка:
        Фрагмент:
        "Исполнитель направляет акт оказанных услуг. Если в течение 10 рабочих дней
        Заказчик не направит мотивированный отказ, услуги считаются принятыми.
        Оплата производится ежемесячно независимо от подписания акта."

        Ответ:
        {
          "act_required": "defined",
          "act_detailed": "not_defined",
          "report_required": "not_defined",
          "report_detailed": "not_defined",
          "acceptance_documents_summary": "Только акт",
          "payment_linked_to_acceptance": "not_defined",
          "payment_linked_to_acceptance_display": "Оплата не привязана к приемке",
          "review_period_status": "defined",
          "review_period_value": "10 рабочих дней",
          "auto_acceptance_clause": "defined",
          "auto_acceptance_clause_display": "Автоприемка через 10 рабочих дней",
          "motivated_refusal_procedure": "defined",
          "evidence": [
            {
              "clause_ref": "п. 5.2",
              "quote": "Исполнитель направляет акт оказанных услуг. Если в течение 10 рабочих дней Заказчик не направит мотивированный отказ, услуги считаются принятыми. Оплата производится ежемесячно независимо от подписания акта."
            }
          ]
        }

        Пример 3 — данные отсутствуют:
        Фрагмент:
        "Услуги считаются оказанными надлежащим образом."

        Ответ:
        {
          "act_required": "not_defined",
          "act_detailed": "not_defined",
          "report_required": "not_defined",
          "report_detailed": "not_defined",
          "acceptance_documents_summary": "Не определено",
          "payment_linked_to_acceptance": "not_defined",
          "payment_linked_to_acceptance_display": "Не определено",
          "review_period_status": "not_defined",
          "review_period_value": "Не установлено",
          "auto_acceptance_clause": "not_defined",
          "auto_acceptance_clause_display": "Не определено",
          "motivated_refusal_procedure": "not_defined",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Есть ли прямое указание на акт.
        2. Есть ли прямое указание на отчет.
        3. Есть ли прямое указание на срок рассмотрения.
        4. Есть ли прямое указание на автоприемку или мотивированный отказ.
        5. Если прямой цитаты нет — верни "not_defined" для статусов и "Не установлено" для текста. Не додумывай условия.

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        {
          "act_required": "<defined / not_defined>",
          "act_detailed": "<defined / not_defined>",
          "report_required": "<defined / not_defined>",
          "report_detailed": "<defined / not_defined>",
          "acceptance_documents_summary": "<Акт + отчёт / Только акт / Только отчёт / Не определено>",
          "payment_linked_to_acceptance": "<defined / not_defined>",
          "payment_linked_to_acceptance_display": "<Оплата после подписания акта / Оплата не привязана к приемке / Не определено>",
          "review_period_status": "<defined / not_defined>",
          "review_period_value": "<текст или 'Не установлено'>",
          "auto_acceptance_clause": "<defined / not_defined>",
          "auto_acceptance_clause_display": "<Автоприемка через N дней / Автоприемка не предусмотрена / Не определено>",
          "motivated_refusal_procedure": "<defined / not_defined>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 5
      temperature: 0.0
      max_tokens: 700

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "акт оказанных услуг отчет детализация мотивированный отказ срок рассмотрения оплата после подписания акта приемка услуг автоприемка"
      retrieval_profile: "acceptance_check"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - technical_fragment
        - structural_anchor
      preferred_clause_functions:
        - obligations
      negative_keywords:
        - "форс-мажор"
        - "неустойка"
        - "конфиденциальность"
      position_bias:
        preferred_range: [0.25, 0.65]
        boost: 0.18
        scope: segment
      context_k: 5
      max_chunks: 8
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
      preferred_clause_functions:
        - obligations
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 650

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 950

      compact_output: false

      presence_signal:
        field: "payment_acceptance_link_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора порядок приемки услуг,
        документы приемки, срок рассмотрения и привязку оплаты к приемке.
        Не анализируй цену, санкции, форс-мажор или споры.
        Не оценивай риски. Анализируй только текст договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. payment_acceptance_link_check_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (act_required, report_required, payment_linked_to_acceptance,
              review_period_status, auto_acceptance_clause,
              motivated_refusal_procedure) ≠ "not_defined";
           - "missing" — если все шесть содержательных полей = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - act_required = "not_defined";
           - act_detailed = "not_defined";
           - report_required = "not_defined";
           - report_detailed = "not_defined";
           - payment_linked_to_acceptance = "not_defined";
           - review_period_status = "not_defined";
           - auto_acceptance_clause = "not_defined";
           - motivated_refusal_procedure = "not_defined";
           - acceptance_documents_summary = "Не определено";
           - payment_linked_to_acceptance_display = "Не определено";
           - review_period_value = "Не установлено";
           - auto_acceptance_clause_display = "Не определено";
           - не выполняй остальные шаги.

        1. act_required:
           - "defined" — если в тексте прямо указано, что Исполнитель обязан
             предоставить акт оказанных услуг (акт сдачи-приёмки);
           - "not_defined" — если акт прямо не упомянут.

        2. act_detailed:
           - "defined" — если прямо требуется детализация акта (разбивка по
             видам услуг, часам, этапам);
           - "not_defined" — если детализация акта прямо не требуется.

        3. report_required:
           - "defined" — если в тексте прямо указано, что Исполнитель обязан
             предоставить отчёт об оказанных услугах;
           - "not_defined" — если отчёт прямо не упомянут.

        4. report_detailed:
           - "defined" — если прямо требуется детализация отчёта;
           - "not_defined" — если детализация отчёта прямо не требуется.

        5. acceptance_documents_summary:
           User-friendly сводка документов приёмки:
           - "Акт + отчёт" — если оба required = "defined";
           - "Только акт" — если только act_required = "defined";
           - "Только отчёт" — если только report_required = "defined";
           - "Не определено" — если оба = "not_defined".
           Если act_detailed или report_detailed = "defined", добавь " (с детализацией)".

        6. payment_linked_to_acceptance:
           - "defined" — если прямо указано, что оплата производится после
             подписания акта или отчёта;
           - "not_defined" — если привязка оплаты к приемке прямо не указана.

        7. payment_linked_to_acceptance_display:
           User-friendly описание:
           - "Оплата после подписания акта" (или "отчёта") — если linked = "defined";
           - "Оплата не привязана к приемке" — если из текста прямо следует,
             что оплата производится независимо от подписания акта;
           - "Не определено" — если данных нет.

        8. review_period_status:
           - "defined" — если прямо указан срок рассмотрения акта/отчёта
             Заказчиком (например, "в течение 5 рабочих дней");
           - "not_defined" — если срок рассмотрения прямо не указан.

        9. review_period_value:
           Срок рассмотрения на русском языке, например: "5 рабочих дней".
           Если данных нет — "Не установлено".
           Если данные противоречивы — "Не удалось определить".

        10. auto_acceptance_clause:
            - "defined" — если есть условие автоприемки (услуги считаются
              принятыми, если Заказчик не ответил в течение N дней);
            - "not_defined" — если автоприемка прямо не предусмотрена.

        11. auto_acceptance_clause_display:
            User-friendly описание:
            - "Автоприемка через N рабочих дней" — если clause = "defined";
            - "Автоприемка не предусмотрена" — если clause = "not_defined".

        12. motivated_refusal_procedure:
            - "defined" — если прямо описана процедура мотивированного отказа
              Заказчика от приёмки;
            - "not_defined" — если процедура прямо не описана.
        </task>

        <context_rules>
        - Перед остальными полями заполни payment_acceptance_link_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status / enum = "not_defined", все текстовые / display поля = соответствующий fallback.
        - Используй только релевантные фрагменты контекста.
        - Не подставляй нормы закона, обычную практику или предположения вместо текста договора.
        - Не извлекай сведения о цене, санкциях, форс-мажоре, спорах и иных нерелевантных темах.
        - Не путай акт приемки услуг с актом сверки или иным документом.
        - Если оплата прямо производится независимо от подписания акта — payment_linked_to_acceptance = "not_defined", display = "Оплата не привязана к приемке".
        - Если в разных фрагментах указаны разные сроки и конфликт нельзя разрешить по тексту: статус → "not_defined", текстовое поле → "Не удалось определить".
        - Не используй пустые строки.
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни акта, ни отчёта, ни привязки оплаты, ни автоприемки.
           → presence = "missing";
             все *_status / enum = "not_defined";
             все текстовые / display поля = соответствующий fallback.

        2. Акт есть, но привязка оплаты и детали не раскрыты.
           "Исполнитель направляет акт оказанных услуг" без срока, автоприемки,
           мотивированного отказа и привязки оплаты.
           → presence = "present";
             act_required = "defined";
             payment_linked_to_acceptance = "not_defined";
             review_period_status = "not_defined";
             acceptance_documents_summary = "Только акт".

        3. Противоречие между фрагментами.
           В одной части договора — оплата после акта, в другой — независимо от акта.
           → presence = "unclear";
             payment_linked_to_acceptance = "not_defined";
             payment_linked_to_acceptance_display = "Не удалось определить".

        4. Автоприемка без явного акта.
           "Услуги считаются принятыми, если Заказчик не направит возражений
           в течение 10 дней" без прямого упоминания акта.
           → presence = "present";
             auto_acceptance_clause = "defined";
             auto_acceptance_clause_display = "Автоприемка через 10 дней";
             act_required = "not_defined".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для payment_acceptance_link_check_presence используй только: "present", "missing", "unclear".
        - Для status-полей используй только: "defined", "not_defined".
        - Fallback при отсутствии данных:
          * acceptance_documents_summary → "Не определено";
          * payment_linked_to_acceptance_display → "Не определено";
          * review_period_value → "Не установлено";
          * auto_acceptance_clause_display → "Не определено".
        - Fallback при противоречии или неоднозначности:
          * все текстовые / display поля → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "payment_acceptance_link_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования по приёмке/акту/привязке оплаты. Внутреннее агрегатное signal-поле."
          required: true

        - name: "act_required"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values:
            - "defined"
            - "not_defined"
          description: "Требуется ли акт оказанных услуг. Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "act_detailed"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values:
            - "defined"
            - "not_defined"
          description: "Требуется ли детализированный акт. Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "report_required"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values:
            - "defined"
            - "not_defined"
          description: "Требуется ли отчет исполнителя. Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "report_detailed"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values:
            - "defined"
            - "not_defined"
          description: "Требуется ли детализированный отчет. Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "acceptance_documents_summary"
          type: "string"
          presentation: "fact"
          label: "Документы приемки"
          description: >
            User-friendly описание требуемых документов приемки. Fallback: "Не установлено" / "Не удалось определить".
          required: true
          display_in_grid: true
          display_priority: 1

        - name: "payment_linked_to_acceptance"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values:
            - "defined"
            - "not_defined"
          description: "Привязана ли оплата к приемке. Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "payment_linked_to_acceptance_display"
          type: "string"
          presentation: "fact"
          label: "Привязка оплаты к приемке"
          description: >
            User-friendly описание привязки оплаты к приемке. Fallback: "Не установлено" / "Не удалось определить".
          required: true
          display_in_grid: true
          display_priority: 2

        - name: "review_period_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values:
            - "defined"
            - "not_defined"
          description: "Статус указания срока рассмотрения документов приемки. Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "review_period_value"
          type: "string"
          presentation: "fact"
          label: "Срок рассмотрения"
          description: >
            Срок рассмотрения акта / отчета. Fallback: "Не установлено" / "Не удалось определить".
          required: false
          display_in_grid: true
          display_priority: 3

        - name: "auto_acceptance_clause"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values:
            - "defined"
            - "not_defined"
          description: "Есть ли автоприемка. Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "auto_acceptance_clause_display"
          type: "string"
          presentation: "fact"
          label: "Автоприемка"
          description: >
            User-friendly описание условия автоприемки. Fallback: "Не установлено" / "Не удалось определить".
          required: true
          display_in_grid: true
          display_priority: 4

        - name: "motivated_refusal_procedure"
          type: "string"
          presentation: "signal"
          risk_weight: "low"
          allowed_values:
            - "defined"
            - "not_defined"
          description: "Есть ли процедура мотивированного отказа. Внутреннее enum-поле."
          required: true
          display_in_grid: false
      store_payload: true

  - id: liability_and_penalties_check
    name: "Ответственность, лимиты и неустойки"
    description: >
      Фактографическая проверка наличия в договоре неустоек для сторон,
      формулы санкций, ограничения ответственности и исключения косвенных
      убытков. Результат предназначен для табличного сравнения нескольких договоров.
    triggers:
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "неустойка"
        - "пеня"
        - "штраф"
        - "за каждый день просрочки"
        - "ответственность ограничена"
        - "совокупная ответственность"
        - "упущенная выгода"
        - "косвенные убытки"
        - "страхование ответственности"
        - "страховой полис"
        - "профессиональная ответственность"
        - "страховое покрытие"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)неустойк(а|и|у).*\\d"
        - "(?i)пен(я|и|ю).*\\d.*%"
        - "(?i)совокупн.*ответственност.*не.*превыша"
        - "(?i)не\\s+возмеща(ются|ется).*косвенн"
        - "(?i)страхов(ание|ой).*ответственност"
        - "(?i)страхов(ой|ого)\\s+полис"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор возмездного оказания услуг.
        Проверяется только один вопрос: санкции за нарушение, лимиты ответственности,
        исключение отдельных видов убытков и наличие страхования профессиональной ответственности.

        Нормативный ориентир:
        - ст. 330 ГК РФ — неустойка
        - ст. 393 ГК РФ — ответственность за нарушение обязательств
        - ст. 401 ГК РФ — основания ответственности
        - договорные механизмы ограничения и страхования ответственности

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора, а чего прямо нет.
        - Не оценивай серьёзность риска.
        - Юрист будет использовать результат в сравнительной таблице.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Предусмотрена ли санкция для исполнителя.
        2. Какая формула санкции для исполнителя.
        3. Предусмотрена ли санкция для заказчика.
        4. Какая формула санкции для заказчика.
        5. Есть ли лимит ответственности.
        6. Как описан лимит ответственности.
        7. Исключены ли косвенные убытки / упущенная выгода.
        8. Есть ли требование о страховании профессиональной ответственности.
        9. Как кратко описано такое страхование.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Если условие не указано прямо:
           - для статусных полей (*_present, *_defined, *_excluded) возвращай "not_defined";
           - для текстовых полей (*_formula, *_description, *_summary) возвращай "Не установлено".
        4. Строго запрещено использовать "None", "null", "not_defined" (в текстовых полях) или пустые строки "".
        5. Не путай санкцию с ценой договора.
        6. Не путай страхование профессиональной ответственности с общим имущественным страхованием, если профессиональная ответственность прямо не названа.
        7. В evidence включай только точный текст договора.
        8. Верни только один валидный JSON-объект, содержащий все указанные ключи.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — санкции и страхование есть:
        Фрагмент:
        "За просрочку оказания услуг Исполнитель уплачивает пеню в размере
        0,1% от стоимости просроченных услуг за каждый день просрочки.
        За просрочку оплаты Заказчик уплачивает пеню 0,05% за каждый день.
        Совокупная ответственность Исполнителя ограничивается суммой
        вознаграждения за последние 3 месяца. Косвенные убытки не возмещаются.
        Исполнитель обязан поддерживать страхование профессиональной ответственности
        на весь срок действия договора."

        Ответ:
        {
          "provider_penalty_present": "defined",
          "provider_penalty_formula": "0,1% от стоимости просроченных услуг за каждый день просрочки",
          "client_penalty_present": "defined",
          "client_penalty_formula": "0,05% за каждый день просрочки оплаты",
          "liability_cap_present": "defined",
          "liability_cap_description": "совокупная ответственность Исполнителя ограничивается суммой вознаграждения за последние 3 месяца",
          "indirect_damages_excluded": "defined",
          "professional_liability_insurance_defined": "defined",
          "professional_liability_insurance_summary": "Исполнитель обязан поддерживать страхование профессиональной ответственности на весь срок действия договора",
          "evidence": [
            {
              "clause_ref": "п. 7.1",
              "quote": "За просрочку оказания услуг Исполнитель уплачивает пеню в размере 0,1% от стоимости просроченных услуг за каждый день просрочки. За просрочку оплаты Заказчик уплачивает пеню 0,05% за каждый день. Совокупная ответственность Исполнителя ограничивается суммой вознаграждения за последние 3 месяца. Косвенные убытки не возмещаются. Исполнитель обязан поддерживать страхование профессиональной ответственности на весь срок действия договора."
            }
          ]
        }

        Пример 2 — только исключение косвенных убытков:
        Фрагмент:
        "Стороны не возмещают друг другу упущенную выгоду и косвенные убытки."

        Ответ:
        {
          "provider_penalty_present": "not_defined",
          "provider_penalty_formula": "Не установлено",
          "client_penalty_present": "not_defined",
          "client_penalty_formula": "Не установлено",
          "liability_cap_present": "not_defined",
          "liability_cap_description": "Не установлено",
          "indirect_damages_excluded": "defined",
          "professional_liability_insurance_defined": "not_defined",
          "professional_liability_insurance_summary": "Не установлено",
          "evidence": [
            {
              "clause_ref": "п. 8.3",
              "quote": "Стороны не возмещают друг другу упущенную выгоду и косвенные убытки."
            }
          ]
        }

        Пример 3 — данные отсутствуют:
        Фрагмент:
        "Стороны несут ответственность в соответствии с законодательством РФ."

        Ответ:
        {
          "provider_penalty_present": "not_defined",
          "provider_penalty_formula": "Не установлено",
          "client_penalty_present": "not_defined",
          "client_penalty_formula": "Не установлено",
          "liability_cap_present": "not_defined",
          "liability_cap_description": "Не установлено",
          "indirect_damages_excluded": "not_defined",
          "professional_liability_insurance_defined": "not_defined",
          "professional_liability_insurance_summary": "Не установлено",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Есть ли прямая формула неустойки для исполнителя.
        2. Есть ли прямая формула неустойки для заказчика.
        3. Есть ли прямое ограничение ответственности.
        4. Есть ли прямое исключение косвенных убытков.
        5. Есть ли прямое требование о страховании профессиональной ответственности.
        6. Если прямой цитаты нет — верни "not_defined" для статусов и "Не установлено" для текста. Не додумывай условия.

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        {
          "provider_penalty_present": "<defined / not_defined>",
          "provider_penalty_formula": "<текст или 'Не установлено'>",
          "client_penalty_present": "<defined / not_defined>",
          "client_penalty_formula": "<текст или 'Не установлено'>",
          "liability_cap_present": "<defined / not_defined>",
          "liability_cap_description": "<текст или 'Не установлено'>",
          "indirect_damages_excluded": "<defined / not_defined>",
          "professional_liability_insurance_defined": "<defined / not_defined>",
          "professional_liability_insurance_summary": "<текст или 'Не установлено'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 5
      temperature: 0.0
      max_tokens: 700

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "неустойка пеня штраф ответственность ограничена совокупная ответственность косвенные убытки упущенная выгода страхование ответственности страховой полис профессиональная ответственность"
      retrieval_profile: "liability_cap_check"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - technical_fragment
        - structural_anchor
      preferred_clause_functions:
        - obligations
      negative_keywords:
        - "цена"
        - "акт"
        - "форс-мажор"
      position_bias:
        preferred_range: [0.45, 0.90]
        boost: 0.18
        scope: segment
      context_k: 5
      max_chunks: 8
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
      preferred_clause_functions:
        - obligations
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 650

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1000

      compact_output: false

      presence_signal:
        field: "liability_and_penalties_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора санкции для сторон,
        лимиты ответственности, исключение косвенных убытков и условия о страховании
        профессиональной ответственности. Не анализируй цену, приёмку, сроки или споры.
        Не оценивай риски. Анализируй только текст договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. liability_and_penalties_check_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (provider_penalty_present, client_penalty_present,
              liability_cap_present, indirect_damages_excluded,
              professional_liability_insurance_defined) ≠ "not_defined";
           - "missing" — если все пять содержательных полей = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - provider_penalty_present = "not_defined";
           - client_penalty_present = "not_defined";
           - liability_cap_present = "not_defined";
           - indirect_damages_excluded = "not_defined";
           - professional_liability_insurance_defined = "not_defined";
           - provider_penalty_formula = "Не установлено";
           - client_penalty_formula = "Не установлено";
           - liability_cap_description = "Не установлено";
           - professional_liability_insurance_summary = "Не установлено";
           - не выполняй остальные шаги.

        1. provider_penalty_present:
           - "defined" — если в тексте прямо указана санкция (неустойка, пеня,
             штраф) для Исполнителя с формулой или конкретным размером;
           - "not_defined" — если санкция для Исполнителя прямо не указана.
           Важно: общая фраза "Стороны несут ответственность по закону"
           без конкретной формулы не является основанием для "defined".

        2. provider_penalty_formula:
           Краткое описание формулы санкции для Исполнителя на русском языке.
           Пример: "0,1% от стоимости просроченных услуг за каждый день просрочки".
           Если данных нет — "Не установлено".
           Если данные противоречивы — "Не удалось определить".

        3. client_penalty_present:
           - "defined" — если в тексте прямо указана санкция для Заказчика;
           - "not_defined" — если санкция для Заказчика прямо не указана.

        4. client_penalty_formula:
           Краткое описание формулы санкции для Заказчика.
           Если данных нет — "Не установлено".
           Если данные противоречивы — "Не удалось определить".

        5. liability_cap_present:
           - "defined" — если в тексте прямо указано ограничение (лимит)
             совокупной ответственности одной или обеих сторон;
           - "not_defined" — если лимит прямо не указан.

        6. liability_cap_description:
           Краткое описание лимита ответственности на русском языке.
           Пример: "Совокупная ответственность Исполнителя ограничена суммой
           вознаграждения за последние 3 месяца".
           Если данных нет — "Не установлено".
           Если данные противоречивы — "Не удалось определить".

        7. indirect_damages_excluded:
           - "defined" — если в тексте прямо исключены косвенные убытки,
             упущенная выгода или иные отдельные виды убытков;
           - "not_defined" — если исключение прямо не указано.

        8. professional_liability_insurance_defined:
           - "defined" — если в тексте прямо указано требование о страховании
             профессиональной ответственности Исполнителя;
           - "not_defined" — если страхование профессиональной ответственности
             прямо не упомянуто.
           Важно: не путай с общим имущественным страхованием.

        9. professional_liability_insurance_summary:
           Краткое описание условий страхования на русском языке.
           Если данных нет — "Не установлено".
           Если данные противоречивы — "Не удалось определить".
        </task>

        <context_rules>
        - Перед остальными полями заполни liability_and_penalties_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_present / *_defined / *_excluded = "not_defined", все текстовые поля = "Не установлено".
        - Используй только релевантные фрагменты контекста.
        - Не подставляй нормы закона, обычную практику или предположения вместо текста договора.
        - Не извлекай сведения о цене, приёмке, сроках, спорах и иных нерелевантных темах.
        - Не путай санкцию с ценой договора.
        - Не путай страхование профессиональной ответственности с общим имущественным страхованием.
        - Общая фраза "Стороны несут ответственность в соответствии с законодательством РФ" без конкретизации не является основанием для "defined" ни в одном из полей.
        - Если в разных фрагментах указаны разные формулы или лимиты и конфликт нельзя разрешить по тексту: статус → "not_defined", текстовое поле → "Не удалось определить".
        - Не используй пустые строки.
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни санкций, ни лимитов, ни исключения убытков,
           ни страхования.
           → presence = "missing";
             все *_present / *_defined / *_excluded = "not_defined";
             все текстовые поля = "Не установлено".

        2. Частичное раскрытие — только исключение косвенных убытков.
           "Стороны не возмещают друг другу упущенную выгоду и косвенные убытки"
           без конкретных санкций и лимитов.
           → presence = "present";
             indirect_damages_excluded = "defined";
             provider_penalty_present = "not_defined";
             client_penalty_present = "not_defined";
             liability_cap_present = "not_defined".

        3. Противоречие в формулах или лимитах.
           В разных частях договора указаны разные размеры неустойки.
           → presence = "unclear";
             соответствующий *_present = "not_defined";
             соответствующая *_formula = "Не удалось определить".

        4. Общая ссылка на закон без конкретики.
           "Стороны несут ответственность в соответствии с законодательством РФ"
           без формул, лимитов и исключений.
           → presence = "missing" (все содержательные поля = "not_defined");
             все текстовые поля = "Не установлено".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для liability_and_penalties_check_presence используй только: "present", "missing", "unclear".
        - Для status-полей (*_present, *_defined, *_excluded) используй только: "defined", "not_defined".
        - Fallback при отсутствии данных:
          * provider_penalty_formula → "Не установлено";
          * client_penalty_formula → "Не установлено";
          * liability_cap_description → "Не установлено";
          * professional_liability_insurance_summary → "Не установлено".
        - Fallback при противоречии или неоднозначности:
          * все текстовые поля → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "liability_and_penalties_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования по санкциям/лимитам/страхованию. Внутреннее агрегатное signal-поле."
          required: true

        - name: "provider_penalty_present"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values:
            - "defined"
            - "not_defined"
          description: "Есть ли санкция для исполнителя. Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "provider_penalty_formula"
          type: "string"
          presentation: "fact"
          label: "Санкция исполнителя"
          description: >
            Формула санкции для исполнителя. Fallback: "Не установлено" / "Не удалось определить".
          required: false
          display_in_grid: true
          display_priority: 1

        - name: "client_penalty_present"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values:
            - "defined"
            - "not_defined"
          description: "Есть ли санкция для заказчика. Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "client_penalty_formula"
          type: "string"
          presentation: "fact"
          label: "Санкция заказчика"
          description: >
            Формула санкции для заказчика. Fallback: "Не установлено" / "Не удалось определить".
          required: false
          display_in_grid: true
          display_priority: 2

        - name: "liability_cap_present"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values:
            - "defined"
            - "not_defined"
          description: "Есть ли лимит ответственности. Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "liability_cap_description"
          type: "string"
          presentation: "fact"
          label: "Лимит ответственности"
          description: >
            Описание лимита ответственности. Fallback: "Не установлено" / "Не удалось определить".
          required: false
          display_in_grid: true
          display_priority: 3

        - name: "indirect_damages_excluded"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values:
            - "defined"
            - "not_defined"
          description: "Исключены ли косвенные убытки / упущенная выгода. Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "professional_liability_insurance_defined"
          type: "string"
          presentation: "signal"
          risk_weight: "low"
          allowed_values:
            - "defined"
            - "not_defined"
          description: "Есть ли требование о страховании профессиональной ответственности. Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "professional_liability_insurance_summary"
          type: "string"
          presentation: "fact"
          label: "Страхование ответственности"
          description: >
            Краткое описание страхования профессиональной ответственности. Fallback: "Не установлено" / "Не удалось определить".
          required: false
          display_in_grid: true
          display_priority: 4
      store_payload: true

  - id: quality_standards_warranty
    name: "Стандарты качества и гарантии исполнения (ст. 721, 723, 783 ГК РФ)"
    description: >
      Фактографическая проверка наличия в договоре стандартов качества услуг,
      гарантийных обязательств, порядка предъявления претензий и сроков
      устранения недостатков. Результат предназначен для табличного сравнения
      нескольких договоров.
    triggers:
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "стандарты качества"
        - "требования к качеству"
        - "гарантийные обязательства"
        - "устранение недостатков"
        - "претензия"
        - "срок устранения"
        - "дефект"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)стандарт(ы|ов)\\s+качеств"
        - "(?i)устранени(е|я)\\s+недостатк"
        - "(?i)гарантийн(ый|ого)\\s+срок"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор возмездного оказания услуг.
        Проверяется только один вопрос: стандарты качества услуг, гарантия,
        претензионный порядок по недостаткам и сроки их устранения.

        Нормативный ориентир:
        - ст. 721 ГК РФ — качество результата
        - ст. 723 ГК РФ — последствия недостатков
        - ст. 783 ГК РФ — применение правил к услугам

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора, а чего прямо нет.
        - Не оценивай серьёзность риска.
        - Юрист будет использовать результат в сравнительной таблице.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Определены ли стандарты качества.
        2. Как описаны стандарты качества.
        3. Указан ли гарантийный срок.
        4. Какой гарантийный срок указан.
        5. Предусмотрен ли порядок претензий по недостаткам.
        6. Указан ли срок устранения недостатков.
        7. Какой срок устранения недостатков указан.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Если условие не указано прямо:
           - для статусных полей (*_status, *_defined) возвращай "not_defined";
           - для текстовых полей (*_value) возвращай "Не установлено".
        4. Строго запрещено использовать "None", "null", "not_defined" (в текстовых полях) или пустые строки "".
        5. Если стандарты качества определяются по Техническому заданию, спецификации, приложению или иному документу — укажи это в quality_standards_value (например, "Определяются по Техническому заданию (Приложение № 1)").
        6. Не путай срок исправления дефектов со сроком ответа на претензию по оплате.
        7. В evidence включай только точный текст договора.
        8. Верни только один валидный JSON-объект, содержащий все указанные ключи.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — все условия есть:
        Фрагмент:
        "Услуги должны соответствовать требованиям Технического задания и
        профессиональным стандартам. Исполнитель устраняет выявленные
        недостатки в течение 10 рабочих дней с даты получения претензии.
        Гарантийный срок на результат услуг составляет 3 месяца."

        Ответ:
        {
          "quality_standards_status": "defined",
          "quality_standards_value": "требования Технического задания и профессиональные стандарты",
          "warranty_period_status": "defined",
          "warranty_period_value": "3 месяца",
          "complaint_procedure_defined": "defined",
          "defect_remedy_period_status": "defined",
          "defect_remedy_period_value": "10 рабочих дней",
          "evidence": [
            {
              "clause_ref": "п. 5.1",
              "quote": "Услуги должны соответствовать требованиям Технического задания и профессиональным стандартам. Исполнитель устраняет выявленные недостатки в течение 10 рабочих дней с даты получения претензии. Гарантийный срок на результат услуг составляет 3 месяца."
            }
          ]
        }

        Пример 2 — только гарантия:
        Фрагмент:
        "Гарантийный срок на результат услуг составляет 6 месяцев с даты подписания акта."

        Ответ:
        {
          "quality_standards_status": "not_defined",
          "quality_standards_value": "Не установлено",
          "warranty_period_status": "defined",
          "warranty_period_value": "6 месяцев с даты подписания акта",
          "complaint_procedure_defined": "not_defined",
          "defect_remedy_period_status": "not_defined",
          "defect_remedy_period_value": "Не установлено",
          "evidence": [
            {
              "clause_ref": "п. 6.2",
              "quote": "Гарантийный срок на результат услуг составляет 6 месяцев с даты подписания акта."
            }
          ]
        }

        Пример 3 — стандарты определяются по приложению:
        Фрагмент:
        "Качество услуг должно соответствовать требованиям, указанным в Спецификации (Приложение № 2)."

        Ответ:
        {
          "quality_standards_status": "defined",
          "quality_standards_value": "Определяются по Спецификации (Приложение № 2)",
          "warranty_period_status": "not_defined",
          "warranty_period_value": "Не установлено",
          "complaint_procedure_defined": "not_defined",
          "defect_remedy_period_status": "not_defined",
          "defect_remedy_period_value": "Не установлено",
          "evidence": [
            {
              "clause_ref": "п. 4.3",
              "quote": "Качество услуг должно соответствовать требованиям, указанным в Спецификации (Приложение № 2)."
            }
          ]
        }

        Пример 4 — данные отсутствуют:
        Фрагмент:
        "Услуги оказываются качественно."

        Ответ:
        {
          "quality_standards_status": "not_defined",
          "quality_standards_value": "Не установлено",
          "warranty_period_status": "not_defined",
          "warranty_period_value": "Не установлено",
          "complaint_procedure_defined": "not_defined",
          "defect_remedy_period_status": "not_defined",
          "defect_remedy_period_value": "Не установлено",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Есть ли прямое указание на стандарты качества.
        2. Есть ли прямое указание на гарантийный срок.
        3. Есть ли прямое указание на претензию по недостаткам.
        4. Есть ли прямое указание на срок устранения недостатков.
        5. Если стандарты определяются по приложению/ТЗ/спецификации — это не "Не установлено", а "Определяются по ...".
        6. Если прямой цитаты нет — верни "not_defined" для статусов и "Не установлено" для текста. Не додумывай условия.

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        {
          "quality_standards_status": "<defined / not_defined>",
          "quality_standards_value": "<текст / 'Определяются по ...' / 'Не установлено'>",
          "warranty_period_status": "<defined / not_defined>",
          "warranty_period_value": "<текст или 'Не установлено'>",
          "complaint_procedure_defined": "<defined / not_defined>",
          "defect_remedy_period_status": "<defined / not_defined>",
          "defect_remedy_period_value": "<текст или 'Не установлено'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 5
      temperature: 0.0
      max_tokens: 650

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "стандарты качества гарантийный срок недостатки претензия устранение недостатков срок устранения спецификация приложение"
      retrieval_profile: "warranties_check"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - technical_fragment
        - structural_anchor
      preferred_clause_functions:
        - obligations
      negative_keywords:
        - "оплата"
        - "неустойка"
        - "форс-мажор"
      position_bias:
        preferred_range: [0.25, 0.75]
        boost: 0.16
        scope: segment
      context_k: 5
      max_chunks: 7
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "price_list"
      preferred_clause_functions:
        - obligations
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 650

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 800

      compact_output: false

      presence_signal:
        field: "quality_standards_warranty_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора стандарты качества,
        гарантийный срок, порядок претензий и срок устранения недостатков.
        Не анализируй цену, санкции, форс-мажор или споры.
        Не оценивай риски. Анализируй только текст договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. quality_standards_warranty_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (quality_standards_status, warranty_period_status,
              complaint_procedure_defined, defect_remedy_period_status)
             ≠ "not_defined";
           - "missing" — если все четыре содержательных поля = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - quality_standards_status = "not_defined";
           - warranty_period_status = "not_defined";
           - complaint_procedure_defined = "not_defined";
           - defect_remedy_period_status = "not_defined";
           - quality_standards_value = "Не установлено";
           - warranty_period_value = "Не установлено";
           - defect_remedy_period_value = "Не установлено";
           - не выполняй остальные шаги.

        1. quality_standards_status:
           - "defined" — если в тексте прямо указаны стандарты качества,
             требования к качеству, или прямо сказано, что качество
             определяется по ТЗ, спецификации, приложению, ГОСТ, SLA, KPI
             или иному названному документу;
           - "not_defined" — если стандарты качества прямо не определены.

        2. quality_standards_value:
           Краткое user-facing описание стандартов на русском языке.
           - Если стандарты указаны прямо — укажи формулировку, например:
             "требования Технического задания и профессиональные стандарты".
           - Если определяются по документу — укажи: "Определяются по Спецификации (Приложение № 2)".
           - Если данных нет — "Не установлено".
           - Если данные противоречивы — "Не удалось определить".

        3. warranty_period_status:
           - "defined" — если в тексте прямо указан гарантийный срок
             на результат услуг;
           - "not_defined" — если гарантийный срок прямо не указан.

        4. warranty_period_value:
           Гарантийный срок на русском языке, например: "3 месяца",
           "6 месяцев с даты подписания акта".
           Если данных нет — "Не установлено".
           Если данные противоречивы — "Не удалось определить".

        5. complaint_procedure_defined:
           - "defined" — если в тексте прямо описан порядок предъявления
             претензий по недостаткам услуг (сроки, форма, адресат);
           - "not_defined" — если порядок претензий прямо не описан.

        6. defect_remedy_period_status:
           - "defined" — если в тексте прямо указан срок устранения
             недостатков (например, "в течение 10 рабочих дней");
           - "not_defined" — если срок устранения прямо не указан.

        7. defect_remedy_period_value:
           Срок устранения недостатков на русском языке, например:
           "10 рабочих дней с даты получения претензии".
           Если данных нет — "Не установлено".
           Если данные противоречивы — "Не удалось определить".
        </task>

        <context_rules>
        - Перед остальными полями заполни quality_standards_warranty_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status / *_defined = "not_defined", все *_value = "Не установлено".
        - Используй только релевантные фрагменты контекста.
        - Не подставляй нормы закона, обычную практику или предположения вместо текста договора.
        - Не извлекай сведения о цене, санкциях, форс-мажоре, спорах и иных нерелевантных темах.
        - Если стандарты определяются по ТЗ, спецификации, приложению или иному названному документу и это прямо видно из текста, считай стандарты определёнными.
        - Не путай срок исправления дефектов со сроком ответа на претензию по оплате.
        - Если в разных фрагментах указаны разные сроки и конфликт нельзя разрешить по тексту: статус → "not_defined", текстовое поле → "Не удалось определить".
        - Не используй пустые строки.
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни стандартов качества, ни гарантии, ни претензий,
           ни сроков устранения.
           → presence = "missing";
             все *_status / *_defined = "not_defined";
             все *_value = "Не установлено".

        2. Стандарты определяются по внешнему документу.
           "Качество услуг должно соответствовать требованиям Спецификации
           (Приложение № 2)" без гарантии и претензий.
           → presence = "present";
             quality_standards_status = "defined";
             quality_standards_value = "Определяются по Спецификации (Приложение № 2)";
             warranty_period_status = "not_defined".

        3. Противоречие между фрагментами.
           В одной части — гарантийный срок 3 месяца, в другой — 6 месяцев.
           → presence = "unclear";
             warranty_period_status = "not_defined";
             warranty_period_value = "Не удалось определить".

        4. Общая фраза без конкретики.
           "Услуги оказываются качественно и в срок" без конкретных
           стандартов, гарантии или сроков устранения.
           → presence = "present";
             quality_standards_status = "not_defined";
             quality_standards_value = "Не установлено".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для quality_standards_warranty_presence используй только: "present", "missing", "unclear".
        - Для status-полей используй только: "defined", "not_defined".
        - Fallback при отсутствии данных:
          * quality_standards_value → "Не установлено";
          * warranty_period_value → "Не установлено";
          * defect_remedy_period_value → "Не установлено".
        - Fallback при противоречии или неоднозначности:
          * все *_value → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "quality_standards_warranty_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования по качеству/гарантии/претензиям. Внутреннее агрегатное signal-поле."
          required: true

        - name: "quality_standards_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values:
            - "defined"
            - "not_defined"
          description: "Статус определения стандартов качества. Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "quality_standards_value"
          type: "string"
          presentation: "fact"
          label: "Стандарты качества"
          description: >
            Описание стандартов качества услуг. Fallback: "Не установлено" / "Не удалось определить".
          required: false
          display_in_grid: true
          display_priority: 1

        - name: "warranty_period_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values:
            - "defined"
            - "not_defined"
          description: "Статус указания гарантийного срока. Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "warranty_period_value"
          type: "string"
          presentation: "fact"
          label: "Гарантийный срок"
          description: >
            Гарантийный срок на результат услуг. Fallback: "Не установлено" / "Не удалось определить".
          required: false
          display_in_grid: true
          display_priority: 2

        - name: "complaint_procedure_defined"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values:
            - "defined"
            - "not_defined"
          description: "Определен ли порядок предъявления претензий по недостаткам. Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "defect_remedy_period_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values:
            - "defined"
            - "not_defined"
          description: "Статус указания срока устранения недостатков. Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "defect_remedy_period_value"
          type: "string"
          presentation: "fact"
          label: "Срок устранения недостатков"
          description: >
            Срок устранения недостатков услуг. Fallback: "Не установлено" / "Не удалось определить".
          required: false
          display_in_grid: true
          display_priority: 3
      store_payload: true

  - id: termination_and_refusal
    name: "Расторжение и односторонний отказ (ст. 782 ГК РФ)"
    description: >
      Фактографическая проверка наличия в договоре условий одностороннего
      отказа, его стоимости, расчетов при прекращении и возврата данных /
      материалов после расторжения. Результат предназначен для табличного
      сравнения нескольких договоров.
    triggers:
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "расторжение"
        - "односторонний отказ"
        - "отказ от исполнения"
        - "фактически понесённые расходы"
        - "возмещение убытков"
        - "штраф за расторжение"
        - "возврат данных"
        - "удаление данных"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)расторж(ение|ении)"
        - "(?i)односторонн(ий|его)\\s+отказ"
        - "(?i)фактически\\s+понес(е|ё)нн(ые|ых)\\s+расход"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор возмездного оказания услуг.
        Проверяется только один вопрос: расторжение и односторонний отказ,
        расчеты при прекращении и возврат данных / материалов после прекращения.

        Нормативный ориентир:
        - ст. 782 ГК РФ — односторонний отказ от договора услуг
        - общие положения о прекращении обязательств

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора, а чего прямо нет.
        - Не оценивай серьёзность риска.
        - Юрист будет использовать результат в сравнительной таблице.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Как урегулировано право заказчика на отказ.
        2. Какова стоимость отказа для заказчика.
        3. Как урегулировано право исполнителя на отказ.
        4. Какова стоимость отказа для исполнителя.
        5. Есть ли exit fee / штраф за расторжение.
        6. Определён ли порядок взаиморасчетов при прекращении.
        7. Определён ли возврат / удаление данных и материалов.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Если условие не указано прямо:
           - для статусных полей (*_present, *_defined) возвращай "not_defined";
           - для enum-полей (*_right, *_cost) возвращай "not_defined".
        4. Строго запрещено использовать "None", "null", "not_defined" (в текстовых полях) или пустые строки "".
        5. refusal_terms_summary:
           - Сформируй краткое user-friendly описание условий отказа для обеих сторон.
           - Пример: "Заказчик: statutory + фактически понесённые расходы; Исполнитель: statutory + полное возмещение убытков".
           - Если условия не определены — "Не установлено".
        6. exit_fee_display:
           - Если exit_fee_present = "defined" — "Да" (или укажи размер, если есть).
           - Если "not_defined" — "Нет".
        7. termination_settlement_display:
           - Если termination_settlement_defined = "defined" — "Да".
           - Если "not_defined" — "Не определено".
        8. data_return_display:
           - Если data_return_or_deletion_defined = "defined" — "Да" (или укажи детали, если есть).
           - Если "not_defined" — "Не определено".
        9. Не путай обычное прекращение срока договора с правом на односторонний отказ.
        10. В evidence включай только точный текст договора.
        11. Верни только один валидный JSON-объект, содержащий все указанные ключи.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — условия определены:
        Фрагмент:
        "Заказчик вправе отказаться от договора при оплате фактически понесенных
        расходов Исполнителя. Исполнитель вправе отказаться от договора при
        полном возмещении убытков Заказчика. При прекращении договора стороны
        производят взаиморасчеты за фактически оказанные услуги. Исполнитель
        обязан вернуть материалы Заказчика и удалить его данные в течение 5 дней."

        Ответ:
        {
          "client_refusal_right": "statutory",
          "client_refusal_cost": "actual_expenses",
          "provider_refusal_right": "statutory",
          "provider_refusal_cost": "full_damages",
          "refusal_terms_summary": "Заказчик: statutory + фактически понесённые расходы; Исполнитель: statutory + полное возмещение убытков",
          "exit_fee_present": "not_defined",
          "exit_fee_display": "Нет",
          "termination_settlement_defined": "defined",
          "termination_settlement_display": "Да",
          "data_return_or_deletion_defined": "defined",
          "data_return_display": "Да (возврат материалов + удаление данных в течение 5 дней)",
          "evidence": [
            {
              "clause_ref": "п. 9.1",
              "quote": "Заказчик вправе отказаться от договора при оплате фактически понесенных расходов Исполнителя. Исполнитель вправе отказаться от договора при полном возмещении убытков Заказчика. При прекращении договора стороны производят взаиморасчеты за фактически оказанные услуги. Исполнитель обязан вернуть материалы Заказчика и удалить его данные в течение 5 дней."
            }
          ]
        }

        Пример 2 — restricted режим + exit fee:
        Фрагмент:
        "Заказчик вправе отказаться от договора только с письменного согласия
        Исполнителя и при уплате штрафа в размере 10% от цены договора.
        Исполнитель не вправе отказаться от договора до полного исполнения обязательств."

        Ответ:
        {
          "client_refusal_right": "restricted",
          "client_refusal_cost": "penalty",
          "provider_refusal_right": "restricted",
          "provider_refusal_cost": "not_defined",
          "refusal_terms_summary": "Заказчик: restricted + штраф 10% от цены; Исполнитель: restricted (не вправе отказаться)",
          "exit_fee_present": "defined",
          "exit_fee_display": "Да (10% от цены договора)",
          "termination_settlement_defined": "not_defined",
          "termination_settlement_display": "Не определено",
          "data_return_or_deletion_defined": "not_defined",
          "data_return_display": "Не определено",
          "evidence": [
            {
              "clause_ref": "п. 10.2",
              "quote": "Заказчик вправе отказаться от договора только с письменного согласия Исполнителя и при уплате штрафа в размере 10% от цены договора. Исполнитель не вправе отказаться от договора до полного исполнения обязательств."
            }
          ]
        }

        Пример 3 — данные отсутствуют:
        Фрагмент:
        "Договор действует до полного исполнения обязательств."

        Ответ:
        {
          "client_refusal_right": "not_defined",
          "client_refusal_cost": "not_defined",
          "provider_refusal_right": "not_defined",
          "provider_refusal_cost": "not_defined",
          "refusal_terms_summary": "Не установлено",
          "exit_fee_present": "not_defined",
          "exit_fee_display": "Нет",
          "termination_settlement_defined": "not_defined",
          "termination_settlement_display": "Не определено",
          "data_return_or_deletion_defined": "not_defined",
          "data_return_display": "Не определено",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Есть ли прямое указание на отказ заказчика.
        2. Есть ли прямое указание на отказ исполнителя.
        3. Есть ли прямое указание на расчеты при прекращении.
        4. Есть ли прямое указание на возврат или удаление данных / материалов.
        5. Если прямой цитаты нет — верни "not_defined" для статусов и enum. Не додумывай условия.

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        {
          "client_refusal_right": "<statutory / modified / restricted / not_defined>",
          "client_refusal_cost": "<actual_expenses / penalty / full_price / not_defined>",
          "provider_refusal_right": "<statutory / modified / restricted / not_defined>",
          "provider_refusal_cost": "<full_damages / limited / not_defined>",
          "refusal_terms_summary": "<краткое user-friendly описание или 'Не установлено'>",
          "exit_fee_present": "<defined / not_defined>",
          "exit_fee_display": "<Да / Да (размер) / Нет>",
          "termination_settlement_defined": "<defined / not_defined>",
          "termination_settlement_display": "<Да / Не определено>",
          "data_return_or_deletion_defined": "<defined / not_defined>",
          "data_return_display": "<Да / Да (детали) / Не определено>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 5
      temperature: 0.0
      max_tokens: 700

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "расторжение односторонний отказ отказ от исполнения фактически понесенные расходы убытки взаиморасчеты возврат данных удаление данных exit fee штраф за расторжение"
      retrieval_profile: "termination_check"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - technical_fragment
        - structural_anchor
      preferred_clause_functions:
        - obligations
      negative_keywords:
        - "форс-мажор"
        - "конфиденциальность"
        - "неустойка"
      position_bias:
        preferred_range: [0.55, 1.0]
        boost: 0.20
        scope: segment
      context_k: 5
      max_chunks: 8
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
      preferred_clause_functions:
        - obligations
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 650

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 750

      compact_output: false

      presence_signal:
        field: "termination_and_refusal_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора условия расторжения,
        одностороннего отказа, взаиморасчетов при прекращении и возврата данных.
        Не анализируй цену, санкции, форс-мажор или споры.
        Не оценивай риски. Анализируй только текст договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. termination_and_refusal_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (client_refusal_right, provider_refusal_right,
              exit_fee_present, termination_settlement_defined,
              data_return_or_deletion_defined) ≠ "not_defined";
           - "missing" — если все пять содержательных полей = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - client_refusal_right = "not_defined";
           - client_refusal_cost = "not_defined";
           - provider_refusal_right = "not_defined";
           - provider_refusal_cost = "not_defined";
           - exit_fee_present = "not_defined";
           - termination_settlement_defined = "not_defined";
           - data_return_or_deletion_defined = "not_defined";
           - refusal_terms_summary = "Не установлено";
           - exit_fee_display = "Нет";
           - termination_settlement_display = "Не определено";
           - data_return_display = "Не определено";
           - не выполняй остальные шаги.

        1. client_refusal_right:
           Режим права Заказчика на односторонний отказ. Используй только:
           - "statutory" — право повторяет закон (ст. 782 ГК РФ): свободный
             отказ при оплате фактически понесённых расходов;
           - "modified" — право изменено договором (расширено или сужено,
             но не заблокировано);
           - "restricted" — право существенно ограничено (например, только
             с согласия Исполнителя, или запрещено до определённого момента);
           - "not_defined" — право на отказ прямо не урегулировано.

        2. client_refusal_cost:
           Стоимость отказа для Заказчика. Используй только:
           - "actual_expenses" — фактически понесённые расходы;
           - "penalty" — штраф / плата за выход (exit fee);
           - "full_price" — полная цена договора;
           - "not_defined" — стоимость прямо не определена.

        3. provider_refusal_right:
           Режим права Исполнителя на односторонний отказ. Те же значения,
           что и client_refusal_right.

        4. provider_refusal_cost:
           Стоимость отказа для Исполнителя. Используй только:
           - "full_damages" — полное возмещение убытков Заказчика;
           - "limited" — ограниченное возмещение;
           - "not_defined" — стоимость прямо не определена.

        5. refusal_terms_summary:
           Краткое user-friendly описание условий отказа для обеих сторон.
           Формат: "Заказчик: [right] + [cost]; Исполнитель: [right] + [cost]".
           Маппинг: statutory → "по закону", modified → "изменено",
           restricted → "ограничено", actual_expenses → "фактически понесённые расходы",
           penalty → "штраф", full_price → "полная цена",
           full_damages → "полное возмещение убытков", limited → "ограниченное возмещение".
           Если данных нет — "Не установлено".
           Если данные противоречивы — "Не удалось определить".

        6. exit_fee_present:
           - "defined" — если прямо предусмотрен штраф или плата за расторжение
             (exit fee) сверх фактически понесённых расходов;
           - "not_defined" — если exit fee прямо не предусмотрен.

        7. exit_fee_display:
           User-friendly описание:
           - "Да (размер)" — если exit_fee_present = "defined" и указан размер;
           - "Да" — если exit_fee_present = "defined", но размер не указан;
           - "Нет" — если exit_fee_present = "not_defined".

        8. termination_settlement_defined:
           - "defined" — если прямо описан порядок взаиморасчётов при
             прекращении договора (оплата фактически оказанных услуг,
             возврат аванса и т.п.);
           - "not_defined" — если порядок прямо не описан.

        9. termination_settlement_display:
           - "Да" — если termination_settlement_defined = "defined";
           - "Не определено" — если "not_defined".

        10. data_return_or_deletion_defined:
            - "defined" — если прямо описан возврат / удаление данных,
              материалов, документов после прекращения договора;
            - "not_defined" — если возврат / удаление прямо не описаны.

        11. data_return_display:
            - "Да (детали)" — если data_return_or_deletion_defined = "defined"
              и есть конкретика (сроки, объём);
            - "Да" — если "defined", но без деталей;
            - "Не определено" — если "not_defined".
        </task>

        <context_rules>
        - Перед остальными полями заполни termination_and_refusal_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_right / *_cost / *_present / *_defined = "not_defined", все display / summary = соответствующий fallback.
        - Используй только релевантные фрагменты контекста.
        - Не подставляй нормы закона, обычную практику или предположения вместо текста договора.
        - Не извлекай сведения о цене, санкциях за просрочку, форс-мажоре, спорах и иных нерелевантных темах.
        - Не путай обычное прекращение срока договора с правом на односторонний отказ.
        - Если в тексте прямо указано, что сторона «не вправе отказаться» — это "restricted", не "not_defined".
        - Если в разных фрагментах указаны разные условия и конфликт нельзя разрешить по тексту: enum → "not_defined", текстовое поле → "Не удалось определить".
        - Не используй пустые строки.
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни одностороннего отказа, ни exit fee,
           ни взаиморасчётов, ни возврата данных.
           → presence = "missing";
             все *_right / *_cost / *_present / *_defined = "not_defined";
             все display / summary = соответствующий fallback.

        2. Только statutory право без дополнительных условий.
           "Каждая из сторон вправе отказаться от исполнения договора,
           предупредив другую сторону за 30 дней" без стоимости, exit fee
           и взаиморасчётов.
           → presence = "present";
             client_refusal_right = "statutory";
             provider_refusal_right = "statutory";
             client_refusal_cost = "not_defined";
             exit_fee_present = "not_defined";
             termination_settlement_defined = "not_defined".

        3. Противоречие между фрагментами.
           В одной части — отказ свободный, в другой — только с согласия.
           → presence = "unclear";
             client_refusal_right = "not_defined";
             refusal_terms_summary = "Не удалось определить".

        4. Restricted + exit fee.
           "Заказчик вправе отказаться только с письменного согласия
           Исполнителя и при уплате штрафа 10% от цены договора."
           → presence = "present";
             client_refusal_right = "restricted";
             client_refusal_cost = "penalty";
             exit_fee_present = "defined";
             exit_fee_display = "Да (10% от цены договора)".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для termination_and_refusal_presence используй только: "present", "missing", "unclear".
        - Для *_right используй только: "statutory", "modified", "restricted", "not_defined".
        - Для client_refusal_cost используй только: "actual_expenses", "penalty", "full_price", "not_defined".
        - Для provider_refusal_cost используй только: "full_damages", "limited", "not_defined".
        - Для status-полей (*_present, *_defined) используй только: "defined", "not_defined".
        - Fallback при отсутствии данных:
          * refusal_terms_summary → "Не установлено";
          * exit_fee_display → "Нет";
          * termination_settlement_display → "Не определено";
          * data_return_display → "Не определено".
        - Fallback при противоречии или неоднозначности:
          * все текстовые / display поля → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "termination_and_refusal_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования по расторжению/отказу. Внутреннее агрегатное signal-поле."
          required: true

        - name: "client_refusal_right"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values:
            - "statutory"
            - "modified"
            - "restricted"
            - "not_defined"
          description: "Режим права заказчика на отказ. Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "client_refusal_cost"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values:
            - "actual_expenses"
            - "penalty"
            - "full_price"
            - "not_defined"
          description: "Стоимость отказа для заказчика. Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "provider_refusal_right"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values:
            - "statutory"
            - "modified"
            - "restricted"
            - "not_defined"
          description: "Режим права исполнителя на отказ. Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "provider_refusal_cost"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values:
            - "full_damages"
            - "limited"
            - "not_defined"
          description: "Стоимость отказа для исполнителя. Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "refusal_terms_summary"
          type: "string"
          presentation: "fact"
          label: "Условия одностороннего отказа"
          description: >
            User-friendly описание условий отказа для обеих сторон. Fallback: "Не установлено" / "Не удалось определить".
          required: true
          display_in_grid: true
          display_priority: 1

        - name: "exit_fee_present"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values:
            - "defined"
            - "not_defined"
          description: "Предусмотрен ли штраф / плата за расторжение. Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "exit_fee_display"
          type: "string"
          presentation: "fact"
          label: "Exit fee"
          description: >
            User-friendly описание наличия exit fee. Fallback: "Не установлено" / "Не удалось определить".
          required: true
          display_in_grid: true
          display_priority: 2

        - name: "termination_settlement_defined"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values:
            - "defined"
            - "not_defined"
          description: "Определены ли взаиморасчеты при прекращении. Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "termination_settlement_display"
          type: "string"
          presentation: "fact"
          label: "Взаиморасчёты при прекращении"
          description: >
            User-friendly описание взаиморасчетов при прекращении. Fallback: "Не установлено" / "Не удалось определить".
          required: true
          display_in_grid: true
          display_priority: 3

        - name: "data_return_or_deletion_defined"
          type: "string"
          presentation: "signal"
          risk_weight: "low"
          allowed_values:
            - "defined"
            - "not_defined"
          description: "Определен ли возврат / удаление данных и материалов. Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "data_return_display"
          type: "string"
          presentation: "fact"
          label: "Возврат / удаление данных"
          description: >
            User-friendly описание возврата / удаления данных. Fallback: "Не установлено" / "Не удалось определить".
          required: true
          display_in_grid: true
          display_priority: 4
      store_payload: true

  - id: personal_performance_subcontracting
    name: "Личное исполнение и право привлечения третьих лиц (ст. 780 ГК РФ)"
    description: >
      Фактографическая проверка наличия в договоре условия о личном исполнении,
      допустимости привлечения третьих лиц, необходимости согласия заказчика
      и сохранения ответственности исполнителя. Результат предназначен для
      табличного сравнения нескольких договоров.
    triggers:
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "лично"
        - "личное исполнение"
        - "привлечение третьих лиц"
        - "субисполнитель"
        - "соисполнитель"
        - "своими силами"
        - "вправе привлекать"
        - "с согласия заказчика"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)исполнитель.*оказывает.*услуги.*лично"
        - "(?i)вправе.*привлек(ать|ать).*третьих\\s+лиц"
        - "(?i)без\\s+права\\s+привлечени"
        - "(?i)с\\s+согласия\\s+заказчик"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор возмездного оказания услуг.
        Проверяется только один вопрос: должен ли исполнитель оказывать услуги лично,
        можно ли привлекать третьих лиц, нужно ли согласие заказчика и сохраняет ли
        исполнитель ответственность за действия привлечённых лиц.

        Нормативный ориентир:
        - ст. 780 ГК РФ — личное оказание услуг
        - общие положения об исполнении обязательств третьими лицами

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора, а чего прямо нет.
        - Не оценивай серьёзность риска.
        - Юрист будет использовать результат в сравнительной таблице.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Требуется ли личное исполнение.
        2. Допускается ли привлечение третьих лиц.
        3. Требуется ли согласие заказчика для такого привлечения.
        4. Сохраняет ли исполнитель ответственность за действия третьих лиц.
        5. Требуется ли уведомление / раскрытие информации о привлечённых лицах.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Если условие не указано прямо — возвращай "not_defined" для всех enum-полей.
        4. Строго запрещено использовать "None", "null" или пустые строки "".
        5. personal_performance_required_display:
           - Если personal_performance_required = "yes" — "Да, личное исполнение требуется".
           - Если "no" — "Нет, личное исполнение не требуется".
           - Если "not_defined" — "Не определено".
        6. subcontracting_allowed_display:
           - Если subcontracting_allowed = "yes_without_consent" — "Да, без согласия заказчика".
           - Если "yes_with_consent" — "Да, с согласия заказчика".
           - Если "prohibited" — "Запрещено".
           - Если "not_defined" — "Не определено".
        7. provider_remains_liable_display:
           - Если provider_remains_liable = "yes" — "Да, сохраняет ответственность".
           - Если "no" — "Нет, не сохраняет".
           - Если "not_defined" — "Не определено".
        8. Не путай право привлекать сотрудников исполнителя с правом привлекать внешних третьих лиц.
        9. В evidence включай только точный текст договора.
        10. Верни только один валидный JSON-объект, содержащий все указанные ключи.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — привлечение допускается с согласия:
        Фрагмент:
        "Исполнитель оказывает услуги лично, однако вправе привлекать третьих лиц
        только с предварительного письменного согласия Заказчика. Исполнитель
        несет полную ответственность за действия привлеченных лиц."

        Ответ:
        {
          "personal_performance_required": "yes",
          "personal_performance_required_display": "Да, личное исполнение требуется",
          "subcontracting_allowed": "yes_with_consent",
          "subcontracting_allowed_display": "Да, с согласия заказчика",
          "provider_remains_liable": "yes",
          "provider_remains_liable_display": "Да, сохраняет ответственность",
          "subcontractor_disclosure_required": "defined",
          "evidence": [
            {
              "clause_ref": "п. 2.3",
              "quote": "Исполнитель оказывает услуги лично, однако вправе привлекать третьих лиц только с предварительного письменного согласия Заказчика. Исполнитель несет полную ответственность за действия привлеченных лиц."
            }
          ]
        }

        Пример 2 — привлечение запрещено:
        Фрагмент:
        "Исполнитель обязан оказать услуги лично. Привлечение третьих лиц, субисполнителей
        или соисполнителей не допускается."

        Ответ:
        {
          "personal_performance_required": "yes",
          "personal_performance_required_display": "Да, личное исполнение требуется",
          "subcontracting_allowed": "prohibited",
          "subcontracting_allowed_display": "Запрещено",
          "provider_remains_liable": "not_defined",
          "provider_remains_liable_display": "Не определено",
          "subcontractor_disclosure_required": "not_defined",
          "evidence": [
            {
              "clause_ref": "п. 3.1",
              "quote": "Исполнитель обязан оказать услуги лично. Привлечение третьих лиц, субисполнителей или соисполнителей не допускается."
            }
          ]
        }

        Пример 3 — привлечение допускается без согласия:
        Фрагмент:
        "Исполнитель вправе привлекать третьих лиц для оказания услуг без предварительного
        согласования с Заказчиком. Исполнитель несет ответственность за действия привлеченных
        третьих лиц как за свои собственные."

        Ответ:
        {
          "personal_performance_required": "no",
          "personal_performance_required_display": "Нет, личное исполнение не требуется",
          "subcontracting_allowed": "yes_without_consent",
          "subcontracting_allowed_display": "Да, без согласия заказчика",
          "provider_remains_liable": "yes",
          "provider_remains_liable_display": "Да, сохраняет ответственность",
          "subcontractor_disclosure_required": "not_defined",
          "evidence": [
            {
              "clause_ref": "п. 4.2",
              "quote": "Исполнитель вправе привлекать третьих лиц для оказания услуг без предварительного согласования с Заказчиком. Исполнитель несет ответственность за действия привлеченных третьих лиц как за свои собственные."
            }
          ]
        }

        Пример 4 — данные отсутствуют:
        Фрагмент:
        "Исполнитель оказывает услуги Заказчику."

        Ответ:
        {
          "personal_performance_required": "not_defined",
          "personal_performance_required_display": "Не определено",
          "subcontracting_allowed": "not_defined",
          "subcontracting_allowed_display": "Не определено",
          "provider_remains_liable": "not_defined",
          "provider_remains_liable_display": "Не определено",
          "subcontractor_disclosure_required": "not_defined",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Есть ли прямое указание на личное исполнение.
        2. Есть ли прямое указание на право привлекать третьих лиц.
        3. Есть ли прямое указание на необходимость согласия заказчика.
        4. Есть ли прямое указание на сохранение ответственности исполнителя.
        5. Если прямой цитаты нет — верни "not_defined" для всех enum-полей. Не додумывай условия.

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        {
          "personal_performance_required": "<yes / no / not_defined>",
          "personal_performance_required_display": "<Да, личное исполнение требуется / Нет, личное исполнение не требуется / Не определено>",
          "subcontracting_allowed": "<yes_without_consent / yes_with_consent / prohibited / not_defined>",
          "subcontracting_allowed_display": "<Да, без согласия заказчика / Да, с согласия заказчика / Запрещено / Не определено>",
          "provider_remains_liable": "<yes / no / not_defined>",
          "provider_remains_liable_display": "<Да, сохраняет ответственность / Нет, не сохраняет / Не определено>",
          "subcontractor_disclosure_required": "<defined / not_defined>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 4
      temperature: 0.0
      max_tokens: 620

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "личное исполнение привлечение третьих лиц субисполнитель соисполнитель своими силами с согласия заказчика ответственность за действия третьих лиц"
      retrieval_profile: "subcontracting_check"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
      negative_keywords:
        - "персональные данные"
        - "неустойка"
        - "оплата"
        - "форс-мажор"
      position_bias:
        preferred_range: [0.15, 0.55]
        boost: 0.16
        scope: segment
      context_k: 4
      max_chunks: 6
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - obligations
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 650

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 450

      compact_output: false

      presence_signal:
        field: "personal_performance_subcontracting_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора условия о личном
        исполнении, привлечении третьих лиц, согласии заказчика и ответственности
        исполнителя за действия таких лиц. Не анализируй цену, сроки, споры
        или санкции.
        Не оценивай риски. Анализируй только текст договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. personal_performance_subcontracting_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (personal_performance_required, subcontracting_allowed,
              provider_remains_liable, subcontractor_disclosure_required)
             ≠ "not_defined";
           - "missing" — если все четыре содержательных поля = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - personal_performance_required = "not_defined";
           - subcontracting_allowed = "not_defined";
           - provider_remains_liable = "not_defined";
           - subcontractor_disclosure_required = "not_defined";
           - personal_performance_required_display = "Не определено";
           - subcontracting_allowed_display = "Не определено";
           - provider_remains_liable_display = "Не определено";
           - не выполняй остальные шаги.

        1. personal_performance_required:
           - "yes" — личное исполнение прямо требуется
             (например, "Исполнитель оказывает услуги лично");
           - "no" — прямо указано, что личное исполнение не требуется
             (например, "Исполнитель вправе привлекать третьих лиц");
           - "not_defined" — вопрос прямо не урегулирован.

        2. personal_performance_required_display:
           User-friendly маппинг:
           - yes → "Да, личное исполнение требуется"
           - no → "Нет, личное исполнение не требуется"
           - not_defined → "Не определено"

        3. subcontracting_allowed:
           - "yes_without_consent" — третьи лица допускаются без согласия заказчика;
           - "yes_with_consent" — требуется согласие заказчика;
           - "prohibited" — привлечение третьих лиц прямо запрещено;
           - "not_defined" — вопрос прямо не урегулирован.

        4. subcontracting_allowed_display:
           User-friendly маппинг:
           - yes_without_consent → "Да, без согласия заказчика"
           - yes_with_consent → "Да, с согласия заказчика"
           - prohibited → "Запрещено"
           - not_defined → "Не определено"

        5. provider_remains_liable:
           - "yes" — исполнитель прямо сохраняет ответственность за действия
             привлечённых лиц;
           - "no" — прямо указано, что ответственность не сохраняется;
           - "not_defined" — вопрос прямо не урегулирован.

        6. provider_remains_liable_display:
           User-friendly маппинг:
           - yes → "Да, сохраняет ответственность"
           - no → "Нет, не сохраняет"
           - not_defined → "Не определено"

        7. subcontractor_disclosure_required:
           - "defined" — есть требование уведомления / раскрытия /
             согласования привлечения третьих лиц;
           - "not_defined" — такого требования прямо нет.
        </task>

        <context_rules>
        - Перед остальными полями заполни personal_performance_subcontracting_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все enum-поля = "not_defined", все *_display = "Не определено".
        - Используй только релевантные фрагменты контекста.
        - Не подставляй нормы закона, обычную практику или предположения вместо текста договора.
        - Не извлекай сведения о цене, сроках, спорах, санкциях и иных нерелевантных темах.
        - Не путай право привлекать сотрудников исполнителя (трудовые отношения) с правом привлекать внешних третьих лиц (гражданско-правовые отношения).
        - Если в разных фрагментах указаны разные условия и конфликт нельзя разрешить по тексту: enum → "not_defined", display → "Не определено".
        - Не используй пустые строки.
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни личного исполнения, ни субподряда,
           ни ответственности за третьих лиц.
           → presence = "missing";
             все enum = "not_defined";
             все *_display = "Не определено".

        2. Личное исполнение без субподряда.
           "Исполнитель оказывает услуги лично" без упоминания третьих лиц.
           → presence = "present";
             personal_performance_required = "yes";
             subcontracting_allowed = "not_defined";
             provider_remains_liable = "not_defined".

        3. Противоречие между фрагментами.
           В одной части — личное исполнение, в другой — право привлекать
           третьих лиц без ограничений.
           → presence = "unclear";
             personal_performance_required = "not_defined";
             subcontracting_allowed = "not_defined".

        4. Субподряд с сохранением ответственности.
           "Исполнитель вправе привлекать субисполнителей. Исполнитель несёт
           ответственность за действия субисполнителей как за свои собственные."
           → presence = "present";
             personal_performance_required = "no";
             subcontracting_allowed = "yes_without_consent";
             provider_remains_liable = "yes".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для personal_performance_subcontracting_presence используй только: "present", "missing", "unclear".
        - Для personal_performance_required используй только: "yes", "no", "not_defined".
        - Для subcontracting_allowed используй только: "yes_without_consent", "yes_with_consent", "prohibited", "not_defined".
        - Для provider_remains_liable используй только: "yes", "no", "not_defined".
        - Для subcontractor_disclosure_required используй только: "defined", "not_defined".
        - Fallback при отсутствии данных:
          * все *_display → "Не определено".
        - Fallback при противоречии или неоднозначности:
          * все *_display → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "personal_performance_subcontracting_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования по личному исполнению/субподряду. Внутреннее агрегатное signal-поле."
          required: true

        - name: "personal_performance_required"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values:
            - "yes"
            - "no"
            - "not_defined"
          description: "Требуется ли личное исполнение. Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "personal_performance_required_display"
          type: "string"
          presentation: "fact"
          label: "Личное исполнение"
          description: >
            User-friendly описание требования личного исполнения. Fallback: "Не установлено" / "Не удалось определить".
          required: true
          display_in_grid: true
          display_priority: 1

        - name: "subcontracting_allowed"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values:
            - "yes_without_consent"
            - "yes_with_consent"
            - "prohibited"
            - "not_defined"
          description: "Допустимость привлечения третьих лиц. Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "subcontracting_allowed_display"
          type: "string"
          presentation: "fact"
          label: "Привлечение третьих лиц"
          description: >
            User-friendly описание допустимости привлечения третьих лиц. Fallback: "Не установлено" / "Не удалось определить".
          required: true
          display_in_grid: true
          display_priority: 2

        - name: "provider_remains_liable"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values:
            - "yes"
            - "no"
            - "not_defined"
          description: "Сохраняет ли исполнитель ответственность за действия третьих лиц. Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "provider_remains_liable_display"
          type: "string"
          presentation: "fact"
          label: "Ответственность за третьих лиц"
          description: >
            User-friendly описание сохранения ответственности исполнителя. Fallback: "Не установлено" / "Не удалось определить".
          required: true
          display_in_grid: true
          display_priority: 3

        - name: "subcontractor_disclosure_required"
          type: "string"
          presentation: "signal"
          risk_weight: "low"
          allowed_values:
            - "defined"
            - "not_defined"
          description: "Требуется ли уведомление / согласование привлечения третьих лиц. Внутреннее enum-поле."
          required: true
          display_in_grid: false
      store_payload: true

  - id: ip_rights_on_service_results
    name: "ИП на результаты услуг (ст. 1296, 1297 ГК РФ)"
    description: >
      Фактографическая проверка наличия в договоре условий о правах на
      результаты интеллектуальной деятельности, типе передачи прав, моменте
      перехода прав и описании объектов ИС. Результат предназначен для
      табличного сравнения нескольких договоров.
    triggers:
      any: ["ip_creation_services"]
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "исключительные права"
        - "интеллектуальная собственность"
        - "авторские права"
        - "передача прав"
        - "отчуждение прав"
        - "результаты интеллектуальной деятельности"
        - "лицензия"
        - "право использования"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)исключительн(ые|ое|ых)\\s+прав"
        - "(?i)интеллектуальн(ой|ую|ая)\\s+собственност"
        - "(?i)передач(а|и)\\s+прав"
        - "(?i)право\\s+использовани"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор возмездного оказания услуг, в котором возможно
        создание результатов интеллектуальной деятельности.
        Проверяется только один вопрос: есть ли в договоре условие о правах на
        результат, какой тип передачи прав предусмотрен, когда переходят права
        и описаны ли объекты ИС.

        Нормативный ориентир:
        - ст. 1225 ГК РФ — объекты интеллектуальных прав
        - ст. 1234 ГК РФ — отчуждение исключительного права
        - ст. 1235 ГК РФ — лицензионный договор
        - ст. 1296–1297 ГК РФ — права на результаты по договору

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора, а чего прямо нет.
        - Не оценивай серьёзность риска.
        - Юрист будет использовать результат в сравнительной таблице.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Есть ли IP clause.
        2. Какой тип передачи прав предусмотрен.
        3. В какой момент переходят права.
        4. Перечислены ли объекты ИС.
        5. Как описаны объекты ИС.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Если условие не указано прямо:
           - для статусных полей (*_present, *_listed) возвращай "not_defined";
           - для enum-полей (ip_transfer_type, ip_transfer_moment) возвращай "not_defined";
           - для текстовых полей (ip_objects_description) возвращай "Не установлено".
        4. Строго запрещено использовать "None", "null", "not_defined" (в текстовых полях) или пустые строки "".
        5. ip_transfer_type_display:
           - Если ip_transfer_type = "full_transfer" — "Полное отчуждение исключительного права".
           - Если "license" — "Лицензия (право использования)".
           - Если "retained_by_provider" — "Права остаются у исполнителя".
           - Если "not_defined" — "Не определено".
        6. ip_transfer_moment_display:
           - Если ip_transfer_moment = "upon_payment" — "После полной оплаты".
           - Если "upon_creation" — "С момента создания результата".
           - Если "upon_acceptance" — "После приёмки по акту".
           - Если "upon_signing" — "С момента подписания договора".
           - Если "upon_delivery" — "С момента передачи результата".
           - Если "not_defined" — "Не определено".
        7. Не путай передачу материальных носителей с передачей исключительных прав.
        8. Если объекты ИС определяются по приложению/ТЗ/спецификации — укажи это в ip_objects_description.
        9. В evidence включай только точный текст договора.
        10. Верни только один валидный JSON-объект, содержащий все указанные ключи.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — полное отчуждение после оплаты:
        Фрагмент:
        "Исключительные права на созданные Исполнителем отчеты, дизайн-макеты
        и иные результаты работ переходят к Заказчику в полном объеме с момента
        полной оплаты услуг."

        Ответ:
        {
          "ip_clause_present": "defined",
          "ip_transfer_type": "full_transfer",
          "ip_transfer_type_display": "Полное отчуждение исключительного права",
          "ip_transfer_moment": "upon_payment",
          "ip_transfer_moment_display": "После полной оплаты",
          "ip_objects_listed": "defined",
          "ip_objects_description": "отчеты, дизайн-макеты и иные результаты работ",
          "evidence": [
            {
              "clause_ref": "п. 6.1",
              "quote": "Исключительные права на созданные Исполнителем отчеты, дизайн-макеты и иные результаты работ переходят к Заказчику в полном объеме с момента полной оплаты услуг."
            }
          ]
        }

        Пример 2 — лицензия с момента создания:
        Фрагмент:
        "Исполнитель предоставляет Заказчику неисключительную лицензию на использование
        созданных программ для ЭВМ и баз данных на территории всего мира на весь срок
        действия исключительного права. Права на результаты возникают с момента их создания."

        Ответ:
        {
          "ip_clause_present": "defined",
          "ip_transfer_type": "license",
          "ip_transfer_type_display": "Лицензия (право использования)",
          "ip_transfer_moment": "upon_creation",
          "ip_transfer_moment_display": "С момента создания результата",
          "ip_objects_listed": "defined",
          "ip_objects_description": "программы для ЭВМ и базы данных",
          "evidence": [
            {
              "clause_ref": "п. 7.2",
              "quote": "Исполнитель предоставляет Заказчику неисключительную лицензию на использование созданных программ для ЭВМ и баз данных на территории всего мира на весь срок действия исключительного права. Права на результаты возникают с момента их создания."
            }
          ]
        }

        Пример 3 — права остаются у исполнителя:
        Фрагмент:
        "Все исключительные права на результаты, созданные в процессе оказания услуг,
        принадлежат Исполнителю. Заказчику предоставляется право использования результатов
        исключительно для внутренних целей."

        Ответ:
        {
          "ip_clause_present": "defined",
          "ip_transfer_type": "retained_by_provider",
          "ip_transfer_type_display": "Права остаются у исполнителя",
          "ip_transfer_moment": "not_defined",
          "ip_transfer_moment_display": "Не определено",
          "ip_objects_listed": "not_defined",
          "ip_objects_description": "Не установлено",
          "evidence": [
            {
              "clause_ref": "п. 8.1",
              "quote": "Все исключительные права на результаты, созданные в процессе оказания услуг, принадлежат Исполнителю. Заказчику предоставляется право использования результатов исключительно для внутренних целей."
            }
          ]
        }

        Пример 4 — объекты определяются по приложению:
        Фрагмент:
        "Исключительные права на результаты, перечисленные в Приложении № 4 (Перечень
        объектов ИС), переходят к Заказчику с момента подписания акта приёмки услуг."

        Ответ:
        {
          "ip_clause_present": "defined",
          "ip_transfer_type": "full_transfer",
          "ip_transfer_type_display": "Полное отчуждение исключительного права",
          "ip_transfer_moment": "upon_acceptance",
          "ip_transfer_moment_display": "После приёмки по акту",
          "ip_objects_listed": "defined",
          "ip_objects_description": "Определяются по Приложению № 4 (Перечень объектов ИС)",
          "evidence": [
            {
              "clause_ref": "п. 9.3",
              "quote": "Исключительные права на результаты, перечисленные в Приложении № 4 (Перечень объектов ИС), переходят к Заказчику с момента подписания акта приёмки услуг."
            }
          ]
        }

        Пример 5 — данные отсутствуют:
        Фрагмент:
        "Результаты услуг передаются Заказчику по акту."

        Ответ:
        {
          "ip_clause_present": "not_defined",
          "ip_transfer_type": "not_defined",
          "ip_transfer_type_display": "Не определено",
          "ip_transfer_moment": "not_defined",
          "ip_transfer_moment_display": "Не определено",
          "ip_objects_listed": "not_defined",
          "ip_objects_description": "Не установлено",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Есть ли прямое указание именно на права ИС (не на передачу материальных носителей).
        2. Есть ли прямое указание на тип передачи прав (отчуждение / лицензия / сохранение у исполнителя).
        3. Есть ли прямое указание на момент перехода прав.
        4. Есть ли перечисление объектов ИС или ссылка на приложение/ТЗ.
        5. Если прямой цитаты нет — верни "not_defined" для enum/status и "Не установлено" для текста. Не додумывай условия.

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        {
          "ip_clause_present": "<defined / not_defined>",
          "ip_transfer_type": "<full_transfer / license / retained_by_provider / not_defined>",
          "ip_transfer_type_display": "<Полное отчуждение исключительного права / Лицензия (право использования) / Права остаются у исполнителя / Не определено>",
          "ip_transfer_moment": "<upon_payment / upon_creation / upon_acceptance / upon_signing / upon_delivery / not_defined>",
          "ip_transfer_moment_display": "<После полной оплаты / С момента создания результата / После приёмки по акту / С момента подписания договора / С момента передачи результата / Не определено>",
          "ip_objects_listed": "<defined / not_defined>",
          "ip_objects_description": "<текст / 'Определяются по ...' / 'Не установлено'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 5
      temperature: 0.0
      max_tokens: 650

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "исключительные права интеллектуальная собственность авторские права передача прав отчуждение лицензия право использования результаты интеллектуальной деятельности"
      retrieval_profile: "ip_ownership_check"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - technical_fragment
        - structural_anchor
        - definition
      preferred_clause_functions:
        - obligations
      negative_keywords:
        - "конфиденциальность"
        - "персональные данные"
        - "неустойка"
        - "оплата"
      position_bias:
        preferred_range: [0.35, 0.80]
        boost: 0.16
        scope: segment
      context_k: 5
      max_chunks: 7
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "price_list"
        - "technical_specification"
      preferred_clause_functions:
        - obligations
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 650

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 600

      compact_output: false

      presence_signal:
        field: "ip_rights_on_service_results_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора условия о правах
        на результаты интеллектуальной деятельности, тип передачи прав,
        момент перехода прав и описание объектов ИС. Не анализируй цену,
        санкции, сроки или споры.
        Не оценивай риски. Анализируй только текст договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. ip_rights_on_service_results_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (ip_clause_present, ip_transfer_type, ip_transfer_moment,
              ip_objects_listed) ≠ "not_defined";
           - "missing" — если все четыре содержательных поля = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - ip_clause_present = "not_defined";
           - ip_transfer_type = "not_defined";
           - ip_transfer_moment = "not_defined";
           - ip_objects_listed = "not_defined";
           - ip_transfer_type_display = "Не определено";
           - ip_transfer_moment_display = "Не определено";
           - ip_objects_description = "Не установлено";
           - не выполняй остальные шаги.

        1. ip_clause_present:
           - "defined" — если в тексте есть прямое условие о правах на
             результаты интеллектуальной деятельности (исключительные права,
             авторские права, передача прав, лицензия);
           - "not_defined" — если IP-клаузула прямо отсутствует.
           Важно: не путай передачу материальных носителей с передачей
           исключительных прав.

        2. ip_transfer_type:
           Тип передачи прав. Используй только:
           - "full_transfer" — полное отчуждение исключительного права
             (ст. 1234 ГК РФ);
           - "license" — предоставление права использования (лицензия,
             ст. 1235 ГК РФ);
           - "retained_by_provider" — права остаются у исполнителя,
             заказчику предоставляется только право использования;
           - "not_defined" — IP-клаузула есть, но тип передачи не ясен.

        3. ip_transfer_type_display:
           User-friendly маппинг:
           - full_transfer → "Полное отчуждение исключительного права"
           - license → "Лицензия (право использования)"
           - retained_by_provider → "Права остаются у исполнителя"
           - not_defined → "Не определено"

        4. ip_transfer_moment:
           Момент перехода прав. Используй только:
           - "upon_payment" — после полной оплаты услуг;
           - "upon_creation" — с момента создания результата;
           - "upon_acceptance" — после приёмки по акту;
           - "upon_signing" — с момента подписания договора;
           - "upon_delivery" — с момента передачи результата;
           - "not_defined" — момент не раскрыт.

        5. ip_transfer_moment_display:
           User-friendly маппинг:
           - upon_payment → "После полной оплаты"
           - upon_creation → "С момента создания результата"
           - upon_acceptance → "После приёмки по акту"
           - upon_signing → "С момента подписания договора"
           - upon_delivery → "С момента передачи результата"
           - not_defined → "Не определено"

        6. ip_objects_listed:
           - "defined" — если объекты ИС перечислены прямо или определены
             по приложению/ТЗ/спецификации;
           - "not_defined" — если объекты ИС прямо не перечислены.

        7. ip_objects_description:
           Краткое описание объектов ИС на русском языке.
           - Если перечислены прямо — укажи, например: "отчёты, дизайн-макеты".
           - Если по документу — укажи: "Определяются по Приложению № 4".
           - Если данных нет — "Не установлено".
           - Если данные противоречивы — "Не удалось определить".
        </task>

        <context_rules>
        - Перед остальными полями заполни ip_rights_on_service_results_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_present / *_listed / enum = "not_defined", все *_display = "Не определено", ip_objects_description = "Не установлено".
        - Используй только релевантные фрагменты контекста.
        - Не подставляй нормы закона, обычную практику или предположения вместо текста договора.
        - Не извлекай сведения о цене, санкциях, сроках, спорах и иных нерелевантных темах.
        - Не путай передачу материальных носителей с передачей исключительных прав.
        - Если объекты ИС определяются по приложению/ТЗ/спецификации и это прямо видно из текста, считай объекты перечисленными.
        - Если в разных фрагментах указаны разные типы передачи или моменты и конфликт нельзя разрешить по тексту: enum → "not_defined", display → "Не определено".
        - Не используй пустые строки.
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни IP-клаузулы, ни упоминания прав на результаты.
           → presence = "missing";
             все *_present / *_listed / enum = "not_defined";
             все *_display = "Не определено";
             ip_objects_description = "Не установлено".

        2. IP-клаузула без момента перехода.
           "Исключительные права переходят к Заказчику" без указания момента.
           → presence = "present";
             ip_clause_present = "defined";
             ip_transfer_type = "full_transfer";
             ip_transfer_moment = "not_defined";
             ip_transfer_moment_display = "Не определено".

        3. Противоречие между фрагментами.
           В одной части — отчуждение, в другой — лицензия.
           → presence = "unclear";
             ip_transfer_type = "not_defined";
             ip_transfer_type_display = "Не определено".

        4. Права остаются у исполнителя.
           "Все исключительные права принадлежат Исполнителю. Заказчику
           предоставляется право использования для внутренних целей."
           → presence = "present";
             ip_clause_present = "defined";
             ip_transfer_type = "retained_by_provider";
             ip_transfer_moment = "not_defined".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для ip_rights_on_service_results_presence используй только: "present", "missing", "unclear".
        - Для status-полей (*_present, *_listed) используй только: "defined", "not_defined".
        - Для ip_transfer_type используй только: "full_transfer", "license", "retained_by_provider", "not_defined".
        - Для ip_transfer_moment используй только: "upon_payment", "upon_creation", "upon_acceptance", "upon_signing", "upon_delivery", "not_defined".
        - Fallback при отсутствии данных:
          * ip_transfer_type_display → "Не определено";
          * ip_transfer_moment_display → "Не определено";
          * ip_objects_description → "Не установлено".
        - Fallback при противоречии или неоднозначности:
          * все *_display → "Не определено";
          * ip_objects_description → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "ip_rights_on_service_results_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования по правам на результаты ИС. Внутреннее агрегатное signal-поле."
          required: true

        - name: "ip_clause_present"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values:
            - "defined"
            - "not_defined"
          description: "Есть ли в договоре условие о правах на результат ИС. Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "ip_transfer_type"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values:
            - "full_transfer"
            - "license"
            - "retained_by_provider"
            - "not_defined"
          description: "Тип передачи прав на результаты ИС. Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "ip_transfer_type_display"
          type: "string"
          presentation: "fact"
          label: "Тип передачи прав ИС"
          description: >
            User-friendly описание типа передачи прав на результаты ИС. Fallback: "Не установлено" / "Не удалось определить".
          required: true
          display_in_grid: true
          display_priority: 1

        - name: "ip_transfer_moment"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values:
            - "upon_payment"
            - "upon_creation"
            - "upon_acceptance"
            - "upon_signing"
            - "upon_delivery"
            - "not_defined"
          description: "Момент перехода прав на результаты ИС. Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "ip_transfer_moment_display"
          type: "string"
          presentation: "fact"
          label: "Момент перехода прав"
          description: >
            User-friendly описание момента перехода прав на результаты ИС. Fallback: "Не установлено" / "Не удалось определить".
          required: true
          display_in_grid: true
          display_priority: 2

        - name: "ip_objects_listed"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values:
            - "defined"
            - "not_defined"
          description: "Перечислены ли объекты ИС. Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "ip_objects_description"
          type: "string"
          presentation: "fact"
          label: "Объекты ИС"
          description: >
            Описание объектов интеллектуальной собственности из текста договора. Fallback: "Не установлено" / "Не удалось определить".
          required: false
          display_in_grid: true
          display_priority: 3
      store_payload: true

  - id: sla_kpi_metrics_check
    name: "SLA/KPI: метрики качества обслуживания"
    description: >
      Фактографическая проверка наличия в договоре SLA / KPI, измеримых
      метрик качества, периода пересмотра SLA и санкций / service credits
      за нарушение показателей. Результат предназначен для табличного
      сравнения нескольких договоров.
    triggers:
      any: ["sla_based", "it_services"]
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "SLA"
        - "Service Level Agreement"
        - "KPI"
        - "уровень обслуживания"
        - "время реакции"
        - "время решения"
        - "доступность"
        - "uptime"
        - "service credit"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)\\bSLA\\b"
        - "(?i)\\bKPI\\b"
        - "(?i)время\\s+реакции"
        - "(?i)доступност.*\\d+.*%"
        - "(?i)uptime"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор услуг, в котором возможно использование SLA / KPI.
        Проверяется только один вопрос: есть ли измеримые метрики качества
        обслуживания, период пересмотра SLA и санкции / service credits
        за нарушение метрик.

        Нормативный ориентир:
        - договорные условия об уровне сервиса
        - условия об ответственности за нарушение согласованных метрик

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора, а чего прямо нет.
        - Не оценивай серьёзность риска.
        - Юрист будет использовать результат в сравнительной таблице.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Есть ли SLA / KPI.
        2. Какие метрики качества указаны.
        3. Есть ли метрика времени реакции.
        4. Есть ли метрика доступности / uptime.
        5. Есть ли service credits / санкции за нарушение SLA.
        6. Какой период пересмотра SLA указан.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Если условие не указано прямо:
           - для статусных полей (*_present, *_defined) возвращай "not_defined";
           - для enum-полей (sla_review_period) возвращай "not_defined";
           - для текстовых полей (sla_metrics_summary) возвращай "Не установлено".
        4. Строго запрещено использовать "None", "null", "not_defined" (в текстовых полях) или пустые строки "".
        5. sla_present_display:
           - Если sla_present = "defined" — "Да".
           - Если "not_defined" — "Нет".
        6. service_credit_or_penalty_display:
           - Если service_credit_or_penalty_defined = "defined" — "Да".
           - Если "not_defined" — "Нет".
        7. sla_review_period_display:
           - Если sla_review_period = "monthly" — "Ежемесячно".
           - Если "quarterly" — "Ежеквартально".
           - Если "annual" — "Ежегодно".
           - Если "other" — укажи конкретный период из текста (например, "Раз в 2 года").
           - Если "not_defined" — "Не определено".
        8. Не считай обычные сроки оказания услуг эквивалентом SLA, если нет измеримой метрики обслуживания.
        9. Если SLA определяется по приложению/политике/регламенту — укажи это в sla_metrics_summary.
        10. В evidence включай только точный текст договора.
        11. Верни только один валидный JSON-объект, содержащий все указанные ключи.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — SLA есть:
        Фрагмент:
        "SLA включает время реакции на инцидент не более 30 минут, время решения
        критического инцидента — до 4 часов, доступность сервиса — 99,5%.
        При нарушении показателей Исполнитель предоставляет service credit.
        SLA пересматривается ежеквартально."

        Ответ:
        {
          "sla_present": "defined",
          "sla_present_display": "Да",
          "sla_metrics_summary": "время реакции не более 30 минут; время решения критического инцидента до 4 часов; доступность сервиса 99,5%",
          "response_time_metric_defined": "defined",
          "availability_metric_defined": "defined",
          "service_credit_or_penalty_defined": "defined",
          "service_credit_or_penalty_display": "Да",
          "sla_review_period": "quarterly",
          "sla_review_period_display": "Ежеквартально",
          "evidence": [
            {
              "clause_ref": "Приложение SLA",
              "quote": "SLA включает время реакции на инцидент не более 30 минут, время решения критического инцидента — до 4 часов, доступность сервиса — 99,5%. При нарушении показателей Исполнитель предоставляет service credit. SLA пересматривается ежеквартально."
            }
          ]
        }

        Пример 2 — SLA определяется по приложению:
        Фрагмент:
        "Уровень обслуживания определяется согласно Регламенту оказания услуг (Приложение № 3).
        Показатели SLA пересматриваются Сторонами ежегодно."

        Ответ:
        {
          "sla_present": "defined",
          "sla_present_display": "Да",
          "sla_metrics_summary": "Определяется по Регламенту оказания услуг (Приложение № 3)",
          "response_time_metric_defined": "not_defined",
          "availability_metric_defined": "not_defined",
          "service_credit_or_penalty_defined": "not_defined",
          "service_credit_or_penalty_display": "Нет",
          "sla_review_period": "annual",
          "sla_review_period_display": "Ежегодно",
          "evidence": [
            {
              "clause_ref": "п. 5.1",
              "quote": "Уровень обслуживания определяется согласно Регламенту оказания услуг (Приложение № 3). Показатели SLA пересматриваются Сторонами ежегодно."
            }
          ]
        }

        Пример 3 — период пересмотра иной:
        Фрагмент:
        "Показатели SLA пересматриваются Сторонами раз в 2 года или по взаимному согласию."

        Ответ:
        {
          "sla_present": "defined",
          "sla_present_display": "Да",
          "sla_metrics_summary": "Не установлено",
          "response_time_metric_defined": "not_defined",
          "availability_metric_defined": "not_defined",
          "service_credit_or_penalty_defined": "not_defined",
          "service_credit_or_penalty_display": "Нет",
          "sla_review_period": "other",
          "sla_review_period_display": "Раз в 2 года",
          "evidence": [
            {
              "clause_ref": "п. 7.3",
              "quote": "Показатели SLA пересматриваются Сторонами раз в 2 года или по взаимному согласию."
            }
          ]
        }

        Пример 4 — данные отсутствуют:
        Фрагмент:
        "Исполнитель обязуется оказывать услуги качественно и своевременно."

        Ответ:
        {
          "sla_present": "not_defined",
          "sla_present_display": "Нет",
          "sla_metrics_summary": "Не установлено",
          "response_time_metric_defined": "not_defined",
          "availability_metric_defined": "not_defined",
          "service_credit_or_penalty_defined": "not_defined",
          "service_credit_or_penalty_display": "Нет",
          "sla_review_period": "not_defined",
          "sla_review_period_display": "Не определено",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Есть ли прямое упоминание SLA, KPI или измеримых сервисных метрик (не просто "качественно и своевременно").
        2. Есть ли прямое указание на время реакции.
        3. Есть ли прямое указание на доступность / uptime.
        4. Есть ли прямое указание на service credit или иную санкцию.
        5. Есть ли прямое указание на период пересмотра SLA.
        6. Если SLA определяется по приложению/политике — это не "Не установлено", а "Определяется по ...".
        7. Если прямой цитаты нет — верни "not_defined" для enum/status и "Не установлено" для текста. Не додумывай условия.

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        {
          "sla_present": "<defined / not_defined>",
          "sla_present_display": "<Да / Нет>",
          "sla_metrics_summary": "<текст / 'Определяется по ...' / 'Не установлено'>",
          "response_time_metric_defined": "<defined / not_defined>",
          "availability_metric_defined": "<defined / not_defined>",
          "service_credit_or_penalty_defined": "<defined / not_defined>",
          "service_credit_or_penalty_display": "<Да / Нет>",
          "sla_review_period": "<monthly / quarterly / annual / other / not_defined>",
          "sla_review_period_display": "<Ежемесячно / Ежеквартально / Ежегодно / конкретный период / Не определено>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 5
      temperature: 0.0
      max_tokens: 700

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "SLA KPI уровень обслуживания время реакции время решения доступность uptime service credit метрика регламент приложение"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
      negative_keywords:
        - "неустойка общая"
        - "персональные данные"
        - "подсудность"
      position_bias:
        preferred_range: [0.20, 0.80]
        boost: 0.14
        scope: segment
      context_k: 5
      max_chunks: 7
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "technical_specification"
        - "amendment"
      excluded_segment_types:
        - "price_list"
      preferred_clause_functions:
        - obligations
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.08

    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 650

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 650

      compact_output: false

      presence_signal:
        field: "sla_kpi_metrics_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора условия SLA / KPI,
        измеримые метрики качества, service credits / санкции и период пересмотра.
        Не анализируй цену, споры, форс-мажор или персональные данные.
        Не оценивай риски. Анализируй только текст договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. sla_kpi_metrics_check_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (sla_present, response_time_metric_defined,
              availability_metric_defined, service_credit_or_penalty_defined,
              sla_review_period) ≠ "not_defined";
           - "missing" — если все пять содержательных полей = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - sla_present = "not_defined";
           - response_time_metric_defined = "not_defined";
           - availability_metric_defined = "not_defined";
           - service_credit_or_penalty_defined = "not_defined";
           - sla_review_period = "not_defined";
           - sla_present_display = "Нет";
           - sla_metrics_summary = "Не установлено";
           - service_credit_or_penalty_display = "Нет";
           - sla_review_period_display = "Не определено";
           - не выполняй остальные шаги.

        1. sla_present:
           - "defined" — если в тексте прямо упомянуты SLA, KPI, уровень
             обслуживания с измеримыми метриками, или прямо сказано, что
             SLA определяется по приложению/регламенту/политике;
           - "not_defined" — если SLA/KPI прямо не упомянуты.
           Важно: общая фраза «качественно и своевременно» без измеримых
           метрик не является основанием для "defined".

        2. sla_present_display:
           - "Да" — если sla_present = "defined";
           - "Нет" — если sla_present = "not_defined".

        3. sla_metrics_summary:
           Краткое описание метрик SLA/KPI на русском языке.
           - Если метрики указаны прямо — перечисли кратко, например:
             "время реакции ≤ 30 мин; доступность 99,5%".
           - Если SLA определяется по документу — укажи:
             "Определяется по Регламенту оказания услуг (Приложение № 3)".
           - Если данных нет — "Не установлено".
           - Если данные противоречивы — "Не удалось определить".

        4. response_time_metric_defined:
           - "defined" — если прямо указана метрика времени реакции
             (например, "время реакции не более 30 минут");
           - "not_defined" — если метрика времени реакции прямо не указана.

        5. availability_metric_defined:
           - "defined" — если прямо указана метрика доступности / uptime
             (например, "доступность 99,5%", "uptime 99,9%");
           - "not_defined" — если метрика доступности прямо не указана.

        6. service_credit_or_penalty_defined:
           - "defined" — если прямо предусмотрены service credits, санкции
             или иные последствия за нарушение показателей SLA;
           - "not_defined" — если санкции за нарушение SLA прямо не указаны.

        7. service_credit_or_penalty_display:
           - "Да" — если service_credit_or_penalty_defined = "defined";
           - "Нет" — если "not_defined".

        8. sla_review_period:
           Период пересмотра SLA. Используй только:
           - "monthly" — ежемесячно;
           - "quarterly" — ежеквартально;
           - "annual" — ежегодно;
           - "other" — иной прямо указанный период;
           - "not_defined" — период пересмотра прямо не указан.

        9. sla_review_period_display:
           User-friendly маппинг:
           - monthly → "Ежемесячно"
           - quarterly → "Ежеквартально"
           - annual → "Ежегодно"
           - other → конкретный период из текста (например, "Раз в 2 года")
           - not_defined → "Не определено"
        </task>

        <context_rules>
        - Перед остальными полями заполни sla_kpi_metrics_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_present / *_defined / enum = "not_defined", все display / summary = соответствующий fallback.
        - Используй только релевантные фрагменты контекста.
        - Не подставляй нормы закона, обычную практику или предположения вместо текста договора.
        - Не извлекай сведения о цене, спорах, форс-мажоре, персональных данных и иных нерелевантных темах.
        - Не считай обычные сроки оказания услуг эквивалентом SLA, если нет измеримой метрики обслуживания.
        - Если SLA определяется по приложению/политике/регламенту и это прямо видно из текста, считай SLA определённым и отрази в sla_metrics_summary.
        - Если в разных фрагментах указаны разные метрики и конфликт нельзя разрешить по тексту: статус → "not_defined", текстовое поле → "Не удалось определить".
        - Не используй пустые строки.
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни SLA, ни KPI, ни измеримых метрик,
           ни service credits.
           → presence = "missing";
             все *_present / *_defined / enum = "not_defined";
             все display / summary = соответствующий fallback.

        2. SLA определяется по внешнему документу.
           "Уровень обслуживания определяется согласно Регламенту
           (Приложение № 3)" без конкретных метрик в тексте договора.
           → presence = "present";
             sla_present = "defined";
             sla_metrics_summary = "Определяется по Регламенту (Приложение № 3)";
             response_time_metric_defined = "not_defined";
             availability_metric_defined = "not_defined".

        3. Противоречие в метриках.
           В разных частях договора указаны разные значения uptime.
           → presence = "unclear";
             availability_metric_defined = "not_defined";
             sla_metrics_summary = "Не удалось определить".

        4. Общая фраза без измеримых метрик.
           "Исполнитель обязуется оказывать услуги качественно и своевременно"
           без конкретных показателей.
           → presence = "missing";
             все содержательные поля = "not_defined".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для sla_kpi_metrics_check_presence используй только: "present", "missing", "unclear".
        - Для status-полей (*_present, *_defined) используй только: "defined", "not_defined".
        - Для sla_review_period используй только: "monthly", "quarterly", "annual", "other", "not_defined".
        - Fallback при отсутствии данных:
          * sla_present_display → "Нет";
          * sla_metrics_summary → "Не установлено";
          * service_credit_or_penalty_display → "Нет";
          * sla_review_period_display → "Не определено".
        - Fallback при противоречии или неоднозначности:
          * sla_metrics_summary → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "sla_kpi_metrics_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования по SLA/KPI/метрикам. Внутреннее агрегатное signal-поле."
          required: true

        - name: "sla_present"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values:
            - "defined"
            - "not_defined"
          description: "Есть ли в договоре SLA / KPI. Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "sla_present_display"
          type: "string"
          presentation: "fact"
          label: "SLA / KPI"
          description: >
            User-friendly описание наличия SLA / KPI. Fallback: "Не установлено" / "Не удалось определить".
          required: true
          display_in_grid: true
          display_priority: 1

        - name: "sla_metrics_summary"
          type: "string"
          presentation: "fact"
          label: "Метрики SLA"
          description: >
            Описание измеримых метрик качества обслуживания. Fallback: "Не установлено" / "Не удалось определить".
          required: false
          display_in_grid: true
          display_priority: 2

        - name: "response_time_metric_defined"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values:
            - "defined"
            - "not_defined"
          description: "Есть ли метрика времени реакции. Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "availability_metric_defined"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values:
            - "defined"
            - "not_defined"
          description: "Есть ли метрика доступности / uptime. Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "service_credit_or_penalty_defined"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values:
            - "defined"
            - "not_defined"
          description: "Есть ли санкции / service credits за нарушение SLA. Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "service_credit_or_penalty_display"
          type: "string"
          presentation: "fact"
          label: "Service credits / санкции"
          description: >
            User-friendly описание наличия service credits / санкций за нарушение SLA. Fallback: "Не установлено" / "Не удалось определить".
          required: true
          display_in_grid: true
          display_priority: 3

        - name: "sla_review_period"
          type: "string"
          presentation: "signal"
          risk_weight: "low"
          allowed_values:
            - "monthly"
            - "quarterly"
            - "annual"
            - "other"
            - "not_defined"
          description: "Период пересмотра SLA. Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "sla_review_period_display"
          type: "string"
          presentation: "fact"
          label: "Период пересмотра SLA"
          description: >
            User-friendly описание периода пересмотра SLA. Fallback: "Не установлено" / "Не удалось определить".
          required: true
          display_in_grid: true
          display_priority: 4
      store_payload: true

  - id: client_cooperation_obligations
    name: "Обязанности заказчика по содействию (ст. 718, 783 ГК РФ)"
    description: >
      Фактографическая проверка наличия в договоре обязанностей заказчика по
      предоставлению информации, доступа, документов, контактных лиц и
      последствий задержки содействия. Результат предназначен для табличного
      сравнения нескольких договоров.
    triggers:
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "заказчик обязан предоставить"
        - "содействие заказчика"
        - "предоставление информации"
        - "предоставление доступа"
        - "контактное лицо"
        - "ответственный представитель"
        - "документы заказчика"
        - "непредоставление информации"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)заказчик\\s+обяз(ан|уется)\\s+предостав"
        - "(?i)содействи(е|я)\\s+заказчик"
        - "(?i)контактн(ое|ый)\\s+лиц"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор возмездного оказания услуг.
        Проверяется только один вопрос: обязан ли заказчик предоставлять
        информацию, документы, доступ, контактных лиц и указаны ли последствия
        непредоставления такого содействия.

        Нормативный ориентир:
        - ст. 718 ГК РФ по аналогии — содействие заказчика
        - ст. 783 ГК РФ — применение правил к услугам

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора, а чего прямо нет.
        - Не оценивай серьёзность риска.
        - Юрист будет использовать результат в сравнительной таблице.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Обязан ли заказчик предоставлять информацию / документы.
        2. Обязан ли заказчик предоставлять доступ.
        3. Обязан ли заказчик назначить контактное лицо / представителя.
        4. Есть ли сроки или регламент содействия.
        5. Есть ли последствия просрочки содействия.
        6. Как кратко описаны обязанности заказчика по содействию.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Если условие не указано прямо:
           - для статусных полей (*_defined) возвращай "not_defined";
           - для текстовых полей (cooperation_obligations_summary) возвращай "Не установлено".
        4. Строго запрещено использовать "None", "null", "not_defined" (в текстовых полях) или пустые строки "".
        5. client_contact_person_display:
           - Если client_contact_person_defined = "defined" — "Да" (или укажи имя/должность, если есть).
           - Если "not_defined" — "Не определено".
        6. client_delay_consequences_display:
           - Если client_delay_consequences_defined = "defined" — "Да" (или укажи последствия, если есть).
           - Если "not_defined" — "Не определено".
        7. Не путай общую обязанность сотрудничать с конкретными обязанностями по документам, доступу и контактным лицам.
        8. В evidence включай только точный текст договора.
        9. Верни только один валидный JSON-объект, содержащий все указанные ключи.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — содействие определено:
        Фрагмент:
        "Заказчик обязан своевременно предоставлять Исполнителю информацию,
        документы и доступ к информационным системам, а также назначить
        ответственное контактное лицо. При просрочке предоставления данных
        сроки оказания услуг подлежат соразмерному продлению."

        Ответ:
        {
          "client_information_duty_defined": "defined",
          "client_access_duty_defined": "defined",
          "client_contact_person_defined": "defined",
          "client_contact_person_display": "Да",
          "cooperation_deadlines_defined": "not_defined",
          "client_delay_consequences_defined": "defined",
          "client_delay_consequences_display": "Да (соразмерное продление сроков услуг)",
          "cooperation_obligations_summary": "предоставление информации, документов, доступа к информационным системам и назначение контактного лица; при просрочке сроки услуг продлеваются",
          "evidence": [
            {
              "clause_ref": "п. 3.2",
              "quote": "Заказчик обязан своевременно предоставлять Исполнителю информацию, документы и доступ к информационным системам, а также назначить ответственное контактное лицо. При просрочке предоставления данных сроки оказания услуг подлежат соразмерному продлению."
            }
          ]
        }

        Пример 2 — только контактное лицо:
        Фрагмент:
        "Заказчик назначает ответственного представителя — Иванова И.И., генерального директора."

        Ответ:
        {
          "client_information_duty_defined": "not_defined",
          "client_access_duty_defined": "not_defined",
          "client_contact_person_defined": "defined",
          "client_contact_person_display": "Да (Иванов И.И., генеральный директор)",
          "cooperation_deadlines_defined": "not_defined",
          "client_delay_consequences_defined": "not_defined",
          "client_delay_consequences_display": "Не определено",
          "cooperation_obligations_summary": "назначение ответственного представителя — Иванова И.И., генерального директора",
          "evidence": [
            {
              "clause_ref": "п. 4.1",
              "quote": "Заказчик назначает ответственного представителя — Иванова И.И., генерального директора."
            }
          ]
        }

        Пример 3 — данные отсутствуют:
        Фрагмент:
        "Исполнитель оказывает услуги самостоятельно."

        Ответ:
        {
          "client_information_duty_defined": "not_defined",
          "client_access_duty_defined": "not_defined",
          "client_contact_person_defined": "not_defined",
          "client_contact_person_display": "Не определено",
          "cooperation_deadlines_defined": "not_defined",
          "client_delay_consequences_defined": "not_defined",
          "client_delay_consequences_display": "Не определено",
          "cooperation_obligations_summary": "Не установлено",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Есть ли прямая обязанность заказчика по информации / документам.
        2. Есть ли прямая обязанность по доступу.
        3. Есть ли прямая обязанность назначить контактное лицо.
        4. Есть ли прямое указание на последствия просрочки содействия.
        5. Если прямой цитаты нет — верни "not_defined" для статусов и "Не установлено" для текста. Не додумывай условия.

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        {
          "client_information_duty_defined": "<defined / not_defined>",
          "client_access_duty_defined": "<defined / not_defined>",
          "client_contact_person_defined": "<defined / not_defined>",
          "client_contact_person_display": "<Да / Да (имя, должность) / Не определено>",
          "cooperation_deadlines_defined": "<defined / not_defined>",
          "client_delay_consequences_defined": "<defined / not_defined>",
          "client_delay_consequences_display": "<Да / Да (последствия) / Не определено>",
          "cooperation_obligations_summary": "<текст или 'Не установлено'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 5
      temperature: 0.0
      max_tokens: 700

    retrieval:
      retrieval_profile: "scope_of_work_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "заказчик обязан предоставить содействие заказчика документы доступ контактное лицо ответственный представитель непредоставление информации последствия просрочки"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - technical_fragment
        - structural_anchor
        - definition
      preferred_clause_functions:
        - obligations
      negative_keywords:
        - "неустойка"
        - "персональные данные"
        - "форс-мажор"
        - "подсудность"
      position_bias:
        preferred_range: [0.20, 0.65]
        boost: 0.14
        scope: segment
      context_k: 5
      max_chunks: 7
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "price_list"
        - "technical_specification"
      preferred_clause_functions:
        - obligations
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 650

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 650

      compact_output: false

      presence_signal:
        field: "client_cooperation_obligations_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора обязанности заказчика
        по содействию: предоставление информации, документов, доступа, контактных
        лиц и последствия задержки содействия. Не анализируй цену, санкции,
        споры или форс-мажор.
        Не оценивай риски. Анализируй только текст договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. client_cooperation_obligations_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (client_information_duty_defined, client_access_duty_defined,
              client_contact_person_defined, cooperation_deadlines_defined,
              client_delay_consequences_defined) ≠ "not_defined";
           - "missing" — если все пять содержательных полей = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - client_information_duty_defined = "not_defined";
           - client_access_duty_defined = "not_defined";
           - client_contact_person_defined = "not_defined";
           - cooperation_deadlines_defined = "not_defined";
           - client_delay_consequences_defined = "not_defined";
           - client_contact_person_display = "Не определено";
           - client_delay_consequences_display = "Не определено";
           - cooperation_obligations_summary = "Не установлено";
           - не выполняй остальные шаги.

        1. client_information_duty_defined:
           - "defined" — если в тексте прямо указана обязанность Заказчика
             предоставлять информацию, документы, исходные данные;
           - "not_defined" — если такая обязанность прямо не указана.

        2. client_access_duty_defined:
           - "defined" — если в тексте прямо указана обязанность Заказчика
             предоставлять доступ (к помещениям, системам, оборудованию,
             персоналу);
           - "not_defined" — если обязанность по доступу прямо не указана.

        3. client_contact_person_defined:
           - "defined" — если в тексте прямо указана обязанность Заказчика
             назначить контактное лицо / ответственного представителя;
           - "not_defined" — если контактное лицо прямо не упомянуто.

        4. client_contact_person_display:
           User-friendly описание:
           - "Да (имя, должность)" — если defined и в тексте указаны
             имя/должность;
           - "Да" — если defined, но без конкретики;
           - "Не определено" — если not_defined.

        5. cooperation_deadlines_defined:
           - "defined" — если прямо указаны сроки или регламент содействия
             Заказчика (например, "в течение 3 рабочих дней с момента
             запроса");
           - "not_defined" — если сроки содействия прямо не указаны.

        6. client_delay_consequences_defined:
           - "defined" — если прямо указаны последствия просрочки содействия
             со стороны Заказчика (продление сроков, приостановка услуг,
             освобождение Исполнителя от ответственности);
           - "not_defined" — если последствия прямо не указаны.

        7. client_delay_consequences_display:
           User-friendly описание:
           - "Да (последствия)" — если defined и последствия конкретизированы;
           - "Да" — если defined, но без конкретики;
           - "Не определено" — если not_defined.

        8. cooperation_obligations_summary:
           Краткое user-facing описание обязанностей Заказчика по содействию.
           Перечисли основные обязанности через запятую.
           Если данных нет — "Не установлено".
           Если данные противоречивы — "Не удалось определить".
        </task>

        <context_rules>
        - Перед остальными полями заполни client_cooperation_obligations_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_defined = "not_defined", все display = "Не определено", summary = "Не установлено".
        - Используй только релевантные фрагменты контекста.
        - Не подставляй нормы закона, обычную практику или предположения вместо текста договора.
        - Не извлекай сведения о цене, санкциях за просрочку оплаты, спорах, форс-мажоре и иных нерелевантных темах.
        - Не путай общую обязанность сотрудничать с конкретными обязанностями по документам, доступу и контактным лицам.
        - Если в разных фрагментах указаны разные обязанности и конфликт нельзя разрешить по тексту: статус → "not_defined", текстовое поле → "Не удалось определить".
        - Не используй пустые строки.
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни обязанностей по содействию, ни контактных лиц,
           ни последствий просрочки.
           → presence = "missing";
             все *_defined = "not_defined";
             все display = "Не определено";
             summary = "Не установлено".

        2. Только контактное лицо без остальных обязанностей.
           "Заказчик назначает ответственного представителя — Иванова И.И."
           → presence = "present";
             client_contact_person_defined = "defined";
             client_contact_person_display = "Да (Иванов И.И.)";
             client_information_duty_defined = "not_defined";
             client_access_duty_defined = "not_defined".

        3. Противоречие между фрагментами.
           В одной части — обязанность предоставить доступ, в другой —
           Исполнитель работает самостоятельно без доступа.
           → presence = "unclear";
             client_access_duty_defined = "not_defined";
             cooperation_obligations_summary = "Не удалось определить".

        4. Общая фраза о сотрудничестве без конкретики.
           "Стороны обязуются сотрудничать в целях надлежащего исполнения
           договора" без конкретных обязанностей.
           → presence = "missing";
             все *_defined = "not_defined".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для client_cooperation_obligations_presence используй только: "present", "missing", "unclear".
        - Для status-полей (*_defined) используй только: "defined", "not_defined".
        - Fallback при отсутствии данных:
          * client_contact_person_display → "Не определено";
          * client_delay_consequences_display → "Не определено";
          * cooperation_obligations_summary → "Не установлено".
        - Fallback при противоречии или неоднозначности:
          * cooperation_obligations_summary → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "client_cooperation_obligations_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования по содействию заказчика. Внутреннее агрегатное signal-поле."
          required: true

        - name: "client_information_duty_defined"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values:
            - "defined"
            - "not_defined"
          description: "Есть ли обязанность заказчика предоставлять информацию и документы. Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "client_access_duty_defined"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values:
            - "defined"
            - "not_defined"
          description: "Есть ли обязанность заказчика предоставлять доступ. Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "client_contact_person_defined"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values:
            - "defined"
            - "not_defined"
          description: "Есть ли обязанность назначить контактное лицо / представителя. Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "client_contact_person_display"
          type: "string"
          presentation: "fact"
          label: "Контактное лицо"
          description: >
            User-friendly описание наличия контактного лица / представителя заказчика. Fallback: "Не установлено" / "Не удалось определить".
          required: true
          display_in_grid: true
          display_priority: 1

        - name: "cooperation_deadlines_defined"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values:
            - "defined"
            - "not_defined"
          description: "Есть ли сроки или регламент содействия заказчика. Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "client_delay_consequences_defined"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values:
            - "defined"
            - "not_defined"
          description: "Есть ли последствия просрочки содействия со стороны заказчика. Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "client_delay_consequences_display"
          type: "string"
          presentation: "fact"
          label: "Последствия просрочки содействия"
          description: >
            User-friendly описание последствий просрочки содействия заказчика. Fallback: "Не установлено" / "Не удалось определить".
          required: true
          display_in_grid: true
          display_priority: 2

        - name: "cooperation_obligations_summary"
          type: "string"
          presentation: "fact"
          label: "Содействие заказчика"
          description: >
            Краткое описание обязанностей заказчика по содействию. Fallback: "Не установлено" / "Не удалось определить".
          required: false
          display_in_grid: true
          display_priority: 3
      store_payload: true

  - id: scope_change_management
    name: "Порядок изменения ТЗ / объёма услуг (change management)"
    description: >
      Фактографическая проверка наличия в договоре процедуры изменения ТЗ,
      объёма услуг, пересмотра цены и сроков, а также требования письменного
      согласования изменений. Результат предназначен для табличного сравнения
      нескольких договоров.
    triggers:
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "изменение ТЗ"
        - "изменение объёма услуг"
        - "дополнительное соглашение"
        - "change request"
        - "запрос на изменение"
        - "изменение спецификации"
        - "пересмотр стоимости"
        - "пересмотр сроков"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)изменени(е|я)\\s+(ТЗ|технического\\s+задания|объ[её]ма|спецификац)"
        - "(?i)дополнительн(ое|ого)\\s+соглашени"
        - "(?i)change\\s*request"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор возмездного оказания услуг.
        Проверяется только один вопрос: есть ли процедура изменения ТЗ,
        объёма услуг, цены и сроков, а также требуется ли письменное согласование.

        Нормативный ориентир:
        - ст. 450 ГК РФ — изменение договора
        - ст. 452 ГК РФ — форма соглашения об изменении

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора, а чего прямо нет.
        - Не оценивай серьёзность риска.
        - Юрист будет использовать результат в сравнительной таблице.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Есть ли процедура изменения объема услуг / ТЗ.
        2. Требуется ли письменное согласование изменений.
        3. Требуется ли дополнительное соглашение.
        4. Урегулирован ли пересмотр цены.
        5. Урегулирован ли пересмотр сроков.
        6. Как кратко описан порядок change management.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Если условие не указано прямо:
           - для статусных полей (*_defined, *_required) возвращай "not_defined";
           - для текстовых полей (change_management_summary) возвращай "Не установлено".
        4. Строго запрещено использовать "None", "null", "not_defined" (в текстовых полях) или пустые строки "".
        5. scope_change_procedure_display:
           - Если scope_change_procedure_defined = "defined" — "Да".
           - Если "not_defined" — "Нет".
        6. additional_agreement_required_display:
           - Если additional_agreement_required = "defined" — "Да".
           - Если "not_defined" — "Нет".
        7. Не путай изменение ТЗ с обычным правом исполнителя уточнять рабочие детали без согласования.
        8. Если порядок изменения ТЗ определяется по приложению/регламенту/политике — укажи это в change_management_summary.
        9. В evidence включай только точный текст договора.
        10. Верни только один валидный JSON-объект, содержащий все указанные ключи.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — полный порядок определен:
        Фрагмент:
        "Изменение Технического задания и объема услуг допускается только по
        письменному согласованию сторон на основании Change Request. Такое
        изменение оформляется дополнительным соглашением и влечет пересмотр
        сроков и стоимости услуг."

        Ответ:
        {
          "scope_change_procedure_defined": "defined",
          "scope_change_procedure_display": "Да",
          "written_change_approval_required": "defined",
          "additional_agreement_required": "defined",
          "additional_agreement_required_display": "Да",
          "price_revision_defined": "defined",
          "timeline_revision_defined": "defined",
          "change_management_summary": "изменение ТЗ и объёма услуг по письменному согласованию сторон на основании Change Request с оформлением дополнительного соглашения; пересматриваются сроки и стоимость",
          "evidence": [
            {
              "clause_ref": "п. 2.5",
              "quote": "Изменение Технического задания и объема услуг допускается только по письменному согласованию сторон на основании Change Request. Такое изменение оформляется дополнительным соглашением и влечет пересмотр сроков и стоимости услуг."
            }
          ]
        }

        Пример 2 — частичный порядок (только письменное согласование):
        Фрагмент:
        "Любые изменения объёма услуг согласуются сторонами в письменной форме.
        Дополнительное соглашение не требуется."

        Ответ:
        {
          "scope_change_procedure_defined": "defined",
          "scope_change_procedure_display": "Да",
          "written_change_approval_required": "defined",
          "additional_agreement_required": "not_defined",
          "additional_agreement_required_display": "Нет",
          "price_revision_defined": "not_defined",
          "timeline_revision_defined": "not_defined",
          "change_management_summary": "изменение объёма услуг по письменному согласованию сторон без оформления дополнительного соглашения",
          "evidence": [
            {
              "clause_ref": "п. 3.4",
              "quote": "Любые изменения объёма услуг согласуются сторонами в письменной форме. Дополнительное соглашение не требуется."
            }
          ]
        }

        Пример 3 — порядок определяется по регламенту:
        Фрагмент:
        "Порядок изменения Технического задания и объёма услуг определяется
        согласно Регламенту управления изменениями (Приложение № 5)."

        Ответ:
        {
          "scope_change_procedure_defined": "defined",
          "scope_change_procedure_display": "Да",
          "written_change_approval_required": "not_defined",
          "additional_agreement_required": "not_defined",
          "additional_agreement_required_display": "Нет",
          "price_revision_defined": "not_defined",
          "timeline_revision_defined": "not_defined",
          "change_management_summary": "Определяется по Регламенту управления изменениями (Приложение № 5)",
          "evidence": [
            {
              "clause_ref": "п. 4.1",
              "quote": "Порядок изменения Технического задания и объёма услуг определяется согласно Регламенту управления изменениями (Приложение № 5)."
            }
          ]
        }

        Пример 4 — данные отсутствуют:
        Фрагмент:
        "Исполнитель вправе уточнять методологию оказания услуг."

        Ответ:
        {
          "scope_change_procedure_defined": "not_defined",
          "scope_change_procedure_display": "Нет",
          "written_change_approval_required": "not_defined",
          "additional_agreement_required": "not_defined",
          "additional_agreement_required_display": "Нет",
          "price_revision_defined": "not_defined",
          "timeline_revision_defined": "not_defined",
          "change_management_summary": "Не установлено",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Есть ли отдельная процедура изменения ТЗ / объёма (не просто уточнение методологии).
        2. Есть ли требование письменного согласования.
        3. Есть ли требование дополнительного соглашения.
        4. Есть ли прямое указание на пересмотр цены и сроков.
        5. Если порядок определяется по приложению/регламенту — это не "Не установлено", а "Определяется по ...".
        6. Если прямой цитаты нет — верни "not_defined" для статусов и "Не установлено" для текста. Не додумывай условия.

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        {
          "scope_change_procedure_defined": "<defined / not_defined>",
          "scope_change_procedure_display": "<Да / Нет>",
          "written_change_approval_required": "<defined / not_defined>",
          "additional_agreement_required": "<defined / not_defined>",
          "additional_agreement_required_display": "<Да / Нет>",
          "price_revision_defined": "<defined / not_defined>",
          "timeline_revision_defined": "<defined / not_defined>",
          "change_management_summary": "<текст / 'Определяется по ...' / 'Не установлено'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 5
      temperature: 0.0
      max_tokens: 700

    retrieval:
      retrieval_profile: "scope_of_work_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "изменение ТЗ изменение объема услуг change request дополнительное соглашение изменение спецификации пересмотр стоимости пересмотр сроков регламент приложение"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - technical_fragment
        - structural_anchor
        - definition
      preferred_clause_functions:
        - obligations
      negative_keywords:
        - "неустойка"
        - "форс-мажор"
        - "персональные данные"
        - "подсудность"
      position_bias:
        preferred_range: [0.20, 0.75]
        boost: 0.14
        scope: segment
      context_k: 5
      max_chunks: 7
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "price_list"
        - "technical_specification"
      preferred_clause_functions:
        - obligations
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 650

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 650

      compact_output: false

      presence_signal:
        field: "scope_change_management_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора процедуру изменения
        ТЗ и объема услуг, требования письменного согласования, пересмотра цены
        и сроков. Не анализируй цену как таковую, санкции, споры или форс-мажор.
        Не оценивай риски. Анализируй только текст договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. scope_change_management_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (scope_change_procedure_defined, written_change_approval_required,
              additional_agreement_required, price_revision_defined,
              timeline_revision_defined) ≠ "not_defined";
           - "missing" — если все пять содержательных полей = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - scope_change_procedure_defined = "not_defined";
           - written_change_approval_required = "not_defined";
           - additional_agreement_required = "not_defined";
           - price_revision_defined = "not_defined";
           - timeline_revision_defined = "not_defined";
           - scope_change_procedure_display = "Нет";
           - additional_agreement_required_display = "Нет";
           - change_management_summary = "Не установлено";
           - не выполняй остальные шаги.

        1. scope_change_procedure_defined:
           - "defined" — если в тексте прямо описана процедура изменения
             ТЗ, объёма услуг, спецификации (порядок запроса, согласования,
             оформления), или прямо сказано, что процедура определяется
             по приложению/регламенту/политике;
           - "not_defined" — если процедура изменения прямо не описана.
           Важно: не путай с обычным правом исполнителя уточнять рабочие
           детали без согласования.

        2. scope_change_procedure_display:
           - "Да" — если scope_change_procedure_defined = "defined";
           - "Нет" — если "not_defined".

        3. written_change_approval_required:
           - "defined" — если прямо требуется письменное согласование
             изменений (письменная форма, подписание, утверждение);
           - "not_defined" — если письменное согласование прямо не требуется.

        4. additional_agreement_required:
           - "defined" — если прямо требуется оформление дополнительного
             соглашения для изменений;
           - "not_defined" — если дополнительное соглашение прямо не требуется.

        5. additional_agreement_required_display:
           - "Да" — если additional_agreement_required = "defined";
           - "Нет" — если "not_defined".

        6. price_revision_defined:
           - "defined" — если прямо урегулирован пересмотр цены / стоимости
             при изменении объёма / ТЗ;
           - "not_defined" — если пересмотр цены прямо не урегулирован.

        7. timeline_revision_defined:
           - "defined" — если прямо урегулирован пересмотр сроков
             при изменении объёма / ТЗ;
           - "not_defined" — если пересмотр сроков прямо не урегулирован.

        8. change_management_summary:
           Краткое user-facing описание порядка изменения ТЗ / объёма.
           - Если порядок указан прямо — сформируй краткое описание.
           - Если определяется по документу — укажи:
             "Определяется по Регламенту управления изменениями (Приложение № 5)".
           - Если данных нет — "Не установлено".
           - Если данные противоречивы — "Не удалось определить".
        </task>

        <context_rules>
        - Перед остальными полями заполни scope_change_management_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_defined / *_required = "not_defined", все display = "Нет", summary = "Не установлено".
        - Используй только релевантные фрагменты контекста.
        - Не подставляй нормы закона, обычную практику или предположения вместо текста договора.
        - Не извлекай сведения о цене как таковой, санкциях, спорах, форс-мажоре и иных нерелевантных темах.
        - Не путай изменение ТЗ с обычным правом исполнителя уточнять рабочие детали без согласования.
        - Если порядок изменения определяется по приложению/регламенту/политике и это прямо видно из текста, считай процедуру определённой.
        - Если в разных фрагментах указаны разные условия и конфликт нельзя разрешить по тексту: статус → "not_defined", текстовое поле → "Не удалось определить".
        - Не используй пустые строки.
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни процедуры изменения, ни согласования,
           ни пересмотра цены/сроков.
           → presence = "missing";
             все *_defined / *_required = "not_defined";
             все display = "Нет";
             summary = "Не установлено".

        2. Порядок определяется по внешнему документу.
           "Порядок изменения ТЗ определяется согласно Регламенту
           (Приложение № 5)" без деталей в тексте договора.
           → presence = "present";
             scope_change_procedure_defined = "defined";
             change_management_summary = "Определяется по Регламенту (Приложение № 5)";
             written_change_approval_required = "not_defined";
             price_revision_defined = "not_defined".

        3. Противоречие между фрагментами.
           В одной части — изменения только по доп. соглашению,
           в другой — Исполнитель вправе менять объём самостоятельно.
           → presence = "unclear";
             scope_change_procedure_defined = "not_defined";
             change_management_summary = "Не удалось определить".

        4. Только письменное согласование без пересмотра.
           "Изменения объёма услуг согласуются сторонами в письменной форме"
           без упоминания цены, сроков и доп. соглашения.
           → presence = "present";
             scope_change_procedure_defined = "defined";
             written_change_approval_required = "defined";
             additional_agreement_required = "not_defined";
             price_revision_defined = "not_defined".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для scope_change_management_presence используй только: "present", "missing", "unclear".
        - Для status-полей (*_defined, *_required) используй только: "defined", "not_defined".
        - Fallback при отсутствии данных:
          * scope_change_procedure_display → "Нет";
          * additional_agreement_required_display → "Нет";
          * change_management_summary → "Не установлено".
        - Fallback при противоречии или неоднозначности:
          * change_management_summary → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "scope_change_management_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования по изменению ТЗ/объёма. Внутреннее агрегатное signal-поле."
          required: true

        - name: "scope_change_procedure_defined"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values:
            - "defined"
            - "not_defined"
          description: "Есть ли процедура изменения ТЗ / объема услуг. Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "scope_change_procedure_display"
          type: "string"
          presentation: "fact"
          label: "Процедура изменения ТЗ"
          description: >
            User-friendly описание наличия процедуры изменения ТЗ / объёма услуг. Fallback: "Не установлено" / "Не удалось определить".
          required: true
          display_in_grid: true
          display_priority: 1

        - name: "written_change_approval_required"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values:
            - "defined"
            - "not_defined"
          description: "Требуется ли письменное согласование изменений. Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "additional_agreement_required"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values:
            - "defined"
            - "not_defined"
          description: "Требуется ли дополнительное соглашение. Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "additional_agreement_required_display"
          type: "string"
          presentation: "fact"
          label: "Дополнительное соглашение"
          description: >
            User-friendly описание требования дополнительного соглашения. Fallback: "Не установлено" / "Не удалось определить".
          required: true
          display_in_grid: true
          display_priority: 2

        - name: "price_revision_defined"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values:
            - "defined"
            - "not_defined"
          description: "Определен ли пересмотр цены при изменении объема / ТЗ. Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "timeline_revision_defined"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values:
            - "defined"
            - "not_defined"
          description: "Определен ли пересмотр сроков при изменении объема / ТЗ. Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "change_management_summary"
          type: "string"
          presentation: "fact"
          label: "Изменение ТЗ"
          description: >
            Краткое описание порядка изменения ТЗ и объема услуг. Fallback: "Не установлено" / "Не удалось определить".
          required: false
          display_in_grid: true
          display_priority: 3
      store_payload: true

  - id: labor_requalification_risk_check
    name: "Признаки трудовых отношений: риск переквалификации (ст. 15, 19.1 ТК РФ)"
    description: >
      Фактографическая проверка наличия в договоре признаков, характерных для
      трудовых отношений: подчинение режиму, рабочее место, трудовая функция,
      периодическая фиксированная оплата и подчиненность руководителю.
      Результат предназначен для табличного сравнения нескольких договоров.
    triggers:
      any: ["individual_party"]
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "трудовая функция"
        - "рабочее место"
        - "правила внутреннего трудового распорядка"
        - "ПВТР"
        - "подчинение"
        - "режим работы"
        - "должностная инструкция"
        - "ежемесячная фиксированная оплата"
        - "руководитель"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)трудов(ая|ую|ой)\\s+функци"
        - "(?i)рабоч(ее|его)\\s+мест"
        - "(?i)правил(а|ам)\\s+внутреннего\\s+трудового"
        - "(?i)должностн(ая|ую|ой)\\s+инструкци"
        - "(?i)режим\\s+работ"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор оказания услуг с участием физического лица, ИП
        или иного исполнителя, по которому возможна переквалификация отношений.
        Проверяется только один вопрос: есть ли в тексте договора фактические
        признаки, характерные для трудовых отношений.

        Нормативный ориентир:
        - ст. 15 ТК РФ — трудовые отношения
        - ст. 19.1 ТК РФ — признание отношений трудовыми

        Важно:
        - Твоя задача — только установить, какие признаки прямо есть в тексте, а каких прямо нет.
        - Не оценивай уровень риска и не делай юридический вывод о переквалификации.
        - Юрист будет использовать результат в сравнительной таблице.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Есть ли признаки подчинения режиму / ПВТР / графику.
        2. Есть ли указание на рабочее место.
        3. Есть ли формулировка трудовой функции вместо конкретного результата услуг.
        4. Есть ли фиксированная периодическая оплата.
        5. Есть ли подчинение руководителю / менеджеру заказчика.
        6. Есть ли суммарное наличие признаков.
        7. Как кратко описаны обнаруженные признаки.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Если признак не указан прямо:
           - для статусных полей (*_defined) возвращай "not_defined";
           - для labor_signs_detected возвращай "no";
           - для labor_signs_summary возвращай "Признаки не обнаружены".
        4. Строго запрещено использовать "None", "null", "not_defined" (в текстовых полях) или пустые строки "".
        5. labor_signs_detected_display:
           - Если labor_signs_detected = "yes" — "Да, признаки обнаружены".
           - Если "no" — "Нет, признаки не обнаружены".
        6. Не оценивай тяжесть риска и не используй шкалы high / medium / low.
        7. В evidence включай только точный текст договора.
        8. Верни только один валидный JSON-объект, содержащий все указанные ключи.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — множественные признаки:
        Фрагмент:
        "Исполнитель обязан соблюдать правила внутреннего трудового распорядка,
        режим работы с 9:00 до 18:00, выполнять функции менеджера по продажам,
        находиться на рабочем месте по адресу Заказчика. Вознаграждение
        выплачивается ежемесячно 10-го числа."

        Ответ:
        {
          "labor_signs_detected": "yes",
          "labor_signs_detected_display": "Да, признаки обнаружены",
          "labor_signs_summary": "соблюдение ПВТР и режима работы; выполнение функций менеджера по продажам; рабочее место у заказчика; ежемесячная фиксированная выплата",
          "schedule_subordination_defined": "defined",
          "workplace_defined": "defined",
          "labor_function_defined": "defined",
          "fixed_periodic_payment_defined": "defined",
          "manager_subordination_defined": "not_defined",
          "evidence": [
            {
              "clause_ref": "п. 1.2",
              "quote": "Исполнитель обязан соблюдать правила внутреннего трудового распорядка, режим работы с 9:00 до 18:00, выполнять функции менеджера по продажам, находиться на рабочем месте по адресу Заказчика. Вознаграждение выплачивается ежемесячно 10-го числа."
            }
          ]
        }

        Пример 2 — частичные признаки (только рабочее место и подчинение):
        Фрагмент:
        "Исполнитель оказывает услуги на территории Заказчика и подчиняется
        непосредственному руководителю проекта от Заказчика."

        Ответ:
        {
          "labor_signs_detected": "yes",
          "labor_signs_detected_display": "Да, признаки обнаружены",
          "labor_signs_summary": "работа на территории заказчика; подчинение руководителю проекта от заказчика",
          "schedule_subordination_defined": "not_defined",
          "workplace_defined": "defined",
          "labor_function_defined": "not_defined",
          "fixed_periodic_payment_defined": "not_defined",
          "manager_subordination_defined": "defined",
          "evidence": [
            {
              "clause_ref": "п. 2.3",
              "quote": "Исполнитель оказывает услуги на территории Заказчика и подчиняется непосредственному руководителю проекта от Заказчика."
            }
          ]
        }

        Пример 3 — признаки отсутствуют:
        Фрагмент:
        "Исполнитель обязуется подготовить аналитический отчет и передать его
        Заказчику по акту. Вознаграждение выплачивается после приемки результата."

        Ответ:
        {
          "labor_signs_detected": "no",
          "labor_signs_detected_display": "Нет, признаки не обнаружены",
          "labor_signs_summary": "Признаки не обнаружены",
          "schedule_subordination_defined": "not_defined",
          "workplace_defined": "not_defined",
          "labor_function_defined": "not_defined",
          "fixed_periodic_payment_defined": "not_defined",
          "manager_subordination_defined": "not_defined",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Есть ли прямая ссылка на режим / ПВТР / график.
        2. Есть ли прямое указание на рабочее место.
        3. Есть ли описание трудовой функции, а не конкретного результата.
        4. Есть ли ежемесячная / периодическая фиксированная выплата.
        5. Есть ли подчиненность руководителю / менеджеру.
        6. Если прямой цитаты нет — верни "not_defined" для статусов и "no" для labor_signs_detected. Не додумывай условия.

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        {
          "labor_signs_detected": "<yes / no>",
          "labor_signs_detected_display": "<Да, признаки обнаружены / Нет, признаки не обнаружены>",
          "labor_signs_summary": "<текст или 'Признаки не обнаружены'>",
          "schedule_subordination_defined": "<defined / not_defined>",
          "workplace_defined": "<defined / not_defined>",
          "labor_function_defined": "<defined / not_defined>",
          "fixed_periodic_payment_defined": "<defined / not_defined>",
          "manager_subordination_defined": "<defined / not_defined>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 720

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "трудовая функция рабочее место ПВТР режим работы подчинение руководителю ежемесячная фиксированная оплата должностная инструкция"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - technical_fragment
        - structural_anchor
        - definition
      preferred_clause_functions:
        - obligations
      negative_keywords:
        - "акт оказанных услуг"
        - "конкретный результат"
        - "ТЗ"
        - "спецификация"
      position_bias:
        preferred_range: [0.10, 0.70]
        boost: 0.16
        scope: segment
      context_k: 6
      max_chunks: 9
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "price_list"
        - "technical_specification"
      preferred_clause_functions:
        - obligations
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.08

    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 650

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 750

      compact_output: false

      presence_signal:
        field: "labor_requalification_risk_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора фактические признаки,
        которые могут быть характерны для трудовых отношений: режим, ПВТР,
        рабочее место, трудовая функция, периодическая выплата, подчиненность.
        Не оценивай уровень риска и не делай правовой вывод о переквалификации.
        Не используй шкалы high / medium / low. Анализируй только текст договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. labor_requalification_risk_check_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (schedule_subordination_defined, workplace_defined,
              labor_function_defined, fixed_periodic_payment_defined,
              manager_subordination_defined) ≠ "not_defined";
           - "missing" — если все пять содержательных полей = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - schedule_subordination_defined = "not_defined";
           - workplace_defined = "not_defined";
           - labor_function_defined = "not_defined";
           - fixed_periodic_payment_defined = "not_defined";
           - manager_subordination_defined = "not_defined";
           - labor_signs_detected = "no";
           - labor_signs_detected_display = "Нет, признаки не обнаружены";
           - labor_signs_summary = "Признаки не обнаружены";
           - не выполняй остальные шаги.

        1. labor_signs_detected:
           Сводное поле — обнаружены ли признаки трудовых отношений.
           - "yes" — если хотя бы одно из пяти содержательных полей
             (schedule_subordination, workplace, labor_function,
              fixed_periodic_payment, manager_subordination) = "defined";
           - "no" — если все пять = "not_defined".

        2. labor_signs_detected_display:
           User-friendly маппинг:
           - yes → "Да, признаки обнаружены"
           - no → "Нет, признаки не обнаружены"

        3. labor_signs_summary:
           Краткое описание обнаруженных признаков на русском языке.
           Перечисли через точку с запятой.
           Если признаков нет — "Признаки не обнаружены".

        4. schedule_subordination_defined:
           - "defined" — если прямо указано подчинение режиму работы,
             ПВТР, графику, обязанность присутствия по времени
             (например, "с 9:00 до 18:00", "соблюдать ПВТР");
           - "not_defined" — если режим/ПВТР прямо не указан.

        5. workplace_defined:
           - "defined" — если прямо указано рабочее место / постоянное
             место исполнения у Заказчика (например, "на территории
             Заказчика", "по адресу Заказчика");
           - "not_defined" — если рабочее место прямо не указано.

        6. labor_function_defined:
           - "defined" — если описана трудовая функция, а не конкретный
             результат услуги (например, "выполнять функции менеджера
             по продажам" vs "подготовить аналитический отчёт");
           - "not_defined" — если трудовая функция прямо не описана.

        7. fixed_periodic_payment_defined:
           - "defined" — если есть фиксированная ежемесячная / регулярная
             выплата как процессная оплата (не оплата за результат);
           - "not_defined" — если периодическая фиксированная выплата
             прямо не указана.

        8. manager_subordination_defined:
           - "defined" — если есть прямое подчинение руководителю /
             менеджеру / начальнику Заказчика;
           - "not_defined" — если подчинённость прямо не указана.
        </task>

        <context_rules>
        - Перед остальными полями заполни labor_requalification_risk_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_defined = "not_defined", labor_signs_detected = "no", display = "Нет, признаки не обнаружены", summary = "Признаки не обнаружены".
        - labor_signs_detected заполняй согласованно с presence: если presence = "present" → "yes"; если "missing" → "no".
        - Используй только релевантные фрагменты контекста.
        - Не подставляй нормы закона, обычную практику или предположения вместо текста договора.
        - Не оценивай уровень риска и не делай правовой вывод о переквалификации.
        - Не используй шкалы high / medium / low.
        - Не путай координацию с менеджером проекта (обычное взаимодействие) с прямым подчинением руководителю (трудовой признак).
        - Не путай оплату за результат по акту с фиксированной периодической выплатой.
        - Если в разных фрагментах указаны противоречивые условия (например, режим + свободный график): presence = "unclear", labor_signs_detected = "yes" (признаки есть, но противоречивы).
        - Не используй пустые строки.
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие признаков.
           В тексте нет ни режима, ни рабочего места, ни функции,
           ни периодической оплаты, ни подчинения.
           → presence = "missing";
             все *_defined = "not_defined";
             labor_signs_detected = "no";
             summary = "Признаки не обнаружены".

        2. Единичный признак.
           "Исполнитель оказывает услуги на территории Заказчика"
           без режима, функции, оплаты и подчинения.
           → presence = "present";
             workplace_defined = "defined";
             labor_signs_detected = "yes";
             все остальные *_defined = "not_defined".

        3. Противоречие между фрагментами.
           В одной части — "режим работы с 9 до 18", в другой —
           "Исполнитель самостоятельно определяет время оказания услуг".
           → presence = "unclear";
             labor_signs_detected = "yes";
             schedule_subordination_defined = "not_defined";
             summary описывает противоречие.

        4. Формулировки на грани.
           "Исполнитель координирует свою работу с менеджером проекта
           Заказчика" — координация, не подчинение.
           → presence = "present";
             manager_subordination_defined = "not_defined"
             (координация ≠ подчинение);
             labor_signs_detected зависит от других признаков.
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для labor_requalification_risk_check_presence используй только: "present", "missing", "unclear".
        - Для labor_signs_detected используй только: "yes", "no".
        - Для status-полей (*_defined) используй только: "defined", "not_defined".
        - Fallback при отсутствии признаков:
          * labor_signs_detected → "no";
          * labor_signs_detected_display → "Нет, признаки не обнаружены";
          * labor_signs_summary → "Признаки не обнаружены".
        - Fallback при противоречии:
          * labor_signs_summary → краткое описание противоречия.
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "labor_requalification_risk_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие признаков трудовых отношений. Внутреннее агрегатное signal-поле."
          required: true

        - name: "labor_signs_detected"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values:
            - "yes"
            - "no"
          description: "Обнаружены ли в тексте признаки, характерные для трудовых отношений. Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "labor_signs_detected_display"
          type: "string"
          presentation: "fact"
          label: "Риск переквалификации"
          description: >
            User-friendly описание наличия признаков трудовых отношений. Fallback: "Не установлено" / "Не удалось определить".
          required: true
          display_in_grid: true
          display_priority: 1

        - name: "labor_signs_summary"
          type: "string"
          presentation: "fact"
          label: "Признаки трудовых отношений"
          description: >
            Краткое описание обнаруженных признаков. Fallback: "Не установлено" / "Не удалось определить".
          required: false
          display_in_grid: true
          display_priority: 2

        - name: "schedule_subordination_defined"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values:
            - "defined"
            - "not_defined"
          description: "Есть ли подчинение режиму / ПВТР / графику. Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "workplace_defined"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values:
            - "defined"
            - "not_defined"
          description: "Есть ли указание на рабочее место. Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "labor_function_defined"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values:
            - "defined"
            - "not_defined"
          description: "Есть ли формулировка трудовой функции вместо конкретного результата. Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "fixed_periodic_payment_defined"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values:
            - "defined"
            - "not_defined"
          description: "Есть ли фиксированная периодическая выплата. Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "manager_subordination_defined"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values:
            - "defined"
            - "not_defined"
          description: "Есть ли подчиненность руководителю / менеджеру заказчика. Внутреннее enum-поле."
          required: true
          display_in_grid: false
      store_payload: true

  - id: subscription_take_or_pay_check
    name: "Абонентский договор: take-or-pay (ст. 429.4 ГК РФ)"
    description: >
      Фактографическая проверка наличия в договоре абонентской модели,
      условия take-or-pay, фиксированного платежа и возвратности
      неиспользованного объёма. Результат предназначен для табличного
      сравнения нескольких договоров.
    triggers:
      any: ["subscription_model"]
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "абонентская плата"
        - "абонентский"
        - "независимо от фактического объёма"
        - "фиксированный платёж"
        - "подписка"
        - "take or pay"
        - "ст. 429.4"
        - "оплата за доступ"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)абонентск(ая|ой|ую)\\s+плат"
        - "(?i)независимо\\s+от\\s+фактическ"
        - "(?i)ст\\.?\\s*429\\.?4"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор возмездного оказания услуг.
        Проверяется только один вопрос: является ли договор абонентским
        (ст. 429.4 ГК РФ), есть ли условие take-or-pay, размер фиксированного
        платежа и порядок возврата за неиспользованные услуги.

        Нормативный ориентир:
        - ст. 429.4 ГК РФ — абонентский договор

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора, а чего прямо нет.
        - Не оценивай серьёзность риска.
        - Юрист будет использовать результат в сравнительной таблице.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Является ли договор абонентским.
        2. Есть ли условие take-or-pay.
        3. Какой размер фиксированного платежа.
        4. Возвращается ли оплата за неиспользованные услуги.
        5. Как описана модель оплаты.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Если условие не указано прямо:
           - для статусных полей (*_present, *_clause) возвращай "not_defined";
           - для enum-полей (unused_services_refundable) возвращай "not_defined";
           - для текстовых полей (fixed_fee_amount, subscription_model_summary) возвращай "Не установлено".
        4. Строго запрещено использовать "None", "null", "not_defined" (в текстовых полях) или пустые строки "".
        5. subscription_model_present_display:
           - Если subscription_model_present = "defined" — "Да".
           - Если "not_defined" — "Нет".
        6. take_or_pay_clause_display:
           - Если take_or_pay_clause = "defined" — "Да".
           - Если "not_defined" — "Нет".
        7. unused_services_refundable_display:
           - Если unused_services_refundable = "yes" — "Да, возвращается".
           - Если "no" — "Нет, не возвращается".
           - Если "not_defined" — "Не определено".
        8. Не считай любую периодическую оплату абонентской — нужно прямое указание на независимость платежа от объёма потреблённых услуг.
        9. Если фиксированный платёж определяется по прайс-листу/спецификации/приложению — укажи это в fixed_fee_amount.
        10. В evidence включай только точный текст договора.
        11. Верни только один валидный JSON-объект, содержащий все указанные ключи.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — абонентский договор с невозвратным неиспользованным объёмом:
        Фрагмент:
        "Настоящий договор является абонентским (ст. 429.4 ГК РФ). Заказчик
        ежемесячно уплачивает абонентскую плату в размере 100 000 рублей
        независимо от объёма фактически потреблённых услуг. Неиспользованный
        объём услуг возврату не подлежит."

        Ответ:
        {
          "subscription_model_present": "defined",
          "subscription_model_present_display": "Да",
          "take_or_pay_clause": "defined",
          "take_or_pay_clause_display": "Да",
          "fixed_fee_amount": "100 000 рублей в месяц",
          "unused_services_refundable": "no",
          "unused_services_refundable_display": "Нет, не возвращается",
          "subscription_model_summary": "абонентский договор по ст. 429.4 ГК РФ; абонентская плата 100 000 рублей в месяц независимо от объёма; неиспользованный объём возврату не подлежит",
          "evidence": [
            {
              "clause_ref": "п. 1.2",
              "quote": "Настоящий договор является абонентским (ст. 429.4 ГК РФ). Заказчик ежемесячно уплачивает абонентскую плату в размере 100 000 рублей независимо от объёма фактически потреблённых услуг. Неиспользованный объём услуг возврату не подлежит."
            }
          ]
        }

        Пример 2 — абонентский договор с возвратным неиспользованным объёмом:
        Фрагмент:
        "Заказчик уплачивает ежемесячную абонентскую плату в размере 50 000 рублей.
        Неиспользованный объём услуг переносится на следующий месяц или возвращается
        Заказчику по его заявлению."

        Ответ:
        {
          "subscription_model_present": "defined",
          "subscription_model_present_display": "Да",
          "take_or_pay_clause": "not_defined",
          "take_or_pay_clause_display": "Нет",
          "fixed_fee_amount": "50 000 рублей в месяц",
          "unused_services_refundable": "yes",
          "unused_services_refundable_display": "Да, возвращается",
          "subscription_model_summary": "ежемесячная абонентская плата 50 000 рублей; неиспользованный объём переносится на следующий месяц или возвращается по заявлению",
          "evidence": [
            {
              "clause_ref": "п. 3.1",
              "quote": "Заказчик уплачивает ежемесячную абонентскую плату в размере 50 000 рублей. Неиспользованный объём услуг переносится на следующий месяц или возвращается Заказчику по его заявлению."
            }
          ]
        }

        Пример 3 — фиксированный платёж определяется по прайс-листу:
        Фрагмент:
        "Размер абонентской платы определяется согласно Прайс-листу (Приложение № 2).
        Оплата производится ежемесячно независимо от фактического объёма услуг."

        Ответ:
        {
          "subscription_model_present": "defined",
          "subscription_model_present_display": "Да",
          "take_or_pay_clause": "not_defined",
          "take_or_pay_clause_display": "Нет",
          "fixed_fee_amount": "Определяется по Прайс-листу (Приложение № 2)",
          "unused_services_refundable": "not_defined",
          "unused_services_refundable_display": "Не определено",
          "subscription_model_summary": "абонентская плата определяется по Прайс-листу (Приложение № 2); оплата ежемесячно независимо от объёма",
          "evidence": [
            {
              "clause_ref": "п. 2.1",
              "quote": "Размер абонентской платы определяется согласно Прайс-листу (Приложение № 2). Оплата производится ежемесячно независимо от фактического объёма услуг."
            }
          ]
        }

        Пример 4 — данные отсутствуют:
        Фрагмент:
        "Оплата производится по фактически оказанным услугам."

        Ответ:
        {
          "subscription_model_present": "not_defined",
          "subscription_model_present_display": "Нет",
          "take_or_pay_clause": "not_defined",
          "take_or_pay_clause_display": "Нет",
          "fixed_fee_amount": "Не установлено",
          "unused_services_refundable": "not_defined",
          "unused_services_refundable_display": "Не определено",
          "subscription_model_summary": "Не установлено",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Есть ли прямое указание на абонентский характер договора (ст. 429.4 ГК РФ или аналог).
        2. Есть ли прямое указание на независимость платежа от объёма.
        3. Есть ли прямое указание на размер фиксированного платежа.
        4. Есть ли прямое указание на возвратность неиспользованных услуг.
        5. Если фиксированный платёж определяется по прайс-листу/приложению — это не "Не установлено", а "Определяется по ...".
        6. Если прямой цитаты нет — верни "not_defined" для статусов/enum и "Не установлено" для текста. Не додумывай условия.

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        {
          "subscription_model_present": "<defined / not_defined>",
          "subscription_model_present_display": "<Да / Нет>",
          "take_or_pay_clause": "<defined / not_defined>",
          "take_or_pay_clause_display": "<Да / Нет>",
          "fixed_fee_amount": "<текст / 'Определяется по ...' / 'Не установлено'>",
          "unused_services_refundable": "<yes / no / not_defined>",
          "unused_services_refundable_display": "<Да, возвращается / Нет, не возвращается / Не определено>",
          "subscription_model_summary": "<текст или 'Не установлено'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 4
      temperature: 0.0
      max_tokens: 620

    retrieval:
      retrieval_profile: "payment_terms_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "абонентская плата абонентский договор независимо от объёма фиксированный платёж take or pay ст. 429.4 неиспользованный объём подписка прайс-лист приложение"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - technical_fragment
        - structural_anchor
        - definition
      preferred_clause_functions:
        - obligations
      negative_keywords:
        - "неустойка"
        - "форс-мажор"
        - "персональные данные"
      position_bias:
        preferred_range: [0.10, 0.50]
        boost: 0.16
        scope: segment
      context_k: 4
      max_chunks: 6
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - obligations
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 650

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 600

      compact_output: false

      presence_signal:
        field: "subscription_take_or_pay_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора условия об абонентской
        модели, take-or-pay, фиксированном платеже и возвратности за неиспользованные
        услуги. Не анализируй санкции, сроки, форс-мажор или споры.
        Не оценивай риски. Анализируй только текст договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. subscription_take_or_pay_check_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (subscription_model_present, take_or_pay_clause,
              unused_services_refundable) ≠ "not_defined";
           - "missing" — если все три содержательных поля = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - subscription_model_present = "not_defined";
           - take_or_pay_clause = "not_defined";
           - unused_services_refundable = "not_defined";
           - subscription_model_present_display = "Нет";
           - take_or_pay_clause_display = "Нет";
           - fixed_fee_amount = "Не установлено";
           - unused_services_refundable_display = "Не определено";
           - subscription_model_summary = "Не установлено";
           - не выполняй остальные шаги.

        1. subscription_model_present:
           - "defined" — если в тексте прямо указано, что договор является
             абонентским (ст. 429.4 ГК РФ), или прямо указана абонентская
             плата, независимая от объёма потреблённых услуг;
           - "not_defined" — если абонентская модель прямо не указана.
           Важно: не считай любую периодическую оплату абонентской —
           нужно прямое указание на независимость платежа от объёма.

        2. subscription_model_present_display:
           - "Да" — если subscription_model_present = "defined";
           - "Нет" — если "not_defined".

        3. take_or_pay_clause:
           - "defined" — если прямо указано условие take-or-pay (оплата
             независимо от фактического потребления, обязанность оплатить
             минимальный объём);
           - "not_defined" — если take-or-pay прямо не указан.

        4. take_or_pay_clause_display:
           - "Да" — если take_or_pay_clause = "defined";
           - "Нет" — если "not_defined".

        5. fixed_fee_amount:
           Размер фиксированного абонентского платежа.
           - Если указан прямо — укажи сумму и период: "100 000 рублей в месяц".
           - Если определяется по документу — укажи:
             "Определяется по Прайс-листу (Приложение № 2)".
           - Если данных нет — "Не установлено".
           - Если данные противоречивы — "Не удалось определить".

        6. unused_services_refundable:
           - "yes" — прямо указано, что оплата за неиспользованные услуги
             возвращается или переносится;
           - "no" — прямо указано, что не возвращается;
           - "not_defined" — вопрос прямо не урегулирован.

        7. unused_services_refundable_display:
           - "Да, возвращается" — для yes;
           - "Нет, не возвращается" — для no;
           - "Не определено" — для not_defined.

        8. subscription_model_summary:
           Краткое user-facing описание абонентской модели.
           Если данных нет — "Не установлено".
           Если данные противоречивы — "Не удалось определить".
        </task>

        <context_rules>
        - Перед остальными полями заполни subscription_take_or_pay_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_present / *_clause / enum = "not_defined", все display / summary / amount = соответствующий fallback.
        - Используй только релевантные фрагменты контекста.
        - Не подставляй нормы закона, обычную практику или предположения вместо текста договора.
        - Не извлекай сведения о санкциях, сроках, форс-мажоре, спорах и иных нерелевантных темах.
        - Не считай любую периодическую оплату абонентской — нужно прямое указание на независимость платежа от объёма.
        - Если фиксированный платёж определяется по прайс-листу/приложению и это прямо видно из текста, отрази это в fixed_fee_amount.
        - Если в разных фрагментах указаны разные условия и конфликт нельзя разрешить по тексту: статус → "not_defined", текстовое поле → "Не удалось определить".
        - Не используй пустые строки.
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни абонентской модели, ни take-or-pay,
           ни фиксированного платежа.
           → presence = "missing";
             все *_present / *_clause / enum = "not_defined";
             все display / summary / amount = соответствующий fallback.

        2. Абонентская модель без take-or-pay.
           "Ежемесячная абонентская плата 50 000 рублей" без условия
           take-or-pay и без указания на возвратность.
           → presence = "present";
             subscription_model_present = "defined";
             take_or_pay_clause = "not_defined";
             unused_services_refundable = "not_defined".

        3. Противоречие в возвратности.
           В одной части — "неиспользованный объём возврату не подлежит",
           в другой — "переносится на следующий месяц".
           → presence = "unclear";
             unused_services_refundable = "not_defined";
             unused_services_refundable_display = "Не удалось определить".

        4. Оплата по факту без абонентской модели.
           "Оплата производится по фактически оказанным услугам по акту."
           → presence = "missing";
             все содержательные поля = "not_defined".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для subscription_take_or_pay_check_presence используй только: "present", "missing", "unclear".
        - Для status-полей (*_present, *_clause) используй только: "defined", "not_defined".
        - Для unused_services_refundable используй только: "yes", "no", "not_defined".
        - Fallback при отсутствии данных:
          * subscription_model_present_display → "Нет";
          * take_or_pay_clause_display → "Нет";
          * fixed_fee_amount → "Не установлено";
          * unused_services_refundable_display → "Не определено";
          * subscription_model_summary → "Не установлено".
        - Fallback при противоречии или неоднозначности:
          * все текстовые поля → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "subscription_take_or_pay_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования по абонентской модели/take-or-pay. Внутреннее агрегатное signal-поле."
          required: true

        - name: "subscription_model_present"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values:
            - "defined"
            - "not_defined"
          description: "Является ли договор абонентским. Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "subscription_model_present_display"
          type: "string"
          presentation: "fact"
          label: "Абонентский договор"
          description: >
            User-friendly описание наличия абонентской модели. Fallback: "Не установлено" / "Не удалось определить".
          required: true
          display_in_grid: true
          display_priority: 1

        - name: "take_or_pay_clause"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values:
            - "defined"
            - "not_defined"
          description: "Есть ли условие take-or-pay. Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "take_or_pay_clause_display"
          type: "string"
          presentation: "fact"
          label: "Take-or-pay"
          description: >
            User-friendly описание наличия условия take-or-pay. Fallback: "Не установлено" / "Не удалось определить".
          required: true
          display_in_grid: true
          display_priority: 2

        - name: "fixed_fee_amount"
          type: "string"
          presentation: "fact"
          label: "Фиксированный платёж"
          description: >
            Размер фиксированного абонентского платежа. Fallback: "Не установлено" / "Не удалось определить".
          required: false
          display_in_grid: true
          display_priority: 3

        - name: "unused_services_refundable"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values:
            - "yes"
            - "no"
            - "not_defined"
          description: "Возвращается ли оплата за неиспользованные услуги. Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "unused_services_refundable_display"
          type: "string"
          presentation: "fact"
          label: "Возврат неиспользованного"
          description: >
            User-friendly описание возвратности неиспользованного объёма. Fallback: "Не установлено" / "Не удалось определить".
          required: true
          display_in_grid: true
          display_priority: 4

        - name: "subscription_model_summary"
          type: "string"
          presentation: "fact"
          label: "Абонентская модель"
          description: >
            Краткое описание абонентской модели договора. Fallback: "Не установлено" / "Не удалось определить".
          required: false
          display_in_grid: true
          display_priority: 5
      store_payload: true

  - id: success_fee_validity_check
    name: "Гонорар успеха / success fee: допустимость и оформление"
    description: >
      Фактографическая проверка наличия в договоре условия о гонораре успеха,
      события-триггера, размера и типа услуг. Результат предназначен для
      табличного сравнения нескольких договоров.
    triggers:
      any: ["success_fee"]
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "гонорар успеха"
        - "success fee"
        - "вознаграждение за результат"
        - "премия за достижение"
        - "процент от выигранной суммы"
        - "бонус за результат"
        - "дополнительное вознаграждение в случае"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)(гонорар|вознагражден|прем).*успех"
        - "(?i)success\\s*fee"
        - "(?i)процент.*от.*(выигр|экономи|суммы\\s+иска)"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор возмездного оказания услуг.
        Проверяется только один вопрос: есть ли в договоре условие о гонораре
        успеха (success fee), событие-триггер, размер и тип услуг.

        Нормативный ориентир:
        - ИП ВАС РФ № 48
        - определение КС РФ № 1-П от 23.01.2007
        - общие положения о вознаграждении за услуги

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора, а чего прямо нет.
        - Не оценивай допустимость или оспоримость конструкции.
        - Юрист будет использовать результат в сравнительной таблице.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Есть ли условие о гонораре успеха.
        2. Какое событие является триггером гонорара.
        3. Какой размер гонорара успеха.
        4. К какому типу услуг относится гонорар.
        5. Как описано условие о гонораре успеха.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Если условие не указано прямо:
           - для статусных полей (*_present) возвращай "not_defined";
           - для enum-полей (service_type_for_fee) возвращай "not_defined";
           - для текстовых полей (success_fee_trigger, success_fee_amount, success_fee_summary) возвращай "Не установлено".
        4. Строго запрещено использовать "None", "null", "not_defined" (в текстовых полях) или пустые строки "".
        5. success_fee_present_display:
           - Если success_fee_present = "defined" — "Да".
           - Если "not_defined" — "Нет".
        6. service_type_for_fee_display:
           - Если service_type_for_fee = "legal" — "Юридические услуги".
           - Если "consulting" — "Консалтинг".
           - Если "marketing" — "Маркетинг / реклама".
           - Если "other" — укажи конкретный тип из текста (например, "IT-услуги").
           - Если "not_defined" — "Не определено".
        7. Не путай гонорар успеха с обычным бонусом за своевременное исполнение или с неустойкой в пользу исполнителя.
        8. Если размер гонорара определяется по приложению/соглашению/регламенту — укажи это в success_fee_amount.
        9. В evidence включай только точный текст договора.
        10. Верни только один валидный JSON-объект, содержащий все указанные ключи.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — юридический гонорар успеха:
        Фрагмент:
        "В случае положительного решения суда в пользу Заказчика Исполнитель
        получает дополнительное вознаграждение в размере 10% от присуждённой
        суммы."

        Ответ:
        {
          "success_fee_present": "defined",
          "success_fee_present_display": "Да",
          "success_fee_trigger": "положительное решение суда в пользу Заказчика",
          "success_fee_amount": "10% от присуждённой суммы",
          "service_type_for_fee": "legal",
          "service_type_for_fee_display": "Юридические услуги",
          "success_fee_summary": "гонорар успеха в размере 10% от присуждённой суммы при положительном решении суда; тип услуг — юридические",
          "evidence": [
            {
              "clause_ref": "п. 4.3",
              "quote": "В случае положительного решения суда в пользу Заказчика Исполнитель получает дополнительное вознаграждение в размере 10% от присуждённой суммы."
            }
          ]
        }

        Пример 2 — консалтинговый гонорар успеха (M&A):
        Фрагмент:
        "В случае успешного закрытия сделки по приобретению целевой компании
        Исполнитель получает премию в размере 2% от стоимости сделки, но не
        менее 500 000 рублей."

        Ответ:
        {
          "success_fee_present": "defined",
          "success_fee_present_display": "Да",
          "success_fee_trigger": "успешное закрытие сделки по приобретению целевой компании",
          "success_fee_amount": "2% от стоимости сделки, но не менее 500 000 рублей",
          "service_type_for_fee": "consulting",
          "service_type_for_fee_display": "Консалтинг",
          "success_fee_summary": "премия за успешное закрытие сделки M&A в размере 2% от стоимости, но не менее 500 000 рублей; тип услуг — консалтинг",
          "evidence": [
            {
              "clause_ref": "п. 5.2",
              "quote": "В случае успешного закрытия сделки по приобретению целевой компании Исполнитель получает премию в размере 2% от стоимости сделки, но не менее 500 000 рублей."
            }
          ]
        }

        Пример 3 — размер определяется по соглашению:
        Фрагмент:
        "Размер гонорара успеха определяется сторонами в Дополнительном соглашении
        № 1 к настоящему договору в зависимости от достигнутого результата."

        Ответ:
        {
          "success_fee_present": "defined",
          "success_fee_present_display": "Да",
          "success_fee_trigger": "Не установлено",
          "success_fee_amount": "Определяется по Дополнительному соглашению № 1",
          "service_type_for_fee": "not_defined",
          "service_type_for_fee_display": "Не определено",
          "success_fee_summary": "гонорар успеха, размер определяется по Дополнительному соглашению № 1",
          "evidence": [
            {
              "clause_ref": "п. 6.1",
              "quote": "Размер гонорара успеха определяется сторонами в Дополнительном соглашении № 1 к настоящему договору в зависимости от достигнутого результата."
            }
          ]
        }

        Пример 4 — данные отсутствуют:
        Фрагмент:
        "Вознаграждение Исполнителя составляет 500 000 рублей."

        Ответ:
        {
          "success_fee_present": "not_defined",
          "success_fee_present_display": "Нет",
          "success_fee_trigger": "Не установлено",
          "success_fee_amount": "Не установлено",
          "service_type_for_fee": "not_defined",
          "service_type_for_fee_display": "Не определено",
          "success_fee_summary": "Не установлено",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Есть ли прямое условие о дополнительном вознаграждении, привязанном к результату (не просто бонус за своевременность).
        2. Есть ли прямое указание на событие-триггер.
        3. Есть ли прямое указание на размер.
        4. Если размер определяется по приложению/соглашению — это не "Не установлено", а "Определяется по ...".
        5. Если прямой цитаты нет — верни "not_defined" для статусов/enum и "Не установлено" для текста. Не додумывай условия.

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        {
          "success_fee_present": "<defined / not_defined>",
          "success_fee_present_display": "<Да / Нет>",
          "success_fee_trigger": "<текст или 'Не установлено'>",
          "success_fee_amount": "<текст / 'Определяется по ...' / 'Не установлено'>",
          "service_type_for_fee": "<legal / consulting / marketing / other / not_defined>",
          "service_type_for_fee_display": "<Юридические услуги / Консалтинг / Маркетинг / реклама / конкретный тип / Не определено>",
          "success_fee_summary": "<текст или 'Не установлено'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 5
      temperature: 0.0
      max_tokens: 650

    retrieval:
      retrieval_profile: "payment_terms_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "гонорар успеха success fee вознаграждение за результат премия за достижение процент от суммы дополнительное вознаграждение в случае сделка"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - technical_fragment
        - structural_anchor
        - definition
      preferred_clause_functions:
        - obligations
      negative_keywords:
        - "неустойка"
        - "форс-мажор"
        - "персональные данные"
      position_bias:
        preferred_range: [0.15, 0.55]
        boost: 0.16
        scope: segment
      context_k: 5
      max_chunks: 7
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - obligations
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 650

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 650

      compact_output: false

      presence_signal:
        field: "success_fee_validity_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора условие о гонораре
        успеха, событие-триггер, размер и тип услуг. Не оценивай допустимость
        или оспоримость конструкции. Не анализируй цену, санкции или споры.
        Не оценивай риски. Анализируй только текст договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. success_fee_validity_check_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (success_fee_present, service_type_for_fee) ≠ "not_defined";
           - "missing" — если оба содержательных поля = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - success_fee_present = "not_defined";
           - service_type_for_fee = "not_defined";
           - success_fee_present_display = "Нет";
           - success_fee_trigger = "Не установлено";
           - success_fee_amount = "Не установлено";
           - service_type_for_fee_display = "Не определено";
           - success_fee_summary = "Не установлено";
           - не выполняй остальные шаги.

        1. success_fee_present:
           - "defined" — если в тексте прямо указано условие о гонораре
             успеха (дополнительное вознаграждение, привязанное к
             конкретному результату-событию: success fee, премия за
             достижение, процент от выигранной суммы);
           - "not_defined" — если гонорар успеха прямо не указан.
           Важно: не путай с обычным бонусом за своевременное исполнение
           или с неустойкой в пользу исполнителя.

        2. success_fee_present_display:
           - "Да" — если success_fee_present = "defined";
           - "Нет" — если "not_defined".

        3. success_fee_trigger:
           Событие, при наступлении которого возникает гонорар.
           Пример: "положительное решение суда", "успешное закрытие сделки".
           Если данных нет — "Не установлено".
           Если данные противоречивы — "Не удалось определить".

        4. success_fee_amount:
           Размер гонорара успеха.
           - Если указан прямо — укажи: "10% от присуждённой суммы".
           - Если определяется по документу — укажи:
             "Определяется по Дополнительному соглашению № 1".
           - Если данных нет — "Не установлено".
           - Если данные противоречивы — "Не удалось определить".

        5. service_type_for_fee:
           Тип услуг, к которым привязан гонорар. Используй только:
           - "legal" — юридические услуги, представительство в суде;
           - "consulting" — консалтинг, M&A, аудит, Due Diligence;
           - "marketing" — маркетинг, реклама, продвижение;
           - "other" — иной тип, прямо указанный в тексте;
           - "not_defined" — тип прямо не определён.

        6. service_type_for_fee_display:
           User-friendly маппинг:
           - legal → "Юридические услуги"
           - consulting → "Консалтинг"
           - marketing → "Маркетинг / реклама"
           - other → конкретный тип из текста
           - not_defined → "Не определено"

        7. success_fee_summary:
           Краткое user-facing описание условия о гонораре успеха.
           Если данных нет — "Не установлено".
           Если данные противоречивы — "Не удалось определить".
        </task>

        <context_rules>
        - Перед остальными полями заполни success_fee_validity_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_present / enum = "not_defined", все display / summary / trigger / amount = соответствующий fallback.
        - Используй только релевантные фрагменты контекста.
        - Не подставляй нормы закона, обычную практику или предположения вместо текста договора.
        - Не оценивай допустимость или оспоримость конструкции гонорара успеха.
        - Не извлекай сведения о базовой цене, санкциях, спорах и иных нерелевантных темах.
        - Не путай гонорар успеха (привязан к результату-событию) с обычным бонусом за своевременность или неустойкой.
        - Если размер определяется по приложению/соглашению и это прямо видно из текста, отрази в success_fee_amount.
        - Если в разных фрагментах указаны разные триггеры или размеры и конфликт нельзя разрешить по тексту: статус → "not_defined", текстовое поле → "Не удалось определить".
        - Не используй пустые строки.
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни гонорара успеха, ни success fee,
           ни привязки вознаграждения к результату.
           → presence = "missing";
             все *_present / enum = "not_defined";
             все display / summary / trigger / amount = соответствующий fallback.

        2. Гонорар есть, но триггер и размер не раскрыты.
           "Исполнителю выплачивается гонорар успеха по результатам
           оказания услуг" без конкретики.
           → presence = "present";
             success_fee_present = "defined";
             success_fee_trigger = "Не установлено";
             success_fee_amount = "Не установлено";
             service_type_for_fee = "not_defined".

        3. Противоречие в размере.
           В одной части — "10% от суммы", в другой — "5% от суммы".
           → presence = "unclear";
             success_fee_present = "defined";
             success_fee_amount = "Не удалось определить".

        4. Бонус за своевременность (не success fee).
           "При сдаче работ в срок Исполнитель получает бонус 5% от
           стоимости этапа."
           → presence = "missing";
             success_fee_present = "not_defined"
             (бонус за своевременность ≠ гонорар за результат).
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для success_fee_validity_check_presence используй только: "present", "missing", "unclear".
        - Для success_fee_present используй только: "defined", "not_defined".
        - Для service_type_for_fee используй только: "legal", "consulting", "marketing", "other", "not_defined".
        - Fallback при отсутствии данных:
          * success_fee_present_display → "Нет";
          * success_fee_trigger → "Не установлено";
          * success_fee_amount → "Не установлено";
          * service_type_for_fee_display → "Не определено";
          * success_fee_summary → "Не установлено".
        - Fallback при противоречии или неоднозначности:
          * все текстовые поля → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "success_fee_validity_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования по гонорару успеха. Внутреннее агрегатное signal-поле."
          required: true

        - name: "success_fee_present"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values:
            - "defined"
            - "not_defined"
          description: "Есть ли условие о гонораре успеха. Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "success_fee_present_display"
          type: "string"
          presentation: "fact"
          label: "Гонорар успеха"
          description: >
            User-friendly описание наличия условия о гонораре успеха. Fallback: "Не установлено" / "Не удалось определить".
          required: true
          display_in_grid: true
          display_priority: 1

        - name: "success_fee_trigger"
          type: "string"
          presentation: "fact"
          label: "Триггер гонорара"
          description: >
            Событие, при наступлении которого возникает гонорар успеха. Fallback: "Не установлено" / "Не удалось определить".
          required: false
          display_in_grid: true
          display_priority: 2

        - name: "success_fee_amount"
          type: "string"
          presentation: "fact"
          label: "Размер гонорара"
          description: >
            Размер гонорара успеха. Fallback: "Не установлено" / "Не удалось определить".
          required: false
          display_in_grid: true
          display_priority: 3

        - name: "service_type_for_fee"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values:
            - "legal"
            - "consulting"
            - "marketing"
            - "other"
            - "not_defined"
          description: "Тип услуг, к которым привязан гонорар успеха. Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "service_type_for_fee_display"
          type: "string"
          presentation: "fact"
          label: "Тип услуг"
          description: >
            User-friendly описание типа услуг, к которым привязан гонорар успеха. Fallback: "Не установлено" / "Не удалось определить".
          required: true
          display_in_grid: true
          display_priority: 4

        - name: "success_fee_summary"
          type: "string"
          presentation: "fact"
          label: "Описание гонорара успеха"
          description: >
            Краткое описание условия о гонораре успеха. Fallback: "Не установлено" / "Не удалось определить".
          required: false
          display_in_grid: true
          display_priority: 5
      store_payload: true

  - id: service_risk_allocation_check
    name: "Невозможность исполнения и простой (ст. 781 п. 2–3 ГК РФ)"
    description: >
      Фактографическая проверка наличия в договоре условий о распределении
      рисков при невозможности оказания услуг и при простое по вине заказчика.
      Результат предназначен для табличного сравнения нескольких договоров.
    triggers:
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "невозможность исполнения"
        - "невозможность оказания услуг"
        - "ни одна сторона не отвечает"
        - "фактически понесённые расходы"
        - "пропорциональная оплата"
        - "по вине заказчика"
        - "оплата простоя"
        - "компенсация за простой"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)невозможност(ь|и)\\s+(исполнен|оказан)"
        - "(?i)ни\\s+одна\\s+(из\\s+)?сторон.*не\\s+отвечает"
        - "(?i)по\\s+вине\\s+заказчик"
        - "(?i)оплат(а|е)\\s+простоя"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор возмездного оказания услуг.
        Проверяется только один вопрос: как распределены риски при невозможности
        оказания услуг не по вине сторон и при простое по вине заказчика.

        Нормативный ориентир:
        - ст. 781 п. 2 ГК РФ — простой по вине заказчика
        - ст. 781 п. 3 ГК РФ — невозможность исполнения
        - ст. 406 ГК РФ — просрочка кредитора

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора, а чего прямо нет.
        - Не оценивай серьёзность риска.
        - Юрист будет использовать результат в сравнительной таблице.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Есть ли условие о невозможности исполнения.
        2. Как распределены расходы при невозможности.
        3. Есть ли условие о простое по вине заказчика.
        4. Как описана компенсация за простой.
        5. Как описано распределение рисков.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Если условие не указано прямо:
           - для статусных полей (*_present) возвращай "not_defined";
           - для enum-полей (*_allocation, *_payment) возвращай "not_defined";
           - для текстовых полей (risk_allocation_summary) возвращай "Не установлено".
        4. Строго запрещено использовать "None", "null", "not_defined" (в текстовых полях) или пустые строки "".
        5. impossibility_clause_present_display:
           - Если impossibility_clause_present = "defined" — "Да".
           - Если "not_defined" — "Нет".
        6. impossibility_cost_allocation_display:
           - Если impossibility_cost_allocation = "actual_expenses" — "Фактические расходы".
           - Если "proportional" — "Пропорционально оказанному объёму".
           - Если "full_price" — "Полная оплата".
           - Если "no_payment" — "Не возмещаются".
           - Если "not_defined" — "Не определено".
        7. client_fault_downtime_payment_display:
           - Если client_fault_downtime_payment = "full_price" — "Полная оплата".
           - Если "partial" — "Частичная оплата".
           - Если "not_defined" — "Не определено".
        8. Не путай форс-мажор с невозможностью исполнения по ст. 781 п. 3 ГК РФ.
        9. Если распределение расходов определяется по приложению/регламенту — укажи это в risk_allocation_summary.
        10. В evidence включай только точный текст договора.
        11. Верни только один валидный JSON-объект, содержащий все указанные ключи.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — оба условия определены:
        Фрагмент:
        "При невозможности оказания услуг по обстоятельствам, за которые ни одна
        сторона не отвечает, Заказчик оплачивает фактически понесённые расходы
        Исполнителя. При неоказании услуг по вине Заказчика услуги подлежат оплате
        в полном объёме."

        Ответ:
        {
          "impossibility_clause_present": "defined",
          "impossibility_clause_present_display": "Да",
          "impossibility_cost_allocation": "actual_expenses",
          "impossibility_cost_allocation_display": "Фактические расходы",
          "client_fault_downtime_clause_present": "defined",
          "client_fault_downtime_payment": "full_price",
          "client_fault_downtime_payment_display": "Полная оплата",
          "risk_allocation_summary": "при невозможности — фактические расходы; при простое по вине заказчика — полная оплата",
          "evidence": [
            {
              "clause_ref": "п. 5.4",
              "quote": "При невозможности оказания услуг по обстоятельствам, за которые ни одна сторона не отвечает, Заказчик оплачивает фактически понесённые расходы Исполнителя. При неоказании услуг по вине Заказчика услуги подлежат оплате в полном объёме."
            }
          ]
        }

        Пример 2 — частичное регулирование (только невозможность):
        Фрагмент:
        "При невозможности оказания услуг по обстоятельствам, не зависящим от воли
        сторон, Заказчик оплачивает Исполнителю фактически понесённые расходы
        пропорционально выполненному объёму услуг."

        Ответ:
        {
          "impossibility_clause_present": "defined",
          "impossibility_clause_present_display": "Да",
          "impossibility_cost_allocation": "proportional",
          "impossibility_cost_allocation_display": "Пропорционально оказанному объёму",
          "client_fault_downtime_clause_present": "not_defined",
          "client_fault_downtime_payment": "not_defined",
          "client_fault_downtime_payment_display": "Не определено",
          "risk_allocation_summary": "при невозможности — фактические расходы пропорционально выполненному объёму; простой по вине заказчика не урегулирован",
          "evidence": [
            {
              "clause_ref": "п. 6.2",
              "quote": "При невозможности оказания услуг по обстоятельствам, не зависящим от воли сторон, Заказчик оплачивает Исполнителю фактически понесённые расходы пропорционально выполненному объёму услуг."
            }
          ]
        }

        Пример 3 — распределение определяется по приложению:
        Фрагмент:
        "Порядок распределения рисков при невозможности оказания услуг и при простое
        по вине Заказчика определяется согласно Приложению № 3 (Регламент
        распределения рисков)."

        Ответ:
        {
          "impossibility_clause_present": "defined",
          "impossibility_clause_present_display": "Да",
          "impossibility_cost_allocation": "not_defined",
          "impossibility_cost_allocation_display": "Не определено",
          "client_fault_downtime_clause_present": "defined",
          "client_fault_downtime_payment": "not_defined",
          "client_fault_downtime_payment_display": "Не определено",
          "risk_allocation_summary": "Определяется по Приложению № 3 (Регламент распределения рисков)",
          "evidence": [
            {
              "clause_ref": "п. 7.1",
              "quote": "Порядок распределения рисков при невозможности оказания услуг и при простое по вине Заказчика определяется согласно Приложению № 3 (Регламент распределения рисков)."
            }
          ]
        }

        Пример 4 — данные отсутствуют:
        Фрагмент:
        "Стороны несут ответственность в соответствии с законодательством."

        Ответ:
        {
          "impossibility_clause_present": "not_defined",
          "impossibility_clause_present_display": "Нет",
          "impossibility_cost_allocation": "not_defined",
          "impossibility_cost_allocation_display": "Не определено",
          "client_fault_downtime_clause_present": "not_defined",
          "client_fault_downtime_payment": "not_defined",
          "client_fault_downtime_payment_display": "Не определено",
          "risk_allocation_summary": "Не установлено",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Есть ли прямое условие о невозможности исполнения (не путать с форс-мажором).
        2. Есть ли прямое указание на распределение расходов при невозможности.
        3. Есть ли прямое условие о простое по вине заказчика.
        4. Есть ли прямое указание на размер оплаты при простое.
        5. Если распределение определяется по приложению/регламенту — это не "Не установлено", а "Определяется по ...".
        6. Если прямой цитаты нет — верни "not_defined" для статусов/enum и "Не установлено" для текста. Не додумывай условия.

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        {
          "impossibility_clause_present": "<defined / not_defined>",
          "impossibility_clause_present_display": "<Да / Нет>",
          "impossibility_cost_allocation": "<actual_expenses / proportional / full_price / no_payment / not_defined>",
          "impossibility_cost_allocation_display": "<Фактические расходы / Пропорционально оказанному объёму / Полная оплата / Не возмещаются / Не определено>",
          "client_fault_downtime_clause_present": "<defined / not_defined>",
          "client_fault_downtime_payment": "<full_price / partial / not_defined>",
          "client_fault_downtime_payment_display": "<Полная оплата / Частичная оплата / Не определено>",
          "risk_allocation_summary": "<текст / 'Определяется по ...' / 'Не установлено'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 5
      temperature: 0.0
      max_tokens: 650

    retrieval:
      retrieval_profile: "liability_cap_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "невозможность исполнения невозможность оказания услуг ни одна сторона не отвечает фактически понесённые расходы по вине заказчика оплата простоя компенсация за простой приложение регламент"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - technical_fragment
        - structural_anchor
        - definition
      preferred_clause_functions:
        - obligations
      negative_keywords:
        - "форс-мажор"
        - "неустойка"
        - "подсудность"
      position_bias:
        preferred_range: [0.35, 0.80]
        boost: 0.16
        scope: segment
      context_k: 5
      max_chunks: 7
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "price_list"
        - "technical_specification"
      preferred_clause_functions:
        - obligations
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 650

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 600

      compact_output: false

      presence_signal:
        field: "service_risk_allocation_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора условия о невозможности
        исполнения, простое по вине заказчика и распределении расходов.
        Не анализируй цену, санкции, форс-мажор или споры.
        Не оценивай риски. Анализируй только текст договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. service_risk_allocation_check_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (impossibility_clause_present, impossibility_cost_allocation,
              client_fault_downtime_clause_present,
              client_fault_downtime_payment) ≠ "not_defined";
           - "missing" — если все четыре содержательных поля = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - impossibility_clause_present = "not_defined";
           - impossibility_cost_allocation = "not_defined";
           - client_fault_downtime_clause_present = "not_defined";
           - client_fault_downtime_payment = "not_defined";
           - impossibility_clause_present_display = "Нет";
           - impossibility_cost_allocation_display = "Не определено";
           - client_fault_downtime_payment_display = "Не определено";
           - risk_allocation_summary = "Не установлено";
           - не выполняй остальные шаги.

        1. impossibility_clause_present:
           - "defined" — если в тексте прямо указано условие о невозможности
             оказания услуг по обстоятельствам, за которые ни одна сторона
             не отвечает (ст. 781 п. 3 ГК РФ);
           - "not_defined" — если условие прямо не указано.
           Важно: не путай с форс-мажором (ст. 401 ГК РФ) — это отдельный
           институт.

        2. impossibility_clause_present_display:
           - "Да" — если impossibility_clause_present = "defined";
           - "Нет" — если "not_defined".

        3. impossibility_cost_allocation:
           Распределение расходов при невозможности. Используй только:
           - "actual_expenses" — заказчик оплачивает фактически понесённые
             расходы исполнителя;
           - "proportional" — оплата пропорционально оказанному объёму;
           - "full_price" — полная оплата независимо от выполнения;
           - "no_payment" — расходы не возмещаются;
           - "not_defined" — условие упомянуто, но формула не раскрыта,
             либо прямо не определено.

        4. impossibility_cost_allocation_display:
           User-friendly маппинг:
           - actual_expenses → "Фактические расходы"
           - proportional → "Пропорционально оказанному объёму"
           - full_price → "Полная оплата"
           - no_payment → "Не возмещаются"
           - not_defined → "Не определено"

        5. client_fault_downtime_clause_present:
           - "defined" — если в тексте прямо указано условие о простое
             (неоказании услуг) по вине заказчика (ст. 781 п. 2 ГК РФ);
           - "not_defined" — если условие прямо не указано.

        6. client_fault_downtime_payment:
           Порядок оплаты при простое по вине заказчика. Используй только:
           - "full_price" — полная оплата услуг;
           - "partial" — частичная оплата;
           - "not_defined" — простой упомянут, но размер не раскрыт,
             либо прямо не определено.

        7. client_fault_downtime_payment_display:
           User-friendly маппинг:
           - full_price → "Полная оплата"
           - partial → "Частичная оплата"
           - not_defined → "Не определено"

        8. risk_allocation_summary:
           Краткое user-facing описание распределения рисков.
           - Если указано прямо — сформируй описание из текста.
           - Если определяется по документу — укажи:
             "Определяется по Приложению № 3 (Регламент распределения рисков)".
           - Если данных нет — "Не установлено".
           - Если данные противоречивы — "Не удалось определить".
        </task>

        <context_rules>
        - Перед остальными полями заполни service_risk_allocation_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_present / enum = "not_defined", все display = "Нет" / "Не определено", summary = "Не установлено".
        - Используй только релевантные фрагменты контекста.
        - Не подставляй нормы закона, обычную практику или предположения вместо текста договора.
        - Не извлекай сведения о цене, санкциях, форс-мажоре, спорах и иных нерелевантных темах.
        - Не путай форс-мажор с невозможностью исполнения по ст. 781 п. 3 ГК РФ — это разные институты.
        - Не путай просрочку оплаты с простоем по вине заказчика (простой — это невозможность оказания услуг из-за действий/бездействия заказчика).
        - Если распределение определяется по приложению/регламенту и это прямо видно из текста, отрази в risk_allocation_summary.
        - Если в разных фрагментах указаны разные условия и конфликт нельзя разрешить по тексту: статус → "not_defined", текстовое поле → "Не удалось определить".
        - Не используй пустые строки.
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни невозможности исполнения, ни простоя,
           ни распределения расходов.
           → presence = "missing";
             все *_present / enum = "not_defined";
             все display = "Нет" / "Не определено";
             summary = "Не установлено".

        2. Частичное регулирование — только невозможность.
           "При невозможности оказания услуг Заказчик оплачивает
           фактически понесённые расходы" без упоминания простоя.
           → presence = "present";
             impossibility_clause_present = "defined";
             impossibility_cost_allocation = "actual_expenses";
             client_fault_downtime_clause_present = "not_defined";
             client_fault_downtime_payment = "not_defined".

        3. Противоречие между фрагментами.
           В одной части — "фактически понесённые расходы",
           в другой — "полная оплата при невозможности".
           → presence = "unclear";
             impossibility_cost_allocation = "not_defined";
             risk_allocation_summary = "Не удалось определить".

        4. Отсылка на внешний документ.
           "Порядок распределения рисков определяется согласно
           Приложению № 3" без деталей в тексте договора.
           → presence = "present";
             impossibility_clause_present = "defined";
             impossibility_cost_allocation = "not_defined";
             risk_allocation_summary = "Определяется по Приложению № 3".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для service_risk_allocation_check_presence используй только: "present", "missing", "unclear".
        - Для *_present используй только: "defined", "not_defined".
        - Для impossibility_cost_allocation используй только: "actual_expenses", "proportional", "full_price", "no_payment", "not_defined".
        - Для client_fault_downtime_payment используй только: "full_price", "partial", "not_defined".
        - Fallback при отсутствии данных:
          * impossibility_clause_present_display → "Нет";
          * impossibility_cost_allocation_display → "Не определено";
          * client_fault_downtime_payment_display → "Не определено";
          * risk_allocation_summary → "Не установлено".
        - Fallback при противоречии или неоднозначности:
          * risk_allocation_summary → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "service_risk_allocation_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования по распределению рисков. Внутреннее агрегатное signal-поле."
          required: true

        - name: "impossibility_clause_present"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values:
            - "defined"
            - "not_defined"
          description: "Есть ли условие о невозможности исполнения. Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "impossibility_clause_present_display"
          type: "string"
          presentation: "fact"
          label: "Невозможность исполнения"
          description: >
            User-friendly описание наличия условия о невозможности исполнения. Fallback: "Не установлено" / "Не удалось определить".
          required: true
          display_in_grid: true
          display_priority: 1

        - name: "impossibility_cost_allocation"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values:
            - "actual_expenses"
            - "proportional"
            - "full_price"
            - "no_payment"
            - "not_defined"
          description: "Распределение расходов при невозможности. Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "impossibility_cost_allocation_display"
          type: "string"
          presentation: "fact"
          label: "Расходы при невозможности"
          description: >
            User-friendly описание распределения расходов при невозможности оказания услуг. Fallback: "Не установлено" / "Не удалось определить".
          required: true
          display_in_grid: true
          display_priority: 2

        - name: "client_fault_downtime_clause_present"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values:
            - "defined"
            - "not_defined"
          description: "Есть ли условие о простое по вине заказчика. Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "client_fault_downtime_payment"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values:
            - "full_price"
            - "partial"
            - "not_defined"
          description: "Порядок оплаты при простое по вине заказчика. Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "client_fault_downtime_payment_display"
          type: "string"
          presentation: "fact"
          label: "Оплата при простое"
          description: >
            User-friendly описание порядка оплаты при простое по вине заказчика. Fallback: "Не установлено" / "Не удалось определить".
          required: true
          display_in_grid: true
          display_priority: 3

        - name: "risk_allocation_summary"
          type: "string"
          presentation: "fact"
          label: "Распределение рисков"
          description: >
            Краткое описание распределения рисков при невозможности и простое. Fallback: "Не установлено" / "Не удалось определить".
          required: false
          display_in_grid: true
          display_priority: 4
      store_payload: true

  - id: cross_border_vat_place_check
    name: "Трансграничные услуги: место реализации для НДС (ст. 148 НК РФ)"
    description: >
      Фактографическая проверка наличия в договоре определения места реализации
      услуг при трансграничном оказании, оговорки о налоговом агенте и валютных
      условий. Результат предназначен для табличного сравнения нескольких договоров.
    triggers:
      any: ["cross_border_services"]
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "место реализации"
        - "место оказания услуг"
        - "налоговый агент"
        - "НДС при импорте услуг"
        - "ст. 148 НК РФ"
        - "иностранный исполнитель"
        - "нерезидент"
        - "валютный контроль"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)мест(о|а)\\s+(реализац|оказани)"
        - "(?i)налогов(ый|ого)\\s+агент"
        - "(?i)ст\\.?\\s*148\\s*НК"
        - "(?i)нерезидент"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор оказания услуг с иностранным элементом.
        Проверяется только один вопрос: определение места реализации для НДС,
        оговорка о налоговом агенте и валютные условия.

        Нормативный ориентир:
        - ст. 148 НК РФ — место реализации услуг
        - положения о налоговом агенте по НДС
        - валютное законодательство РФ

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора, а чего прямо нет.
        - Не оценивай серьёзность риска.
        - Юрист будет использовать результат в сравнительной таблице.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Есть ли иностранный элемент.
        2. Определено ли место реализации услуг.
        3. Есть ли оговорка о налоговом агенте.
        4. Указана ли валюта расчётов.
        5. Как описаны трансграничные условия.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Если условие не указано прямо:
           - для статусных полей (cross_border_detected) возвращай "no";
           - для статусных полей (*_defined, *_clause) возвращай "not_defined";
           - для текстовых полей (cross_border_summary) возвращай "Не установлено".
        4. Строго запрещено использовать "None", "null", "not_defined" (в текстовых полях) или пустые строки "".
        5. cross_border_detected_display:
           - Если cross_border_detected = "yes" — "Да".
           - Если "no" — "Нет".
        6. place_of_supply_defined_display:
           - Если place_of_supply_defined = "defined" — "Да".
           - Если "not_defined" — "Нет".
        7. tax_agent_clause_display:
           - Если tax_agent_clause = "defined" — "Да".
           - Если "not_defined" — "Нет".
        8. payment_currency_defined_display:
           - Если payment_currency_defined = "defined" — "Да".
           - Если "not_defined" — "Нет".
        9. Не считай договор трансграничным только из-за упоминания иностранной валюты — нужно прямое указание на иностранную сторону.
        10. Если место реализации определяется по приложению/соглашению — укажи это в cross_border_summary.
        11. В evidence включай только точный текст договора.
        12. Верни только один валидный JSON-объект, содержащий все указанные ключи.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — полный трансграничный договор:
        Фрагмент:
        "Исполнитель — компания, зарегистрированная в Республике Кипр.
        Местом реализации услуг признается территория РФ. Заказчик исполняет
        обязанности налогового агента по НДС. Расчёты производятся в евро."

        Ответ:
        {
          "cross_border_detected": "yes",
          "cross_border_detected_display": "Да",
          "place_of_supply_defined": "defined",
          "place_of_supply_defined_display": "Да",
          "tax_agent_clause": "defined",
          "tax_agent_clause_display": "Да",
          "payment_currency_defined": "defined",
          "payment_currency_defined_display": "Да",
          "cross_border_summary": "исполнитель — компания из Республики Кипр; место реализации — территория РФ; заказчик — налоговый агент по НДС; расчёты в евро",
          "evidence": [
            {
              "clause_ref": "п. 1.1",
              "quote": "Исполнитель — компания, зарегистрированная в Республике Кипр. Местом реализации услуг признается территория РФ. Заказчик исполняет обязанности налогового агента по НДС. Расчёты производятся в евро."
            }
          ]
        }

        Пример 2 — только валюта, но нет иностранного элемента:
        Фрагмент:
        "Расчёты по договору производятся в долларах США по курсу ЦБ РФ на дату оплаты.
        Стороны — российские юридические лица."

        Ответ:
        {
          "cross_border_detected": "no",
          "cross_border_detected_display": "Нет",
          "place_of_supply_defined": "not_defined",
          "place_of_supply_defined_display": "Нет",
          "tax_agent_clause": "not_defined",
          "tax_agent_clause_display": "Нет",
          "payment_currency_defined": "defined",
          "payment_currency_defined_display": "Да",
          "cross_border_summary": "расчёты в долларах США по курсу ЦБ РФ; иностранный элемент отсутствует",
          "evidence": [
            {
              "clause_ref": "п. 3.2",
              "quote": "Расчёты по договору производятся в долларах США по курсу ЦБ РФ на дату оплаты. Стороны — российские юридические лица."
            }
          ]
        }

        Пример 3 — место реализации определяется по приложению:
        Фрагмент:
        "Исполнитель — нерезидент РФ. Место реализации услуг определяется
        в соответствии с Приложением № 4 (Определение места реализации)
        к настоящему договору."

        Ответ:
        {
          "cross_border_detected": "yes",
          "cross_border_detected_display": "Да",
          "place_of_supply_defined": "defined",
          "place_of_supply_defined_display": "Да",
          "tax_agent_clause": "not_defined",
          "tax_agent_clause_display": "Нет",
          "payment_currency_defined": "not_defined",
          "payment_currency_defined_display": "Нет",
          "cross_border_summary": "исполнитель — нерезидент РФ; место реализации определяется по Приложению № 4",
          "evidence": [
            {
              "clause_ref": "п. 2.1",
              "quote": "Исполнитель — нерезидент РФ. Место реализации услуг определяется в соответствии с Приложением № 4 (Определение места реализации) к настоящему договору."
            }
          ]
        }

        Пример 4 — данные отсутствуют:
        Фрагмент:
        "Стороны — российские юридические лица."

        Ответ:
        {
          "cross_border_detected": "no",
          "cross_border_detected_display": "Нет",
          "place_of_supply_defined": "not_defined",
          "place_of_supply_defined_display": "Нет",
          "tax_agent_clause": "not_defined",
          "tax_agent_clause_display": "Нет",
          "payment_currency_defined": "not_defined",
          "payment_currency_defined_display": "Нет",
          "cross_border_summary": "Не установлено",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Есть ли прямое указание на иностранную сторону (не просто иностранную валюту).
        2. Есть ли прямое указание на место реализации.
        3. Есть ли прямое указание на налогового агента.
        4. Есть ли прямое указание на валюту расчётов.
        5. Если место реализации определяется по приложению/соглашению — это не "Нет", а "Да" с пометкой в summary.
        6. Если прямой цитаты нет — верни "not_defined" для статусов/enum и "Не установлено" для текста. Не додумывай условия.

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        {
          "cross_border_detected": "<yes / no>",
          "cross_border_detected_display": "<Да / Нет>",
          "place_of_supply_defined": "<defined / not_defined>",
          "place_of_supply_defined_display": "<Да / Нет>",
          "tax_agent_clause": "<defined / not_defined>",
          "tax_agent_clause_display": "<Да / Нет>",
          "payment_currency_defined": "<defined / not_defined>",
          "payment_currency_defined_display": "<Да / Нет>",
          "cross_border_summary": "<текст / 'Определяется по ...' / 'Не установлено'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 5
      temperature: 0.0
      max_tokens: 620

    retrieval:
      retrieval_profile: "tax_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "место реализации налоговый агент НДС иностранный исполнитель нерезидент валюта расчётов ст. 148 НК трансграничная приложение"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - technical_fragment
        - structural_anchor
        - definition
      preferred_clause_functions:
        - obligations
      negative_keywords:
        - "неустойка"
        - "форс-мажор"
        - "подсудность"
      position_bias:
        preferred_range: [0.10, 0.50]
        boost: 0.16
        scope: segment
      context_k: 5
      max_chunks: 7
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - obligations
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 650

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 600

      compact_output: false

      presence_signal:
        field: "cross_border_vat_place_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора трансграничные условия:
        иностранный элемент, место реализации, налоговый агент и валюту расчётов.
        Не анализируй цену, санкции, форс-мажор или споры.
        Не оценивай риски. Анализируй только текст договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. cross_border_vat_place_check_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если удалось сделать содержательный вывод хотя бы
             по одному из полей: cross_border_detected (включая "no" при
             наличии фрагментов о сторонах), place_of_supply_defined,
             tax_agent_clause, payment_currency_defined;
           - "missing" — если в переданном контексте нет никаких фрагментов
             о сторонах, валюте, месте реализации или налогах;
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - cross_border_detected = "no";
           - place_of_supply_defined = "not_defined";
           - tax_agent_clause = "not_defined";
           - payment_currency_defined = "not_defined";
           - cross_border_detected_display = "Нет";
           - все остальные *_display = "Нет";
           - cross_border_summary = "Не установлено";
           - не выполняй остальные шаги.

        1. cross_border_detected:
           - "yes" — если в тексте прямо указана иностранная сторона
             (нерезидент РФ, иностранная компания, зарегистрирована
             за пределами РФ);
           - "no" — если стороны — российские, или если нет упоминания
             иностранного элемента.
           Важно: не считай договор трансграничным только из-за упоминания
           иностранной валюты.

        2. cross_border_detected_display:
           - "Да" — для "yes";
           - "Нет" — для "no".

        3. place_of_supply_defined:
           - "defined" — есть прямое указание на место реализации услуг
             (территория РФ, иностранного государства, либо ссылка
             на приложение/соглашение);
           - "not_defined" — условие прямо не указано.

        4. place_of_supply_defined_display:
           - "Да" — для "defined";
           - "Нет" — для "not_defined".

        5. tax_agent_clause:
           - "defined" — есть прямое указание на обязанность Заказчика
             (или иной стороны) исполнять функции налогового агента
             по НДС (ст. 161 НК РФ);
           - "not_defined" — условие прямо не указано.

        6. tax_agent_clause_display:
           - "Да" — для "defined";
           - "Нет" — для "not_defined".

        7. payment_currency_defined:
           - "defined" — указана валюта расчётов (рубли, евро, доллары,
             юани и т.д.);
           - "not_defined" — валюта прямо не указана.

        8. payment_currency_defined_display:
           - "Да" — для "defined";
           - "Нет" — для "not_defined".

        9. cross_border_summary:
           Краткое user-facing описание трансграничных условий.
           - Если указано прямо — сформируй описание из текста.
           - Если место реализации определяется по приложению — укажи:
             "место реализации определяется по Приложению № 4".
           - Если иностранный элемент отсутствует — укажи:
             "иностранный элемент отсутствует" (при наличии валюты —
             добавь: "расчёты в [валюте]").
           - Если данных нет — "Не установлено".
           - Если данные противоречивы — "Не удалось определить".
        </task>

        <context_rules>
        - Перед остальными полями заполни cross_border_vat_place_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме вообще нет — presence = "missing"; cross_border_detected = "no" (по умолчанию); не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_defined / *_clause = "not_defined", все display = "Нет", summary = "Не установлено".
        - Используй только релевантные фрагменты контекста.
        - Не подставляй нормы закона, обычную практику или предположения вместо текста договора.
        - Не извлекай сведения о цене, санкциях, форс-мажоре, спорах и иных нерелевантных темах.
        - Не считай договор трансграничным только из-за упоминания иностранной валюты — нужно прямое указание на иностранную сторону (нерезидент, иностранная компания).
        - Если место реализации определяется по приложению/соглашению и это прямо видно из текста, отрази в cross_border_summary.
        - Если в разных фрагментах указаны противоречивые условия (например, одна часть — российская сторона, другая — нерезидент) и конфликт нельзя разрешить по тексту: статус → "not_defined", текстовое поле → "Не удалось определить".
        - Не используй пустые строки.
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет вообще никаких фрагментов о сторонах, валюте,
           месте реализации или налогах.
           → presence = "missing";
             cross_border_detected = "no";
             все *_defined / *_clause = "not_defined";
             все display = "Нет";
             summary = "Не установлено".

        2. Валюта без иностранного элемента.
           "Расчёты в долларах США по курсу ЦБ РФ. Стороны —
           российские юридические лица."
           → presence = "present";
             cross_border_detected = "no";
             payment_currency_defined = "defined";
             place_of_supply_defined = "not_defined";
             tax_agent_clause = "not_defined";
             summary содержит упоминание валюты.

        3. Противоречие по сторонам.
           В одной части — "Исполнитель — ООО с ОГРН",
           в другой — "Исполнитель — нерезидент".
           → presence = "unclear";
             cross_border_detected = "no" (по умолчанию при неоднозначности);
             summary = "Не удалось определить".

        4. Отсылка на внешний документ.
           "Место реализации определяется по Приложению № 4"
           без деталей в теле договора.
           → presence = "present";
             place_of_supply_defined = "defined";
             summary = "место реализации определяется по Приложению № 4".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для cross_border_vat_place_check_presence используй только: "present", "missing", "unclear".
        - Для cross_border_detected используй только: "yes", "no".
        - Для *_defined / *_clause используй только: "defined", "not_defined".
        - Fallback при отсутствии данных:
          * cross_border_detected → "no" (по умолчанию);
          * все *_display → "Нет";
          * cross_border_summary → "Не установлено".
        - Fallback при противоречии или неоднозначности:
          * cross_border_summary → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "cross_border_vat_place_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования по трансграничным условиям/НДС. Внутреннее агрегатное signal-поле."
          required: true

        - name: "cross_border_detected"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values:
            - "yes"
            - "no"
          description: "Обнаружен ли иностранный элемент. Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "cross_border_detected_display"
          type: "string"
          presentation: "fact"
          label: "Иностранный элемент"
          description: >
            User-friendly описание наличия иностранного элемента. Fallback: "Не установлено" / "Не удалось определить".
          required: true
          display_in_grid: true
          display_priority: 1

        - name: "place_of_supply_defined"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values:
            - "defined"
            - "not_defined"
          description: "Определено ли место реализации услуг. Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "place_of_supply_defined_display"
          type: "string"
          presentation: "fact"
          label: "Место реализации"
          description: >
            User-friendly описание определения места реализации услуг. Fallback: "Не установлено" / "Не удалось определить".
          required: true
          display_in_grid: true
          display_priority: 2

        - name: "tax_agent_clause"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values:
            - "defined"
            - "not_defined"
          description: "Есть ли оговорка о налоговом агенте. Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "tax_agent_clause_display"
          type: "string"
          presentation: "fact"
          label: "Налоговый агент"
          description: >
            User-friendly описание наличия оговорки о налоговом агенте. Fallback: "Не установлено" / "Не удалось определить".
          required: true
          display_in_grid: true
          display_priority: 3

        - name: "payment_currency_defined"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values:
            - "defined"
            - "not_defined"
          description: "Указана ли валюта расчётов. Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "payment_currency_defined_display"
          type: "string"
          presentation: "fact"
          label: "Валюта расчётов"
          description: >
            User-friendly описание указания валюты расчётов. Fallback: "Не установлено" / "Не удалось определить".
          required: true
          display_in_grid: true
          display_priority: 4

        - name: "cross_border_summary"
          type: "string"
          presentation: "fact"
          label: "Трансграничные условия"
          description: >
            Краткое описание трансграничных условий. Fallback: "Не установлено" / "Не удалось определить".
          required: false
          display_in_grid: true
          display_priority: 5
      store_payload: true

  - id: auto_renewal_clause
    name: "Автопролонгация и условия продления"
    description: >
      Фактографическая проверка наличия в договоре условия об автоматическом
      продлении, срока уведомления о непродлении и периода продления.
      Результат предназначен для табличного сравнения нескольких договоров.
    triggers:
    ui_mode: "field_extraction"
    severity: "medium"
    severity_if_pass: "pass"
    severity_if_fail: "medium"
    severity_if_unclear: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "автопролонгация"
        - "автоматическое продление"
        - "продлевается на тот же срок"
        - "если ни одна из сторон не уведомит"
        - "пролонгация"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)автоматическ(и|ое)\\s+продлева(ется|ть)"
        - "(?i)продлева(ется|ть)\\s+на\\s+(тот\\s+же|аналогичн)"
        - "(?i)пролонгац"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор возмездного оказания услуг.
        Проверяется только один вопрос: есть ли автопролонгация, срок
        уведомления о непродлении и период продления.

        Нормативный ориентир:
        - ГК РФ — общие положения о сроке действия договора

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора, а чего прямо нет.
        - Не оценивай серьёзность риска.
        - Юрист будет использовать результат в сравнительной таблице.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Есть ли условие об автопролонгации.
        2. Какой срок уведомления о непродлении.
        3. На какой период продлевается договор.
        4. Как описано условие пролонгации.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Если условие не указано прямо:
           - для статусных полей (*_present, *_status) возвращай "not_defined";
           - для текстовых полей (notice_period_value, renewal_period, auto_renewal_summary) возвращай "Не установлено".
        4. Строго запрещено использовать "None", "null", "not_defined" (в текстовых полях) или пустые строки "".
        5. auto_renewal_present_display:
           - Если auto_renewal_present = "defined" — "Да".
           - Если "not_defined" — "Нет".
        6. Не путай автопролонгацию с обычным правом сторон перезаключить договор по соглашению.
        7. В evidence включай только точный текст договора.
        8. Верни только один валидный JSON-объект, содержащий все указанные ключи.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — автопролонгация есть:
        Фрагмент:
        "Договор автоматически продлевается на один год, если ни одна из сторон
        не уведомит другую о прекращении не менее чем за 30 календарных дней
        до окончания текущего срока."

        Ответ:
        {
          "auto_renewal_present": "defined",
          "auto_renewal_present_display": "Да",
          "notice_period_status": "defined",
          "notice_period_value": "за 30 календарных дней до окончания текущего срока",
          "renewal_period": "один год",
          "auto_renewal_summary": "автоматическое продление на один год; уведомление за 30 календарных дней до окончания",
          "evidence": [
            {
              "clause_ref": "п. 10.2",
              "quote": "Договор автоматически продлевается на один год, если ни одна из сторон не уведомит другую о прекращении не менее чем за 30 календарных дней до окончания текущего срока."
            }
          ]
        }

        Пример 2 — данные отсутствуют:
        Фрагмент:
        "Договор действует до 31.12.2024."

        Ответ:
        {
          "auto_renewal_present": "not_defined",
          "auto_renewal_present_display": "Нет",
          "notice_period_status": "not_defined",
          "notice_period_value": "Не установлено",
          "renewal_period": "Не установлено",
          "auto_renewal_summary": "Не установлено",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Есть ли прямое указание на автоматическое продление.
        2. Есть ли прямое указание на срок уведомления.
        3. Есть ли прямое указание на период продления.
        4. Если прямой цитаты нет — верни "not_defined" для статусов и "Не установлено" для текста. Не додумывай условия.

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        {
          "auto_renewal_present": "<defined / not_defined>",
          "auto_renewal_present_display": "<Да / Нет>",
          "notice_period_status": "<defined / not_defined>",
          "notice_period_value": "<текст или 'Не установлено'>",
          "renewal_period": "<текст или 'Не установлено'>",
          "auto_renewal_summary": "<текст или 'Не установлено'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 4
      temperature: 0.0
      max_tokens: 580

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "автопролонгация автоматическое продление продлевается на тот же срок уведомление о непродлении пролонгация"
      retrieval_profile: "term_and_renewal_check"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - technical_fragment
        - structural_anchor
        - definition
      preferred_clause_functions:
        - obligations
      negative_keywords:
        - "неустойка"
        - "форс-мажор"
        - "персональные данные"
        - "расторжение"
      position_bias:
        preferred_range: [0.60, 1.0]
        boost: 0.16
        scope: segment
      context_k: 4
      max_chunks: 6
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "price_list"
        - "technical_specification"
      preferred_clause_functions:
        - obligations
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 650

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 650

      compact_output: false

      presence_signal:
        field: "auto_renewal_clause_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора условие об
        автопролонгации, срок уведомления о непродлении и период продления.
        Не анализируй цену, санкции, форс-мажор или споры.
        Не оценивай риски. Анализируй только текст договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. auto_renewal_clause_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (auto_renewal_present, notice_period_status) ≠ "not_defined";
           - "missing" — если оба содержательных поля = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - auto_renewal_present = "not_defined";
           - notice_period_status = "not_defined";
           - auto_renewal_present_display = "Нет";
           - notice_period_value = "Не установлено";
           - renewal_period = "Не установлено";
           - auto_renewal_summary = "Не установлено";
           - не выполняй остальные шаги.

        1. auto_renewal_present:
           - "defined" — если в тексте прямо указано, что договор
             автоматически продлевается (автопролонгация, пролонгация
             на тот же срок, продление при отсутствии уведомления);
           - "not_defined" — если автопролонгация прямо не предусмотрена.
           Важно: не путай с обычным правом сторон перезаключить договор
           по соглашению — это не автопролонгация.

        2. auto_renewal_present_display:
           - "Да" — если auto_renewal_present = "defined";
           - "Нет" — если "not_defined".

        3. notice_period_status:
           - "defined" — если прямо указан срок уведомления о непродлении
             (например, "за 30 календарных дней до окончания");
           - "not_defined" — если срок уведомления прямо не указан.

        4. notice_period_value:
           Срок уведомления о непродлении на русском языке.
           Пример: "за 30 календарных дней до окончания текущего срока".
           Если данных нет — "Не установлено".
           Если данные противоречивы — "Не удалось определить".

        5. renewal_period:
           Период, на который продлевается договор.
           Пример: "один год", "на тот же срок".
           Если данных нет — "Не установлено".
           Если данные противоречивы — "Не удалось определить".

        6. auto_renewal_summary:
           Краткое user-facing описание условия пролонгации.
           Если данных нет — "Не установлено".
           Если данные противоречивы — "Не удалось определить".
        </task>

        <context_rules>
        - Перед остальными полями заполни auto_renewal_clause_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_present / *_status = "not_defined", все display / текстовые поля = соответствующий fallback.
        - Используй только релевантные фрагменты контекста.
        - Не подставляй нормы закона, обычную практику или предположения вместо текста договора.
        - Не извлекай сведения о цене, санкциях, форс-мажоре, спорах и иных нерелевантных темах.
        - Не путай автопролонгацию с обычным правом сторон перезаключить договор по соглашению.
        - Если в разных фрагментах указаны разные сроки и конфликт нельзя разрешить по тексту: статус → "not_defined", текстовое поле → "Не удалось определить".
        - Не используй пустые строки.
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни автопролонгации, ни уведомления,
           ни периода продления.
           → presence = "missing";
             все *_present / *_status = "not_defined";
             все display / текстовые поля = соответствующий fallback.

        2. Автопролонгация без срока уведомления.
           "Договор продлевается на тот же срок" без указания
           срока уведомления о непродлении.
           → presence = "present";
             auto_renewal_present = "defined";
             notice_period_status = "not_defined";
             renewal_period = "на тот же срок".

        3. Противоречие между фрагментами.
           В одной части — "продлевается на один год",
           в другой — "продлевается на 6 месяцев".
           → presence = "unclear";
             auto_renewal_present = "defined";
             renewal_period = "Не удалось определить".

        4. Право перезаключения (не автопролонгация).
           "Стороны вправе перезаключить договор по истечении срока
           его действия по взаимному соглашению."
           → presence = "missing";
             auto_renewal_present = "not_defined"
             (перезаключение по соглашению ≠ автопролонгация).
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для auto_renewal_clause_presence используй только: "present", "missing", "unclear".
        - Для status-полей (*_present, *_status) используй только: "defined", "not_defined".
        - Fallback при отсутствии данных:
          * auto_renewal_present_display → "Нет";
          * notice_period_value → "Не установлено";
          * renewal_period → "Не установлено";
          * auto_renewal_summary → "Не установлено".
        - Fallback при противоречии или неоднозначности:
          * все текстовые поля → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "auto_renewal_clause_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования по автопролонгации. Внутреннее агрегатное signal-поле."
          required: true

        - name: "auto_renewal_present"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values:
            - "defined"
            - "not_defined"
          description: "Есть ли условие об автопролонгации. Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "auto_renewal_present_display"
          type: "string"
          presentation: "fact"
          label: "Автопролонгация"
          description: >
            User-friendly описание наличия условия об автопролонгации. Fallback: "Не установлено" / "Не удалось определить".
          required: true
          display_in_grid: true
          display_priority: 1

        - name: "notice_period_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values:
            - "defined"
            - "not_defined"
          description: "Указан ли срок уведомления о непродлении. Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "notice_period_value"
          type: "string"
          presentation: "fact"
          label: "Срок уведомления"
          description: >
            Срок уведомления о непродлении. Fallback: "Не установлено" / "Не удалось определить".
          required: false
          display_in_grid: true
          display_priority: 2

        - name: "renewal_period"
          type: "string"
          presentation: "fact"
          label: "Период продления"
          description: >
            На какой период продлевается договор. Fallback: "Не установлено" / "Не удалось определить".
          required: false
          display_in_grid: true
          display_priority: 3

        - name: "auto_renewal_summary"
          type: "string"
          presentation: "fact"
          label: "Условия продления"
          description: >
            Краткое описание условия пролонгации. Fallback: "Не установлено" / "Не удалось определить".
          required: false
          display_in_grid: true
          display_priority: 4
      store_payload: true

  - id: consumer_protection_notice
    name: "Защита прав потребителей (ЗоЗПП)"
    description: >
      Фактографическая проверка наличия в договоре условий, которые могут
      указывать на потребительский характер отношений, а также ограничений,
      потенциально противоречащих ЗоЗПП. Результат предназначен для
      табличного сравнения нескольких договоров.
    triggers:
      any: ["consumer_party"]
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "потребитель"
        - "для личных нужд"
        - "закон о защите прав потребителей"
        - "право потребителя"
        - "возврат денежных средств"
        - "безусловный отказ"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)потребител"
        - "(?i)для\\s+личн(ых|ого)"
        - "(?i)закон.*защит.*прав.*потребител"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор возмездного оказания услуг.
        Проверяется только один вопрос: есть ли признаки потребительского
        характера и условия, которые могут ущемлять права потребителя.

        Нормативный ориентир:
        - Закон РФ от 07.02.1992 № 2300-1 «О защите прав потребителей»
        - ст. 782 ГК РФ — право на отказ
        - ст. 32 ЗоЗПП — право потребителя на отказ от исполнения договора

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора, а чего прямо нет.
        - Не оценивай серьёзность риска.
        - Юрист будет использовать результат в сравнительной таблице.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Есть ли указание на потребительский характер.
        2. Есть ли штраф за отказ потребителя.
        3. Есть ли ограничение права на возврат.
        4. Есть ли навязывание дополнительных услуг.
        5. Как описаны обнаруженные условия.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Если условие не указано прямо:
           - для consumer_contract_detected возвращай "no";
           - для статусных полей (*_detected, *_detected) возвращай "not_defined";
           - для текстовых полей (consumer_issues_summary) возвращай "Не установлено".
        4. Строго запрещено использовать "None", "null", "not_defined" (в текстовых полях) или пустые строки "".
        5. consumer_contract_detected_display:
           - Если consumer_contract_detected = "yes" — "Да".
           - Если "no" — "Нет".
        6. exit_penalty_for_consumer_display:
           - Если exit_penalty_for_consumer = "defined" — "Да".
           - Если "not_defined" — "Нет".
        7. Не считай договор потребительским только из-за того, что одна сторона — физическое лицо. Нужно прямое указание на личные / бытовые / семейные нужды (ст. 1 ЗоЗПП).
        8. Если физлицо указано как сторона, но цель — предпринимательская / профессиональная деятельность, consumer_contract_detected = "no".
        9. В evidence включай только точный текст договора.
        10. Верни только один валидный JSON-объект, содержащий все указанные ключи.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — полный потребительский договор с штрафом:
        Фрагмент:
        "Заказчик — физическое лицо, приобретающее услуги для личных нужд.
        В случае отказа Заказчика от услуг взимается штраф в размере 50%
        стоимости услуг. Возврат денежных средств за оказанные услуги
        не производится."

        Ответ:
        {
          "consumer_contract_detected": "yes",
          "consumer_contract_detected_display": "Да",
          "exit_penalty_for_consumer": "defined",
          "exit_penalty_for_consumer_display": "Да",
          "refund_restriction_detected": "defined",
          "forced_additional_services_detected": "not_defined",
          "consumer_issues_summary": "заказчик — физлицо для личных нужд; штраф за отказ 50% стоимости услуг; возврат за оказанные услуги не производится",
          "evidence": [
            {
              "clause_ref": "п. 1.1",
              "quote": "Заказчик — физическое лицо, приобретающее услуги для личных нужд. В случае отказа Заказчика от услуг взимается штраф в размере 50% стоимости услуг. Возврат денежных средств за оказанные услуги не производится."
            }
          ]
        }

        Пример 2 — физлицо, но цель предпринимательская (не потребитель):
        Фрагмент:
        "Заказчик — физическое лицо Петров П.П., действующий в качестве
        индивидуального предпринимателя, для целей осуществления
        предпринимательской деятельности."

        Ответ:
        {
          "consumer_contract_detected": "no",
          "consumer_contract_detected_display": "Нет",
          "exit_penalty_for_consumer": "not_defined",
          "exit_penalty_for_consumer_display": "Нет",
          "refund_restriction_detected": "not_defined",
          "forced_additional_services_detected": "not_defined",
          "consumer_issues_summary": "Не установлено",
          "evidence": [
            {
              "clause_ref": "преамбула",
              "quote": "Заказчик — физическое лицо Петров П.П., действующий в качестве индивидуального предпринимателя, для целей осуществления предпринимательской деятельности."
            }
          ]
        }

        Пример 3 — частичный сценарий (только навязывание услуг):
        Фрагмент:
        "Заказчик — физическое лицо, приобретающее услуги для личных нужд.
        При заказе основной услуги Заказчик обязан приобрести дополнительный
        пакет услуг «Премиум»."

        Ответ:
        {
          "consumer_contract_detected": "yes",
          "consumer_contract_detected_display": "Да",
          "exit_penalty_for_consumer": "not_defined",
          "exit_penalty_for_consumer_display": "Нет",
          "refund_restriction_detected": "not_defined",
          "forced_additional_services_detected": "defined",
          "consumer_issues_summary": "заказчик — физлицо для личных нужд; навязывание дополнительного пакета услуг «Премиум» при заказе основной услуги",
          "evidence": [
            {
              "clause_ref": "п. 2.3",
              "quote": "Заказчик — физическое лицо, приобретающее услуги для личных нужд. При заказе основной услуги Заказчик обязан приобрести дополнительный пакет услуг «Премиум»."
            }
          ]
        }

        Пример 4 — данные отсутствуют (B2B):
        Фрагмент:
        "Договор заключен между двумя юридическими лицами."

        Ответ:
        {
          "consumer_contract_detected": "no",
          "consumer_contract_detected_display": "Нет",
          "exit_penalty_for_consumer": "not_defined",
          "exit_penalty_for_consumer_display": "Нет",
          "refund_restriction_detected": "not_defined",
          "forced_additional_services_detected": "not_defined",
          "consumer_issues_summary": "Не установлено",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Есть ли прямое указание на личные / бытовые / семейные нужды (не просто физлицо).
        2. Есть ли штраф / удержание за отказ потребителя.
        3. Есть ли ограничение права на возврат денежных средств.
        4. Есть ли навязывание дополнительных услуг (ст. 16 ЗоЗПП).
        5. Если физлицо действует в предпринимательских целях — consumer_contract_detected = "no".
        6. Если прямой цитаты нет — верни "not_defined" для статусов и "Не установлено" для текста. Не додумывай условия.

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        {
          "consumer_contract_detected": "<yes / no>",
          "consumer_contract_detected_display": "<Да / Нет>",
          "exit_penalty_for_consumer": "<defined / not_defined>",
          "exit_penalty_for_consumer_display": "<Да / Нет>",
          "refund_restriction_detected": "<defined / not_defined>",
          "forced_additional_services_detected": "<defined / not_defined>",
          "consumer_issues_summary": "<текст или 'Не установлено'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 5
      temperature: 0.0
      max_tokens: 620

    retrieval:
      retrieval_profile: "liability_cap_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "потребитель для личных нужд закон о защите прав потребителей штраф за отказ возврат денежных средств навязывание услуг предпринимательская деятельность"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - technical_fragment
        - structural_anchor
        - definition
      preferred_clause_functions:
        - obligations
      negative_keywords:
        - "форс-мажор"
        - "конфиденциальность"
        - "подсудность"
      position_bias:
        preferred_range: [0.0, 0.50]
        boost: 0.14
        scope: segment
      context_k: 5
      max_chunks: 7
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - obligations
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 650

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 600

      compact_output: false

      presence_signal:
        field: "consumer_protection_notice_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора признаки потребительского
        характера и условия, потенциально ущемляющие права потребителя. Не
        анализируй цену, санкции, форс-мажор или споры.
        Не оценивай уровень риска и не делай правовой вывод о ничтожности
        условий. Анализируй только текст договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. consumer_protection_notice_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если consumer_contract_detected = "yes" ИЛИ
             хотя бы одно из issue-полей (exit_penalty_for_consumer,
             refund_restriction_detected,
             forced_additional_services_detected) = "defined";
           - "missing" — если consumer_contract_detected = "no" И
             все три issue-поля = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - consumer_contract_detected = "no";
           - exit_penalty_for_consumer = "not_defined";
           - refund_restriction_detected = "not_defined";
           - forced_additional_services_detected = "not_defined";
           - consumer_contract_detected_display = "Нет";
           - exit_penalty_for_consumer_display = "Нет";
           - consumer_issues_summary = "Не установлено";
           - не выполняй остальные шаги.

        1. consumer_contract_detected:
           - "yes" — если в тексте прямо указано, что услуги приобретаются
             для личных, бытовых, семейных или иных нужд, не связанных
             с предпринимательской деятельностью (ст. 1 ЗоЗПП);
           - "no" — если стороны — юрлица, либо физлицо действует
             в предпринимательских / профессиональных целях, либо
             указаний на потребительский характер нет.
           Важно: не считай договор потребительским только из-за того,
           что одна сторона — физическое лицо.

        2. consumer_contract_detected_display:
           - "Да" — для "yes";
           - "Нет" — для "no".

        3. exit_penalty_for_consumer:
           - "defined" — если есть прямой штраф, удержание, неустойка
             за отказ потребителя от услуг;
           - "not_defined" — если такого условия прямо нет.

        4. exit_penalty_for_consumer_display:
           - "Да" — для "defined";
           - "Нет" — для "not_defined".

        5. refund_restriction_detected:
           - "defined" — если есть прямое ограничение права на возврат
             денежных средств (например, "возврат не производится",
             "удерживается 100% оплаты");
           - "not_defined" — если такого условия прямо нет.

        6. forced_additional_services_detected:
           - "defined" — если есть навязывание дополнительных услуг
             (например, "обязан приобрести дополнительный пакет");
           - "not_defined" — если такого условия прямо нет.

        7. consumer_issues_summary:
           Краткое user-facing описание обнаруженных потребительских
           условий. Перечисли через точку с запятой.
           Если потребительский характер не обнаружен или условия
           отсутствуют — "Не установлено".
           Если данные противоречивы — "Не удалось определить".
        </task>

        <context_rules>
        - Перед остальными полями заполни consumer_protection_notice_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; consumer_contract_detected = "no"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все issue-поля = "not_defined", все display = "Нет", summary = "Не установлено".
        - Используй только релевантные фрагменты контекста.
        - Не подставляй нормы закона, обычную практику или предположения вместо текста договора.
        - Не оценивай уровень риска и не делай правовой вывод о ничтожности условий.
        - Не извлекай сведения о цене, санкциях за просрочку, форс-мажоре, спорах и иных нерелевантных темах.
        - Не считай договор потребительским только из-за того, что одна сторона — физическое лицо. Нужно прямое указание на личные / бытовые / семейные нужды.
        - Если физлицо действует в предпринимательских целях — consumer_contract_detected = "no".
        - Если в разных фрагментах указаны противоречивые условия и конфликт нельзя разрешить по тексту: issue-поля → "not_defined", summary → "Не удалось определить".
        - Не используй пустые строки.
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы (B2B).
           В тексте нет ни потребительского характера, ни штрафов
           за отказ, ни ограничений возврата, ни навязывания.
           → presence = "missing";
             consumer_contract_detected = "no";
             все issue-поля = "not_defined";
             все display = "Нет";
             summary = "Не установлено".

        2. Потребительский характер без ущемляющих условий.
           "Заказчик — физическое лицо, приобретающее услуги для
           личных нужд" без штрафов и ограничений.
           → presence = "present";
             consumer_contract_detected = "yes";
             все issue-поля = "not_defined";
             summary описывает потребительский характер.

        3. Противоречие по характеру договора.
           В одной части — "для личных нужд", в другой — "для целей
           предпринимательской деятельности".
           → presence = "unclear";
             consumer_contract_detected = "no" (по умолчанию);
             summary = "Не удалось определить".

        4. Физлицо-ИП (не потребитель).
           "Заказчик — ИП Петров П.П., действующий для целей
           предпринимательской деятельности."
           → presence = "missing";
             consumer_contract_detected = "no";
             все issue-поля = "not_defined".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для consumer_protection_notice_presence используй только: "present", "missing", "unclear".
        - Для consumer_contract_detected используй только: "yes", "no".
        - Для issue-полей (*_detected, *_for_consumer) используй только: "defined", "not_defined".
        - Fallback при отсутствии данных:
          * consumer_contract_detected → "no" (по умолчанию);
          * consumer_contract_detected_display → "Нет";
          * exit_penalty_for_consumer_display → "Нет";
          * consumer_issues_summary → "Не установлено".
        - Fallback при противоречии или неоднозначности:
          * consumer_issues_summary → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "consumer_protection_notice_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие потребительских условий / признаков ЗоЗПП. Внутреннее агрегатное signal-поле."
          required: true

        - name: "consumer_contract_detected"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values:
            - "yes"
            - "no"
          description: "Обнаружен ли потребительский характер договора. Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "consumer_contract_detected_display"
          type: "string"
          presentation: "fact"
          label: "Потребительский характер"
          description: >
            User-friendly описание наличия потребительского характера договора. Fallback: "Не установлено" / "Не удалось определить".
          required: true
          display_in_grid: true
          display_priority: 1

        - name: "exit_penalty_for_consumer"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values:
            - "defined"
            - "not_defined"
          description: "Есть ли штраф за отказ потребителя. Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "exit_penalty_for_consumer_display"
          type: "string"
          presentation: "fact"
          label: "Штраф за отказ потребителя"
          description: >
            User-friendly описание наличия штрафа за отказ потребителя. Fallback: "Не установлено" / "Не удалось определить".
          required: true
          display_in_grid: true
          display_priority: 2

        - name: "refund_restriction_detected"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values:
            - "defined"
            - "not_defined"
          description: "Есть ли ограничение права на возврат. Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "forced_additional_services_detected"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values:
            - "defined"
            - "not_defined"
          description: "Есть ли навязывание дополнительных услуг. Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "consumer_issues_summary"
          type: "string"
          presentation: "fact"
          label: "Потребительские условия"
          description: >
            Краткое описание обнаруженных потребительских условий. Fallback: "Не установлено" / "Не удалось определить".
          required: false
          display_in_grid: true
          display_priority: 3
      store_payload: true

  - id: license_confirmation
    name: "Подтверждение лицензии / аккредитации исполнителя"
    description: >
      Фактографическая проверка наличия в договоре ссылки на лицензию,
      аккредитацию или допуск исполнителя для лицензируемых видов деятельности.
      Результат предназначен для табличного сравнения нескольких договоров.
    triggers:
      any: ["licensed_activity"]
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "лицензия"
        - "номер лицензии"
        - "аккредитация"
        - "аттестат"
        - "свидетельство"
        - "допуск"
        - "саморегулируемая организация"
        - "СРО"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)лицензи(я|и|ю)\\s+(№|от)"
        - "(?i)аккредитац(ия|ии)"
        - "(?i)\\bСРО\\b"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор возмездного оказания услуг.
        Проверяется только один вопрос: есть ли в договоре ссылка на лицензию,
        аккредитацию, членство в СРО или иной допуск исполнителя.

        Нормативный ориентир:
        - ФЗ от 04.05.2011 № 99-ФЗ «О лицензировании отдельных видов деятельности»
        - отраслевые законы о лицензировании (медицина, образование, связь, страхование, перевозки)
        - ФЗ «О саморегулируемых организациях»
        - ФЗ «Об аккредитации в национальной системе аккредитации»

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора, а чего прямо нет.
        - Не оценивай серьёзность риска.
        - Юрист будет использовать результат в сравнительной таблице.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Есть ли ссылка на лицензию.
        2. Какие реквизиты лицензии указаны.
        3. Есть ли ссылка на аккредитацию или СРО.
        4. Как описан допуск.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Если условие не указано прямо:
           - для статусных полей (*_present) возвращай "not_defined";
           - для текстовых полей (license_details, license_summary) возвращай "Не установлено".
        4. Строго запрещено использовать "None", "null", "not_defined" (в текстовых полях) или пустые строки "".
        5. license_reference_present_display:
           - Если license_reference_present = "defined" — "Да".
           - Если "not_defined" — "Нет".
        6. accreditation_or_sro_present_display:
           - Если accreditation_or_sro_present = "defined" — "Да" (или укажи тип: "СРО", "Аккредитация Минцифры" и т.д.).
           - Если "not_defined" — "Нет".
        7. Не считай упоминание любого свидетельства (например, о регистрации, ИНН, ОГРН) подтверждением профессиональной лицензии.
        8. Если реквизиты лицензии определяются по приложению/реестру/выписке — укажи это в license_details.
        9. В evidence включай только точный текст договора.
        10. Верни только один валидный JSON-объект, содержащий все указанные ключи.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — лицензия с реквизитами:
        Фрагмент:
        "Исполнитель осуществляет деятельность на основании лицензии
        № ЛО-77-01-012345 от 15.03.2022, выданной Росздравнадзором."

        Ответ:
        {
          "license_reference_present": "defined",
          "license_reference_present_display": "Да",
          "license_details": "лицензия № ЛО-77-01-012345 от 15.03.2022, выдана Росздравнадзором",
          "accreditation_or_sro_present": "not_defined",
          "accreditation_or_sro_present_display": "Нет",
          "license_summary": "лицензия Росздравнадзора № ЛО-77-01-012345 от 15.03.2022",
          "evidence": [
            {
              "clause_ref": "преамбула",
              "quote": "Исполнитель осуществляет деятельность на основании лицензии № ЛО-77-01-012345 от 15.03.2022, выданной Росздравнадзором."
            }
          ]
        }

        Пример 2 — членство в СРО (строительство):
        Фрагмент:
        "Исполнитель является членом Ассоциации «Национальное объединение
        строителей» (СРО-С-024-14072019) и имеет допуск к работам, влияющим
        на безопасность объектов капитального строительства. Свидетельство
        о допуске № СРО-С-024-00123456 от 20.05.2023."

        Ответ:
        {
          "license_reference_present": "not_defined",
          "license_reference_present_display": "Нет",
          "license_details": "Не установлено",
          "accreditation_or_sro_present": "defined",
          "accreditation_or_sro_present_display": "Да (СРО строителей)",
          "license_summary": "членство в СРО «Национальное объединение строителей»; допуск к работам, влияющим на безопасность ОКС; свидетельство о допуске № СРО-С-024-00123456 от 20.05.2023",
          "evidence": [
            {
              "clause_ref": "п. 1.3",
              "quote": "Исполнитель является членом Ассоциации «Национальное объединение строителей» (СРО-С-024-14072019) и имеет допуск к работам, влияющим на безопасность объектов капитального строительства. Свидетельство о допуске № СРО-С-024-00123456 от 20.05.2023."
            }
          ]
        }

        Пример 3 — реквизиты лицензии в приложении:
        Фрагмент:
        "Исполнитель гарантирует наличие действующей лицензии на осуществление
        образовательной деятельности. Реквизиты лицензии указаны в Приложении № 2
        (Копия лицензии) к настоящему договору."

        Ответ:
        {
          "license_reference_present": "defined",
          "license_reference_present_display": "Да",
          "license_details": "Определяется по Приложению № 2 (Копия лицензии)",
          "accreditation_or_sro_present": "not_defined",
          "accreditation_or_sro_present_display": "Нет",
          "license_summary": "лицензия на образовательную деятельность; реквизиты — в Приложении № 2",
          "evidence": [
            {
              "clause_ref": "п. 2.4",
              "quote": "Исполнитель гарантирует наличие действующей лицензии на осуществление образовательной деятельности. Реквизиты лицензии указаны в Приложении № 2 (Копия лицензии) к настоящему договору."
            }
          ]
        }

        Пример 4 — данные отсутствуют:
        Фрагмент:
        "Исполнитель — ООО «Компания»."

        Ответ:
        {
          "license_reference_present": "not_defined",
          "license_reference_present_display": "Нет",
          "license_details": "Не установлено",
          "accreditation_or_sro_present": "not_defined",
          "accreditation_or_sro_present_display": "Нет",
          "license_summary": "Не установлено",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Есть ли прямое указание на лицензию с реквизитами (номер, дата, кем выдана).
        2. Есть ли прямое указание на аккредитацию или членство в СРО.
        3. Если реквизиты определяются по приложению/реестру — это не "Не установлено", а "Определяется по ...".
        4. Не считай свидетельство о регистрации (ОГРН) или ИНН подтверждением профессиональной лицензии.
        5. Если прямой цитаты нет — верни "not_defined" для статусов и "Не установлено" для текста. Не додумывай условия.

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        {
          "license_reference_present": "<defined / not_defined>",
          "license_reference_present_display": "<Да / Нет>",
          "license_details": "<текст / 'Определяется по ...' / 'Не установлено'>",
          "accreditation_or_sro_present": "<defined / not_defined>",
          "accreditation_or_sro_present_display": "<Да / Да (тип) / Нет>",
          "license_summary": "<текст или 'Не установлено'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 4
      temperature: 0.0
      max_tokens: 550

    retrieval:
      retrieval_profile: "party_identification_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "лицензия номер лицензии аккредитация аттестат свидетельство допуск СРО саморегулируемая организация приложение реестр"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - technical_fragment
        - structural_anchor
        - definition
      preferred_clause_functions:
        - definitions
        - obligations
      negative_keywords:
        - "неустойка"
        - "форс-мажор"
        - "персональные данные"
      position_bias:
        preferred_range: [0.0, 0.25]
        boost: 0.18
        scope: segment
      context_k: 4
      max_chunks: 6
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "price_list"
        - "technical_specification"
      preferred_clause_functions:
        - definitions
        - obligations
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 30
      max_snippet_length: 500

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 500

      compact_output: false

      presence_signal:
        field: "license_confirmation_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора ссылку на лицензию,
        аккредитацию или членство в СРО исполнителя. Не анализируй цену,
        санкции, форс-мажор или споры.
        Не оценивай риски. Анализируй только текст договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. license_confirmation_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (license_reference_present, accreditation_or_sro_present)
             ≠ "not_defined";
           - "missing" — если оба содержательных поля = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - license_reference_present = "not_defined";
           - accreditation_or_sro_present = "not_defined";
           - license_reference_present_display = "Нет";
           - accreditation_or_sro_present_display = "Нет";
           - license_details = "Не установлено";
           - license_summary = "Не установлено";
           - не выполняй остальные шаги.

        1. license_reference_present:
           - "defined" — если в тексте прямо указана лицензия с реквизитами
             (номер, дата, кем выдана) или ссылкой на приложение/реестр;
           - "not_defined" — если лицензия прямо не указана.
           Важно: не считай свидетельство о регистрации (ОГРН, ИНН)
           подтверждением профессиональной лицензии.

        2. license_reference_present_display:
           - "Да" — если license_reference_present = "defined";
           - "Нет" — если "not_defined".

        3. license_details:
           Реквизиты лицензии на русском языке.
           - Если указаны прямо — укажи номер, дату, орган:
             "лицензия № ЛО-77-01-012345 от 15.03.2022, выдана Росздравнадзором".
           - Если определяются по документу — укажи:
             "Определяется по Приложению № 2 (Копия лицензии)".
           - Если данных нет — "Не установлено".
           - Если данные противоречивы — "Не удалось определить".

        4. accreditation_or_sro_present:
           - "defined" — если прямо указано членство в СРО, аккредитация
             (Минцифры, национальной системы аккредитации) или иной
             профессиональный допуск;
           - "not_defined" — если такого указания нет.

        5. accreditation_or_sro_present_display:
           User-friendly описание:
           - "Да (СРО строителей)" / "Да (Аккредитация Минцифры)" /
             "Да (СРО аудиторов)" и т.д. — если defined;
           - "Нет" — если not_defined.

        6. license_summary:
           Краткое user-facing описание допуска исполнителя.
           Включи тип (лицензия / СРО / аккредитация), реквизиты,
           вид деятельности.
           Если данных нет — "Не установлено".
           Если данные противоречивы — "Не удалось определить".
        </task>

        <context_rules>
        - Перед остальными полями заполни license_confirmation_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_present = "not_defined", все display = "Нет", все текстовые поля = "Не установлено".
        - Используй только релевантные фрагменты контекста.
        - Не подставляй нормы закона, обычную практику или предположения вместо текста договора.
        - Не извлекай сведения о цене, санкциях, форс-мажоре, спорах и иных нерелевантных темах.
        - Не считай свидетельство о регистрации (ОГРН, ИНН) или иное регистрационное свидетельство подтверждением профессиональной лицензии.
        - Если реквизиты лицензии определяются по приложению/реестру/выписке и это прямо видно из текста, считай лицензию определённой и отрази в license_details.
        - Если в разных фрагментах указаны разные реквизиты и конфликт нельзя разрешить по тексту: статус → "not_defined", текстовое поле → "Не удалось определить".
        - Не используй пустые строки.
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни лицензии, ни аккредитации, ни СРО,
           ни иного допуска.
           → presence = "missing";
             все *_present = "not_defined";
             все display = "Нет";
             все текстовые поля = "Не установлено".

        2. Лицензия в приложении без реквизитов в тексте.
           "Исполнитель гарантирует наличие действующей лицензии.
           Реквизиты — в Приложении № 2."
           → presence = "present";
             license_reference_present = "defined";
             license_details = "Определяется по Приложению № 2";
             accreditation_or_sro_present = "not_defined".

        3. Противоречие в реквизитах.
           В одной части — лицензия № А, в другой — лицензия № Б.
           → presence = "unclear";
             license_reference_present = "defined";
             license_details = "Не удалось определить".

        4. Только регистрационные свидетельства.
           "Исполнитель — ООО «Компания», ОГРН 1027700000001,
           ИНН 7701234567."
           → presence = "missing";
             все *_present = "not_defined"
             (ОГРН/ИНН ≠ профессиональная лицензия).
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для license_confirmation_presence используй только: "present", "missing", "unclear".
        - Для *_present используй только: "defined", "not_defined".
        - Fallback при отсутствии данных:
          * license_reference_present_display → "Нет";
          * accreditation_or_sro_present_display → "Нет";
          * license_details → "Не установлено";
          * license_summary → "Не установлено".
        - Fallback при противоречии или неоднозначности:
          * все текстовые поля → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "license_confirmation_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования по лицензии/аккредитации/СРО. Внутреннее агрегатное signal-поле."
          required: true

        - name: "license_reference_present"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values:
            - "defined"
            - "not_defined"
          description: "Есть ли ссылка на лицензию. Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "license_reference_present_display"
          type: "string"
          presentation: "fact"
          label: "Лицензия"
          description: >
            User-friendly описание наличия ссылки на лицензию. Fallback: "Не установлено" / "Не удалось определить".
          required: true
          display_in_grid: true
          display_priority: 1

        - name: "license_details"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 2
          label: "Реквизиты лицензии"
          description: >
            Реквизиты лицензии исполнителя (номер, дата, орган)
            или ссылка на приложение / реестр.
            Fallback: "Не установлено" / "Не удалось определить".
          required: false

        - name: "accreditation_or_sro_present"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values:
            - "defined"
            - "not_defined"
          description: "Есть ли ссылка на аккредитацию или СРО. Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "accreditation_or_sro_present_display"
          type: "string"
          presentation: "fact"
          label: "Аккредитация / СРО"
          description: >
            User-friendly описание наличия аккредитации или членства в СРО. Fallback: "Не установлено" / "Не удалось определить".
          required: true
          display_in_grid: true
          display_priority: 3

        - name: "license_summary"
          type: "string"
          presentation: "fact"
          label: "Допуск"
          description: >
            Краткое описание допуска исполнителя (лицензия, аккредитация, СРО). Fallback: "Не установлено" / "Не удалось определить".
          required: false
          display_in_grid: true
          display_priority: 4
      store_payload: true

  - id: non_solicitation_clause
    name: "Запрет переманивания персонала (non-solicitation)"
    description: >
      Фактографическая проверка наличия в договоре условия о запрете
      переманивания сотрудников другой стороны, срока действия запрета
      и санкций за нарушение. Результат предназначен для табличного
      сравнения нескольких договоров.
    triggers:
      any: ["outsourcing", "it_services", "consulting_services"]
    ui_mode: "field_extraction"
    severity: "medium"
    severity_if_pass: "pass"
    severity_if_fail: "medium"
    severity_if_unclear: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "запрет переманивания"
        - "non-solicitation"
        - "не привлекать сотрудников"
        - "не нанимать работников"
        - "не переманивать"
        - "запрет найма"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)(запрет|не\\s+вправе).*переманива"
        - "(?i)non[\\s\\-]?solicitation"
        - "(?i)не\\s+(привлекать|нанимать).*сотрудник"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор возмездного оказания услуг.
        Проверяется только один вопрос: есть ли условие о запрете переманивания
        персонала, его срок и санкции за нарушение.

        Нормативный ориентир:
        - ст. 421 ГК РФ — свобода договора
        - договорная практика ограничений non-solicitation

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора, а чего прямо нет.
        - Не оценивай серьёзность риска.
        - Юрист будет использовать результат в сравнительной таблице.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Есть ли запрет переманивания.
        2. Какой срок действия запрета.
        3. Есть ли санкция за нарушение.
        4. Как описан запрет.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Если условие не указано прямо:
           - для статусных полей (*_present, *_defined) возвращай "not_defined";
           - для текстовых полей (non_solicitation_period, non_solicitation_summary) возвращай "Не установлено".
        4. Строго запрещено использовать "None", "null", "not_defined" (в текстовых полях) или пустые строки "".
        5. non_solicitation_present_display:
           - Если non_solicitation_present = "defined" — "Да".
           - Если "not_defined" — "Нет".
        6. non_solicitation_penalty_defined_display:
           - Если non_solicitation_penalty_defined = "defined" — "Да" (или укажи размер, если есть).
           - Если "not_defined" — "Нет".
        7. Срок запрета может включать: (а) период действия договора, (б) период после прекращения договора (post-termination period). Укажи оба, если они есть.
        8. Стандартные carve-out (не считаются нарушением): (а) вакансии, опубликованные в открытых источниках без целенаправленного привлечения сотрудников другой стороны; (б) сотрудники, откликнувшиеся самостоятельно. Если такие исключения есть — отрази их в non_solicitation_summary.
        9. Не путай запрет переманивания с обычной оговоркой о конфиденциальности.
        10. В evidence включай только точный текст договора.
        11. Верни только один валидный JSON-объект, содержащий все указанные ключи.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — полный запрет с санкцией:
        Фрагмент:
        "В течение 12 месяцев после прекращения договора стороны обязуются
        не привлекать на работу сотрудников другой стороны без её письменного
        согласия. За нарушение — штраф 500 000 рублей за каждого привлечённого
        сотрудника. Запрет не распространяется на вакансии, опубликованные
        в открытых источниках, и на сотрудников, откликнувшихся самостоятельно."

        Ответ:
        {
          "non_solicitation_present": "defined",
          "non_solicitation_present_display": "Да",
          "non_solicitation_period": "12 месяцев после прекращения договора",
          "non_solicitation_penalty_defined": "defined",
          "non_solicitation_penalty_defined_display": "Да (500 000 рублей за каждого сотрудника)",
          "non_solicitation_summary": "запрет привлечения сотрудников другой стороны в течение 12 месяцев после прекращения без письменного согласия; штраф 500 000 рублей за каждого привлечённого сотрудника; carve-out: вакансии в открытых источниках и самостоятельный отклик",
          "evidence": [
            {
              "clause_ref": "п. 13.4",
              "quote": "В течение 12 месяцев после прекращения договора стороны обязуются не привлекать на работу сотрудников другой стороны без её письменного согласия. За нарушение — штраф 500 000 рублей за каждого привлечённого сотрудника. Запрет не распространяется на вакансии, опубликованные в открытых источниках, и на сотрудников, откликнувшихся самостоятельно."
            }
          ]
        }

        Пример 2 — запрет есть, но санкции нет:
        Фрагмент:
        "В течение срока действия договора и 6 месяцев после его прекращения
        Исполнитель обязуется не переманивать и не принимать на работу
        сотрудников Заказчика, задействованных в оказании услуг по настоящему
        договору."

        Ответ:
        {
          "non_solicitation_present": "defined",
          "non_solicitation_present_display": "Да",
          "non_solicitation_period": "в течение срока действия договора и 6 месяцев после его прекращения",
          "non_solicitation_penalty_defined": "not_defined",
          "non_solicitation_penalty_defined_display": "Нет",
          "non_solicitation_summary": "запрет переманивания сотрудников Заказчика, задействованных в оказании услуг, в течение срока договора и 6 месяцев после его прекращения; санкция не предусмотрена",
          "evidence": [
            {
              "clause_ref": "п. 8.2",
              "quote": "В течение срока действия договора и 6 месяцев после его прекращения Исполнитель обязуется не переманивать и не принимать на работу сотрудников Заказчика, задействованных в оказании услуг по настоящему договору."
            }
          ]
        }

        Пример 3 — данные отсутствуют:
        Фрагмент:
        "Стороны обязуются соблюдать конфиденциальность."

        Ответ:
        {
          "non_solicitation_present": "not_defined",
          "non_solicitation_present_display": "Нет",
          "non_solicitation_period": "Не установлено",
          "non_solicitation_penalty_defined": "not_defined",
          "non_solicitation_penalty_defined_display": "Нет",
          "non_solicitation_summary": "Не установлено",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Есть ли прямой запрет переманивания (не просто конфиденциальность).
        2. Есть ли прямое указание на срок (включая post-termination period).
        3. Есть ли прямое указание на санкцию (штраф, неустойка, возмещение расходов на обучение).
        4. Есть ли carve-out (публичные вакансии, самостоятельный отклик).
        5. Если прямой цитаты нет — верни "not_defined" для статусов и "Не установлено" для текста. Не додумывай условия.

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        {
          "non_solicitation_present": "<defined / not_defined>",
          "non_solicitation_present_display": "<Да / Нет>",
          "non_solicitation_period": "<текст или 'Не установлено'>",
          "non_solicitation_penalty_defined": "<defined / not_defined>",
          "non_solicitation_penalty_defined_display": "<Да / Да (размер) / Нет>",
          "non_solicitation_summary": "<текст или 'Не установлено'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 4
      temperature: 0.0
      max_tokens: 550

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "запрет переманивания non-solicitation не привлекать сотрудников не нанимать работников не переманивать запрет найма post-termination carve-out"
      retrieval_profile: "non_compete_check"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - technical_fragment
        - structural_anchor
        - definition
      preferred_clause_functions:
        - obligations
      negative_keywords:
        - "неустойка общая"
        - "форс-мажор"
        - "конфиденциальность"
      position_bias:
        preferred_range: [0.60, 1.0]
        boost: 0.14
        scope: segment
      context_k: 4
      max_chunks: 6
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "price_list"
        - "technical_specification"
      preferred_clause_functions:
        - obligations
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 30
      max_snippet_length: 500

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 500

      compact_output: false

      presence_signal:
        field: "non_solicitation_clause_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора условие о запрете
        переманивания сотрудников, срок действия и санкции. Не анализируй
        цену, сроки, форс-мажор или споры.
        Не оценивай риски. Анализируй только текст договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. non_solicitation_clause_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (non_solicitation_present, non_solicitation_penalty_defined)
             ≠ "not_defined";
           - "missing" — если оба содержательных поля = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - non_solicitation_present = "not_defined";
           - non_solicitation_penalty_defined = "not_defined";
           - non_solicitation_present_display = "Нет";
           - non_solicitation_penalty_defined_display = "Нет";
           - non_solicitation_period = "Не установлено";
           - non_solicitation_summary = "Не установлено";
           - не выполняй остальные шаги.

        1. non_solicitation_present:
           - "defined" — если в тексте прямо указан запрет переманивания
             или найма сотрудников другой стороны (non-solicitation);
           - "not_defined" — если такого условия прямо нет.
           Важно: не путай с обычной оговоркой о конфиденциальности.

        2. non_solicitation_present_display:
           - "Да" — если non_solicitation_present = "defined";
           - "Нет" — если "not_defined".

        3. non_solicitation_period:
           Срок действия запрета на русском языке.
           Включи оба периода, если есть: (а) в течение срока договора,
           (б) post-termination period.
           Пример: "в течение срока действия договора и 6 месяцев
           после его прекращения".
           Если данных нет — "Не установлено".
           Если данные противоречивы — "Не удалось определить".

        4. non_solicitation_penalty_defined:
           - "defined" — если прямо предусмотрена санкция за нарушение
             (штраф, неустойка, возмещение расходов на обучение);
           - "not_defined" — если санкции прямо нет.

        5. non_solicitation_penalty_defined_display:
           User-friendly описание:
           - "Да (500 000 рублей за каждого сотрудника)" — если defined
             и указан размер;
           - "Да" — если defined, но без размера;
           - "Нет" — если not_defined.

        6. non_solicitation_summary:
           Краткое user-facing описание условия о запрете переманивания.
           Включи срок, санкцию и carve-out (если есть).
           Если данных нет — "Не установлено".
           Если данные противоречивы — "Не удалось определить".
        </task>

        <context_rules>
        - Перед остальными полями заполни non_solicitation_clause_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_present / *_defined = "not_defined", все display = "Нет", все текстовые поля = "Не установлено".
        - Используй только релевантные фрагменты контекста.
        - Не подставляй нормы закона, обычную практику или предположения вместо текста договора.
        - Не извлекай сведения о цене, сроках оказания, форс-мажоре, спорах и иных нерелевантных темах.
        - Не путай запрет переманивания с обычной оговоркой о конфиденциальности.
        - Срок запрета может включать период действия договора и post-termination period — укажи оба, если есть.
        - Если есть carve-out (публичные вакансии, самостоятельный отклик) — отрази в non_solicitation_summary.
        - Если в разных фрагментах указаны разные сроки или санкции и конфликт нельзя разрешить по тексту: статус → "not_defined", текстовое поле → "Не удалось определить".
        - Не используй пустые строки.
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни запрета переманивания, ни non-solicitation,
           ни ограничений найма.
           → presence = "missing";
             все *_present / *_defined = "not_defined";
             все display = "Нет";
             все текстовые поля = "Не установлено".

        2. Запрет без санкции.
           "Исполнитель обязуется не переманивать сотрудников Заказчика
           в течение 6 месяцев после прекращения договора" без штрафа.
           → presence = "present";
             non_solicitation_present = "defined";
             non_solicitation_penalty_defined = "not_defined";
             non_solicitation_period = "6 месяцев после прекращения договора".

        3. Противоречие в сроках.
           В одной части — "12 месяцев", в другой — "24 месяца".
           → presence = "unclear";
             non_solicitation_present = "defined";
             non_solicitation_period = "Не удалось определить".

        4. Конфиденциальность без non-solicitation.
           "Стороны обязуются не разглашать конфиденциальную информацию"
           без упоминания запрета переманивания.
           → presence = "missing";
             все *_present / *_defined = "not_defined"
             (конфиденциальность ≠ non-solicitation).
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для non_solicitation_clause_presence используй только: "present", "missing", "unclear".
        - Для status-полей (*_present, *_defined) используй только: "defined", "not_defined".
        - Fallback при отсутствии данных:
          * non_solicitation_present_display → "Нет";
          * non_solicitation_penalty_defined_display → "Нет";
          * non_solicitation_period → "Не установлено";
          * non_solicitation_summary → "Не установлено".
        - Fallback при противоречии или неоднозначности:
          * все текстовые поля → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "non_solicitation_clause_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования по non-solicitation. Внутреннее агрегатное signal-поле."
          required: true

        - name: "non_solicitation_present"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values:
            - "defined"
            - "not_defined"
          description: "Есть ли запрет переманивания. Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "non_solicitation_present_display"
          type: "string"
          presentation: "fact"
          label: "Non-solicitation"
          description: >
            User-friendly описание наличия условия о запрете переманивания персонала. Fallback: "Не установлено" / "Не удалось определить".
          required: true
          display_in_grid: true
          display_priority: 1

        - name: "non_solicitation_period"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 2
          label: "Срок запрета"
          description: >
            Срок действия запрета переманивания
            (включая post-termination period, если есть).
            Fallback: "Не установлено" / "Не удалось определить".
          required: false

        - name: "non_solicitation_penalty_defined"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values:
            - "defined"
            - "not_defined"
          description: "Есть ли санкция за нарушение запрета. Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "non_solicitation_penalty_defined_display"
          type: "string"
          presentation: "fact"
          label: "Санкция за нарушение"
          description: >
            User-friendly описание наличия санкции за нарушение запрета переманивания. Fallback: "Не установлено" / "Не удалось определить".
          required: true
          display_in_grid: true
          display_priority: 3

        - name: "non_solicitation_summary"
          type: "string"
          presentation: "fact"
          label: "Описание запрета"
          description: >
            Краткое описание условия о запрете переманивания (срок, санкция, carve-out). Fallback: "Не установлено" / "Не удалось определить".
          required: false
          display_in_grid: true
          display_priority: 4
      store_payload: true

  - id: ip_non_infringement_warranty
    name: "Гарантия ненарушения прав третьих лиц (IP indemnity)"
    description: >
      Фактографическая проверка наличия в договоре гарантии исполнителя о том,
      что результат услуг не нарушает интеллектуальные права третьих лиц,
      а также условия о возмещении убытков при предъявлении претензий.
      Результат предназначен для табличного сравнения нескольких договоров.
    triggers:
      any: ["ip_creation_services", "it_services", "marketing_services"]
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "не нарушает прав"
        - "гарантирует отсутствие"
        - "претензии третьих лиц"
        - "возмещение убытков"
        - "интеллектуальные права"
        - "авторские права третьих лиц"
        - "indemnity"
        - "освободить от ответственности"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)не\\s+наруша(ет|ют).*прав.*треть"
        - "(?i)гаранти(я|рует).*отсутстви"
        - "(?i)претензи.*треть.*лиц"
        - "(?i)возмещени.*убытк.*претенз"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор возмездного оказания услуг.
        Проверяется только один вопрос: даёт ли исполнитель гарантию о том,
        что результат услуг не нарушает интеллектуальные права третьих лиц,
        и предусмотрено ли возмещение убытков при претензиях.

        Нормативный ориентир:
        - ст. 1233 ГК РФ — распоряжение исключительным правом
        - ст. 1252 ГК РФ — защита исключительных прав
        - ст. 461 ГК РФ — ответственность за изъятие товара у покупателя (по аналогии)

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора, а чего прямо нет.
        - Не оценивай серьёзность риска.
        - Юрист будет использовать результат в сравнительной таблице.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Есть ли гарантия ненарушения прав третьих лиц.
        2. На какие объекты распространяется гарантия.
        3. Есть ли обязанность возместить убытки при претензиях.
        4. Как описана гарантия.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Если условие не указано прямо:
           - для статусных полей (*_present, *_defined) возвращай "not_defined";
           - для текстовых полей (*_scope, *_summary) возвращай "Не установлено".
        4. Строго запрещено использовать "None", "null", "not_defined" (в текстовых полях) или пустые строки "".
        5. non_infringement_warranty_display:
           - Если non_infringement_warranty_present = "defined" — "Да".
           - Если "not_defined" — "Нет".
        6. indemnity_obligation_display:
           - Если indemnity_obligation_defined = "defined" — "Да".
           - Если "not_defined" — "Нет".
        7. Не путай гарантию ненарушения прав с общей гарантией качества услуг.
        8. Не путай гарантию с заверениями об обстоятельствах (R&W), если они не касаются именно IP третьих лиц.
        9. В evidence включай только точный текст договора.
        10. Верни только один валидный JSON-объект, содержащий все указанные ключи.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — полная гарантия с indemnity:
        Фрагмент:
        "Исполнитель гарантирует, что результаты услуг не нарушают исключительные
        права третьих лиц на объекты интеллектуальной собственности. В случае
        предъявления третьими лицами претензий к Заказчику, связанных с нарушением
        таких прав, Исполнитель обязуется возместить Заказчику все документально
        подтверждённые убытки."

        Ответ:
        {
          "non_infringement_warranty_present": "defined",
          "non_infringement_warranty_display": "Да",
          "non_infringement_warranty_scope": "исключительные права третьих лиц на объекты интеллектуальной собственности",
          "indemnity_obligation_defined": "defined",
          "indemnity_obligation_display": "Да",
          "non_infringement_warranty_summary": "гарантия ненарушения исключительных прав третьих лиц; возмещение всех документально подтверждённых убытков при претензиях",
          "evidence": [
            {
              "clause_ref": "п. 7.1",
              "quote": "Исполнитель гарантирует, что результаты услуг не нарушают исключительные права третьих лиц на объекты интеллектуальной собственности. В случае предъявления третьими лицами претензий к Заказчику, связанных с нарушением таких прав, Исполнитель обязуется возместить Заказчику все документально подтверждённые убытки."
            }
          ]
        }

        Пример 2 — гарантия без indemnity:
        Фрагмент:
        "Исполнитель заверяет, что все используемые при оказании услуг материалы
        являются оригинальными и не заимствованы у третьих лиц."

        Ответ:
        {
          "non_infringement_warranty_present": "defined",
          "non_infringement_warranty_display": "Да",
          "non_infringement_warranty_scope": "материалы, используемые при оказании услуг",
          "indemnity_obligation_defined": "not_defined",
          "indemnity_obligation_display": "Нет",
          "non_infringement_warranty_summary": "заверение об оригинальности материалов; indemnity не предусмотрен",
          "evidence": [
            {
              "clause_ref": "п. 5.3",
              "quote": "Исполнитель заверяет, что все используемые при оказании услуг материалы являются оригинальными и не заимствованы у третьих лиц."
            }
          ]
        }

        Пример 3 — данные отсутствуют:
        Фрагмент:
        "Исключительные права на результаты переходят к Заказчику."

        Ответ:
        {
          "non_infringement_warranty_present": "not_defined",
          "non_infringement_warranty_display": "Нет",
          "non_infringement_warranty_scope": "Не установлено",
          "indemnity_obligation_defined": "not_defined",
          "indemnity_obligation_display": "Нет",
          "non_infringement_warranty_summary": "Не установлено",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Есть ли прямая гарантия / заверение о ненарушении прав третьих лиц.
        2. Есть ли прямое указание на объём гарантии (какие объекты, какие права).
        3. Есть ли прямая обязанность возместить убытки при претензиях третьих лиц.
        4. Не путай с общей гарантией качества или с переходом прав.
        5. Если прямой цитаты нет — верни "not_defined" для статусов и "Не установлено" для текста. Не додумывай условия.

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        {
          "non_infringement_warranty_present": "<defined / not_defined>",
          "non_infringement_warranty_display": "<Да / Нет>",
          "non_infringement_warranty_scope": "<текст или 'Не установлено'>",
          "indemnity_obligation_defined": "<defined / not_defined>",
          "indemnity_obligation_display": "<Да / Нет>",
          "non_infringement_warranty_summary": "<текст или 'Не установлено'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 5
      temperature: 0.0
      max_tokens: 620

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "гарантия ненарушение прав третьих лиц интеллектуальная собственность претензии третьих лиц возмещение убытков indemnity авторские права"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - technical_fragment
        - structural_anchor
        - definition
      preferred_clause_functions:
        - obligations
      negative_keywords:
        - "неустойка"
        - "форс-мажор"
        - "подсудность"
      position_bias:
        preferred_range: [0.30, 0.75]
        boost: 0.16
        scope: segment
      context_k: 5
      max_chunks: 7
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "price_list"
        - "technical_specification"
      preferred_clause_functions:
        - obligations
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 650

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 600

      compact_output: false

      presence_signal:
        field: "ip_non_infringement_warranty_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора гарантию исполнителя
        о ненарушении прав третьих лиц и условие о возмещении убытков при
        претензиях. Не анализируй цену, сроки, форс-мажор или споры.
        Не оценивай риски. Анализируй только текст договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. ip_non_infringement_warranty_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (non_infringement_warranty_present,
              indemnity_obligation_defined) ≠ "not_defined";
           - "missing" — если оба содержательных поля = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - non_infringement_warranty_present = "not_defined";
           - indemnity_obligation_defined = "not_defined";
           - non_infringement_warranty_display = "Нет";
           - indemnity_obligation_display = "Нет";
           - non_infringement_warranty_scope = "Не установлено";
           - non_infringement_warranty_summary = "Не установлено";
           - не выполняй остальные шаги.

        1. non_infringement_warranty_present:
           - "defined" — если в тексте прямо указана гарантия или заверение
             о том, что результаты услуг не нарушают интеллектуальные
             (исключительные, авторские) права третьих лиц;
           - "not_defined" — если такой гарантии прямо нет.
           Важно: не путай с общей гарантией качества услуг или с
           переходом исключительных прав.

        2. non_infringement_warranty_display:
           - "Да" — если non_infringement_warranty_present = "defined";
           - "Нет" — если "not_defined".

        3. non_infringement_warranty_scope:
           На какие объекты/права распространяется гарантия.
           Пример: "исключительные права третьих лиц на объекты ИС",
           "материалы, используемые при оказании услуг".
           Если данных нет — "Не установлено".
           Если данные противоречивы — "Не удалось определить".

        4. indemnity_obligation_defined:
           - "defined" — если прямо предусмотрена обязанность Исполнителя
             возместить убытки Заказчику при предъявлении претензий
             третьих лиц, связанных с нарушением IP;
           - "not_defined" — если такой обязанности прямо нет.

        5. indemnity_obligation_display:
           - "Да" — если indemnity_obligation_defined = "defined";
           - "Нет" — если "not_defined".

        6. non_infringement_warranty_summary:
           Краткое user-facing описание гарантии и indemnity.
           Если данных нет — "Не установлено".
           Если данные противоречивы — "Не удалось определить".
        </task>

        <context_rules>
        - Перед остальными полями заполни ip_non_infringement_warranty_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_present / *_defined = "not_defined", все display = "Нет", все текстовые поля = "Не установлено".
        - Используй только релевантные фрагменты контекста.
        - Не подставляй нормы закона, обычную практику или предположения вместо текста договора.
        - Не извлекай сведения о цене, сроках, форс-мажоре, спорах и иных нерелевантных темах.
        - Не путай гарантию ненарушения прав с общей гарантией качества услуг.
        - Не путай гарантию с заверениями об обстоятельствах (R&W), если они не касаются именно IP третьих лиц.
        - Не путай гарантию ненарушения с переходом исключительных прав (это отдельная тема).
        - Если в разных фрагментах указаны противоречивые условия и конфликт нельзя разрешить по тексту: статус → "not_defined", текстовое поле → "Не удалось определить".
        - Не используй пустые строки.
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни гарантии ненарушения, ни indemnity,
           ни заверений о правах третьих лиц.
           → presence = "missing";
             все *_present / *_defined = "not_defined";
             все display = "Нет";
             все текстовые поля = "Не установлено".

        2. Гарантия без indemnity.
           "Исполнитель заверяет, что материалы не заимствованы у
           третьих лиц" без обязанности возмещения убытков.
           → presence = "present";
             non_infringement_warranty_present = "defined";
             indemnity_obligation_defined = "not_defined".

        3. Противоречие между фрагментами.
           В одной части — "гарантирует ненарушение", в другой —
           "не несёт ответственности за претензии третьих лиц".
           → presence = "unclear";
             non_infringement_warranty_present = "not_defined";
             non_infringement_warranty_summary = "Не удалось определить".

        4. Только переход прав (не гарантия).
           "Исключительные права на результаты переходят к Заказчику"
           без гарантии ненарушения.
           → presence = "missing";
             все *_present / *_defined = "not_defined"
             (переход прав ≠ гарантия ненарушения).
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для ip_non_infringement_warranty_presence используй только: "present", "missing", "unclear".
        - Для *_present / *_defined используй только: "defined", "not_defined".
        - Fallback при отсутствии данных:
          * non_infringement_warranty_display → "Нет";
          * indemnity_obligation_display → "Нет";
          * non_infringement_warranty_scope → "Не установлено";
          * non_infringement_warranty_summary → "Не установлено".
        - Fallback при противоречии или неоднозначности:
          * все текстовые поля → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "ip_non_infringement_warranty_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования по IP-гарантии/indemnity. Внутреннее агрегатное signal-поле."
          required: true

        - name: "non_infringement_warranty_present"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values:
            - "defined"
            - "not_defined"
          description: "Есть ли гарантия ненарушения прав третьих лиц. Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "non_infringement_warranty_display"
          type: "string"
          presentation: "fact"
          label: "Гарантия IP"
          description: >
            User-friendly описание наличия гарантии ненарушения прав третьих лиц. Fallback: "Не установлено" / "Не удалось определить".
          required: true
          display_in_grid: true
          display_priority: 1

        - name: "non_infringement_warranty_scope"
          type: "string"
          presentation: "fact"
          label: "Объём гарантии"
          description: >
            На какие объекты/права распространяется гарантия. Fallback: "Не установлено" / "Не удалось определить".
          required: false
          display_in_grid: true
          display_priority: 2

        - name: "indemnity_obligation_defined"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values:
            - "defined"
            - "not_defined"
          description: "Есть ли обязанность возместить убытки при претензиях третьих лиц. Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "indemnity_obligation_display"
          type: "string"
          presentation: "fact"
          label: "Indemnity"
          description: >
            User-friendly описание наличия обязанности возмещения убытков. Fallback: "Не установлено" / "Не удалось определить".
          required: true
          display_in_grid: true
          display_priority: 3

        - name: "non_infringement_warranty_summary"
          type: "string"
          presentation: "fact"
          label: "Описание гарантии"
          description: >
            Краткое описание гарантии ненарушения прав и indemnity. Fallback: "Не установлено" / "Не удалось определить".
          required: false
          display_in_grid: true
          display_priority: 4
      store_payload: true

  - id: audit_and_reporting_rights
    name: "Право аудита и отчётности (right to audit)"
    description: >
      Фактографическая проверка наличия в договоре права заказчика запрашивать
      детализированные отчёты, проводить аудит исполнения и проверять
      корректность начислений. Результат предназначен для табличного
      сравнения нескольких договоров.
    triggers:
      any: ["sla_based", "it_services", "outsourcing", "subscription_model"]
    ui_mode: "field_extraction"
    severity: "medium"
    severity_if_pass: "pass"
    severity_if_fail: "medium"
    severity_if_unclear: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "право на аудит"
        - "аудит исполнения"
        - "проверка отчётности"
        - "детализированный отчёт"
        - "запрос отчёта"
        - "контроль качества"
        - "мониторинг"
        - "лог-файлы"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)прав(о|а).*аудит"
        - "(?i)аудит.*исполнен"
        - "(?i)детализир.*отч[её]т"
        - "(?i)проверк.*отч[её]тност"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор возмездного оказания услуг.
        Проверяется только один вопрос: есть ли у заказчика право запрашивать
        отчёты, проводить аудит исполнения и проверять корректность начислений.

        Нормативный ориентир:
        - ст. 715 ГК РФ по аналогии — право заказчика проверять ход и качество работы
        - ст. 783 ГК РФ — применение правил к услугам

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора, а чего прямо нет.
        - Не оценивай серьёзность риска.
        - Юрист будет использовать результат в сравнительной таблице.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Есть ли право заказчика на аудит / проверку.
        2. Есть ли обязанность исполнителя предоставлять отчёты.
        3. Какая периодичность отчётности.
        4. Как описаны права контроля.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Если условие не указано прямо:
           - для статусных полей (*_defined) возвращай "not_defined";
           - для текстовых полей (*_period, *_summary) возвращай "Не установлено".
        4. Строго запрещено использовать "None", "null", "not_defined" (в текстовых полях) или пустые строки "".
        5. audit_right_display:
           - Если audit_right_defined = "defined" — "Да".
           - Если "not_defined" — "Нет".
        6. reporting_obligation_display:
           - Если reporting_obligation_defined = "defined" — "Да".
           - Если "not_defined" — "Нет".
        7. Не путай право аудита с обычным правом заказчика контролировать ход работ (ст. 715 ГК РФ) — ищи именно договорные механизмы отчётности и аудита.
        8. В evidence включай только точный текст договора.
        9. Верни только один валидный JSON-объект, содержащий все указанные ключи.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — полный аудит и отчётность:
        Фрагмент:
        "Исполнитель обязуется ежемесячно предоставлять Заказчику детализированный
        отчёт об оказанных услугах. Заказчик вправе не реже одного раза в квартал
        проводить аудит исполнения, в том числе с привлечением независимых
        экспертов, с предварительным уведомлением за 10 рабочих дней."

        Ответ:
        {
          "audit_right_defined": "defined",
          "audit_right_display": "Да",
          "reporting_obligation_defined": "defined",
          "reporting_obligation_display": "Да",
          "reporting_period": "ежемесячно",
          "audit_and_reporting_summary": "ежемесячные детализированные отчёты; право аудита раз в квартал с привлечением независимых экспертов; уведомление за 10 рабочих дней",
          "evidence": [
            {
              "clause_ref": "п. 6.1",
              "quote": "Исполнитель обязуется ежемесячно предоставлять Заказчику детализированный отчёт об оказанных услугах. Заказчик вправе не реже одного раза в квартал проводить аудит исполнения, в том числе с привлечением независимых экспертов, с предварительным уведомлением за 10 рабочих дней."
            }
          ]
        }

        Пример 2 — только отчётность, без аудита:
        Фрагмент:
        "Исполнитель направляет Заказчику отчёт об оказанных услугах не позднее
        5-го числа каждого месяца."

        Ответ:
        {
          "audit_right_defined": "not_defined",
          "audit_right_display": "Нет",
          "reporting_obligation_defined": "defined",
          "reporting_obligation_display": "Да",
          "reporting_period": "ежемесячно (не позднее 5-го числа)",
          "audit_and_reporting_summary": "ежемесячные отчёты не позднее 5-го числа; право аудита не предусмотрено",
          "evidence": [
            {
              "clause_ref": "п. 4.2",
              "quote": "Исполнитель направляет Заказчику отчёт об оказанных услугах не позднее 5-го числа каждого месяца."
            }
          ]
        }

        Пример 3 — данные отсутствуют:
        Фрагмент:
        "Услуги оказываются в соответствии с Техническим заданием."

        Ответ:
        {
          "audit_right_defined": "not_defined",
          "audit_right_display": "Нет",
          "reporting_obligation_defined": "not_defined",
          "reporting_obligation_display": "Нет",
          "reporting_period": "Не установлено",
          "audit_and_reporting_summary": "Не установлено",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Есть ли прямое право заказчика на аудит / проверку исполнения.
        2. Есть ли прямая обязанность исполнителя предоставлять отчёты.
        3. Есть ли указание на периодичность отчётности.
        4. Если прямой цитаты нет — верни "not_defined" для статусов и "Не установлено" для текста. Не додумывай условия.

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        {
          "audit_right_defined": "<defined / not_defined>",
          "audit_right_display": "<Да / Нет>",
          "reporting_obligation_defined": "<defined / not_defined>",
          "reporting_obligation_display": "<Да / Нет>",
          "reporting_period": "<текст или 'Не установлено'>",
          "audit_and_reporting_summary": "<текст или 'Не установлено'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 5
      temperature: 0.0
      max_tokens: 600

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "право на аудит аудит исполнения проверка отчётности детализированный отчёт запрос отчёта контроль качества мониторинг периодичность"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - technical_fragment
        - structural_anchor
        - definition
      preferred_clause_functions:
        - obligations
      negative_keywords:
        - "неустойка"
        - "форс-мажор"
        - "подсудность"
      position_bias:
        preferred_range: [0.25, 0.70]
        boost: 0.14
        scope: segment
      context_k: 5
      max_chunks: 7
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "price_list"
        - "technical_specification"
      preferred_clause_functions:
        - obligations
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 650

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 550

      compact_output: false

      presence_signal:
        field: "audit_and_reporting_rights_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора право заказчика
        на аудит и контроль исполнения, обязанность отчётности и её
        периодичность. Не анализируй цену, санкции, форс-мажор или споры.
        Не оценивай риски. Анализируй только текст договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. audit_and_reporting_rights_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (audit_right_defined, reporting_obligation_defined)
             ≠ "not_defined";
           - "missing" — если оба содержательных поля = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - audit_right_defined = "not_defined";
           - reporting_obligation_defined = "not_defined";
           - audit_right_display = "Нет";
           - reporting_obligation_display = "Нет";
           - reporting_period = "Не установлено";
           - audit_and_reporting_summary = "Не установлено";
           - не выполняй остальные шаги.

        1. audit_right_defined:
           - "defined" — если в тексте прямо указано право Заказчика
             проводить аудит, проверку, ревизию исполнения (в том числе
             с привлечением независимых экспертов);
           - "not_defined" — если такого права прямо нет.
           Важно: не путай с обычным правом контролировать ход работ
           (ст. 715 ГК РФ) — ищи именно договорные механизмы аудита.

        2. audit_right_display:
           - "Да" — если audit_right_defined = "defined";
           - "Нет" — если "not_defined".

        3. reporting_obligation_defined:
           - "defined" — если в тексте прямо указана обязанность
             Исполнителя предоставлять отчёты, детализацию, логи,
             дашборды или иные формы отчётности;
           - "not_defined" — если такой обязанности прямо нет.

        4. reporting_obligation_display:
           - "Да" — если reporting_obligation_defined = "defined";
           - "Нет" — если "not_defined".

        5. reporting_period:
           Периодичность отчётности на русском языке.
           Примеры: "ежемесячно", "ежеквартально", "по запросу",
           "ежемесячно (не позднее 5-го числа)".
           Если данных нет — "Не установлено".
           Если данные противоречивы — "Не удалось определить".

        6. audit_and_reporting_summary:
           Краткое user-facing описание прав контроля и отчётности.
           Включи периодичность, право аудита, уведомления, привлечение
           экспертов (если есть).
           Если данных нет — "Не установлено".
           Если данные противоречивы — "Не удалось определить".
        </task>

        <context_rules>
        - Перед остальными полями заполни audit_and_reporting_rights_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_defined = "not_defined", все display = "Нет", все текстовые поля = "Не установлено".
        - Используй только релевантные фрагменты контекста.
        - Не подставляй нормы закона, обычную практику или предположения вместо текста договора.
        - Не извлекай сведения о цене, санкциях, форс-мажоре, спорах и иных нерелевантных темах.
        - Не путай право аудита с обычным правом заказчика контролировать ход работ (ст. 715 ГК РФ) — ищи именно договорные механизмы отчётности и аудита.
        - Если в разных фрагментах указаны разные периоды или условия и конфликт нельзя разрешить по тексту: статус → "not_defined", текстовое поле → "Не удалось определить".
        - Не используй пустые строки.
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни права аудита, ни обязанности отчётности,
           ни периодичности.
           → presence = "missing";
             все *_defined = "not_defined";
             все display = "Нет";
             все текстовые поля = "Не установлено".

        2. Только отчётность без аудита.
           "Исполнитель направляет отчёт не позднее 5-го числа каждого
           месяца" без права аудита.
           → presence = "present";
             reporting_obligation_defined = "defined";
             reporting_period = "ежемесячно (не позднее 5-го числа)";
             audit_right_defined = "not_defined".

        3. Противоречие в периодичности.
           В одной части — "ежемесячно", в другой — "ежеквартально".
           → presence = "unclear";
             reporting_obligation_defined = "defined";
             reporting_period = "Не удалось определить".

        4. Общее право контроля (не аудит).
           "Заказчик вправе контролировать ход оказания услуг" без
           конкретных механизмов аудита и отчётности.
           → presence = "missing";
             все *_defined = "not_defined"
             (общее право контроля ≠ договорный механизм аудита).
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для audit_and_reporting_rights_presence используй только: "present", "missing", "unclear".
        - Для *_defined используй только: "defined", "not_defined".
        - Fallback при отсутствии данных:
          * audit_right_display → "Нет";
          * reporting_obligation_display → "Нет";
          * reporting_period → "Не установлено";
          * audit_and_reporting_summary → "Не установлено".
        - Fallback при противоречии или неоднозначности:
          * все текстовые поля → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "audit_and_reporting_rights_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования по аудиту/отчётности. Внутреннее агрегатное signal-поле."
          required: true

        - name: "audit_right_defined"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values:
            - "defined"
            - "not_defined"
          description: "Есть ли право заказчика на аудит / проверку исполнения. Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "audit_right_display"
          type: "string"
          presentation: "fact"
          label: "Право аудита"
          description: >
            User-friendly описание наличия права аудита. Fallback: "Не установлено" / "Не удалось определить".
          required: true
          display_in_grid: true
          display_priority: 1

        - name: "reporting_obligation_defined"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values:
            - "defined"
            - "not_defined"
          description: "Есть ли обязанность исполнителя предоставлять отчёты. Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "reporting_obligation_display"
          type: "string"
          presentation: "fact"
          label: "Отчётность"
          description: >
            User-friendly описание обязанности отчётности. Fallback: "Не установлено" / "Не удалось определить".
          required: true
          display_in_grid: true
          display_priority: 2

        - name: "reporting_period"
          type: "string"
          presentation: "fact"
          label: "Периодичность отчётов"
          description: >
            Периодичность предоставления отчётов. Fallback: "Не установлено" / "Не удалось определить".
          required: false
          display_in_grid: true
          display_priority: 3

        - name: "audit_and_reporting_summary"
          type: "string"
          presentation: "fact"
          label: "Контроль исполнения"
          description: >
            Краткое описание прав контроля и отчётности. Fallback: "Не установлено" / "Не удалось определить".
          required: false
          display_in_grid: true
          display_priority: 4
      store_payload: true

  - id: transition_assistance_obligations
    name: "Помощь в переходе (transition / exit management)"
    description: >
      Фактографическая проверка наличия в договоре обязанностей исполнителя
      по содействию в переходе к новому подрядчику при прекращении договора:
      передача дел, документации, доступов и переходный период.
      Результат предназначен для табличного сравнения нескольких договоров.
    triggers:
      any: ["it_services", "outsourcing", "sla_based"]
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "переходный период"
        - "передача дел"
        - "transition"
        - "exit management"
        - "содействие в переходе"
        - "передача документации"
        - "передача доступов"
        - "обучение нового подрядчика"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)переходн(ый|ого)\\s+период"
        - "(?i)передач(а|и)\\s+дел"
        - "(?i)transition"
        - "(?i)exit\\s+management"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор возмездного оказания услуг.
        Проверяется только один вопрос: есть ли обязанности исполнителя
        по содействию в переходе к новому подрядчику при прекращении договора.

        Нормативный ориентир:
        - ст. 421 ГК РФ — свобода договора
        - договорная практика exit management

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора, а чего прямо нет.
        - Не оценивай серьёзность риска.
        - Юрист будет использовать результат в сравнительной таблице.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Есть ли обязанность по содействию в переходе.
        2. Какой переходный период указан.
        3. Что именно передаётся (документация, доступы, обучение).
        4. Как описан переход.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Если условие не указано прямо:
           - для статусных полей (*_defined) возвращай "not_defined";
           - для текстовых полей (*_period, *_summary) возвращай "Не установлено".
        4. Строго запрещено использовать "None", "null", "not_defined" (в текстовых полях) или пустые строки "".
        5. transition_assistance_display:
           - Если transition_assistance_defined = "defined" — "Да".
           - Если "not_defined" — "Нет".
        6. Не путай переходный период с обычным возвратом данных (Check 8) — transition включает активные обязанности по передаче дел, обучению, поддержке.
        7. В evidence включай только точный текст договора.
        8. Верни только один валидный JSON-объект, содержащий все указанные ключи.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — полный transition:
        Фрагмент:
        "При прекращении договора Исполнитель обязуется в течение 60 календарных
        дней (переходный период) передать новому подрядчику Заказчика всю
        техническую документацию, доступы к системам и обеспечить обучение
        персонала. Услуги в переходный период оплачиваются по действующим тарифам."

        Ответ:
        {
          "transition_assistance_defined": "defined",
          "transition_assistance_display": "Да",
          "transition_period": "60 календарных дней",
          "transition_scope": "передача технической документации, доступов к системам, обучение персонала",
          "transition_assistance_summary": "переходный период 60 дней; передача документации, доступов, обучение нового подрядчика; оплата по действующим тарифам",
          "evidence": [
            {
              "clause_ref": "п. 11.3",
              "quote": "При прекращении договора Исполнитель обязуется в течение 60 календарных дней (переходный период) передать новому подрядчику Заказчика всю техническую документацию, доступы к системам и обеспечить обучение персонала. Услуги в переходный период оплачиваются по действующим тарифам."
            }
          ]
        }

        Пример 2 — данные отсутствуют:
        Фрагмент:
        "При прекращении договора Исполнитель возвращает материалы Заказчика."

        Ответ:
        {
          "transition_assistance_defined": "not_defined",
          "transition_assistance_display": "Нет",
          "transition_period": "Не установлено",
          "transition_scope": "Не установлено",
          "transition_assistance_summary": "Не установлено",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Есть ли прямая обязанность по содействию в переходе (не просто возврат данных).
        2. Есть ли указание на переходный период.
        3. Есть ли указание на объём передачи (документация, доступы, обучение).
        4. Если прямой цитаты нет — верни "not_defined" для статусов и "Не установлено" для текста. Не додумывай условия.

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        {
          "transition_assistance_defined": "<defined / not_defined>",
          "transition_assistance_display": "<Да / Нет>",
          "transition_period": "<текст или 'Не установлено'>",
          "transition_scope": "<текст или 'Не установлено'>",
          "transition_assistance_summary": "<текст или 'Не установлено'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 5
      temperature: 0.0
      max_tokens: 600

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "переходный период передача дел transition exit management содействие в переходе передача документации передача доступов обучение нового подрядчика"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - technical_fragment
        - structural_anchor
        - definition
      preferred_clause_functions:
        - obligations
      negative_keywords:
        - "неустойка"
        - "форс-мажор"
        - "подсудность"
      position_bias:
        preferred_range: [0.55, 1.0]
        boost: 0.16
        scope: segment
      context_k: 5
      max_chunks: 7
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "price_list"
        - "technical_specification"
      preferred_clause_functions:
        - obligations
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 650

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 550

      compact_output: false

      presence_signal:
        field: "transition_assistance_obligations_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора обязанности
        исполнителя по содействию в переходе к новому подрядчику: переходный
        период, объём передачи, оплата. Не анализируй цену, санкции,
        форс-мажор или споры.
        Не оценивай риски. Анализируй только текст договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. transition_assistance_obligations_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если transition_assistance_defined ≠ "not_defined";
           - "missing" — если transition_assistance_defined = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - transition_assistance_defined = "not_defined";
           - transition_assistance_display = "Нет";
           - transition_period = "Не установлено";
           - transition_scope = "Не установлено";
           - transition_assistance_summary = "Не установлено";
           - не выполняй остальные шаги.

        1. transition_assistance_defined:
           - "defined" — если в тексте прямо указана обязанность Исполнителя
             по содействию в переходе к новому подрядчику (передача дел,
             обучение, поддержка в переходный период, exit management);
           - "not_defined" — если такой обязанности прямо нет.
           Важно: не путай с обычным возвратом данных/материалов —
           transition включает активные обязанности по передаче дел,
           обучению, поддержке.

        2. transition_assistance_display:
           - "Да" — если transition_assistance_defined = "defined";
           - "Нет" — если "not_defined".

        3. transition_period:
           Срок переходного периода на русском языке.
           Пример: "60 календарных дней", "3 месяца".
           Если данных нет — "Не установлено".
           Если данные противоречивы — "Не удалось определить".

        4. transition_scope:
           Что именно передаётся при переходе.
           Пример: "передача технической документации, доступов к системам,
           обучение персонала".
           Если данных нет — "Не установлено".
           Если данные противоречивы — "Не удалось определить".

        5. transition_assistance_summary:
           Краткое user-facing описание условий перехода.
           Включи период, объём, оплату переходного периода (если есть).
           Если данных нет — "Не установлено".
           Если данные противоречивы — "Не удалось определить".
        </task>

        <context_rules>
        - Перед остальными полями заполни transition_assistance_obligations_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — transition_assistance_defined = "not_defined", display = "Нет", все текстовые поля = "Не установлено".
        - Используй только релевантные фрагменты контекста.
        - Не подставляй нормы закона, обычную практику или предположения вместо текста договора.
        - Не извлекай сведения о цене, санкциях, форс-мажоре, спорах и иных нерелевантных темах.
        - Не путай переходный период (transition) с обычным возвратом данных/материалов — transition включает активные обязанности по передаче дел, обучению, поддержке нового подрядчика.
        - Если в разных фрагментах указаны разные сроки или условия и конфликт нельзя разрешить по тексту: статус → "not_defined", текстовое поле → "Не удалось определить".
        - Не используй пустые строки.
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни transition, ни exit management,
           ни переходного периода, ни передачи дел.
           → presence = "missing";
             transition_assistance_defined = "not_defined";
             display = "Нет";
             все текстовые поля = "Не установлено".

        2. Только возврат данных (не transition).
           "При прекращении договора Исполнитель возвращает материалы
           Заказчика и удаляет его данные."
           → presence = "missing";
             transition_assistance_defined = "not_defined"
             (возврат данных ≠ transition assistance).

        3. Противоречие в сроках.
           В одной части — "30 дней", в другой — "90 дней".
           → presence = "unclear";
             transition_assistance_defined = "defined";
             transition_period = "Не удалось определить".

        4. Transition по внешнему документу.
           "Порядок перехода определяется согласно Регламенту exit
           management (Приложение № 6)."
           → presence = "present";
             transition_assistance_defined = "defined";
             transition_scope = "Определяется по Приложению № 6";
             transition_period = "Не установлено".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для transition_assistance_obligations_presence используй только: "present", "missing", "unclear".
        - Для transition_assistance_defined используй только: "defined", "not_defined".
        - Fallback при отсутствии данных:
          * transition_assistance_display → "Нет";
          * transition_period → "Не установлено";
          * transition_scope → "Не установлено";
          * transition_assistance_summary → "Не установлено".
        - Fallback при противоречии или неоднозначности:
          * все текстовые поля → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "transition_assistance_obligations_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования по transition/exit management. Внутреннее агрегатное signal-поле."
          required: true

        - name: "transition_assistance_defined"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values:
            - "defined"
            - "not_defined"
          description: "Есть ли обязанность по содействию в переходе. Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "transition_assistance_display"
          type: "string"
          presentation: "fact"
          label: "Transition"
          description: >
            User-friendly описание наличия обязанности по содействию в переходе. Fallback: "Не установлено" / "Не удалось определить".
          required: true
          display_in_grid: true
          display_priority: 1

        - name: "transition_period"
          type: "string"
          presentation: "fact"
          label: "Переходный период"
          description: >
            Срок переходного периода. Fallback: "Не установлено" / "Не удалось определить".
          required: false
          display_in_grid: true
          display_priority: 2

        - name: "transition_scope"
          type: "string"
          presentation: "fact"
          label: "Объём передачи"
          description: >
            Что именно передаётся при переходе. Fallback: "Не установлено" / "Не удалось определить".
          required: false
          display_in_grid: true
          display_priority: 3

        - name: "transition_assistance_summary"
          type: "string"
          presentation: "fact"
          label: "Описание перехода"
          description: >
            Краткое описание условий перехода. Fallback: "Не установлено" / "Не удалось определить".
          required: false
          display_in_grid: true
          display_priority: 4
      store_payload: true

  - id: client_materials_liability
    name: "Ответственность за материалы и данные Заказчика (ст. 714 ГК РФ по аналогии)"
    description: >
      Фактографическая проверка наличия в договоре условий об ответственности
      исполнителя за сохранность материалов, оборудования и данных,
      предоставленных заказчиком. Результат предназначен для табличного
      сравнения нескольких договоров.
    triggers:
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "сохранность материалов"
        - "предоставленные заказчиком"
        - "утрата данных"
        - "повреждение оборудования"
        - "ответственность за сохранность"
        - "бережное хранение"
        - "возврат материалов"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)сохранност(ь|и).*материал"
        - "(?i)предоставленн(ые|ых).*заказчик"
        - "(?i)утрат(а|ы).*данны"
        - "(?i)бережн(ое|ого).*хранени"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор возмездного оказания услуг.
        Проверяется только один вопрос: несёт ли исполнитель ответственность
        за сохранность материалов, оборудования и данных, предоставленных
        заказчиком.

        Нормативный ориентир:
        - ст. 714 ГК РФ по аналогии — ответственность подрядчика за сохранность материалов заказчика
        - ст. 783 ГК РФ — применение правил к услугам

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора, а чего прямо нет.
        - Не оценивай серьёзность риска.
        - Юрист будет использовать результат в сравнительной таблице.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Есть ли обязанность исполнителя обеспечить сохранность материалов.
        2. Есть ли ответственность за утрату или повреждение.
        3. Как описаны условия.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Если условие не указано прямо:
           - для статусных полей (*_defined) возвращай "not_defined";
           - для текстовых полей (*_summary) возвращай "Не установлено".
        4. Строго запрещено использовать "None", "null", "not_defined" (в текстовых полях) или пустые строки "".
        5. materials_safekeeping_display:
           - Если materials_safekeeping_defined = "defined" — "Да".
           - Если "not_defined" — "Нет".
        6. materials_liability_display:
           - Если materials_liability_defined = "defined" — "Да".
           - Если "not_defined" — "Нет".
        7. В evidence включай только точный текст договора.
        8. Верни только один валидный JSON-объект, содержащий все указанные ключи.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — полная ответственность:
        Фрагмент:
        "Исполнитель обязан обеспечить сохранность всех материалов, оборудования
        и данных, предоставленных Заказчиком. В случае утраты или повреждения
        Исполнитель возмещает Заказчику полную стоимость утраченного имущества
        и восстанавливает данные за свой счёт."

        Ответ:
        {
          "materials_safekeeping_defined": "defined",
          "materials_safekeeping_display": "Да",
          "materials_liability_defined": "defined",
          "materials_liability_display": "Да",
          "client_materials_liability_summary": "обязанность обеспечить сохранность материалов, оборудования и данных; возмещение полной стоимости при утрате; восстановление данных за счёт исполнителя",
          "evidence": [
            {
              "clause_ref": "п. 4.5",
              "quote": "Исполнитель обязан обеспечить сохранность всех материалов, оборудования и данных, предоставленных Заказчиком. В случае утраты или повреждения Исполнитель возмещает Заказчику полную стоимость утраченного имущества и восстанавливает данные за свой счёт."
            }
          ]
        }

        Пример 2 — данные отсутствуют:
        Фрагмент:
        "Заказчик предоставляет Исполнителю доступ к информационным системам."

        Ответ:
        {
          "materials_safekeeping_defined": "not_defined",
          "materials_safekeeping_display": "Нет",
          "materials_liability_defined": "not_defined",
          "materials_liability_display": "Нет",
          "client_materials_liability_summary": "Не установлено",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Есть ли прямая обязанность обеспечить сохранность материалов/данных.
        2. Есть ли прямая ответственность за утрату/повреждение.
        3. Если прямой цитаты нет — верни "not_defined" для статусов и "Не установлено" для текста. Не додумывай условия.

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        {
          "materials_safekeeping_defined": "<defined / not_defined>",
          "materials_safekeeping_display": "<Да / Нет>",
          "materials_liability_defined": "<defined / not_defined>",
          "materials_liability_display": "<Да / Нет>",
          "client_materials_liability_summary": "<текст или 'Не установлено'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 5
      temperature: 0.0
      max_tokens: 550

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "сохранность материалов предоставленные заказчиком утрата данных повреждение оборудования ответственность за сохранность бережное хранение возврат материалов"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - technical_fragment
        - structural_anchor
        - definition
      preferred_clause_functions:
        - obligations
      negative_keywords:
        - "неустойка"
        - "форс-мажор"
        - "подсудность"
      position_bias:
        preferred_range: [0.20, 0.65]
        boost: 0.14
        scope: segment
      context_k: 5
      max_chunks: 7
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "price_list"
        - "technical_specification"
      preferred_clause_functions:
        - obligations
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 650

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 500

      compact_output: false

      presence_signal:
        field: "client_materials_liability_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора условия об
        ответственности исполнителя за сохранность материалов, оборудования
        и данных, предоставленных заказчиком. Не анализируй цену, санкции,
        форс-мажор или споры.
        Не оценивай риски. Анализируй только текст договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. client_materials_liability_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (materials_safekeeping_defined, materials_liability_defined)
             ≠ "not_defined";
           - "missing" — если оба содержательных поля = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - materials_safekeeping_defined = "not_defined";
           - materials_liability_defined = "not_defined";
           - materials_safekeeping_display = "Нет";
           - materials_liability_display = "Нет";
           - client_materials_liability_summary = "Не установлено";
           - не выполняй остальные шаги.

        1. materials_safekeeping_defined:
           - "defined" — если в тексте прямо указана обязанность Исполнителя
             обеспечить сохранность материалов, оборудования и/или данных,
             предоставленных Заказчиком (бережное хранение, защита от
             несанкционированного доступа и т.п.);
           - "not_defined" — если такой обязанности прямо нет.

        2. materials_safekeeping_display:
           - "Да" — если materials_safekeeping_defined = "defined";
           - "Нет" — если "not_defined".

        3. materials_liability_defined:
           - "defined" — если в тексте прямо предусмотрена ответственность
             Исполнителя за утрату, повреждение или несанкционированный
             доступ к материалам/данным/оборудованию Заказчика (возмещение
             стоимости, восстановление данных и т.п.);
           - "not_defined" — если такой ответственности прямо нет.

        4. materials_liability_display:
           - "Да" — если materials_liability_defined = "defined";
           - "Нет" — если "not_defined".

        5. client_materials_liability_summary:
           Краткое user-facing описание условий ответственности.
           Включи объём (материалы, оборудование, данные), характер
           ответственности (возмещение, восстановление), исключения (если есть).
           Если данных нет — "Не установлено".
           Если данные противоречивы — "Не удалось определить".
        </task>

        <context_rules>
        - Перед остальными полями заполни client_materials_liability_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_defined = "not_defined", все display = "Нет", summary = "Не установлено".
        - Используй только релевантные фрагменты контекста.
        - Не подставляй нормы закона, обычную практику или предположения вместо текста договора.
        - Не извлекай сведения о цене, санкциях за просрочку, форс-мажоре, спорах и иных нерелевантных темах.
        - Не путай обязанность по сохранности с обычным возвратом данных при прекращении договора (возврат ≠ сохранность в течение срока).
        - Не путай ответственность за материалы с общей ответственностью за качество услуг.
        - Если в разных фрагментах указаны противоречивые условия и конфликт нельзя разрешить по тексту: статус → "not_defined", текстовое поле → "Не удалось определить".
        - Не используй пустые строки.
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни сохранности, ни ответственности за утрату,
           ни бережного хранения материалов Заказчика.
           → presence = "missing";
             все *_defined = "not_defined";
             все display = "Нет";
             summary = "Не установлено".

        2. Сохранность без ответственности за утрату.
           "Исполнитель обязан бережно хранить материалы Заказчика"
           без указания последствий утраты.
           → presence = "present";
             materials_safekeeping_defined = "defined";
             materials_liability_defined = "not_defined".

        3. Противоречие между фрагментами.
           В одной части — "полная ответственность за утрату",
           в другой — "Исполнитель не отвечает за сохранность данных".
           → presence = "unclear";
             materials_liability_defined = "not_defined";
             summary = "Не удалось определить".

        4. Только возврат данных (не сохранность).
           "При прекращении договора Исполнитель возвращает все
           материалы Заказчика."
           → presence = "missing";
             все *_defined = "not_defined"
             (возврат ≠ обязанность по сохранности в течение срока).
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для client_materials_liability_presence используй только: "present", "missing", "unclear".
        - Для *_defined используй только: "defined", "not_defined".
        - Fallback при отсутствии данных:
          * materials_safekeeping_display → "Нет";
          * materials_liability_display → "Нет";
          * client_materials_liability_summary → "Не установлено".
        - Fallback при противоречии или неоднозначности:
          * client_materials_liability_summary → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "client_materials_liability_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования по сохранности/ответственности за материалы. Внутреннее агрегатное signal-поле."
          required: true

        - name: "materials_safekeeping_defined"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values:
            - "defined"
            - "not_defined"
          description: "Есть ли обязанность обеспечить сохранность материалов заказчика. Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "materials_safekeeping_display"
          type: "string"
          presentation: "fact"
          label: "Сохранность материалов"
          description: >
            User-friendly описание обязанности по сохранности. Fallback: "Не установлено" / "Не удалось определить".
          required: true
          display_in_grid: true
          display_priority: 1

        - name: "materials_liability_defined"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values:
            - "defined"
            - "not_defined"
          description: "Есть ли ответственность за утрату или повреждение. Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "materials_liability_display"
          type: "string"
          presentation: "fact"
          label: "Ответственность за утрату"
          description: >
            User-friendly описание ответственности за утрату/повреждение. Fallback: "Не установлено" / "Не удалось определить".
          required: true
          display_in_grid: true
          display_priority: 2

        - name: "client_materials_liability_summary"
          type: "string"
          presentation: "fact"
          label: "Описание ответственности"
          description: >
            Краткое описание условий ответственности за материалы заказчика. Fallback: "Не установлено" / "Не удалось определить".
          required: false
          display_in_grid: true
          display_priority: 3
      store_payload: true

# ════════════════════════════════════════════════════════════════════════════
# БЛОК 5: DD_REQUEST_TEMPLATES
# Читается: DDRequestTemplateLoader
# ════════════════════════════════════════════════════════════════════════════

dd_request_templates:

  service_subject_extraction:
    text: >
      Просим подтвердить по {doc_names}: (а) полный перечень видов услуг;
      (б) объём/количество услуг; (в) ссылку на ТЗ/спецификацию;
      (г) конкретные deliverables; (д) стандарты качества.
    addressee: "Обе стороны"

  detailed_service_specification_check:
    text: >
      В {doc_names} предмет услуг описан недостаточно конкретно. Просим предоставить
      детальную спецификацию / ТЗ (ст. 779, 432 ГК РФ): (а) перечень конкретных действий;
      (б) методологию оказания; (в) измеримые критерии приёмки;
      (г) ожидаемые deliverables; (д) стандарты качества.
    addressee: "Заказчик"

  price_and_payment_terms:
    text: >
      Просим подтвердить по {doc_names}: (а) стоимость услуг цифрами и прописью;
      (б) модель ценообразования (фиксированная / почасовая / абонентская);
      (в) включает ли цена НДС; (г) порядок оплаты (аванс, этапы, постоплата);
      (д) реквизиты для перечисления.
    addressee: "Обе стороны"

  payment_acceptance_link_check:
    text: >
      Просим уточнить в {doc_names}: (а) форму акта об оказании услуг;
      (б) требуется ли детальный отчёт (для ст. 252 НК РФ);
      (в) срок рассмотрения акта заказчиком; (г) последствия молчания заказчика;
      (д) порядок мотивированного отказа.
    addressee: "Обе стороны"

  acceptance_act_procedure:
    text: >
      Просим согласовать в {doc_names}: порядок подписания акта, срок рассмотрения,
      основания для мотивированного отказа, условие автоматической приёмки.
    addressee: "Обе стороны"

  reporting_detail_requirements:
    text: >
      Просим включить в {doc_names} требование к детальному отчёту исполнителя:
      перечень оказанных услуг, объём, даты, потраченное время (для почасовых).
      Это необходимо для обоснования расходов (ст. 252 НК РФ).
    addressee: "Юридический советник заказчика"

  unilateral_refusal_terms:
    text: >
      Просим уточнить в {doc_names}: (а) право заказчика на односторонний отказ
      (ст. 782 ГК РФ); (б) объём компенсации при отказе (фактические расходы);
      (в) наличие/отсутствие «платы за выход»; (г) право исполнителя на отказ
      и объём возмещения убытков заказчику; (д) порядок уведомления.
    addressee: "Юридический советник"

  termination_and_refusal:
    text: >
      Просим согласовать в {doc_names}: основания расторжения, порядок возврата
      авансовых платежей, оплату фактически оказанных услуг, неустойки.
    addressee: "Юридический советник"

  ip_rights_on_service_results:
    text: >
      Просим уточнить в {doc_names}: (а) кому принадлежат исключительные права
      на результаты услуг (отчёты, дизайн, ПО, контент); (б) момент перехода прав;
      (в) объём передаваемых прав; (г) сохраняет ли исполнитель право использования
      в портфолио.
    addressee: "Юридический советник"

  personal_performance_subcontracting:
    text: >
      Просим уточнить в {doc_names}: (а) обязан ли исполнитель оказывать услуги
      лично (ст. 780 ГК РФ); (б) если нет — допускается ли привлечение третьих лиц
      и на каких условиях; (в) сохраняет ли исполнитель ответственность за субисполнителей.
    addressee: "Юридический советник"

  sla_kpi_metrics_check:
    text: >
      Просим согласовать в {doc_names}: (а) перечень метрик SLA/KPI;
      (б) целевые значения; (в) порядок измерения; (г) штрафы за нарушение;
      (д) период оценки (месяц/квартал).
    addressee: "Обе стороны"

  personal_data_processing_terms:
    text: >
      Исполнитель по {doc_names} получает доступ к персональным данным.
      Просим предоставить/включить: (а) поручение на обработку ПДн (ст. 6 ФЗ-152);
      (б) перечень обрабатываемых категорий ПДн; (в) цели и сроки обработки;
      (г) меры защиты; (д) обязательство по уведомлению об инцидентах.
    addressee: "Юридический советник / DPO"

  personal_data_processing_without_agreement:
    text: >
      ВНИМАНИЕ: в {doc_names} исполнитель обрабатывает персональные данные,
      но поручение на обработку (ст. 6 ФЗ-152) отсутствует. Просим незамедлительно
      оформить поручение во избежание штрафов по ст. 13.11 КоАП.
    addressee: "Юридический советник / DPO"

  subscription_take_or_pay_check:
    text: >
      Просим уточнить в {doc_names}: (а) является ли договор абонентским
      (ст. 429.4 ГК РФ); (б) условие take-or-pay; (в) возвращаются ли деньги
      за неиспользованные услуги; (г) порядок изменения объёма пакета.
    addressee: "Юридический советник"

  labor_requalification_risk_check:
    text: >
      ВНИМАНИЕ: в {doc_names} обнаружены признаки трудовых отношений
      (ст. 15, 19.1 ТК РФ). Просим: (а) исключить формулировки о подчинении
      ПВТР, трудовой функции, рабочем месте; (б) убедиться, что договор
      описывает конкретные услуги, а не трудовую функцию;
      (в) предусмотреть приёмку по акту, а не ежемесячную «заработную плату».
    addressee: "Юридический советник"

  labor_contract_requalification_risk:
    text: >
      ВНИМАНИЕ: в {doc_names} с физическим лицом выявлены признаки трудовых отношений.
      Просим провести ревизию договора на предмет соответствия ст. 15, 19.1 ТК РФ
      и исключить элементы, указывающие на подчинённость и трудовую функцию.
    addressee: "HR / Юридический советник"

  license_confirmation:
    text: >
      Просим предоставить по {doc_names}: копию действующей лицензии/аккредитации
      исполнителя, подтверждение её действительности на весь срок оказания услуг.
    addressee: "Исполнитель"

  licensed_activity_without_confirmation:
    text: >
      ВНИМАНИЕ: услуги по {doc_names} являются лицензируемой деятельностью,
      но лицензия исполнителя не подтверждена. Просим незамедлительно предоставить
      копию действующей лицензии / аттестата аккредитации.
    addressee: "Исполнитель"

  parties_identification:
    text: >
      Просим подтвердить полные реквизиты сторон по {doc_names}: наименование/ФИО,
      ИНН, ОГРН, адрес, документы уполномоченных лиц.
    addressee: "Обе стороны"

  service_period_defined:
    text: >
      Просим уточнить в {doc_names}: срок оказания услуг (дата начала/окончания),
      порядок продления, условия досрочного прекращения.
    addressee: "Обе стороны"

  quality_standards_warranty:
    text: >
      Просим включить в {doc_names}: стандарты качества, критерии надлежащего
      исполнения, порядок устранения недостатков, гарантийные обязательства.
    addressee: "Юридический советник"

  liability_cap:
    text: >
      Просим согласовать в {doc_names}: лимит совокупной ответственности
      исполнителя, исключения из лимита (умысел, грубая неосторожность,
      нарушение конфиденциальности), порядок исчисления убытков.
    addressee: "Юридический советник"

  penalty_for_delay:
    text: >
      Просим согласовать в {doc_names}: размер неустойки за нарушение сроков
      (для обеих сторон), предельный размер, порядок исчисления.
    addressee: "Юридический советник"

  downtime_payment_customer_fault:
    text: >
      Просим включить в {doc_names} условие: если услуги не оказаны по вине
      заказчика (ст. 781 п. 2 ГК РФ), они подлежат оплате в полном объёме.
      Указать конкретные случаи (непредоставление доступа, информации и т.д.).
    addressee: "Юридический советник исполнителя"

  retention_of_results_until_payment:
    text: >
      Просим включить в {doc_names}: право исполнителя удерживать результаты
      (отчёты, документы, ПО) до полной оплаты (ст. 712, 359 ГК РФ по аналогии).
    addressee: "Юридический советник исполнителя"

  confidentiality_nda:
    text: >
      Просим включить в {doc_names}: перечень конфиденциальных сведений,
      срок неразглашения, исключения, ответственность за нарушение,
      порядок возврата/уничтожения информации.
    addressee: "Юридический советник"

  insurance_professional_liability:
    text: >
      Просим подтвердить по {doc_names}: наличие полиса страхования
      профессиональной ответственности, страховую сумму, срок действия.
    addressee: "Исполнитель"

  force_majeure:
    text: >
      Просим уточнить в {doc_names}: перечень обстоятельств форс-мажора,
      порядок уведомления, последствия (приостановка / расторжение).
    addressee: "Юридический советник"

  dispute_resolution:
    text: >
      Просим согласовать в {doc_names}: претензионный порядок (срок),
      подсудность, возможность медиации.
    addressee: "Юридический советник"

  anticorruption_clause:
    text: >
      Просим включить в {doc_names} антикоррупционную оговорку (ФЗ-273).
    addressee: "Юридический советник"

  vat_and_tax_allocation:
    text: >
      Просим уточнить в {doc_names}: режим НДС, налоговый статус исполнителя
      (плательщик НДС / УСН / самозанятый), порядок документооборота.
    addressee: "Бухгалтерия / Юридический советник"

  auto_renewal_clause:
    text: >
      Просим уточнить в {doc_names}: условия автопролонгации,
      срок уведомления о непродлении, изменение цены при продлении.
    addressee: "Юридический советник"

  consumer_protection_notice:
    text: >
      Просим проверить {doc_names} на соответствие ЗоЗПП:
      (а) отсутствие ничтожных условий (ст. 16 ЗоЗПП);
      (б) право потребителя на отказ; (в) информирование о свойствах услуг.
    addressee: "Юридический советник"

  data_security_obligations:
    text: >
      Просим включить в {doc_names}: обязательства по безопасности данных,
      резервному копированию, порядку восстановления, уведомлению об инцидентах.
    addressee: "IT-служба / Юридический советник"

  assignment_restriction:
    text: >
      Просим уточнить в {doc_names}: допустимость уступки прав / перевода долга,
      требуется ли согласие другой стороны.
    addressee: "Юридический советник"

  subject_services_defined:
    text: >
      Просим уточнить в {doc_names}: конкретный перечень действий исполнителя,
      объём услуг, стандарты качества, ожидаемые deliverables.
    addressee: "Заказчик"

  success_fee_validity_check:
    text: >
      В {doc_names} выявлено условие о гонораре успеха (success fee).
      Просим уточнить: (а) вид услуг (для юридических — риск оспаривания);
      (б) объективные критерии «успеха»; (в) соразмерность вознаграждения;
      (г) порядок определения базы для расчёта.
    addressee: "Юридический советник"

  impossibility_risk_allocation:
    text: >
      Просим уточнить в {doc_names}: (а) порядок распределения расходов
      при невозможности оказания услуг не по вине сторон (ст. 781 п. 3 ГК РФ);
      (б) обязанность оплатить фактически оказанную часть;
      (в) порядок уведомления о невозможности.
    addressee: "Юридический советник"

  cross_border_vat_place_check:
    text: >
      В {doc_names} выявлен трансграничный элемент. Просим предоставить:
      (а) анализ места реализации услуг (ст. 148 НК РФ);
      (б) подтверждение статуса налогового агента;
      (в) порядок удержания и уплаты НДС; (г) валютно-контрольные документы.
    addressee: "Налоговый консультант / Юридический советник"

  client_cooperation_obligations:
    text: >
      Просим включить в {doc_names}: конкретные обязанности заказчика
      по содействию (предоставление информации, доступа, документов,
      назначение контактных лиц), сроки исполнения, последствия нарушения.
    addressee: "Юридический советник заказчика"

  scope_change_management:
    text: >
      Просим включить в {doc_names}: порядок изменения ТЗ/спецификации
      (change request), сроки согласования, влияние на стоимость и сроки,
      форму дополнительного соглашения.
    addressee: "Обе стороны"

  data_return_on_termination:
    text: >
      Просим включить в {doc_names}: (а) обязанность исполнителя вернуть
      все данные и материалы заказчика в течение ___ дней после расторжения;
      (б) формат возврата; (в) подтверждение удаления копий;
      (г) порядок миграции (для IT-услуг).
    addressee: "Юридический советник"

  non_solicitation_clause:
    text: >
      Просим согласовать в {doc_names}: запрет переманивания персонала
      другой стороны, срок действия запрета, штраф за нарушение.
    addressee: "Юридический советник"

  consumer_punitive_clause_prohibition:
    text: >
      ВНИМАНИЕ: в {doc_names} выявлены условия, потенциально ущемляющие
      права потребителя (ст. 16 ЗоЗПП). Просим исключить: штрафы за отказ
      потребителя, невозвратные платежи, ограничение подсудности.
    addressee: "Юридический советник"

  illegal_staff_leasing:
    text: >
      ВНИМАНИЕ: в {doc_names} выявлены признаки предоставления персонала.
      Просим подтвердить: (а) аккредитацию исполнителя как ЧАЗ (ФЗ-116);
      (б) отсутствие признаков заёмного труда; (в) если аутстаффинг —
      соответствие ограничениям ст. 341.2 ТК РФ.
    addressee: "HR / Юридический советник"

  governing_law:
    text: >
      Просим подтвердить в {doc_names}: применимое право (законодательство РФ),
      язык договора, приоритет версий при расхождении.
    addressee: "Юридический советник"

  # Generic fallback
  _default:
    text: >
      Просим предоставить дополнительную информацию по вопросу «{check_name}»
      применительно к {doc_names}.
    addressee: "Юридический советник"
