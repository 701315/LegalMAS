            - "unclear"
            - "not_defined"
          description: "Условие о НДС. Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "price_includes_vat_display"
          type: "string"
          presentation: "fact"
          label: "НДС"
          description: >
            User-friendly отображение условия о НДС. Fallback: "Не установлено" / "Не удалось определить".
          required: true
          display_in_grid: true
          display_priority: 3

        - name: "advance_present"
          type: "string"
          presentation: "signal"
