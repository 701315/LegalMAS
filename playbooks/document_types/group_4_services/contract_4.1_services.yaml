            - "generic" — есть общее описание, но без достаточной детализации.
            - "vague" — есть только абстрактная формула без расшифровки.
            - "not_defined" — предмет прямо не определён.
        - specification_type:
            - "tz" — техническое задание.
            - "appendix" — приложение, спецификация, перечень.
            - "in_body" — описание прямо в тексте договора.
            - "not_defined" — тип спецификации прямо не определён.
        - volume_defined / quality_standards_referenced / deliverables_listed:
            - "defined" — условие прямо указано.
            - "not_defined" — условие прямо не указано.
        - Верни только JSON.
        </rules>
      fields:
        - name: "service_subject_status"
          type: "string"
          presentation: "signal"
          allowed_values:
            - "defined"
            - "not_defined"
          description: "Статус определения предмета услуг."
          required: true

        - name: "service_subject_description"
          type: "string"
          presentation: "fact"
          label: "Предмет услуг"
          description: "Описание предмета услуг."
          required: true
          display_in_grid: true
          display_priority: 1

        - name: "service_description_specificity"
          type: "string"
          presentation: "signal"
          allowed_values:
            - "detailed"
            - "generic"
            - "vague"
            - "not_defined"
          description: "Уровень детализации предмета услуг."
          required: true

        - name: "tz_reference"
          type: "string"
          presentation: "fact"
          label: "ТЗ / спецификация"
          description: "Ссылка на ТЗ, приложение или спецификацию."
          required: false
          display_in_grid: true
          display_priority: 2

        - name: "volume_defined"
          type: "string"
          presentation: "signal"
          allowed_values:
            - "defined"
            - "not_defined"
          description: "Статус определения объема услуг."
          required: true

        - name: "quality_standards_referenced"
          type: "string"
          presentation: "signal"
          allowed_values:
            - "defined"
            - "not_defined"
          description: "Есть ли ссылка на стандарты качества."
          required: true

        - name: "deliverables_listed"
          type: "string"
          presentation: "signal"
          allowed_values:
            - "defined"
            - "not_defined"
          description: "Перечислены ли конкретные результаты услуг."
          required: true

        - name: "specification_type"
          type: "string"
          presentation: "signal"
          allowed_values:
            - "tz"
            - "appendix"
            - "in_body"
            - "not_defined"
          description: "Тип спецификации услуг."
          required: true
      store_payload: true

  # ──────────────────────────────────────────────────────────────────────────
  # CHECK 3: Цена, НДС и порядок расчетов
  # ──────────────────────────────────────────────────────────────────────────
  - id: price_and_payment_terms
    name: "Стоимость услуг и порядок расчётов (ст. 781 ГК РФ)"
    description: >
      Фактографическая проверка наличия в договоре цены услуг, модели
      ценообразования, НДС, аванса и порядка оплаты. Результат предназначен
      для табличного сравнения нескольких договоров.
    triggers: ~
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "цена"
        - "стоимость"
        - "вознаграждение"
        - "оплата"
        - "аванс"
        - "НДС"
        - "абонентская плата"
        - "почасовая ставка"
        - "счет"
        - "акт"
        - "право удержания"
        - "передача результатов после оплаты"
        - "сохранение прав до оплаты"
        - "удерживать до полной оплаты"
        - "не передавать результат"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)стоимост(ь|и)\\s+услуг.*\\d"
        - "(?i)\\b\\d[\\d\\s]*(?:руб|рублей|₽|тыс|млн)"
        - "(?i)оплат(а|ы).*услуг"
        - "(?i)аванс"
        - "(?i)удержива(ть|ет).*результат.*до.*оплат"
        - "(?i)передач(а|и).*после.*полной\\s+оплат"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор возмездного оказания услуг.
        Проверяется только один вопрос: цена услуг, НДС, аванс, порядок оплаты
        и право исполнителя удерживать результаты услуг до полной оплаты.

        Нормативный ориентир:
        - ст. 781 ГК РФ — оплата услуг
        - общие положения об обязательствах и расчетах
        - договорные механизмы удержания результата до оплаты

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора,
          а чего прямо нет.
        - Не оценивай серьёзность риска.
        - Юрист будет использовать результат в сравнительной таблице.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Определена ли цена договора.
        2. Какой размер цены указан.
        3. Какая модель ценообразования используется.
        4. Как указано условие о НДС.
        5. Предусмотрен ли аванс.
        6. Какой порядок оплаты установлен.
        7. На каком основании производится оплата.
        8. Есть ли право удерживать результаты услуг до полной оплаты.
        9. Как описано такое удержание.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Если условие не указано прямо — возвращай "not_defined".
        4. Если текстового значения нет — возвращай строго "Данные не определены".
        5. Не используй "None", "null", "not_found", "not_specified" или пустые строки.
        6. В evidence включай только текст договора.
        7. Не путай цену договора с неустойкой или компенсацией расходов.
        8. Не путай обычный порядок передачи результата после оплаты с прямым правом удержания, если удержание или непередача до оплаты не сформулированы в тексте.
        9. Верни только один JSON-объект.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — цена и удержание определены:
        Фрагмент:
        "Стоимость услуг составляет 300 000 рублей в месяц, НДС не облагается.
        Заказчик выплачивает аванс в размере 50% в течение 5 банковских дней
        после выставления счета, оставшаяся сумма оплачивается после подписания акта.
        Исполнитель вправе не передавать итоговые отчеты до полной оплаты услуг."

        Ответ:
        {
          "contract_price_status": "defined",
          "contract_price_value": "300 000 рублей в месяц",
          "pricing_model": "subscription",
          "price_includes_vat": "not_applicable",
          "advance_present": "defined",
          "payment_timing": "mixed",
          "payment_basis": "mixed",
          "result_retention_until_payment_defined": "defined",
          "result_retention_summary": "исполнитель вправе не передавать итоговые отчеты до полной оплаты услуг",
          "evidence": [
            {
              "clause_ref": "п. 3.1",
              "quote": "Стоимость услуг составляет 300 000 рублей в месяц, НДС не облагается. Заказчик выплачивает аванс в размере 50% в течение 5 банковских дней после выставления счета, оставшаяся сумма оплачивается после подписания акта. Исполнитель вправе не передавать итоговые отчеты до полной оплаты услуг."
            }
          ]
        }

        Пример 2 — данные отсутствуют:
        Фрагмент:
        "Стоимость определяется по соглашению сторон."

        Ответ:
        {
          "contract_price_status": "not_defined",
          "contract_price_value": "Данные не определены",
          "pricing_model": "not_defined",
          "price_includes_vat": "not_defined",
          "advance_present": "not_defined",
          "payment_timing": "not_defined",
          "payment_basis": "not_defined",
          "result_retention_until_payment_defined": "not_defined",
          "result_retention_summary": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Есть ли прямое указание на сумму или формулу цены.
        2. Есть ли прямое указание на НДС.
        3. Есть ли прямое указание на аванс.
        4. Есть ли прямое указание на сроки и основание оплаты.
        5. Есть ли прямое указание на непередачу или удержание результата до оплаты.
        6. Если прямой цитаты нет — верни "not_defined". Не додумывай условия.

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        {
          "contract_price_status": "<defined / not_defined>",
          "contract_price_value": "<текст или 'Данные не определены'>",
          "pricing_model": "<fixed / hourly / subscription / per_unit / mixed / not_defined>",
          "price_includes_vat": "<yes / no / not_applicable / unclear / not_defined>",
          "advance_present": "<defined / not_defined>",
          "payment_timing": "<prepayment / postpayment / staged / monthly / mixed / not_defined>",
          "payment_basis": "<invoice / act / report / mixed / not_defined>",
          "result_retention_until_payment_defined": "<defined / not_defined>",
          "result_retention_summary": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 720

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "стоимость услуг цена вознаграждение оплата аванс НДС счет акт отчет абонентская плата почасовая ставка право удержания передача результатов после оплаты не передавать результат до полной оплаты"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - technical_fragment
        - structural_anchor
      preferred_clause_functions:
        - obligations
        - obligations
      negative_keywords:
        - "неустойка"
        - "штраф"
        - "убытки"
        - "расторжение"
      position_bias:
        preferred_range: [0.10, 0.45]
        boost: 0.18
        scope: segment
      context_k: 6
      max_chunks: 8
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
      preferred_clause_functions:
        - "obligations"
        - "obligations"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 650

    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false

      llm_max_tokens: 950

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора цену услуг,
        модель ценообразования, НДС, аванс, порядок оплаты и право исполнителя
        удерживать результаты услуг до полной оплаты. Не анализируй санкции,
        форс-мажор, споры или персональные данные.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        1. contract_price_status — "defined" / "not_defined".
        2. contract_price_value — цена услуг.
        3. pricing_model — "fixed" / "hourly" / "subscription" / "per_unit" /
           "mixed" / "not_defined".
        4. price_includes_vat — "yes" / "no" / "not_applicable" / "unclear" /
           "not_defined".
        5. advance_present — "defined" / "not_defined".
        6. payment_timing — "prepayment" / "postpayment" / "staged" / "monthly" /
           "mixed" / "not_defined".
        7. payment_basis — "invoice" / "act" / "report" / "mixed" / "not_defined".
        8. result_retention_until_payment_defined — "defined" / "not_defined".
        9. result_retention_summary — краткое описание права удержания результата до оплаты.

        Если данные отсутствуют:
        - статус = "not_defined"
        - текст = "Данные не определены"
        </task>

        <rules>
        - Используй только текст договора.
        - pricing_model:
            - "fixed" — фиксированная цена.
            - "hourly" — почасовая ставка.
            - "subscription" — абонентская / периодическая плата.
            - "per_unit" — оплата за единицу услуги.
            - "mixed" — сочетание нескольких моделей.
            - "not_defined" — модель прямо не определена.
        - price_includes_vat:
            - "yes" — цена включает НДС.
            - "no" — цена указана без НДС.
            - "not_applicable" — НДС не применяется / не облагается.
            - "unclear" — НДС упомянут, но условие двусмысленно.
            - "not_defined" — НДС прямо не определён.
        - payment_timing:
            - "prepayment" — предоплата / аванс.
            - "postpayment" — после оказания услуг / после приемки.
            - "staged" — по этапам.
            - "monthly" — периодическая ежемесячная оплата.
            - "mixed" — сочетание вариантов.
            - "not_defined" — прямо не определено.
        - payment_basis:
            - "invoice" — по счету.
            - "act" — по акту.
            - "report" — по отчету.
            - "mixed" — несколько оснований.
            - "not_defined" — основание прямо не определено.
        - result_retention_until_payment_defined:
            - "defined" — есть прямое право не передавать / удерживать результат до оплаты.
            - "not_defined" — такого условия прямо нет.
        - result_retention_summary заполняй только текстом договора.
        - Если текстового значения нет — верни "Данные не определены".
        - Верни только JSON.
        </rules>
      fields:
        - name: "contract_price_status"
          type: "string"
          presentation: "signal"
          allowed_values:
            - "defined"
            - "not_defined"
          description: "Статус определения цены услуг."
          required: true

        - name: "contract_price_value"
          type: "string"
          presentation: "fact"
          label: "Стоимость услуг"
          description: "Цена услуг по договору."
          required: true
          display_in_grid: true
          display_priority: 1

        - name: "pricing_model"
          type: "string"
          presentation: "signal"
          allowed_values:
            - "fixed"
            - "hourly"
            - "subscription"
            - "per_unit"
            - "mixed"
            - "not_defined"
          description: "Модель ценообразования."
          required: true
          display_in_grid: true
          display_priority: 2

        - name: "price_includes_vat"
          type: "string"
          presentation: "signal"
          allowed_values:
            - "yes"
            - "no"
            - "not_applicable"
            - "unclear"
            - "not_defined"
          description: "Условие о НДС."
          required: true
          display_in_grid: true
          display_priority: 3

        - name: "advance_present"
          type: "string"
          presentation: "signal"
          allowed_values:
            - "defined"
            - "not_defined"
          description: "Предусмотрен ли аванс."
          required: true

        - name: "payment_timing"
          type: "string"
          presentation: "signal"
          allowed_values:
            - "prepayment"
            - "postpayment"
            - "staged"
            - "monthly"
            - "mixed"
            - "not_defined"
          description: "Порядок по времени оплаты."
          required: true

        - name: "payment_basis"
          type: "string"
          presentation: "signal"
          allowed_values:
            - "invoice"
            - "act"
            - "report"
            - "mixed"
            - "not_defined"
          description: "Основание оплаты."
          required: true

        - name: "result_retention_until_payment_defined"
          type: "string"
          presentation: "signal"
          allowed_values:
            - "defined"
            - "not_defined"
          description: "Есть ли право исполнителя удерживать результаты до оплаты."
          required: true

        - name: "result_retention_summary"
          type: "string"
          presentation: "fact"
          label: "Удержание результата"
          description: "Краткое описание права удержания результатов до оплаты."
          required: false
          display_in_grid: true
          display_priority: 4
      store_payload: true

  # ──────────────────────────────────────────────────────────────────────────
  # CHECK 4: Срок оказания услуг
  # ──────────────────────────────────────────────────────────────────────────
  - id: service_period_defined
    name: "Срок оказания услуг (ст. 708 ГК РФ по аналогии)"
    description: >
      Фактографическая проверка наличия в договоре срока оказания услуг,
      начального и конечного момента, этапности и определённости срока.
      Результат предназначен для табличного сравнения нескольких договоров.
    triggers: ~
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "срок оказания"
        - "период оказания"
        - "дата начала"
        - "дата окончания"
        - "в течение"
        - "с момента"
        - "этап"
        - "календарный план"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)срок\\s+оказани"
        - "(?i)\\b\\d{1,2}[.]\\d{1,2}[.]\\d{4}\\b"
        - "(?i)(в\\s+течение|с\\s+момента)\\s+\\d+"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор возмездного оказания услуг.
        Проверяется только один вопрос: срок оказания услуг, начальный и конечный
        момент, этапы и определённость срока.

        Нормативный ориентир:
        - ст. 190 ГК РФ — определение сроков
        - ст. 708 ГК РФ по аналогии — сроки выполнения

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора,
          а чего прямо нет.
        - Не оценивай серьёзность риска.
        - Юрист будет использовать результат в сравнительной таблице.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Определён ли срок оказания услуг.
        2. Как сформулирован срок.
        3. Какой начальный момент указан.
        4. Какой конечный момент указан.
        5. Есть ли этапы / milestones.
        6. Насколько определён срок.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Если условие не указано прямо — возвращай "not_defined".
        4. Если текстового значения нет — возвращай строго "Данные не определены".
        5. Не используй "None", "null", "not_found", "not_specified" или пустые строки.
        6. В evidence включай только текст договора.
        7. Не путай срок договора со сроком оплаты или сроком уведомления.
        8. Верни только один JSON-объект.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — срок определён:
        Фрагмент:
        "Услуги оказываются с 01.03.2024 по 31.12.2024. Отчеты предоставляются
        ежемесячно. Первый этап завершается 31.05.2024."

        Ответ:
        {
          "service_period_status": "defined",
          "service_period_value": "с 01.03.2024 по 31.12.2024",
          "service_start_moment": "01.03.2024",
          "service_end_moment": "31.12.2024",
          "milestones_present": "defined",
          "term_definiteness": "fixed_date",
          "evidence": [
            {
              "clause_ref": "п. 2.1",
