      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 650

    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false

      llm_max_tokens: 600

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора условия о правах
        на результаты интеллектуальной деятельности, тип передачи прав,
        момент перехода прав и описание объектов ИС. Не анализируй цену,
        санкции, сроки или споры.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        1. ip_clause_present — "defined" / "not_defined".
        2. ip_transfer_type — "full_transfer" / "license" /
           "retained_by_provider" / "not_specified" / "not_defined".
        3. ip_transfer_moment — "upon_payment" / "upon_creation" /
           "upon_acceptance" / "not_specified" / "not_defined".
        4. ip_objects_listed — "defined" / "not_defined".
        5. ip_objects_description — описание объектов ИС.
        </task>

        <rules>
        - Используй только текст договора.
        - ip_transfer_type:
            - "full_transfer" — полное отчуждение исключительных прав.
            - "license" — предоставление права использования.
            - "retained_by_provider" — права остаются у исполнителя.
            - "not_specified" — IP clause есть, но тип передачи не ясен.
            - "not_defined" — IP clause прямо не определен.
        - ip_transfer_moment:
            - "upon_payment" — после оплаты.
            - "upon_creation" — с момента создания.
            - "upon_acceptance" — после приемки.
            - "not_specified" — момент не раскрыт при наличии IP clause.
            - "not_defined" — условие прямо не определено.
        - ip_objects_listed:
            - "defined" — объекты ИС перечислены.
            - "not_defined" — объекты ИС не перечислены.
        - Если текстового значения нет — верни "Данные не определены".
        - Верни только JSON.
        </rules>
      fields:
        - name: "ip_clause_present"
          type: "string"
          presentation: "signal"
          allowed_values:
