      context_k: 5
      temperature: 0.0
      max_tokens: 700

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "неустойка пеня штраф ответственность ограничена совокупная ответственность косвенные убытки упущенная выгода страхование ответственности страховой полис профессиональная ответственность"
      retrieval_profile: "liability_cap_check"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - technical_fragment
        - structural_anchor
      preferred_clause_functions:
        - obligations
      negative_keywords:
        - "цена"
        - "акт"
        - "форс-мажор"
      position_bias:
        preferred_range: [0.45, 0.90]
        boost: 0.18
        scope: segment
      context_k: 5
