# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 1: КЛАССИФИКАЦИЯ (L1/L2)
#  Читается: YAMLRegistry → L1FilenameClassifier, L2HeaderClassifier
# ════════════════════════════════════════════════════════════════════════════

classification_runtime_v1:

  scoring:
    accept_threshold: 0.72
    strong_signal_threshold: 0.84
    ambiguity_margin: 0.18
    input_quality_weight: 1.0

  rules:

    filename_patterns:
      - pattern: "(?i)\\bдоговор[\\s_.-]*возмездн[а-я]*[\\s_.-]*оказани[а-я]*[\\s_.-]*услуг\\b"
        kind: generic_form
        weight: 0.72
        # Базовая юридическая форма service contract; для parent-типа это generic, а не subject-specific

      - pattern: "(?i)\\bдоговор[\\s_.-]*(?:на[\\s_.-]*)?оказани[а-я]*[\\s_.-]*услуг\\b"
        kind: generic_form
        weight: 0.66
        # Общая форма договора оказания услуг

      - pattern: "(?i)\\bservices?[\\s_.-]*agreement\\b"
        kind: generic_form
        weight: 0.60
        # Общая англоязычная форма services agreement

      - pattern: "(?i)\\b(?:master|professional|framework)[\\s_.-]*services?[\\s_.-]*(?:agreement|contract)\\b"
        kind: generic_form
        weight: 0.64
        # MSA / PSA / framework services — типовая рамочная форма service contracts

      - pattern: "(?i)(?<![A-Za-z])MSA(?![A-Za-z])"
        kind: generic_form
        weight: 0.34
        # MSA сам по себе слишком неоднозначен и часто требует дополнительных service-markers

      - pattern: "(?i)\\b(?:абонентск[а-я]*[\\s_.-]*договор(?:[\\s_.-]*на[\\s_.-]*услуг[аи])?|retainer[\\s_.-]*agreement)\\b"
        kind: generic_form
        weight: 0.58
        # Абонентская / retainer-модель характерна для услуг, но не уникальна для конкретного service subtype

      - pattern: "(?i)\\b(?:service[\\s_.-]*level[\\s_.-]*agreement|statement[\\s_.-]*of[\\s_.-]*work)\\b"
        kind: generic_form
        weight: 0.42
        # SLA / SOW часто используются в service-family, но нередко являются приложениями/рамочными документами

      - pattern: "(?i)(?<![A-Za-z])SLA(?![A-Za-z])"
        kind: context
        weight: 0.16
        # SLA как аббревиатура слишком коротка и неоднозначна

      - pattern: "(?i)(?<![A-Za-z])SOW(?![A-Za-z])"
        kind: context
        weight: 0.14
        # SOW — полезный, но очень неоднозначный структурный маркер

      - pattern: "(?i)\\b(?:консалтингов(?:ый|ого)?[\\s_.-]*договор|договор[\\s_.-]*(?:на[\\s_.-]*)?оказани[а-я]*[\\s_.-]*консультационн[а-я]*[\\s_.-]*услуг|договор[\\s_.-]*консультационн[а-я]*[\\s_.-]*услуг|consulting[\\s_.-]*agreement)\\b"
        kind: specific_subject
        weight: 0.82
        # Консультационные / consulting services — предметно service-oriented, но не рамочная форма

      - pattern: "(?i)\\b(?:договор[\\s_.-]*аутсорсинга|outsourcing[\\s_.-]*agreement|business[\\s_.-]*process[\\s_.-]*outsourcing[\\s_.-]*agreement|BPO[\\s_.-]*agreement)\\b"
        kind: specific_subject
        weight: 0.84
        # Outsourcing / BPO — сильный service-model marker

      - pattern: "(?i)\\b(?:managed[\\s_.-]*services?[\\s_.-]*(?:agreement|contract)?|support[\\s_.-]*services?[\\s_.-]*(?:agreement|contract)?|maintenance[\\s_.-]*services?[\\s_.-]*(?:agreement|contract)?|technical[\\s_.-]*services?[\\s_.-]*(?:agreement|contract)?)\\b"
        kind: specific_subject
        weight: 0.80
        # Managed/support/maintenance/technical services — хорошие предметные service markers

      - pattern: "(?i)\\b(?:договор[\\s_.-]*(?:на[\\s_.-]*)?обслуживани[а-я]*|договор[\\s_.-]*обслуживания|сервисн[а-я]*[\\s_.-]*договор|договор[\\s_.-]*техническ[а-я]*[\\s_.-]*поддержк[аи])\\b"
        kind: specific_subject
        weight: 0.78
        # Обслуживание / technical support / сервисный договор — типичные service-subject forms

      - pattern: "(?i)\\b(?:договор[\\s_.-]*(?:на[\\s_.-]*)?оказани[а-я]*[\\s_.-]*юридическ[а-я]*[\\s_.-]*услуг|договор[\\s_.-]*юридическ[а-я]*[\\s_.-]*услуг|legal[\\s_.-]*services?[\\s_.-]*(?:agreement|contract)?)\\b"
        kind: specific_subject
        weight: 0.78
        # Юридические услуги — supported subtype внутри service family

      - pattern: "(?i)\\b(?:договор[\\s_.-]*(?:на[\\s_.-]*)?оказани[а-я]*[\\s_.-]*маркетингов[а-я]*[\\s_.-]*услуг|договор[\\s_.-]*маркетингов[а-я]*[\\s_.-]*услуг|marketing[\\s_.-]*services?[\\s_.-]*(?:agreement|contract)?)\\b"
        kind: specific_subject
        weight: 0.76
        # Маркетинговые услуги — предметный service marker

      - pattern: "(?i)\\b(?:договор[\\s_.-]*(?:на[\\s_.-]*)?оказани[а-я]*[\\s_.-]*(?:IT|it|ИТ|ит)[\\s_.-]*услуг|договор[\\s_.-]*(?:IT|it|ИТ|ит)[\\s_.-]*услуг|IT[\\s_.-]*services?[\\s_.-]*(?:agreement|contract)?|managed[\\s_.-]*IT[\\s_.-]*services?)\\b"
        kind: specific_subject
        weight: 0.78
        # IT-услуги — частый service subtype, но всё ещё внутри family услуг

      - pattern: "(?i)\\b(?:договор[\\s_.-]*(?:на[\\s_.-]*)?оказани[а-я]*[\\s_.-]*аудиторск[а-я]*[\\s_.-]*услуг|договор[\\s_.-]*аудиторск[а-я]*[\\s_.-]*услуг|audit(?:ing)?[\\s_.-]*services?[\\s_.-]*(?:agreement|contract)?)\\b"
        kind: specific_subject
        weight: 0.76
        # Аудиторские услуги — supported service subtype

      - pattern: "(?i)\\b(?:договор[\\s_.-]*(?:на[\\s_.-]*)?оказани[а-я]*[\\s_.-]*образовательн[а-я]*[\\s_.-]*услуг|договор[\\s_.-]*образовательн[а-я]*[\\s_.-]*услуг|educational[\\s_.-]*services?[\\s_.-]*(?:agreement|contract)?)\\b"
        kind: specific_subject
        weight: 0.76
        # Образовательные услуги — supported subtype

      - pattern: "(?i)\\b(?:договор[\\s_.-]*(?:на[\\s_.-]*)?оказани[а-я]*[\\s_.-]*охранн[а-я]*[\\s_.-]*услуг|договор[\\s_.-]*охранн[а-я]*[\\s_.-]*услуг|security[\\s_.-]*services?[\\s_.-]*(?:agreement|contract)?)\\b"
        kind: specific_subject
        weight: 0.78
        # Охранные услуги — supported subtype

      - pattern: "(?i)\\b(?:договор[\\s_.-]*клининга|cleaning[\\s_.-]*services?[\\s_.-]*(?:agreement|contract)?)\\b"
        kind: specific_subject
        weight: 0.74
        # Клининг / cleaning services — явный service subject

      - pattern: "(?i)\\bдоговор[\\s_.-]*аутстаффинга\\b|\\boutstaffing[\\s_.-]*agreement\\b"
        kind: generic_form
        weight: 0.50
        # Аутстаффинг поддерживается, но может конкурировать с более специализированными personnel/staffing типами

      - pattern: "(?i)\\bуслуг\\b"
        kind: context
        weight: 0.18
        # Само слово "услуг" слишком общее

      - pattern: "(?i)\\bservice(?:s)?\\b"
        kind: context
        weight: 0.16
        # Service/services без qualifier слишком широки


    folder_patterns:
      - pattern: "(?i)услуг|оказани[ея][_\\s-]*услуг|services?"
        kind: generic_form
        weight: 0.54
        # Общая service taxonomy папок

      - pattern: "(?i)(?:master|professional|framework|managed|support|maintenance|technical)[_\\s-]*services?"
        kind: generic_form
        weight: 0.58
        # Типовые англоязычные service-family папки

      - pattern: "(?i)консалтинг|consulting|консультационн[а-я]*[_\\s-]*услуг"
        kind: specific_subject
        weight: 0.76
        # Consulting taxonomy — предметный service marker

      - pattern: "(?i)аутсорсинг|outsourcing|business[_\\s-]*process[_\\s-]*outsourcing|BPO"
        kind: specific_subject
        weight: 0.80
        # Outsourcing / BPO папки

      - pattern: "(?i)обслуживани[ея]|сервис|техническ[а-я]*[_\\s-]*поддержк|support[_\\s-]*services?|maintenance[_\\s-]*services?"
        kind: specific_subject
        weight: 0.74
        # Service operations / support / maintenance taxonomy

      - pattern: "(?i)юридическ[а-я]*[_\\s-]*услуг|маркетингов[а-я]*[_\\s-]*услуг|аудиторск[а-я]*[_\\s-]*услуг|образовательн[а-я]*[_\\s-]*услуг|охранн[а-я]*[_\\s-]*услуг|(?:IT|it|ИТ|ит)[_\\s-]*услуг|клининг|legal[_\\s-]*services?|marketing[_\\s-]*services?|audit(?:ing)?[_\\s-]*services?|educational[_\\s-]*services?|security[_\\s-]*services?|cleaning[_\\s-]*services?"
        kind: specific_subject
        weight: 0.70
        # Предметные service subtypes из supported doc types

      - pattern: "(?i)retainer|абонентск[а-я]*[_\\s-]*договор"
        kind: generic_form
        weight: 0.48
        # Retainer / subscription-like service folders

      - pattern: "(?i)service[_\\s-]*level[_\\s-]*agreement|statement[_\\s-]*of[_\\s-]*work"
        kind: generic_form
        weight: 0.40
        # SLA / SOW в taxonomy папок полезны, но не самодостаточны

      - pattern: "(?i)(?<![A-Za-z])MSA(?![A-Za-z])|(?<![A-Za-z])SLA(?![A-Za-z])|(?<![A-Za-z])SOW(?![A-Za-z])"
        kind: context
        weight: 0.14
        # Короткие аббревиатуры слишком неоднозначны без дополнительных сигналов

      - pattern: "(?i)service|services"
        kind: context
        weight: 0.16
        # Слишком общий folder-marker

    keywords:

      high:
        - pattern: "(?i)договор\\s+возмездн[огоой]\\s+оказан[ияия]\\s+услуг"
          weight: 0.95
          distinctiveness: medium
          context: header
          description: "Полное легальное название базового договора возмездного оказания услуг"

        - pattern: "(?i)договор\\s+оказан[ияия]\\s+услуг"
          weight: 0.9
          distinctiveness: medium
          context: header
          description: "Сокращённое название договора оказания услуг"

        - pattern: "(?i)договор\\s+на\\s+обслуживан[иеия]"
          weight: 0.85
          distinctiveness: medium
          context: header
          description: "Типовая формула сервисного/обслуживающего договора"

        - pattern: "(?i)сервисн[ыйое]\\s+договор"
          weight: 0.85
          distinctiveness: medium
          context: header
          description: "Указание на сервисный характер отношений"

        - pattern: "(?i)договор\\s+аутсорсинг[ауы]"
          weight: 0.9
          distinctiveness: medium
          context: header
          description: "Аутсорсинговый договор как разновидность услуг"

        - pattern: "(?i)абонентск[ийое]\\s+договор\\s+на\\s+услуг[и]"
          weight: 0.85
          distinctiveness: medium
          context: header
          description: "Абонентский договор на услуги (подписочная модель)"

        - pattern: "(?i)договор\\s+на\\s+оказан[иеия]\\s+консультационн[ыхые]\\s+услуг"
          weight: 0.85
          distinctiveness: medium
          context: header
          description: "Консультационные услуги по базовой конструкции услуг"

        - pattern: "(?i)договор\\s+на\\s+оказан[иеия]\\s+юридическ[ихие]\\s+услуг"
          weight: 0.85
          distinctiveness: medium
          context: header
          description: "Юридические услуги (консалтинг/сопровождение)"

        - pattern: "(?i)договор\\s+на\\s+оказан[иеия]\\s+маркетингов[ыхые]\\s+услуг"
          weight: 0.85
          distinctiveness: medium
          context: header
          description: "Маркетинговые услуги (реклама/продвижение) в сервисной логике"

        - pattern: "(?i)договор\\s+на\\s+оказан[иеия]\\s+it-?услуг"
          weight: 0.85
          distinctiveness: medium
          context: header
          description: "IT‑услуги (поддержка, обслуживание, сопровождение)"

        - pattern: "(?i)договор\\s+на\\s+оказан[иеия]\\s+аудиторск[ихие]\\s+услуг"
          weight: 0.85
          distinctiveness: medium
          context: header
          description: "Аудиторские услуги как разновидность услуг"

        - pattern: "(?i)договор\\s+на\\s+оказан[иеия]\\s+образовательн[ыхые]\\s+услуг"
          weight: 0.85
          distinctiveness: medium
          context: header
          description: "Образовательные/обучающие услуги"

        - pattern: "(?i)договор\\s+на\\s+оказан[иеия]\\s+охранн[ыхые]\\s+услуг"
          weight: 0.85
          distinctiveness: medium
          context: header
          description: "Охранные услуги частных охранных организаций"

        - pattern: "(?i)услуг[аи]"
          weight: 0.8
          distinctiveness: low
          context: any
          description: "Общее упоминание услуг (широко используется и в других типах)"

        - pattern: "(?i)исполнител[ьяеи]"
          weight: 0.8
          distinctiveness: low
          context: any
          description: "Роль исполнителя договора услуг"

        - pattern: "(?i)акт\\s+об\\s+оказан[ииии]\\s+услуг"
          weight: 0.85
          distinctiveness: medium
          context: any
          description: "Типичный акт об оказании услуг"

        - pattern: "(?i)акт\\s+оказанн[ыхые]\\s+услуг"
          weight: 0.85
          distinctiveness: medium
          context: any
          description: "Формулировка акта оказанных услуг"

        - pattern: "(?i)оказан[иеия]\\s+услуг"
          weight: 0.8
          distinctiveness: low
          context: any
          description: "Общее упоминание оказания услуг"

        - pattern: "(?i)нематериальн[ыйое]\\s+результат"
          weight: 0.75
          distinctiveness: medium
          context: any
          description: "Указание на нематериальный характер результата (отличие от подряда)"

        - pattern: "(?i)совершен[иеия]\\s+действ[ийия]"
          weight: 0.75
          distinctiveness: low
          context: any
          description: "Формулировки о совершении действий вместо достижения материального результата"

        - pattern: "(?i)осуществлен[иеия]\\s+деятельност[иью]"
          weight: 0.75
          distinctiveness: low
          context: any
          description: "Формула о деятельности исполнителя без гарантии результата"

      medium:
        - pattern: "(?i)техническ[оа]е\\s+задани[ея]"
          weight: 0.6
          distinctiveness: low
          context: any
          description: "Техническое задание на услуги (особенно в IT/маркетинге)"

        - pattern: "(?i)отч[её]т\\s+исполнител[яя]"
          weight: 0.6
          distinctiveness: low
          context: any
          description: "Отчёт исполнителя о выполнении услуг"

        - pattern: "(?i)акт\\s+сдач[ии]-?при[её]мк[ии]\\s+услуг"
          weight: 0.65
          distinctiveness: medium
          context: any
          description: "Акт сдачи-приёмки услуг"

        - pattern: "(?i)абонентск[а-яё]+\\s+плат[аа]"
          weight: 0.6
          distinctiveness: medium
          context: any
          description: "Абонентская плата как модель оплаты услуг"

        - pattern: "(?i)почасов[а-яё]+\\s+оплат[аа]"
          weight: 0.6
          distinctiveness: medium
          context: any
          description: "Почасовая оплата услуг"

        - pattern: "(?i)консультационн[ыо]е\\s+услуг[ии]"
          weight: 0.6
          distinctiveness: medium
          context: any
          description: "Консультационные услуги (часто консалтинг)"

        - pattern: "(?i)\\bконсалтинг\\b"
          weight: 0.6
          distinctiveness: medium
          context: any
          description: "Консалтинг как вид услуг"

        - pattern: "(?i)\\bобслуживани[ея]\\b"
          weight: 0.55
          distinctiveness: low
          context: any
          description: "Обслуживание как общий сервисный контекст"

        - pattern: "(?i)\\bSLA\\b"
          weight: 0.6
          distinctiveness: medium
          context: any
          description: "Service Level Agreement в контексте услуг"

        - pattern: "(?i)уровень\\s+обслуживани[яя]"
          weight: 0.55
          distinctiveness: medium
          context: any
          description: "Уровень обслуживания (SLA‑метрики)"

        - pattern: "(?i)\\bKPI\\b"
          weight: 0.55
          distinctiveness: low
          context: any
          description: "KPI как показатель эффективности услуг"

        - pattern: "(?i)ключев[ыо]е\\s+показател[ии]"
          weight: 0.5
          distinctiveness: low
          context: any
          description: "Ключевые показатели результата/качества услуг"

      low:
        - pattern: "(?i)\\bконсультаци[яи]\\b"
          weight: 0.3
          distinctiveness: low
          context: any
          description: "Консультации как отдельный вид услуг"

        - pattern: "(?i)\\bобучени[ея]\\b"
          weight: 0.3
          distinctiveness: low
          context: any
          description: "Обучение/тренинги как услуги"

        - pattern: "(?i)\\bаудит\\b"
          weight: 0.3
          distinctiveness: low
          context: any
          description: "Аудит как услугa (может пересекаться с спец‑типами)"

        - pattern: "(?i)\\bсопровождени[ея]\\b"
          weight: 0.3
          distinctiveness: low
          context: any
          description: "Сопровождение, сопровождение проектов/клиентов"

        - pattern: "(?i)сервисн[ыо]й\\s+договор"
          weight: 0.3
          distinctiveness: low
          context: any
          description: "Упоминание сервисного договора в теле"

        - pattern: "(?i)\\bаутсорсинг\\b"
          weight: 0.3
          distinctiveness: low
          context: any
          description: "Общее упоминание аутсорсинга"

        - pattern: "(?i)\\bтренинг\\b"
          weight: 0.25
          distinctiveness: low
          context: any
          description: "Тренинги как обучающие услуги"

        - pattern: "(?i)\\bмаркетинг\\b"
          weight: 0.25
          distinctiveness: low
          context: any
          description: "Маркетинг — общий контекст, часто в связке с услугами"

        - pattern: "(?i)\\bохран[ааы]\\b"
          weight: 0.25
          distinctiveness: low
          context: any
          description: "Охрана как вид охранных услуг"

    exclusions:
      - pattern: "(?i)\\bподряд\\b"
        severity: hard
        weight: -1.0
        description: "Подряд предполагает материальный результат и собственный тип договора"

      - pattern: "(?i)строительно-?монтажн[ыо]е\\s+работ[ыа]"
        severity: hard
        weight: -1.0
        description: "Строительно-монтажные работы связывают с подрядом, а не с услугами"

      - pattern: "(?i)\\bперевозк[ааи]\\b"
        severity: hard
        weight: -1.0
        description: "Договор перевозки — самостоятельный тип (глава 40 ГК РФ)"

      - pattern: "(?i)\\bхранени[ея]\\b"
        severity: hard
        weight: -1.0
        description: "Договор хранения выделен в отдельный институт"

      - pattern: "(?i)\\bстраховани[ея]\\b"
        severity: hard
        weight: -1.0
        description: "Договор страхования имеет специальный режим и не относится к общим услугам"

      - pattern: "(?i)агентировани[ея]"
        severity: hard
        weight: -1.0
        description: "Агентирование — агентский договор, а не договор услуг"

      - pattern: "(?i)\\bпоручени[ея]\\b"
        severity: hard
        weight: -1.0
        description: "Поручение — отдельный тип договора (гл. 49 ГК РФ)"

      - pattern: "(?i)\\bкомисси[яяи]\\b"
        severity: hard
        weight: -1.0
        description: "Комиссия — отдельный посреднический договор"

      - pattern: "(?i)трудов[оа]й\\s+договор"
        severity: hard
        weight: -1.0
        description: "Трудовой договор регулируется ТК РФ, а не главой о возмездных услугах"

      - pattern: "(?i)трудов[оа]й\\s+распоряд[оа]к"
        severity: hard
        weight: -1.0
        description: "Прямые маркеры трудовых отношений (режим рабочего времени и т.п.)"

      - pattern: "(?i)лицензионн[ыо]й\\s+договор"
        severity: hard
        weight: -1.0
        description: "Лицензионные договоры на объекты ИС имеют собственный режим"

      - pattern: "(?i)коммерческ[а-яё]+\\s+концесси[яяи]"
        severity: hard
        weight: -1.0
        description: "Коммерческая концессия (франчайзинг) — отдельный комплексный договор"

      - pattern: "(?i)\\bфранчайзинг\\b"
        severity: hard
        weight: -1.0
        description: "Франчайзинг/коммерческая концессия, а не базовые услуги"

      - pattern: "(?i)договор\\s+перевозк[иы]\\s+груз[аов]"
        severity: hard
        weight: -1.0
        description: "Прямое указание на договор перевозки груза (глава 40 ГК РФ)"

      - pattern: "(?i)договор\\s+транспортн[ойого\\s]*экспедиц[иии]"
        severity: hard
        weight: -1.0
        description: "Транспортная экспедиция (глава 41 ГК РФ), не базовый договор услуг"

      - pattern: "(?i)договор\\s+транспортно-?экспедиционн[огоого\\s]*обслуживан[ияия]"
        severity: hard
        weight: -1.0
        description: "Договор ТЭО — экспедиционные услуги, не generic‑услуги"

      - pattern: "(?i)логистическ[ийое]\\s+контракт"
        severity: hard
        weight: -1.0
        description: "Логистический/экспедиторский контракт вместо общих услуг"

      - pattern: "(?i)экспедитор[а-я]*"
        severity: hard
        weight: -1.0
        description: "Наличие экспедитора как стороны тянет к транспортной экспедиции"

      - pattern: "(?i)грузоотправител[ьяеи]"
        severity: hard
        weight: -1.0
        description: "Грузоотправитель — маркер договоров перевозки/экспедиции, а не generic‑услуг"

      - pattern: "(?i)грузополучател[ьяеи]"
        severity: hard
        weight: -1.0
        description: "Грузополучатель — маркер логистических договоров, не базовых услуг"

      - pattern: "(?i)\\bперевозчик[а-я]*\\b"
        severity: soft
        weight: -0.40
        description: "Перевозчик как сторона — специальный класс 4.2/4.3"

      - pattern: "(?i)\\bдоговор[\\s\\n\\r]+(?:об\\s+организации\\s+)?перевозк[ии]"
        severity: soft
        weight: -0.50
        description: "Договор перевозки/организации перевозки — класс 4.2/4.3"

      - pattern: "(?i)\\bтранспортн[а-яё]+\\s+экспедиц"
        severity: soft
        weight: -0.50
        description: "Транспортная экспедиция — специальный класс 4.3"

      - pattern: "(?i)\\bКДПГ\\b|\\bCMR\\b|\\bЕСТР\\b|\\bМДП\\b"
        severity: soft
        weight: -0.40
        description: "Международные транспортные конвенции указывают на перевозку/экспедицию"

