      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора идентификацию заказчика
        и исполнителя, подписантов, основания полномочий и корпоративное одобрение.
        Не анализируй цену, сроки, приёмку, споры или санкции.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля. Верни все ключи, даже если данные отсутствуют.

        1. client_details_status — "defined" или "not_defined".
        2. client_details_value — идентификационные данные заказчика.
        3. client_type — "legal_entity", "state_entity", "individual", "ip", "self_employed" или "not_defined".
        4. client_signatory — подписант заказчика.
        5. client_signatory_basis — "charter", "poa", "order", "personal", "other" или "not_defined".
        6. provider_details_status — "defined" или "not_defined".
        7. provider_details_value — идентификационные данные исполнителя.
        8. provider_type — "legal_entity", "state_entity", "individual", "ip", "self_employed" или "not_defined".
        9. provider_signatory — подписант исполнителя.
        10. provider_signatory_basis — "charter", "poa", "order", "personal", "other" или "not_defined".
        11. corporate_approval_status — "defined" или "not_defined".
        12. corporate_approval_details — детали корпоративного одобрения.

        Правила заполнения при отсутствии данных:
        - Для всех *_status полей возвращай строго "not_defined".
        - Для всех текстовых полей (value, signatory, details) возвращай строго "Не установлено".
        - Для enum-полей (type, basis) возвращай "not_defined".
        </task>

        <rules>
        - Используй только текст договора.
        - client_type / provider_type:
            - "legal_entity" — ООО, АО, ПАО, иное юрлицо.
            - "state_entity" — госорган, учреждение, унитарное предприятие.
            - "individual" — физическое лицо без статуса ИП.
            - "ip" — индивидуальный предприниматель.
            - "self_employed" — самозанятый, НПД.
        - client_signatory_basis / provider_signatory_basis:
            - "charter" — устав.
            - "poa" — доверенность.
            - "order" — приказ.
            - "personal" — лично (для ИП или физлица).
            - "other" — иное основание (указать какое).
        - corporate_approval_status:
            - "defined" — если есть прямое указание на решение, протокол, одобрение.
        - Не путай банковские реквизиты в разделе "Адреса и реквизиты" с идентификацией стороны в преамбуле.
        - Верни только валидный JSON-объект без markdown-обёртки или с ней, но парсящийся.
        </rules>
      fields:
