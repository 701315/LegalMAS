  - id: service_subject_extraction
    name: "Услуги: базовое извлечение предмета договора"
    description: >
      Фактографическая проверка наличия в договоре описания предмета услуг,
      уровня детализации, объёма, ссылки на ТЗ или спецификацию, а также
      указания на конкретные результаты услуг. Результат предназначен для
      табличного сравнения нескольких договоров.
    triggers: ~
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "услуги"
        - "предмет договора"
        - "оказание услуг"
        - "перечень услуг"
        - "объём услуг"
        - "виды услуг"
        - "техническое задание"
        - "спецификация"
        - "результат услуг"
        - "отчет"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)(возмездн(ое|ого)\\s+оказани(е|я)\\s+услуг)"
        - "(?i)(исполнитель.*обязуется.*оказа(ть|ывать).*услуг)"
        - "(?i)(предмет.*договор.*услуг)"
        - "(?i)техническ(ое|ого)\\s+задани"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор возмездного оказания услуг.
        Проверяется только один вопрос: предмет договора, объем услуг, детализация
        описания, ссылка на ТЗ / спецификацию и наличие конкретных результатов услуг.

        Нормативный ориентир:
        - ст. 779 ГК РФ — оказание услуг
        - ст. 432 ГК РФ — заключённость договора

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора, а чего прямо нет.
        - Не оценивай серьёзность риска.
        - Юрист будет использовать результат в сравнительной таблице.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Определён ли предмет услуг.
        2. Как описан предмет услуг.
        3. Насколько детализировано описание предмета.
        4. Есть ли ссылка на ТЗ или спецификацию.
        5. Определён ли объём услуг.
        6. Есть ли ссылка на стандарты качества.
        7. Перечислены ли конкретные результаты (deliverables).
        8. Какой тип спецификации используется.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Если условие не указано прямо:
           - для статусных полей (*_status, volume_defined, quality_standards_referenced, deliverables_listed) возвращай "not_defined";
           - для текстовых полей (service_subject_description, tz_reference) возвращай "Не установлено";
           - для enum-полей (service_description_specificity, specification_type) возвращай "not_defined".
        4. Если описание услуг содержится прямо в тексте договора без ссылки на приложение/ТЗ/спецификацию, то specification_type = "in_body", а tz_reference = "Не применимо".
        5. Строго запрещено использовать "None", "null", "not_defined" (в текстовых полях) или пустые строки "".
        6. В evidence включай только точный текст договора.
        7. Если есть только общая формула «оказывать услуги» без конкретики — это не detailed.
        8. Верни только один валидный JSON-объект, содержащий все указанные ключи.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — предмет определён через ТЗ:
        Фрагмент:
        "Исполнитель обязуется оказать Заказчику услуги по настройке рекламных
        кампаний, подготовке ежемесячной аналитики и ведению кабинетов.
        Перечень и объем услуг определены в Приложении № 1 (Техническое задание)."

        Ответ:
        {
          "service_subject_status": "defined",
          "service_subject_description": "услуги по настройке рекламных кампаний, подготовке ежемесячной аналитики и ведению кабинетов",
          "service_description_specificity": "detailed",
          "tz_reference": "Приложение № 1 (Техническое задание)",
          "volume_defined": "defined",
          "quality_standards_referenced": "not_defined",
          "deliverables_listed": "defined",
          "specification_type": "tz",
          "evidence": [
            {
              "clause_ref": "п. 1.1",
              "quote": "Исполнитель обязуется оказать Заказчику услуги по настройке рекламных кампаний, подготовке ежемесячной аналитики и ведению кабинетов. Перечень и объем услуг определены в Приложении № 1 (Техническое задание)."
            }
          ]
        }

        Пример 2 — предмет описан в тексте договора без ссылок:
        Фрагмент:
        "Исполнитель обязуется оказать Заказчику услуги по проведению аудита
        информационной безопасности в объёме, согласованном Сторонами в настоящем
        разделе. Результатом услуг является письменный отчёт с рекомендациями."

        Ответ:
        {
          "service_subject_status": "defined",
          "service_subject_description": "услуги по проведению аудита информационной безопасности",
          "service_description_specificity": "generic",
          "tz_reference": "Не применимо",
          "volume_defined": "not_defined",
          "quality_standards_referenced": "not_defined",
          "deliverables_listed": "defined",
          "specification_type": "in_body",
          "evidence": [
            {
              "clause_ref": "п. 2.1",
              "quote": "Исполнитель обязуется оказать Заказчику услуги по проведению аудита информационной безопасности в объёме, согласованном Сторонами в настоящем разделе. Результатом услуг является письменный отчёт с рекомендациями."
            }
          ]
        }

        Пример 3 — данные отсутствуют:
        Фрагмент:
        "Исполнитель оказывает Заказчику услуги."

        Ответ:
        {
          "service_subject_status": "not_defined",
          "service_subject_description": "Не установлено",
          "service_description_specificity": "not_defined",
          "tz_reference": "Не установлено",
          "volume_defined": "not_defined",
          "quality_standards_referenced": "not_defined",
          "deliverables_listed": "not_defined",
          "specification_type": "not_defined",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Есть ли конкретное описание услуг.
        2. Есть ли ссылка на приложение, ТЗ, спецификацию, график или реестр.
        3. Есть ли указание на объём услуг.
        4. Есть ли указание на конкретные результаты услуг (отчёты, документы, материалы).
        5. Если описание прямо в тексте без ссылок — specification_type = "in_body", tz_reference = "Не применимо".
        6. Если прямой цитаты нет — верни "not_defined" для статусов и "Не установлено" для текста. Не додумывай условия.

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        {
          "service_subject_status": "<defined / not_defined>",
          "service_subject_description": "<текст или 'Не установлено'>",
          "service_description_specificity": "<detailed / generic / vague / not_defined>",
          "tz_reference": "<текст / 'Не применимо' / 'Не установлено'>",
          "volume_defined": "<defined / not_defined>",
          "quality_standards_referenced": "<defined / not_defined>",
          "deliverables_listed": "<defined / not_defined>",
          "specification_type": "<tz / appendix / in_body / schedule / registry / not_defined>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 700

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "предмет договора оказание услуг перечень услуг объем услуг техническое задание спецификация приложение график реестр результат услуг"
      retrieval_profile: "scope_of_work_check"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - technical_fragment
        - structural_anchor
      preferred_clause_functions:
        - definitions
        - obligations
      negative_keywords:
        - "оплата"
        - "неустойка"
        - "форс-мажор"
        - "расторжение"
        - "персональные данные"
      position_bias:
        preferred_range: [0.0, 0.30]
        boost: 0.20
        scope: segment
      context_k: 6
      max_chunks: 8
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "price_list"
        - "technical_fragment"
      preferred_clause_functions:
        - "definitions"
        - "obligations"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.12

    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 650

    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false

      llm_max_tokens: 850

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора предмет услуг,
        уровень детализации описания, ссылку на ТЗ / спецификацию,
        объем услуг и наличие конкретных результатов услуг.
        Не анализируй цену, сроки, приёмку, санкции или споры.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля. Верни все ключи, даже если данные отсутствуют.

        1. service_subject_status — "defined" или "not_defined".
        2. service_subject_description — описание предмета услуг.
        3. service_description_specificity — "detailed", "generic", "vague" или "not_defined".
        4. tz_reference — ссылка на ТЗ, спецификацию, приложение, график или реестр.
        5. volume_defined — "defined" или "not_defined".
        6. quality_standards_referenced — "defined" или "not_defined".
        7. deliverables_listed — "defined" или "not_defined".
        8. specification_type — "tz", "appendix", "in_body", "schedule", "registry" или "not_defined".

        Правила заполнения при отсутствии данных:
        - Для всех *_status полей возвращай строго "not_defined".
        - Для всех текстовых полей (description, tz_reference) возвращай:
            - "Не установлено" — если данных нет;
            - "Не применимо" — если параметр не применим (например, tz_reference при specification_type = in_body).
        - Для enum-полей (specificity, specification_type) возвращай "not_defined".
        </task>

        <rules>
        - Используй только текст договора.
        - service_description_specificity:
            - "detailed" — есть конкретный перечень услуг или действий с детализацией.
            - "generic" — есть общее описание, но без достаточной детализации.
            - "vague" — есть только абстрактная формула без расшифровки (например, "оказывать услуги").
            - "not_defined" — предмет прямо не определён.
        - specification_type:
            - "tz" — техническое задание.
            - "appendix" — приложение, спецификация, перечень.
            - "in_body" — описание прямо в тексте договора без ссылок на приложения.
            - "schedule" — график, календарный план.
            - "registry" — реестр услуг.
            - "not_defined" — тип спецификации прямо не определён.
        - volume_defined:
            - "defined" — указан конкретный объём (количество часов, единиц услуг, лимит).
            - "not_defined" — объём прямо не указан.
        - quality_standards_referenced:
            - "defined" — есть ссылка на стандарты качества (ГОСТ, ISO, SLA, KPI, отраслевые стандарты).
            - "not_defined" — стандарты качества прямо не указаны.
        - deliverables_listed:
            - "defined" — перечислены конкретные результаты (отчёты, документы, материалы, передачи прав).
            - "not_defined" — результаты прямо не перечислены.
        - tz_reference:
            - Если specification_type = "in_body", возвращай "Не применимо".
            - Если есть ссылка на приложение/ТЗ/спецификацию/график/реестр — укажи её.
            - Если данных нет — возвращай "Не установлено".
        - Верни только валидный JSON-объект без markdown-обёртки или с ней, но парсящийся.
        </rules>
      fields:
        - name: "service_subject_status"
          type: "string"
          presentation: "signal"
          allowed_values:
            - "defined"
            - "not_defined"
          description: "Статус определения предмета услуг."
          required: true
          display_in_grid: false

        - name: "service_subject_description"
          type: "string"
          presentation: "fact"
          label: "Предмет услуг"
          description: "Описание предмета услуг."
          required: true
          display_in_grid: true
          display_priority: 1

        - name: "service_description_specificity"
          type: "string"
          presentation: "signal"
          allowed_values:
            - "detailed"
            - "generic"
            - "vague"
            - "not_defined"
          description: "Уровень детализации предмета услуг."
          required: true
          display_in_grid: false

        - name: "service_description_specificity_display"
          type: "string"
          presentation: "fact"
          label: "Уровень детализации"
          description: "User-friendly отображение уровня детализации предмета услуг."
          required: true
          display_in_grid: true
          display_priority: 3

        - name: "tz_reference"
          type: "string"
          presentation: "fact"
          label: "ТЗ / спецификация"
          description: "Ссылка на ТЗ, приложение, спецификацию, график или реестр."
          required: false
          display_in_grid: true
          display_priority: 2

        - name: "volume_defined"
          type: "string"
          presentation: "signal"
          allowed_values:
            - "defined"
            - "not_defined"
          description: "Статус определения объема услуг."
          required: true
          display_in_grid: false

        - name: "quality_standards_referenced"
          type: "string"
          presentation: "signal"
          allowed_values:
            - "defined"
            - "not_defined"
          description: "Есть ли ссылка на стандарты качества."
          required: true
          display_in_grid: false

        - name: "deliverables_listed"
          type: "string"
          presentation: "signal"
          allowed_values:
            - "defined"
            - "not_defined"
          description: "Перечислены ли конкретные результаты услуг."
          required: true
          display_in_grid: false

        - name: "specification_type"
          type: "string"
          presentation: "signal"
          allowed_values:
            - "tz"
            - "appendix"
            - "in_body"
            - "schedule"
            - "registry"
            - "not_defined"
          description: "Тип спецификации услуг."
          required: true
          display_in_grid: false

        - name: "specification_type_display"
          type: "string"
          presentation: "fact"
          label: "Тип спецификации"
          description: "User-friendly отображение типа спецификации услуг."
          required: true
          display_in_grid: true
          display_priority: 4
      store_payload: true

  - id: price_and_payment_terms
    name: "Стоимость услуг и порядок расчётов (ст. 781 ГК РФ)"
    description: >
      Фактографическая проверка наличия в договоре цены услуг, модели
      ценообразования, НДС, аванса и порядка оплаты. Результат предназначен
      для табличного сравнения нескольких договоров.
    triggers: ~
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "цена"
        - "стоимость"
        - "вознаграждение"
        - "оплата"
        - "аванс"
        - "НДС"
        - "абонентская плата"
        - "почасовая ставка"
        - "счет"
        - "акт"
        - "право удержания"
        - "передача результатов после оплаты"
        - "сохранение прав до оплаты"
        - "удерживать до полной оплаты"
        - "не передавать результат"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)стоимост(ь|и)\\s+услуг.*\\d"
        - "(?i)\\b\\d[\\d\\s]*(?:руб|рублей|₽|тыс|млн)"
        - "(?i)оплат(а|ы).*услуг"
        - "(?i)аванс"
        - "(?i)удержива(ть|ет).*результат.*до.*оплат"
        - "(?i)передач(а|и).*после.*полной\\s+оплат"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор возмездного оказания услуг.
        Проверяется только один вопрос: цена услуг, НДС, аванс, порядок оплаты
        и право исполнителя удерживать результаты услуг до полной оплаты.

        Нормативный ориентир:
        - ст. 781 ГК РФ — оплата услуг
        - общие положения об обязательствах и расчетах
        - договорные механизмы удержания результата до оплаты

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора, а чего прямо нет.
        - Не оценивай серьёзность риска.
        - Юрист будет использовать результат в сравнительной таблице.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Определена ли цена договора.
        2. Какой размер цены указан.
        3. Какая модель ценообразования используется.
        4. Как указано условие о НДС.
        5. Предусмотрен ли аванс.
        6. Какой порядок оплаты установлен.
        7. На каком основании производится оплата.
        8. Есть ли право удерживать результаты услуг до полной оплаты.
        9. Как описано такое удержание.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Если условие не указано прямо:
           - для статусных полей (*_status, advance_present, result_retention_until_payment_defined) возвращай "not_defined";
           - для текстовых полей (contract_price_value, result_retention_summary) возвращай "Не установлено" или "Не применимо" (если параметр не применим);
           - для enum-полей (pricing_model, price_includes_vat, payment_timing, payment_basis) возвращай "not_defined".
        4. Строго запрещено использовать "None", "null", "not_defined" (в текстовых полях) или пустые строки "".
        5. Если цена определяется по прайс-листу, спецификации, смете или иному документу — укажи это в contract_price_value (например, "Определяется по Прайс-листу (Приложение № 2)").
        6. price_includes_vat = "not_applicable" — если исполнитель на УСН/ЕСХН/патенте, или услуга прямо не облагается НДС, или указано "НДС не облагается".
        7. Если право удержания результата до оплаты прямо не предусмотрено в тексте — result_retention_summary = "Не применимо".
        8. Не путай цену договора с неустойкой или компенсацией расходов.
        9. Не путай обычный порядок передачи результата после оплаты с прямым правом удержания, если удержание или непередача до оплаты не сформулированы в тексте.
        10. В evidence включай только точный текст договора.
        11. Верни только один валидный JSON-объект, содержащий все указанные ключи.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — цена и удержание определены:
        Фрагмент:
        "Стоимость услуг составляет 300 000 рублей в месяц, НДС не облагается.
        Заказчик выплачивает аванс в размере 50% в течение 5 банковских дней
        после выставления счета, оставшаяся сумма оплачивается после подписания акта.
        Исполнитель вправе не передавать итоговые отчеты до полной оплаты услуг."

        Ответ:
        {
          "contract_price_status": "defined",
          "contract_price_value": "300 000 рублей в месяц",
          "pricing_model": "subscription",
          "pricing_model_display": "Абонентская плата",
          "price_includes_vat": "not_applicable",
          "price_includes_vat_display": "НДС не применяется",
          "advance_present": "defined",
          "payment_timing": "mixed",
          "payment_basis": "mixed",
          "payment_terms_summary": "Аванс 50% по счёту в течение 5 банковских дней, остаток после подписания акта",
          "result_retention_until_payment_defined": "defined",
          "result_retention_summary": "Исполнитель вправе не передавать итоговые отчёты до полной оплаты услуг",
          "evidence": [
            {
              "clause_ref": "п. 3.1",
              "quote": "Стоимость услуг составляет 300 000 рублей в месяц, НДС не облагается. Заказчик выплачивает аванс в размере 50% в течение 5 банковских дней после выставления счета, оставшаяся сумма оплачивается после подписания акта. Исполнитель вправе не передавать итоговые отчеты до полной оплаты услуг."
            }
          ]
        }

        Пример 2 — цена определяется по прайс-листу:
        Фрагмент:
        "Стоимость услуг определяется согласно Прайс-листу Исполнителя (Приложение № 2).
        Цены указаны без учёта НДС. Оплата производится в течение 10 банковских дней
        после подписания акта оказанных услуг."

        Ответ:
        {
          "contract_price_status": "defined",
          "contract_price_value": "Определяется по Прайс-листу (Приложение № 2)",
          "pricing_model": "per_unit",
          "pricing_model_display": "За единицу услуги",
          "price_includes_vat": "no",
          "price_includes_vat_display": "Без НДС",
          "advance_present": "not_defined",
          "payment_timing": "postpayment",
          "payment_basis": "act",
          "payment_terms_summary": "Постоплата в течение 10 банковских дней по акту",
          "result_retention_until_payment_defined": "not_defined",
          "result_retention_summary": "Не применимо",
          "evidence": [
            {
              "clause_ref": "п. 4.1",
              "quote": "Стоимость услуг определяется согласно Прайс-листу Исполнителя (Приложение № 2). Цены указаны без учёта НДС. Оплата производится в течение 10 банковских дней после подписания акта оказанных услуг."
            }
          ]
        }

        Пример 3 — данные отсутствуют:
        Фрагмент:
        "Стоимость определяется по соглашению сторон."

        Ответ:
        {
          "contract_price_status": "not_defined",
          "contract_price_value": "Не установлено",
          "pricing_model": "not_defined",
          "pricing_model_display": "Не определено",
          "price_includes_vat": "not_defined",
          "price_includes_vat_display": "Не определено",
          "advance_present": "not_defined",
          "payment_timing": "not_defined",
          "payment_basis": "not_defined",
          "payment_terms_summary": "Не установлено",
          "result_retention_until_payment_defined": "not_defined",
          "result_retention_summary": "Не применимо",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Есть ли прямое указание на сумму или формулу цены.
        2. Если цена определяется по прайс-листу/смете/спецификации — это не "Не установлено", а "Определяется по ...".
        3. Есть ли прямое указание на НДС.
        4. Есть ли прямое указание на аванс.
        5. Есть ли прямое указание на сроки и основание оплаты.
        6. Есть ли прямое указание на непередачу или удержание результата до оплаты.
        7. Если прямой цитаты нет — верни "not_defined" для статусов и "Не установлено" для текста. Не додумывай условия.

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        {
          "contract_price_status": "<defined / not_defined>",
          "contract_price_value": "<текст / 'Определяется по ...' / 'Не установлено'>",
          "pricing_model": "<fixed / hourly / subscription / per_unit / mixed / not_defined>",
          "pricing_model_display": "<Фиксированная цена / Почасовая ставка / Абонентская плата / За единицу услуги / Смешанная модель / Не определено>",
          "price_includes_vat": "<yes / no / not_applicable / unclear / not_defined>",
          "price_includes_vat_display": "<Включает НДС / Без НДС / НДС не применяется / Неясно / Не определено>",
          "advance_present": "<defined / not_defined>",
          "payment_timing": "<prepayment / postpayment / staged / monthly / mixed / not_defined>",
          "payment_basis": "<invoice / act / report / mixed / not_defined>",
          "payment_terms_summary": "<краткое описание порядка оплаты или 'Не установлено'>",
          "result_retention_until_payment_defined": "<defined / not_defined>",
          "result_retention_summary": "<текст / 'Не применимо' / 'Не установлено'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 720

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "стоимость услуг цена вознаграждение оплата аванс НДС счёт акт отчёт абонентская плата почасовая ставка смета прайс-лист удержание результата до оплаты"
      retrieval_profile: "payment_terms_check"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - technical_fragment
        - structural_anchor
      preferred_clause_functions:
        - obligations
      negative_keywords:
        - "неустойка"
        - "штраф"
        - "убытки"
        - "расторжение"
      position_bias:
        preferred_range: [0.10, 0.45]
        boost: 0.18
        scope: segment
      context_k: 6
      max_chunks: 8
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
      preferred_clause_functions:
        - "obligations"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 650

    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false

      llm_max_tokens: 950

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора цену услуг,
        модель ценообразования, НДС, аванс, порядок оплаты и право исполнителя
        удерживать результаты услуг до полной оплаты. Не анализируй санкции,
        форс-мажор, споры или персональные данные.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля. Верни все ключи, даже если данные отсутствуют.

        1. contract_price_status — "defined" или "not_defined".
        2. contract_price_value — цена услуг (текст или "Определяется по ..." или "Не установлено").
        3. pricing_model — "fixed", "hourly", "subscription", "per_unit", "mixed" или "not_defined".
        4. pricing_model_display — user-friendly: "Фиксированная цена", "Почасовая ставка", "Абонентская плата", "За единицу услуги", "Смешанная модель" или "Не определено".
        5. price_includes_vat — "yes", "no", "not_applicable", "unclear" или "not_defined".
        6. price_includes_vat_display — user-friendly: "Включает НДС", "Без НДС", "НДС не применяется", "Неясно" или "Не определено".
        7. advance_present — "defined" или "not_defined".
        8. payment_timing — "prepayment", "postpayment", "staged", "monthly", "mixed" или "not_defined".
        9. payment_basis — "invoice", "act", "report", "mixed" или "not_defined".
        10. payment_terms_summary — краткое user-friendly описание порядка оплаты.
        11. result_retention_until_payment_defined — "defined" или "not_defined".
        12. result_retention_summary — краткое описание права удержания (текст или "Не применимо" или "Не установлено").

        Правила заполнения при отсутствии данных:
        - Для всех *_status полей и advance_present возвращай строго "not_defined".
        - Для текстовых полей (contract_price_value, result_retention_summary):
            - "Не установлено" — если данных нет;
            - "Не применимо" — если параметр не применим (result_retention_summary при отсутствии удержания);
            - "Определяется по ..." — если цена определяется по прайс-листу/смете/спецификации.
        - Для enum-полей (pricing_model, price_includes_vat, payment_timing, payment_basis) возвращай "not_defined".
        - Для *_display полей возвращай соответствующий user-friendly текст или "Не определено".
        </task>

        <rules>
        - Используй только текст договора.
        - pricing_model:
            - "fixed" — фиксированная цена за весь объём услуг.
            - "hourly" — почасовая ставка.
            - "subscription" — абонентская / периодическая плата (ежемесячная, ежеквартальная).
            - "per_unit" — оплата за единицу услуги (за документ, за проверку, за заявку).
            - "mixed" — сочетание нескольких моделей.
        - pricing_model_display — маппинг:
            - fixed → "Фиксированная цена"
            - hourly → "Почасовая ставка"
            - subscription → "Абонентская плата"
            - per_unit → "За единицу услуги"
            - mixed → "Смешанная модель"
            - not_defined → "Не определено"
        - price_includes_vat:
            - "yes" — цена включает НДС (например, "в том числе НДС 20%").
            - "no" — цена указана без НДС (например, "НДС начисляется дополнительно").
            - "not_applicable" — НДС не применяется (исполнитель на УСН/ЕСХН/патенте, или "НДС не облагается").
            - "unclear" — НДС упомянут, но условие двусмысленно.
        - price_includes_vat_display — маппинг:
            - yes → "Включает НДС"
            - no → "Без НДС"
            - not_applicable → "НДС не применяется"
            - unclear → "Неясно"
            - not_defined → "Не определено"
        - payment_timing:
            - "prepayment" — полная предоплата до начала оказания услуг.
            - "postpayment" — оплата после оказания услуг / после приёмки.
            - "staged" — оплата по этапам.
            - "monthly" — периодическая ежемесячная оплата.
            - "mixed" — сочетание вариантов (например, аванс + постоплата).
        - payment_basis:
            - "invoice" — по счёту.
            - "act" — по акту оказанных услуг.
            - "report" — по отчёту.
            - "mixed" — несколько оснований.
        - payment_terms_summary:
            - Сформируй краткое user-friendly описание порядка оплаты на основе advance_present, payment_timing и payment_basis.
            - Примеры: "Аванс 50% по счёту, остаток по акту в течение 5 дней", "Постоплата по акту в течение 30 дней", "Ежемесячная абонентская плата по счёту".
            - Если все три поля (advance_present, payment_timing, payment_basis) = not_defined, возвращай "Не установлено".
        - result_retention_until_payment_defined:
            - "defined" — есть прямое право не передавать / удерживать результат до оплаты.
        - result_retention_summary:
            - Если удержание определено — заполни кратким текстом из договора.
            - Если удержание прямо не предусмотрено — возвращай "Не применимо".
        - contract_price_value:
            - Если цена указана прямо — укажи сумму и валюту.
            - Если цена определяется по прайс-листу, смете, спецификации — укажи "Определяется по [название документа]".
        - Не путай цену договора с неустойкой или компенсацией расходов.
        - Не путай обычный порядок передачи результата после оплаты с прямым правом удержания.
        - Верни только валидный JSON-объект без markdown-обёртки или с ней, но парсящийся.
        </rules>
      fields:
        - name: "contract_price_status"
          type: "string"
          presentation: "signal"
          allowed_values:
            - "defined"
            - "not_defined"
          description: "Статус определения цены услуг."
          required: true
          display_in_grid: false

        - name: "contract_price_value"
          type: "string"
          presentation: "fact"
          label: "Стоимость услуг"
          description: "Цена услуг по договору."
          required: true
          display_in_grid: true
          display_priority: 1

        - name: "pricing_model"
          type: "string"
          presentation: "signal"
          allowed_values:
            - "fixed"
            - "hourly"
            - "subscription"
            - "per_unit"
            - "mixed"
            - "not_defined"
          description: "Модель ценообразования."
          required: true
          display_in_grid: false

        - name: "pricing_model_display"
          type: "string"
          presentation: "fact"
          label: "Модель ценообразования"
          description: "User-friendly отображение модели ценообразования."
          required: true
          display_in_grid: true
          display_priority: 2

        - name: "price_includes_vat"
          type: "string"
          presentation: "signal"
          allowed_values:
            - "yes"
            - "no"
            - "not_applicable"
            - "unclear"
            - "not_defined"
          description: "Условие о НДС."
          required: true
          display_in_grid: false

        - name: "price_includes_vat_display"
          type: "string"
          presentation: "fact"
          label: "НДС"
          description: "User-friendly отображение условия о НДС."
          required: true
          display_in_grid: true
          display_priority: 3

        - name: "advance_present"
          type: "string"
          presentation: "signal"
          allowed_values:
            - "defined"
            - "not_defined"
          description: "Предусмотрен ли аванс."
          required: true
          display_in_grid: false

        - name: "payment_timing"
          type: "string"
          presentation: "signal"
          allowed_values:
            - "prepayment"
            - "postpayment"
            - "staged"
            - "monthly"
            - "mixed"
            - "not_defined"
          description: "Порядок по времени оплаты."
          required: true
          display_in_grid: false

        - name: "payment_basis"
          type: "string"
          presentation: "signal"
          allowed_values:
            - "invoice"
            - "act"
            - "report"
            - "mixed"
            - "not_defined"
          description: "Основание оплаты."
          required: true
          display_in_grid: false

        - name: "payment_terms_summary"
          type: "string"
          presentation: "fact"
          label: "Порядок оплаты"
          description: "Краткое user-friendly описание порядка оплаты (аванс, сроки, основание)."
          required: true
          display_in_grid: true
          display_priority: 4

        - name: "result_retention_until_payment_defined"
          type: "string"
          presentation: "signal"
          allowed_values:
            - "defined"
            - "not_defined"
          description: "Есть ли право исполнителя удерживать результаты до оплаты."
          required: true
          display_in_grid: false

        - name: "result_retention_summary"
          type: "string"
          presentation: "fact"
          label: "Удержание результата"
          description: "Краткое описание права удержания результатов до оплаты."
          required: false
          display_in_grid: true
          display_priority: 5
      store_payload: true

  - id: service_period_defined
    name: "Срок оказания услуг (ст. 708 ГК РФ по аналогии)"
    description: >
      Фактографическая проверка наличия в договоре срока оказания услуг,
      начального и конечного момента, этапности и определённости срока.
      Результат предназначен для табличного сравнения нескольких договоров.
    triggers: ~
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "срок оказания"
        - "период оказания"
        - "дата начала"
        - "дата окончания"
        - "в течение"
        - "с момента"
        - "этап"
        - "календарный план"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)срок\\s+оказани"
        - "(?i)\\b\\d{1,2}[.]\\d{1,2}[.]\\d{4}\\b"
        - "(?i)(в\\s+течение|с\\s+момента)\\s+\\d+"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор возмездного оказания услуг.
        Проверяется только один вопрос: срок оказания услуг, начальный и конечный
        момент, этапы и определённость срока.

        Нормативный ориентир:
        - ст. 190 ГК РФ — определение сроков
        - ст. 708 ГК РФ по аналогии — сроки выполнения

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора, а чего прямо нет.
        - Не оценивай серьёзность риска.
        - Юрист будет использовать результат в сравнительной таблице.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Определён ли срок оказания услуг.
        2. Как сформулирован срок.
        3. Какой начальный момент указан.
        4. Какой конечный момент указан.
        5. Есть ли этапы / milestones.
        6. Насколько определён срок.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Если условие не указано прямо:
           - для статусных полей (*_status, milestones_present) возвращай "not_defined";
           - для текстовых полей (service_period_value, service_start_moment, service_end_moment) возвращай "Не установлено";
           - для enum-полей (term_definiteness) возвращай "not_defined".
        4. Строго запрещено использовать "None", "null", "not_defined" (в текстовых полях) или пустые строки "".
        5. Если срок оказания услуг определяется по календарному плану, графику, приложению или иному документу — укажи это в service_period_value (например, "Определяется по Календарному плану (Приложение № 3)").
        6. Не путай срок оказания услуг со сроком действия договора, сроком оплаты или сроком уведомления.
        7. В evidence включай только точный текст договора.
        8. Верни только один валидный JSON-объект, содержащий все указанные ключи.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — срок определён конкретными датами:
        Фрагмент:
        "Услуги оказываются с 01.03.2024 по 31.12.2024. Отчеты предоставляются
        ежемесячно. Первый этап завершается 31.05.2024."

        Ответ:
        {
          "service_period_status": "defined",
          "service_period_value": "с 01.03.2024 по 31.12.2024",
          "service_start_moment": "01.03.2024",
          "service_end_moment": "31.12.2024",
          "milestones_present": "defined",
          "term_definiteness": "fixed_date",
          "evidence": [
            {
              "clause_ref": "п. 2.1",
              "quote": "Услуги оказываются с 01.03.2024 по 31.12.2024. Отчеты предоставляются ежемесячно. Первый этап завершается 31.05.2024."
            }
          ]
        }

        Пример 2 — срок определяется по календарному плану:
        Фрагмент:
        "Срок оказания услуг определяется согласно Календарному плану (Приложение № 3
        к настоящему Договору). Исполнитель обязуется завершить все этапы работ в сроки,
        установленные указанным Календарным планом."

        Ответ:
        {
          "service_period_status": "defined",
          "service_period_value": "Определяется по Календарному плану (Приложение № 3)",
          "service_start_moment": "Не установлено",
          "service_end_moment": "Не установлено",
          "milestones_present": "defined",
          "term_definiteness": "event_based",
          "evidence": [
            {
              "clause_ref": "п. 3.1",
              "quote": "Срок оказания услуг определяется согласно Календарному плану (Приложение № 3 к настоящему Договору). Исполнитель обязуется завершить все этапы работ в сроки, установленные указанным Календарным планом."
            }
          ]
        }

        Пример 3 — срок привязан к событию:
        Фрагмент:
        "Исполнитель обязуется оказать услуги в течение 30 календарных дней с момента
        получения полного комплекта исходных данных от Заказчика."

        Ответ:
        {
          "service_period_status": "defined",
          "service_period_value": "в течение 30 календарных дней с момента получения полного комплекта исходных данных",
          "service_start_moment": "с момента получения полного комплекта исходных данных",
          "service_end_moment": "через 30 календарных дней после начала",
          "milestones_present": "not_defined",
          "term_definiteness": "event_based",
          "evidence": [
            {
              "clause_ref": "п. 2.2",
              "quote": "Исполнитель обязуется оказать услуги в течение 30 календарных дней с момента получения полного комплекта исходных данных от Заказчика."
            }
          ]
        }

        Пример 4 — данные отсутствуют:
        Фрагмент:
        "Исполнитель оказывает услуги в период действия договора."

        Ответ:
        {
          "service_period_status": "not_defined",
          "service_period_value": "Не установлено",
          "service_start_moment": "Не установлено",
          "service_end_moment": "Не установлено",
          "milestones_present": "not_defined",
          "term_definiteness": "not_defined",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Есть ли прямая формулировка срока оказания услуг (не срока действия договора).
        2. Есть ли отдельный начальный момент.
        3. Есть ли отдельный конечный момент.
        4. Есть ли этапы или milestones.
        5. Если срок определяется по календарному плану / графику / приложению — это не "Не установлено", а "Определяется по ...".
        6. Если прямой цитаты нет — верни "not_defined" для статусов и "Не установлено" для текста. Не додумывай условия.

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        {
          "service_period_status": "<defined / not_defined>",
          "service_period_value": "<текст / 'Определяется по ...' / 'Не установлено'>",
          "service_start_moment": "<текст или 'Не установлено'>",
          "service_end_moment": "<текст или 'Не установлено'>",
          "milestones_present": "<defined / not_defined>",
          "term_definiteness": "<fixed_date / event_based / vague / not_defined>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 5
      temperature: 0.0
      max_tokens: 600

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "срок оказания услуг дата начала дата окончания период оказания этап календарный план график milestone"
      retrieval_profile: "term_and_renewal_check"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - technical_fragment
        - structural_anchor
      preferred_clause_functions:
        - obligations
      negative_keywords:
        - "срок оплаты"
        - "срок рассмотрения акта"
        - "срок уведомления"
        - "неустойка"
      position_bias:
        preferred_range: [0.10, 0.45]
        boost: 0.18
        scope: segment
      context_k: 5
      max_chunks: 7
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
      preferred_clause_functions:
        - "obligations"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 650

    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false

      llm_max_tokens: 700

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора срок оказания услуг,
        начальный и конечный момент, этапы и определённость срока.
        Не анализируй цену, приёмку, санкции или споры.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля. Верни все ключи, даже если данные отсутствуют.

        1. service_period_status — "defined" или "not_defined".
        2. service_period_value — срок оказания услуг (текст или "Определяется по ..." или "Не установлено").
        3. service_start_moment — начальный момент срока услуг (текст или "Не установлено").
        4. service_end_moment — конечный момент срока услуг (текст или "Не установлено").
        5. milestones_present — "defined" или "not_defined".
        6. term_definiteness — "fixed_date", "event_based", "vague" или "not_defined".

        Правила заполнения при отсутствии данных:
        - Для service_period_status и milestones_present возвращай строго "not_defined".
        - Для текстовых полей (service_period_value, service_start_moment, service_end_moment) возвращай "Не установлено".
        - Для term_definiteness возвращай "not_defined".
        </task>

        <rules>
        - Используй только текст договора.
        - term_definiteness:
            - "fixed_date" — конкретные даты или чёткий период (например, "с 01.01.2024 по 31.12.2024").
            - "event_based" — срок определён через событие или привязан к документу (например, "с момента подписания акта", "определяется по Календарному плану").
            - "vague" — срок сформулирован неопределённо (например, "в разумный срок", "в течение периода действия договора").
            - "not_defined" — срок прямо не определён.
        - milestones_present:
            - "defined" — есть этапы, milestones, график, календарный план.
            - "not_defined" — этапы прямо не указаны.
        - service_period_value:
            - Если срок указан прямо — укажи формулировку из договора.
            - Если срок определяется по календарному плану, графику, приложению — укажи "Определяется по [название документа]".
        - Не путай срок оказания услуг со сроком действия договора, сроком оплаты или сроком уведомления.
        - Верни только валидный JSON-объект без markdown-обёртки или с ней, но парсящийся.
        </rules>
      fields:
        - name: "service_period_status"
          type: "string"
          presentation: "signal"
          allowed_values:
            - "defined"
            - "not_defined"
          description: "Статус указания срока оказания услуг."
          required: true
          display_in_grid: false

        - name: "service_period_value"
          type: "string"
          presentation: "fact"
          label: "Срок услуг"
          description: "Срок оказания услуг."
          required: true
          display_in_grid: true
          display_priority: 1

        - name: "service_start_moment"
          type: "string"
          presentation: "fact"
          label: "Начало услуг"
          description: "Начальный момент срока услуг."
          required: false
          display_in_grid: false

        - name: "service_end_moment"
          type: "string"
          presentation: "fact"
          label: "Окончание услуг"
          description: "Конечный момент срока услуг."
          required: false
          display_in_grid: false

        - name: "milestones_present"
          type: "string"
          presentation: "signal"
          allowed_values:
            - "defined"
            - "not_defined"
          description: "Есть ли этапы оказания услуг."
          required: true
          display_in_grid: false

        - name: "term_definiteness"
          type: "string"
          presentation: "signal"
          allowed_values:
            - "fixed_date"
            - "event_based"
            - "vague"
            - "not_defined"
          description: "Степень определенности срока услуг."
          required: true
          display_in_grid: false
      store_payload: true

  - id: payment_acceptance_link_check
    name: "Привязка оплаты к акту/отчёту (ст. 781 ГК РФ)"
    description: >
      Фактографическая проверка наличия в договоре акта оказанных услуг,
      отчётности исполнителя, срока рассмотрения, мотивированного отказа и
      привязки оплаты к приемке. Результат предназначен для табличного
      сравнения нескольких договоров.
    triggers: ~
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "акт об оказании услуг"
        - "акт оказанных услуг"
        - "акт сдачи-приёмки"
        - "отчёт об оказанных услугах"
        - "детализация услуг"
        - "мотивированный отказ"
        - "срок рассмотрения"
        - "оплата после подписания"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)акт.*оказ(ания|анных).*услуг"
        - "(?i)оплат(а|ы).*после.*подписани.*акт"
        - "(?i)отч(е|ё)т.*услуг"
        - "(?i)мотивированн(ый|ого)\\s+отказ"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор возмездного оказания услуг.
        Проверяется только один вопрос: порядок приемки услуг, акт, отчетность
        исполнителя и привязка оплаты к приемке.

        Нормативный ориентир:
        - ст. 781 ГК РФ — оплата услуг
        - общие положения о приемке результата и подтверждающих документах

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора, а чего прямо нет.
        - Не оценивай серьёзность риска.
        - Юрист будет использовать результат в сравнительной таблице.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Требуется ли акт.
        2. Требуется ли детализированный акт.
        3. Требуется ли отчет.
        4. Требуется ли детализированный отчет.
        5. Привязана ли оплата к акту или отчету.
        6. Какой срок рассмотрения документов указан.
        7. Есть ли автоприемка.
        8. Есть ли процедура мотивированного отказа.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Если условие не указано прямо:
           - для статусных полей (все *_required, *_detailed, *_linked, *_status, *_clause, *_procedure) возвращай "not_defined";
           - для текстовых полей (review_period_value) возвращай "Не установлено".
        4. Строго запрещено использовать "None", "null", "not_defined" (в текстовых полях) или пустые строки "".
        5. acceptance_documents_summary:
           - Если требуется и акт, и отчёт — "Акт + отчёт".
           - Если требуется только акт — "Только акт".
           - Если требуется только отчёт — "Только отчёт".
           - Если ничего не требуется — "Не определено".
           - Если требуется детализация — добавь " (с детализацией)".
        6. payment_linked_to_acceptance_display:
           - Если оплата привязана к приемке — "Оплата после подписания акта/отчёта".
           - Если оплата не привязана — "Оплата не привязана к приемке".
           - Если не определено — "Не определено".
        7. auto_acceptance_clause_display:
           - Если есть автоприемка — укажи срок (например, "Автоприемка через 5 рабочих дней").
           - Если автоприемки нет — "Автоприемка не предусмотрена".
           - Если не определено — "Не определено".
        8. Не путай акт приемки услуг с актом сверки или иным документом.
        9. В evidence включай только точный текст договора.
        10. Верни только один валидный JSON-объект, содержащий все указанные ключи.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — порядок приемки определён:
        Фрагмент:
        "Исполнитель ежемесячно направляет акт оказанных услуг и отчет с
        детализацией выполненных действий. Заказчик обязан в течение 5 рабочих
        дней подписать акт либо направить мотивированный отказ. Оплата
        производится после подписания акта."

        Ответ:
        {
          "act_required": "defined",
          "act_detailed": "defined",
          "report_required": "defined",
          "report_detailed": "defined",
          "acceptance_documents_summary": "Акт + отчёт (с детализацией)",
          "payment_linked_to_acceptance": "defined",
          "payment_linked_to_acceptance_display": "Оплата после подписания акта",
          "review_period_status": "defined",
          "review_period_value": "5 рабочих дней",
          "auto_acceptance_clause": "not_defined",
          "auto_acceptance_clause_display": "Автоприемка не предусмотрена",
          "motivated_refusal_procedure": "defined",
          "evidence": [
            {
              "clause_ref": "п. 4.1",
              "quote": "Исполнитель ежемесячно направляет акт оказанных услуг и отчет с детализацией выполненных действий. Заказчик обязан в течение 5 рабочих дней подписать акт либо направить мотивированный отказ. Оплата производится после подписания акта."
            }
          ]
        }

        Пример 2 — автоприемка:
        Фрагмент:
        "Исполнитель направляет акт оказанных услуг. Если в течение 10 рабочих дней
        Заказчик не направит мотивированный отказ, услуги считаются принятыми.
        Оплата производится ежемесячно независимо от подписания акта."

        Ответ:
        {
          "act_required": "defined",
          "act_detailed": "not_defined",
          "report_required": "not_defined",
          "report_detailed": "not_defined",
          "acceptance_documents_summary": "Только акт",
          "payment_linked_to_acceptance": "not_defined",
          "payment_linked_to_acceptance_display": "Оплата не привязана к приемке",
          "review_period_status": "defined",
          "review_period_value": "10 рабочих дней",
          "auto_acceptance_clause": "defined",
          "auto_acceptance_clause_display": "Автоприемка через 10 рабочих дней",
          "motivated_refusal_procedure": "defined",
          "evidence": [
            {
              "clause_ref": "п. 5.2",
              "quote": "Исполнитель направляет акт оказанных услуг. Если в течение 10 рабочих дней Заказчик не направит мотивированный отказ, услуги считаются принятыми. Оплата производится ежемесячно независимо от подписания акта."
            }
          ]
        }

        Пример 3 — данные отсутствуют:
        Фрагмент:
        "Услуги считаются оказанными надлежащим образом."

        Ответ:
        {
          "act_required": "not_defined",
          "act_detailed": "not_defined",
          "report_required": "not_defined",
          "report_detailed": "not_defined",
          "acceptance_documents_summary": "Не определено",
          "payment_linked_to_acceptance": "not_defined",
          "payment_linked_to_acceptance_display": "Не определено",
          "review_period_status": "not_defined",
          "review_period_value": "Не установлено",
          "auto_acceptance_clause": "not_defined",
          "auto_acceptance_clause_display": "Не определено",
          "motivated_refusal_procedure": "not_defined",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Есть ли прямое указание на акт.
        2. Есть ли прямое указание на отчет.
        3. Есть ли прямое указание на срок рассмотрения.
        4. Есть ли прямое указание на автоприемку или мотивированный отказ.
        5. Если прямой цитаты нет — верни "not_defined" для статусов и "Не установлено" для текста. Не додумывай условия.

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        {
          "act_required": "<defined / not_defined>",
          "act_detailed": "<defined / not_defined>",
          "report_required": "<defined / not_defined>",
          "report_detailed": "<defined / not_defined>",
          "acceptance_documents_summary": "<Акт + отчёт / Только акт / Только отчёт / Не определено>",
          "payment_linked_to_acceptance": "<defined / not_defined>",
          "payment_linked_to_acceptance_display": "<Оплата после подписания акта / Оплата не привязана к приемке / Не определено>",
          "review_period_status": "<defined / not_defined>",
          "review_period_value": "<текст или 'Не установлено'>",
          "auto_acceptance_clause": "<defined / not_defined>",
          "auto_acceptance_clause_display": "<Автоприемка через N дней / Автоприемка не предусмотрена / Не определено>",
          "motivated_refusal_procedure": "<defined / not_defined>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 5
      temperature: 0.0
      max_tokens: 700

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "акт оказанных услуг отчет детализация мотивированный отказ срок рассмотрения оплата после подписания акта приемка услуг автоприемка"
      retrieval_profile: "acceptance_check"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - technical_fragment
        - structural_anchor
      preferred_clause_functions:
        - obligations
      negative_keywords:
        - "форс-мажор"
        - "неустойка"
        - "конфиденциальность"
      position_bias:
        preferred_range: [0.25, 0.65]
        boost: 0.18
        scope: segment
      context_k: 5
      max_chunks: 8
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
      preferred_clause_functions:
        - obligations
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 650

    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false

      llm_max_tokens: 950

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора порядок приемки услуг,
        документы приемки, срок рассмотрения и привязку оплаты к приемке.
        Не анализируй цену, санкции, форс-мажор или споры.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля. Верни все ключи, даже если данные отсутствуют.

        1. act_required — "defined" или "not_defined".
        2. act_detailed — "defined" или "not_defined".
        3. report_required — "defined" или "not_defined".
        4. report_detailed — "defined" или "not_defined".
        5. acceptance_documents_summary — user-friendly: "Акт + отчёт", "Только акт", "Только отчёт" или "Не определено". Если требуется детализация — добавь " (с детализацией)".
        6. payment_linked_to_acceptance — "defined" или "not_defined".
        7. payment_linked_to_acceptance_display — user-friendly: "Оплата после подписания акта", "Оплата не привязана к приемке" или "Не определено".
        8. review_period_status — "defined" или "not_defined".
        9. review_period_value — срок рассмотрения акта/отчёта (текст или "Не установлено").
        10. auto_acceptance_clause — "defined" или "not_defined".
        11. auto_acceptance_clause_display — user-friendly: "Автоприемка через N дней", "Автоприемка не предусмотрена" или "Не определено".
        12. motivated_refusal_procedure — "defined" или "not_defined".

        Правила заполнения при отсутствии данных:
        - Для всех статусных полей возвращай строго "not_defined".
        - Для review_period_value возвращай "Не установлено".
        - Для *_display полей возвращай соответствующий user-friendly текст или "Не определено".
        </task>

        <rules>
        - Используй только текст договора.
        - acceptance_documents_summary:
            - Если act_required и report_required оба "defined" — "Акт + отчёт".
            - Если только act_required — "Только акт".
            - Если только report_required — "Только отчёт".
            - Если оба "not_defined" — "Не определено".
            - Если act_detailed или report_detailed = "defined" — добавь " (с детализацией)".
        - payment_linked_to_acceptance_display:
            - Если payment_linked_to_acceptance = "defined" — "Оплата после подписания акта" (или "отчёта", если указано).
            - Если "not_defined" — проверь текст: если оплата производится независимо от приемки — "Оплата не привязана к приемке". Иначе — "Не определено".
        - auto_acceptance_clause_display:
            - Если auto_acceptance_clause = "defined" — укажи срок из текста (например, "Автоприемка через 5 рабочих дней").
            - Если "not_defined" — "Автоприемка не предусмотрена".
        - Не путай акт приемки услуг с актом сверки или иным документом.
        - Верни только валидный JSON-объект без markdown-обёртки или с ней, но парсящийся.
        </rules>
      fields:
        - name: "act_required"
          type: "string"
          presentation: "signal"
          allowed_values:
            - "defined"
            - "not_defined"
          description: "Требуется ли акт оказанных услуг."
          required: true
          display_in_grid: false

        - name: "act_detailed"
          type: "string"
          presentation: "signal"
          allowed_values:
            - "defined"
            - "not_defined"
          description: "Требуется ли детализированный акт."
          required: true
          display_in_grid: false

        - name: "report_required"
          type: "string"
          presentation: "signal"
          allowed_values:
            - "defined"
            - "not_defined"
          description: "Требуется ли отчет исполнителя."
          required: true
          display_in_grid: false

        - name: "report_detailed"
          type: "string"
          presentation: "signal"
          allowed_values:
            - "defined"
            - "not_defined"
          description: "Требуется ли детализированный отчет."
          required: true
          display_in_grid: false

        - name: "acceptance_documents_summary"
          type: "string"
          presentation: "fact"
          label: "Документы приемки"
          description: "User-friendly описание требуемых документов приемки."
          required: true
          display_in_grid: true
          display_priority: 1

        - name: "payment_linked_to_acceptance"
          type: "string"
          presentation: "signal"
          allowed_values:
            - "defined"
            - "not_defined"
          description: "Привязана ли оплата к приемке."
          required: true
          display_in_grid: false

        - name: "payment_linked_to_acceptance_display"
          type: "string"
          presentation: "fact"
          label: "Привязка оплаты к приемке"
          description: "User-friendly описание привязки оплаты к приемке."
          required: true
          display_in_grid: true
          display_priority: 3

        - name: "review_period_status"
          type: "string"
          presentation: "signal"
          allowed_values:
            - "defined"
            - "not_defined"
          description: "Статус указания срока рассмотрения документов приемки."
          required: true
          display_in_grid: false

        - name: "review_period_value"
          type: "string"
          presentation: "fact"
          label: "Срок рассмотрения"
          description: "Срок рассмотрения акта / отчета."
          required: false
          display_in_grid: true
          display_priority: 2

        - name: "auto_acceptance_clause"
          type: "string"
          presentation: "signal"
          allowed_values:
            - "defined"
            - "not_defined"
          description: "Есть ли автоприемка."
          required: true
          display_in_grid: false

        - name: "auto_acceptance_clause_display"
          type: "string"
          presentation: "fact"
          label: "Автоприемка"
          description: "User-friendly описание условия автоприемки."
          required: true
          display_in_grid: true
          display_priority: 4

        - name: "motivated_refusal_procedure"
          type: "string"
          presentation: "signal"
          allowed_values:
            - "defined"
            - "not_defined"
          description: "Есть ли процедура мотивированного отказа."
          required: true
          display_in_grid: false
      store_payload: true

  - id: liability_and_penalties_check
    name: "Ответственность, лимиты и неустойки"
    description: >
      Фактографическая проверка наличия в договоре неустоек для сторон,
      формулы санкций, ограничения ответственности и исключения косвенных
      убытков. Результат предназначен для табличного сравнения нескольких договоров.
    triggers: ~
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "неустойка"
        - "пеня"
        - "штраф"
        - "за каждый день просрочки"
        - "ответственность ограничена"
        - "совокупная ответственность"
        - "упущенная выгода"
        - "косвенные убытки"
        - "страхование ответственности"
        - "страховой полис"
        - "профессиональная ответственность"
        - "страховое покрытие"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)неустойк(а|и|у).*\\d"
        - "(?i)пен(я|и|ю).*\\d.*%"
        - "(?i)совокупн.*ответственност.*не.*превыша"
        - "(?i)не\\s+возмеща(ются|ется).*косвенн"
        - "(?i)страхов(ание|ой).*ответственност"
        - "(?i)страхов(ой|ого)\\s+полис"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор возмездного оказания услуг.
        Проверяется только один вопрос: санкции за нарушение, лимиты ответственности,
        исключение отдельных видов убытков и наличие страхования профессиональной ответственности.

        Нормативный ориентир:
        - ст. 330 ГК РФ — неустойка
        - ст. 393 ГК РФ — ответственность за нарушение обязательств
        - ст. 401 ГК РФ — основания ответственности
        - договорные механизмы ограничения и страхования ответственности

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора, а чего прямо нет.
        - Не оценивай серьёзность риска.
        - Юрист будет использовать результат в сравнительной таблице.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Предусмотрена ли санкция для исполнителя.
        2. Какая формула санкции для исполнителя.
        3. Предусмотрена ли санкция для заказчика.
        4. Какая формула санкции для заказчика.
        5. Есть ли лимит ответственности.
        6. Как описан лимит ответственности.
        7. Исключены ли косвенные убытки / упущенная выгода.
        8. Есть ли требование о страховании профессиональной ответственности.
        9. Как кратко описано такое страхование.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Если условие не указано прямо:
           - для статусных полей (*_present, *_defined, *_excluded) возвращай "not_defined";
           - для текстовых полей (*_formula, *_description, *_summary) возвращай "Не установлено".
        4. Строго запрещено использовать "None", "null", "not_defined" (в текстовых полях) или пустые строки "".
        5. Не путай санкцию с ценой договора.
        6. Не путай страхование профессиональной ответственности с общим имущественным страхованием, если профессиональная ответственность прямо не названа.
        7. В evidence включай только точный текст договора.
        8. Верни только один валидный JSON-объект, содержащий все указанные ключи.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — санкции и страхование есть:
        Фрагмент:
        "За просрочку оказания услуг Исполнитель уплачивает пеню в размере
        0,1% от стоимости просроченных услуг за каждый день просрочки.
        За просрочку оплаты Заказчик уплачивает пеню 0,05% за каждый день.
        Совокупная ответственность Исполнителя ограничивается суммой
        вознаграждения за последние 3 месяца. Косвенные убытки не возмещаются.
        Исполнитель обязан поддерживать страхование профессиональной ответственности
        на весь срок действия договора."

        Ответ:
        {
          "provider_penalty_present": "defined",
          "provider_penalty_formula": "0,1% от стоимости просроченных услуг за каждый день просрочки",
          "client_penalty_present": "defined",
          "client_penalty_formula": "0,05% за каждый день просрочки оплаты",
          "liability_cap_present": "defined",
          "liability_cap_description": "совокупная ответственность Исполнителя ограничивается суммой вознаграждения за последние 3 месяца",
          "indirect_damages_excluded": "defined",
          "professional_liability_insurance_defined": "defined",
          "professional_liability_insurance_summary": "Исполнитель обязан поддерживать страхование профессиональной ответственности на весь срок действия договора",
          "evidence": [
            {
              "clause_ref": "п. 7.1",
              "quote": "За просрочку оказания услуг Исполнитель уплачивает пеню в размере 0,1% от стоимости просроченных услуг за каждый день просрочки. За просрочку оплаты Заказчик уплачивает пеню 0,05% за каждый день. Совокупная ответственность Исполнителя ограничивается суммой вознаграждения за последние 3 месяца. Косвенные убытки не возмещаются. Исполнитель обязан поддерживать страхование профессиональной ответственности на весь срок действия договора."
            }
          ]
        }

        Пример 2 — только исключение косвенных убытков:
        Фрагмент:
        "Стороны не возмещают друг другу упущенную выгоду и косвенные убытки."

        Ответ:
        {
          "provider_penalty_present": "not_defined",
          "provider_penalty_formula": "Не установлено",
          "client_penalty_present": "not_defined",
          "client_penalty_formula": "Не установлено",
          "liability_cap_present": "not_defined",
          "liability_cap_description": "Не установлено",
          "indirect_damages_excluded": "defined",
          "professional_liability_insurance_defined": "not_defined",
          "professional_liability_insurance_summary": "Не установлено",
          "evidence": [
            {
              "clause_ref": "п. 8.3",
              "quote": "Стороны не возмещают друг другу упущенную выгоду и косвенные убытки."
            }
          ]
        }

        Пример 3 — данные отсутствуют:
        Фрагмент:
        "Стороны несут ответственность в соответствии с законодательством РФ."

        Ответ:
        {
          "provider_penalty_present": "not_defined",
          "provider_penalty_formula": "Не установлено",
          "client_penalty_present": "not_defined",
          "client_penalty_formula": "Не установлено",
          "liability_cap_present": "not_defined",
          "liability_cap_description": "Не установлено",
          "indirect_damages_excluded": "not_defined",
          "professional_liability_insurance_defined": "not_defined",
          "professional_liability_insurance_summary": "Не установлено",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Есть ли прямая формула неустойки для исполнителя.
        2. Есть ли прямая формула неустойки для заказчика.
        3. Есть ли прямое ограничение ответственности.
        4. Есть ли прямое исключение косвенных убытков.
        5. Есть ли прямое требование о страховании профессиональной ответственности.
        6. Если прямой цитаты нет — верни "not_defined" для статусов и "Не установлено" для текста. Не додумывай условия.

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        {
          "provider_penalty_present": "<defined / not_defined>",
          "provider_penalty_formula": "<текст или 'Не установлено'>",
          "client_penalty_present": "<defined / not_defined>",
          "client_penalty_formula": "<текст или 'Не установлено'>",
          "liability_cap_present": "<defined / not_defined>",
          "liability_cap_description": "<текст или 'Не установлено'>",
          "indirect_damages_excluded": "<defined / not_defined>",
          "professional_liability_insurance_defined": "<defined / not_defined>",
          "professional_liability_insurance_summary": "<текст или 'Не установлено'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
