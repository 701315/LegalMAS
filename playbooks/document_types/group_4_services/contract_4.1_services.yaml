          presentation: "fact"
          label: "Уведомление о форс-мажоре"
          description: "Срок или порядок уведомления о форс-мажоре."
          required: false
          display_in_grid: true
          display_priority: 2

        - name: "deadline_consequences_defined"
          type: "string"
          presentation: "signal"
          allowed_values:
            - "defined"
            - "not_defined"
          description: "Определены ли последствия для сроков исполнения."
          required: true

        - name: "evidence_requirement_defined"
          type: "string"
          presentation: "signal"
          allowed_values:
            - "defined"
            - "not_defined"
          description: "Требуется ли подтверждение форс-мажора."
          required: true
      store_payload: true

  # ──────────────────────────────────────────────────────────────────────────
  # CHECK 10: Споры и претензионный порядок
  # ──────────────────────────────────────────────────────────────────────────
  - id: dispute_resolution_check
    name: "Споры, претензионный порядок и подсудность"
    description: >
      Фактографическая проверка наличия в договоре претензионного порядка,
      срока ответа на претензию и правила о подсудности / арбитраже.
      Результат предназначен для табличного сравнения нескольких договоров.
    triggers: ~
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "споры"
        - "претензионный порядок"
        - "претензия"
        - "срок ответа на претензию"
        - "подсудность"
        - "арбитражный суд"
        - "третейский суд"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)спор(ы|ов).*разреша"
        - "(?i)претензионн(ый|ого)\\s+поряд"
        - "(?i)арбитражн(ый|ого)\\s+суд"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор возмездного оказания услуг.
        Проверяется только один вопрос: претензионный порядок и подсудность / арбитраж.

        Нормативный ориентир:
        - АПК РФ / ГПК РФ — общие правила подсудности
        - договорной претензионный порядок и порядок разрешения споров

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора,
          а чего прямо нет.
        - Не оценивай серьёзность риска.
        - Юрист будет использовать результат в сравнительной таблице.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Обязателен ли претензионный порядок.
        2. Какой срок ответа на претензию установлен.
        3. Какой суд или арбитраж определён для рассмотрения споров.
        4. Как описана подсудность.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Если условие не указано прямо — возвращай "not_defined".
        4. Если текстового значения нет — возвращай строго "Данные не определены".
        5. Не используй "None", "null", "not_found", "not_specified" или пустые строки.
        6. В evidence включай только текст договора.
        7. Не путай общую оговорку о переговорах с формальным претензионным порядком.
        8. Верни только один JSON-объект.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — порядок определён:
        Фрагмент:
        "Споры разрешаются путем обязательного претензионного порядка.
        Срок ответа на претензию составляет 10 рабочих дней. При недостижении
        соглашения спор подлежит рассмотрению в Арбитражном суде г. Москвы."

        Ответ:
        {
          "pretrial_claim_required": "defined",
          "pretrial_claim_period_status": "defined",
          "pretrial_claim_period_value": "10 рабочих дней",
          "forum_type": "state_court",
          "forum_details": "Арбитражный суд г. Москвы",
          "evidence": [
            {
              "clause_ref": "п. 11.1",
              "quote": "Споры разрешаются путем обязательного претензионного порядка. Срок ответа на претензию составляет 10 рабочих дней. При недостижении соглашения спор подлежит рассмотрению в Арбитражном суде г. Москвы."
            }
          ]
        }

        Пример 2 — данные отсутствуют:
        Фрагмент:
        "Стороны стремятся урегулировать разногласия путем переговоров."

        Ответ:
        {
          "pretrial_claim_required": "not_defined",
          "pretrial_claim_period_status": "not_defined",
          "pretrial_claim_period_value": "Данные не определены",
          "forum_type": "not_defined",
          "forum_details": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Есть ли обязательный претензионный порядок.
        2. Есть ли срок ответа на претензию.
        3. Есть ли прямое указание на суд или арбитраж.
        4. Если прямой цитаты нет — верни "not_defined". Не додумывай условия.

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        {
          "pretrial_claim_required": "<defined / not_defined>",
          "pretrial_claim_period_status": "<defined / not_defined>",
          "pretrial_claim_period_value": "<текст или 'Данные не определены'>",
          "forum_type": "<state_court / arbitration / not_defined>",
          "forum_details": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 4
      temperature: 0.0
      max_tokens: 550

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "споры претензионный порядок претензия срок ответа подсудность арбитражный суд третейский суд"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - technical_fragment
        - structural_anchor
      preferred_clause_functions:
        - obligations
      negative_keywords:
        - "форс-мажор"
        - "конфиденциальность"
        - "цена"
      position_bias:
        preferred_range: [0.70, 1.0]
        boost: 0.18
        scope: segment
      context_k: 4
      max_chunks: 6
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
      preferred_clause_functions:
        - "obligations"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 650

    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false

      llm_max_tokens: 600

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора претензионный порядок,
        срок ответа на претензию и правило о подсудности / арбитраже.
        Не анализируй цену, санкции, форс-мажор или персональные данные.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        1. pretrial_claim_required — "defined" / "not_defined".
        2. pretrial_claim_period_status — "defined" / "not_defined".
        3. pretrial_claim_period_value — срок ответа на претензию.
        4. forum_type — "state_court" / "arbitration" / "not_defined".
        5. forum_details — описание суда / арбитража.

        Если данные отсутствуют:
        - статус = "not_defined"
        - текст = "Данные не определены"
        </task>

        <rules>
        - Используй только текст договора.
        - forum_type:
            - "state_court" — государственный суд, в том числе арбитражный суд РФ.
            - "arbitration" — третейский / арбитражный институт вне гос. суда.
            - "not_defined" — правило прямо не определено.
        - Для signal-полей "defined" означает прямое указание условия в тексте.
        - "not_defined" означает, что условие прямо не указано.
        - Верни только JSON.
        </rules>
      fields:
        - name: "pretrial_claim_required"
          type: "string"
          presentation: "signal"
          allowed_values:
            - "defined"
            - "not_defined"
          description: "Предусмотрен ли обязательный претензионный порядок."
          required: true

        - name: "pretrial_claim_period_status"
          type: "string"
          presentation: "signal"
          allowed_values:
            - "defined"
            - "not_defined"
          description: "Статус указания срока ответа на претензию."
          required: true

        - name: "pretrial_claim_period_value"
          type: "string"
          presentation: "fact"
          label: "Срок ответа на претензию"
          description: "Срок ответа на претензию."
          required: false
          display_in_grid: true
          display_priority: 1

        - name: "forum_type"
          type: "string"
          presentation: "signal"
          allowed_values:
            - "state_court"
            - "arbitration"
            - "not_defined"
          description: "Тип форума для разрешения споров."
          required: true
          display_in_grid: true
          display_priority: 2

        - name: "forum_details"
          type: "string"
          presentation: "fact"
          label: "Подсудность / арбитраж"
          description: "Описание суда или арбитража."
          required: false
          display_in_grid: true
          display_priority: 3
      store_payload: true

  # ──────────────────────────────────────────────────────────────────────────
  # CHECK 11: Личное исполнение и привлечение третьих лиц
  # ──────────────────────────────────────────────────────────────────────────
  - id: personal_performance_subcontracting
    name: "Личное исполнение и право привлечения третьих лиц (ст. 780 ГК РФ)"
    description: >
      Фактографическая проверка наличия в договоре условия о личном исполнении,
      допустимости привлечения третьих лиц, необходимости согласия заказчика
      и сохранения ответственности исполнителя. Результат предназначен для
      табличного сравнения нескольких договоров.
    triggers: ~
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "лично"
        - "личное исполнение"
        - "привлечение третьих лиц"
        - "субисполнитель"
        - "соисполнитель"
        - "своими силами"
        - "вправе привлекать"
        - "с согласия заказчика"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)исполнитель.*оказывает.*услуги.*лично"
        - "(?i)вправе.*привлек(ать|ать).*третьих\\s+лиц"
        - "(?i)без\\s+права\\s+привлечени"
        - "(?i)с\\s+согласия\\s+заказчик"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор возмездного оказания услуг.
        Проверяется только один вопрос: должен ли исполнитель оказывать услуги лично,
        можно ли привлекать третьих лиц, нужно ли согласие заказчика и сохраняет ли
        исполнитель ответственность за действия привлечённых лиц.

        Нормативный ориентир:
        - ст. 780 ГК РФ — личное оказание услуг
        - общие положения об исполнении обязательств третьими лицами

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора,
          а чего прямо нет.
        - Не оценивай серьёзность риска.
        - Юрист будет использовать результат в сравнительной таблице.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Требуется ли личное исполнение.
        2. Допускается ли привлечение третьих лиц.
        3. Требуется ли согласие заказчика для такого привлечения.
        4. Сохраняет ли исполнитель ответственность за действия третьих лиц.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Если условие не указано прямо — возвращай "not_defined".
        4. Если текстового значения нет — возвращай строго "Данные не определены" только для текстовых полей.
        5. Не используй "None", "null", "not_found", "not_specified" или пустые строки.
        6. В evidence включай только текст договора.
        7. Не путай право привлекать сотрудников исполнителя с правом привлекать внешних третьих лиц.
        8. Верни только один JSON-объект.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — привлечение допускается с согласия:
        Фрагмент:
        "Исполнитель оказывает услуги лично, однако вправе привлекать третьих лиц
        только с предварительного письменного согласия Заказчика. Исполнитель
        несет полную ответственность за действия привлеченных лиц."

        Ответ:
        {
          "personal_performance_required": "yes",
          "subcontracting_allowed": "yes_with_consent",
          "provider_remains_liable": "yes",
          "subcontractor_disclosure_required": "defined",
          "evidence": [
            {
              "clause_ref": "п. 2.3",
              "quote": "Исполнитель оказывает услуги лично, однако вправе привлекать третьих лиц только с предварительного письменного согласия Заказчика. Исполнитель несет полную ответственность за действия привлеченных лиц."
            }
          ]
        }

        Пример 2 — данные отсутствуют:
        Фрагмент:
        "Исполнитель оказывает услуги Заказчику."

        Ответ:
        {
          "personal_performance_required": "not_defined",
          "subcontracting_allowed": "not_defined",
          "provider_remains_liable": "not_defined",
          "subcontractor_disclosure_required": "not_defined",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Есть ли прямое указание на личное исполнение.
        2. Есть ли прямое указание на право привлекать третьих лиц.
        3. Есть ли прямое указание на необходимость согласия заказчика.
        4. Есть ли прямое указание на сохранение ответственности исполнителя.
        5. Если прямой цитаты нет — верни "not_defined". Не додумывай условия.

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        {
          "personal_performance_required": "<yes / no / not_defined>",
          "subcontracting_allowed": "<yes_without_consent / yes_with_consent / prohibited / not_defined>",
          "provider_remains_liable": "<yes / no / not_defined>",
          "subcontractor_disclosure_required": "<defined / not_defined>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 4
      temperature: 0.0
      max_tokens: 620

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "личное исполнение привлечение третьих лиц субисполнитель соисполнитель своими силами с согласия заказчика ответственность за действия третьих лиц"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
      negative_keywords:
        - "персональные данные"
        - "неустойка"
        - "оплата"
        - "форс-мажор"
      position_bias:
        preferred_range: [0.15, 0.55]
        boost: 0.16
        scope: segment
      context_k: 4
      max_chunks: 6
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "obligations"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 650

    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false

      llm_max_tokens: 450

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора условия о личном
        исполнении, привлечении третьих лиц, согласии заказчика и ответственности
        исполнителя за действия таких лиц. Не анализируй цену, сроки, споры
        или санкции.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        1. personal_performance_required — "yes" / "no" / "not_defined".
        2. subcontracting_allowed — "yes_without_consent" / "yes_with_consent" /
           "prohibited" / "not_defined".
        3. provider_remains_liable — "yes" / "no" / "not_defined".
        4. subcontractor_disclosure_required — "defined" / "not_defined".
        </task>

        <rules>
        - Используй только текст договора.
        - personal_performance_required:
            - "yes" — личное исполнение прямо требуется.
            - "no" — прямо указано, что личное исполнение не требуется.
            - "not_defined" — вопрос прямо не урегулирован.
        - subcontracting_allowed:
            - "yes_without_consent" — третьи лица допускаются без согласия заказчика.
            - "yes_with_consent" — требуется согласие заказчика.
            - "prohibited" — привлечение третьих лиц запрещено.
            - "not_defined" — вопрос прямо не урегулирован.
        - provider_remains_liable:
            - "yes" — исполнитель прямо сохраняет ответственность.
            - "no" — прямо указано иное.
            - "not_defined" — вопрос прямо не урегулирован.
        - subcontractor_disclosure_required:
            - "defined" — есть требование уведомления / раскрытия / согласования.
            - "not_defined" — такого требования прямо нет.
        - Верни только JSON.
        </rules>
      fields:
        - name: "personal_performance_required"
          type: "string"
          presentation: "signal"
          allowed_values:
            - "yes"
            - "no"
            - "not_defined"
          description: "Требуется ли личное исполнение."
          required: true
          display_in_grid: true
          display_priority: 1

        - name: "subcontracting_allowed"
          type: "string"
          presentation: "signal"
          allowed_values:
            - "yes_without_consent"
            - "yes_with_consent"
            - "prohibited"
            - "not_defined"
          description: "Допустимость привлечения третьих лиц."
          required: true
          display_in_grid: true
          display_priority: 2

        - name: "provider_remains_liable"
          type: "string"
          presentation: "signal"
          allowed_values:
            - "yes"
            - "no"
            - "not_defined"
          description: "Сохраняет ли исполнитель ответственность за действия третьих лиц."
          required: true
          display_in_grid: true
          display_priority: 3

        - name: "subcontractor_disclosure_required"
          type: "string"
          presentation: "signal"
          allowed_values:
            - "defined"
            - "not_defined"
          description: "Требуется ли уведомление / согласование привлечения третьих лиц."
          required: true
      store_payload: true

  # ──────────────────────────────────────────────────────────────────────────
  # CHECK 12: Права на результаты услуг и объекты ИС
  # ──────────────────────────────────────────────────────────────────────────
  - id: ip_rights_on_service_results
    name: "ИП на результаты услуг (ст. 1296, 1297 ГК РФ)"
    description: >
      Фактографическая проверка наличия в договоре условий о правах на
      результаты интеллектуальной деятельности, типе передачи прав, моменте
      перехода прав и описании объектов ИС. Результат предназначен для
      табличного сравнения нескольких договоров.
    triggers:
      any: ["ip_creation_services"]
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "исключительные права"
