      store_payload: true

  # ──────────────────────────────────────────────────────────────────────────
  # CHECK 8: Расторжение и односторонний отказ
  # ──────────────────────────────────────────────────────────────────────────
  - id: termination_and_refusal
    name: "Расторжение и односторонний отказ (ст. 782 ГК РФ)"
    description: >
      Фактографическая проверка наличия в договоре условий одностороннего
      отказа, его стоимости, расчетов при прекращении и возврата данных /
      материалов после расторжения. Результат предназначен для табличного
      сравнения нескольких договоров.
    triggers: ~
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "расторжение"
        - "односторонний отказ"
        - "отказ от исполнения"
        - "фактически понесённые расходы"
        - "возмещение убытков"
        - "штраф за расторжение"
        - "возврат данных"
        - "удаление данных"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)расторж(ение|ении)"
        - "(?i)односторонн(ий|его)\\s+отказ"
        - "(?i)фактически\\s+понес(е|ё)нн(ые|ых)\\s+расход"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор возмездного оказания услуг.
        Проверяется только один вопрос: расторжение и односторонний отказ,
        расчеты при прекращении и возврат данных / материалов после прекращения.

        Нормативный ориентир:
        - ст. 782 ГК РФ — односторонний отказ от договора услуг
        - общие положения о прекращении обязательств

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора,
          а чего прямо нет.
        - Не оценивай серьёзность риска.
        - Юрист будет использовать результат в сравнительной таблице.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Как урегулировано право заказчика на отказ.
        2. Какова стоимость отказа для заказчика.
        3. Как урегулировано право исполнителя на отказ.
        4. Какова стоимость отказа для исполнителя.
        5. Есть ли exit fee / штраф за расторжение.
        6. Определён ли порядок взаиморасчетов при прекращении.
        7. Определён ли возврат / удаление данных и материалов.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Если условие не указано прямо — возвращай "not_defined".
        4. Если текстового значения нет — возвращай строго "Данные не определены".
        5. Не используй "None", "null", "not_found", "not_specified" или пустые строки.
        6. В evidence включай только текст договора.
        7. Не путай обычное прекращение срока договора с правом на односторонний отказ.
        8. Верни только один JSON-объект.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — условия определены:
        Фрагмент:
        "Заказчик вправе отказаться от договора при оплате фактически понесенных
        расходов Исполнителя. Исполнитель вправе отказаться от договора при
        полном возмещении убытков Заказчика. При прекращении договора стороны
        производят взаиморасчеты за фактически оказанные услуги. Исполнитель
        обязан вернуть материалы Заказчика и удалить его данные в течение 5 дней."

        Ответ:
        {
          "client_refusal_right": "statutory",
          "client_refusal_cost": "actual_expenses",
          "provider_refusal_right": "statutory",
          "provider_refusal_cost": "full_damages",
          "exit_fee_present": "not_defined",
          "termination_settlement_defined": "defined",
          "data_return_or_deletion_defined": "defined",
          "evidence": [
            {
              "clause_ref": "п. 9.1",
              "quote": "Заказчик вправе отказаться от договора при оплате фактически понесенных расходов Исполнителя. Исполнитель вправе отказаться от договора при полном возмещении убытков Заказчика. При прекращении договора стороны производят взаиморасчеты за фактически оказанные услуги. Исполнитель обязан вернуть материалы Заказчика и удалить его данные в течение 5 дней."
            }
          ]
        }

        Пример 2 — данные отсутствуют:
        Фрагмент:
        "Договор действует до полного исполнения обязательств."

        Ответ:
        {
          "client_refusal_right": "not_defined",
          "client_refusal_cost": "not_defined",
          "provider_refusal_right": "not_defined",
          "provider_refusal_cost": "not_defined",
          "exit_fee_present": "not_defined",
          "termination_settlement_defined": "not_defined",
          "data_return_or_deletion_defined": "not_defined",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Есть ли прямое указание на отказ заказчика.
        2. Есть ли прямое указание на отказ исполнителя.
        3. Есть ли прямое указание на расчеты при прекращении.
        4. Есть ли прямое указание на возврат или удаление данных / материалов.
        5. Если прямой цитаты нет — верни "not_defined". Не додумывай условия.

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        {
          "client_refusal_right": "<statutory / modified / restricted / not_defined>",
          "client_refusal_cost": "<actual_expenses / penalty / full_price / not_specified / not_defined>",
          "provider_refusal_right": "<statutory / modified / restricted / not_defined>",
          "provider_refusal_cost": "<full_damages / limited / not_specified / not_defined>",
          "exit_fee_present": "<defined / not_defined>",
          "termination_settlement_defined": "<defined / not_defined>",
          "data_return_or_deletion_defined": "<defined / not_defined>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 5
      temperature: 0.0
      max_tokens: 700

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "расторжение односторонний отказ отказ от исполнения фактически понесенные расходы убытки взаиморасчеты возврат данных удаление данных"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - technical_fragment
        - structural_anchor
      preferred_clause_functions:
        - obligations
      negative_keywords:
        - "форс-мажор"
        - "конфиденциальность"
        - "неустойка"
      position_bias:
        preferred_range: [0.55, 1.0]
        boost: 0.20
        scope: segment
      context_k: 5
      max_chunks: 8
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
      preferred_clause_functions:
        - "obligations"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 650

    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false

      llm_max_tokens: 750

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора условия расторжения,
        одностороннего отказа, взаиморасчетов при прекращении и возврата данных.
        Не анализируй цену, санкции, форс-мажор или споры.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        1. client_refusal_right — "statutory" / "modified" / "restricted" /
           "not_defined".
        2. client_refusal_cost — "actual_expenses" / "penalty" / "full_price" /
           "not_specified" / "not_defined".
        3. provider_refusal_right — "statutory" / "modified" / "restricted" /
           "not_defined".
        4. provider_refusal_cost — "full_damages" / "limited" / "not_specified" /
           "not_defined".
        5. exit_fee_present — "defined" / "not_defined".
        6. termination_settlement_defined — "defined" / "not_defined".
        7. data_return_or_deletion_defined — "defined" / "not_defined".
        </task>

        <rules>
        - Используй только текст договора.
        - client_refusal_right / provider_refusal_right:
            - "statutory" — право повторяет закон.
            - "modified" — право изменено договором.
            - "restricted" — право существенно ограничено.
            - "not_defined" — условие прямо не определено.
        - client_refusal_cost:
            - "actual_expenses" — фактически понесенные расходы.
            - "penalty" — штраф / плата за выход.
            - "full_price" — полная цена.
            - "not_specified" — отказ упомянут, но стоимость не раскрыта.
            - "not_defined" — право / стоимость прямо не определены.
        - provider_refusal_cost:
            - "full_damages" — полное возмещение убытков.
            - "limited" — ограниченное возмещение.
            - "not_specified" — стоимость не раскрыта.
            - "not_defined" — право / стоимость прямо не определены.
        - exit_fee_present / termination_settlement_defined / data_return_or_deletion_defined:
            - "defined" — условие прямо указано.
            - "not_defined" — условие прямо не указано.
        - Верни только JSON.
        </rules>
      fields:
        - name: "client_refusal_right"
          type: "string"
          presentation: "signal"
          allowed_values:
            - "statutory"
            - "modified"
            - "restricted"
            - "not_defined"
          description: "Режим права заказчика на отказ."
          required: true

        - name: "client_refusal_cost"
          type: "string"
          presentation: "signal"
          allowed_values:
            - "actual_expenses"
            - "penalty"
            - "full_price"
            - "not_specified"
            - "not_defined"
          description: "Стоимость отказа для заказчика."
          required: true
          display_in_grid: true
          display_priority: 1

        - name: "provider_refusal_right"
          type: "string"
          presentation: "signal"
          allowed_values:
            - "statutory"
            - "modified"
            - "restricted"
            - "not_defined"
          description: "Режим права исполнителя на отказ."
          required: true

        - name: "provider_refusal_cost"
          type: "string"
          presentation: "signal"
          allowed_values:
            - "full_damages"
            - "limited"
            - "not_specified"
            - "not_defined"
          description: "Стоимость отказа для исполнителя."
          required: true

        - name: "exit_fee_present"
          type: "string"
          presentation: "signal"
          allowed_values:
            - "defined"
            - "not_defined"
          description: "Предусмотрен ли штраф / плата за расторжение."
          required: true
          display_in_grid: true
          display_priority: 2

        - name: "termination_settlement_defined"
          type: "string"
          presentation: "signal"
          allowed_values:
            - "defined"
            - "not_defined"
          description: "Определены ли взаиморасчеты при прекращении."
          required: true

        - name: "data_return_or_deletion_defined"
          type: "string"
          presentation: "signal"
          allowed_values:
            - "defined"
            - "not_defined"
          description: "Определен ли возврат / удаление данных и материалов."
          required: true
          display_in_grid: true
          display_priority: 3
      store_payload: true

  # ──────────────────────────────────────────────────────────────────────────
  # CHECK 9: Форс-мажор
  # ──────────────────────────────────────────────────────────────────────────
  - id: force_majeure
    name: "Форс-мажор и обстоятельства непреодолимой силы"
    description: >
      Фактографическая проверка наличия в договоре определения форс-мажора,
      порядка уведомления и последствий для сроков исполнения. Результат
      предназначен для табличного сравнения нескольких договоров.
    triggers: ~
    ui_mode: "field_extraction"
    severity: "medium"
    severity_if_pass: "pass"
    severity_if_fail: "medium"
    severity_if_unclear: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "форс-мажор"
        - "обстоятельства непреодолимой силы"
        - "уведомление о форс-мажоре"
        - "срок исполнения продлевается"
        - "освобождение от ответственности"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)форс[\\s\\-]?мажор"
        - "(?i)непреодолим(ой|ая)\\s+сил"
        - "(?i)уведомлени(е|я).*форс"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор возмездного оказания услуг.
        Проверяется только один вопрос: форс-мажор, уведомление и последствия
        для сроков исполнения.

        Нормативный ориентир:
        - ст. 401 ГК РФ — обстоятельства непреодолимой силы

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора,
          а чего прямо нет.
        - Не оценивай серьёзность риска.
        - Юрист будет использовать результат в сравнительной таблице.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Есть ли форс-мажорная оговорка.
        2. Как определён форс-мажор.
        3. Есть ли срок / порядок уведомления.
        4. Какой срок / порядок уведомления указан.
        5. Есть ли последствия для сроков исполнения.
        6. Требуется ли подтверждение форс-мажора.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Если условие не указано прямо — возвращай "not_defined".
        4. Если текстового значения нет — возвращай строго "Данные не определены".
        5. Не используй "None", "null", "not_found", "not_specified" или пустые строки.
        6. В evidence включай только текст договора.
        7. Не путай форс-мажор с обычной хозяйственной трудностью.
        8. Верни только один JSON-объект.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — оговорка есть:
        Фрагмент:
        "Стороны освобождаются от ответственности при наступлении обстоятельств
        непреодолимой силы. Сторона обязана уведомить другую сторону в течение
        3 рабочих дней. Срок исполнения обязательств продлевается на период
        действия таких обстоятельств. Факт форс-мажора подтверждается ТПП."

        Ответ:
        {
          "force_majeure_clause_status": "defined",
          "force_majeure_definition": "обстоятельства непреодолимой силы",
          "notification_period_status": "defined",
          "notification_period_value": "в течение 3 рабочих дней",
          "deadline_consequences_defined": "defined",
          "evidence_requirement_defined": "defined",
          "evidence": [
            {
              "clause_ref": "п. 8.1",
              "quote": "Стороны освобождаются от ответственности при наступлении обстоятельств непреодолимой силы. Сторона обязана уведомить другую сторону в течение 3 рабочих дней. Срок исполнения обязательств продлевается на период действия таких обстоятельств. Факт форс-мажора подтверждается ТПП."
            }
          ]
        }

        Пример 2 — данные отсутствуют:
        Фрагмент:
        "Ответственность сторон определяется законом."

        Ответ:
        {
          "force_majeure_clause_status": "not_defined",
          "force_majeure_definition": "Данные не определены",
          "notification_period_status": "not_defined",
          "notification_period_value": "Данные не определены",
          "deadline_consequences_defined": "not_defined",
          "evidence_requirement_defined": "not_defined",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Есть ли отдельная форс-мажорная оговорка.
        2. Есть ли прямое указание на уведомление.
        3. Есть ли прямое указание на последствия для сроков.
        4. Есть ли прямое указание на подтверждение форс-мажора.
        5. Если прямой цитаты нет — верни "not_defined". Не додумывай условия.

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        {
          "force_majeure_clause_status": "<defined / not_defined>",
          "force_majeure_definition": "<текст или 'Данные не определены'>",
          "notification_period_status": "<defined / not_defined>",
          "notification_period_value": "<текст или 'Данные не определены'>",
          "deadline_consequences_defined": "<defined / not_defined>",
          "evidence_requirement_defined": "<defined / not_defined>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 4
      temperature: 0.0
      max_tokens: 600

    retrieval:
      corpus_scope: "primary_segment"
      levels:
