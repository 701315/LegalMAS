        - "персональные данные"
        - "неустойка"
        - "оплата"
      position_bias:
        preferred_range: [0.35, 0.80]
        boost: 0.16
        scope: segment
      context_k: 5
      max_chunks: 7
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
