        <rules>
        - Используй только текст договора.
        - Для signal-полей "defined" означает прямое указание условия в тексте.
        - "not_defined" означает, что условие прямо не указано.
        - sla_review_period:
            - "monthly" — ежемесячно.
            - "quarterly" — ежеквартально.
            - "annual" — ежегодно.
            - "other" — иной прямо указанный период.
            - "not_defined" — период прямо не определен.
        - Если текстового значения нет — верни "Данные не определены".
        - Верни только JSON.
        </rules>
      fields:
        - name: "sla_present"
          type: "string"
