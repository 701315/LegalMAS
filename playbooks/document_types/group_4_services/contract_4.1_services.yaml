# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 4: CHECKS_V8 — LLM/hybrid проверки
#  Читается: DocTypeCheckLoader._load_doc_type_checks()
# ════════════════════════════════════════════════════════════════════════════

checks_v8:

  - id: parties_identification
    name: "Стороны договора: идентификация заказчика и исполнителя"
    description: >
      Фактографическая проверка наличия в договоре идентификации заказчика и
      исполнителя, подписантов, оснований полномочий и корпоративного одобрения.
      Результат предназначен для табличного сравнения и формирования payload.
    triggers:
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "заказчик"
        - "исполнитель"
        - "в лице"
        - "действующего на основании"
        - "устав"
        - "доверенность"
        - "приказ"
        - "ИНН"
        - "ОГРН"
        - "ОГРНИП"
        - "одобрение сделки"
        - "протокол"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)(заказчик|исполнитель).*именуем"
        - "(?i)действующ(его|ей)\\s+на\\s+основании"
        - "(?i)\\bИНН\\b\\s*\\d{10,12}"
        - "(?i)\\bОГРН\\b\\s*\\d{13}"
        - "(?i)\\bОГРНИП\\b\\s*\\d{15}"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор возмездного оказания услуг.
        Проверяется только один вопрос: идентификация заказчика и исполнителя,
        их тип, подписанты, основания полномочий и наличие корпоративного одобрения.

        Нормативный ориентир:
        - ст. 432 ГК РФ — существенные условия и заключённость
        - ст. 182–183 ГК РФ — представительство и полномочия
        - корпоративные правила об одобрении крупных сделок и сделок с заинтересованностью

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора, а чего прямо нет.
        - Не оценивай серьёзность риска.
        - Юрист будет использовать результат в сравнительной таблице.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Идентификационные данные заказчика.
        2. Тип заказчика.
        3. Подписанта заказчика.
        4. Основание полномочий подписанта заказчика.
        5. Идентификационные данные исполнителя.
        6. Тип исполнителя.
        7. Подписанта исполнителя.
        8. Основание полномочий подписанта исполнителя.
        9. Указано ли корпоративное одобрение сделки.
        10. Какие детали такого одобрения указаны.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Если условие не указано прямо — для статусов возвращай "not_defined", для текстовых полей возвращай "Не установлено".
        4. Строго запрещено использовать "None", "null", "not_defined" (в текстовых полях) или пустые строки "".
        5. В evidence включай только точный текст договора.
        6. Не путай идентификацию сторон с банковскими реквизитами в конце договора.
        7. Верни только один валидный JSON-объект, содержащий все указанные ключи.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — стороны определены:
        Фрагмент:
        "ООО «Альфа» (ИНН 7701234567, ОГРН 1027700000001), именуемое Заказчик,
        в лице генерального директора Иванова Ивана Ивановича, действующего на
        основании Устава, и ИП Петров Пётр Петрович (ИНН 771234567890,
        ОГРНИП 312770000000001), именуемый Исполнитель, с другой стороны..."

        Ответ:
        {
          "client_details_status": "defined",
          "client_details_value": "ООО «Альфа» (ИНН 7701234567, ОГРН 1027700000001)",
          "client_type": "legal_entity",
          "client_signatory": "Иванов Иван Иванович, генеральный директор",
          "client_signatory_basis": "charter",
          "provider_details_status": "defined",
          "provider_details_value": "ИП Петров Пётр Петрович (ИНН 771234567890, ОГРНИП 312770000000001)",
          "provider_type": "ip",
          "provider_signatory": "Петров Пётр Петрович",
          "provider_signatory_basis": "personal",
          "corporate_approval_status": "not_defined",
          "corporate_approval_details": "Не установлено",
          "evidence": [
            {
              "clause_ref": "преамбула",
              "quote": "ООО «Альфа» (ИНН 7701234567, ОГРН 1027700000001), именуемое Заказчик, в лице генерального директора Иванова Ивана Ивановича, действующего на основании Устава, и ИП Петров Пётр Петрович (ИНН 771234567890, ОГРНИП 312770000000001), именуемый Исполнитель."
            }
          ]
        }

        Пример 2 — данные отсутствуют:
        Фрагмент:
        "Стороны заключили настоящий договор."

        Ответ:
        {
          "client_details_status": "not_defined",
          "client_details_value": "Не установлено",
          "client_type": "not_defined",
          "client_signatory": "Не установлено",
          "client_signatory_basis": "not_defined",
          "provider_details_status": "not_defined",
          "provider_details_value": "Не установлено",
          "provider_type": "not_defined",
          "provider_signatory": "Не установлено",
          "provider_signatory_basis": "not_defined",
          "corporate_approval_status": "not_defined",
          "corporate_approval_details": "Не установлено",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Есть ли в преамбуле идентификационные данные заказчика.
        2. Есть ли в преамбуле идентификационные данные исполнителя.
        3. Есть ли указание на подписанта и основание его полномочий по каждой стороне.
        4. Есть ли упоминание решения, протокола или иного корпоративного одобрения.
        5. Если прямой цитаты нет — верни "not_defined" для статусов и "Не установлено" для текста. Не додумывай условия.

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        {
          "client_details_status": "<defined / not_defined>",
          "client_details_value": "<текст или 'Не установлено'>",
          "client_type": "<legal_entity / state_entity / individual / ip / self_employed / not_defined>",
          "client_signatory": "<текст или 'Не установлено'>",
          "client_signatory_basis": "<charter / poa / order / personal / other / not_defined>",
          "provider_details_status": "<defined / not_defined>",
          "provider_details_value": "<текст или 'Не установлено'>",
          "provider_type": "<legal_entity / state_entity / individual / ip / self_employed / not_defined>",
          "provider_signatory": "<текст или 'Не установлено'>",
          "provider_signatory_basis": "<charter / poa / order / personal / other / not_defined>",
          "corporate_approval_status": "<defined / not_defined>",
          "corporate_approval_details": "<текст или 'Не установлено'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 5
      temperature: 0.0
      max_tokens: 700

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "преамбула стороны заказчик исполнитель реквизиты ИНН ОГРН представитель полномочия устав доверенность одобрение протокол"
      retrieval_profile: "party_identification_check"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - technical_fragment
        - structural_anchor
      preferred_clause_functions:
        - definitions
        - obligations
      negative_keywords:
        - "расчетный счет"
        - "корреспондентский счет"
        - "банк"
        - "неустойка"
        - "форс-мажор"
      position_bias:
        preferred_range: [0.0, 0.20]
        boost: 0.24
        scope: segment
      context_k: 5
      max_chunks: 7
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "price_list"
        - "technical_specification"
      preferred_clause_functions:
        - "definitions"
        - "obligations"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.12

    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 650

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1300

      compact_output: false

      presence_signal:
        field: "parties_identification_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора идентификацию заказчика
        и исполнителя, подписантов, основания полномочий и корпоративное одобрение.
        Не анализируй цену, сроки, приёмку, споры или санкции.
        Не оценивай риски. Анализируй только текст договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. parties_identification_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (client_details_status, provider_details_status,
              client_signatory_basis, provider_signatory_basis,
              corporate_approval_status) ≠ "not_defined";
           - "missing" — если все пять содержательных полей = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - client_details_status = "not_defined";
           - provider_details_status = "not_defined";
           - client_signatory_basis = "not_defined";
           - provider_signatory_basis = "not_defined";
           - corporate_approval_status = "not_defined";
           - client_type = "not_defined";
           - provider_type = "not_defined";
           - client_details_value, provider_details_value = "Не установлено";
           - client_signatory, provider_signatory = "Не установлено";
           - corporate_approval_details = "Не установлено";
           - не выполняй остальные шаги.

        1. client_details_status:
           - "defined" — если Заказчик прямо идентифицируется по тексту хотя бы
             по наименованию, ФИО или статусу ИП + ФИО;
           - "not_defined" — если Заказчик прямо не идентифицируется.

        2. client_details_value:
           Краткая идентификация Заказчика на русском языке:
           - для юрлица: наименование + ИНН + ОГРН, если прямо указаны;
           - для ИП: ИП + ФИО + ИНН + ОГРНИП, если прямо указаны;
           - для физлица: ФИО + паспортные данные, если прямо указаны.
           Если данных нет — "Не установлено".
           Если данные противоречивы — "Не удалось определить".

        3. client_type:
           Тип заказчика. Используй только одно из значений:
           - "legal_entity" — ООО, АО, ПАО, иное юрлицо;
           - "state_entity" — госорган, учреждение, унитарное предприятие;
           - "individual" — физическое лицо без статуса ИП;
           - "ip" — индивидуальный предприниматель;
           - "self_employed" — самозанятый, НПД;
           - "not_defined" — тип прямо не определён.

        4. client_signatory:
           ФИО и должность подписанта заказчика.
           Если данных нет — "Не установлено".
           Если данные противоречивы — "Не удалось определить".

        5. client_signatory_basis:
           Основание полномочий подписанта заказчика. Используй только:
           - "charter" — устав;
           - "poa" — доверенность;
           - "order" — приказ;
           - "personal" — лично (для ИП или физлица);
           - "other" — иное основание;
           - "not_defined" — основание прямо не указано.

        6. provider_details_status:
           - "defined" — если Исполнитель прямо идентифицируется;
           - "not_defined" — если Исполнитель прямо не идентифицируется.

        7. provider_details_value:
           Краткая идентификация Исполнителя по тем же правилам, что и для Заказчика.
           Если данных нет — "Не установлено".
           Если данные противоречивы — "Не удалось определить".

        8. provider_type:
           Тип исполнителя. Те же значения, что и client_type.

        9. provider_signatory:
           ФИО и должность подписанта исполнителя.
           Если данных нет — "Не установлено".
           Если данные противоречивы — "Не удалось определить".

        10. provider_signatory_basis:
            Основание полномочий подписанта исполнителя. Те же значения, что и client_signatory_basis.

        11. corporate_approval_status:
            - "defined" — если есть прямое указание на решение, протокол, одобрение
              крупной сделки или сделки с заинтересованностью;
            - "not_defined" — если корпоративное одобрение прямо не упомянуто.

        12. corporate_approval_details:
            Детали корпоративного одобрения на русском языке.
            Если данных нет — "Не установлено".
            Если данные противоречивы — "Не удалось определить".
        </task>

        <context_rules>
        - Перед остальными полями заполни parties_identification_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined", все enum-поля = "not_defined", все текстовые поля = "Не установлено".
        - Используй только релевантные фрагменты контекста.
        - Не подставляй нормы закона, обычную практику или предположения вместо текста договора.
        - Не смешивай сведения о Заказчике и Исполнителе.
        - Не путай банковские реквизиты в разделе «Адреса и реквизиты» с идентификацией стороны в преамбуле.
        - Если в разных фрагментах указаны разные данные и конфликт нельзя разрешить по тексту: статус → "not_defined", текстовое поле → "Не удалось определить".
        - Если прямо указано только наименование юрлица, только ФИО физлица или только статус ИП + ФИО, этого достаточно для статуса "defined".
        - Если основание полномочий не указано прямо, не выводи его из должности или из закона.
        - Если ИП или физлицо подписывает договор лично и это прямо видно из текста, используй basis = "personal".
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни упоминания сторон, ни их реквизитов, ни подписантов.
           → presence = "missing";
             все *_status = "not_defined";
             все enum-поля = "not_defined";
             все текстовые поля = "Не установлено".

        2. Прямое исключение или явное отсутствие.
           В договоре прямо указано, что данные не раскрываются, либо
           содержится явная формулировка об отсутствии условия.
           → presence = "present";
             соответствующий *_status = "not_defined";
             *_value содержит дословную цитату об исключении.

        3. Противоречие между фрагментами.
           В разных фрагментах указаны разные ФИО/ИНН для одной стороны.
           → presence = "unclear";
             соответствующий *_status = "not_defined";
             *_value = "Не удалось определить".

        4. Только роли без идентификации.
           Упомянуты "Заказчик" и "Исполнитель", но без реквизитов и ФИО.
           → presence = "present";
             *_status = "not_defined";
             *_value = "Не установлено".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для parties_identification_presence используй только: "present", "missing", "unclear".
        - Для enum-полей *_status используй только: "defined", "not_defined".
        - Для client_type / provider_type используй только: "legal_entity", "state_entity", "individual", "ip", "self_employed", "not_defined".
        - Для *_signatory_basis используй только: "charter", "poa", "order", "personal", "other", "not_defined".
        - Fallback при отсутствии данных:
          * client_details_value, provider_details_value → "Не установлено";
          * client_signatory, provider_signatory → "Не установлено";
          * corporate_approval_details → "Не установлено".
        - Fallback при противоречии или неоднозначности:
          * все текстовые поля → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "parties_identification_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие идентификации сторон / полномочий в договоре. Внутреннее агрегатное signal-поле."
          required: true

        - name: "client_details_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values:
            - "defined"
            - "not_defined"
          description: "Статус идентификационных данных заказчика. Внутреннее enum-поле."
          required: true

        - name: "client_details_value"
          type: "string"
          presentation: "fact"
          label: "Заказчик"
          description: >
            Идентификационные данные заказчика. Fallback: "Не установлено" / "Не удалось определить".
          required: true
          display_in_grid: true
          display_priority: 1

        - name: "client_type"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values:
            - "legal_entity"
            - "state_entity"
            - "individual"
            - "ip"
            - "self_employed"
            - "not_defined"
          description: "Тип заказчика. Внутреннее enum-поле."
          required: true

        - name: "client_signatory"
          type: "string"
          presentation: "fact"
          label: "Подписант заказчика"
          description: >
            Подписант заказчика. Fallback: "Не установлено" / "Не удалось определить".
          required: false
          display_in_grid: false

        - name: "client_signatory_basis"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values:
            - "charter"
            - "poa"
            - "order"
            - "personal"
            - "other"
            - "not_defined"
          description: "Основание полномочий подписанта заказчика. Внутреннее enum-поле."
          required: true

        - name: "provider_details_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values:
            - "defined"
            - "not_defined"
          description: "Статус идентификационных данных исполнителя. Внутреннее enum-поле."
          required: true

        - name: "provider_details_value"
          type: "string"
          presentation: "fact"
          label: "Исполнитель"
          description: >
            Идентификационные данные исполнителя. Fallback: "Не установлено" / "Не удалось определить".
          required: true
          display_in_grid: true
          display_priority: 2

        - name: "provider_type"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values:
            - "legal_entity"
            - "state_entity"
            - "individual"
            - "ip"
            - "self_employed"
            - "not_defined"
          description: "Тип исполнителя. Внутреннее enum-поле."
          required: true

        - name: "provider_signatory"
          type: "string"
          presentation: "fact"
          label: "Подписант исполнителя"
          description: >
            Подписант исполнителя. Fallback: "Не установлено" / "Не удалось определить".
          required: false
          display_in_grid: false

        - name: "provider_signatory_basis"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values:
            - "charter"
            - "poa"
            - "order"
            - "personal"
            - "other"
            - "not_defined"
          description: "Основание полномочий подписанта исполнителя. Внутреннее enum-поле."
          required: true

        - name: "corporate_approval_status"
          type: "string"
          presentation: "signal"
          risk_weight: "low"
          allowed_values:
            - "defined"
            - "not_defined"
          description: "Статус корпоративного одобрения сделки. Внутреннее enum-поле."
          required: true

        - name: "corporate_approval_details"
          type: "string"
          presentation: "fact"
          label: "Корпоративное одобрение"
          description: >
            Детали корпоративного одобрения сделки. Fallback: "Не установлено" / "Не удалось определить".
          required: false
          display_in_grid: false
      store_payload: true

  - id: service_subject_extraction
    name: "Услуги: базовое извлечение предмета договора"
    description: >
      Фактографическая проверка наличия в договоре описания предмета услуг,
      уровня детализации, объёма, ссылки на ТЗ или спецификацию, а также
      указания на конкретные результаты услуг. Результат предназначен для
      табличного сравнения нескольких договоров.
    triggers:
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "услуги"
        - "предмет договора"
        - "оказание услуг"
        - "перечень услуг"
        - "объём услуг"
        - "виды услуг"
        - "техническое задание"
        - "спецификация"
        - "результат услуг"
        - "отчет"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)(возмездн(ое|ого)\\s+оказани(е|я)\\s+услуг)"
        - "(?i)(исполнитель.*обязуется.*оказа(ть|ывать).*услуг)"
        - "(?i)(предмет.*договор.*услуг)"
        - "(?i)техническ(ое|ого)\\s+задани"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор возмездного оказания услуг.
        Проверяется только один вопрос: предмет договора, объем услуг, детализация
        описания, ссылка на ТЗ / спецификацию и наличие конкретных результатов услуг.

        Нормативный ориентир:
        - ст. 779 ГК РФ — оказание услуг
        - ст. 432 ГК РФ — заключённость договора

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора, а чего прямо нет.
        - Не оценивай серьёзность риска.
        - Юрист будет использовать результат в сравнительной таблице.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Определён ли предмет услуг.
        2. Как описан предмет услуг.
        3. Насколько детализировано описание предмета.
        4. Есть ли ссылка на ТЗ или спецификацию.
        5. Определён ли объём услуг.
        6. Есть ли ссылка на стандарты качества.
        7. Перечислены ли конкретные результаты (deliverables).
        8. Какой тип спецификации используется.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Если условие не указано прямо:
           - для статусных полей (*_status, volume_defined, quality_standards_referenced, deliverables_listed) возвращай "not_defined";
           - для текстовых полей (service_subject_description, tz_reference) возвращай "Не установлено";
           - для enum-полей (service_description_specificity, specification_type) возвращай "not_defined".
        4. Если описание услуг содержится прямо в тексте договора без ссылки на приложение/ТЗ/спецификацию, то specification_type = "in_body", а tz_reference = "Не применимо".
        5. Строго запрещено использовать "None", "null", "not_defined" (в текстовых полях) или пустые строки "".
        6. В evidence включай только точный текст договора.
        7. Если есть только общая формула «оказывать услуги» без конкретики — это не detailed.
        8. Верни только один валидный JSON-объект, содержащий все указанные ключи.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — предмет определён через ТЗ:
        Фрагмент:
        "Исполнитель обязуется оказать Заказчику услуги по настройке рекламных
        кампаний, подготовке ежемесячной аналитики и ведению кабинетов.
        Перечень и объем услуг определены в Приложении № 1 (Техническое задание)."

        Ответ:
        {
          "service_subject_status": "defined",
          "service_subject_description": "услуги по настройке рекламных кампаний, подготовке ежемесячной аналитики и ведению кабинетов",
          "service_description_specificity": "detailed",
          "tz_reference": "Приложение № 1 (Техническое задание)",
          "volume_defined": "defined",
          "quality_standards_referenced": "not_defined",
          "deliverables_listed": "defined",
          "specification_type": "tz",
          "evidence": [
            {
              "clause_ref": "п. 1.1",
              "quote": "Исполнитель обязуется оказать Заказчику услуги по настройке рекламных кампаний, подготовке ежемесячной аналитики и ведению кабинетов. Перечень и объем услуг определены в Приложении № 1 (Техническое задание)."
            }
          ]
        }

        Пример 2 — предмет описан в тексте договора без ссылок:
        Фрагмент:
        "Исполнитель обязуется оказать Заказчику услуги по проведению аудита
        информационной безопасности в объёме, согласованном Сторонами в настоящем
        разделе. Результатом услуг является письменный отчёт с рекомендациями."

        Ответ:
        {
          "service_subject_status": "defined",
          "service_subject_description": "услуги по проведению аудита информационной безопасности",
          "service_description_specificity": "generic",
          "tz_reference": "Не применимо",
          "volume_defined": "not_defined",
          "quality_standards_referenced": "not_defined",
          "deliverables_listed": "defined",
          "specification_type": "in_body",
          "evidence": [
            {
              "clause_ref": "п. 2.1",
              "quote": "Исполнитель обязуется оказать Заказчику услуги по проведению аудита информационной безопасности в объёме, согласованном Сторонами в настоящем разделе. Результатом услуг является письменный отчёт с рекомендациями."
            }
          ]
        }

        Пример 3 — данные отсутствуют:
        Фрагмент:
        "Исполнитель оказывает Заказчику услуги."

        Ответ:
        {
          "service_subject_status": "not_defined",
          "service_subject_description": "Не установлено",
          "service_description_specificity": "not_defined",
          "tz_reference": "Не установлено",
          "volume_defined": "not_defined",
          "quality_standards_referenced": "not_defined",
          "deliverables_listed": "not_defined",
          "specification_type": "not_defined",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Есть ли конкретное описание услуг.
        2. Есть ли ссылка на приложение, ТЗ, спецификацию, график или реестр.
        3. Есть ли указание на объём услуг.
        4. Есть ли указание на конкретные результаты услуг (отчёты, документы, материалы).
        5. Если описание прямо в тексте без ссылок — specification_type = "in_body", tz_reference = "Не применимо".
        6. Если прямой цитаты нет — верни "not_defined" для статусов и "Не установлено" для текста. Не додумывай условия.

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        {
          "service_subject_status": "<defined / not_defined>",
          "service_subject_description": "<текст или 'Не установлено'>",
          "service_description_specificity": "<detailed / generic / vague / not_defined>",
          "tz_reference": "<текст / 'Не применимо' / 'Не установлено'>",
          "volume_defined": "<defined / not_defined>",
          "quality_standards_referenced": "<defined / not_defined>",
          "deliverables_listed": "<defined / not_defined>",
          "specification_type": "<tz / appendix / in_body / schedule / registry / not_defined>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 700

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "предмет договора оказание услуг перечень услуг объем услуг техническое задание спецификация приложение график реестр результат услуг"
      retrieval_profile: "scope_of_work_check"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - technical_fragment
        - structural_anchor
      preferred_clause_functions:
        - definitions
        - obligations
      negative_keywords:
        - "оплата"
        - "неустойка"
        - "форс-мажор"
        - "расторжение"
        - "персональные данные"
      position_bias:
        preferred_range: [0.0, 0.30]
        boost: 0.20
        scope: segment
      context_k: 6
      max_chunks: 8
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "price_list"
        - "technical_fragment"
      preferred_clause_functions:
        - "definitions"
        - "obligations"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.12

    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 650

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 850

      compact_output: false

      presence_signal:
        field: "service_subject_extraction_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора предмет услуг,
        уровень детализации описания, ссылку на ТЗ / спецификацию,
        объем услуг и наличие конкретных результатов услуг.
        Не анализируй цену, сроки, приёмку, санкции или споры.
        Не оценивай риски. Анализируй только текст договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. service_subject_extraction_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (service_subject_status, volume_defined,
              quality_standards_referenced, deliverables_listed) ≠ "not_defined";
           - "missing" — если все четыре содержательных поля = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - service_subject_status = "not_defined";
           - volume_defined = "not_defined";
           - quality_standards_referenced = "not_defined";
           - deliverables_listed = "not_defined";
           - service_description_specificity = "not_defined";
           - specification_type = "not_defined";
           - service_subject_description = "Не установлено";
           - tz_reference = "Не установлено";
           - не выполняй остальные шаги.

        1. service_subject_status:
           - "defined" — если в тексте прямо указан предмет услуг, его описание,
             или прямо указано, что предмет определяется по ТЗ, спецификации,
             приложению или иному названному документу;
           - "not_defined" — если предмет прямо не определён.

        2. service_subject_description:
           Краткое user-facing описание предмета услуг на русском языке.
           Не копируй весь абзац — пиши кратко, 1–2 фразы.
           Если данных нет — "Не установлено".
           Если данные противоречивы — "Не удалось определить".

        3. service_description_specificity:
           Уровень детализации описания. Используй только:
           - "detailed" — конкретный перечень услуг с детализацией;
           - "generic" — общее описание без достаточной детализации;
           - "vague" — абстрактная формула без расшифровки ("оказывать услуги");
           - "not_defined" — предмет прямо не определён.

        4. tz_reference:
           Ссылка на ТЗ, спецификацию, приложение, график или реестр.
           - Если specification_type = "in_body" — возвращай "Не применимо".
           - Если есть ссылка — укажи её кратко, например: "Приложение № 1 (Техническое задание)".
           - Если данных нет — "Не установлено".

        5. volume_defined:
           - "defined" — указан конкретный объём (часы, единицы, лимит);
           - "not_defined" — объём прямо не указан.

        6. quality_standards_referenced:
           - "defined" — есть ссылка на стандарты (ГОСТ, ISO, SLA, KPI);
           - "not_defined" — стандарты прямо не указаны.

        7. deliverables_listed:
           - "defined" — перечислены конкретные результаты (отчёты, документы);
           - "not_defined" — результаты прямо не перечислены.

        8. specification_type:
           Тип спецификации. Используй только:
           - "tz" — техническое задание;
           - "appendix" — приложение, спецификация, перечень;
           - "in_body" — описание прямо в тексте без ссылок;
           - "schedule" — график, календарный план;
           - "registry" — реестр услуг;
           - "not_defined" — тип не определён.
        </task>

        <context_rules>
        - Перед остальными полями заполни service_subject_extraction_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status / enum-поля = "not_defined", все текстовые поля = "Не установлено".
        - Используй только релевантные фрагменты контекста.
        - Не подставляй нормы закона, обычную практику или предположения вместо текста договора.
        - Не извлекай цену, сроки, приёмку, санкции, споры и иные нерелевантные темы.
        - Если описание услуг прямо в тексте договора без ссылки на приложение/ТЗ, то specification_type = "in_body", а tz_reference = "Не применимо".
        - Если есть только общая формула «оказывать услуги» без конкретики — specificity = "vague", не "detailed".
        - Если в разных фрагментах указаны разные данные и конфликт нельзя разрешить по тексту: статус → "not_defined", текстовое поле → "Не удалось определить".
        - Не используй пустые строки.
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни описания услуг, ни объёма, ни ссылок на ТЗ.
           → presence = "missing";
             все *_status / enum = "not_defined";
             все текстовые поля = "Не установлено".

        2. Общая формула без конкретики.
           "Исполнитель оказывает Заказчику услуги" без детализации.
           → presence = "present";
             service_subject_status = "defined";
             service_description_specificity = "vague";
             volume_defined = "not_defined";
             service_subject_description = "Не установлено".

        3. Противоречие между фрагментами.
           В разных частях договора указаны разные объёмы или перечни услуг.
           → presence = "unclear";
             service_subject_status = "not_defined";
             service_subject_description = "Не удалось определить".

        4. Отсылка на внешний документ.
           Предмет и объём определяются по ТЗ, приложению, спецификации.
           → presence = "present";
             service_subject_status = "defined";
             specification_type = "tz" / "appendix";
             tz_reference содержит формулировку вида "Приложение № 1 (Техническое задание)".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для service_subject_extraction_presence используй только: "present", "missing", "unclear".
        - Для status-полей используй только: "defined", "not_defined".
        - Для service_description_specificity используй только: "detailed", "generic", "vague", "not_defined".
        - Для specification_type используй только: "tz", "appendix", "in_body", "schedule", "registry", "not_defined".
        - Fallback при отсутствии данных:
          * service_subject_description → "Не установлено";
          * tz_reference → "Не установлено" (или "Не применимо" при specification_type = "in_body").
        - Fallback при противоречии или неоднозначности:
          * все текстовые поля → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "service_subject_extraction_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования по предмету/объёму/детализации услуг. Внутреннее агрегатное signal-поле."
          required: true

        - name: "service_subject_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values:
            - "defined"
            - "not_defined"
          description: "Статус определения предмета услуг. Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "service_subject_description"
          type: "string"
          presentation: "fact"
          label: "Предмет услуг"
          description: >
            Описание предмета услуг. Fallback: "Не установлено" / "Не удалось определить".
          required: true
          display_in_grid: true
          display_priority: 1

        - name: "service_description_specificity"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values:
            - "detailed"
            - "generic"
            - "vague"
            - "not_defined"
          description: "Уровень детализации предмета услуг. Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "service_description_specificity_display"
          type: "string"
          presentation: "fact"
          label: "Уровень детализации"
          description: >
            User-friendly отображение уровня детализации предмета услуг. Fallback: "Не установлено" / "Не удалось определить".
          required: true
          display_in_grid: true
          display_priority: 2

        - name: "tz_reference"
          type: "string"
          presentation: "fact"
          label: "ТЗ / спецификация"
          description: >
            Ссылка на ТЗ, приложение, спецификацию, график или реестр. Fallback: "Не установлено" / "Не удалось определить".
          required: false
          display_in_grid: true
          display_priority: 3

        - name: "volume_defined"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values:
            - "defined"
            - "not_defined"
          description: "Статус определения объема услуг. Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "quality_standards_referenced"
          type: "string"
          presentation: "signal"
          risk_weight: "low"
          allowed_values:
            - "defined"
            - "not_defined"
          description: "Есть ли ссылка на стандарты качества. Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "deliverables_listed"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values:
            - "defined"
            - "not_defined"
          description: "Перечислены ли конкретные результаты услуг. Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "specification_type"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values:
            - "tz"
            - "appendix"
            - "in_body"
            - "schedule"
            - "registry"
            - "not_defined"
          description: "Тип спецификации услуг. Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "specification_type_display"
          type: "string"
          presentation: "fact"
          label: "Тип спецификации"
          description: >
            User-friendly отображение типа спецификации услуг. Fallback: "Не установлено" / "Не удалось определить".
          required: true
          display_in_grid: true
          display_priority: 4
      store_payload: true

  - id: price_and_payment_terms
    name: "Стоимость услуг и порядок расчётов (ст. 781 ГК РФ)"
    description: >
      Фактографическая проверка наличия в договоре цены услуг, модели
      ценообразования, НДС, аванса и порядка оплаты. Результат предназначен
      для табличного сравнения нескольких договоров.
    triggers:
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "цена"
        - "стоимость"
        - "вознаграждение"
        - "оплата"
        - "аванс"
        - "НДС"
        - "абонентская плата"
        - "почасовая ставка"
        - "счет"
        - "акт"
        - "право удержания"
        - "передача результатов после оплаты"
        - "сохранение прав до оплаты"
        - "удерживать до полной оплаты"
        - "не передавать результат"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)стоимост(ь|и)\\s+услуг.*\\d"
        - "(?i)\\b\\d[\\d\\s]*(?:руб|рублей|₽|тыс|млн)"
        - "(?i)оплат(а|ы).*услуг"
        - "(?i)аванс"
        - "(?i)удержива(ть|ет).*результат.*до.*оплат"
        - "(?i)передач(а|и).*после.*полной\\s+оплат"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор возмездного оказания услуг.
        Проверяется только один вопрос: цена услуг, НДС, аванс, порядок оплаты
        и право исполнителя удерживать результаты услуг до полной оплаты.

        Нормативный ориентир:
        - ст. 781 ГК РФ — оплата услуг
        - общие положения об обязательствах и расчетах
        - договорные механизмы удержания результата до оплаты

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора, а чего прямо нет.
        - Не оценивай серьёзность риска.
        - Юрист будет использовать результат в сравнительной таблице.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Определена ли цена договора.
        2. Какой размер цены указан.
        3. Какая модель ценообразования используется.
        4. Как указано условие о НДС.
        5. Предусмотрен ли аванс.
        6. Какой порядок оплаты установлен.
        7. На каком основании производится оплата.
        8. Есть ли право удерживать результаты услуг до полной оплаты.
        9. Как описано такое удержание.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Если условие не указано прямо:
           - для статусных полей (*_status, advance_present, result_retention_until_payment_defined) возвращай "not_defined";
           - для текстовых полей (contract_price_value, result_retention_summary) возвращай "Не установлено" или "Не применимо" (если параметр не применим);
           - для enum-полей (pricing_model, price_includes_vat, payment_timing, payment_basis) возвращай "not_defined".
        4. Строго запрещено использовать "None", "null", "not_defined" (в текстовых полях) или пустые строки "".
        5. Если цена определяется по прайс-листу, спецификации, смете или иному документу — укажи это в contract_price_value (например, "Определяется по Прайс-листу (Приложение № 2)").
        6. price_includes_vat = "not_applicable" — если исполнитель на УСН/ЕСХН/патенте, или услуга прямо не облагается НДС, или указано "НДС не облагается".
        7. Если право удержания результата до оплаты прямо не предусмотрено в тексте — result_retention_summary = "Не применимо".
        8. Не путай цену договора с неустойкой или компенсацией расходов.
        9. Не путай обычный порядок передачи результата после оплаты с прямым правом удержания, если удержание или непередача до оплаты не сформулированы в тексте.
        10. В evidence включай только точный текст договора.
        11. Верни только один валидный JSON-объект, содержащий все указанные ключи.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — цена и удержание определены:
        Фрагмент:
        "Стоимость услуг составляет 300 000 рублей в месяц, НДС не облагается.
        Заказчик выплачивает аванс в размере 50% в течение 5 банковских дней
        после выставления счета, оставшаяся сумма оплачивается после подписания акта.
        Исполнитель вправе не передавать итоговые отчеты до полной оплаты услуг."

        Ответ:
        {
          "contract_price_status": "defined",
          "contract_price_value": "300 000 рублей в месяц",
          "pricing_model": "subscription",
          "pricing_model_display": "Абонентская плата",
          "price_includes_vat": "not_applicable",
          "price_includes_vat_display": "НДС не применяется",
          "advance_present": "defined",
          "payment_timing": "mixed",
          "payment_basis": "mixed",
          "payment_terms_summary": "Аванс 50% по счёту в течение 5 банковских дней, остаток после подписания акта",
          "result_retention_until_payment_defined": "defined",
          "result_retention_summary": "Исполнитель вправе не передавать итоговые отчёты до полной оплаты услуг",
          "evidence": [
            {
              "clause_ref": "п. 3.1",
              "quote": "Стоимость услуг составляет 300 000 рублей в месяц, НДС не облагается. Заказчик выплачивает аванс в размере 50% в течение 5 банковских дней после выставления счета, оставшаяся сумма оплачивается после подписания акта. Исполнитель вправе не передавать итоговые отчеты до полной оплаты услуг."
            }
          ]
        }

        Пример 2 — цена определяется по прайс-листу:
        Фрагмент:
        "Стоимость услуг определяется согласно Прайс-листу Исполнителя (Приложение № 2).
        Цены указаны без учёта НДС. Оплата производится в течение 10 банковских дней
        после подписания акта оказанных услуг."

        Ответ:
        {
          "contract_price_status": "defined",
          "contract_price_value": "Определяется по Прайс-листу (Приложение № 2)",
          "pricing_model": "per_unit",
          "pricing_model_display": "За единицу услуги",
          "price_includes_vat": "no",
          "price_includes_vat_display": "Без НДС",
          "advance_present": "not_defined",
          "payment_timing": "postpayment",
          "payment_basis": "act",
          "payment_terms_summary": "Постоплата в течение 10 банковских дней по акту",
          "result_retention_until_payment_defined": "not_defined",
          "result_retention_summary": "Не применимо",
          "evidence": [
            {
              "clause_ref": "п. 4.1",
              "quote": "Стоимость услуг определяется согласно Прайс-листу Исполнителя (Приложение № 2). Цены указаны без учёта НДС. Оплата производится в течение 10 банковских дней после подписания акта оказанных услуг."
            }
          ]
        }

        Пример 3 — данные отсутствуют:
        Фрагмент:
        "Стоимость определяется по соглашению сторон."

        Ответ:
        {
          "contract_price_status": "not_defined",
          "contract_price_value": "Не установлено",
          "pricing_model": "not_defined",
          "pricing_model_display": "Не определено",
          "price_includes_vat": "not_defined",
          "price_includes_vat_display": "Не определено",
          "advance_present": "not_defined",
          "payment_timing": "not_defined",
          "payment_basis": "not_defined",
          "payment_terms_summary": "Не установлено",
          "result_retention_until_payment_defined": "not_defined",
          "result_retention_summary": "Не применимо",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Есть ли прямое указание на сумму или формулу цены.
        2. Если цена определяется по прайс-листу/смете/спецификации — это не "Не установлено", а "Определяется по ...".
        3. Есть ли прямое указание на НДС.
        4. Есть ли прямое указание на аванс.
        5. Есть ли прямое указание на сроки и основание оплаты.
        6. Есть ли прямое указание на непередачу или удержание результата до оплаты.
        7. Если прямой цитаты нет — верни "not_defined" для статусов и "Не установлено" для текста. Не додумывай условия.

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        {
          "contract_price_status": "<defined / not_defined>",
          "contract_price_value": "<текст / 'Определяется по ...' / 'Не установлено'>",
          "pricing_model": "<fixed / hourly / subscription / per_unit / mixed / not_defined>",
          "pricing_model_display": "<Фиксированная цена / Почасовая ставка / Абонентская плата / За единицу услуги / Смешанная модель / Не определено>",
          "price_includes_vat": "<yes / no / not_applicable / unclear / not_defined>",
          "price_includes_vat_display": "<Включает НДС / Без НДС / НДС не применяется / Неясно / Не определено>",
          "advance_present": "<defined / not_defined>",
          "payment_timing": "<prepayment / postpayment / staged / monthly / mixed / not_defined>",
          "payment_basis": "<invoice / act / report / mixed / not_defined>",
          "payment_terms_summary": "<краткое описание порядка оплаты или 'Не установлено'>",
          "result_retention_until_payment_defined": "<defined / not_defined>",
          "result_retention_summary": "<текст / 'Не применимо' / 'Не установлено'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 720

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "стоимость услуг цена вознаграждение оплата аванс НДС счёт акт отчёт абонентская плата почасовая ставка смета прайс-лист удержание результата до оплаты"
      retrieval_profile: "payment_terms_check"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - technical_fragment
        - structural_anchor
      preferred_clause_functions:
        - obligations
      negative_keywords:
        - "неустойка"
        - "штраф"
        - "убытки"
        - "расторжение"
      position_bias:
        preferred_range: [0.10, 0.45]
        boost: 0.18
        scope: segment
      context_k: 6
      max_chunks: 8
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
      preferred_clause_functions:
        - "obligations"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 650

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 950

      compact_output: false

      presence_signal:
        field: "price_and_payment_terms_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора цену услуг,
        модель ценообразования, НДС, аванс, порядок оплаты и право исполнителя
        удерживать результаты услуг до полной оплаты. Не анализируй санкции,
        форс-мажор, споры или персональные данные.
        Не оценивай риски. Анализируй только текст договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. price_and_payment_terms_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (contract_price_status, pricing_model, price_includes_vat,
              advance_present, payment_timing,
              result_retention_until_payment_defined) ≠ "not_defined";
           - "missing" — если все шесть содержательных полей = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - contract_price_status = "not_defined";
           - pricing_model = "not_defined";
           - price_includes_vat = "not_defined";
           - advance_present = "not_defined";
           - payment_timing = "not_defined";
           - payment_basis = "not_defined";
           - result_retention_until_payment_defined = "not_defined";
           - contract_price_value = "Не установлено";
           - pricing_model_display = "Не определено";
           - price_includes_vat_display = "Не определено";
           - payment_terms_summary = "Не установлено";
           - result_retention_summary = "Не применимо";
           - не выполняй остальные шаги.

        1. contract_price_status:
           - "defined" — если цена прямо указана суммой, формулой или прямо сказано,
             что цена определяется по прайс-листу, смете, спецификации, приложению
             или иному названному документу;
           - "not_defined" — если цена прямо не определена.

        2. contract_price_value:
           Краткое user-facing описание цены на русском языке.
           - Если цена указана прямо — укажи сумму и валюту, например: "300 000 рублей в месяц".
           - Если цена определяется по документу — укажи: "Определяется по Прайс-листу (Приложение № 2)".
           - Если данных нет — "Не установлено".
           - Если данные противоречивы — "Не удалось определить".

        3. pricing_model:
           Модель ценообразования. Используй только:
           - "fixed" — фиксированная цена за весь объём услуг;
           - "hourly" — почасовая ставка;
           - "subscription" — абонентская / периодическая плата;
           - "per_unit" — оплата за единицу услуги;
           - "mixed" — сочетание нескольких моделей;
           - "not_defined" — модель прямо не определена.

        4. pricing_model_display:
           User-friendly маппинг:
           - fixed → "Фиксированная цена"
           - hourly → "Почасовая ставка"
           - subscription → "Абонентская плата"
           - per_unit → "За единицу услуги"
           - mixed → "Смешанная модель"
           - not_defined → "Не определено"

        5. price_includes_vat:
           Условие о НДС. Используй только:
           - "yes" — цена включает НДС ("в том числе НДС 20%");
           - "no" — цена без НДС ("НДС начисляется дополнительно");
           - "not_applicable" — НДС не применяется (УСН/ЕСХН/патент, "НДС не облагается");
           - "unclear" — НДС упомянут, но условие двусмысленно;
           - "not_defined" — прямого указания на НДС нет.

        6. price_includes_vat_display:
           User-friendly маппинг:
           - yes → "Включает НДС"
           - no → "Без НДС"
           - not_applicable → "НДС не применяется"
           - unclear → "Неясно"
           - not_defined → "Не определено"

        7. advance_present:
           - "defined" — если прямо указан аванс или предоплата;
           - "not_defined" — если аванс прямо не упомянут.

        8. payment_timing:
           Порядок оплаты по времени. Используй только:
           - "prepayment" — полная предоплата до начала оказания;
           - "postpayment" — оплата после оказания / приёмки;
           - "staged" — оплата по этапам;
           - "monthly" — периодическая ежемесячная оплата;
           - "mixed" — сочетание вариантов;
           - "not_defined" — порядок прямо не определён.

        9. payment_basis:
           Основание оплаты. Используй только:
           - "invoice" — по счёту;
           - "act" — по акту оказанных услуг;
           - "report" — по отчёту;
           - "mixed" — несколько оснований;
           - "not_defined" — основание прямо не указано.

        10. payment_terms_summary:
            Краткое user-friendly описание порядка оплаты.
            Сформируй на основе advance_present, payment_timing и payment_basis.
            Примеры: "Аванс 50% по счёту, остаток по акту в течение 5 дней",
            "Постоплата по акту в течение 30 дней".
            Если данных нет — "Не установлено".
            Если данные противоречивы — "Не удалось определить".

        11. result_retention_until_payment_defined:
            - "defined" — есть прямое право не передавать / удерживать результат до оплаты;
            - "not_defined" — удержание прямо не предусмотрено.

        12. result_retention_summary:
            Краткое описание права удержания.
            Если удержание определено — заполни текстом из договора.
            Если не предусмотрено — "Не применимо".
            Если данные противоречивы — "Не удалось определить".
        </task>

        <context_rules>
        - Перед остальными полями заполни price_and_payment_terms_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status / enum = "not_defined", все текстовые поля = соответствующий fallback.
        - Используй только релевантные фрагменты контекста.
        - Не подставляй нормы закона, обычную практику или предположения вместо текста договора.
        - Не извлекай сведения о предмете, качестве, приёмке, санкциях, спорах и иных нерелевантных темах.
        - Если цена определяется по прайс-листу, смете, спецификации или иному названному документу и это прямо видно из текста, считай цену определённой и отрази в contract_price_value.
        - Не путай цену договора с неустойкой или компенсацией расходов.
        - Не путай обычный порядок передачи результата после оплаты с прямым правом удержания.
        - price_includes_vat = "not_applicable" при УСН/ЕСХН/патенте или "НДС не облагается".
        - Если в разных фрагментах указаны разные данные и конфликт нельзя разрешить по тексту: статус → "not_defined", текстовое поле → "Не удалось определить".
        - Не используй пустые строки.
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни цены, ни порядка оплаты, ни НДС, ни удержания.
           → presence = "missing";
             все *_status / enum = "not_defined";
             все текстовые поля = соответствующий fallback.

        2. Цена определяется по внешнему документу.
           "Стоимость определяется согласно Прайс-листу (Приложение № 2)".
           → presence = "present";
             contract_price_status = "defined";
             contract_price_value = "Определяется по Прайс-листу (Приложение № 2)";
             pricing_model = "not_defined" (если модель не раскрыта).

        3. Противоречие в суммах или сроках.
           В разных частях договора указаны разные цены или сроки оплаты.
           → presence = "unclear";
             contract_price_status = "not_defined";
             contract_price_value = "Не удалось определить".

        4. Общая фраза без конкретики.
           "Стоимость определяется по соглашению сторон" без ссылки на документ.
           → presence = "present";
             contract_price_status = "not_defined";
             contract_price_value = "Не установлено".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для price_and_payment_terms_presence используй только: "present", "missing", "unclear".
        - Для status-полей используй только: "defined", "not_defined".
        - Для pricing_model используй только: "fixed", "hourly", "subscription", "per_unit", "mixed", "not_defined".
        - Для price_includes_vat используй только: "yes", "no", "not_applicable", "unclear", "not_defined".
        - Для payment_timing используй только: "prepayment", "postpayment", "staged", "monthly", "mixed", "not_defined".
        - Для payment_basis используй только: "invoice", "act", "report", "mixed", "not_defined".
        - Fallback при отсутствии данных:
          * contract_price_value → "Не установлено";
          * pricing_model_display → "Не определено";
          * price_includes_vat_display → "Не определено";
          * payment_terms_summary → "Не установлено";
          * result_retention_summary → "Не применимо".
        - Fallback при противоречии или неоднозначности:
          * все текстовые поля → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "price_and_payment_terms_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования по цене/оплате/НДС. Внутреннее агрегатное signal-поле."
          required: true

        - name: "contract_price_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values:
            - "defined"
            - "not_defined"
          description: "Статус определения цены услуг. Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "contract_price_value"
          type: "string"
          presentation: "fact"
          label: "Стоимость услуг"
          description: >
            Цена услуг по договору. Fallback: "Не установлено" / "Не удалось определить".
          required: true
          display_in_grid: true
          display_priority: 1

        - name: "pricing_model"
          type: "string"
