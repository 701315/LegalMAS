#  БЛОК 3: SHARED PATTERNS
#  Читается: DocTypeCheckLoader через _resolve_yaml_templates()
# ════════════════════════════════════════════════════════════════════════════

shared_patterns:

  money_amount: "(?i)\\b\\d[\\d\\s]*(?:руб|рублей|₽|тыс|млн|млрд)"
  date_pattern: "(?i)\\b\\d{1,2}[.]\\d{1,2}[.]\\d{4}\\b"
  percentage: "(?i)\\b\\d{1,3}[,.]?\\d{0,2}\\s*%"
  working_days: "(?i)\\b\\d+\\s*(рабочих|календарных)\\s+дн"
  hourly_rate_pattern: "(?i)\\b\\d[\\d\\s]*(?:руб|₽).*?(?:час|ч\\.|man[\\s-]?hour)"
  inn_pattern: "(?i)\\bИНН\\s*\\d{10,12}\\b"

# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 4: COMPLIANCE RULES
#  Читается: DocTypeCheckLoader._exclusion_logic_to_checks()
# ════════════════════════════════════════════════════════════════════════════

compliance_rules:

  - id: "labor_contract_requalification_risk"
    name: "Риск переквалификации в трудовой договор (ТК РФ)"
    description: |
      Если договор содержит признаки трудовых отношений (подчинение ПВТР,
      трудовая функция, рабочее место, режим работы), он может быть
      переквалифицирован судом в трудовой с начислением НДФЛ, страховых взносов
      и штрафов. Особенно актуально для физлиц-исполнителей и самозанятых.
    legal_base: "ст. 15, 19.1 ТК РФ, ст. 5.27 КоАП РФ"
    required_triggers: ["individual_party"]
    severity: "critical"
    result_if_triggered: "warning"
    detector_type: "rules"
    rules:
      keywords:
        - "трудовая функция"
        - "рабочее место"
        - "правила внутреннего трудового распорядка"
        - "подчинение"
        - "режим работы"
        - "должностная инструкция"
        - "табель учёта рабочего времени"
      keyword_mode: "any"
    retrieval:
      context_k: 5
      boost_keywords:
        - "трудовая функция"
        - "подчинение"
        - "режим работы"
        - "рабочее место"
      rerank: true

  - id: "personal_data_processing_without_agreement"
    name: "Обработка ПДн без поручения на обработку (ФЗ-152)"
    description: |
      Если исполнитель получает доступ к персональным данным заказчика
      или его клиентов, необходимо поручение на обработку ПДн (ст. 6 ФЗ-152).
      Отсутствие поручения — административное правонарушение (ст. 13.11 КоАП).
    legal_base: "ФЗ от 27.07.2006 № 152-ФЗ «О персональных данных», ст. 6"
    required_triggers: ["personal_data_processing"]
    severity: "critical"
    result_if_triggered: "fail"
    detector_type: "rules"
    rules:
      keywords:
        - "персональные данные"
        - "обработка персональных данных"
        - "поручение на обработку"
        - "оператор персональных данных"
      keyword_mode: "any"
    retrieval:
      context_k: 5
      boost_keywords:
        - "персональные данные"
        - "поручение на обработку"
        - "ФЗ-152"
      rerank: true

  - id: "licensed_activity_without_confirmation"
    name: "Лицензируемая деятельность без подтверждения лицензии"
    description: |
      Отдельные виды услуг (аудит, оценка, охранная деятельность, медицинские,
      образовательные услуги) требуют лицензии или аккредитации. Оказание услуг
      без лицензии влечёт ничтожность договора и административную/уголовную
      ответственность.
    legal_base: "ФЗ от 04.05.2011 № 99-ФЗ «О лицензировании отдельных видов деятельности»"
    required_triggers: ["licensed_activity"]
    severity: "critical"
    result_if_triggered: "fail"
    detector_type: "rules"
    rules:
      keywords:
        - "лицензия"
        - "лицензируемая деятельность"
        - "аккредитация"
        - "допуск"
        - "сертификат"
      keyword_mode: "any"
    retrieval:
      context_k: 5
      boost_keywords:
        - "лицензия"
        - "аккредитация"
        - "допуск"
      rerank: true

  - id: "consumer_punitive_clause_prohibition"
    name: "Ничтожность условий, ущемляющих права потребителя (ст. 16 ЗоЗПП)"
    description: |
      Условия, ограничивающие право потребителя на отказ от услуг, навязывающие
      штрафы за расторжение или ограничивающие выбор подсудности, являются
      ничтожными. Штраф в пользу потребителя — 50 % от присуждённой суммы.
    legal_base: "ст. 16, 28, 29, 32 Закона РФ от 07.02.1992 № 2300-1 «О ЗПП»"
    required_triggers: ["consumer_party"]
    severity: "critical"
    result_if_triggered: "fail"
    detector_type: "rules"
    rules:
      keywords:
        - "штраф за отказ потребителя"
        - "ограничение прав потребителя"
        - "потребитель обязан"
        - "невозвратный"
        - "без возврата"
        - "подсудность по месту нахождения исполнителя"
      keyword_mode: "any"
    retrieval:
      context_k: 5
      boost_keywords:
        - "потребитель"
        - "штраф за отказ"
        - "невозвратный"
        - "ЗоЗПП"
      rerank: true

  - id: "illegal_staff_leasing"
    name: "Незаконный заёмный труд / аутстаффинг без аккредитации (ФЗ-116)"
    description: |
      Предоставление персонала допускается только аккредитованными частными
      агентствами занятости (ФЗ от 05.05.2014 № 116-ФЗ). Фактическое предоставление
      работников без аккредитации — незаконный заёмный труд (ст. 56.1 ТК РФ).
    legal_base: "ст. 56.1 ТК РФ, ФЗ от 05.05.2014 № 116-ФЗ"
    required_triggers: ["outsourcing"]
    severity: "critical"
    result_if_triggered: "warning"
    detector_type: "rules"
    rules:
      keywords:
        - "предоставление персонала"
        - "аутстаффинг"
        - "заёмный труд"
        - "направление работников"
        - "работники исполнителя на территории заказчика"
        - "под руководством заказчика"
      keyword_mode: "any"
    retrieval:
      context_k: 5
      boost_keywords:
        - "предоставление персонала"
        - "аутстаффинг"
        - "заёмный труд"
        - "аккредитация"
      rerank: true

# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 5: CHECKS_V8 — LLM/hybrid проверки
#  Читается: DocTypeCheckLoader._load_doc_type_checks()
# ════════════════════════════════════════════════════════════════════════════

checks_v8:

  - id: service_subject_extraction
    name: "Услуги: базовое извлечение предмета договора"
    description: "Извлекает виды услуг, объём, стандарты качества, ссылку на ТЗ/спецификацию"
    triggers: {}
    severity: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "услуги"
        - "предмет договора"
        - "оказание услуг"
        - "перечень услуг"
        - "объём услуг"
        - "виды услуг"
        - "техническое задание"
        - "спецификация"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)(возмездн(ое|ого)\\s+оказани(е|я)\\s+услуг)"
        - "(?i)(исполнитель.*обязуется.*оказа(ть|ывать).*услуг)"
        - "(?i)(предмет.*договор.*услуг)"
    llm:
      prompt_template: |
        Ты — юридический ассистент, анализирующий договор возмездного оказания услуг.
        Найди в тексте сведения о предмете договора.

        Ответь строго в JSON:
        {
          "service_types": ["<перечень видов услуг>"],
          "service_description_specificity": "<detailed / generic / vague / not_found>",
          "tz_reference": "<ссылка на ТЗ/спецификацию (номер приложения) или not_found>",
          "volume_defined": "<yes / no / not_found>",
          "quality_standards_referenced": "<yes / no / not_found>",
          "deliverables_listed": "<yes / no / not_found>"
        }

        - "detailed" — конкретный перечень действий с объёмом
        - "generic" — общее описание без конкретики
        - "vague" — формулировка типа «оказать услуги» без расшифровки

        ВАЖНО: Возвращай only_found_in_text. Если значение явно не указано — пиши "not_found".
      prompt_file: null
      context_k: 6
      temperature: 0.0
      max_tokens: 512
    retrieval:
      context_k: 6
      max_chunks: 10
      boost_keywords:
        - "предмет договора"
        - "услуги"
        - "перечень услуг"
        - "техническое задание"
        - "объём"
        - "спецификация"
      rerank: true
      filters: {}
    evidence:
      required: true
      min_snippet_length: 50
      max_snippet_length: 800
    extraction:
      enabled: true
      mode: "hybrid"
      fields:
        - name: "service_types"
          type: "list"
          description: "Виды оказываемых услуг"
        - name: "service_description_specificity"
          type: "string"
          allowed_values: ["detailed", "generic", "vague", "not_found"]
          description: "Уровень детализации описания предмета"
        - name: "tz_reference"
          type: "string"
          keyword_hints: ["техническое задание", "ТЗ", "приложение", "спецификация"]
          description: "Ссылка на ТЗ/спецификацию"
        - name: "deliverables_listed"
          type: "string"
          allowed_values: ["yes", "no", "not_found"]
          description: "Указаны ли конкретные deliverables"
      store_payload: true

  - id: detailed_service_specification_check
    name: "Детальная спецификация услуг / ТЗ (ст. 779, 432 ГК РФ)"
    description: |
      Проверяет наличие детальной спецификации или ТЗ. Без конкретики невозможно
      доказать ненадлежащее исполнение. Исполнитель может ограничиться формальными
      действиями. Особенно критично для консультационных и IT-услуг.
    triggers: {}
    severity: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "техническое задание"
        - "спецификация услуг"
        - "перечень конкретных действий"
        - "объём услуг"
        - "стандарты качества"
        - "методология оказания"
        - "ключевые показатели"
        - "регламент оказания услуг"
        - "описание услуг"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)перечень.*услуг.*определен.*в.*приложении"
        - "(?i)услуги.*оказываются.*в.*соответствии.*с.*техническ"
        - "(?i)техническ(ое|ого)\\s+задани"
    llm:
      prompt_template: |
        Ты — юридический ассистент, анализирующий договор возмездного оказания услуг.
        Проверь наличие и полноту спецификации услуг (ст. 779, 432 ГК РФ).

        Ответь строго в JSON:
        {
          "specification_present": "<yes / referenced_but_missing / not_found>",
          "specification_type": "<tz / appendix / in_body / not_found>",
          "actions_listed": "<yes / no / not_found>",
          "methodology_described": "<yes / no / not_found>",
          "success_criteria_present": "<yes / no / not_found>",
          "risk_of_vagueness": "<high / medium / low / none>",
          "specification_snippet": "<цитата или not_found>"
        }

        ВАЖНО: Если значение явно не указано — пиши "not_found".
      prompt_file: null
      context_k: 6
      temperature: 0.0
      max_tokens: 512
    retrieval:
      context_k: 6
      max_chunks: 8
      boost_keywords:
        - "техническое задание"
        - "спецификация"
        - "перечень услуг"
        - "методология"
        - "стандарты качества"
      rerank: true
      filters: {}
    evidence:
      required: true
      min_snippet_length: 50
      max_snippet_length: 600
    extraction:
      enabled: true
      mode: "hybrid"
      fields:
        - name: "specification_present"
          type: "string"
          allowed_values: ["yes", "referenced_but_missing", "not_found"]
          description: "Наличие спецификации"
        - name: "risk_of_vagueness"
          type: "string"
          allowed_values: ["high", "medium", "low", "none"]
          description: "Риск размытости предмета"
      store_payload: true

  - id: payment_acceptance_link_check
    name: "Привязка оплаты к акту/отчёту (ст. 781 ГК РФ)"
    description: |
      Проверяет привязку оплаты к подписанию акта об оказании услуг и/или отчёту
      с детализацией. «Акт на сумму X без расшифровки» — риск снятия расходов
      налоговой как необоснованных (ст. 252 НК РФ).
    triggers: {}
    severity: "high"
