      max_snippet_length: 650

    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false

      llm_max_tokens: 800

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора стандарты качества,
        гарантийный срок, порядок претензий и срок устранения недостатков.
        Не анализируй цену, санкции, форс-мажор или споры.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля. Верни все ключи, даже если данные отсутствуют.

        1. quality_standards_status — "defined" или "not_defined".
        2. quality_standards_value — описание стандартов качества (текст или "Определяются по ..." или "Не установлено").
        3. warranty_period_status — "defined" или "not_defined".
        4. warranty_period_value — гарантийный срок (текст или "Не установлено").
        5. complaint_procedure_defined — "defined" или "not_defined".
        6. defect_remedy_period_status — "defined" или "not_defined".
        7. defect_remedy_period_value — срок устранения недостатков (текст или "Не установлено").

        Правила заполнения при отсутствии данных:
        - Для всех *_status и *_defined полей возвращай строго "not_defined".
        - Для текстовых полей (*_value) возвращай "Не установлено".
        </task>

        <rules>
        - Используй только текст договора.
        - quality_standards_value:
            - Если стандарты указаны прямо — укажи формулировку из договора.
            - Если стандарты определяются по Техническому заданию, спецификации, приложению — укажи "Определяются по [название документа]".
        - Не путай срок исправления дефектов со сроком ответа на претензию по оплате.
        - Верни только валидный JSON-объект без markdown-обёртки или с ней, но парсящийся.
        </rules>
      fields:
