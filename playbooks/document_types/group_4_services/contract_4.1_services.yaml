            - "upon_acceptance"
            - "not_specified"
            - "not_defined"
          description: "Момент перехода прав на результаты ИС."
          required: true
          display_in_grid: true
          display_priority: 2

        - name: "ip_objects_listed"
          type: "string"
          presentation: "signal"
          allowed_values:
            - "defined"
            - "not_defined"
          description: "Перечислены ли объекты ИС."
          required: true

        - name: "ip_objects_description"
          type: "string"
          presentation: "fact"
          label: "Объекты ИС"
          description: "Описание объектов интеллектуальной собственности из текста договора."
          required: false
          display_in_grid: true
          display_priority: 3
      store_payload: true

  # ──────────────────────────────────────────────────────────────────────────
