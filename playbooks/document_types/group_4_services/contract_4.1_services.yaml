      required_kind: "legal_unit"
      retrieval_query: "форс-мажор обстоятельства непреодолимой силы уведомление срок исполнения продлевается подтверждается ТПП"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - technical_fragment
        - structural_anchor
      preferred_clause_functions:
        - obligations
      negative_keywords:
        - "неустойка"
        - "оплата"
        - "конфиденциальность"
      position_bias:
        preferred_range: [0.60, 1.0]
        boost: 0.16
        scope: segment
      context_k: 4
      max_chunks: 6
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
      preferred_clause_functions:
        - "obligations"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 650

    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false

      llm_max_tokens: 700

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора форс-мажорную оговорку,
        уведомление о форс-мажоре и последствия для сроков исполнения.
        Не анализируй цену, санкции, споры или персональные данные.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        1. force_majeure_clause_status — "defined" / "not_defined".
        2. force_majeure_definition — описание форс-мажора.
        3. notification_period_status — "defined" / "not_defined".
        4. notification_period_value — срок / порядок уведомления.
        5. deadline_consequences_defined — "defined" / "not_defined".
        6. evidence_requirement_defined — "defined" / "not_defined".

        Если данные отсутствуют:
        - статус = "not_defined"
        - текст = "Данные не определены"
        </task>

        <rules>
        - Используй только текст договора.
        - Для signal-полей "defined" означает прямое указание условия в тексте.
        - "not_defined" означает, что условие прямо не указано.
        - Верни только JSON.
