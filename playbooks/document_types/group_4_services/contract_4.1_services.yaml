        - "форс-мажор"
        - "персональные данные"
      position_bias:
        preferred_range: [0.10, 0.50]
        boost: 0.16
        scope: segment
      context_k: 4
      max_chunks: 6
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "obligations"
        - "obligations"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 650

    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false

      llm_max_tokens: 600

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора условия об абонентской
        модели, take-or-pay, фиксированном платеже и возвратности за неиспользованные
        услуги. Не анализируй санкции, сроки, форс-мажор или споры.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        1. subscription_model_present — "defined" / "not_defined".
        2. take_or_pay_clause — "defined" / "not_defined".
        3. fixed_fee_amount — размер фиксированного платежа.
        4. unused_services_refundable — "yes" / "no" / "not_defined".
        5. subscription_model_summary — краткое описание абонентской модели.

        Если данные отсутствуют:
        - статус = "not_defined"
        - текст = "Данные не определены"
        </task>

        <rules>
        - Используй только текст договора.
        - subscription_model_present / take_or_pay_clause:
            - "defined" — условие прямо указано.
            - "not_defined" — условие прямо не указано.
        - unused_services_refundable:
            - "yes" — прямо указано, что оплата за неиспользованные услуги возвращается.
            - "no" — прямо указано, что не возвращается.
            - "not_defined" — вопрос прямо не урегулирован.
        - Если текстового значения нет — верни "Данные не определены".
        - Верни только JSON.
        </rules>
      fields:
        - name: "subscription_model_present"
          type: "string"
          presentation: "signal"
          allowed_values:
            - "defined"
            - "not_defined"
          description: "Является ли договор абонентским."
          required: true
          display_in_grid: true
          display_priority: 1

        - name: "take_or_pay_clause"
          type: "string"
          presentation: "signal"
          allowed_values:
            - "defined"
            - "not_defined"
          description: "Есть ли условие take-or-pay."
          required: true
          display_in_grid: true
          display_priority: 2

        - name: "fixed_fee_amount"
          type: "string"
