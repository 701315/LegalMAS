        - текст = "Данные не определены"
        </task>

        <rules>
        - Используй только текст договора.
        - service_type_for_fee:
            - "legal" — юридические услуги, представительство в суде.
            - "consulting" — консалтинг, M&A, аудит.
            - "marketing" — маркетинг, реклама, продвижение.
            - "other" — иной тип, прямо указанный в тексте.
            - "not_defined" — тип прямо не определён.
        - Если текстового значения нет — верни "Данные не определены".
        - Верни только JSON.
        </rules>
      fields:
        - name: "success_fee_present"
          type: "string"
          presentation: "signal"
          allowed_values:
