  # ──────────────────────────────────────────────────────────────────────────
  # CHECK 7: Качество услуг, гарантия и устранение недостатков
  # ──────────────────────────────────────────────────────────────────────────
  - id: quality_standards_warranty
    name: "Стандарты качества и гарантии исполнения (ст. 721, 723, 783 ГК РФ)"
    description: >
      Фактографическая проверка наличия в договоре стандартов качества услуг,
      гарантийных обязательств, порядка предъявления претензий и сроков
      устранения недостатков. Результат предназначен для табличного сравнения
      нескольких договоров.
    triggers: ~
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "стандарты качества"
        - "требования к качеству"
        - "гарантийные обязательства"
        - "устранение недостатков"
        - "претензия"
        - "срок устранения"
        - "дефект"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)стандарт(ы|ов)\\s+качеств"
        - "(?i)устранени(е|я)\\s+недостатк"
        - "(?i)гарантийн(ый|ого)\\s+срок"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор возмездного оказания услуг.
        Проверяется только один вопрос: стандарты качества услуг, гарантия,
        претензионный порядок по недостаткам и сроки их устранения.

        Нормативный ориентир:
        - ст. 721 ГК РФ — качество результата
        - ст. 723 ГК РФ — последствия недостатков
        - ст. 783 ГК РФ — применение правил к услугам

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора,
          а чего прямо нет.
        - Не оценивай серьёзность риска.
        - Юрист будет использовать результат в сравнительной таблице.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Определены ли стандарты качества.
        2. Как описаны стандарты качества.
        3. Указан ли гарантийный срок.
        4. Какой гарантийный срок указан.
        5. Предусмотрен ли порядок претензий по недостаткам.
        6. Указан ли срок устранения недостатков.
        7. Какой срок устранения недостатков указан.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Если условие не указано прямо — возвращай "not_defined".
        4. Если текстового значения нет — возвращай строго "Данные не определены".
        5. Не используй "None", "null", "not_found", "not_specified" или пустые строки.
        6. В evidence включай только текст договора.
        7. Не путай срок исправления дефектов со сроком ответа на претензию по оплате.
        8. Верни только один JSON-объект.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — условия есть:
        Фрагмент:
        "Услуги должны соответствовать требованиям Технического задания и
        профессиональным стандартам. Исполнитель устраняет выявленные
        недостатки в течение 10 рабочих дней с даты получения претензии.
        Гарантийный срок на результат услуг составляет 3 месяца."

        Ответ:
        {
          "quality_standards_status": "defined",
          "quality_standards_value": "требования Технического задания и профессиональные стандарты",
          "warranty_period_status": "defined",
          "warranty_period_value": "3 месяца",
          "complaint_procedure_defined": "defined",
          "defect_remedy_period_status": "defined",
          "defect_remedy_period_value": "10 рабочих дней",
          "evidence": [
            {
              "clause_ref": "п. 5.1",
              "quote": "Услуги должны соответствовать требованиям Технического задания и профессиональным стандартам. Исполнитель устраняет выявленные недостатки в течение 10 рабочих дней с даты получения претензии. Гарантийный срок на результат услуг составляет 3 месяца."
            }
          ]
        }

        Пример 2 — данные отсутствуют:
        Фрагмент:
        "Услуги оказываются качественно."

        Ответ:
        {
          "quality_standards_status": "not_defined",
          "quality_standards_value": "Данные не определены",
          "warranty_period_status": "not_defined",
          "warranty_period_value": "Данные не определены",
          "complaint_procedure_defined": "not_defined",
          "defect_remedy_period_status": "not_defined",
          "defect_remedy_period_value": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Есть ли прямое указание на стандарты качества.
        2. Есть ли прямое указание на гарантийный срок.
        3. Есть ли прямое указание на претензию по недостаткам.
        4. Есть ли прямое указание на срок устранения недостатков.
        5. Если прямой цитаты нет — верни "not_defined". Не додумывай условия.

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        {
          "quality_standards_status": "<defined / not_defined>",
          "quality_standards_value": "<текст или 'Данные не определены'>",
          "warranty_period_status": "<defined / not_defined>",
          "warranty_period_value": "<текст или 'Данные не определены'>",
          "complaint_procedure_defined": "<defined / not_defined>",
          "defect_remedy_period_status": "<defined / not_defined>",
          "defect_remedy_period_value": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 5
      temperature: 0.0
      max_tokens: 650

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "стандарты качества гарантийный срок недостатки претензия устранение недостатков срок устранения"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - technical_fragment
        - structural_anchor
      preferred_clause_functions:
        - obligations
      negative_keywords:
        - "оплата"
        - "неустойка"
        - "форс-мажор"
      position_bias:
        preferred_range: [0.25, 0.75]
        boost: 0.16
        scope: segment
      context_k: 5
      max_chunks: 7
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "price_list"
      preferred_clause_functions:
        - "obligations"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 650

    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false

      llm_max_tokens: 800

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора стандарты качества,
        гарантийный срок, порядок претензий и срок устранения недостатков.
        Не анализируй цену, санкции, форс-мажор или споры.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        1. quality_standards_status — "defined" / "not_defined".
        2. quality_standards_value — описание стандартов качества.
        3. warranty_period_status — "defined" / "not_defined".
        4. warranty_period_value — гарантийный срок.
        5. complaint_procedure_defined — "defined" / "not_defined".
        6. defect_remedy_period_status — "defined" / "not_defined".
        7. defect_remedy_period_value — срок устранения недостатков.

        Если данные отсутствуют:
        - статус = "not_defined"
        - текст = "Данные не определены"
        </task>

        <rules>
        - Используй только текст договора.
        - Для signal-полей "defined" означает прямое указание условия в тексте.
        - "not_defined" означает, что условие прямо не указано.
        - Верни только JSON.
        </rules>
      fields:
        - name: "quality_standards_status"
          type: "string"
          presentation: "signal"
          allowed_values:
            - "defined"
            - "not_defined"
          description: "Статус определения стандартов качества."
          required: true

        - name: "quality_standards_value"
          type: "string"
          presentation: "fact"
          label: "Стандарты качества"
          description: "Описание стандартов качества услуг."
          required: false
          display_in_grid: true
          display_priority: 1

        - name: "warranty_period_status"
          type: "string"
          presentation: "signal"
          allowed_values:
            - "defined"
            - "not_defined"
          description: "Статус указания гарантийного срока."
          required: true

        - name: "warranty_period_value"
          type: "string"
          presentation: "fact"
          label: "Гарантийный срок"
          description: "Гарантийный срок на результат услуг."
