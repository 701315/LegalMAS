  - id: personal_data_processing_terms
    name: "Персональные данные: поручение на обработку (ФЗ-152)"
    description: >
      Фактографическая проверка наличия в договоре поручения на обработку
      персональных данных, категорий данных, целей обработки, мер защиты
      и трансграничной передачи. Результат предназначен для табличного
      сравнения нескольких договоров.
