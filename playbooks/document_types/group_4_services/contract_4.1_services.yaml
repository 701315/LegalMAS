      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - obligations
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 650

    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false

      llm_max_tokens: 600

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора трансграничные условия:
        иностранный элемент, место реализации, налоговый агент и валюту расчётов.
        Не анализируй цену, санкции, форс-мажор или споры.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля. Верни все ключи, даже если данные отсутствуют.

        1. cross_border_detected — "yes" или "no".
        2. cross_border_detected_display — user-friendly: "Да" или "Нет".
        3. place_of_supply_defined — "defined" или "not_defined".
        4. place_of_supply_defined_display — user-friendly: "Да" или "Нет".
        5. tax_agent_clause — "defined" или "not_defined".
        6. tax_agent_clause_display — user-friendly: "Да" или "Нет".
        7. payment_currency_defined — "defined" или "not_defined".
        8. payment_currency_defined_display — user-friendly: "Да" или "Нет".
        9. cross_border_summary — краткое описание трансграничных условий (текст или "Определяется по ..." или "Не установлено").

        Правила заполнения при отсутствии данных:
        - Для cross_border_detected: если иностранная сторона прямо не указана — возвращай "no".
        - Для place_of_supply_defined, tax_agent_clause, payment_currency_defined возвращай "not_defined".
        - Для cross_border_summary возвращай "Не установлено".
        - Для всех *_display полей: если соответствующий статус = "not_defined" или "no" — возвращай "Нет".
        </task>

        <rules>
        - Используй только текст договора.
        - cross_border_detected:
            - "yes" — если одна из сторон прямо является иностранной (нерезидент, иностранная компания, зарегистрирована за пределами РФ).
            - "no" — если стороны — российские (упоминание иностранной валюты само по себе не делает договор трансграничным).
        - place_of_supply_defined:
            - "defined" — есть прямое указание на место реализации услуг (территория РФ, территория иностранного государства, либо ссылка на приложение/соглашение).
            - "not_defined" — условие прямо не указано.
        - tax_agent_clause:
            - "defined" — есть прямое указание на обязанность заказчика исполнять функции налогового агента по НДС.
            - "not_defined" — условие прямо не указано.
        - payment_currency_defined:
            - "defined" — указана валюта расчётов (рубли, евро, доллары, юани и т.д.).
            - "not_defined" — валюта прямо не указана.
        - cross_border_summary:
            - Если трансграничные условия указаны прямо — сформируй краткое описание из текста.
            - Если место реализации определяется по приложению/соглашению — укажи "Определяется по [название документа]".
        - Не считай договор трансграничным только из-за упоминания иностранной валюты.
        - Верни только валидный JSON-объект без markdown-обёртки или с ней, но парсящийся через json.loads.
        </rules>
      fields:
        - name: "cross_border_detected"
          type: "string"
          presentation: "signal"
          allowed_values:
            - "yes"
            - "no"
          description: "Обнаружен ли иностранный элемент."
          required: true
          display_in_grid: false

        - name: "cross_border_detected_display"
          type: "string"
          presentation: "fact"
          label: "Иностранный элемент"
          description: "User-friendly описание наличия иностранного элемента."
          required: true
          display_in_grid: true
          display_priority: 1

        - name: "place_of_supply_defined"
          type: "string"
          presentation: "signal"
          allowed_values:
            - "defined"
            - "not_defined"
          description: "Определено ли место реализации услуг."
          required: true
          display_in_grid: false

        - name: "place_of_supply_defined_display"
          type: "string"
          presentation: "fact"
          label: "Место реализации"
          description: "User-friendly описание определения места реализации услуг."
          required: true
          display_in_grid: true
          display_priority: 2

        - name: "tax_agent_clause"
          type: "string"
          presentation: "signal"
          allowed_values:
            - "defined"
            - "not_defined"
          description: "Есть ли оговорка о налоговом агенте."
          required: true
          display_in_grid: false

        - name: "tax_agent_clause_display"
          type: "string"
          presentation: "fact"
          label: "Налоговый агент"
          description: "User-friendly описание наличия оговорки о налоговом агенте."
          required: true
          display_in_grid: true
          display_priority: 3

        - name: "payment_currency_defined"
          type: "string"
          presentation: "signal"
          allowed_values:
            - "defined"
            - "not_defined"
          description: "Указана ли валюта расчётов."
          required: true
          display_in_grid: false

        - name: "payment_currency_defined_display"
          type: "string"
          presentation: "fact"
          label: "Валюта расчётов"
          description: "User-friendly описание указания валюты расчётов."
          required: true
          display_in_grid: true
          display_priority: 4

        - name: "cross_border_summary"
          type: "string"
          presentation: "fact"
          label: "Трансграничные условия"
          description: "Краткое описание трансграничных условий."
          required: false
          display_in_grid: true
          display_priority: 5
      store_payload: true

  - id: auto_renewal_clause
    name: "Автопролонгация и условия продления"
    description: >
      Фактографическая проверка наличия в договоре условия об автоматическом
      продлении, срока уведомления о непродлении и периода продления.
      Результат предназначен для табличного сравнения нескольких договоров.
    triggers: ~
    ui_mode: "field_extraction"
    severity: "medium"
    severity_if_pass: "pass"
    severity_if_fail: "medium"
    severity_if_unclear: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "автопролонгация"
        - "автоматическое продление"
        - "продлевается на тот же срок"
        - "если ни одна из сторон не уведомит"
        - "пролонгация"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)автоматическ(и|ое)\\s+продлева(ется|ть)"
        - "(?i)продлева(ется|ть)\\s+на\\s+(тот\\s+же|аналогичн)"
        - "(?i)пролонгац"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор возмездного оказания услуг.
        Проверяется только один вопрос: есть ли автопролонгация, срок
        уведомления о непродлении и период продления.

        Нормативный ориентир:
        - ГК РФ — общие положения о сроке действия договора

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора, а чего прямо нет.
        - Не оценивай серьёзность риска.
        - Юрист будет использовать результат в сравнительной таблице.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Есть ли условие об автопролонгации.
        2. Какой срок уведомления о непродлении.
        3. На какой период продлевается договор.
        4. Как описано условие пролонгации.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Если условие не указано прямо:
           - для статусных полей (*_present, *_status) возвращай "not_defined";
           - для текстовых полей (notice_period_value, renewal_period, auto_renewal_summary) возвращай "Не установлено".
        4. Строго запрещено использовать "None", "null", "not_defined" (в текстовых полях) или пустые строки "".
        5. auto_renewal_present_display:
           - Если auto_renewal_present = "defined" — "Да".
           - Если "not_defined" — "Нет".
        6. Не путай автопролонгацию с обычным правом сторон перезаключить договор по соглашению.
        7. В evidence включай только точный текст договора.
        8. Верни только один валидный JSON-объект, содержащий все указанные ключи.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — автопролонгация есть:
        Фрагмент:
        "Договор автоматически продлевается на один год, если ни одна из сторон
        не уведомит другую о прекращении не менее чем за 30 календарных дней
        до окончания текущего срока."

        Ответ:
        {
          "auto_renewal_present": "defined",
          "auto_renewal_present_display": "Да",
          "notice_period_status": "defined",
          "notice_period_value": "за 30 календарных дней до окончания текущего срока",
          "renewal_period": "один год",
          "auto_renewal_summary": "автоматическое продление на один год; уведомление за 30 календарных дней до окончания",
          "evidence": [
            {
              "clause_ref": "п. 10.2",
              "quote": "Договор автоматически продлевается на один год, если ни одна из сторон не уведомит другую о прекращении не менее чем за 30 календарных дней до окончания текущего срока."
            }
          ]
        }

        Пример 2 — данные отсутствуют:
        Фрагмент:
