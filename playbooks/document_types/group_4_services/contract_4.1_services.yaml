      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор возмездного оказания услуг, затрагивающий
        обработку персональных данных.
        Проверяется только один вопрос: наличие поручения на обработку ПДн,
        категорий данных, целей обработки, мер защиты и трансграничной передачи.

        Нормативный ориентир:
        - Федеральный закон № 152-ФЗ «О персональных данных»
        - положения о поручении обработки персональных данных

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора,
          а чего прямо нет.
        - Не оценивай серьёзность риска.
        - Юрист будет использовать результат в сравнительной таблице.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Есть ли поручение на обработку ПДн.
        2. Перечислены ли категории персональных данных.
        3. Определены ли цели обработки.
        4. Определены ли меры защиты ПДн.
        5. Упомянута ли трансграничная передача.
        6. Как описан предмет / объем обработки ПДн.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Если условие не указано прямо — возвращай "not_defined".
        4. Если текстового значения нет — возвращай строго "Данные не определены".
        5. Не используй "None", "null", "not_found", "not_specified" или пустые строки.
        6. В evidence включай только текст договора.
        7. Не путай общую оговорку о конфиденциальности с поручением на обработку ПДн.
        8. Верни только один JSON-объект.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — ПДн урегулированы:
        Фрагмент:
        "Заказчик поручает Исполнителю обработку персональных данных клиентов
        в целях оказания услуг поддержки. Обрабатываются ФИО, телефон, адрес
        электронной почты. Исполнитель обязан применять организационные и
        технические меры защиты. Трансграничная передача не допускается."

        Ответ:
        {
          "pd_assignment_present": "defined",
          "pd_categories_listed": "defined",
          "pd_purposes_defined": "defined",
          "pd_security_measures": "defined",
          "pd_cross_border_transfer": "defined",
          "pd_processing_scope": "обработка персональных данных клиентов в целях оказания услуг поддержки; категории: ФИО, телефон, адрес электронной почты",
          "evidence": [
            {
              "clause_ref": "п. 10.1",
              "quote": "Заказчик поручает Исполнителю обработку персональных данных клиентов в целях оказания услуг поддержки. Обрабатываются ФИО, телефон, адрес электронной почты. Исполнитель обязан применять организационные и технические меры защиты. Трансграничная передача не допускается."
            }
          ]
        }

        Пример 2 — данные отсутствуют:
        Фрагмент:
        "Стороны обязуются соблюдать конфиденциальность информации."

        Ответ:
        {
          "pd_assignment_present": "not_defined",
          "pd_categories_listed": "not_defined",
          "pd_purposes_defined": "not_defined",
          "pd_security_measures": "not_defined",
          "pd_cross_border_transfer": "not_defined",
          "pd_processing_scope": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Есть ли прямое указание на обработку именно персональных данных.
        2. Есть ли прямое указание на категории данных.
        3. Есть ли прямое указание на цели обработки.
        4. Есть ли прямое указание на меры защиты.
        5. Есть ли прямое указание на трансграничную передачу.
        6. Если прямой цитаты нет — верни "not_defined". Не додумывай условия.

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        {
          "pd_assignment_present": "<defined / not_defined>",
          "pd_categories_listed": "<defined / not_defined>",
          "pd_purposes_defined": "<defined / not_defined>",
          "pd_security_measures": "<defined / not_defined>",
          "pd_cross_border_transfer": "<defined / not_defined>",
          "pd_processing_scope": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 5
      temperature: 0.0
      max_tokens: 700

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "персональные данные обработка персональных данных поручение на обработку оператор цели обработки меры защиты трансграничная передача"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
      negative_keywords:
        - "неустойка"
        - "оплата"
        - "форс-мажор"
        - "подсудность"
      position_bias:
        preferred_range: [0.40, 0.90]
        boost: 0.16
        scope: segment
      context_k: 5
      max_chunks: 7
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "price_list"
        - "technical_specification"
      preferred_clause_functions:
        - "obligations"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 650

    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false

      llm_max_tokens: 650

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора условия о поручении
        на обработку персональных данных, категориях данных, целях обработки,
        мерах защиты и трансграничной передаче. Не анализируй цену, санкции,
        сроки или споры.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        1. pd_assignment_present — "defined" / "not_defined".
        2. pd_categories_listed — "defined" / "not_defined".
        3. pd_purposes_defined — "defined" / "not_defined".
        4. pd_security_measures — "defined" / "not_defined".
        5. pd_cross_border_transfer — "defined" / "not_defined".
        6. pd_processing_scope — описание предмета / объема обработки ПДн.
        </task>

        <rules>
        - Используй только текст договора.
        - Для signal-полей "defined" означает прямое указание условия в тексте.
        - "not_defined" означает, что условие прямо не указано.
        - pd_processing_scope заполняй только текстом договора.
        - Если текстового значения нет — верни "Данные не определены".
        - Верни только JSON.
        </rules>
      fields:
        - name: "pd_assignment_present"
          type: "string"
          presentation: "signal"
          allowed_values:
            - "defined"
            - "not_defined"
          description: "Есть ли поручение на обработку ПДн."
          required: true
          display_in_grid: true
          display_priority: 1

