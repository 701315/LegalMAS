  - id: territory_and_jurisdiction_check
    name: "Территория страхового покрытия"
    description: >
      Проверяет определение географической территории действия страхового покрытия.
      Критически важно: страховой случай признается таковым только при условии, что он
      произошел в пределах согласованной территории страхования. События вне этой
      территории не покрываются договором.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "территория страхования"
        - "территория покрытия"
        - "на территории"
        - "российская федерация"
        - "весь мир"
        - "worldwide"
        - "территориальные исключения"
        - "место нахождения имущества"
        - "адрес страхования"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)территори[яи]\\s+(страхован|покрыт|действи)"
        - "(?i)на\\s+территории\\s+(?:российской\\s+федерации|рф)"
        - "(?i)место\\s+нахождения\\s+застрахованного"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор страхования по Главе 48 ГК РФ.
        Проверяется только один вопрос: географическая территория действия страхового покрытия.

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора.
        - Не оценивай серьёзность риска.
        - Не путай территорию страхования (место действия покрытия) с применимым правом
          или судебной подсудностью (это предмет других, глобальных проверок).
        - В страховании имущества территория часто привязывается к конкретному адресу
          нахождения объекта или спецификации. Отражай это.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Определена ли конкретная территория страхового покрытия.
        2. Каков ее географический охват (Россия, СНГ, Весь мир, конкретные адреса / страны).
        3. Предусмотрены ли территориальные исключения (например, зоны военных действий,
           санкционные страны, определенные субъекты РФ).
        4. Цитату из договора, подтверждающую выводы.

        [ПРАВИЛА]
        1. Используй только текст документа. Не подставляй нормы закона вместо
           текста договора.
        2. Если условие не указано прямо и не следует однозначно из текста —
           возвращай "not_defined".
        3. Не используй "None", "null", пустые строки. Не используй "not_found".
        4. "russia" — покрытие ограничено только территорией Российской Федерации.
        5. "cis" — покрытие распространяется на страны СНГ.
        6. "worldwide" — покрытие действует по всему миру.
        7. "specified_countries" — покрытие ограничено конкретным списком стран, регионов
           или конкретными адресами нахождения имущества (например, "Москва, ул. Ленина, д. 10").
        8. "present" — в договоре прямо указаны территории-исключения, где покрытие не действует.
        9. "absent" — территориальные исключения не упомянуты.
        10. В evidence включай только текст договора.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — территория РФ, исключений нет:
        Фрагмент:
        "Страховое покрытие по настоящему договору действует исключительно на территории
        Российской Федерации. Территориальные исключения договором не предусмотрены."

        Ответ:
        {
          "territory_defined": "yes",
          "territory_scope": "russia",
          "territorial_exclusions": "absent",
          "evidence": "Страховое покрытие по настоящему договору действует исключительно на территории Российской Федерации. Территориальные исключения договором не предусмотрены."
        }

        Пример 2 — данные полностью отсутствуют:
        Фрагмент:
        "Договор вступает в силу с момента его подписания сторонами."

        Ответ:
        {
          "territory_defined": "no",
          "territory_scope": "not_defined",
          "territorial_exclusions": "not_defined",
          "evidence": "Договор вступает в силу с момента его подписания сторонами."
        }

        Пример 3 — территория определена конкретным адресом (имущественное страхование):
        Фрагмент:
        "Территорией страхования является место нахождения застрахованного имущества:
        г. Москва, Рязанский проспект, д. 24, корп. 2. Страховое покрытие не распространяется
        на случаи, произошедшие вне указанного адреса."

        Ответ:
        {
          "territory_defined": "yes",
          "territory_scope": "specified_countries",
          "territorial_exclusions": "present",
          "evidence": "Территорией страхования является место нахождения застрахованного имущества: г. Москва, Рязанский проспект, д. 24, корп. 2. Страховое покрытие не распространяется на случаи, произошедшие вне указанного адреса."
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о территории страхования или адресе нахождения застрахованного объекта.
        2. Оцени географический охват: если указан точный адрес — это "specified_countries".
        3. Найди прямую цитату об ограничениях или исключениях из территории (если есть).
        4. Проверь, что все 4 ключей (3 полей + evidence) присутствуют в JSON.

        Не выводи шаги проверки. Верни только JSON.

