        2. Единовременная оплата без указания вступления в силу.
           Например: "Страховая премия уплачивается единовременно".
           → presence = "present";
             payment_form = "single";
             contract_effective_condition = "not_defined";
             premium_due_date содержит дословную формулировку или "not_defined".

        3. Противоречие между фрагментами.
           В разных частях договора указаны разные формы оплаты или разные
           моменты вступления в силу.
           → presence = "unclear";
             соответствующие сигнальные поля = "not_defined";
             premium_payment_summary = "Не установлено".

        4. Рассрочка с последствиями просрочки.
           В договоре прямо указан график взносов и последствия просрочки
           (приостановление покрытия / расторжение).
           → presence = "present";
             payment_form = "installments";
             contract_effective_condition — по тексту;
             late_payment_consequences содержит дословную формулировку.
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для premium_and_payment_order_presence используй только:
          "present", "missing", "unclear".
        - Для payment_form допустимо только: single / installments / not_defined.
        - Для premium_due_date допустимо: конкретный текст или not_defined.
        - Для contract_effective_condition допустимо только:
          upon_payment / upon_signing / specified_date / not_defined.
        - Для late_payment_consequences допустимо: конкретный текст
          или not_defined.
        - Fallback для premium_payment_summary: "Не установлено".
        - evidence — массив объектов вида {"clause_ref": "...", "quote": "..."}.
        - Технический формат JSON (value / confidence / location) задан
          отдельным контрактом — соблюдай его, но не описывай здесь.
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>
      fields:
