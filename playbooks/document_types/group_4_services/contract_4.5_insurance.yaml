        5. premium_payment_summary — краткое описание порядка расчётов.
           Если сведения отсутствуют — "Не установлено".
        </task>

        <context_rules>
        - Перед остальными полями заполни premium_and_payment_order_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все содержательные поля = "not_defined", premium_payment_summary = "Не установлено".
        - Используй только текст договора из <context>. Не подставляй нормы
