  - id: deductible_check
    name: "Франшиза: тип, размер и порядок применения"
    description: >
      Проверяет наличие, тип и размер франшизы (части убытка, не возмещаемой
      страховщиком). Различает безусловную франшизу (вычитается из каждой выплаты),
      условную/интегральную (убыток ниже порога не покрывается, выше — покрывается
      полностью) и динамическую (зависит от числа убытков).
      Критически важно: безусловная франшиза 10% при страховой сумме 100 млн руб.
      означает, что страхователь несёт 10 млн руб. из каждого убытка самостоятельно.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "франшиза"
        - "безусловная франшиза"
        - "условная франшиза"
        - "не возмещается"
        - "за вычетом"
        - "собственное участие"
        - "удержание"
        - "deductible"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)франшиз[аыу]"
        - "(?i)собственн(?:ое|ого)\\s+участ(?:ие|ия)"
        - "(?i)за\\s+вычетом\\s+\\d+"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор страхования по Главе 48 ГК РФ.
        Проверяется только один вопрос: наличие, тип и размер франшизы.

        Нормативный ориентир:
        - ст. 942 ГК РФ — существенные условия договора страхования
        - ст. 947 ГК РФ — страховая сумма и страховое возмещение

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора.
        - Не оценивай серьёзность риска.
        - Учитывай российскую практику:
          * Безусловная франшиза — вычитается из КАЖДОЙ выплаты
            (например, «франшиза 50 000 руб.» означает, что из каждого
            убытка страхователь несёт 50 000 руб.).
          * Условная (интегральная) франшиза — если убыток ниже порога,
            выплата не производится; если выше — выплачивается полностью.
          * Динамическая франшиза — зависит от количества заявленных
            убытков (например, 1-й убыток без франшизы, 2-й — 5%).
          * Франшиза может быть выражена в рублях, в процентах от
            страховой суммы или от суммы убытка.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Предусмотрена ли франшиза.
        2. Тип франшизы (безусловная, условная, динамическая).
        3. Размер франшизы (сумма в рублях или процент).
        4. Порядок применения (на каждый убыток, за период, за событие).
        5. Цитату из договора, подтверждающую выводы.

        [ПРАВИЛА]
        1. Используй только текст документа. Не подставляй нормы закона
           вместо текста договора.
        2. Если условие не указано прямо и не следует однозначно из
           текста — возвращай "not_defined".
        3. Не используй "None", "null", пустые строки. Не используй
           "not_found".
        4. "unconditional" — безусловная франшиза (вычитается из каждой
           выплаты независимо от размера убытка).
        5. "conditional" — условная / интегральная франшиза (убыток ниже
           порога не покрывается, выше порога — покрывается полностью).
        6. "dynamic" — динамическая франшиза (размер зависит от числа
           убытков или иных условий).
        7. "per_claim" — применяется к каждому отдельному убытку.
        8. "per_period" — применяется совокупно за период страхования.
        9. "per_event" — применяется к каждому страховому событию.
        10. В evidence включай только текст договора.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — безусловная франшиза в рублях:
        Фрагмент:
        "По настоящему договору установлена безусловная франшиза в размере
        100 000 (ста тысяч) рублей по каждому страховому случаю. Страховое
        возмещение выплачивается за вычетом указанной франшизы."

        Ответ:
        {
          "deductible_present": "yes",
          "deductible_type": "unconditional",
          "deductible_amount": "100 000 рублей по каждому страховому случаю",
          "deductible_application": "per_claim",
          "deductible_summary": "Безусловная франшиза 100 000 руб. на каждый убыток",
          "evidence": "По настоящему договору установлена безусловная франшиза в размере 100 000 (ста тысяч) рублей по каждому страховому случаю. Страховое возмещение выплачивается за вычетом указанной франшизы."
        }

        Пример 2 — условная франшиза в процентах:
        Фрагмент:
        "Условная франшиза составляет 5% от страховой суммы. Если размер
        убытка не превышает франшизу, страховое возмещение не выплачивается.
        Если убыток превышает франшизу, возмещение выплачивается в полном
        объёме."

        Ответ:
        {
          "deductible_present": "yes",
          "deductible_type": "conditional",
          "deductible_amount": "5% от страховой суммы",
          "deductible_application": "per_claim",
          "deductible_summary": "Условная франшиза 5% от страховой суммы (убыток ниже — не покрывается, выше — полностью)",
          "evidence": "Условная франшиза составляет 5% от страховой суммы. Если размер убытка не превышает франшизу, страховое возмещение не выплачивается. Если убыток превышает франшизу, возмещение выплачивается в полном объёме."
        }

        Пример 3 — франшиза отсутствует:
        Фрагмент:
        "Страховое возмещение выплачивается в полном объёме в пределах
        страховой суммы без каких-либо удержаний."

        Ответ:
        {
          "deductible_present": "no",
          "deductible_type": "not_defined",
          "deductible_amount": "not_defined",
          "deductible_application": "not_defined",
          "deductible_summary": "Франшиза не установлена — возмещение выплачивается в полном объёме",
          "evidence": "Страховое возмещение выплачивается в полном объёме в пределах страховой суммы без каких-либо удержаний."
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о франшизе (тип, размер).
        2. Определи, вычитается ли франшиза из каждой выплаты (безусловная)
           или служит порогом (условная).
        3. Проверь, что все 6 ключей (5 полей + evidence) присутствуют
           в JSON.

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь РОВНО одним JSON-объектом без какого-либо дополнительного
        текста до или после, со всеми 6 ключами (5 полей + evidence):
        {
          "deductible_present": "<yes / no>",
          "deductible_type": "<unconditional / conditional / dynamic / not_defined>",
          "deductible_amount": "<размер или not_defined>",
          "deductible_application": "<per_claim / per_period / per_event / not_defined>",
          "deductible_summary": "<краткое описание или fallback>",
          "evidence": "<прямая цитата из договора>"
        }
      context_k: 7
      temperature: 0.0
      max_tokens: 650

    retrieval:
      corpus_scope: "primary_segment"
      levels:
