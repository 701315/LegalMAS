          description: "Включены ли Правила в договорную конструкцию."
          required: false
        - name: "rules_snippet"
          type: "string"
          presentation: "fact"
          label: "Цитата о Правилах страхования"
          description: "Цитата из текста о Правилах страхования."
          required: false
          display_in_grid: true
          display_priority: 1
      store_payload: true

