        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - definitions
        - obligations
      negative_keywords:
        - "означает"
        - "в целях настоящего"
        - "страховая сумма"
        - "премия"
      position_bias:
        preferred_range: [0.10, 0.45]
        boost: 0.12
        scope: segment
      context_k: 5
      max_chunks: 7
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
        - "invoice"
      preferred_clause_functions:
        - "definitions"
        - "obligations"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 550

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 650
      compact_output: false

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора личного страхования
        сведения о застрахованном лице, его согласии и выгодоприобретателе.
        </role>

        <context>
        {context}
        </context>

        <task>
        1. insured_person_identified — "yes" / "no".
        2. insured_person_consent_status — "present" / "not_defined" / "unclear".
        3. beneficiary_status — "named" / "default_rules" / "not_defined".
        4. consent_snippet — цитата или "not_defined".
