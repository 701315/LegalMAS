      Проверяет условия перехода к страховщику права требования к виновному
      лицу после выплаты страхового возмещения (суброгация, ст. 965 ГК РФ).
      Анализирует наличие и объём отказа от суброгации (полный или частичный,
      в пользу аффилированных лиц, контрагентов), а также обязанность
      страхователя содействовать реализации суброгационного права.
      Критически важно: отказ от суброгации в пользу контрагентов клиента
      может существенно ограничить регрессные риски, но повышает стоимость
      полиса. Неурегулированная суброгация создаёт риск регрессного иска
      к страхователю или его аффилированным лицам.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "суброгация"
        - "право требования"
        - "переход права"
        - "отказ от суброгации"
        - "регресс"
        - "виновное лицо"
        - "ответственное лицо"
        - "содействовать"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)суброгац[ияи]"
        - "(?i)переход.{0,20}прав.{0,20}требовани"
        - "(?i)отказ.{0,20}от\\s+суброгац"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор страхования по Главе 48 ГК РФ.
        Проверяется только один вопрос: условия суброгации (перехода к
        страховщику права требования к виновному лицу).

        Нормативный ориентир:
        - ст. 965 ГК РФ — переход к страховщику права требования,
          которое страхователь имеет к лицу, ответственному за убытки

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте
          договора.
        - Не оценивай серьёзность риска.
        - Учитывай российскую практику:
          * По закону (п. 1 ст. 965 ГК РФ) суброгация возникает
            автоматически в пределах выплаченного возмещения.
          * Договором может быть предусмотрен полный или частичный
            отказ от суброгации (waiver of subrogation).
          * Отказ от суброгации в пользу аффилированных лиц
            страхователя — стандартная практика в корпоративном
            страховании.
          * Обязанность страхователя передать документы и содействовать
            суброгации — типичное условие.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Есть ли условие о суброгации (переходе права требования).
        2. Предусмотрен ли отказ от суброгации (полный или частичный).
        3. В чью пользу установлен отказ (аффилированные лица,
           контрагенты, все третьи лица).
        4. Обязан ли страхователь содействовать реализации
           суброгационного права страховщика.
        5. Цитату из договора, подтверждающую выводы.

        [ПРАВИЛА]
        1. Используй только текст документа. Не подставляй нормы закона
           вместо текста договора.
        2. Если условие не указано прямо и не следует однозначно из
           текста — возвращай "not_defined".
        3. Не используй "None", "null", пустые строки. Не используй
           "not_found".
        4. "full" — полный отказ от суброгации (страховщик не имеет
           права требования ни к каким третьим лицам).
        5. "partial" — частичный отказ (например, только в пользу
           аффилированных лиц страхователя или конкретных контрагентов).
        6. "none" — отказ от суброгации не предусмотрен (действует
           законный режим ст. 965 ГК РФ).
        7. В evidence включай только текст договора.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — частичный отказ от суброгации:
        Фрагмент:
        "К Страховщику, выплатившему страховое возмещение, переходит
        право требования к лицу, ответственному за убытки, в пределах
        выплаченной суммы. Страховщик отказывается от права суброгации
        в отношении аффилированных лиц Страхователя, а также в отношении
        подрядчиков и субподрядчиков, привлечённых Страхователем для
        выполнения работ на застрахованном объекте. Страхователь обязан
        передать Страховщику все документы, необходимые для реализации
        суброгационного права."

        Ответ:
        {
          "subrogation_clause_present": "yes",
          "subrogation_waiver": "partial",
          "subrogation_waiver_scope": "В пользу аффилированных лиц Страхователя, подрядчиков и субподрядчиков",
          "subrogation_cooperation_duty": "present",
          "subrogation_summary": "Суброгация в пределах выплаты. Отказ в пользу аффилированных лиц и подрядчиков. Обязанность содействовать.",
          "evidence": "К Страховщику переходит право требования к лицу, ответственному за убытки. Страховщик отказывается от права суброгации в отношении аффилированных лиц Страхователя, подрядчиков и субподрядчиков. Страхователь обязан передать все документы."
        }

        Пример 2 — суброгация по закону, отказ не предусмотрен:
        Фрагмент:
        "Страховщик после выплаты страхового возмещения приобретает
        право требования к виновному лицу в размере выплаченной суммы
        в соответствии со ст. 965 ГК РФ."

        Ответ:
        {
          "subrogation_clause_present": "yes",
          "subrogation_waiver": "none",
          "subrogation_waiver_scope": "not_defined",
          "subrogation_cooperation_duty": "not_defined",
          "subrogation_summary": "Суброгация по закону (ст. 965 ГК РФ) в полном объёме. Отказ от суброгации не предусмотрен.",
          "evidence": "Страховщик после выплаты страхового возмещения приобретает право требования к виновному лицу в размере выплаченной суммы в соответствии со ст. 965 ГК РФ."
        }

        Пример 3 — суброгация не упомянута:
        Фрагмент:
        "Договор страхования заключается на условиях, согласованных
        Сторонами в настоящем полисе."

        Ответ:
        {
          "subrogation_clause_present": "no",
          "subrogation_waiver": "not_defined",
          "subrogation_waiver_scope": "not_defined",
          "subrogation_cooperation_duty": "not_defined",
          "subrogation_summary": "Не установлено — условия суброгации в тексте договора не раскрыты (применяется ст. 965 ГК РФ)",
          "evidence": "Договор страхования заключается на условиях, согласованных Сторонами в настоящем полисе."
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о суброгации / переходе права требования.
        2. Найди прямую цитату об отказе от суброгации (если есть).
        3. Найди прямую цитату об обязанности содействовать (если есть).
        4. Проверь, что все 6 ключей (5 полей + evidence) присутствуют
           в JSON.

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь РОВНО одним JSON-объектом без какого-либо дополнительного
        текста до или после, со всеми 6 ключами (5 полей + evidence):
        {
          "subrogation_clause_present": "<yes / no>",
          "subrogation_waiver": "<full / partial / none / not_defined>",
          "subrogation_waiver_scope": "<описание или not_defined>",
          "subrogation_cooperation_duty": "<present / absent / not_defined>",
          "subrogation_summary": "<краткое описание или fallback>",
          "evidence": "<прямая цитата из договора>"
        }
      context_k: 7
      temperature: 0.0
      max_tokens: 700

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "суброгация право требования переход права отказ от суброгации регресс виновное лицо ответственное лицо содействовать"
      boost_keywords:
        - "суброгация"
        - "отказ от суброгации"
        - "право требования"
      preferred_unit_types:
