shared_patterns:
  money_amount: "(?i)\\b\\d[\\d\\s]*(?:руб|рублей|₽|тыс|млн|млрд)"
  date_pattern: "(?i)\\b\\d{1,2}[.]\\d{1,2}[.]\\d{4}\\b"
  policy_number: "(?i)(?:полис|договор)\\s*№?\\s*[A-ZА-Я0-9\\-\\/]+"
  period_pattern: "(?i)(срок|период)\\s*(?:действия|страхования)?.{0,30}(с|по|до)"
  percentage_pattern: "(?i)\\b\\d+(?:[.,]\\d+)?\\s*%"
  deadline_pattern: "(?i)(?:в течение|не позднее)\\s+\\d+\\s+(?:календарн|рабоч|час|дн)"

compliance_rules: []

# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 4: CHECKS_V8 — единственный рабочий слой юридического анализа
#  Читается: DocTypeCheckLoader._load_doc_type_checks()
# ════════════════════════════════════════════════════════════════════════════

checks_v8:

  # ──────────────────────────────────────────────────────────────────────────
  # CHECK 1: Базовая структура договора страхования
  # ──────────────────────────────────────────────────────────────────────────
  - id: insurance_subject_extraction
    name: "Базовое извлечение предмета и конструкции страхования"
    description: >
      Извлекает тип страхования, объект, стороны, застрахованное лицо,
      выгодоприобретателя, страховую сумму, страховую премию и срок.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "страховщик"
        - "страхователь"
        - "объект страхования"
        - "страховой случай"
        - "страховая сумма"
        - "выгодоприобретатель"
        - "застрахованное лицо"
        - "срок действия"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)(страховщик|страхователь|страховой\\s+случай)"
        - "(?i)(страховая\\s+сумма|страховая\\s+премия)"
        - "(?i)(?:полис|договор)\\s*№?\\s*[A-ZА-Я0-9\\-\\/]+"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор страхования по Главе 48 ГК РФ и Закону № 4015-1.
        Проверяется только один вопрос: базовая структура договора страхования.

        Нормативный ориентир:
        - ст. 927-970 ГК РФ
        - Закон РФ № 4015-1

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора,
          а чего прямо нет.
        - Не оценивай серьёзность риска.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Тип страхования (имущественное / личное / ответственности).
        2. Номер полиса/договора.
        3. Страховщик.
        4. Страхователь.
        5. Застрахованное лицо.
        6. Выгодоприобретатель.
        7. Объект страхования.
        8. Страховой случай/риск.
        9. Страховая сумма.
        10. Страховая премия.
        11. Срок страхования.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Если данные не указаны прямо — возвращай "not_defined".
        4. Не используй "None", "null", "not_defined" или пустые строки.
        5. В evidence включай только текст договора.
        6. Верни только один JSON-объект.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — структура определена:
        Фрагмент:
        "Страховщик — ООО «Страховая компания», лицензия № 1234. Страхователь — ООО «Альфа».
        Объект страхования — имущество, расположенное по адресу: г. Москва, ул. Ленина, д. 10.
        Страховой случай — пожар, залив. Страховая сумма — 10 000 000 рублей.
        Страховая премия — 100 000 рублей. Срок страхования — 1 год с 01.01.2026."

        Ответ:
        {
          "insurance_type": "property",
          "policy_number": "not_defined",
          "insurer": "ООО «Страховая компания»",
          "policyholder": "ООО «Альфа»",
          "insured_person": "not_defined",
          "beneficiary": "not_defined",
          "insured_object": "имущество по адресу: г. Москва, ул. Ленина, д. 10",
          "insured_event": "пожар, залив",
          "sum_insured": "10 000 000 рублей",
          "premium": "100 000 рублей",
          "term": "1 год с 01.01.2026"
        }

        Пример 2 — данные отсутствуют:
        Фрагмент:
        "Стороны заключили договор страхования."

        Ответ:
        {
          "insurance_type": "unclear",
          "policy_number": "not_defined",
          "insurer": "not_defined",
          "policyholder": "not_defined",
          "insured_person": "not_defined",
          "beneficiary": "not_defined",
          "insured_object": "not_defined",
          "insured_event": "not_defined",
          "sum_insured": "not_defined",
          "premium": "not_defined",
          "term": "not_defined"
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о страховщике.
        2. Найди прямую цитату о страховой сумме.
        3. Найди прямую цитату о сроке страхования.
        4. Если прямой цитаты нет — верни "not_defined".

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "insurance_type": "<property / personal / liability / mixed / unclear / not_found>",
          "policy_number": "<текст или not_found>",
          "insurer": "<текст или not_found>",
          "policyholder": "<текст или not_found>",
          "insured_person": "<текст или not_found>",
          "beneficiary": "<текст или not_found>",
          "insured_object": "<текст или not_found>",
          "insured_event": "<текст или not_found>",
          "sum_insured": "<текст или not_found>",
          "premium": "<текст или not_found>",
          "term": "<текст или not_found>"
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 700

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "объект страхования страховой случай страховая сумма страховая премия выгодоприобретатель застрахованное лицо страховщик страхователь срок страхования"
      preferred_unit_types:
        - obligation
        - general_provision
        - definition
      excluded_unit_types:
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - definitions
        - obligations
      negative_keywords:
        - "означает"
        - "в целях настоящего"
        - "приложение"
        - "индекс"
      position_bias:
        preferred_range: [0.0, 0.35]
        boost: 0.20
        scope: segment
      context_k: 6
      max_chunks: 10
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
        - "invoice"
      preferred_clause_functions:
        - "definitions"
        - "obligations"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 50
      max_snippet_length: 700

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1350
      compact_output: false

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Твоя задача — извлечь из текста договора страхования
        базовую структуру: тип страхования, стороны, объект, страховой случай,
        страховую сумму, премию и срок.
        Не анализируй исключения, порядок выплаты или правила страхования.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        1. insurance_type — "property" / "personal" / "liability" / "mixed" / "unclear" / "not_defined".
        2. policy_number — номер полиса или договора.
        3. insurer — наименование страховщика.
        4. policyholder — наименование страхователя.
        5. insured_person — застрахованное лицо (если отличается от страхователя).
        6. beneficiary — выгодоприобретатель.
        7. insured_object — объект страхования (имущество, интерес, жизнь, здоровье, ответственность).
        8. insured_event — страховой случай или риск.
        9. sum_insured — страховая сумма.
        10. premium — страховая премия.
        11. term — срок страхования.

        Если данные отсутствуют в тексте:
        - текстовое поле = "not_defined"
        </task>

        <rules>
        - Используй только текст договора.
        - Не делай предположений.
        - insurance_type:
            - "property" — имущественное страхование.
            - "personal" — личное страхование.
            - "liability" — страхование ответственности.
            - "mixed" — несколько видов одновременно.
            - "unclear" — тип неясен.
            - "not_defined" — нет данных.
        - Верни только JSON.
        </rules>
      fields:
        - name: "insurance_type"
          type: "string"
          presentation: "signal"
          allowed_values: ["property", "personal", "liability", "mixed", "unclear", "not_defined"]
          description: "Тип страхования."
          required: true
        - name: "policy_number"
          type: "string"
          presentation: "fact"
          label: "Номер полиса"
          description: "Номер полиса или договора страхования."
          required: false
          display_in_grid: true
          display_priority: 1
        - name: "insurer"
          type: "string"
          presentation: "fact"
          label: "Страховщик"
          description: "Наименование страховщика."
          required: true
          display_in_grid: true
          display_priority: 2
        - name: "policyholder"
          type: "string"
          presentation: "fact"
          label: "Страхователь"
          description: "Наименование страхователя."
          required: true
          display_in_grid: true
          display_priority: 3
        - name: "insured_person"
          type: "string"
          presentation: "fact"
          label: "Застрахованное лицо"
          description: "Застрахованное лицо (если отличается от страхователя)."
          required: false
          display_in_grid: false
        - name: "beneficiary"
          type: "string"
          presentation: "fact"
          label: "Выгодоприобретатель"
          description: "Выгодоприобретатель по договору страхования."
          required: false
          display_in_grid: true
          display_priority: 4
        - name: "insured_object"
          type: "string"
          presentation: "fact"
          label: "Объект страхования"
          description: "Объект страхования (имущество, интерес, жизнь, здоровье, ответственность)."
          required: true
          display_in_grid: true
          display_priority: 5
        - name: "insured_event"
          type: "string"
          presentation: "fact"
          label: "Страховой случай"
          description: "Страховой случай или риск."
          required: true
          display_in_grid: true
          display_priority: 6
        - name: "sum_insured"
          type: "string"
          presentation: "fact"
          label: "Страховая сумма"
          description: "Страховая сумма."
          required: true
          display_in_grid: true
          display_priority: 7
        - name: "premium"
          type: "string"
          presentation: "fact"
          label: "Страховая премия"
          description: "Страховая премия."
          required: false
          display_in_grid: true
          display_priority: 8
        - name: "term"
          type: "string"
          presentation: "fact"
          label: "Срок страхования"
          description: "Срок страхования."
          required: true
          display_in_grid: true
          display_priority: 9
      store_payload: true

  # ──────────────────────────────────────────────────────────────────────────
  # CHECK 2: Страховой случай и исключения из покрытия
  # ──────────────────────────────────────────────────────────────────────────
  - id: insured_event_and_exclusions_check
    name: "Страховой случай и исключения из покрытия"
    description: >
      Проверяет ясность определения страхового случая и прозрачность исключений
      из страхового покрытия.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "страховой случай"
        - "страховой риск"
        - "не является страховым случаем"
        - "исключения из страхового покрытия"
        - "отказ в выплате"
        - "умысел"
        - "грубая неосторожность"
        - "военные действия"
        - "ядерный взрыв"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)не\\s+является\\s+страхов(ым|ым\\s+случаем)"
        - "(?i)исключени[яе].{0,40}покрыт"
        - "(?i)выплата\\s+не\\s+производится"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор страхования по Главе 48 ГК РФ.
        Проверяется только один вопрос: определение страхового случая и исключений из покрытия.

        Нормативный ориентир:
        - ст. 942 ГК РФ — существенные условия договора страхования
        - ст. 963 ГК РФ — основания освобождения от выплаты

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора.
        - Не оценивай серьёзность риска.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Определён ли страховой случай.
        2. Есть ли перечень исключений из покрытия.
        3. Насколько ясно сформулированы исключения.
        4. Есть ли признаки открытых или размытых исключений.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Если условие не указано прямо — возвращай "not_defined".
        3. Если текстового значения нет — возвращай "not_defined".
        4. Не используй "None", "null", "not_defined" или пустые строки.
        5. В evidence включай только текст договора.
        6. Верни только один JSON-объект.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — исключения чёткие:
        Фрагмент:
        "Страховым случаем является пожар, залив, взрыв. Не являются страховыми случаями:
        военные действия, терроризм, ядерный взрыв, умысел страхователя."

        Ответ:
        {
          "insured_event_defined": "yes",
          "exclusions_present": "yes",
          "exclusions_clarity": "clear",
          "contains_open_ended_exclusions": "no",
          "key_exclusions_summary": "военные действия, терроризм, ядерный взрыв, умысел страхователя"
        }

        Пример 2 — исключения размытые:
        Фрагмент:
        "Страховым случаем признаётся событие. Страховщик вправе отказать в выплате в иных случаях, предусмотренных законодательством."

        Ответ:
        {
          "insured_event_defined": "unclear",
          "exclusions_present": "yes",
          "exclusions_clarity": "vague",
          "contains_open_ended_exclusions": "yes",
          "key_exclusions_summary": "иные случаи, предусмотренные законодательством"
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о страховом случае.
        2. Найди прямую цитату об исключениях.
        3. Если исключения сформулированы через "иные", "по усмотрению" — ставь "vague".
        4. Не выводи отсутствующие исключения.

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "insured_event_defined": "<yes / no / unclear>",
          "exclusions_present": "<yes / no>",
          "exclusions_clarity": "<clear / vague / not_found>",
          "contains_open_ended_exclusions": "<yes / no / unclear>",
          "key_exclusions_summary": "<текст или not_found>"
        }
      context_k: 7
      temperature: 0.0
      max_tokens: 500

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
