           "present" — исключения прямо описаны (например, исключая зоны военных действий);
           "absent" — исключения отсутствуют;
           "not_defined" — территория покрытия не определена.
        </task>

        <context_rules>
        - Используй только текст договора из <context>. Не подставляй нормы
          закона вместо текста договора.
        - Если указан точный физический адрес нахождения имущества (склад, офис),
          выбирай "specified_countries" для territory_scope.
        - Не делай предположений сверх того, что прямо следует из текста.
        - Не используй "not_found" — все отсутствующие значения должны строго
          принимать "not_defined".
        </context_rules>

        <output_expectations>
        - Все 4 ключа (3 поля + evidence) должны присутствовать в ответе.
        - Запрещены значения: null, None, "", "not_found".
        - Для territory_defined допустимо только: yes / no / not_defined.
        - Для territory_scope допустимо только: russia / cis / worldwide / specified_countries / not_defined.
        - Для territorial_exclusions допустимо только: present / absent / not_defined.
        - Верни РОВНО один JSON-объект со всеми 4 ключами без какого-либо
          дополнительного текста до или после. Начни ответ сразу с открывающей
          фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки,
          код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга
          через json.loads без предварительной обработки.
        </output_expectations>
      fields:
        - name: "territory_defined"
          type: "string"
          presentation: "signal"
          allowed_values: ["yes", "no", "not_defined"]
          label: "Территория покрытия определена"
          description: "Определена ли в договоре географическая территория страхового покрытия."
          required: true
          display_in_grid: true
          display_priority: 1
        - name: "territory_scope"
          type: "string"
          presentation: "signal"
          allowed_values: ["russia", "cis", "worldwide", "specified_countries", "not_defined"]
          label: "Географический охват"
          description: "Географический охват страховой защиты (Россия, СНГ, Весь мир, конкретные адреса)."
          required: true
          display_in_grid: true
          display_priority: 2
        - name: "territorial_exclusions"
          type: "string"
          presentation: "signal"
          allowed_values: ["present", "absent", "not_defined"]
          label: "Исключения из территории"
          description: "Наличие территориальных исключений (зон, где покрытие не действует)."
          required: true
          display_in_grid: true
          display_priority: 3
    store_payload: true

  - id: claims_made_vs_occurrence_check
    name: "Базис покрытия: claims-made vs. occurrence"
    description: >
      Проверяет базис страхового покрытия для договоров страхования ответственности
      (D&O, профессиональная ответственность, гражданская ответственность):
      claims-made (на базе предъявления требований) vs. occurrence (на базе наступления
      события), наличие и дату ретроактивного покрытия, а также дополнительный период
      извещения (ERP).
      Критически важно: при claims-made отсутствие ретроактивной даты («с даты подписания»)
      или отсутствие ERP лишает страхователя защиты по прошлым событиям или поздним искам.
    triggers:
      any:
        - liability_insurance
        - d_and_o_insurance
        - claims_made_basis
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "claims made"
        - "на базе предъявленных требований"
        - "на базе заявления претензий"
        - "occurrence"
        - "на базе происшествия"
        - "на базе наступления события"
        - "ретроактивная дата"
        - "extended reporting period"
        - "дополнительный период"
        - "период обнаружения"
        - "retroactive date"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)claims[- ]?made"
        - "(?i)occurrence"
        - "(?i)ретроактивн(ая|ой|ую)\\s+дат"
        - "(?i)дополнительн(ый|ого)\\s+период"
        - "(?i)период\\s+обнаружения"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор страхования ответственности (D&O, профессиональная
        ответственность, ответственность директоров, гражданская ответственность).
        Проверяется только один вопрос: базис страхового покрытия (claims-made vs. occurrence),
        ретроактивная дата и дополнительный период извещения (ERP).

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора.
        - Не оценивай серьёзность риска субъективно — следуй жестким юридическим правилам.
        - Учитывай российскую и международную практику страхования ответственности:
          * "occurrence" — классический базис (событие должно произойти в период страхования);
          * "claims_made" — требование должно быть заявлено в период страхования при условии,
            что действие совершено после ретроактивной даты.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Базис страхового покрытия (claims_made, occurrence, mixed или unclear).
        2. Ретроактивную дату (для claims-made).
        3. Наличие дополнительного периода уведомления (Extended Reporting Period / ERP).
        4. Продолжительность ERP (срок в месяцах/днях).
        5. Оценку юридического риска выбранной конструкции базиса (high / medium / low).

        [ПРАВИЛА]
        1. Используй только текст документа. Не подставляй нормы закона вместо
           текста договора.
        2. Если условие не указано прямо и не следует однозначно из текста —
           возвращай "not_defined".
        3. Не используй "None", "null", пустые строки. Не используй "not_found".
        4. "claims_made" — страховым случаем признается предъявление письменной
           претензии/иска в течение срока действия договора.
        5. "occurrence" — страховым случаем признается причинение вреда/наступление
           события в период действия договора, независимо от даты иска.
        6. "mixed" — используются элементы обоих базисов.
        7. Для retroactive_date: если указана конкретная дата — верни её строкой;
           если прямо написано "не установлена" / "с даты заключения" — верни "none";
           если договор на базе occurrence — верни "not_applicable".
        8. Для extended_reporting_period: "present" (предусмотрен), "absent" (не предусмотрен),
           "not_applicable" (при occurrence).
        9. Правила присвоения coverage_basis_risk:
           * "low" — если выбран базис occurrence, ЛИБО claims-made с ранней ретроактивной
             датой И наличием ERP;
           * "medium" — если claims-made с ретроактивной датой, но без ERP;
           * "high" — если claims-made без ретроактивной даты (или ретро-дата совпадает
             с датой начала полиса), ЛИБО базис неясен.
        10. В evidence включай только текст договора.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — полный claims-made с ретро-датой и ERP (низкий риск):
        Фрагмент:
        "Договор страхования ответственности директоров заключён на базе предъявления
        требований (claims-made). Ретроактивная дата — 01.01.2020. Дополнительный
        период для заявления претензий (Extended Reporting Period) составляет 24 месяца
        с даты окончания срока действия договора."

        Ответ:
        {
          "coverage_basis": "claims_made",
          "retroactive_date": "01.01.2020",
          "extended_reporting_period": "present",
          "erp_duration": "24 месяца",
          "coverage_basis_risk": "low",
          "evidence": "Договор страхования ответственности директоров заключён на базе предъявления требований (claims-made). Ретроактивная дата — 01.01.2020. Дополнительный период для заявления претензий (Extended Reporting Period) составляет 24 месяца с даты окончания срока действия договора."
        }

        Пример 2 — базис occurrence:
        Фрагмент:
        "Страхование распространяется на случаи причинения вреда третьим лицам,
        происшедшие в период действия настоящего полиса (базис occurrence)."

        Ответ:
        {
          "coverage_basis": "occurrence",
          "retroactive_date": "not_applicable",
          "extended_reporting_period": "not_applicable",
          "erp_duration": "not_defined",
          "coverage_basis_risk": "low",
          "evidence": "Страхование распространяется на случаи причинения вреда третьим лицам, происшедшие в период действия настоящего полиса (базис occurrence)."
        }

        Пример 3 — опасный claims-made (без ретро-даты и без ERP):
        Фрагмент:
        "Покрытие предоставляется в отношении претензий, впервые заявленных
        Страхователю в период действия договора. Ретроактивная дата совпадает
        с датой вступления договора в силу. Возможность продления периода
        уведомления не предусмотрена."

        Ответ:
        {
          "coverage_basis": "claims_made",
          "retroactive_date": "none",
          "extended_reporting_period": "absent",
          "erp_duration": "not_defined",
          "coverage_basis_risk": "high",
          "evidence": "Покрытие предоставляется в отношении претензий, впервые заявленных Страхователю в период действия договора. Ретроактивная дата совпадает с датой вступления договора в силу. Возможность продления периода уведомления не предусмотрена."
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о базисе покрытия (claims-made / occurrence).
        2. Если claims-made — найди прямую цитату о ретроактивной дате и ERP.
        3. Проверь логику риска: claims-made без ретро-даты = "high", occurrence = "low".
        4. Проверь, что все 6 ключей (5 полей + evidence) присутствуют в JSON.

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь РОВНО одним JSON-объектом без какого-либо дополнительного текста
        до или после, со всеми 6 ключами (5 полей + evidence):
        {
          "coverage_basis": "<claims_made / occurrence / mixed / unclear / not_defined>",
          "retroactive_date": "<дата / none / not_applicable / not_defined>",
          "extended_reporting_period": "<present / absent / not_applicable / not_defined>",
          "erp_duration": "<срок или not_defined>",
          "coverage_basis_risk": "<high / medium / low / not_defined>",
          "evidence": "<прямая цитата из договора>"
        }
      context_k: 7
      temperature: 0.0
      max_tokens: 650

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "базис покрытия claims made occurrence на базе предъявленных требований на базе происшествия ретроактивная дата дополнительный период extended reporting period период обнаружения"
      boost_keywords:
        - "claims made"
        - "occurrence"
        - "ретроактивная дата"
        - "дополнительный период"
      preferred_unit_types:
        - obligation
        - general_provision
        - definition
        - structural_anchor
      excluded_unit_types:
        - technical_fragment
      preferred_clause_functions:
        - definitions
        - obligations
        - limitations
        - procedures
      negative_keywords:
        - "оглавление"
        - "индекс"
      position_bias:
        preferred_range: [0.10, 0.80]
        boost: 0.12
        scope: segment
      context_k: 7
      max_chunks: 10
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
        - "invoice"
      preferred_clause_functions:
        - "definitions"
        - "obligations"
        - "limitations"
        - "procedures"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 35
      max_snippet_length: 500

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 750
      compact_output: false

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист по договорной работе. Твоя задача — извлечь из текста
        договора страхования ответственности сведения о базисе страхового покрытия
        (claims-made vs. occurrence), ретроактивной дате, дополнительном периоде
        извещения (ERP) и оценить связанный с этим юридический риск.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие 5 полей + evidence (всего 6 ключей):

        1. coverage_basis — базис страхового покрытия:
           "claims_made" — покрытие на базе предъявления требований;
           "occurrence" — покрытие на базе наступления события/причинения вреда;
           "mixed" — смешанный базис;
           "unclear" — условия сформулированы противоречиво;
           "not_defined" — базис покрытия в тексте не определен.
        2. retroactive_date — ретроактивная дата для claims-made:
           строка с датой (например, "01.01.2020");
           "none" — если ретроактивное покрытие исключено (с даты полиса);
           "not_applicable" — для базиса occurrence;
           "not_defined" — если базис claims-made, но дата не указана.
        3. extended_reporting_period — наличие дополнительного периода уведомления (ERP):
           "present" — предусмотрен;
           "absent" — прямо исключен или отсутствует при claims-made;
           "not_applicable" — для базиса occurrence;
           "not_defined" — не определено.
        4. erp_duration — продолжительность дополнительного периода (например, "12 месяцев").
           Если не предусмотрен или неприменим — "not_defined".
        5. coverage_basis_risk — интегральная оценка риска конструкции:
           "low" — occurrence ЛИБО claims-made с ретроактивной датой И с ERP;
           "medium" — claims-made с ретроактивной датой, но без ERP;
           "high" — claims-made без ретроактивной даты (с даты начала договора)
           или при отсутствии защиты по прошлым действиям;
           "not_defined" — базис не определен.
        </task>

        <context_rules>
        - Используй только текст договора из <context>. Не подставляй нормы
          закона вместо текста договора.
        - При occurrence ретроактивная дата и ERP не требуются ("not_applicable").
        - Не используй "not_found" — все отсутствующие значения должны принимать
          "not_defined".
        - Не делай предположений сверх того, что прямо следует из текста.
        </context_rules>

        <output_expectations>
        - Все 6 ключей (5 полей + evidence) должны присутствовать в ответе.
        - Запрещены значения: null, None, "", "not_found".
        - Для coverage_basis допустимо только: claims_made / occurrence / mixed / unclear / not_defined.
        - Для retroactive_date допустимо: конкретная дата / none / not_applicable / not_defined.
        - Для extended_reporting_period допустимо: present / absent / not_applicable / not_defined.
        - Для erp_duration допустимо: конкретный текст или not_defined.
        - Для coverage_basis_risk допустимо: high / medium / low / not_defined.
        - Верни РОВНО один JSON-объект со всеми 6 ключами без какого-либо
          дополнительного текста до или после. Начни ответ сразу с открывающей
          фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки,
          код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга
          через json.loads без предварительной обработки.
        </output_expectations>
      fields:
        - name: "coverage_basis"
          type: "string"
          presentation: "signal"
          allowed_values: ["claims_made", "occurrence", "mixed", "unclear", "not_defined"]
          label: "Базис страхового покрытия"
          description: "Базис действия страхового покрытия: claims-made (предъявление требований) или occurrence (наступление события)."
          required: true
          display_in_grid: true
          display_priority: 1
        - name: "retroactive_date"
          type: "string"
          presentation: "fact"
          label: "Ретроактивная дата"
          description: "Дата, начиная с которой совершенные действия покрываются договором (для claims-made)."
          required: true
          display_in_grid: true
          display_priority: 2
        - name: "extended_reporting_period"
          type: "string"
          presentation: "signal"
          allowed_values: ["present", "absent", "not_applicable", "not_defined"]
          label: "Дополнительный период (ERP)"
          description: "Наличие права на дополнительный период уведомления о претензиях после окончания договора."
          required: true
          display_in_grid: true
          display_priority: 3
        - name: "erp_duration"
          type: "string"
          presentation: "fact"
          label: "Длительность ERP"
          description: "Продолжительность дополнительного периода извещения (Extended Reporting Period)."
          required: true
          display_in_grid: true
          display_priority: 4
        - name: "coverage_basis_risk"
          type: "string"
          presentation: "signal"
          allowed_values: ["high", "medium", "low", "not_defined"]
          label: "Уровень риска базиса"
          description: "Оценка риска условий покрытия: high (claims-made без ретро-даты), medium, low (occurrence или claims-made с ретро-датой и ERP)."
          required: true
          display_in_grid: true
          display_priority: 5
    store_payload: true

  - id: insurer_identification_and_license
    name: "Страховщик: идентификация и лицензия"
    description: >
      Проверяет наличие в тексте договора ссылки на лицензию страховщика,
      выданную Банком России (ЦБ РФ), и извлекает её реквизиты (номер, серию, дату).
      Критически важно: по ст. 938 ГК РФ и ст. 32 Закона РФ от 27.11.1992
      № 4015-1 «Об организации страхового дела в РФ» страховщиком может быть
      только юридическое лицо, имеющее действующую лицензию Банка России.
      Договор, заключенный лицом без лицензии, ничтожен (ст. 168 ГК РФ).
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "лицензия"
        - "лицензия банка россии"
        - "лицензия цб рф"
        - "лицензия цб"
        - "реестр субъектов страхового дела"
        - "серия сл"
        - "серия си"
        - "серия ос"
        - "серия пс"
        - "страховой деятельности"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)лиценз[ияе].{0,50}(банка\\s+россии|цб|центрального\\s+банка)"
        - "(?i)(?:серия|№)\\s*(?:сл|си|ос|пс)\\s*\\d+"
        - "(?i)реестр.{0,30}субъект.{0,20}страхов"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор страхования по Главе 48 ГК РФ.
        Проверяется только один вопрос: наличие ссылки на лицензию страховщика
        и её конкретные реквизиты (номер, серия, дата выдачи, орган).

        Нормативный ориентир:
        - ст. 938 ГК РФ — требования к страховщику (лицензия)
        - ст. 32 Закона РФ от 27.11.1992 № 4015-1 — лицензирование страховой деятельности.
          Типичные серии лицензий Банка России: СЛ (личное страхование), СИ (имущественное),
          ОС (обязательное), ПС (перестрахование).

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора.
        - Не оценивай степень риска субъективно.
        - Реквизиты лицензии могут быть указаны как в преамбуле договора, так и
          в заключительном разделе «Реквизиты и подписи сторон».

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Указана ли ссылка на лицензию страховщика.
        2. Номер и серию лицензии (например, "СИ № 1234").
        3. Дату выдачи лицензии.
        4. Орган, выдавший лицензию (обычно Банк России, ЦБ РФ, ФСФР, Росстрахнадзор).
        5. Цитату из договора, подтверждающую выводы.

        [ПРАВИЛА]
        1. Используй только текст документа. Не подставляй нормы закона вместо
           текста договора.
        2. Если условие не указано прямо и не следует однозначно из текста —
           возвращай "not_defined" в фактологических полях и "not_defined" в сигнальных.
        3. Не используй "None", "null", пустые строки. Не используй "not_found".
        4. "defined" — в договоре есть упоминание лицензии страховщика (даже без номера).
        5. "not_defined" — лицензия страховщика в тексте договора вообще не упомянута.
        6. В evidence включай только текст договора.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — лицензия полностью указана:
        Фрагмент:
        "Страховщик — АО «Страховая компания Опора», действующий на основании Лицензии
        Банка России СИ № 4321 от 12.10.2021 на осуществление добровольного имущественного
        страхования."

        Ответ:
        {
          "license_reference_status": "defined",
          "license_number": "СИ № 4321",
          "license_date": "12.10.2021",
          "licensing_authority": "Банк России",
          "license_summary": "Лицензия Банка России СИ № 4321 от 12.10.2021",
          "evidence": "АО «Страховая компания Опора», действующий на основании Лицензии Банка России СИ № 4321 от 12.10.2021 на осуществление добровольного имущественного страхования."
        }

        Пример 2 — данные полностью отсутствуют:
        Фрагмент:
        "Страховщик обязуется выплатить страховое возмещение при наступлении случая."

        Ответ:
        {
          "license_reference_status": "not_defined",
          "license_number": "not_defined",
          "license_date": "not_defined",
          "licensing_authority": "not_defined",
          "license_summary": "Не установлено — сведения о лицензии страховщика отсутствуют.",
          "evidence": "Страховщик обязуется выплатить страховое возмещение при наступлении случая."
        }

        Пример 3 — частичные данные (есть ссылка без номера и даты):
        Фрагмент:
        "Страховщик — ООО «Резерв», действующий на основании лицензии ЦБ РФ на право
        осуществления страховой деятельности."

        Ответ:
        {
          "license_reference_status": "defined",
          "license_number": "not_defined",
          "license_date": "not_defined",
          "licensing_authority": "ЦБ РФ",
          "license_summary": "Лицензия ЦБ РФ (номер и дата не указаны)",
          "evidence": "Страховщик — ООО «Резерв», действующий на основании лицензии ЦБ РФ на право осуществления страховой деятельности."
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о лицензии страховщика в преамбуле или реквизитах.
        2. Извлеки серию и номер лицензии (обращай внимание на аббревиатуры СЛ, СИ, ОС, ПС).
        3. Проверь, что все 6 ключей (5 полей + evidence) присутствуют в JSON.

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь РОВНО одним JSON-объектом без какого-либо дополнительного текста
        до или после, со всеми 6 ключами (5 полей + evidence):
        {
          "license_reference_status": "<defined / not_defined>",
          "license_number": "<номер или not_defined>",
          "license_date": "<дата или not_defined>",
          "licensing_authority": "<орган или not_defined>",
          "license_summary": "<краткое описание или fallback>",
          "evidence": "<прямая цитата из договора>"
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 500

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "лицензия страховщик банк россии цб рф реестр субъектов страхового дела серия сл серия си страховая деятельность"
      boost_keywords:
        - "лицензия"
        - "банк россии"
        - "реестр субъектов страхового дела"
      preferred_unit_types:
        - general_provision
        - structural_anchor
        - definition
      excluded_unit_types:
        - technical_fragment
      preferred_clause_functions:
        - boilerplate
        - representations
        - definitions
      negative_keywords:
        - "оглавление"
        - "индекс"
      position_bias:
        preferred_range: [0.0, 1.0]
        boost: 0.10
        scope: segment
      context_k: 6
      max_chunks: 8
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
        - "invoice"
      preferred_clause_functions:
        - "boilerplate"
        - "representations"
        - "definitions"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 30
      max_snippet_length: 400

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 600
      compact_output: false

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист по договорной работе. Твоя задача — извлечь из текста
        договора страхования реквизиты лицензии страховщика (номер, серия, дата выдачи,
        орган лицензирования) и установить факт её наличия в договоре.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие 5 полей + evidence (всего 6 ключей):

        1. license_reference_status — статус наличия ссылки на лицензию страховщика в тексте:
           "defined" — ссылка на лицензию страховщика присутствует (в преамбуле или реквизитах);
           "not_defined" — лицензия страхователем в тексте вообще не упомянута.
        2. license_number — серия и номер лицензии страховщика (например, "СЛ № 1421", "СИ № 3290").
           Если серия и номер отсутствуют — "not_defined".
        3. license_date — дата выдачи лицензии страховщика (в формате DD.MM.YYYY или текстом).
           Если дата не указана — "not_defined".
        4. licensing_authority — орган, выдавший лицензию страховщика:
           "Банк России" (ЦБ РФ, Центральный банк), "ФСФР", "Росстрахнадзор" или иное название.
           Если орган не указан — "not_defined".
        5. license_summary — итоговое краткое описание лицензии одной строкой для DD Grid
           (например, "Лицензия Банка России СИ № 4321 от 12.10.2021").
           Если сведения о лицензии отсутствуют — "Не установлено".
        </task>

        <context_rules>
        - Используй только текст договора из <context>. Не подставляй нормы
          закона вместо текста договора.
        - Ищи реквизиты лицензии как в начале договора (преамбула), так и в самом конце
          (в разделе реквизитов и подписей сторон).
        - Не используй "not_found" — все отсутствующие значения должны принимать
          "not_defined".
        - Не делай предположений сверх того, что прямо следует из текста.
        </context_rules>

        <output_expectations>
        - Все 6 ключей (5 полей + evidence) должны присутствовать в ответе.
        - Запрещены значения: null, None, "", "not_found".
        - Для license_reference_status допустимо только: defined / not_defined.
        - Для license_number, license_date, licensing_authority допустимо: конкретный текст или not_defined.
        - Fallback для license_summary: "Не установлено".
        - Верни РОВНО один JSON-объект со всеми 6 ключами без какого-либо
          дополнительного текста до или после. Начни ответ сразу с открывающей
          фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки,
          код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга
          через json.loads без предварительной обработки.
        </output_expectations>
      fields:
        - name: "license_reference_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          label: "Лицензия страховщика"
          description: "Наличие в тексте договора ссылки на лицензию страховщика."
          required: true
          display_in_grid: true
          display_priority: 1
        - name: "license_number"
          type: "string"
          presentation: "fact"
          label: "Номер лицензии"
          description: "Серия и номер лицензии страховщика (СЛ, СИ, ОС, ПС)."
          required: true
          display_in_grid: true
          display_priority: 2
        - name: "license_date"
          type: "string"
          presentation: "fact"
          label: "Дата выдачи"
          description: "Дата выдачи лицензии страховщика."
          required: true
          display_in_grid: true
          display_priority: 3
        - name: "licensing_authority"
          type: "string"
          presentation: "fact"
          label: "Орган выдачи"
          description: "Орган, выдавший лицензию страховщика (Банк России, ЦБ РФ)."
          required: true
          display_in_grid: true
          display_priority: 4
        - name: "license_summary"
          type: "string"
          presentation: "fact"
          label: "Описание лицензии"
          description: "Краткое описание лицензии страховщика для DD Grid."
          required: true
          display_in_grid: true
          display_priority: 5
    store_payload: true

  - id: premium_and_payment_order
    name: "Страховая премия: размер и порядок уплаты"
    description: >
      Проверяет порядок уплаты страховой премии: форму оплаты (единовременно
      или в рассрочку/взносами), конкретные сроки платежей, последствия просрочки
      уплаты очередного взноса (ст. 954 ГК РФ), а также условие о моменте
      вступления договора в силу (ст. 957 ГК РФ).
      Критически важно для российской практики: по п. 1 ст. 957 ГК РФ договор
      страхования по умолчанию вступает в силу в момент уплаты премии, если
      стороны прямо не согласовали вступление в силу с момента подписания.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "страховая премия"
        - "страховой взнос"
        - "уплатить премию"
        - "единовременно"
        - "в рассрочку"
        - "график платежей"
        - "вступление в силу"
        - "просрочка уплаты"
        - "приостановление покрытия"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)(страховая\\s+премия|страховой\\s+взнос)"
        - "(?i)вступ(ает|ит)\\s+в\\s+силу"
        - "(?i)просрочк[аи]\\s+уплат[ыи]"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор страхования по Главе 48 ГК РФ.
        Проверяется только один вопрос: порядок уплаты страховой премии,
        момент вступления договора в силу и последствия просрочки уплаты взносов.

        Нормативный ориентир:
        - ст. 954 ГК РФ — страховая премия и страховые взносы
        - ст. 957 ГК РФ — вступление в силу договора страхования

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора.
        - Не оценивай степень риска субъективно.
        - Учитывай российскую практику: если рассрочка установлена, крайне
          важно определить последствия неуплаты очередного взноса (приостановление
          покрытия, право на расторжение или зачет взноса при выплате).

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Форму уплаты премии (единовременно или в рассрочку/взносами).
        2. Срок уплаты премии или график уплаты очередных взносов.
        3. Условие о моменте вступления договора в силу (с момента уплаты
           премии/взноса, с момента подписания или с конкретной даты).
        4. Последствия просрочки уплаты премии или очередного взноса.
        5. Цитату из договора, подтверждающую выводы.

        [ПРАВИЛА]
        1. Используй только текст документа. Не подставляй нормы закона
           вместо текста договора.
        2. Если условие не указано прямо и не следует однозначно из текста —
           возвращай "not_defined".
        3. Не используй "None", "null", пустые строки. Не используй "not_found".
        4. "single" — премия уплачивается единовременным платежом.
        5. "installments" — премия уплачивается в рассрочку (несколькими взносами).
        6. "upon_payment" — договор вступает в силу с момента оплаты премии/первого взноса.
        7. "upon_signing" — договор вступает в силу с момента подписания (независимо от оплаты).
        8. "specified_date" — вступает в силу с конкретно указанной в тексте даты.
        9. В evidence включай только текст договора.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — единовременная оплата, вступление в силу при оплате:
        Фрагмент:
        "Страховая премия составляет 50 000 рублей и уплачивается Страхователем
        единовременно в течение 5 рабочих дней с даты подписания договора.
        Договор вступает в силу с момента уплаты страховой премии. В случае
        неоплаты премии в установленный срок договор считается не вступившим в силу."

        Ответ:
        {
          "payment_form": "single",
          "premium_due_date": "в течение 5 рабочих дней с даты подписания",
          "contract_effective_condition": "upon_payment",
          "late_payment_consequences": "договор считается не вступившим в силу (аннулируется)",
          "premium_payment_summary": "Единовременная оплата в течение 5 рабочих дней. Вступает в силу с момента уплаты премии, при неоплате аннулируется.",
          "evidence": "Страховая премия составляет 50 000 рублей и уплачивается Страхователем единовременно в течение 5 рабочих дней с даты подписания договора. Договор вступает в силу с момента уплаты страховой премии."
        }

        Пример 2 — рассрочка взносов, вступление в силу с даты подписания:
        Фрагмент:
        "Договор вступает в силу с момента его подписания Сторонами. Оплата
        премии производится в рассрочку: первый взнос 10 000 рублей — до 15.01.2026,
        второй взнос 10 000 рублей — до 15.06.2026. При просрочке уплаты очередного
        взноса более чем на 10 дней Страховщик вправе приостановить действие
        страхового покрытия."

        Ответ:
        {
          "payment_form": "installments",
          "premium_due_date": "1-й взнос до 15.01.2026, 2-й взнос до 15.06.2026",
          "contract_effective_condition": "upon_signing",
          "late_payment_consequences": "право Страховщика приостановить страховое покрытие при просрочке уплаты взноса более чем на 10 дней",
          "premium_payment_summary": "Оплата в рассрочку (2 взноса). Вступает в силу с момента подписания. При просрочке очередного взноса более 10 дней — приостановление покрытия.",
          "evidence": "Договор вступает в силу с момента его подписания Сторонами. Оплата премии производится в рассрочку: первый взнос 10 000 рублей — до 15.01.2026, второй взнос 10 000 рублей — до 15.06.2026. При просрочке уплаты очередного взноса более чем на 10 дней Страховщик вправе приостановить действие страхового покрытия."
        }

        Пример 3 — данные отсутствуют:
        Фрагмент:
        "Страхователь обязан оплатить страхование в соответствии с тарифами."

        Ответ:
        {
          "payment_form": "not_defined",
          "premium_due_date": "not_defined",
          "contract_effective_condition": "not_defined",
          "late_payment_consequences": "not_defined",
          "premium_payment_summary": "Не установлено — условия уплаты премии и вступления договора в силу не раскрыты.",
          "evidence": "Страхователь обязан оплатить страхование в соответствии с тарифами."
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о сроке/условиях уплаты премии.
        2. Найди прямую цитату о моменте вступления договора в силу.
        3. Найди последствия неоплаты (приостановление, расторжение, зачет взноса).
        4. Проверь, что все 6 ключей (5 полей + evidence) присутствуют в JSON.

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь РОВНО одним JSON-объектом без какого-либо дополнительного текста
        до или после, со всеми 6 ключами (5 полей + evidence):
        {
          "payment_form": "<single / installments / not_defined>",
          "premium_due_date": "<срок или график или not_defined>",
          "contract_effective_condition": "<upon_payment / upon_signing / specified_date / not_defined>",
          "late_payment_consequences": "<последствия или не указаны (not_defined)>",
          "premium_payment_summary": "<краткое описание порядка расчетов>",
          "evidence": "<прямая цитата из договора>"
        }
      context_k: 8
      temperature: 0.0
      max_tokens: 700

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "страховая премия страховой взнос порядок уплаты срок оплаты взносов график платежей рассрочка единовременно вступает в силу последствия просрочки уплаты приостановление покрытия"
      boost_keywords:
        - "страховая премия"
        - "срок оплаты"
        - "вступает в силу"
        - "просрочка уплаты"
      preferred_unit_types:
        - obligation
        - general_provision
        - definition
        - structural_anchor
      excluded_unit_types:
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - procedures
        - limitations
      negative_keywords:
        - "оглавление"
        - "индекс"
      position_bias:
        preferred_range: [0.10, 0.85]
        boost: 0.15
        scope: segment
      context_k: 8
      max_chunks: 10
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
