# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 4: CHECKS_V8 — единственный рабочий слой юридического анализа
#  Читается: DocTypeCheckLoader._load_doc_type_checks()
# ════════════════════════════════════════════════════════════════════════════

checks_v8:


  - id: insurance_subject_extraction
    name: "Базовое извлечение предмета и конструкции страхования"
    description: >
      Извлекает базовую конструкцию договора страхования: тип страхования,
      стороны (страховщик, страхователь), застрахованное лицо, выгодоприобретателя,
      объект страхования, страховой случай, страховую сумму, страховую премию и срок.
      Учитывает российскую практику: возможность определения объекта / страхового
      случая через отсылку к Правилам страхования, Приложениям, Спецификациям;
      различие страхования имущественного, личного и ответственности.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "страховщик"
        - "страхователь"
        - "объект страхования"
        - "страховой случай"
        - "страховая сумма"
        - "страховая премия"
        - "выгодоприобретатель"
        - "застрахованное лицо"
        - "срок страхования"
        - "срок действия договора"
        - "правила страхования"
        - "в пользу"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)(страховщик|страхователь|страховой\\s+случай)"
        - "(?i)(страховая\\s+сумма|страховая\\s+премия)"
        - "(?i)(?:полис|договор)\\s*№?\\s*[A-ZА-Я0-9\\-\\/]+"
        - "(?i)правил[а-я]*\\s+страхования"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор страхования по Главе 48 ГК РФ (ст. 927–970)
        и Закону РФ от 27.11.1992 № 4015-1 «Об организации страхового дела в РФ».
        Проверяется только один вопрос: базовая структура договора страхования.

        Важно:
        - Твоя задача — установить, что прямо есть в тексте договора,
          а чего прямо нет.
        - Не оценивай серьёзность риска.
        - Учитывай российскую практику: часть параметров может определяться
          через отсылку к Правилам страхования, Приложениям, Спецификациям.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Тип страхования (имущественное / личное / ответственности / смешанное).
        2. Номер полиса/договора.
        3. Страховщик.
        4. Страхователь.
        5. Застрахованное лицо (если отличается от страхователя).
        6. Выгодоприобретатель.
        7. Объект страхования.
        8. Страховой случай / застрахованный риск.
        9. Страховая сумма.
        10. Страховая премия.
        11. Срок страхования / срок действия договора.
        12. Итоговое краткое summary для юриста.
        13. Человекочитаемое обозначение типа страхования.

        [ПРАВИЛА]
        1. Используй только текст документа. Не подставляй нормы закона вместо
           текста договора.
        2. Если данные не указаны прямо и не следуют однозначно из текста —
           возвращай "not_defined" в технических полях и "Не установлено" /
           "Не установлен" / "Не установлена" в user-facing полях.
        3. Если параметр определён через отсылку к внешнему документу
           (Правила страхования, Приложение, Спецификация, полис) — возвращай
           формулировку вида "Согласно Правилам страхования № X от DD.MM.YYYY"
           или "Согласно Приложению № N", а не "not_defined".
        4. Если параметр неприменим по типу страхования (например,
           застрахованное лицо у страхования имущества юрлица; выгодоприобретатель
           у страхования собственного имущества без указания третьего лица) —
           возвращай "Не применимо".
        5. Если текст есть, но однозначный вывод невозможен из-за противоречия,
           двусмысленности или неполноты — возвращай "Не удалось определить".
        6. Если застрахованное лицо явно совпадает со страхователем и это
           следует из текста — возвращай "Совпадает со страхователем".
        7. Не используй "None", "null", пустые строки. Не используй "not_found".
        8. В evidence включай только текст договора.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — структура полностью определена:
        Фрагмент:
        "Страховщик — ООО «Страховая компания Гарант», лицензия ЦБ РФ СЛ № 1234.
        Страхователь — ООО «Альфа». Объект страхования — здание склада по адресу:
        г. Москва, ул. Ленина, д. 10, кадастровый номер 77:01:0001001:100.
        Страховыми случаями признаются: пожар, залив, противоправные действия
        третьих лиц. Страховая сумма — 10 000 000 рублей. Страховая премия —
        100 000 рублей. Срок страхования — с 01.01.2026 по 31.12.2026."

        Ответ:
        {
          "insurance_type": "property",
          "insurance_type_display": "Имущественное страхование",
          "policy_number": "not_defined",
          "insurer": "ООО «Страховая компания Гарант»",
          "policyholder": "ООО «Альфа»",
          "insured_person": "Не применимо",
          "beneficiary": "Не установлен",
          "insured_object": "Здание склада по адресу: г. Москва, ул. Ленина, д. 10 (кад. № 77:01:0001001:100)",
          "insured_event": "Пожар, залив, противоправные действия третьих лиц",
          "sum_insured": "10 000 000 рублей",
          "premium": "100 000 рублей",
          "term": "с 01.01.2026 по 31.12.2026",
          "insurance_summary": "Имущественное страхование здания склада ООО «Альфа» от пожара, залива и ПДТЛ на 10 000 000 руб., премия 100 000 руб., срок с 01.01.2026 по 31.12.2026"
        }

        Пример 2 — параметры определены через Правила страхования:
        Фрагмент:
        "Страховщик — АО «СК Резерв». Страхователь — ООО «Бета».
        Страхование осуществляется на условиях Правил страхования грузов № 15,
        утверждённых Страховщиком 01.03.2024. Страховые риски — согласно
        разделу 3 указанных Правил. Страховая сумма — 5 000 000 рублей.
        Страховая премия — 25 000 рублей. Договор действует с 15.04.2026 по 14.04.2027."

        Ответ:
        {
          "insurance_type": "property",
          "insurance_type_display": "Имущественное страхование",
          "policy_number": "not_defined",
          "insurer": "АО «СК Резерв»",
          "policyholder": "ООО «Бета»",
          "insured_person": "Не применимо",
          "beneficiary": "Не установлен",
          "insured_object": "Груз (согласно Правилам страхования грузов № 15 от 01.03.2024)",
          "insured_event": "Согласно разделу 3 Правил страхования грузов № 15 от 01.03.2024",
          "sum_insured": "5 000 000 рублей",
          "premium": "25 000 рублей",
          "term": "с 15.04.2026 по 14.04.2027",
          "insurance_summary": "Имущественное страхование груза ООО «Бета» на условиях Правил страхования грузов № 15 от 01.03.2024, страховая сумма 5 000 000 руб., срок с 15.04.2026 по 14.04.2027"
        }

        Пример 3 — текст есть, но однозначный вывод невозможен:
        Фрагмент:
        "Между Страховщиком и Страхователем заключён настоящий договор
        на условиях, определяемых сторонами дополнительно. Существенные
        условия согласуются в приложениях, являющихся неотъемлемой частью
        договора. Страховая сумма и премия определяются полисом."

        Ответ:
        {
          "insurance_type": "not_defined",
          "insurance_type_display": "Не удалось определить",
          "policy_number": "not_defined",
          "insurer": "Не удалось определить",
          "policyholder": "Не удалось определить",
          "insured_person": "Не удалось определить",
          "beneficiary": "Не установлен",
          "insured_object": "Не установлен",
          "insured_event": "Не установлен",
          "sum_insured": "Согласно полису",
          "premium": "Согласно полису",
          "term": "Не установлен",
          "insurance_summary": "Не удалось определить структуру страховой сделки: существенные условия определяются приложениями и полисом, не приложенными к анализируемому тексту"
        }

        Пример 4 — данные полностью отсутствуют:
        Фрагмент:
        "Стороны заключили договор страхования."

        Ответ:
        {
          "insurance_type": "not_defined",
          "insurance_type_display": "Не установлено",
          "policy_number": "not_defined",
          "insurer": "Не установлено",
          "policyholder": "Не установлено",
          "insured_person": "Не установлено",
          "beneficiary": "Не установлен",
          "insured_object": "Не установлен",
          "insured_event": "Не установлен",
          "sum_insured": "Не установлена",
          "premium": "Не установлена",
          "term": "Не установлен",
          "insurance_summary": "Структура договора страхования не раскрыта в тексте"
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о страховщике.
        2. Найди прямую цитату о страховой сумме.
        3. Найди прямую цитату о сроке страхования.
        4. Проверь, нет ли отсылок к Правилам страхования / Приложениям /
           полису — если есть, отрази это в user-facing полях.
        5. Проверь, соответствует ли insurance_type_display значению insurance_type.
        6. Проверь, что все 14 ключей (13 полей + evidence) присутствуют в JSON.
        7. Если прямой цитаты нет и отсылки к внешнему документу нет —
           возвращай fallback-значение согласно [ПРАВИЛА].

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь РОВНО одним JSON-объектом без какого-либо дополнительного текста
        до или после, со всеми 14 ключами (13 полей + evidence):
        {
          "insurance_type": "<property / personal / liability / mixed / not_defined>",
          "insurance_type_display": "<человекочитаемый тип или fallback>",
          "policy_number": "<номер или not_defined>",
          "insurer": "<наименование или fallback>",
          "policyholder": "<наименование или fallback>",
          "insured_person": "<ФИО / 'Совпадает со страхователем' / 'Не применимо' / fallback>",
          "beneficiary": "<наименование / 'Не применимо' / fallback>",
          "insured_object": "<описание или fallback>",
          "insured_event": "<описание или ссылка на Правила или fallback>",
          "sum_insured": "<сумма или ссылка на полис или fallback>",
          "premium": "<сумма или ссылка на полис или fallback>",
          "term": "<срок или fallback>",
          "insurance_summary": "<краткое summary одной строкой>"
        }
      context_k: 10
      temperature: 0.0
      max_tokens: 900

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "страховщик страхователь застрахованное лицо выгодоприобретатель в пользу объект страхования страховой случай страховой риск страховая сумма страховая премия срок страхования срок действия договора правила страхования полис"
      boost_keywords:
        - "страховой случай"
        - "страховая сумма"
        - "страховая премия"
        - "объект страхования"
        - "выгодоприобретатель"
      preferred_unit_types:
        - obligation
        - general_provision
        - definition
        - structural_anchor
      excluded_unit_types:
        - technical_fragment
      preferred_clause_functions:
        - definitions
        - obligations
        - representations
      negative_keywords:
        - "индекс"
        - "оглавление"
      position_bias:
        preferred_range: [0.0, 0.6]
        boost: 0.20
        scope: segment
      context_k: 10
      max_chunks: 14
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
        - "invoice"
      preferred_clause_functions:
        - "definitions"
        - "obligations"
        - "representations"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 50
      max_snippet_length: 700

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1600
      compact_output: false

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист по договорной работе. Твоя задача — извлечь
        из текста договора страхования базовую структуру: тип страхования,
        стороны, объект, страховой случай, страховую сумму, премию и срок.
        Не анализируй порядок выплаты, исключения из покрытия, франшизу,
        суброгацию — это предмет других проверок.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие 13 полей + evidence (всего 14 ключей):

        1. insurance_type — технический enum:
           "property" — имущественное страхование;
           "personal" — личное страхование (жизнь, здоровье, НС);
           "liability" — страхование гражданской ответственности;
           "mixed" — несколько видов одновременно;
           "not_defined" — тип не определён.
        2. insurance_type_display — человекочитаемое обозначение типа
           на русском ("Имущественное страхование" / "Личное страхование" /
           "Страхование ответственности" / "Смешанное страхование" /
           "Не установлено" / "Не удалось определить").
        3. policy_number — номер полиса или договора страхования.
        4. insurer — наименование страховщика.
        5. policyholder — наименование страхователя.
        6. insured_person — застрахованное лицо. Если совпадает со
           страхователем — "Совпадает со страхователем". Если по типу
           страхования неприменимо — "Не применимо".
        7. beneficiary — выгодоприобретатель. Если не назначен явно —
           "Не установлен". Если по типу страхования неприменимо —
           "Не применимо".
        8. insured_object — объект страхования (имущество, интерес,
           жизнь/здоровье, ответственность). Если определён через Правила /
           Приложение / Спецификацию — возвращай отсылку.
        9. insured_event — страховой случай / застрахованный риск.
           Если определён через Правила страхования — возвращай отсылку
           вида "Согласно разделу N Правил страхования № X от DD.MM.YYYY".
        10. sum_insured — страховая сумма. Если определяется полисом —
            "Согласно полису".
        11. premium — страховая премия. Если определяется полисом —
            "Согласно полису".
        12. term — срок страхования / срок действия договора.
        13. insurance_summary — краткое summary одной строкой для DD Grid:
            "<Тип> страхование <объект> <страхователь> <ключевой риск>
            на <сумма>, срок <период>". Если данных мало — короткая
            честная формулировка о том, что раскрыто в тексте.
        </task>

        <context_rules>
        - Используй только текст договора из <context>. Не подставляй нормы
          закона вместо текста договора.
        - Не делай предположений сверх того, что прямо следует из текста.
        - Если данные отсутствуют — возвращай fallback-значения
          согласно <output_expectations>.
        - Если параметр определён через отсылку к внешнему документу
          (Правила страхования, Приложение, Спецификация, полис) — это
          валидный исход, отражай отсылку в user-facing поле.
        - Если параметр неприменим по типу страхования — возвращай
          "Не применимо".
        - Если текст есть, но однозначный вывод невозможен —
          возвращай "Не удалось определить".
        - insurance_type_display должен соответствовать insurance_type.
        </context_rules>

        <output_expectations>
        - Все 14 ключей (13 полей + evidence) должны присутствовать в ответе.
        - Запрещены значения: null, None, "", "not_found", "unclear".
        - Для insurance_type допустимо только: property / personal /
          liability / mixed / not_defined.
        - Для user-facing полей fallback-значения:
          * "Не установлено" — параметр вообще не упомянут;
          * "Не установлен" / "Не установлена" — согласовать по роду
            (объект/случай — "Не установлен"; сумма/премия — "Не установлена");
          * "Не применимо" — параметр неприменим по типу страхования;
          * "Не удалось определить" — текст есть, но однозначный вывод
            невозможен;
          * "Согласно Правилам страхования № X" / "Согласно полису" /
            "Согласно Приложению № N" — параметр определён через отсылку.
        - Верни РОВНО один JSON-объект со всеми 14 ключами без какого-либо
          дополнительного текста до или после. Начни ответ сразу с открывающей
          фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки,
          код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга
          через json.loads без предварительной обработки.
        </output_expectations>
      fields:
        - name: "insurance_type"
          type: "string"
          presentation: "signal"
          allowed_values: ["property", "personal", "liability", "mixed", "not_defined"]
          description: "Тип страхования (технический enum)."
          required: true
          display_in_grid: false
        - name: "insurance_type_display"
          type: "string"
          presentation: "fact"
          label: "Тип страхования"
          description: "Человекочитаемое обозначение типа страхования."
          required: true
          display_in_grid: true
          display_priority: 1
        - name: "insurer"
          type: "string"
          presentation: "fact"
          label: "Страховщик"
          description: "Наименование страховщика."
          required: true
          display_in_grid: true
          display_priority: 2
        - name: "policyholder"
          type: "string"
          presentation: "fact"
          label: "Страхователь"
          description: "Наименование страхователя."
          required: true
          display_in_grid: true
          display_priority: 3
        - name: "insured_object"
          type: "string"
          presentation: "fact"
          label: "Объект страхования"
          description: "Объект страхования (имущество, интерес, жизнь/здоровье, ответственность) или отсылка к Правилам/Приложению."
          required: true
          display_in_grid: true
          display_priority: 4
        - name: "insured_event"
          type: "string"
          presentation: "fact"
          label: "Страховой случай"
          description: "Страховой случай / застрахованный риск или отсылка к Правилам страхования."
          required: true
          display_in_grid: true
          display_priority: 5
        - name: "sum_insured"
          type: "string"
          presentation: "fact"
          label: "Страховая сумма"
          description: "Страховая сумма или отсылка к полису."
          required: true
          display_in_grid: true
          display_priority: 6
        - name: "premium"
          type: "string"
          presentation: "fact"
          label: "Страховая премия"
          description: "Страховая премия или отсылка к полису."
          required: true
          display_in_grid: true
          display_priority: 7
        - name: "term"
          type: "string"
          presentation: "fact"
          label: "Срок страхования"
          description: "Срок страхования / срок действия договора."
          required: true
          display_in_grid: true
          display_priority: 8
        - name: "policy_number"
          type: "string"
          presentation: "fact"
          label: "Номер полиса"
          description: "Номер полиса или договора страхования."
          required: true
          display_in_grid: true
          display_priority: 9
        - name: "insurance_summary"
          type: "string"
          presentation: "fact"
          label: "Краткое описание страховой сделки"
          description: "Итоговое summary для DD Grid — тип, объект, стороны, сумма, срок."
          required: true
          display_in_grid: true
          display_priority: 10
        - name: "insured_person"
          type: "string"
          presentation: "fact"
          description: "Застрахованное лицо (если отличается от страхователя, совпадает с ним или неприменимо)."
          required: true
          display_in_grid: false
        - name: "beneficiary"
          type: "string"
          presentation: "fact"
          description: "Выгодоприобретатель по договору страхования."
          required: true
          display_in_grid: false
    store_payload: true

  - id: insured_event_and_exclusions_check
    name: "Страховой случай и исключения из покрытия"
    description: >
      Проверяет ясность определения страхового случая и прозрачность исключений
      из страхового покрытия. Оценивает наличие открытых или размытых формулировок,
      позволяющих страховщику произвольно отказать в выплате.
      Нормативные ориентиры: ст. 942 ГК РФ (существенные условия),
      ст. 963 ГК РФ (основания освобождения страховщика от выплаты).
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "страховой случай"
        - "страховой риск"
        - "не является страховым случаем"
        - "исключения из страхового покрытия"
        - "отказ в выплате"
        - "умысел"
        - "грубая неосторожность"
        - "военные действия"
        - "ядерный взрыв"
        - "основания для отказа"
        - "не покрывается"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)не\\s+является\\s+страхов(ым|ым\\s+случаем)"
        - "(?i)исключени[яе].{0,40}покрыт"
        - "(?i)выплата\\s+не\\s+производится"
        - "(?i)основани[яе].{0,30}отказ"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор страхования по Главе 48 ГК РФ.
        Проверяется только один вопрос: определение страхового случая
        и исключений из покрытия.

        Нормативный ориентир:
        - ст. 942 ГК РФ — существенные условия договора страхования
        - ст. 963 ГК РФ — основания освобождения страховщика от выплаты

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора.
        - Не оценивай серьёзность риска.
        - Учитывай, что в российской практике исключения часто формулируются
          через отсылку к Правилам страхования или через открытые перечни
          («иные случаи, предусмотренные законодательством»).

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Определён ли страховой случай (конкретный перечень событий).
        2. Есть ли перечень исключений из покрытия.
        3. Насколько ясно сформулированы исключения (закрытый перечень
           vs размытые формулировки).
        4. Есть ли признаки открытых или неограниченных исключений
           («иные случаи», «по усмотрению страховщика», отсылка к
           неопределённым внешним документам).
        5. Краткое перечисление ключевых исключений.

        [ПРАВИЛА]
        1. Используй только текст документа. Не подставляй нормы закона
           вместо текста договора.
        2. Если условие не указано прямо и не следует однозначно из текста —
           возвращай "not_defined" в сигнальных полях и "Не установлено"
           в user-facing полях.
        3. Если исключения определены через отсылку к Правилам страхования —
           отражай это: "Согласно Правилам страхования № X".
        4. Не используй "None", "null", пустые строки. Не используй "not_found".
        5. "vague" — если исключения сформулированы размыто, через «иные случаи»,
           «по усмотрению страховщика», «в соответствии с законодательством»
           без конкретизации.
        6. "clear" — если исключения перечислены закрытым списком конкретных
           событий (пожар, наводнение, умысел и т.д.).
        7. "contains_open_ended_exclusions" = "yes", если есть хотя бы одна
           формулировка, допускающая неограниченное расширение перечня
           исключений без согласия страхователя.
        8. В evidence включай только текст договора.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — исключения чёткие, закрытый перечень:
        Фрагмент:
        "Страховым случаем является пожар, залив, взрыв бытового газа.
        Не являются страховыми случаями: военные действия, терроризм,
        ядерный взрыв, радиоактивное заражение, умысел страхователя
        или выгодоприобретателя, грубая неосторожность страхователя."

        Ответ:
        {
          "insured_event_defined": "yes",
          "exclusions_present": "yes",
          "exclusions_clarity": "clear",
          "contains_open_ended_exclusions": "no",
          "key_exclusions_summary": "Военные действия, терроризм, ядерный взрыв, радиоактивное заражение, умысел страхователя/выгодоприобретателя, грубая неосторожность страхователя",
          "evidence": "Страховым случаем является пожар, залив, взрыв бытового газа. Не являются страховыми случаями: военные действия, терроризм, ядерный взрыв, радиоактивное заражение, умысел страхователя или выгодоприобретателя, грубая неосторожность страхователя."
        }

        Пример 2 — исключения размытые, открытый перечень:
        Фрагмент:
        "Страховым случаем признаётся событие, повлёкшее убытки
        Страхователя. Страховщик вправе отказать в выплате в иных
        случаях, предусмотренных законодательством Российской Федерации
        и Правилами страхования."

        Ответ:
        {
          "insured_event_defined": "unclear",
          "exclusions_present": "yes",
          "exclusions_clarity": "vague",
          "contains_open_ended_exclusions": "yes",
          "key_exclusions_summary": "Иные случаи, предусмотренные законодательством РФ и Правилами страхования (без конкретизации)",
          "evidence": "Страховым случаем признаётся событие, повлёкшее убытки Страхователя. Страховщик вправе отказать в выплате в иных случаях, предусмотренных законодательством Российской Федерации и Правилами страхования."
        }

        Пример 3 — страховой случай определён, исключения не упомянуты:
        Фрагмент:
        "Страховым случаем признаётся причинение вреда жизни или
        здоровью Застрахованного в результате несчастного случая,
        произошедшего в период действия договора."

        Ответ:
        {
          "insured_event_defined": "yes",
          "exclusions_present": "no",
          "exclusions_clarity": "not_defined",
          "contains_open_ended_exclusions": "not_defined",
          "key_exclusions_summary": "Не установлено — в тексте договора исключения из покрытия не указаны",
          "evidence": "Страховым случаем признаётся причинение вреда жизни или здоровью Застрахованного в результате несчастного случая, произошедшего в период действия договора."
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о страховом случае.
        2. Найди прямую цитату об исключениях (если есть).
        3. Если исключения сформулированы через «иные», «по усмотрению»,
           «в соответствии с законодательством» без конкретизации —
           ставь exclusions_clarity = "vague" и
           contains_open_ended_exclusions = "yes".
        4. Не выводи исключения из законодательства, если они не указаны
           в тексте договора.
        5. Проверь, что все 6 ключей (5 полей + evidence) присутствуют
           в JSON.

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь РОВНО одним JSON-объектом без какого-либо дополнительного текста
        до или после, со всеми 6 ключами (5 полей + evidence):
        {
          "insured_event_defined": "<yes / no / unclear>",
          "exclusions_present": "<yes / no>",
          "exclusions_clarity": "<clear / vague / not_defined>",
          "contains_open_ended_exclusions": "<yes / no / not_defined>",
          "key_exclusions_summary": "<перечисление исключений или fallback>",
          "evidence": "<прямая цитата из договора>"
        }
      context_k: 8
      temperature: 0.0
      max_tokens: 700

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "страховой случай страховой риск исключения из покрытия не является страховым случаем отказ в выплате основания для отказа не покрывается"
      boost_keywords:
        - "исключения"
        - "отказ в выплате"
        - "не является страховым случаем"
        - "основания для отказа"
      preferred_unit_types:
        - obligation
        - general_provision
        - definition
      excluded_unit_types:
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - definitions
        - obligations
        - limitations
      negative_keywords:
        - "премия"
        - "страховая сумма"
      position_bias:
        preferred_range: [0.10, 0.70]
        boost: 0.15
        scope: segment
      context_k: 8
      max_chunks: 12
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
        - "invoice"
      preferred_clause_functions:
        - "definitions"
        - "obligations"
        - "limitations"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 50
      max_snippet_length: 700

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 800
      compact_output: false

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист по договорной работе. Твоя задача — извлечь
        из текста договора страхования определение страхового случая
        и исключений из покрытия, оценить ясность формулировок.
        Не анализируй порядок уведомления о страховом случае, сроки
        выплаты, суброгацию — это предмет других проверок.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие 5 полей + evidence (всего 6 ключей):

        1. insured_event_defined — определён ли страховой случай:
           "yes" — конкретный перечень событий (пожар, залив, НС и т.д.);
           "no" — страховой случай не определён вообще;
           "unclear" — формулировка слишком общая («любое событие»,
           «повлёкшее убытки»).
        2. exclusions_present — есть ли исключения из покрытия:
           "yes" — в договоре есть перечень или описание исключений;
           "no" — исключения не упомянуты.
        3. exclusions_clarity — ясность формулировок исключений:
           "clear" — закрытый перечень конкретных событий;
           "vague" — размытые формулировки («иные случаи»,
           «по усмотрению страховщика», «предусмотренные
           законодательством» без конкретизации);
           "not_defined" — исключения не упомянуты.
        4. contains_open_ended_exclusions — есть ли открытые/неограниченные
           исключения:
           "yes" — есть хотя бы одна формулировка, допускающая
           неограниченное расширение перечня без согласия страхователя;
           "no" — перечень исключений закрытый;
           "not_defined" — исключения не упомянуты.
        5. key_exclusions_summary — краткое перечисление ключевых
           исключений из покрытия одной строкой. Если исключений нет —
           "Не установлено". Если определены через отсылку —
           "Согласно Правилам страхования № X".
        </task>

        <context_rules>
        - Используй только текст договора из <context>. Не подставляй
          нормы закона вместо текста договора.
        - Не выводи исключения из законодательства, если они не указаны
          в тексте договора.
        - Не делай предположений сверх того, что прямо следует из текста.
        - Если параметр определён через отсылку к Правилам страхования —
          отражай отсылку в key_exclusions_summary.
        </context_rules>

        <output_expectations>
        - Все 6 ключей (5 полей + evidence) должны присутствовать в ответе.
        - Запрещены значения: null, None, "", "not_found", "unclear"
          (кроме insured_event_defined и contains_open_ended_exclusions,
          где "unclear" допустимо).
        - Для insured_event_defined допустимо только: yes / no / unclear.
        - Для exclusions_present допустимо только: yes / no.
        - Для exclusions_clarity допустимо только: clear / vague / not_defined.
        - Для contains_open_ended_exclusions допустимо только: yes / no / not_defined.
        - Fallback-значения для key_exclusions_summary:
          * "Не установлено" — исключения не упомянуты;
          * "Согласно Правилам страхования № X" — отсылка к внешнему
            документу.
        - Верни РОВНО один JSON-объект со всеми 6 ключами без какого-либо
          дополнительного текста до или после. Начни ответ сразу с
          открывающей фигурной скобки и закончи закрывающей. НЕ пиши
          Markdown, списки, код-фенсы. Ответ должен быть валидным JSON,
          пригодным для парсинга через json.loads без предварительной
          обработки.
        </output_expectations>
      fields:
        - name: "insured_event_defined"
          type: "string"
          presentation: "signal"
          allowed_values: ["yes", "no", "unclear"]
          label: "Страховой случай определён"
          description: "Определён ли страховой случай конкретным перечнем событий."
          required: true
          display_in_grid: true
          display_priority: 1
        - name: "exclusions_present"
          type: "string"
          presentation: "signal"
          allowed_values: ["yes", "no"]
          label: "Исключения из покрытия"
          description: "Есть ли в договоре перечень исключений из страхового покрытия."
          required: true
          display_in_grid: true
          display_priority: 2
        - name: "exclusions_clarity"
          type: "string"
          presentation: "signal"
          allowed_values: ["clear", "vague", "not_defined"]
          label: "Ясность исключений"
          description: "Насколько ясно сформулированы исключения: закрытый перечень (clear) vs размытые формулировки (vague)."
          required: true
          display_in_grid: true
          display_priority: 3
        - name: "contains_open_ended_exclusions"
          type: "string"
          presentation: "signal"
          allowed_values: ["yes", "no", "not_defined"]
          label: "Открытые исключения"
          description: "Есть ли формулировки, допускающие неограниченное расширение перечня исключений (красный флаг)."
          required: true
          display_in_grid: true
          display_priority: 4
        - name: "key_exclusions_summary"
          type: "string"
          presentation: "fact"
          label: "Ключевые исключения"
          description: "Краткое перечисление ключевых исключений из покрытия или отсылка к Правилам страхования."
          required: true
          display_in_grid: true
          display_priority: 5
    store_payload: true

  - id: rules_of_insurance_attachment_check
    name: "Правила страхования: включение в договор и подтверждение вручения"
    description: >
      Проверяет наличие ссылки на Правила страхования, их включение
      в договорную конструкцию и подтверждение ознакомления/вручения
      страхователю. Критически важный check: по ст. 943 ГК РФ условия
      страхования могут определяться в Правилах, но ссылка на них
      оспорима, если страхователь не был ознакомлен (п. 2 ст. 940 ГК РФ,
      практика ВС РФ — бремя доказывания ознакомления на страховщике).
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "правила страхования"
        - "с правилами ознакомлен"
        - "правила вручены"
        - "экземпляр правил"
        - "получил на руки"
        - "правила являются неотъемлемой частью"
        - "ознакомление с правилами"
        - "подтверждает получение"
        - "на основании правил"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)с\\s+правилами\\s+страхования\\s+ознакомлен"
        - "(?i)правила\\s+страхования\\s+(?:вручены|получены|прилагаются)"
        - "(?i)неотъемлем(ой|ой\\s+частью)\\s+договора"
        - "(?i)подтвержда(?:ет|ю)\\s+(?:получение|ознакомление)"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор страхования по Главе 48 ГК РФ.
        Проверяется только один вопрос: включение Правил страхования
        в договор и подтверждение ознакомления страхователя.

        Нормативный ориентир:
        - ст. 943 ГК РФ — условия страхования определяются в Правилах
          страхования, на которые ссылается договор
        - п. 2 ст. 940 ГК РФ — правила могут быть изложены в полисе
          или приложении к нему

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте
          договора.
        - Не оценивай серьёзность риска.
        - Учитывай российскую практику: различие между «ознакомлен»
          (формальная фраза) и «вручён экземпляр» (фактическая передача)
          имеет юридическое значение.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Есть ли ссылка на конкретные Правила страхования (название,
           номер, дата утверждения).
        2. Подтверждено ли вручение экземпляра Правил страхователю
           или только формальное ознакомление.
        3. Указано ли, что Правила являются неотъемлемой частью договора.
        4. Цитату из договора, подтверждающую выводы.

        [ПРАВИЛА]
        1. Используй только текст документа. Не подставляй нормы закона
           вместо текста договора.
        2. Если условие не указано прямо и не следует однозначно из
           текста — возвращай "not_defined".
        3. Если Правила упомянуты, но вручение не подтверждено —
           rules_delivery_status = "not_defined", а не "delivered".
        4. Не используй "None", "null", пустые строки. Не используй
           "not_found".
        5. "delivered" — есть явное указание на вручение/получение
           экземпляра Правил («вручены», «получил на руки», «передан
           экземпляр»).
        6. "acknowledged_only" — есть только формула об ознакомлении
           («с Правилами ознакомлен») без ясного подтверждения вручения
           физического экземпляра.
        7. "incorporated" — прямо указано, что Правила являются
           неотъемлемой частью договора или его приложением.
        8. "unclear" — ссылка на Правила есть, но их статус в
           договорной конструкции неясен.
        9. В evidence включай только текст договора.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — Правила вручены и включены в договор:
        Фрагмент:
        "Настоящий договор заключён на основании Правил добровольного
        страхования имущества юридических лиц № П-12, утверждённых
        Приказом Генерального директора Страховщика от 15.01.2024,
        являющихся неотъемлемой частью настоящего договора. Страхователь
        подтверждает получение экземпляра указанных Правил и
        ознакомление с их содержанием."

        Ответ:
        {
          "rules_referenced": "yes",
          "rules_delivery_status": "delivered",
          "rules_incorporation_status": "incorporated",
          "rules_snippet": "Правила добровольного страхования имущества юридических лиц № П-12 от 15.01.2024, являющихся неотъемлемой частью настоящего договора. Страхователь подтверждает получение экземпляра",
          "evidence": "Настоящий договор заключён на основании Правил добровольного страхования имущества юридических лиц № П-12, утверждённых Приказом Генерального директора Страховщика от 15.01.2024, являющихся неотъемлемой частью настоящего договора. Страхователь подтверждает получение экземпляра указанных Правил и ознакомление с их содержанием."
        }

        Пример 2 — данные полностью отсутствуют:
        Фрагмент:
        "Стороны заключили договор страхования."

        Ответ:
        {
          "rules_referenced": "no",
          "rules_delivery_status": "not_defined",
          "rules_incorporation_status": "not_defined",
          "rules_snippet": "Не установлено",
          "evidence": "Стороны заключили договор страхования."
        }

        Пример 3 — Правила упомянуты, но вручение не подтверждено:
        Фрагмент:
        "Договор страхования заключается на условиях Правил страхования
        ответственности перевозчика, разработанных Страховщиком.
        Страхователь с Правилами ознакомлен."

        Ответ:
        {
          "rules_referenced": "yes",
          "rules_delivery_status": "acknowledged_only",
          "rules_incorporation_status": "unclear",
          "rules_snippet": "На условиях Правил страхования ответственности перевозчика. Страхователь с Правилами ознакомлен",
          "evidence": "Договор страхования заключается на условиях Правил страхования ответственности перевозчика, разработанных Страховщиком. Страхователь с Правилами ознакомлен."
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о Правилах страхования (название, номер).
        2. Найди прямую цитату о вручении или ознакомлении.
        3. Найди прямую цитату о неотъемлемой части (если есть).
        4. Если есть только «ознакомлен» без «вручён/получил» —
           ставь "acknowledged_only", а не "delivered".
        5. Проверь, что все 5 ключей (4 поля + evidence) присутствуют
           в JSON.

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь РОВНО одним JSON-объектом без какого-либо дополнительного
        текста до или после, со всеми 5 ключами (4 поля + evidence):
        {
          "rules_referenced": "<yes / no>",
          "rules_delivery_status": "<delivered / acknowledged_only / not_defined>",
          "rules_incorporation_status": "<incorporated / unclear / not_defined>",
          "rules_snippet": "<цитата или 'Не установлено'>",
          "evidence": "<прямая цитата из договора>"
        }
      context_k: 7
      temperature: 0.0
      max_tokens: 600

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "правила страхования ознакомлен вручены неотъемлемая часть экземпляр правил на основании правил подтверждает получение"
      boost_keywords:
        - "правила страхования"
        - "ознакомлен"
        - "вручены"
        - "неотъемлемая часть"
      preferred_unit_types:
        - obligation
        - general_provision
        - definition
      excluded_unit_types:
        - technical_fragment
      preferred_clause_functions:
        - definitions
        - obligations
        - procedures
        - boilerplate
      negative_keywords:
        - "страховая сумма"
        - "премия"
      position_bias:
        preferred_range: [0.0, 0.80]
        boost: 0.15
        scope: segment
      context_k: 7
      max_chunks: 10
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
        - "invoice"
      preferred_clause_functions:
        - "definitions"
        - "obligations"
        - "procedures"
        - "boilerplate"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 600

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 800
      compact_output: false

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист по договорной работе. Твоя задача — извлечь
        из текста договора страхования сведения о Правилах страхования:
        наличие ссылки, статус вручения/ознакомления, включение в
        договорную конструкцию. Не анализируй содержание самих Правил —
        только факт их упоминания и вручения в тексте договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие 4 поля + evidence (всего 5 ключей):

        1. rules_referenced — есть ли ссылка на Правила страхования:
           "yes" — в договоре упомянуты конкретные Правила (название,
           номер, дата);
           "no" — Правила не упомянуты.
        2. rules_delivery_status — статус вручения Правил страхователю:
           "delivered" — явное указание на вручение/получение экземпляра
           («вручены», «получил на руки», «передан экземпляр»);
           "acknowledged_only" — только формула об ознакомлении
           («с Правилами ознакомлен») без подтверждения вручения;
           "not_defined" — вопрос вручения не раскрыт.
        3. rules_incorporation_status — включение Правил в договор:
           "incorporated" — прямо указано «неотъемлемая часть договора»
           или «являются приложением к договору»;
           "unclear" — ссылка на Правила есть, но их статус неясен;
           "not_defined" — Правила не упомянуты.
        4. rules_snippet — краткая цитата из договора о Правилах
           страхования (до 200 символов). Если Правила не упомянуты —
           "Не установлено".
        </task>

        <context_rules>
        - Используй только текст договора из <context>. Не подставляй
          нормы закона вместо текста договора.
        - Не выводи вручение из молчания договора: если нет явной
          формулировки о вручении — ставь "not_defined".
        - Различай «ознакомлен» (acknowledged_only) и «вручён»
          (delivered) — это юридически значимое различие.
        - Не делай предположений сверх того, что прямо следует из текста.
        </context_rules>

        <output_expectations>
        - Все 5 ключей (4 поля + evidence) должны присутствовать в ответе.
        - Запрещены значения: null, None, "", "not_found".
        - Для rules_referenced допустимо только: yes / no.
        - Для rules_delivery_status допустимо только:
          delivered / acknowledged_only / not_defined.
        - Для rules_incorporation_status допустимо только:
          incorporated / unclear / not_defined.
        - Fallback для rules_snippet: "Не установлено".
        - Верни РОВНО один JSON-объект со всеми 5 ключами без какого-либо
          дополнительного текста до или после. Начни ответ сразу с
          открывающей фигурной скобки и закончи закрывающей. НЕ пиши
          Markdown, списки, код-фенсы. Ответ должен быть валидным JSON,
          пригодным для парсинга через json.loads без предварительной
          обработки.
        </output_expectations>
      fields:
        - name: "rules_referenced"
          type: "string"
          presentation: "signal"
          allowed_values: ["yes", "no"]
          label: "Правила страхования упомянуты"
          description: "Есть ли в договоре ссылка на конкретные Правила страхования."
          required: true
          display_in_grid: true
          display_priority: 1
        - name: "rules_delivery_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["delivered", "acknowledged_only", "not_defined"]
          label: "Вручение Правил"
          description: "Статус вручения Правил: вручён экземпляр (delivered), только ознакомление (acknowledged_only), не раскрыто (not_defined)."
          required: true
          display_in_grid: true
          display_priority: 2
        - name: "rules_incorporation_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["incorporated", "unclear", "not_defined"]
          label: "Включение в договор"
          description: "Включены ли Правила в договорную конструкцию: неотъемлемая часть (incorporated), статус неясен (unclear), не упомянуты (not_defined)."
          required: true
          display_in_grid: true
          display_priority: 3
        - name: "rules_snippet"
          type: "string"
          presentation: "fact"
          label: "Цитата о Правилах"
          description: "Краткая цитата из договора о Правилах страхования или отсылка."
          required: true
          display_in_grid: true
          display_priority: 4
    store_payload: true

  - id: claim_notification_check
    name: "Уведомление о страховом случае: срок, способ, последствия"
    description: >
      Проверяет наличие и ясность порядка уведомления страховщика о наступлении
      страхового случая: конкретный срок, допустимые способы, последствия
      несвоевременного уведомления. Критически важный check: по ст. 961 ГК РФ
      страхователь обязан уведомить страховщика незамедлительно, а договором
      может быть установлен конкретный срок. Нарушение порядка уведомления —
      одно из самых частых оснований отказа в выплате в российской практике.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "уведомить страховщика"
        - "незамедлительно"
        - "в течение 24 часов"
        - "в течение"
        - "письменное уведомление"
        - "по телефону"
        - "сообщить о страховом случае"
        - "последствия несвоевременного уведомления"
        - "порядок уведомления"
        - "извещение о страховом случае"
        - "заявление о страховом случае"
        - "электронная почта"
        - "личный кабинет"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)уведомит[ья].{0,60}страховщик"
        - "(?i)о\\s+наступлении\\s+страхового\\s+случая"
        - "(?i)(?:в\\s+течение|не\\s+позднее)\\s+\\d+\\s+(?:час|дн|рабоч)"
        - "(?i)извещ(?:ение|ает).{0,40}страхов"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор страхования по Главе 48 ГК РФ.
        Проверяется только один вопрос: порядок уведомления о наступлении
        страхового случая.

        Нормативный ориентир:
        - ст. 961 ГК РФ — обязанность уведомления о наступлении
          страхового случая; последствия неисполнения

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте
          договора.
        - Не оценивай серьёзность риска.
        - Учитывай российскую практику: порядок уведомления может быть
          определён через отсылку к Правилам страхования; способы
          уведомления могут включать телефон, e-mail, личный кабинет,
          мобильное приложение.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Установлен ли конкретный срок уведомления о страховом случае.
        2. Какой именно срок (в часах, днях, рабочих днях).
        3. Какие способы уведомления предусмотрены (телефон, письмо,
           e-mail, личный кабинет и т.д.).
        4. Указаны ли последствия несвоевременного уведомления
           (отказ в выплате, снижение выплаты, иное).
        5. Насколько ясно и полно сформулирован порядок уведомления.

        [ПРАВИЛА]
        1. Используй только текст документа. Не подставляй нормы закона
           вместо текста договора.
        2. Если условие не указано прямо и не следует однозначно из
           текста — возвращай "not_defined".
        3. Если порядок уведомления определён через отсылку к Правилам
           страхования — отражай это: "Согласно Правилам страхования".
        4. Не используй "None", "null", пустые строки. Не используй
           "not_found".
        5. "clear" — срок конкретен (число + единица), способы
           перечислены, последствия описаны.
        6. "unclear" — формулировки размыты («в разумный срок»,
           «незамедлительно» без конкретизации, «в порядке,
           предусмотренном Правилами» без приложения Правил).
        7. "specified" — последствия просрочки прямо описаны (отказ,
           снижение, иное).
        8. "vague" — последствия упомянуты, но не конкретизированы
           («страховщик вправе применить меры»).
        9. notification_methods — перечисли через запятую все явно
           указанные способы. Если не указаны — "Не установлено".
        10. В evidence включай только текст договора.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — порядок уведомления урегулирован полностью:
        Фрагмент:
        "Страхователь обязан уведомить Страховщика о наступлении
        страхового случая в течение 3 (трёх) рабочих дней с момента,
        когда ему стало или должно было стать известно о наступлении
        страхового случая. Уведомление осуществляется по телефону
        горячей линии Страховщика и дублируется письменно на
        электронную почту claims@insurer.ru. При несвоевременном
        уведомлении Страховщик вправе отказать в страховой выплате,
        если докажет, что позднее уведомление лишило его возможности
        проверить обстоятельства страхового случая."

        Ответ:
        {
          "notification_deadline_present": "yes",
          "notification_deadline": "3 рабочих дня с момента, когда стало известно",
          "notification_methods": "телефон горячей линии, электронная почта",
          "late_notice_consequences": "specified",
          "notice_clause_clarity": "clear",
          "evidence": "Страхователь обязан уведомить Страховщика о наступлении страхового случая в течение 3 (трёх) рабочих дней. Уведомление осуществляется по телефону горячей линии и дублируется письменно на электронную почту. При несвоевременном уведомлении Страховщик вправе отказать в страховой выплате."
        }

        Пример 2 — данные практически отсутствуют:
        Фрагмент:
        "Страхователь уведомляет Страховщика о наступлении события,
        имеющего признаки страхового случая."

        Ответ:
        {
          "notification_deadline_present": "no",
          "notification_deadline": "not_defined",
          "notification_methods": "Не установлено",
          "late_notice_consequences": "not_defined",
          "notice_clause_clarity": "unclear",
          "evidence": "Страхователь уведомляет Страховщика о наступлении события, имеющего признаки страхового случая."
        }

        Пример 3 — срок есть, способы и последствия через Правила:
        Фрагмент:
        "Страхователь обязан сообщить Страховщику о страховом случае
        не позднее 24 часов с момента его наступления. Порядок и
        способы уведомления, а также последствия нарушения срока
        определяются Правилами страхования № П-12 от 15.01.2024."

        Ответ:
        {
          "notification_deadline_present": "yes",
          "notification_deadline": "24 часа с момента наступления",
          "notification_methods": "Согласно Правилам страхования № П-12 от 15.01.2024",
          "late_notice_consequences": "vague",
          "notice_clause_clarity": "unclear",
          "evidence": "Страхователь обязан сообщить Страховщику о страховом случае не позднее 24 часов с момента его наступления. Порядок и способы уведомления, а также последствия нарушения срока определяются Правилами страхования № П-12 от 15.01.2024."
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о сроке уведомления (число + единица).
        2. Найди прямую цитату о способах уведомления.
        3. Найди прямую цитату о последствиях просрочки.
        4. Если срок указан как «незамедлительно» без конкретизации —
           ставь notice_clause_clarity = "unclear".
        5. Проверь, что все 6 ключей (5 полей + evidence) присутствуют
           в JSON.

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь РОВНО одним JSON-объектом без какого-либо дополнительного
        текста до или после, со всеми 6 ключами (5 полей + evidence):
        {
          "notification_deadline_present": "<yes / no>",
          "notification_deadline": "<срок или not_defined>",
          "notification_methods": "<перечисление через запятую или fallback>",
          "late_notice_consequences": "<specified / vague / not_defined>",
          "notice_clause_clarity": "<clear / unclear / not_defined>",
          "evidence": "<прямая цитата из договора>"
        }
      context_k: 8
      temperature: 0.0
      max_tokens: 700

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "уведомление о страховом случае извещение о наступлении срок уведомления способ уведомления незамедлительно последствия несвоевременного уведомления просрочка уведомления"
      boost_keywords:
        - "уведомление о страховом случае"
        - "срок уведомления"
        - "последствия"
        - "несвоевременное уведомление"
      preferred_unit_types:
        - obligation
        - general_provision
        - definition
      excluded_unit_types:
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - procedures
        - limitations
      negative_keywords:
        - "премия"
        - "страховая сумма"
      position_bias:
        preferred_range: [0.20, 0.80]
        boost: 0.12
        scope: segment
      context_k: 8
      max_chunks: 10
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
        - "invoice"
      preferred_clause_functions:
        - "obligations"
        - "procedures"
        - "limitations"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 600

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 800
      compact_output: false

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист по договорной работе. Твоя задача — извлечь
        из текста договора страхования порядок уведомления о наступлении
        страхового случая: срок, способы, последствия просрочки.
        Не анализируй порядок выплаты, список документов для выплаты,
        суброгацию — это предмет других проверок.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие 5 полей + evidence (всего 6 ключей):

        1. notification_deadline_present — установлен ли конкретный срок
           уведомления:
           "yes" — есть число + единица (24 часа, 3 дня, 5 рабочих дней);
           "no" — срок не установлен или не упомянут.
        2. notification_deadline — конкретный срок уведомления текстом
           (например, "3 рабочих дня с момента, когда стало известно").
           Если срок не установлен — "not_defined".
           Если определён через Правила — "Согласно Правилам страхования".
        3. notification_methods — перечисление всех явно указанных
           способов уведомления через запятую (например, "телефон,
           электронная почта, личный кабинет").
           Если способы не указаны — "Не установлено".
           Если определены через Правила — "Согласно Правилам страхования".
        4. late_notice_consequences — последствия несвоевременного
           уведомления:
           "specified" — прямо описаны (отказ в выплате, снижение,
           удержание);
           "vague" — упомянуты, но не конкретизированы («вправе
           применить меры», «в соответствии с законодательством»);
           "not_defined" — последствия не упомянуты.
        5. notice_clause_clarity — ясность и полнота порядка уведомления:
           "clear" — срок конкретен, способы перечислены, последствия
           описаны;
           "unclear" — формулировки размыты («незамедлительно» без
           конкретизации, «в разумный срок», отсылка к неопределённым
           Правилам);
           "not_defined" — порядок уведомления не раскрыт.
        </task>

        <context_rules>
        - Используй только текст договора из <context>. Не подставляй
          нормы закона вместо текста договора.
        - Не выводи срок из молчания договора: если нет явной
          формулировки — ставь "not_defined".
        - «Незамедлительно» без конкретизации в часах/днях — это
          "unclear", а не "clear".
        - Если порядок определён через отсылку к Правилам страхования —
          отражай отсылку в user-facing полях.
        - Не делай предположений сверх того, что прямо следует из текста.
        </context_rules>

        <output_expectations>
        - Все 6 ключей (5 полей + evidence) должны присутствовать в ответе.
        - Запрещены значения: null, None, "", "not_found".
        - Для notification_deadline_present допустимо только: yes / no.
        - Для late_notice_consequences допустимо только:
          specified / vague / not_defined.
        - Для notice_clause_clarity допустимо только:
          clear / unclear / not_defined.
        - Fallback-значения:
          * notification_deadline: "not_defined";
          * notification_methods: "Не установлено";
          * "Согласно Правилам страхования № X" — при отсылке.
        - Верни РОВНО один JSON-объект со всеми 6 ключами без какого-либо
          дополнительного текста до или после. Начни ответ сразу с
          открывающей фигурной скобки и закончи закрывающей. НЕ пиши
          Markdown, списки, код-фенсы. Ответ должен быть валидным JSON,
          пригодным для парсинга через json.loads без предварительной
          обработки.
        </output_expectations>
      fields:
        - name: "notification_deadline_present"
          type: "string"
          presentation: "signal"
          allowed_values: ["yes", "no"]
          label: "Срок уведомления установлен"
          description: "Есть ли в договоре конкретный срок уведомления о страховом случае (число + единица)."
          required: true
          display_in_grid: true
          display_priority: 1
        - name: "notification_deadline"
          type: "string"
          presentation: "fact"
          label: "Срок уведомления"
          description: "Конкретный срок уведомления о страховом случае или отсылка к Правилам."
          required: true
          display_in_grid: true
          display_priority: 2
        - name: "notification_methods"
          type: "string"
          presentation: "fact"
          label: "Способы уведомления"
          description: "Перечисление допустимых способов уведомления (телефон, e-mail, письмо, личный кабинет)."
          required: true
          display_in_grid: true
          display_priority: 3
        - name: "late_notice_consequences"
          type: "string"
          presentation: "signal"
          allowed_values: ["specified", "vague", "not_defined"]
          label: "Последствия просрочки"
          description: "Указаны ли последствия несвоевременного уведомления: конкретные (specified), размытые (vague), не упомянуты (not_defined)."
          required: true
          display_in_grid: true
          display_priority: 4
        - name: "notice_clause_clarity"
          type: "string"
          presentation: "signal"
          allowed_values: ["clear", "unclear", "not_defined"]
          label: "Ясность порядка уведомления"
          description: "Насколько ясно и полно сформулирован порядок уведомления о страховом случае."
          required: true
          display_in_grid: true
          display_priority: 5
    store_payload: true

  - id: claims_payment_procedure_check
    name: "Страховая выплата: документы, сроки, основание для отказа"
    description: >
      Проверяет порядок страховой выплаты: конкретный срок, перечень
      документов для урегулирования убытка, основания отказа в выплате
      и наличие формулировок, дающих страховщику чрезмерную дискрецию.
      Критически важный check: по ст. 929 ГК РФ (имущественное) и
      ст. 934 ГК РФ (личное) страховщик обязан произвести выплату
      при наступлении страхового случая. Открытый перечень документов
      или размытые основания отказа — частые инструменты затягивания
      выплаты в российской практике.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "страховая выплата"
        - "страховое возмещение"
        - "в течение рабочих дней"
        - "полный комплект документов"
        - "перечень документов"
        - "отказ в выплате"
        - "выплата производится"
        - "урегулирование убытка"
        - "основания для отказа"
        - "по усмотрению страховщика"
        - "иные документы"
        - "дополнительные документы"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)в\\s+течение\\s+\\d+\\s+(?:рабочих\\s+)?дн"
        - "(?i)полного\\s+комплекта\\s+документ"
        - "(?i)отказ\\s+в\\s+выплат"
        - "(?i)по\\s+усмотрению\\s+страховщика"
        - "(?i)иные\\s+документ"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор страхования по Главе 48 ГК РФ.
        Проверяется только один вопрос: порядок страховой выплаты —
        сроки, документы, основания отказа, дискреция страховщика.

        Нормативный ориентир:
        - ст. 929 ГК РФ — обязанность страховщика выплатить возмещение
          (имущественное страхование)
        - ст. 934 ГК РФ — обязанность выплатить страховую сумму
          (личное страхование)
        - ст. 961 ГК РФ — связь срока выплаты с уведомлением

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте
          договора.
        - Не оценивай серьёзность риска.
        - Учитывай российскую практику: порядок выплаты часто
          определяется через отсылку к Правилам страхования; открытый
          перечень документов («и иные документы по требованию
          страховщика») — красный флаг.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Установлен ли конкретный срок страховой выплаты.
        2. Какой срок (в рабочих/календарных днях, от какого события).
        3. Каков статус перечня документов для выплаты (закрытый /
           открытый / не указан).
        4. Указаны ли основания отказа в выплате.
        5. Есть ли формулировки, дающие страховщику широкое усмотрение
           в определении документов или условий выплаты.

        [ПРАВИЛА]
        1. Используй только текст документа. Не подставляй нормы закона
           вместо текста договора.
        2. Если условие не указано прямо и не следует однозначно из
           текста — возвращай "not_defined".
        3. Если порядок определён через отсылку к Правилам страхования —
           отражай: "Согласно Правилам страхования № X".
        4. Не используй "None", "null", пустые строки. Не используй
           "not_found".
        5. "exhaustive" — перечень документов закрыт («исчерпывающий
           перечень», «иные документы не требуются»).
        6. "open_ended" — перечень открыт («и иные документы»,
           «по требованию страховщика», «дополнительные документы
           по усмотрению»).
        7. "insurer_discretion_risk" = "high", если есть формулировки,
           позволяющие страховщику произвольно расширять перечень
           документов или отказывать без конкретных оснований.
        8. "insurer_discretion_risk" = "low", если перечень закрыт,
           основания отказа конкретны и ограничены.
        9. Не смешивай срок выплаты со сроком уведомления о страховом
           случае (это предмет отдельной проверки).
        10. В evidence включай только текст договора.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — порядок выплаты урегулирован, перечень закрыт:
        Фрагмент:
        "Страховая выплата производится в течение 15 (пятнадцати)
        рабочих дней с даты предоставления Страхователем полного
        комплекта документов. Исчерпывающий перечень документов:
        заявление о выплате, акт осмотра, справка из компетентных
        органов, расчёт убытка. Иные документы не требуются.
        Основания отказа в выплате: умысел Страхователя,
        сообщение заведомо ложных сведений."

        Ответ:
        {
          "payment_deadline_present": "yes",
          "payment_deadline": "15 рабочих дней с даты предоставления полного комплекта документов",
          "documents_list_status": "exhaustive",
          "refusal_grounds_present": "yes",
          "insurer_discretion_risk": "low",
          "evidence": "Страховая выплата производится в течение 15 (пятнадцати) рабочих дней с даты предоставления полного комплекта документов. Исчерпывающий перечень документов: заявление, акт осмотра, справка, расчёт убытка. Иные документы не требуются."
        }

        Пример 2 — перечень открытый, дискреция страховщика:
        Фрагмент:
        "Выплата страхового возмещения производится в течение 10 дней
        после получения Страховщиком всех необходимых документов.
        Перечень документов определяется Страховщиком в каждом
        конкретном случае. Страховщик вправе запросить дополнительные
        документы по своему усмотрению."

        Ответ:
        {
          "payment_deadline_present": "yes",
          "payment_deadline": "10 дней после получения всех необходимых документов",
          "documents_list_status": "open_ended",
          "refusal_grounds_present": "no",
          "insurer_discretion_risk": "high",
          "evidence": "Выплата производится в течение 10 дней после получения всех необходимых документов. Перечень документов определяется Страховщиком. Страховщик вправе запросить дополнительные документы по своему усмотрению."
        }

        Пример 3 — порядок через Правила страхования, основания отказа не раскрыты:
        Фрагмент:
        "Порядок и сроки страховой выплаты, перечень необходимых
        документов и основания для отказа в выплате определяются
        Правилами добровольного страхования имущества № П-12
        от 15.01.2024."

        Ответ:
        {
          "payment_deadline_present": "no",
          "payment_deadline": "Согласно Правилам страхования № П-12 от 15.01.2024",
          "documents_list_status": "unclear",
          "refusal_grounds_present": "no",
          "insurer_discretion_risk": "unclear",
          "evidence": "Порядок и сроки страховой выплаты, перечень необходимых документов и основания для отказа в выплате определяются Правилами добровольного страхования имущества № П-12 от 15.01.2024."
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о сроке выплаты (число + единица).
