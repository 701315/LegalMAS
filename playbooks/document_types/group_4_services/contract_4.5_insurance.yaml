      max_snippet_length: 650

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 800
      compact_output: false

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора страхования порядок
        страховой выплаты: срок, перечень документов, основания отказа.
