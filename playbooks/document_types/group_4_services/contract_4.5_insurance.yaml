type: contract_4.5_insurance
name: "Договор страхования"

description: |
  Соглашение, по которому страховщик обязуется за страховую премию при наступлении
  предусмотренного договором страхового случая выплатить страховое возмещение
  (имущественное страхование) либо страховую сумму (личное страхование).
  Регулируется Главой 48 ГК РФ и Законом РФ от 27.11.1992 № 4015-1
  «Об организации страхового дела в Российской Федерации».
  Характеризуется высокой формализацией, тесной связью с Правилами страхования,
  повышенной значимостью точного описания страхового риска, исключений из покрытия,
  порядка уведомления о страховом случае и условий страховой выплаты.

version: 4.0
parent: class_4_service_provision

metadata:
  category: contract
  subcategory: financial_services
  complexity: high
  risk_level: critical
  jurisdiction: RU
  language: ru
  legal_base: "Глава 48 ГК РФ (ст. 927-970), Закон РФ № 4015-1"
  doc_types_supported:
    - "договор имущественного страхования"
    - "договор личного страхования"
    - "страховой полис"
    - "генеральный полис"
    - "договор страхования ответственности"
    - "договор добровольного страхования"
    - "договор обязательного страхования"
    - "полис ОСАГО"
    - "полис КАСКО"
    - "договор страхования груза"
    - "договор страхования имущества"
    - "договор страхования жизни и здоровья"

engine_expectations:
  evidence_required: true
  evidence_style: "pinpoint"
  allow_not_found: true
  output_style: "dd_grid"
  prefer_structured_outputs: true

# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 1: КЛАССИФИКАЦИЯ (L1/L2)
#  Читается: YAMLRegistry → L1FilenameClassifier, L2HeaderClassifier
# ════════════════════════════════════════════════════════════════════════════

classification_runtime_v1:

  scoring:
    accept_threshold: 0.8
    strong_signal_threshold: 0.88
    ambiguity_margin: 0.18
    input_quality_weight: 1.0

  rules:

    filename_patterns:
      - "(?i)страхован"
      - "(?i)полис"
      - "(?i)insurance"
      - "(?i)osago|осаго|каско"

    folder_patterns:
      - "(?i)insurance"
      - "(?i)страхован"
      - "(?i)полис"

    keywords:

      high:
        - pattern: "(?i)страховщик[а-я]*"
          weight: 0.9
          distinctiveness: high
          context: any
          description: "Страховщик — профессиональный участник страхового дела"

        - pattern: "(?i)страховател[ьяеи]"
          weight: 0.9
          distinctiveness: high
          context: any
          description: "Страхователь как сторона, уплачивающая страховую премию"

        - pattern: "(?i)выгодоприобретател[ьяеи]"
          weight: 0.85
          distinctiveness: high
          context: any
          description: "Выгодоприобретатель по договору страхования"

        - pattern: "(?i)договор\\s+имущественн[огоого\\s]*страхован[ияия]"
          weight: 1.0
          distinctiveness: high
          context: header
          description: "Название договора имущественного страхования"

        - pattern: "(?i)договор\\s+личн[огоого\\s]*страхован[ияия]"
          weight: 1.0
          distinctiveness: high
          context: header
          description: "Название договора личного страхования"

        - pattern: "(?i)договор\\s+страхован[ияия]\\s+ответственност[иью]"
          weight: 1.0
          distinctiveness: high
          context: header
          description: "Страхование гражданской/иной ответственности"

        - pattern: "(?i)договор\\s+добровольн[огоого\\s]*страхован[ияия]"
          weight: 0.9
          distinctiveness: high
          context: header
          description: "Добровольное страхование по соглашению сторон"

        - pattern: "(?i)договор\\s+обязательн[огоого\\s]*страхован[ияия]"
          weight: 0.9
          distinctiveness: high
          context: header
          description: "Обязательное страхование (например, ОСАГО)"

        - pattern: "(?i)договор\\s+страхован[ияия]\\s+груз[аов]"
          weight: 0.9
          distinctiveness: high
          context: header
          description: "Страхование груза при перевозке"

        - pattern: "(?i)договор\\s+страхован[ияия]\\s+имуществ[ао]"
          weight: 0.9
          distinctiveness: high
          context: header
          description: "Страхование имущества"

        - pattern: "(?i)договор\\s+страхован[ияия]\\s+жизн[ииы]\\s+и\\s+здоровь[яеи]"
          weight: 0.9
          distinctiveness: high
          context: header
          description: "Договор страхования жизни и здоровья"

        - pattern: "(?i)страхов[оыйой]\\s+полис"
          weight: 0.95
          distinctiveness: high
          context: header
          description: "Страховой полис как документ, подтверждающий договор"

        - pattern: "(?i)генеральн[ыйого]\\s+полис"
          weight: 0.9
          distinctiveness: high
          context: header
          description: "Генеральный полис для серии однотипных рисков"

        - pattern: "(?i)полис\\s+осаго"
          weight: 0.95
          distinctiveness: high
          context: any
          description: "Полис ОСАГО — обязательное страхование автогражданской ответственности"

        - pattern: "(?i)полис\\s+каско"
          weight: 0.95
          distinctiveness: high
          context: any
          description: "Полис КАСКО — добровольное страхование каско транспортного средства"

        - pattern: "(?i)правил[аы]\\s+страхован[ияия]"
          weight: 0.9
          distinctiveness: high
          context: any
          description: "Правила страхования как составная часть договора"

        - pattern: "(?i)страхов[аяые]\\s+преми[яи]"
          weight: 0.9
          distinctiveness: high
          context: any
          description: "Страховая премия как плата страховщику"

        - pattern: "(?i)страхов[ойаяые]\\s+случа[йея]"
          weight: 0.9
          distinctiveness: high
          context: any
          description: "Страховой случай как наступление покрываемого риска"

        - pattern: "(?i)страхов[аяые]\\s+сумм[аыу]"
          weight: 0.9
          distinctiveness: high
          context: any
          description: "Страховая сумма — максимальный размер ответственности страховщика"

        - pattern: "(?i)страхов[оеая]\\s+возмещен[иеия]"
          weight: 0.9
          distinctiveness: high
          context: any
          description: "Страховое возмещение по имущественному страхованию"

      medium:
        - pattern: "(?i)застрахованн[оа]е\\s+лиц[оа]"
          weight: 0.7
          distinctiveness: medium
          context: any
          description: "Застрахованное лицо — типично для личного страхования"

        - pattern: "(?i)страхов[оа]й\\s+риск"
          weight: 0.7
          distinctiveness: medium
          context: any
          description: "Страховой риск как описанный в договоре случай"

        - pattern: "(?i)\\bфраншиз[ааы]\\b"
          weight: 0.6
          distinctiveness: medium
          context: any
          description: "Франшиза — не покрываемая часть убытка"

        - pattern: "(?i)\\bсуброгаци[яи]\\b"
          weight: 0.6
          distinctiveness: medium
          context: any
          description: "Суброгация — переход к страховщику права требования к виновному"

        - pattern: "(?i)\\bабандон\\b"
          weight: 0.6
          distinctiveness: medium
          context: any
