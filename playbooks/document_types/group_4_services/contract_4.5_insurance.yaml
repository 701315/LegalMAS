        - "назначение выгодоприобретателя"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)согласие\\s+застрахованного\\s+лица"
        - "(?i)выгодоприобретател"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор личного страхования по Главе 48 ГК РФ.
        Проверяется только один вопрос: согласие застрахованного лица
        и статус выгодоприобретателя.

        Нормативный ориентир:
        - ст. 934 ГК РФ — личное страхование
        - ст. 956 ГК РФ — назначение выгодоприобретателя

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора.
        - Не оценивай серьёзность риска.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Идентифицировано ли застрахованное лицо.
        2. Есть ли согласие застрахованного лица.
        3. Кто является выгодоприобретателем.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Если условие не указано прямо — возвращай "not_defined".
        3. Если текстового значения нет — возвращай "not_defined".
        4. Не используй "None", "null", "not_defined" или пустые строки.
        5. В evidence включай только текст договора.
        6. Верни только один JSON-объект.

