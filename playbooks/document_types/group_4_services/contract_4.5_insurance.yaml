           "absent" — обязанность не упомянута;
           "not_applicable" — неприменимо по типу договора.
        4. preserve_evidence — обязанность принять меры к спасению поврежденного объекта
           и сохранению картины происшествия:
           "present" — обязанность прямо прописана;
           "absent" — обязанность не упомянута;
           "not_applicable" — неприменимо (например, страхование ответственности,
