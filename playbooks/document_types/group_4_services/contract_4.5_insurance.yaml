# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 7: DD_REQUEST_TEMPLATES
#  Читается: DDRequestTemplateLoader
#  Ключи = check_id из checks_v8 и doc_type_checks выше.
#  DDRequestTemplateLoader.render() матчит по exact или prefix.
# ════════════════════════════════════════════════════════════════════════════

dd_request_templates:

  insurance_subject_extraction:
    text: >
      Просим предоставить по {doc_names}: полную страховую конструкцию —
      вид страхования, номер полиса/договора, объект страхования, страховой случай,
      страховую сумму, страховую премию, срок действия, сведения о страховщике,
      страхователе, застрахованном лице и выгодоприобретателе.
    addressee: "Страховщик / Юридический советник"

  insured_object_required:
    text: >
      Просим уточнить по {doc_names} объект страхования (имущественный интерес),
      в отношении которого предоставляется страховая защита, и предоставить формулировку,
      позволяющую однозначно определить предмет страхования.
    addressee: "Страховщик"

  insured_event_required:
    text: >
      Просим предоставить по {doc_names} точное описание страхового случая/риска,
      а также разграничение между покрываемыми событиями и исключениями из покрытия.
    addressee: "Страховщик"

  insured_event_and_exclusions_check:
    text: >
      Просим предоставить по {doc_names}: полный перечень страховых случаев,
      исключений из покрытия и оснований отказа в выплате; отдельно просим подтвердить,
      что перечень исключений не является открытым и не содержит формул
      "иные случаи" / "по усмотрению страховщика".
    addressee: "Страховщик / Юридический советник страхователя"

  insurer_identification_and_license:
    text: >
      Просим предоставить по {doc_names}: полное наименование страховщика,
      ОГРН/ИНН, сведения о действующей лицензии Банка России на соответствующий вид страхования,
      а также ссылку на запись в реестре субъектов страхового дела.
    addressee: "Страховщик"

  insurer_license_missing:
    text: >
      В {doc_names} не выявлены достаточные признаки лицензии страховщика.
      Просим срочно предоставить реквизиты лицензии Банка России и подтверждение
      права осуществлять соответствующий вид страхования.
    addressee: "Страховщик"

  rules_of_insurance_attachment_check:
    text: >
      Просим предоставить по {doc_names}: текст Правил страхования, редакцию/дату их утверждения,
      подтверждение вручения или направления страхователю, а также формулировку о включении
      Правил страхования в состав договорной документации.
    addressee: "Страховщик"

  claim_notification_check:
    text: >
      Просим уточнить в {doc_names}: срок уведомления о страховом случае,
      допустимые способы уведомления, адреса/каналы связи, последствия просрочки,
      а также доказательства получения уведомления страховщиком.
    addressee: "Страховщик / Юридический советник"

  claims_payment_procedure_check:
    text: >
      Просим предоставить по {doc_names}: исчерпывающий перечень документов для выплаты,
      срок принятия решения и срок выплаты, основания отказа в выплате,
      а также пояснить, имеются ли у страховщика дискреционные полномочия
      требовать дополнительные документы сверх перечисленных.
    addressee: "Страховщик"

  premium_and_payment_order:
    text: >
      Просим уточнить по {doc_names}: размер страховой премии, график и способ ее уплаты,
      последствия просрочки оплаты, а также момент начала действия страхового покрытия.
    addressee: "Страховщик / Страхователь"

  effective_date_linked_to_premium:
    text: >
      Просим подтвердить по {doc_names}: с какого момента договор считается вступившим в силу,
      связано ли начало страховой защиты с фактической оплатой премии,
      и распространяется ли покрытие на события до даты оплаты.
    addressee: "Страховщик"

  franchise_clarity:
    text: >
      Просим предоставить по {doc_names}: вид франшизы (условная/безусловная),
      ее размер, порядок применения к убытку и пример расчета страховой выплаты
      с учетом франшизы.
    addressee: "Страховщик"

  material_facts_disclosure:
    text: >
      Просим предоставить по {doc_names}: перечень существенных обстоятельств,
      подлежащих раскрытию страхователем, анкету/опросный лист,
      а также последствия неполного или недостоверного раскрытия информации.
    addressee: "Страховщик / Страхователь"

  insured_person_consent_check:
    text: >
      По {doc_names} просим предоставить письменное согласие застрахованного лица
      на заключение договора личного страхования в его отношении (если страхователь и застрахованное лицо различаются),
      а также документы о назначении выгодоприобретателя.
    addressee: "Страхователь / Страховщик"

  insured_person_consent_missing:
    text: >
      В {doc_names} не выявлено явное согласие застрахованного лица.
      Просим предоставить письменное согласие, а также разъяснение о правовой конструкции
      договора и допустимости назначения выгодоприобретателя.
    addressee: "Страхователь / Страховщик"

  early_termination_and_premium_refund_check:
    text: >
      Просим уточнить по {doc_names}: основания досрочного прекращения договора,
      судьбу страховой премии (полный/частичный возврат либо отсутствие возврата),
      методику расчета возвращаемой суммы и сроки возврата.
    addressee: "Страховщик"

  subrogation_clause:
    text: >
      Просим предоставить по {doc_names}: условия о суброгации,
      порядке передачи страховщику документов и прав требования к причинителю вреда,
      а также подтвердить, что договор не исключает право суброгации без специального согласования.
    addressee: "Страховщик"

  double_insurance_and_underinsurance:
    text: >
      Просим раскрыть по {doc_names}: имеются ли иные договоры страхования того же имущества/интереса,
      как урегулировано двойное страхование, и как определяется выплата при неполном страховании.
    addressee: "Страхователь / Страховщик"

  compulsory_insurance_special_law_reference:
    text: >
      Для {doc_names} просим указать конкретный специальный закон об обязательном страховании,
      применимые лимиты ответственности, тарифы, обязательные условия полиса и основания отказа,
      предусмотренные специальным регулированием.
    addressee: "Страховщик / Юридический советник"

  property_insurance_value_basis:
    text: >
      Просим предоставить по {doc_names}: страховую стоимость имущества,
      документы/оценку, на основании которых она определена,
      и подтвердить, что страховая сумма не превышает действительную стоимость имущества.
    addressee: "Страхователь / Страховщик"

  sum_insured_exceeds_property_value:
    text: >
      В {doc_names} выявлен риск несоответствия страховой суммы страховой стоимости имущества.
      Просим предоставить расчет действительной стоимости имущества на дату заключения договора
      и пояснить корректность установленной страховой суммы.
    addressee: "Страховщик / Страхователь"

  liability_insurance_scope:
    text: >
      Просим предоставить по {doc_names}: описание страхуемой ответственности,
      круг третьих лиц, лимиты ответственности, исключения из покрытия и механизм определения убытков.
    addressee: "Страховщик"

  consumer_protection_reference:
    text: >
      Просим подтвердить по {doc_names}: применяется ли к отношениям Закон о защите прав потребителей,
      каков порядок подачи претензий потребителем, сроки ответа и последствия нарушения сроков выплаты.
    addressee: "Страховщик / Юридический советник"

  dispute_resolution_and_complaints:
    text: >
      Просим уточнить в {doc_names}: досудебный порядок урегулирования споров,
      срок рассмотрения претензии, компетентный суд/подсудность,
      а также наличие обязательного обращения к финансовому уполномоченному, если применимо.
    addressee: "Юридический советник"

  illegal_interest_insurance:
    text: >
      Внимание: по {doc_names} выявлен риск страхования противоправного либо недопустимого интереса.
      Просим предоставить правовое заключение о допустимости объекта страхования
      и подтвердить отсутствие обстоятельств, подпадающих под ст. 928 ГК РФ.
    addressee: "Юридический советник"

  risk_increase_and_policyholder_duties_check:
    text: >
      Просим предоставить по {doc_names}: полный перечень обязанностей страхователя 
      в период действия договора, включая уведомление об увеличении степени риска,
      допуск к осмотру имущества, соблюдение условий эксплуатации,
      а также последствия нарушения каждой обязанности.
    addressee: "Страховщик / Юридический советник"

  risk_increase_notification:
    text: >
      Просим уточнить в {doc_names}: в какой срок и каким способом страхователь обязан
      уведомить об увеличении степени риска, какие обстоятельства считаются существенными
      и каковы последствия неуведомления.
    addressee: "Страховщик"

  risk_increase_notification_missing:
    text: >
      В {doc_names} не выявлен порядок уведомления об увеличении степени риска (ст. 959 ГК РФ).
      Просим предусмотреть срок, способ уведомления и последствия несоблюдения.
    addressee: "Юридический советник"

  policyholder_actions_on_event_check:
    text: >
      Просим предоставить по {doc_names}: исчерпывающий перечень действий страхователя
      при наступлении страхового случая, включая уведомление, вызов органов,
      сохранение повреждённого имущества, запрет на ремонт до осмотра,
      а также последствия неисполнения.
    addressee: "Страховщик"

  policyholder_actions_on_event:
    text: >
      Просим уточнить в {doc_names}: перечень обязательных действий страхователя 
      при страховом случае и последствия их неисполнения.
    addressee: "Страховщик"

  territory_and_jurisdiction_check:
    text: >
      Просим уточнить по {doc_names}: территорию действия покрытия,
      ограничения по юрисдикциям и наличие территориальных исключений.
    addressee: "Страховщик"

  territory_of_coverage:
    text: >
      Просим уточнить в {doc_names}: на какую территорию распространяется
      страховое покрытие.
    addressee: "Страховщик"

  claims_made_vs_occurrence_check:
    text: >
      Просим предоставить по {doc_names}: базис покрытия (claims-made или occurrence),
      ретроактивную дату, наличие и продолжительность дополнительного периода 
      уведомления (extended reporting period), а также условия его активации.
    addressee: "Страховщик / Юридический советник"

  claims_made_basis_terms:
    text: >
      Просим уточнить в {doc_names}: ретроактивную дату, наличие ERP/discovery period
      и условия его предоставления.
    addressee: "Страховщик"

  aggregate_and_per_event_limits:
    text: >
      Просим уточнить по {doc_names}: агрегатный лимит на период страхования,
      лимит на одно событие, подлимиты по отдельным рискам
      и порядок восстановления лимита.
    addressee: "Страховщик"

  cooling_off_period:
    text: >
      Просим подтвердить по {doc_names}: наличие периода охлаждения (14 дней),
      порядок отказа от договора в этот период и условия возврата премии.
    addressee: "Страховщик"

  financial_ombudsman_reference:
    text: >
      Просим уточнить в {doc_names}: порядок обращения к финансовому уполномоченному
      как обязательный досудебный этап для потребителей (ФЗ-123).
    addressee: "Страховщик"

  financial_ombudsman_missing_for_consumer:
    text: >
      В {doc_names} не выявлено упоминание финансового уполномоченного.
      Просим включить информацию об обязательном досудебном обращении 
      к финансовому уполномоченному для потребительских договоров.
    addressee: "Юридический советник"

  premium_non_payment_consequences:
    text: >
      Просим уточнить в {doc_names}: последствия просрочки оплаты очередного взноса —
      приостановление покрытия, льготный период, автоматическое расторжение.
    addressee: "Страховщик"

  premium_non_payment_consequences_unclear:
    text: >
      В {doc_names} неясны последствия неуплаты очередного взноса при рассрочке.
      Просим предусмотреть: льготный период, момент приостановления покрытия
      и условия восстановления.
    addressee: "Юридический советник"

  war_sanctions_exclusions:
    text: >
      Просим предоставить по {doc_names}: полный перечень глобальных исключений
      (война, терроризм, ядерные риски, санкции), а также подтвердить,
      не затрагивают ли санкционные исключения интересы страхователя.
    addressee: "Страховщик / Юридический советник"

  # Generic fallback
  _default:
    text: >
      Просим предоставить дополнительную информацию по вопросу «{check_name}»
      применительно к {doc_names}.
    addressee: "Юридический советник"