           застрахованного лица»);
           "not_required" — застрахованное лицо совпадает со
           страхователем (страхует сам себя), согласие
           презюмируется;
           "unclear" — застрахованное лицо указано как третье
           лицо, но формулировка о согласии размыта или
           отсутствует;
           "not_defined" — застрахованное лицо не идентифицировано.
        3. beneficiary_status — статус выгодоприобретателя:
           "named" — выгодоприобретатель конкретно назван (ФИО,
           наименование);
           "default_rules" — выгодоприобретатель не назначен явно,
           применяется законный порядок (наследники, страхователь);
           "not_defined" — вопрос выгодоприобретателя не раскрыт.
        4. consent_snippet — краткая цитата из договора о согласии
           застрахованного лица и/или выгодоприобретателе (до 200
           символов). Если данные отсутствуют — "Не установлено".
        </task>

        <context_rules>
        - Используй только текст договора из <context>. Не подставляй
          нормы закона вместо текста договора.
        - Не выводи согласие из молчания договора: если нет явной
          формулировки и застрахованное лицо — третье лицо, ставь
          "unclear".
        - Если страхователь и застрахованное лицо совпадают — ставь
          "not_required", а не "present".
        - Не делай предположений сверх того, что прямо следует из
          текста.
        </context_rules>

        <output_expectations>
        - Все 5 ключей (4 поля + evidence) должны присутствовать в ответе.
        - Запрещены значения: null, None, "", "not_found".
        - Для insured_person_identified допустимо только: yes / no.
        - Для insured_person_consent_status допустимо только:
          present / not_required / unclear / not_defined.
        - Для beneficiary_status допустимо только:
          named / default_rules / not_defined.
        - Fallback для consent_snippet: "Не установлено".
        - Верни РОВНО один JSON-объект со всеми 5 ключами без какого-либо
          дополнительного текста до или после. Начни ответ сразу с
          открывающей фигурной скобки и закончи закрывающей. НЕ пиши
          Markdown, списки, код-фенсы. Ответ должен быть валидным JSON,
          пригодным для парсинга через json.loads без предварительной
          обработки.
        </output_expectations>
      fields:
        - name: "insured_person_identified"
          type: "string"
          presentation: "signal"
          allowed_values: ["yes", "no"]
          label: "Застрахованное лицо определено"
          description: "Идентифицировано ли застрахованное лицо в тексте договора (ФИО, реквизиты)."
          required: true
          display_in_grid: true
          display_priority: 1
        - name: "insured_person_consent_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["present", "not_required", "unclear", "not_defined"]
          label: "Согласие застрахованного лица"
          description: "Статус согласия: получено (present), не требуется — страхователь = застрахованный (not_required), неясно (unclear), не раскрыто (not_defined)."
          required: true
          display_in_grid: true
          display_priority: 2
        - name: "beneficiary_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["named", "default_rules", "not_defined"]
          label: "Статус выгодоприобретателя"
          description: "Выгодоприобретатель назван конкретно (named), определяется по закону (default_rules), не раскрыт (not_defined)."
          required: true
          display_in_grid: true
          display_priority: 3
        - name: "consent_snippet"
          type: "string"
          presentation: "fact"
          label: "Цитата о согласии и выгодоприобретателе"
          description: "Краткая цитата из договора о согласии застрахованного лица и/или назначении выгодоприобретателя."
          required: true
          display_in_grid: true
          display_priority: 4
    store_payload: true

  - id: early_termination_and_premium_refund_check
    name: "Досрочное прекращение и возврат страховой премии"
    description: >
      Проверяет условия досрочного прекращения договора и судьбу страховой премии
      (возврат в полном объёме, пропорционально неистёкшему сроку или отсутствие возврата).
      Нормативный ориентир: ст. 958 ГК РФ (досрочное прекращение договора страхования).
      Критически важно для российской практики: по п. 3 ст. 958 ГК РФ при досрочном
      отказе страхователя от договора уплаченная страховая премия не подлежит возврату,
      если договором не предусмотрено иное.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "досрочное прекращение"
        - "досрочное расторжение"
        - "возврат страховой премии"
        - "часть страховой премии"
        - "отказ страхователя"
        - "прекращение договора"
        - "отказ от договора"
        - "возврату не подлежит"
        - "удержанием"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)досрочн(ое|ого)\\s+(?:прекращен|расторжен)"
        - "(?i)возврат\\s+страхов(ой|ую)\\s+прем"
        - "(?i)отказ.{0,20}от\\s+договора"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор страхования по Главе 48 ГК РФ.
        Проверяется только один вопрос: условия досрочного прекращения
        договора и порядок возврата страховой премии.

        Нормативный ориентир:
        - ст. 958 ГК РФ — досрочное прекращение договора страхования;
          правила и последствия досрочного отказа страхователя.

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте
          договора.
        - Не оценивай серьёзность риска.
        - Учитывай российскую практику: по закону при досрочном отказе
          страхователя премия возвращается только если это прямо написано
          в договоре. Если договор молчит — премия не возвращается.
          Этот факт должен быть чётко отражён.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Предусмотрено ли право на досрочное расторжение / прекращение
           договора.
        2. Предусмотрен ли возврат страховой премии (или её части).
        3. Какой именно режим возврата премии установлен (пропорционально
           неистёкшему сроку, полный, с удержанием расходов страховщика,
           премия не возвращается).
        4. Цитату из договора, подтверждающую выводы.

        [ПРАВИЛА]
        1. Используй только текст документа. Не подставляй нормы закона
           вместо текста договора.
        2. Если условие не указано прямо и не следует однозначно из
           текста — возвращай "not_defined".
        3. Не используй "None", "null", пустые строки. Не используй
           "not_found".
        4. "full" — премия подлежит возврату в полном объёме при досрочном
           расторжении.
        5. "proportional" — премия подлежит возврату пропорционально
           неистёкшему сроку действия договора (за вычетом расходов или без).
        6. "none" — прямо написано, что премия возврату не подлежит, либо
           договор разрешает расторжение, но оставляет премию у страховщика.
        7. Если договор расторгается, но о судьбе премии вообще ничего
           не сказано — возвращай "none" (так как по закону без прямой оговорки
           премия не возвращается) и поясняй это в summary.
        8. "unclear" — условия сформулированы двусмысленно или противоречиво.
        9. В evidence включай только текст договора.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — пропорциональный возврат премии:
        Фрагмент:
        "При досрочном прекращении настоящего договора по инициативе
        Страхователя ему возвращается часть уплаченной страховой премии
        пропорционально неистёкшему сроку страхования, за вычетом
        фактически понесённых расходов Страховщика в размере 35% от премии."

        Ответ:
        {
          "early_termination_present": "yes",
          "premium_refund_status": "proportional",
          "termination_grounds_summary": "При отказе Страхователя возвращается часть премии пропорционально неистёкшему сроку за вычетом расходов Страховщика в размере 35%.",
          "evidence": "При досрочном прекращении настоящего договора по инициативе Страхователя ему возвращается часть уплаченной страховой премии пропорционально неистёкшему сроку страхования, за вычетом фактически понесённых расходов Страховщика в размере 35%."
        }

        Пример 2 — данные полностью отсутствуют:
        Фрагмент:
        "Договор действует до полного выполнения сторонами своих обязательств."

        Ответ:
        {
          "early_termination_present": "no",
          "premium_refund_status": "not_defined",
          "termination_grounds_summary": "Не установлено — условия досрочного расторжения и возврата премии в тексте договора не указаны.",
          "evidence": "Договор действует до полного выполнения сторонами своих обязательств."
        }

        Пример 3 — расторжение разрешено, но о возврате молчание (по закону возврата нет):
        Фрагмент:
        "Каждая из Сторон вправе в одностороннем порядке отказаться от
        настоящего договора, письменно уведомив другую Сторону не позднее
        чем за 30 дней до даты расторжения. Договор считается расторгнутым
        по истечении указанного срока."

        Ответ:
        {
          "early_termination_present": "yes",
          "premium_refund_status": "none",
          "termination_grounds_summary": "Досрочное расторжение допускается по инициативе любой Стороны за 30 дней. О возврате премии ничего не сказано (по ст. 958 ГК РФ премия возврату не подлежит).",
          "evidence": "Каждая из Сторон вправе в одностороннем порядке отказаться от настоящего договора, письменно уведомив другую Сторону не позднее чем за 30 дней до даты расторжения."
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о досрочном прекращении / расторжении договора.
        2. Найди прямую цитату о возврате страховой премии (если есть).
        3. Если в тексте разрешено расторжение, но о судьбе премии молчание —
           ставь premium_refund_status = "none" согласно ст. 958 ГК РФ.
        4. Проверь, что все 4 ключа (3 поля + evidence) присутствуют
           в JSON.

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь РОВНО одним JSON-объектом без какого-либо дополнительного
        текста до или после, со всеми 4 ключами (3 поля + evidence):
        {
          "early_termination_present": "<yes / no>",
          "premium_refund_status": "<full / proportional / none / unclear / not_defined>",
          "termination_grounds_summary": "<краткое описание или fallback>",
          "evidence": "<прямая цитата из договора>"
        }
      context_k: 7
      temperature: 0.0
      max_tokens: 600

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "досрочное прекращение возврат премии часть уплаченной страховой премии отказ страхователя прекращение договора возврату не подлежит расходы страховщика"
      boost_keywords:
        - "досрочное прекращение"
        - "возврат страховой премии"
        - "возврату не подлежит"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - technical_fragment
      preferred_clause_functions:
        - remedies
        - procedures
        - limitations
      negative_keywords:
        - "оглавление"
        - "индекс"
      position_bias:
        preferred_range: [0.20, 0.90]
        boost: 0.15
        scope: segment
      context_k: 7
      max_chunks: 10
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
        - "invoice"
      preferred_clause_functions:
        - "remedies"
        - "procedures"
        - "limitations"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 35
      max_snippet_length: 500

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 650
      compact_output: false

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист по договорной работе. Твоя задача — извлечь
        из текста договора страхования условия досрочного прекращения
        договора и возврата уплаченной страховой премии.
        Не анализируй порядок уведомления о страховом случае, выплаты,
        франшизу — это предмет других проверок.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие 3 поля + evidence (всего 4 ключа):

        1. early_termination_present — предусмотрена ли возможность
           досрочного расторжения / прекращения договора:
           "yes" — в тексте прямо описана процедура или право на отказ;
           "no" — условия досрочного расторжения не упомянуты.
        2. premium_refund_status — статус возврата уплаченной страховой
           премии при досрочном прекращении:
           "full" — премия подлежит возврату в полном объёме;
           "proportional" — премия возвращается пропорционально неистёкшему
           сроку действия (за вычетом расходов страховщика или без них);
           "none" — прямо написано, что премия не возвращается, ЛИБО
           договор допускает расторжение, но оставляет премию у страховщика
           (молчание договора о возврате премии по ст. 958 ГК РФ трактуется
           как отсутствие возврата);
           "unclear" — условия возврата сформулированы двусмысленно;
           "not_defined" — условия расторжения вообще не упомянуты.
        3. termination_grounds_summary — краткое описание оснований
           досрочного прекращения и режима расчётов при этом.
           Если данные отсутствуют — "Не установлено".
        </task>

        <context_rules>
        - Используй только текст договора из <context>. Не подставляй
          нормы закона вместо текста договора.
        - Важное юридическое правило: если расторжение допускается, но
          о судьбе премии в тексте договора молчание — возвращай статус
          "none", а в summary указывай, что по закону возврат не производится.
        - Не делай предположений сверх того, что прямо следует из текста.
        </context_rules>

        <output_expectations>
        - Все 4 ключа (3 поля + evidence) должны присутствовать в ответе.
        - Запрещены значения: null, None, "", "not_found".
        - Для early_termination_present допустимо только: yes / no.
        - Для premium_refund_status допустимо только:
          full / proportional / none / unclear / not_defined.
        - Fallback для termination_grounds_summary: "Не установлено".
        - Верни РОВНО один JSON-объект со всеми 4 ключами без какого-либо
          дополнительного текста до или после. Начни ответ сразу с
          открывающей фигурной скобки и закончи закрывающей. НЕ пиши
          Markdown, списки, код-фенсы. Ответ должен быть валидным JSON,
          пригодным для парсинга через json.loads без предварительной
          обработки.
        </output_expectations>
      fields:
        - name: "early_termination_present"
          type: "string"
          presentation: "signal"
          allowed_values: ["yes", "no"]
          label: "Досрочное расторжение"
          description: "Предусмотрена ли в договоре возможность досрочного расторжения или одностороннего отказа."
          required: true
          display_in_grid: true
          display_priority: 1
        - name: "premium_refund_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["full", "proportional", "none", "unclear", "not_defined"]
          label: "Возврат премии при расторжении"
          description: "Статус возврата уплаченной премии: в полном объёме (full), пропорционально (proportional), не возвращается (none), не раскрыто (not_defined)."
          required: true
          display_in_grid: true
          display_priority: 2
        - name: "termination_grounds_summary"
          type: "string"
          presentation: "fact"
          label: "Условия расторжения и возврата"
          description: "Краткое юридическое описание условий расторжения и порядка расчётов по страховой премии."
          required: true
          display_in_grid: true
          display_priority: 3
    store_payload: true

  - id: risk_increase_and_policyholder_duties_check
    name: "Обязанности страхователя в период действия договора (ст. 959, 961 ГК РФ)"
    description: >
      Проверяет наличие и полноту обязанностей страхователя по контролю степени риска
      в период действия договора: уведомление об увеличении риска (ст. 959 ГК РФ),
      допуск страховщика к осмотру имущества, соблюдение правил сохранности и эксплуатации.
      Критически важно: неисполнение обязанности по уведомлению об увеличении риска дает
      страховщику право требовать расторжения договора или пересмотра тарифов, а также
      служит частым основанием для отказа в выплате.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "увеличение степени риска"
        - "изменение обстоятельств"
        - "обязан уведомить"
        - "обязан сообщить"
        - "осмотр имущества"
        - "допуск к осмотру"
        - "сохранность имущества"
        - "содержание имущества"
        - "условия эксплуатации"
        - "ухудшение риска"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)увеличен(ие|ия)\\s+(степени\\s+)?риска"
        - "(?i)обязан.*(уведомить|сообщить).*(страховщик|об\\s+изменен)"
        - "(?i)допуск.{0,20}осмотр"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор страхования по Главе 48 ГК РФ.
        Проверяется только один вопрос: обязанности страхователя в период
        действия договора по уходу за риском и содержанию объекта.

        Нормативный ориентир:
        - ст. 959 ГК РФ — обязанность уведомить об увеличении степени риска;
          последствия неисполнения обязанности страхователем.
        - ст. 961 ГК РФ — общие обязанности по уменьшению убытков.

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора.
        - Не оценивай серьёзность риска.
        - Учитывай российскую практику: формулировки об увеличении риска
          часто размыты. Если в договоре нет конкретных сроков уведомления,
          по закону (ст. 959 ГК РФ) действует срок «незамедлительно», но в
          договоре он может быть обойден молчанием.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Обязанность незамедлительно уведомить об увеличении степени риска.
        2. Конкретный срок и способ уведомления об увеличении риска.
        3. Последствия неуведомления об увеличении риска.
        4. Обязанность допускать представителей страховщика для осмотра имущества.
        5. Оценку полноты обязанностей страхователя в тексте договора.

        [ПРАВИЛА]
        1. Используй только текст документа. Не подставляй нормы закона вместо
           текста договора.
        2. Если условие не указано прямо и не следует однозначно из текста —
           возвращай "not_defined" в фактологических полях и "absent" в сигнальных.
        3. Не используй "None", "null", пустые строки. Не используй "not_found".
        4. "present" — обязанность прямо прописана в тексте договора.
        5. "absent" — обязанность отсутствует или не упомянута.
        6. "not_applicable" — обязанность неприменима по типу страхования (например,
           осмотр застрахованного имущества неприменим в страховании ответственности).
        7. "specified" — последствия неуведомления прямо описаны в договоре
           (расторжение, отказ в выплате, штраф).
        8. "comprehensive" — детально описаны как уведомление о рисках (со сроками),
           так и правила эксплуатации и допуск к осмотру.
        9. "partial" — есть только общая фраза об увеличении риска, без конкретных сроков
           и без правил осмотра.
        10. "minimal" — обязанности сформулированы декларативно («соблюдать правила»).
        11. В evidence включай только текст договора.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — обязанности прописаны детально:
        Фрагмент:
        "Страхователь обязан незамедлительно, в течение 2 (двух) рабочих дней,
        письменно уведомить Страховщика обо всех существенных изменениях в
        обстоятельствах, увеличивающих степень страхового риска. При неисполнении
        данной обязанности Страховщик вправе потребовать расторжения договора.
        Страхователь обязан обеспечивать сохранность застрахованного имущества
        и беспрепятственно допускать представителей Страховщика для его осмотра."

        Ответ:
        {
          "risk_increase_notification_clause": "present",
          "notification_deadline": "в течение 2 рабочих дней письменно",
          "non_notification_consequences": "specified",
          "inspection_access_clause": "present",
          "policyholder_duties_completeness": "comprehensive",
          "evidence": "Страхователь обязан незамедлительно, в течение 2 (двух) рабочих дней, письменно уведомить Страховщика обо всех существенных изменениях в обстоятельствах, увеличивающих степень страхового риска. При неисполнении данной обязанности Страховщик вправе потребовать расторжения договора. Страхователь обязан обеспечивать сохранность застрахованного имущества и беспрепятственно допускать представителей Страховщика для его осмотра."
        }

        Пример 2 — данные полностью отсутствуют:
        Фрагмент:
        "Договор действует в соответствии с правилами страхового дела."

        Ответ:
        {
          "risk_increase_notification_clause": "absent",
          "notification_deadline": "not_defined",
          "non_notification_consequences": "not_defined",
          "inspection_access_clause": "absent",
          "policyholder_duties_completeness": "absent",
          "evidence": "Договор действует в соответствии с правилами страхового дела."
        }

        Пример 3 — обязанность есть без срока, осмотр неприменим (страхование ответственности):
        Фрагмент:
        "Страхователь обязан сообщать Страховщику обо всех обстоятельствах,
        изменяющих степень риска причинения вреда третьим лицам. В случае
        нарушения этой обязанности применяются последствия, предусмотренные
        законодательством РФ."

        Ответ:
        {
          "risk_increase_notification_clause": "present",
          "notification_deadline": "not_defined",
          "non_notification_consequences": "specified",
          "inspection_access_clause": "not_applicable",
          "policyholder_duties_completeness": "partial",
          "evidence": "Страхователь обязан сообщать Страховщику обо всех обстоятельствах, изменяющих степень риска причинения вреда третьим лицам. В случае нарушения этой обязанности применяются последствия, предусмотренные законодательством РФ."
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату об обязанности уведомить об увеличении риска.
        2. Найди прямую цитату о сроке уведомления (если есть).
        3. Найди прямую цитату о последствиях нарушения этой обязанности.
        4. Оцени применимость осмотра объекта страхования (для имущества — применим,
           для гражданской ответственности / финансовых рисков — обычно нет).
        5. Проверь, что все 6 ключей (5 полей + evidence) присутствуют в JSON.

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь РОВНО одним JSON-объектом без какого-либо дополнительного текста
        до или после, со всеми 6 ключами (5 полей + evidence):
        {
          "risk_increase_notification_clause": "<present / absent>",
          "notification_deadline": "<срок или not_defined>",
          "non_notification_consequences": "<specified / not_defined>",
          "inspection_access_clause": "<present / absent / not_applicable>",
          "policyholder_duties_completeness": "<comprehensive / partial / minimal / absent>",
          "evidence": "<прямая цитата из договора>"
        }
      context_k: 8
      temperature: 0.0
      max_tokens: 700

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "увеличение степени риска изменение обстоятельств обязан уведомить страховщика допуск к осмотру сохранность имущества условия эксплуатации ухудшение риска"
      boost_keywords:
        - "увеличение степени риска"
        - "обязан уведомить"
        - "допуск к осмотру"
      preferred_unit_types:
        - obligation
        - general_provision
        - definition
        - structural_anchor
      excluded_unit_types:
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - procedures
        - limitations
      negative_keywords:
        - "оглавление"
        - "индекс"
      position_bias:
        preferred_range: [0.10, 0.80]
        boost: 0.12
        scope: segment
      context_k: 8
      max_chunks: 12
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
        - "invoice"
      preferred_clause_functions:
        - "obligations"
        - "procedures"
        - "limitations"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 600

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 800
      compact_output: false

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист по договорной работе. Твоя задача — извлечь из текста
        договора страхования обязанности страхователя в период действия договора
        по контролю степени страхового риска (уведомление об изменении обстоятельств,
        допуск к осмотру, сохранность).
        Не анализируй порядок уведомления о страховом случае, порядок выплат,
        расторжение — это предмет других проверок.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие 5 полей + evidence (всего 6 ключей):

        1. risk_increase_notification_clause — есть ли в договоре обязанность
           уведомлять об увеличении степени страхового риска:
           "present" — обязанность прямо установлена;
           "absent" — обязанность не упомянута.
        2. notification_deadline — конкретный срок и способ уведомления об
           увеличении степени риска (например, "в течение 2 рабочих дней письменно").
           Если срок не установлен — "not_defined".
        3. non_notification_consequences — указаны ли в договоре последствия
           нарушения обязанности по уведомлению о риске:
           "specified" — последствия описаны (право расторгнуть, пересмотреть тарифы,
           отказать в выплате);
           "not_defined" — последствия не указаны или есть бланкетная отсылка к закону.
        4. inspection_access_clause — обязанность страхователя допускать страховщика
           для осмотра застрахованного объекта / имущества:
           "present" — обязанность прямо прописана;
           "absent" — обязанность не упомянута;
           "not_applicable" — осмотр имущества неприменим по типу договора
           (страхование ответственности, финансовые риски, личное страхование без
           привязки к рабочему месту).
        5. policyholder_duties_completeness — оценка полноты обязанностей страхователя:
           "comprehensive" — детально описаны как уведомление о рисках (со сроками),
           так и правила эксплуатации / сохранности и допуск к осмотру;
           "partial" — есть только обязанность сообщить об изменении риска, но без
           сроков и осмотра;
           "minimal" — обязанности носят сугубо общий, декларативный характер;
           "absent" — обязанности в тексте договора не раскрыты.
        </task>

        <context_rules>
        - Используй только текст договора из <context>. Не подставляй нормы
          закона вместо текста договора.
        - Срок уведомления об увеличении риска — это не срок сообщения о самом
          страховом случае (не путай их!).
        - Если застрахован объект гражданской ответственности, финансовый риск
          или жизнь/здоровье, осмотр имущества чаще всего "not_applicable".
        - Не делай предположений сверх того, что прямо следует из текста.
        </context_rules>

        <output_expectations>
        - Все 6 ключей (5 полей + evidence) должны присутствовать в ответе.
        - Запрещены значения: null, None, "", "not_found".
        - Для risk_increase_notification_clause допустимо только: present / absent.
        - Для notification_deadline допустимо только: конкретный текст или not_defined.
        - Для non_notification_consequences допустимо только: specified / not_defined.
        - Для inspection_access_clause допустимо только: present / absent / not_applicable.
        - Для policyholder_duties_completeness допустимо только:
          comprehensive / partial / minimal / absent.
        - Fallback для notification_deadline: "not_defined".
        - Верни РОВНО один JSON-объект со всеми 6 ключами без какого-либо
          дополнительного текста до или после. Начни ответ сразу с открывающей
          фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки,
          код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга
          через json.loads без предварительной обработки.
        </output_expectations>
      fields:
        - name: "risk_increase_notification_clause"
          type: "string"
          presentation: "signal"
          allowed_values: ["present", "absent"]
          label: "Обязанность уведомлять о риске"
          description: "Предусмотрена ли обязанность незамедлительно уведомлять страховщика об увеличении степени риска (ст. 959 ГК РФ)."
          required: true
          display_in_grid: true
          display_priority: 1
        - name: "notification_deadline"
          type: "string"
          presentation: "fact"
          label: "Срок уведомления о риске"
          description: "Конкретный срок и способ уведомления об увеличении степени риска."
          required: true
          display_in_grid: true
          display_priority: 2
        - name: "non_notification_consequences"
          type: "string"
          presentation: "signal"
          allowed_values: ["specified", "not_defined"]
          label: "Последствия неуведомления"
          description: "Предусмотрены ли в договоре последствия неисполнения обязанности сообщить об изменении риска."
          required: true
          display_in_grid: true
          display_priority: 3
        - name: "inspection_access_clause"
          type: "string"
          presentation: "signal"
          allowed_values: ["present", "absent", "not_applicable"]
          label: "Допуск к осмотру"
          description: "Установлена ли обязанность страхователя допускать страховщика к осмотру застрахованного объекта."
          required: true
          display_in_grid: true
          display_priority: 4
        - name: "policyholder_duties_completeness"
          type: "string"
          presentation: "signal"
          allowed_values: ["comprehensive", "partial", "minimal", "absent"]
          label: "Полнота обязанностей"
          description: "Общий уровень детальности и жесткости обязанностей страхователя по уходу за риском в период действия договора."
          required: true
          display_in_grid: true
          display_priority: 5
    store_payload: true

  - id: policyholder_actions_on_event_check
    name: "Действия страхователя при наступлении страхового случая"
    description: >
      Проверяет наличие и полноту регламента обязательных действий страхователя
      при наступлении события: вызов компетентных органов (МЧС, полиция),
      минимизация ущерба, сохранение картины происшествия и запрет на ремонт до осмотра.
      Нормативный ориентир: ст. 961–962 ГК РФ. Нарушение этих процедур — одна из
      главных причин отказа в выплате в российской практике.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "при наступлении страхового случая"
        - "обязан незамедлительно"
        - "вызвать компетентные органы"
        - "сохранить повреждённое имущество"
        - "обратиться в полицию"
        - "акт осмотра"
        - "зафиксировать"
        - "предоставить к осмотру"
        - "не производить ремонт"
        - "принять меры"
        - "минимизация ущерба"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)при\\s+наступлении\\s+страхового\\s+случая"
        - "(?i)обязан.*(незамедлительно|в\\s+течение)"
        - "(?i)до\\s+осмотра.*не\\s+(?:производить|проводить)\\s+ремонт"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор страхования по Главе 48 ГК РФ.
        Проверяется только один вопрос: обязательные действия страхователя
        при наступлении страхового случая.

        Нормативный ориентир:
        - ст. 961 ГК РФ — обязанность уведомить о страховом случае.
        - ст. 962 ГК РФ — обязанность уменьшить убытки от страхового случая.

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора.
        - Не оценивай серьёзность риска.
        - Учитывай российскую практику: требования к фиксации ущерба
          (вызов полиции, МЧС) и запрет на ремонт/утилизацию до осмотра
          являются строго обязательными. Для видов страхования, где нет
          физического объекта (например, гражданская ответственность),
          сохранение имущества и запрет на ремонт чаще всего не применимы.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Наличие специального раздела или пункта о действиях при наступлении случая.
        2. Обязанность незамедлительно уведомить страховщика.
        3. Обязанность вызвать компетентные органы (МЧС, полицию, ГИБДД).
        4. Обязанность принять меры по сохранению повреждённого объекта / минимизации убытков.
        5. Прямой запрет на ремонт или изменение картины происшествия до осмотра страховщиком.
        6. Общую полноту и жесткость регламента действий.

        [ПРАВИЛА]
        1. Используй только текст документа. Не подставляй нормы закона вместо
           текста договора.
        2. Если условие не указано прямо и не следует однозначно из текста —
           возвращай "not_defined" в фактологических полях и "absent" в сигнальных.
        3. Не используй "None", "null", пустые строки. Не используй "not_found".
        4. "present" — обязанность прямо прописана в договоре.
        5. "absent" — обязанность отсутствует или не упомянута.
        6. "not_applicable" — обязанность неприменима по типу страхования (например,
           сохранение имущества и запрет на ремонт неприменимы в страховании ответственности
           или личном страховании).
        7. "comprehensive" — регламент содержит все обязательные действия: органы,
           минимизация убытков, сохранность и запрет на ремонт до осмотра.
        8. "partial" — регламент описан частично (например, только вызов органов и
           сообщение страховщику, но без запрета на ремонт).
        9. "minimal" — регламент сформулирован декларативно («сообщить и действовать
           разумно»).
        10. В evidence включай только текст договора.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — действия урегулированы детально:
        Фрагмент:
        "При наступлении события, имеющего признаки страхового случая, Страхователь
        обязан незамедлительно вызвать компетентные государственные органы (МЧС,
        полицию), принять все разумные и доступные меры по минимизации ущерба и
        сохранению повреждённого имущества. Страхователю запрещается производить
        любые ремонтные работы или изменять картину происшествия до проведения
        осмотра представителем Страховщика."

        Ответ:
        {
          "actions_section_present": "yes",
          "notify_insurer": "present",
          "contact_authorities": "present",
          "preserve_evidence": "present",
          "no_repair_before_inspection": "present",
          "actions_completeness": "comprehensive",
          "evidence": "При наступлении события, имеющего признаки страхового случая, Страхователь обязан незамедлительно вызвать компетентные государственные органы (МЧС, полицию), принять все разумные и доступные меры по минимизации ущерба и сохранению повреждённого имущества. Страхователю запрещается производить любые ремонтные работы или изменять картину происшествия до проведения осмотра представителем Страховщика."
        }

        Пример 2 — данные отсутствуют:
        Фрагмент:
