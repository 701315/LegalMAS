        3. contract_effective_condition — момент вступления договора в силу:
           "upon_payment" — с момента уплаты премии / первого взноса;
           "upon_signing" — в момент подписания;
           "specified_date" — с конкретно указанной даты;
           "not_defined" — не раскрыто.

        4. late_payment_consequences — последствия нарушения сроков оплаты.
