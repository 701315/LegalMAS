          context: any
          description: "Объём страхового покрытия"

      low:
        - pattern: "(?i)\\bперестраховани[ея]\\b"
          weight: 0.4
          distinctiveness: low
          context: any
          description: "Перестрахование как сопутствующий институт"

        - pattern: "(?i)лимит\\s+ответственност[ии]"
          weight: 0.35
          distinctiveness: low
          context: any
          description: "Лимит ответственности страховщика"

        - pattern: "(?i)неполн[оа]е\\s+страховани[ея]"
          weight: 0.35
          distinctiveness: low
          context: any
          description: "Неполное страхование"

        - pattern: "(?i)двойн[оа]е\\s+страховани[ея]"
          weight: 0.35
          distinctiveness: low
          context: any
          description: "Двойное страхование"

        - pattern: "(?i)страхов[оа]й\\s+тариф"
          weight: 0.35
          distinctiveness: low
          context: any
          description: "Страховой тариф (ставка премии)"

        - pattern: "(?i)\\bагент\\b"
          weight: 0.25
          distinctiveness: low
          context: any
          description: "Упоминание страхового агента/посредника"

        - pattern: "(?i)\\bброкер\\b"
          weight: 0.25
          distinctiveness: low
          context: any
          description: "Упоминание страхового брокера"

    exclusions:
      - pattern: "(?i)социальн[оа]е\\s+страховани[ея]"
        severity: hard
        weight: -1.0
        description: "Социальное страхование в системе обязательного соцстраха, а не гражданско-правовой договор страхования"

      - pattern: "(?i)\\bомс\\b"
        severity: hard
        weight: -1.0
        description: "Обязательное медицинское страхование в публично-правовой системе"

      - pattern: "(?i)пенсионн[оа]е\\s+страховани[ея]"
        severity: hard
        weight: -1.0
        description: "Пенсионное страхование относится к системе обязательного соцстраха/накоплений"

      - pattern: "(?i)банковск[а-яё]+\\s+гаранти[яи]"
        severity: hard
        weight: -1.0
        description: "Банковская гарантия — независимое обязательство банка, не договор страхования"

      - pattern: "(?i)\\bпоручительств[оа]\\b"
        severity: hard
        weight: -1.0
        description: "Поручительство — способ обеспечения исполнения обязательств, не страхование"

      - pattern: "(?i)игр[аа]\\s+и\\s+пари"
        severity: hard
        weight: -1.0
        description: "Игры и пари — отдельный вид обязательств, не страховой договор"

      # ── Soft exclusions

      - pattern: "(?i)кредитн[оа]е\\s+страховани[ея]"
        severity: soft
        weight: -0.3
        description: "Кредитное страхование может идти в составе кредитной документации; снижает уверенность в том, что документ — именно страховой договор"

      - pattern: "(?i)ипотечн[оа]е\\s+страховани[ея]"
        severity: soft
        weight: -0.25
        description: "Ипотечное страхование часто оформляется шаблонами банка; тип может конкурировать с банковской документацией"

      - pattern: "(?i)страхов[а-яё]+\\s+част[ьи]\\s+взнос[ао]\\s+по\\s+кредит[уу]"
        severity: soft
        weight: -0.3
        description: "Страхование платежей по кредиту внутри кредитного пакета, а не отдельный страховой договор"

