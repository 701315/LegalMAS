           - "present" — если хотя бы одно из содержательных полей
             (payment_form, contract_effective_condition) ≠ "not_defined";
           - "missing" — если оба содержательных поля = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - payment_form = "not_defined";
           - contract_effective_condition = "not_defined";
           - premium_due_date = "not_defined";
           - late_payment_consequences = "not_defined";
           - premium_payment_summary = "Не установлено";
           - не выполняй остальные шаги.

        1. payment_form — форма уплаты страховой премии:
           "single" — единовременным платежом;
           "installments" — частями в рассрочку (по графику);
