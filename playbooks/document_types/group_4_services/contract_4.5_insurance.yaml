  - id: dispute_resolution_and_good_faith_check
    name: "Разрешение споров и добросовестность сторон"
    description: >
      Проверяет порядок разрешения споров по договору страхования:
      наличие и содержание претензионного (досудебного) порядка,
      договорную подсудность, а также условия, ограничивающие право
      страхователя на судебную защиту. Критически важно: невыгодная
      договорная подсудность и отсутствие чёткого претензионного порядка
      создают риск затягивания выплаты и роста судебных издержек.
      Правовые ориентиры — ст. 4 АПК РФ, ст. 32 ГПК РФ, ст. 10 ГК РФ
      (добросовестность), Постановление Пленума ВС РФ от 23.06.2015 № 25.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "medium"
    severity_if_pass: "pass"
    severity_if_fail: "medium"
    severity_if_unclear: "low"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "претензионный порядок"
        - "досудебный порядок"
        - "подсудность"
        - "рассмотрение споров"
        - "арбитражный суд"
        - "суд по месту нахождения страховщика"
        - "до обращения в суд"
        - "письменная претензия"
        - "срок ответа на претензию"
        - "добросовестность"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)претензионн(ый|ого)\\s+поряд"
        - "(?i)досудебн(ый|ого)\\s+поряд"
        - "(?i)подсудност"
        - "(?i)по\\s+месту\\s+нахождения\\s+страховщик"
        - "(?i)до\\s+обращени(я|е)\\s+в\\s+суд"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор страхования по Главе 48 ГК РФ.
        Проверяется только один вопрос: порядок разрешения споров
        и добросовестность сторон.

        Нормативные ориентиры:
        - ст. 4 АПК РФ — претензионный порядок для споров между организациями / ИП;
        - ст. 32 ГПК РФ — договорная подсудность;
        - ст. 10 ГК РФ — пределы осуществления гражданских прав, добросовестность;
        - Постановление Пленума ВС РФ от 23.06.2015 № 25 — добросовестность сторон.

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора.
        - Не оценивай серьёзность риска субъективно.
        - Учитывай российскую практику: договорная подсудность, привязанная
          к месту нахождения страховщика, при наличии страховщика в другом
          регионе существенно повышает издержки страхователя на судебную защиту.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Установлен ли претензионный (досудебный) порядок разрешения споров.
        2. Указан ли конкретный срок ответа на претензию.
        3. Определена ли договорная подсудность (суд по месту нахождения
           страховщика / иной суд).
        4. Есть ли условия, ограничивающие право страхователя на судебную защиту.

        [ПРАВИЛА]
        1. Используй только текст документа. Не подставляй нормы закона
           вместо текста договора.
        2. Если условие не указано прямо и не следует однозначно из текста —
           возвращай "not_defined".
        3. Не используй "None", "null", пустые строки. Не используй "not_found".
        4. "insurer_location" — договорная подсудность привязана к месту
           нахождения страховщика.
        5. "policyholder_location" — договорная подсудность привязана к месту
           нахождения страхователя.
        6. "neutral" — договорная подсудность привязана к нейтральному суду
           (например, Арбитражный суд г. Москвы независимо от местонахождения
           сторон).
        7. "not_defined" — договорная подсудность не установлена (действует
           законная подсудность).
        8. "present" — в договоре прямо установлен срок ответа на претензию.
        9. В evidence включай только текст договора.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — претензионный порядок с подсудностью страховщика:
        Фрагмент:
        "Все споры по настоящему договору разрешаются путём переговоров.
        До обращения в суд обязательным является направление письменной
        претензии. Срок ответа на претензию — 15 рабочих дней. При недостижении
        согласия спор передаётся на рассмотрение Арбитражного суда города
        Москвы по месту нахождения Страховщика."

        Ответ:
        {
          "pretension_order_status": "present",
          "pretension_response_deadline": "15 рабочих дней",
          "jurisdiction_clause": "insurer_location",
          "restrictive_clauses_status": "not_defined",
          "dispute_summary": "Претензионный порядок с ответом 15 рабочих дней. Подсудность — АС г. Москвы (по месту нахождения страховщика).",
          "evidence": [
            {
              "clause_ref": "п. X.Y",
              "quote": "Все споры по настоящему договору разрешаются путём переговоров. До обращения в суд обязательным является направление письменной претензии. Срок ответа на претензию — 15 рабочих дней. При недостижении согласия спор передаётся на рассмотрение Арбитражного суда города Москвы по месту нахождения Страховщика."
            }
          ]
        }

        Пример 2 — нейтральная подсудность:
        Фрагмент:
        "Все споры, возникающие из настоящего договора, подлежат рассмотрению
        в Арбитражном суде города Москвы независимо от места нахождения Сторон.
        Претензионный порядок не является обязательным."

        Ответ:
        {
          "pretension_order_status": "not_defined",
          "pretension_response_deadline": "not_defined",
          "jurisdiction_clause": "neutral",
          "restrictive_clauses_status": "not_defined",
          "dispute_summary": "Нейтральная подсудность (АС г. Москвы). Претензионный порядок не предусмотрен.",
          "evidence": [
            {
              "clause_ref": "п. X.Y",
              "quote": "Все споры, возникающие из настоящего договора, подлежат рассмотрению в Арбитражном суде города Москвы независимо от места нахождения Сторон. Претензионный порядок не является обязательным."
            }
          ]
        }

        Пример 3 — данные отсутствуют:
        Фрагмент:
        "Договор вступает в силу с момента его подписания Сторонами."

        Ответ:
        {
          "pretension_order_status": "not_defined",
          "pretension_response_deadline": "not_defined",
          "jurisdiction_clause": "not_defined",
          "restrictive_clauses_status": "not_defined",
          "dispute_summary": "Не установлено — порядок разрешения споров и подсудность в тексте не раскрыты.",
          "evidence": [
            {
              "clause_ref": "п. X.Y",
              "quote": "Договор вступает в силу с момента его подписания Сторонами."
            }
          ]
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о претензионном / досудебном порядке.
        2. Найди прямую цитату о договорной подсудности (если есть).
        3. Оцени, не привязана ли подсудность к месту нахождения страховщика.
        4. Проверь, что все 6 ключей (5 полей + evidence) присутствуют в JSON.

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь РОВНО одним JSON-объектом без какого-либо дополнительного
        текста до или после, со всеми 6 ключами (5 полей + evidence):
        {
          "pretension_order_status": "<present / absent / not_defined>",
          "pretension_response_deadline": "<срок или not_defined>",
          "jurisdiction_clause": "<insurer_location / policyholder_location / neutral / not_defined>",
          "restrictive_clauses_status": "<present / absent / not_defined>",
          "dispute_summary": "<краткое описание или fallback>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 650

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "претензионный порядок досудебный порядок подсудность рассмотрение споров арбитражный суд по месту нахождения страховщика до обращения в суд"
      boost_keywords:
        - "претензионный порядок"
        - "подсудность"
        - "рассмотрение споров"
        - "досудебный порядок"
      preferred_unit_types:
        - dispute_resolution
        - obligation
        - general_provision
      excluded_unit_types:
        - technical_fragment
      preferred_clause_functions:
        - boilerplate
        - procedures
        - limitations
      negative_keywords:
        - "оглавление"
        - "индекс"
      position_bias:
        preferred_range: [0.60, 1.0]
        boost: 0.15
        scope: segment
      context_k: 6
      max_chunks: 8
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
        - "invoice"
      preferred_clause_functions:
        - "boilerplate"
        - "procedures"
        - "limitations"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 500

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 700

      compact_output: false

      presence_signal:
        field: "dispute_resolution_and_good_faith_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист по договорной работе. Твоя задача — извлечь
        из текста договора страхования сведения о порядке разрешения споров:
        претензионный порядок, договорная подсудность, ограничительные условия.
        Не анализируй порядок выплаты, страховой случай, исключения — это
        предмет других проверок.
        Не оценивай риски.
        Анализируй только текст договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. dispute_resolution_and_good_faith_check_presence:
           Агрегатное signal-поле — наличие условий о разрешении споров.
           - "present" — если хотя бы одно из содержательных полей
             (pretension_order_status, jurisdiction_clause,
              restrictive_clauses_status) ≠ "not_defined";
           - "missing" — если все три содержательных поля = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - pretension_order_status = "not_defined";
           - pretension_response_deadline = "not_defined";
           - jurisdiction_clause = "not_defined";
           - restrictive_clauses_status = "not_defined";
           - dispute_summary = "Не установлено";
           - не выполняй остальные шаги.

        1. pretension_order_status — установлен ли претензионный
           (досудебный) порядок разрешения споров:
           "present" — прямо установлен;
           "absent" — прямо указано, что претензионный порядок
           не применяется;
           "not_defined" — вопрос не раскрыт.

        2. pretension_response_deadline — конкретный срок ответа
           на претензию (например, "15 рабочих дней", "30 календарных дней").
           Если не указан — "not_defined".

        3. jurisdiction_clause — договорная подсудность:
           "insurer_location" — по месту нахождения страховщика;
           "policyholder_location" — по месту нахождения страхователя;
           "neutral" — нейтральный суд (например, АС г. Москвы);
           "not_defined" — договорная подсудность не установлена.

        4. restrictive_clauses_status — наличие условий, ограничивающих
           право страхователя на судебную защиту (запрет на иск, обязательный
           третейский суд, отказ от права на иск):
           "present" — ограничения прямо установлены;
           "absent" — ограничений нет;
           "not_defined" — вопрос не раскрыт.

        5. dispute_summary — краткое описание порядка разрешения споров
           одной строкой для DD Grid.
           Если не раскрыто — "Не установлено".
        </task>

        <context_rules>
        - Перед остальными полями заполни dispute_resolution_and_good_faith_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все содержательные поля = "not_defined", dispute_summary = "Не установлено".
        - Используй только текст договора из <context>. Не подставляй
          нормы закона вместо текста договора.
        - Не путай договорную подсудность (место рассмотрения спора)
          с применимым правом (какое законодательство применяется).
        - Не делай предположений сверх того, что прямо следует из текста.
        - Если в разных фрагментах указаны противоречивые данные — верни
          "not_defined" для сигнальных полей.
        - Не используй пустые строки.
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни порядка разрешения споров, ни подсудности.
           → presence = "missing";
             pretension_order_status = "not_defined";
             pretension_response_deadline = "not_defined";
             jurisdiction_clause = "not_defined";
             restrictive_clauses_status = "not_defined";
             dispute_summary = "Не установлено".

        2. Только претензионный порядок, без подсудности.
           Например: "Споры разрешаются путём переговоров", без указания
           суда.
           → presence = "present";
             pretension_order_status = "present";
             jurisdiction_clause = "not_defined";
             dispute_summary содержит дословную формулировку.

        3. Противоречие между фрагментами.
           В разных частях договора указаны разные суды или разные сроки
           ответа на претензию.
           → presence = "unclear";
             pretension_order_status = "not_defined";
             jurisdiction_clause = "not_defined";
             dispute_summary = "Не установлено".

        4. Подсудность по месту нахождения страховщика.
           В договоре прямо установлено, что споры рассматриваются
           по месту нахождения страховщика.
           → presence = "present";
             pretension_order_status = "present" (если установлен);
             jurisdiction_clause = "insurer_location";
             dispute_summary содержит дословную формулировку.
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для dispute_resolution_and_good_faith_check_presence используй
          только: "present", "missing", "unclear".
        - Для pretension_order_status допустимо только:
          present / absent / not_defined.
        - Для jurisdiction_clause допустимо только:
          insurer_location / policyholder_location / neutral / not_defined.
        - Для restrictive_clauses_status допустимо только:
          present / absent / not_defined.
        - Fallback для pretension_response_deadline: "not_defined".
        - Fallback для dispute_summary: "Не установлено".
        - evidence — массив объектов вида {"clause_ref": "...", "quote": "..."}.
        - Технический формат JSON (value / confidence / location) задан
          отдельным контрактом — соблюдай его, но не описывай здесь.
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>
      fields:
        - name: "dispute_resolution_and_good_faith_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие условий о разрешении споров. Внутреннее агрегатное signal-поле."
          required: true

        - name: "pretension_order_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["present", "absent", "not_defined"]
          label: "Претензионный порядок"
          description: "Установлен ли обязательный досудебный порядок разрешения споров."
          required: true
          display_in_grid: true
          display_priority: 1

        - name: "pretension_response_deadline"
          type: "string"
          presentation: "fact"
          label: "Срок ответа на претензию"
          description: "Срок ответа на претензию, установленный договором."
          required: true
          display_in_grid: true
          display_priority: 2

        - name: "jurisdiction_clause"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["insurer_location", "policyholder_location", "neutral", "not_defined"]
          label: "Договорная подсудность"
          description: "Суд, уполномоченный рассматривать споры: по месту нахождения страховщика, страхователя или нейтральный."
          required: true
          display_in_grid: true
          display_priority: 3

        - name: "restrictive_clauses_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["present", "absent", "not_defined"]
          label: "Ограничения судебной защиты"
          description: "Наличие условий, ограничивающих право страхователя на судебную защиту."
          required: true
          display_in_grid: true
          display_priority: 4

        - name: "dispute_summary"
          type: "string"
          presentation: "fact"
          label: "Описание порядка споров"
          description: "Краткое описание порядка разрешения споров и подсудности для DD Grid."
          required: true
          display_in_grid: true
          display_priority: 5

      store_payload: true

  - id: representations_and_warranties_check
    name: "Заверения об обстоятельствах и последствия их недостоверности (ст. 944 ГК РФ)"
    description: >
      Проверяет наличие и полноту заверений страхователя об обстоятельствах,
      имеющих существенное значение для определения вероятности наступления
      страхового случая (ст. 944 ГК РФ): состояние объекта, отсутствие
      обременений, сведения о предыдущих страховых случаях, правовой статус
      страхователя. Критически важно: недостоверность заверений — основание
      для оспаривания договора или отказа в выплате. При этом бремя доказывания
      умысла страхователя лежит на страховщике (правовая позиция ВС РФ).
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "заверение"
        - "заверяет"
        - "гарантирует"
        - "подтверждает"
        - "недостоверные сведения"
        - "существенные обстоятельства"
        - "предыдущие страховые случаи"
        - "сведения об имуществе"
        - "отсутствие обременений"
        - "правовой статус"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)завер(яет|ение|ения)"
        - "(?i)гарантиру(ет|ются)"
        - "(?i)подтвержда(ет|ются)"
        - "(?i)недостоверн(ые|ых|ой)\\s+свед"
        - "(?i)существенн(ые|ых|ого)\\s+обстоятельств"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор страхования по Главе 48 ГК РФ.
        Проверяется только один вопрос: заверения об обстоятельствах
        и последствия их недостоверности.

        Нормативный ориентир:
        - п. 1 ст. 944 ГК РФ — обязанность страхователя сообщить
          страховщику известные обстоятельства, имеющие существенное
          значение для определения вероятности страхового случая;
        - п. 3 ст. 944 ГК РФ — последствия сообщения заведомо ложных
          сведений (право страховщика требовать признания договора
          недействительным);
        - п. 2 ст. 179 ГК РФ — недействительность сделки, совершённой
          под влиянием обмана.

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте
          договора.
        - Не оценивай серьёзность риска субъективно.
        - Учитывай российскую практику: бремя доказывания умысла
          страхователя лежит на страховщике, но наличие в договоре
          прямых заверений существенно упрощает позицию страховщика.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Есть ли в договоре заверения об обстоятельствах (representations).
        2. Какие обстоятельства заверяются (состояние объекта, отсутствие
           обременений, сведения о предыдущих страховых случаях, статус
           страхователя).
        3. Предусмотрены ли последствия недостоверности заверений
           (право на отказ в выплате, расторжение, признание
           недействительным).
        4. Есть ли оговорка о добросовестности / due diligence.

        [ПРАВИЛА]
        1. Используй только текст документа. Не подставляй нормы закона
           вместо текста договора.
        2. Если условие не указано прямо и не следует однозначно из текста —
           возвращай "not_defined".
        3. Не используй "None", "null", пустые строки. Не используй "not_found".
        4. "present" — заверения об обстоятельствах прямо установлены
           в тексте договора.
        5. "specific" — заверения перечислены конкретно (объект, обременения,
           страховые случаи, статус).
        6. "general" — заверения сформулированы обобщённо («все сведения
           достоверны», «не скрывает обстоятельств»).
        7. "specified" — последствия недостоверности прямо описаны
           (право на отказ, расторжение, признание недействительным).
        8. В evidence включай только текст договора.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — конкретные заверения с последствиями:
        Фрагмент:
        "Страхователь заверяет, что: (а) застрахованное имущество не находится
        под арестом, залогом или иным обременением; (б) в течение последних
        3 лет в отношении имущества не было страховых случаев; (в) Страхователь
        не находится в процедуре банкротства. При недостоверности указанных
        заверений Страховщик вправе отказать в страховой выплате и требовать
        признания договора недействительным."

        Ответ:
        {
          "representations_present": "present",
          "representations_scope": "specific",
          "misrepresentation_consequences": "specified",
          "good_faith_clause": "not_defined",
          "representations_summary": "Конкретные заверения (отсутствие обременений, отсутствие страховых случаев, отсутствие банкротства). При недостоверности — отказ и признание недействительным.",
          "evidence": [
            {
              "clause_ref": "п. X.Y",
              "quote": "Страхователь заверяет, что: (а) застрахованное имущество не находится под арестом, залогом или иным обременением; (б) в течение последних 3 лет в отношении имущества не было страховых случаев; (в) Страхователь не находится в процедуре банкротства. При недостоверности указанных заверений Страховщик вправе отказать в страховой выплате и требовать признания договора недействительным."
            }
          ]
        }

        Пример 2 — обобщённое заверение:
        Фрагмент:
        "Страхователь подтверждает, что все предоставленные Страховщику
        сведения являются достоверными и полными."

        Ответ:
        {
          "representations_present": "present",
          "representations_scope": "general",
          "misrepresentation_consequences": "not_defined",
          "good_faith_clause": "not_defined",
          "representations_summary": "Обобщённое заверение о достоверности сведений. Последствия недостоверности не указаны.",
          "evidence": [
            {
              "clause_ref": "п. X.Y",
              "quote": "Страхователь подтверждает, что все предоставленные Страховщику сведения являются достоверными и полными."
            }
          ]
        }

        Пример 3 — заверения отсутствуют:
        Фрагмент:
        "Договор страхования заключается на условиях, согласованных
        Сторонами в настоящем полисе."

        Ответ:
        {
          "representations_present": "absent",
          "representations_scope": "not_defined",
          "misrepresentation_consequences": "not_defined",
          "good_faith_clause": "not_defined",
          "representations_summary": "Не установлено — заверения об обстоятельствах в тексте договора отсутствуют.",
          "evidence": [
            {
              "clause_ref": "п. X.Y",
              "quote": "Договор страхования заключается на условиях, согласованных Сторонами в настоящем полисе."
            }
          ]
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о заверениях / гарантиях.
        2. Оцени, конкретные заверения или обобщённые.
        3. Найди прямую цитату о последствиях недостоверности.
        4. Проверь, что все 6 ключей (5 полей + evidence) присутствуют в JSON.

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь РОВНО одним JSON-объектом без какого-либо дополнительного
        текста до или после, со всеми 6 ключами (5 полей + evidence):
        {
          "representations_present": "<present / absent>",
          "representations_scope": "<specific / general / not_defined>",
          "misrepresentation_consequences": "<specified / not_defined>",
          "good_faith_clause": "<present / absent / not_defined>",
          "representations_summary": "<краткое описание или fallback>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 7
      temperature: 0.0
      max_tokens: 700

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "заверение об обстоятельствах заверяет гарантирует подтверждает существенные обстоятельства недостоверные сведения предыдущие страховые случаи сведения об имуществе"
      boost_keywords:
        - "заверение"
        - "гарантирует"
        - "подтверждает"
        - "существенные обстоятельства"
      preferred_unit_types:
        - obligation
        - general_provision
        - definition
        - representations
      excluded_unit_types:
        - technical_fragment
      preferred_clause_functions:
        - representations
        - obligations
        - limitations
      negative_keywords:
        - "оглавление"
        - "индекс"
      position_bias:
        preferred_range: [0.10, 0.60]
        boost: 0.12
        scope: segment
      context_k: 7
      max_chunks: 10
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
        - "invoice"
      preferred_clause_functions:
        - "representations"
        - "obligations"
        - "limitations"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 600

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 750

      compact_output: false

      presence_signal:
        field: "representations_and_warranties_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист по договорной работе. Твоя задача — извлечь
        из текста договора страхования заверения об обстоятельствах
        и последствия их недостоверности.
        Не анализируй порядок выплаты, страховой случай, франшизу — это
        предмет других проверок.
        Не оценивай риски.
        Анализируй только текст договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. representations_and_warranties_check_presence:
           Агрегатное signal-поле — наличие заверений об обстоятельствах.
           - "present" — если хотя бы одно из содержательных полей
             (representations_present, misrepresentation_consequences,
              good_faith_clause) ≠ "not_defined";
           - "missing" — если все три содержательных поля = "not_defined"
             (или representations_present = "absent");
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - representations_present = "absent";
           - representations_scope = "not_defined";
           - misrepresentation_consequences = "not_defined";
           - good_faith_clause = "not_defined";
           - representations_summary = "Не установлено";
           - не выполняй остальные шаги.

        1. representations_present — есть ли в договоре заверения
           об обстоятельствах:
           "present" — заверения прямо установлены;
           "absent" — заверений нет.

        2. representations_scope — конкретность заверений:
           "specific" — конкретно перечислены обстоятельства (объект,
           обременения, страховые случаи, статус);
           "general" — обобщённая формулировка;
           "not_defined" — заверений нет.

        3. misrepresentation_consequences — последствия недостоверности
           заверений:
           "specified" — прямо описаны (право на отказ, расторжение,
           признание недействительным);
           "not_defined" — последствия не указаны.

        4. good_faith_clause — наличие оговорки о добросовестности
           и due diligence:
           "present" — прямо установлена;
           "absent" — оговорки нет;
           "not_defined" — вопрос не раскрыт.

        5. representations_summary — краткое описание заверений
           и их последствий одной строкой для DD Grid.
           Если не раскрыто — "Не установлено".
        </task>

        <context_rules>
        - Перед остальными полями заполни representations_and_warranties_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — representations_present = "absent", остальные поля = "not_defined", representations_summary = "Не установлено".
        - Используй только текст договора из <context>. Не подставляй
          нормы закона вместо текста договора.
        - Различай конкретные заверения (specific) и обобщённые (general) —
          это юридически значимое различие для бремени доказывания.
        - Не делай предположений сверх того, что прямо следует из текста.
        - Если в разных фрагментах указаны противоречивые данные — верни
          "not_defined" для сигнальных полей.
        - Не используй пустые строки.
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни заверений, ни ссылок на достоверность
           обстоятельств.
           → presence = "missing";
             representations_present = "absent";
             representations_scope = "not_defined";
             misrepresentation_consequences = "not_defined";
             good_faith_clause = "not_defined";
             representations_summary = "Не установлено".

        2. Обобщённое заверение без последствий.
           Например: "Страхователь подтверждает, что все сведения
           достоверны", без указания последствий недостоверности.
           → presence = "present";
             representations_present = "present";
             representations_scope = "general";
             misrepresentation_consequences = "not_defined";
             representations_summary содержит дословную формулировку.

        3. Противоречие между фрагментами.
           В разных частях договора указаны разные перечни заверений
           или разные последствия.
           → presence = "unclear";
             representations_present = "present";
             representations_scope = "not_defined";
             misrepresentation_consequences = "not_defined";
             representations_summary = "Не установлено".

        4. Конкретные заверения с последствиями.
           В договоре прямо перечислены заверяемые обстоятельства
           и последствия их недостоверности.
           → presence = "present";
             representations_present = "present";
             representations_scope = "specific";
             misrepresentation_consequences = "specified";
             representations_summary содержит дословную формулировку.
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для representations_and_warranties_check_presence используй
          только: "present", "missing", "unclear".
        - Для representations_present допустимо только: present / absent.
        - Для representations_scope допустимо только:
          specific / general / not_defined.
        - Для misrepresentation_consequences допустимо только:
          specified / not_defined.
        - Для good_faith_clause допустимо только:
          present / absent / not_defined.
        - Fallback для representations_summary: "Не установлено".
        - evidence — массив объектов вида {"clause_ref": "...", "quote": "..."}.
        - Технический формат JSON (value / confidence / location) задан
          отдельным контрактом — соблюдай его, но не описывай здесь.
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>
      fields:
        - name: "representations_and_warranties_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие заверений об обстоятельствах. Внутреннее агрегатное signal-поле."
          required: true

        - name: "representations_present"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["present", "absent"]
          label: "Заверения об обстоятельствах"
          description: "Есть ли в договоре заверения страхователя об обстоятельствах, существенных для оценки риска."
          required: true
          display_in_grid: true
          display_priority: 1

        - name: "representations_scope"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["specific", "general", "not_defined"]
          label: "Конкретность заверений"
          description: "Конкретные заверения (specific) или обобщённые (general)."
          required: true
          display_in_grid: true
          display_priority: 2

        - name: "misrepresentation_consequences"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["specified", "not_defined"]
          label: "Последствия недостоверности"
          description: "Указаны ли последствия недостоверности заверений (отказ в выплате, расторжение, признание недействительным)."
          required: true
          display_in_grid: true
          display_priority: 3

        - name: "good_faith_clause"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["present", "absent", "not_defined"]
          label: "Оговорка о добросовестности"
          description: "Наличие оговорки о добросовестности / due diligence."
          required: true
          display_in_grid: true
          display_priority: 4

        - name: "representations_summary"
          type: "string"
          presentation: "fact"
          label: "Описание заверений"
          description: "Краткое описание заверений и последствий их недостоверности для DD Grid."
          required: true
          display_in_grid: true
          display_priority: 5

      store_payload: true

  - id: sanctions_and_force_majeure_check
    name: "Санкционные оговорки и обстоятельства непреодолимой силы"
    description: >
      Проверяет наличие, полноту и последствия санкционных оговорок
      и обстоятельств непреодолимой силы в договоре страхования.
      Включает: перечень форс-мажорных обстоятельств (военные действия,
      санкции, решения органов власти), порядок уведомления о наступлении,
      последствия для договора (приостановление, расторжение, отказ
      в выплате), а также соответствие оговорок ст. 401 ГК РФ.
      Критически важно в текущей геополитической ситуации: санкционные
      оговорки часто используются страховщиками как основание для отказа
      в выплате или расторжения договора.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "форс-мажор"
        - "обстоятельства непреодолимой силы"
        - "санкции"
        - "санкционные ограничения"
        - "военные действия"
        - "акты органов власти"
        - "эмбарго"
        - "уведомление о форс-мажоре"
        - "приостановление исполнения"
        - "освобождение от ответственности"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)форс[- ]?мажор"
        - "(?i)непреодолим(ой|ая|ых)\\s+сил"
        - "(?i)санкц(ии|ий|ионн)"
        - "(?i)военн(ых|ые)\\s+действ"
        - "(?i)эмбарго"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор страхования по Главе 48 ГК РФ.
        Проверяется только один вопрос: санкционные оговорки
        и обстоятельства непреодолимой силы.

        Нормативные ориентиры:
        - п. 3 ст. 401 ГК РФ — определение непреодолимой силы;
        - Постановление Пленума ВС РФ от 24.03.2016 № 7 — применение
          положений ГК РФ об ответственности за нарушение обязательств;
        - Постановление Пленума ВС РФ от 22.06.2021 № 16 — о применении
          норм о форс-мажоре.

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте
          договора.
        - Не оценивай серьёзность риска субъективно.
        - Учитывай российскую практику: санкции и ограничительные меры
          не всегда признаются форс-мажором — суды требуют доказать
          причинно-следственную связь. Страховщики часто включают
          санкционные оговорки как самостоятельное основание для отказа.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Есть ли в договоре оговорка о форс-мажоре / непреодолимой силе.
        2. Какие обстоятельства прямо отнесены к форс-мажору.
        3. Есть ли специальная санкционная оговорка.
        4. Какие последствия предусмотрены для договора при наступлении
           форс-мажора (приостановление, расторжение, отказ в выплате).
        5. Установлен ли порядок уведомления о наступлении форс-мажора.

        [ПРАВИЛА]
        1. Используй только текст документа. Не подставляй нормы закона
           вместо текста договора.
        2. Если условие не указано прямо и не следует однозначно из текста —
           возвращай "not_defined".
        3. Не используй "None", "null", пустые строки. Не используй "not_found".
        4. "present" — форс-мажорная оговорка прямо установлена.
        5. "sanctions_included" — санкции прямо включены в перечень
           форс-мажорных обстоятельств или в исключения из покрытия.
        6. "broad" — перечень форс-мажорных обстоятельств сформулирован
           широко («и иные обстоятельства, не зависящие от сторон»).
        7. "specified" — последствия форс-мажора прямо описаны
           (приостановление, расторжение, отказ в выплате).
        8. В evidence включай только текст договора.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — расширенная форс-мажорная оговорка с санкциями:
        Фрагмент:
        "Стороны освобождаются от ответственности за неисполнение
        обязательств, если оно вызвано обстоятельствами непреодолимой силы:
        стихийные бедствия, военные действия, акты органов государственной
        власти, включая введение санкций и ограничительных мер, эмбарго,
        а также иные обстоятельства, не зависящие от воли Сторон.
        Сторона, для которой возникли такие обстоятельства, обязана
        уведомить другую Сторону в течение 5 рабочих дней."

        Ответ:
        {
          "force_majeure_present": "present",
          "force_majeure_scope": "broad",
          "sanctions_clause": "sanctions_included",
          "force_majeure_consequences": "not_defined",
          "notification_procedure": "уведомление в течение 5 рабочих дней",
          "force_majeure_summary": "Расширенный форс-мажор (военные действия, санкции, эмбарго). Уведомление — 5 рабочих дней. Последствия не описаны.",
          "evidence": [
            {
              "clause_ref": "п. X.Y",
              "quote": "Стороны освобождаются от ответственности за неисполнение обязательств, если оно вызвано обстоятельствами непреодолимой силы: стихийные бедствия, военные действия, акты органов государственной власти, включая введение санкций и ограничительных мер, эмбарго, а также иные обстоятельства, не зависящие от воли Сторон. Сторона, для которой возникли такие обстоятельства, обязана уведомить другую Сторону в течение 5 рабочих дней."
            }
          ]
        }

        Пример 2 — узкая форс-мажорная оговорка без санкций:
        Фрагмент:
        "Стороны освобождаются от ответственности при наступлении
        обстоятельств непреодолимой силы: стихийные бедствия, пожары,
        наводнения."

        Ответ:
        {
          "force_majeure_present": "present",
          "force_majeure_scope": "specific",
          "sanctions_clause": "absent",
          "force_majeure_consequences": "not_defined",
          "notification_procedure": "not_defined",
          "force_majeure_summary": "Узкий форс-мажор (стихийные бедствия, пожары, наводнения). Санкции не включены.",
          "evidence": [
            {
              "clause_ref": "п. X.Y",
              "quote": "Стороны освобождаются от ответственности при наступлении обстоятельств непреодолимой силы: стихийные бедствия, пожары, наводнения."
            }
          ]
        }

        Пример 3 — данные отсутствуют:
        Фрагмент:
        "Договор вступает в силу с момента его подписания Сторонами."

        Ответ:
        {
          "force_majeure_present": "absent",
          "force_majeure_scope": "not_defined",
          "sanctions_clause": "not_defined",
          "force_majeure_consequences": "not_defined",
          "notification_procedure": "not_defined",
          "force_majeure_summary": "Не установлено — форс-мажорная оговорка в тексте договора отсутствует.",
          "evidence": [
            {
              "clause_ref": "п. X.Y",
              "quote": "Договор вступает в силу с момента его подписания Сторонами."
            }
          ]
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о форс-мажоре / непреодолимой силе.
        2. Оцени, включены ли санкции в перечень.
        3. Найди прямую цитату о последствиях форс-мажора.
        4. Проверь, что все 7 ключей (6 полей + evidence) присутствуют в JSON.

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь РОВНО одним JSON-объектом без какого-либо дополнительного
        текста до или после, со всеми 7 ключами (6 полей + evidence):
        {
          "force_majeure_present": "<present / absent>",
          "force_majeure_scope": "<specific / broad / not_defined>",
          "sanctions_clause": "<sanctions_included / absent / not_defined>",
          "force_majeure_consequences": "<specified / not_defined>",
          "notification_procedure": "<текст или not_defined>",
          "force_majeure_summary": "<краткое описание или fallback>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 7
      temperature: 0.0
      max_tokens: 700

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "форс-мажор обстоятельства непреодолимой силы санкции санкционные ограничения военные действия акты органов власти эмбарго уведомление о форс-мажоре освобождение от ответственности"
      boost_keywords:
        - "форс-мажор"
        - "непреодолимая сила"
        - "санкции"
        - "уведомление"
      preferred_unit_types:
        - liability_provision
        - obligation
        - general_provision
      excluded_unit_types:
        - technical_fragment
      preferred_clause_functions:
        - limitations
        - remedies
        - procedures
      negative_keywords:
        - "оглавление"
        - "индекс"
      position_bias:
        preferred_range: [0.40, 0.90]
        boost: 0.12
        scope: segment
      context_k: 7
      max_chunks: 10
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
        - "invoice"
      preferred_clause_functions:
        - "limitations"
        - "remedies"
        - "procedures"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 600

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 750

      compact_output: false

      presence_signal:
        field: "sanctions_and_force_majeure_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист по договорной работе. Твоя задача — извлечь
        из текста договора страхования сведения о форс-мажорной и санкционной
        оговорках, порядке уведомления и последствиях наступления таких
        обстоятельств.
        Не анализируй порядок выплаты, франшизу, страховой случай — это
        предмет других проверок.
        Не оценивай риски.
        Анализируй только текст договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. sanctions_and_force_majeure_check_presence:
           Агрегатное signal-поле — наличие условий о форс-мажоре
           и санкциях.
           - "present" — если хотя бы одно из содержательных полей
             (force_majeure_present, sanctions_clause,
              force_majeure_consequences) ≠ "not_defined";
           - "missing" — если все три содержательных поля = "not_defined"
             (или force_majeure_present = "absent");
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - force_majeure_present = "absent";
           - force_majeure_scope = "not_defined";
           - sanctions_clause = "not_defined";
           - force_majeure_consequences = "not_defined";
           - notification_procedure = "not_defined";
           - force_majeure_summary = "Не установлено";
           - не выполняй остальные шаги.

        1. force_majeure_present — есть ли в договоре форс-мажорная
           оговорка:
           "present" — прямо установлена;
           "absent" — отсутствует.

        2. force_majeure_scope — широта перечня форс-мажорных
           обстоятельств:
           "specific" — перечислены конкретные обстоятельства;
           "broad" — сформулировано широко («и иные обстоятельства,
           не зависящие от сторон»);
           "not_defined" — оговорка отсутствует.

        3. sanctions_clause — наличие санкционной оговорки:
           "sanctions_included" — санкции прямо включены в перечень
           форс-мажорных обстоятельств или в исключения из покрытия;
           "absent" — санкции прямо не упомянуты;
           "not_defined" — вопрос не раскрыт.

        4. force_majeure_consequences — последствия наступления
           форс-мажора для договора:
           "specified" — прямо описаны (приостановление, расторжение,
           отказ в выплате);
           "not_defined" — последствия не указаны.

        5. notification_procedure — порядок уведомления о наступлении
           форс-мажора (форма, срок, адресат).
           Если не указан — "not_defined".

        6. force_majeure_summary — краткое описание форс-мажорной
           и санкционной оговорок одной строкой для DD Grid.
           Если не раскрыто — "Не установлено".
        </task>

        <context_rules>
        - Перед остальными полями заполни sanctions_and_force_majeure_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — force_majeure_present = "absent", остальные поля = "not_defined", force_majeure_summary = "Не установлено".
        - Используй только текст договора из <context>. Не подставляй
          нормы закона вместо текста договора.
        - Не выводи форс-мажор из ст. 401 ГК РФ, если он не указан
          в договоре.
        - Не делай предположений сверх того, что прямо следует из текста.
        - Если в разных фрагментах указаны противоречивые данные — верни
          "not_defined" для сигнальных полей.
        - Не используй пустые строки.
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни форс-мажорной оговорки, ни упоминания санкций.
           → presence = "missing";
             force_majeure_present = "absent";
             force_majeure_scope = "not_defined";
             sanctions_clause = "not_defined";
             force_majeure_consequences = "not_defined";
             notification_procedure = "not_defined";
             force_majeure_summary = "Не установлено".

        2. Узкая форс-мажорная оговорка без санкций.
           Например: "Форс-мажор: стихийные бедствия, пожары, наводнения".
           → presence = "present";
             force_majeure_present = "present";
             force_majeure_scope = "specific";
             sanctions_clause = "absent";
             force_majeure_consequences = "not_defined".

        3. Противоречие между фрагментами.
           В разных частях договора указаны разные перечни форс-мажорных
           обстоятельств или разные последствия.
           → presence = "unclear";
             force_majeure_present = "present";
             force_majeure_scope = "not_defined";
             sanctions_clause = "not_defined";
             force_majeure_consequences = "not_defined".

        4. Расширенная оговорка с санкциями и последствиями.
           В договоре прямо указаны санкции как форс-мажор, порядок
           уведомления и последствия.
           → presence = "present";
             force_majeure_present = "present";
             force_majeure_scope = "broad";
             sanctions_clause = "sanctions_included";
             force_majeure_consequences = "specified";
             notification_procedure содержит дословную формулировку.
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для sanctions_and_force_majeure_check_presence используй
          только: "present", "missing", "unclear".
        - Для force_majeure_present допустимо только: present / absent.
        - Для force_majeure_scope допустимо только:
          specific / broad / not_defined.
        - Для sanctions_clause допустимо только:
          sanctions_included / absent / not_defined.
        - Для force_majeure_consequences допустимо только:
          specified / not_defined.
        - Fallback для notification_procedure: "not_defined".
        - Fallback для force_majeure_summary: "Не установлено".
        - evidence — массив объектов вида {"clause_ref": "...", "quote": "..."}.
        - Технический формат JSON (value / confidence / location) задан
          отдельным контрактом — соблюдай его, но не описывай здесь.
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>
      fields:
        - name: "sanctions_and_force_majeure_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие условий о форс-мажоре и санкциях. Внутреннее агрегатное signal-поле."
          required: true

        - name: "force_majeure_present"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["present", "absent"]
          label: "Форс-мажорная оговорка"
          description: "Есть ли в договоре оговорка об обстоятельствах непреодолимой силы."
          required: true
          display_in_grid: true
          display_priority: 1

        - name: "force_majeure_scope"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["specific", "broad", "not_defined"]
          label: "Широта форс-мажора"
          description: "Конкретный перечень (specific) или широкий (broad) перечень форс-мажорных обстоятельств."
          required: true
          display_in_grid: true
          display_priority: 2

        - name: "sanctions_clause"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["sanctions_included", "absent", "not_defined"]
          label: "Санкционная оговорка"
          description: "Включены ли санкции в перечень форс-мажорных обстоятельств или исключений из покрытия."
          required: true
          display_in_grid: true
          display_priority: 3

        - name: "force_majeure_consequences"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["specified", "not_defined"]
          label: "Последствия форс-мажора"
          description: "Указаны ли последствия наступления форс-мажора для договора (приостановление, расторжение, отказ в выплате)."
          required: true
          display_in_grid: true
          display_priority: 4

        - name: "notification_procedure"
          type: "string"
          presentation: "fact"
          label: "Порядок уведомления"
          description: "Порядок уведомления о наступлении форс-мажора (форма, срок, адресат)."
          required: true
          display_in_grid: true
          display_priority: 5

        - name: "force_majeure_summary"
          type: "string"
          presentation: "fact"
          label: "Описание форс-мажора"
          description: "Краткое описание форс-мажорной и санкционной оговорок для DD Grid."
          required: true
          display_in_grid: true
          display_priority: 6

      store_payload: true

# ════════════════════════════════════════════════════════════════════════════
# БЛОК 5: DD_REQUEST_TEMPLATES
# Читается: DDRequestTemplateLoader
# ════════════════════════════════════════════════════════════════════════════

dd_request_templates:
  insurance_subject_extraction:
    text: >
      Просим предоставить по {doc_names}: полную страховую конструкцию —
      вид страхования, номер полиса/договора, объект страхования, страховой случай,
      страховую сумму, страховую премию, срок действия, сведения о страховщике,
      страхователе, застрахованном лице и выгодоприобретателе.
    addressee: "Страховщик / Юридический советник"

  insured_object_required:
    text: >
      Просим уточнить по {doc_names} объект страхования (имущественный интерес),
      в отношении которого предоставляется страховая защита, и предоставить
      формулировку, позволяющую однозначно определить предмет страхования.
    addressee: "Страховщик"

  insured_event_required:
    text: >
      Просим предоставить по {doc_names} точное описание страхового случая/риска,
      а также разграничение между покрываемыми событиями и исключениями из покрытия.
    addressee: "Страховщик"

  insured_event_and_exclusions_check:
    text: >
      Просим предоставить по {doc_names}: полный перечень страховых случаев,
      исключений из покрытия и оснований отказа в выплате; отдельно просим
      подтвердить, что перечень исключений не является открытым и не содержит
      формул "иные случаи" / "по усмотрению страховщика".
    addressee: "Страховщик / Юридический советник страхователя"

  insurer_identification_and_license:
    text: >
      Просим предоставить по {doc_names}: полное наименование страховщика,
      ОГРН/ИНН, сведения о действующей лицензии Банка России на соответствующий
      вид страхования, а также ссылку на запись в реестре субъектов страхового дела.
    addressee: "Страховщик"

  insurer_license_missing:
    text: >
      В {doc_names} не выявлены достаточные признаки лицензии страховщика.
      Просим срочно предоставить реквизиты лицензии Банка России и подтверждение
      права осуществлять соответствующий вид страхования.
    addressee: "Страховщик"

  rules_of_insurance_attachment_check:
    text: >
      Просим предоставить по {doc_names}: текст Правил страхования, редакцию/дату
      их утверждения, подтверждение вручения или направления страхователю,
      а также формулировку о включении Правил страхования в состав договорной
      документации.
    addressee: "Страховщик"

  claim_notification_check:
    text: >
      Просим уточнить в {doc_names}: срок уведомления о страховом случае,
      допустимые способы уведомления, адреса/каналы связи, последствия просрочки,
      а также доказательства получения уведомления страховщиком.
    addressee: "Страховщик / Юридический советник"

  claims_payment_procedure_check:
    text: >
      Просим предоставить по {doc_names}: исчерпывающий перечень документов для
      выплаты, срок принятия решения и срок выплаты, основания отказа в выплате,
      а также пояснить, имеются ли у страховщика дискреционные полномочия требовать
      дополнительные документы сверх перечисленных.
    addressee: "Страховщик"

  premium_and_payment_order:
    text: >
      Просим уточнить по {doc_names}: размер страховой премии, график и способ ее
      уплаты, последствия просрочки оплаты, а также момент начала действия
      страхового покрытия.
    addressee: "Страховщик / Страхователь"

  effective_date_linked_to_premium:
    text: >
      Просим подтвердить по {doc_names}: с какого момента договор считается
      вступившим в силу, связано ли начало страховой защиты с фактической оплатой
      премии, и распространяется ли покрытие на события до даты оплаты.
    addressee: "Страховщик"

  franchise_clarity:
    text: >
      Просим предоставить по {doc_names}: вид франшизы (условная/безусловная),
      ее размер, порядок применения к убытку и пример расчета страховой выплаты
      с учетом франшизы.
    addressee: "Страховщик"

  material_facts_disclosure:
    text: >
      Просим предоставить по {doc_names}: перечень существенных обстоятельств,
      подлежащих раскрытию страхователем, анкету/опросный лист, а также последствия
      неполного или недостоверного раскрытия информации.
    addressee: "Страховщик / Страхователь"

  insured_person_consent_check:
    text: >
      По {doc_names} просим предоставить письменное согласие застрахованного лица
      на заключение договора личного страхования в его отношении (если страхователь
      и застрахованное лицо различаются), а также документы о назначении
      выгодоприобретателя.
    addressee: "Страхователь / Страховщик"

  insured_person_consent_missing:
    text: >
      В {doc_names} не выявлено явное согласие застрахованного лица. Просим
      предоставить письменное согласие, а также разъяснение о правовой конструкции
      договора и допустимости назначения выгодоприобретателя.
    addressee: "Страхователь / Страховщик"

  early_termination_and_premium_refund_check:
    text: >
      Просим уточнить по {doc_names}: основания досрочного прекращения договора,
      судьбу страховой премии (полный/частичный возврат либо отсутствие возврата),
      методику расчета возвращаемой суммы и сроки возврата.
    addressee: "Страховщик"

  subrogation_clause:
    text: >
      Просим предоставить по {doc_names}: условия о суброгации, порядке передачи
      страховщику документов и прав требования к причинителю вреда, а также
      подтвердить, что договор не исключает право суброгации без специального
      согласования.
    addressee: "Страховщик"

  double_insurance_and_underinsurance:
    text: >
      Просим раскрыть по {doc_names}: имеются ли иные договоры страхования того же
      имущества/интереса, как урегулировано двойное страхование, и как определяется
      выплата при неполном страховании.
    addressee: "Страхователь / Страховщик"

  compulsory_insurance_special_law_reference:
    text: >
      Для {doc_names} просим указать конкретный специальный закон об обязательном
      страховании, применимые лимиты ответственности, тарифы, обязательные условия
      полиса и основания отказа, предусмотренные специальным регулированием.
    addressee: "Страховщик / Юридический советник"

  property_insurance_value_basis:
    text: >
      Просим предоставить по {doc_names}: страховую стоимость имущества,
      документы/оценку, на основании которых она определена, и подтвердить,
      что страховая сумма не превышает действительную стоимость имущества.
    addressee: "Страхователь / Страховщик"

  sum_insured_exceeds_property_value:
    text: >
      В {doc_names} выявлен риск несоответствия страховой суммы страховой стоимости
      имущества. Просим предоставить расчет действительной стоимости имущества
      на дату заключения договора и пояснить корректность установленной страховой
      суммы.
    addressee: "Страховщик / Страхователь"

  liability_insurance_scope:
    text: >
      Просим предоставить по {doc_names}: описание страхуемой ответственности,
      круг третьих лиц, лимиты ответственности, исключения из покрытия и механизм
      определения убытков.
    addressee: "Страховщик"

  consumer_protection_reference:
    text: >
      Просим подтвердить по {doc_names}: применяется ли к отношениям Закон о защите
      прав потребителей, каков порядок подачи претензий потребителем, сроки ответа
      и последствия нарушения сроков выплаты.
    addressee: "Страховщик / Юридический советник"

  dispute_resolution_and_complaints:
    text: >
      Просим уточнить в {doc_names}: досудебный порядок урегулирования споров,
      срок рассмотрения претензии, компетентный суд/подсудность, а также наличие
      обязательного обращения к финансовому уполномоченному, если применимо.
    addressee: "Юридический советник"

  illegal_interest_insurance:
    text: >
      Внимание: по {doc_names} выявлен риск страхования противоправного либо
      недопустимого интереса. Просим предоставить правовое заключение о допустимости
      объекта страхования и подтвердить отсутствие обстоятельств, подпадающих
      под ст. 928 ГК РФ.
    addressee: "Юридический советник"

  risk_increase_and_policyholder_duties_check:
    text: >
      Просим предоставить по {doc_names}: полный перечень обязанностей страхователя
      в период действия договора, включая уведомление об увеличении степени риска,
      допуск к осмотру имущества, соблюдение условий эксплуатации, а также
      последствия нарушения каждой обязанности.
    addressee: "Страховщик / Юридический советник"

  risk_increase_notification:
    text: >
      Просим уточнить в {doc_names}: в какой срок и каким способом страхователь
      обязан уведомить об увеличении степени риска, какие обстоятельства считаются
      существенными и каковы последствия неуведомления.
    addressee: "Страховщик"

  risk_increase_notification_missing:
    text: >
      В {doc_names} не выявлен порядок уведомления об увеличении степени риска
      (ст. 959 ГК РФ). Просим предусмотреть срок, способ уведомления и последствия
      несоблюдения.
    addressee: "Юридический советник"

  policyholder_actions_on_event_check:
    text: >
      Просим предоставить по {doc_names}: исчерпывающий перечень действий
      страхователя при наступлении страхового случая, включая уведомление, вызов
      органов, сохранение повреждённого имущества, запрет на ремонт до осмотра,
      а также последствия неисполнения.
    addressee: "Страховщик"

  policyholder_actions_on_event:
    text: >
      Просим уточнить в {doc_names}: перечень обязательных действий страхователя
      при страховом случае и последствия их неисполнения.
    addressee: "Страховщик"

  territory_and_jurisdiction_check:
    text: >
      Просим уточнить по {doc_names}: территорию действия покрытия, ограничения
      по юрисдикциям и наличие территориальных исключений.
    addressee: "Страховщик"

  territory_of_coverage:
    text: >
      Просим уточнить в {doc_names}: на какую территорию распространяется
      страховое покрытие.
    addressee: "Страховщик"

  claims_made_vs_occurrence_check:
    text: >
      Просим предоставить по {doc_names}: базис покрытия (claims-made или occurrence),
      ретроактивную дату, наличие и продолжительность дополнительного периода
      уведомления (extended reporting period), а также условия его активации.
    addressee: "Страховщик / Юридический советник"

  claims_made_basis_terms:
    text: >
      Просим уточнить в {doc_names}: ретроактивную дату, наличие ERP/discovery period
      и условия его предоставления.
    addressee: "Страховщик"

  aggregate_and_per_event_limits:
    text: >
      Просим уточнить по {doc_names}: агрегатный лимит на период страхования,
      лимит на одно событие, подлимиты по отдельным рискам и порядок восстановления
      лимита.
    addressee: "Страховщик"

  cooling_off_period:
    text: >
      Просим подтвердить по {doc_names}: наличие периода охлаждения (14 дней),
      порядок отказа от договора в этот период и условия возврата премии.
    addressee: "Страховщик"

  financial_ombudsman_reference:
    text: >
      Просим уточнить в {doc_names}: порядок обращения к финансовому уполномоченному
      как обязательный досудебный этап для потребителей (ФЗ-123).
    addressee: "Страховщик"

  financial_ombudsman_missing_for_consumer:
    text: >
      В {doc_names} не выявлено упоминание финансового уполномоченного. Просим
      включить информацию об обязательном досудебном обращении к финансовому
      уполномоченному для потребительских договоров.
    addressee: "Юридический советник"

  premium_non_payment_consequences:
    text: >
      Просим уточнить в {doc_names}: последствия просрочки оплаты очередного взноса —
      приостановление покрытия, льготный период, автоматическое расторжение.
    addressee: "Страховщик"

  premium_non_payment_consequences_unclear:
    text: >
      В {doc_names} неясны последствия неуплаты очередного взноса при рассрочке.
      Просим предусмотреть: льготный период, момент приостановления покрытия
      и условия восстановления.
    addressee: "Юридический советник"

  war_sanctions_exclusions:
    text: >
      Просим предоставить по {doc_names}: полный перечень глобальных исключений
      (война, терроризм, ядерные риски, санкции), а также подтвердить, не затрагивают
      ли санкционные исключения интересы страхователя.
    addressee: "Страховщик / Юридический советник"

  _default:
    text: >
      Просим предоставить дополнительную информацию по вопросу «{check_name}»
      применительно к {doc_names}.
    addressee: "Юридический советник"
