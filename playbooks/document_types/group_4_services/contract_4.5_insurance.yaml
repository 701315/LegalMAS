        2. Найди прямую цитату о перечне документов.
        3. Оцени, является ли перечень исчерпывающим или открытым.
        4. Найди прямую цитату об основаниях отказа.

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "payment_deadline_present": "<yes / no>",
          "payment_deadline": "<текст или not_found>",
          "documents_list_status": "<exhaustive / open_ended / unclear / not_found>",
