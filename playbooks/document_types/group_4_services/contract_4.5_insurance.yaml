          weight: 0.65
          distinctiveness: medium
          context: any
          description: "Упоминание имущественного страхования без явного заголовка"

        - pattern: "(?i)личн[оа]е\\s+страховани[ея]"
          weight: 0.65
          distinctiveness: medium
          context: any
          description: "Упоминание личного страхования"

        - pattern: "(?i)страховани[ея]\\s+ответственност[ии]"
          weight: 0.65
          distinctiveness: medium
          context: any
          description: "Страхование ответственности в теле документа"

        - pattern: "(?i)обязательн[оа]е\\s+страховани[ея]"
          weight: 0.65
          distinctiveness: medium
          context: any
          description: "Обязательное страхование как режим"

        - pattern: "(?i)\\bосаго\\b"
          weight: 0.65
          distinctiveness: medium
          context: any
          description: "Упоминание ОСАГО без слова «полис»"

        - pattern: "(?i)\\bкаско\\b"
          weight: 0.65
          distinctiveness: medium
          context: any
          description: "Упоминание КАСКО без слова «полис»"

        - pattern: "(?i)уведомлени[ея]\\s+о\\s+страхов[оа]м\\s+случа[ее]"
          weight: 0.65
          distinctiveness: medium
          context: any
          description: "Порядок уведомления о страховом случае"

        - pattern: "(?i)страхов[а-яё]+\\s+выплат[ааы]"
          weight: 0.65
          distinctiveness: medium
          context: any
          description: "Страховая выплата по договору"

        - pattern: "(?i)страхов[оа]е\\s+покрыти[ея]"
          weight: 0.6
