        Не оценивай риски.
        Анализируй только текст договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. insurer_identification_and_license_presence:
           Агрегатное signal-поле — наличие сведений о лицензии страховщика.
           - "present" — если license_reference_status = "defined";
           - "missing" — если license_reference_status = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - license_reference_status = "not_defined";
           - license_number = "not_defined";
           - license_date = "not_defined";
           - licensing_authority = "not_defined";
           - license_summary = "Не установлено";
           - не выполняй остальные шаги.

        1. license_reference_status — статус наличия ссылки на лицензию
           страховщика в тексте:
           "defined" — ссылка на лицензию страховщика присутствует;
           "not_defined" — лицензия страховщика в тексте вообще не упомянута.

        2. license_number — серия и номер лицензии страховщика
           (например, "СЛ № 1421", "СИ № 3290").
           Если серия и номер отсутствуют — "not_defined".

        3. license_date — дата выдачи лицензии страховщика
           (в формате DD.MM.YYYY или текстом).
           Если дата не указана — "not_defined".

        4. licensing_authority — орган, выдавший лицензию страховщика:
           "Банк России", "ЦБ РФ", "ФСФР", "Росстрахнадзор" или иное название.
           Если орган не указан — "not_defined".

        5. license_summary — краткое описание лицензии одной строкой для DD Grid.
           Если сведения отсутствуют — "Не установлено".
        </task>

        <context_rules>
        - Перед остальными полями заполни insurer_identification_and_license_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все содержательные поля = "not_defined", license_summary = "Не установлено".
        - Используй только текст договора из <context>. Не подставляй нормы
          закона вместо текста договора.
        - Ищи реквизиты лицензии как в начале договора (преамбула), так и в самом конце
          (в разделе реквизитов и подписей сторон).
        - Не используй "not_found" — все отсутствующие значения должны принимать
          "not_defined".
        - Не делай предположений сверх того, что прямо следует из текста.
        - Если в разных фрагментах указаны противоречивые данные — верни
          "not_defined" для сигнального поля.
        - Не используй пустые строки.
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни упоминания лицензии, ни органа лицензирования.
           → presence = "missing";
             license_reference_status = "not_defined";
             license_number = "not_defined";
             license_date = "not_defined";
             licensing_authority = "not_defined";
             license_summary = "Не установлено".

        2. Ссылка на лицензию есть, реквизиты не раскрыты.
           Например: «действует на основании лицензии ЦБ РФ», без номера
           и даты.
           → presence = "present";
             license_reference_status = "defined";
             license_number = "not_defined";
             license_date = "not_defined";
             licensing_authority = "ЦБ РФ";
             license_summary содержит дословную формулировку.

        3. Противоречие между фрагментами.
           В разных частях договора указаны разные номера или органы
           лицензии страховщика.
           → presence = "unclear";
             license_reference_status = "not_defined";
             соответствующие поля = "not_defined";
             license_summary = "Не установлено".

        4. Лицензия полностью раскрыта.
           Указаны серия, номер, дата выдачи и орган.
           → presence = "present";
             license_reference_status = "defined";
             license_number, license_date, licensing_authority заполнены;
             license_summary содержит дословную формулировку.
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для insurer_identification_and_license_presence используй только:
          "present", "missing", "unclear".
        - Для license_reference_status допустимо только: defined / not_defined.
        - Для license_number, license_date, licensing_authority допустимо:
          конкретный текст или not_defined.
        - Fallback для license_summary: "Не установлено".
        - evidence — массив объектов вида {"clause_ref": "...", "quote": "..."}.
        - Технический формат JSON (value / confidence / location) задан
          отдельным контрактом — соблюдай его, но не описывай здесь.
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>
      fields:
        - name: "insurer_identification_and_license_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
