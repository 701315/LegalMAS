  # ──────────────────────────────────────────────────────────────────────────
  # CHECK 11: Базис покрытия: claims-made vs occurrence
  # ──────────────────────────────────────────────────────────────────────────
  - id: claims_made_vs_occurrence_check
    name: "Базис покрытия: claims-made vs. occurrence"
    description: >
      Проверяет базис покрытия для страхования ответственности.
    triggers:
      any:
        - liability_insurance
        - d_and_o_insurance
        - claims_made_basis
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "claims made"
        - "на базе предъявленных требований"
        - "occurrence"
        - "на базе происшествия"
        - "ретроактивная дата"
        - "extended reporting period"
        - "дополнительный период"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)claims[- ]?made"
        - "(?i)ретроактивн(ая|ой)\\s+дат"
        - "(?i)дополнительн(ый|ого)\\s+период"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор страхования ответственности.
        Проверяется только один вопрос: базис покрытия.

        Нормативный ориентир:
        - Практика страхования ответственности

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора.
        - Не оценивай серьёзность риска.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Базис покрытия (claims-made или occurrence).
        2. Ретроактивная дата (если claims-made).
        3. Наличие и продолжительность дополнительного периода уведомления.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Если условие не указано прямо — возвращай "not_defined".
        3. Если текстового значения нет — возвращай "not_defined".
        4. Не используй "None", "null", "not_defined" или пустые строки.
        5. В evidence включай только текст договора.
        6. Верни только один JSON-объект.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — claims-made:
        Фрагмент:
        "Договор заключён на базисе claims-made. Ретроактивная дата — 01.01.2020. Дополнительный период уведомления — 12 месяцев."

        Ответ:
        {
          "coverage_basis": "claims_made",
          "retroactive_date": "01.01.2020",
          "extended_reporting_period": "present",
          "erp_duration": "12 месяцев",
          "coverage_basis_risk": "medium"
        }

        Пример 2 — occurrence:
        Фрагмент:
        "Покрытие предоставляется на базисе occurrence."

        Ответ:
        {
          "coverage_basis": "occurrence",
          "retroactive_date": "none",
          "extended_reporting_period": "absent",
          "erp_duration": "not_defined",
          "coverage_basis_risk": "low"
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о базисе покрытия.
        2. Найди прямую цитату о ретроактивной дате.
        3. Найди прямую цитату о дополнительном периоде.
        4. Если прямой цитаты нет — верни "not_defined".

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "coverage_basis": "<claims_made / occurrence / mixed / unclear / not_found>",
          "retroactive_date": "<указана дата / none / not_found>",
          "extended_reporting_period": "<present / absent / not_found>",
          "erp_duration": "<срок или not_found>",
          "coverage_basis_risk": "<high / medium / low>"
        }
      context_k: 5
      temperature: 0.0
      max_tokens: 350

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "claims made occurrence ретроактивная дата дополнительный период extended reporting period"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - definitions
        - obligations
      negative_keywords:
        - "означает"
        - "в целях настоящего"
        - "страховая сумма"
        - "премия"
        - "страховой случай"
      position_bias:
        preferred_range: [0.20, 0.60]
        boost: 0.12
        scope: segment
      context_k: 5
      max_chunks: 7
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
        - "invoice"
      preferred_clause_functions:
        - "definitions"
        - "obligations"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 35
      max_snippet_length: 500

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 600
      compact_output: false

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора страхования ответственности
        сведения о базисе покрытия, ретроактивной дате и дополнительном периоде.
        </role>

        <context>
        {context}
        </context>

        <task>
        1. coverage_basis — "claims_made" / "occurrence" / "mixed" / "unclear" / "not_defined".
        2. retroactive_date — указана дата / "none" / "not_defined".
        3. extended_reporting_period — "present" / "absent" / "not_defined".
        4. erp_duration — срок или "not_defined".
        5. coverage_basis_risk — "high" / "medium" / "low".
        </task>

        <rules>
        - Используй только текст договора.
        - "mixed" — если оба базиса упомянуты.
        - coverage_basis_risk:
            - "high" — если claims-made без ретроактивной даты или ERP.
            - "medium" — если claims-made с ретроактивной датой, но без ERP.
            - "low" — если occurrence или claims-made с полными условиями.
        - Верни только JSON.
        </rules>
      fields:
        - name: "coverage_basis"
          type: "string"
          presentation: "signal"
          allowed_values: ["claims_made", "occurrence", "mixed", "unclear", "not_defined"]
          description: "Базис покрытия."
          required: true
        - name: "retroactive_date"
          type: "string"
          presentation: "fact"
          label: "Ретроактивная дата"
          description: "Ретроактивная дата (для claims-made)."
          required: false
          display_in_grid: true
          display_priority: 1
        - name: "extended_reporting_period"
          type: "string"
          presentation: "signal"
          allowed_values: ["present", "absent", "not_defined"]
          description: "Наличие дополнительного периода уведомления."
          required: false
        - name: "erp_duration"
          type: "string"
          presentation: "fact"
          label: "Дополнительный период"
          description: "Продолжительность дополнительного периода уведомления."
          required: false
          display_in_grid: true
          display_priority: 2
        - name: "coverage_basis_risk"
          type: "string"
          presentation: "signal"
          allowed_values: ["high", "medium", "low"]
          description: "Риск, связанный с базисом покрытия."
          required: false
      store_payload: true

