           Если срок не установлен — "not_defined".
           Если через Правила — "Согласно Правилам страхования № X".
        3. documents_list_status — статус перечня документов для
           выплаты:
           "exhaustive" — закрытый перечень («исчерпывающий»,
           «иные документы не требуются»);
           "open_ended" — открытый перечень («и иные документы»,
           «по требованию страховщика», «дополнительные документы
           по усмотрению»);
           "unclear" — перечень упомянут, но статус неясен;
           "not_defined" — перечень не упомянут.
        4. refusal_grounds_present — указаны ли основания отказа
           в выплате:
           "yes" — конкретные основания перечислены (умысел,
