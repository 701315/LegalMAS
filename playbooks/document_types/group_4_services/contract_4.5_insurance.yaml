  - id: early_termination_and_premium_refund_check
    name: "Досрочное прекращение и возврат страховой премии"
    description: >
      Проверяет условия досрочного прекращения договора и судьбу страховой премии
      (возврат в полном объёме, пропорционально неистёкшему сроку или отсутствие возврата).
      Нормативный ориентир: ст. 958 ГК РФ (досрочное прекращение договора страхования).
      Критически важно для российской практики: по п. 3 ст. 958 ГК РФ при досрочном
      отказе страхователя от договора уплаченная страховая премия не подлежит возврату,
      если договором не предусмотрено иное.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "досрочное прекращение"
        - "досрочное расторжение"
        - "возврат страховой премии"
        - "часть страховой премии"
        - "отказ страхователя"
        - "прекращение договора"
        - "отказ от договора"
        - "возврату не подлежит"
        - "удержанием"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)досрочн(ое|ого)\\s+(?:прекращен|расторжен)"
        - "(?i)возврат\\s+страхов(ой|ую)\\s+прем"
        - "(?i)отказ.{0,20}от\\s+договора"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор страхования по Главе 48 ГК РФ.
        Проверяется только один вопрос: условия досрочного прекращения
        договора и порядок возврата страховой премии.

        Нормативный ориентир:
        - ст. 958 ГК РФ — досрочное прекращение договора страхования;
          правила и последствия досрочного отказа страхователя.

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте
          договора.
        - Не оценивай серьёзность риска.
        - Учитывай российскую практику: по закону при досрочном отказе
          страхователя премия возвращается только если это прямо написано
          в договоре. Если договор молчит — премия не возвращается.
          Этот факт должен быть чётко отражён.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Предусмотрено ли право на досрочное расторжение / прекращение
           договора.
        2. Предусмотрен ли возврат страховой премии (или её части).
        3. Какой именно режим возврата премии установлен (пропорционально
           неистёкшему сроку, полный, с удержанием расходов страховщика,
           премия не возвращается).
        4. Цитату из договора, подтверждающую выводы.

        [ПРАВИЛА]
        1. Используй только текст документа. Не подставляй нормы закона
           вместо текста договора.
        2. Если условие не указано прямо и не следует однозначно из
           текста — возвращай "not_defined".
        3. Не используй "None", "null", пустые строки. Не используй
           "not_found".
        4. "full" — премия подлежит возврату в полном объёме при досрочном
           расторжении.
        5. "proportional" — премия подлежит возврату пропорционально
           неистёкшему сроку действия договора (за вычетом расходов или без).
        6. "none" — прямо написано, что премия возврату не подлежит, либо
           договор разрешает расторжение, но оставляет премию у страховщика.
        7. Если договор расторгается, но о судьбе премии вообще ничего
           не сказано — возвращай "none" (так как по закону без прямой оговорки
           премия не возвращается) и поясняй это в summary.
        8. "unclear" — условия сформулированы двусмысленно или противоречиво.
        9. В evidence включай только текст договора.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — пропорциональный возврат премии:
        Фрагмент:
        "При досрочном прекращении настоящего договора по инициативе
        Страхователя ему возвращается часть уплаченной страховой премии
        пропорционально неистёкшему сроку страхования, за вычетом
        фактически понесённых расходов Страховщика в размере 35% от премии."

        Ответ:
        {
          "early_termination_present": "yes",
          "premium_refund_status": "proportional",
          "termination_grounds_summary": "При отказе Страхователя возвращается часть премии пропорционально неистёкшему сроку за вычетом расходов Страховщика в размере 35%.",
          "evidence": [
            {
              "clause_ref": "п. X.Y",
              "quote": "При досрочном прекращении настоящего договора по инициативе Страхователя ему возвращается часть уплаченной страховой премии пропорционально неистёкшему сроку страхования, за вычетом фактически понесённых расходов Страховщика в размере 35%."
            }
          ]
        }

        Пример 2 — данные полностью отсутствуют:
        Фрагмент:
        "Договор действует до полного выполнения сторонами своих обязательств."

        Ответ:
        {
          "early_termination_present": "no",
          "premium_refund_status": "not_defined",
          "termination_grounds_summary": "Не установлено — условия досрочного расторжения и возврата премии в тексте договора не указаны.",
          "evidence": [
            {
              "clause_ref": "п. X.Y",
              "quote": "Договор действует до полного выполнения сторонами своих обязательств."
            }
          ]
        }

        Пример 3 — расторжение разрешено, но о возврате молчание (по закону возврата нет):
        Фрагмент:
        "Каждая из Сторон вправе в одностороннем порядке отказаться от
        настоящего договора, письменно уведомив другую Сторону не позднее
        чем за 30 дней до даты расторжения. Договор считается расторгнутым
        по истечении указанного срока."

        Ответ:
        {
          "early_termination_present": "yes",
          "premium_refund_status": "none",
          "termination_grounds_summary": "Досрочное расторжение допускается по инициативе любой Стороны за 30 дней. О возврате премии ничего не сказано (по ст. 958 ГК РФ премия возврату не подлежит).",
          "evidence": [
            {
              "clause_ref": "п. X.Y",
              "quote": "Каждая из Сторон вправе в одностороннем порядке отказаться от настоящего договора, письменно уведомив другую Сторону не позднее чем за 30 дней до даты расторжения."
            }
          ]
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о досрочном прекращении / расторжении договора.
        2. Найди прямую цитату о возврате страховой премии (если есть).
        3. Если в тексте разрешено расторжение, но о судьбе премии молчание —
           ставь premium_refund_status = "none" согласно ст. 958 ГК РФ.
        4. Проверь, что все 4 ключа (3 поля + evidence) присутствуют
           в JSON.

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь РОВНО одним JSON-объектом без какого-либо дополнительного
        текста до или после, со всеми 4 ключами (3 поля + evidence):
        {
          "early_termination_present": "<yes / no>",
          "premium_refund_status": "<full / proportional / none / unclear / not_defined>",
          "termination_grounds_summary": "<краткое описание или fallback>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 7
      temperature: 0.0
      max_tokens: 600

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "досрочное прекращение возврат премии часть уплаченной страховой премии отказ страхователя прекращение договора возврату не подлежит расходы страховщика"
      boost_keywords:
        - "досрочное прекращение"
        - "возврат страховой премии"
        - "возврату не подлежит"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - technical_fragment
      preferred_clause_functions:
        - remedies
        - procedures
        - limitations
      negative_keywords:
        - "оглавление"
        - "индекс"
      position_bias:
        preferred_range: [0.20, 0.90]
        boost: 0.15
        scope: segment
      context_k: 7
      max_chunks: 10
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
        - "invoice"
      preferred_clause_functions:
        - "remedies"
        - "procedures"
        - "limitations"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 35
      max_snippet_length: 500

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 650

      compact_output: false

      presence_signal:
        field: "early_termination_and_premium_refund_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист по договорной работе. Твоя задача — извлечь
        из текста договора страхования условия досрочного прекращения
        договора и возврата уплаченной страховой премии.
        Не анализируй порядок уведомления о страховом случае, выплаты,
        франшизу — это предмет других проверок.
        Не оценивай риски.
        Анализируй только текст договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. early_termination_and_premium_refund_check_presence:
           Агрегатное signal-поле — наличие условий досрочного
           прекращения и возврата премии.
           - "present" — если хотя бы одно из содержательных полей
             (early_termination_present, premium_refund_status)
             ≠ "not_defined";
           - "missing" — если оба содержательных поля = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - early_termination_present = "no";
           - premium_refund_status = "not_defined";
           - termination_grounds_summary = "Не установлено";
           - не выполняй остальные шаги.

        1. early_termination_present — предусмотрена ли возможность
           досрочного расторжения / прекращения договора:
           "yes" — в тексте прямо описана процедура или право на отказ;
           "no" — условия досрочного расторжения не упомянуты.

        2. premium_refund_status — статус возврата уплаченной страховой
           премии при досрочном прекращении:
           "full" — премия подлежит возврату в полном объёме;
           "proportional" — премия возвращается пропорционально неистёкшему
           сроку действия (за вычетом расходов страховщика или без них);
           "none" — прямо написано, что премия не возвращается, ЛИБО
           договор допускает расторжение, но оставляет премию у страховщика
           (молчание договора о возврате премии по ст. 958 ГК РФ трактуется
           как отсутствие возврата);
           "unclear" — условия возврата сформулированы двусмысленно;
           "not_defined" — условия расторжения вообще не упомянуты.

        3. termination_grounds_summary — краткое описание оснований
           досрочного прекращения и режима расчётов при этом.
           Если данные отсутствуют — "Не установлено".
        </task>

        <context_rules>
        - Перед остальными полями заполни early_termination_and_premium_refund_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — early_termination_present = "no", premium_refund_status = "not_defined", termination_grounds_summary = "Не установлено".
        - Используй только текст договора из <context>. Не подставляй
          нормы закона вместо текста договора.
        - Важное юридическое правило: если расторжение допускается, но
          о судьбе премии в тексте договора молчание — возвращай статус
          "none", а в summary указывай, что по закону возврат не производится.
        - Не делай предположений сверх того, что прямо следует из текста.
        - Если в разных фрагментах указаны противоречивые данные — верни
          "not_defined" для сигнальных полей, "Не установлено" для
          текстового.
        - Не используй пустые строки.
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни условий досрочного расторжения, ни возврата
           премии.
           → presence = "missing";
             early_termination_present = "no";
             premium_refund_status = "not_defined";
             termination_grounds_summary = "Не установлено".

        2. Расторжение разрешено, но о премии молчание.
           Договор допускает односторонний отказ, но судьба премии
           не раскрыта.
           → presence = "present";
             early_termination_present = "yes";
             premium_refund_status = "none" (по ст. 958 ГК РФ без прямой
               оговорки премия не возвращается);
             termination_grounds_summary содержит указание на молчание
               договора и отсылку к ст. 958 ГК РФ.

        3. Противоречие между фрагментами.
           В разных частях договора указаны разные режимы возврата премии
           или разные условия расторжения.
           → presence = "unclear";
             early_termination_present = "yes" (если так следует из текста);
             premium_refund_status = "unclear";
             termination_grounds_summary содержит описание противоречия.

        4. Пропорциональный возврат премии за вычетом расходов.
           В договоре прямо указано, что при досрочном расторжении
           возвращается часть премии пропорционально неистёкшему сроку
           за вычетом фактически понесённых расходов страховщика.
           → presence = "present";
             early_termination_present = "yes";
             premium_refund_status = "proportional";
             termination_grounds_summary содержит дословную формулировку
               с указанием размера удержания.
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для early_termination_and_premium_refund_check_presence используй
          только: "present", "missing", "unclear".
        - Для early_termination_present допустимо только: yes / no.
        - Для premium_refund_status допустимо только:
          full / proportional / none / unclear / not_defined.
        - Fallback для termination_grounds_summary: "Не установлено".
        - evidence — массив объектов вида {"clause_ref": "...", "quote": "..."},
          а не строка.
        - Технический формат JSON (value / confidence / location) задан
          отдельным контрактом — соблюдай его, но не описывай здесь.
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>
      fields:
        - name: "early_termination_and_premium_refund_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие условий досрочного прекращения и возврата премии. Внутреннее агрегатное signal-поле."
          required: true

        - name: "early_termination_present"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["yes", "no"]
          label: "Досрочное расторжение"
          description: "Предусмотрена ли в договоре возможность досрочного расторжения или одностороннего отказа."
          required: true
          display_in_grid: true
          display_priority: 1

        - name: "premium_refund_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["full", "proportional", "none", "unclear", "not_defined"]
          label: "Возврат премии при расторжении"
          description: "Статус возврата уплаченной премии: в полном объёме (full), пропорционально (proportional), не возвращается (none), не раскрыто (not_defined)."
          required: true
          display_in_grid: true
          display_priority: 2

        - name: "termination_grounds_summary"
          type: "string"
          presentation: "fact"
          label: "Условия расторжения и возврата"
          description: "Краткое юридическое описание условий расторжения и порядка расчётов по страховой премии."
          required: true
          display_in_grid: true
          display_priority: 3

      store_payload: true

  - id: risk_increase_and_policyholder_duties_check
    name: "Обязанности страхователя в период действия договора (ст. 959, 961 ГК РФ)"
    description: >
      Проверяет наличие и полноту обязанностей страхователя по контролю степени риска
      в период действия договора: уведомление об увеличении риска (ст. 959 ГК РФ),
      допуск страховщика к осмотру имущества, соблюдение правил сохранности и эксплуатации.
      Критически важно: неисполнение обязанности по уведомлению об увеличении риска дает
      страховщику право требовать расторжения договора или пересмотра тарифов, а также
      служит частым основанием для отказа в выплате.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "увеличение степени риска"
        - "изменение обстоятельств"
        - "обязан уведомить"
        - "обязан сообщить"
        - "осмотр имущества"
        - "допуск к осмотру"
        - "сохранность имущества"
        - "содержание имущества"
        - "условия эксплуатации"
        - "ухудшение риска"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)увеличен(ие|ия)\\s+(степени\\s+)?риска"
        - "(?i)обязан.*(уведомить|сообщить).*(страховщик|об\\s+изменен)"
        - "(?i)допуск.{0,20}осмотр"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор страхования по Главе 48 ГК РФ.
        Проверяется только один вопрос: обязанности страхователя в период
        действия договора по уходу за риском и содержанию объекта.

        Нормативный ориентир:
        - ст. 959 ГК РФ — обязанность уведомить об увеличении степени риска;
          последствия неисполнения обязанности страхователем.
        - ст. 961 ГК РФ — общие обязанности по уменьшению убытков.

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора.
        - Не оценивай серьёзность риска.
        - Учитывай российскую практику: формулировки об увеличении риска
          часто размыты. Если в договоре нет конкретных сроков уведомления,
          по закону (ст. 959 ГК РФ) действует срок «незамедлительно», но в
          договоре он может быть обойден молчанием.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Обязанность незамедлительно уведомить об увеличении степени риска.
        2. Конкретный срок и способ уведомления об увеличении риска.
        3. Последствия неуведомления об увеличении риска.
        4. Обязанность допускать представителей страховщика для осмотра имущества.
        5. Оценку полноты обязанностей страхователя в тексте договора.

        [ПРАВИЛА]
        1. Используй только текст документа. Не подставляй нормы закона вместо
           текста договора.
        2. Если условие не указано прямо и не следует однозначно из текста —
           возвращай "not_defined" в фактологических полях и "absent" в сигнальных.
        3. Не используй "None", "null", пустые строки. Не используй "not_found".
        4. "present" — обязанность прямо прописана в тексте договора.
        5. "absent" — обязанность отсутствует или не упомянута.
        6. "not_applicable" — обязанность неприменима по типу страхования (например,
           осмотр застрахованного имущества неприменим в страховании ответственности).
        7. "specified" — последствия неуведомления прямо описаны в договоре
           (расторжение, отказ в выплате, штраф).
        8. "comprehensive" — детально описаны как уведомление о рисках (со сроками),
           так и правила эксплуатации и допуск к осмотру.
        9. "partial" — есть только общая фраза об увеличении риска, без конкретных сроков
           и без правил осмотра.
        10. "minimal" — обязанности сформулированы декларативно («соблюдать правила»).
        11. В evidence включай только текст договора.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — обязанности прописаны детально:
        Фрагмент:
        "Страхователь обязан незамедлительно, в течение 2 (двух) рабочих дней,
        письменно уведомить Страховщика обо всех существенных изменениях в
        обстоятельствах, увеличивающих степень страхового риска. При неисполнении
        данной обязанности Страховщик вправе потребовать расторжения договора.
        Страхователь обязан обеспечивать сохранность застрахованного имущества
        и беспрепятственно допускать представителей Страховщика для его осмотра."

        Ответ:
        {
          "risk_increase_notification_clause": "present",
          "notification_deadline": "в течение 2 рабочих дней письменно",
          "non_notification_consequences": "specified",
          "inspection_access_clause": "present",
          "policyholder_duties_completeness": "comprehensive",
          "evidence": [
            {
              "clause_ref": "п. X.Y",
              "quote": "Страхователь обязан незамедлительно, в течение 2 (двух) рабочих дней, письменно уведомить Страховщика обо всех существенных изменениях в обстоятельствах, увеличивающих степень страхового риска. При неисполнении данной обязанности Страховщик вправе потребовать расторжения договора. Страхователь обязан обеспечивать сохранность застрахованного имущества и беспрепятственно допускать представителей Страховщика для его осмотра."
            }
          ]
        }

        Пример 2 — данные полностью отсутствуют:
        Фрагмент:
        "Договор действует в соответствии с правилами страхового дела."

        Ответ:
        {
          "risk_increase_notification_clause": "absent",
          "notification_deadline": "not_defined",
          "non_notification_consequences": "not_defined",
          "inspection_access_clause": "absent",
          "policyholder_duties_completeness": "absent",
          "evidence": [
            {
              "clause_ref": "п. X.Y",
              "quote": "Договор действует в соответствии с правилами страхового дела."
            }
          ]
        }

        Пример 3 — обязанность есть без срока, осмотр неприменим (страхование ответственности):
        Фрагмент:
        "Страхователь обязан сообщать Страховщику обо всех обстоятельствах,
        изменяющих степень риска причинения вреда третьим лицам. В случае
        нарушения этой обязанности применяются последствия, предусмотренные
        законодательством РФ."

        Ответ:
        {
          "risk_increase_notification_clause": "present",
          "notification_deadline": "not_defined",
          "non_notification_consequences": "specified",
          "inspection_access_clause": "not_applicable",
          "policyholder_duties_completeness": "partial",
          "evidence": [
            {
              "clause_ref": "п. X.Y",
              "quote": "Страхователь обязан сообщать Страховщику обо всех обстоятельствах, изменяющих степень риска причинения вреда третьим лицам. В случае нарушения этой обязанности применяются последствия, предусмотренные законодательством РФ."
            }
          ]
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату об обязанности уведомить об увеличении риска.
        2. Найди прямую цитату о сроке уведомления (если есть).
        3. Найди прямую цитату о последствиях нарушения этой обязанности.
        4. Оцени применимость осмотра объекта страхования (для имущества — применим,
           для гражданской ответственности / финансовых рисков — обычно нет).
        5. Проверь, что все 6 ключей (5 полей + evidence) присутствуют в JSON.

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь РОВНО одним JSON-объектом без какого-либо дополнительного текста
        до или после, со всеми 6 ключами (5 полей + evidence):
        {
          "risk_increase_notification_clause": "<present / absent>",
          "notification_deadline": "<срок или not_defined>",
          "non_notification_consequences": "<specified / not_defined>",
          "inspection_access_clause": "<present / absent / not_applicable>",
          "policyholder_duties_completeness": "<comprehensive / partial / minimal / absent>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 8
      temperature: 0.0
      max_tokens: 700

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "увеличение степени риска изменение обстоятельств обязан уведомить страховщика допуск к осмотру сохранность имущества условия эксплуатации ухудшение риска"
      boost_keywords:
        - "увеличение степени риска"
        - "обязан уведомить"
        - "допуск к осмотру"
      preferred_unit_types:
        - obligation
        - general_provision
        - definition
        - structural_anchor
      excluded_unit_types:
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - procedures
        - limitations
      negative_keywords:
        - "оглавление"
        - "индекс"
      position_bias:
        preferred_range: [0.10, 0.80]
        boost: 0.12
        scope: segment
      context_k: 8
      max_chunks: 12
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
        - "invoice"
      preferred_clause_functions:
        - "obligations"
        - "procedures"
        - "limitations"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 600

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 800

      compact_output: false

      presence_signal:
        field: "risk_increase_and_policyholder_duties_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист по договорной работе. Твоя задача — извлечь из текста
        договора страхования обязанности страхователя в период действия договора
        по контролю степени страхового риска (уведомление об изменении обстоятельств,
        допуск к осмотру, сохранность).
        Не анализируй порядок уведомления о страховом случае, порядок выплат,
        расторжение — это предмет других проверок.
        Не оценивай риски.
        Анализируй только текст договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. risk_increase_and_policyholder_duties_check_presence:
           Агрегатное signal-поле — наличие обязанностей страхователя
           по контролю риска.
           - "missing" — если фрагментов по теме в тексте нет вообще
             (следствие: все содержательные поля = "not_defined" или "absent");
           - "present" — если фрагменты по теме есть: либо хотя бы одно
             содержательное поле ≠ "not_defined" / "absent", либо тема упомянута,
             но прямо исключена / отложена на будущее / раскрыта только общей фразой;
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - risk_increase_notification_clause = "absent";
           - non_notification_consequences = "not_defined";
           - inspection_access_clause = "absent";
           - policyholder_duties_completeness = "absent";
           - notification_deadline = "not_defined";
           - не выполняй остальные шаги.

        1. risk_increase_notification_clause:
           - "present" — обязанность уведомлять об увеличении степени риска прямо установлена;
           - "absent" — обязанность не упомянута.

        2. notification_deadline:
           Конкретный срок и способ уведомления об увеличении степени риска.
           Если срок не установлен — "not_defined".

        3. non_notification_consequences:
           - "specified" — последствия нарушения обязанности по уведомлению прямо описаны в договоре;
           - "not_defined" — последствия не указаны или есть только бланкетная отсылка к закону.

        4. inspection_access_clause:
           - "present" — обязанность допускать страховщика для осмотра объекта прямо прописана;
           - "absent" — обязанность не упомянута;
           - "not_applicable" — осмотр имущества неприменим по типу договора (например, страхование ответственности).

        5. policyholder_duties_completeness:
           - "comprehensive" — детально описаны уведомление о рисках (со сроками), правила эксплуатации/сохранности и допуск к осмотру;
           - "partial" — есть только общая обязанность сообщить об изменении риска, без конкретных сроков и без правил осмотра;
           - "minimal" — обязанности сформулированы сугубо декларативно («соблюдать правила»);
           - "absent" — обязанности в тексте договора не раскрыты.
        </task>

        <context_rules>
        - Перед остальными полями заполни risk_increase_and_policyholder_duties_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — risk_increase_notification_clause = "absent", non_notification_consequences = "not_defined", inspection_access_clause = "absent", policyholder_duties_completeness = "absent", notification_deadline = "not_defined".
        - Используй только текст договора из <context>. Не подставляй нормы закона вместо текста договора.
        - Срок уведомления об увеличении риска — это не срок сообщения о самом страховом случае (не путай их!).
        - Если застрахован объект гражданской ответственности, финансовый риск или жизнь/здоровье, осмотр имущества чаще всего "not_applicable".
        - Не делай предположений сверх того, что прямо следует из текста.
        - Если в разных фрагментах указаны противоречивые данные — верни "not_defined" для сигнальных полей, "Не установлено" для текстового.
        - Не используй пустые строки.
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни обязанности уведомлять об увеличении риска, ни правил осмотра, ни других обязанностей страхователя.
           → presence = "missing";
             risk_increase_notification_clause = "absent";
             non_notification_consequences = "not_defined";
             inspection_access_clause = "absent";
             policyholder_duties_completeness = "absent";
             notification_deadline = "not_defined".

        2. Общая фраза без сроков.
           В договоре есть обязанность сообщать об изменении обстоятельств, но без указания срока и без правил осмотра.
           → presence = "present";
             risk_increase_notification_clause = "present";
             notification_deadline = "not_defined";
             non_notification_consequences = "not_defined";
             inspection_access_clause = "absent" или "not_applicable";
             policyholder_duties_completeness = "partial".

        3. Противоречие между фрагментами.
           В разных частях договора указаны разные сроки уведомления или разные правила осмотра.
           → presence = "unclear";
             соответствующие сигнальные поля = "not_defined";
             notification_deadline = "Не установлено".

        4. Обязанности прописаны детально.
           В договоре есть срок уведомления, последствия неуведомления, правила осмотра и сохранности.
           → presence = "present";
             risk_increase_notification_clause = "present";
             non_notification_consequences = "specified";
             inspection_access_clause = "present";
             policyholder_duties_completeness = "comprehensive";
             notification_deadline содержит дословную формулировку срока.
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для risk_increase_and_policyholder_duties_check_presence используй только: "present", "missing", "unclear".
        - Для risk_increase_notification_clause допустимо только: "present", "absent".
        - Для notification_deadline допустимо только: конкретный текст или "not_defined".
        - Для non_notification_consequences допустимо только: "specified", "not_defined".
        - Для inspection_access_clause допустимо только: "present", "absent", "not_applicable".
        - Для policyholder_duties_completeness допустимо только: "comprehensive", "partial", "minimal", "absent".
        - Fallback для notification_deadline: "not_defined".
        - evidence — массив объектов вида {"clause_ref": "...", "quote": "..."}, а не строка.
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "risk_increase_and_policyholder_duties_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие обязанностей страхователя по контролю риска. Внутреннее агрегатное signal-поле."
          required: true

        - name: "risk_increase_notification_clause"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["present", "absent"]
          display_in_grid: false
          description: "Предусмотрена ли обязанность уведомлять страховщика об увеличении степени риска. Внутреннее enum-поле."
          required: true

        - name: "notification_deadline"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 1
          label: "Срок уведомления о риске"
          description: >
            Конкретный срок и способ уведомления об увеличении степени риска.
            Fallback: "not_defined" / "Не установлено".
          required: true

        - name: "non_notification_consequences"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["specified", "not_defined"]
          display_in_grid: false
          description: "Предусмотрены ли в договоре последствия неисполнения обязанности сообщить об изменении риска. Внутреннее enum-поле."
          required: true

        - name: "inspection_access_clause"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["present", "absent", "not_applicable"]
          display_in_grid: false
          description: "Установлена ли обязанность страхователя допускать страховщика к осмотру застрахованного объекта. Внутреннее enum-поле."
          required: true

        - name: "policyholder_duties_completeness"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["comprehensive", "partial", "minimal", "absent"]
          display_in_grid: false
          description: "Общий уровень детальности и жесткости обязанностей страхователя по уходу за риском. Внутреннее enum-поле."
          required: true

      store_payload: true

  - id: policyholder_actions_on_event_check
    name: "Действия страхователя при наступлении страхового случая"
    description: >
      Проверяет наличие и полноту регламента обязательных действий страхователя
      при наступлении события: вызов компетентных органов (МЧС, полиция),
      минимизация ущерба, сохранение картины происшествия и запрет на ремонт до осмотра.
      Нормативный ориентир: ст. 961–962 ГК РФ. Нарушение этих процедур — одна из
      главных причин отказа в выплате в российской практике.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "при наступлении страхового случая"
        - "обязан незамедлительно"
        - "вызвать компетентные органы"
        - "сохранить повреждённое имущество"
        - "обратиться в полицию"
        - "акт осмотра"
        - "зафиксировать"
        - "предоставить к осмотру"
        - "не производить ремонт"
        - "принять меры"
        - "минимизация ущерба"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)при\\s+наступлении\\s+страхового\\s+случая"
        - "(?i)обязан.*(незамедлительно|в\\s+течение)"
        - "(?i)до\\s+осмотра.*не\\s+(?:производить|проводить)\\s+ремонт"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор страхования по Главе 48 ГК РФ.
        Проверяется только один вопрос: обязательные действия страхователя
        при наступлении страхового случая.

        Нормативный ориентир:
        - ст. 961 ГК РФ — обязанность уведомить о страховом случае.
        - ст. 962 ГК РФ — обязанность уменьшить убытки от страхового случая.

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора.
        - Не оценивай серьёзность риска.
        - Учитывай российскую практику: требования к фиксации ущерба
          (вызов полиции, МЧС) и запрет на ремонт/утилизацию до осмотра
          являются строго обязательными. Для видов страхования, где нет
          физического объекта (например, гражданская ответственность),
          сохранение имущества и запрет на ремонт чаще всего не применимы.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Наличие специального раздела или пункта о действиях при наступлении случая.
        2. Обязанность незамедлительно уведомить страховщика.
        3. Обязанность вызвать компетентные органы (МЧС, полицию, ГИБДД).
        4. Обязанность принять меры по сохранению повреждённого объекта / минимизации убытков.
        5. Прямой запрет на ремонт или изменение картины происшествия до осмотра страховщиком.
        6. Общую полноту и жесткость регламента действий.

        [ПРАВИЛА]
        1. Используй только текст документа. Не подставляй нормы закона вместо
           текста договора.
        2. Если условие не указано прямо и не следует однозначно из текста —
           возвращай "not_defined" в фактологических полях и "absent" в сигнальных.
        3. Не используй "None", "null", пустые строки. Не используй "not_found".
        4. "present" — обязанность прямо прописана в договоре.
        5. "absent" — обязанность отсутствует или не упомянута.
        6. "not_applicable" — обязанность неприменима по типу страхования (например,
           сохранение имущества и запрет на ремонт неприменимы в страховании ответственности
           или личном страховании).
        7. "comprehensive" — регламент содержит все обязательные действия: органы,
           минимизация убытков, сохранность и запрет на ремонт до осмотра.
        8. "partial" — регламент описан частично (например, только вызов органов и
           сообщение страховщику, но без запрета на ремонт).
        9. "minimal" — регламент сформулирован декларативно («сообщить и действовать
           разумно»).
        10. В evidence включай только текст договора.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — действия урегулированы детально:
        Фрагмент:
        "При наступлении события, имеющего признаки страхового случая, Страхователь
        обязан незамедлительно вызвать компетентные государственные органы (МЧС,
        полицию), принять все разумные и доступные меры по минимизации ущерба и
        сохранению повреждённого имущества. Страхователю запрещается производить
        любые ремонтные работы или изменять картину происшествия до проведения
        осмотра представителем Страховщика."

        Ответ:
        {
          "actions_section_present": "yes",
          "notify_insurer": "present",
          "contact_authorities": "present",
          "preserve_evidence": "present",
          "no_repair_before_inspection": "present",
          "actions_completeness": "comprehensive",
          "evidence": [
            {
              "clause_ref": "п. X.Y",
              "quote": "При наступлении события, имеющего признаки страхового случая, Страхователь обязан незамедлительно вызвать компетентные государственные органы (МЧС, полицию), принять все разумные и доступные меры по минимизации ущерба и сохранению повреждённого имущества. Страхователю запрещается производить любые ремонтные работы или изменять картину происшествия до проведения осмотра представителем Страховщика."
            }
          ]
        }

        Пример 2 — данные отсутствуют:
        Фрагмент:
        "Страховщик производит выплату на основании заявления."

        Ответ:
        {
          "actions_section_present": "no",
          "notify_insurer": "absent",
          "contact_authorities": "absent",
          "preserve_evidence": "absent",
          "no_repair_before_inspection": "absent",
          "actions_completeness": "absent",
          "evidence": [
            {
              "clause_ref": "п. X.Y",
              "quote": "Страховщик производит выплату на основании заявления."
            }
          ]
        }

        Пример 3 — страхование ответственности (сохранение имущества и ремонт неприменимы):
        Фрагмент:
        "При предъявлении третьими лицами претензий, Страхователь обязан в течение
        24 часов письменно сообщить об этом Страховщику. Страхователь обязуется
        не признавать свою вину и не производить выплаты третьим лицам без
        письменного согласия Страховщика."

        Ответ:
        {
          "actions_section_present": "yes",
          "notify_insurer": "present",
          "contact_authorities": "absent",
          "preserve_evidence": "not_applicable",
          "no_repair_before_inspection": "not_applicable",
          "actions_completeness": "partial",
          "evidence": [
            {
              "clause_ref": "п. X.Y",
              "quote": "При предъявлении третьими лицами претензий, Страхователь обязан в течение 24 часов письменно сообщить об этом Страховщику. Страхователь обязуется не признавать свою вину и не производить выплаты третьим лицам без письменного согласия Страховщика."
            }
          ]
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о действиях страхователя на месте происшествия.
        2. Найди прямую цитату о вызове МЧС / полиции (если есть).
        3. Найди прямую цитату о запрете на проведение ремонта до осмотра (если есть).
        4. Оцени применимость полей (для страхования имущества — применимы,
           для гражданской ответственности / финансовых рисков — спасение имущества и ремонт
           обычно not_applicable).
        5. Проверь, что все 7 ключей (6 полей + evidence) присутствуют в JSON.

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь РОВНО одним JSON-объектом без какого-либо дополнительного текста
        до или после, со всеми 7 ключами (6 полей + evidence):
        {
          "actions_section_present": "<yes / no>",
          "notify_insurer": "<present / absent>",
          "contact_authorities": "<present / absent / not_applicable>",
          "preserve_evidence": "<present / absent / not_applicable>",
          "no_repair_before_inspection": "<present / absent / not_applicable>",
          "actions_completeness": "<comprehensive / partial / minimal / absent>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 8
      temperature: 0.0
      max_tokens: 750

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "при наступлении страхового случая обязан незамедлительно компетентные органы сохранить повреждённое имущество ремонт до осмотра минимизация убытков вызвать полицию"
      boost_keywords:
        - "при наступлении страхового случая"
        - "вызвать компетентные органы"
        - "не производить ремонт"
      preferred_unit_types:
        - obligation
        - general_provision
        - definition
        - structural_anchor
      excluded_unit_types:
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - procedures
        - limitations
      negative_keywords:
        - "оглавление"
        - "индекс"
      position_bias:
        preferred_range: [0.20, 0.85]
        boost: 0.12
        scope: segment
      context_k: 8
      max_chunks: 12
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
        - "invoice"
      preferred_clause_functions:
        - "obligations"
        - "procedures"
        - "limitations"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 600

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 800

      compact_output: false

      presence_signal:
        field: "policyholder_actions_on_event_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист по договорной работе. Твоя задача — извлечь из текста
        договора страхования перечень обязательных действий страхователя при наступлении
        события, имеющего признаки страхового случая.
        Не анализируй процедуру подачи заявления, сроки урегулирования, суброгацию —
        это предмет других проверок.
        Не оценивай риски.
        Анализируй только текст договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. policyholder_actions_on_event_check_presence:
           Агрегатное signal-поле — наличие регламента действий при событии.
           - "present" — если хотя бы одно из содержательных полей
             (actions_section_present, notify_insurer, contact_authorities,
              preserve_evidence, no_repair_before_inspection,
              actions_completeness) ≠ "not_defined" / "absent";
           - "missing" — если все шесть содержательных полей = "absent"
             или "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - actions_section_present = "no";
           - notify_insurer = "absent";
           - contact_authorities = "absent";
           - preserve_evidence = "absent";
           - no_repair_before_inspection = "absent";
           - actions_completeness = "absent";
           - не выполняй остальные шаги.

        1. actions_section_present — наличие в договоре специального раздела
           или крупного пункта о действиях при страховом случае:
           "yes" — раздел присутствует;
           "no" — регламент отсутствует или разбросан по тексту.

        2. notify_insurer — обязанность незамедлительно / в срок сообщить
           страховщику о событии:
           "present" — обязанность прямо прописана;
           "absent" — обязанность не упомянута.

        3. contact_authorities — обязанность вызвать компетентные
           государственные органы (полицию, МЧС, ГИБДД, аварийные службы):
           "present" — обязанность прямо прописана;
           "absent" — обязанность не упомянута;
           "not_applicable" — неприменимо по типу договора.

        4. preserve_evidence — обязанность принять меры к спасению
           повреждённого объекта и сохранению картины происшествия:
           "present" — обязанность прямо прописана;
           "absent" — обязанность не упомянута;
           "not_applicable" — неприменимо.

        5. no_repair_before_inspection — запрет на ремонт, изменение или
           утилизацию повреждённого объекта до осмотра страховщиком:
           "present" — запрет прямо установлен;
           "absent" — запрет отсутствует;
           "not_applicable" — неприменимо по типу страхования.

        6. actions_completeness — общая полнота регламента:
           "comprehensive" — регламент содержит все обязательные действия;
           "partial" — регламент описан частично;
           "minimal" — регламент сформулирован декларативно;
           "absent" — регламент отсутствует.
        </task>

        <context_rules>
        - Перед остальными полями заполни policyholder_actions_on_event_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все содержательные поля = "absent" / "not_defined".
        - Используй только текст договора из <context>. Не подставляй нормы
          закона вместо текста договора.
        - Сохранение имущества и запрет на ремонт неприменимы (not_applicable)
          в страховании гражданской ответственности, финансовых рисков и личном
          страховании.
        - Не делай предположений сверх того, что прямо следует из текста.
        - Если в разных фрагментах указаны противоречивые данные — верни
          "not_defined" для сигнальных полей.
        - Не используй пустые строки.
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни регламента действий, ни упоминания вызова органов,
           ни запрета на ремонт.
           → presence = "missing";
             все содержательные поля = "absent" / "not_defined".

        2. Регламент описан частично.
           Например: указана обязанность сообщить страховщику и вызвать полицию,
           но без запрета на ремонт.
           → presence = "present";
             notify_insurer = "present";
             contact_authorities = "present";
             preserve_evidence = "absent";
             no_repair_before_inspection = "absent";
             actions_completeness = "partial".

        3. Противоречие между фрагментами.
           В разных частях договора указаны разные требования к действиям
           страхователя.
           → presence = "unclear";
             соответствующие сигнальные поля = "not_defined";
             actions_completeness = "not_defined".

        4. Регламент полностью раскрыт.
           Указаны вызов органов, минимизация убытков, сохранение картины
           происшествия и запрет на ремонт.
           → presence = "present";
             actions_section_present = "yes";
             notify_insurer = "present";
             contact_authorities = "present";
             preserve_evidence = "present";
             no_repair_before_inspection = "present";
             actions_completeness = "comprehensive".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для policyholder_actions_on_event_check_presence используй только:
          "present", "missing", "unclear".
        - Для actions_section_present допустимо только: yes / no.
        - Для notify_insurer допустимо только: present / absent.
        - Для contact_authorities, preserve_evidence,
          no_repair_before_inspection допустимо только:
          present / absent / not_applicable.
        - Для actions_completeness допустимо только:
          comprehensive / partial / minimal / absent.
        - evidence — массив объектов вида {"clause_ref": "...", "quote": "..."}.
        - Технический формат JSON (value / confidence / location) задан
          отдельным контрактом — соблюдай его, но не описывай здесь.
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>
      fields:
        - name: "policyholder_actions_on_event_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регламента действий страхователя при событии. Внутреннее агрегатное signal-поле."
          required: true

        - name: "actions_section_present"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["yes", "no"]
          label: "Раздел действий при страховом случае"
          description: "Наличие в договоре специального раздела или регламента действий при страховом случае."
          required: true
          display_in_grid: true
          display_priority: 1

        - name: "notify_insurer"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["present", "absent"]
          label: "Обязанность уведомить страховщика"
          description: "Предусмотрена ли обязанность страхователя незамедлительно заявить о событии страховщику."
          required: true
          display_in_grid: true
          display_priority: 2

        - name: "contact_authorities"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["present", "absent", "not_applicable"]
          label: "Вызов компетентных органов"
          description: "Предусмотрена ли обязанность незамедлительно зафиксировать происшествие в компетентных органах (МЧС, полиция)."
          required: true
          display_in_grid: true
          display_priority: 3

        - name: "preserve_evidence"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["present", "absent", "not_applicable"]
          label: "Сохранение повреждённого объекта"
          description: "Обязанность страхователя принять меры по спасению и сохранению картины происшествия."
          required: true
          display_in_grid: true
          display_priority: 4

        - name: "no_repair_before_inspection"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["present", "absent", "not_applicable"]
          label: "Запрет на ремонт до осмотра"
          description: "Наличие запрета на проведение ремонтных работ или изменение состояния объекта до осмотра страховщиком."
          required: true
          display_in_grid: true
          display_priority: 5

        - name: "actions_completeness"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["comprehensive", "partial", "minimal", "absent"]
          label: "Полнота регламента действий"
          description: "Интегральная оценка полноты и жесткости регламента действий страхователя на месте происшествия."
          required: true
          display_in_grid: true
          display_priority: 6

      store_payload: true

  - id: territory_and_jurisdiction_check
    name: "Территория страхового покрытия"
    description: >
      Проверяет определение географической территории действия страхового покрытия.
      Критически важно: страховой случай признается таковым только при условии, что он
      произошел в пределах согласованной территории страхования. События вне этой
      территории не покрываются договором.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "территория страхования"
        - "территория покрытия"
        - "на территории"
        - "российская федерация"
        - "весь мир"
        - "worldwide"
        - "территориальные исключения"
        - "место нахождения имущества"
        - "адрес страхования"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)территори[яи]\\s+(страхован|покрыт|действи)"
        - "(?i)на\\s+территории\\s+(?:российской\\s+федерации|рф)"
        - "(?i)место\\s+нахождения\\s+застрахованного"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор страхования по Главе 48 ГК РФ.
        Проверяется только один вопрос: географическая территория действия страхового покрытия.

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора.
        - Не оценивай серьёзность риска.
        - Не путай территорию страхования (место действия покрытия) с применимым правом
          или судебной подсудностью (это предмет других, глобальных проверок).
        - В страховании имущества территория часто привязывается к конкретному адресу
          нахождения объекта или спецификации. Отражай это.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Определена ли конкретная территория страхового покрытия.
        2. Каков ее географический охват (Россия, СНГ, Весь мир, конкретные адреса / страны).
        3. Предусмотрены ли территориальные исключения (например, зоны военных действий,
           санкционные страны, определенные субъекты РФ).
        4. Цитату из договора, подтверждающую выводы.

        [ПРАВИЛА]
        1. Используй только текст документа. Не подставляй нормы закона вместо
           текста договора.
        2. Если условие не указано прямо и не следует однозначно из текста —
           возвращай "not_defined".
        3. Не используй "None", "null", пустые строки. Не используй "not_found".
        4. "russia" — покрытие ограничено только территорией Российской Федерации.
        5. "cis" — покрытие распространяется на страны СНГ.
        6. "worldwide" — покрытие действует по всему миру.
        7. "specified_countries" — покрытие ограничено конкретным списком стран, регионов
           или конкретными адресами нахождения имущества (например, "Москва, ул. Ленина, д. 10").
        8. "present" — в договоре прямо указаны территории-исключения, где покрытие не действует.
        9. "absent" — территориальные исключения не упомянуты.
        10. В evidence включай только текст договора.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — территория РФ, исключений нет:
        Фрагмент:
        "Страховое покрытие по настоящему договору действует исключительно на территории
        Российской Федерации. Территориальные исключения договором не предусмотрены."

        Ответ:
        {
          "territory_defined": "yes",
          "territory_scope": "russia",
          "territorial_exclusions": "absent",
          "evidence": [
            {
              "clause_ref": "п. X.Y",
              "quote": "Страховое покрытие по настоящему договору действует исключительно на территории Российской Федерации. Территориальные исключения договором не предусмотрены."
            }
          ]
        }

        Пример 2 — данные полностью отсутствуют:
        Фрагмент:
        "Договор вступает в силу с момента его подписания сторонами."

        Ответ:
        {
          "territory_defined": "no",
          "territory_scope": "not_defined",
          "territorial_exclusions": "not_defined",
          "evidence": [
            {
              "clause_ref": "п. X.Y",
              "quote": "Договор вступает в силу с момента его подписания сторонами."
            }
          ]
        }

        Пример 3 — территория определена конкретным адресом (имущественное страхование):
        Фрагмент:
        "Территорией страхования является место нахождения застрахованного имущества:
        г. Москва, Рязанский проспект, д. 24, корп. 2. Страховое покрытие не распространяется
        на случаи, произошедшие вне указанного адреса."

        Ответ:
        {
          "territory_defined": "yes",
          "territory_scope": "specified_countries",
          "territorial_exclusions": "present",
          "evidence": [
            {
              "clause_ref": "п. X.Y",
              "quote": "Территорией страхования является место нахождения застрахованного имущества: г. Москва, Рязанский проспект, д. 24, корп. 2. Страховое покрытие не распространяется на случаи, произошедшие вне указанного адреса."
            }
          ]
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о территории страхования или адресе нахождения застрахованного объекта.
        2. Оцени географический охват: если указан точный адрес — это "specified_countries".
        3. Найди прямую цитату об ограничениях или исключениях из территории (если есть).
        4. Проверь, что все 4 ключа (3 поля + evidence) присутствуют в JSON.

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь РОВНО одним JSON-объектом без какого-либо дополнительного текста
        до или после, со всеми 4 ключами (3 поля + evidence):
        {
          "territory_defined": "<yes / no / not_defined>",
          "territory_scope": "<russia / cis / worldwide / specified_countries / not_defined>",
          "territorial_exclusions": "<present / absent / not_defined>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 500

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "территория страхования территория покрытия на территории российская федерация весь мир место нахождения застрахованного имущества адрес"
      boost_keywords:
        - "территория страхования"
        - "территория покрытия"
        - "место нахождения застрахованного"
      preferred_unit_types:
        - obligation
        - general_provision
        - definition
        - structural_anchor
      excluded_unit_types:
        - technical_fragment
      preferred_clause_functions:
        - definitions
        - obligations
        - representations
      negative_keywords:
        - "оглавление"
        - "индекс"
      position_bias:
        preferred_range: [0.10, 0.80]
        boost: 0.10
        scope: segment
      context_k: 6
      max_chunks: 10
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
        - "invoice"
      preferred_clause_functions:
        - "definitions"
        - "obligations"
        - "representations"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 30
      max_snippet_length: 400

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 600

      compact_output: false

      presence_signal:
        field: "territory_and_jurisdiction_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист по договорной работе. Твоя задача — извлечь из текста
        договора страхования условия о территории страхового покрытия.
        Не путай территорию страхования с применимым правом и судебной подсудностью
        споров — это предмет других проверок.
        Не оценивай риски.
        Анализируй только текст договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. territory_and_jurisdiction_check_presence:
           Агрегатное signal-поле — наличие условий о территории покрытия.
           - "present" — если хотя бы одно из содержательных полей
             (territory_defined, territory_scope, territorial_exclusions)
             ≠ "not_defined";
           - "missing" — если все три содержательных поля = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - territory_defined = "no";
           - territory_scope = "not_defined";
           - territorial_exclusions = "not_defined";
           - не выполняй остальные шаги.

        1. territory_defined — определена ли географическая территория покрытия:
           "yes" — территория покрытия прямо установлена в тексте;
           "no" — территория не определена или обойдена молчанием;
           "not_defined" — невозможно определить (используется как fallback).

        2. territory_scope — географический охват страховой защиты:
           "russia" — ограничено только территорией РФ;
           "cis" — распространяется на страны СНГ;
           "worldwide" — действует по всему миру;
           "specified_countries" — ограничено конкретным списком стран, регионов
           или конкретными адресами нахождения застрахованного имущества;
           "not_defined" — территория покрытия не определена.

        3. territorial_exclusions — наличие территориальных исключений
           (зон, где покрытие не действует, несмотря на общий охват):
           "present" — исключения прямо описаны;
           "absent" — исключения отсутствуют;
           "not_defined" — территория покрытия не определена.
        </task>

        <context_rules>
        - Перед остальными полями заполни territory_and_jurisdiction_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — territory_defined = "no", territory_scope = "not_defined", territorial_exclusions = "not_defined".
        - Используй только текст договора из <context>. Не подставляй нормы
          закона вместо текста договора.
        - Если указан точный физический адрес нахождения имущества (склад, офис),
          выбирай "specified_countries" для territory_scope.
        - Не делай предположений сверх того, что прямо следует из текста.
        - Не используй "not_found" — все отсутствующие значения должны строго
          принимать "not_defined".
        - Если в разных фрагментах указаны противоречивые данные — верни
          "not_defined" для сигнальных полей.
        - Не используй пустые строки.
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни территории покрытия, ни исключений.
           → presence = "missing";
             territory_defined = "no";
             territory_scope = "not_defined";
             territorial_exclusions = "not_defined".

        2. Территория указана широко, без исключений.
           Например: "Покрытие действует на территории Российской Федерации",
           без упоминания исключений.
           → presence = "present";
             territory_defined = "yes";
             territory_scope = "russia";
             territorial_exclusions = "absent".

        3. Противоречие между фрагментами.
           В разных частях договора указаны разные территории или разные
           исключения.
           → presence = "unclear";
             territory_defined = "not_defined";
             territory_scope = "not_defined";
             territorial_exclusions = "not_defined".

        4. Территория определена конкретным адресом.
           В договоре прямо указано, что территорией страхования является
           конкретный адрес нахождения имущества, и покрытие не действует
           вне этого адреса.
           → presence = "present";
             territory_defined = "yes";
             territory_scope = "specified_countries";
             territorial_exclusions = "present".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для territory_and_jurisdiction_check_presence используй только:
          "present", "missing", "unclear".
        - Для territory_defined допустимо только: yes / no / not_defined.
        - Для territory_scope допустимо только:
          russia / cis / worldwide / specified_countries / not_defined.
        - Для territorial_exclusions допустимо только:
          present / absent / not_defined.
        - evidence — массив объектов вида {"clause_ref": "...", "quote": "..."}.
        - Технический формат JSON (value / confidence / location) задан
          отдельным контрактом — соблюдай его, но не описывай здесь.
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>
      fields:
        - name: "territory_and_jurisdiction_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие условий о территории страхового покрытия. Внутреннее агрегатное signal-поле."
          required: true

        - name: "territory_defined"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["yes", "no", "not_defined"]
          label: "Территория покрытия определена"
          description: "Определена ли в договоре географическая территория страхового покрытия."
          required: true
          display_in_grid: true
          display_priority: 1

        - name: "territory_scope"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["russia", "cis", "worldwide", "specified_countries", "not_defined"]
          label: "Географический охват"
          description: "Географический охват страховой защиты (Россия, СНГ, Весь мир, конкретные адреса)."
          required: true
          display_in_grid: true
          display_priority: 2

        - name: "territorial_exclusions"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["present", "absent", "not_defined"]
          label: "Исключения из территории"
          description: "Наличие территориальных исключений (зон, где покрытие не действует)."
          required: true
          display_in_grid: true
          display_priority: 3

      store_payload: true

  - id: claims_made_vs_occurrence_check
    name: "Базис покрытия: claims-made vs. occurrence"
    description: >
      Проверяет базис страхового покрытия для договоров страхования ответственности
      (D&O, профессиональная ответственность, гражданская ответственность):
      claims-made (на базе предъявления требований) vs. occurrence (на базе наступления
      события), наличие и дату ретроактивного покрытия, а также дополнительный период
      извещения (ERP).
      Критически важно: при claims-made отсутствие ретроактивной даты («с даты подписания»)
      или отсутствие ERP лишает страхователя защиты по прошлым событиям или поздним искам.
    triggers:
      any:
        - liability_insurance
        - d_and_o_insurance
        - claims_made_basis
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "claims made"
        - "на базе предъявленных требований"
        - "на базе заявления претензий"
        - "occurrence"
        - "на базе происшествия"
        - "на базе наступления события"
        - "ретроактивная дата"
        - "extended reporting period"
        - "дополнительный период"
        - "период обнаружения"
        - "retroactive date"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)claims[- ]?made"
        - "(?i)occurrence"
        - "(?i)ретроактивн(ая|ой|ую)\\s+дат"
        - "(?i)дополнительн(ый|ого)\\s+период"
        - "(?i)период\\s+обнаружения"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор страхования ответственности (D&O, профессиональная
        ответственность, ответственность директоров, гражданская ответственность).
        Проверяется только один вопрос: базис страхового покрытия (claims-made vs. occurrence),
        ретроактивная дата и дополнительный период извещения (ERP).

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора.
        - Не оценивай серьёзность риска субъективно — следуй жестким юридическим правилам.
        - Учитывай российскую и международную практику страхования ответственности:
          * "occurrence" — классический базис (событие должно произойти в период страхования);
          * "claims_made" — требование должно быть заявлено в период страхования при условии,
            что действие совершено после ретроактивной даты.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Базис страхового покрытия (claims_made, occurrence, mixed или unclear).
        2. Ретроактивную дату (для claims-made).
        3. Наличие дополнительного периода уведомления (Extended Reporting Period / ERP).
        4. Продолжительность ERP (срок в месяцах/днях).
        5. Оценку юридического риска выбранной конструкции базиса (high / medium / low).

        [ПРАВИЛА]
        1. Используй только текст документа. Не подставляй нормы закона вместо
           текста договора.
        2. Если условие не указано прямо и не следует однозначно из текста —
           возвращай "not_defined".
        3. Не используй "None", "null", пустые строки. Не используй "not_found".
        4. "claims_made" — страховым случаем признается предъявление письменной
           претензии/иска в течение срока действия договора.
        5. "occurrence" — страховым случаем признается причинение вреда/наступление
           события в период действия договора, независимо от даты иска.
        6. "mixed" — используются элементы обоих базисов.
        7. Для retroactive_date: если указана конкретная дата — верни её строкой;
           если прямо написано "не установлена" / "с даты заключения" — верни "none";
           если договор на базе occurrence — верни "not_applicable".
        8. Для extended_reporting_period: "present" (предусмотрен), "absent" (не предусмотрен),
           "not_applicable" (при occurrence).
        9. Правила присвоения coverage_basis_risk:
           * "low" — если выбран базис occurrence, ЛИБО claims-made с ранней ретроактивной
             датой И наличием ERP;
           * "medium" — если claims-made с ретроактивной датой, но без ERP;
           * "high" — если claims-made без ретроактивной даты (или ретро-дата совпадает
             с датой начала полиса), ЛИБО базис неясен.
        10. В evidence включай только текст договора.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — полный claims-made с ретро-датой и ERP (низкий риск):
        Фрагмент:
        "Договор страхования ответственности директоров заключён на базе предъявления
        требований (claims-made). Ретроактивная дата — 01.01.2020. Дополнительный
        период для заявления претензий (Extended Reporting Period) составляет 24 месяца
        с даты окончания срока действия договора."

        Ответ:
        {
          "coverage_basis": "claims_made",
          "retroactive_date": "01.01.2020",
          "extended_reporting_period": "present",
          "erp_duration": "24 месяца",
          "coverage_basis_risk": "low",
          "evidence": [
            {
              "clause_ref": "п. X.Y",
              "quote": "Договор страхования ответственности директоров заключён на базе предъявления требований (claims-made). Ретроактивная дата — 01.01.2020. Дополнительный период для заявления претензий (Extended Reporting Period) составляет 24 месяца с даты окончания срока действия договора."
            }
          ]
        }

        Пример 2 — базис occurrence:
        Фрагмент:
        "Страхование распространяется на случаи причинения вреда третьим лицам,
        происшедшие в период действия настоящего полиса (базис occurrence)."

        Ответ:
        {
          "coverage_basis": "occurrence",
          "retroactive_date": "not_applicable",
          "extended_reporting_period": "not_applicable",
          "erp_duration": "not_defined",
          "coverage_basis_risk": "low",
          "evidence": [
            {
              "clause_ref": "п. X.Y",
              "quote": "Страхование распространяется на случаи причинения вреда третьим лицам, происшедшие в период действия настоящего полиса (базис occurrence)."
            }
          ]
        }

        Пример 3 — опасный claims-made (без ретро-даты и без ERP):
        Фрагмент:
        "Покрытие предоставляется в отношении претензий, впервые заявленных
        Страхователю в период действия договора. Ретроактивная дата совпадает
        с датой вступления договора в силу. Возможность продления периода
        уведомления не предусмотрена."

        Ответ:
        {
          "coverage_basis": "claims_made",
          "retroactive_date": "none",
          "extended_reporting_period": "absent",
          "erp_duration": "not_defined",
          "coverage_basis_risk": "high",
          "evidence": [
            {
              "clause_ref": "п. X.Y",
              "quote": "Покрытие предоставляется в отношении претензий, впервые заявленных Страхователю в период действия договора. Ретроактивная дата совпадает с датой вступления договора в силу. Возможность продления периода уведомления не предусмотрена."
            }
          ]
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о базисе покрытия (claims-made / occurrence).
        2. Если claims-made — найди прямую цитату о ретроактивной дате и ERP.
        3. Проверь логику риска: claims-made без ретро-даты = "high", occurrence = "low".
        4. Проверь, что все 6 ключей (5 полей + evidence) присутствуют в JSON.

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь РОВНО одним JSON-объектом без какого-либо дополнительного текста
        до или после, со всеми 6 ключами (5 полей + evidence):
        {
          "coverage_basis": "<claims_made / occurrence / mixed / unclear / not_defined>",
          "retroactive_date": "<дата / none / not_applicable / not_defined>",
          "extended_reporting_period": "<present / absent / not_applicable / not_defined>",
          "erp_duration": "<срок или not_defined>",
          "coverage_basis_risk": "<high / medium / low / not_defined>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 7
      temperature: 0.0
      max_tokens: 650

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "базис покрытия claims made occurrence на базе предъявленных требований на базе происшествия ретроактивная дата дополнительный период extended reporting period период обнаружения"
      boost_keywords:
        - "claims made"
        - "occurrence"
        - "ретроактивная дата"
        - "дополнительный период"
      preferred_unit_types:
        - obligation
        - general_provision
        - definition
        - structural_anchor
      excluded_unit_types:
        - technical_fragment
      preferred_clause_functions:
        - definitions
        - obligations
        - limitations
        - procedures
      negative_keywords:
        - "оглавление"
        - "индекс"
      position_bias:
        preferred_range: [0.10, 0.80]
        boost: 0.12
        scope: segment
      context_k: 7
      max_chunks: 10
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
        - "invoice"
      preferred_clause_functions:
        - "definitions"
        - "obligations"
        - "limitations"
        - "procedures"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 35
      max_snippet_length: 500

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 750

      compact_output: false

      presence_signal:
        field: "claims_made_vs_occurrence_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист по договорной работе. Твоя задача — извлечь из текста
        договора страхования ответственности сведения о базисе страхового покрытия
        (claims-made vs. occurrence), ретроактивной дате, дополнительном периоде
        извещения (ERP) и оценить связанный с этим юридический риск.
        Не оценивай риски субъективно — следуй жёстким правилам классификации.
        Анализируй только текст договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. claims_made_vs_occurrence_check_presence:
           Агрегатное signal-поле — наличие сведений о базисе покрытия.
           - "present" — если хотя бы одно из содержательных полей
             (coverage_basis, extended_reporting_period,
              coverage_basis_risk) ≠ "not_defined";
           - "missing" — если все три содержательных поля = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - coverage_basis = "not_defined";
           - retroactive_date = "not_defined";
           - extended_reporting_period = "not_defined";
           - erp_duration = "not_defined";
           - coverage_basis_risk = "not_defined";
           - не выполняй остальные шаги.

        1. coverage_basis — базис страхового покрытия:
           "claims_made" — покрытие на базе предъявления требований;
           "occurrence" — покрытие на базе наступления события/причинения вреда;
           "mixed" — смешанный базис;
           "unclear" — условия сформулированы противоречиво;
           "not_defined" — базис покрытия в тексте не определён.

        2. retroactive_date — ретроактивная дата для claims-made:
           строка с датой (например, "01.01.2020");
           "none" — если ретроактивное покрытие исключено (с даты полиса);
           "not_applicable" — для базиса occurrence;
           "not_defined" — если базис claims-made, но дата не указана.

        3. extended_reporting_period — наличие дополнительного периода
           уведомления (ERP):
           "present" — предусмотрен;
           "absent" — прямо исключён или отсутствует при claims-made;
           "not_applicable" — для базиса occurrence;
           "not_defined" — не определено.

        4. erp_duration — продолжительность ERP (например, "12 месяцев").
           Если не предусмотрен или неприменим — "not_defined".

        5. coverage_basis_risk — интегральная оценка риска конструкции:
           "low" — occurrence ЛИБО claims-made с ретроактивной датой И с ERP;
           "medium" — claims-made с ретроактивной датой, но без ERP;
           "high" — claims-made без ретроактивной даты (с даты начала договора)
           или при отсутствии защиты по прошлым действиям;
           "not_defined" — базис не определён.
        </task>

        <context_rules>
        - Перед остальными полями заполни claims_made_vs_occurrence_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все содержательные поля = "not_defined".
        - Используй только текст договора из <context>. Не подставляй нормы
          закона вместо текста договора.
        - При occurrence ретроактивная дата и ERP не требуются ("not_applicable").
        - Не используй "not_found" — все отсутствующие значения должны принимать
          "not_defined".
        - Не делай предположений сверх того, что прямо следует из текста.
        - Если в разных фрагментах указаны противоречивые данные — верни
          "not_defined" для сигнальных полей.
        - Не используй пустые строки.
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни базиса покрытия, ни ретро-даты, ни ERP.
           → presence = "missing";
             coverage_basis = "not_defined";
             retroactive_date = "not_defined";
             extended_reporting_period = "not_defined";
             erp_duration = "not_defined";
             coverage_basis_risk = "not_defined".

        2. Базис occurrence.
           В договоре прямо указано покрытие на базе события в период
           действия полиса.
           → presence = "present";
             coverage_basis = "occurrence";
             retroactive_date = "not_applicable";
             extended_reporting_period = "not_applicable";
             erp_duration = "not_defined";
             coverage_basis_risk = "low".

        3. Противоречие между фрагментами.
           В разных частях договора указаны разные базисы (claims-made в одном
           пункте, occurrence — в другом) или разные ретро-даты.
           → presence = "unclear";
             coverage_basis = "unclear";
             retroactive_date = "not_defined";
             extended_reporting_period = "not_defined";
             coverage_basis_risk = "high".

        4. Опасный claims-made без ретро-даты.
           Договор на базе предъявления требований, ретро-дата совпадает
           с датой полиса или отсутствует, ERP не предусмотрен.
           → presence = "present";
             coverage_basis = "claims_made";
             retroactive_date = "none";
             extended_reporting_period = "absent";
             coverage_basis_risk = "high".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для claims_made_vs_occurrence_check_presence используй только:
          "present", "missing", "unclear".
        - Для coverage_basis допустимо только:
          claims_made / occurrence / mixed / unclear / not_defined.
        - Для retroactive_date допустимо: конкретная дата / none / not_applicable / not_defined.
        - Для extended_reporting_period допустимо:
          present / absent / not_applicable / not_defined.
        - Для erp_duration допустимо: конкретный текст или not_defined.
        - Для coverage_basis_risk допустимо: high / medium / low / not_defined.
        - evidence — массив объектов вида {"clause_ref": "...", "quote": "..."}.
        - Технический формат JSON (value / confidence / location) задан
          отдельным контрактом — соблюдай его, но не описывай здесь.
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>
      fields:
        - name: "claims_made_vs_occurrence_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие сведений о базисе страхового покрытия. Внутреннее агрегатное signal-поле."
          required: true

        - name: "coverage_basis"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["claims_made", "occurrence", "mixed", "unclear", "not_defined"]
          label: "Базис страхового покрытия"
          description: "Базис действия страхового покрытия: claims-made (предъявление требований) или occurrence (наступление события)."
          required: true
          display_in_grid: true
          display_priority: 1

        - name: "retroactive_date"
          type: "string"
          presentation: "fact"
          label: "Ретроактивная дата"
          description: "Дата, начиная с которой совершенные действия покрываются договором (для claims-made)."
          required: true
          display_in_grid: true
          display_priority: 2

        - name: "extended_reporting_period"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["present", "absent", "not_applicable", "not_defined"]
          label: "Дополнительный период (ERP)"
          description: "Наличие права на дополнительный период уведомления о претензиях после окончания договора."
          required: true
          display_in_grid: true
          display_priority: 3

        - name: "erp_duration"
          type: "string"
          presentation: "fact"
          label: "Длительность ERP"
          description: "Продолжительность дополнительного периода извещения (Extended Reporting Period)."
          required: true
          display_in_grid: true
          display_priority: 4

        - name: "coverage_basis_risk"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["high", "medium", "low", "not_defined"]
          label: "Уровень риска базиса"
          description: "Оценка риска условий покрытия: high (claims-made без ретро-даты), medium, low (occurrence или claims-made с ретро-датой и ERP)."
          required: true
          display_in_grid: true
          display_priority: 5

      store_payload: true

  - id: insurer_identification_and_license
    name: "Страховщик: идентификация и лицензия"
    description: >
      Проверяет наличие в тексте договора ссылки на лицензию страховщика,
      выданную Банком России (ЦБ РФ), и извлекает её реквизиты (номер, серию, дату).
      Критически важно: по ст. 938 ГК РФ и ст. 32 Закона РФ от 27.11.1992
      № 4015-1 «Об организации страхового дела в РФ» страховщиком может быть
      только юридическое лицо, имеющее действующую лицензию Банка России.
      Договор, заключенный лицом без лицензии, ничтожен (ст. 168 ГК РФ).
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "лицензия"
        - "лицензия банка россии"
        - "лицензия цб рф"
        - "лицензия цб"
        - "реестр субъектов страхового дела"
        - "серия сл"
        - "серия си"
        - "серия ос"
        - "серия пс"
        - "страховой деятельности"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)лиценз[ияе].{0,50}(банка\\s+россии|цб|центрального\\s+банка)"
        - "(?i)(?:серия|№)\\s*(?:сл|си|ос|пс)\\s*\\d+"
        - "(?i)реестр.{0,30}субъект.{0,20}страхов"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор страхования по Главе 48 ГК РФ.
        Проверяется только один вопрос: наличие ссылки на лицензию страховщика
        и её конкретные реквизиты (номер, серия, дата выдачи, орган).

        Нормативный ориентир:
        - ст. 938 ГК РФ — требования к страховщику (лицензия)
        - ст. 32 Закона РФ от 27.11.1992 № 4015-1 — лицензирование страховой деятельности.
          Типичные серии лицензий Банка России: СЛ (личное страхование), СИ (имущественное),
          ОС (обязательное), ПС (перестрахование).

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора.
        - Не оценивай степень риска субъективно.
        - Реквизиты лицензии могут быть указаны как в преамбуле договора, так и
          в заключительном разделе «Реквизиты и подписи сторон».

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Указана ли ссылка на лицензию страховщика.
        2. Номер и серию лицензии (например, "СИ № 1234").
        3. Дату выдачи лицензии.
        4. Орган, выдавший лицензию (обычно Банк России, ЦБ РФ, ФСФР, Росстрахнадзор).
        5. Цитату из договора, подтверждающую выводы.

        [ПРАВИЛА]
        1. Используй только текст документа. Не подставляй нормы закона вместо
           текста договора.
        2. Если условие не указано прямо и не следует однозначно из текста —
           возвращай "not_defined" в фактологических полях и "not_defined" в сигнальных.
        3. Не используй "None", "null", пустые строки. Не используй "not_found".
        4. "defined" — в договоре есть упоминание лицензии страховщика (даже без номера).
        5. "not_defined" — лицензия страховщика в тексте договора вообще не упомянута.
        6. В evidence включай только текст договора.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — лицензия полностью указана:
        Фрагмент:
        "Страховщик — АО «Страховая компания Опора», действующий на основании Лицензии
        Банка России СИ № 4321 от 12.10.2021 на осуществление добровольного имущественного
        страхования."

        Ответ:
        {
          "license_reference_status": "defined",
          "license_number": "СИ № 4321",
          "license_date": "12.10.2021",
          "licensing_authority": "Банк России",
          "license_summary": "Лицензия Банка России СИ № 4321 от 12.10.2021",
          "evidence": [
            {
              "clause_ref": "преамбула",
              "quote": "АО «Страховая компания Опора», действующий на основании Лицензии Банка России СИ № 4321 от 12.10.2021 на осуществление добровольного имущественного страхования."
            }
          ]
        }

        Пример 2 — данные полностью отсутствуют:
        Фрагмент:
        "Страховщик обязуется выплатить страховое возмещение при наступлении случая."

        Ответ:
        {
          "license_reference_status": "not_defined",
          "license_number": "not_defined",
          "license_date": "not_defined",
          "licensing_authority": "not_defined",
          "license_summary": "Не установлено — сведения о лицензии страховщика отсутствуют.",
          "evidence": [
            {
