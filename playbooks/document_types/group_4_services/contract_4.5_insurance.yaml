  # ──────────────────────────────────────────────────────────────────────────
  # CHECK 3: Правила страхования
  # ──────────────────────────────────────────────────────────────────────────
  - id: rules_of_insurance_attachment_check
    name: "Правила страхования: включение в договор и подтверждение вручения"
    description: >
      Проверяет ссылку на Правила страхования и признаки их вручения/ознакомления
      страхователя.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "правила страхования"
        - "с правилами ознакомлен"
        - "правила вручены"
        - "экземпляр правил"
        - "получил на руки"
        - "правила являются неотъемлемой частью"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)с\\s+правилами\\s+страхования\\s+ознакомлен"
        - "(?i)правила\\s+страхования\\s+(?:вручены|получены|прилагаются)"
        - "(?i)неотъемлем(ой|ой\\s+частью)\\s+договора"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор страхования по Главе 48 ГК РФ.
        Проверяется только один вопрос: включение Правил страхования в договор.

        Нормативный ориентир:
        - ст. 943 ГК РФ — условия страхования определяются в Правилах страхования

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора.
        - Не оценивай серьёзность риска.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Есть ли ссылка на Правила страхования.
        2. Есть ли подтверждение вручения Правил страхователю.
        3. Есть ли указание, что Правила являются неотъемлемой частью договора.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Если условие не указано прямо — возвращай "not_defined".
        3. Если текстового значения нет — возвращай "not_defined".
        4. Не используй "None", "null", "not_defined" или пустые строки.
        5. В evidence включай только текст договора.
        6. Верни только один JSON-объект.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — Правила вручены:
        Фрагмент:
        "Настоящий договор заключён на основании Правил страхования, являющихся его неотъемлемой частью. Страхователь подтверждает получение экземпляра Правил и ознакомление с ними."

        Ответ:
        {
          "rules_referenced": "yes",
          "rules_delivery_status": "delivered",
          "rules_incorporation_status": "incorporated",
          "rules_snippet": "Правила страхования, являющихся его неотъемлемой частью. Страхователь подтверждает получение экземпляра Правил и ознакомление с ними."
        }

        Пример 2 — данные отсутствуют:
        Фрагмент:
        "Стороны заключили договор страхования."

        Ответ:
        {
          "rules_referenced": "no",
          "rules_delivery_status": "not_defined",
          "rules_incorporation_status": "not_defined",
          "rules_snippet": "not_defined"
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о Правилах страхования.
        2. Найди прямую цитату о вручении Правил.
        3. Найди прямую цитату о неотъемлемой части.
        4. Если прямой цитаты нет — верни "not_defined".

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "rules_referenced": "<yes / no>",
          "rules_delivery_status": "<delivered / acknowledged_only / not_found>",
          "rules_incorporation_status": "<incorporated / unclear / not_found>",
          "rules_snippet": "<цитата или not_found>"
        }
      context_k: 5
      temperature: 0.0
      max_tokens: 400

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "правила страхования ознакомлен вручены неотъемлемая часть экземпляр правил"
      preferred_unit_types:
        - obligation
        - general_provision
        - definition
      excluded_unit_types:
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - definitions
        - boilerplate
      negative_keywords:
        - "означает"
        - "в целях настоящего"
        - "страховая сумма"
        - "премия"
      position_bias:
        preferred_range: [0.0, 0.30]
        boost: 0.15
        scope: segment
      context_k: 5
      max_chunks: 8
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
        - "invoice"
      preferred_clause_functions:
        - "definitions"
        - "boilerplate"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 600

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 700
      compact_output: false

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора страхования сведения
        о Правилах страхования: ссылка, вручение, включение в договор.
        </role>

        <context>
        {context}
        </context>

        <task>
        1. rules_referenced — "yes" / "no".
        2. rules_delivery_status — "delivered" / "acknowledged_only" / "not_defined".
        3. rules_incorporation_status — "incorporated" / "unclear" / "not_defined".
        4. rules_snippet — цитата или "not_defined".

        "delivered" — есть явное указание на вручение/получение экземпляра.
        "acknowledged_only" — есть только формула об ознакомлении без ясного подтверждения вручения.
        </task>

        <rules>
        - Используй только текст договора.
        - Не выводи вручение из молчания договора.
        - Верни только JSON.
        </rules>
      fields:
        - name: "rules_referenced"
          type: "string"
          presentation: "signal"
          allowed_values: ["yes", "no"]
          description: "Есть ли ссылка на Правила страхования."
          required: true
        - name: "rules_delivery_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["delivered", "acknowledged_only", "not_defined"]
