    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 800
      compact_output: false

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист по договорной работе. Твоя задача — извлечь
        из текста договора страхования условия суброгации: переход права
        требования, отказ от суброгации, обязанность содействовать.
        Не анализируй порядок выплаты, франшизу, исключения — это предмет
        других проверок.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие 5 полей + evidence (всего 6 ключей):

        1. subrogation_clause_present — есть ли в договоре условие
           о суброгации (переходе права требования к виновному лицу):
           "yes" — условие прямо прописано;
           "no" — суброгация не упомянута (применяется ст. 965 ГК РФ).
        2. subrogation_waiver — наличие и объём отказа от суброгации:
           "full" — полный отказ (страховщик не имеет права требования
           ни к каким третьим лицам);
           "partial" — частичный отказ (в пользу аффилированных лиц,
           контрагентов, подрядчиков);
           "none" — отказ не предусмотрен, суброгация действует в
           полном объёме;
           "not_defined" — суброгация не упомянута.
        3. subrogation_waiver_scope — в чью пользу установлен отказ
           от суброгации (например, "аффилированные лица Страхователя,
           подрядчики и субподрядчики"). Если отказ не предусмотрен —
           "not_defined".
        4. subrogation_cooperation_duty — обязанность страхователя
           содействовать реализации суброгационного права (передать
           документы, предоставить информацию):
           "present" — обязанность прямо установлена;
           "absent" — обязанность не упомянута;
           "not_defined" — суброгация не раскрыта.
        5. subrogation_summary — краткое описание условий суброгации
           одной строкой для DD Grid. Если не раскрыто — "Не установлено".
        </task>

        <context_rules>
        - Используй только текст договора из <context>. Не подставляй
          нормы закона вместо текста договора.
        - Если суброгация не упомянута — это не означает её отсутствие:
          по ст. 965 ГК РФ она возникает автоматически. Отражай это
          в summary.
        - Не делай предположений сверх того, что прямо следует из текста.
        </context_rules>

        <output_expectations>
        - Все 6 ключей (5 полей + evidence) должны присутствовать в ответе.
        - Запрещены значения: null, None, "", "not_found".
        - Для subrogation_clause_present допустимо только: yes / no.
        - Для subrogation_waiver допустимо только:
          full / partial / none / not_defined.
        - Для subrogation_cooperation_duty допустимо только:
          present / absent / not_defined.
        - Fallback для subrogation_waiver_scope: "not_defined".
        - Fallback для subrogation_summary: "Не установлено".
        - Верни РОВНО один JSON-объект со всеми 6 ключами без какого-либо
          дополнительного текста до или после. Начни ответ сразу с
          открывающей фигурной скобки и закончи закрывающей. НЕ пиши
          Markdown, списки, код-фенсы. Ответ должен быть валидным JSON,
          пригодным для парсинга через json.loads без предварительной
          обработки.
        </output_expectations>
      fields:
        - name: "subrogation_clause_present"
          type: "string"
          presentation: "signal"
          allowed_values: ["yes", "no"]
          label: "Суброгация"
          description: "Есть ли в договоре условие о переходе к страховщику права требования к виновному лицу."
          required: true
          display_in_grid: true
          display_priority: 1
        - name: "subrogation_waiver"
          type: "string"
          presentation: "signal"
          allowed_values: ["full", "partial", "none", "not_defined"]
          label: "Отказ от суброгации"
          description: "Объём отказа: полный (full), частичный (partial), отсутствует (none), не раскрыт (not_defined)."
          required: true
          display_in_grid: true
          display_priority: 2
        - name: "subrogation_waiver_scope"
          type: "string"
          presentation: "fact"
          label: "Объём отказа"
          description: "В чью пользу установлен отказ от суброгации (аффилированные лица, контрагенты, подрядчики)."
          required: true
          display_in_grid: true
          display_priority: 3
        - name: "subrogation_cooperation_duty"
          type: "string"
          presentation: "signal"
          allowed_values: ["present", "absent", "not_defined"]
          label: "Содействие суброгации"
          description: "Обязанность страхователя передать документы и содействовать реализации суброгационного права."
          required: true
          display_in_grid: true
          display_priority: 4
        - name: "subrogation_summary"
          type: "string"
          presentation: "fact"
          label: "Описание суброгации"
          description: "Краткое описание условий суброгации и отказа от неё для DD Grid."
          required: true
          display_in_grid: true
          display_priority: 5
    store_payload: true

  - id: aggregate_limit_check
    name: "Агрегатный лимит ответственности страховщика"
    description: >
      Проверяет наличие и размер агрегатного (совокупного) лимита
      ответственности страховщика за весь период страхования.
      Агрегатный лимит ограничивает общую сумму ВСЕХ выплат по договору,
      в отличие от страховой суммы, которая ограничивает выплату по
      ОДНОМУ страховому случаю.
      Критически важно: если страховая сумма 100 млн руб. на случай,
      а агрегатный лимит тоже 100 млн руб., то при двух убытках по 60 млн
      клиент получит только 100 млн суммарно, а не 120 млн. Это один из
      самых частых «сюрпризов» в корпоративном страховании.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "агрегатный лимит"
        - "совокупный лимит"
        - "общий лимит"
        - "максимальная сумма выплат"
        - "предел ответственности"
        - "лимит за период"
        - "aggregate limit"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)агрегатн(?:ый|ого)\\s+лимит"
        - "(?i)совокупн(?:ый|ого)\\s+лимит"
        - "(?i)общ(?:ий|его)\\s+лимит"
        - "(?i)максимальн(?:ая|ой)\\s+сумм.{0,20}выплат"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор страхования по Главе 48 ГК РФ.
        Проверяется только один вопрос: наличие и размер агрегатного
        (совокупного) лимита ответственности страховщика.

        Нормативный ориентир:
        - ст. 947 ГК РФ — страховая сумма и пределы ответственности

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте
          договора.
        - Не оценивай серьёзность риска.
        - Учитывай российскую практику:
          * Агрегатный лимит — это потолок ВСЕХ выплат за период.
          * Если агрегатный лимит равен страховой сумме на один случай,
            это фактически означает, что второй убыток не покрывается.
          * В сложных программах могут быть сублимиты (по типам рисков,
            по территориям) в рамках агрегатного лимита.
          * Агрегатный лимит может «сбрасываться» (восстанавливаться)
            ежегодно или оставаться фиксированным на весь срок полиса.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Установлен ли агрегатный (совокупный) лимит ответственности.
        2. Размер агрегатного лимита.
        3. Соотношение агрегатного лимита со страховой суммой на один
           случай (равен, ниже, выше).
        4. Восстанавливается ли агрегатный лимит (ежегодно, после
           каждого убытка, не восстанавливается).
        5. Цитату из договора, подтверждающую выводы.

        [ПРАВИЛА]
        1. Используй только текст документа. Не подставляй нормы закона
           вместо текста договора.
        2. Если условие не указано прямо и не следует однозначно из
           текста — возвращай "not_defined".
        3. Не используй "None", "null", пустые строки. Не используй
           "not_found".
        4. "same" — агрегатный лимит равен страховой сумме на один
           случай (фактически один убыток исчерпывает покрытие).
        5. "lower" — агрегатный лимит ниже страховой суммы (нестандартная
           ситуация, требует особого внимания).
        6. "higher" — агрегатный лимит выше страховой суммы на один
           случай (позволяет покрыть несколько убытков).
        7. "annual" — лимит восстанавливается ежегодно.
        8. "per_policy" — лимит фиксирован на весь срок полиса и не
           восстанавливается.
        9. В evidence включай только текст договора.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — агрегатный лимит выше страховой суммы:
        Фрагмент:
        "Страховая сумма по каждому страховому случаю составляет
        50 000 000 рублей. Агрегатный (совокупный) лимит ответственности
        Страховщика за весь период действия договора составляет
        150 000 000 рублей. Агрегатный лимит не восстанавливается после
        осуществления страховых выплат."

        Ответ:
        {
          "aggregate_limit_present": "yes",
          "aggregate_limit_amount": "150 000 000 рублей за весь период",
          "aggregate_limit_vs_sum_insured": "higher",
          "aggregate_limit_reset": "per_policy",
          "aggregate_limit_summary": "Агрегатный лимит 150 млн руб. (страховая сумма 50 млн на случай). Не восстанавливается.",
          "evidence": "Страховая сумма по каждому страховому случаю составляет 50 000 000 рублей. Агрегатный лимит ответственности Страховщика за весь период действия договора составляет 150 000 000 рублей. Агрегатный лимит не восстанавливается."
        }

        Пример 2 — агрегатный лимит равен страховой сумме (риск):
        Фрагмент:
        "Страховая сумма — 100 000 000 рублей. Общая сумма всех
        страховых выплат по настоящему договору не может превышать
        страховую сумму."

        Ответ:
        {
          "aggregate_limit_present": "yes",
          "aggregate_limit_amount": "100 000 000 рублей (равен страховой сумме)",
          "aggregate_limit_vs_sum_insured": "same",
          "aggregate_limit_reset": "per_policy",
          "aggregate_limit_summary": "Агрегатный лимит 100 млн руб. = страховой сумме. Фактически покрывается только один убыток.",
          "evidence": "Страховая сумма — 100 000 000 рублей. Общая сумма всех страховых выплат по настоящему договору не может превышать страховую сумму."
        }

        Пример 3 — агрегатный лимит не установлен:
        Фрагмент:
        "Страховая сумма по каждому страховому случаю составляет
        30 000 000 рублей."

        Ответ:
        {
          "aggregate_limit_present": "no",
          "aggregate_limit_amount": "not_defined",
          "aggregate_limit_vs_sum_insured": "not_defined",
          "aggregate_limit_reset": "not_defined",
          "aggregate_limit_summary": "Не установлено — агрегатный лимит не указан (каждый случай покрывается в пределах страховой суммы)",
          "evidence": "Страховая сумма по каждому страховому случаю составляет 30 000 000 рублей."
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату об агрегатном / совокупном / общем лимите.
        2. Сравни агрегатный лимит со страховой суммой на один случай.
        3. Проверь, восстанавливается ли лимит.
        4. Проверь, что все 6 ключей (5 полей + evidence) присутствуют
           в JSON.

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь РОВНО одним JSON-объектом без какого-либо дополнительного
        текста до или после, со всеми 6 ключами (5 полей + evidence):
        {
          "aggregate_limit_present": "<yes / no>",
          "aggregate_limit_amount": "<сумма или not_defined>",
          "aggregate_limit_vs_sum_insured": "<same / lower / higher / not_defined>",
          "aggregate_limit_reset": "<annual / per_policy / not_defined>",
          "aggregate_limit_summary": "<краткое описание или fallback>",
          "evidence": "<прямая цитата из договора>"
        }
      context_k: 7
      temperature: 0.0
      max_tokens: 650

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "агрегатный лимит совокупный лимит общий лимит ответственности максимальная сумма выплат предел ответственности за период лимит за весь срок"
      boost_keywords:
        - "агрегатный лимит"
        - "совокупный лимит"
        - "общий лимит"
        - "максимальная сумма выплат"
      preferred_unit_types:
        - obligation
        - general_provision
        - definition
        - structural_anchor
      excluded_unit_types:
        - technical_fragment
      preferred_clause_functions:
        - definitions
        - obligations
        - limitations
      negative_keywords:
        - "оглавление"
        - "индекс"
      position_bias:
        preferred_range: [0.10, 0.70]
        boost: 0.12
        scope: segment
      context_k: 7
      max_chunks: 10
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
        - "invoice"
      preferred_clause_functions:
        - "definitions"
        - "obligations"
        - "limitations"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 30
      max_snippet_length: 500

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 750
      compact_output: false

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист по договорной работе. Твоя задача — извлечь
        из текста договора страхования сведения об агрегатном (совокупном)
        лимите ответственности страховщика за весь период действия договора.
        Не путай агрегатный лимит со страховой суммой на один случай —
        это разные понятия.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие 5 полей + evidence (всего 6 ключей):

        1. aggregate_limit_present — установлен ли агрегатный лимит:
           "yes" — совокупный лимит прямо указан;
           "no" — агрегатный лимит не установлен (каждый случай
           покрывается в пределах страховой суммы).
        2. aggregate_limit_amount — размер агрегатного лимита текстом
           (например, "150 000 000 рублей за весь период").
           Если не установлен — "not_defined".
        3. aggregate_limit_vs_sum_insured — соотношение агрегатного
           лимита со страховой суммой на один случай:
           "same" — равен страховой сумме (один убыток исчерпывает
           покрытие);
           "lower" — ниже страховой суммы (нестандартная ситуация);
           "higher" — выше страховой суммы (позволяет покрыть
           несколько убытков);
           "not_defined" — соотношение неясно.
        4. aggregate_limit_reset — восстановление агрегатного лимита:
           "annual" — лимит восстанавливается ежегодно;
           "per_policy" — лимит фиксирован на весь срок полиса и
           не восстанавливается;
           "not_defined" — условие не указано.
        5. aggregate_limit_summary — краткое описание агрегатного лимита
           одной строкой для DD Grid. Если не установлен —
           "Не установлен".
        </task>

        <context_rules>
        - Используй только текст договора из <context>. Не подставляй
          нормы закона вместо текста договора.
        - Не путай агрегатный лимит (совокупный за период) со страховой
          суммой (на один случай).
        - Если в договоре указана только страховая сумма без упоминания
          агрегатного лимита — ставь "no".
        - Не делай предположений сверх того, что прямо следует из текста.
        </context_rules>

        <output_expectations>
        - Все 6 ключей (5 полей + evidence) должны присутствовать в ответе.
        - Запрещены значения: null, None, "", "not_found".
        - Для aggregate_limit_present допустимо только: yes / no.
        - Для aggregate_limit_vs_sum_insured допустимо только:
          same / lower / higher / not_defined.
        - Для aggregate_limit_reset допустимо только:
          annual / per_policy / not_defined.
        - Fallback для aggregate_limit_amount: "not_defined".
        - Fallback для aggregate_limit_summary: "Не установлен".
        - Верни РОВНО один JSON-объект со всеми 6 ключами без какого-либо
          дополнительного текста до или после. Начни ответ сразу с
          открывающей фигурной скобки и закончи закрывающей. НЕ пиши
          Markdown, списки, код-фенсы. Ответ должен быть валидным JSON,
          пригодным для парсинга через json.loads без предварительной
          обработки.
        </output_expectations>
      fields:
        - name: "aggregate_limit_present"
          type: "string"
          presentation: "signal"
          allowed_values: ["yes", "no"]
          label: "Агрегатный лимит"
          description: "Установлен ли совокупный лимит ответственности страховщика за весь период страхования."
          required: true
          display_in_grid: true
          display_priority: 1
        - name: "aggregate_limit_amount"
          type: "string"
          presentation: "fact"
          label: "Размер агрегатного лимита"
          description: "Размер совокупного лимита выплат за весь период страхования."
          required: true
          display_in_grid: true
          display_priority: 2
        - name: "aggregate_limit_vs_sum_insured"
          type: "string"
          presentation: "signal"
          allowed_values: ["same", "lower", "higher", "not_defined"]
          label: "Лимит vs страховая сумма"
          description: "Соотношение агрегатного лимита со страховой суммой: равен (same), ниже (lower), выше (higher)."
          required: true
          display_in_grid: true
          display_priority: 3
        - name: "aggregate_limit_reset"
          type: "string"
          presentation: "signal"
          allowed_values: ["annual", "per_policy", "not_defined"]
          label: "Восстановление лимита"
          description: "Восстанавливается ли агрегатный лимит: ежегодно (annual), не восстанавливается (per_policy)."
          required: true
          display_in_grid: true
          display_priority: 4
        - name: "aggregate_limit_summary"
          type: "string"
          presentation: "fact"
          label: "Описание лимита"
          description: "Краткое описание агрегатного лимита и его соотношения со страховой суммой для DD Grid."
          required: true
          display_in_grid: true
          display_priority: 5
    store_payload: true



# ════════════════════════════════════════════════════════════════════════════
# БЛОК 5: DD_REQUEST_TEMPLATES
# Читается: DDRequestTemplateLoader
# ════════════════════════════════════════════════════════════════════════════

dd_request_templates:
  insurance_subject_extraction:
    text: >
      Просим предоставить по {doc_names}: полную страховую конструкцию —
      вид страхования, номер полиса/договора, объект страхования, страховой случай,
      страховую сумму, страховую премию, срок действия, сведения о страховщике,
      страхователе, застрахованном лице и выгодоприобретателе.
    addressee: "Страховщик / Юридический советник"

  insured_object_required:
    text: >
      Просим уточнить по {doc_names} объект страхования (имущественный интерес),
      в отношении которого предоставляется страховая защита, и предоставить
      формулировку, позволяющую однозначно определить предмет страхования.
    addressee: "Страховщик"

  insured_event_required:
    text: >
      Просим предоставить по {doc_names} точное описание страхового случая/риска,
      а также разграничение между покрываемыми событиями и исключениями из покрытия.
    addressee: "Страховщик"

  insured_event_and_exclusions_check:
    text: >
      Просим предоставить по {doc_names}: полный перечень страховых случаев,
      исключений из покрытия и оснований отказа в выплате; отдельно просим
      подтвердить, что перечень исключений не является открытым и не содержит
      формул "иные случаи" / "по усмотрению страховщика".
    addressee: "Страховщик / Юридический советник страхователя"

  insurer_identification_and_license:
    text: >
      Просим предоставить по {doc_names}: полное наименование страховщика,
      ОГРН/ИНН, сведения о действующей лицензии Банка России на соответствующий
      вид страхования, а также ссылку на запись в реестре субъектов страхового дела.
    addressee: "Страховщик"

  insurer_license_missing:
    text: >
      В {doc_names} не выявлены достаточные признаки лицензии страховщика.
      Просим срочно предоставить реквизиты лицензии Банка России и подтверждение
      права осуществлять соответствующий вид страхования.
    addressee: "Страховщик"

  rules_of_insurance_attachment_check:
    text: >
      Просим предоставить по {doc_names}: текст Правил страхования, редакцию/дату
      их утверждения, подтверждение вручения или направления страхователю,
      а также формулировку о включении Правил страхования в состав договорной
      документации.
    addressee: "Страховщик"

  claim_notification_check:
    text: >
      Просим уточнить в {doc_names}: срок уведомления о страховом случае,
      допустимые способы уведомления, адреса/каналы связи, последствия просрочки,
      а также доказательства получения уведомления страховщиком.
    addressee: "Страховщик / Юридический советник"

  claims_payment_procedure_check:
    text: >
      Просим предоставить по {doc_names}: исчерпывающий перечень документов для
      выплаты, срок принятия решения и срок выплаты, основания отказа в выплате,
      а также пояснить, имеются ли у страховщика дискреционные полномочия требовать
      дополнительные документы сверх перечисленных.
    addressee: "Страховщик"

  premium_and_payment_order:
    text: >
      Просим уточнить по {doc_names}: размер страховой премии, график и способ ее
      уплаты, последствия просрочки оплаты, а также момент начала действия
      страхового покрытия.
    addressee: "Страховщик / Страхователь"

  effective_date_linked_to_premium:
    text: >
      Просим подтвердить по {doc_names}: с какого момента договор считается
      вступившим в силу, связано ли начало страховой защиты с фактической оплатой
      премии, и распространяется ли покрытие на события до даты оплаты.
    addressee: "Страховщик"

  franchise_clarity:
    text: >
      Просим предоставить по {doc_names}: вид франшизы (условная/безусловная),
      ее размер, порядок применения к убытку и пример расчета страховой выплаты
      с учетом франшизы.
    addressee: "Страховщик"

  material_facts_disclosure:
    text: >
      Просим предоставить по {doc_names}: перечень существенных обстоятельств,
      подлежащих раскрытию страхователем, анкету/опросный лист, а также последствия
      неполного или недостоверного раскрытия информации.
    addressee: "Страховщик / Страхователь"

  insured_person_consent_check:
    text: >
      По {doc_names} просим предоставить письменное согласие застрахованного лица
      на заключение договора личного страхования в его отношении (если страхователь
      и застрахованное лицо различаются), а также документы о назначении
      выгодоприобретателя.
    addressee: "Страхователь / Страховщик"

  insured_person_consent_missing:
    text: >
      В {doc_names} не выявлено явное согласие застрахованного лица. Просим
      предоставить письменное согласие, а также разъяснение о правовой конструкции
      договора и допустимости назначения выгодоприобретателя.
    addressee: "Страхователь / Страховщик"

  early_termination_and_premium_refund_check:
    text: >
      Просим уточнить по {doc_names}: основания досрочного прекращения договора,
      судьбу страховой премии (полный/частичный возврат либо отсутствие возврата),
      методику расчета возвращаемой суммы и сроки возврата.
    addressee: "Страховщик"

  subrogation_clause:
    text: >
      Просим предоставить по {doc_names}: условия о суброгации, порядке передачи
      страховщику документов и прав требования к причинителю вреда, а также
      подтвердить, что договор не исключает право суброгации без специального
      согласования.
    addressee: "Страховщик"

  double_insurance_and_underinsurance:
    text: >
      Просим раскрыть по {doc_names}: имеются ли иные договоры страхования того же
      имущества/интереса, как урегулировано двойное страхование, и как определяется
      выплата при неполном страховании.
    addressee: "Страхователь / Страховщик"

  compulsory_insurance_special_law_reference:
    text: >
      Для {doc_names} просим указать конкретный специальный закон об обязательном
      страховании, применимые лимиты ответственности, тарифы, обязательные условия
      полиса и основания отказа, предусмотренные специальным регулированием.
    addressee: "Страховщик / Юридический советник"

  property_insurance_value_basis:
    text: >
      Просим предоставить по {doc_names}: страховую стоимость имущества,
      документы/оценку, на основании которых она определена, и подтвердить,
      что страховая сумма не превышает действительную стоимость имущества.
    addressee: "Страхователь / Страховщик"

  sum_insured_exceeds_property_value:
    text: >
      В {doc_names} выявлен риск несоответствия страховой суммы страховой стоимости
      имущества. Просим предоставить расчет действительной стоимости имущества
      на дату заключения договора и пояснить корректность установленной страховой
      суммы.
    addressee: "Страховщик / Страхователь"

  liability_insurance_scope:
    text: >
      Просим предоставить по {doc_names}: описание страхуемой ответственности,
      круг третьих лиц, лимиты ответственности, исключения из покрытия и механизм
      определения убытков.
    addressee: "Страховщик"

  consumer_protection_reference:
    text: >
      Просим подтвердить по {doc_names}: применяется ли к отношениям Закон о защите
      прав потребителей, каков порядок подачи претензий потребителем, сроки ответа
      и последствия нарушения сроков выплаты.
    addressee: "Страховщик / Юридический советник"

  dispute_resolution_and_complaints:
    text: >
      Просим уточнить в {doc_names}: досудебный порядок урегулирования споров,
      срок рассмотрения претензии, компетентный суд/подсудность, а также наличие
      обязательного обращения к финансовому уполномоченному, если применимо.
    addressee: "Юридический советник"

  illegal_interest_insurance:
    text: >
      Внимание: по {doc_names} выявлен риск страхования противоправного либо
      недопустимого интереса. Просим предоставить правовое заключение о допустимости
      объекта страхования и подтвердить отсутствие обстоятельств, подпадающих
      под ст. 928 ГК РФ.
    addressee: "Юридический советник"

  risk_increase_and_policyholder_duties_check:
    text: >
      Просим предоставить по {doc_names}: полный перечень обязанностей страхователя
      в период действия договора, включая уведомление об увеличении степени риска,
      допуск к осмотру имущества, соблюдение условий эксплуатации, а также
      последствия нарушения каждой обязанности.
    addressee: "Страховщик / Юридический советник"

  risk_increase_notification:
    text: >
      Просим уточнить в {doc_names}: в какой срок и каким способом страхователь
      обязан уведомить об увеличении степени риска, какие обстоятельства считаются
      существенными и каковы последствия неуведомления.
    addressee: "Страховщик"

  risk_increase_notification_missing:
    text: >
      В {doc_names} не выявлен порядок уведомления об увеличении степени риска
      (ст. 959 ГК РФ). Просим предусмотреть срок, способ уведомления и последствия
      несоблюдения.
    addressee: "Юридический советник"

  policyholder_actions_on_event_check:
    text: >
      Просим предоставить по {doc_names}: исчерпывающий перечень действий
      страхователя при наступлении страхового случая, включая уведомление, вызов
      органов, сохранение повреждённого имущества, запрет на ремонт до осмотра,
      а также последствия неисполнения.
    addressee: "Страховщик"

  policyholder_actions_on_event:
    text: >
      Просим уточнить в {doc_names}: перечень обязательных действий страхователя
      при страховом случае и последствия их неисполнения.
    addressee: "Страховщик"

  territory_and_jurisdiction_check:
    text: >
      Просим уточнить по {doc_names}: территорию действия покрытия, ограничения
      по юрисдикциям и наличие территориальных исключений.
    addressee: "Страховщик"

  territory_of_coverage:
    text: >
      Просим уточнить в {doc_names}: на какую территорию распространяется
      страховое покрытие.
    addressee: "Страховщик"

  claims_made_vs_occurrence_check:
    text: >
      Просим предоставить по {doc_names}: базис покрытия (claims-made или occurrence),
      ретроактивную дату, наличие и продолжительность дополнительного периода
      уведомления (extended reporting period), а также условия его активации.
    addressee: "Страховщик / Юридический советник"

  claims_made_basis_terms:
    text: >
      Просим уточнить в {doc_names}: ретроактивную дату, наличие ERP/discovery period
      и условия его предоставления.
    addressee: "Страховщик"

  aggregate_and_per_event_limits:
    text: >
      Просим уточнить по {doc_names}: агрегатный лимит на период страхования,
      лимит на одно событие, подлимиты по отдельным рискам и порядок восстановления
      лимита.
    addressee: "Страховщик"

  cooling_off_period:
    text: >
      Просим подтвердить по {doc_names}: наличие периода охлаждения (14 дней),
      порядок отказа от договора в этот период и условия возврата премии.
    addressee: "Страховщик"

  financial_ombudsman_reference:
    text: >
      Просим уточнить в {doc_names}: порядок обращения к финансовому уполномоченному
      как обязательный досудебный этап для потребителей (ФЗ-123).
    addressee: "Страховщик"

  financial_ombudsman_missing_for_consumer:
    text: >
      В {doc_names} не выявлено упоминание финансового уполномоченного. Просим
      включить информацию об обязательном досудебном обращении к финансовому
      уполномоченному для потребительских договоров.
    addressee: "Юридический советник"

  premium_non_payment_consequences:
    text: >
      Просим уточнить в {doc_names}: последствия просрочки оплаты очередного взноса —
      приостановление покрытия, льготный период, автоматическое расторжение.
    addressee: "Страховщик"

  premium_non_payment_consequences_unclear:
    text: >
      В {doc_names} неясны последствия неуплаты очередного взноса при рассрочке.
      Просим предусмотреть: льготный период, момент приостановления покрытия
      и условия восстановления.
    addressee: "Юридический советник"

  war_sanctions_exclusions:
    text: >
      Просим предоставить по {doc_names}: полный перечень глобальных исключений
      (война, терроризм, ядерные риски, санкции), а также подтвердить, не затрагивают
      ли санкционные исключения интересы страхователя.
    addressee: "Страховщик / Юридический советник"

  _default:
    text: >
      Просим предоставить дополнительную информацию по вопросу «{check_name}»
      применительно к {doc_names}.
    addressee: "Юридический советник"