        Фрагмент:
        "Выплата производится в течение 15 рабочих дней после предоставления полного комплекта документов. Перечень документов: заявление, акт осмотра, справка из компетентных органов. Иные документы не требуются."

        Ответ:
        {
          "payment_deadline_present": "yes",
          "payment_deadline": "15 рабочих дней",
          "documents_list_status": "exhaustive",
          "refusal_grounds_present": "not_defined",
          "insurer_discretion_risk": "low"
        }

        Пример 2 — перечень открытый:
        Фрагмент:
        "Выплата производится в течение 10 дней. Перечень документов определяется страховщиком."

