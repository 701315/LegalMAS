        2. Найди прямую цитату о согласии застрахованного лица.
        3. Найди прямую цитату о выгодоприобретателе.
        4. Если прямой цитаты нет — верни "not_defined".

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "insured_person_identified": "<yes / no>",
          "insured_person_consent_status": "<present / not_found / unclear>",
          "beneficiary_status": "<named / default_rules / not_found>",
          "consent_snippet": "<цитата или not_found>"
