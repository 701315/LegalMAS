# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 3: SHARED PATTERNS
#  Читается: DocTypeCheckLoader через _resolve_yaml_templates()
# ════════════════════════════════════════════════════════════════════════════

shared_patterns:

  money_amount: "(?i)\\b\\d[\\d\\s]*(?:руб|рублей|₽|тыс|млн|млрд)"
  date_pattern: "(?i)\\b\\d{1,2}[.]\\d{1,2}[.]\\d{4}\\b"
  policy_number: "(?i)(?:полис|договор)\\s*№?\\s*[A-ZА-Я0-9\\-\\/]+"
  period_pattern: "(?i)(срок|период)\\s*(?:действия|страхования)?.{0,30}(с|по|до)"
  percentage_pattern: "(?i)\\b\\d+(?:[.,]\\d+)?\\s*%"
  deadline_pattern: "(?i)(?:в течение|не позднее)\\s+\\d+\\s+(?:календарн|рабоч|час|дн)"

# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 4: COMPLIANCE RULES
#  Читается: DocTypeCheckLoader._exclusion_logic_to_checks()
# ════════════════════════════════════════════════════════════════════════════

compliance_rules:

  - id: "insurer_license_missing"
    name: "Отсутствие признаков лицензии страховщика"
    description: "Проверка на отсутствие упоминания лицензии или статуса страховщика как субъекта страхового дела"
    legal_base: "ст. 938 ГК РФ, Закон РФ № 4015-1"
    required_triggers: []
    severity: "critical"
    result_if_triggered: "fail"
    detector_type: "rules"
    rules:
      negative_keywords:
        - "лицензия"
        - "лицензия банка россии"
        - "цб рф"
        - "реестр субъектов страхового дела"
      keyword_mode: "any"
    retrieval:
      context_k: 4
      boost_keywords:
        - "лицензия"
        - "страховщик"
        - "цб рф"
      rerank: true

  - id: "illegal_interest_insurance"
    name: "Страхование противоправного интереса"
    description: "Договор не должен предусматривать страхование противоправных интересов"
    legal_base: "ст. 928 ГК РФ"
    required_triggers: []
    severity: "critical"
    result_if_triggered: "fail"
    detector_type: "rules"
    rules:
      keywords:
        - "противоправный интерес"
        - "незаконный интерес"
        - "убытки от участия в играх"
        - "пари"
        - "расходы по освобождению заложников"
      keyword_mode: "any"
    retrieval:
      context_k: 4
      boost_keywords:
        - "ст. 928"
        - "игры"
        - "пари"
        - "противоправный интерес"
      rerank: true

  - id: "sum_insured_exceeds_property_value"
    name: "Страховая сумма может превышать действительную стоимость имущества"
    description: "Для имущественного страхования страховая сумма не должна превышать страховую стоимость"
    legal_base: "ст. 947, 951 ГК РФ"
    required_triggers: ["property_insurance"]
    severity: "critical"
    result_if_triggered: "fail"
    detector_type: "rules"
    rules:
      keywords:
        - "страховая сумма"
        - "действительная стоимость"
        - "страховая стоимость"
        - "оценочная стоимость"
      keyword_mode: "any"
    retrieval:
      context_k: 5
      boost_keywords:
        - "страховая сумма"
        - "страховая стоимость"
        - "действительная стоимость"
      rerank: true

  - id: "insured_person_consent_missing"
    name: "Отсутствие явного согласия застрахованного лица в личном страховании"
    description: "При личном страховании в отношении третьего лица отсутствие согласия может создавать риск недействительности или спора о выплате"
    legal_base: "ст. 934 ГК РФ"
    required_triggers: ["personal_insurance", "insured_person_differs_from_policyholder"]
    severity: "critical"
    result_if_triggered: "fail"
    detector_type: "rules"
    rules:
      negative_keywords:
        - "согласие застрахованного лица"
        - "застрахованное лицо дало согласие"
        - "письменное согласие"
      keyword_mode: "any"
    retrieval:
      context_k: 4
      boost_keywords:
        - "согласие застрахованного лица"
        - "личное страхование"
      rerank: true
  - id: "risk_increase_notification_missing"
    name: "Отсутствие порядка уведомления об увеличении степени риска"
    description: |
      По ст. 959 ГК РФ страхователь обязан уведомить страховщика об изменении 
      обстоятельств, существенно увеличивающих степень риска. Отсутствие порядка 
      уведомления создаёт риск отказа в выплате.
    legal_base: "ст. 959 ГК РФ"
    required_triggers: []
    severity: "high"
    result_if_triggered: "warning"
    detector_type: "rules"
    rules:
      keywords:
        - "увеличение степени риска"
        - "изменение обстоятельств"
        - "уведомить страховщика"
        - "обязан сообщить"
      keyword_mode: "any"
      negative_keywords:
        - "уведомить об увеличении"
        - "сообщить об изменении"
        - "увеличение степени риска"
    retrieval:
      context_k: 5
      boost_keywords:
        - "увеличение риска"
        - "изменение обстоятельств"
        - "уведомление"
      rerank: true

  - id: "premium_non_payment_consequences_unclear"
    name: "Неясные последствия неуплаты очередного взноса при рассрочке"
    description: |
      При оплате премии в рассрочку отсутствие чётких последствий просрочки 
      очередного взноса (приостановление покрытия, расторжение) создаёт 
      существенную неопределённость.
    legal_base: "ст. 954 ГК РФ"
    required_triggers: ["premium_installments"]
    severity: "high"
    result_if_triggered: "warning"
    detector_type: "rules"
    rules:
      keywords:
        - "рассрочка"
        - "очередной взнос"
        - "ежемесячный взнос"
      keyword_mode: "any"
      negative_keywords:
        - "приостановление покрытия"
        - "прекращение договора"
        - "просрочка уплаты взноса"
        - "последствия неуплаты"
    retrieval:
      context_k: 5
      boost_keywords:
        - "рассрочка"
        - "просрочка взноса"
        - "приостановление"
      rerank: true

  - id: "financial_ombudsman_missing_for_consumer"
    name: "Потребительское страхование без упоминания финансового уполномоченного"
    description: |
      С 2019 года обращение к финансовому уполномоченному является обязательным 
      досудебным этапом для физических лиц по спорам со страховщиками (ФЗ-123).
    legal_base: "ФЗ № 123-ФЗ"
    required_triggers: ["consumer_policyholder"]
    severity: "high"
    result_if_triggered: "warning"
    detector_type: "rules"
    rules:
      keywords:
        - "потребитель"
        - "физическое лицо"
        - "гражданин"
      keyword_mode: "any"
      negative_keywords:
        - "финансовый уполномоченный"
        - "омбудсмен"
        - "фз-123"
        - "фз № 123"
    retrieval:
      context_k: 5
      boost_keywords:
        - "финансовый уполномоченный"
        - "досудебный порядок"
        - "омбудсмен"
      rerank: true

# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 5: CHECKS_V8 — LLM/hybrid проверки
#  Читается: DocTypeCheckLoader._load_doc_type_checks()
# ════════════════════════════════════════════════════════════════════════════

checks_v8:

  - id: insurance_subject_extraction
    name: "Базовое извлечение предмета и конструкции страхования"
    description: "Извлекает тип страхования, объект, стороны, застрахованное лицо, выгодоприобретателя, страховую сумму и срок"
    triggers: {}
    severity: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "страховщик"
        - "страхователь"
        - "объект страхования"
        - "страховой случай"
        - "страховая сумма"
        - "выгодоприобретатель"
        - "застрахованное лицо"
        - "срок действия"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)(страховщик|страхователь|страховой\\s+случай)"
        - "(?i)(страховая\\s+сумма|страховая\\s+премия)"
        - "(?i)(?:полис|договор)\\s*№?\\s*[A-ZА-Я0-9\\-\\/]+"
    llm:
      prompt_template: |
        Ты — юридический ассистент, анализирующий договор страхования.
        Извлеки базовую структуру договора строго по тексту документа.

        Ответь строго в JSON:
        {
          "insurance_type": "<property / personal / liability / mixed / unclear / not_found>",
          "policy_number": "<номер полиса/договора или not_found>",
          "insurer": "<наименование страховщика или not_found>",
          "policyholder": "<страхователь или not_found>",
          "insured_person": "<застрахованное лицо или not_found>",
          "beneficiary": "<выгодоприобретатель или not_found>",
          "insured_object": "<объект страхования или not_found>",
          "insured_event": "<страховой случай/риск или not_found>",
          "sum_insured": "<страховая сумма или not_found>",
          "premium": "<страховая премия или not_found>",
          "term": "<срок страхования или not_found>"
        }

        Используй только явно указанные в тексте сведения.
        Если значение не найдено — пиши "not_found".
      prompt_file: null
      context_k: 6
      temperature: 0.0
      max_tokens: 700
    retrieval:
      context_k: 6
      max_chunks: 10
      boost_keywords:
        - "объект страхования"
        - "страховой случай"
        - "страховая сумма"
        - "страховая премия"
        - "выгодоприобретатель"
        - "застрахованное лицо"
      rerank: true
      filters: {}
    evidence:
      required: true
      min_snippet_length: 50
      max_snippet_length: 700
    extraction:
      enabled: true
      mode: "hybrid"
      fields:
        - name: "insurance_type"
          type: "string"
          allowed_values: ["property", "personal", "liability", "mixed", "unclear", "not_found"]
          description: "Тип страхования"
        - name: "policy_number"
          type: "string"
          regex_patterns:
            - "(?i)(?:полис|договор)\\s*№?\\s*[A-ZА-Я0-9\\-\\/]+"
          description: "Номер полиса/договора"
        - name: "insurer"
          type: "string"
          keyword_hints: ["страховщик", "страховая организация", "акционерное общество"]
          description: "Страховщик"
        - name: "policyholder"
          type: "string"
          keyword_hints: ["страхователь"]
          description: "Страхователь"
        - name: "insured_person"
          type: "string"
          keyword_hints: ["застрахованное лицо"]
          description: "Застрахованное лицо"
        - name: "beneficiary"
          type: "string"
          keyword_hints: ["выгодоприобретатель", "в пользу"]
          description: "Выгодоприобретатель"
        - name: "insured_object"
          type: "string"
          keyword_hints: ["объект страхования", "имущественный интерес", "жизнь", "здоровье", "ответственность"]
          description: "Объект страхования"
        - name: "insured_event"
          type: "string"
          keyword_hints: ["страховой случай", "страховой риск"]
          description: "Страховой случай/риск"
        - name: "sum_insured"
          type: "string"
          keyword_hints: ["страховая сумма", "лимит ответственности"]
          description: "Страховая сумма"
        - name: "premium"
          type: "string"
          keyword_hints: ["страховая премия", "страховой взнос"]
          description: "Страховая премия"
        - name: "term"
          type: "string"
          keyword_hints: ["срок действия", "период страхования", "договор действует"]
          description: "Срок страхования"
      store_payload: true

  - id: insured_event_and_exclusions_check
    name: "Страховой случай и исключения из покрытия"
    description: "Проверяет ясность определения страхового случая и прозрачность исключений"
    triggers: {}
    severity: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "страховой случай"
        - "страховой риск"
        - "не является страховым случаем"
        - "исключения из страхового покрытия"
        - "отказ в выплате"
        - "умысел"
        - "грубая неосторожность"
        - "военные действия"
        - "ядерный взрыв"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)не\\s+является\\s+страхов(ым|ым\\s+случаем)"
        - "(?i)исключени[яе].{0,40}покрыт"
        - "(?i)выплата\\s+не\\s+производится"
    llm:
      prompt_template: |
        Ты — юридический ассистент, анализирующий договор страхования.
        Проверь, как в договоре определены страховой случай и исключения из страхового покрытия.

        Ответь строго в JSON:
        {
          "insured_event_defined": "<yes / no / unclear>",
          "exclusions_present": "<yes / no>",
          "exclusions_clarity": "<clear / vague / not_found>",
          "contains_open_ended_exclusions": "<yes / no / unclear>",
          "key_exclusions_summary": "<краткое перечисление или not_found>"
        }

        - "vague" — если исключения сформулированы размыто, через "иные случаи", "по усмотрению страховщика" и т.п.
        - "contains_open_ended_exclusions" = "yes", если есть признаки открытого или неограниченного перечня исключений.

        Используй только текст документа.
      prompt_file: null
      context_k: 7
      temperature: 0.0
      max_tokens: 500
    retrieval:
      context_k: 7
      max_chunks: 10
      boost_keywords:
        - "страховой случай"
        - "исключения"
        - "не является страховым случаем"
        - "отказ в выплате"
      rerank: true
      filters: {}
    evidence:
      required: true
      min_snippet_length: 50
      max_snippet_length: 700
    extraction:
      enabled: true
      mode: "hybrid"
      fields:
        - name: "insured_event_defined"
          type: "string"
          allowed_values: ["yes", "no", "unclear"]
          description: "Определен ли страховой случай"
        - name: "exclusions_present"
          type: "string"
          allowed_values: ["yes", "no"]
          description: "Есть ли исключения из покрытия"
        - name: "exclusions_clarity"
          type: "string"
          allowed_values: ["clear", "vague", "not_found"]
          description: "Понятность исключений"
        - name: "contains_open_ended_exclusions"
          type: "string"
          allowed_values: ["yes", "no", "unclear"]
          description: "Есть ли открытые/размытые исключения"
      store_payload: true

  - id: rules_of_insurance_attachment_check
    name: "Правила страхования: включение в договор и подтверждение вручения"
    description: "Проверяет ссылку на Правила страхования и признаки их вручения/ознакомления страхователя"
    triggers: {}
    severity: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "правила страхования"
        - "с правилами ознакомлен"
        - "правила вручены"
        - "экземпляр правил"
        - "получил на руки"
        - "правила являются неотъемлемой частью"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)с\\s+правилами\\s+страхования\\s+ознакомлен"
        - "(?i)правила\\s+страхования\\s+(?:вручены|получены|прилагаются)"
        - "(?i)неотъемлем(ой|ой\\s+частью)\\s+договора"
    llm:
      prompt_template: |
        Ты — юридический ассистент, анализирующий договор страхования.
        Проверь, включены ли в договор Правила страхования и есть ли подтверждение их вручения или ознакомления страхователя.

        Ответь строго в JSON:
        {
          "rules_referenced": "<yes / no>",
          "rules_delivery_status": "<delivered / acknowledged_only / not_found>",
          "rules_incorporation_status": "<incorporated / unclear / not_found>",
          "rules_snippet": "<цитата или not_found>"
        }

        - "delivered" — есть явное указание на вручение/получение экземпляра
        - "acknowledged_only" — есть только формула об ознакомлении без ясного подтверждения вручения
        - "not_found" — ничего не найдено
      prompt_file: null
      context_k: 5
      temperature: 0.0
      max_tokens: 400
    retrieval:
      context_k: 5
      max_chunks: 8
      boost_keywords:
        - "правила страхования"
        - "ознакомлен"
        - "вручены"
        - "неотъемлемая часть"
      rerank: true
      filters: {}
    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 600
    extraction:
      enabled: true
      mode: "hybrid"
      fields:
        - name: "rules_referenced"
          type: "string"
          allowed_values: ["yes", "no"]
          description: "Есть ли ссылка на Правила страхования"
        - name: "rules_delivery_status"
          type: "string"
          allowed_values: ["delivered", "acknowledged_only", "not_found"]
          description: "Статус вручения Правил страхования"
        - name: "rules_incorporation_status"
          type: "string"
          allowed_values: ["incorporated", "unclear", "not_found"]
          description: "Включены ли Правила в договорную конструкцию"
      store_payload: true

  - id: claim_notification_check
    name: "Уведомление о страховом случае: срок, способ, последствия"
    description: "Проверяет наличие срока и способа уведомления о страховом случае, а также последствий просрочки"
    triggers: {}
    severity: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "уведомить страховщика"
        - "незамедлительно"
        - "в течение 24 часов"
        - "в течение"
        - "письменное уведомление"
        - "по телефону"
        - "сообщить о страховом случае"
        - "последствия несвоевременного уведомления"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)уведомит[ья].{0,60}страховщик"
        - "(?i)о\\s+наступлении\\s+страхового\\s+случая"
        - "(?i)(?:в\\s+течение|не\\s+позднее)\\s+\\d+\\s+(?:час|дн|рабоч)"
    llm:
      prompt_template: |
        Ты — юридический ассистент, анализирующий договор страхования.
        Проверь порядок уведомления о страховом случае.

        Ответь строго в JSON:
        {
          "notification_deadline_present": "<yes / no>",
          "notification_deadline": "<срок или not_found>",
          "notification_methods": ["<метод 1>", "<метод 2>"],
          "late_notice_consequences": "<specified / not_found>",
          "notice_clause_clarity": "<clear / unclear / not_found>"
        }

        Используй только сведения из текста.
      prompt_file: null
      context_k: 5
      temperature: 0.0
      max_tokens: 400
    retrieval:
      context_k: 5
      max_chunks: 8
      boost_keywords:
        - "уведомление о страховом случае"
        - "незамедлительно"
        - "в течение 24 часов"
        - "последствия"
      rerank: true
      filters: {}
    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 600
    extraction:
      enabled: true
      mode: "hybrid"
      fields:
        - name: "notification_deadline_present"
          type: "string"
          allowed_values: ["yes", "no"]
          description: "Есть ли срок уведомления"
        - name: "notification_deadline"
          type: "string"
          description: "Срок уведомления"
        - name: "late_notice_consequences"
          type: "string"
          allowed_values: ["specified", "not_found"]
          description: "Указаны ли последствия просрочки уведомления"
        - name: "notice_clause_clarity"
          type: "string"
          allowed_values: ["clear", "unclear", "not_found"]
          description: "Понятность порядка уведомления"
