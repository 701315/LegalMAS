  - id: insured_person_consent_check
    name: "Личное страхование: согласие застрахованного лица и статус выгодоприобретателя"
    description: >
      Проверяет юридическую действительность конструкции личного страхования:
      идентификацию застрахованного лица, наличие его письменного согласия
      на заключение договора (если страхователь — третье лицо), статус
      и порядок назначения выгодоприобретателя.
      Критически важный check: по п. 2 ст. 934 ГК РФ договор личного
      страхования в пользу лица, не являющегося застрахованным, может быть
      заключён только с письменного согласия застрахованного лица. Отсутствие
      согласия — основание для признания договора недействительным по иску
      застрахованного лица или его наследников.
    triggers:
      any:
        - personal_insurance
        - insured_person_differs_from_policyholder
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "согласие застрахованного лица"
        - "застрахованное лицо"
        - "выгодоприобретатель"
        - "письменное согласие"
        - "назначение выгодоприобретателя"
        - "застрахованный"
        - "в пользу застрахованного"
        - "замена выгодоприобретателя"
        - "наследники"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)согласие\\s+застрахованного\\s+лица"
        - "(?i)выгодоприобретател"
        - "(?i)застрахованн(?:ое\\s+лицо|ый)"
        - "(?i)в\\s+пользу\\s+(?:застрахованного|третьего\\s+лица)"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор личного страхования по Главе 48 ГК РФ.
        Проверяется только один вопрос: согласие застрахованного лица
        и статус выгодоприобретателя.

        Нормативный ориентир:
        - ст. 934 ГК РФ — договор личного страхования; п. 2 — согласие
          застрахованного лица при заключении договора не в его пользу
        - ст. 956 ГК РФ — замена выгодоприобретателя

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте
          договора.
        - Не оценивай серьёзность риска.
        - Учитывай российскую практику: если страхователь и
          застрахованное лицо совпадают (страхует сам себя), отдельное
          письменное согласие не требуется — оно презюмируется фактом
          заключения договора.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Идентифицировано ли застрахованное лицо (ФИО, дата
           рождения, иные реквизиты).
        2. Есть ли письменное согласие застрахованного лица на
           заключение договора (или совпадает ли застрахованное лицо
           со страхователем, что снимает требование согласия).
        3. Кто является выгодоприобретателем (конкретное лицо,
           страхователь, наследники, не назначен).

        [ПРАВИЛА]
        1. Используй только текст документа. Не подставляй нормы закона
           вместо текста договора.
        2. Если условие не указано прямо и не следует однозначно из
           текста — возвращай "not_defined".
        3. Если застрахованное лицо совпадает со страхователем и это
           следует из текста — insured_person_consent_status =
           "not_required" (согласие презюмируется).
        4. Не используй "None", "null", пустые строки. Не используй
           "not_found".
        5. "present" — есть явная формулировка о получении согласия
           застрахованного лица («согласие получено», «подпись
           застрахованного лица»).
        6. "unclear" — застрахованное лицо указано, но формулировка
           о согласии размыта или отсутствует, при этом страхователь
           и застрахованное лицо — разные лица.
        7. "named" — выгодоприобретатель конкретно назван (ФИО,
           наименование).
        8. "default_rules" — выгодоприобретатель не назначен явно,
           применяется законный порядок (наследники, страхователь).
        9. В evidence включай только текст договора.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — согласие получено, выгодоприобретатель назван:
        Фрагмент:
        "Застрахованное лицо — Петров Алексей Александрович,
        15.03.1985 г.р. Согласие застрахованного лица на заключение
        настоящего договора получено, о чём свидетельствует его
        подпись в Приложении № 1. Выгодоприобретатель — Петрова
        Мария Ивановна, супруга Застрахованного."

        Ответ:
        {
          "insured_person_identified": "yes",
          "insured_person_consent_status": "present",
          "beneficiary_status": "named",
          "consent_snippet": "Согласие застрахованного лица на заключение настоящего договора получено, о чём свидетельствует его подпись в Приложении № 1",
          "evidence": "Застрахованное лицо — Петров Алексей Александрович, 15.03.1985 г.р. Согласие застрахованного лица на заключение настоящего договора получено. Выгодоприобретатель — Петрова Мария Ивановна, супруга Застрахованного."
        }

        Пример 2 — застрахованное лицо не идентифицировано:
        Фрагмент:
        "Страхователь заключает договор личного страхования
        на условиях, определённых Правилами страхования."

        Ответ:
        {
          "insured_person_identified": "no",
          "insured_person_consent_status": "not_defined",
          "beneficiary_status": "not_defined",
          "consent_snippet": "Не установлено",
          "evidence": "Страхователь заключает договор личного страхования на условиях, определённых Правилами страхования."
        }

        Пример 3 — застрахованное лицо названо, согласие отсутствует (красный флаг):
        Фрагмент:
        "Страхователь — ООО «Альфа». Застрахованное лицо — Сидоров
        Иван Петрович, сотрудник Страхователя. Выгодоприобретатель —
        Страхователь. Страхование осуществляется на условиях Правил
        страхования от несчастных случаев № П-05."

        Ответ:
