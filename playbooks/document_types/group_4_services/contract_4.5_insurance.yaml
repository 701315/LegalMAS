  - id: insured_event_and_exclusions_check
    name: "Страховой случай и исключения из покрытия"
    description: >
      Проверяет ясность определения страхового случая и прозрачность исключений
      из страхового покрытия. Оценивает наличие открытых или размытых формулировок,
      позволяющих страховщику произвольно отказать в выплате.
      Нормативные ориентиры: ст. 942 ГК РФ (существенные условия),
      ст. 963 ГК РФ (основания освобождения страховщика от выплаты).
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "страховой случай"
        - "страховой риск"
        - "не является страховым случаем"
        - "исключения из страхового покрытия"
        - "отказ в выплате"
        - "умысел"
        - "грубая неосторожность"
        - "военные действия"
        - "ядерный взрыв"
        - "основания для отказа"
        - "не покрывается"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)не\\s+является\\s+страхов(ым|ым\\s+случаем)"
        - "(?i)исключени[яе].{0,40}покрыт"
        - "(?i)выплата\\s+не\\s+производится"
        - "(?i)основани[яе].{0,30}отказ"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор страхования по Главе 48 ГК РФ.
        Проверяется только один вопрос: определение страхового случая
        и исключений из покрытия.

        Нормативный ориентир:
        - ст. 942 ГК РФ — существенные условия договора страхования
        - ст. 963 ГК РФ — основания освобождения страховщика от выплаты

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора.
        - Не оценивай серьёзность риска.
        - Учитывай, что в российской практике исключения часто формулируются
          через отсылку к Правилам страхования или через открытые перечни
          («иные случаи, предусмотренные законодательством»).

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Определён ли страховой случай (конкретный перечень событий).
        2. Есть ли перечень исключений из покрытия.
        3. Насколько ясно сформулированы исключения (закрытый перечень
           vs размытые формулировки).
        4. Есть ли признаки открытых или неограниченных исключений
           («иные случаи», «по усмотрению страховщика», отсылка к
           неопределённым внешним документам).
        5. Краткое перечисление ключевых исключений.

        [ПРАВИЛА]
        1. Используй только текст документа. Не подставляй нормы закона
           вместо текста договора.
        2. Если условие не указано прямо и не следует однозначно из текста —
           возвращай "not_defined" в сигнальных полях и "Не установлено"
           в user-facing полях.
        3. Если исключения определены через отсылку к Правилам страхования —
           отражай это: "Согласно Правилам страхования № X".
        4. Не используй "None", "null", пустые строки. Не используй "not_found".
        5. "vague" — если исключения сформулированы размыто, через «иные случаи»,
           «по усмотрению страховщика», «в соответствии с законодательством»
           без конкретизации.
        6. "clear" — если исключения перечислены закрытым списком конкретных
           событий (пожар, наводнение, умысел и т.д.).
        7. "contains_open_ended_exclusions" = "yes", если есть хотя бы одна
           формулировка, допускающая неограниченное расширение перечня
           исключений без согласия страхователя.
        8. В evidence включай только текст договора.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — исключения чёткие, закрытый перечень:
        Фрагмент:
        "Страховым случаем является пожар, залив, взрыв бытового газа.
        Не являются страховыми случаями: военные действия, терроризм,
        ядерный взрыв, радиоактивное заражение, умысел страхователя
        или выгодоприобретателя, грубая неосторожность страхователя."

        Ответ:
        {
          "insured_event_defined": "yes",
          "exclusions_present": "yes",
          "exclusions_clarity": "clear",
          "contains_open_ended_exclusions": "no",
          "key_exclusions_summary": "Военные действия, терроризм, ядерный взрыв, радиоактивное заражение, умысел страхователя/выгодоприобретателя, грубая неосторожность страхователя",
          "evidence": [
            {
              "clause_ref": "п. X.Y",
              "quote": "Страховым случаем является пожар, залив, взрыв бытового газа. Не являются страховыми случаями: военные действия, терроризм, ядерный взрыв, радиоактивное заражение, умысел страхователя или выгодоприобретателя, грубая неосторожность страхователя."
            }
          ]
        }

        Пример 2 — исключения размытые, открытый перечень:
        Фрагмент:
        "Страховым случаем признаётся событие, повлёкшее убытки
        Страхователя. Страховщик вправе отказать в выплате в иных
        случаях, предусмотренных законодательством Российской Федерации
        и Правилами страхования."

        Ответ:
        {
          "insured_event_defined": "unclear",
          "exclusions_present": "yes",
          "exclusions_clarity": "vague",
          "contains_open_ended_exclusions": "yes",
          "key_exclusions_summary": "Иные случаи, предусмотренные законодательством РФ и Правилами страхования (без конкретизации)",
          "evidence": [
            {
              "clause_ref": "п. X.Y",
              "quote": "Страховым случаем признаётся событие, повлёкшее убытки Страхователя. Страховщик вправе отказать в выплате в иных случаях, предусмотренных законодательством Российской Федерации и Правилами страхования."
            }
          ]
        }

        Пример 3 — страховой случай определён, исключения не упомянуты:
        Фрагмент:
        "Страховым случаем признаётся причинение вреда жизни или
        здоровью Застрахованного в результате несчастного случая,
        произошедшего в период действия договора."

        Ответ:
        {
          "insured_event_defined": "yes",
          "exclusions_present": "no",
          "exclusions_clarity": "not_defined",
          "contains_open_ended_exclusions": "not_defined",
          "key_exclusions_summary": "Не установлено — в тексте договора исключения из покрытия не указаны",
          "evidence": [
            {
              "clause_ref": "п. X.Y",
              "quote": "Страховым случаем признаётся причинение вреда жизни или здоровью Застрахованного в результате несчастного случая, произошедшего в период действия договора."
            }
          ]
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о страховом случае.
        2. Найди прямую цитату об исключениях (если есть).
        3. Если исключения сформулированы через «иные», «по усмотрению»,
           «в соответствии с законодательством» без конкретизации —
           ставь exclusions_clarity = "vague" и
           contains_open_ended_exclusions = "yes".
        4. Не выводи исключения из законодательства, если они не указаны
           в тексте договора.
        5. Проверь, что все 6 ключей (5 полей + evidence) присутствуют
           в JSON.

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь РОВНО одним JSON-объектом без какого-либо дополнительного текста
        до или после, со всеми 6 ключами (5 полей + evidence):
        {
          "insured_event_defined": "<yes / no / unclear>",
          "exclusions_present": "<yes / no>",
          "exclusions_clarity": "<clear / vague / not_defined>",
          "contains_open_ended_exclusions": "<yes / no / not_defined>",
          "key_exclusions_summary": "<перечисление исключений или fallback>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 8
      temperature: 0.0
      max_tokens: 700

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "страховой случай страховой риск исключения из покрытия не является страховым случаем отказ в выплате основания для отказа не покрывается"
      boost_keywords:
        - "исключения"
        - "отказ в выплате"
        - "не является страховым случаем"
        - "основания для отказа"
      preferred_unit_types:
        - obligation
        - general_provision
        - definition
      excluded_unit_types:
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - definitions
        - obligations
        - limitations
      negative_keywords:
        - "премия"
        - "страховая сумма"
      position_bias:
        preferred_range: [0.10, 0.70]
        boost: 0.15
        scope: segment
      context_k: 8
      max_chunks: 12
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
        - "invoice"
      preferred_clause_functions:
        - "definitions"
        - "obligations"
        - "limitations"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 50
      max_snippet_length: 700

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 800

      compact_output: false

      presence_signal:
        field: "insured_event_and_exclusions_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист по договорной работе. Твоя задача — извлечь
        из текста договора страхования определение страхового случая
        и исключений из покрытия, оценить ясность формулировок.
        Не анализируй порядок уведомления о страховом случае, сроки
        выплаты, суброгацию — это предмет других проверок.
        Не оценивай риски.
        Анализируй только текст договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. insured_event_and_exclusions_check_presence:
           Агрегатное signal-поле — наличие условий о страховом случае
           и исключениях.
           - "present" — если хотя бы одно из содержательных полей
             (insured_event_defined, exclusions_present, exclusions_clarity,
              contains_open_ended_exclusions) ≠ "not_defined";
           - "missing" — если все четыре содержательных поля = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - insured_event_defined = "no";
           - exclusions_present = "no";
           - exclusions_clarity = "not_defined";
           - contains_open_ended_exclusions = "not_defined";
           - key_exclusions_summary = "Не установлено";
           - не выполняй остальные шаги.

        1. insured_event_defined — определён ли страховой случай:
           "yes" — конкретный перечень событий;
           "no" — страховой случай не определён вообще;
           "unclear" — формулировка слишком общая.

        2. exclusions_present — есть ли исключения из покрытия:
           "yes" — перечень или описание исключений;
           "no" — исключения не упомянуты.

        3. exclusions_clarity — ясность формулировок исключений:
           "clear" — закрытый перечень конкретных событий;
           "vague" — размытые формулировки;
           "not_defined" — исключения не упомянуты.

        4. contains_open_ended_exclusions — есть ли открытые/неограниченные
           исключения:
           "yes" — есть хотя бы одна формулировка, допускающая
           неограниченное расширение перечня;
           "no" — перечень закрытый;
           "not_defined" — исключения не упомянуты.

        5. key_exclusions_summary — краткое перечисление ключевых
           исключений одной строкой.
        </task>

        <context_rules>
        - Перед остальными полями заполни insured_event_and_exclusions_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все содержательные поля = "not_defined" / "no", key_exclusions_summary = "Не установлено".
        - Используй только текст договора из <context>. Не подставляй
          нормы закона вместо текста договора.
        - Не выводи исключения из законодательства, если они не указаны
          в тексте договора.
        - Не делай предположений сверх того, что прямо следует из текста.
        - Если параметр определён через отсылку к Правилам страхования —
          отражай отсылку в key_exclusions_summary.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни страхового случая, ни исключений.
           → presence = "missing";
             все содержательные поля = "not_defined" / "no";
             key_exclusions_summary = "Не установлено".

        2. Страховой случай указан обобщённо.
           Например: "Страховым случаем признаётся событие, повлёкшее
           убытки Страхователя", без конкретного перечня.
           → presence = "present";
             insured_event_defined = "unclear";
             exclusions_present = "no";
             exclusions_clarity = "not_defined";
             contains_open_ended_exclusions = "not_defined".

        3. Исключения размытые / открытые.
           Формулировки «иные случаи», «по усмотрению страховщика»,
           «в соответствии с законодательством» без конкретизации.
           → presence = "present";
             exclusions_present = "yes";
             exclusions_clarity = "vague";
             contains_open_ended_exclusions = "yes";
             key_exclusions_summary содержит дословную формулировку.

        4. Исключения чёткие, закрытый перечень.
           Перечислены конкретные события (пожар, наводнение, умысел
           страхователя, грубая неосторожность и т.п.).
           → presence = "present";
             insured_event_defined = "yes";
             exclusions_present = "yes";
             exclusions_clarity = "clear";
             contains_open_ended_exclusions = "no".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для insured_event_and_exclusions_check_presence используй только:
          "present", "missing", "unclear".
        - Для insured_event_defined допустимо только: yes / no / unclear.
        - Для exclusions_present допустимо только: yes / no.
        - Для exclusions_clarity допустимо только: clear / vague / not_defined.
        - Для contains_open_ended_exclusions допустимо только: yes / no / not_defined.
        - Fallback-значения для key_exclusions_summary:
          * "Не установлено" — исключения не упомянуты;
          * "Согласно Правилам страхования № X" — отсылка к внешнему
            документу.
        - evidence — массив объектов вида {"clause_ref": "...", "quote": "..."},
          а не строка.
        - Технический формат JSON (value / confidence / location) задан
          отдельным контрактом — соблюдай его, но не описывай здесь.
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>
      fields:
        - name: "insured_event_and_exclusions_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие условий о страховом случае и исключениях. Внутреннее агрегатное signal-поле."
          required: true

        - name: "insured_event_defined"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["yes", "no", "unclear"]
          label: "Страховой случай определён"
          description: "Определён ли страховой случай конкретным перечнем событий."
          required: true
          display_in_grid: true
          display_priority: 1

        - name: "exclusions_present"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["yes", "no"]
          label: "Исключения из покрытия"
          description: "Есть ли в договоре перечень исключений из страхового покрытия."
          required: true
          display_in_grid: true
          display_priority: 2

        - name: "exclusions_clarity"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["clear", "vague", "not_defined"]
          label: "Ясность исключений"
          description: "Насколько ясно сформулированы исключения: закрытый перечень (clear) vs размытые формулировки (vague)."
          required: true
          display_in_grid: true
          display_priority: 3

        - name: "contains_open_ended_exclusions"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["yes", "no", "not_defined"]
          label: "Открытые исключения"
          description: "Есть ли формулировки, допускающие неограниченное расширение перечня исключений (красный флаг)."
          required: true
          display_in_grid: true
          display_priority: 4

        - name: "key_exclusions_summary"
          type: "string"
          presentation: "fact"
          label: "Ключевые исключения"
          description: "Краткое перечисление ключевых исключений из покрытия или отсылка к Правилам страхования."
          required: true
          display_in_grid: true
          display_priority: 5

      store_payload: true

  - id: rules_of_insurance_attachment_check
    name: "Правила страхования: включение в договор и подтверждение вручения"
    description: >
      Проверяет наличие ссылки на Правила страхования, их включение
      в договорную конструкцию и подтверждение ознакомления/вручения
      страхователю. Критически важный check: по ст. 943 ГК РФ условия
      страхования могут определяться в Правилах, но ссылка на них
      оспорима, если страхователь не был ознакомлен (п. 2 ст. 940 ГК РФ,
      практика ВС РФ — бремя доказывания ознакомления на страховщике).
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "правила страхования"
        - "с правилами ознакомлен"
        - "правила вручены"
        - "экземпляр правил"
        - "получил на руки"
        - "правила являются неотъемлемой частью"
        - "ознакомление с правилами"
        - "подтверждает получение"
        - "на основании правил"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)с\\s+правилами\\s+страхования\\s+ознакомлен"
        - "(?i)правила\\s+страхования\\s+(?:вручены|получены|прилагаются)"
        - "(?i)неотъемлем(ой|ой\\s+частью)\\s+договора"
        - "(?i)подтвержда(?:ет|ю)\\s+(?:получение|ознакомление)"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор страхования по Главе 48 ГК РФ.
        Проверяется только один вопрос: включение Правил страхования
        в договор и подтверждение ознакомления страхователя.

        Нормативный ориентир:
        - ст. 943 ГК РФ — условия страхования определяются в Правилах
          страхования, на которые ссылается договор
        - п. 2 ст. 940 ГК РФ — правила могут быть изложены в полисе
          или приложении к нему

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте
          договора.
        - Не оценивай серьёзность риска.
        - Учитывай российскую практику: различие между «ознакомлен»
          (формальная фраза) и «вручён экземпляр» (фактическая передача)
          имеет юридическое значение.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Есть ли ссылка на конкретные Правила страхования (название,
           номер, дата утверждения).
        2. Подтверждено ли вручение экземпляра Правил страхователю
           или только формальное ознакомление.
        3. Указано ли, что Правила являются неотъемлемой частью договора.
        4. Цитату из договора, подтверждающую выводы.

        [ПРАВИЛА]
        1. Используй только текст документа. Не подставляй нормы закона
           вместо текста договора.
        2. Если условие не указано прямо и не следует однозначно из
           текста — возвращай "not_defined".
        3. Если Правила упомянуты, но вручение не подтверждено —
           rules_delivery_status = "not_defined", а не "delivered".
        4. Не используй "None", "null", пустые строки. Не используй
           "not_found".
        5. "delivered" — есть явное указание на вручение/получение
           экземпляра Правил («вручены», «получил на руки», «передан
           экземпляр»).
        6. "acknowledged_only" — есть только формула об ознакомлении
           («с Правилами ознакомлен») без ясного подтверждения вручения
           физического экземпляра.
        7. "incorporated" — прямо указано, что Правила являются
           неотъемлемой частью договора или его приложением.
        8. "unclear" — ссылка на Правила есть, но их статус в
           договорной конструкции неясен.
        9. В evidence включай только текст договора.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — Правила вручены и включены в договор:
        Фрагмент:
        "Настоящий договор заключён на основании Правил добровольного
        страхования имущества юридических лиц № П-12, утверждённых
        Приказом Генерального директора Страховщика от 15.01.2024,
        являющихся неотъемлемой частью настоящего договора. Страхователь
        подтверждает получение экземпляра указанных Правил и
        ознакомление с их содержанием."

        Ответ:
        {
          "rules_referenced": "yes",
          "rules_delivery_status": "delivered",
          "rules_incorporation_status": "incorporated",
          "rules_snippet": "Правила добровольного страхования имущества юридических лиц № П-12 от 15.01.2024, являющихся неотъемлемой частью настоящего договора. Страхователь подтверждает получение экземпляра",
          "evidence": [
            {
              "clause_ref": "п. X.Y",
              "quote": "Настоящий договор заключён на основании Правил добровольного страхования имущества юридических лиц № П-12, утверждённых Приказом Генерального директора Страховщика от 15.01.2024, являющихся неотъемлемой частью настоящего договора. Страхователь подтверждает получение экземпляра указанных Правил и ознакомление с их содержанием."
            }
          ]
        }

        Пример 2 — данные полностью отсутствуют:
        Фрагмент:
        "Стороны заключили договор страхования."

        Ответ:
        {
          "rules_referenced": "no",
          "rules_delivery_status": "not_defined",
          "rules_incorporation_status": "not_defined",
          "rules_snippet": "Не установлено",
          "evidence": [
            {
              "clause_ref": "п. X.Y",
              "quote": "Стороны заключили договор страхования."
            }
          ]
        }

        Пример 3 — Правила упомянуты, но вручение не подтверждено:
        Фрагмент:
        "Договор страхования заключается на условиях Правил страхования
        ответственности перевозчика, разработанных Страховщиком.
        Страхователь с Правилами ознакомлен."

        Ответ:
        {
          "rules_referenced": "yes",
          "rules_delivery_status": "acknowledged_only",
          "rules_incorporation_status": "unclear",
          "rules_snippet": "На условиях Правил страхования ответственности перевозчика. Страхователь с Правилами ознакомлен",
          "evidence": [
            {
              "clause_ref": "п. X.Y",
              "quote": "Договор страхования заключается на условиях Правил страхования ответственности перевозчика, разработанных Страховщиком. Страхователь с Правилами ознакомлен."
            }
          ]
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о Правилах страхования (название, номер).
        2. Найди прямую цитату о вручении или ознакомлении.
        3. Найди прямую цитату о неотъемлемой части (если есть).
        4. Если есть только «ознакомлен» без «вручён/получил» —
           ставь "acknowledged_only", а не "delivered".
        5. Проверь, что все 5 ключей (4 поля + evidence) присутствуют
           в JSON.

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь РОВНО одним JSON-объектом без какого-либо дополнительного
        текста до или после, со всеми 5 ключами (4 поля + evidence):
        {
          "rules_referenced": "<yes / no>",
          "rules_delivery_status": "<delivered / acknowledged_only / not_defined>",
          "rules_incorporation_status": "<incorporated / unclear / not_defined>",
          "rules_snippet": "<цитата или 'Не установлено'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 7
      temperature: 0.0
      max_tokens: 600

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "правила страхования ознакомлен вручены неотъемлемая часть экземпляр правил на основании правил подтверждает получение"
      boost_keywords:
        - "правила страхования"
        - "ознакомлен"
        - "вручены"
        - "неотъемлемая часть"
      preferred_unit_types:
        - obligation
        - general_provision
        - definition
      excluded_unit_types:
        - technical_fragment
      preferred_clause_functions:
        - definitions
        - obligations
        - procedures
        - boilerplate
      negative_keywords:
        - "страховая сумма"
        - "премия"
      position_bias:
        preferred_range: [0.0, 0.80]
        boost: 0.15
        scope: segment
      context_k: 7
      max_chunks: 10
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
        - "invoice"
      preferred_clause_functions:
        - "definitions"
        - "obligations"
        - "procedures"
        - "boilerplate"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 600

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 800

      compact_output: false

      presence_signal:
        field: "rules_of_insurance_attachment_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист по договорной работе. Твоя задача — извлечь
        из текста договора страхования сведения о Правилах страхования:
        наличие ссылки, статус вручения/ознакомления, включение в
        договорную конструкцию. Не анализируй содержание самих Правил —
        только факт их упоминания и вручения в тексте договора.
        Не оценивай риски.
        Анализируй только текст договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. rules_of_insurance_attachment_check_presence:
           Агрегатное signal-поле — наличие ссылки на Правила
           и подтверждения вручения.
           - "present" — если хотя бы одно из содержательных полей
             (rules_referenced, rules_delivery_status,
              rules_incorporation_status) ≠ "not_defined";
           - "missing" — если все три содержательных поля = "not_defined"
             (или rules_referenced = "no");
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - rules_referenced = "no";
           - rules_delivery_status = "not_defined";
           - rules_incorporation_status = "not_defined";
           - rules_snippet = "Не установлено";
           - не выполняй остальные шаги.

        1. rules_referenced — есть ли ссылка на Правила страхования:
           "yes" — в договоре упомянуты конкретные Правила (название,
           номер, дата);
           "no" — Правила не упомянуты.

        2. rules_delivery_status — статус вручения Правил страхователю:
           "delivered" — явное указание на вручение/получение экземпляра
           («вручены», «получил на руки», «передан экземпляр»);
           "acknowledged_only" — только формула об ознакомлении
           («с Правилами ознакомлен») без подтверждения вручения;
           "not_defined" — вопрос вручения не раскрыт.

        3. rules_incorporation_status — включение Правил в договор:
           "incorporated" — прямо указано «неотъемлемая часть договора»
           или «являются приложением к договору»;
           "unclear" — ссылка на Правила есть, но их статус неясен;
           "not_defined" — Правила не упомянуты.

        4. rules_snippet — краткая цитата из договора о Правилах
           страхования (до 200 символов). Если Правила не упомянуты —
           "Не установлено".
        </task>

        <context_rules>
        - Перед остальными полями заполни rules_of_insurance_attachment_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — rules_referenced = "no", rules_delivery_status = "not_defined", rules_incorporation_status = "not_defined", rules_snippet = "Не установлено".
        - Используй только текст договора из <context>. Не подставляй
          нормы закона вместо текста договора.
        - Не выводи вручение из молчания договора: если нет явной
          формулировки о вручении — ставь "not_defined".
        - Различай «ознакомлен» (acknowledged_only) и «вручён»
          (delivered) — это юридически значимое различие.
        - Не делай предположений сверх того, что прямо следует из текста.
        - Если в разных фрагментах указаны противоречивые данные — верни
          "Не установлено" / "not_defined".
        - Не используй пустые строки.
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни ссылки на Правила, ни упоминания вручения.
           → presence = "missing";
             rules_referenced = "no";
             rules_delivery_status = "not_defined";
             rules_incorporation_status = "not_defined";
             rules_snippet = "Не установлено".

        2. Только формальное ознакомление.
           Указано «Страхователь с Правилами ознакомлен», без
           подтверждения вручения экземпляра.
           → presence = "present";
             rules_referenced = "yes";
             rules_delivery_status = "acknowledged_only";
             rules_incorporation_status = "unclear" (если статус неясен)
               или "not_defined";
             rules_snippet содержит дословную формулировку.

        3. Противоречие между фрагментами.
           В разных частях договора указаны разные Правила или разные
           статусы вручения / включения.
           → presence = "unclear";
             соответствующие содержательные поля = "not_defined";
             rules_snippet = "Не установлено".

        4. Правила вручены и включены в договор.
           В договоре прямо указано, что Правила являются неотъемлемой
           частью договора, и подтверждено получение экземпляра.
           → presence = "present";
             rules_referenced = "yes";
             rules_delivery_status = "delivered";
             rules_incorporation_status = "incorporated";
             rules_snippet содержит дословную формулировку.
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для rules_of_insurance_attachment_check_presence используй
          только: "present", "missing", "unclear".
        - Для rules_referenced допустимо только: yes / no.
        - Для rules_delivery_status допустимо только:
          delivered / acknowledged_only / not_defined.
        - Для rules_incorporation_status допустимо только:
          incorporated / unclear / not_defined.
        - Fallback для rules_snippet: "Не установлено".
        - evidence — массив объектов вида {"clause_ref": "...", "quote": "..."},
          а не строка.
        - Технический формат JSON (value / confidence / location) задан
          отдельным контрактом — соблюдай его, но не описывай здесь.
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>
      fields:
        - name: "rules_of_insurance_attachment_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие ссылки на Правила страхования и подтверждения вручения. Внутреннее агрегатное signal-поле."
          required: true

        - name: "rules_referenced"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["yes", "no"]
          label: "Правила страхования упомянуты"
          description: "Есть ли в договоре ссылка на конкретные Правила страхования."
          required: true
          display_in_grid: true
          display_priority: 1

        - name: "rules_delivery_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["delivered", "acknowledged_only", "not_defined"]
          label: "Вручение Правил"
          description: "Статус вручения Правил: вручён экземпляр (delivered), только ознакомление (acknowledged_only), не раскрыто (not_defined)."
          required: true
          display_in_grid: true
          display_priority: 2

        - name: "rules_incorporation_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["incorporated", "unclear", "not_defined"]
          label: "Включение в договор"
          description: "Включены ли Правила в договорную конструкцию: неотъемлемая часть (incorporated), статус неясен (unclear), не упомянуты (not_defined)."
          required: true
          display_in_grid: true
          display_priority: 3

        - name: "rules_snippet"
          type: "string"
          presentation: "diagnostic"
          label: "Цитата о Правилах"
          description: "Краткая цитата из договора о Правилах страхования или отсылка."
          required: true
          display_in_grid: true
          display_priority: 4

      store_payload: true

  - id: claim_notification_check
    name: "Уведомление о страховом случае: срок, способ, последствия"
    description: >
      Проверяет наличие и ясность порядка уведомления страховщика о наступлении
      страхового случая: конкретный срок, допустимые способы, последствия
      несвоевременного уведомления. Критически важный check: по ст. 961 ГК РФ
      страхователь обязан уведомить страховщика незамедлительно, а договором
      может быть установлен конкретный срок. Нарушение порядка уведомления —
      одно из самых частых оснований отказа в выплате в российской практике.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "уведомить страховщика"
        - "незамедлительно"
        - "в течение 24 часов"
        - "в течение"
        - "письменное уведомление"
        - "по телефону"
        - "сообщить о страховом случае"
        - "последствия несвоевременного уведомления"
        - "порядок уведомления"
        - "извещение о страховом случае"
        - "заявление о страховом случае"
        - "электронная почта"
        - "личный кабинет"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)уведомит[ья].{0,60}страховщик"
        - "(?i)о\\s+наступлении\\s+страхового\\s+случая"
        - "(?i)(?:в\\s+течение|не\\s+позднее)\\s+\\d+\\s+(?:час|дн|рабоч)"
        - "(?i)извещ(?:ение|ает).{0,40}страхов"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор страхования по Главе 48 ГК РФ.
        Проверяется только один вопрос: порядок уведомления о наступлении
        страхового случая.

        Нормативный ориентир:
        - ст. 961 ГК РФ — обязанность уведомления о наступлении
          страхового случая; последствия неисполнения

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте
          договора.
        - Не оценивай серьёзность риска.
        - Учитывай российскую практику: порядок уведомления может быть
          определён через отсылку к Правилам страхования; способы
          уведомления могут включать телефон, e-mail, личный кабинет,
          мобильное приложение.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Установлен ли конкретный срок уведомления о страховом случае.
        2. Какой именно срок (в часах, днях, рабочих днях).
        3. Какие способы уведомления предусмотрены (телефон, письмо,
           e-mail, личный кабинет и т.д.).
        4. Указаны ли последствия несвоевременного уведомления
           (отказ в выплате, снижение выплаты, иное).
        5. Насколько ясно и полно сформулирован порядок уведомления.

        [ПРАВИЛА]
        1. Используй только текст документа. Не подставляй нормы закона
           вместо текста договора.
        2. Если условие не указано прямо и не следует однозначно из
           текста — возвращай "not_defined".
        3. Если порядок уведомления определён через отсылку к Правилам
           страхования — отражай это: "Согласно Правилам страхования".
        4. Не используй "None", "null", пустые строки. Не используй
           "not_found".
        5. "clear" — срок конкретен (число + единица), способы
           перечислены, последствия описаны.
        6. "unclear" — формулировки размыты («в разумный срок»,
           «незамедлительно» без конкретизации, «в порядке,
           предусмотренном Правилами» без приложения Правил).
        7. "specified" — последствия просрочки прямо описаны (отказ,
           снижение, иное).
        8. "vague" — последствия упомянуты, но не конкретизированы
           («страховщик вправе применить меры»).
        9. notification_methods — перечисли через запятую все явно
           указанные способы. Если не указаны — "Не установлено".
        10. В evidence включай только текст договора.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — порядок уведомления урегулирован полностью:
        Фрагмент:
        "Страхователь обязан уведомить Страховщика о наступлении
        страхового случая в течение 3 (трёх) рабочих дней с момента,
        когда ему стало или должно было стать известно о наступлении
        страхового случая. Уведомление осуществляется по телефону
        горячей линии Страховщика и дублируется письменно на
        электронную почту claims@insurer.ru. При несвоевременном
        уведомлении Страховщик вправе отказать в страховой выплате,
        если докажет, что позднее уведомление лишило его возможности
        проверить обстоятельства страхового случая."

        Ответ:
        {
          "notification_deadline_present": "yes",
          "notification_deadline": "3 рабочих дня с момента, когда стало известно",
          "notification_methods": "телефон горячей линии, электронная почта",
          "late_notice_consequences": "specified",
          "notice_clause_clarity": "clear",
          "evidence": [
            {
              "clause_ref": "п. X.Y",
              "quote": "Страхователь обязан уведомить Страховщика о наступлении страхового случая в течение 3 (трёх) рабочих дней. Уведомление осуществляется по телефону горячей линии и дублируется письменно на электронную почту. При несвоевременном уведомлении Страховщик вправе отказать в страховой выплате."
            }
          ]
        }

        Пример 2 — данные практически отсутствуют:
        Фрагмент:
        "Страхователь уведомляет Страховщика о наступлении события,
        имеющего признаки страхового случая."

        Ответ:
        {
          "notification_deadline_present": "no",
          "notification_deadline": "not_defined",
          "notification_methods": "Не установлено",
          "late_notice_consequences": "not_defined",
          "notice_clause_clarity": "unclear",
          "evidence": [
            {
              "clause_ref": "п. X.Y",
              "quote": "Страхователь уведомляет Страховщика о наступлении события, имеющего признаки страхового случая."
            }
          ]
        }

        Пример 3 — срок есть, способы и последствия через Правила:
        Фрагмент:
        "Страхователь обязан сообщить Страховщику о страховом случае
        не позднее 24 часов с момента его наступления. Порядок и
        способы уведомления, а также последствия нарушения срока
        определяются Правилами страхования № П-12 от 15.01.2024."

        Ответ:
        {
          "notification_deadline_present": "yes",
          "notification_deadline": "24 часа с момента наступления",
          "notification_methods": "Согласно Правилам страхования № П-12 от 15.01.2024",
          "late_notice_consequences": "vague",
          "notice_clause_clarity": "unclear",
          "evidence": [
            {
              "clause_ref": "п. X.Y",
              "quote": "Страхователь обязан сообщить Страховщику о страховом случае не позднее 24 часов с момента его наступления. Порядок и способы уведомления, а также последствия нарушения срока определяются Правилами страхования № П-12 от 15.01.2024."
            }
          ]
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о сроке уведомления (число + единица).
        2. Найди прямую цитату о способах уведомления.
        3. Найди прямую цитату о последствиях просрочки.
        4. Если срок указан как «незамедлительно» без конкретизации —
           ставь notice_clause_clarity = "unclear".
        5. Проверь, что все 6 ключей (5 полей + evidence) присутствуют
           в JSON.

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь РОВНО одним JSON-объектом без какого-либо дополнительного
        текста до или после, со всеми 6 ключами (5 полей + evidence):
        {
          "notification_deadline_present": "<yes / no>",
          "notification_deadline": "<срок или not_defined>",
          "notification_methods": "<перечисление через запятую или fallback>",
          "late_notice_consequences": "<specified / vague / not_defined>",
          "notice_clause_clarity": "<clear / unclear / not_defined>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 8
      temperature: 0.0
      max_tokens: 700

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "уведомление о страховом случае извещение о наступлении срок уведомления способ уведомления незамедлительно последствия несвоевременного уведомления просрочка уведомления"
      boost_keywords:
        - "уведомление о страховом случае"
        - "срок уведомления"
        - "последствия"
        - "несвоевременное уведомление"
      preferred_unit_types:
        - obligation
        - general_provision
        - definition
      excluded_unit_types:
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - procedures
        - limitations
      negative_keywords:
        - "премия"
        - "страховая сумма"
      position_bias:
        preferred_range: [0.20, 0.80]
        boost: 0.12
        scope: segment
      context_k: 8
      max_chunks: 10
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
        - "invoice"
      preferred_clause_functions:
        - "obligations"
        - "procedures"
        - "limitations"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 600

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 800

      compact_output: false

      presence_signal:
        field: "claim_notification_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист по договорной работе. Твоя задача — извлечь
        из текста договора страхования порядок уведомления о наступлении
        страхового случая: срок, способы, последствия просрочки.
        Не анализируй порядок выплаты, список документов для выплаты,
        суброгацию — это предмет других проверок.
        Не оценивай риски.
        Анализируй только текст договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. claim_notification_check_presence:
           Агрегатное signal-поле — наличие порядка уведомления
           о страховом случае.
           - "present" — если хотя бы одно из содержательных полей
             (notification_deadline_present, late_notice_consequences,
              notice_clause_clarity) ≠ "not_defined";
           - "missing" — если все три содержательных поля = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - notification_deadline_present = "no";
           - late_notice_consequences = "not_defined";
           - notice_clause_clarity = "not_defined";
           - notification_deadline = "not_defined";
           - notification_methods = "Не установлено";
           - не выполняй остальные шаги.

        1. notification_deadline_present — установлен ли конкретный срок
           уведомления:
           "yes" — есть число + единица (24 часа, 3 дня, 5 рабочих дней);
           "no" — срок не установлен или не упомянут.

        2. notification_deadline — конкретный срок уведомления текстом.
           Если срок не установлен — "not_defined".
           Если определён через Правила — "Согласно Правилам страхования".

        3. notification_methods — перечисление всех явно указанных
           способов уведомления через запятую.
           Если способы не указаны — "Не установлено".
           Если определены через Правила — "Согласно Правилам страхования".

        4. late_notice_consequences — последствия несвоевременного
           уведомления:
           "specified" — прямо описаны (отказ в выплате, снижение,
           удержание);
           "vague" — упомянуты, но не конкретизированы;
           "not_defined" — последствия не упомянуты.

        5. notice_clause_clarity — ясность и полнота порядка уведомления:
           "clear" — срок конкретен, способы перечислены, последствия
           описаны;
           "unclear" — формулировки размыты;
           "not_defined" — порядок уведомления не раскрыт.
        </task>

        <context_rules>
        - Перед остальными полями заполни claim_notification_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — notification_deadline_present = "no", late_notice_consequences = "not_defined", notice_clause_clarity = "not_defined", notification_deadline = "not_defined", notification_methods = "Не установлено".
        - Используй только текст договора из <context>. Не подставляй
          нормы закона вместо текста договора.
        - Не выводи срок из молчания договора: если нет явной
          формулировки — ставь "not_defined".
        - «Незамедлительно» без конкретизации в часах/днях — это
          "unclear", а не "clear".
        - Если порядок определён через отсылку к Правилам страхования —
          отражай отсылку в user-facing полях.
        - Не делай предположений сверх того, что прямо следует из текста.
        - Если в разных фрагментах указаны противоречивые данные — верни
          "not_defined" для сигнальных полей, "Не установлено" для текстовых.
        - Не используй пустые строки.
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни срока, ни способов, ни последствий уведомления.
           → presence = "missing";
             notification_deadline_present = "no";
             late_notice_consequences = "not_defined";
             notice_clause_clarity = "not_defined";
             notification_deadline = "not_defined";
             notification_methods = "Не установлено".

        2. Уведомление упомянуто без срока и способов.
           Например: "Страхователь уведомляет Страховщика о наступлении
           события", без числа и без указания способов.
           → presence = "present";
             notification_deadline_present = "no";
             notification_deadline = "not_defined";
             notification_methods = "Не установлено";
             late_notice_consequences = "not_defined";
             notice_clause_clarity = "unclear".

        3. Противоречие между фрагментами.
           В разных частях договора указаны разные сроки уведомления
           или разные способы.
           → presence = "unclear";
             соответствующие сигнальные поля = "not_defined";
             notification_deadline = "Не установлено";
             notification_methods = "Не установлено".

        4. Порядок уведомления урегулирован полностью.
           Указан конкретный срок (число + единица), перечислены
           способы, описаны последствия просрочки.
           → presence = "present";
             notification_deadline_present = "yes";
             late_notice_consequences = "specified";
             notice_clause_clarity = "clear";
             notification_deadline и notification_methods содержат
               дословные формулировки.
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для claim_notification_check_presence используй только:
          "present", "missing", "unclear".
        - Для notification_deadline_present допустимо только: yes / no.
        - Для late_notice_consequences допустимо только:
          specified / vague / not_defined.
        - Для notice_clause_clarity допустимо только:
          clear / unclear / not_defined.
        - Fallback-значения:
          * notification_deadline: "not_defined";
          * notification_methods: "Не установлено";
          * "Согласно Правилам страхования № X" — при отсылке.
        - evidence — массив объектов вида {"clause_ref": "...", "quote": "..."},
          а не строка.
        - Технический формат JSON (value / confidence / location) задан
          отдельным контрактом — соблюдай его, но не описывай здесь.
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>
      fields:
        - name: "claim_notification_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие порядка уведомления о страховом случае. Внутреннее агрегатное signal-поле."
          required: true

        - name: "notification_deadline_present"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["yes", "no"]
          label: "Срок уведомления установлен"
          description: "Есть ли в договоре конкретный срок уведомления о страховом случае (число + единица)."
          required: true
          display_in_grid: true
          display_priority: 1

        - name: "notification_deadline"
          type: "string"
          presentation: "fact"
          label: "Срок уведомления"
          description: "Конкретный срок уведомления о страховом случае или отсылка к Правилам."
          required: true
          display_in_grid: true
          display_priority: 2

        - name: "notification_methods"
          type: "string"
          presentation: "fact"
          label: "Способы уведомления"
          description: "Перечисление допустимых способов уведомления (телефон, e-mail, письмо, личный кабинет)."
          required: true
          display_in_grid: true
          display_priority: 3

        - name: "late_notice_consequences"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["specified", "vague", "not_defined"]
          label: "Последствия просрочки"
          description: "Указаны ли последствия несвоевременного уведомления: конкретные (specified), размытые (vague), не упомянуты (not_defined)."
          required: true
          display_in_grid: true
          display_priority: 4

        - name: "notice_clause_clarity"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["clear", "unclear", "not_defined"]
          label: "Ясность порядка уведомления"
          description: "Насколько ясно и полно сформулирован порядок уведомления о страховом случае."
          required: true
          display_in_grid: true
          display_priority: 5

      store_payload: true

  - id: claims_payment_procedure_check
    name: "Страховая выплата: документы, сроки, основание для отказа"
    description: >
      Проверяет порядок страховой выплаты: конкретный срок, перечень
      документов для урегулирования убытка, основания отказа в выплате
      и наличие формулировок, дающих страховщику чрезмерную дискрецию.
      Критически важный check: по ст. 929 ГК РФ (имущественное) и
      ст. 934 ГК РФ (личное) страховщик обязан произвести выплату
      при наступлении страхового случая. Открытый перечень документов
      или размытые основания отказа — частые инструменты затягивания
      выплаты в российской практике.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "страховая выплата"
        - "страховое возмещение"
        - "в течение рабочих дней"
        - "полный комплект документов"
        - "перечень документов"
        - "отказ в выплате"
        - "выплата производится"
        - "урегулирование убытка"
        - "основания для отказа"
        - "по усмотрению страховщика"
        - "иные документы"
        - "дополнительные документы"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)в\\s+течение\\s+\\d+\\s+(?:рабочих\\s+)?дн"
        - "(?i)полного\\s+комплекта\\s+документ"
        - "(?i)отказ\\s+в\\s+выплат"
        - "(?i)по\\s+усмотрению\\s+страховщика"
        - "(?i)иные\\s+документ"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор страхования по Главе 48 ГК РФ.
        Проверяется только один вопрос: порядок страховой выплаты —
        сроки, документы, основания отказа, дискреция страховщика.

        Нормативный ориентир:
        - ст. 929 ГК РФ — обязанность страховщика выплатить возмещение
          (имущественное страхование)
        - ст. 934 ГК РФ — обязанность выплатить страховую сумму
          (личное страхование)
        - ст. 961 ГК РФ — связь срока выплаты с уведомлением

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте
          договора.
        - Не оценивай серьёзность риска.
        - Учитывай российскую практику: порядок выплаты часто
          определяется через отсылку к Правилам страхования; открытый
          перечень документов («и иные документы по требованию
          страховщика») — красный флаг.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Установлен ли конкретный срок страховой выплаты.
        2. Какой срок (в рабочих/календарных днях, от какого события).
        3. Каков статус перечня документов для выплаты (закрытый /
           открытый / не указан).
        4. Указаны ли основания отказа в выплате.
        5. Есть ли формулировки, дающие страховщику широкое усмотрение
           в определении документов или условий выплаты.

        [ПРАВИЛА]
        1. Используй только текст документа. Не подставляй нормы закона
           вместо текста договора.
        2. Если условие не указано прямо и не следует однозначно из
           текста — возвращай "not_defined".
        3. Если порядок определён через отсылку к Правилам страхования —
           отражай: "Согласно Правилам страхования № X".
        4. Не используй "None", "null", пустые строки. Не используй
           "not_found".
        5. "exhaustive" — перечень документов закрыт («исчерпывающий
           перечень», «иные документы не требуются»).
        6. "open_ended" — перечень открыт («и иные документы»,
           «по требованию страховщика», «дополнительные документы
           по усмотрению»).
        7. "insurer_discretion_risk" = "high", если есть формулировки,
           позволяющие страховщику произвольно расширять перечень
           документов или отказывать без конкретных оснований.
        8. "insurer_discretion_risk" = "low", если перечень закрыт,
           основания отказа конкретны и ограничены.
        9. Не смешивай срок выплаты со сроком уведомления о страховом
           случае (это предмет отдельной проверки).
        10. В evidence включай только текст договора.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — порядок выплаты урегулирован, перечень закрыт:
        Фрагмент:
        "Страховая выплата производится в течение 15 (пятнадцати)
        рабочих дней с даты предоставления Страхователем полного
        комплекта документов. Исчерпывающий перечень документов:
        заявление о выплате, акт осмотра, справка из компетентных
        органов, расчёт убытка. Иные документы не требуются.
        Основания отказа в выплате: умысел Страхователя,
        сообщение заведомо ложных сведений."

        Ответ:
        {
          "payment_deadline_present": "yes",
          "payment_deadline": "15 рабочих дней с даты предоставления полного комплекта документов",
          "documents_list_status": "exhaustive",
          "refusal_grounds_present": "yes",
          "insurer_discretion_risk": "low",
          "evidence": [
            {
              "clause_ref": "п. X.Y",
              "quote": "Страховая выплата производится в течение 15 (пятнадцати) рабочих дней с даты предоставления Страхователем полного комплекта документов. Исчерпывающий перечень документов: заявление, акт осмотра, справка, расчёт убытка. Иные документы не требуются."
            }
          ]
        }

        Пример 2 — перечень открытый, дискреция страховщика:
        Фрагмент:
        "Выплата страхового возмещения производится в течение 10 дней
        после получения Страховщиком всех необходимых документов.
        Перечень документов определяется Страховщиком в каждом
        конкретном случае. Страховщик вправе запросить дополнительные
        документы по своему усмотрению."

        Ответ:
        {
          "payment_deadline_present": "yes",
          "payment_deadline": "10 дней после получения всех необходимых документов",
          "documents_list_status": "open_ended",
          "refusal_grounds_present": "no",
          "insurer_discretion_risk": "high",
          "evidence": [
            {
              "clause_ref": "п. X.Y",
              "quote": "Выплата производится в течение 10 дней после получения всех необходимых документов. Перечень документов определяется Страховщиком. Страховщик вправе запросить дополнительные документы по своему усмотрению."
            }
          ]
        }

        Пример 3 — порядок через Правила страхования, основания отказа не раскрыты:
        Фрагмент:
        "Порядок и сроки страховой выплаты, перечень необходимых
        документов и основания для отказа в выплате определяются
        Правилами добровольного страхования имущества № П-12
        от 15.01.2024."

        Ответ:
        {
          "payment_deadline_present": "no",
          "payment_deadline": "Согласно Правилам страхования № П-12 от 15.01.2024",
          "documents_list_status": "unclear",
          "refusal_grounds_present": "no",
          "insurer_discretion_risk": "unclear",
          "evidence": [
            {
              "clause_ref": "п. X.Y",
              "quote": "Порядок и сроки страховой выплаты, перечень необходимых документов и основания для отказа в выплате определяются Правилами добровольного страхования имущества № П-12 от 15.01.2024."
            }
          ]
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о сроке выплаты (число + единица).
        2. Найди прямую цитату о перечне документов для выплаты.
        3. Оцени, является ли перечень закрытым или открытым.
        4. Найди прямую цитату об основаниях отказа (если есть).
        5. Проверь наличие формулировок «по усмотрению»,
           «иные документы», «дополнительные».
        6. Проверь, что все 6 ключей (5 полей + evidence) присутствуют
           в JSON.

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь РОВНО одним JSON-объектом без какого-либо дополнительного
        текста до или после, со всеми 6 ключами (5 полей + evidence):
        {
          "payment_deadline_present": "<yes / no>",
          "payment_deadline": "<срок или not_defined>",
          "documents_list_status": "<exhaustive / open_ended / unclear / not_defined>",
          "refusal_grounds_present": "<yes / no>",
          "insurer_discretion_risk": "<high / medium / low / unclear / not_defined>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 8
      temperature: 0.0
      max_tokens: 700

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "страховая выплата страховое возмещение срок выплаты перечень документов полный комплект документов отказ в выплате основания для отказа урегулирование убытка по усмотрению страховщика"
      boost_keywords:
        - "страховая выплата"
        - "отказ в выплате"
        - "перечень документов"
        - "по усмотрению страховщика"
      preferred_unit_types:
        - obligation
        - general_provision
        - definition
      excluded_unit_types:
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - procedures
        - limitations
      negative_keywords:
        - "премия"
        - "страховая сумма"
      position_bias:
        preferred_range: [0.20, 0.80]
        boost: 0.14
        scope: segment
      context_k: 8
      max_chunks: 12
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
        - "invoice"
      preferred_clause_functions:
        - "obligations"
        - "procedures"
        - "limitations"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 50
      max_snippet_length: 650

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 800

      compact_output: false

      presence_signal:
        field: "claims_payment_procedure_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист по договорной работе. Твоя задача — извлечь
        из текста договора страхования порядок страховой выплаты: срок,
        перечень документов, основания отказа, уровень дискреции
        страховщика. Не анализируй уведомление о страховом случае,
        суброгацию, франшизу — это предмет других проверок.
        Не оценивай риски.
        Анализируй только текст договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. claims_payment_procedure_check_presence:
           Агрегатное signal-поле — наличие порядка страховой выплаты.
           - "present" — если хотя бы одно из содержательных полей
             (payment_deadline_present, documents_list_status,
              refusal_grounds_present, insurer_discretion_risk)
             ≠ "not_defined";
           - "missing" — если все четыре содержательных поля = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - payment_deadline_present = "no";
           - documents_list_status = "not_defined";
           - refusal_grounds_present = "no";
           - insurer_discretion_risk = "not_defined";
           - payment_deadline = "not_defined";
           - не выполняй остальные шаги.

        1. payment_deadline_present — установлен ли конкретный срок
           страховой выплаты:
           "yes" — есть число + единица (15 рабочих дней, 10 дней);
           "no" — срок не установлен или определён через отсылку.

        2. payment_deadline — конкретный срок выплаты текстом.
           Если срок не установлен — "not_defined".
           Если через Правила — "Согласно Правилам страхования № X".

        3. documents_list_status — статус перечня документов для выплаты:
           "exhaustive" — закрытый перечень;
           "open_ended" — открытый перечень;
           "unclear" — перечень упомянут, но статус неясен;
           "not_defined" — перечень не упомянут.

        4. refusal_grounds_present — указаны ли основания отказа:
           "yes" — конкретные основания перечислены;
           "no" — основания не указаны или определены через отсылку.

        5. insurer_discretion_risk — наличие формулировок, дающих
           страховщику широкое усмотрение:
           "high" — открытый перечень, «по усмотрению страховщика»;
           "medium" — отдельные дискреционные формулировки;
           "low" — перечень закрыт, основания отказа конкретны;
           "unclear" — порядок определён через отсылку к Правилам;
           "not_defined" — порядок выплаты не раскрыт.
        </task>

        <context_rules>
        - Перед остальными полями заполни claims_payment_procedure_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все содержательные поля = "not_defined" / "no", payment_deadline = "not_defined".
        - Используй только текст договора из <context>. Не подставляй
          нормы закона вместо текста договора.
        - Не смешивай срок выплаты со сроком уведомления о страховом
          случае — это разные понятия.
        - Не выводи срок из молчания договора: если нет явной
          формулировки — ставь "not_defined".
        - Если порядок определён через отсылку к Правилам страхования —
          отражай отсылку в user-facing полях.
        - «По усмотрению страховщика», «иные документы по требованию» —
          это всегда "open_ended" и "high" дискреция.
        - Не делай предположений сверх того, что прямо следует из текста.
        - Если в разных фрагментах указаны противоречивые данные — верни
          "not_defined" для сигнальных полей, "Не установлено" для текстовых.
        - Не используй пустые строки.
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни срока выплаты, ни перечня документов,
           ни оснований отказа.
           → presence = "missing";
             все содержательные поля = "not_defined" / "no";
             payment_deadline = "not_defined".

        2. Порядок выплаты раскрыт частично.
           Срок указан, но перечень документов не определён.
           → presence = "present";
             payment_deadline_present = "yes";
             documents_list_status = "not_defined";
             refusal_grounds_present = "no";
             insurer_discretion_risk = "medium".

        3. Противоречие между фрагментами.
           В разных частях договора указаны разные сроки выплаты
           или разные перечни документов.
           → presence = "unclear";
             соответствующие сигнальные поля = "not_defined";
             payment_deadline = "Не установлено".

        4. Перечень открытый — дискреция страховщика.
           В договоре прямо указано «и иные документы по требованию
           страховщика», «перечень определяется страховщиком».
           → presence = "present";
             documents_list_status = "open_ended";
             insurer_discretion_risk = "high";
             refusal_grounds_present = "no".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для claims_payment_procedure_check_presence используй только:
          "present", "missing", "unclear".
        - Для payment_deadline_present и refusal_grounds_present допустимо
          только: yes / no.
        - Для documents_list_status допустимо только:
          exhaustive / open_ended / unclear / not_defined.
        - Для insurer_discretion_risk допустимо только:
          high / medium / low / unclear / not_defined.
        - Fallback-значения:
          * payment_deadline: "not_defined";
          * "Согласно Правилам страхования № X" — при отсылке.
        - evidence — массив объектов вида {"clause_ref": "...", "quote": "..."},
          а не строка.
        - Технический формат JSON (value / confidence / location) задан
          отдельным контрактом — соблюдай его, но не описывай здесь.
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>
      fields:
        - name: "claims_payment_procedure_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие порядка страховой выплаты. Внутреннее агрегатное signal-поле."
          required: true

        - name: "payment_deadline_present"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["yes", "no"]
          label: "Срок выплаты установлен"
          description: "Есть ли в договоре конкретный срок страховой выплаты (число + единица)."
          required: true
          display_in_grid: true
          display_priority: 1

        - name: "payment_deadline"
          type: "string"
          presentation: "fact"
          label: "Срок выплаты"
          description: "Конкретный срок страховой выплаты или отсылка к Правилам страхования."
          required: true
          display_in_grid: true
          display_priority: 2

        - name: "documents_list_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["exhaustive", "open_ended", "unclear", "not_defined"]
          label: "Перечень документов"
          description: "Статус перечня документов для выплаты: закрытый (exhaustive), открытый (open_ended), неясен (unclear), не указан (not_defined)."
          required: true
          display_in_grid: true
          display_priority: 3

        - name: "refusal_grounds_present"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["yes", "no"]
          label: "Основания отказа"
          description: "Указаны ли в договоре конкретные основания отказа в страховой выплате."
          required: true
          display_in_grid: true
          display_priority: 4

        - name: "insurer_discretion_risk"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["high", "medium", "low", "unclear", "not_defined"]
          label: "Дискреция страховщика"
          description: "Уровень дискреции страховщика в определении документов и условий выплаты: high (открытый перечень, «по усмотрению»), medium, low (закрытый перечень)."
          required: true
          display_in_grid: true
          display_priority: 5

      store_payload: true

  - id: insured_person_consent_check
    name: "Личное страхование: согласие застрахованного лица и статус выгодоприобретателя"
    description: >
      Проверяет юридическую действительность конструкции личного страхования:
      идентификацию застрахованного лица, наличие его письменного согласия
      на заключение договора (если страхователь — третье лицо), статус
      и порядок назначения выгодоприобретателя.
      Критически важный check: по п. 2 ст. 934 ГК РФ договор личного
      страхования в пользу лица, не являющегося застрахованным, может быть
      заключён только с письменного согласия застрахованного лица. Отсутствие
      согласия — основание для признания договора недействительным по иску
      застрахованного лица или его наследников.
    triggers:
      any:
        - personal_insurance
        - insured_person_differs_from_policyholder
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "согласие застрахованного лица"
        - "застрахованное лицо"
        - "выгодоприобретатель"
        - "письменное согласие"
        - "назначение выгодоприобретателя"
        - "застрахованный"
        - "в пользу застрахованного"
        - "замена выгодоприобретателя"
        - "наследники"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)согласие\\s+застрахованного\\s+лица"
        - "(?i)выгодоприобретател"
        - "(?i)застрахованн(?:ое\\s+лицо|ый)"
        - "(?i)в\\s+пользу\\s+(?:застрахованного|третьего\\s+лица)"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор личного страхования по Главе 48 ГК РФ.
        Проверяется только один вопрос: согласие застрахованного лица
        и статус выгодоприобретателя.

        Нормативный ориентир:
        - ст. 934 ГК РФ — договор личного страхования; п. 2 — согласие
          застрахованного лица при заключении договора не в его пользу
        - ст. 956 ГК РФ — замена выгодоприобретателя

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте
          договора.
        - Не оценивай серьёзность риска.
        - Учитывай российскую практику: если страхователь и
          застрахованное лицо совпадают (страхует сам себя), отдельное
          письменное согласие не требуется — оно презюмируется фактом
          заключения договора.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Идентифицировано ли застрахованное лицо (ФИО, дата
           рождения, иные реквизиты).
        2. Есть ли письменное согласие застрахованного лица на
           заключение договора (или совпадает ли застрахованное лицо
           со страхователем, что снимает требование согласия).
        3. Кто является выгодоприобретателем (конкретное лицо,
           страхователь, наследники, не назначен).

        [ПРАВИЛА]
        1. Используй только текст документа. Не подставляй нормы закона
           вместо текста договора.
        2. Если условие не указано прямо и не следует однозначно из
           текста — возвращай "not_defined".
        3. Если застрахованное лицо совпадает со страхователем и это
           следует из текста — insured_person_consent_status =
           "not_required" (согласие презюмируется).
        4. Не используй "None", "null", пустые строки. Не используй
           "not_found".
        5. "present" — есть явная формулировка о получении согласия
           застрахованного лица («согласие получено», «подпись
           застрахованного лица»).
        6. "unclear" — застрахованное лицо указано, но формулировка
           о согласии размыта или отсутствует, при этом страхователь
           и застрахованное лицо — разные лица.
        7. "named" — выгодоприобретатель конкретно назван (ФИО,
           наименование).
        8. "default_rules" — выгодоприобретатель не назначен явно,
           применяется законный порядок (наследники, страхователь).
        9. В evidence включай только текст договора.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — согласие получено, выгодоприобретатель назван:
        Фрагмент:
        "Застрахованное лицо — Петров Алексей Александрович,
        15.03.1985 г.р. Согласие застрахованного лица на заключение
        настоящего договора получено, о чём свидетельствует его
        подпись в Приложении № 1. Выгодоприобретатель — Петрова
        Мария Ивановна, супруга Застрахованного."

        Ответ:
        {
          "insured_person_identified": "yes",
          "insured_person_consent_status": "present",
          "beneficiary_status": "named",
          "consent_snippet": "Согласие застрахованного лица на заключение настоящего договора получено, о чём свидетельствует его подпись в Приложении № 1",
          "evidence": [
            {
              "clause_ref": "п. X.Y",
              "quote": "Застрахованное лицо — Петров Алексей Александрович, 15.03.1985 г.р. Согласие застрахованного лица на заключение настоящего договора получено. Выгодоприобретатель — Петрова Мария Ивановна, супруга Застрахованного."
            }
          ]
        }

        Пример 2 — застрахованное лицо не идентифицировано:
        Фрагмент:
        "Страхователь заключает договор личного страхования
        на условиях, определённых Правилами страхования."

        Ответ:
        {
          "insured_person_identified": "no",
          "insured_person_consent_status": "not_defined",
          "beneficiary_status": "not_defined",
          "consent_snippet": "Не установлено",
          "evidence": [
            {
              "clause_ref": "п. X.Y",
              "quote": "Страхователь заключает договор личного страхования на условиях, определённых Правилами страхования."
            }
          ]
        }

        Пример 3 — застрахованное лицо названо, согласие отсутствует (красный флаг):
        Фрагмент:
        "Страхователь — ООО «Альфа». Застрахованное лицо — Сидоров
        Иван Петрович, сотрудник Страхователя. Выгодоприобретатель —
        Страхователь. Страхование осуществляется на условиях Правил
        страхования от несчастных случаев № П-05."

        Ответ:
        {
          "insured_person_identified": "yes",
          "insured_person_consent_status": "unclear",
          "beneficiary_status": "named",
          "consent_snippet": "Не установлено — застрахованное лицо указано (Сидоров И.П.), но письменное согласие в тексте договора не зафиксировано",
          "evidence": [
            {
              "clause_ref": "п. X.Y",
              "quote": "Страхователь — ООО «Альфа». Застрахованное лицо — Сидоров Иван Петрович, сотрудник Страхователя. Выгодоприобретатель — Страхователь."
            }
          ]
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о застрахованном лице (ФИО, реквизиты).
        2. Найди прямую цитату о согласии застрахованного лица.
        3. Проверь, совпадает ли застрахованное лицо со страхователем —
           если да, согласие "not_required".
        4. Найди прямую цитату о выгодоприобретателе.
        5. Проверь, что все 5 ключей (4 поля + evidence) присутствуют
           в JSON.

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь РОВНО одним JSON-объектом без какого-либо дополнительного
        текста до или после, со всеми 5 ключами (4 поля + evidence):
        {
          "insured_person_identified": "<yes / no>",
          "insured_person_consent_status": "<present / not_required / unclear / not_defined>",
          "beneficiary_status": "<named / default_rules / not_defined>",
          "consent_snippet": "<цитата или fallback>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 7
      temperature: 0.0
      max_tokens: 600

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "застрахованное лицо согласие застрахованного лица выгодоприобретатель личное страхование в пользу застрахованного назначение выгодоприобретателя"
      boost_keywords:
        - "согласие застрахованного"
        - "выгодоприобретатель"
        - "застрахованное лицо"
      preferred_unit_types:
        - obligation
        - general_provision
        - definition
        - structural_anchor
      excluded_unit_types:
        - technical_fragment
      preferred_clause_functions:
        - definitions
        - obligations
        - representations
        - rights
      negative_keywords:
        - "премия"
        - "страховая сумма"
      position_bias:
        preferred_range: [0.0, 0.50]
        boost: 0.12
        scope: segment
      context_k: 7
      max_chunks: 10
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
        - "invoice"
      preferred_clause_functions:
        - "definitions"
        - "obligations"
        - "representations"
        - "rights"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 550

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 700

      compact_output: false

      presence_signal:
        field: "insured_person_consent_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист по договорной работе. Твоя задача — извлечь
        из текста договора личного страхования сведения о застрахованном
        лице, его согласии на заключение договора и статусе
        выгодоприобретателя. Не анализируй порядок выплаты, страховой
        случай, исключения — это предмет других проверок.
        Не оценивай риски.
        Анализируй только текст договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. insured_person_consent_check_presence:
           Агрегатное signal-поле — наличие сведений о застрахованном
           лице, его согласии и выгодоприобретателе.
           - "present" — если хотя бы одно из содержательных полей
             (insured_person_identified, insured_person_consent_status,
              beneficiary_status) ≠ "not_defined";
           - "missing" — если все три содержательных поля = "not_defined"
             (или insured_person_identified = "no");
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - insured_person_identified = "no";
           - insured_person_consent_status = "not_defined";
           - beneficiary_status = "not_defined";
           - consent_snippet = "Не установлено";
           - не выполняй остальные шаги.

        1. insured_person_identified — идентифицировано ли
           застрахованное лицо в тексте договора:
           "yes" — есть ФИО, дата рождения или иные однозначные
           реквизиты;
           "no" — застрахованное лицо не указано или определено
           через отсылку к неопределённому списку.

        2. insured_person_consent_status — статус согласия
           застрахованного лица на заключение договора:
           "present" — есть явная формулировка о получении
           письменного согласия;
           "not_required" — застрахованное лицо совпадает со
           страхователем, согласие презюмируется;
           "unclear" — застрахованное лицо указано как третье
           лицо, но формулировка о согласии размыта или
           отсутствует;
           "not_defined" — застрахованное лицо не идентифицировано.

        3. beneficiary_status — статус выгодоприобретателя:
           "named" — выгодоприобретатель конкретно назван;
           "default_rules" — выгодоприобретатель не назначен явно,
           применяется законный порядок (наследники, страхователь);
           "not_defined" — вопрос выгодоприобретателя не раскрыт.

        4. consent_snippet — краткая цитата из договора о согласии
           застрахованного лица и/или выгодоприобретателе (до 200
           символов). Если данные отсутствуют — "Не установлено".
        </task>

        <context_rules>
        - Перед остальными полями заполни insured_person_consent_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — insured_person_identified = "no", insured_person_consent_status = "not_defined", beneficiary_status = "not_defined", consent_snippet = "Не установлено".
        - Используй только текст договора из <context>. Не подставляй
          нормы закона вместо текста договора.
        - Не выводи согласие из молчания договора: если нет явной
          формулировки и застрахованное лицо — третье лицо, ставь
          "unclear".
        - Если страхователь и застрахованное лицо совпадают — ставь
          "not_required", а не "present".
        - Не делай предположений сверх того, что прямо следует из
          текста.
        - Если в разных фрагментах указаны противоречивые данные — верни
          "not_defined" для сигнальных полей, "Не установлено" для
          текстового.
        - Не используй пустые строки.
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни застрахованного лица, ни выгодоприобретателя.
           → presence = "missing";
             insured_person_identified = "no";
             insured_person_consent_status = "not_defined";
             beneficiary_status = "not_defined";
             consent_snippet = "Не установлено".

        2. Застрахованное лицо совпадает со страхователем.
           В договоре прямо указано, что страхует сам себя.
           → presence = "present";
             insured_person_identified = "yes";
             insured_person_consent_status = "not_required";
             beneficiary_status = "default_rules"
               (если не назван явно);
             consent_snippet содержит дословную формулировку.

        3. Застрахованное лицо — третье лицо, согласие не зафиксировано.
           В договоре указано застрахованное лицо, но нет ни прямого
           согласия, ни подписи застрахованного.
           → presence = "present";
             insured_person_identified = "yes";
             insured_person_consent_status = "unclear";
             consent_snippet содержит формулировку об отсутствии
               зафиксированного согласия.

        4. Застрахованное лицо идентифицировано, согласие получено,
           выгодоприобретатель назван.
           → presence = "present";
             insured_person_identified = "yes";
             insured_person_consent_status = "present";
             beneficiary_status = "named";
             consent_snippet содержит дословную формулировку.
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для insured_person_consent_check_presence используй только:
          "present", "missing", "unclear".
        - Для insured_person_identified допустимо только: yes / no.
        - Для insured_person_consent_status допустимо только:
          present / not_required / unclear / not_defined.
        - Для beneficiary_status допустимо только:
          named / default_rules / not_defined.
        - Fallback для consent_snippet: "Не установлено".
        - evidence — массив объектов вида {"clause_ref": "...", "quote": "..."},
          а не строка.
        - Технический формат JSON (value / confidence / location) задан
          отдельным контрактом — соблюдай его, но не описывай здесь.
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>
      fields:
        - name: "insured_person_consent_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие сведений о застрахованном лице, его согласии и выгодоприобретателе. Внутреннее агрегатное signal-поле."
          required: true

        - name: "insured_person_identified"
