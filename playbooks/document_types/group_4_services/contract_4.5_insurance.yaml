        Не оценивай риски.
        Анализируй только текст договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. deductible_check_presence:
           Агрегатное signal-поле — наличие условий о франшизе.
           - "present" — если хотя бы одно из содержательных полей
             (deductible_present, deductible_type,
              deductible_application) ≠ "not_defined";
           - "missing" — если все три содержательных поля = "not_defined"
             или deductible_present = "no";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - deductible_present = "no";
           - deductible_type = "not_defined";
           - deductible_amount = "not_defined";
           - deductible_application = "not_defined";
           - deductible_summary = "Не установлена";
           - не выполняй остальные шаги.

        1. deductible_present — предусмотрена ли франшиза:
           "yes" — франшиза прямо установлена;
           "no" — франшиза отсутствует или прямо исключена.

        2. deductible_type — тип франшизы:
           "unconditional" — безусловная (вычитается из каждой выплаты);
           "conditional" — условная / интегральная (порог);
           "dynamic" — динамическая (зависит от числа убытков);
           "not_defined" — тип не определён или франшиза отсутствует.

        3. deductible_amount — размер франшизы текстом.
           Если франшиза отсутствует — "not_defined".

        4. deductible_application — порядок применения:
           "per_claim" — к каждому отдельному убытку;
           "per_period" — совокупно за период страхования;
           "per_event" — к каждому страховому событию;
           "not_defined" — порядок не указан.

        5. deductible_summary — краткое описание франшизы.
           Если франшиза отсутствует — "Не установлена".
        </task>

        <context_rules>
        - Перед остальными полями заполни deductible_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — deductible_present = "no", остальные поля = "not_defined", deductible_summary = "Не установлена".
        - Используй только текст договора из <context>. Не подставляй
          нормы закона вместо текста договора.
        - Различай безусловную (вычет из каждой выплаты) и условную
          (порог покрытия) франшизу — это юридически значимое различие.
        - Не делай предположений сверх того, что прямо следует из текста.
        - Если в разных фрагментах указаны противоречивые данные — верни
          "not_defined" для сигнальных полей.
        - Не используй пустые строки.
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни упоминания франшизы, ни ссылок на вычеты.
           → presence = "missing";
             deductible_present = "no";
             deductible_type = "not_defined";
             deductible_amount = "not_defined";
             deductible_application = "not_defined";
             deductible_summary = "Не установлена".

        2. Прямое указание об отсутствии франшизы.
           В договоре прямо указано, что возмещение выплачивается в полном
           объёме без удержаний.
           → presence = "present";
             deductible_present = "no";
             deductible_summary содержит дословную формулировку.

        3. Противоречие между фрагментами.
           В разных частях договора указаны разные размеры или типы
           франшизы.
           → presence = "unclear";
             deductible_present = "yes";
             deductible_type = "not_defined";
             deductible_amount = "Не установлено";
             deductible_application = "not_defined".

        4. Безусловная франшиза в процентах.
           В договоре прямо установлена безусловная франшиза в процентах
           от страховой суммы, применяемая к каждому убытку.
           → presence = "present";
             deductible_present = "yes";
             deductible_type = "unconditional";
             deductible_amount содержит дословную формулировку (например,
               "10% от страховой суммы");
             deductible_application = "per_claim".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для deductible_check_presence используй только:
          "present", "missing", "unclear".
        - Для deductible_present допустимо только: yes / no.
        - Для deductible_type допустимо только:
          unconditional / conditional / dynamic / not_defined.
        - Для deductible_application допустимо только:
          per_claim / per_period / per_event / not_defined.
        - Fallback для deductible_amount: "not_defined".
        - Fallback для deductible_summary: "Не установлена".
        - evidence — массив объектов вида {"clause_ref": "...", "quote": "..."}.
        - Технический формат JSON (value / confidence / location) задан
          отдельным контрактом — соблюдай его, но не описывай здесь.
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>
      fields:
        - name: "deductible_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие условий о франшизе. Внутреннее агрегатное signal-поле."
          required: true

        - name: "deductible_present"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["yes", "no"]
          label: "Франшиза"
          description: "Предусмотрена ли франшиза в договоре страхования."
          required: true
          display_in_grid: true
          display_priority: 1

        - name: "deductible_type"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["unconditional", "conditional", "dynamic", "not_defined"]
          label: "Тип франшизы"
          description: "Тип франшизы: безусловная (вычет из каждой выплаты), условная (порог), динамическая."
          required: true
          display_in_grid: true
          display_priority: 2

        - name: "deductible_amount"
          type: "string"
          presentation: "fact"
          label: "Размер франшизы"
          description: "Размер франшизы в рублях или процентах от страховой суммы/убытка."
          required: true
          display_in_grid: true
          display_priority: 3

        - name: "deductible_application"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["per_claim", "per_period", "per_event", "not_defined"]
          label: "Применение франшизы"
          description: "Порядок применения: на каждый убыток (per_claim), за период (per_period), на событие (per_event)."
          required: true
          display_in_grid: true
          display_priority: 4

        - name: "deductible_summary"
          type: "string"
          presentation: "fact"
          label: "Описание франшизы"
          description: "Краткое описание условий франшизы для DD Grid."
          required: true
          display_in_grid: true
          display_priority: 5

      store_payload: true

  - id: subrogation_check
    name: "Суброгация: право требования и отказ от суброгации (ст. 965 ГК РФ)"
    description: >
      Проверяет условия перехода к страховщику права требования к виновному
      лицу после выплаты страхового возмещения (суброгация, ст. 965 ГК РФ).
      Анализирует наличие и объём отказа от суброгации (полный или частичный,
      в пользу аффилированных лиц, контрагентов), а также обязанность
      страхователя содействовать реализации суброгационного права.
      Критически важно: отказ от суброгации в пользу контрагентов клиента
      может существенно ограничить регрессные риски, но повышает стоимость
      полиса. Неурегулированная суброгация создаёт риск регрессного иска
      к страхователю или его аффилированным лицам.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "суброгация"
        - "право требования"
        - "переход права"
        - "отказ от суброгации"
        - "регресс"
        - "виновное лицо"
        - "ответственное лицо"
        - "содействовать"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)суброгац[ияи]"
        - "(?i)переход.{0,20}прав.{0,20}требовани"
        - "(?i)отказ.{0,20}от\\s+суброгац"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор страхования по Главе 48 ГК РФ.
        Проверяется только один вопрос: условия суброгации (перехода к
        страховщику права требования к виновному лицу).

        Нормативный ориентир:
        - ст. 965 ГК РФ — переход к страховщику права требования,
          которое страхователь имеет к лицу, ответственному за убытки

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте
          договора.
        - Не оценивай серьёзность риска.
        - Учитывай российскую практику:
          * По закону (п. 1 ст. 965 ГК РФ) суброгация возникает
            автоматически в пределах выплаченного возмещения.
          * Договором может быть предусмотрен полный или частичный
            отказ от суброгации (waiver of subrogation).
          * Отказ от суброгации в пользу аффилированных лиц
            страхователя — стандартная практика в корпоративном
            страховании.
          * Обязанность страхователя передать документы и содействовать
            суброгации — типичное условие.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Есть ли условие о суброгации (переходе права требования).
        2. Предусмотрен ли отказ от суброгации (полный или частичный).
        3. В чью пользу установлен отказ (аффилированные лица,
           контрагенты, все третьи лица).
        4. Обязан ли страхователь содействовать реализации
           суброгационного права страховщика.
        5. Цитату из договора, подтверждающую выводы.

        [ПРАВИЛА]
        1. Используй только текст документа. Не подставляй нормы закона
           вместо текста договора.
        2. Если условие не указано прямо и не следует однозначно из
           текста — возвращай "not_defined".
        3. Не используй "None", "null", пустые строки. Не используй
           "not_found".
        4. "full" — полный отказ от суброгации (страховщик не имеет
           права требования ни к каким третьим лицам).
        5. "partial" — частичный отказ (например, только в пользу
           аффилированных лиц страхователя или конкретных контрагентов).
        6. "none" — отказ от суброгации не предусмотрен (действует
           законный режим ст. 965 ГК РФ).
        7. В evidence включай только текст договора.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — частичный отказ от суброгации:
        Фрагмент:
        "К Страховщику, выплатившему страховое возмещение, переходит
        право требования к лицу, ответственному за убытки, в пределах
        выплаченной суммы. Страховщик отказывается от права суброгации
        в отношении аффилированных лиц Страхователя, а также в отношении
        подрядчиков и субподрядчиков, привлечённых Страхователем для
        выполнения работ на застрахованном объекте. Страхователь обязан
        передать Страховщику все документы, необходимые для реализации
        суброгационного права."

        Ответ:
        {
          "subrogation_clause_present": "yes",
          "subrogation_waiver": "partial",
          "subrogation_waiver_scope": "В пользу аффилированных лиц Страхователя, подрядчиков и субподрядчиков",
          "subrogation_cooperation_duty": "present",
          "subrogation_summary": "Суброгация в пределах выплаты. Отказ в пользу аффилированных лиц и подрядчиков. Обязанность содействовать.",
          "evidence": [
            {
              "clause_ref": "п. X.Y",
              "quote": "К Страховщику переходит право требования к лицу, ответственному за убытки. Страховщик отказывается от права суброгации в отношении аффилированных лиц Страхователя, подрядчиков и субподрядчиков. Страхователь обязан передать все документы."
            }
          ]
        }

        Пример 2 — суброгация по закону, отказ не предусмотрен:
        Фрагмент:
        "Страховщик после выплаты страхового возмещения приобретает
        право требования к виновному лицу в размере выплаченной суммы
        в соответствии со ст. 965 ГК РФ."

        Ответ:
        {
          "subrogation_clause_present": "yes",
          "subrogation_waiver": "none",
          "subrogation_waiver_scope": "not_defined",
          "subrogation_cooperation_duty": "not_defined",
          "subrogation_summary": "Суброгация по закону (ст. 965 ГК РФ) в полном объёме. Отказ от суброгации не предусмотрен.",
          "evidence": [
            {
              "clause_ref": "п. X.Y",
              "quote": "Страховщик после выплаты страхового возмещения приобретает право требования к виновному лицу в размере выплаченной суммы в соответствии со ст. 965 ГК РФ."
            }
          ]
        }

        Пример 3 — суброгация не упомянута:
        Фрагмент:
        "Договор страхования заключается на условиях, согласованных
        Сторонами в настоящем полисе."

        Ответ:
        {
          "subrogation_clause_present": "no",
          "subrogation_waiver": "not_defined",
          "subrogation_waiver_scope": "not_defined",
          "subrogation_cooperation_duty": "not_defined",
          "subrogation_summary": "Не установлено — условия суброгации в тексте договора не раскрыты (применяется ст. 965 ГК РФ)",
          "evidence": [
            {
              "clause_ref": "п. X.Y",
              "quote": "Договор страхования заключается на условиях, согласованных Сторонами в настоящем полисе."
            }
          ]
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о суброгации / переходе права требования.
        2. Найди прямую цитату об отказе от суброгации (если есть).
        3. Найди прямую цитату об обязанности содействовать (если есть).
        4. Проверь, что все 6 ключей (5 полей + evidence) присутствуют
           в JSON.

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь РОВНО одним JSON-объектом без какого-либо дополнительного
        текста до или после, со всеми 6 ключами (5 полей + evidence):
        {
          "subrogation_clause_present": "<yes / no>",
          "subrogation_waiver": "<full / partial / none / not_defined>",
          "subrogation_waiver_scope": "<описание или not_defined>",
          "subrogation_cooperation_duty": "<present / absent / not_defined>",
          "subrogation_summary": "<краткое описание или fallback>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 7
      temperature: 0.0
      max_tokens: 700

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "суброгация право требования переход права отказ от суброгации регресс виновное лицо ответственное лицо содействовать"
      boost_keywords:
        - "суброгация"
        - "отказ от суброгации"
        - "право требования"
      preferred_unit_types:
        - obligation
        - general_provision
        - definition
      excluded_unit_types:
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - limitations
        - remedies
      negative_keywords:
        - "оглавление"
        - "индекс"
      position_bias:
        preferred_range: [0.20, 0.85]
        boost: 0.12
        scope: segment
      context_k: 7
      max_chunks: 10
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
        - "invoice"
      preferred_clause_functions:
        - "obligations"
        - "limitations"
        - "remedies"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 30
      max_snippet_length: 500

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 800

      compact_output: false

      presence_signal:
        field: "subrogation_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист по договорной работе. Твоя задача — извлечь
        из текста договора страхования условия суброгации: переход права
        требования, отказ от суброгации, обязанность содействовать.
        Не анализируй порядок выплаты, франшизу, исключения — это предмет
        других проверок.
        Не оценивай риски.
        Анализируй только текст договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. subrogation_check_presence:
           Агрегатное signal-поле — наличие условий о суброгации.
           - "present" — если хотя бы одно из содержательных полей
             (subrogation_clause_present, subrogation_waiver,
              subrogation_cooperation_duty) ≠ "not_defined";
           - "missing" — если все три содержательных поля = "not_defined"
             (или subrogation_clause_present = "no");
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - subrogation_clause_present = "no";
           - subrogation_waiver = "not_defined";
           - subrogation_waiver_scope = "not_defined";
           - subrogation_cooperation_duty = "not_defined";
           - subrogation_summary = "Не установлено";
           - не выполняй остальные шаги.

        1. subrogation_clause_present — есть ли в договоре условие
           о суброгации:
           "yes" — условие прямо прописано;
           "no" — суброгация не упомянута (применяется ст. 965 ГК РФ).

        2. subrogation_waiver — наличие и объём отказа от суброгации:
           "full" — полный отказ;
           "partial" — частичный отказ (в пользу аффилированных лиц,
           контрагентов, подрядчиков);
           "none" — отказ не предусмотрен, суброгация действует в
           полном объёме;
           "not_defined" — суброгация не упомянута.

        3. subrogation_waiver_scope — в чью пользу установлен отказ
           от суброгации.
           Если отказ не предусмотрен — "not_defined".

        4. subrogation_cooperation_duty — обязанность страхователя
           содействовать реализации суброгационного права:
           "present" — обязанность прямо установлена;
           "absent" — обязанность не упомянута;
           "not_defined" — суброгация не раскрыта.

        5. subrogation_summary — краткое описание условий суброгации.
           Если не раскрыто — "Не установлено".
        </task>

        <context_rules>
        - Перед остальными полями заполни subrogation_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — subrogation_clause_present = "no", остальные поля = "not_defined", subrogation_summary = "Не установлено".
        - Используй только текст договора из <context>. Не подставляй
          нормы закона вместо текста договора.
        - Если суброгация не упомянута — это не означает её отсутствие:
          по ст. 965 ГК РФ она возникает автоматически. Отражай это
          в summary.
        - Не делай предположений сверх того, что прямо следует из текста.
        - Если в разных фрагментах указаны противоречивые данные — верни
          "not_defined" для сигнальных полей.
        - Не используй пустые строки.
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни суброгации, ни упоминания перехода прав.
           → presence = "missing";
             subrogation_clause_present = "no";
             subrogation_waiver = "not_defined";
             subrogation_waiver_scope = "not_defined";
             subrogation_cooperation_duty = "not_defined";
             subrogation_summary = "Не установлено (применяется ст. 965 ГК РФ)".

        2. Суброгация по закону, без отказа.
           В договоре указано, что страховщик приобретает право
           требования в соответствии со ст. 965 ГК РФ.
           → presence = "present";
             subrogation_clause_present = "yes";
             subrogation_waiver = "none";
             subrogation_cooperation_duty = "not_defined";
             subrogation_summary содержит дословную формулировку.

        3. Противоречие между фрагментами.
           В разных частях договора указаны разные условия суброгации
           или разные объёмы отказа.
           → presence = "unclear";
             subrogation_clause_present = "yes" (если так следует из текста);
             subrogation_waiver = "not_defined";
             subrogation_summary = "Не установлено".

        4. Частичный отказ от суброгации.
           В договоре прямо установлен отказ в пользу конкретной
           категории лиц (например, аффилированных лиц страхователя
           или подрядчиков).
           → presence = "present";
             subrogation_clause_present = "yes";
             subrogation_waiver = "partial";
             subrogation_waiver_scope содержит дословную формулировку;
             subrogation_cooperation_duty = "present" (если обязанность
               содействовать прямо указана).
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для subrogation_check_presence используй только:
          "present", "missing", "unclear".
        - Для subrogation_clause_present допустимо только: yes / no.
        - Для subrogation_waiver допустимо только:
          full / partial / none / not_defined.
        - Для subrogation_cooperation_duty допустимо только:
          present / absent / not_defined.
        - Fallback для subrogation_waiver_scope: "not_defined".
        - Fallback для subrogation_summary: "Не установлено".
        - evidence — массив объектов вида {"clause_ref": "...", "quote": "..."}.
        - Технический формат JSON (value / confidence / location) задан
          отдельным контрактом — соблюдай его, но не описывай здесь.
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>
      fields:
        - name: "subrogation_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие условий о суброгации. Внутреннее агрегатное signal-поле."
          required: true

        - name: "subrogation_clause_present"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["yes", "no"]
          label: "Суброгация"
          description: "Есть ли в договоре условие о переходе к страховщику права требования к виновному лицу."
          required: true
          display_in_grid: true
          display_priority: 1

        - name: "subrogation_waiver"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["full", "partial", "none", "not_defined"]
          label: "Отказ от суброгации"
          description: "Объём отказа: полный (full), частичный (partial), отсутствует (none), не раскрыт (not_defined)."
          required: true
          display_in_grid: true
          display_priority: 2

        - name: "subrogation_waiver_scope"
          type: "string"
          presentation: "fact"
          label: "Объём отказа"
          description: "В чью пользу установлен отказ от суброгации (аффилированные лица, контрагенты, подрядчики)."
          required: true
          display_in_grid: true
          display_priority: 3

        - name: "subrogation_cooperation_duty"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["present", "absent", "not_defined"]
          label: "Содействие суброгации"
          description: "Обязанность страхователя передать документы и содействовать реализации суброгационного права."
          required: true
          display_in_grid: true
          display_priority: 4

        - name: "subrogation_summary"
          type: "string"
          presentation: "fact"
          label: "Описание суброгации"
          description: "Краткое описание условий суброгации и отказа от неё для DD Grid."
          required: true
          display_in_grid: true
          display_priority: 5

      store_payload: true

  - id: aggregate_limit_check
    name: "Агрегатный лимит ответственности страховщика"
    description: >
      Проверяет наличие и размер агрегатного (совокупного) лимита
      ответственности страховщика за весь период страхования.
      Агрегатный лимит ограничивает общую сумму ВСЕХ выплат по договору,
      в отличие от страховой суммы, которая ограничивает выплату по
      ОДНОМУ страховому случаю.
      Критически важно: если страховая сумма 100 млн руб. на случай,
      а агрегатный лимит тоже 100 млн руб., то при двух убытках по 60 млн
      клиент получит только 100 млн суммарно, а не 120 млн. Это один из
      самых частых «сюрпризов» в корпоративном страховании.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "агрегатный лимит"
        - "совокупный лимит"
        - "общий лимит"
        - "максимальная сумма выплат"
        - "предел ответственности"
        - "лимит за период"
        - "aggregate limit"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)агрегатн(?:ый|ого)\\s+лимит"
        - "(?i)совокупн(?:ый|ого)\\s+лимит"
        - "(?i)общ(?:ий|его)\\s+лимит"
        - "(?i)максимальн(?:ая|ой)\\s+сумм.{0,20}выплат"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор страхования по Главе 48 ГК РФ.
        Проверяется только один вопрос: наличие и размер агрегатного
        (совокупного) лимита ответственности страховщика.

        Нормативный ориентир:
        - ст. 947 ГК РФ — страховая сумма и пределы ответственности

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте
          договора.
        - Не оценивай серьёзность риска.
        - Учитывай российскую практику:
          * Агрегатный лимит — это потолок ВСЕХ выплат за период.
          * Если агрегатный лимит равен страховой сумме на один случай,
            это фактически означает, что второй убыток не покрывается.
          * В сложных программах могут быть сублимиты (по типам рисков,
            по территориям) в рамках агрегатного лимита.
          * Агрегатный лимит может «сбрасываться» (восстанавливаться)
            ежегодно или оставаться фиксированным на весь срок полиса.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Установлен ли агрегатный (совокупный) лимит ответственности.
        2. Размер агрегатного лимита.
        3. Соотношение агрегатного лимита со страховой суммой на один
           случай (равен, ниже, выше).
        4. Восстанавливается ли агрегатный лимит (ежегодно, после
           каждого убытка, не восстанавливается).
        5. Цитату из договора, подтверждающую выводы.

        [ПРАВИЛА]
        1. Используй только текст документа. Не подставляй нормы закона
           вместо текста договора.
        2. Если условие не указано прямо и не следует однозначно из
           текста — возвращай "not_defined".
        3. Не используй "None", "null", пустые строки. Не используй
           "not_found".
        4. "same" — агрегатный лимит равен страховой сумме на один
           случай (фактически один убыток исчерпывает покрытие).
        5. "lower" — агрегатный лимит ниже страховой суммы (нестандартная
           ситуация, требует особого внимания).
        6. "higher" — агрегатный лимит выше страховой суммы на один
           случай (позволяет покрыть несколько убытков).
        7. "annual" — лимит восстанавливается ежегодно.
        8. "per_policy" — лимит фиксирован на весь срок полиса и не
           восстанавливается.
        9. В evidence включай только текст договора.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — агрегатный лимит выше страховой суммы:
        Фрагмент:
        "Страховая сумма по каждому страховому случаю составляет
        50 000 000 рублей. Агрегатный (совокупный) лимит ответственности
        Страховщика за весь период действия договора составляет
        150 000 000 рублей. Агрегатный лимит не восстанавливается после
        осуществления страховых выплат."

        Ответ:
        {
          "aggregate_limit_present": "yes",
          "aggregate_limit_amount": "150 000 000 рублей за весь период",
          "aggregate_limit_vs_sum_insured": "higher",
          "aggregate_limit_reset": "per_policy",
          "aggregate_limit_summary": "Агрегатный лимит 150 млн руб. (страховая сумма 50 млн на случай). Не восстанавливается.",
          "evidence": [
            {
              "clause_ref": "п. X.Y",
              "quote": "Страховая сумма по каждому страховому случаю составляет 50 000 000 рублей. Агрегатный лимит ответственности Страховщика за весь период действия договора составляет 150 000 000 рублей. Агрегатный лимит не восстанавливается."
            }
          ]
        }

        Пример 2 — агрегатный лимит равен страховой сумме (риск):
        Фрагмент:
        "Страховая сумма — 100 000 000 рублей. Общая сумма всех
        страховых выплат по настоящему договору не может превышать
        страховую сумму."

        Ответ:
        {
          "aggregate_limit_present": "yes",
          "aggregate_limit_amount": "100 000 000 рублей (равен страховой сумме)",
          "aggregate_limit_vs_sum_insured": "same",
          "aggregate_limit_reset": "per_policy",
          "aggregate_limit_summary": "Агрегатный лимит 100 млн руб. = страховой сумме. Фактически покрывается только один убыток.",
          "evidence": [
            {
              "clause_ref": "п. X.Y",
              "quote": "Страховая сумма — 100 000 000 рублей. Общая сумма всех страховых выплат по настоящему договору не может превышать страховую сумму."
            }
          ]
        }

        Пример 3 — агрегатный лимит не установлен:
        Фрагмент:
        "Страховая сумма по каждому страховому случаю составляет
        30 000 000 рублей."

        Ответ:
        {
          "aggregate_limit_present": "no",
          "aggregate_limit_amount": "not_defined",
          "aggregate_limit_vs_sum_insured": "not_defined",
          "aggregate_limit_reset": "not_defined",
          "aggregate_limit_summary": "Не установлено — агрегатный лимит не указан (каждый случай покрывается в пределах страховой суммы)",
          "evidence": [
            {
              "clause_ref": "п. X.Y",
              "quote": "Страховая сумма по каждому страховому случаю составляет 30 000 000 рублей."
            }
          ]
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату об агрегатном / совокупном / общем лимите.
        2. Сравни агрегатный лимит со страховой суммой на один случай.
        3. Проверь, восстанавливается ли лимит.
        4. Проверь, что все 6 ключей (5 полей + evidence) присутствуют
           в JSON.

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь РОВНО одним JSON-объектом без какого-либо дополнительного
        текста до или после, со всеми 6 ключами (5 полей + evidence):
        {
          "aggregate_limit_present": "<yes / no>",
          "aggregate_limit_amount": "<сумма или not_defined>",
          "aggregate_limit_vs_sum_insured": "<same / lower / higher / not_defined>",
          "aggregate_limit_reset": "<annual / per_policy / not_defined>",
          "aggregate_limit_summary": "<краткое описание или fallback>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 7
      temperature: 0.0
      max_tokens: 650

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "агрегатный лимит совокупный лимит общий лимит ответственности максимальная сумма выплат предел ответственности за период лимит за весь срок"
      boost_keywords:
        - "агрегатный лимит"
        - "совокупный лимит"
        - "общий лимит"
        - "максимальная сумма выплат"
      preferred_unit_types:
        - obligation
        - general_provision
        - definition
        - structural_anchor
      excluded_unit_types:
        - technical_fragment
      preferred_clause_functions:
        - definitions
        - obligations
        - limitations
      negative_keywords:
        - "оглавление"
        - "индекс"
      position_bias:
        preferred_range: [0.10, 0.70]
        boost: 0.12
        scope: segment
      context_k: 7
      max_chunks: 10
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
        - "invoice"
      preferred_clause_functions:
        - "definitions"
        - "obligations"
        - "limitations"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 30
      max_snippet_length: 500

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 750

      compact_output: false

      presence_signal:
        field: "aggregate_limit_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист по договорной работе. Твоя задача — извлечь
        из текста договора страхования сведения об агрегатном (совокупном)
        лимите ответственности страховщика за весь период действия договора.
        Не путай агрегатный лимит со страховой суммой на один случай —
        это разные понятия.
        Не оценивай риски.
        Анализируй только текст договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. aggregate_limit_check_presence:
           Агрегатное signal-поле — наличие условий об агрегатном лимите.
           - "present" — если хотя бы одно из содержательных полей
             (aggregate_limit_present, aggregate_limit_vs_sum_insured,
              aggregate_limit_reset) ≠ "not_defined";
           - "missing" — если все три содержательных поля = "not_defined"
             или aggregate_limit_present = "no";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - aggregate_limit_present = "no";
           - aggregate_limit_amount = "not_defined";
           - aggregate_limit_vs_sum_insured = "not_defined";
           - aggregate_limit_reset = "not_defined";
           - aggregate_limit_summary = "Не установлен";
           - не выполняй остальные шаги.

        1. aggregate_limit_present — установлен ли агрегатный лимит:
           "yes" — совокупный лимит прямо указан;
           "no" — агрегатный лимит не установлен (каждый случай
           покрывается в пределах страховой суммы).

        2. aggregate_limit_amount — размер агрегатного лимита текстом.
           Если не установлен — "not_defined".

        3. aggregate_limit_vs_sum_insured — соотношение агрегатного
           лимита со страховой суммой на один случай:
           "same" — равен страховой сумме;
           "lower" — ниже страховой суммы (нестандартная ситуация);
           "higher" — выше страховой суммы (позволяет покрыть
           несколько убытков);
           "not_defined" — соотношение неясно.

        4. aggregate_limit_reset — восстановление агрегатного лимита:
           "annual" — лимит восстанавливается ежегодно;
           "per_policy" — лимит фиксирован на весь срок полиса и
           не восстанавливается;
           "not_defined" — условие не указано.

        5. aggregate_limit_summary — краткое описание агрегатного лимита.
           Если не установлен — "Не установлен".
        </task>

        <context_rules>
        - Перед остальными полями заполни aggregate_limit_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — aggregate_limit_present = "no", остальные поля = "not_defined", aggregate_limit_summary = "Не установлен".
        - Используй только текст договора из <context>. Не подставляй
          нормы закона вместо текста договора.
        - Не путай агрегатный лимит (совокупный за период) со страховой
          суммой (на один случай).
        - Если в договоре указана только страховая сумма без упоминания
          агрегатного лимита — ставь "no".
        - Не делай предположений сверх того, что прямо следует из текста.
        - Если в разных фрагментах указаны противоречивые данные — верни
          "not_defined" для сигнальных полей.
        - Не используй пустые строки.
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни агрегатного лимита, ни совокупных ограничений.
           → presence = "missing";
             aggregate_limit_present = "no";
             aggregate_limit_amount = "not_defined";
             aggregate_limit_vs_sum_insured = "not_defined";
             aggregate_limit_reset = "not_defined";
             aggregate_limit_summary = "Не установлен".

        2. Указана только страховая сумма.
           В договоре фигурирует только страховая сумма на один случай,
           без упоминания совокупного лимита.
           → presence = "missing";
             aggregate_limit_present = "no";
             aggregate_limit_summary содержит пояснение, что агрегатный
               лимит не установлен.

        3. Противоречие между фрагментами.
           В разных частях договора указаны разные размеры агрегатного
           лимита или разные условия его восстановления.
           → presence = "unclear";
             aggregate_limit_present = "yes";
             aggregate_limit_amount = "Не установлено";
             aggregate_limit_vs_sum_insured = "not_defined";
             aggregate_limit_reset = "not_defined".

        4. Агрегатный лимит равен страховой сумме (риск).
           В договоре прямо указано, что общая сумма выплат не может
           превышать страховую сумму.
           → presence = "present";
             aggregate_limit_present = "yes";
             aggregate_limit_vs_sum_insured = "same";
             aggregate_limit_amount содержит дословную формулировку;
             aggregate_limit_reset = "per_policy" (обычно).
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для aggregate_limit_check_presence используй только:
          "present", "missing", "unclear".
        - Для aggregate_limit_present допустимо только: yes / no.
        - Для aggregate_limit_vs_sum_insured допустимо только:
          same / lower / higher / not_defined.
        - Для aggregate_limit_reset допустимо только:
          annual / per_policy / not_defined.
        - Fallback для aggregate_limit_amount: "not_defined".
        - Fallback для aggregate_limit_summary: "Не установлен".
        - evidence — массив объектов вида {"clause_ref": "...", "quote": "..."}.
        - Технический формат JSON (value / confidence / location) задан
          отдельным контрактом — соблюдай его, но не описывай здесь.
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>
      fields:
        - name: "aggregate_limit_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие условий об агрегатном лимите. Внутреннее агрегатное signal-поле."
          required: true

        - name: "aggregate_limit_present"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["yes", "no"]
          label: "Агрегатный лимит"
          description: "Установлен ли совокупный лимит ответственности страховщика за весь период страхования."
          required: true
          display_in_grid: true
          display_priority: 1

        - name: "aggregate_limit_amount"
          type: "string"
          presentation: "fact"
          label: "Размер агрегатного лимита"
