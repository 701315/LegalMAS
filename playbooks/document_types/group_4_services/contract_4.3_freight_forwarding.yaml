    name: "Ответственность экспедитора за третьих лиц (ст. 803, 805 ГК РФ)"
    description: >
      Фактографическая проверка наличия условия о том, что экспедитор отвечает
      за действия привлечённых третьих лиц (перевозчиков, таможенных брокеров)
