        - "приложить документы"
        - "прилагаются документы"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)отч[её]т\\s+экспедитор"
        - "(?i)отч[её]т\\s+о\\s+расход"
        - "(?i)(форма|срок).*отч[её]т"
        - "(?i)подтверждающ.*документ"
        - "(?i)приложени.*документ"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор транспортной экспедиции.

        Проверяется только один вопрос: отчёт экспедитора.

        Нужно установить:
        - предусмотрен ли отчёт экспедитора;
        - указана ли форма отчёта;
        - определён ли срок представления отчёта;
        - требуются ли подтверждающие документы или приложения.

        Важно:
        - Твоя задача — не оценивать серьёзность риска.
        - Только установить, что прямо есть в тексте договора, а чего прямо нет.
        - Не смешивай отчёт экспедитора с актом оказанных услуг, если акт прямо не назван отчётом или документом о расходах.
        - Если форма или срок отчёта определяются через приложение, заявку, тариф или иной названный документ, это допустимый исход.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Упоминание отчёта экспедитора, отчёта о расходах или отчётности экспедитора.
        2. Форму отчёта, если она указана.
        3. Срок представления отчёта или механизм его определения.
        4. Требование приложить подтверждающие документы или приложения.
        5. Сформируй краткое пользовательское резюме для поля forwarder_report_summary.
        6. Собери точные цитаты в evidence.

        [ПРАВИЛА]
        1. Используй только предоставленный текст договора.
        2. Если данные отсутствуют:
           - для статусных и перечислимых полей используй "not_defined";
           - для видимого текстового поля используй "Не установлен".
        3. Не используй null, None, пустые строки.
        4. Если текст есть, но надёжный вывод сделать нельзя:
           - для статусных и перечислимых полей используй "not_defined";
           - для видимого текстового поля используй "Не удалось определить".
        5. Если договор прямо исключает отчёт, используй:
           - report_mentioned = "no";
           - forwarder_report_summary = "Не предусмотрен".
        6. Если форма отчёта определяется через названный документ, допустимо вернуть:
           - "Определяется по Приложению № 1";
           - "Определяется по форме экспедитора";
           - "Определяется по Приложению № 3".
        7. Если срок отчёта определяется через названный документ, допустимо вернуть:
           - "Определяется по Приложению № 3";
           - "Определяется по заявке";
           - "Согласно Приложению № 2".
        8. Не считай порог согласования расходов, оплату вознаграждения или акт оказанных услуг отчётом экспедитора, если они прямо не названы отчётом или документом о расходах.
        9. Верни РОВНО один JSON-объект со всеми 6 ключами без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.
        10. В evidence включай только точные цитаты из документа. Если данных нет, верни пустой массив [].
        11. Поле forwarder_report_summary должно быть кратким и не должно содержать длинных цитат.

        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1 — отчёт, форма, срок и подтверждающие документы указаны прямо:
        Фрагмент:
        "Экспедитор обязан представить Клиенту отчёт о понесённых расходах по форме Приложения № 2 в течение 5 рабочих дней после оказания услуг. К отчёту прилагаются документы, подтверждающие расходы."
        Ответ:
        {
          "report_mentioned": "yes",
          "report_form_specified": "yes",
          "report_deadline_details": "в течение 5 рабочих дней после оказания услуг",
          "supporting_documents_required": "yes",
          "forwarder_report_summary": "Отчёт предусмотрен; форма — Приложение № 2; срок — 5 рабочих дней после оказания услуг; подтверждающие документы требуются",
          "evidence": [
            {
              "clause_ref": "п. 4.1",
              "quote": "Экспедитор обязан представить Клиенту отчёт о понесённых расходах по форме Приложения № 2 в течение 5 рабочих дней после оказания услуг. К отчёту прилагаются документы, подтверждающие расходы."
            }
          ]
        }

        Пример 2 — форма и срок отчёта определяются приложением:
        Фрагмент:
        "Экспедитор представляет отчёт о расходах по форме и в сроки, которые определяются Приложением № 3."
        Ответ:
        {
          "report_mentioned": "yes",
          "report_form_specified": "yes",
          "report_deadline_details": "Определяется по Приложению № 3",
          "supporting_documents_required": "not_defined",
          "forwarder_report_summary": "Отчёт предусмотрен; форма и срок определяются Приложением № 3",
          "evidence": [
            {
              "clause_ref": "п. 4.2",
              "quote": "Экспедитор представляет отчёт о расходах по форме и в сроки, которые определяются Приложением № 3."
            }
          ]
        }

        Пример 3 — условие об отчёте отсутствует:
        Фрагмент:
        "Экспедитор организует перевозку груза."
        Ответ:
        {
          "report_mentioned": "not_defined",
          "report_form_specified": "not_defined",
          "report_deadline_details": "Не установлен",
          "supporting_documents_required": "not_defined",
          "forwarder_report_summary": "Не установлен",
          "evidence": []
        }

        Пример 4 — текст есть, но надёжный вывод сделать нельзя:
        Фрагмент:
        "Экспедитор передаёт Клиенту документы, связанные с оказанными услугами, без указания вида, формы и порядка их представления."
        Ответ:
        {
          "report_mentioned": "not_defined",
          "report_form_specified": "not_defined",
          "report_deadline_details": "Не удалось определить",
          "supporting_documents_required": "not_defined",
          "forwarder_report_summary": "Не удалось определить",
          "evidence": [
            {
              "clause_ref": "п. 5.3",
              "quote": "Экспедитор передаёт Клиенту документы, связанные с оказанными услугами, без указания вида, формы и порядка их представления."
            }
          ]
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Есть ли прямое упоминание отчёта экспедитора или отчёта о расходах?
        2. Не смешан ли отчёт с актом оказанных услуг или транспортными документами?
        3. Указана ли форма отчёта или механизм её определения?
        4. Указан ли срок представления отчёта или механизм его определения?
        5. Требуются ли подтверждающие документы или приложения?
        6. Если текст есть, но вывод невозможен, использовано ли "Не удалось определить"?
        7. Все ли 6 ключей присутствуют в ответе?
        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь РОВНО одним JSON-объектом без какого-либо дополнительного текста до или после, со всеми 6 ключами:
        {
          "report_mentioned": "<yes / no / not_defined>",
          "report_form_specified": "<yes / no / not_defined>",
          "report_deadline_details": "<краткий срок или 'Не установлен' / 'Не удалось определить' / 'Определяется по ...'>",
          "supporting_documents_required": "<yes / no / not_defined>",
          "forwarder_report_summary": "<краткое резюме или 'Не установлен' / 'Не предусмотрен' / 'Не удалось определить'>",
          "evidence": [{"clause_ref": "<пункт или раздел>", "quote": "<точная цитата>"}]
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 700

    retrieval:
      retrieval_profile: "payment_terms_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "отчёт экспедитора отчет экспедитора отчёт о расходах отчет о расходах отчётность экспедитора представление отчёта предоставление отчёта форма отчёта срок представления отчёта подтверждающие документы документальное подтверждение расходов приложение документов"
      boost_keywords:
        - "отчёт экспедитора"
        - "отчет экспедитора"
        - "отчёт о расходах"
        - "отчет о расходах"
        - "отчётность экспедитора"
        - "представление отчёта"
        - "предоставление отчёта"
        - "форма отчёта"
        - "срок представления отчёта"
        - "подтверждающие документы"
        - "документальное подтверждение"
