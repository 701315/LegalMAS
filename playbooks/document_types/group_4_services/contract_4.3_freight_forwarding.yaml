  compliance_rules: []
# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 4: CHECKS_V8 — единственный рабочий слой юридического анализа
#  Читается: DocTypeCheckLoader._load_doc_type_checks()
# ════════════════════════════════════════════════════════════════════════════
checks_v8:
  - id: parties_identification
    name: "Стороны договора: идентификация экспедитора и клиента"
    description: >
      Фактографическая проверка идентификации сторон договора транспортной
      экспедиции — экспедитора и клиента, их реквизитов, подписантов,
      оснований полномочий и упоминания статуса экспедитора.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "экспедитор"
        - "клиент"
        - "стороны"
        - "реквизиты"
        - "адрес"
        - "ИНН"
        - "ОГРН"
        - "подписант"
        - "в лице"
        - "действующего на основании"
        - "устав"
        - "доверенность"
        - "именуем"
        - "статус экспедитора"
        - "реестр экспедиторов"
        - "свидетельство"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)(экспедитор|клиент).*именуем"
        - "(?i)действующ[а-яё]+\\s+на\\s+основании"
        - "(?i)статус\\s+экспедитор"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор транспортной экспедиции (Глава 41 ГК РФ,
        ст. 801; ФЗ-87 «О транспортно-экспедиционной деятельности»).

        Проверяется только один вопрос: идентификация сторон — Экспедитора
        и Клиента, их реквизиты, подписанты, основания полномочий и
        упоминание статуса экспедитора.

        Нормативный ориентир:
        - ст. 801 ГК РФ;
        - ст. 2 ФЗ-87 «О транспортно-экспедиционной деятельности».

        Важно:
        - Твоя задача — не оценивать серьёзность риска.
        - Только установить, что прямо есть в тексте договора, а чего прямо нет.
        - Отсутствие упоминания реестра экспедиторов или свидетельства не является
          автоматическим дефектом договора.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Наименование и реквизиты Экспедитора (ИНН, ОГРН, другие идентификаторы, если указаны).
        2. Тип Экспедитора: юридическое лицо, ИП или физическое лицо.
        3. Кто подписывает от Экспедитора и на каком основании.
        4. Наименование и реквизиты Клиента.
        5. Тип Клиента.
        6. Кто подписывает от Клиента и на каком основании.
        7. Упоминание статуса экспедитора: реестр, свидетельство, членство, аккредитация, если такие сведения есть.

        [ПРАВИЛА]
        1. Используй только предоставленный текст договора.
        2. Если данные отсутствуют:
           - для статусных и перечислимых полей используй "not_defined";
           - для видимых текстовых полей используй "Не установлен".
        3. Не используй null, None, пустые строки.
        4. Если текст есть, но надёжный вывод сделать нельзя, используй:
           - для статусных и перечислимых полей "not_defined";
           - для видимых текстовых полей "Не удалось определить".
        5. Верни РОВНО один JSON-объект со всеми 13 ключами без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.
        6. В evidence включай только точные цитаты из документа. Если данных нет, верни пустой массив [].
        7. Не смешивай стороны договора с грузоотправителем и грузополучателем, если они прямо не названы сторонами договора.
        8. Если сторона определяется через приложение, заявку, спецификацию или иной названный документ, и это прямо указано в договоре, допустимо вернуть значение вида "Определяется по Приложению № 1" или "Определяется по заявке".

        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1 — данные сторон и статус экспедитора указаны прямо:
        Фрагмент:
        "ООО «ЛогистикПро» (ИНН 7701234567, ОГРН 1027700123456), именуемое «Экспедитор», в лице генерального директора Иванова И.И., действующего на основании Устава, и АО «ТоргДом» (ИНН 7709876543), именуемое «Клиент», в лице директора Петрова П.П., действующего на основании доверенности № 12 от 01.01.2026. Экспедитор включён в реестр экспедиторов (свидетельство № 123)."
        Ответ:
        {
          "forwarder_details_status": "defined",
          "forwarder_details_value": "ООО «ЛогистикПро», ИНН 7701234567, ОГРН 1027700123456",
          "forwarder_type": "legal_entity",
          "forwarder_signatory": "Иванов И.И., генеральный директор",
          "forwarder_signatory_basis": "charter",
          "client_details_status": "defined",
          "client_details_value": "АО «ТоргДом», ИНН 7709876543",
          "client_type": "legal_entity",
          "client_signatory": "Петров П.П., директор",
          "client_signatory_basis": "poa",
          "forwarder_status_mentioned": "yes",
          "forwarder_status_details": "включён в реестр экспедиторов, свидетельство № 123",
          "evidence": [
            {
              "clause_ref": "преамбула",
              "quote": "ООО «ЛогистикПро» (ИНН 7701234567, ОГРН 1027700123456), именуемое «Экспедитор», в лице генерального директора Иванова И.И., действующего на основании Устава, и АО «ТоргДом» (ИНН 7709876543), именуемое «Клиент», в лице директора Петрова П.П., действующего на основании доверенности № 12 от 01.01.2026."
            },
            {
              "clause_ref": "статус экспедитора",
              "quote": "Экспедитор включён в реестр экспедиторов (свидетельство № 123)."
            }
          ]
        }

        Пример 2 — данные сторон не указаны прямо:
        Фрагмент:
        "Настоящий договор заключён между Экспедитором и Клиентом."
        Ответ:
        {
          "forwarder_details_status": "not_defined",
          "forwarder_details_value": "Не установлен",
          "forwarder_type": "not_defined",
          "forwarder_signatory": "Не установлен",
          "forwarder_signatory_basis": "not_defined",
          "client_details_status": "not_defined",
          "client_details_value": "Не установлен",
          "client_type": "not_defined",
          "client_signatory": "Не установлен",
          "client_signatory_basis": "not_defined",
          "forwarder_status_mentioned": "not_defined",
          "forwarder_status_details": "Не установлен",
          "evidence": []
        }

        Пример 3 — текст есть, но надёжный вывод сделать нельзя:
        Фрагмент:
        "Экспедитор включён в реестр экспедиторов, однако номер свидетельства и дата включения в тексте не указаны."
        Ответ:
        {
          "forwarder_details_status": "not_defined",
          "forwarder_details_value": "Не установлен",
          "forwarder_type": "not_defined",
          "forwarder_signatory": "Не установлен",
          "forwarder_signatory_basis": "not_defined",
          "client_details_status": "not_defined",
          "client_details_value": "Не установлен",
          "client_type": "not_defined",
          "client_signatory": "Не установлен",
          "client_signatory_basis": "not_defined",
          "forwarder_status_mentioned": "yes",
          "forwarder_status_details": "Не удалось определить",
          "evidence": [
            {
              "clause_ref": "статус экспедитора",
              "quote": "Экспедитор включён в реестр экспедиторов, однако номер свидетельства и дата включения в тексте не указаны."
            }
          ]
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Разграничены ли поля Экспедитора и Клиента без смешения?
        2. Не смешаны ли стороны договора с грузоотправителем или грузополучателем?
        3. Есть ли наименование, ИНН, ОГРН или иной идентификатор стороны, если они указаны?
        4. Указан ли подписант и документ-основание полномочий?
        5. Упомянут ли статус экспедитора: реестр, свидетельство, аккредитация?
        6. Если данных нет, использованы ли "not_defined" и "Не установлен"?
        7. Если текст есть, но вывод невозможен, использованы ли "not_defined" и "Не удалось определить"?
        8. Все ли 13 ключей присутствуют в ответе?
        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь РОВНО одним JSON-объектом без какого-либо дополнительного текста до или после, со всеми 13 ключами:
        {
          "forwarder_details_status": "<defined / not_defined>",
          "forwarder_details_value": "<краткие идентификационные данные или 'Не установлен' / 'Не удалось определить'>",
          "forwarder_type": "<legal_entity / ip / individual / not_defined>",
          "forwarder_signatory": "<ФИО и должность или 'Не установлен' / 'Не удалось определить'>",
          "forwarder_signatory_basis": "<charter / poa / order / personal / other / not_defined>",
          "client_details_status": "<defined / not_defined>",
          "client_details_value": "<краткие идентификационные данные или 'Не установлен' / 'Не удалось определить'>",
          "client_type": "<legal_entity / ip / individual / not_defined>",
          "client_signatory": "<ФИО и должность или 'Не установлен' / 'Не удалось определить'>",
          "client_signatory_basis": "<charter / poa / order / personal / other / not_defined>",
          "forwarder_status_mentioned": "<yes / no / not_defined>",
          "forwarder_status_details": "<текст или 'Не установлен' / 'Не удалось определить'>",
          "evidence": [{"clause_ref": "<пункт или раздел>", "quote": "<точная цитата>"}]
        }
      context_k: 8
      temperature: 0.0
      max_tokens: 900

    retrieval:
      retrieval_profile: "party_identification_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "экспедитор клиент стороны договора именуем в лице действующего на основании реквизиты адреса ИНН ОГРН подписант доверенность устав статус экспедитора реестр экспедиторов свидетельство"
      boost_keywords:
        - "экспедитор"
        - "клиент"
        - "стороны"
        - "реквизиты"
        - "ИНН"
        - "ОГРН"
        - "подписант"
        - "доверенность"
        - "устав"
        - "реестр экспедиторов"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - technical_fragment
      preferred_clause_functions:
        - representations
        - boilerplate
      negative_keywords:
        - "вознаграждение"
        - "срок доставки"
        - "страхование"
        - "удержание"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.0, 0.20]
        boost: 0.40
        scope: segment
      context_k: 8
      max_chunks: 10
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "representations"
        - "boilerplate"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.15

    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 600

    extraction:
      store_payload: true

      enabled: true
      mode: "hybrid"
      compact_output: false
      llm_max_tokens: 1300
      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Твоя задача — извлечь из договора транспортной
        экспедиции сведения об Экспедиторе и Клиенте: идентификационные данные,
        тип стороны, подписанта, основание полномочий и упоминание статуса
        экспедитора.

        Не анализируй предмет договора, вознаграждение, сроки доставки,
        ответственность, страхование или иные темы, если они не содержат
        идентификацию сторон.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        1. forwarder_details_status — "defined" или "not_defined".
        2. forwarder_details_value — краткие идентификационные данные экспедитора.
        3. forwarder_type — "legal_entity", "ip", "individual" или "not_defined".
        4. forwarder_signatory — подписант экспедитора.
        5. forwarder_signatory_basis — "charter", "poa", "order", "personal", "other" или "not_defined".
        6. client_details_status — "defined" или "not_defined".
        7. client_details_value — краткие идентификационные данные клиента.
        8. client_type — "legal_entity", "ip", "individual" или "not_defined".
        9. client_signatory — подписант клиента.
        10. client_signatory_basis — "charter", "poa", "order", "personal", "other" или "not_defined".
        11. forwarder_status_mentioned — "yes", "no" или "not_defined".
        12. forwarder_status_details — сведения о статусе экспедитора.
        13. evidence — массив точных цитат из договора.

        Правила заполнения:
        - Если данных нет, статусные поля = "not_defined", видимые текстовые поля = "Не установлен".
        - Если текст есть, но надёжный вывод сделать нельзя, статусные поля = "not_defined", видимые текстовые поля = "Не удалось определить".
        - Если договор прямо указывает, что сторона определяется через приложение, заявку, спецификацию или иной документ, допустимо вернуть "Определяется по ..." с названием документа.
        - Если тема статуса экспедитора явно не применима, допустимо вернуть "Не применимо" для forwarder_status_details.
        - Для forwarder_status_mentioned:
          "yes" — есть упоминание реестра, свидетельства, аккредитации или иного статуса;
          "no" — договор прямо указывает, что такой статус не применяется или отсутствует;
          "not_defined" — упоминания нет.
        - Если данных нет, evidence должен быть пустым массивом [].
        </task>

        <context_rules>
        - Используй только предоставленный контекст.
        - Не используй внешние знания и не угадывай ИНН, ОГРН, адреса, подписантов, полномочия или статус.
        - Не исправляй и не дополняй реквизиты по смыслу, если они не указаны в тексте.
        - Игнорируй фрагменты, которые не относятся к идентификации сторон.
        - Если фрагменты конфликтуют и не позволяют сделать надёжный вывод, верни "Не удалось определить" для затронутого видимого поля и включи конфликтующие цитаты в evidence.
        - Не смешивай Экспедитора и Клиента.
        - Не смешивай стороны договора с грузоотправителем и грузополучателем, если они прямо не названы сторонами договора.
        </context_rules>

        <output_expectations>
        Все перечисленные ключи должны присутствовать в ответе, даже если значение равно "not_defined", "Не установлен", "Не удалось определить" или "Не применимо".

        Запрещено возвращать:
        - null;
        - None;
        - пустые строки;
        - пояснения до или после JSON;
        - Markdown;
        - код-фенсы;
        - списки вне JSON.

        Верни РОВНО один JSON-объект со всеми 13 ключами без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.
        </output_expectations>

