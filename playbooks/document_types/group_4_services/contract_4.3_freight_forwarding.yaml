        - "(?i)(тариф|прайс-лист|прейскурант)"
        - "(?i)(аванс|предоплат)"
        - "(?i)лимит.*расход"
        - "(?i)предельн.*сумм.*расход"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор транспортной экспедиции.

        Проверяется только один вопрос: вознаграждение экспедитора и порядок
        возмещения его расходов.

        Нормативный ориентир:
        - ст. 804 ГК РФ.

        Важно:
        - Твоя задача — не оценивать серьёзность риска.
        - Только установить, что прямо есть в тексте договора, а чего прямо нет.
        - Не путай вознаграждение экспедитора с возмещением его расходов.
        - Если вознаграждение или лимит расходов определяются через приложение,
          тариф, прайс-лист, заявку или иной названный документ, это допустимый
          исход, если такой механизм прямо указан в договоре.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Указано ли вознаграждение экспедитора.
        2. Тип вознаграждения: фиксированное, процент, почасовое, не указан или не определён.
        3. Размер вознаграждения или механизм его определения.
        4. Предусмотрено ли возмещение расходов экспедитора.
        5. Есть ли механизм согласования расходов.
        6. Есть ли лимит расходов или предельная сумма расходов.
        7. Предусмотрено ли авансирование или предоплата.
        8. Сформируй точные цитаты в evidence.

        [ПРАВИЛА]
        1. Используй только предоставленный текст договора.
        2. Если данные отсутствуют:
           - для статусных и перечислимых полей используй "not_defined";
           - для видимых текстовых полей используй "Не установлен" или "Не установлено".
        3. Не используй null, None, пустые строки.
        4. Если текст есть, но надёжный вывод сделать нельзя:
           - для статусных и перечислимых полей используй "not_defined";
           - для видимых текстовых полей используй "Не удалось определить".
        5. Если вознаграждение прямо не предусмотрено, используй:
           - remuneration_specified = "no";
           - remuneration_amount = "Не применимо".
        6. Если возмещение расходов прямо не предусмотрено или расходы включены в вознаграждение без отдельной компенсации, используй:
           - expenses_reimbursement_present = "no";
           - expenses_limit = "Не применимо", если отдельный лимит не имеет смысла.
        7. Если вознаграждение или лимит определяются через названный документ, допустимо вернуть:
           - "Определяется по Приложению № 1";
           - "Определяется по Тарифам Экспедитора";
           - "Определяется по заявке";
           - "Согласно прейскуранту Экспедитора".
        8. Не считай порог предварительного согласования лимитом расходов, если прямо не указано максимальное ограничение.
        9. Верни РОВНО один JSON-объект со всеми 8 ключами без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.
        10. В evidence включай только точные цитаты из документа. Если данных нет, верни пустой массив [].
        11. Видимые текстовые значения должны быть краткими: без длинных пересказов и без цитирования всего пункта.

        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1 — вознаграждение, возмещение расходов, лимит, согласование и аванс указаны прямо:
        Фрагмент:
        "Вознаграждение Экспедитора составляет 15 000 рублей за каждую перевозку. Клиент возмещает фактические расходы Экспедитора, подтверждённые документами, в пределах лимита 50 000 рублей. Расходы сверх лимита подлежат предварительному согласованию. Клиент выплачивает аванс в размере 30% вознаграждения."
        Ответ:
        {
          "remuneration_specified": "yes",
          "remuneration_type": "fixed",
          "remuneration_amount": "15 000 рублей за каждую перевозку",
          "expenses_reimbursement_present": "yes",
          "expenses_approval_mechanism": "yes",
          "expenses_limit": "50 000 рублей",
          "advance_payment": "yes",
          "evidence": [
            {
              "clause_ref": "п. 3.1",
              "quote": "Вознаграждение Экспедитора составляет 15 000 рублей за каждую перевозку. Клиент возмещает фактические расходы Экспедитора, подтверждённые документами, в пределах лимита 50 000 рублей. Расходы сверх лимита подлежат предварительному согласованию. Клиент выплачивает аванс в размере 30% вознаграждения."
            }
          ]
        }

        Пример 2 — вознаграждение определяется по тарифам, расходы возмещаются по отчёту:
        Фрагмент:
        "Вознаграждение Экспедитора определяется по Тарифам, указанным в Приложении № 1. Клиент возмещает фактические расходы Экспедитора по представленным отчётам и подтверждающим документам. Авансирование по договору не предусмотрено."
        Ответ:
        {
          "remuneration_specified": "yes",
          "remuneration_type": "not_specified",
          "remuneration_amount": "Определяется по Приложению № 1",
          "expenses_reimbursement_present": "yes",
          "expenses_approval_mechanism": "not_defined",
          "expenses_limit": "Не установлен",
          "advance_payment": "no",
          "evidence": [
            {
              "clause_ref": "п. 4.2",
              "quote": "Вознаграждение Экспедитора определяется по Тарифам, указанным в Приложении № 1. Клиент возмещает фактические расходы Экспедитора по представленным отчётам и подтверждающим документам. Авансирование по договору не предусмотрено."
            }
          ]
        }

        Пример 3 — конкретные коммерческие условия не указаны:
        Фрагмент:
        "Клиент оплачивает услуги Экспедитора в порядке, согласованном сторонами."
        Ответ:
        {
          "remuneration_specified": "not_defined",
          "remuneration_type": "not_defined",
          "remuneration_amount": "Не установлен",
          "expenses_reimbursement_present": "not_defined",
          "expenses_approval_mechanism": "not_defined",
          "expenses_limit": "Не установлен",
          "advance_payment": "not_defined",
          "evidence": [
            {
              "clause_ref": "п. 3.1",
              "quote": "Клиент оплачивает услуги Экспедитора в порядке, согласованном сторонами."
            }
          ]
        }

        Пример 4 — текст есть, но надёжный вывод сделать нельзя:
        Фрагмент:
        "Размер вознаграждения и предельная сумма расходов будут дополнительно согласованы сторонами при оформлении каждой перевозки."
        Ответ:
        {
          "remuneration_specified": "not_defined",
          "remuneration_type": "not_defined",
          "remuneration_amount": "Не удалось определить",
          "expenses_reimbursement_present": "not_defined",
          "expenses_approval_mechanism": "not_defined",
          "expenses_limit": "Не удалось определить",
          "advance_payment": "not_defined",
          "evidence": [
            {
              "clause_ref": "п. 3.5",
              "quote": "Размер вознаграждения и предельная сумма расходов будут дополнительно согласованы сторонами при оформлении каждой перевозки."
            }
          ]
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Указано ли вознаграждение конкретной суммой, формулой или механизмом определения?
        2. Разграничены ли вознаграждение и возмещение расходов?
        3. Есть ли прямой лимит расходов, а не только порог согласования?
        4. Предусмотрено ли авансирование или предоплата?
        5. Если параметры определяются через приложение или тариф, отражено ли это в значении поля?
        6. Если текст есть, но вывод невозможен, использовано ли "Не удалось определить"?
        7. Все ли 8 ключей присутствуют в ответе?
        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь РОВНО одним JSON-объектом без какого-либо дополнительного текста до или после, со всеми 8 ключами:
        {
          "remuneration_specified": "<yes / no / not_defined>",
          "remuneration_type": "<fixed / percentage / hourly / not_specified / not_defined>",
          "remuneration_amount": "<размер или механизм определения, либо 'Не установлен' / 'Не удалось определить' / 'Не применимо' / 'Определяется по ...'>",
          "expenses_reimbursement_present": "<yes / no / not_defined>",
          "expenses_approval_mechanism": "<yes / no / not_defined>",
          "expenses_limit": "<лимит или механизм определения, либо 'Не установлен' / 'Не удалось определить' / 'Не применимо' / 'Определяется по ...'>",
          "advance_payment": "<yes / no / not_defined>",
          "evidence": [{"clause_ref": "<пункт или раздел>", "quote": "<точная цитата>"}]
        }
      context_k: 8
      temperature: 0.0
      max_tokens: 800

    retrieval:
      retrieval_profile: "payment_terms_check"
      corpus_scope: "primary_segment"
