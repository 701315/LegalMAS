      max_snippet_length: 600

    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false
      llm_max_tokens: 900

      presence_signal:
        field: "liability_for_third_parties_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из договора транспортной экспедиции
        сведения об ответственности экспедитора за действия привлечённых третьих лиц:
        перевозчиков, таможенных представителей, субисполнителей и иных лиц.

        Не анализируй страхование, удержание, претензионный порядок, оплату,
        форс-мажор и иные темы, если они не содержат сведений об ответственности
        экспедитора именно за третьих лиц.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. liability_for_third_parties_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (liability_for_third_parties_present, right_to_engage_third_parties) ≠ "not_defined";
           - "missing" — если оба содержательных поля = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - liability_for_third_parties_present = "not_defined";
           - right_to_engage_third_parties = "not_defined";
           - liability_basis = "not_defined";
           - exclusions_from_liability = "not_defined";
           - liability_for_third_parties_summary = "Не установлено";
           - не выполняй остальные шаги.

        1. liability_for_third_parties_present — наличие ответственности:
           "yes", "no", "limited" или "not_defined".
        2. liability_basis — основание ответственности:
           "own_actions", "joint_and_several", "limited" или "not_defined".
        3. right_to_engage_third_parties — право привлекать третьих лиц:
           "yes", "with_consent", "no" или "not_defined".
        4. exclusions_from_liability — наличие исключений из ответственности за третьих лиц:
           "yes", "no" или "not_defined".
        5. liability_for_third_parties_summary — краткое пользовательское резюме.
        6. evidence — массив точных цитат из договора.

        Правила заполнения:
        - Для liability_for_third_parties_present: "yes", если экспедитор прямо отвечает за действия третьих лиц как за свои собственные; "limited", если ответственность ограничена; "no", если прямо указано, что не отвечает; "not_defined", если условие не найдено.
        - Для liability_basis: "own_actions", если как за свои собственные; "joint_and_several", если солидарная; "limited", если есть ограничение; "not_defined", если не определено.
        - Для right_to_engage_third_parties: "yes", если без согласия; "with_consent", если с согласия; "no", если запрещено; "not_defined", если не определено.
        - Для exclusions_from_liability: "yes", если есть прямые исключения; "no", если прямо указано, что исключений нет; "not_defined", если не упомянуто.
        - Для liability_for_third_parties_summary: если ответственность установлена как за свои действия, верни, например: "Экспедитор отвечает за действия третьих лиц как за свои собственные"; если есть ограничение: "Ответственность за действия третьих лиц ограничена"; если исключение: "Ответственность за действия третьих лиц исключена"; если условие не найдено: "Не установлено"; если вывод невозможен: "Не удалось определить".
        - Если данных нет, верни пустой массив [] для evidence.
        </task>

        <context_rules>
        - Перед остальными полями заполни liability_for_third_parties_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined", liability_for_third_parties_summary = "Не установлено".
        - Используй только предоставленный контекст.
        - Не выводи ответственность из закона, если она не упомянута в тексте договора.
        - Не считай отсутствие условия автоматическим исключением ответственности.
        - Не смешивай ответственность за третьих лиц с общей ответственностью сторон, лимитами ответственности или форс-мажором, если они не привязаны к третьим лицам.
        - Не смешивай экспедиторскую расписку, транспортную накладную, акты и платёжные документы с условиями об ответственности за третьих лиц.
        - Если фрагменты конфликтуют и не позволяют сделать надёжный вывод, верни "Не удалось определить" для liability_for_third_parties_summary и включи конфликтующие цитаты в evidence.
        - Не давай правовой оценки условиям договора; фиксируй только фактические формулировки.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет упоминания третьих лиц, их привлечения или ответственности за них.
           → presence = "missing";
             liability_for_third_parties_present = "not_defined";
             liability_for_third_parties_summary = "Не установлено".

        2. Неполное раскрытие темы.
           Упомянуто право привлекать третьих лиц, но ответственность за них не раскрыта.
           → presence = "present";
             liability_for_third_parties_present = "not_defined";
             liability_for_third_parties_summary = "Не установлено" (или краткое описание того, что есть).

        3. Противоречие между фрагментами.
           В разных частях договора указаны разные условия ответственности за третьих лиц.
           → presence = "unclear";
             liability_for_third_parties_summary = "Не удалось определить".

        4. Прямое исключение ответственности.
           В договоре прямо указано, что экспедитор не несёт ответственности за действия перевозчика.
           → presence = "present";
             liability_for_third_parties_present = "no";
             exclusions_from_liability = "yes";
             liability_for_third_parties_summary = "Ответственность за действия третьих лиц исключена".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для liability_for_third_parties_presence используй только: "present", "missing", "unclear".
        - Для статусных enum-полей используй только допустимые значения из списка.
        - Fallback при отсутствии данных:
          * liability_for_third_parties_summary → "Не установлено".
        - Fallback при противоречии или неоднозначности:
          * liability_for_third_parties_summary → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "liability_for_third_parties_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования об ответственности за третьих лиц. Внутреннее агрегатное signal-поле."
          required: true

        - name: "liability_for_third_parties_present"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["yes", "no", "limited", "not_defined"]
          description: "Наличие ответственности экспедитора за действия третьих лиц. Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "liability_basis"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["own_actions", "joint_and_several", "limited", "not_defined"]
          description: "Основание ответственности экспедитора за действия третьих лиц. Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "right_to_engage_third_parties"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["yes", "with_consent", "no", "not_defined"]
          description: "Право экспедитора привлекать третьих лиц для исполнения договора. Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "exclusions_from_liability"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Наличие исключений из ответственности экспедитора за действия третьих лиц. Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "liability_for_third_parties_summary"
          type: "string"
          presentation: "fact"
          label: "Ответственность за третьих лиц"
          description: >
            Краткое описание ответственности экспедитора за действия привлечённых третьих лиц и права их привлекать. Fallback: "Не установлено" / "Не удалось определить".
          required: true
          display_in_grid: true
          display_priority: 1

        - name: "evidence"
          type: "array"
          presentation: "diagnostic"
          description: "Точные цитаты из договора, подтверждающие извлечённые значения."
          required: true
          display_in_grid: false

      store_payload: true
  - id: remuneration_and_expenses_check
    name: "Вознаграждение экспедитора и возмещение расходов (ст. 804 ГК РФ)"
    description: >
      Фактографическая проверка условий вознаграждения экспедитора и порядка
      возмещения его расходов: тип вознаграждения, размер, предварительное
      согласование расходов, лимиты, авансирование и отчётность.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "вознаграждение экспедитора"
        - "размер вознаграждения"
        - "сумма вознаграждения"
        - "стоимость услуг экспедитора"
        - "фиксированное вознаграждение"
        - "процент вознаграждения"
        - "почасовое вознаграждение"
        - "тариф"
        - "прайс-лист"
        - "прейскурант"
        - "возмещение расходов"
        - "фактические расходы"
        - "за счёт клиента"
        - "смета расходов"
        - "предварительное согласование"
        - "согласование расходов"
        - "лимит расходов"
        - "предельная сумма расходов"
        - "авансирование"
        - "аванс"
        - "предоплата"
        - "отчёт о расходах"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)вознагражден(ие|ия)\\s+экспедитор"
        - "(?i)возмещени(е|я)\\s+расход"
        - "(?i)за\\s+счёт\\s+клиент"
        - "(?i)(тариф|прайс-лист|прейскурант)"
        - "(?i)(аванс|предоплат)"
        - "(?i)лимит.*расход"
        - "(?i)предельн.*сумм.*расход"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор транспортной экспедиции.

        Проверяется только один вопрос: вознаграждение экспедитора и порядок
        возмещения его расходов.

        Нормативный ориентир:
        - ст. 804 ГК РФ.

        Важно:
        - Твоя задача — не оценивать серьёзность риска.
        - Только установить, что прямо есть в тексте договора, а чего прямо нет.
        - Не путай вознаграждение экспедитора с возмещением его расходов.
        - Если вознаграждение или лимит расходов определяются через приложение,
          тариф, прайс-лист, заявку или иной названный документ, это допустимый
          исход, если такой механизм прямо указан в договоре.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Указано ли вознаграждение экспедитора.
        2. Тип вознаграждения: фиксированное, процент, почасовое, не указан или не определён.
        3. Размер вознаграждения или механизм его определения.
        4. Предусмотрено ли возмещение расходов экспедитора.
        5. Есть ли механизм согласования расходов.
        6. Есть ли лимит расходов или предельная сумма расходов.
        7. Предусмотрено ли авансирование или предоплата.
        8. Сформируй точные цитаты в evidence.

        [ПРАВИЛА]
        1. Используй только предоставленный текст договора.
        2. Если данные отсутствуют:
           - для статусных и перечислимых полей используй "not_defined";
           - для видимых текстовых полей используй "Не установлен" или "Не установлено".
        3. Не используй null, None, пустые строки.
        4. Если текст есть, но надёжный вывод сделать нельзя:
           - для статусных и перечислимых полей используй "not_defined";
           - для видимых текстовых полей используй "Не удалось определить".
        5. Если вознаграждение прямо не предусмотрено, используй:
           - remuneration_specified = "no";
           - remuneration_amount = "Не применимо".
        6. Если возмещение расходов прямо не предусмотрено или расходы включены в вознаграждение без отдельной компенсации, используй:
           - expenses_reimbursement_present = "no";
           - expenses_limit = "Не применимо", если отдельный лимит не имеет смысла.
        7. Если вознаграждение или лимит определяются через названный документ, допустимо вернуть:
           - "Определяется по Приложению № 1";
           - "Определяется по Тарифам Экспедитора";
           - "Определяется по заявке";
           - "Согласно прейскуранту Экспедитора".
        8. Не считай порог предварительного согласования лимитом расходов, если прямо не указано максимальное ограничение.
        9. Верни РОВНО один JSON-объект со всеми 8 ключами без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.
        10. В evidence включай только точные цитаты из документа. Если данных нет, верни пустой массив [].
        11. Видимые текстовые значения должны быть краткими: без длинных пересказов и без цитирования всего пункта.

        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1 — вознаграждение, возмещение расходов, лимит, согласование и аванс указаны прямо:
        Фрагмент:
        "Вознаграждение Экспедитора составляет 15 000 рублей за каждую перевозку. Клиент возмещает фактические расходы Экспедитора, подтверждённые документами, в пределах лимита 50 000 рублей. Расходы сверх лимита подлежат предварительному согласованию. Клиент выплачивает аванс в размере 30% вознаграждения."
        Ответ:
        {
          "remuneration_specified": "yes",
          "remuneration_type": "fixed",
          "remuneration_amount": "15 000 рублей за каждую перевозку",
          "expenses_reimbursement_present": "yes",
          "expenses_approval_mechanism": "yes",
          "expenses_limit": "50 000 рублей",
          "advance_payment": "yes",
          "evidence": [
            {
              "clause_ref": "п. 3.1",
              "quote": "Вознаграждение Экспедитора составляет 15 000 рублей за каждую перевозку. Клиент возмещает фактические расходы Экспедитора, подтверждённые документами, в пределах лимита 50 000 рублей. Расходы сверх лимита подлежат предварительному согласованию. Клиент выплачивает аванс в размере 30% вознаграждения."
            }
          ]
        }

        Пример 2 — вознаграждение определяется по тарифам, расходы возмещаются по отчёту:
        Фрагмент:
        "Вознаграждение Экспедитора определяется по Тарифам, указанным в Приложении № 1. Клиент возмещает фактические расходы Экспедитора по представленным отчётам и подтверждающим документам. Авансирование по договору не предусмотрено."
        Ответ:
        {
          "remuneration_specified": "yes",
          "remuneration_type": "not_specified",
          "remuneration_amount": "Определяется по Приложению № 1",
          "expenses_reimbursement_present": "yes",
          "expenses_approval_mechanism": "not_defined",
          "expenses_limit": "Не установлен",
          "advance_payment": "no",
          "evidence": [
            {
              "clause_ref": "п. 4.2",
              "quote": "Вознаграждение Экспедитора определяется по Тарифам, указанным в Приложении № 1. Клиент возмещает фактические расходы Экспедитора по представленным отчётам и подтверждающим документам. Авансирование по договору не предусмотрено."
            }
          ]
        }

        Пример 3 — конкретные коммерческие условия не указаны:
        Фрагмент:
        "Клиент оплачивает услуги Экспедитора в порядке, согласованном сторонами."
        Ответ:
        {
          "remuneration_specified": "not_defined",
          "remuneration_type": "not_defined",
          "remuneration_amount": "Не установлен",
          "expenses_reimbursement_present": "not_defined",
          "expenses_approval_mechanism": "not_defined",
          "expenses_limit": "Не установлен",
          "advance_payment": "not_defined",
          "evidence": [
            {
              "clause_ref": "п. 3.1",
              "quote": "Клиент оплачивает услуги Экспедитора в порядке, согласованном сторонами."
            }
          ]
        }

        Пример 4 — текст есть, но надёжный вывод сделать нельзя:
        Фрагмент:
        "Размер вознаграждения и предельная сумма расходов будут дополнительно согласованы сторонами при оформлении каждой перевозки."
        Ответ:
        {
          "remuneration_specified": "not_defined",
          "remuneration_type": "not_defined",
          "remuneration_amount": "Не удалось определить",
          "expenses_reimbursement_present": "not_defined",
          "expenses_approval_mechanism": "not_defined",
          "expenses_limit": "Не удалось определить",
          "advance_payment": "not_defined",
          "evidence": [
            {
              "clause_ref": "п. 3.5",
              "quote": "Размер вознаграждения и предельная сумма расходов будут дополнительно согласованы сторонами при оформлении каждой перевозки."
            }
          ]
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Указано ли вознаграждение конкретной суммой, формулой или механизмом определения?
        2. Разграничены ли вознаграждение и возмещение расходов?
        3. Есть ли прямой лимит расходов, а не только порог согласования?
        4. Предусмотрено ли авансирование или предоплата?
        5. Если параметры определяются через приложение или тариф, отражено ли это в значении поля?
        6. Если текст есть, но вывод невозможен, использовано ли "Не удалось определить"?
        7. Все ли 8 ключей присутствуют в ответе?
        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь РОВНО одним JSON-объектом без какого-либо дополнительного текста до или после, со всеми 8 ключами:
        {
          "remuneration_specified": "<yes / no / not_defined>",
          "remuneration_type": "<fixed / percentage / hourly / not_specified / not_defined>",
          "remuneration_amount": "<размер или механизм определения, либо 'Не установлен' / 'Не удалось определить' / 'Не применимо' / 'Определяется по ...'>",
          "expenses_reimbursement_present": "<yes / no / not_defined>",
          "expenses_approval_mechanism": "<yes / no / not_defined>",
          "expenses_limit": "<лимит или механизм определения, либо 'Не установлен' / 'Не удалось определить' / 'Не применимо' / 'Определяется по ...'>",
          "advance_payment": "<yes / no / not_defined>",
          "evidence": [{"clause_ref": "<пункт или раздел>", "quote": "<точная цитата>"}]
        }
      context_k: 8
      temperature: 0.0
      max_tokens: 800

    retrieval:
      retrieval_profile: "payment_terms_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "вознаграждение экспедитора размер вознаграждения сумма вознаграждения тип вознаграждения фиксированное вознаграждение процент вознаграждения почасовое вознаграждение стоимость услуг экспедитора тариф прайс-лист прейскурант возмещение расходов фактические расходы лимит расходов предварительное согласование расходов авансирование аванс предоплата отчёт о расходах"
      boost_keywords:
        - "вознаграждение экспедитора"
        - "размер вознаграждения"
        - "сумма вознаграждения"
        - "фиксированное вознаграждение"
        - "процент вознаграждения"
        - "почасовое вознаграждение"
        - "стоимость услуг экспедитора"
