            Краткое описание условий одностороннего отказа клиента: право, штраф, возмещение расходов и срок уведомления. Fallback: "Не установлено" / "Не удалось определить".
          required: true
          display_in_grid: true
          display_priority: 1

        - name: "evidence"
          type: "array"
          presentation: "diagnostic"
          description: "Точные цитаты из договора, подтверждающие извлечённые значения."
          required: true
          display_in_grid: false

      store_payload: true

  - id: liability_limits_and_cargo_value_check
    name: "Лимиты ответственности и объявленная ценность груза (ст. 7 ФЗ-87)"
    description: >
      Фактографическая проверка условий ответственности экспедитора за утрату,
      повреждение и просрочку доставки груза: основание определения ответственности
      (объявленная ценность / действительная стоимость / ограниченный лимит),
      размер лимита, механизм объявления ценности и ответственность за просрочку.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "ответственность за утрату"
        - "ответственность за повреждение"
        - "ответственность за недостачу"
        - "объявленная ценность"
        - "объявленная стоимость"
        - "действительная стоимость"
        - "реальная стоимость"
        - "фактическая стоимость"
        - "лимит ответственности"
        - "ограничение ответственности"
        - "просрочка доставки"
        - "ответственность за просрочку"
        - "неустойка за просрочку"
        - "2 МРОТ"
        - "ст. 7 ФЗ-87"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)ответственност.*за.*(утрат|поврежден|недостач)"
        - "(?i)объявленн(ая|ой|ую)\\s+ценност"
        - "(?i)объявленн(ая|ой|ую)\\s+стоимост"
        - "(?i)действительн(ая|ой|ую)\\s+стоимост"
        - "(?i)лимит.*ответственност"
        - "(?i)ограничен.*ответственност"
        - "(?i)просрочк.*доставк"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор транспортной экспедиции (ст. 7 ФЗ-87).

        Проверяется только один вопрос: ответственность экспедитора за утрату,
        повреждение груза и просрочку доставки, включая лимиты и объявленную ценность.

        Нормативный ориентир:
        - ст. 7 ФЗ-87 «О транспортно-экспедиционной деятельности».

        Важно:
        - Твоя задача — не оценивать серьёзность риска.
        - Только установить, что прямо есть в тексте договора, а чего прямо нет.
        - По ст. 7 ФЗ-87: при объявленной ценности — возмещение в размере
          объявленной ценности; без неё — в размере действительной стоимости
          утраченного или повреждённого груза.
        - Не выводи ответственность из ст. 7 ФЗ-87 — только из текста договора.
        - Не присваивай объявленную ценность по умолчанию. Фиксируй её только
          если прямо указано в договоре.
        - Не путай лимит ответственности за груз (утрата/повреждение) с общим
          лимитом ответственности экспедитора. Здесь фиксируем только лимит
          именно за утрату/повреждение груза.
        - Не путай ответственность за груз с ответственностью за действия третьих лиц.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Наличие условия об ответственности за утрату или повреждение груза.
        2. Основание определения ответственности: объявленная ценность, действительная стоимость, ограниченный лимит или неясно.
        3. Размер лимита ответственности за груз (если указан).
        4. Наличие механизма объявления ценности груза.
        5. Наличие условия об ответственности за просрочку доставки.
        6. Сформируй краткое пользовательское резюме для поля liability_limits_summary.
        7. Собери точные цитаты в evidence.

        [ПРАВИЛА]
        1. Используй только предоставленный текст договора.
        2. Если данные отсутствуют:
           - для статусных и перечислимых полей используй "not_defined";
           - для видимого текстового поля используй "Не установлено".
        3. Не используй null, None, пустые строки.
        4. Если текст есть, но надёжный вывод сделать нельзя:
           - для статусных и перечислимых полей используй "not_defined";
           - для видимого текстового поля используй "Не удалось определить".
        5. Если договор прямо указывает, что ответственность за утрату/повреждение не предусмотрена, используй:
           - liability_for_loss_clause = "no";
           - liability_limits_summary = "Не предусмотрено".
        6. Для liability_basis:
           - "declared_value", если ответственность определяется по объявленной ценности;
           - "actual_value", если ответственность определяется по действительной стоимости груза;
           - "limited", если ответственность ограничена конкретной суммой или стоимостью услуг;
           - "not_defined", если основание не определено или условие отсутствует.
        7. Не присваивай объявленную ценность по умолчанию. Если в договоре не указано, что клиент declares ценность, не фиксируй declared_value_mechanism = "yes".
        8. Не путай лимит ответственности за груз с общим лимитом ответственности экспедитора. Фиксируй только лимит именно за утрату/повреждение груза.
        9. Верни РОВНО один JSON-объект со всеми 7 ключами без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.
        10. В evidence включай только точные цитаты из документа. Если данных нет, верни пустой массив [].
        11. Поле liability_limits_summary должно быть кратким и не должно содержать длинных цитат.

        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1 — объявленная ценность, механизм объявления и просрочка:
        Фрагмент:
        "За утрату или повреждение груза Экспедитор несёт ответственность в размере объявленной ценности. Объявленная ценность указывается в Поручении экспедитору. За просрочку доставки Экспедитор уплачивает неустойку в размере 9% от вознаграждения за каждую просроченную неделю."
        Ответ:
        {
          "liability_for_loss_clause": "yes",
          "liability_basis": "declared_value",
          "liability_cap_amount": "объявленная ценность",
          "declared_value_mechanism": "yes",
          "delay_liability_clause": "yes",
          "liability_limits_summary": "Ответственность — в размере объявленной ценности, указанной в Поручении экспедитору; за просрочку — неустойка 9% от вознаграждения за неделю",
          "evidence": [
            {
              "clause_ref": "п. 6.2",
              "quote": "За утрату или повреждение груза Экспедитор несёт ответственность в размере объявленной ценности. Объявленная ценность указывается в Поручении экспедитору. За просрочку доставки Экспедитор уплачивает неустойку в размере 9% от вознаграждения за каждую просроченную неделю."
            }
          ]
        }

        Пример 2 — ограниченный лимит, без объявления ценности и просрочки:
        Фрагмент:
        "Ответственность Экспедитора за утрату или повреждение груза ограничена стоимостью услуг по экспедированию."
        Ответ:
        {
          "liability_for_loss_clause": "yes",
          "liability_basis": "limited",
          "liability_cap_amount": "стоимость услуг по экспедированию",
          "declared_value_mechanism": "no",
          "delay_liability_clause": "no",
          "liability_limits_summary": "Ответственность ограничена стоимостью услуг по экспедированию; механизм объявления ценности и ответственность за просрочку не предусмотрены",
          "evidence": [
            {
              "clause_ref": "п. 6.2",
              "quote": "Ответственность Экспедитора за утрату или повреждение груза ограничена стоимостью услуг по экспедированию."
            }
          ]
        }

        Пример 3 — текст есть, но надёжный вывод сделать нельзя:
        Фрагмент:
        "Ответственность Экспедитора за сохранность груза определяется в соответствии с действующим законодательством и условиями, согласованными сторонами."
        Ответ:
        {
          "liability_for_loss_clause": "not_defined",
          "liability_basis": "not_defined",
          "liability_cap_amount": "Не удалось определить",
          "declared_value_mechanism": "not_defined",
          "delay_liability_clause": "not_defined",
          "liability_limits_summary": "Не удалось определить",
          "evidence": [
            {
              "clause_ref": "п. 6.1",
              "quote": "Ответственность Экспедитора за сохранность груза определяется в соответствии с действующим законодательством и условиями, согласованными сторонами."
            }
          ]
        }

        Пример 4 — условие отсутствует:
        Фрагмент:
        "Экспедитор организует перевозку груза."
        Ответ:
        {
          "liability_for_loss_clause": "not_defined",
          "liability_basis": "not_defined",
          "liability_cap_amount": "Не установлено",
          "declared_value_mechanism": "not_defined",
          "delay_liability_clause": "not_defined",
          "liability_limits_summary": "Не установлено",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Есть ли прямое условие об ответственности за утрату/повреждение груза?
        2. Не присвоена ли объявленная ценность по умолчанию?
        3. Определено ли основание ответственности (объявленная ценность / действительная стоимость / ограниченный лимит)?
        4. Указан ли конкретный лимит ответственности за груз?
        5. Есть ли механизм объявления ценности?
        6. Есть ли ответственность за просрочку доставки?
        7. Не смешан ли лимит ответственности за груз с общим лимитом ответственности экспедитора?
        8. Если текст есть, но вывод невозможен, использовано ли "Не удалось определить"?
        9. Все ли 7 ключей присутствуют в ответе?
        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь РОВНО одним JSON-объектом без какого-либо дополнительного текста до или после, со всеми 7 ключами:
        {
          "liability_for_loss_clause": "<yes / no / not_defined>",
          "liability_basis": "<declared_value / actual_value / limited / not_defined>",
          "liability_cap_amount": "<размер лимита или 'Не установлено' / 'Не удалось определить'>",
          "declared_value_mechanism": "<yes / no / not_defined>",
          "delay_liability_clause": "<yes / no / not_defined>",
          "liability_limits_summary": "<краткое резюме или 'Не установлено' / 'Не предусмотрено' / 'Не удалось определить'>",
          "evidence": [{"clause_ref": "<пункт или раздел>", "quote": "<точная цитата>"}]
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 700

    retrieval:
      retrieval_profile: "liability_cap_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "ответственность за утрату груза ответственность за повреждение груза объявленная ценность объявленная стоимость действительная стоимость лимит ответственности за груз ограничение ответственности за груз просрочка доставки неустойка за просрочку ст. 7 ФЗ-87"
      boost_keywords:
        - "ответственность за утрату"
        - "ответственность за повреждение"
        - "объявленная ценность"
        - "объявленная стоимость"
        - "действительная стоимость"
        - "лимит ответственности за груз"
        - "ограничение ответственности за груз"
        - "просрочка доставки"
        - "неустойка за просрочку"
        - "механизм объявления ценности"
      preferred_unit_types:
        - liability_provision
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - limitations
        - remedies
      negative_keywords:
        - "страхование груза"
        - "удержание"
        - "форс-мажор"
        - "претензия"
        - "означает"
        - "в целях настоящего"
        - "лимит общей ответственности"
      position_bias:
        preferred_range: [0.40, 0.85]
        boost: 0.15
        scope: segment
      context_k: 6
      max_chunks: 8
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types: []
      preferred_clause_functions:
        - "limitations"
        - "remedies"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.12

    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 600

    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false
      llm_max_tokens: 900

      presence_signal:
        field: "liability_limits_and_cargo_value_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из договора транспортной экспедиции
        сведения об ответственности экспедитора за утрату или повреждение груза:
        наличие условия, основание определения ответственности, размер лимита,
        механизм объявления ценности и ответственность за просрочку доставки.

        Не анализируй страхование груза, удержание, ответственность за действия
        третьих лиц, оплату, претензии и иные темы, если они не содержат сведений
        об ответственности за утрату/повреждение груза или просрочку доставки.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. liability_limits_and_cargo_value_check_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если liability_for_loss_clause = "yes" или "no";
           - "missing" — если liability_for_loss_clause = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - liability_for_loss_clause = "not_defined";
           - liability_basis = "not_defined";
           - declared_value_mechanism = "not_defined";
           - delay_liability_clause = "not_defined";
           - liability_cap_amount = "Не установлено";
           - liability_limits_summary = "Не установлено";
           - не выполняй остальные шаги.

        1. liability_for_loss_clause — наличие условия об ответственности за утрату/повреждение груза:
           "yes", "no" или "not_defined".
        2. liability_basis — основание определения ответственности:
           "declared_value", "actual_value", "limited" или "not_defined".
        3. liability_cap_amount — размер лимита ответственности за груз.
        4. declared_value_mechanism — наличие механизма объявления ценности:
           "yes", "no" или "not_defined".
        5. delay_liability_clause — наличие ответственности за просрочку доставки:
           "yes", "no" или "not_defined".
        6. liability_limits_summary — краткое пользовательское резюме.
        7. evidence — массив точных цитат из договора.

        Правила заполнения:
        - Для liability_for_loss_clause: "yes", если прямо предусмотрена ответственность за утрату или повреждение груза; "no", если прямо указано, что такая ответственность не предусмотрена; "not_defined", если условие отсутствует или вывод невозможен.
        - Для liability_basis: "declared_value", если ответственность определяется по объявленной ценности груза; "actual_value", если ответственность определяется по действительной стоимости груза; "limited", если ответственность ограничена конкретной суммой или стоимостью услуг; "not_defined", если основание не определено или условие отсутствует.
        - Для liability_cap_amount: если размер лимита указан, верни его кратко; если лимит определяется через документ, верни, например, "Определяется по Приложению № 2"; если лимит не указан, верни "Не установлено"; если текст есть, но вывод невозможен, верни "Не удалось определить".
        - Для declared_value_mechanism: "yes", если прямо предусмотрен механизм объявления ценности (например, через Поручение экспедитору); "no", если прямо указано, что механизм объявления ценности не предусмотрен; "not_defined", если условие отсутствует.
        - Для delay_liability_clause: "yes", если прямо предусмотрена ответственность за просрочку доставки; "no", если прямо указано, что ответственность за просрочку не предусмотрена; "not_defined", если условие отсутствует.
        - Для liability_limits_summary: если ответственность и детали указаны, верни краткий факт; если ответственность ограничена лимитом, верни, например, "Ответственность ограничена стоимостью услуг по экспедированию; механизм объявления ценности не предусмотрен"; если ответственность прямо исключена, верни "Не предусмотрено"; если условие отсутствует, верни "Не установлено"; если текст есть, но надёжный вывод сделать нельзя, верни "Не удалось определить".
        - Не присваивай объявленную ценность по умолчанию.
        - Не путай лимит ответственности за груз с общим лимитом ответственности экспедитора.
        - Не путай ответственность за груз с ответственностью за действия третьих лиц.
        - Не выводи ответственность из ст. 7 ФЗ-87 — только из текста договора.
        - Если данных нет, верни пустой массив [] для evidence.
        </task>

        <context_rules>
        - Перед остальными полями заполни liability_limits_and_cargo_value_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined", liability_cap_amount = "Не установлено", liability_limits_summary = "Не установлено".
        - Используй только предоставленный контекст.
        - Не выдумывай размер лимита, основание ответственности и механизм объявления ценности.
        - Не присваивай объявленную ценность по умолчанию.
        - Не путай лимит ответственности за груз с общим лимитом ответственности экспедитора.
        - Не путай ответственность за груз с ответственностью за действия третьих лиц.
        - Не выводи ответственность из ст. 7 ФЗ-87 — только из текста договора.
        - Если фрагменты конфликтуют и не позволяют сделать надёжный вывод, верни "Не удалось определить" для liability_limits_summary и включи конфликтующие цитаты в evidence.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет упоминания ответственности за утрату/повреждение груза.
           → presence = "missing";
             liability_for_loss_clause = "not_defined";
             liability_limits_summary = "Не установлено".

        2. Неполное раскрытие темы.
           Ответственность за груз упомянута, но основание, лимит или механизм объявления ценности не указаны.
           → presence = "present";
             liability_for_loss_clause = "yes";
             соответствующие детали = "not_defined" или "Не установлено";
             liability_limits_summary = "Ответственность за груз предусмотрена; основание и лимит не указаны".

        3. Противоречие между фрагментами.
           В разных частях договора указаны разные основания ответственности или разные лимиты.
           → presence = "unclear";
             liability_limits_summary = "Не удалось определить".

        4. Прямое исключение.
           В договоре прямо указано, что ответственность за утрату/повреждение груза не предусмотрена.
           → presence = "present";
             liability_for_loss_clause = "no";
             liability_limits_summary = "Не предусмотрено".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для liability_limits_and_cargo_value_check_presence используй только: "present", "missing", "unclear".
        - Для статусных enum-полей используй только допустимые значения из списка.
        - Fallback при отсутствии данных:
          * liability_cap_amount → "Не установлено";
          * liability_limits_summary → "Не установлено".
        - Fallback при противоречии или неоднозначности:
          * liability_limits_summary → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "liability_limits_and_cargo_value_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования об ответственности за утрату/повреждение груза. Внутреннее агрегатное signal-поле."
          required: true

        - name: "liability_for_loss_clause"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Наличие условия об ответственности за утрату или повреждение груза. Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "liability_basis"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["declared_value", "actual_value", "limited", "not_defined"]
          description: "Основание определения ответственности за утрату или повреждение груза. Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "liability_cap_amount"
          type: "string"
          presentation: "fact"
          label: "Лимит ответственности за груз"
          description: >
            Размер лимита ответственности экспедитора за утрату или повреждение груза. Fallback: "Не установлено" / "Не удалось определить".
          required: true
          display_in_grid: false

        - name: "declared_value_mechanism"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Наличие механизма объявления ценности груза. Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "delay_liability_clause"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Наличие условия об ответственности за просрочку доставки. Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "liability_limits_summary"
          type: "string"
          presentation: "fact"
          label: "Ответственность за груз и просрочку"
          description: >
            Краткое описание ответственности экспедитора за утрату/повреждение груза и просрочку доставки, включая основание, лимит и механизм объявления ценности. Fallback: "Не установлено" / "Не удалось определить".
          required: true
          display_in_grid: true
          display_priority: 1

        - name: "evidence"
          type: "array"
          presentation: "diagnostic"
          description: "Точные цитаты из договора, подтверждающие извлечённые значения."
          required: true
          display_in_grid: false

      store_payload: true

  - id: delivery_deadline_and_delay_penalty_check
    name: "Срок доставки и ответственность за просрочку (ст. 9 ФЗ-87)"
    description: >
      Фактографическая проверка деталей срока доставки и санкций за просрочку:
      наличие и значение срока (конкретный / определяется в Поручении / отсутствует),
      тип санкции за просрочку, лимит неустойки и исключения для форс-мажора.
      Сам факт наличия ответственности за просрочку как часть общей ответственности
      за груз фиксируется в liability_limits_and_cargo_value_check.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "срок доставки"
        - "транзитное время"
        - "просрочка доставки"
        - "штраф за просрочку"
        - "неустойка за просрочку"
        - "неустойка за нарушение сроков"
        - "лимит неустойки"
        - "максимальная неустойка"
        - "форс-мажор при просрочке"
        - "ст. 9 ФЗ-87"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)срок\\s+доставк"
        - "(?i)транзитн(ое|ого)\\s+врем"
        - "(?i)просрочк(а|и)\\s+доставк"
        - "(?i)неустойк.*просрочк"
        - "(?i)штраф.*просрочк"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор транспортной экспедиции (ст. 9 ФЗ-87).

        Проверяется только один вопрос: детали срока доставки и санкций за просрочку.

        Нормативный ориентир:
        - ст. 9 ФЗ-87 «О транспортно-экспедиционной деятельности».

        Важно:
        - Твоя задача — не оценивать серьёзность риска.
        - Только установить, что прямо есть в тексте договора, а чего прямо нет.
        - Не путай срок доставки со сроком действия договора.
        - Не присваивай санкции за просрочку по умолчанию. Фиксируй их только
          если прямо указано в тексте договора.
        - Не путай неустойку за просрочку доставки с ответственностью за утрату
          или повреждение груза.
        - Сам факт наличия ответственности за просрочку фиксируется в другом чеке.
          Здесь извлекаем детали: срок, тип санкции, лимит, форс-мажор.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Указан ли срок доставки (конкретный / определяется в Поручении / отсутствует).
        2. Значение срока доставки или механизм его определения.
        3. Предусмотрена ли неустойка/штраф за просрочку доставки.
        4. Тип санкции за просрочку (процент в день / фиксированная сумма / только убытки).
        5. Лимит неустойки за просрочку.
        6. Исключения для форс-мажора при просрочке.
        7. Сформируй краткое пользовательское резюме для поля delivery_deadline_summary.
        8. Собери точные цитаты в evidence.

        [ПРАВИЛА]
        1. Используй только предоставленный текст договора.
        2. Если данные отсутствуют:
           - для статусных и перечислимых полей используй "not_defined";
           - для видимых текстовых полей используй "Не установлено".
        3. Не используй null, None, пустые строки.
        4. Если текст есть, но надёжный вывод сделать нельзя:
           - для статусных и перечислимых полей используй "not_defined";
           - для видимых текстовых полей используй "Не удалось определить".
        5. Если договор прямо указывает, что срок доставки не установлен, используй:
           - delivery_deadline_specified = "no";
           - delivery_deadline_summary = "Срок доставки не установлен".
        6. Для delivery_deadline_specified:
           - "yes", если указан конкретный срок доставки;
           - "per_order", если срок определяется в Поручении экспедитору или заявке;
           - "no", если прямо указано, что срок доставки не устанавливается;
           - "not_defined", если условие отсутствует.
        7. Для delay_penalty_type:
           - "percentage_per_day", если неустойка начисляется в процентах за каждый день просрочки;
           - "fixed", если указана фиксированная сумма;
           - "damages_only", если возмещаются только убытки без неустойки;
           - "not_defined", если тип не указан или условие отсутствует.
        8. Для force_majeure_for_delay:
           - "yes", если прямо указано, что форс-мажор освобождает от неустойки за просрочку;
           - "no", если прямо указано, что форс-мажор не освобождает;
           - "not_defined", если условие отсутствует.
        9. Не присваивай санкции за просрочку по умолчанию. Фиксируй только если прямо указано.
        10. Не путай срок доставки со сроком действия договора.
        11. Верни РОВНО один JSON-объект со всеми 8 ключами без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.
        12. В evidence включай только точные цитаты из документа. Если данных нет, верни пустой массив [].
        13. Поле delivery_deadline_summary должно быть кратким и не должно содержать длинных цитат.

        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1 — конкретный срок, неустойка в процентах с лимитом и форс-мажором:
        Фрагмент:
        "Срок доставки груза составляет 5 рабочих дней с даты приёма груза. За просрочку доставки Экспедитор уплачивает неустойку в размере 0,1% от вознаграждения за каждый день просрочки, но не более 50% вознаграждения. Неустойка не уплачивается при форс-мажоре."
        Ответ:
        {
          "delivery_deadline_specified": "yes",
          "deadline_value": "5 рабочих дней с даты приёма груза",
          "delay_penalty_present": "yes",
          "delay_penalty_type": "percentage_per_day",
          "delay_penalty_cap": "не более 50% вознаграждения",
          "force_majeure_for_delay": "yes",
          "delivery_deadline_summary": "Срок доставки — 5 рабочих дней с даты приёма; неустойка 0,1% в день, не более 50% вознаграждения; форс-мажор освобождает от неустойки",
          "evidence": [
            {
              "clause_ref": "п. 4.1",
              "quote": "Срок доставки груза составляет 5 рабочих дней с даты приёма груза. За просрочку доставки Экспедитор уплачивает неустойку в размере 0,1% от вознаграждения за каждый день просрочки, но не более 50% вознаграждения. Неустойка не уплачивается при форс-мажоре."
            }
          ]
        }

        Пример 2 — срок определяется в Поручении, санкций нет:
        Фрагмент:
        "Срок доставки определяется в каждом Поручении экспедитору."
        Ответ:
        {
          "delivery_deadline_specified": "per_order",
          "deadline_value": "Определяется по Поручению экспедитору",
          "delay_penalty_present": "no",
          "delay_penalty_type": "not_defined",
          "delay_penalty_cap": "Не установлено",
          "force_majeure_for_delay": "not_defined",
          "delivery_deadline_summary": "Срок доставки определяется в Поручении экспедитору; неустойка за просрочку не предусмотрена",
          "evidence": [
            {
              "clause_ref": "п. 4.1",
              "quote": "Срок доставки определяется в каждом Поручении экспедитору."
            }
          ]
        }

        Пример 3 — текст есть, но надёжный вывод сделать нельзя:
        Фрагмент:
        "Сроки и условия доставки согласовываются сторонами в каждом конкретном случае."
        Ответ:
        {
          "delivery_deadline_specified": "not_defined",
          "deadline_value": "Не удалось определить",
          "delay_penalty_present": "not_defined",
          "delay_penalty_type": "not_defined",
          "delay_penalty_cap": "Не удалось определить",
          "force_majeure_for_delay": "not_defined",
          "delivery_deadline_summary": "Не удалось определить",
          "evidence": [
            {
              "clause_ref": "п. 4.2",
              "quote": "Сроки и условия доставки согласовываются сторонами в каждом конкретном случае."
            }
          ]
        }

        Пример 4 — условие отсутствует:
        Фрагмент:
        "Экспедитор организует перевозку груза."
        Ответ:
        {
          "delivery_deadline_specified": "not_defined",
          "deadline_value": "Не установлено",
          "delay_penalty_present": "not_defined",
          "delay_penalty_type": "not_defined",
          "delay_penalty_cap": "Не установлено",
          "force_majeure_for_delay": "not_defined",
          "delivery_deadline_summary": "Не установлено",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Указан ли конкретный срок доставки или порядок его определения?
        2. Не присвоен ли срок доставки по умолчанию?
        3. Не смешан ли срок доставки со сроком действия договора?
        4. Извлечено ли значение срока?
        5. Предусмотрена ли неустойка за просрочку?
        6. Указан ли тип и лимит неустойки?
        7. Есть ли исключение для форс-мажора?
        8. Если текст есть, но вывод невозможен, использовано ли "Не удалось определить"?
        9. Все ли 8 ключей присутствуют в ответе?
        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь РОВНО одним JSON-объектом без какого-либо дополнительного текста до или после, со всеми 8 ключами:
        {
          "delivery_deadline_specified": "<yes / no / per_order / not_defined>",
          "deadline_value": "<значение срока или 'Не установлено' / 'Не удалось определить' / 'Определяется по ...'>",
          "delay_penalty_present": "<yes / no / not_defined>",
          "delay_penalty_type": "<percentage_per_day / fixed / damages_only / not_defined>",
          "delay_penalty_cap": "<лимит неустойки или 'Не установлено' / 'Не удалось определить'>",
          "force_majeure_for_delay": "<yes / no / not_defined>",
          "delivery_deadline_summary": "<краткое резюме или 'Не установлено' / 'Срок доставки не установлен' / 'Не удалось определить'>",
          "evidence": [{"clause_ref": "<пункт или раздел>", "quote": "<точная цитата>"}]
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 700

    retrieval:
      retrieval_profile: "completion_deadline_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "срок доставки транзитное время просрочка доставки штраф за просрочку неустойка за просрочку неустойка за нарушение сроков лимит неустойки максимальная неустойка форс-мажор при просрочке ст. 9 ФЗ-87"
      boost_keywords:
        - "срок доставки"
        - "транзитное время"
        - "просрочка доставки"
        - "штраф за просрочку"
        - "неустойка за просрочку"
        - "лимит неустойки"
        - "форс-мажор при просрочке"
      preferred_unit_types:
        - obligation
        - liability_provision
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - procedures
        - remedies
      negative_keywords:
        - "страхование"
        - "удержание"
        - "таможенное оформление"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.25, 0.80]
        boost: 0.15
        scope: segment
      context_k: 6
      max_chunks: 8
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types: []
      preferred_clause_functions:
        - "procedures"
        - "remedies"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 35
      max_snippet_length: 550

    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false
      llm_max_tokens: 900

      presence_signal:
        field: "delivery_deadline_and_delay_penalty_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из договора транспортной экспедиции
        сведения о сроке доставки и санкциях за просрочку: наличие и значение
        срока, тип санкции, лимит неустойки и исключения для форс-мажора.

        Не анализируй страхование, удержание, ответственность за утрату/повреждение
        груза, оплату, претензии и иные темы, если они не содержат сведений о
        сроке доставки или просрочке доставки.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. delivery_deadline_and_delay_penalty_check_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (delivery_deadline_specified, delay_penalty_present) ≠ "not_defined";
           - "missing" — если оба содержательных поля = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - delivery_deadline_specified = "not_defined";
           - delay_penalty_present = "not_defined";
           - delay_penalty_type = "not_defined";
           - force_majeure_for_delay = "not_defined";
           - deadline_value, delay_penalty_cap = "Не установлено";
           - delivery_deadline_summary = "Не установлено";
           - не выполняй остальные шаги.

        1. delivery_deadline_specified — указан ли срок доставки:
           "yes", "no", "per_order" или "not_defined".
        2. deadline_value — значение срока доставки или механизм его определения.
        3. delay_penalty_present — предусмотрена ли неустойка за просрочку:
           "yes", "no" или "not_defined".
        4. delay_penalty_type — тип санкции за просрочку:
           "percentage_per_day", "fixed", "damages_only" или "not_defined".
        5. delay_penalty_cap — лимит неустойки за просрочку.
        6. force_majeure_for_delay — освобождает ли форс-мажор от неустойки:
           "yes", "no" или "not_defined".
        7. delivery_deadline_summary — краткое пользовательское резюме.
        8. evidence — массив точных цитат из договора.

        Правила заполнения:
        - Для delivery_deadline_specified: "yes", если указан конкретный срок; "per_order", если определяется в Поручении; "no", если прямо указано, что не устанавливается; "not_defined", если отсутствует.
        - Для deadline_value: если срок указан, верни его кратко; если определяется через документ, верни "Определяется по ..."; если не указан, верни "Не установлено".
        - Для delay_penalty_present: "yes", если прямо предусмотрена; "no", если прямо указано, что не предусмотрена; "not_defined", если отсутствует.
        - Для delay_penalty_type: "percentage_per_day", "fixed", "damages_only" или "not_defined".
        - Для delay_penalty_cap: если лимит указан, верни его кратко; если не указан, верни "Не установлено".
        - Для force_majeure_for_delay: "yes", если освобождает; "no", если не освобождает; "not_defined", если отсутствует.
        - Для delivery_deadline_summary: если срок и санкции указаны, верни краткий факт; если срок прямо не установлен, верни "Срок доставки не установлен"; если условие отсутствует, верни "Не установлено"; если вывод невозможен, верни "Не удалось определить".
        - Не присваивай санкции за просрочку по умолчанию. Не путай срок доставки со сроком действия договора.
        - Если данных нет, верни пустой массив [] для evidence.
        </task>

        <context_rules>
        - Перед остальными полями заполни delivery_deadline_and_delay_penalty_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined", deadline_value и delay_penalty_cap = "Не установлено", delivery_deadline_summary = "Не установлено".
        - Используй только предоставленный контекст.
        - Не выдумывай срок доставки, тип санкции, лимит неустойки и исключения для форс-мажора.
        - Не присваивай санкции за просрочку по умолчанию.
        - Не путай срок доставки со сроком действия договора.
        - Не путай неустойку за просрочку доставки с ответственностью за утрату или повреждение груза.
        - Если фрагменты конфликтуют и не позволяют сделать надёжный вывод, верни "Не удалось определить" для delivery_deadline_summary и включи конфликтующие цитаты в evidence.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет упоминания срока доставки или санкций за просрочку.
           → presence = "missing";
             delivery_deadline_specified = delay_penalty_present = "not_defined";
             delivery_deadline_summary = "Не установлено".

        2. Неполное раскрытие темы.
           Срок доставки указан (или определяется в Поручении), но санкции за просрочку не предусмотрены.
           → presence = "present";
             delivery_deadline_specified = "yes" или "per_order";
             delay_penalty_present = "no";
             delivery_deadline_summary = "Срок доставки указан; неустойка за просрочку не предусмотрена".

        3. Противоречие между фрагментами.
           В разных частях договора указаны разные сроки доставки или разные лимиты неустойки.
           → presence = "unclear";
             delivery_deadline_summary = "Не удалось определить".

        4. Прямое исключение.
           В договоре прямо указано, что срок доставки не устанавливается.
           → presence = "present";
             delivery_deadline_specified = "no";
             delivery_deadline_summary = "Срок доставки не установлен".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для delivery_deadline_and_delay_penalty_check_presence используй только: "present", "missing", "unclear".
        - Для статусных enum-полей используй только допустимые значения из списка.
        - Fallback при отсутствии данных:
          * deadline_value, delay_penalty_cap → "Не установлено";
          * delivery_deadline_summary → "Не установлено".
        - Fallback при противоречии или неоднозначности:
          * delivery_deadline_summary → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "delivery_deadline_and_delay_penalty_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования о сроке доставки и просрочке. Внутреннее агрегатное signal-поле."
          required: true

        - name: "delivery_deadline_specified"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["yes", "no", "per_order", "not_defined"]
          description: "Указан ли срок доставки. Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "deadline_value"
          type: "string"
          presentation: "fact"
          label: "Срок доставки"
          description: >
            Значение срока доставки или механизм его определения. Fallback: "Не установлено" / "Не удалось определить".
          required: true
          display_in_grid: false

        - name: "delay_penalty_present"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Наличие неустойки за просрочку доставки. Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "delay_penalty_type"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["percentage_per_day", "fixed", "damages_only", "not_defined"]
          description: "Тип санкции за просрочку доставки. Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "delay_penalty_cap"
          type: "string"
          presentation: "fact"
          label: "Лимит неустойки за просрочку"
          description: >
            Лимит неустойки за просрочку доставки. Fallback: "Не установлено" / "Не удалось определить".
          required: true
          display_in_grid: false

        - name: "force_majeure_for_delay"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Освобождает ли форс-мажор от неустойки за просрочку доставки. Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "delivery_deadline_summary"
          type: "string"
          presentation: "fact"
          label: "Срок доставки и просрочка"
          description: >
            Краткое описание срока доставки и санкций за просрочку: значение срока, тип санкции, лимит неустойки и исключения для форс-мажора. Fallback: "Не установлено" / "Не удалось определить".
          required: true
          display_in_grid: true
          display_priority: 1

        - name: "evidence"
          type: "array"
          presentation: "diagnostic"
          description: "Точные цитаты из договора, подтверждающие извлечённые значения."
          required: true
          display_in_grid: false

      store_payload: true

  - id: forwarder_information_duties_check
    name: "Информационные обязанности экспедитора перед клиентом"
    description: >
      Фактографическая проверка обязанностей экспедитора по информированию клиента:
      отслеживание груза, уведомление о задержках и повреждениях/утрате, срок
      уведомления и регулярная отчётность о ходе доставки.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "информирование клиента"
        - "уведомление о задержке"
        - "уведомление о повреждении"
        - "уведомление об утрате"
        - "отслеживание груза"
        - "статус доставки"
        - "обязан уведомить"
        - "немедленно сообщить"
        - "проблемы с доставкой"
        - "регулярная отчётность"
        - "отчёт о ходе доставки"
        - "информация о движении груза"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)информирова(ть|ние)\\s+клиент"
        - "(?i)уведом(ить|ление|лять)\\s+о\\s+задержк"
        - "(?i)уведом(ить|ление|лять)\\s+о\\s+поврежден"
        - "(?i)уведом(ить|ление|лять)\\s+о\\s+утрат"
        - "(?i)немедленно\\s+сообщить"
        - "(?i)отслежива(ть|ние)\\s+груз"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор транспортной экспедиции (ФЗ-87).

        Проверяется только один вопрос: информационные обязанности экспедитора
        перед клиентом в ходе исполнения договора.

        Важно:
        - Твоя задача — не оценивать серьёзность риска.
        - Только установить, что прямо есть в тексте договора, а чего прямо нет.
        - Не присваивай информационные обязанности по умолчанию. Фиксируй их
          только если прямо указано в тексте договора.
        - Не путай уведомления о задержках с уведомлениями о повреждениях/утрате —
          это разные обязанности.
        - Не считай регулярную отчётность существующей, если упомянуто только
          разовое уведомление о событии.
        - Не путай информационные обязанности в ходе доставки с отчётом
          экспедитора по расходам после оказания услуг.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Обязанность отслеживания груза.
        2. Обязанность уведомлять о задержках доставки.
        3. Обязанность уведомлять о повреждениях или утрате груза.
        4. Срок уведомления о задержках/повреждениях/утрате.
        5. Предусмотрена ли регулярная отчётность о ходе доставки.
        6. Сформируй краткое пользовательское резюме для поля information_duties_summary,
           включая оценку полноты информационных обязанностей (полный набор / частичный набор / минимальный набор / отсутствуют).
        7. Собери точные цитаты в evidence.

        [ПРАВИЛА]
        1. Используй только предоставленный текст договора.
        2. Если данные отсутствуют:
           - для статусных и перечислимых полей используй "not_defined";
           - для видимых текстовых полей используй "Не установлено".
        3. Не используй null, None, пустые строки.
        4. Если текст есть, но надёжный вывод сделать нельзя:
           - для статусных и перечислимых полей используй "not_defined";
           - для видимых текстовых полей используй "Не удалось определить".
        5. Если договор прямо указывает, что информационные обязанности не предусмотрены, используй:
           - information_duties_summary = "Не предусмотрены".
        6. Не присваивай обязанности по умолчанию. Фиксируй только если прямо указано.
        7. Не путай уведомления о задержках с уведомлениями о повреждениях/утрате.
        8. Не считай регулярную отчётность существующей, если упомянуто только разовое уведомление о событии.
        9. Верни РОВНО один JSON-объект со всеми 7 ключами без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.
        10. В evidence включай только точные цитаты из документа. Если данных нет, верни пустой массив [].
        11. Поле information_duties_summary должно быть кратким и не должно содержать длинных цитат.

        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1 — полный набор информационных обязанностей:
        Фрагмент:
        "Экспедитор обязан отслеживать груз и информировать Клиента о статусе доставки не реже одного раза в сутки. При задержке или повреждении груза Экспедитор немедленно уведомляет Клиента."
        Ответ:
        {
          "tracking_obligation": "yes",
          "delay_notification_duty": "yes",
          "damage_notification_duty": "yes",
          "notification_deadline": "немедленно",
          "regular_reporting": "yes",
          "information_duties_summary": "Полный набор обязанностей: отслеживание груза, информирование о статусе не реже раза в сутки, немедленное уведомление о задержках и повреждениях",
          "evidence": [
            {
              "clause_ref": "п. 5.1",
              "quote": "Экспедитор обязан отслеживать груз и информировать Клиента о статусе доставки не реже одного раза в сутки. При задержке или повреждении груза Экспедитор немедленно уведомляет Клиента."
            }
          ]
        }

        Пример 2 — частичный набор обязанностей:
        Фрагмент:
        "Экспедитор уведомляет Клиента о задержках доставки в течение 24 часов с момента выявления задержки."
        Ответ:
        {
          "tracking_obligation": "not_defined",
          "delay_notification_duty": "yes",
          "damage_notification_duty": "not_defined",
          "notification_deadline": "в течение 24 часов с момента выявления задержки",
          "regular_reporting": "no",
          "information_duties_summary": "Частичный набор обязанностей: уведомление о задержках в течение 24 часов; отслеживание, уведомления о повреждениях и регулярная отчётность не указаны",
          "evidence": [
            {
              "clause_ref": "п. 5.2",
              "quote": "Экспедитор уведомляет Клиента о задержках доставки в течение 24 часов с момента выявления задержки."
            }
          ]
        }

        Пример 3 — текст есть, но надёжный вывод сделать нельзя:
        Фрагмент:
        "Экспедитор информирует Клиента о ходе исполнения договора в порядке, определяемом сторонами."
        Ответ:
        {
          "tracking_obligation": "not_defined",
          "delay_notification_duty": "not_defined",
          "damage_notification_duty": "not_defined",
          "notification_deadline": "Не удалось определить",
          "regular_reporting": "not_defined",
          "information_duties_summary": "Не удалось определить",
          "evidence": [
            {
              "clause_ref": "п. 5.3",
              "quote": "Экспедитор информирует Клиента о ходе исполнения договора в порядке, определяемом сторонами."
            }
          ]
        }

        Пример 4 — условие отсутствует:
        Фрагмент:
        "Экспедитор организует перевозку груза."
        Ответ:
        {
          "tracking_obligation": "not_defined",
          "delay_notification_duty": "not_defined",
          "damage_notification_duty": "not_defined",
          "notification_deadline": "Не установлено",
          "regular_reporting": "not_defined",
          "information_duties_summary": "Не установлено",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Есть ли обязанность отслеживания груза?
        2. Есть ли обязанность уведомления о задержках?
        3. Есть ли обязанность уведомления о повреждениях/утрате?
        4. Не смешаны ли уведомления о задержках с уведомлениями о повреждениях?
        5. Указан ли срок уведомления?
        6. Есть ли регулярная отчётность (а не только разовое уведомление)?
        7. Если текст есть, но вывод невозможен, использовано ли "Не удалось определить"?
        8. Все ли 7 ключей присутствуют в ответе?
        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь РОВНО одним JSON-объектом без какого-либо дополнительного текста до или после, со всеми 7 ключами:
        {
          "tracking_obligation": "<yes / no / not_defined>",
          "delay_notification_duty": "<yes / no / not_defined>",
          "damage_notification_duty": "<yes / no / not_defined>",
          "notification_deadline": "<срок уведомления или 'Не установлено' / 'Не удалось определить'>",
          "regular_reporting": "<yes / no / not_defined>",
          "information_duties_summary": "<краткое резюме с оценкой полноты или 'Не установлено' / 'Не предусмотрены' / 'Не удалось определить'>",
          "evidence": [{"clause_ref": "<пункт или раздел>", "quote": "<точная цитата>"}]
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 700

    retrieval:
      retrieval_profile: "notice_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "информирование клиента уведомление о задержке уведомление о повреждении уведомление об утрате отслеживание груза статус доставки обязан уведомить немедленно сообщить регулярная отчётность отчёт о ходе доставки"
      boost_keywords:
        - "информирование клиента"
        - "уведомление о задержке"
        - "уведомление о повреждении"
        - "уведомление об утрате"
        - "отслеживание груза"
        - "статус доставки"
        - "немедленно сообщить"
        - "регулярная отчётность"
        - "отчёт о ходе доставки"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - procedures
      negative_keywords:
        - "ответственность"
        - "страхование"
        - "удержание"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.20, 0.70]
        boost: 0.12
        scope: segment
      context_k: 6
      max_chunks: 8
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types: []
      preferred_clause_functions:
        - "obligations"
        - "procedures"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 30
      max_snippet_length: 500

    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false
      llm_max_tokens: 900

      presence_signal:
        field: "forwarder_information_duties_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из договора транспортной экспедиции
        сведения об информационных обязанностях экспедитора перед клиентом:
        отслеживание груза, уведомления о задержках, уведомления о повреждениях
        или утрате, срок уведомления и регулярная отчётность.

        Не анализируй ответственность, страхование, удержание, оплату, претензии
        и иные темы, если они не содержат сведений об информационных обязанностях
        экспедитора в ходе исполнения договора.

        Не путай информационные обязанности в ходе доставки с отчётом экспедитора
        по расходам после оказания услуг.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. forwarder_information_duties_check_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (tracking_obligation, delay_notification_duty, damage_notification_duty, regular_reporting) ≠ "not_defined";
           - "missing" — если все четыре содержательных поля = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - tracking_obligation = "not_defined";
           - delay_notification_duty = "not_defined";
           - damage_notification_duty = "not_defined";
           - regular_reporting = "not_defined";
           - notification_deadline = "Не установлено";
           - information_duties_summary = "Не установлено";
           - не выполняй остальные шаги.

        1. tracking_obligation — обязанность отслеживания груза:
           "yes", "no" или "not_defined".
        2. delay_notification_duty — обязанность уведомлять о задержках:
           "yes", "no" или "not_defined".
        3. damage_notification_duty — обязанность уведомлять о повреждениях/утрате:
           "yes", "no" или "not_defined".
        4. notification_deadline — срок уведомления о задержках/повреждениях/утрате.
        5. regular_reporting — регулярная отчётность о ходе доставки:
           "yes", "no" или "not_defined".
        6. information_duties_summary — краткое пользовательское резюме с оценкой полноты.
        7. evidence — массив точных цитат из договора.

        Правила заполнения:
        - Для tracking_obligation: "yes", если прямо предусмотрена; "no", если прямо указано, что не предусмотрена; "not_defined", если отсутствует.
        - Для delay_notification_duty: "yes", если прямо предусмотрена; "no", если прямо указано, что не предусмотрена; "not_defined", если отсутствует.
        - Для damage_notification_duty: "yes", если прямо предусмотрена; "no", если прямо указано, что не предусмотрена; "not_defined", если отсутствует.
        - Для notification_deadline: если срок указан, верни его кратко; если не указан, верни "Не установлено".
        - Для regular_reporting: "yes", если прямо предусмотрена регулярная отчётность; "no", если прямо указано, что не предусмотрена; "not_defined", если отсутствует.
        - Для information_duties_summary: если обязанности указаны, верни краткий факт с оценкой полноты; если обязанности минимальные, верни "Минимальный набор обязанностей..."; если прямо исключены, верни "Не предусмотрены"; если отсутствуют, верни "Не установлено".
        - Не присваивай обязанности по умолчанию. Не путай уведомления о задержках с уведомлениями о повреждениях. Не путай с отчётом по расходам.
        - Если данных нет, верни пустой массив [] для evidence.
        </task>

        <context_rules>
        - Перед остальными полями заполни forwarder_information_duties_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined", notification_deadline = "Не установлено", information_duties_summary = "Не установлено".
        - Используй только предоставленный контекст.
        - Не выдумывай обязанности, срок уведомления и регулярную отчётность.
        - Не присваивай обязанности по умолчанию.
        - Не путай уведомления о задержках с уведомлениями о повреждениях/утрате.
        - Не считай регулярную отчётность существующей, если упомянуто только разовое уведомление.
        - Не путай информационные обязанности в ходе доставки с отчётом экспедитора по расходам.
        - Если фрагменты конфликтуют и не позволяют сделать надёжный вывод, верни "Не удалось определить" для information_duties_summary и включи конфликтующие цитаты в evidence.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет упоминания информационных обязанностей экспедитора.
           → presence = "missing";
             все *_status = "not_defined";
             information_duties_summary = "Не установлено".

        2. Неполное раскрытие темы.
           Упомянута только обязанность уведомлять о задержках, без отслеживания и регулярной отчётности.
           → presence = "present";
             delay_notification_duty = "yes";
             остальные = "not_defined";
             information_duties_summary = "Частичный набор обязанностей...".

        3. Противоречие между фрагментами.
           В разных частях договора указаны разные сроки уведомления или противоречащие друг другу обязанности.
           → presence = "unclear";
             information_duties_summary = "Не удалось определить".

        4. Прямое исключение.
           В договоре прямо указано, что экспедитор не несёт информационных обязанностей.
           → presence = "present";
             все *_status = "no";
             information_duties_summary = "Не предусмотрены".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для forwarder_information_duties_check_presence используй только: "present", "missing", "unclear".
        - Для статусных enum-полей используй только: "yes", "no", "not_defined".
        - Fallback при отсутствии данных:
          * notification_deadline → "Не установлено";
          * information_duties_summary → "Не установлено".
        - Fallback при противоречии или неоднозначности:
          * information_duties_summary → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "forwarder_information_duties_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования об информационных обязанностях. Внутреннее агрегатное signal-поле."
          required: true

        - name: "tracking_obligation"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Обязанность экспедитора отслеживать груз. Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "delay_notification_duty"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Обязанность экспедитора уведомлять клиента о задержках доставки. Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "damage_notification_duty"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Обязанность экспедитора уведомлять клиента о повреждениях или утрате груза. Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "notification_deadline"
          type: "string"
          presentation: "fact"
          label: "Срок уведомления"
          description: >
            Срок уведомления о задержках, повреждениях или утрате груза. Fallback: "Не установлено" / "Не удалось определить".
          required: true
          display_in_grid: false

        - name: "regular_reporting"
          type: "string"
          presentation: "signal"
          risk_weight: "low"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Регулярная отчётность экспедитора о ходе доставки. Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "information_duties_summary"
          type: "string"
          presentation: "fact"
          label: "Информационные обязанности экспедитора"
          description: >
            Краткое описание информационных обязанностей экспедитора с оценкой полноты: отслеживание, уведомления о задержках и повреждениях, срок уведомления, регулярная отчётность. Fallback: "Не установлено" / "Не удалось определить".
          required: true
          display_in_grid: true
          display_priority: 1

        - name: "evidence"
          type: "array"
          presentation: "diagnostic"
          description: "Точные цитаты из договора, подтверждающие извлечённые значения."
          required: true
          display_in_grid: false

      store_payload: true

  - id: dangerous_cargo_duties_check
    name: "Опасный груз: обязанности клиента и экспедитора (ДОПОГ/ADR)"
    description: >
      Фактографическая проверка распределения обязанностей при экспедировании
      опасных грузов: раскрытие класса опасности клиентом, указание класса
      опасности, требования к специальной упаковке, распределение ответственности
      за разрешения, требование аварийной карточки и ответственность за
      нераскрытие опасных свойств.
    triggers:
      any: ["dangerous_cargo_handling"]
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "опасный груз"
        - "класс опасности"
        - "ДОПОГ"
        - "ADR"
        - "маркировка опасного груза"
        - "разрешение на перевозку"
        - "аварийная карточка"
        - "информирование об опасных свойствах"
        - "раскрытие опасных свойств"
        - "специальная упаковка"
        - "нераскрытие опасных свойств"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)опасн(ый|ого|ому|ым|ом)\\s+груз"
        - "(?i)класс\\s+опасност"
        - "(?i)ДОПОГ|ADR"
        - "(?i)аварийн(ая|ой|ую)\\s+карточк"
        - "(?i)нераскрыт.*опасн.*свойств"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор транспортной экспедиции опасного груза
        (ДОПОГ/ADR, ФЗ-87, ФЗ-116).

        Проверяется только один вопрос: распределение обязанностей
        при экспедировании опасных грузов.

        Нормативный ориентир:
        - ДОПОГ/ADR;
        - ФЗ-87 «О транспортно-экспедиционной деятельности»;
        - ФЗ-116 «О промышленной безопасности опасных производственных объектов».

        Важно:
        - Твоя задача — не оценивать серьёзность риска.
        - Только установить, что прямо есть в тексте договора, а чего прямо нет.
        - Не выводи обязанности из ДОПОГ/ADR по умолчанию. Фиксируй только то,
          что прямо указано в тексте договора.
        - Не присваивай наличие условий по опасному грузу по умолчанию.
          Если в договоре нет раздела или условий об опасном грузе,
          фиксируй dangerous_cargo_clause_present = "no" или "not_defined".
        - Различай обязанности клиента и экспедитора.
        - Не считай «shared» ответственность за разрешения существующей,
          если она прямо не указана в договоре.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Наличие условий по опасному грузу (раздел, статья, пункт).
        2. Обязанность клиента раскрыть опасные свойства груза.
        3. Указание класса опасности.
        4. Требования к специальной упаковке и маркировке.
        5. Распределение ответственности за разрешения на перевозку опасного груза.
        6. Требование аварийной карточки (информационной таблицы опасности).
        7. Ответственность за нераскрытие опасных свойств.
        8. Сформируй краткое пользовательское резюме для поля dangerous_cargo_summary.
        9. Собери точные цитаты в evidence.

        [ПРАВИЛА]
        1. Используй только предоставленный текст договора.
        2. Если данные отсутствуют:
           - для статусных и перечислимых полей используй "not_defined";
           - для видимого текстового поля используй "Не установлено".
        3. Не используй null, None, пустые строки.
        4. Если текст есть, но надёжный вывод сделать нельзя:
           - для статусных и перечислимых полей используй "not_defined";
           - для видимого текстового поля используй "Не удалось определить".
        5. Если договор прямо указывает, что опасный груз не перевозится или условия по опасному грузу не применяются, используй:
           - dangerous_cargo_clause_present = "no";
           - dangerous_cargo_summary = "Не применяется".
        6. Не выводи обязанности из ДОПОГ/ADR по умолчанию. Фиксируй только если прямо указано в договоре.
        7. Различай обязанности клиента и экспедитора.
        8. Для permits_responsibility:
           - "client", если ответственность за разрешения несёт клиент;
           - "forwarder", если ответственность за разрешения несёт экспедитор;
           - "shared", если прямо указано совместное распределение;
           - "not_defined", если условие отсутствует.
        9. Верни РОВНО один JSON-объект со всеми 9 ключами без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.
        10. В evidence включай только точные цитаты из документа. Если данных нет, верни пустой массив [].
        11. Поле dangerous_cargo_summary должно быть кратким и не должно содержать длинных цитат.

        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1 — полный набор обязанностей по опасному грузу:
        Фрагмент:
        "Клиент обязан предоставить полную информацию о классе опасности, свойствах и требованиях к упаковке груза в соответствии с ДОПОГ. Клиент обеспечивает маркировку и аварийную карточку. Ответственность за нераскрытие опасных свойств несёт Клиент. Разрешения на перевозку опасного груза оформляет Экспедитор."
        Ответ:
        {
          "dangerous_cargo_clause_present": "yes",
          "client_disclosure_duty": "yes",
          "hazard_class_specification": "yes",
          "special_packaging_requirements": "yes",
          "permits_responsibility": "forwarder",
          "emergency_card_required": "yes",
          "liability_for_non_disclosure": "yes",
          "dangerous_cargo_summary": "Полный набор условий: клиент раскрывает класс опасности и свойства, обеспечивает маркировку и аварийную карточку; разрешения оформляет экспедитор; ответственность за нераскрытие — на клиенте",
          "evidence": [
            {
              "clause_ref": "п. 6.1",
              "quote": "Клиент обязан предоставить полную информацию о классе опасности, свойствах и требованиях к упаковке груза в соответствии с ДОПОГ. Клиент обеспечивает маркировку и аварийную карточку. Ответственность за нераскрытие опасных свойств несёт Клиент. Разрешения на перевозку опасного груза оформляет Экспедитор."
            }
          ]
        }

        Пример 2 — частичный набор обязанностей:
        Фрагмент:
        "При перевозке опасного груза Клиент обязан указать класс опасности в Поручении экспедитору."
        Ответ:
        {
          "dangerous_cargo_clause_present": "yes",
          "client_disclosure_duty": "yes",
          "hazard_class_specification": "yes",
          "special_packaging_requirements": "not_defined",
          "permits_responsibility": "not_defined",
          "emergency_card_required": "not_defined",
          "liability_for_non_disclosure": "not_defined",
          "dangerous_cargo_summary": "Частичный набор условий: клиент указывает класс опасности в Поручении; требования к упаковке, разрешения, аварийная карточка и ответственность за нераскрытие не указаны",
          "evidence": [
            {
              "clause_ref": "п. 6.2",
              "quote": "При перевозке опасного груза Клиент обязан указать класс опасности в Поручении экспедитору."
            }
          ]
        }

        Пример 3 — текст есть, но надёжный вывод сделать нельзя:
        Фрагмент:
        "Перевозка опасных грузов осуществляется в соответствии с требованиями, согласованными сторонами."
        Ответ:
        {
          "dangerous_cargo_clause_present": "not_defined",
          "client_disclosure_duty": "not_defined",
          "hazard_class_specification": "not_defined",
          "special_packaging_requirements": "not_defined",
          "permits_responsibility": "not_defined",
          "emergency_card_required": "not_defined",
          "liability_for_non_disclosure": "not_defined",
          "dangerous_cargo_summary": "Не удалось определить",
          "evidence": [
            {
              "clause_ref": "п. 6.3",
              "quote": "Перевозка опасных грузов осуществляется в соответствии с требованиями, согласованными сторонами."
            }
          ]
        }

        Пример 4 — условие отсутствует:
        Фрагмент:
        "Экспедитор организует перевозку груза."
        Ответ:
        {
          "dangerous_cargo_clause_present": "not_defined",
          "client_disclosure_duty": "not_defined",
          "hazard_class_specification": "not_defined",
          "special_packaging_requirements": "not_defined",
          "permits_responsibility": "not_defined",
          "emergency_card_required": "not_defined",
          "liability_for_non_disclosure": "not_defined",
          "dangerous_cargo_summary": "Не установлено",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Есть ли прямое условие по опасному грузу, а не присвоено ли оно по умолчанию?
        2. Есть ли обязанность клиента раскрыть опасные свойства?
        3. Указан ли класс опасности?
        4. Есть ли требования к специальной упаковке и маркировке?
        5. Распределена ли ответственность за разрешения?
        6. Есть ли требование аварийной карточки?
        7. Есть ли ответственность за нераскрытие опасных свойств?
        8. Не выведены ли обязанности из ДОПОГ/ADR по умолчанию?
        9. Если текст есть, но вывод невозможен, использовано ли "Не удалось определить"?
        10. Все ли 9 ключей присутствуют в ответе?
        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь РОВНО одним JSON-объектом без какого-либо дополнительного текста до или после, со всеми 9 ключами:
        {
          "dangerous_cargo_clause_present": "<yes / no / not_defined>",
          "client_disclosure_duty": "<yes / no / not_defined>",
          "hazard_class_specification": "<yes / no / not_defined>",
          "special_packaging_requirements": "<yes / no / not_defined>",
          "permits_responsibility": "<client / forwarder / shared / not_defined>",
          "emergency_card_required": "<yes / no / not_defined>",
          "liability_for_non_disclosure": "<yes / no / not_defined>",
          "dangerous_cargo_summary": "<краткое резюме или 'Не установлено' / 'Не применяется' / 'Не удалось определить'>",
          "evidence": [{"clause_ref": "<пункт или раздел>", "quote": "<точная цитата>"}]
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 700

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "опасный груз класс опасности ДОПОГ ADR маркировка опасного груза разрешение на перевозку аварийная карточка информирование об опасных свойствах раскрытие опасных свойств специальная упаковка нераскрытие опасных свойств"
      boost_keywords:
        - "опасный груз"
        - "класс опасности"
        - "ДОПОГ"
        - "ADR"
        - "маркировка опасного груза"
        - "разрешение на перевозку"
        - "аварийная карточка"
        - "раскрытие опасных свойств"
        - "специальная упаковка"
        - "нераскрытие опасных свойств"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - representations
      negative_keywords:
        - "страхование"
        - "удержание"
        - "форс-мажор"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.20, 0.75]
        boost: 0.15
        scope: segment
      context_k: 6
      max_chunks: 8
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types: []
      preferred_clause_functions:
        - "obligations"
        - "representations"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.12

    evidence:
      required: true
      min_snippet_length: 35
      max_snippet_length: 550

    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false
      llm_max_tokens: 900

      presence_signal:
        field: "dangerous_cargo_duties_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из договора транспортной экспедиции
        сведения об обязанностях при экспедировании опасных грузов: наличие
        условий, обязанность клиента раскрыть опасные свойства, указание класса
        опасности, требования к упаковке, распределение ответственности за
        разрешения, требование аварийной карточки и ответственность за нераскрытие.

        Не анализируй страхование, удержание, ответственность за третьих лиц,
        оплату, претензии и иные темы, если они не содержат сведений об опасном грузе.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. dangerous_cargo_duties_check_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если dangerous_cargo_clause_present = "yes" или "no";
           - "missing" — если dangerous_cargo_clause_present = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - dangerous_cargo_clause_present = "not_defined";
           - client_disclosure_duty = "not_defined";
           - hazard_class_specification = "not_defined";
           - special_packaging_requirements = "not_defined";
           - permits_responsibility = "not_defined";
           - emergency_card_required = "not_defined";
           - liability_for_non_disclosure = "not_defined";
           - dangerous_cargo_summary = "Не установлено";
           - не выполняй остальные шаги.

        1. dangerous_cargo_clause_present — наличие условий по опасному грузу:
           "yes", "no" или "not_defined".
        2. client_disclosure_duty — обязанность клиента раскрыть опасные свойства:
           "yes", "no" или "not_defined".
        3. hazard_class_specification — указание класса опасности:
           "yes", "no" или "not_defined".
        4. special_packaging_requirements — требования к специальной упаковке и маркировке:
           "yes", "no" или "not_defined".
        5. permits_responsibility — распределение ответственности за разрешения:
           "client", "forwarder", "shared" или "not_defined".
        6. emergency_card_required — требование аварийной карточки:
           "yes", "no" или "not_defined".
        7. liability_for_non_disclosure — ответственность за нераскрытие опасных свойств:
           "yes", "no" или "not_defined".
        8. dangerous_cargo_summary — краткое пользовательское резюме.
        9. evidence — массив точных цитат из договора.

        Правила заполнения:
        - Для dangerous_cargo_clause_present: "yes", если есть раздел или условия; "no", если прямо указано, что не перевозится; "not_defined", если отсутствует.
        - Для client_disclosure_duty: "yes", если прямо предусмотрена обязанность раскрыть; "no", если прямо указано, что не предусмотрена; "not_defined", если отсутствует.
        - Для hazard_class_specification: "yes", если прямо указано требование указать класс; "no", если прямо указано, что не указывается; "not_defined", если отсутствует.
        - Для special_packaging_requirements: "yes", если прямо предусмотрены требования; "no", если прямо указано, что не применяются; "not_defined", если отсутствует.
        - Для permits_responsibility: "client", "forwarder", "shared" или "not_defined".
        - Для emergency_card_required: "yes", если прямо предусмотрена; "no", если прямо указано, что не требуется; "not_defined", если отсутствует.
        - Для liability_for_non_disclosure: "yes", если прямо предусмотрена; "no", если прямо указано, что не предусмотрена; "not_defined", если отсутствует.
        - Для dangerous_cargo_summary: если условия указаны, верни краткий факт; если частичные, верни "Частичный набор условий..."; если прямо исключены, верни "Не применяется"; если отсутствуют, верни "Не установлено".
        - Не выводи обязанности из ДОПОГ/ADR по умолчанию. Не присваивай наличие условий по умолчанию. Не считай «shared» существующей, если прямо не указана.
        - Если данных нет, верни пустой массив [] для evidence.
        </task>

        <context_rules>
        - Перед остальными полями заполни dangerous_cargo_duties_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined", dangerous_cargo_summary = "Не установлено".
        - Используй только предоставленный контекст.
        - Не выводи обязанности из ДОПОГ/ADR по умолчанию.
        - Не присваивай наличие условий по опасному грузу по умолчанию.
        - Различай обязанности клиента и экспедитора.
        - Не считай «shared» ответственность существующей, если она прямо не указана.
        - Если фрагменты конфликтуют и не позволяют сделать надёжный вывод, верни "Не удалось определить" для dangerous_cargo_summary и включи конфликтующие цитаты в evidence.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет упоминания опасного груза или условий по нему.
           → presence = "missing";
             dangerous_cargo_clause_present = "not_defined";
             dangerous_cargo_summary = "Не установлено".

        2. Неполное раскрытие темы.
           Упомянут опасный груз и обязанность указать класс опасности, но остальные детали не указаны.
           → presence = "present";
             dangerous_cargo_clause_present = "yes";
             соответствующие детали = "not_defined";
             dangerous_cargo_summary = "Частичный набор условий...".

        3. Противоречие между фрагментами.
           В разных частях договора указаны разные обязанности или противоречащие друг другу условия.
           → presence = "unclear";
             dangerous_cargo_summary = "Не удалось определить".

        4. Прямое исключение.
           В договоре прямо указано, что опасный груз не перевозится или условия не применяются.
           → presence = "present";
             dangerous_cargo_clause_present = "no";
             dangerous_cargo_summary = "Не применяется".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для dangerous_cargo_duties_check_presence используй только: "present", "missing", "unclear".
        - Для статусных enum-полей используй только допустимые значения из списка.
        - Fallback при отсутствии данных:
          * dangerous_cargo_summary → "Не установлено".
        - Fallback при противоречии или неоднозначности:
          * dangerous_cargo_summary → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "dangerous_cargo_duties_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования об опасном грузе. Внутреннее агрегатное signal-поле."
          required: true

        - name: "dangerous_cargo_clause_present"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Наличие условий по опасному грузу в договоре. Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "client_disclosure_duty"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Обязанность клиента раскрыть опасные свойства груза. Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "hazard_class_specification"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Указание класса опасности груза. Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "special_packaging_requirements"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Требования к специальной упаковке и маркировке опасного груза. Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "permits_responsibility"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["client", "forwarder", "shared", "not_defined"]
          description: "Распределение ответственности за разрешения на перевозку опасного груза. Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "emergency_card_required"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Требование аварийной карточки (информационной таблицы опасности). Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "liability_for_non_disclosure"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Ответственность за нераскрытие опасных свойств груза. Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "dangerous_cargo_summary"
          type: "string"
          presentation: "fact"
          label: "Опасный груз: обязанности сторон"
          description: >
            Краткое описание распределения обязанностей при экспедировании опасных грузов: раскрытие свойств, класс опасности, упаковка, разрешения, аварийная карточка, ответственность за нераскрытие. Fallback: "Не установлено" / "Не удалось определить".
          required: true
          display_in_grid: true
          display_priority: 1

        - name: "evidence"
          type: "array"
          presentation: "diagnostic"
          description: "Точные цитаты из договора, подтверждающие извлечённые значения."
          required: true
          display_in_grid: false

      store_payload: true

  - id: exclusions_from_liability
    name: "Обстоятельства, освобождающие от ответственности (ст. 803, 401 ГК РФ)"
    description: >
      Фактографическая проверка перечня обстоятельств, освобождающих экспедитора
      от ответственности в договоре транспортной экспедиции: форс-мажор, вина
      клиента, недостатки груза, непредоставление документов, действия таможенных
      и иных государственных органов, иные типоспецифичные основания.
      Является расширением global check liability_exclusions именно для
      типоспецифики транспортной экспедиции.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "непреодолимая сила"
        - "форс-мажор"
        - "вина клиента"
        - "вина грузовладельца"
        - "недостатки груза"
        - "скрытые недостатки груза"
        - "естественные свойства груза"
        - "непредоставление документов"
        - "неполное предоставление документов"
        - "действия таможенных органов"
        - "действия государственных органов"
        - "освобождается от ответственности"
        - "не несёт ответственности"
        - "не отвечает за"
        - "основания освобождения"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)освобожда(ется|ться|ются)\\s+от\\s+ответственност"
        - "(?i)непреодолим(ой|ая|ую)\\s+сил"
        - "(?i)форс[\\s-]*мажор"
        - "(?i)вин(а|ы|ой)\\s+клиент"
        - "(?i)недостатк(и|ов|ами)\\s+груз"
        - "(?i)действия.*таможенн.*орган"
        - "(?i)действия.*государственн.*орган"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор транспортной экспедиции (ст. 803, 401 ГК РФ; ФЗ-87).

        Проверяется только один вопрос: перечень обстоятельств, освобождающих
        экспедитора от ответственности, с типоспецифичной детализацией для
        транспортной экспедиции.

        Нормативный ориентир:
        - ст. 803 ГК РФ;
        - ст. 401 ГК РФ;
        - ФЗ-87 «О транспортно-экспедиционной деятельности».

        Важно:
        - Твоя задача — не оценивать серьёзность риска.
        - Только установить, что прямо есть в тексте договора, а чего прямо нет.
        - Не выводи основания освобождения из закона. Фиксируй только те,
          что прямо указаны в договоре.
        - Не присваивай основания освобождения по умолчанию.
        - Не путай общие основания освобождения с типоспецифичными основаниями
          для транспортной экспедиции (вина клиента, недостатки груза, действия
          таможенных органов).
        - Этот чек является расширением global check liability_exclusions именно
          для типоспецифики транспортной экспедиции.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Упомянут ли форс-мажор / непреодолимая сила как основание освобождения.
        2. Упомянута ли вина клиента как основание освобождения.
        3. Упомянуты ли недостатки груза (скрытые, естественные свойства) как основание освобождения.
        4. Упомянуты ли действия таможенных органов как основание освобождения.
        5. Упомянуты ли иные основания освобождения (действия иных госорганов, непредоставление документов и т.п.).
        6. Сформируй краткое пользовательское резюме для поля exclusions_summary.
        7. Собери точные цитаты в evidence.

        [ПРАВИЛА]
        1. Используй только предоставленный текст договора.
        2. Если данные отсутствуют:
           - для статусных полей используй "not_defined";
           - для видимых текстовых полей используй "Не указано".
        3. Не используй null, None, пустые строки.
        4. Если текст есть, но надёжный вывод сделать нельзя:
           - для статусных полей используй "not_defined";
           - для видимых текстовых полей используй "Не удалось определить".
        5. Если договор прямо указывает, что основания освобождения от ответственности не предусмотрены, используй:
           - exclusions_summary = "Не предусмотрены".
        6. Не выводи основания освобождения из закона. Фиксируй только если прямо указано в договоре.
        7. Не присваивай основания освобождения по умолчанию.
        8. Для other_exclusions_details:
           - если есть иные основания, верни их кратко;
           - если иных оснований нет, верни "Не указаны";
           - если текст есть, но вывод невозможен, верни "Не удалось определить".
        9. Верни РОВНО один JSON-объект со всеми 7 ключами без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.
        10. В evidence включай только точные цитаты из документа. Если данных нет, верни пустой массив [].
        11. Поле exclusions_summary должно быть кратким и не должно содержать длинных цитат.

        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1 — полный набор типоспецифичных оснований:
        Фрагмент:
        "Экспедитор освобождается от ответственности за утрату, недостачу, повреждение груза в следующих случаях: (а) непреодолимая сила; (б) вина Клиента; (в) скрытые недостатки груза; (г) действия таможенных органов; (д) непредоставление Клиентом необходимых документов."
        Ответ:
        {
          "force_majeure_exclusion": "yes",
          "client_fault_exclusion": "yes",
          "cargo_defects_exclusion": "yes",
          "customs_authorities_exclusion": "yes",
          "other_exclusions_details": "непредоставление Клиентом необходимых документов",
          "exclusions_summary": "Полный набор оснований: форс-мажор, вина клиента, скрытые недостатки груза, действия таможенных органов, непредоставление документов клиентом",
          "evidence": [
            {
              "clause_ref": "п. 7.1",
              "quote": "Экспедитор освобождается от ответственности за утрату, недостачу, повреждение груза в следующих случаях: (а) непреодолимая сила; (б) вина Клиента; (в) скрытые недостатки груза; (г) действия таможенных органов; (д) непредоставление Клиентом необходимых документов."
            }
          ]
        }

        Пример 2 — частичный набор оснований:
        Фрагмент:
        "Экспедитор не несёт ответственности за сохранность груза, если утрата произошла вследствие непреодолимой силы или вины Клиента."
        Ответ:
        {
          "force_majeure_exclusion": "yes",
          "client_fault_exclusion": "yes",
          "cargo_defects_exclusion": "not_defined",
          "customs_authorities_exclusion": "not_defined",
          "other_exclusions_details": "Не указаны",
          "exclusions_summary": "Частичный набор оснований: форс-мажор, вина клиента; недостатки груза, действия таможенных органов и иные основания не указаны",
          "evidence": [
            {
              "clause_ref": "п. 7.2",
              "quote": "Экспедитор не несёт ответственности за сохранность груза, если утрата произошла вследствие непреодолимой силы или вины Клиента."
            }
          ]
        }

        Пример 3 — текст есть, но надёжный вывод сделать нельзя:
        Фрагмент:
        "Ответственность Экспедитора может быть ограничена или исключена в случаях, предусмотренных договором и действующим законодательством."
        Ответ:
        {
          "force_majeure_exclusion": "not_defined",
          "client_fault_exclusion": "not_defined",
          "cargo_defects_exclusion": "not_defined",
          "customs_authorities_exclusion": "not_defined",
          "other_exclusions_details": "Не удалось определить",
          "exclusions_summary": "Не удалось определить",
          "evidence": [
            {
              "clause_ref": "п. 7.3",
              "quote": "Ответственность Экспедитора может быть ограничена или исключена в случаях, предусмотренных договором и действующим законодательством."
            }
          ]
        }

        Пример 4 — условие отсутствует:
        Фрагмент:
        "Экспедитор организует перевозку груза."
        Ответ:
        {
          "force_majeure_exclusion": "not_defined",
          "client_fault_exclusion": "not_defined",
          "cargo_defects_exclusion": "not_defined",
          "customs_authorities_exclusion": "not_defined",
          "other_exclusions_details": "Не указаны",
          "exclusions_summary": "Не установлено",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Упомянут ли форс-мажор как основание освобождения?
        2. Упомянута ли вина клиента?
        3. Упомянуты ли недостатки груза?
        4. Упомянуты ли действия таможенных органов?
        5. Есть ли иные основания освобождения?
        6. Не выведены ли основания из закона по умолчанию?
        7. Если текст есть, но вывод невозможен, использовано ли "Не удалось определить"?
        8. Все ли 7 ключей присутствуют в ответе?
        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь РОВНО одним JSON-объектом без какого-либо дополнительного текста до или после, со всеми 7 ключами:
        {
          "force_majeure_exclusion": "<yes / no / not_defined>",
          "client_fault_exclusion": "<yes / no / not_defined>",
          "cargo_defects_exclusion": "<yes / no / not_defined>",
          "customs_authorities_exclusion": "<yes / no / not_defined>",
          "other_exclusions_details": "<иные основания или 'Не указаны' / 'Не удалось определить'>",
          "exclusions_summary": "<краткое резюме или 'Не установлено' / 'Не предусмотрены' / 'Не удалось определить'>",
          "evidence": [{"clause_ref": "<пункт или раздел>", "quote": "<точная цитата>"}]
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 700

    retrieval:
      retrieval_profile: "force_majeure_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "освобождается от ответственности не несёт ответственности непреодолимая сила форс-мажор вина клиента недостатки груза скрытые недостатки естественные свойства груза действия таможенных органов действия государственных органов непредоставление документов основания освобождения"
      boost_keywords:
        - "освобождается от ответственности"
        - "не несёт ответственности"
        - "непреодолимая сила"
        - "форс-мажор"
        - "вина клиента"
        - "недостатки груза"
        - "скрытые недостатки"
        - "действия таможенных органов"
        - "непредоставление документов"
        - "основания освобождения"
      preferred_unit_types:
        - liability_provision
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - limitations
        - remedies
      negative_keywords:
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.40, 0.85]
        boost: 0.12
        scope: segment
      context_k: 6
      max_chunks: 8
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types: []
      preferred_clause_functions:
        - "limitations"
        - "remedies"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 30
      max_snippet_length: 400

    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false
      llm_max_tokens: 900

      presence_signal:
        field: "exclusions_from_liability_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из договора транспортной экспедиции
        сведения об обстоятельствах, освобождающих экспедитора от ответственности:
        форс-мажор, вина клиента, недостатки груза, действия таможенных органов
        и иные типоспецифичные основания.

        Не анализируй страхование, удержание, оплату, претензии и иные темы,
        если они не содержат сведений об основаниях освобождения от ответственности.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. exclusions_from_liability_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (force_majeure_exclusion, client_fault_exclusion, cargo_defects_exclusion, customs_authorities_exclusion) ≠ "not_defined";
           - "missing" — если все четыре содержательных поля = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - force_majeure_exclusion = "not_defined";
           - client_fault_exclusion = "not_defined";
           - cargo_defects_exclusion = "not_defined";
           - customs_authorities_exclusion = "not_defined";
           - other_exclusions_details = "Не указаны";
           - exclusions_summary = "Не установлено";
           - не выполняй остальные шаги.

        1. force_majeure_exclusion — упомянут ли форс-мажор / непреодолимая сила как основание освобождения:
           "yes", "no" или "not_defined".
        2. client_fault_exclusion — упомянута ли вина клиента как основание освобождения:
           "yes", "no" или "not_defined".
        3. cargo_defects_exclusion — упомянуты ли недостатки груза (скрытые, естественные свойства) как основание освобождения:
           "yes", "no" или "not_defined".
        4. customs_authorities_exclusion — упомянуты ли действия таможенных органов как основание освобождения:
           "yes", "no" или "not_defined".
        5. other_exclusions_details — иные основания освобождения (действия иных госорганов, непредоставление документов и т.п.).
        6. exclusions_summary — краткое пользовательское резюме.
        7. evidence — массив точных цитат из договора.

        Правила заполнения:
        - Для force_majeure_exclusion: "yes", если прямо указаны; "no", если прямо указано, что не освобождает; "not_defined", если отсутствует.
        - Для client_fault_exclusion: "yes", если прямо указана; "no", если прямо указано, что не освобождает; "not_defined", если отсутствует.
        - Для cargo_defects_exclusion: "yes", если прямо указаны; "no", если прямо указано, что не освобождают; "not_defined", если отсутствует.
        - Для customs_authorities_exclusion: "yes", если прямо указаны; "no", если прямо указано, что не освобождают; "not_defined", если отсутствует.
        - Для other_exclusions_details: если есть иные основания, верни их кратко; если нет, верни "Не указаны".
        - Для exclusions_summary: если основания указаны, верни краткий факт с перечислением; если частичные, верни "Частичный набор оснований..."; если прямо исключены, верни "Не предусмотрены"; если отсутствуют, верни "Не установлено".
        - Не выводи основания освобождения из закона. Не присваивай основания по умолчанию.
        - Если данных нет, верни пустой массив [] для evidence.
        </task>

        <context_rules>
        - Перед остальными полями заполни exclusions_from_liability_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined", other_exclusions_details = "Не указаны", exclusions_summary = "Не установлено".
        - Используй только предоставленный контекст.
        - Не выводи основания освобождения из закона.
        - Не присваивай основания освобождения по умолчанию.
        - Не путай общие основания освобождения с типоспецифичными основаниями для транспортной экспедиции.
        - Если фрагменты конфликтуют и не позволяют сделать надёжный вывод, верни "Не удалось определить" для exclusions_summary и включи конфликтующие цитаты в evidence.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет упоминания оснований освобождения от ответственности.
           → presence = "missing";
             все *_status = "not_defined";
             exclusions_summary = "Не установлено".

        2. Неполное раскрытие темы.
           Упомянут только форс-мажор и вина клиента, но не упомянуты недостатки груза и действия таможенных органов.
           → presence = "present";
             force_majeure_exclusion = client_fault_exclusion = "yes";
             остальные = "not_defined";
             exclusions_summary = "Частичный набор оснований...".

        3. Противоречие между фрагментами.
           В разных частях договора указаны разные или противоречащие друг другу основания освобождения.
           → presence = "unclear";
             exclusions_summary = "Не удалось определить".

        4. Прямое исключение.
           В договоре прямо указано, что основания освобождения от ответственности не предусмотрены.
           → presence = "present";
             все *_status = "no";
             exclusions_summary = "Не предусмотрены".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для exclusions_from_liability_presence используй только: "present", "missing", "unclear".
        - Для статусных enum-полей используй только: "yes", "no", "not_defined".
        - Fallback при отсутствии данных:
          * other_exclusions_details → "Не указаны";
          * exclusions_summary → "Не установлено".
        - Fallback при противоречии или неоднозначности:
          * exclusions_summary → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "exclusions_from_liability_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования об обстоятельствах, освобождающих от ответственности. Внутреннее агрегатное signal-поле."
          required: true

        - name: "force_majeure_exclusion"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Упомянут ли форс-мажор / непреодолимая сила как основание освобождения от ответственности. Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "client_fault_exclusion"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Упомянута ли вина клиента как основание освобождения от ответственности. Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "cargo_defects_exclusion"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Упомянуты ли недостатки груза (скрытые, естественные свойства) как основание освобождения от ответственности. Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "customs_authorities_exclusion"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Упомянуты ли действия таможенных органов как основание освобождения от ответственности. Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "other_exclusions_details"
          type: "string"
          presentation: "fact"
          label: "Иные основания освобождения"
          description: >
            Иные основания освобождения от ответственности (действия иных госорганов, непредоставление документов и т.п.). Fallback: "Не установлено" / "Не удалось определить".
          required: true
          display_in_grid: false

        - name: "exclusions_summary"
          type: "string"
          presentation: "fact"
          label: "Обстоятельства, освобождающие от ответственности"
          description: >
            Краткое описание перечня обстоятельств, освобождающих экспедитора от ответственности: форс-мажор, вина клиента, недостатки груза, действия таможенных органов и иные типоспецифичные основания. Fallback: "Не установлено" / "Не удалось определить".
          required: true
          display_in_grid: true
          display_priority: 1

        - name: "evidence"
          type: "array"
          presentation: "diagnostic"
          description: "Точные цитаты из договора, подтверждающие извлечённые значения."
          required: true
          display_in_grid: false

      store_payload: true

  - id: pretension_order
    name: "Претензионный порядок: сроки и процедура"
    description: >
      Фактографическая проверка наличия обязательного претензионного порядка
      урегулирования споров: предусмотрено ли условие, срок подачи претензии,
      форма претензии, срок ответа на претензию и последствия несоблюдения.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "претензионный порядок"
        - "претензия"
        - "досудебный порядок"
        - "срок претензии"
        - "направить претензию"
        - "предъявить претензию"
        - "рассмотрение претензии"
        - "ответ на претензию"
        - "форма претензии"
        - "письменная претензия"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)претенз(ия|ии|ию|ией|ионн)"
        - "(?i)досудебн(ый|ого|ом)\\s+порядк"
        - "(?i)направ(ить|ляет|лена).*претенз"
        - "(?i)предъяв(ить|ляет|лена).*претенз"
        - "(?i)ответ.*претенз"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор транспортной экспедиции.

        Проверяется только один вопрос: претензионный порядок урегулирования споров.

        Нормативный ориентир:
        - ст. 797 ГК РФ (претензии по перевозкам);
        - ст. 16 ФЗ-87 (претензии по экспедиции).

        Важно:
        - Твоя задача — не оценивать серьёзность риска.
        - Только установить, что прямо есть в тексте договора, а чего прямо нет.
        - Не выводи претензионный порядок из закона. Фиксируй только если прямо указан.
        - Не путай претензионный порядок с уведомлением об одностороннем отказе
          или с порядком подачи заявок.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Предусмотрен ли обязательный претензионный порядок.
        2. Срок подачи претензии.
        3. Форма претензии (письменная, по email, через систему и т.п.).
        4. Срок рассмотрения претензии / ответа на претензию.
        5. Сформируй краткое пользовательское резюме.
        6. Собери точные цитаты в evidence.

        [ПРАВИЛА]
        1. Используй только предоставленный текст договора.
        2. Если данные отсутствуют:
           - для статусных полей используй "not_defined";
           - для видимых текстовых полей используй "Не установлено".
        3. Не используй null, None, пустые строки.
        4. Если текст есть, но надёжный вывод сделать нельзя:
           - для статусных полей используй "not_defined";
           - для видимых текстовых полей используй "Не удалось определить".
        5. Если договор прямо указывает, что претензионный порядок не предусмотрен, используй:
           - pretension_order_present = "no";
           - pretension_order_summary = "Не предусмотрен".
        6. Не выводи претензионный порядок из закона. Фиксируй только если прямо указан в договоре.
        7. Верни РОВНО один JSON-объект со всеми 6 ключами без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.
        8. В evidence включай только точные цитаты из документа. Если данных нет, верни пустой массив [].
        9. Поле pretension_order_summary должно быть кратким и не должно содержать длинных цитат.

        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1 — полный претензионный порядок:
        Фрагмент:
        "Стороны устанавливают обязательный претензионный порядок. Претензия направляется в письменной форме в течение 30 дней с момента нарушения. Срок рассмотрения претензии — 15 рабочих дней."
        Ответ:
        {
          "pretension_order_present": "yes",
          "pretension_deadline": "30 дней с момента нарушения",
          "pretension_form": "письменная форма",
          "response_deadline": "15 рабочих дней",
          "pretension_order_summary": "Обязательный претензионный порядок; срок подачи — 30 дней; письменная форма; срок ответа — 15 рабочих дней",
          "evidence": [
            {
              "clause_ref": "п. 9.1",
              "quote": "Стороны устанавливают обязательный претензионный порядок. Претензия направляется в письменной форме в течение 30 дней с момента нарушения. Срок рассмотрения претензии — 15 рабочих дней."
            }
          ]
        }

        Пример 2 — претензионный порядок без деталей:
        Фрагмент:
        "Споры разрешаются в претензионном порядке."
        Ответ:
        {
          "pretension_order_present": "yes",
          "pretension_deadline": "Не установлено",
          "pretension_form": "Не установлено",
          "response_deadline": "Не установлено",
          "pretension_order_summary": "Претензионный порядок предусмотрен; срок подачи, форма и срок ответа не указаны",
          "evidence": [
            {
              "clause_ref": "п. 9.1",
              "quote": "Споры разрешаются в претензионном порядке."
            }
          ]
        }

        Пример 3 — условие отсутствует:
        Фрагмент:
        "Все споры передаются в арбитражный суд."
        Ответ:
        {
          "pretension_order_present": "not_defined",
          "pretension_deadline": "Не установлено",
          "pretension_form": "Не установлено",
          "response_deadline": "Не установлено",
          "pretension_order_summary": "Не установлено",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Есть ли прямое условие о претензионном порядке?
        2. Не выведен ли претензионный порядок из закона по умолчанию?
        3. Указан ли срок подачи претензии?
        4. Указана ли форма претензии?
        5. Указан ли срок ответа?
        6. Если текст есть, но вывод невозможен, использовано ли "Не удалось определить"?
        7. Все ли 6 ключей присутствуют в ответе?
        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь РОВНО одним JSON-объектом без какого-либо дополнительного текста до или после, со всеми 6 ключами:
        {
          "pretension_order_present": "<yes / no / not_defined>",
          "pretension_deadline": "<срок подачи претензии или 'Не установлено' / 'Не удалось определить'>",
          "pretension_form": "<форма претензии или 'Не установлено' / 'Не удалось определить'>",
          "response_deadline": "<срок ответа на претензию или 'Не установлено' / 'Не удалось определить'>",
          "pretension_order_summary": "<краткое резюме или 'Не установлено' / 'Не предусмотрен' / 'Не удалось определить'>",
          "evidence": [{"clause_ref": "<пункт или раздел>", "quote": "<точная цитата>"}]
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 700

    retrieval:
      retrieval_profile: "dispute_resolution_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "претензионный порядок претензия досудебный порядок срок претензии направить претензию форма претензии ответ на претензию рассмотрение претензии"
      boost_keywords:
        - "претензионный порядок"
        - "претензия"
        - "досудебный порядок"
        - "срок претензии"
        - "направить претензию"
        - "форма претензии"
        - "ответ на претензию"
      preferred_unit_types:
        - dispute_resolution
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - boilerplate
        - procedures
      negative_keywords:
        - "означает"
        - "в целях настоящего"
        - "уведомление об отказе"
      position_bias:
        preferred_range: [0.60, 1.0]
        boost: 0.18
        scope: segment
      context_k: 6
      max_chunks: 8
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "boilerplate"
        - "procedures"
      confidence_bonus_on_match: 0.06
      confidence_penalty_on_excluded_segment: 0.08

    evidence:
      required: true
      min_snippet_length: 30
      max_snippet_length: 400

    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false
      llm_max_tokens: 800

      presence_signal:
        field: "pretension_order_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из договора транспортной экспедиции
        сведения о претензионном порядке урегулирования споров: наличие условия,
        срок подачи претензии, форма претензии и срок ответа на претензию.

        Не анализируй подсудность, применимое право, односторонний отказ,
        оплату и иные темы, если они не содержат сведений о претензионном порядке.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. pretension_order_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если pretension_order_present = "yes" или "no";
           - "missing" — если pretension_order_present = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - pretension_order_present = "not_defined";
           - pretension_deadline = "Не установлено";
           - pretension_form = "Не установлено";
           - response_deadline = "Не установлено";
           - pretension_order_summary = "Не установлено";
           - не выполняй остальные шаги.

        1. pretension_order_present — предусмотрен ли претензионный порядок:
           "yes", "no" или "not_defined".
        2. pretension_deadline — срок подачи претензии.
        3. pretension_form — форма претензии.
        4. response_deadline — срок рассмотрения / ответа на претензию.
        5. pretension_order_summary — краткое пользовательское резюме.
        6. evidence — массив точных цитат из договора.

        Правила заполнения:
        - Для pretension_order_present: "yes", если прямо предусмотрен обязательный претензионный порядок; "no", если прямо указано, что не предусмотрен; "not_defined", если отсутствует.
        - Для pretension_deadline: если срок указан, верни его кратко; если не указан, верни "Не установлено".
        - Для pretension_form: если форма указана (письменная, email, через систему), верни её кратко; если не указана, верни "Не установлено".
        - Для response_deadline: если срок ответа указан, верни его кратко; если не указан, верни "Не установлено".
        - Для pretension_order_summary: если порядок и детали указаны, верни краткий факт; если порядок есть, но детали не указаны, верни "Претензионный порядок предусмотрен; детали не указаны"; если прямо исключён, верни "Не предусмотрен"; если отсутствует, верни "Не установлено".
        - Не выводи претензионный порядок из закона. Фиксируй только если прямо указан в договоре.
        - Если данных нет, верни пустой массив [] для evidence.
        </task>

        <context_rules>
        - Перед остальными полями заполни pretension_order_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — pretension_order_present = "not_defined", pretension_order_summary = "Не установлено".
        - Используй только предоставленный контекст.
        - Не выводи претензионный порядок из закона.
        - Не путай претензионный порядок с уведомлением об одностороннем отказе или с порядком подачи заявок.
        - Если фрагменты конфликтуют и не позволяют сделать надёжный вывод, верни "Не удалось определить" для pretension_order_summary и включи конфликтующие цитаты в evidence.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет упоминания претензионного порядка.
           → presence = "missing";
             pretension_order_present = "not_defined";
             pretension_order_summary = "Не установлено".

        2. Неполное раскрытие темы.
           Претензионный порядок упомянут, но срок подачи, форма или срок ответа не указаны.
           → presence = "present";
             pretension_order_present = "yes";
             соответствующие детали = "Не установлено";
             pretension_order_summary = "Претензионный порядок предусмотрен; детали не указаны".

        3. Противоречие между фрагментами.
           В разных частях договора указаны разные сроки претензии или противоречащие условия.
           → presence = "unclear";
             pretension_order_summary = "Не удалось определить".

        4. Прямое исключение.
           В договоре прямо указано, что претензионный порядок не предусмотрен или споры передаются сразу в суд.
           → presence = "present";
             pretension_order_present = "no";
             pretension_order_summary = "Не предусмотрен".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для pretension_order_presence используй только: "present", "missing", "unclear".
        - Для статусных enum-полей используй только: "yes", "no", "not_defined".
        - Fallback при отсутствии данных:
          * pretension_deadline, pretension_form, response_deadline → "Не установлено";
          * pretension_order_summary → "Не установлено".
        - Fallback при противоречии или неоднозначности:
          * pretension_order_summary → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "pretension_order_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования о претензионном порядке. Внутреннее агрегатное signal-поле."
          required: true

        - name: "pretension_order_present"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Предусмотрен ли обязательный претензионный порядок. Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "pretension_deadline"
          type: "string"
          presentation: "fact"
          label: "Срок подачи претензии"
          description: >
            Срок подачи претензии с момента нарушения или обнаружения. Fallback: "Не установлено" / "Не удалось определить".
          required: true
          display_in_grid: false

        - name: "pretension_form"
          type: "string"
          presentation: "fact"
          label: "Форма претензии"
          description: >
            Форма претензии: письменная, по email, через систему и т.п. Fallback: "Не установлено" / "Не удалось определить".
          required: true
          display_in_grid: false

        - name: "response_deadline"
          type: "string"
          presentation: "fact"
          label: "Срок ответа на претензию"
          description: >
            Срок рассмотрения претензии и направления ответа. Fallback: "Не установлено" / "Не удалось определить".
          required: true
          display_in_grid: false

        - name: "pretension_order_summary"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 1
          label: "Претензионный порядок"
          description: >
            Краткое описание претензионного порядка: наличие, срок подачи, форма, срок ответа. Fallback: "Не установлено" / "Не удалось определить".
          required: true

        - name: "evidence"
          type: "array"
          presentation: "diagnostic"
          description: "Точные цитаты из договора, подтверждающие извлечённые значения."
          required: true
          display_in_grid: false

      store_payload: true

  - id: limitation_period
    name: "Срок исковой давности — 1 год (ст. 797 ГК РФ)"
    description: >
      Фактографическая проверка упоминания сокращённого срока исковой давности
      (1 год), применяемого к требованиям из перевозки и экспедиции: наличие
      условия, конкретное значение и применимость к отдельным требованиям.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "medium"
    severity_if_pass: "pass"
    severity_if_fail: "medium"
    severity_if_unclear: "low"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "исковая давность"
        - "срок давности"
        - "1 год"
        - "один год"
        - "12 месяцев"
        - "сокращённый срок"
        - "срок для предъявления требований"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)исков(ая|ой|ую)\\s+давност"
        - "(?i)срок.*давност"
        - "(?i)1\\s*(год|лето)"
        - "(?i)один\\s+год"
        - "(?i)12\\s+месяц"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор транспортной экспедиции.

        Проверяется только один вопрос: упоминание срока исковой давности.

        Нормативный ориентир:
        - ст. 797 ГК РФ (сокращённый срок давности по перевозкам — 1 год);
        - ст. 13 ФЗ-87 (срок давности по экспедиции — 1 год).

        Важно:
        - Твоя задача — не оценивать серьёзность риска.
        - Только установить, что прямо есть в тексте договора, а чего прямо нет.
        - Не выводи срок давности из закона. Фиксируй только если прямо указан в договоре.
        - Не путай срок исковой давности с претензионным сроком или сроком уведомления.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Упомянут ли срок исковой давности.
        2. Конкретное значение срока (1 год, иной срок).
        3. Применимость к отдельным требованиям (если указано).
        4. Сформируй краткое пользовательское резюме.
        5. Собери точные цитаты в evidence.

        [ПРАВИЛА]
        1. Используй только предоставленный текст договора.
        2. Если данные отсутствуют:
           - для статусных полей используй "not_defined";
           - для видимых текстовых полей используй "Не установлено".
        3. Не используй null, None, пустые строки.
        4. Если текст есть, но надёжный вывод сделать нельзя:
           - для статусных полей используй "not_defined";
           - для видимых текстовых полей используй "Не удалось определить".
        5. Не выводи срок давности из закона. Фиксируй только если прямо указан в договоре.
        6. Не путай срок исковой давности с претензионным сроком.
        7. Верни РОВНО один JSON-объект со всеми 4 ключами без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.
        8. В evidence включай только точные цитаты из документа. Если данных нет, верни пустой массив [].
        9. Поле limitation_period_summary должно быть кратким.

        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1 — срок указан прямо:
        Фрагмент:
        "Срок исковой давности по требованиям из настоящего договора составляет один год."
        Ответ:
        {
          "limitation_period_mentioned": "yes",
          "limitation_period_value": "1 год",
          "limitation_period_summary": "Срок исковой давности — 1 год",
          "evidence": [
            {
              "clause_ref": "п. 10.1",
              "quote": "Срок исковой давности по требованиям из настоящего договора составляет один год."
            }
