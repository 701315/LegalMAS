      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 600

    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false
      llm_max_tokens: 1100

      presence_signal:
        field: "remuneration_and_expenses_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из договора транспортной экспедиции
        сведения о вознаграждении экспедитора и порядке возмещения его расходов.

        Не анализируй ответственность, страхование, сроки доставки, претензии
        и иные темы, если они не содержат сведений о вознаграждении и расходах.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. remuneration_and_expenses_check_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (remuneration_specified, expenses_reimbursement_present) ≠ "not_defined";
           - "missing" — если оба содержательных поля = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - remuneration_specified = "not_defined";
           - expenses_reimbursement_present = "not_defined";
           - remuneration_type = "not_defined";
           - remuneration_amount = "Не установлен";
           - expenses_approval_mechanism = "not_defined";
           - expenses_limit = "Не установлен";
           - advance_payment = "not_defined";
           - не выполняй остальные шаги.

        1. remuneration_specified — указано ли вознаграждение:
           "yes", "no" или "not_defined".
        2. remuneration_type — тип вознаграждения:
           "fixed", "percentage", "hourly", "not_specified" или "not_defined".
        3. remuneration_amount — размер вознаграждения или механизм его определения.
        4. expenses_reimbursement_present — предусмотрено ли возмещение расходов:
           "yes", "no" или "not_defined".
        5. expenses_approval_mechanism — есть ли механизм согласования расходов:
           "yes", "no" или "not_defined".
        6. expenses_limit — лимит расходов или предельная сумма расходов.
        7. advance_payment — предусмотрено ли авансирование или предоплата:
           "yes", "no" или "not_defined".
        8. evidence — массив точных цитат из договора.

        Правила заполнения:
        - Для remuneration_specified: "yes", если вознаграждение прямо указано суммой, формулой или механизмом; "no", если прямо указано, что не выплачивается; "not_defined", если сведений нет.
        - Для remuneration_type: "fixed", если фиксированная сумма; "percentage", если процент; "hourly", если почасовая; "not_specified", если тип неясен; "not_defined", если не упомянуто.
        - Для remuneration_amount: если сумма или формула указаны, верни их кратко; если определяется через документ, верни "Определяется по ..."; если прямо не предусмотрено, верни "Не применимо"; если данных нет, верни "Не установлен"; если вывод невозможен, верни "Не удалось определить".
        - Для expenses_reimbursement_present: "yes", если прямо предусмотрено; "no", если прямо указано, что включены в вознаграждение; "not_defined", если не урегулирован.
        - Для expenses_approval_mechanism: "yes", если есть предварительное согласование или порог; "no", если прямо указано, что не требуется; "not_defined", если не упомянут.
        - Для expenses_limit: если указан максимальный лимит, верни его кратко; если определяется через документ, верни "Определяется по ..."; если только порог согласования, верни "Не установлен"; если возмещение не предусмотрено, верни "Не применимо"; если данных нет, верни "Не установлен"; если вывод невозможен, верни "Не удалось определить".
        - Для advance_payment: "yes", если прямо предусмотрены аванс или предоплата; "no", если прямо указано, что не предусмотрено; "not_defined", если не урегулирован.
        - Если данных нет, верни пустой массив [] для evidence.
        </task>

        <context_rules>
        - Перед остальными полями заполни remuneration_and_expenses_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined", видимые текстовые поля = "Не установлен" или "Не применимо".
        - Используй только предоставленный контекст.
        - Не выдумывай суммы, проценты, тарифы и лимиты.
        - Не подставляй рыночные ставки и не предполагай вознаграждение только потому, что договор транспортной экспедиции обычно является возмездным.
        - Не смешивай вознаграждение экспедитора с возмещением его расходов.
        - Не смешивай аванс с оплатой после оказания услуг.
        - Не считай порог согласования лимитом расходов, если прямо не указано максимальное ограничение.
        - Если фрагменты конфликтуют и не позволяют сделать надёжный вывод, верни "Не удалось определить" для затронутого видимого поля и включи конфликтующие цитаты в evidence.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет упоминания ни вознаграждения, ни возмещения расходов.
           → presence = "missing";
             remuneration_specified = expenses_reimbursement_present = "not_defined";
             все *_amount/*_limit = "Не установлен".

        2. Неполное раскрытие темы.
           Упомянуто вознаграждение, но его тип или размер не определены (будут согласованы дополнительно).
           → presence = "present";
             соответствующие *_status = "not_defined";
             remuneration_amount = "Не удалось определить" или "Не установлен".

        3. Противоречие между фрагментами.
           В разных частях договора указаны разные размеры вознаграждения или лимиты расходов.
           → presence = "unclear";
             соответствующие текстовые поля = "Не удалось определить".

        4. Отсылка на внешний документ.
           Вознаграждение или лимит расходов определяются по Тарифам, Приложению или Заявке, и это прямо указано.
           → presence = "present";
             соответствующий *_status = "yes" или "defined";
             *_amount/*_limit содержит формулировку вида "Определяется по Приложению № 1".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для remuneration_and_expenses_check_presence используй только: "present", "missing", "unclear".
        - Для статусных enum-полей используй только допустимые значения из списка.
        - Fallback при отсутствии данных:
          * remuneration_amount, expenses_limit → "Не установлен" или "Не применимо".
        - Fallback при противоречии или неоднозначности:
          * все *_amount/*_limit → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "remuneration_and_expenses_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования о вознаграждении и расходах. Внутреннее агрегатное signal-поле."
          required: true

        - name: "remuneration_specified"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Указано ли вознаграждение экспедитора. Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "remuneration_type"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["fixed", "percentage", "hourly", "not_specified", "not_defined"]
          description: "Тип вознаграждения экспедитора. Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "remuneration_amount"
          type: "string"
          presentation: "fact"
          label: "Размер вознаграждения"
          description: >
            Размер вознаграждения экспедитора или механизм его определения. Fallback: "Не установлено" / "Не удалось определить".
          required: true
          display_in_grid: true
          display_priority: 1

        - name: "expenses_reimbursement_present"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Предусмотрено ли возмещение расходов экспедитора. Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "expenses_approval_mechanism"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Наличие механизма согласования расходов. Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "expenses_limit"
          type: "string"
          presentation: "fact"
          label: "Лимит расходов"
          description: >
            Максимальный лимит расходов экспедитора или механизм его определения. Fallback: "Не установлено" / "Не удалось определить".
          required: true
          display_in_grid: true
          display_priority: 2

        - name: "advance_payment"
          type: "string"
          presentation: "signal"
          risk_weight: "low"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Предусмотрено ли авансирование или предоплата. Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "evidence"
          type: "array"
          presentation: "diagnostic"
          description: "Точные цитаты из договора, подтверждающие извлечённые значения."
          required: true
          display_in_grid: false

      store_payload: true
  - id: forwarder_report
    name: "Отчёт экспедитора: форма, сроки, приложения (ст. 804 ГК РФ)"
    description: >
      Фактографическая проверка условия об отчёте экспедитора: предусмотрен ли
      отчёт, указана ли его форма, определён ли срок представления, требуются ли
      подтверждающие документы и приложения.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "отчёт экспедитора"
        - "отчет экспедитора"
        - "отчёт о расходах"
        - "отчет о расходах"
        - "отчёт о понесённых расходах"
        - "отчет о понесенных расходах"
        - "отчётность экспедитора"
        - "отчетность экспедитора"
        - "представление отчёта"
        - "представление отчета"
        - "предоставление отчёта"
        - "предоставление отчета"
        - "форма отчёта"
        - "форма отчета"
        - "срок представления отчёта"
        - "срок представления отчета"
        - "срок предоставления отчёта"
        - "срок предоставления отчета"
        - "подтверждающие документы"
        - "документальное подтверждение"
        - "документальное подтверждение расходов"
