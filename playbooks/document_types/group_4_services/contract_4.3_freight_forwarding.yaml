          required: true
          display_in_grid: false

        - name: "client_details_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус определения реквизитов клиента. Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "client_details_value"
          type: "string"
          presentation: "fact"
          label: "Клиент"
          description: >
            Краткие идентификационные данные клиента: наименование, ИНН, ОГРН или указание на документ, определяющий сторону. Fallback: "Не установлено" / "Не удалось определить".
          required: true
          display_in_grid: true
          display_priority: 2

        - name: "client_type"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["legal_entity", "ip", "individual", "not_defined"]
          description: "Тип клиента. Внутреннее enum-поле."
