type: contract_4.3_freight_forwarding
name: "Договор транспортной экспедиции"

description: |
  Соглашение, по которому экспедитор обязуется за вознаграждение и за счёт клиента
  выполнить или организовать выполнение услуг, связанных с перевозкой груза
  (поиск перевозчика, оформление документов, страхование, таможенное оформление),
  а клиент обязуется оплатить вознаграждение и возместить понесённые расходы.
  Экспедитор действует как организатор логистической цепочки, принимая груз
  (подтверждается экспедиторской распиской) и отвечая за его сохранность и действия
  привлечённых третьих лиц. Регулируется Главой 41 ГК РФ (ст. 801–806) и ФЗ-87
  «О транспортно-экспедиционной деятельности». Отличается от перевозки организационным
  характером, а от агентирования — ответственностью за груз. Срок исковой давности — 1 год.

version: 4.0
parent: class_4_service_provision

metadata:
  category: contract
  subcategory: logistics_forwarding
  complexity: high
  risk_level: high
  jurisdiction: RU
  language: ru
  legal_base: "Глава 41 ГК РФ (ст. 801-806), ФЗ-87, ПП РФ № 554"
  doc_types_supported:
    - "договор транспортной экспедиции"
    - "договор транспортно-экспедиционного обслуживания"
    - "договор ТЭО"
    - "договор на организацию перевозок"
    - "логистический контракт"
    - "договор экспедиторского обслуживания"
    - "договор с логистическим оператором"
    - "3PL договор"
    - "договор экспедирования"

    - "freight forwarding agreement"
    - "logistics service agreement"
