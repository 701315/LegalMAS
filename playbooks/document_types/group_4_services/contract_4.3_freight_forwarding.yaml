  - id: lien_right_on_cargo
    name: "Право удержания груза и порядок реализации (ст. 3 ФЗ-87)"
    description: >
      Фактографическая проверка наличия условия о праве экспедитора удерживать
      груз до оплаты вознаграждения и расходов, порядка реализации удержанного
      груза и распределения расходов на хранение.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "право удержания"
        - "удержание груза"
        - "удерживать груз"
        - "до уплаты вознаграждения"
        - "до возмещения расходов"
        - "реализация удержанного"
        - "реализация удержанного груза"
        - "хранение за счёт клиента"
        - "хранение за счет клиента"
        - "расходы на хранение удержанного"
        - "приостановить выдачу груза"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)удержива(ть|ет).*груз.*до.*оплат"
        - "(?i)право\\s+удержани(я|е).*груз"
        - "(?i)реализац(ия|ии)\\s+удержанн"
        - "(?i)расход.*хранени.*удержанн"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор транспортной экспедиции (ст. 3 ФЗ-87; ст. 359 ГК РФ).

        Проверяется только один вопрос: право удержания груза экспедитором.

        Нормативный ориентир:
        - ст. 3 ФЗ-87 «О транспортно-экспедиционной деятельности»;
        - ст. 359 ГК РФ.

        Важно:
        - Твоя задача — не оценивать серьёзность риска.
        - Только установить, что прямо есть в тексте договора, а чего прямо нет.
        - Не считай право удержания существующим по умолчанию. Фиксируй его
          только если прямо указано в договоре.
        - Не выводи право удержания из ст. 3 ФЗ-87 или ст. 359 ГК РФ — только из текста.
        - Не путай право удержания груза с обеспечительным платежом, залогом
          или иными способами обеспечения обязательств.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Предусмотрено ли право экспедитора удерживать груз.
        2. Условия реализации права удержания (до уплаты вознаграждения, возмещения расходов и т.п.).
        3. Порядок реализации удержанного груза.
        4. Распределение расходов на хранение удержанного груза.
        5. Сформируй краткое пользовательское резюме для поля lien_summary.
        6. Собери точные цитаты в evidence.

        [ПРАВИЛА]
        1. Используй только предоставленный текст договора.
        2. Если данные отсутствуют:
           - для статусных и перечислимых полей используй "not_defined";
           - для видимого текстового поля используй "Не установлено".
        3. Не используй null, None, пустые строки.
        4. Если текст есть, но надёжный вывод сделать нельзя:
           - для статусных и перечислимых полей используй "not_defined";
           - для видимого текстового поля используй "Не удалось определить".
        5. Если договор прямо указывает, что право удержания груза не предусмотрено, используй:
           - lien_right_present = "no";
           - lien_summary = "Не предусмотрено".
        6. Не считай право удержания существующим по умолчанию. Фиксируй только если прямо указано.
        7. Не путай право удержания груза с обеспечительным платежом, залогом или иными способами обеспечения.
        8. Верни РОВНО один JSON-объект со всеми 6 ключами без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.
        9. В evidence включай только точные цитаты из документа. Если данных нет, верни пустой массив [].
        10. Поле lien_summary должно быть кратким и не должно содержать длинных цитат.

        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1 — право удержания с условиями, порядком реализации и расходами на хранение:
        Фрагмент:
        "Экспедитор вправе удерживать груз до уплаты вознаграждения и возмещения расходов. Расходы на хранение удержанного груза несёт Клиент. Реализация удержанного груза осуществляется в порядке, установленном ст. 359 ГК РФ."
        Ответ:
        {
          "lien_right_present": "yes",
          "lien_conditions": "до уплаты вознаграждения и возмещения расходов",
          "realization_procedure": "yes",
          "storage_cost_allocation": "client",
          "lien_summary": "Экспедитор вправе удерживать груз до уплаты вознаграждения и возмещения расходов; расходы на хранение несёт Клиент; реализация — по ст. 359 ГК РФ",
          "evidence": [
            {
              "clause_ref": "п. 7.1",
              "quote": "Экспедитор вправе удерживать груз до уплаты вознаграждения и возмещения расходов. Расходы на хранение удержанного груза несёт Клиент. Реализация удержанного груза осуществляется в порядке, установленном ст. 359 ГК РФ."
            }
          ]
        }

        Пример 2 — право удержания есть, но детали не указаны:
        Фрагмент:
        "Экспедитор вправе удерживать груз до полного расчёта с Клиентом."
        Ответ:
        {
          "lien_right_present": "yes",
          "lien_conditions": "до полного расчёта с Клиентом",
          "realization_procedure": "not_defined",
          "storage_cost_allocation": "not_specified",
          "lien_summary": "Право удержания предусмотрено до полного расчёта с Клиентом; порядок реализации и расходы на хранение не указаны",
          "evidence": [
            {
              "clause_ref": "п. 7.2",
              "quote": "Экспедитор вправе удерживать груз до полного расчёта с Клиентом."
            }
          ]
        }

        Пример 3 — текст есть, но надёжный вывод сделать нельзя:
        Фрагмент:
        "Экспедитор вправе приостановить выдачу груза до урегулирования расчётов с Клиентом."
        Ответ:
        {
          "lien_right_present": "not_defined",
          "lien_conditions": "Не удалось определить",
          "realization_procedure": "not_defined",
          "storage_cost_allocation": "not_defined",
          "lien_summary": "Не удалось определить",
          "evidence": [
            {
              "clause_ref": "п. 7.4",
              "quote": "Экспедитор вправе приостановить выдачу груза до урегулирования расчётов с Клиентом."
            }
          ]
        }

        Пример 4 — условие отсутствует:
        Фрагмент:
        "Экспедитор передаёт груз грузополучателю по прибытии."
        Ответ:
        {
          "lien_right_present": "not_defined",
          "lien_conditions": "Не установлено",
          "realization_procedure": "not_defined",
          "storage_cost_allocation": "not_defined",
          "lien_summary": "Не установлено",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Есть ли прямое условие о праве удержания груза?
        2. Не присвоено ли право удержания по умолчанию, если оно прямо не указано?
        3. Определены ли условия удержания (до оплаты вознаграждения / расходов)?
        4. Указан ли порядок реализации удержанного груза?
        5. Распределены ли расходы на хранение удержанного груза?
        6. Не смешано ли право удержания с обеспечительным платежом или залогом?
        7. Если текст есть, но вывод невозможен, использовано ли "Не удалось определить"?
        8. Все ли 6 ключей присутствуют в ответе?
        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь РОВНО одним JSON-объектом без какого-либо дополнительного текста до или после, со всеми 6 ключами:
        {
          "lien_right_present": "<yes / no / not_defined>",
          "lien_conditions": "<условия удержания или 'Не установлено' / 'Не удалось определить'>",
          "realization_procedure": "<yes / no / not_defined>",
          "storage_cost_allocation": "<client / forwarder / not_specified / not_defined>",
          "lien_summary": "<краткое резюме или 'Не установлено' / 'Не предусмотрено' / 'Не удалось определить'>",
          "evidence": [{"clause_ref": "<пункт или раздел>", "quote": "<точная цитата>"}]
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 700

    retrieval:
      retrieval_profile: "security_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "право удержания удержание груза до уплаты вознаграждения до возмещения расходов реализация удержанного груза хранение за счёт клиента расходы на хранение удержанного груза приостановить выдачу груза"
      boost_keywords:
        - "право удержания"
        - "удержание груза"
        - "удерживать груз"
        - "до уплаты вознаграждения"
        - "до возмещения расходов"
        - "реализация удержанного груза"
        - "хранение за счёт клиента"
        - "расходы на хранение удержанного"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - remedies
        - obligations
      negative_keywords:
        - "страхование"
        - "ответственность за третьих лиц"
        - "форс-мажор"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.35, 0.85]
        boost: 0.12
        scope: segment
      context_k: 6
      max_chunks: 8
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types: []
      preferred_clause_functions:
        - "remedies"
        - "obligations"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 30
      max_snippet_length: 500

    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false
      llm_max_tokens: 900

      presence_signal:
        field: "lien_right_on_cargo_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из договора транспортной экспедиции
        сведения о праве удержания груза экспедитором: наличие права, условия
        реализации, порядок реализации удержанного груза и распределение
        расходов на хранение.

        Не анализируй страхование, ответственность за третьих лиц, оплату,
        претензии и иные темы, если они не содержат сведений о праве удержания груза.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. lien_right_on_cargo_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если lien_right_present = "yes" или "no";
           - "missing" — если lien_right_present = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - lien_right_present = "not_defined";
           - realization_procedure = "not_defined";
           - storage_cost_allocation = "not_defined";
           - lien_conditions = "Не установлено";
           - lien_summary = "Не установлено";
           - не выполняй остальные шаги.

        1. lien_right_present — предусмотрено ли право удержания груза:
           "yes", "no" или "not_defined".
        2. lien_conditions — условия реализации права удержания.
        3. realization_procedure — указан ли порядок реализации удержанного груза:
           "yes", "no" или "not_defined".
        4. storage_cost_allocation — кто несёт расходы на хранение удержанного груза:
           "client", "forwarder", "not_specified" или "not_defined".
        5. lien_summary — краткое пользовательское резюме.
        6. evidence — массив точных цитат из договора.

        Правила заполнения:
        - Для lien_right_present: "yes", если прямо предусмотрено; "no", если прямо указано, что не предусмотрено; "not_defined", если отсутствует.
        - Для lien_conditions: если условия указаны, верни их кратко; если не указаны, верни "Не установлено"; если вывод невозможен, верни "Не удалось определить".
        - Для realization_procedure: "yes", если порядок указан; "no", если прямо указано, что не устанавливается; "not_defined", если не упомянут.
        - Для storage_cost_allocation: "client" или "forwarder" при прямом указании; "not_specified", если тема упомянута, но распределение не указано; "not_defined", если отсутствует.
        - Для lien_summary: если право и детали указаны, верни краткий факт; если право есть, но детали не указаны, верни "Право удержания предусмотрено; порядок реализации и расходы на хранение не указаны"; если прямо исключено, верни "Не предусмотрено"; если отсутствует, верни "Не установлено"; если вывод невозможен, верни "Не удалось определить".
        - Не считай право удержания существующим по умолчанию. Фиксируй только если прямо указано.
        - Не выводи право удержания из ст. 3 ФЗ-87 или ст. 359 ГК РФ — только из текста договора.
        - Если данных нет, верни пустой массив [] для evidence.
        </task>

        <context_rules>
        - Перед остальными полями заполни lien_right_on_cargo_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — lien_right_present = "not_defined", lien_summary = "Не установлено".
        - Используй только предоставленный контекст.
        - Не выдумывай условия удержания, порядок реализации и распределение расходов на хранение.
        - Не считай право удержания существующим по умолчанию.
        - Не путай право удержания груза с обеспечительным платежом, залогом или иными способами обеспечения обязательств.
        - Если фрагменты конфликтуют и не позволяют сделать надёжный вывод, верни "Не удалось определить" для lien_summary и включи конфликтующие цитаты в evidence.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет упоминания права удержания груза.
           → presence = "missing";
             lien_right_present = "not_defined";
             lien_summary = "Не установлено".

        2. Неполное раскрытие темы.
           Право удержания предусмотрено, но порядок реализации или расходы на хранение не указаны.
           → presence = "present";
             lien_right_present = "yes";
             соответствующие детали = "not_defined" или "not_specified";
             lien_summary = "Право удержания предусмотрено; порядок реализации и расходы на хранение не указаны".

        3. Противоречие между фрагментами.
           В разных частях договора указаны разные условия удержания или распределения расходов.
           → presence = "unclear";
             lien_summary = "Не удалось определить".

        4. Прямое исключение.
           В договоре прямо указано, что право удержания груза не предусмотрено.
           → presence = "present";
             lien_right_present = "no";
             lien_summary = "Не предусмотрено".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для lien_right_on_cargo_presence используй только: "present", "missing", "unclear".
        - Для статусных enum-полей используй только: "yes", "no", "not_defined", "client", "forwarder", "not_specified".
        - Fallback при отсутствии данных:
          * lien_conditions → "Не установлено";
          * lien_summary → "Не установлено".
        - Fallback при противоречии или неоднозначности:
          * lien_summary → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "lien_right_on_cargo_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
