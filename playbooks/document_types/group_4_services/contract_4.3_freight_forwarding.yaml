        - "переадресация"
        - "право давать распоряжения"
        - "обязанность исполнять распоряжения"
        - "дополнительные расходы при изменении"
        - "момент прекращения распоряжений"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)распоряжени[еяюем].*груз"
        - "(?i)распоряжени[еяюем].*клиент"
        - "(?i)изменени[еяю].*грузополучател"
        - "(?i)изменени[еяю].*маршрут"
        - "(?i)возврат.*груз"
        - "(?i)переадресац"
        - "(?i)право.*распоряжени"
        - "(?i)исполнени.*распоряжени"
        - "(?i)дополнительн.*расход.*изменени"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор транспортной экспедиции (ст. 805 ГК РФ).

        Проверяется только один вопрос: право клиента давать распоряжения о
        грузе в процессе перевозки и связанные с этим условия.

        Нормативный ориентир:
        - ст. 805 ГК РФ.

        Важно:
        - Твоя задача — не оценивать серьёзность риска.
        - Только установить, что прямо есть в тексте договора, а чего прямо нет.
        - Не выводи право распоряжений из закона. Фиксируй только если прямо указано.
        - Не путай распоряжения о грузе с поручением экспедитору (это разные документы).
        - Не путай распоряжения о грузе с односторонним отказом от договора.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Право клиента давать распоряжения о грузе в процессе перевозки.
        2. Форма распоряжения (письменная / электронная / устная).
        3. Обязанность экспедитора исполнять распоряжения.
        4. Оплата дополнительных расходов при изменении распоряжений.
        5. Момент, после которого распоряжения давать нельзя.
        6. Сформируй краткое пользовательское резюме.
        7. Собери точные цитаты в evidence.

        [ПРАВИЛА]
        1. Используй только предоставленный текст договора.
        2. Если данные отсутствуют:
           - для статусных полей используй "not_defined";
           - для видимых текстовых полей используй "Не установлено".
        3. Не используй null, None, пустые строки.
        4. Если текст есть, но надёжный вывод сделать нельзя:
           - для статусных полей используй "not_defined";
           - для видимых текстовых полей используй "Не удалось определить".
        5. Не выводи право распоряжений из закона. Фиксируй только если прямо указано.
        6. Не путай распоряжения о грузе с поручением экспедитору или односторонним отказом.
        7. Верни РОВНО один JSON-объект со всеми 6 ключами без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.
        8. В evidence включай только точные цитаты из документа. Если данных нет, верни пустой массив [].
        9. Поле disposition_summary должно быть кратким.

        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1 — полный набор условий:
        Фрагмент:
        "Клиент вправе давать распоряжения об изменении грузополучателя, маршрута или возврате груза до момента прибытия груза в пункт назначения. Распоряжения направляются в письменной форме. Экспедитор обязан исполнить распоряжение. Дополнительные расходы возмещаются Клиентом."
        Ответ:
        {
          "disposition_right_specified": "yes",
          "disposition_form_specified": "yes",
          "forwarder_execution_duty": "yes",
          "additional_costs_allocation": "client",
          "disposition_summary": "Клиент вправе давать распоряжения до прибытия груза; письменная форма; экспедитор обязан исполнить; доп. расходы — на клиенте",
          "evidence": [
            {
              "clause_ref": "п. 4.5",
              "quote": "Клиент вправе давать распоряжения об изменении грузополучателя, маршрута или возврате груза до момента прибытия груза в пункт назначения. Распоряжения направляются в письменной форме. Экспедитор обязан исполнить распоряжение. Дополнительные расходы возмещаются Клиентом."
            }
          ]
        }

        Пример 2 — только упоминание права:
        Фрагмент:
        "Клиент вправе давать распоряжения о грузе в процессе перевозки."
        Ответ:
        {
          "disposition_right_specified": "yes",
          "disposition_form_specified": "not_defined",
          "forwarder_execution_duty": "not_defined",
          "additional_costs_allocation": "not_defined",
          "disposition_summary": "Право распоряжений указано; форма, обязанность исполнения и расходы не определены",
          "evidence": [
            {
              "clause_ref": "п. 4.1",
              "quote": "Клиент вправе давать распоряжения о грузе в процессе перевозки."
            }
          ]
        }

        Пример 3 — условие отсутствует:
        Фрагмент:
        "Экспедитор организует перевозку груза."
        Ответ:
        {
          "disposition_right_specified": "not_defined",
          "disposition_form_specified": "not_defined",
          "forwarder_execution_duty": "not_defined",
          "additional_costs_allocation": "not_defined",
          "disposition_summary": "Не установлено",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Есть ли прямое указание на право клиента давать распоряжения?
        2. Не выведено ли право из закона по умолчанию?
        3. Указана ли форма распоряжения?
        4. Указана ли обязанность экспедитора исполнять?
        5. Указано ли распределение дополнительных расходов?
        6. Указан ли момент прекращения права распоряжений?
        7. Не смешаны ли распоряжения с поручением экспедитору?
        8. Не смешаны ли распоряжения с односторонним отказом?
        9. Все ли 6 ключей присутствуют в ответе?
        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь РОВНО одним JSON-объектом без какого-либо дополнительного текста до или после, со всеми 6 ключами:
        {
          "disposition_right_specified": "<yes / no / not_defined>",
          "disposition_form_specified": "<yes / no / not_defined>",
          "forwarder_execution_duty": "<yes / no / not_defined>",
          "additional_costs_allocation": "<client / forwarder / shared / not_defined>",
          "disposition_summary": "<краткое резюме или 'Не установлено' / 'Не удалось определить'>",
          "evidence": [{"clause_ref": "<пункт или раздел>", "quote": "<точная цитата>"}]
        }
      context_k: 5
      temperature: 0.0
      max_tokens: 600

    retrieval:
      retrieval_profile: "scope_of_work_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "распоряжения клиента о грузе изменение грузополучателя изменение маршрута возврат груза переадресация право давать распоряжения обязанность исполнять распоряжения дополнительные расходы при изменении"
      boost_keywords:
        - "распоряжения клиента"
        - "распоряжение о грузе"
        - "изменение грузополучателя"
        - "изменение маршрута"
        - "возврат груза"
        - "переадресация"
        - "право давать распоряжения"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - procedures
      negative_keywords:
        - "означает"
        - "в целях настоящего"
        - "поручение экспедитору"
        - "односторонний отказ"
      position_bias:
        preferred_range: [0.25, 0.70]
        boost: 0.12
        scope: segment
      context_k: 5
      max_chunks: 6
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "obligations"
        - "procedures"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 30
      max_snippet_length: 500

    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false
      llm_max_tokens: 800

      presence_signal:
        field: "cargo_disposition_instructions_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из договора транспортной экспедиции
        сведения о праве клиента давать распоряжения о грузе в процессе
        перевозки: право, форма, обязанность исполнения, распределение
        дополнительных расходов, момент прекращения права.

        Не анализируй поручение экспедитору, односторонний отказ от договора,
        вознаграждение, ответственность и иные темы, если они не содержат
        сведений о распоряжениях клиента о грузе.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. cargo_disposition_instructions_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если disposition_right_specified = "yes" или "no";
           - "missing" — если disposition_right_specified = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - disposition_right_specified = "not_defined";
           - disposition_form_specified = "not_defined";
           - forwarder_execution_duty = "not_defined";
           - additional_costs_allocation = "not_defined";
           - disposition_summary = "Не установлено";
           - не выполняй остальные шаги.

        1. disposition_right_specified — право клиента давать распоряжения о грузе:
           "yes", "no" или "not_defined".
        2. disposition_form_specified — форма распоряжения:
           "yes", "no" или "not_defined".
        3. forwarder_execution_duty — обязанность экспедитора исполнять распоряжения:
           "yes", "no" или "not_defined".
        4. additional_costs_allocation — распределение дополнительных расходов:
           "client", "forwarder", "shared" или "not_defined".
        5. disposition_summary — краткое пользовательское резюме.
        6. evidence — массив точных цитат из договора.

        Правила заполнения:
        - Для disposition_right_specified: "yes", если право прямо предусмотрено; "no", если прямо указано, что право не предоставляется; "not_defined", если отсутствует.
        - Для disposition_form_specified: "yes", если форма прямо указана (письменная, электронная, устная); "no", если прямо указано, что форма не устанавливается; "not_defined", если отсутствует.
        - Для forwarder_execution_duty: "yes", если обязанность исполнять прямо указана; "no", если прямо указано, что экспедитор вправе не исполнять; "not_defined", если отсутствует.
        - Для additional_costs_allocation: "client", если расходы несёт клиент; "forwarder", если экспедитор; "shared", если распределены; "not_defined", если отсутствует.
        - Для disposition_summary: если право и условия указаны, верни краткий факт; если только право, верни "Право распоряжений указано; детали не определены"; если прямо исключено, верни "Не предусмотрено"; если отсутствует, верни "Не установлено".
        - Не выводи право распоряжений из закона. Не путай с поручением или односторонним отказом.
        - Если данных нет, верни пустой массив [] для evidence.
        </task>

        <context_rules>
        - Перед остальными полями заполни cargo_disposition_instructions_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined", disposition_summary = "Не установлено".
        - Используй только предоставленный контекст.
        - Не выводи право распоряжений из закона.
        - Не путай распоряжения о грузе с поручением экспедитору.
        - Не путай распоряжения о грузе с односторонним отказом от договора.
        - Если фрагменты конфликтуют и не позволяют сделать надёжный вывод, верни "Не удалось определить" для disposition_summary и включи конфликтующие цитаты в evidence.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет упоминания распоряжений клиента о грузе.
           → presence = "missing";
             disposition_right_specified = "not_defined";
             disposition_summary = "Не установлено".

        2. Неполное раскрытие темы.
           Право распоряжений указано, но форма, обязанность исполнения и расходы не определены.
           → presence = "present";
             disposition_right_specified = "yes";
             остальные = "not_defined";
             disposition_summary = "Право распоряжений указано; детали не определены".

        3. Противоречие между фрагментами.
           В разных частях договора указаны противоречащие условия распоряжений.
           → presence = "unclear";
             disposition_summary = "Не удалось определить".

        4. Прямое исключение.
           В договоре прямо указано, что право распоряжений не предоставляется или ограничено.
           → presence = "present";
             disposition_right_specified = "no";
             disposition_summary = "Не предусмотрено".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для cargo_disposition_instructions_presence используй только: "present", "missing", "unclear".
        - Для статусных enum-полей используй только: "yes", "no", "not_defined", "client", "forwarder", "shared".
        - Fallback при отсутствии данных:
          * disposition_summary → "Не установлено".
        - Fallback при противоречии или неоднозначности:
          * disposition_summary → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "cargo_disposition_instructions_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования о распоряжениях клиента о грузе. Внутреннее агрегатное signal-поле."
          required: true

        - name: "disposition_right_specified"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Право клиента давать распоряжения о грузе в процессе перевозки. Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "disposition_form_specified"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Форма распоряжения о грузе (письменная, электронная, устная). Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "forwarder_execution_duty"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Обязанность экспедитора исполнять распоряжения клиента о грузе. Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "additional_costs_allocation"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["client", "forwarder", "shared", "not_defined"]
          description: "Распределение дополнительных расходов при изменении распоряжений. Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "disposition_summary"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 1
          label: "Распоряжения клиента о грузе"
          description: >
            Краткое описание права клиента давать распоряжения о грузе: право, форма, исполнение, расходы. Fallback: "Не установлено" / "Не удалось определить".
          required: true

        - name: "evidence"
          type: "array"
          presentation: "diagnostic"
          description: "Точные цитаты из договора, подтверждающие извлечённые значения."
          required: true
          display_in_grid: false

      store_payload: true

# ════════════════════════════════════════════════════════════════════════════
# БЛОК 5: DD_REQUEST_TEMPLATES
# Читается: DDRequestTemplateLoader
# ════════════════════════════════════════════════════════════════════════════

dd_request_templates:
  parties_identification:
    text: >
      Просим подтвердить по {doc_names}: полные реквизиты экспедитора и клиента
      (наименование, ИНН, ОГРН, адрес), полномочия подписантов, а также
      подтверждение статуса экспедитора (реестр экспедиторов по ст. 2 ФЗ-87).
    addressee: "Обе стороны"
  forwarding_subject_extraction:
    text: >
      Просим подтвердить по {doc_names}: (а) полный перечень экспедиторских услуг;
      (б) характеристики груза; (в) маршрут/направления; (г) ссылку на Поручение
      экспедитору; (д) вид договора (разовый/рамочный).
    addressee: "Обе стороны"
  forwarding_receipt_check:
    text: >
      Просим уточнить в {doc_names}: (а) форму экспедиторской расписки;
      (б) порядок выдачи при приёме груза; (в) ссылку на Приказ Минтранса № 23.
    addressee: "Экспедитор"
  forwarder_instructions_check:
    text: >
      Просим уточнить в {doc_names}: (а) форму Поручения экспедитору;
      (б) является ли оно неотъемлемой частью договора; (в) требования к содержанию;
      (г) порядок направления и подтверждения.
    addressee: "Обе стороны"
  liability_for_third_parties:
    text: >
      В {doc_names} ОБЯЗАТЕЛЬНО должно быть указано, что экспедитор отвечает
      за действия привлечённых третьих лиц (перевозчиков, таможенных брокеров)
      как за свои собственные (ст. 803, 805 ГК РФ). Просим включить/подтвердить
      наличие этого условия. Формулировки «не отвечает за перевозчика»
      противоречат закону.
    addressee: "Юридический советник"
  remuneration_and_expenses_check:
    text: >
      Просим подтвердить по {doc_names}: (а) размер вознаграждения экспедитора;
      (б) порядок возмещения расходов; (в) наличие лимитов расходов;
      (г) процедуру согласования превышений; (д) авансирование.
    addressee: "Обе стороны"
  forwarder_report:
    text: >
      Просим уточнить в {doc_names}: (а) форму отчёта экспедитора; (б) сроки
      представления; (в) приложения (документы, подтверждающие расходы);
      (г) порядок утверждения.
    addressee: "Обе стороны"
  report_approval_mechanism:
    text: >
      Просим включить в {doc_names}: механизм «молчаливого согласия» — отчёт
      считается утверждённым при отсутствии возражений в течение N дней.
    addressee: "Юридический советник экспедитора"
  expenses_approval_mechanism:
    text: >
      Просим включить в {doc_names}: механизм предварительного согласования
      расходов, превышающих установленный лимит.
    addressee: "Юридический советник клиента"
  expenses_limit:
    text: >
      Просим согласовать в {doc_names}: максимальный лимит расходов экспедитора
      и последствия его превышения.
    addressee: "Обе стороны"
  cargo_insurance_obligation:
    text: >
      Просим уточнить в {doc_names}: (а) обязательность страхования груза;
      (б) кто страхует (экспедитор/клиент); (в) вид покрытия (all risks / named perils);
      (г) минимальную страховую сумму; (д) выгодоприобретателя.
    addressee: "Обе стороны"
  carrier_selection_approval:
    text: >
      Просим включить в {doc_names}: механизм согласования выбора перевозчика,
      критерии выбора, раскрытие аффилированности, право клиента на вето.
    addressee: "Юридический советник клиента"
  customs_liability_allocation:
    text: >
      В {doc_names} предусмотрено таможенное оформление. Просим подтвердить:
      (а) статус таможенного брокера/представителя (реестр, ст. 404 ТК ЕАЭС);
      (б) распределение ответственности за таможенные штрафы;
      (в) ответственность за недостоверные данные клиента.
    addressee: "Обе стороны"
  lien_right_on_cargo:
    text: >
      Просим уточнить в {doc_names}: (а) право удержания груза при неоплате;
      (б) порядок реализации удержанного груза; (в) распределение расходов на хранение.
    addressee: "Юридический советник"
  unilateral_refusal_penalty:
    text: >
      Просим уточнить в {doc_names}: (а) право клиента на односторонний отказ;
      (б) штраф 10% от стоимости услуг (ст. 806 ГК РФ, ст. 6 ФЗ-87);
      (в) возмещение фактических расходов; (г) срок уведомления.
    addressee: "Юридический советник"
  liability_limits_and_cargo_value_check:
    text: >
      Просим предоставить по {doc_names}: условия ответственности за утрату/повреждение
      груза, лимит ответственности, механизм объявления ценности, соответствие лимита
      требованиям ст. 7 ФЗ-87, а также ответственность за просрочку доставки.
    addressee: "Юридический советник"
  delivery_deadline_and_delay_penalty_check:
    text: >
      Просим предоставить по {doc_names}: срок доставки (или порядок его определения),
      санкции за просрочку, лимит неустойки, исключения для форс-мажора.
    addressee: "Обе стороны"
  forwarder_information_duties_check:
    text: >
      Просим предоставить по {doc_names}: перечень информационных обязанностей
      экспедитора, включая уведомление о задержках, повреждениях, статусе доставки,
      а также сроки и способы уведомления.
    addressee: "Юридический советник клиента"
  dangerous_cargo_duties_check:
    text: >
      По {doc_names} (опасный груз) просим предоставить: обязанности клиента
      по раскрытию класса опасности, маркировке, упаковке, аварийной карточке;
      обязанности экспедитора по выбору сертифицированного перевозчика;
      ответственность за нераскрытие опасных свойств.
    addressee: "Обе стороны"
  exclusions_from_liability:
    text: >
      Просим согласовать в {doc_names}: перечень обстоятельств, освобождающих
      экспедитора от ответственности (непреодолимая сила, вина клиента,
      действия госорганов).
    addressee: "Юридический советник"
  pretension_order:
    text: >
      Просим согласовать в {doc_names}: претензионный порядок, сроки претензий,
      форму, порядок рассмотрения.
    addressee: "Юридический советник"
  limitation_period:
    text: >
      Просим включить в {doc_names}: указание на сокращённый срок исковой
      давности (1 год) по требованиям из экспедиции.
    addressee: "Юридический советник"
  service_period:
    text: >
      Просим уточнить в {doc_names}: срок действия договора, условия продления.
    addressee: "Обе стороны"
  client_documents_provision:
    text: >
      Просим включить в {doc_names}: обязанность клиента своевременно предоставлять
      полный комплект документов, ответственность за достоверность сведений,
      право экспедитора приостановить исполнение при непредоставлении.
    addressee: "Юридический советник экспедитора"
  dispute_resolution:
    text: >
      Просим согласовать в {doc_names}: подсудность, претензионный порядок.
    addressee: "Юридический советник"
  forwarder_license_sro:
    text: >
      Просим предоставить по {doc_names}: подтверждение статуса экспедитора
      (включение в реестр экспедиторов по ст. 2 ФЗ-87).
    addressee: "Экспедитор"
  cmr_incoterms_reference:
    text: >
      По {doc_names} (международная экспедиция) просим подтвердить применимость
      CMR/КДПГ, указать базис Инкотермс, распределение рисков и расходов.
    addressee: "Обе стороны"
  sla_kpi_terms:
    text: >
      Просим включить в {doc_names}: измеримые показатели качества (SLA/KPI),
      методику измерения, последствия нарушения, отчётность.
    addressee: "Обе стороны"
  acceptance_and_delivery_acts:
    text: >
      Просим уточнить в {doc_names}: форму актов приёма-передачи груза,
      порядок фиксации повреждений, сроки подписания.
    addressee: "Обе стороны"
  force_majeure_clause:
    text: >
      Просим согласовать в {doc_names}: перечень обстоятельств непреодолимой силы,
      порядок уведомления и подтверждения.
    addressee: "Юридический советник"
  confidentiality:
    text: >
      Просим включить в {doc_names}: условие о конфиденциальности коммерческих условий.
    addressee: "Юридический советник"
  vat_and_tax:
    text: >
      Просим уточнить в {doc_names}: режим НДС, порядок документооборота.
    addressee: "Бухгалтерия"
  anticorruption_clause:
    text: >
      Просим включить в {doc_names} антикоррупционную оговорку (ФЗ-273).
    addressee: "Юридический советник"
  auto_renewal:
    text: >
      Просим уточнить в {doc_names}: условия автопролонгации, срок уведомления
      о непродлении.
    addressee: "Юридический советник"
  _default:
    text: >
      Просим предоставить дополнительную информацию по вопросу «{check_name}»
      применительно к {doc_names}.
    addressee: "Юридический советник"
