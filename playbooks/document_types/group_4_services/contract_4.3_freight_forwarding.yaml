      llm_max_tokens: 900
      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из договора транспортной экспедиции
        сведения о механизме конкретизации перевозок: Поручении экспедитору,
        заявке на перевозку или заказе.

        Не анализируй вознаграждение, ответственность, страхование, претензии
        и иные темы, если они не содержат сведений о механизме Поручений/заявок.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        1. order_mentioned — "yes", "no" или "not_defined".
        2. order_form_specified — "yes", "no" или "not_defined".
        3. order_as_integral_part — "yes", "no" или "not_defined".
        4. order_content_requirements — "yes", "no" или "not_defined".
        5. order_summary — краткое пользовательское резюме.
        6. evidence — массив точных цитат из договора.

        Правила заполнения:

        Для order_mentioned:
        - "yes", если прямо упомянуто Поручение экспедитору, заявка на перевозку, заявка на экспедирование или заказ, выполняющие функцию конкретизации перевозки;
        - "no", если прямо указано, что такие документы не используются;
        - "not_defined", если упоминания нет или вывод невозможен.

        Для order_form_specified:
        - "yes", если форма прямо указана (приложение, шаблон, приказ, свободная форма);
        - "no", если прямо указано, что форма не установлена;
        - "not_defined", если форма не упомянута.

        Для order_as_integral_part:
        - "yes", если прямо указано, что документ является неотъемлемой частью договора;
        - "no", если прямо указано обратное;
        - "not_defined", если это не указано.

        Для order_content_requirements:
        - "yes", если перечислены требования к содержанию (сведения о грузе, маршруте, сроках и т.д.);
        - "no", если прямо указано, что требования не устанавливаются;
        - "not_defined", если требования не описаны.

        Для order_summary:
        - если форма, неотъемлемость и содержание указаны, верни краткий факт, например: "Форма Поручения — Приложение № 1; является неотъемлемой частью договора; требования к содержанию установлены";
        - если документ упомянут, но детали не указаны, верни: "Поручение упомянуто; форма и порядок не указаны" или "Заявки на перевозку упоминаются; форма и содержание не определены";
        - если не упомянуто, верни: "Не упомянуто";
        - если текст есть, но надёжный вывод сделать нельзя, верни: "Не удалось определить".

        Если данных нет, верни пустой массив [] для evidence.
        </task>

        <context_rules>
        - Используй только предоставленный контекст.
        - Не путай Поручение (заявку) с экспедиторской распиской, актом приёма-передачи или транспортной накладной.
        - Не считай Поручение неотъемлемой частью договора только потому, что к договору есть приложения, если это не указано прямо.
        - Не выдумывай форму или требования к содержанию, если они не описаны в тексте.
        - Если фрагменты конфликтуют и не позволяют сделать надёжный вывод, верни "Не удалось определить" для order_summary и включи конфликтующие цитаты в evidence.
        </context_rules>

        <output_expectations>
        Все перечисленные ключи должны присутствовать в ответе, даже если значение равно "not_defined", "Не упомянуто" или "Не удалось определить".

        Запрещено возвращать:
        - null;
        - None;
        - пустые строки;
        - пояснения до или после JSON;
        - Markdown;
        - код-фенсы;
        - списки вне JSON.

        Верни РОВНО один JSON-объект со всеми 6 ключами без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.
        </output_expectations>

      fields:
        - name: "order_mentioned"
          type: "string"
          presentation: "signal"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Упоминание Поручения экспедитору, заявки или заказа на перевозку."
          required: true
          display_in_grid: false

        - name: "order_form_specified"
          type: "string"
          presentation: "signal"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Указана ли форма Поручения или заявки."
          required: true
          display_in_grid: false

        - name: "order_as_integral_part"
          type: "string"
          presentation: "signal"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Является ли Поручение или заявка неотъемлемой частью договора."
          required: true
          display_in_grid: false

        - name: "order_content_requirements"
          type: "string"
          presentation: "signal"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Определены ли требования к содержанию Поручения или заявки."
          required: true
          display_in_grid: false

        - name: "order_summary"
          type: "string"
          presentation: "fact"
          label: "Поручение экспедитору"
          description: "Краткое описание механизма Поручения экспедитору (заявки/заказа): упоминание, форма, неотъемлемая часть, требования к содержанию."
          required: true
          display_in_grid: true
          display_priority: 1

        - name: "evidence"
          type: "array"
          presentation: "diagnostic"
          description: "Точные цитаты из договора, подтверждающие извлечённые значения."
          required: true
          display_in_grid: false

  - id: liability_for_third_parties
    name: "Ответственность экспедитора за третьих лиц (ст. 803, 805 ГК РФ)"
    description: >
      Фактографическая проверка наличия условия о том, что экспедитор отвечает
      за действия привлечённых третьих лиц (перевозчиков, таможенных представителей,
      субисполнителей) как за свои собственные. Также фиксируются право привлекать
      третьих лиц и любые ограничения или исключения такой ответственности.
      Условия, ограничивающие ответственность экспедитора за третьих лиц,
      требуют отдельной правовой оценки.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "отвечает за действия третьих лиц"
        - "как за свои собственные"
        - "третьи лица"
        - "привлечение третьих лиц"
        - "привлечённые лица"
        - "перевозчик"
        - "таможенный представитель"
        - "таможенный брокер"
        - "субисполнитель"
        - "полная ответственность"
        - "ответственность за выбор перевозчика"
        - "ответственность за сохранность груза"
        - "независимо от вины третьих лиц"
        - "ст. 803"
        - "ст. 805"
        - "не несёт ответственности за перевозчика"
        - "только посредник"
        - "с согласия клиента"
        - "письменное согласие клиента"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)отвеча(ет|ть)\\s+за\\s+действия.*третьих\\s+лиц.*как\\s+за\\s+свои"
        - "(?i)третьих\\s+лиц"
        - "(?i)как\\s+за\\s+свои"
        - "(?i)привлечени[еяем]\\s+третьих"
        - "(?i)ст\\.?\\s*803|ст\\.?\\s*805"
        - "(?i)не\\s+нес[её]т\\s+ответственност.*за\\s+перевозчик"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор транспортной экспедиции (Глава 41 ГК РФ; ФЗ-87).

        Проверяется только один вопрос: ответственность экспедитора за действия
        привлечённых третьих лиц — перевозчиков, таможенных представителей,
        субисполнителей и иных лиц, привлечённых экспедитором для исполнения
        обязательств по договору.

        Нормативный ориентир:
        - ст. 803 ГК РФ;
        - ст. 805 ГК РФ;
        - ФЗ-87 «О транспортно-экспедиционной деятельности».

        Важно:
        - Твоя задача — не оценивать серьёзность риска и не оценивать действительность условий.
        - Только установить, что прямо есть в тексте договора, а чего прямо нет.
        - Если встречается формулировка об освобождении или ограничении ответственности,
          зафиксируй её как факт, не оценивая её соответствие закону.
        - Не выводи ответственность из закона, если её нет в тексте договора.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Наличие условия об ответственности экспедитора за третьих лиц.
        2. Основание ответственности: как за свои действия, совместная/солидарная, ограниченная, исключённая или не определена.
        3. Право привлекать третьих лиц: свободно, с согласия клиента, запрещено или не определено.
        4. Наличие исключений из ответственности за третьих лиц.
        5. Сформируй краткое пользовательское резюме для поля liability_for_third_parties_summary.
        6. Собери точные цитаты в evidence.

        [ПРАВИЛА]
        1. Используй только предоставленный текст договора.
        2. Если данные отсутствуют:
           - для статусных и перечислимых полей используй "not_defined";
           - для видимого текстового поля используй "Не установлено".
        3. Не используй null, None, пустые строки.
        4. Если текст есть, но надёжный вывод сделать нельзя:
           - для статусных и перечислимых полей используй "not_defined";
           - для видимого текстового поля используй "Не удалось определить".
        5. Верни РОВНО один JSON-объект со всеми 6 ключами без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.
        6. В evidence включай только точные цитаты из документа. Если данных нет, верни пустой массив [].
        7. Для liability_for_third_parties_present:
           "yes" — если экспедитор прямо отвечает за действия третьих лиц как за свои собственные;
           "limited" — если ответственность за третьих лиц ограничена, в том числе ответственностью за выбор третьих лиц;
           "no" — если прямо указано, что экспедитор не отвечает за действия третьих лиц;
           "not_defined" — если условие не найдено или вывод невозможен.
        8. Для liability_basis:
           "own_actions" — ответственность как за свои собственные действия;
           "joint_and_several" — совместная или солидарная ответственность;
           "limited" — любое ограничение или исключение ответственности, включая прямое освобождение от ответственности;
           "not_defined" — основание не определено.
        9. Для right_to_engage_third_parties:
           "yes" — экспедитор вправе привлекать третьих лиц без дополнительного согласия клиента;
           "with_consent" — привлечение третьих лиц допускается с согласия клиента;
           "no" — привлечение третьих лиц запрещено или исполнение осуществляется лично;
           "not_defined" — право не определено.
        10. Поле exclusions_from_liability фиксирует только исключения из ответственности за действия третьих лиц.
            Общие исключения ответственности, форс-мажор, вина клиента или лимиты ответственности,
            не привязанные к третьим лицам, сюда не относятся.
        11. Поле liability_for_third_parties_summary должно быть кратким, без длинных цитат и правовых оценок.

        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1 — полная ответственность и право привлекать третьих лиц без согласия:
        Фрагмент:
        "Экспедитор отвечает за действия привлечённых им третьих лиц (перевозчиков, таможенных представителей) как за свои собственные в соответствии со ст. 803 ГК РФ. Экспедитор вправе привлекать третьих лиц без дополнительного согласия Клиента."
        Ответ:
        {
          "liability_for_third_parties_present": "yes",
          "liability_basis": "own_actions",
          "right_to_engage_third_parties": "yes",
          "exclusions_from_liability": "not_defined",
          "liability_for_third_parties_summary": "Экспедитор отвечает за действия третьих лиц как за свои собственные; привлечение третьих лиц без согласия клиента",
          "evidence": [
            {
              "clause_ref": "п. 6.1",
              "quote": "Экспедитор отвечает за действия привлечённых им третьих лиц (перевозчиков, таможенных представителей) как за свои собственные в соответствии со ст. 803 ГК РФ. Экспедитор вправе привлекать третьих лиц без дополнительного согласия Клиента."
            }
          ]
        }

        Пример 2 — ограниченная ответственность и привлечение с согласия клиента:
        Фрагмент:
        "Экспедитор вправе привлекать перевозчиков только с письменного согласия Клиента. Экспедитор отвечает за действия привлечённых перевозчиков в пределах своей вины."
        Ответ:
        {
          "liability_for_third_parties_present": "limited",
          "liability_basis": "limited",
          "right_to_engage_third_parties": "with_consent",
          "exclusions_from_liability": "not_defined",
          "liability_for_third_parties_summary": "Ответственность за действия третьих лиц ограничена; привлечение третьих лиц с письменного согласия клиента",
          "evidence": [
            {
              "clause_ref": "п. 5.4",
              "quote": "Экспедитор вправе привлекать перевозчиков только с письменного согласия Клиента. Экспедитор отвечает за действия привлечённых перевозчиков в пределах своей вины."
            }
          ]
        }

        Пример 3 — попытка исключения ответственности:
        Фрагмент:
        "Экспедитор является только посредником и не несёт ответственности за действия перевозчика."
        Ответ:
        {
          "liability_for_third_parties_present": "no",
          "liability_basis": "limited",
          "right_to_engage_third_parties": "not_defined",
          "exclusions_from_liability": "yes",
          "liability_for_third_parties_summary": "Ответственность за действия третьих лиц исключена",
          "evidence": [
            {
              "clause_ref": "п. 6.2",
              "quote": "Экспедитор является только посредником и не несёт ответственности за действия перевозчика."
            }
          ]
        }

        Пример 4 — условие отсутствует:
        Фрагмент:
        "Экспедитор организует перевозку груза."
        Ответ:
        {
          "liability_for_third_parties_present": "not_defined",
          "liability_basis": "not_defined",
          "right_to_engage_third_parties": "not_defined",
          "exclusions_from_liability": "not_defined",
          "liability_for_third_parties_summary": "Не установлено",
          "evidence": []
        }

        Пример 5 — текст есть, но надёжный вывод сделать нельзя:
        Фрагмент:
        "Экспедитор вправе привлекать перевозчиков, при этом распределение ответственности между Экспедитором и перевозчиками определяется отдельными договорами."
        Ответ:
        {
          "liability_for_third_parties_present": "not_defined",
          "liability_basis": "not_defined",
          "right_to_engage_third_parties": "yes",
          "exclusions_from_liability": "not_defined",
          "liability_for_third_parties_summary": "Не удалось определить",
          "evidence": [
            {
              "clause_ref": "п. 5.7",
              "quote": "Экспедитор вправе привлекать перевозчиков, при этом распределение ответственности между Экспедитором и перевозчиками определяется отдельными договорами."
            }
          ]
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Есть ли прямое условие об ответственности экспедитора за третьих лиц?
        2. Сформулировано ли оно как ответственность за свои собственные действия?
        3. Есть ли ограничение или исключение ответственности за третьих лиц?
        4. Определено ли право привлекать третьих лиц: свободно, с согласия или запрещено?
        5. Не смешаны ли исключения за третьих лиц с общими исключениями ответственности?
        6. Если текст есть, но вывод невозможен, использовано ли "Не удалось определить"?
        7. Все ли 6 ключей присутствуют в ответе?
        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь РОВНО одним JSON-объектом без какого-либо дополнительного текста до или после, со всеми 6 ключами:
        {
          "liability_for_third_parties_present": "<yes / no / limited / not_defined>",
          "liability_basis": "<own_actions / joint_and_several / limited / not_defined>",
          "right_to_engage_third_parties": "<yes / with_consent / no / not_defined>",
          "exclusions_from_liability": "<yes / no / not_defined>",
          "liability_for_third_parties_summary": "<краткое резюме или 'Не установлено' / 'Не удалось определить'>",
          "evidence": [{"clause_ref": "<пункт или раздел>", "quote": "<точная цитата>"}]
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 700

    retrieval:
      retrieval_profile: "liability_cap_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "ответственность экспедитора за третьих лиц как за свои собственные привлечение третьих лиц перевозчик таможенный представитель субисполнитель ответственность за выбор перевозчика право привлекать третьих лиц с согласия клиента ст. 803 ст. 805 полная ответственность ограничение ответственности исключение ответственности"
      boost_keywords:
        - "третьи лица"
        - "привлечение третьих лиц"
        - "привлечённые лица"
        - "перевозчик"
        - "таможенный представитель"
        - "субисполнитель"
        - "как за свои собственные"
