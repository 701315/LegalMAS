      enabled: true
      mode: "hybrid"
      compact_output: false
      llm_max_tokens: 900
      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из договора транспортной экспедиции
        сведения об обстоятельствах, освобождающих экспедитора от ответственности:
        форс-мажор, вина клиента, недостатки груза, действия таможенных органов
        и иные типоспецифичные основания.

        Не анализируй страхование, удержание, оплату, претензии и иные темы,
        если они не содержат сведений об основаниях освобождения от ответственности.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        1. force_majeure_exclusion — упомянут ли форс-мажор / непреодолимая сила как основание освобождения:
           "yes", "no" или "not_defined".
        2. client_fault_exclusion — упомянута ли вина клиента как основание освобождения:
           "yes", "no" или "not_defined".
        3. cargo_defects_exclusion — упомянуты ли недостатки груза (скрытые, естественные свойства) как основание освобождения:
           "yes", "no" или "not_defined".
        4. customs_authorities_exclusion — упомянуты ли действия таможенных органов как основание освобождения:
           "yes", "no" или "not_defined".
        5. other_exclusions_details — иные основания освобождения (действия иных госорганов, непредоставление документов и т.п.).
        6. exclusions_summary — краткое пользовательское резюме.
        7. evidence — массив точных цитат из договора.

        Правила заполнения:

        Для force_majeure_exclusion:
        - "yes", если форс-мажор / непреодолимая сила прямо указаны как основание освобождения;
        - "no", если прямо указано, что форс-мажор не освобождает от ответственности;
        - "not_defined", если условие отсутствует.

        Для client_fault_exclusion:
        - "yes", если вина клиента прямо указана как основание освобождения;
        - "no", если прямо указано, что вина клиента не освобождает от ответственности;
        - "not_defined", если условие отсутствует.

        Для cargo_defects_exclusion:
        - "yes", если недостатки груза (скрытые, естественные свойства) прямо указаны как основание освобождения;
        - "no", если прямо указано, что недостатки груза не освобождают от ответственности;
        - "not_defined", если условие отсутствует.

        Для customs_authorities_exclusion:
        - "yes", если действия таможенных органов прямо указаны как основание освобождения;
        - "no", если прямо указано, что действия таможенных органов не освобождают от ответственности;
        - "not_defined", если условие отсутствует.

        Для other_exclusions_details:
        - если есть иные основания (действия иных госорганов, непредоставление документов и т.п.), верни их кратко;
        - если иных оснований нет, верни "Не указаны";
        - если текст есть, но вывод невозможен, верни "Не удалось определить".

        Для exclusions_summary:
        - если основания указаны, верни краткий факт с перечислением, например:
          "Полный набор оснований: форс-мажор, вина клиента, скрытые недостатки груза, действия таможенных органов, непредоставление документов клиентом";
        - если основания частичные, верни, например:
          "Частичный набор оснований: форс-мажор, вина клиента; недостатки груза и действия таможенных органов не указаны";
        - если основания прямо исключены, верни "Не предусмотрены";
        - если условие отсутствует, верни "Не установлено";
        - если текст есть, но надёжный вывод сделать нельзя, верни "Не удалось определить".

        Не выводи основания освобождения из закона. Фиксируй только если прямо указано в договоре.
        Не присваивай основания освобождения по умолчанию.

        Если данных нет, верни пустой массив [] для evidence.
        </task>

        <context_rules>
        - Используй только предоставленный контекст.
        - Не выводи основания освобождения из закона.
        - Не присваивай основания освобождения по умолчанию.
        - Не путай общие основания освобождения с типоспецифичными основаниями для транспортной экспедиции.
        - Если фрагменты конфликтуют и не позволяют сделать надёжный вывод, верни "Не удалось определить" для exclusions_summary и включи конфликтующие цитаты в evidence.
        </context_rules>

        <output_expectations>
        Все перечисленные ключи должны присутствовать в ответе, даже если значение равно "not_defined", "Не указано", "Не установлено", "Не предусмотрены", "Не удалось определить" или "Определяется по ...".

        Запрещено возвращать:
        - null;
        - None;
        - пустые строки;
        - пояснения до или после JSON;
        - Markdown;
        - код-фенсы;
        - списки вне JSON.

        Верни РОВНО один JSON-объект со всеми 7 ключами без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.
        </output_expectations>

      fields:
        - name: "force_majeure_exclusion"
          type: "string"
          presentation: "signal"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Упомянут ли форс-мажор / непреодолимая сила как основание освобождения от ответственности."
          required: true
          display_in_grid: false

