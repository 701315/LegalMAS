          "service_period_details": "<период или механизм определения или 'Не установлено' / 'Не удалось определить'>",
          "service_period_summary": "<краткое резюме или 'Не установлено' / 'Не удалось определить'>",
          "evidence": [{"clause_ref": "<пункт или раздел>", "quote": "<точная цитата>"}]
