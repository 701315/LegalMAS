# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 4: CHECKS_V8 — единственный рабочий слой юридического анализа
#  Читается: DocTypeCheckLoader._load_doc_type_checks()
# ════════════════════════════════════════════════════════════════════════════
checks_v8:
# ──────────────────────────────────────────────────────────────────────────
# CHECK 1: Стороны договора — экспедитор и клиент
# ──────────────────────────────────────────────────────────────────────────
  - id: parties_identification
    name: "Стороны договора: идентификация экспедитора и клиента"
    description: >
      Фактографическая проверка идентификации сторон договора транспортной
      экспедиции — экспедитора и клиента, их реквизитов, подписантов,
      оснований полномочий и статуса экспедитора.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "экспедитор"
        - "клиент"
        - "грузоотправитель"
        - "грузополучатель"
        - "именуем"
        - "в лице"
        - "действующего на основании"
        - "устав"
        - "доверенность"
        - "ИНН"
        - "ОГРН"
        - "статус экспедитора"
        - "реестр экспедиторов"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)(экспедитор|клиент).*именуем"
        - "(?i)действующ[а-яё]+\\s+на\\s+основании"
        - "(?i)статус\\s+экспедитор"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор транспортной экспедиции (Глава 41 ГК РФ,
        ст. 801; ФЗ-87 «О транспортно-экспедиционной деятельности»).
        Проверяется только один вопрос: идентификация сторон — экспедитора
        и клиента, их реквизиты, подписанты, основания полномочий и статус экспедитора.
        Нормативный ориентир:
        - ст. 801 ГК РФ
        - ст. 2 ФЗ-87
        Важно:
        - Твоя задача — не оценивать серьёзность риска.
        - Только установить, что прямо есть в тексте договора, а чего прямо нет.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Наименование и реквизиты Экспедитора (ИНН, ОГРН).
        2. Тип Экспедитора (юрлицо / ИП / физлицо).
        3. Кто подписывает от Экспедитора и на каком основании.
        4. Наименование и реквизиты Клиента.
        5. Тип Клиента.
        6. Кто подписывает от Клиента и на каком основании.
        7. Упоминание статуса экспедитора (реестр, свидетельство).

        [ПРАВИЛА]
        1. Только текст документа.
        2. Если данные не указаны прямо — "not_defined" или "Данные не определены".
        3. Не используй "None", "null", "not_defined", пустые строки.
        4. В evidence — только цитаты из документа.
        5. Верни только один JSON-объект.

        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1:
        Фрагмент:
        "ООО «ЛогистикПро» (ИНН 7701234567, ОГРН 1027700123456), именуемое «Экспедитор»,
        в лице генерального директора Иванова И.И., действующего на основании Устава,
        и АО «ТоргДом» (ИНН 7709876543), именуемое «Клиент», в лице директора
        Петрова П.П., действующего на основании доверенности № 12 от 01.01.2026.
        Экспедитор включён в реестр экспедиторов (свидетельство № 123)."
        Ответ:
        {
          "forwarder_details_status": "defined",
          "forwarder_details_value": "ООО «ЛогистикПро», ИНН 7701234567, ОГРН 1027700123456",
          "forwarder_type": "legal_entity",
          "forwarder_signatory": "Иванов И.И., генеральный директор",
          "forwarder_signatory_basis": "charter",
          "client_details_status": "defined",
          "client_details_value": "АО «ТоргДом», ИНН 7709876543",
          "client_type": "legal_entity",
          "client_signatory": "Петров П.П., директор",
          "client_signatory_basis": "poa",
          "forwarder_status_mentioned": "yes",
          "forwarder_status_details": "включён в реестр экспедиторов, свидетельство № 123",
          "evidence": [
            {
              "clause_ref": "преамбула",
              "quote": "ООО «ЛогистикПро» (ИНН 7701234567, ОГРН 1027700123456), именуемое «Экспедитор», в лице генерального директора Иванова И.И., действующего на основании Устава."
            }
          ]
        }

        Пример 2:
        Фрагмент:
        "Настоящий договор заключён между Экспедитором и Клиентом."
        Ответ:
        {
          "forwarder_details_status": "not_defined",
          "forwarder_details_value": "Данные не определены",
          "forwarder_type": "not_defined",
          "forwarder_signatory": "Данные не определены",
          "forwarder_signatory_basis": "not_defined",
          "client_details_status": "not_defined",
          "client_details_value": "Данные не определены",
          "client_type": "not_defined",
          "client_signatory": "Данные не определены",
          "client_signatory_basis": "not_defined",
          "forwarder_status_mentioned": "not_defined",
          "forwarder_status_details": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Разграничены ли поля экспедитора и клиента без смешения?
        2. Есть ли ИНН/ОГРН для ЮЛ или паспортные данные для физлица?
        3. Указан ли подписант и документ-основание?
        4. Упомянут ли статус экспедитора (реестр/свидетельство)?
        5. Если ничего нет — "not_defined" и "Данные не определены".
        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "forwarder_details_status": "<defined / not_defined>",
          "forwarder_details_value": "<реквизиты или 'Данные не определены'>",
          "forwarder_type": "<legal_entity / ip / individual / not_defined>",
          "forwarder_signatory": "<ФИО и должность или 'Данные не определены'>",
          "forwarder_signatory_basis": "<charter / poa / order / personal / other / not_defined>",
          "client_details_status": "<defined / not_defined>",
          "client_details_value": "<реквизиты или 'Данные не определены'>",
          "client_type": "<legal_entity / ip / individual / not_defined>",
          "client_signatory": "<ФИО и должность или 'Данные не определены'>",
          "client_signatory_basis": "<charter / poa / order / personal / other / not_defined>",
          "forwarder_status_mentioned": "<yes / no / not_defined>",
          "forwarder_status_details": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 650
      retrieval:
        retrieval_profile: "party_identification_check"
        corpus_scope: "primary_segment"
        levels:
          - "legal_unit"
          - "section"
        required_kind: "legal_unit"
        retrieval_query: "экспедитор клиент именуем в лице действующего на основании ИНН ОГРН устава доверенности статус экспедитора реестр экспедиторов свидетельство"
        preferred_unit_types:
          - obligation
          - general_provision
        excluded_unit_types:
          - definition
          - structural_anchor
          - technical_fragment
        preferred_clause_functions:
          - representations
          - boilerplate
        negative_keywords:
          - "вознаграждение"
          - "срок доставки"
          - "страхование"
          - "удержание"
          - "означает"
          - "в целях настоящего"
        position_bias:
          preferred_range: [0.0, 0.20]
          boost: 0.40
          scope: segment
        context_k: 6
        max_chunks: 8
        rerank: true
        enrichment_hints:
          preferred_segment_types:
            - "contract"
            - "amendment"
          excluded_segment_types:
            - "technical_specification"
            - "price_list"
          preferred_clause_functions:
            - "representations"
            - "boilerplate"
          confidence_bonus_on_match: 0.08
          confidence_penalty_on_excluded_segment: 0.15
      evidence:
        required: true
        min_snippet_length: 40
        max_snippet_length: 600
      extraction:
        enabled: true
        mode: "hybrid"
        compact_output: false
        llm_max_tokens: 1300
        llm_prompt_extraction: |
          <role>
          Ты — российский юрист. Твоя задача — извлечь из договора транспортной
          экспедиции сведения об экспедиторе и клиенте: реквизиты, тип стороны,
          подписанта, основание полномочий и статус экспедитора.
          Не анализируй предмет договора, вознаграждение, сроки или иные темы.
          </role>
          <context>
          {context}
          </context>
          <task>
          Заполни строго следующие поля:
          1. forwarder_details_status — "defined" или "not_defined".
          2. forwarder_details_value — реквизиты экспедитора.
          3. forwarder_type — legal_entity / ip / individual / not_defined.
          4. forwarder_signatory — подписант экспедитора.
          5. forwarder_signatory_basis — charter / poa / order / personal / other / not_defined.
          6. client_details_status — "defined" или "not_defined".
          7. client_details_value — реквизиты клиента.
          8. client_type — legal_entity / ip / individual / not_defined.
          9. client_signatory — подписант клиента.
          10. client_signatory_basis — charter / poa / order / personal / other / not_defined.
          11. forwarder_status_mentioned — yes / no / not_defined.
          12. forwarder_status_details — статус экспедитора (реестр, свидетельство).
          Если данные отсутствуют в тексте:
          - статус = "not_defined"
          - текстовое поле = "Данные не определены"
          </task>
          <rules>
          - Используй только текст договора.
          - Для физлица, подписывающего лично, используй basis = "personal".
          - Не подставляй корпоративные правила, если они не отражены в договоре.
          - Верни только JSON.
          </rules>
        fields:
          - name: "forwarder_details_status"
            type: "string"
            presentation: "signal"
            allowed_values: ["defined", "not_defined"]
            description: "Статус определения реквизитов экспедитора."
            required: true
          - name: "forwarder_details_value"
            type: "string"
            presentation: "fact"
            label: "Экспедитор"
            description: "Реквизиты экспедитора."
            required: true
            display_in_grid: true
            display_priority: 1
          - name: "forwarder_type"
            type: "string"
            presentation: "signal"
            allowed_values: ["legal_entity", "ip", "individual", "not_defined"]
            description: "Тип экспедитора."
            required: false
          - name: "forwarder_signatory"
            type: "string"
            presentation: "fact"
            label: "Подписант экспедитора"
            description: "Подписант экспедитора."
            required: false
            display_in_grid: false
          - name: "forwarder_signatory_basis"
            type: "string"
            presentation: "signal"
            allowed_values: ["charter", "poa", "order", "personal", "other", "not_defined"]
            description: "Основание полномочий подписанта экспедитора."
            required: false
          - name: "client_details_status"
            type: "string"
            presentation: "signal"
            allowed_values: ["defined", "not_defined"]
            description: "Статус определения реквизитов клиента."
            required: true
          - name: "client_details_value"
            type: "string"
            presentation: "fact"
            label: "Клиент"
            description: "Реквизиты клиента."
            required: true
            display_in_grid: true
            display_priority: 2
          - name: "client_type"
            type: "string"
            presentation: "signal"
            allowed_values: ["legal_entity", "ip", "individual", "not_defined"]
            description: "Тип клиента."
            required: false
          - name: "client_signatory"
            type: "string"
            presentation: "fact"
            label: "Подписант клиента"
            description: "Подписант клиента."
            required: false
            display_in_grid: false
          - name: "client_signatory_basis"
            type: "string"
            presentation: "signal"
            allowed_values: ["charter", "poa", "order", "personal", "other", "not_defined"]
            description: "Основание полномочий подписанта клиента."
            required: false
          - name: "forwarder_status_mentioned"
            type: "string"
            presentation: "signal"
            allowed_values: ["yes", "no", "not_defined"]
            description: "Упомянут ли статус экспедитора (реестр/свидетельство)."
            required: false
          - name: "forwarder_status_details"
            type: "string"
            presentation: "fact"
            label: "Статус экспедитора"
            description: "Сведения о статусе экспедитора."
            required: false
            display_in_grid: true
            display_priority: 3
    store_payload: true
# ──────────────────────────────────────────────────────────────────────────
# CHECK 2: Предмет — перечень услуг, груз, маршрут
# ──────────────────────────────────────────────────────────────────────────
  - id: forwarding_subject_extraction
    name: "Предмет экспедиции: перечень услуг, характеристики груза, маршрут"
    description: >
      Фактографическая проверка предмета договора: перечень экспедиторских услуг,
      описание груза, маршрут, тип договора (разовый/рамочный), ссылка на Поручение
      экспедитору и упоминание экспедиторской расписки.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "экспедиторские услуги"
        - "организация перевозки"
        - "выбор перевозчика"
        - "таможенное оформление"
        - "страхование груза"
        - "оформление документов"
        - "складирование"
        - "упаковка"
        - "отслеживание груза"
        - "поручение экспедитору"
        - "перечень услуг"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)(экспедитор.*обязуется.*организовать)"
        - "(?i)(транспортно.*экспедиционн.*услуг)"
        - "(?i)(перечень.*услуг)"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор транспортной экспедиции (Глава 41 ГК РФ, ст. 801;
        ФЗ-87 «О транспортно-экспедиционной деятельности»).
        Проверяется только один вопрос: предмет договора — перечень экспедиторских
        услуг, характеристики груза, маршрут и тип договора.
        Нормативный ориентир:
        - ст. 801 ГК РФ
        - ст. 2 ФЗ-87
        Важно:
        - Твоя задача — не оценивать серьёзность риска.
        - Только установить, что прямо есть в тексте договора, а чего прямо нет.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Перечень экспедиторских услуг.
        2. Описание груза (наименование, вес, объём, характеристики).
        3. Указан ли маршрут (пункт отправления / назначения).
