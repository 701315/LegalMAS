        - Для limitation_period_presence используй только: "present", "missing", "unclear".
        - Для статусных enum-полей используй только: "yes", "no", "not_defined".
        - Fallback при отсутствии данных:
          * limitation_period_value → "Не установлено";
          * limitation_period_summary → "Не установлено".
        - Fallback при противоречии или неоднозначности:
          * limitation_period_summary → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
