# ──────────────────────────────────────────────────────────────────────────
  - id: carrier_selection_approval
    name: "Механизм согласования выбора перевозчика"
    description: >
      Фактографическая проверка наличия процедуры согласования с клиентом
      перевозчика, критериев выбора, раскрытия аффилированности
      и права клиента на вето.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "согласование перевозчика"
        - "выбор перевозчика"
        - "критерии выбора"
        - "аффилированность"
        - "право вето"
        - "финансовая устойчивость перевозчика"
        - "информация о перевозчике"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)согласован(ие|ия)\\s+перевозчик"
        - "(?i)выбор\\s+перевозчик"
        - "(?i)критери(и|ев)\\s+выбор"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор транспортной экспедиции (ст. 801 ГК РФ).
        Проверяется только один вопрос: механизм согласования выбора перевозчика.
        Важно:
        - Твоя задача — не оценивать серьёзность риска.
        - Только установить, что прямо есть в тексте договора, а чего прямо нет.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Требуется ли согласование выбора перевозчика с клиентом.
        2. Указаны ли критерии выбора перевозчика.
        3. Предусмотрено ли раскрытие аффилированности.
        4. Есть ли у клиента право вето на перевозчика.

        [ПРАВИЛА]
        1. Только текст документа.
        2. Если условие не указано прямо — "not_defined".
        3. В evidence — только цитаты из документа.
        4. Верни только один JSON-объект.

        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1:
        Фрагмент:
        "Экспедитор согласовывает выбор перевозчика с Клиентом до заключения
        договора перевозки. Критерии выбора: наличие лицензии, страхование
        ответственности, опыт перевозок. Экспедитор раскрывает аффилированность
        с перевозчиком. Клиент вправе отклонить предложенного перевозчика."
        Ответ:
        {
          "carrier_approval_required": "yes",
          "selection_criteria_specified": "yes",
          "affiliation_disclosure": "yes",
          "client_veto_right": "yes",
          "evidence": [
            {
              "clause_ref": "п. 4.2",
              "quote": "Экспедитор согласовывает выбор перевозчика с Клиентом до заключения договора перевозки."
            }
          ]
        }

        Пример 2:
        Фрагмент:
        "Экспедитор самостоятельно выбирает перевозчика."
        Ответ:
        {
          "carrier_approval_required": "no",
          "selection_criteria_specified": "not_defined",
          "affiliation_disclosure": "not_defined",
          "client_veto_right": "not_defined",
          "evidence": [
            {
              "clause_ref": "п. 4.2",
              "quote": "Экспедитор самостоятельно выбирает перевозчика."
            }
          ]
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Требуется ли согласование или экспедитор выбирает самостоятельно?
        2. Указаны ли конкретные критерии выбора?
        3. Есть ли раскрытие аффилированности?
        4. Есть ли право вето?
        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "carrier_approval_required": "<yes / no / not_defined>",
          "selection_criteria_specified": "<yes / no / not_defined>",
          "affiliation_disclosure": "<yes / no / not_defined>",
          "client_veto_right": "<yes / no / not_defined>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 5
      temperature: 0.0
      max_tokens: 480
      retrieval:
        retrieval_profile: "consent_check"
        corpus_scope: "primary_segment"
        levels:
          - "legal_unit"
          - "section"
        required_kind: "legal_unit"
        retrieval_query: "согласование перевозчика выбор перевозчика критерии выбора аффилированность право вето информация о перевозчике"
        preferred_unit_types:
          - obligation
          - general_provision
        excluded_unit_types:
          - definition
          - structural_anchor
          - technical_fragment
        preferred_clause_functions:
          - procedures
          - obligations
        negative_keywords:
          - "ответственность за третьих лиц"
          - "страхование"
          - "удержание"
          - "означает"
          - "в целях настоящего"
        position_bias:
          preferred_range: [0.25, 0.65]
          boost: 0.12
          scope: segment
        context_k: 5
        max_chunks: 6
        rerank: true
        enrichment_hints:
          preferred_segment_types:
            - "contract"
            - "amendment"
          excluded_segment_types:
            - "technical_specification"
            - "price_list"
          preferred_clause_functions:
            - "procedures"
          confidence_bonus_on_match: 0.08
          confidence_penalty_on_excluded_segment: 0.10
      evidence:
        required: true
        min_snippet_length: 30
        max_snippet_length: 500
      extraction:
        enabled: true
        mode: "hybrid"
        compact_output: false
        llm_max_tokens: 550
        llm_prompt_extraction: |
          <role>
          Ты — российский юрист. Извлеки из договора транспортной экспедиции
          сведения о механизме согласования выбора перевозчика.
          Не анализируй ответственность или иные темы.
          </role>
          <context>
          {context}
          </context>
          <task>
          Заполни строго следующие поля:
          1. carrier_approval_required — требуется ли согласование (yes / no / not_defined).
          2. selection_criteria_specified — указаны ли критерии (yes / no / not_defined).
          3. affiliation_disclosure — раскрытие аффилированности (yes / no / not_defined).
          4. client_veto_right — право вето клиента (yes / no / not_defined).
          Если данные отсутствуют: указывай "not_defined".
          </task>
          <rules>
          - Используй только текст договора.
          - carrier_approval_required = "no" только если прямо указано,
            что экспедитор выбирает перевозчика самостоятельно без согласования.
          - Верни только JSON.
          </rules>
        fields:
          - name: "carrier_approval_required"
            type: "string"
            presentation: "signal"
            allowed_values: ["yes", "no", "not_defined"]
            description: "Требуется ли согласование выбора перевозчика."
            required: true
          - name: "selection_criteria_specified"
            type: "string"
            presentation: "signal"
            allowed_values: ["yes", "no", "not_defined"]
            description: "Указаны ли критерии выбора перевозчика."
            required: false
          - name: "affiliation_disclosure"
            type: "string"
            presentation: "signal"
            allowed_values: ["yes", "no", "not_defined"]
            description: "Раскрытие аффилированности с перевозчиком."
            required: false
          - name: "client_veto_right"
            type: "string"
            presentation: "signal"
            allowed_values: ["yes", "no", "not_defined"]
            description: "Право клиента отклонить перевозчика."
            required: false
    store_payload: true
# ──────────────────────────────────────────────────────────────────────────
# CHECK 13: Таможенное оформление — распределение ответственности (ТК ЕАЭС)
# ──────────────────────────────────────────────────────────────────────────
  - id: customs_liability_allocation
    name: "Таможенное оформление: распределение ответственности (ТК ЕАЭС)"
    description: >
      Фактографическая проверка распределения ответственности за таможенное
      оформление, подтверждение статуса таможенного брокера, штрафы таможенных
      органов и ответственность за недостоверные данные.
    triggers:
      any: ["customs_clearance_service"]
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "таможенное оформление"
        - "таможенный брокер"
        - "таможенная очистка"
        - "ответственность за таможенные нарушения"
        - "штрафы таможенных органов"
        - "таможенная декларация"
        - "достоверность сведений"
        - "сертификаты соответствия"
        - "реестр таможенных представителей"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)таможенн(ое|ого)\\s+оформлени"
        - "(?i)таможенн(ый|ого)\\s+брокер"
        - "(?i)штраф(ы|ов)\\s+таможенн"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор транспортной экспедиции с таможенным оформлением
        (ТК ЕАЭС, ст. 404–406).
        Проверяется только один вопрос: распределение ответственности
        за таможенное оформление и статус таможенного брокера.
        Нормативный ориентир:
        - ТК ЕАЭС (ст. 404–406)
        Важно:
        - Твоя задача — не оценивать серьёзность риска.
        - Только установить, что прямо есть в тексте договора, а чего прямо нет.
        - Таможенное оформление вправе осуществлять только таможенные
          представители, включённые в реестр (ст. 404 ТК ЕАЭС).

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Включено ли таможенное оформление в услуги.
        2. Подтверждён ли статус таможенного брокера/представителя.
        3. Распределена ли ответственность за таможенные штрафы.
        4. Определена ли ответственность за недостоверные данные клиента.

        [ПРАВИЛА]
        1. Только текст документа.
        2. Если условие не указано прямо — "not_defined".
        3. В evidence — только цитаты из документа.
        4. Верни только один JSON-объект.

        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1:
        Фрагмент:
        "Экспедитор осуществляет таможенное оформление как таможенный
        представитель, включённый в реестр (свидетельство № 456).
        Клиент несёт ответственность за достоверность сведений,
        предоставленных для таможенного оформления. Штрафы таможенных органов,
        возникшие по вине Клиента, возмещаются Клиентом."
        Ответ:
        {
          "customs_service_included": "yes",
          "customs_broker_status": "confirmed",
          "customs_liability_client": "yes",
          "customs_liability_forwarder": "not_defined",
          "false_data_liability": "client",
          "evidence": [
            {
              "clause_ref": "п. 5.3",
              "quote": "Экспедитор осуществляет таможенное оформление как таможенный представитель, включённый в реестр."
            }
          ]
        }

        Пример 2:
        Фрагмент:
        "Экспедитор оказывает услуги таможенного оформления."
        Ответ:
        {
          "customs_service_included": "yes",
          "customs_broker_status": "not_confirmed",
          "customs_liability_client": "not_defined",
          "customs_liability_forwarder": "not_defined",
          "false_data_liability": "not_defined",
          "evidence": [
            {
              "clause_ref": "п. 5.3",
              "quote": "Экспедитор оказывает услуги таможенного оформления."
            }
          ]
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Включено ли таможенное оформление в услуги?
        2. Подтверждён ли статус таможенного представителя (реестр)?
        3. Распределена ли ответственность за штрафы?
        4. Определена ли ответственность за недостоверные данные?
        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "customs_service_included": "<yes / no / not_defined>",
          "customs_broker_status": "<confirmed / not_confirmed / not_defined>",
          "customs_liability_client": "<yes / no / not_defined>",
          "customs_liability_forwarder": "<yes / no / not_defined>",
          "false_data_liability": "<client / forwarder / not_specified / not_defined>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 5
      temperature: 0.0
      max_tokens: 550
      retrieval:
        retrieval_profile: "registration_check"
        corpus_scope: "primary_segment"
        levels:
          - "legal_unit"
          - "section"
        required_kind: "legal_unit"
        retrieval_query: "таможенное оформление таможенный брокер таможенный представитель реестр штрафы таможенных органов ответственность за таможенные нарушения достоверность сведений таможенная декларация"
        preferred_unit_types:
          - obligation
          - general_provision
        excluded_unit_types:
          - definition
          - structural_anchor
          - technical_fragment
        preferred_clause_functions:
          - obligations
          - representations
        negative_keywords:
          - "страхование груза"
          - "удержание"
          - "форс-мажор"
          - "означает"
          - "в целях настоящего"
        position_bias:
          preferred_range: [0.25, 0.70]
          boost: 0.15
          scope: segment
        context_k: 5
        max_chunks: 8
        rerank: true
        enrichment_hints:
          preferred_segment_types:
            - "contract"
            - "amendment"
          excluded_segment_types:
            - "technical_specification"
            - "price_list"
          preferred_clause_functions:
            - "obligations"
            - "representations"
          confidence_bonus_on_match: 0.10
          confidence_penalty_on_excluded_segment: 0.12
      evidence:
        required: true
        min_snippet_length: 40
        max_snippet_length: 600
      extraction:
        enabled: true
        mode: "hybrid"
        compact_output: false
        llm_max_tokens: 800
        llm_prompt_extraction: |
          <role>
          Ты — российский юрист. Извлеки из договора транспортной экспедиции
          сведения о таможенном оформлении: статус брокера, распределение
          ответственности за штрафы и недостоверные данные.
          Не анализируй страхование, удержание или иные темы.
          </role>
          <context>
          {context}
          </context>
          <task>
          Заполни строго следующие поля:
          1. customs_service_included — включено ли таможенное оформление (yes / no / not_defined).
          2. customs_broker_status — подтверждён ли статус брокера (confirmed / not_confirmed / not_defined).
          3. customs_liability_client — ответственность клиента за штрафы (yes / no / not_defined).
          4. customs_liability_forwarder — ответственность экспедитора за штрафы (yes / no / not_defined).
          5. false_data_liability — ответственность за недостоверные данные (client / forwarder / not_specified / not_defined).
          Если данные отсутствуют: указывай "not_defined".
          </task>
          <rules>
          - Используй только текст договора.
          - customs_broker_status = "confirmed" только если прямо указано
            включение в реестр таможенных представителей или наличие свидетельства.
          - Верни только JSON.
          </rules>
        fields:
          - name: "customs_service_included"
            type: "string"
            presentation: "signal"
            allowed_values: ["yes", "no", "not_defined"]
            description: "Включено ли таможенное оформление в услуги."
            required: true
          - name: "customs_broker_status"
            type: "string"
            presentation: "signal"
            allowed_values: ["confirmed", "not_confirmed", "not_defined"]
            description: "Подтверждение статуса таможенного брокера."
            required: false
          - name: "customs_liability_client"
            type: "string"
            presentation: "signal"
            allowed_values: ["yes", "no", "not_defined"]
            description: "Ответственность клиента за таможенные штрафы."
            required: false
          - name: "customs_liability_forwarder"
            type: "string"
            presentation: "signal"
            allowed_values: ["yes", "no", "not_defined"]
            description: "Ответственность экспедитора за таможенные штрафы."
            required: false
          - name: "false_data_liability"
            type: "string"
            presentation: "signal"
            allowed_values: ["client", "forwarder", "not_defined", "not_defined"]
            description: "Ответственность за недостоверные данные для таможенного оформления."
            required: false
    store_payload: true
# ──────────────────────────────────────────────────────────────────────────
# CHECK 14: Право удержания груза (ст. 3 ФЗ-87)
# ──────────────────────────────────────────────────────────────────────────
  - id: lien_right_on_cargo
    name: "Право удержания груза и порядок реализации (ст. 3 ФЗ-87)"
    description: >
      Фактографическая проверка наличия условия о праве экспедитора удерживать
      груз до оплаты вознаграждения и расходов, порядка реализации удержанного
      груза и распределения расходов на хранение.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "право удержания"
        - "удержание груза"
        - "до уплаты вознаграждения"
        - "до возмещения расходов"
        - "реализация удержанного"
        - "хранение за счёт клиента"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)удержива(ть|ет).*груз.*до.*оплат"
        - "(?i)право\\s+удержани(я|е).*груз"
        - "(?i)реализац(ия|ии)\\s+удержанн"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор транспортной экспедиции (ст. 3 ФЗ-87; ст. 359 ГК РФ).
        Проверяется только один вопрос: право удержания груза.
        Нормативный ориентир:
        - ст. 3 ФЗ-87
        - ст. 359 ГК РФ
        Важно:
        - Твоя задача — не оценивать серьёзность риска.
        - Только установить, что прямо есть в тексте договора, а чего прямо нет.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Предусмотрено ли право удержания груза.
        2. Условия реализации права удержания.
        3. Порядок реализации удержанного груза.
        4. Распределение расходов на хранение удержанного груза.

        [ПРАВИЛА]
        1. Только текст документа.
        2. Если условие не указано прямо — "not_defined".
        3. В evidence — только цитаты из документа.
        4. Верни только один JSON-объект.

        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1:
        Фрагмент:
        "Экспедитор вправе удерживать груз до уплаты вознаграждения
        и возмещения расходов. Расходы на хранение удержанного груза
        несёт Клиент. Реализация удержанного груза осуществляется
        в порядке, установленном ст. 359 ГК РФ."
        Ответ:
        {
          "lien_right_present": "yes",
          "lien_conditions": "до уплаты вознаграждения и возмещения расходов",
          "realization_procedure": "yes",
          "storage_cost_allocation": "client",
          "evidence": [
            {
              "clause_ref": "п. 7.1",
              "quote": "Экспедитор вправе удерживать груз до уплаты вознаграждения и возмещения расходов."
            }
          ]
        }

        Пример 2:
        Фрагмент:
        "Экспедитор передаёт груз грузополучателю по прибытии."
        Ответ:
        {
