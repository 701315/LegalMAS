          allowed_values: ["yes", "no", "not_defined"]
          description: "Упомянуты ли недостатки груза (скрытые, естественные свойства) как основание освобождения от ответственности."
          required: true
          display_in_grid: false

        - name: "customs_authorities_exclusion"
          type: "string"
          presentation: "signal"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Упомянуты ли действия таможенных органов как основание освобождения от ответственности."
          required: true
          display_in_grid: false

        - name: "other_exclusions_details"
          type: "string"
          presentation: "fact"
          label: "Иные основания освобождения"
          description: "Иные основания освобождения от ответственности (действия иных госорганов, непредоставление документов и т.п.)."
          required: true
          display_in_grid: false

        - name: "exclusions_summary"
          type: "string"
          presentation: "fact"
          label: "Обстоятельства, освобождающие от ответственности"
          description: "Краткое описание перечня обстоятельств, освобождающих экспедитора от ответственности: форс-мажор, вина клиента, недостатки груза, действия таможенных органов и иные типоспецифичные основания."
          required: true
          display_in_grid: true
          display_priority: 1

        - name: "evidence"
