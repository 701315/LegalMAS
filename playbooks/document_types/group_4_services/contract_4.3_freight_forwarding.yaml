# CHECK 11: Страхование груза (ст. 4 ФЗ-87)
# ──────────────────────────────────────────────────────────────────────────
  - id: cargo_insurance_obligation
    name: "Страхование груза: обязательность и покрытие (ст. 4 ФЗ-87)"
    description: >
      Фактографическая проверка наличия обязательства застраховать груз,
      кто страхует, вид покрытия (all risks / named perils), страховая сумма
      и выгодоприобретатель.
    triggers:
      any: ["cargo_insurance_service"]
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "застраховать груз"
        - "страхование груза"
        - "страховой полис"
        - "от всех рисков"
        - "all risks"
        - "страховая сумма"
        - "в пользу клиента"
        - "выгодоприобретатель"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)застраховать\\s+груз"
        - "(?i)страхован(ие|ия)\\s+груз"
        - "(?i)от\\s+всех\\s+риск"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор транспортной экспедиции (ст. 4 ФЗ-87).
        Проверяется только один вопрос: страхование груза.
        Нормативный ориентир:
        - ст. 4 ФЗ-87
        Важно:
        - Твоя задача — не оценивать серьёзность риска.
        - Только установить, что прямо есть в тексте договора, а чего прямо нет.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Обязательно ли страхование груза.
        2. Кто страхует (экспедитор / клиент).
        3. Вид покрытия (all risks / named perils / только ответственность).
        4. Основание определения страховой суммы.
        5. Выгодоприобретатель.

        [ПРАВИЛА]
        1. Только текст документа.
        2. Если условие не указано прямо — "not_defined".
        3. В evidence — только цитаты из документа.
        4. Верни только один JSON-объект.

        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1:
        Фрагмент:
        "Экспедитор обязан застраховать груз от всех рисков на сумму
        объявленной ценности. Выгодоприобретателем является Клиент."
        Ответ:
        {
          "insurance_required": "yes",
          "who_insures": "forwarder",
          "insurance_coverage": "all_risks",
          "insurance_amount_basis": "declared_value",
          "beneficiary": "client",
          "evidence": [
            {
              "clause_ref": "п. 5.1",
              "quote": "Экспедитор обязан застраховать груз от всех рисков на сумму объявленной ценности."
            }
          ]
        }

        Пример 2:
        Фрагмент:
        "Страхование груза осуществляется по соглашению сторон."
        Ответ:
        {
          "insurance_required": "optional",
          "who_insures": "not_defined",
          "insurance_coverage": "not_defined",
          "insurance_amount_basis": "not_defined",
          "beneficiary": "not_defined",
          "evidence": [
            {
              "clause_ref": "п. 5.1",
              "quote": "Страхование груза осуществляется по соглашению сторон."
            }
          ]
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Страхование обязательно или опционально?
        2. Определено ли, кто страхует?
        3. Указан ли вид покрытия?
        4. Определён ли выгодоприобретатель?
        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "insurance_required": "<yes / optional / no / not_defined>",
          "who_insures": "<forwarder / client / not_specified / not_defined>",
          "insurance_coverage": "<all_risks / named_perils / liability_only / not_specified / not_defined>",
          "insurance_amount_basis": "<full_value / declared_value / other / not_specified / not_defined>",
          "beneficiary": "<client / forwarder / not_specified / not_defined>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 5
      temperature: 0.0
      max_tokens: 500
      retrieval:
        retrieval_profile: "insurance_check"
        corpus_scope: "primary_segment"
        levels:
          - "legal_unit"
          - "section"
        required_kind: "legal_unit"
        retrieval_query: "страхование груза застраховать груз страховой полис от всех рисков страховая сумма выгодоприобретатель"
        preferred_unit_types:
          - obligation
          - general_provision
        excluded_unit_types:
          - definition
          - structural_anchor
          - technical_fragment
        preferred_clause_functions:
          - obligations
        negative_keywords:
          - "ответственность за третьих лиц"
          - "удержание"
          - "форс-мажор"
          - "означает"
          - "в целях настоящего"
        position_bias:
          preferred_range: [0.30, 0.70]
          boost: 0.15
          scope: segment
        context_k: 5
        max_chunks: 7
        rerank: true
        enrichment_hints:
          preferred_segment_types:
            - "contract"
            - "amendment"
          excluded_segment_types:
            - "technical_specification"
            - "price_list"
          preferred_clause_functions:
            - "obligations"
          confidence_bonus_on_match: 0.10
          confidence_penalty_on_excluded_segment: 0.10
      evidence:
        required: true
        min_snippet_length: 40
        max_snippet_length: 600
      extraction:
        enabled: true
        mode: "hybrid"
        compact_output: false
        llm_max_tokens: 700
        llm_prompt_extraction: |
          <role>
          Ты — российский юрист. Извлеки из договора транспортной экспедиции
          сведения о страховании груза. Не анализируй ответственность или иные темы.
          </role>
          <context>
          {context}
          </context>
          <task>
          Заполни строго следующие поля:
          1. insurance_required — обязательность (yes / optional / no / not_defined).
          2. who_insures — кто страхует (forwarder / client / not_specified / not_defined).
          3. insurance_coverage — вид покрытия (all_risks / named_perils / liability_only / not_specified / not_defined).
          4. insurance_amount_basis — основание страховой суммы (full_value / declared_value / other / not_specified / not_defined).
          5. beneficiary — выгодоприобретатель (client / forwarder / not_specified / not_defined).
          Если данные отсутствуют: указывай "not_defined".
          </task>
          <rules>
          - Используй только текст договора.
          - Не путай страхование груза со страхованием ответственности экспедитора.
          - Верни только JSON.
          </rules>
        fields:
          - name: "insurance_required"
            type: "string"
            presentation: "signal"
            allowed_values: ["yes", "optional", "no", "not_defined"]
            description: "Обязательность страхования груза."
            required: true
          - name: "who_insures"
            type: "string"
            presentation: "signal"
            allowed_values: ["forwarder", "client", "not_defined", "not_defined"]
            description: "Кто обязан застраховать груз."
            required: false
          - name: "insurance_coverage"
            type: "string"
            presentation: "signal"
            allowed_values: ["all_risks", "named_perils", "liability_only", "not_defined", "not_defined"]
            description: "Вид страхового покрытия."
            required: false
          - name: "insurance_amount_basis"
            type: "string"
            presentation: "signal"
            allowed_values: ["full_value", "declared_value", "other", "not_defined", "not_defined"]
            description: "Основание определения страховой суммы."
            required: false
          - name: "beneficiary"
            type: "string"
            presentation: "signal"
            allowed_values: ["client", "forwarder", "not_defined", "not_defined"]
            description: "Выгодоприобретатель по страхованию."
            required: false
    store_payload: true
