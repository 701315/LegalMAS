           - service_period_summary = "Не установлено";
           - не выполняй остальные шаги.

        1. service_period_specified — указан ли срок оказания услуг:
           "yes", "no", "per_order" или "not_defined".
        2. service_period_details — конкретный период или механизм определения.
        3. service_period_summary — краткое пользовательское резюме.
        4. evidence — массив точных цитат из договора.

        Правила заполнения:
        - Для service_period_specified: "yes", если конкретный срок указан; "per_order", если определяется по каждому Поручению/заявке; "no", если прямо указано, что не устанавливается; "not_defined", если отсутствует.
        - Для service_period_details: если период указан, верни его кратко; если определяется через документ, верни "Определяется по Поручению экспедитору" (или аналогично); если не указан, верни "Не установлено".
        - Для service_period_summary: если срок указан, верни краткий факт; если по поручениям, верни "Срок определяется по каждому Поручению"; если прямо исключён, верни "Не устанавливается"; если отсутствует, верни "Не установлено".
        - Не путай срок оказания услуг со сроком доставки груза.
        - Не путай срок оказания услуг со сроком действия рамочного договора.
        - Если данных нет, верни пустой массив [] для evidence.
        </task>

        <context_rules>
        - Перед остальными полями заполни service_period_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — service_period_specified = "not_defined", service_period_summary = "Не установлено".
        - Используй только предоставленный контекст.
        - Не выдумывай даты, периоды и механизмы определения срока.
        - Не путай срок оказания услуг со сроком доставки груза.
        - Не путай срок оказания услуг со сроком действия рамочного договора.
        - Если фрагменты конфликтуют и не позволяют сделать надёжный вывод, верни "Не удалось определить" для service_period_summary и включи конфликтующие цитаты в evidence.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет упоминания срока оказания услуг.
           → presence = "missing";
             service_period_specified = "not_defined";
             service_period_summary = "Не установлено".

        2. Рамочный договор — срок по поручениям.
           Указано, что сроки определяются по каждому Поручению экспедитору или заявке.
           → presence = "present";
             service_period_specified = "per_order";
             service_period_details = "Определяется по Поручению экспедитору";
             service_period_summary = "Срок определяется по каждому Поручению экспедитору".

        3. Противоречие между фрагментами.
           В разных частях договора указаны разные периоды оказания услуг.
           → presence = "unclear";
             service_period_summary = "Не удалось определить".

        4. Прямое исключение.
           В договоре прямо указано, что срок оказания услуг не устанавливается.
           → presence = "present";
             service_period_specified = "no";
             service_period_summary = "Срок оказания услуг не устанавливается".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для service_period_presence используй только: "present", "missing", "unclear".
        - Для статусных enum-полей используй только: "yes", "no", "per_order", "not_defined".
        - Fallback при отсутствии данных:
          * service_period_details → "Не установлено";
          * service_period_summary → "Не установлено".
        - Fallback при противоречии или неоднозначности:
          * service_period_summary → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "service_period_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования о сроке оказания услуг. Внутреннее агрегатное signal-поле."
          required: true

        - name: "service_period_specified"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["yes", "no", "per_order", "not_defined"]
          description: "Указан ли срок оказания экспедиторских услуг. Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "service_period_details"
          type: "string"
          presentation: "fact"
          label: "Период оказания услуг"
          description: >
            Конкретный период оказания услуг или механизм его определения. Fallback: "Не установлено" / "Не удалось определить".
          required: true
          display_in_grid: false

        - name: "service_period_summary"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 1
          label: "Срок оказания услуг"
          description: >
            Краткое описание срока оказания экспедиторских услуг: наличие, период, механизм определения. Fallback: "Не установлено" / "Не удалось определить".
          required: true

        - name: "evidence"
          type: "array"
          presentation: "diagnostic"
          description: "Точные цитаты из договора, подтверждающие извлечённые значения."
          required: true
          display_in_grid: false

      store_payload: true

  - id: client_documents_provision
    name: "Обязанности клиента по предоставлению документов (ст. 804 ГК РФ)"
    description: >
      Фактографическая проверка обязанностей клиента по предоставлению документов
      для исполнения договора транспортной экспедиции: наличие обязанности,
      требование достоверности сведений, право экспедитора приостановить
      исполнение при непредоставлении документов.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "клиент обязан предоставить"
        - "предоставление документов"
        - "достоверность сведений"
        - "своевременное предоставление"
        - "полный комплект документов"
        - "приостановить исполнение"
        - "приостановить оказание услуг"
        - "документы для таможенного оформления"
        - "документы на груз"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)клиент.*обязан.*предоставить.*документ"
        - "(?i)предоставлени[еяю].*документ"
        - "(?i)достоверност.*сведен"
        - "(?i)приостановить.*(исполнени|оказани)"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор транспортной экспедиции (ст. 804 ГК РФ, ФЗ-87).

        Проверяется только один вопрос: обязанности клиента по предоставлению
        документов для исполнения договора.

        Нормативный ориентир:
        - ст. 804 ГК РФ;
        - ст. 3 ФЗ-87.

        Важно:
        - Твоя задача — не оценивать серьёзность риска.
        - Только установить, что прямо есть в тексте договора, а чего прямо нет.
        - Не выводи обязанности из закона. Фиксируй только если прямо указаны.
        - Не путай предоставление документов клиентом с отчётом экспедитора.
        - Не путай право приостановить исполнение с правом удержания груза.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Наличие обязанности клиента предоставить документы.
        2. Требование достоверности предоставляемых сведений.
        3. Право экспедитора приостановить исполнение при непредоставлении.
        4. Сформируй краткое пользовательское резюме.
        5. Собери точные цитаты в evidence.

        [ПРАВИЛА]
        1. Используй только предоставленный текст договора.
        2. Если данные отсутствуют:
           - для статусных полей используй "not_defined";
           - для видимых текстовых полей используй "Не установлено".
        3. Не используй null, None, пустые строки.
        4. Если текст есть, но надёжный вывод сделать нельзя:
           - для статусных полей используй "not_defined";
           - для видимых текстовых полей используй "Не удалось определить".
        5. Не выводи обязанности из закона. Фиксируй только если прямо указаны.
        6. Не путай предоставление документов клиентом с отчётом экспедитора.
        7. Не путай право приостановить исполнение с правом удержания груза.
        8. Верни РОВНО один JSON-объект со всеми 5 ключами без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.
        9. В evidence включай только точные цитаты из документа. Если данных нет, верни пустой массив [].
        10. Поле client_documents_summary должно быть кратким.

        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1 — полный набор обязанностей:
        Фрагмент:
        "Клиент обязан своевременно предоставить полный комплект документов, необходимых для исполнения договора. Клиент несёт ответственность за достоверность предоставленных сведений. При непредоставлении документов Экспедитор вправе приостановить исполнение."
        Ответ:
        {
          "client_documents_duty_present": "yes",
          "documents_accuracy_duty": "yes",
          "forwarder_suspension_right": "yes",
          "client_documents_summary": "Клиент обязан предоставить документы; ответственность за достоверность — на клиенте; экспедитор вправе приостановить исполнение",
          "evidence": [
            {
              "clause_ref": "п. 3.2",
              "quote": "Клиент обязан своевременно предоставить полный комплект документов, необходимых для исполнения договора. Клиент несёт ответственность за достоверность предоставленных сведений. При непредоставлении документов Экспедитор вправе приостановить исполнение."
            }
          ]
        }

        Пример 2 — только обязанность предоставить:
        Фрагмент:
        "Клиент предоставляет документы, необходимые для организации перевозки."
        Ответ:
        {
          "client_documents_duty_present": "yes",
          "documents_accuracy_duty": "not_defined",
          "forwarder_suspension_right": "not_defined",
          "client_documents_summary": "Клиент обязан предоставить документы; достоверность и право приостановки не указаны",
          "evidence": [
            {
              "clause_ref": "п. 3.1",
              "quote": "Клиент предоставляет документы, необходимые для организации перевозки."
            }
          ]
        }

        Пример 3 — условие отсутствует:
        Фрагмент:
        "Экспедитор организует перевозку груза."
        Ответ:
        {
          "client_documents_duty_present": "not_defined",
          "documents_accuracy_duty": "not_defined",
          "forwarder_suspension_right": "not_defined",
          "client_documents_summary": "Не установлено",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Есть ли прямая обязанность клиента предоставить документы?
        2. Не выведена ли обязанность из закона по умолчанию?
        3. Есть ли требование достоверности?
        4. Есть ли право приостановить исполнение?
        5. Не смешано ли предоставление документов с отчётом экспедитора?
        6. Не смешано ли право приостановки с правом удержания груза?
        7. Все ли 5 ключей присутствуют в ответе?
        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь РОВНО одним JSON-объектом без какого-либо дополнительного текста до или после, со всеми 5 ключами:
        {
          "client_documents_duty_present": "<yes / no / not_defined>",
          "documents_accuracy_duty": "<yes / no / not_defined>",
          "forwarder_suspension_right": "<yes / no / not_defined>",
          "client_documents_summary": "<краткое резюме или 'Не установлено' / 'Не удалось определить'>",
          "evidence": [{"clause_ref": "<пункт или раздел>", "quote": "<точная цитата>"}]
        }
      context_k: 5
      temperature: 0.0
      max_tokens: 600

    retrieval:
      retrieval_profile: "scope_of_work_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "клиент обязан предоставить предоставление документов достоверность сведений полный комплект документов приостановить исполнение непредоставление документов"
      boost_keywords:
        - "клиент обязан предоставить"
        - "предоставление документов"
        - "достоверность сведений"
        - "полный комплект документов"
        - "приостановить исполнение"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - representations
      negative_keywords:
        - "означает"
        - "в целях настоящего"
        - "отчёт экспедитора"
        - "удержание груза"
      position_bias:
        preferred_range: [0.15, 0.55]
        boost: 0.12
        scope: segment
      context_k: 5
      max_chunks: 6
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "obligations"
        - "representations"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 30
      max_snippet_length: 400

    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false
      llm_max_tokens: 700

      presence_signal:
        field: "client_documents_provision_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из договора транспортной экспедиции
        сведения об обязанностях клиента по предоставлению документов: наличие
        обязанности, требование достоверности и право экспедитора приостановить
        исполнение при непредоставлении.

        Не анализируй отчёт экспедитора, право удержания груза, вознаграждение,
        ответственность за третьих лиц и иные темы, если они не содержат сведений
        о предоставлении документов клиентом.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. client_documents_provision_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (client_documents_duty_present, documents_accuracy_duty,
              forwarder_suspension_right) ≠ "not_defined";
           - "missing" — если все три содержательных поля = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - client_documents_duty_present = "not_defined";
           - documents_accuracy_duty = "not_defined";
           - forwarder_suspension_right = "not_defined";
           - client_documents_summary = "Не установлено";
           - не выполняй остальные шаги.

        1. client_documents_duty_present — обязанность клиента предоставить документы:
           "yes", "no" или "not_defined".
        2. documents_accuracy_duty — требование достоверности сведений:
           "yes", "no" или "not_defined".
        3. forwarder_suspension_right — право экспедитора приостановить исполнение:
           "yes", "no" или "not_defined".
        4. client_documents_summary — краткое пользовательское резюме.
        5. evidence — массив точных цитат из договора.

        Правила заполнения:
        - Для client_documents_duty_present: "yes", если прямо предусмотрена обязанность; "no", если прямо указано, что не предусмотрена; "not_defined", если отсутствует.
        - Для documents_accuracy_duty: "yes", если прямо предусмотрено требование достоверности; "no", если прямо указано, что не требуется; "not_defined", если отсутствует.
        - Для forwarder_suspension_right: "yes", если прямо предусмотрено право приостановить; "no", если прямо указано, что такого права нет; "not_defined", если отсутствует.
        - Для client_documents_summary: если обязанности указаны, верни краткий факт; если частичные, верни "Клиент обязан предоставить документы; достоверность и право приостановки не указаны"; если прямо исключены, верни "Не предусмотрены"; если отсутствуют, верни "Не установлено".
        - Не выводи обязанности из закона. Не путай с отчётом экспедитора или правом удержания.
        - Если данных нет, верни пустой массив [] для evidence.
        </task>

        <context_rules>
        - Перед остальными полями заполни client_documents_provision_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined", client_documents_summary = "Не установлено".
        - Используй только предоставленный контекст.
        - Не выводи обязанности из закона.
        - Не путай предоставление документов клиентом с отчётом экспедитора.
        - Не путай право приостановить исполнение с правом удержания груза.
        - Если фрагменты конфликтуют и не позволяют сделать надёжный вывод, верни "Не удалось определить" для client_documents_summary и включи конфликтующие цитаты в evidence.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет упоминания обязанностей клиента по предоставлению документов.
           → presence = "missing";
             все *_status = "not_defined";
             client_documents_summary = "Не установлено".

        2. Неполное раскрытие темы.
           Упомянута только обязанность предоставить документы, без достоверности и права приостановки.
           → presence = "present";
             client_documents_duty_present = "yes";
             остальные = "not_defined";
             client_documents_summary = "Клиент обязан предоставить документы; достоверность и право приостановки не указаны".

        3. Противоречие между фрагментами.
           В разных частях договора указаны противоречащие обязанности.
           → presence = "unclear";
             client_documents_summary = "Не удалось определить".

        4. Прямое исключение.
           В договоре прямо указано, что клиент не обязан предоставлять документы.
           → presence = "present";
             client_documents_duty_present = "no";
             client_documents_summary = "Обязанность предоставить документы не предусмотрена".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для client_documents_provision_presence используй только: "present", "missing", "unclear".
        - Для статусных enum-полей используй только: "yes", "no", "not_defined".
        - Fallback при отсутствии данных:
          * client_documents_summary → "Не установлено".
        - Fallback при противоречии или неоднозначности:
          * client_documents_summary → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "client_documents_provision_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования об обязанностях клиента по предоставлению документов. Внутреннее агрегатное signal-поле."
          required: true

        - name: "client_documents_duty_present"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Наличие обязанности клиента предоставить документы для исполнения договора. Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "documents_accuracy_duty"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Требование достоверности предоставляемых клиентом сведений. Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "forwarder_suspension_right"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Право экспедитора приостановить исполнение при непредоставлении документов. Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "client_documents_summary"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 1
          label: "Документы клиента"
          description: >
            Краткое описание обязанностей клиента по предоставлению документов: наличие, достоверность, право приостановки. Fallback: "Не установлено" / "Не удалось определить".
          required: true

        - name: "evidence"
          type: "array"
          presentation: "diagnostic"
          description: "Точные цитаты из договора, подтверждающие извлечённые значения."
          required: true
          display_in_grid: false

      store_payload: true

  - id: forwarder_license_sro
    name: "Статус экспедитора: реестр / свидетельство (ст. 2 ФЗ-87)"
    description: >
      Фактографическая проверка наличия подтверждения статуса экспедитора:
      включение в реестр экспедиторов, наличие свидетельства, упоминание
      транспортно-экспедиционной деятельности как вида деятельности.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "статус экспедитора"
        - "реестр экспедиторов"
        - "свидетельство экспедитора"
        - "транспортно-экспедиционная деятельность"
        - "включён в реестр"
        - "свидетельство о регистрации"
        - "регистрация экспедитора"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)статус\\s+экспедитор"
        - "(?i)реестр\\s+экспедитор"
        - "(?i)свидетельств.*экспедитор"
        - "(?i)транспортно.*экспедиционн.*деятельност"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор транспортной экспедиции (ст. 2 ФЗ-87).

        Проверяется только один вопрос: подтверждение статуса экспедитора.

        Нормативный ориентир:
        - ст. 2 ФЗ-87 «О транспортно-экспедиционной деятельности».

        Важно:
        - Твоя задача — не оценивать серьёзность риска.
        - Только установить, что прямо есть в тексте договора, а чего прямо нет.
        - Не выводи статус экспедитора из закона. Фиксируй только если прямо указан.
        - Не присваивай статус "подтверждён" только по упоминанию слова «экспедитор»
          без прямой ссылки на реестр или свидетельство.
        - Не путай статус экспедитора с лицензией перевозчика.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Упоминание статуса экспедитора.
        2. Подтверждение статуса: включение в реестр, свидетельство.
        3. Конкретные реквизиты (номер свидетельства, дата включения).
        4. Сформируй краткое пользовательское резюме.
        5. Собери точные цитаты в evidence.

        [ПРАВИЛА]
        1. Используй только предоставленный текст договора.
        2. Если данные отсутствуют:
           - для статусных полей используй "not_defined";
           - для видимых текстовых полей используй "Не установлено".
        3. Не используй null, None, пустые строки.
        4. Если текст есть, но надёжный вывод сделать нельзя:
           - для статусных полей используй "not_defined";
           - для видимых текстовых полей используй "Не удалось определить".
        5. Для forwarder_status_confirmed:
           - "confirmed", если прямо указано включение в реестр или наличие свидетельства;
           - "not_confirmed", если статус упомянут, но не подтверждён;
           - "not_defined", если статус не упомянут.
        6. Не присваивай статус "подтверждён" без прямой ссылки на реестр или свидетельство.
        7. Не путай статус экспедитора с лицензией перевозчика.
        8. Верни РОВНО один JSON-объект со всеми 5 ключами без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.
        9. В evidence включай только точные цитаты из документа. Если данных нет, верни пустой массив [].
        10. Поле forwarder_status_summary должно быть кратким.

        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1 — статус подтверждён:
        Фрагмент:
        "Экспедитор включён в реестр экспедиторов, свидетельство № 123 от 01.03.2024."
        Ответ:
        {
          "forwarder_status_mentioned": "yes",
          "forwarder_status_confirmed": "confirmed",
          "forwarder_status_details": "реестр экспедиторов, свидетельство № 123 от 01.03.2024",
          "forwarder_status_summary": "Статус экспедитора подтверждён: включён в реестр, свидетельство № 123",
          "evidence": [
            {
              "clause_ref": "преамбула",
              "quote": "Экспедитор включён в реестр экспедиторов, свидетельство № 123 от 01.03.2024."
            }
          ]
        }

        Пример 2 — статус упомянут, но не подтверждён:
        Фрагмент:
        "Экспедитор осуществляет транспортно-экспедиционную деятельность."
        Ответ:
        {
          "forwarder_status_mentioned": "yes",
          "forwarder_status_confirmed": "not_confirmed",
          "forwarder_status_details": "Не установлено",
          "forwarder_status_summary": "Статус экспедитора упомянут; включение в реестр или свидетельство не подтверждены",
          "evidence": [
            {
              "clause_ref": "преамбула",
              "quote": "Экспедитор осуществляет транспортно-экспедиционную деятельность."
            }
          ]
        }

        Пример 3 — условие отсутствует:
        Фрагмент:
        "Экспедитор организует перевозку груза."
        Ответ:
        {
          "forwarder_status_mentioned": "not_defined",
          "forwarder_status_confirmed": "not_defined",
          "forwarder_status_details": "Не установлено",
          "forwarder_status_summary": "Не установлено",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Есть ли прямое упоминание статуса экспедитора?
        2. Подтверждён ли статус реестром или свидетельством?
        3. Не присвоен ли статус "подтверждён" без прямой ссылки?
        4. Не смешан ли статус экспедитора с лицензией перевозчика?
        5. Если текст есть, но вывод невозможен, использовано ли "Не удалось определить"?
        6. Все ли 5 ключей присутствуют в ответе?
        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь РОВНО одним JSON-объектом без какого-либо дополнительного текста до или после, со всеми 5 ключами:
        {
          "forwarder_status_mentioned": "<yes / no / not_defined>",
          "forwarder_status_confirmed": "<confirmed / not_confirmed / not_defined>",
          "forwarder_status_details": "<реквизиты или 'Не установлено' / 'Не удалось определить'>",
          "forwarder_status_summary": "<краткое резюме или 'Не установлено' / 'Не удалось определить'>",
          "evidence": [{"clause_ref": "<пункт или раздел>", "quote": "<точная цитата>"}]
        }
      context_k: 4
      temperature: 0.0
      max_tokens: 600

    retrieval:
      retrieval_profile: "registration_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "статус экспедитора реестр экспедиторов свидетельство экспедитора транспортно-экспедиционная деятельность включён в реестр свидетельство о регистрации"
      boost_keywords:
        - "статус экспедитора"
        - "реестр экспедиторов"
        - "свидетельство экспедитора"
        - "транспортно-экспедиционная деятельность"
        - "включён в реестр"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - representations
        - boilerplate
      negative_keywords:
        - "означает"
        - "в целях настоящего"
        - "лицензия перевозчика"
      position_bias:
        preferred_range: [0.0, 0.30]
        boost: 0.15
        scope: segment
      context_k: 4
      max_chunks: 5
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "representations"
        - "boilerplate"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 30
      max_snippet_length: 400

    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false
      llm_max_tokens: 700

      presence_signal:
        field: "forwarder_license_sro_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из договора транспортной экспедиции
        сведения о статусе экспедитора: упоминание статуса, подтверждение
        включением в реестр или свидетельством, конкретные реквизиты.

        Не анализируй лицензию перевозчика, страхование, ответственность,
        оплату и иные темы, если они не содержат сведений о статусе экспедитора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. forwarder_license_sro_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если forwarder_status_mentioned = "yes" или "no";
           - "missing" — если forwarder_status_mentioned = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - forwarder_status_mentioned = "not_defined";
           - forwarder_status_confirmed = "not_defined";
           - forwarder_status_details = "Не установлено";
           - forwarder_status_summary = "Не установлено";
           - не выполняй остальные шаги.

        1. forwarder_status_mentioned — упомянут ли статус экспедитора:
           "yes", "no" или "not_defined".
        2. forwarder_status_confirmed — подтверждён ли статус:
           "confirmed", "not_confirmed" или "not_defined".
        3. forwarder_status_details — реквизиты (номер свидетельства, дата).
        4. forwarder_status_summary — краткое пользовательское резюме.
        5. evidence — массив точных цитат из договора.

        Правила заполнения:
        - Для forwarder_status_mentioned: "yes", если статус прямо упомянут; "no", если прямо указано, что статус не применяется; "not_defined", если отсутствует.
        - Для forwarder_status_confirmed: "confirmed", если прямо указано включение в реестр или наличие свидетельства; "not_confirmed", если статус упомянут, но не подтверждён; "not_defined", если статус не упомянут.
        - Для forwarder_status_details: если реквизиты указаны, верни их кратко; если не указаны, верни "Не установлено".
        - Для forwarder_status_summary: если статус подтверждён, верни краткий факт; если упомянут, но не подтверждён, верни "Статус упомянут; подтверждение отсутствует"; если прямо исключён, верни "Не применяется"; если отсутствует, верни "Не установлено".
        - Не присваивай статус "подтверждён" без прямой ссылки на реестр или свидетельство.
        - Не путай статус экспедитора с лицензией перевозчика.
        - Если данных нет, верни пустой массив [] для evidence.
        </task>

        <context_rules>
        - Перед остальными полями заполни forwarder_license_sro_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined", forwarder_status_summary = "Не установлено".
        - Используй только предоставленный контекст.
        - Не выводи статус экспедитора из закона.
        - Не присваивай статус "подтверждён" без прямой ссылки на реестр или свидетельство.
        - Не путай статус экспедитора с лицензией перевозчика.
        - Если фрагменты конфликтуют и не позволяют сделать надёжный вывод, верни "Не удалось определить" для forwarder_status_summary и включи конфликтующие цитаты в evidence.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет упоминания статуса экспедитора.
           → presence = "missing";
             forwarder_status_mentioned = "not_defined";
             forwarder_status_summary = "Не установлено".

        2. Неполное раскрытие темы.
           Упомянута транспортно-экспедиционная деятельность, но без ссылки на реестр или свидетельство.
           → presence = "present";
             forwarder_status_mentioned = "yes";
             forwarder_status_confirmed = "not_confirmed";
             forwarder_status_summary = "Статус упомянут; подтверждение отсутствует".

        3. Противоречие между фрагментами.
           В разных частях договора указаны противоречащие сведения о статусе.
           → presence = "unclear";
             forwarder_status_summary = "Не удалось определить".

        4. Прямое исключение.
           В договоре прямо указано, что статус экспедитора не применяется или не подтверждается.
           → presence = "present";
             forwarder_status_mentioned = "no";
             forwarder_status_summary = "Не применяется".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для forwarder_license_sro_presence используй только: "present", "missing", "unclear".
        - Для статусных enum-полей используй только: "yes", "no", "confirmed", "not_confirmed", "not_defined".
        - Fallback при отсутствии данных:
          * forwarder_status_details → "Не установлено";
          * forwarder_status_summary → "Не установлено".
        - Fallback при противоречии или неоднозначности:
          * forwarder_status_summary → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "forwarder_license_sro_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования о статусе экспедитора. Внутреннее агрегатное signal-поле."
          required: true

        - name: "forwarder_status_mentioned"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Упоминание статуса экспедитора в договоре. Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "forwarder_status_confirmed"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["confirmed", "not_confirmed", "not_defined"]
          description: "Подтверждение статуса экспедитора: включение в реестр или свидетельство. Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "forwarder_status_details"
          type: "string"
          presentation: "fact"
          label: "Реквизиты статуса"
          description: >
            Конкретные реквизиты: номер свидетельства, дата включения в реестр. Fallback: "Не установлено" / "Не удалось определить".
          required: true
          display_in_grid: false

        - name: "forwarder_status_summary"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 1
          label: "Статус экспедитора"
          description: >
            Краткое описание статуса экспедитора: упоминание, подтверждение, реквизиты. Fallback: "Не установлено" / "Не удалось определить".
          required: true

        - name: "evidence"
          type: "array"
          presentation: "diagnostic"
          description: "Точные цитаты из договора, подтверждающие извлечённые значения."
          required: true
          display_in_grid: false

      store_payload: true

  - id: cmr_incoterms_reference
    name: "Международные перевозки: CMR/КДПГ, Инкотермс"
    description: >
      Фактографическая проверка наличия ссылок на международные конвенции
      (CMR/КДПГ) и базисы Инкотермс при международной экспедиции: наличие
      ссылки на конвенцию, конкретный базис Инкотермс и версия.
    triggers:
      any: ["international_forwarding"]
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "CMR"
        - "КДПГ"
        - "инкотермс"
        - "Incoterms"
        - "международная конвенция"
        - "Конвенция о договоре международной"
        - "базис поставки"
        - "условия поставки"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)CMR|КДПГ"
        - "(?i)инкотермс|incoterms"
        - "(?i)базис.*поставк"
        - "(?i)(EXW|FCA|CPT|CIP|DAP|DPU|DDP|FAS|FOB|CFR|CIF)\\s*(2010|2020)?"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор транспортной экспедиции с элементом международной перевозки.

        Проверяется только один вопрос: ссылки на международные конвенции (CMR/КДПГ)
        и базисы Инкотермс.

        Нормативный ориентир:
        - Конвенция КДПГ (Конвенция о договоре международной дорожной перевозки грузов, 1956);
        - Инкотермс 2010 / 2020.

        Важно:
        - Твоя задача — не оценивать серьёзность риска.
        - Только установить, что прямо есть в тексте договора, а чего прямо нет.
        - Не выводи применимость CMR/Инкотермс из закона. Фиксируй только если прямо указаны.
        - Не путай ссылку на конвенцию с применимым правом.
        - Не присваивай базис Инкотермс по умолчанию.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Наличие ссылки на CMR/КДПГ.
        2. Наличие ссылки на Инкотермс.
        3. Конкретный базис Инкотермс (если указан).
        4. Версия Инкотермс (2010, 2020).
        5. Сформируй краткое пользовательское резюме.
        6. Собери точные цитаты в evidence.

        [ПРАВИЛА]
        1. Используй только предоставленный текст договора.
        2. Если данные отсутствуют:
           - для статусных полей используй "not_defined";
           - для видимых текстовых полей используй "Не установлено".
        3. Не используй null, None, пустые строки.
        4. Если текст есть, но надёжный вывод сделать нельзя:
           - для статусных полей используй "not_defined";
           - для видимых текстовых полей используй "Не удалось определить".
        5. Не выводи применимость CMR/Инкотермс из закона. Фиксируй только если прямо указаны.
        6. Не присваивай базис Инкотермс по умолчанию.
        7. Верни РОВНО один JSON-объект со всеми 6 ключами без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.
        8. В evidence включай только точные цитаты из документа. Если данных нет, верни пустой массив [].
        9. Поле cmr_incoterms_summary должно быть кратким.

        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1 — обе ссылки указаны:
        Фрагмент:
        "К отношениям сторон применяется Конвенция КДПГ. Базис поставки — FCA Москва, Инкотермс 2020."
        Ответ:
        {
          "cmr_convention_referenced": "yes",
          "incoterms_referenced": "yes",
          "incoterms_basis": "FCA Москва",
          "incoterms_version": "2020",
          "cmr_incoterms_summary": "Применяется Конвенция КДПГ; базис поставки — FCA Москва, Инкотермс 2020",
          "evidence": [
            {
              "clause_ref": "п. 1.3",
              "quote": "К отношениям сторон применяется Конвенция КДПГ. Базис поставки — FCA Москва, Инкотермс 2020."
            }
          ]
        }

        Пример 2 — только Инкотермс без базиса:
        Фрагмент:
        "Условия поставки определяются в соответствии с Инкотермс."
        Ответ:
        {
          "cmr_convention_referenced": "not_defined",
          "incoterms_referenced": "yes",
          "incoterms_basis": "Не установлено",
          "incoterms_version": "Не установлено",
          "cmr_incoterms_summary": "Ссылка на Инкотермс есть; конкретный базис и версия не указаны",
          "evidence": [
            {
              "clause_ref": "п. 2.1",
              "quote": "Условия поставки определяются в соответствии с Инкотермс."
            }
          ]
        }

        Пример 3 — условие отсутствует:
        Фрагмент:
        "Экспедитор организует перевозку груза."
        Ответ:
        {
          "cmr_convention_referenced": "not_defined",
          "incoterms_referenced": "not_defined",
          "incoterms_basis": "Не установлено",
          "incoterms_version": "Не установлено",
          "cmr_incoterms_summary": "Не установлено",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Есть ли прямая ссылка на CMR/КДПГ?
        2. Есть ли прямая ссылка на Инкотермс?
        3. Указан ли конкретный базис?
        4. Указана ли версия Инкотермс?
        5. Не выведена ли применимость из закона по умолчанию?
        6. Все ли 6 ключей присутствуют в ответе?
        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь РОВНО одним JSON-объектом без какого-либо дополнительного текста до или после, со всеми 6 ключами:
        {
          "cmr_convention_referenced": "<yes / no / not_defined>",
          "incoterms_referenced": "<yes / no / not_defined>",
          "incoterms_basis": "<базис или 'Не установлено' / 'Не удалось определить'>",
          "incoterms_version": "<версия или 'Не установлено' / 'Не удалось определить'>",
          "cmr_incoterms_summary": "<краткое резюме или 'Не установлено' / 'Не удалось определить'>",
          "evidence": [{"clause_ref": "<пункт или раздел>", "quote": "<точная цитата>"}]
        }
      context_k: 5
      temperature: 0.0
      max_tokens: 700

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "CMR КДПГ инкотермс Incoterms международная конвенция Конвенция о договоре международной перевозки базис поставки условия поставки"
      boost_keywords:
        - "CMR"
        - "КДПГ"
        - "инкотермс"
        - "Incoterms"
        - "международная конвенция"
        - "базис поставки"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - definitions
        - obligations
      negative_keywords:
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.10, 0.50]
        boost: 0.12
        scope: segment
      context_k: 5
      max_chunks: 6
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "definitions"
        - "obligations"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 30
      max_snippet_length: 400

    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false
      llm_max_tokens: 800

      presence_signal:
        field: "cmr_incoterms_reference_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из договора транспортной экспедиции
        сведения о ссылках на международные конвенции (CMR/КДПГ) и базисы
        Инкотермс: наличие ссылок, конкретный базис и версия.

        Не анализируй применимое право, подсудность, страхование, ответственность
        и иные темы, если они не содержат ссылок на CMR/КДПГ или Инкотермс.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. cmr_incoterms_reference_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (cmr_convention_referenced, incoterms_referenced) ≠ "not_defined";
           - "missing" — если оба содержательных поля = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - cmr_convention_referenced = "not_defined";
           - incoterms_referenced = "not_defined";
           - incoterms_basis = "Не установлено";
           - incoterms_version = "Не установлено";
           - cmr_incoterms_summary = "Не установлено";
           - не выполняй остальные шаги.

        1. cmr_convention_referenced — наличие ссылки на CMR/КДПГ:
           "yes", "no" или "not_defined".
        2. incoterms_referenced — наличие ссылки на Инкотермс:
           "yes", "no" или "not_defined".
        3. incoterms_basis — конкретный базис Инкотермс.
        4. incoterms_version — версия Инкотермс (2010, 2020).
        5. cmr_incoterms_summary — краткое пользовательское резюме.
        6. evidence — массив точных цитат из договора.

        Правила заполнения:
        - Для cmr_convention_referenced: "yes", если прямо указана ссылка на CMR/КДПГ; "no", если прямо указано, что не применяется; "not_defined", если отсутствует.
        - Для incoterms_referenced: "yes", если прямо указана ссылка на Инкотермс; "no", если прямо указано, что не применяются; "not_defined", если отсутствует.
        - Для incoterms_basis: если базис указан (EXW, FCA, CPT, CIP, DAP, DPU, DDP и т.д.), верни его; если не указан, верни "Не установлено".
        - Для incoterms_version: если версия указана, верни её; если не указана, верни "Не установлено".
        - Для cmr_incoterms_summary: если обе ссылки указаны, верни краткий факт; если только одна, верни соответствующее резюме; если отсутствуют, верни "Не установлено".
        - Не выводи применимость из закона. Не присваивай базис по умолчанию.
        - Если данных нет, верни пустой массив [] для evidence.
        </task>

        <context_rules>
        - Перед остальными полями заполни cmr_incoterms_reference_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined", cmr_incoterms_summary = "Не установлено".
        - Используй только предоставленный контекст.
        - Не выводи применимость CMR/Инкотермс из закона.
        - Не присваивай базис Инкотермс по умолчанию.
        - Не путай ссылку на конвенцию с применимым правом.
        - Если фрагменты конфликтуют и не позволяют сделать надёжный вывод, верни "Не удалось определить" для cmr_incoterms_summary и включи конфликтующие цитаты в evidence.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ссылок на CMR/КДПГ или Инкотермс.
           → presence = "missing";
             все *_status = "not_defined";
             cmr_incoterms_summary = "Не установлено".

        2. Неполное раскрытие темы.
           Ссылка на Инкотермс есть, но конкретный базис и версия не указаны.
           → presence = "present";
             incoterms_referenced = "yes";
             incoterms_basis = "Не установлено";
             cmr_incoterms_summary = "Ссылка на Инкотермс есть; базис и версия не указаны".

        3. Противоречие между фрагментами.
           В разных частях договора указаны разные базисы или версии.
           → presence = "unclear";
             cmr_incoterms_summary = "Не удалось определить".

        4. Прямое исключение.
           В договоре прямо указано, что CMR/Инкотермс не применяются.
           → presence = "present";
             соответствующий *_referenced = "no";
             cmr_incoterms_summary = "CMR/Инкотермс не применяются".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для cmr_incoterms_reference_presence используй только: "present", "missing", "unclear".
        - Для статусных enum-полей используй только: "yes", "no", "not_defined".
        - Fallback при отсутствии данных:
          * incoterms_basis, incoterms_version → "Не установлено";
          * cmr_incoterms_summary → "Не установлено".
        - Fallback при противоречии или неоднозначности:
          * cmr_incoterms_summary → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "cmr_incoterms_reference_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования о международных конвенциях. Внутреннее агрегатное signal-поле."
          required: true

        - name: "cmr_convention_referenced"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Наличие ссылки на Конвенцию CMR/КДПГ. Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "incoterms_referenced"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Наличие ссылки на Инкотермс. Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "incoterms_basis"
          type: "string"
          presentation: "fact"
          label: "Базис Инкотермс"
          description: >
            Конкретный базис поставки по Инкотермс (EXW, FCA, CPT, CIP, DAP, DPU, DDP и т.д.). Fallback: "Не установлено" / "Не удалось определить".
          required: true
          display_in_grid: false

        - name: "incoterms_version"
          type: "string"
          presentation: "fact"
          label: "Версия Инкотермс"
          description: >
            Версия Инкотермс (2010, 2020). Fallback: "Не установлено" / "Не удалось определить".
          required: false
          display_in_grid: false

        - name: "cmr_incoterms_summary"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 1
          label: "CMR / Инкотермс"
          description: >
            Краткое описание ссылок на международные конвенции и базисы Инкотермс. Fallback: "Не установлено" / "Не удалось определить".
          required: true

        - name: "evidence"
          type: "array"
          presentation: "diagnostic"
          description: "Точные цитаты из договора, подтверждающие извлечённые значения."
          required: true
          display_in_grid: false

      store_payload: true

  - id: sla_kpi_terms
    name: "SLA/KPI: показатели качества услуг"
    description: >
      Фактографическая проверка наличия измеримых показателей качества
      обслуживания (SLA/KPI) в договоре транспортной экспедиции: наличие
      показателей, методики измерения, периодичности отчётности и последствий
      нарушения целевых значений.
    triggers:
      any: ["sla_kpi_present", "framework_agreement"]
    ui_mode: "field_extraction"
    severity: "medium"
    severity_if_pass: "pass"
    severity_if_fail: "medium"
    severity_if_unclear: "low"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "уровень обслуживания"
        - "SLA"
        - "KPI"
        - "показатели качества"
        - "отчёт о качестве"
        - "целевые значения"
        - "методика измерения"
        - "качество обслуживания"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)SLA|KPI"
        - "(?i)показател(и|ей)\\s+качеств"
        - "(?i)уровень\\s+обслуживани"
        - "(?i)целев(ые|ых)\\s+значени"
        - "(?i)методик.*измерени"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор транспортной экспедиции.

        Проверяется только один вопрос: наличие показателей качества
        обслуживания (SLA/KPI) и связанных с ними условий.

        Важно:
        - Твоя задача — не оценивать серьёзность риска.
        - Только установить, что прямо есть в тексте договора, а чего прямо нет.
        - Не выводи наличие SLA/KPI из закона или обычной практики.
        - Не путай показатели качества с общими обязательствами по качеству услуг.
        - Не путай SLA/KPI с претензионным порядком или неустойками за просрочку доставки.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Наличие измеримых показателей качества (SLA/KPI).
        2. Наличие методики измерения или порядка расчёта.
        3. Периодичность отчётности по показателям.
        4. Последствия нарушения целевых значений.
        5. Сформируй краткое пользовательское резюме.
        6. Собери точные цитаты в evidence.

        [ПРАВИЛА]
        1. Используй только предоставленный текст договора.
        2. Если данные отсутствуют:
           - для статусных полей используй "not_defined";
           - для видимых текстовых полей используй "Не установлено".
        3. Не используй null, None, пустые строки.
        4. Если текст есть, но надёжный вывод сделать нельзя:
           - для статусных полей используй "not_defined";
           - для видимых текстовых полей используй "Не удалось определить".
        5. Не выводи наличие SLA/KPI из закона или обычной практики.
        6. Не путай SLA/KPI с общими обязательствами по качеству.
        7. Верни РОВНО один JSON-объект со всеми 5 ключами без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.
        8. В evidence включай только точные цитаты из документа. Если данных нет, верни пустой массив [].
        9. Поле sla_kpi_summary должно быть кратким.

        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1 — полный набор условий:
        Фрагмент:
        "Экспедитор обеспечивает своевременность доставки не ниже 95% в месяц. Отчёт о качестве предоставляется ежемесячно. При нарушении целевого значения Клиент вправе требовать снижения вознаграждения."
        Ответ:
        {
          "sla_kpi_present": "yes",
          "measurement_methodology": "yes",
          "violation_consequences": "yes",
          "sla_kpi_summary": "SLA установлен: своевременность доставки ≥95%/мес; ежемесячный отчёт; при нарушении — снижение вознаграждения",
          "evidence": [
            {
              "clause_ref": "п. 8.1",
              "quote": "Экспедитор обеспечивает своевременность доставки не ниже 95% в месяц. Отчёт о качестве предоставляется ежемесячно. При нарушении целевого значения Клиент вправе требовать снижения вознаграждения."
            }
          ]
        }

        Пример 2 — только упоминание без деталей:
        Фрагмент:
        "Качество услуг оценивается по показателям KPI, согласованным сторонами."
        Ответ:
        {
          "sla_kpi_present": "yes",
          "measurement_methodology": "not_defined",
          "violation_consequences": "not_defined",
          "sla_kpi_summary": "KPI упомянуты; методика измерения и последствия не указаны",
          "evidence": [
            {
              "clause_ref": "п. 8.2",
              "quote": "Качество услуг оценивается по показателям KPI, согласованным сторонами."
            }
          ]
        }

        Пример 3 — условие отсутствует:
        Фрагмент:
        "Экспедитор обязуется оказать услуги надлежащего качества."
        Ответ:
        {
          "sla_kpi_present": "not_defined",
          "measurement_methodology": "not_defined",
          "violation_consequences": "not_defined",
          "sla_kpi_summary": "Не установлено",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Есть ли прямое упоминание измеримых показателей (SLA/KPI)?
        2. Не выведены ли показатели из закона или обычной практики?
        3. Не смешаны ли показатели с общими обязательствами по качеству?
        4. Указана ли методика измерения?
        5. Указаны ли последствия нарушения?
        6. Все ли 5 ключей присутствуют в ответе?
        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь РОВНО одним JSON-объектом без какого-либо дополнительного текста до или после, со всеми 5 ключами:
        {
          "sla_kpi_present": "<yes / no / not_defined>",
          "measurement_methodology": "<yes / no / not_defined>",
          "violation_consequences": "<yes / no / not_defined>",
          "sla_kpi_summary": "<краткое резюме или 'Не установлено' / 'Не удалось определить'>",
          "evidence": [{"clause_ref": "<пункт или раздел>", "quote": "<точная цитата>"}]
        }
      context_k: 5
      temperature: 0.0
      max_tokens: 600

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "уровень обслуживания SLA KPI показатели качества отчёт о качестве целевые значения методика измерения качество обслуживания"
      boost_keywords:
        - "уровень обслуживания"
        - "SLA"
        - "KPI"
        - "показатели качества"
        - "целевые значения"
        - "методика измерения"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - procedures
      negative_keywords:
        - "означает"
        - "в целях настоящего"
        - "неустойка за просрочку доставки"
        - "претензионный порядок"
      position_bias:
        preferred_range: [0.30, 0.70]
        boost: 0.10
        scope: segment
      context_k: 5
      max_chunks: 6
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "obligations"
        - "procedures"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 30
      max_snippet_length: 400

    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false
      llm_max_tokens: 700

      presence_signal:
        field: "sla_kpi_terms_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из договора транспортной экспедиции
        сведения о показателях качества обслуживания (SLA/KPI): наличие
        показателей, методика измерения, периодичность отчётности и
        последствия нарушения целевых значений.

        Не анализируй претензионный порядок, неустойки за просрочку доставки,
        общие обязательства по качеству и иные темы, если они не содержат
        сведений об измеримых показателях SLA/KPI.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. sla_kpi_terms_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если sla_kpi_present = "yes" или "no";
           - "missing" — если sla_kpi_present = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - sla_kpi_present = "not_defined";
           - measurement_methodology = "not_defined";
           - violation_consequences = "not_defined";
           - sla_kpi_summary = "Не установлено";
           - не выполняй остальные шаги.

        1. sla_kpi_present — наличие измеримых показателей качества:
           "yes", "no" или "not_defined".
        2. measurement_methodology — наличие методики измерения:
           "yes", "no" или "not_defined".
        3. violation_consequences — последствия нарушения целевых значений:
           "yes", "no" или "not_defined".
        4. sla_kpi_summary — краткое пользовательское резюме.
        5. evidence — массив точных цитат из договора.

        Правила заполнения:
        - Для sla_kpi_present: "yes", если прямо предусмотрены измеримые показатели (проценты, сроки, количественные значения); "no", если прямо указано, что показатели не устанавливаются; "not_defined", если отсутствует.
        - Для measurement_methodology: "yes", если методика или порядок расчёта указаны; "no", если прямо указано, что методика не устанавливается; "not_defined", если отсутствует.
        - Для violation_consequences: "yes", если последствия нарушения указаны (снижение вознаграждения, штраф, право расторжения); "no", если прямо указано, что последствия не предусмотрены; "not_defined", если отсутствует.
        - Для sla_kpi_summary: если показатели и детали указаны, верни краткий факт; если показатели есть без деталей, верни "Показатели упомянуты; методика и последствия не указаны"; если прямо исключены, верни "Не предусмотрены"; если отсутствуют, верни "Не установлено".
        - Не выводи наличие SLA/KPI из закона или обычной практики.
        - Не путай с общими обязательствами по качеству или с неустойками за просрочку.
        - Если данных нет, верни пустой массив [] для evidence.
        </task>

        <context_rules>
        - Перед остальными полями заполни sla_kpi_terms_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined", sla_kpi_summary = "Не установлено".
        - Используй только предоставленный контекст.
        - Не выводи наличие SLA/KPI из закона или обычной практики.
        - Не путай измеримые показатели с общими обязательствами по качеству услуг.
        - Не путай SLA/KPI с претензионным порядком или неустойками за просрочку доставки.
        - Если фрагменты конфликтуют и не позволяют сделать надёжный вывод, верни "Не удалось определить" для sla_kpi_summary и включи конфликтующие цитаты в evidence.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет упоминания измеримых показателей качества.
           → presence = "missing";
             все *_status = "not_defined";
             sla_kpi_summary = "Не установлено".

        2. Неполное раскрытие темы.
           Показатели упомянуты, но методика и последствия не указаны.
           → presence = "present";
             sla_kpi_present = "yes";
             measurement_methodology = violation_consequences = "not_defined";
             sla_kpi_summary = "Показатели упомянуты; методика и последствия не указаны".

        3. Противоречие между фрагментами.
           В разных частях договора указаны противоречащие целевые значения.
           → presence = "unclear";
             sla_kpi_summary = "Не удалось определить".

        4. Прямое исключение.
           В договоре прямо указано, что показатели качества не устанавливаются.
           → presence = "present";
             sla_kpi_present = "no";
             sla_kpi_summary = "Не предусмотрены".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для sla_kpi_terms_presence используй только: "present", "missing", "unclear".
        - Для статусных enum-полей используй только: "yes", "no", "not_defined".
        - Fallback при отсутствии данных:
          * sla_kpi_summary → "Не установлено".
        - Fallback при противоречии или неоднозначности:
          * sla_kpi_summary → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "sla_kpi_terms_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования о показателях качества. Внутреннее агрегатное signal-поле."
          required: true

        - name: "sla_kpi_present"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Наличие измеримых показателей качества обслуживания (SLA/KPI). Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "measurement_methodology"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Наличие методики измерения или порядка расчёта показателей. Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "violation_consequences"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Последствия нарушения целевых значений показателей. Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "sla_kpi_summary"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 1
          label: "SLA / KPI"
          description: >
            Краткое описание показателей качества: наличие, методика, последствия нарушения. Fallback: "Не установлено" / "Не удалось определить".
          required: true

        - name: "evidence"
          type: "array"
          presentation: "diagnostic"
          description: "Точные цитаты из договора, подтверждающие извлечённые значения."
          required: true
          display_in_grid: false

      store_payload: true

  - id: acceptance_and_delivery_acts
    name: "Акты приёма-передачи груза"
    description: >
      Фактографическая проверка условий оформления актов при приёме и передаче
      груза: наличие требования об акте при приёме, акта при передаче, процедуры
      фиксации повреждений и сроков подписания документов.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "акт приёма-передачи"
        - "акт сдачи груза"
        - "товарно-транспортная накладная"
        - "ТТН"
        - "транспортная накладная"
        - "CMR-накладная"
        - "фиксация повреждений"
        - "подписание акта"
        - "приёмка груза"
        - "передача груза"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)акт.*при[её]м.*передач"
        - "(?i)ТТН|CMR"
        - "(?i)транспортн.*накладн"
        - "(?i)фиксац.*поврежден"
        - "(?i)приемк.*груз"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор транспортной экспедиции.

        Проверяется только один вопрос: условия оформления актов при приёме
        и передаче груза.

        Важно:
        - Твоя задача — не оценивать серьёзность риска.
        - Только установить, что прямо есть в тексте договора, а чего прямо нет.
        - Не выводи обязанность оформления актов из закона. Фиксируй только если прямо указано.
        - Не путай акт приёма-передачи груза с экспедиторской распиской.
        - Не путай акт приёма-передачи груза с актом оказанных услуг.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Предусмотрен ли акт при приёме груза.
        2. Предусмотрен ли акт при передаче груза.
        3. Процедура фиксации повреждений при приёме/передаче.
        4. Сроки подписания документов.
        5. Сформируй краткое пользовательское резюме.
        6. Собери точные цитаты в evidence.

        [ПРАВИЛА]
        1. Используй только предоставленный текст договора.
        2. Если данные отсутствуют:
           - для статусных полей используй "not_defined";
           - для видимых текстовых полей используй "Не установлено".
        3. Не используй null, None, пустые строки.
        4. Если текст есть, но надёжный вывод сделать нельзя:
           - для статусных полей используй "not_defined";
           - для видимых текстовых полей используй "Не удалось определить".
        5. Не выводи обязанность оформления актов из закона. Фиксируй только если прямо указано.
        6. Не путай акт приёма-передачи груза с экспедиторской распиской или актом оказанных услуг.
        7. Верни РОВНО один JSON-объект со всеми 5 ключами без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.
        8. В evidence включай только точные цитаты из документа. Если данных нет, верни пустой массив [].
        9. Поле acceptance_acts_summary должно быть кратким.

        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1 — полный набор условий:
        Фрагмент:
        "При приёме груза Экспедитор подписывает акт приёма-передачи. При передаче груза грузополучателю оформляется акт передачи. Повреждения фиксируются в акте в момент передачи. Акт подписывается в течение 1 рабочего дня."
        Ответ:
        {
          "acceptance_act_required": "yes",
          "delivery_act_required": "yes",
          "damage_recording_procedure": "yes",
          "acceptance_acts_summary": "Акт при приёме и передаче груза; повреждения фиксируются в акте; срок подписания — 1 рабочий день",
          "evidence": [
            {
              "clause_ref": "п. 5.1",
              "quote": "При приёме груза Экспедитор подписывает акт приёма-передачи. При передаче груза грузополучателю оформляется акт передачи. Повреждения фиксируются в акте в момент передачи. Акт подписывается в течение 1 рабочего дня."
            }
          ]
        }

        Пример 2 — только накладная без акта:
        Фрагмент:
        "Приём груза подтверждается товарно-транспортной накладной."
        Ответ:
        {
          "acceptance_act_required": "not_defined",
          "delivery_act_required": "not_defined",
          "damage_recording_procedure": "not_defined",
          "acceptance_acts_summary": "Приём подтверждается ТТН; отдельный акт и фиксация повреждений не указаны",
          "evidence": [
            {
              "clause_ref": "п. 5.2",
              "quote": "Приём груза подтверждается товарно-транспортной накладной."
            }
          ]
        }

        Пример 3 — условие отсутствует:
        Фрагмент:
        "Экспедитор организует перевозку груза."
        Ответ:
        {
          "acceptance_act_required": "not_defined",
          "delivery_act_required": "not_defined",
          "damage_recording_procedure": "not_defined",
          "acceptance_acts_summary": "Не установлено",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Есть ли прямое условие об акте при приёме груза?
        2. Есть ли прямое условие об акте при передаче груза?
        3. Не смешан ли акт с экспедиторской распиской?
        4. Не смешан ли акт с актом оказанных услуг?
        5. Указана ли процедура фиксации повреждений?
        6. Все ли 5 ключей присутствуют в ответе?
        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь РОВНО одним JSON-объектом без какого-либо дополнительного текста до или после, со всеми 5 ключами:
        {
          "acceptance_act_required": "<yes / no / not_defined>",
          "delivery_act_required": "<yes / no / not_defined>",
          "damage_recording_procedure": "<yes / no / not_defined>",
          "acceptance_acts_summary": "<краткое резюме или 'Не установлено' / 'Не удалось определить'>",
          "evidence": [{"clause_ref": "<пункт или раздел>", "quote": "<точная цитата>"}]
        }
      context_k: 5
      temperature: 0.0
      max_tokens: 600

    retrieval:
      retrieval_profile: "acceptance_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "акт приёма-передачи акт сдачи груза товарно-транспортная накладная ТТН транспортная накладная CMR-накладная фиксация повреждений приёмка груза передача груза"
      boost_keywords:
        - "акт приёма-передачи"
        - "акт сдачи груза"
        - "товарно-транспортная накладная"
        - "ТТН"
        - "транспортная накладная"
        - "фиксация повреждений"
        - "приёмка груза"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - procedures
        - obligations
      negative_keywords:
        - "означает"
        - "в целях настоящего"
        - "экспедиторская расписка"
        - "акт оказанных услуг"
      position_bias:
        preferred_range: [0.15, 0.55]
        boost: 0.12
        scope: segment
      context_k: 5
      max_chunks: 6
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "procedures"
        - "obligations"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 30
      max_snippet_length: 400

    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false
      llm_max_tokens: 700

      presence_signal:
        field: "acceptance_and_delivery_acts_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из договора транспортной экспедиции
        сведения об актах приёма-передачи груза: наличие требования об акте
        при приёме, акта при передаче, процедуры фиксации повреждений и сроков
        подписания документов.

        Не анализируй экспедиторскую расписку, акт оказанных услуг, вознаграждение,
        ответственность и иные темы, если они не содержат сведений об актах
        приёма-передачи груза.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. acceptance_and_delivery_acts_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (acceptance_act_required, delivery_act_required,
              damage_recording_procedure) ≠ "not_defined";
           - "missing" — если все три содержательных поля = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - acceptance_act_required = "not_defined";
           - delivery_act_required = "not_defined";
           - damage_recording_procedure = "not_defined";
           - acceptance_acts_summary = "Не установлено";
           - не выполняй остальные шаги.

        1. acceptance_act_required — предусмотрен ли акт при приёме груза:
           "yes", "no" или "not_defined".
        2. delivery_act_required — предусмотрен ли акт при передаче груза:
           "yes", "no" или "not_defined".
        3. damage_recording_procedure — процедура фиксации повреждений:
           "yes", "no" или "not_defined".
        4. acceptance_acts_summary — краткое пользовательское резюме.
        5. evidence — массив точных цитат из договора.

        Правила заполнения:
        - Для acceptance_act_required: "yes", если прямо предусмотрен акт при приёме; "no", если прямо указано, что не предусмотрен; "not_defined", если отсутствует.
        - Для delivery_act_required: "yes", если прямо предусмотрен акт при передаче; "no", если прямо указано, что не предусмотрен; "not_defined", если отсутствует.
        - Для damage_recording_procedure: "yes", если прямо предусмотрена процедура фиксации повреждений; "no", если прямо указано, что не предусмотрена; "not_defined", если отсутствует.
        - Для acceptance_acts_summary: если акты и детали указаны, верни краткий факт; если только накладная, верни "Приём подтверждается ТТН/накладной; отдельный акт не указан"; если прямо исключены, верни "Не предусмотрены"; если отсутствуют, верни "Не установлено".
        - Не путай акт приёма-передачи груза с экспедиторской распиской или актом оказанных услуг.
        - Если данных нет, верни пустой массив [] для evidence.
        </task>

        <context_rules>
        - Перед остальными полями заполни acceptance_and_delivery_acts_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined", acceptance_acts_summary = "Не установлено".
        - Используй только предоставленный контекст.
        - Не выводи обязанность оформления актов из закона.
        - Не путай акт приёма-передачи груза с экспедиторской распиской.
        - Не путай акт приёма-передачи груза с актом оказанных услуг.
        - Если фрагменты конфликтуют и не позволяют сделать надёжный вывод, верни "Не удалось определить" для acceptance_acts_summary и включи конфликтующие цитаты в evidence.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет упоминания актов приёма-передачи груза.
           → presence = "missing";
             все *_status = "not_defined";
             acceptance_acts_summary = "Не установлено".

        2. Неполное раскрытие темы.
           Упомянута только товарно-транспортная накладная, но отдельный акт не предусмотрен.
           → presence = "present";
             соответствующие поля = "not_defined";
             acceptance_acts_summary = "Приём подтверждается ТТН; отдельный акт не указан".

        3. Противоречие между фрагментами.
           В разных частях договора указаны противоречащие условия оформления актов.
           → presence = "unclear";
             acceptance_acts_summary = "Не удалось определить".

        4. Прямое исключение.
           В договоре прямо указано, что акты приёма-передачи не оформляются.
           → presence = "present";
             соответствующие *_status = "no";
             acceptance_acts_summary = "Не предусмотрены".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для acceptance_and_delivery_acts_presence используй только: "present", "missing", "unclear".
        - Для статусных enum-полей используй только: "yes", "no", "not_defined".
        - Fallback при отсутствии данных:
          * acceptance_acts_summary → "Не установлено".
        - Fallback при противоречии или неоднозначности:
          * acceptance_acts_summary → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "acceptance_and_delivery_acts_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования об актах приёма-передачи груза. Внутреннее агрегатное signal-поле."
          required: true

        - name: "acceptance_act_required"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Предусмотрен ли акт при приёме груза. Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "delivery_act_required"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Предусмотрен ли акт при передаче груза. Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "damage_recording_procedure"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Процедура фиксации повреждений при приёме/передаче груза. Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "acceptance_acts_summary"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 1
          label: "Акты приёма-передачи"
          description: >
            Краткое описание условий оформления актов при приёме и передаче груза. Fallback: "Не установлено" / "Не удалось определить".
          required: true

        - name: "evidence"
          type: "array"
          presentation: "diagnostic"
          description: "Точные цитаты из договора, подтверждающие извлечённые значения."
          required: true
          display_in_grid: false

      store_payload: true

  - id: vat_and_tax
    name: "НДС и налоговые оговорки"
    description: >
      Фактографическая проверка указаний на режим НДС в договоре транспортной
      экспедиции: наличие указания на НДС, конкретная ставка, включение в
      вознаграждение или начисление сверх, применение освобождения.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "medium"
    severity_if_pass: "pass"
    severity_if_fail: "medium"
    severity_if_unclear: "low"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "НДС"
        - "в том числе НДС"
        - "без НДС"
        - "включая НДС"
        - "НДС сверх"
        - "налог на добавленную стоимость"
        - "налоговые оговорки"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)\\bНДС\\b"
        - "(?i)налог.*добавленн.*стоимост"
        - "(?i)(включая|в том числе|сверх).*НДС"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор транспортной экспедиции.

        Проверяется только один вопрос: указания на режим НДС.

        Важно:
        - Твоя задача — не оценивать серьёзность риска.
        - Только установить, что прямо есть в тексте договора, а чего прямо нет.
        - Не выводи режим НДС из закона или налоговой системы исполнителя.
        - Не путай НДС с иными налогами и сборами.
        - Общая фраза «все налоги включены» без прямого упоминания НДС
          не является основанием для фиксации режима НДС.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Наличие указания на НДС.
        2. Конкретная ставка или режим (в т.ч. НДС 20%, без НДС, НДС сверх цены).
        3. Применение освобождения (если указано).
        4. Сформируй краткое пользовательское резюме.
        5. Собери точные цитаты в evidence.

        [ПРАВИЛА]
        1. Используй только предоставленный текст договора.
        2. Если данные отсутствуют:
           - для статусных полей используй "not_defined";
           - для видимых текстовых полей используй "Не указано".
        3. Не используй null, None, пустые строки.
        4. Если текст есть, но надёжный вывод сделать нельзя:
           - для статусных полей используй "not_defined";
           - для видимых текстовых полей используй "Не удалось определить".
        5. Не выводи режим НДС из закона или налоговой системы исполнителя.
        6. Общая фраза «все налоги включены» без прямого упоминания НДС не является основанием.
        7. Верни РОВНО один JSON-объект со всеми 4 ключами без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.
        8. В evidence включай только точные цитаты из документа. Если данных нет, верни пустой массив [].
        9. Поле vat_and_tax_summary должно быть кратким.

        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1 — НДС включён:
        Фрагмент:
        "Вознаграждение Экспедитора составляет 50 000 рублей, в том числе НДС 20%."
        Ответ:
        {
          "vat_mode_specified": "yes",
          "vat_display": "Включая НДС 20%",
          "vat_and_tax_summary": "Вознаграждение включает НДС 20%",
          "evidence": [
            {
              "clause_ref": "п. 3.1",
              "quote": "Вознаграждение Экспедитора составляет 50 000 рублей, в том числе НДС 20%."
            }
          ]
        }

        Пример 2 — без НДС:
        Фрагмент:
        "Вознаграждение Экспедитора составляет 50 000 рублей. НДС не облагается в связи с применением УСН."
        Ответ:
        {
          "vat_mode_specified": "yes",
          "vat_display": "Без НДС (УСН)",
          "vat_and_tax_summary": "НДС не облагается в связи с применением УСН",
          "evidence": [
            {
              "clause_ref": "п. 3.1",
              "quote": "Вознаграждение Экспедитора составляет 50 000 рублей. НДС не облагается в связи с применением УСН."
            }
          ]
        }

        Пример 3 — условие отсутствует:
        Фрагмент:
        "Клиент оплачивает услуги Экспедитора."
        Ответ:
        {
          "vat_mode_specified": "not_defined",
          "vat_display": "Не указано",
          "vat_and_tax_summary": "Не указано",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Есть ли прямое упоминание НДС?
        2. Не выведен ли режим НДС из закона по умолчанию?
        3. Не является ли основанием только общая фраза «все налоги включены»?
        4. Указана ли конкретная ставка или режим?
        5. Все ли 4 ключа присутствуют в ответе?
        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь РОВНО одним JSON-объектом без какого-либо дополнительного текста до или после, со всеми 4 ключами:
        {
          "vat_mode_specified": "<yes / no / not_defined>",
          "vat_display": "<режим НДС или 'Не указано' / 'Не удалось определить'>",
          "vat_and_tax_summary": "<краткое резюме или 'Не указано' / 'Не удалось определить'>",
          "evidence": [{"clause_ref": "<пункт или раздел>", "quote": "<точная цитата>"}]
        }
      context_k: 4
      temperature: 0.0
      max_tokens: 500

    retrieval:
      retrieval_profile: "payment_terms_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "НДС в том числе НДС без НДС включая НДС сверх цены налоговые оговорки налог на добавленную стоимость"
      boost_keywords:
        - "НДС"
        - "в том числе НДС"
        - "без НДС"
        - "включая НДС"
        - "налог на добавленную стоимость"
      preferred_unit_types:
        - obligation
        - general_provision
        - payment_term
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
      negative_keywords:
        - "означает"
        - "в целях настоящего"
        - "налог на прибыль"
        - "НДФЛ"
      position_bias:
        preferred_range: [0.20, 0.60]
        boost: 0.10
        scope: segment
      context_k: 4
      max_chunks: 5
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "obligations"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 30
      max_snippet_length: 400

    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false
      llm_max_tokens: 600

      presence_signal:
        field: "vat_and_tax_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из договора транспортной экспедиции
        сведения о режиме НДС: наличие указания на НДС, конкретная ставка или
        режим, применение освобождения.

        Не анализируй иные налоги, порядок оплаты, ответственность, страхование
        и иные темы, если они не содержат прямых указаний на НДС.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. vat_and_tax_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если vat_mode_specified = "yes" или "no";
           - "missing" — если vat_mode_specified = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - vat_mode_specified = "not_defined";
           - vat_display = "Не указано";
           - vat_and_tax_summary = "Не указано";
           - не выполняй остальные шаги.

        1. vat_mode_specified — указано ли режим НДС:
           "yes", "no" или "not_defined".
        2. vat_display — конкретная ставка или режим НДС.
        3. vat_and_tax_summary — краткое пользовательское резюме.
        4. evidence — массив точных цитат из договора.

        Правила заполнения:
        - Для vat_mode_specified: "yes", если прямо указано «в том числе НДС», «включая НДС», «без НДС», «НДС сверх цены» или конкретная ставка; "no", если прямо указано, что НДС не применяется или освобождение; "not_defined", если отсутствует.
        - Для vat_display: если режим указан, верни его кратко («Включая НДС 20%», «Без НДС (УСН)», «НДС сверх цены»); если не указан, верни "Не указано".
        - Для vat_and_tax_summary: если режим указан, верни краткий факт; если прямо исключён, верни "НДС не применяется"; если отсутствует, верни "Не указано".
        - Не выводи режим НДС из закона. Общая фраза «все налоги включены» без упоминания НДС не является основанием.
        - Если данных нет, верни пустой массив [] для evidence.
        </task>

        <context_rules>
        - Перед остальными полями заполни vat_and_tax_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — vat_mode_specified = "not_defined", vat_and_tax_summary = "Не указано".
        - Используй только предоставленный контекст.
        - Не выводи режим НДС из закона или налоговой системы исполнителя.
        - Не путай НДС с иными налогами и сборами.
        - Общая фраза «все налоги включены» без прямого упоминания НДС не является основанием.
        - Если фрагменты конфликтуют и не позволяют сделать надёжный вывод, верни "Не удалось определить" для vat_and_tax_summary и включи конфликтующие цитаты в evidence.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет упоминания НДС.
           → presence = "missing";
             vat_mode_specified = "not_defined";
             vat_and_tax_summary = "Не указано".

        2. Неполное раскрытие темы.
           Упомянуто «все налоги включены», но без прямого упоминания НДС.
           → presence = "missing";
             vat_mode_specified = "not_defined";
             vat_and_tax_summary = "Не указано".

        3. Противоречие между фрагментами.
           В разных частях договора указаны противоречащие режимы НДС.
           → presence = "unclear";
             vat_and_tax_summary = "Не удалось определить".

        4. Прямое освобождение.
           В договоре прямо указано, что НДС не облагается (УСН, освобождение по ст. 145 НК РФ).
           → presence = "present";
             vat_mode_specified = "no";
             vat_display = "Без НДС (освобождение/УСН)";
             vat_and_tax_summary = "НДС не облагается (освобождение/УСН)".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для vat_and_tax_presence используй только: "present", "missing", "unclear".
        - Для статусных enum-полей используй только: "yes", "no", "not_defined".
        - Fallback при отсутствии данных:
          * vat_display → "Не указано";
          * vat_and_tax_summary → "Не указано".
        - Fallback при противоречии или неоднозначности:
          * vat_and_tax_summary → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "vat_and_tax_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования о режиме НДС. Внутреннее агрегатное signal-поле."
          required: true

        - name: "vat_mode_specified"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Указан ли режим НДС в договоре. Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "vat_display"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 1
          label: "НДС"
          description: >
            Конкретный режим НДС: «Включая НДС 20%», «Без НДС (УСН)», «НДС сверх цены» и т.п. Fallback: "Не установлено" / "Не удалось определить".
          required: true

        - name: "vat_and_tax_summary"
          type: "string"
          presentation: "fact"
          display_in_grid: false
          label: "НДС: резюме"
          description: >
            Краткое описание режима НДС по договору. Fallback: "Не установлено" / "Не удалось определить".
          required: false

        - name: "evidence"
          type: "array"
          presentation: "diagnostic"
          description: "Точные цитаты из договора, подтверждающие извлечённые значения."
          required: true
          display_in_grid: false

      store_payload: true

  - id: remuneration_and_payment
    name: "Порядок оплаты вознаграждения: сроки, аванс, неустойка за просрочку"
    description: >
      Фактографическая проверка порядка оплаты вознаграждения экспедитора:
      сроки оплаты (аванс / постоплата / поэтапная), порядок выставления счетов,
      неустойка или проценты за просрочку оплаты клиентом, связь оплаты с
      отчётом экспедитора. Размер вознаграждения и возмещение расходов
      фиксируются в remuneration_and_expenses_check.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "порядок оплаты"
        - "срок оплаты"
        - "оплата вознаграждения"
        - "аванс"
        - "предоплата"
        - "предварительная оплата"
        - "постоплата"
        - "поэтапная оплата"
        - "выставление счёта"
        - "выставление счета"
        - "оплата по счёту"
        - "оплата по счету"
        - "просрочка оплаты"
        - "неустойка за просрочку оплаты"
        - "проценты за просрочку"
        - "ст. 395"
        - "оплата после отчёта"
        - "оплата после подписания акта"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)порядок\\s+оплат"
        - "(?i)срок\\s+оплат"
        - "(?i)оплат.*вознагражден"
        - "(?i)(аванс|предоплат|предварительн.*оплат)"
        - "(?i)выставлени[еяю].*сч[её]т"
        - "(?i)просрочк.*оплат"
        - "(?i)неустойк.*оплат"
        - "(?i)процент.*просрочк"
        - "(?i)ст\\.?\\s*395"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор транспортной экспедиции.

        Проверяется только один вопрос: порядок оплаты вознаграждения экспедитора.

        Нормативный ориентир:
        - ст. 804 ГК РФ;
        - ст. 395 ГК РФ (проценты за просрочку).

        Важно:
        - Твоя задача — не оценивать серьёзность риска.
        - Только установить, что прямо есть в тексте договора, а чего прямо нет.
        - Не путай порядок оплаты с размером вознаграждения.
        - Не путай неустойку за просрочку оплаты с неустойкой за просрочку доставки.
        - Не выводи порядок оплаты из закона. Фиксируй только если прямо указан.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Указан ли порядок оплаты вознаграждения.
        2. Срок оплаты (аванс, постоплата, поэтапная).
        3. Порядок выставления счетов.
        4. Неустойка или проценты за просрочку оплаты клиентом.
        5. Связь оплаты с отчётом экспедитора или актом.
        6. Сформируй краткое пользовательское резюме.
        7. Собери точные цитаты в evidence.

        [ПРАВИЛА]
        1. Используй только предоставленный текст договора.
        2. Если данные отсутствуют:
           - для статусных полей используй "not_defined";
           - для видимых текстовых полей используй "Не установлено".
        3. Не используй null, None, пустые строки.
        4. Если текст есть, но надёжный вывод сделать нельзя:
           - для статусных полей используй "not_defined";
           - для видимых текстовых полей используй "Не удалось определить".
        5. Для payment_model:
           - "advance" — предоплата / аванс до оказания услуг;
           - "postpayment" — оплата после оказания услуг / подписания акта;
           - "staged" — поэтапная оплата;
           - "mixed" — сочетание аванса и постоплаты;
           - "not_defined" — модель не определена.
        6. Не путай неустойку за просрочку оплаты с неустойкой за просрочку доставки.
        7. Верни РОВНО один JSON-объект со всеми 7 ключами без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.
        8. В evidence включай только точные цитаты из документа. Если данных нет, верни пустой массив [].
        9. Поле remuneration_payment_summary должно быть кратким.

        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1 — полный порядок оплаты:
        Фрагмент:
        "Клиент оплачивает вознаграждение Экспедитора в течение 10 рабочих дней с даты подписания отчёта экспедитора. Оплата производится по выставленному счёту. За просрочку оплаты начисляется неустойка 0,1% в день."
        Ответ:
        {
          "payment_procedure_specified": "yes",
          "payment_model": "postpayment",
          "payment_deadline": "10 рабочих дней с даты подписания отчёта",
          "late_payment_penalty": "0,1% в день",
          "invoice_procedure_specified": "yes",
          "remuneration_payment_summary": "Оплата в течение 10 рабочих дней после отчёта; по выставленному счёту; неустойка за просрочку 0,1% в день",
          "evidence": [
            {
              "clause_ref": "п. 3.2",
              "quote": "Клиент оплачивает вознаграждение Экспедитора в течение 10 рабочих дней с даты подписания отчёта экспедитора. Оплата производится по выставленному счёту. За просрочку оплаты начисляется неустойка 0,1% в день."
            }
          ]
        }

        Пример 2 — аванс и постоплата:
        Фрагмент:
        "Клиент выплачивает аванс 50% в течение 3 дней с даты подписания договора. Оставшиеся 50% — в течение 5 дней после подписания акта."
        Ответ:
        {
          "payment_procedure_specified": "yes",
          "payment_model": "mixed",
          "payment_deadline": "аванс 50% — 3 дня; остаток 50% — 5 дней после акта",
          "late_payment_penalty": "Не установлено",
          "invoice_procedure_specified": "not_defined",
          "remuneration_payment_summary": "Смешанная оплата: аванс 50% в течение 3 дней, остаток 50% в течение 5 дней после акта; неустойка не указана",
          "evidence": [
            {
              "clause_ref": "п. 3.1",
              "quote": "Клиент выплачивает аванс 50% в течение 3 дней с даты подписания договора. Оставшиеся 50% — в течение 5 дней после подписания акта."
            }
          ]
        }

        Пример 3 — порядок оплаты не указан:
        Фрагмент:
        "Экспедитор оказывает услуги по экспедированию."
        Ответ:
        {
          "payment_procedure_specified": "not_defined",
          "payment_model": "not_defined",
          "payment_deadline": "Не установлено",
          "late_payment_penalty": "Не установлено",
          "invoice_procedure_specified": "not_defined",
          "remuneration_payment_summary": "Не установлено",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Есть ли прямое условие о порядке оплаты?
        2. Не смешан ли порядок оплаты с размером вознаграждения?
        3. Не смешана ли неустойка за просрочку оплаты с неустойкой за просрочку доставки?
        4. Определена ли модель оплаты (аванс / постоплата / смешанная)?
        5. Указан ли срок оплаты?
        6. Все ли 7 ключей присутствуют в ответе?
        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь РОВНО одним JSON-объектом без какого-либо дополнительного текста до или после, со всеми 7 ключами:
        {
          "payment_procedure_specified": "<yes / no / not_defined>",
          "payment_model": "<advance / postpayment / staged / mixed / not_defined>",
          "payment_deadline": "<срок оплаты или 'Не установлено' / 'Не удалось определить'>",
          "late_payment_penalty": "<неустойка или 'Не установлено' / 'Не удалось определить'>",
          "invoice_procedure_specified": "<yes / no / not_defined>",
          "remuneration_payment_summary": "<краткое резюме или 'Не установлено' / 'Не удалось определить'>",
          "evidence": [{"clause_ref": "<пункт или раздел>", "quote": "<точная цитата>"}]
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 700

    retrieval:
      retrieval_profile: "payment_terms_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "порядок оплаты срок оплаты вознаграждения аванс предоплата постоплата выставление счёта просрочка оплаты неустойка за просрочку оплаты проценты за просрочку оплата после отчёта оплата после акта"
      boost_keywords:
        - "порядок оплаты"
        - "срок оплаты"
        - "оплата вознаграждения"
        - "аванс"
        - "предоплата"
        - "выставление счёта"
        - "просрочка оплаты"
        - "неустойка за просрочку"
      preferred_unit_types:
        - obligation
        - payment_term
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - procedures
      negative_keywords:
        - "означает"
        - "в целях настоящего"
        - "просрочка доставки"
        - "неустойка за просрочку доставки"
        - "возмещение расходов"
      position_bias:
        preferred_range: [0.15, 0.65]
        boost: 0.15
        scope: segment
      context_k: 6
      max_chunks: 8
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "obligations"
        - "procedures"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 35
      max_snippet_length: 550

    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false
      llm_max_tokens: 900

      presence_signal:
        field: "remuneration_and_payment_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из договора транспортной экспедиции
        сведения о порядке оплаты вознаграждения экспедитора: срок оплаты,
        модель оплаты (аванс/постоплата), порядок выставления счетов,
        неустойка за просрочку оплаты клиентом.

        Не анализируй размер вознаграждения, возмещение расходов, лимиты
        расходов, неустойку за просрочку доставки и иные темы, если они не
        содержат сведений о порядке оплаты вознаграждения.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. remuneration_and_payment_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если payment_procedure_specified = "yes" или "no";
           - "missing" — если payment_procedure_specified = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - payment_procedure_specified = "not_defined";
           - payment_model = "not_defined";
           - invoice_procedure_specified = "not_defined";
           - payment_deadline, late_payment_penalty = "Не установлено";
           - remuneration_payment_summary = "Не установлено";
           - не выполняй остальные шаги.

        1. payment_procedure_specified — указан ли порядок оплаты вознаграждения:
           "yes", "no" или "not_defined".
        2. payment_model — модель оплаты:
           "advance", "postpayment", "staged", "mixed" или "not_defined".
        3. payment_deadline — срок оплаты вознаграждения.
        4. late_payment_penalty — неустойка или проценты за просрочку оплаты клиентом.
        5. invoice_procedure_specified — порядок выставления счетов:
           "yes", "no" или "not_defined".
        6. remuneration_payment_summary — краткое пользовательское резюме.
        7. evidence — массив точных цитат из договора.

        Правила заполнения:
        - Для payment_procedure_specified: "yes", если порядок оплаты прямо указан; "no", если прямо указано, что порядок не устанавливается; "not_defined", если отсутствует.
        - Для payment_model: "advance", если предоплата/аванс до оказания услуг; "postpayment", если оплата после оказания услуг/акта/отчёта; "staged", если поэтапная; "mixed", если сочетание; "not_defined", если не определена.
        - Для payment_deadline: если срок указан, верни его кратко; если определяется через документ, верни "Определяется по ..."; если не указан, верни "Не установлено".
        - Для late_payment_penalty: если неустойка или проценты указаны, верни их кратко; если не указаны, верни "Не установлено".
        - Для invoice_procedure_specified: "yes", если порядок выставления счетов указан; "no", если прямо указано, что не требуется; "not_defined", если отсутствует.
        - Для remuneration_payment_summary: если порядок и детали указаны, верни краткий факт; если порядок есть без деталей, верни "Порядок оплаты указан; детали не определены"; если прямо исключён, верни "Не предусмотрен"; если отсутствует, верни "Не установлено".
        - Не путай порядок оплаты с размером вознаграждения.
        - Не путай неустойку за просрочку оплаты с неустойкой за просрочку доставки.
        - Если данных нет, верни пустой массив [] для evidence.
        </task>

        <context_rules>
        - Перед остальными полями заполни remuneration_and_payment_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined", remuneration_payment_summary = "Не установлено".
        - Используй только предоставленный контекст.
        - Не выводи порядок оплаты из закона.
        - Не путай порядок оплаты с размером вознаграждения.
        - Не путай неустойку за просрочку оплаты с неустойкой за просрочку доставки.
        - Не путай оплату вознаграждения с возмещением расходов.
        - Если фрагменты конфликтуют и не позволяют сделать надёжный вывод, верни "Не удалось определить" для remuneration_payment_summary и включи конфликтующие цитаты в evidence.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет упоминания порядка оплаты вознаграждения.
           → presence = "missing";
             payment_procedure_specified = "not_defined";
             remuneration_payment_summary = "Не установлено".

        2. Неполное раскрытие темы.
           Порядок оплаты упомянут, но срок, модель или неустойка не указаны.
           → presence = "present";
             payment_procedure_specified = "yes";
             соответствующие детали = "Не установлено" или "not_defined";
             remuneration_payment_summary = "Порядок оплаты указан; детали не определены".

        3. Противоречие между фрагментами.
           В разных частях договора указаны разные сроки оплаты или противоречащие модели.
           → presence = "unclear";
             remuneration_payment_summary = "Не удалось определить".

        4. Прямое исключение.
           В договоре прямо указано, что порядок оплаты не устанавливается или определяется отдельно.
           → presence = "present";
             payment_procedure_specified = "no";
             remuneration_payment_summary = "Не предусмотрен" или "Определяется отдельным соглашением".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для remuneration_and_payment_presence используй только: "present", "missing", "unclear".
        - Для статусных enum-полей используй только: "yes", "no", "not_defined", "advance", "postpayment", "staged", "mixed".
        - Fallback при отсутствии данных:
          * payment_deadline, late_payment_penalty → "Не установлено";
          * remuneration_payment_summary → "Не установлено".
        - Fallback при противоречии или неоднозначности:
          * remuneration_payment_summary → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "remuneration_and_payment_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования о порядке оплаты вознаграждения. Внутреннее агрегатное signal-поле."
          required: true

        - name: "payment_procedure_specified"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Указан ли порядок оплаты вознаграждения экспедитора. Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "payment_model"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["advance", "postpayment", "staged", "mixed", "not_defined"]
          description: "Модель оплаты: аванс, постоплата, поэтапная, смешанная. Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "payment_deadline"
          type: "string"
          presentation: "fact"
          label: "Срок оплаты"
          description: >
            Срок оплаты вознаграждения экспедитора. Fallback: "Не установлено" / "Не удалось определить".
          required: true
          display_in_grid: false

        - name: "late_payment_penalty"
          type: "string"
          presentation: "fact"
          label: "Неустойка за просрочку оплаты"
          description: >
            Неустойка или проценты за просрочку оплаты вознаграждения клиентом. Fallback: "Не установлено" / "Не удалось определить".
          required: true
          display_in_grid: false

        - name: "invoice_procedure_specified"
          type: "string"
          presentation: "signal"
          risk_weight: "low"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Порядок выставления счетов на оплату. Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "remuneration_payment_summary"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 1
          label: "Порядок оплаты вознаграждения"
          description: >
            Краткое описание порядка оплаты вознаграждения: срок, модель, неустойка за просрочку. Fallback: "Не установлено" / "Не удалось определить".
          required: true

        - name: "evidence"
          type: "array"
          presentation: "diagnostic"
          description: "Точные цитаты из договора, подтверждающие извлечённые значения."
          required: true
          display_in_grid: false

      store_payload: true

  - id: forwarder_instruction
    name: "Поручение экспедитору: обязательность, порядок подачи, право отклонения"
    description: >
      Фактографическая проверка процедуры поручения экспедитору: обязательность
      поручения для каждой перевозки, порядок и сроки подачи, момент, с которого
      поручение становится обязательным для экспедитора, право экспедитора
      отклонить поручение. Форма и статус документа фиксируются в
      forwarder_instructions_check.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "поручение экспедитору"
        - "подать поручение"
        - "направить поручение"
        - "срок подачи поручения"
        - "поручение является обязательным"
        - "поручение становится обязательным"
        - "отклонить поручение"
        - "отказ от поручения"
        - "согласование поручения"
        - "подтверждение поручения"
        - "заявка на перевозку"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)поручени[еяюем].*экспедитор"
        - "(?i)подат(ь|ча).*поручени"
        - "(?i)направ(ить|ляет).*поручени"
        - "(?i)отклон(ить|яет).*поручени"
        - "(?i)поручени.*обязательн"
        - "(?i)согласовани.*поручени"
        - "(?i)подтверждени.*поручени"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор транспортной экспедиции (ст. 804 ГК РФ, ФЗ-87).

        Проверяется только один вопрос: процедура поручения экспедитору —
        обязательность, порядок подачи, момент обязательности, право отклонения.

        Нормативный ориентир:
        - ст. 804 ГК РФ;
        - Приказ Минтранса России № 23 (форма Поручения экспедитору).

        Важно:
        - Твоя задача — не оценивать серьёзность риска.
        - Только установить, что прямо есть в тексте договора, а чего прямо нет.
        - Не путай процедуру подачи поручения с формой документа (это отдельный чек).
        - Не выводи обязательность поручения из закона. Фиксируй только если прямо указано.
        - Не путай поручение экспедитору с заявкой на перевозку, если они
          не отождествлены в договоре.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Обязательность поручения для каждой перевозки.
        2. Порядок и сроки подачи поручения.
        3. Момент, с которого поручение становится обязательным для экспедитора.
        4. Право экспедитора отклонить поручение.
        5. Последствия неисполнения поручения.
        6. Сформируй краткое пользовательское резюме.
        7. Собери точные цитаты в evidence.

        [ПРАВИЛА]
        1. Используй только предоставленный текст договора.
        2. Если данные отсутствуют:
           - для статусных полей используй "not_defined";
           - для видимых текстовых полей используй "Не установлено".
        3. Не используй null, None, пустые строки.
        4. Если текст есть, но надёжный вывод сделать нельзя:
           - для статусных полей используй "not_defined";
           - для видимых текстовых полей используй "Не удалось определить".
        5. Для instruction_binding_moment:
           - "upon_receipt" — поручение обязательно с момента получения;
           - "upon_confirmation" — поручение обязательно после подтверждения экспедитором;
           - "upon_deadline" — поручение обязательно, если экспедитор не отклонил в срок;
           - "not_defined" — момент не определён.
        6. Не выводи обязательность поручения из закона. Фиксируй только если прямо указано.
        7. Верни РОВНО один JSON-объект со всеми 6 ключами без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.
        8. В evidence включай только точные цитаты из документа. Если данных нет, верни пустой массив [].
        9. Поле instruction_summary должно быть кратким.

        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1 — полная процедура:
        Фрагмент:
        "Клиент обязан подать Поручение экспедитору не позднее чем за 3 рабочих дня до даты перевозки. Поручение становится обязательным для Экспедитора с момента получения. Экспедитор вправе отклонить поручение в течение 1 рабочего дня с мотивированным обоснованием."
        Ответ:
        {
          "instruction_mandatory": "yes",
          "instruction_submission_procedure": "не позднее чем за 3 рабочих дня до даты перевозки",
          "instruction_binding_moment": "upon_receipt",
          "forwarder_rejection_right": "yes",
          "instruction_summary": "Поручение обязательно; подача за 3 рабочих дня; обязательно с момента получения; экспедитор вправе отклонить в течение 1 рабочего дня",
          "evidence": [
            {
              "clause_ref": "п. 2.3",
              "quote": "Клиент обязан подать Поручение экспедитору не позднее чем за 3 рабочих дня до даты перевозки. Поручение становится обязательным для Экспедитора с момента получения. Экспедитор вправе отклонить поручение в течение 1 рабочего дня с мотивированным обоснованием."
            }
          ]
        }

        Пример 2 — поручение с подтверждением:
        Фрагмент:
        "Перевозка осуществляется на основании Поручения экспедитору. Поручение считается согласованным после подтверждения Экспедитором в письменной форме."
        Ответ:
        {
          "instruction_mandatory": "yes",
          "instruction_submission_procedure": "Не установлено",
          "instruction_binding_moment": "upon_confirmation",
          "forwarder_rejection_right": "not_defined",
          "instruction_summary": "Поручение обязательно; становится обязательным после письменного подтверждения экспедитором",
          "evidence": [
            {
              "clause_ref": "п. 2.1",
              "quote": "Перевозка осуществляется на основании Поручения экспедитору. Поручение считается согласованным после подтверждения Экспедитором в письменной форме."
            }
          ]
        }

        Пример 3 — условие отсутствует:
        Фрагмент:
        "Экспедитор организует перевозку груза."
        Ответ:
        {
          "instruction_mandatory": "not_defined",
          "instruction_submission_procedure": "Не установлено",
          "instruction_binding_moment": "not_defined",
          "forwarder_rejection_right": "not_defined",
          "instruction_summary": "Не установлено",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Есть ли прямое условие об обязательности поручения?
        2. Не выведена ли обязательность из закона по умолчанию?
        3. Указан ли порядок и сроки подачи?
        4. Определён ли момент обязательности поручения?
        5. Указано ли право экспедитора отклонить поручение?
        6. Не смешана ли процедура с формой документа?
        7. Все ли 6 ключей присутствуют в ответе?
        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь РОВНО одним JSON-объектом без какого-либо дополнительного текста до или после, со всеми 6 ключами:
        {
          "instruction_mandatory": "<yes / no / not_defined>",
          "instruction_submission_procedure": "<порядок подачи или 'Не установлено' / 'Не удалось определить'>",
          "instruction_binding_moment": "<upon_receipt / upon_confirmation / upon_deadline / not_defined>",
          "forwarder_rejection_right": "<yes / no / not_defined>",
          "instruction_summary": "<краткое резюме или 'Не установлено' / 'Не удалось определить'>",
          "evidence": [{"clause_ref": "<пункт или раздел>", "quote": "<точная цитата>"}]
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 700

    retrieval:
      retrieval_profile: "scope_of_work_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "поручение экспедитору подать поручение направить поручение срок подачи поручения поручение является обязательным отклонить поручение согласование поручения подтверждение поручения заявка на перевозку"
      boost_keywords:
        - "поручение экспедитору"
        - "подать поручение"
        - "направить поручение"
        - "срок подачи поручения"
        - "отклонить поручение"
        - "согласование поручения"
        - "подтверждение поручения"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - procedures
        - obligations
      negative_keywords:
        - "означает"
        - "в целях настоящего"
        - "форма поручения"
        - "приложение к договору"
      position_bias:
        preferred_range: [0.05, 0.55]
        boost: 0.15
        scope: segment
      context_k: 6
      max_chunks: 8
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "procedures"
        - "obligations"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 35
      max_snippet_length: 550

    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false
      llm_max_tokens: 900

      presence_signal:
        field: "forwarder_instruction_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из договора транспортной экспедиции
        сведения о процедуре поручения экспедитору: обязательность для каждой
        перевозки, порядок и сроки подачи, момент обязательности, право
        экспедитора отклонить поручение.

        Не анализируй форму документа поручения, его статус как приложения
        к договору, требования к содержанию поручения (это отдельный чек),
        а также вознаграждение, ответственность и иные темы.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. forwarder_instruction_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если instruction_mandatory = "yes" или "no";
           - "missing" — если instruction_mandatory = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - instruction_mandatory = "not_defined";
           - instruction_binding_moment = "not_defined";
           - forwarder_rejection_right = "not_defined";
           - instruction_submission_procedure = "Не установлено";
           - instruction_summary = "Не установлено";
           - не выполняй остальные шаги.

        1. instruction_mandatory — обязательность поручения для каждой перевозки:
           "yes", "no" или "not_defined".
        2. instruction_submission_procedure — порядок и сроки подачи поручения.
        3. instruction_binding_moment — момент обязательности поручения:
           "upon_receipt", "upon_confirmation", "upon_deadline" или "not_defined".
        4. forwarder_rejection_right — право экспедитора отклонить поручение:
           "yes", "no" или "not_defined".
        5. instruction_summary — краткое пользовательское резюме.
        6. evidence — массив точных цитат из договора.

        Правила заполнения:
        - Для instruction_mandatory: "yes", если поручение прямо указано как обязательное для каждой перевозки; "no", если прямо указано, что поручение не требуется; "not_defined", если отсутствует.
        - Для instruction_submission_procedure: если порядок и сроки подачи указаны, верни их кратко; если не указаны, верни "Не установлено".
        - Для instruction_binding_moment: "upon_receipt", если обязательно с момента получения; "upon_confirmation", если после подтверждения экспедитора; "upon_deadline", если экспедитор не отклонил в срок; "not_defined", если момент не определён.
        - Для forwarder_rejection_right: "yes", если экспедитор вправе отклонить поручение; "no", если прямо указано, что такого права нет; "not_defined", если отсутствует.
        - Для instruction_summary: если процедура и детали указаны, верни краткий факт; если процедура есть без деталей, верни "Поручение обязательно; детали процедуры не указаны"; если прямо исключено, верни "Не требуется"; если отсутствует, верни "Не установлено".
        - Не путай процедуру подачи поручения с формой документа.
        - Не выводи обязательность поручения из закона.
        - Если данных нет, верни пустой массив [] для evidence.
        </task>

        <context_rules>
        - Перед остальными полями заполни forwarder_instruction_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined", instruction_summary = "Не установлено".
        - Используй только предоставленный контекст.
        - Не выводи обязательность поручения из закона.
        - Не путай процедуру подачи поручения с формой документа.
        - Не путай поручение экспедитору с заявкой на перевозку, если они не отождествлены в договоре.
        - Если фрагменты конфликтуют и не позволяют сделать надёжный вывод, верни "Не удалось определить" для instruction_summary и включи конфликтующие цитаты в evidence.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет упоминания процедуры поручения экспедитору.
           → presence = "missing";
             instruction_mandatory = "not_defined";
             instruction_summary = "Не установлено".

        2. Неполное раскрытие темы.
           Поручение упомянуто как обязательное, но порядок подачи, момент обязательности и право отклонения не указаны.
           → presence = "present";
             instruction_mandatory = "yes";
             соответствующие детали = "Не установлено" или "not_defined";
             instruction_summary = "Поручение обязательно; детали процедуры не указаны".

        3. Противоречие между фрагментами.
           В разных частях договора указаны противоречащие условия процедуры поручения.
           → presence = "unclear";
             instruction_summary = "Не удалось определить".

        4. Прямое исключение.
           В договоре прямо указано, что поручение не требуется или договор является разовым без поручений.
           → presence = "present";
             instruction_mandatory = "no";
             instruction_summary = "Не требуется".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для forwarder_instruction_presence используй только: "present", "missing", "unclear".
        - Для статусных enum-полей используй только: "yes", "no", "not_defined", "upon_receipt", "upon_confirmation", "upon_deadline".
        - Fallback при отсутствии данных:
          * instruction_submission_procedure → "Не установлено";
          * instruction_summary → "Не установлено".
        - Fallback при противоречии или неоднозначности:
          * instruction_summary → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "forwarder_instruction_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования о процедуре поручения экспедитору. Внутреннее агрегатное signal-поле."
          required: true

        - name: "instruction_mandatory"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Обязательность поручения экспедитору для каждой перевозки. Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "instruction_submission_procedure"
          type: "string"
          presentation: "fact"
          label: "Порядок подачи поручения"
          description: >
            Порядок и сроки подачи поручения экспедитору. Fallback: "Не установлено" / "Не удалось определить".
          required: true
          display_in_grid: false

        - name: "instruction_binding_moment"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["upon_receipt", "upon_confirmation", "upon_deadline", "not_defined"]
          description: "Момент, с которого поручение становится обязательным для экспедитора. Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "forwarder_rejection_right"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Право экспедитора отклонить поручение. Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "instruction_summary"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 1
          label: "Поручение экспедитору: процедура"
          description: >
            Краткое описание процедуры поручения: обязательность, порядок подачи, момент обязательности, право отклонения. Fallback: "Не установлено" / "Не удалось определить".
          required: true

        - name: "evidence"
          type: "array"
          presentation: "diagnostic"
          description: "Точные цитаты из договора, подтверждающие извлечённые значения."
          required: true
          display_in_grid: false

      store_payload: true

  - id: forwarders_receipt
    name: "Экспедиторская расписка: содержание, реквизиты, последствия невыдачи"
    description: >
      Фактографическая проверка содержания экспедиторской расписки: обязательные
      реквизиты (количество мест, вес, состояние тары, дата приёма), последствия
      невыдачи расписки для доказывания факта приёма груза, доказательственное
      значение расписки при споре об утрате. Факт выдачи и форма расписки
      фиксируются в forwarding_receipt_check.
    triggers:
      any: ["cargo_acceptance_procedure"]
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "экспедиторская расписка"
        - "расписка экспедитора"
        - "содержание расписки"
        - "реквизиты расписки"
        - "количество мест"
        - "вес груза"
        - "состояние тары"
        - "дата приёма груза"
        - "невыдача расписки"
        - "расписка подтверждает"
        - "подтверждение приёма груза"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)экспедиторск(ая|ой)\\s+расписк"
        - "(?i)расписк.*подтвержда"
        - "(?i)реквизит.*расписк"
        - "(?i)содержани.*расписк"
        - "(?i)невыдач.*расписк"
        - "(?i)количеств.*мест"
        - "(?i)вес.*груз"
        - "(?i)состояни.*тар"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор транспортной экспедиции (ст. 805 ГК РФ, ФЗ-87).

        Проверяется только один вопрос: содержание экспедиторской расписки —
        обязательные реквизиты, последствия невыдачи, доказательственное значение.

        Нормативный ориентир:
        - ст. 805 ГК РФ;
        - ч. 2 ст. 7 ФЗ-87 «О транспортно-экспедиционной деятельности»;
        - Приказ Минтранса России № 23 (форма экспедиторской расписки).

        Важно:
        - Твоя задача — не оценивать серьёзность риска.
        - Только установить, что прямо есть в тексте договора, а чего прямо нет.
        - Не выводи обязательность реквизитов из закона. Фиксируй только если прямо указаны.
        - Не путай содержание расписки с фактом её выдачи (это отдельный чек).
        - Не путай расписку с актом приёма-передачи или транспортной накладной.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Указаны ли обязательные реквизиты расписки (количество мест, вес, состояние тары, дата).
        2. Предусмотрены ли последствия невыдачи расписки.
        3. Указано ли доказательственное значение расписки при споре об утрате.
        4. Сформируй краткое пользовательское резюме.
        5. Собери точные цитаты в evidence.

        [ПРАВИЛА]
        1. Используй только предоставленный текст договора.
        2. Если данные отсутствуют:
           - для статусных полей используй "not_defined";
           - для видимых текстовых полей используй "Не установлено".
        3. Не используй null, None, пустые строки.
        4. Если текст есть, но надёжный вывод сделать нельзя:
           - для статусных полей используй "not_defined";
           - для видимых текстовых полей используй "Не удалось определить".
        5. Не выводи обязательность реквизитов из закона. Фиксируй только если прямо указаны.
        6. Не путай содержание расписки с фактом её выдачи.
        7. Верни РОВНО один JSON-объект со всеми 5 ключами без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.
        8. В evidence включай только точные цитаты из документа. Если данных нет, верни пустой массив [].
        9. Поле receipt_content_summary должно быть кратким.

        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1 — полные реквизиты и последствия:
        Фрагмент:
        "Экспедиторская расписка должна содержать: количество мест, вес груза, состояние тары, дату приёма. Невыдача расписки лишает Экспедитора права ссылаться на отсутствие груза при приёмке. Расписка является доказательством приёма груза."
        Ответ:
        {
          "receipt_content_requirements": "yes",
          "non_issuance_consequences": "yes",
          "evidentiary_value_specified": "yes",
          "receipt_content_summary": "Обязательные реквизиты: количество мест, вес, состояние тары, дата приёма; невыдача лишает права ссылаться на отсутствие груза; расписка — доказательство приёма",
          "evidence": [
            {
              "clause_ref": "п. 4.3",
              "quote": "Экспедиторская расписка должна содержать: количество мест, вес груза, состояние тары, дату приёма. Невыдача расписки лишает Экспедитора права ссылаться на отсутствие груза при приёмке. Расписка является доказательством приёма груза."
            }
          ]
        }

        Пример 2 — только упоминание без деталей:
        Фрагмент:
        "При приёме груза Экспедитор выдаёт экспедиторскую расписку."
        Ответ:
        {
          "receipt_content_requirements": "not_defined",
          "non_issuance_consequences": "not_defined",
          "evidentiary_value_specified": "not_defined",
          "receipt_content_summary": "Расписка упомянута; реквизиты, последствия невыдачи и доказательственное значение не указаны",
          "evidence": [
            {
              "clause_ref": "п. 4.1",
              "quote": "При приёме груза Экспедитор выдаёт экспедиторскую расписку."
            }
          ]
        }

        Пример 3 — условие отсутствует:
        Фрагмент:
        "Экспедитор организует перевозку груза."
        Ответ:
        {
          "receipt_content_requirements": "not_defined",
          "non_issuance_consequences": "not_defined",
          "evidentiary_value_specified": "not_defined",
          "receipt_content_summary": "Не установлено",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Есть ли прямое указание на обязательные реквизиты расписки?
        2. Не выведены ли реквизиты из закона по умолчанию?
        3. Указаны ли последствия невыдачи расписки?
        4. Указано ли доказательственное значение расписки?
        5. Не смешано ли содержание с фактом выдачи?
        6. Не смешана ли расписка с актом приёма-передачи?
        7. Все ли 5 ключей присутствуют в ответе?
        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь РОВНО одним JSON-объектом без какого-либо дополнительного текста до или после, со всеми 5 ключами:
        {
          "receipt_content_requirements": "<yes / no / not_defined>",
          "non_issuance_consequences": "<yes / no / not_defined>",
          "evidentiary_value_specified": "<yes / no / not_defined>",
          "receipt_content_summary": "<краткое резюме или 'Не установлено' / 'Не удалось определить'>",
          "evidence": [{"clause_ref": "<пункт или раздел>", "quote": "<точная цитата>"}]
        }
      context_k: 5
      temperature: 0.0
      max_tokens: 600

    retrieval:
      retrieval_profile: "acceptance_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "экспедиторская расписка содержание расписки реквизиты расписки количество мест вес груза состояние тары дата приёма груза невыдача расписки подтверждение приёма груза доказательство приёма"
      boost_keywords:
        - "экспедиторская расписка"
        - "реквизиты расписки"
        - "количество мест"
        - "вес груза"
        - "состояние тары"
        - "невыдача расписки"
        - "подтверждение приёма"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - procedures
        - obligations
      negative_keywords:
        - "означает"
        - "в целях настоящего"
        - "акт приёма-передачи"
        - "транспортная накладная"
      position_bias:
        preferred_range: [0.15, 0.60]
        boost: 0.15
        scope: segment
      context_k: 5
      max_chunks: 6
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "procedures"
        - "obligations"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 35
      max_snippet_length: 550

    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false
      llm_max_tokens: 800

      presence_signal:
        field: "forwarders_receipt_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из договора транспортной экспедиции
        сведения о содержании экспедиторской расписки: обязательные реквизиты
        (количество мест, вес, состояние тары, дата приёма), последствия
        невыдачи расписки и её доказательственное значение при споре об утрате.

        Не анализируй факт выдачи расписки, её форму (типовая или утверждённая),
        акт приёма-передачи, транспортную накладную и иные темы, если они не
        содержат сведений о содержании расписки.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. forwarders_receipt_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (receipt_content_requirements, non_issuance_consequences,
              evidentiary_value_specified) ≠ "not_defined";
           - "missing" — если все три содержательных поля = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - receipt_content_requirements = "not_defined";
           - non_issuance_consequences = "not_defined";
           - evidentiary_value_specified = "not_defined";
           - receipt_content_summary = "Не установлено";
           - не выполняй остальные шаги.

        1. receipt_content_requirements — указаны ли обязательные реквизиты расписки:
           "yes", "no" или "not_defined".
        2. non_issuance_consequences — последствия невыдачи расписки:
           "yes", "no" или "not_defined".
        3. evidentiary_value_specified — доказательственное значение расписки:
           "yes", "no" или "not_defined".
        4. receipt_content_summary — краткое пользовательское резюме.
        5. evidence — массив точных цитат из договора.

        Правила заполнения:
        - Для receipt_content_requirements: "yes", если прямо указаны обязательные реквизиты (количество мест, вес, состояние тары, дата приёма); "no", если прямо указано, что реквизиты не устанавливаются; "not_defined", если отсутствует.
        - Для non_issuance_consequences: "yes", если прямо предусмотрены последствия невыдачи расписки; "no", если прямо указано, что последствия не предусмотрены; "not_defined", если отсутствует.
        - Для evidentiary_value_specified: "yes", если прямо указано доказательственное значение расписки при споре; "no", если прямо указано, что расписка не является доказательством; "not_defined", если отсутствует.
        - Для receipt_content_summary: если реквизиты и последствия указаны, верни краткий факт; если только упоминание, верни "Расписка упомянута; реквизиты и последствия не указаны"; если прямо исключены, верни "Не предусмотрены"; если отсутствуют, верни "Не установлено".
        - Не выводи обязательность реквизитов из закона. Фиксируй только если прямо указаны.
        - Не путай содержание расписки с фактом её выдачи.
        - Если данных нет, верни пустой массив [] для evidence.
        </task>

        <context_rules>
        - Перед остальными полями заполни forwarders_receipt_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined", receipt_content_summary = "Не установлено".
        - Используй только предоставленный контекст.
        - Не выводи обязательность реквизитов из закона.
        - Не путай содержание расписки с фактом её выдачи.
        - Не путай расписку с актом приёма-передачи или транспортной накладной.
        - Если фрагменты конфликтуют и не позволяют сделать надёжный вывод, верни "Не удалось определить" для receipt_content_summary и включи конфликтующие цитаты в evidence.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет упоминания содержания экспедиторской расписки.
           → presence = "missing";
             все *_status = "not_defined";
             receipt_content_summary = "Не установлено".

        2. Неполное раскрытие темы.
           Расписка упомянута, но реквизиты, последствия невыдачи и доказательственное значение не указаны.
           → presence = "present";
             соответствующие поля = "not_defined";
             receipt_content_summary = "Расписка упомянута; реквизиты и последствия не указаны".

        3. Противоречие между фрагментами.
           В разных частях договора указаны противоречащие реквизиты или последствия.
           → presence = "unclear";
             receipt_content_summary = "Не удалось определить".

        4. Прямое исключение.
           В договоре прямо указано, что расписка не выдаётся или не имеет доказательственного значения.
           → presence = "present";
             соответствующие *_status = "no";
             receipt_content_summary = "Не предусмотрены".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для forwarders_receipt_presence используй только: "present", "missing", "unclear".
        - Для статусных enum-полей используй только: "yes", "no", "not_defined".
        - Fallback при отсутствии данных:
          * receipt_content_summary → "Не установлено".
        - Fallback при противоречии или неоднозначности:
          * receipt_content_summary → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "forwarders_receipt_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования о содержании экспедиторской расписки. Внутреннее агрегатное signal-поле."
          required: true

        - name: "receipt_content_requirements"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Указаны ли обязательные реквизиты экспедиторской расписки. Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "non_issuance_consequences"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Последствия невыдачи экспедиторской расписки. Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "evidentiary_value_specified"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Доказательственное значение расписки при споре об утрате груза. Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "receipt_content_summary"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 1
          label: "Экспедиторская расписка: содержание"
          description: >
            Краткое описание содержания расписки: реквизиты, последствия невыдачи, доказательственное значение. Fallback: "Не установлено" / "Не удалось определить".
          required: true

        - name: "evidence"
          type: "array"
          presentation: "diagnostic"
          description: "Точные цитаты из договора, подтверждающие извлечённые значения."
          required: true
          display_in_grid: false

      store_payload: true

  - id: risk_transfer_moment
    name: "Момент перехода рисков утраты/повреждения груза"
    description: >
      Фактографическая проверка момента перехода рисков утраты и повреждения
      груза: от клиента к экспедитору (при приёме или передаче первому перевозчику),
      от экспедитора обратно (при выдаче грузополучателю или сдаче на склад),
      распределение рисков при хранении у экспедитора и при передаче третьим лицам.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "переход рисков"
        - "момент перехода риска"
        - "риск утраты"
        - "риск повреждения"
        - "риск случайной гибели"
        - "переходит к экспедитору"
        - "переходит к клиенту"
        - "риск при хранении"
        - "риск при передаче перевозчику"
        - "ответственность за сохранность"
        - "с момента приёма груза"
        - "до момента выдачи груза"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)переход.*риск"
        - "(?i)риск.*(утрат|поврежден|гибел)"
        - "(?i)риск.*переход"
        - "(?i)с\\s+момент.*при[её]м.*груз"
        - "(?i)до\\s+момент.*выдач.*груз"
        - "(?i)ответственн.*сохранност"
        - "(?i)риск.*хранени"
        - "(?i)риск.*передач.*перевозчик"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор транспортной экспедиции.

        Проверяется только один вопрос: момент перехода рисков утраты и
        повреждения груза между клиентом и экспедитором.

        Нормативный ориентир:
        - ст. 459, 497 ГК РФ (по аналогии);
        - ст. 7 ФЗ-87 «О транспортно-экспедиционной деятельности».

        Важно:
        - Твоя задача — не оценивать серьёзность риска.
        - Только установить, что прямо есть в тексте договора, а чего прямо нет.
        - Не выводи момент перехода рисков из закона. Фиксируй только если прямо указан.
        - Не путай момент перехода рисков с ответственностью за утрату (это разные вопросы).
        - Не путай риски утраты груза с рисками повреждения тары или упаковки.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Момент перехода риска от клиента к экспедитору.
        2. Момент перехода риска от экспедитора обратно к клиенту или грузополучателю.
        3. Распределение рисков при хранении груза у экспедитора.
        4. Распределение рисков при передаче груза третьим лицам (перевозчикам, субэкспедиторам).
        5. Сформируй краткое пользовательское резюме.
        6. Собери точные цитаты в evidence.

        [ПРАВИЛА]
        1. Используй только предоставленный текст договора.
        2. Если данные отсутствуют:
           - для статусных полей используй "not_defined";
           - для видимых текстовых полей используй "Не установлено".
        3. Не используй null, None, пустые строки.
        4. Если текст есть, но надёжный вывод сделать нельзя:
           - для статусных полей используй "not_defined";
           - для видимых текстовых полей используй "Не удалось определить".
        5. Для risk_transfer_to_forwarder:
           - "upon_acceptance" — риск переходит при приёме груза экспедитором;
           - "upon_first_carrier" — риск переходит при передаче первому перевозчику;
           - "upon_document_signing" — риск переходит при подписании документа;
           - "not_defined" — момент не определён.
        6. Для risk_transfer_from_forwarder:
           - "upon_delivery" — риск переходит при выдаче грузополучателю;
           - "upon_warehouse" — риск переходит при сдаче на склад;
           - "upon_document_signing" — риск переходит при подписании документа;
           - "not_defined" — момент не определён.
        7. Не выводи момент перехода рисков из закона. Фиксируй только если прямо указан.
        8. Верни РОВНО один JSON-объект со всеми 6 ключами без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.
        9. В evidence включай только точные цитаты из документа. Если данных нет, верни пустой массив [].
        10. Поле risk_transfer_summary должно быть кратким.

        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1 — полный набор моментов:
        Фрагмент:
        "Риск утраты и повреждения груза переходит к Экспедитору с момента приёма груза. Риск переходит обратно к Клиенту с момента выдачи груза грузополучателю. При хранении груза у Экспедитора риск несёт Экспедитор. При передаче груза перевозчику риск несёт Экспедитор до момента выдачи грузополучателю."
        Ответ:
        {
          "risk_transfer_to_forwarder": "upon_acceptance",
          "risk_transfer_from_forwarder": "upon_delivery",
          "storage_risk_allocation": "forwarder",
          "third_party_risk_allocation": "forwarder",
          "risk_transfer_summary": "Риск переходит к экспедитору при приёме; обратно — при выдаче грузополучателю; при хранении и передаче перевозчику риск на экспедиторе",
          "evidence": [
            {
              "clause_ref": "п. 6.4",
              "quote": "Риск утраты и повреждения груза переходит к Экспедитору с момента приёма груза. Риск переходит обратно к Клиенту с момента выдачи груза грузополучателю. При хранении груза у Экспедитора риск несёт Экспедитор. При передаче груза перевозчику риск несёт Экспедитор до момента выдачи грузополучателю."
            }
          ]
        }

        Пример 2 — только общий принцип:
        Фрагмент:
        "Экспедитор несёт ответственность за сохранность груза с момента приёма до момента выдачи."
        Ответ:
        {
          "risk_transfer_to_forwarder": "upon_acceptance",
          "risk_transfer_from_forwarder": "upon_delivery",
          "storage_risk_allocation": "not_defined",
          "third_party_risk_allocation": "not_defined",
          "risk_transfer_summary": "Риск на экспедиторе с момента приёма до момента выдачи; детали хранения и передачи третьим лицам не указаны",
          "evidence": [
            {
              "clause_ref": "п. 6.1",
              "quote": "Экспедитор несёт ответственность за сохранность груза с момента приёма до момента выдачи."
            }
          ]
        }

        Пример 3 — условие отсутствует:
        Фрагмент:
        "Экспедитор организует перевозку груза."
        Ответ:
        {
          "risk_transfer_to_forwarder": "not_defined",
          "risk_transfer_from_forwarder": "not_defined",
          "storage_risk_allocation": "not_defined",
          "third_party_risk_allocation": "not_defined",
          "risk_transfer_summary": "Не установлено",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Есть ли прямое указание на момент перехода риска к экспедитору?
        2. Есть ли прямое указание на момент перехода риска от экспедитора?
        3. Не выведен ли момент из закона по умолчанию?
        4. Не смешан ли момент перехода рисков с ответственностью за утрату?
        5. Указано ли распределение рисков при хранении?
        6. Указано ли распределение рисков при передаче третьим лицам?
        7. Все ли 6 ключей присутствуют в ответе?
        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь РОВНО одним JSON-объектом без какого-либо дополнительного текста до или после, со всеми 6 ключами:
        {
          "risk_transfer_to_forwarder": "<upon_acceptance / upon_first_carrier / upon_document_signing / not_defined>",
          "risk_transfer_from_forwarder": "<upon_delivery / upon_warehouse / upon_document_signing / not_defined>",
          "storage_risk_allocation": "<forwarder / client / shared / not_defined>",
          "third_party_risk_allocation": "<forwarder / client / shared / not_defined>",
          "risk_transfer_summary": "<краткое резюме или 'Не установлено' / 'Не удалось определить'>",
          "evidence": [{"clause_ref": "<пункт или раздел>", "quote": "<точная цитата>"}]
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 700

    retrieval:
      retrieval_profile: "liability_cap_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "переход рисков утраты повреждения груза момент перехода риска риск утраты риск повреждения риск при хранении риск при передаче перевозчику ответственность за сохранность с момента приёма до момента выдачи"
      boost_keywords:
        - "переход рисков"
        - "риск утраты"
        - "риск повреждения"
        - "с момента приёма груза"
        - "до момента выдачи груза"
        - "ответственность за сохранность"
        - "риск при хранении"
      preferred_unit_types:
