shared_patterns:

  money_amount: "(?i)\\b\\d[\\d\\s]*(?:руб|рублей|₽|тыс|млн|млрд|USD|EUR|долл)"
  date_pattern: "(?i)\\b\\d{1,2}[.]\\d{1,2}[.]\\d{4}\\b"
  percentage: "(?i)\\b\\d{1,3}[,.]?\\d{0,2}\\s*%"
  weight_pattern: "(?i)\\b\\d[\\d\\s,.]*(?:кг|тонн|т\\b|kg|ton)"
  time_days: "(?i)\\b\\d+\\s*(?:дней|дня|день|days)"

# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 4: COMPLIANCE RULES
#  Читается: DocTypeCheckLoader._exclusion_logic_to_checks()
# ════════════════════════════════════════════════════════════════════════════

compliance_rules:

  - id: "forwarder_license_absent"
    name: "Отсутствие статуса экспедитора (ст. 2 ФЗ-87)"
    description: |
      Экспедиционную деятельность вправе осуществлять юридические лица и ИП,
      включённые в реестр экспедиторов (ст. 2 ФЗ-87). Отсутствие подтверждения
      статуса может указывать на незаконность деятельности или ограничения
      в ответственности.
    legal_base: "ст. 2 ФЗ-87 «О транспортно-экспедиционной деятельности»"
    required_triggers: ["legal_entity_party"]
    severity: "critical"
    result_if_triggered: "warning"
    detector_type: "rules"
    rules:
      keywords:
        - "статус экспедитора"
        - "реестр экспедиторов"
        - "свидетельство экспедитора"
        - "транспортно-экспедиционная деятельность"
      keyword_mode: "any"
    retrieval:
      context_k: 5
      boost_keywords:
        - "статус экспедитора"
        - "реестр"
        - "ФЗ-87"
      rerank: true

  - id: "forwarder_no_liability_for_third_parties"
    name: "Экспедитор не отвечает за третьих лиц — нарушение ст. 803 ГК РФ"
    description: |
      Экспедитор отвечает за действия привлечённых третьих лиц (перевозчиков,
      таможенных брокеров) как за свои собственные (ст. 803 ГК РФ, ст. 7 ФЗ-87).
      Попытка ограничить ответственность формулировками «не отвечает за перевозчика»
      противоречит закону и ущемляет права клиента.
    legal_base: "ст. 803 ГК РФ, ст. 7 ФЗ-87"
    required_triggers: []
    severity: "critical"
    result_if_triggered: "fail"
    detector_type: "rules"
    rules:
      keywords:
        - "не несёт ответственности за перевозчика"
        - "только посредник"
        - "ограничение ответственности за третьих лиц"
        - "не отвечает за действия привлечённых"
      keyword_mode: "any"
      negative_keywords:
        - "отвечает за действия третьих лиц"
        - "как за свои собственные"
        - "полная ответственность"
    retrieval:
      context_k: 5
      boost_keywords:
        - "ответственность за третьих лиц"
        - "перевозчик"
        - "ст. 803"
      rerank: true

  - id: "customs_clearance_without_broker_status"
    name: "Таможенное оформление без статуса брокера (ТК ЕАЭС)"
    description: |
      Таможенное оформление вправе осуществлять только таможенные брокеры,
      включённые в реестр таможенных органов (ст. 12 ТК ЕАЭС). Оказание услуг
      без статуса влечёт административную ответственность и недействительность
      таможенного оформления.
    legal_base: "ст. 12 Таможенного кодекса ЕАЭС"
    required_triggers: ["customs_clearance_service"]
    severity: "critical"
    result_if_triggered: "fail"
    detector_type: "rules"
    rules:
      keywords:
        - "таможенное оформление"
        - "таможенный брокер"
        - "таможенное декларирование"
        - "таможенный представитель"
      keyword_mode: "any"
    retrieval:
      context_k: 5
      boost_keywords:
        - "таможенный брокер"
        - "таможенное оформление"
        - "реестр брокеров"
      rerank: true

  - id: "liability_cap_below_statutory"
    name: "Лимит ответственности ниже установленного ФЗ-87 (ст. 7)"
    description: |
      По ст. 7 ФЗ-87 ответственность экспедитора за утрату/повреждение 
      груза ограничена: при объявленной ценности — в размере объявленной ценности,
      при отсутствии — в размере действительной стоимости. Попытка установить 
      лимит ниже — ущемление прав клиента.
    legal_base: "ст. 7 ФЗ-87"
    required_triggers: []
    severity: "critical"
    result_if_triggered: "fail"
    detector_type: "rules"
    rules:
      keywords:
        - "ограничение ответственности"
        - "лимит ответственности"
        - "не более"
        - "2 МРОТ за кг"
        - "в пределах стоимости услуг"
      keyword_mode: "any"
      negative_keywords:
        - "в размере объявленной ценности"
        - "действительная стоимость"
        - "полная стоимость груза"
    retrieval:
      context_k: 5
      boost_keywords:
        - "лимит ответственности"
        - "объявленная ценность"
        - "ст. 7 ФЗ-87"
      rerank: true

  - id: "dangerous_cargo_client_duties_absent"
    name: "Опасный груз: отсутствие обязанностей клиента по раскрытию"
    description: |
      При экспедировании опасных грузов клиент обязан предоставить полную 
      информацию о классе опасности, свойствах, упаковке, маркировке.
      Отсутствие этих обязанностей создаёт риски для экспедитора и третьих лиц.
    legal_base: "ФЗ-87, ДОПОГ/ADR, ФЗ № 116-ФЗ"
    required_triggers: ["dangerous_cargo_handling"]
    severity: "critical"
    result_if_triggered: "warning"
    detector_type: "rules"
    rules:
      keywords:
        - "опасный груз"
        - "класс опасности"
        - "ДОПОГ"
        - "ADR"
      keyword_mode: "any"
      negative_keywords:
        - "клиент обязан предоставить информацию об опасных свойствах"
        - "клиент гарантирует маркировку"
        - "сведения о классе опасности"
    retrieval:
      context_k: 5
      boost_keywords:
        - "опасный груз"
        - "информация о свойствах"
        - "маркировка"
      rerank: true

  - id: "no_delivery_deadline_specified"
    name: "Отсутствие срока доставки — риск просрочки"
    description: |
      Если договор не содержит конкретного срока доставки или порядка его 
      определения, клиент лишается возможности предъявить претензию 
      за просрочку и взыскать неустойку по ст. 9 ФЗ-87.
    legal_base: "ст. 9 ФЗ-87"
    required_triggers: []
    severity: "high"
    result_if_triggered: "warning"
    detector_type: "rules"
    rules:
      keywords:
        - "срок доставки"
        - "транзитное время"
        - "дата доставки"
        - "ожидаемая дата"
      keyword_mode: "any"
      negative_keywords:
        - "срок доставки составляет"
        - "в течение"
        - "не позднее"
        - "транзитное время"
    retrieval:
      context_k: 5
      boost_keywords:
        - "срок доставки"
        - "просрочка"
        - "ст. 9 ФЗ-87"
      rerank: true

# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 5: CHECKS_V8 — LLM/hybrid проверки
#  Читается: DocTypeCheckLoader._load_doc_type_checks()
# ════════════════════════════════════════════════════════════════════════════

checks_v8:

  - id: forwarding_subject_extraction
    name: "Экспедиция: извлечение предмета — список услуг, маршрут"
    description: "Извлекает перечень экспедиторских услуг, характеристики груза, маршрут"
    triggers: {}
    severity: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "экспедиторские услуги"
        - "организация перевозки"
        - "выбор перевозчика"
        - "таможенное оформление"
        - "страхование груза"
        - "оформление документов"
        - "складирование"
        - "упаковка"
        - "отслеживание груза"
        - "поручение экспедитору"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)(экспедитор.*обязуется.*организовать)"
        - "(?i)(транспортно.*экспедиционн.*услуг)"
        - "(?i)(перечень.*услуг)"
    llm:
      prompt_template: |
        Ты — юридический ассистент, анализирующий договор транспортной экспедиции.
        Найди в тексте сведения о предмете договора.

        Ответь строго в JSON:
        {
          "services_list": ["<перечень экспедиторских услуг>"],
          "cargo_description": "<описание груза или not_found>",
          "route_specified": "<yes / no / not_found>",
          "contract_type": "<single / framework / not_found>",
          "forwarding_receipt_mentioned": "<yes / no / not_found>",
          "order_form_referenced": "<yes / no / not_found>"
        }

        Экспедиторские услуги могут включать:
        - организацию перевозки
        - выбор перевозчика
        - оформление документов
        - таможенное оформление
        - страхование груза
        - складирование
        - упаковку
        - отслеживание

        ВАЖНО: Возвращай only_found_in_text. Если значение явно не указано — пиши "not_found".
      prompt_file: null
      context_k: 6
      temperature: 0.0
      max_tokens: 512
    retrieval:
      retrieval_profile: "scope_of_work_check"
      context_k: 6
      max_chunks: 10
      boost_keywords:
        - "предмет договора"
        - "экспедиторские услуги"
        - "перечень услуг"
        - "поручение"
        - "организация перевозки"
      rerank: true
      filters: {}
    evidence:
      required: true
      min_snippet_length: 50
      max_snippet_length: 800
    extraction:
      enabled: true
      mode: "hybrid"
      fields:
        - name: "services_list"
          type: "list"
          description: "Перечень экспедиторских услуг"
        - name: "contract_type"
          type: "string"
          allowed_values: ["single", "framework", "not_found"]
          description: "Тип договора (разовый/рамочный)"
        - name: "forwarding_receipt_mentioned"
          type: "string"
          allowed_values: ["yes", "no", "not_found"]
          description: "Упоминание экспедиторской расписки"
      store_payload: true

  - id: forwarding_receipt_check
    name: "Экспедиторская расписка (ст. 2 ФЗ-87, Приказ № 23)"
    description: |
      Проверяет наличие условия о выдаче экспедиторской расписки при приёме груза.
      Расписка подтверждает принятие груза и является основанием для ответственности
      экспедитора.
    triggers: {}
    severity: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "экспедиторская расписка"
        - "расписка экспедитора"
        - "приём груза"
        - "выдача расписки"
        - "форма расписки"
        - "Приказ Минтранса № 23"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)экспедиторск(ая|ой)\\s+расписк"
        - "(?i)расписк(а|и)\\s+экспедитор"
    llm:
      prompt_template: |
        Ты — юридический ассистент, анализирующий договор транспортной экспедиции.
        Проверь наличие условия о выдаче экспедиторской расписки (ст. 2 ФЗ-87).

        Ответь строго в JSON:
        {
          "receipt_mentioned": "<yes / no>",
          "receipt_form_specified": "<yes / no / not_found>",
          "when_issued": "<upon_acceptance / other / not_specified / not_found>",
          "receipt_snippet": "<цитата или not_found>"
        }

        ВАЖНО: Если значение явно не указано — пиши "not_found".
      prompt_file: null
      context_k: 4
      temperature: 0.0
      max_tokens: 300
    retrieval:
      retrieval_profile: "acceptance_check"
      context_k: 4
      max_chunks: 6
      boost_keywords:
        - "экспедиторская расписка"
        - "приём груза"
        - "Приказ № 23"
      rerank: true
      filters: {}
    evidence:
      required: true
      min_snippet_length: 30
      max_snippet_length: 500
    extraction:
      enabled: true
      mode: "hybrid"
      fields:
        - name: "receipt_mentioned"
          type: "string"
          allowed_values: ["yes", "no"]
          description: "Упоминание экспедиторской расписки"
        - name: "receipt_form_specified"
          type: "string"
          allowed_values: ["yes", "no", "not_found"]
          description: "Указана ли форма расписки"
      store_payload: true

  - id: forwarder_instructions_check
    name: "Поручение экспедитору: форма и порядок (Приказ № 23)"
    description: |
      Проверяет наличие ссылки на Поручение экспедитору как неотъемлемую часть
      договора. Поручение конкретизирует условия по каждой перевозке.
    triggers: {}
    severity: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "поручение экспедитору"
        - "форма поручения"
        - "приложение к договору"
        - "заявка на экспедирование"
        - "указания клиента"
        - "Приказ № 23"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)поручени(е|я)\\s+экспедитор"
        - "(?i)форм(а|ы)\\s+поручени"
    llm:
      prompt_template: |
        Ты — юридический ассистент, анализирующий договор транспортной экспедиции.
        Проверь наличие условия о Поручении экспедитору.

        Ответь строго в JSON:
        {
          "order_mentioned": "<yes / no>",
          "order_form_specified": "<yes / no / not_found>",
          "order_as_integral_part": "<yes / no / not_found>",
          "order_content_requirements": "<yes / no / not_found>",
          "order_snippet": "<цитата или not_found>"
        }

        ВАЖНО: Если значение явно не указано — пиши "not_found".
      prompt_file: null
      context_k: 4
      temperature: 0.0
      max_tokens: 300
    retrieval:
      retrieval_profile: "scope_of_work_check"
      context_k: 4
      max_chunks: 6
      boost_keywords:
        - "поручение экспедитору"
        - "форма поручения"
        - "заявка"
      rerank: true
      filters: {}
    evidence:
      required: true
      min_snippet_length: 30
      max_snippet_length: 500
    extraction:
      enabled: true
      mode: "hybrid"
      fields:
