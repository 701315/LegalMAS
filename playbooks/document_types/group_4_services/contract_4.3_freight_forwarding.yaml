    extraction:
      store_payload: true

      enabled: true
      mode: "hybrid"
      compact_output: false
      llm_max_tokens: 900
      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из договора транспортной экспедиции
        сведения о таможенном оформлении: включено ли оно в услуги, статус
        таможенного представителя, распределение ответственности за таможенные
        штрафы и за недостоверные данные клиента.

        Не анализируй страхование груза, удержание, претензии и иные темы,
        если они не содержат сведений о таможенном оформлении.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        1. customs_service_included — включено ли таможенное оформление в услуги:
           "yes", "no" или "not_defined".
        2. customs_broker_status — подтверждён ли статус таможенного представителя:
           "confirmed", "not_confirmed" или "not_defined".
        3. customs_liability_client — несёт ли клиент ответственность за таможенные штрафы:
           "yes", "no" или "not_defined".
        4. customs_liability_forwarder — несёт ли экспедитор ответственность за таможенные штрафы:
           "yes", "no" или "not_defined".
        5. false_data_liability — кто несёт ответственность за недостоверные данные:
           "client", "forwarder", "not_specified" или "not_defined".
        6. customs_liability_summary — краткое пользовательское резюме.
        7. evidence — массив точных цитат из договора.

        Правила заполнения:

        Для customs_service_included:
        - "yes", если таможенное оформление прямо указано в услугах экспедитора;
        - "no", если прямо указано, что таможенное оформление не входит в услуги;
        - "not_defined", если условие отсутствует или вывод невозможен.

        Для customs_broker_status:
        - "confirmed", если прямо указано включение в реестр таможенных представителей или наличие свидетельства;
        - "not_confirmed", если таможенное оформление упомянуто, но статус представителя не подтверждён;
        - "not_defined", если условие отсутствует.

        Для customs_liability_client:
        - "yes", если клиент прямо несёт ответственность за таможенные штрафы;
        - "no", если прямо указано, что клиент не несёт такой ответственности;
        - "not_defined", если условие отсутствует.

        Для customs_liability_forwarder:
        - "yes", если экспедитор прямо несёт ответственность за таможенные штрафы;
        - "no", если прямо указано, что экспедитор не несёт такой ответственности;
        - "not_defined", если условие отсутствует.

        Для false_data_liability:
        - "client", если ответственность за недостоверные данные несёт клиент;
        - "forwarder", если ответственность за недостоверные данные несёт экспедитор;
        - "not_specified", если тема недостоверных данных упомянута, но ответственный не указан;
        - "not_defined", если условие отсутствует.

        Для customs_liability_summary:
        - если оформление включено, статус подтверждён и ответственность распределена, верни краткий факт;
        - если оформление включено, но статус не подтверждён, верни, например, "Таможенное оформление включено в услуги; статус таможенного представителя не подтверждён";
        - если оформление прямо исключено, верни "Не предусмотрено";
        - если условие отсутствует, верни "Не установлено";
        - если текст есть, но надёжный вывод сделать нельзя, верни "Не удалось определить".

        Не присваивай статус "confirmed" только по упоминанию «таможенный брокер» без подтверждения включения в реестр.
        Не путай ответственность за таможенные штрафы с общей ответственностью экспедитора за действия третьих лиц.

        Если данных нет, верни пустой массив [] для evidence.
        </task>

        <context_rules>
        - Используй только предоставленный контекст.
        - Не выдумывай статус таможенного представителя, распределение ответственности и ответственного за недостоверные данные.
        - Не считай таможенное оформление включённым в услуги по умолчанию.
        - Не присваивай статус "confirmed" без прямого подтверждения реестра или свидетельства.
        - Не путай ответственность за таможенные штрафы с общей ответственностью экспедитора за действия третьих лиц.
        - Если фрагменты конфликтуют и не позволяют сделать надёжный вывод, верни "Не удалось определить" для customs_liability_summary и включи конфликтующие цитаты в evidence.
        </context_rules>

        <output_expectations>
        Все перечисленные ключи должны присутствовать в ответе, даже если значение равно "not_defined", "not_specified", "not_confirmed", "Не установлено", "Не предусмотрено", "Не удалось определить" или "Определяется по ...".

        Запрещено возвращать:
        - null;
        - None;
        - пустые строки;
        - пояснения до или после JSON;
        - Markdown;
        - код-фенсы;
        - списки вне JSON.

        Верни РОВНО один JSON-объект со всеми 7 ключами без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.
        </output_expectations>

      fields:
        - name: "customs_service_included"
          type: "string"
          presentation: "signal"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Включено ли таможенное оформление в услуги экспедитора."
          required: true
          display_in_grid: false

        - name: "customs_broker_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["confirmed", "not_confirmed", "not_defined"]
          description: "Подтверждение статуса таможенного представителя."
          required: true
          display_in_grid: false

        - name: "customs_liability_client"
          type: "string"
          presentation: "signal"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Ответственность клиента за таможенные штрафы."
          required: true
          display_in_grid: false

        - name: "customs_liability_forwarder"
          type: "string"
          presentation: "signal"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Ответственность экспедитора за таможенные штрафы."
          required: true
          display_in_grid: false

        - name: "false_data_liability"
          type: "string"
          presentation: "signal"
          allowed_values: ["client", "forwarder", "not_specified", "not_defined"]
          description: "Ответственность за недостоверные данные для таможенного оформления."
          required: true
          display_in_grid: false

        - name: "customs_liability_summary"
          type: "string"
          presentation: "fact"
          label: "Таможенное оформление"
          description: "Краткое описание условий таможенного оформления: статус представителя, распределение ответственности за штрафы и недостоверные данные."
          required: true
          display_in_grid: true
          display_priority: 1

        - name: "evidence"
          type: "array"
          presentation: "diagnostic"
          description: "Точные цитаты из договора, подтверждающие извлечённые значения."
          required: true
          display_in_grid: false

  - id: lien_right_on_cargo
    name: "Право удержания груза и порядок реализации (ст. 3 ФЗ-87)"
    description: >
      Фактографическая проверка наличия условия о праве экспедитора удерживать
      груз до оплаты вознаграждения и расходов, порядка реализации удержанного
      груза и распределения расходов на хранение.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "право удержания"
        - "удержание груза"
        - "удерживать груз"
        - "до уплаты вознаграждения"
        - "до возмещения расходов"
        - "реализация удержанного"
        - "реализация удержанного груза"
        - "хранение за счёт клиента"
        - "хранение за счет клиента"
        - "расходы на хранение удержанного"
        - "приостановить выдачу груза"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)удержива(ть|ет).*груз.*до.*оплат"
        - "(?i)право\\s+удержани(я|е).*груз"
        - "(?i)реализац(ия|ии)\\s+удержанн"
        - "(?i)расход.*хранени.*удержанн"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор транспортной экспедиции (ст. 3 ФЗ-87; ст. 359 ГК РФ).

        Проверяется только один вопрос: право удержания груза экспедитором.

        Нормативный ориентир:
        - ст. 3 ФЗ-87 «О транспортно-экспедиционной деятельности»;
        - ст. 359 ГК РФ.

        Важно:
        - Твоя задача — не оценивать серьёзность риска.
        - Только установить, что прямо есть в тексте договора, а чего прямо нет.
        - Не считай право удержания существующим по умолчанию. Фиксируй его
          только если прямо указано в договоре.
        - Не выводи право удержания из ст. 3 ФЗ-87 или ст. 359 ГК РФ — только из текста.
        - Не путай право удержания груза с обеспечительным платежом, залогом
          или иными способами обеспечения обязательств.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Предусмотрено ли право экспедитора удерживать груз.
        2. Условия реализации права удержания (до уплаты вознаграждения, возмещения расходов и т.п.).
        3. Порядок реализации удержанного груза.
        4. Распределение расходов на хранение удержанного груза.
        5. Сформируй краткое пользовательское резюме для поля lien_summary.
        6. Собери точные цитаты в evidence.

        [ПРАВИЛА]
        1. Используй только предоставленный текст договора.
        2. Если данные отсутствуют:
           - для статусных и перечислимых полей используй "not_defined";
           - для видимого текстового поля используй "Не установлено".
        3. Не используй null, None, пустые строки.
        4. Если текст есть, но надёжный вывод сделать нельзя:
           - для статусных и перечислимых полей используй "not_defined";
           - для видимого текстового поля используй "Не удалось определить".
        5. Если договор прямо указывает, что право удержания груза не предусмотрено, используй:
           - lien_right_present = "no";
           - lien_summary = "Не предусмотрено".
        6. Не считай право удержания существующим по умолчанию. Фиксируй только если прямо указано.
        7. Не путай право удержания груза с обеспечительным платежом, залогом или иными способами обеспечения.
        8. Верни РОВНО один JSON-объект со всеми 6 ключами без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.
        9. В evidence включай только точные цитаты из документа. Если данных нет, верни пустой массив [].
        10. Поле lien_summary должно быть кратким и не должно содержать длинных цитат.

        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1 — право удержания с условиями, порядком реализации и расходами на хранение:
        Фрагмент:
        "Экспедитор вправе удерживать груз до уплаты вознаграждения и возмещения расходов. Расходы на хранение удержанного груза несёт Клиент. Реализация удержанного груза осуществляется в порядке, установленном ст. 359 ГК РФ."
        Ответ:
        {
          "lien_right_present": "yes",
          "lien_conditions": "до уплаты вознаграждения и возмещения расходов",
          "realization_procedure": "yes",
          "storage_cost_allocation": "client",
          "lien_summary": "Экспедитор вправе удерживать груз до уплаты вознаграждения и возмещения расходов; расходы на хранение несёт Клиент; реализация — по ст. 359 ГК РФ",
          "evidence": [
            {
              "clause_ref": "п. 7.1",
              "quote": "Экспедитор вправе удерживать груз до уплаты вознаграждения и возмещения расходов. Расходы на хранение удержанного груза несёт Клиент. Реализация удержанного груза осуществляется в порядке, установленном ст. 359 ГК РФ."
            }
          ]
        }

        Пример 2 — право удержания есть, но детали не указаны:
        Фрагмент:
        "Экспедитор вправе удерживать груз до полного расчёта с Клиентом."
        Ответ:
        {
          "lien_right_present": "yes",
          "lien_conditions": "до полного расчёта с Клиентом",
          "realization_procedure": "not_defined",
          "storage_cost_allocation": "not_specified",
          "lien_summary": "Право удержания предусмотрено до полного расчёта с Клиентом; порядок реализации и расходы на хранение не указаны",
          "evidence": [
            {
              "clause_ref": "п. 7.2",
              "quote": "Экспедитор вправе удерживать груз до полного расчёта с Клиентом."
            }
          ]
        }

        Пример 3 — текст есть, но надёжный вывод сделать нельзя:
        Фрагмент:
        "Экспедитор вправе приостановить выдачу груза до урегулирования расчётов с Клиентом."
        Ответ:
        {
          "lien_right_present": "not_defined",
          "lien_conditions": "Не удалось определить",
