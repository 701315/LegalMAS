  - id: forwarding_subject_extraction
    name: "Предмет экспедиции: перечень услуг, характеристики груза, маршрут"
    description: >
      Фактографическая проверка предмета договора транспортной экспедиции:
      перечень экспедиторских услуг, описание груза, маршрут, тип договора
      (разовый/рамочный), ссылка на Поручение экспедитору и упоминание
      экспедиторской расписки.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "предмет"
        - "экспедиторские услуги"
        - "организация перевозки"
        - "выбор перевозчика"
        - "таможенное оформление"
        - "страхование груза"
        - "оформление документов"
        - "складирование"
        - "упаковка"
        - "отслеживание груза"
        - "поручение экспедитору"
        - "перечень услуг"
        - "груз"
        - "наименование груза"
        - "вес"
        - "объём"
        - "объем"
        - "маршрут"
        - "пункт отправления"
        - "пункт назначения"
        - "заявка"
        - "приложение"
        - "экспедиторская расписка"
        - "разовый"
        - "рамочный"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)(экспедитор.*обязуется.*организовать)"
        - "(?i)(транспортно.*экспедиционн.*услуг)"
        - "(?i)(перечень.*услуг)"
        - "(?i)(маршрут|пункт назначения|пункт отправления)"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор транспортной экспедиции (Глава 41 ГК РФ, ст. 801;
        ФЗ-87 «О транспортно-экспедиционной деятельности»).

        Проверяется только один вопрос: предмет договора — перечень экспедиторских
        услуг, характеристики груза, маршрут, тип договора, упоминание экспедиторской
        расписки и ссылка на Поручение экспедитору / заявку / приложение.

        Нормативный ориентир:
        - ст. 801 ГК РФ;
        - ст. 2 ФЗ-87 «О транспортно-экспедиционной деятельности».

        Важно:
        - Твоя задача — не оценивать серьёзность риска.
        - Только установить, что прямо есть в тексте договора, а чего прямо нет.
        - Не выводи перечень услуг, груз, маршрут или тип договора из закона.
        - Если параметры конкретизируются в Поручениях экспедитору, заявках или
          приложениях, это допустимый исход, если такой механизм прямо указан.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Перечень экспедиторских услуг.
        2. Описание груза: наименование, вес, объём, иные характеристики, если указаны.
        3. Указан ли маршрут: пункт отправления и/или пункт назначения.
        4. Тип договора: разовый или рамочный.
        5. Упоминание экспедиторской расписки.
        6. Ссылку на форму Поручения экспедитору, заявку, приложение или иной документ,
           определяющий условия исполнения.

        [ПРАВИЛА]
        1. Используй только предоставленный текст договора.
        2. Если данных нет:
           - для статусных и перечислимых полей используй "not_defined";
           - для видимых текстовых полей используй "Не установлен" или "Не установлено".
        3. Не используй null, None, пустые строки.
        4. Если текст есть, но надёжный вывод сделать нельзя:
           - для статусных и перечислимых полей используй "not_defined";
           - для видимых текстовых полей используй "Не удалось определить".
        5. Верни РОВНО один JSON-объект со всеми 11 ключами без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.
        6. В evidence включай только точные цитаты из документа. Если данных нет, верни пустой массив [].
        7. Если услуги, груз или маршрут определяются через Поручение экспедитору, заявку, спецификацию или приложение, и это прямо указано в договоре, допустимо вернуть значение вида "Определяется по Поручению экспедитору", "Определяется по заявке" или "Согласно Приложению № 1".
        8. Не ставь "framework" только из-за упоминания Поручения экспедитору. Тип договора должен быть понятен из механизма исполнения.
        9. Видимые текстовые значения должны быть краткими: без длинных пересказов, перечислений на несколько абзацев и без цитирования всего пункта.

        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1 — разовая перевозка с конкретными услугами, грузом и маршрутом:
        Фрагмент:
        "Экспедитор обязуется организовать перевозку груза (оборудование, 5 тонн) по маршруту Москва — Санкт-Петербург, включая выбор перевозчика, оформление документов и отслеживание. При приёме груза Экспедитор выдаёт экспедиторскую расписку."
        Ответ:
        {
          "services_list_status": "defined",
          "services_list_details": "организация перевозки, выбор перевозчика, оформление документов, отслеживание",
          "cargo_description_status": "defined",
          "cargo_description_details": "оборудование, 5 тонн",
          "route_specified": "yes",
          "route_details": "Москва — Санкт-Петербург",
          "contract_type": "single",
          "contract_type_display": "Разовый",
          "forwarding_receipt_mentioned": "yes",
          "order_form_referenced": "not_defined",
          "evidence": [
            {
              "clause_ref": "п. 1.1",
              "quote": "Экспедитор обязуется организовать перевозку груза (оборудование, 5 тонн) по маршруту Москва — Санкт-Петербург, включая выбор перевозчика, оформление документов и отслеживание."
            },
            {
              "clause_ref": "п. 1.2",
              "quote": "При приёме груза Экспедитор выдаёт экспедиторскую расписку."
            }
          ]
        }

        Пример 2 — рамочный договор, параметры определяются поручениями:
        Фрагмент:
        "Экспедитор оказывает услуги, связанные с перевозкой грузов, на основании Поручений экспедитору, оформляемых по форме Приложения № 1. Наименование груза, вес, объём и маршрут указываются в каждом Поручении экспедитору отдельно. При приёме груза выдаётся экспедиторская расписка."
        Ответ:
        {
          "services_list_status": "defined",
          "services_list_details": "услуги, связанные с перевозкой грузов; конкретизируются в Поручениях экспедитору",
          "cargo_description_status": "defined",
          "cargo_description_details": "Определяется по Поручению экспедитору",
          "route_specified": "no",
          "route_details": "Определяется по Поручению экспедитору",
          "contract_type": "framework",
          "contract_type_display": "Рамочный",
          "forwarding_receipt_mentioned": "yes",
          "order_form_referenced": "yes",
          "evidence": [
            {
              "clause_ref": "п. 1.1",
              "quote": "Экспедитор оказывает услуги, связанные с перевозкой грузов, на основании Поручений экспедитору, оформляемых по форме Приложения № 1. Наименование груза, вес, объём и маршрут указываются в каждом Поручении экспедитору отдельно. При приёме груза выдаётся экспедиторская расписка."
            }
          ]
        }

        Пример 3 — предметные данные отсутствуют:
        Фрагмент:
        "Настоящий договор заключён между Экспедитором и Клиентом."
        Ответ:
        {
          "services_list_status": "not_defined",
          "services_list_details": "Не установлен",
          "cargo_description_status": "not_defined",
          "cargo_description_details": "Не установлено",
          "route_specified": "not_defined",
          "route_details": "Не установлен",
          "contract_type": "not_defined",
          "contract_type_display": "Не установлен",
          "forwarding_receipt_mentioned": "not_defined",
          "order_form_referenced": "not_defined",
          "evidence": []
        }

        Пример 4 — текст есть, но надёжный вывод сделать нельзя:
        Фрагмент:
        "Перечень экспедиторских услуг, характеристики груза и маршрут содержатся в документе, который сторонами не определён и не приложен к договору."
        Ответ:
        {
          "services_list_status": "not_defined",
          "services_list_details": "Не удалось определить",
          "cargo_description_status": "not_defined",
          "cargo_description_details": "Не удалось определить",
          "route_specified": "not_defined",
          "route_details": "Не удалось определить",
          "contract_type": "not_defined",
          "contract_type_display": "Не удалось определить",
          "forwarding_receipt_mentioned": "not_defined",
          "order_form_referenced": "not_defined",
          "evidence": [
            {
              "clause_ref": "предмет",
              "quote": "Перечень экспедиторских услуг, характеристики груза и маршрут содержатся в документе, который сторонами не определён и не приложен к договору."
            }
          ]
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Извлечён ли конкретный перечень услуг, а не общая формулировка из закона?
        2. Указаны ли характеристики груза, если они есть в тексте?
        3. Определён ли маршрут хотя бы как направление или как механизм определения?
        4. Разграничены ли разовый и рамочный договор без автоматического вывода по слову «Поручение»?
        5. Упомянута ли экспедиторская расписка?
        6. Есть ли ссылка на форму Поручения экспедитору, заявку или приложение?
        7. Если параметры определяются через приложение или поручение, отражено ли это в значении поля?
        8. Если текст есть, но вывод невозможен, использовано ли "Не удалось определить"?
        9. Все ли 11 ключей присутствуют в ответе?
        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь РОВНО одним JSON-объектом без какого-либо дополнительного текста до или после, со всеми 11 ключами:
        {
          "services_list_status": "<defined / not_defined>",
          "services_list_details": "<краткий перечень услуг или 'Не установлен' / 'Не удалось определить' / 'Определяется по ...'>",
          "cargo_description_status": "<defined / not_defined>",
          "cargo_description_details": "<описание груза или 'Не установлено' / 'Не удалось определить' / 'Определяется по ...'>",
          "route_specified": "<yes / no / not_defined>",
          "route_details": "<маршрут или 'Не установлен' / 'Не удалось определить' / 'Определяется по ...'>",
          "contract_type": "<single / framework / not_defined>",
          "contract_type_display": "<Разовый / Рамочный / Не установлен / Не удалось определить>",
          "forwarding_receipt_mentioned": "<yes / no / not_defined>",
          "order_form_referenced": "<yes / no / not_defined>",
          "evidence": [{"clause_ref": "<пункт или раздел>", "quote": "<точная цитата>"}]
        }
      context_k: 8
      temperature: 0.0
      max_tokens: 900

    retrieval:
      retrieval_profile: "scope_of_work_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "предмет договора транспортная экспедиция экспедиторские услуги перечень услуг организация перевозки выбор перевозчика оформление документов груз наименование вес объем объём характеристики маршрут пункт отправления пункт назначения поручение экспедитору заявка приложение экспедиторская расписка разовый рамочный"
      boost_keywords:
        - "предмет"
        - "экспедиторские услуги"
        - "перечень услуг"
        - "организация перевозки"
        - "груз"
        - "наименование груза"
        - "вес"
        - "объём"
        - "маршрут"
        - "пункт отправления"
        - "пункт назначения"
        - "поручение экспедитору"
        - "заявка"
        - "приложение"
        - "экспедиторская расписка"
        - "разовый"
        - "рамочный"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - definitions
        - obligations
      negative_keywords:
        - "вознаграждение"
        - "ответственность"
        - "удержание"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.0, 0.45]
        boost: 0.15
        scope: segment
      context_k: 8
      max_chunks: 12
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "price_list"
      preferred_clause_functions:
        - "definitions"
        - "obligations"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 50
      max_snippet_length: 800

    extraction:
      store_payload: true

      enabled: true
      mode: "hybrid"
      compact_output: false
      llm_max_tokens: 1300
      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из договора транспортной экспедиции
        сведения о предмете: перечень экспедиторских услуг, описание груза,
        маршрут, тип договора, упоминание экспедиторской расписки и ссылку
        на Поручение экспедитору / заявку / приложение.

        Не анализируй вознаграждение, ответственность, претензии, сроки оплаты
        и иные темы, если они не описывают предмет договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        1. services_list_status — "defined" или "not_defined".
        2. services_list_details — краткий перечень экспедиторских услуг.
        3. cargo_description_status — "defined" или "not_defined".
        4. cargo_description_details — описание груза или механизм его определения.
        5. route_specified — "yes", "no" или "not_defined".
        6. route_details — маршрут или механизм его определения.
        7. contract_type — "single", "framework" или "not_defined".
        8. contract_type_display — пользовательское отображение типа договора.
        9. forwarding_receipt_mentioned — "yes", "no" или "not_defined".
        10. order_form_referenced — "yes", "no" или "not_defined".
        11. evidence — массив точных цитат из договора.

        Правила заполнения:
        - Если данных нет, статусные поля = "not_defined", видимые текстовые поля = "Не установлен" или "Не установлено".
        - Если текст есть, но надёжный вывод сделать нельзя, статусные поля = "not_defined", видимые текстовые поля = "Не удалось определить".
        - Если услуги, груз или маршрут определяются через Поручение экспедитору, заявку, спецификацию или приложение, и это прямо указано в договоре, верни значение вида "Определяется по Поручению экспедитору", "Определяется по заявке" или "Согласно Приложению № 1".
        - Для contract_type:
          "single" — если в договоре зафиксирована конкретная разовая перевозка или конкретный набор услуг;
          "framework" — если договор предполагает исполнение по отдельным поручениям, заявкам или приложениям, а конкретные параметры перевозок будут определяться отдельно;
          "not_defined" — если тип договора невозможно надёжно определить.
        - Не ставь "framework" только из-за упоминания Поручения экспедитору.
        - Для contract_type_display:
          если contract_type = "single" — "Разовый";
          если contract_type = "framework" — "Рамочный";
          если contract_type = "not_defined" из-за отсутствия данных — "Не установлен";
          если contract_type = "not_defined" из-за неоднозначности или конфликта — "Не удалось определить".
        - Для route_specified:
          "yes" — если в тексте указан конкретный маршрут или направление;
          "no" — если маршрут явно не указан и подлежит определению в поручении, заявке или приложении;
          "not_defined" — если сведений нет или они неоднозначны.
        - Для forwarding_receipt_mentioned:
          "yes" — если экспедиторская расписка упомянута;
          "no" — если прямо указано, что расписка не выдаётся;
          "not_defined" — если упоминания нет.
        - Для order_form_referenced:
          "yes" — если есть ссылка на форму Поручения экспедитору, заявку, приложение или иной документ, определяющий исполнение;
          "no" — если прямо указано, что такие документы не используются;
          "not_defined" — если упоминания нет.
        </task>

        <context_rules>
        - Используй только предоставленный контекст.
        - Не используй внешние знания и не выводи перечень услуг из закона.
        - Не выдумывай груз, вес, объём, маршрут, тип договора, расписку или форму поручения.
        - Не смешивай предмет договора с вознаграждением, ответственностью, претензиями и оплатой.
        - Если фрагменты конфликтуют и не позволяют сделать надёжный вывод, верни "Не удалось определить" для затронутого видимого поля и включи конфликтующие цитаты в evidence.
        - Если конкретные параметры отсутствуют, но договор прямо отсылает к поручениям, заявкам или приложениям, это допустимый исход и должен быть отражён в видимых полях.
        </context_rules>

        <output_expectations>
        Все перечисленные ключи должны присутствовать в ответе, даже если значение равно "not_defined", "Не установлен", "Не установлено", "Не удалось определить" или "Определяется по ...".

        Запрещено возвращать:
        - null;
        - None;
        - пустые строки;
        - пояснения до или после JSON;
        - Markdown;
        - код-фенсы;
        - списки вне JSON.

        Верни РОВНО один JSON-объект со всеми 11 ключами без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.
        </output_expectations>

