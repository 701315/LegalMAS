  - id: remuneration_and_expenses_check
    name: "Вознаграждение экспедитора и возмещение расходов (ст. 804 ГК РФ)"
    description: >
      Фактографическая проверка условий вознаграждения экспедитора и порядка
      возмещения его расходов: тип вознаграждения, размер, предварительное
      согласование расходов, лимиты, авансирование и отчётность.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "вознаграждение экспедитора"
        - "размер вознаграждения"
        - "сумма вознаграждения"
        - "стоимость услуг экспедитора"
        - "фиксированное вознаграждение"
        - "процент вознаграждения"
        - "почасовое вознаграждение"
        - "тариф"
        - "прайс-лист"
        - "прейскурант"
        - "возмещение расходов"
        - "фактические расходы"
        - "за счёт клиента"
        - "смета расходов"
        - "предварительное согласование"
        - "согласование расходов"
        - "лимит расходов"
