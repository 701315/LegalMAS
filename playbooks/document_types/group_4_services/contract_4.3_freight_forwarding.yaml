      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор транспортной экспедиции (ст. 9 ФЗ-87).
        Проверяется только один вопрос: срок доставки и санкции за просрочку.
        Нормативный ориентир:
        - ст. 9 ФЗ-87
        Важно:
        - Твоя задача — не оценивать серьёзность риска.
        - Только установить, что прямо есть в тексте договора, а чего прямо нет.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Указан ли срок доставки (конкретный / определяется в Поручении / отсутствует).
        2. Значение срока доставки.
        3. Предусмотрена ли неустойка/штраф за просрочку доставки.
        4. Тип санкции за просрочку.
        5. Лимит неустойки за просрочку.
        6. Исключения для форс-мажора.

        [ПРАВИЛА]
        1. Только текст документа.
        2. Если условие не указано прямо — "not_defined".
        3. В evidence — только цитаты из документа.
        4. Верни только один JSON-объект.

        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1:
        Фрагмент:
        "Срок доставки груза составляет 5 рабочих дней с даты приёма груза.
        За просрочку доставки Экспедитор уплачивает неустойку в размере 0,1%
        от вознаграждения за каждый день просрочки, но не более 50% вознаграждения.
        Неустойка не уплачивается при форс-мажоре."
        Ответ:
        {
          "delivery_deadline_specified": "yes",
          "deadline_value": "5 рабочих дней с даты приёма груза",
          "delay_penalty_present": "yes",
          "delay_penalty_type": "percentage_per_day",
          "delay_penalty_cap": "не более 50% вознаграждения",
          "force_majeure_for_delay": "present",
          "evidence": [
            {
              "clause_ref": "п. 4.1",
              "quote": "Срок доставки груза составляет 5 рабочих дней с даты приёма груза."
            }
          ]
        }

        Пример 2:
        Фрагмент:
        "Срок доставки определяется в каждом Поручении экспедитору."
        Ответ:
        {
          "delivery_deadline_specified": "per_order",
          "deadline_value": "Данные не определены",
          "delay_penalty_present": "not_defined",
          "delay_penalty_type": "not_defined",
          "delay_penalty_cap": "Данные не определены",
          "force_majeure_for_delay": "not_defined",
          "evidence": [
            {
              "clause_ref": "п. 4.1",
              "quote": "Срок доставки определяется в каждом Поручении экспедитору."
            }
          ]
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Указан ли конкретный срок доставки или порядок определения?
        2. Извлечено ли значение срока?
        3. Предусмотрена ли неустойка за просрочку?
        4. Указан ли тип и лимит неустойки?
        5. Есть ли исключение для форс-мажора?
        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "delivery_deadline_specified": "<yes / no / per_order / not_defined>",
          "deadline_value": "<текст или 'Данные не определены'>",
          "delay_penalty_present": "<yes / no / not_defined>",
          "delay_penalty_type": "<percentage_per_day / fixed / damages_only / not_defined>",
          "delay_penalty_cap": "<текст или 'Данные не определены'>",
          "force_majeure_for_delay": "<present / absent / not_defined>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 5
      temperature: 0.0
      max_tokens: 550
      retrieval:
        retrieval_profile: "completion_deadline_check"
        corpus_scope: "primary_segment"
        levels:
          - "legal_unit"
          - "section"
        required_kind: "legal_unit"
        retrieval_query: "срок доставки транзитное время просрочка доставки штраф за просрочку неустойка за нарушение сроков ст. 9 ФЗ-87"
        preferred_unit_types:
          - obligation
          - liability_provision
          - general_provision
        excluded_unit_types:
          - definition
          - structural_anchor
          - technical_fragment
        preferred_clause_functions:
          - procedures
          - remedies
        negative_keywords:
          - "страхование"
          - "удержание"
          - "таможенное оформление"
          - "означает"
          - "в целях настоящего"
        position_bias:
          preferred_range: [0.30, 0.75]
          boost: 0.15
          scope: segment
        context_k: 5
        max_chunks: 7
        rerank: true
        enrichment_hints:
          preferred_segment_types:
            - "contract"
            - "amendment"
          excluded_segment_types:
            - "technical_specification"
            - "price_list"
          preferred_clause_functions:
            - "procedures"
            - "remedies"
          confidence_bonus_on_match: 0.10
          confidence_penalty_on_excluded_segment: 0.10
      evidence:
        required: true
        min_snippet_length: 35
        max_snippet_length: 550
      extraction:
        enabled: true
        mode: "hybrid"
        compact_output: false
        llm_max_tokens: 700
        llm_prompt_extraction: |
          <role>
          Ты — российский юрист. Извлеки из договора транспортной экспедиции
          сведения о сроке доставки и санкциях за просрочку.
          Не анализируй иные темы.
          </role>
          <context>
          {context}
          </context>
          <task>
          Заполни строго следующие поля:
          1. delivery_deadline_specified — указан ли срок (yes / no / per_order / not_defined).
          2. deadline_value — значение срока.
          3. delay_penalty_present — неустойка за просрочку (yes / no / not_defined).
          4. delay_penalty_type — тип санкции (percentage_per_day / fixed / damages_only / not_defined).
          5. delay_penalty_cap — лимит неустойки.
          6. force_majeure_for_delay — исключение для форс-мажора (present / absent / not_defined).
          Если данные отсутствуют: указывай "not_defined" или "Данные не определены".
          </task>
          <rules>
          - Используй только текст договора.
          - delivery_deadline_specified: "yes" — конкретный срок; "per_order" —
            определяется в Поручении; "no" — не указан; "not_defined" — тема отсутствует.
          - Верни только JSON.
          </rules>
        fields:
          - name: "delivery_deadline_specified"
            type: "string"
            presentation: "signal"
            allowed_values: ["yes", "no", "per_order", "not_defined"]
            description: "Указан ли срок доставки."
            required: true
          - name: "deadline_value"
