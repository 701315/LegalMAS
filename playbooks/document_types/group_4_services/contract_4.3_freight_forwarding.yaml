            Подписант клиента. Fallback: "Не установлено" / "Не удалось определить".
          required: true
          display_in_grid: false

        - name: "client_signatory_basis"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["charter", "poa", "order", "personal", "other", "not_defined"]
          description: "Основание полномочий подписанта клиента. Внутреннее enum-поле."
