  - id: unilateral_refusal_penalty
    name: "Односторонний отказ клиента: штраф 10% (ст. 806 ГК РФ, ст. 6 ФЗ-87)"
    description: >
      Фактографическая проверка наличия условия о праве клиента на односторонний
      отказ от договора транспортной экспедиции с уплатой штрафа 10% от стоимости
      услуг и возмещением фактических расходов, а также срока уведомления об отказе.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "односторонний отказ"
        - "отказ от договора"
        - "отказ от исполнения договора"
        - "штраф 10%"
        - "штраф в размере 10 процентов"
        - "штраф в размере десяти процентов"
        - "возмещение убытков"
        - "фактически понесённые расходы"
        - "фактически понесенные расходы"
        - "фактические расходы"
        - "ст. 806"
        - "ст. 6 ФЗ-87"
        - "уведомление об отказе"
        - "срок уведомления"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)односторонн[её]?[её]?\\s+отказ"
        - "(?i)штраф.*10\\s*%"
        - "(?i)штраф.*10\\s+процент"
        - "(?i)ст\\.?\\s*806|ст\\.?\\s*6.*ФЗ[\\s-]*87"
        - "(?i)фактически\\s+понес[её]нн"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор транспортной экспедиции (ст. 806 ГК РФ; ст. 6 ФЗ-87).

        Проверяется только один вопрос: право клиента на односторонний отказ
        от договора и связанные с ним штрафные санкции.

        Нормативный ориентир:
        - ст. 806 ГК РФ;
        - ст. 6 ФЗ-87 «О транспортно-экспедиционной деятельности».

        Важно:
        - Твоя задача — не оценивать серьёзность риска.
        - Только установить, что прямо есть в тексте договора, а чего прямо нет.
        - Не считай право клиента на односторонний отказ существующим по умолчанию.
          Фиксируй его только если прямо указано в тексте договора.
        - Не путай односторонний отказ клиента с расторжением по соглашению сторон
          или с односторонним отказом экспедитора.
        - Не присваивай штраф 10% по умолчанию, если размер штрафа не указан в тексте.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Упоминается ли право клиента на односторонний отказ от договора.
        2. Предусмотрен ли штраф 10% от стоимости услуг (или иной размер штрафа).
        3. Предусмотрено ли возмещение фактических расходов при отказе.
        4. Установлен ли срок уведомления об отказе.
        5. Сформируй краткое пользовательское резюме для поля unilateral_refusal_summary.
        6. Собери точные цитаты в evidence.

        [ПРАВИЛА]
        1. Используй только предоставленный текст договора.
        2. Если данные отсутствуют:
           - для статусных и перечислимых полей используй "not_defined";
           - для видимого текстового поля используй "Не установлено".
        3. Не используй null, None, пустые строки.
        4. Если текст есть, но надёжный вывод сделать нельзя:
           - для статусных и перечислимых полей используй "not_defined";
           - для видимого текстового поля используй "Не удалось определить".
        5. Если договор прямо указывает, что право клиента на односторонний отказ не предусмотрено, используй:
           - refusal_right_mentioned = "no";
           - unilateral_refusal_summary = "Не предусмотрено".
        6. Не считай право одностороннего отказа существующим по умолчанию. Фиксируй только если прямо указано.
        7. Не путай односторонний отказ клиента с расторжением по соглашению сторон или с односторонним отказом экспедитора.
        8. Для penalty_10_percent:
           - "yes", если штраф прямо указан в размере 10% от стоимости услуг;
           - "other", если указан иной размер штрафа;
           - "no", если прямо указано, что штраф не предусмотрен;
           - "not_defined", если штраф не упомянут.
        9. Верни РОВНО один JSON-объект со всеми 6 ключами без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.
        10. В evidence включай только точные цитаты из документа. Если данных нет, верни пустой массив [].
        11. Поле unilateral_refusal_summary должно быть кратким и не должно содержать длинных цитат.

        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1 — право отказа со штрафом 10%, возмещением расходов и сроком уведомления:
        Фрагмент:
        "Клиент вправе в одностороннем порядке отказаться от исполнения договора, уплатив Экспедитору штраф в размере 10% от стоимости услуг и возместив фактически понесённые расходы. Уведомление направляется за 5 рабочих дней."
        Ответ:
        {
          "refusal_right_mentioned": "yes",
          "penalty_10_percent": "yes",
          "expenses_reimbursement": "yes",
          "notice_period": "5 рабочих дней",
          "unilateral_refusal_summary": "Клиент вправе отказаться от договора; штраф 10% от стоимости услуг; возмещение фактических расходов; уведомление за 5 рабочих дней",
          "evidence": [
            {
              "clause_ref": "п. 8.1",
              "quote": "Клиент вправе в одностороннем порядке отказаться от исполнения договора, уплатив Экспедитору штраф в размере 10% от стоимости услуг и возместив фактически понесённые расходы. Уведомление направляется за 5 рабочих дней."
            }
          ]
        }

        Пример 2 — право отказа с иным размером штрафа:
        Фрагмент:
        "Клиент вправе отказаться от исполнения договора, уведомив Экспедитора за 10 рабочих дней и уплатив штраф в размере 15% от стоимости услуг."
        Ответ:
        {
          "refusal_right_mentioned": "yes",
          "penalty_10_percent": "other",
          "expenses_reimbursement": "not_defined",
          "notice_period": "10 рабочих дней",
          "unilateral_refusal_summary": "Клиент вправе отказаться от договора; штраф 15% от стоимости услуг; уведомление за 10 рабочих дней; возмещение фактических расходов не указано",
          "evidence": [
            {
              "clause_ref": "п. 8.2",
              "quote": "Клиент вправе отказаться от исполнения договора, уведомив Экспедитора за 10 рабочих дней и уплатив штраф в размере 15% от стоимости услуг."
            }
          ]
        }

        Пример 3 — текст есть, но надёжный вывод сделать нельзя:
        Фрагмент:
        "Договор может быть расторгнут в порядке, предусмотренном действующим законодательством, при соблюдении сторонами разумных сроков уведомления."
        Ответ:
        {
          "refusal_right_mentioned": "not_defined",
          "penalty_10_percent": "not_defined",
          "expenses_reimbursement": "not_defined",
          "notice_period": "Не удалось определить",
          "unilateral_refusal_summary": "Не удалось определить",
          "evidence": [
            {
              "clause_ref": "п. 8.3",
              "quote": "Договор может быть расторгнут в порядке, предусмотренном действующим законодательством, при соблюдении сторонами разумных сроков уведомления."
            }
          ]
        }

        Пример 4 — условие отсутствует:
        Фрагмент:
        "Договор может быть расторгнут по соглашению сторон."
        Ответ:
        {
          "refusal_right_mentioned": "not_defined",
          "penalty_10_percent": "not_defined",
          "expenses_reimbursement": "not_defined",
          "notice_period": "Не установлено",
          "unilateral_refusal_summary": "Не установлено",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Есть ли прямое право клиента на односторонний отказ, а не присвоено ли оно по умолчанию?
        2. Не смешан ли односторонний отказ клиента с расторжением по соглашению сторон?
        3. Не смешан ли односторонний отказ клиента с односторонним отказом экспедитора?
        4. Указан ли штраф 10% или иной размер?
        5. Не присвоен ли штраф 10% по умолчанию, если размер не указан?
        6. Предусмотрено ли возмещение фактических расходов?
        7. Установлен ли срок уведомления?
        8. Если текст есть, но вывод невозможен, использовано ли "Не удалось определить"?
        9. Все ли 6 ключей присутствуют в ответе?
        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь РОВНО одним JSON-объектом без какого-либо дополнительного текста до или после, со всеми 6 ключами:
        {
          "refusal_right_mentioned": "<yes / no / not_defined>",
          "penalty_10_percent": "<yes / no / other / not_defined>",
          "expenses_reimbursement": "<yes / no / not_defined>",
          "notice_period": "<срок уведомления или 'Не установлено' / 'Не удалось определить'>",
          "unilateral_refusal_summary": "<краткое резюме или 'Не установлено' / 'Не предусмотрено' / 'Не удалось определить'>",
          "evidence": [{"clause_ref": "<пункт или раздел>", "quote": "<точная цитата>"}]
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 700

    retrieval:
      retrieval_profile: "termination_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "односторонний отказ клиента отказ от исполнения договора штраф 10% штраф в размере 10 процентов возмещение убытков фактически понесённые расходы фактические расходы срок уведомления уведомление об отказе ст. 806 ст. 6 ФЗ-87"
      boost_keywords:
        - "односторонний отказ"
        - "отказ от договора"
        - "отказ от исполнения договора"
        - "штраф 10%"
        - "штраф в размере 10 процентов"
        - "фактически понесённые расходы"
        - "фактические расходы"
        - "срок уведомления"
        - "уведомление об отказе"
        - "ст. 806"
      preferred_unit_types:
        - termination_provision
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - remedies
        - procedures
      negative_keywords:
        - "форс-мажор"
        - "страхование"
        - "удержание"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.45, 0.90]
        boost: 0.15
        scope: segment
      context_k: 6
      max_chunks: 8
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types: []
      preferred_clause_functions:
        - "remedies"
        - "procedures"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 30
      max_snippet_length: 500

    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false
      llm_max_tokens: 900

      presence_signal:
        field: "unilateral_refusal_penalty_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из договора транспортной экспедиции
        сведения о праве клиента на односторонний отказ от договора: наличие
        права, размер штрафа, возмещение фактических расходов и срок уведомления.

        Не анализируй страхование, удержание, ответственность за третьих лиц,
        оплату и иные темы, если они не содержат сведений об одностороннем
        отказе клиента.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. unilateral_refusal_penalty_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если refusal_right_mentioned = "yes" или "no";
           - "missing" — если refusal_right_mentioned = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - refusal_right_mentioned = "not_defined";
           - penalty_10_percent = "not_defined";
           - expenses_reimbursement = "not_defined";
           - notice_period = "Не установлено";
           - unilateral_refusal_summary = "Не установлено";
           - не выполняй остальные шаги.

        1. refusal_right_mentioned — право клиента на односторонний отказ:
           "yes", "no" или "not_defined".
        2. penalty_10_percent — штраф 10% от стоимости услуг:
           "yes", "no", "other" или "not_defined".
        3. expenses_reimbursement — возмещение фактических расходов при отказе:
           "yes", "no" или "not_defined".
        4. notice_period — срок уведомления об отказе.
        5. unilateral_refusal_summary — краткое пользовательское резюме.
        6. evidence — массив точных цитат из договора.

        Правила заполнения:
        - Для refusal_right_mentioned: "yes", если право клиента на односторонний отказ прямо указано; "no", если прямо указано, что право одностороннего отказа не предусмотрено; "not_defined", если условие отсутствует или вывод невозможен.
        - Для penalty_10_percent: "yes", если штраф прямо указан в размере 10% от стоимости услуг; "other", если указан иной размер штрафа; "no", если прямо указано, что штраф не предусмотрен; "not_defined", если штраф не упомянут.
        - Для expenses_reimbursement: "yes", если прямо предусмотрено возмещение фактических расходов при отказе; "no", если прямо указано, что возмещение не предусмотрено; "not_defined", если условие отсутствует.
        - Для notice_period: если срок указан, верни его кратко; если срок не указан, верни "Не установлено"; если текст есть, но вывод невозможен, верни "Не удалось определить".
        - Для unilateral_refusal_summary: если право отказа и детали указаны, верни краткий факт; если право есть, но детали не указаны, верни "Право одностороннего отказа предусмотрено; размер штрафа и возмещение расходов не указаны"; если право прямо исключено, верни "Не предусмотрено"; если условие отсутствует, верни "Не установлено"; если текст есть, но надёжный вывод сделать нельзя, верни "Не удалось определить".
        - Не считай право одностороннего отказа существующим по умолчанию. Фиксируй только если прямо указано.
        - Не путай односторонний отказ клиента с расторжением по соглашению сторон или с односторонним отказом экспедитора.
        - Не присваивай штраф 10% по умолчанию, если размер не указан в тексте.
        - Если данных нет, верни пустой массив [] для evidence.
        </task>

        <context_rules>
        - Перед остальными полями заполни unilateral_refusal_penalty_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined", notice_period = "Не установлено", unilateral_refusal_summary = "Не установлено".
        - Используй только предоставленный контекст.
        - Не выдумывай размер штрафа, возмещение расходов и срок уведомления.
        - Не считай право одностороннего отказа существующим по умолчанию.
        - Не путай односторонний отказ клиента с расторжением по соглашению сторон.
        - Не путай односторонний отказ клиента с односторонним отказом экспедитора.
        - Не присваивай штраф 10% по умолчанию, если размер не указан.
        - Если фрагменты конфликтуют и не позволяют сделать надёжный вывод, верни "Не удалось определить" для unilateral_refusal_summary и включи конфликтующие цитаты в evidence.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет упоминания одностороннего отказа клиента.
           → presence = "missing";
             refusal_right_mentioned = "not_defined";
             unilateral_refusal_summary = "Не установлено".

        2. Неполное раскрытие темы.
           Право одностороннего отказа упомянуто, но размер штрафа, возмещение расходов или срок уведомления не указаны.
           → presence = "present";
             refusal_right_mentioned = "yes";
             соответствующие детали = "not_defined" или "Не установлено";
             unilateral_refusal_summary = "Право одностороннего отказа предусмотрено; размер штрафа и возмещение расходов не указаны".

        3. Противоречие между фрагментами.
           В разных частях договора указаны разные размеры штрафа или сроки уведомления.
           → presence = "unclear";
             unilateral_refusal_summary = "Не удалось определить".

        4. Прямое исключение.
           В договоре прямо указано, что право клиента на односторонний отказ не предусмотрено.
           → presence = "present";
             refusal_right_mentioned = "no";
             unilateral_refusal_summary = "Не предусмотрено".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для unilateral_refusal_penalty_presence используй только: "present", "missing", "unclear".
        - Для статусных enum-полей используй только допустимые значения из списка.
        - Fallback при отсутствии данных:
          * notice_period → "Не установлено";
          * unilateral_refusal_summary → "Не установлено".
        - Fallback при противоречии или неоднозначности:
          * unilateral_refusal_summary → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "unilateral_refusal_penalty_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования об одностороннем отказе клиента. Внутреннее агрегатное signal-поле."
          required: true

        - name: "refusal_right_mentioned"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Право клиента на односторонний отказ от договора. Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "penalty_10_percent"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["yes", "no", "other", "not_defined"]
          description: "Наличие штрафа 10% от стоимости услуг при одностороннем отказе клиента. Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "expenses_reimbursement"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Возмещение фактических расходов при одностороннем отказе клиента. Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "notice_period"
          type: "string"
          presentation: "fact"
          label: "Срок уведомления об отказе"
          description: >
            Срок уведомления об одностороннем отказе клиента от договора. Fallback: "Не установлено" / "Не удалось определить".
          required: true
          display_in_grid: false

        - name: "unilateral_refusal_summary"
          type: "string"
          presentation: "fact"
          label: "Односторонний отказ клиента"
