        привлечённых третьих лиц.
        Нормативный ориентир:
        - ст. 803 ГК РФ
        - ст. 805 ГК РФ
        - ст. 7 ФЗ-87
        Важно:
        - Твоя задача — не оценивать серьёзность риска.
        - Только установить, что прямо есть в тексте договора, а чего прямо нет.
        - По ст. 803 ГК РФ экспедитор отвечает за действия третьих лиц как за свои.
          Формулировки «не отвечает за перевозчика» противоречат закону.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Наличие условия об ответственности за третьих лиц.
        2. Основание ответственности (как за свои действия / ограниченная / отсутствует).
        3. Право привлекать третьих лиц (свободно / с согласия / запрещено).
        4. Наличие исключений из ответственности.

        [ПРАВИЛА]
        1. Только текст документа.
        2. Если условие не указано прямо — "not_defined".
        3. В evidence — только цитаты из документа.
        4. Верни только один JSON-объект.

        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1 — полная ответственность:
        Фрагмент:
        "Экспедитор отвечает за действия привлечённых им третьих лиц
        (перевозчиков, таможенных представителей) как за свои собственные
        в соответствии со ст. 803 ГК РФ. Экспедитор вправе привлекать
        третьих лиц без дополнительного согласия Клиента."
        Ответ:
        {
          "liability_for_third_parties_present": "yes",
          "liability_basis": "own_actions",
          "right_to_engage_third_parties": "yes",
          "exclusions_from_liability": "no",
          "evidence": [
            {
              "clause_ref": "п. 6.1",
              "quote": "Экспедитор отвечает за действия привлечённых им третьих лиц как за свои собственные в соответствии со ст. 803 ГК РФ."
            }
          ]
        }

        Пример 2 — попытка ограничения (нарушение):
        Фрагмент:
        "Экспедитор является только посредником и не несёт ответственности
        за действия перевозчика."
        Ответ:
        {
          "liability_for_third_parties_present": "no",
          "liability_basis": "limited",
          "right_to_engage_third_parties": "yes",
          "exclusions_from_liability": "yes",
          "evidence": [
            {
              "clause_ref": "п. 6.1",
              "quote": "Экспедитор является только посредником и не несёт ответственности за действия перевозчика."
            }
          ]
        }

        Пример 3 — условие отсутствует:
        Фрагмент:
        "Экспедитор организует перевозку груза."
        Ответ:
        {
          "liability_for_third_parties_present": "not_defined",
          "liability_basis": "not_defined",
          "right_to_engage_third_parties": "not_defined",
          "exclusions_from_liability": "not_defined",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Есть ли прямое условие об ответственности за третьих лиц?
        2. Сформулировано ли оно как «как за свои собственные»?
        3. Есть ли попытка ограничить ответственность («только посредник»)?
        4. Определено ли право привлекать третьих лиц?
        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "liability_for_third_parties_present": "<yes / no / limited / not_defined>",
          "liability_basis": "<own_actions / joint_and_several / limited / not_defined>",
          "right_to_engage_third_parties": "<yes / with_consent / no / not_defined>",
