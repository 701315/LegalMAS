    evidence:
      required: true
      min_snippet_length: 30
      max_snippet_length: 400

    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false
      llm_max_tokens: 1000

      presence_signal:
        field: "forwarder_report_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из договора транспортной экспедиции
        сведения об отчёте экспедитора: наличие обязанности представить отчёт,
        форму отчёта, срок представления и требование приложить подтверждающие
        документы.

        Не анализируй вознаграждение, оплату, ответственность, страхование,
        претензии и иные темы, если они не содержат сведений об отчёте экспедитора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. forwarder_report_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если report_mentioned = "yes" или "no";
           - "missing" — если report_mentioned = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - report_mentioned = "not_defined";
           - report_form_specified = "not_defined";
           - supporting_documents_required = "not_defined";
           - report_deadline_details = "Не установлен";
           - forwarder_report_summary = "Не установлен";
           - не выполняй остальные шаги.

        1. report_mentioned — предусмотрен ли отчёт экспедитора:
           "yes", "no" или "not_defined".
        2. report_form_specified — указана ли форма отчёта:
           "yes", "no" или "not_defined".
        3. report_deadline_details — срок представления отчёта или механизм его определения.
        4. supporting_documents_required — требуются ли подтверждающие документы:
           "yes", "no" или "not_defined".
        5. forwarder_report_summary — краткое пользовательское резюме.
        6. evidence — массив точных цитат из договора.

        Правила заполнения:
        - Для report_mentioned: "yes", если прямо упомянут отчёт или обязанность представить отчёт; "no", если прямо указано, что отчёт не представляется; "not_defined", если упоминания нет.
        - Для report_form_specified: "yes", если форма отчёта прямо указана, включая приложение, шаблон, форму экспедитора или свободную форму; "no", если прямо указано, что форма не установлена; "not_defined", если форма не упомянута.
        - Для report_deadline_details: если срок указан, верни его кратко; если определяется через приложение, заявку или иной документ, верни "Определяется по Приложению № 3" (или аналогично); если срок не указан, верни "Не установлен"; если текст есть, но вывод невозможен, верни "Не удалось определить".
        - Для supporting_documents_required: "yes", если прямо требуется приложить подтверждающие документы, первичные документы, счета, накладные или иные приложения; "no", если прямо указано, что документы не требуются; "not_defined", если вопрос не урегулирован.
        - Для forwarder_report_summary: если отчёт предусмотрен и детали понятны, верни краткий факт; если отчёт предусмотрен, но детали не указаны, верни "Отчёт предусмотрен; форма, срок и подтверждающие документы не указаны"; если отчёт прямо не предусмотрен, верни "Не предусмотрен"; если отчёт не упомянут, верни "Не установлен"; если текст есть, но надёжный вывод сделать нельзя, верни "Не удалось определить".
        - Если данных нет, верни пустой массив [] для evidence.
        </task>

        <context_rules>
        - Перед остальными полями заполни forwarder_report_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined", report_deadline_details = "Не установлен", forwarder_report_summary = "Не установлен".
        - Используй только предоставленный контекст.
        - Не выдумывай форму, срок и перечень подтверждающих документов.
        - Не смешивай отчёт экспедитора с актом оказанных услуг, транспортной накладной, счётом или платёжными документами, если они прямо не названы отчётом или документом о расходах.
        - Не считай отчёт существующим только потому, что договор транспортной экспедиции обычно может сопровождаться отчётностью.
        - Если фрагменты конфликтуют и не позволяют сделать надёжный вывод, верни "Не удалось определить" для forwarder_report_summary и включи конфликтующие цитаты в evidence.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет упоминания отчёта экспедитора, отчёта о расходах или отчётности.
           → presence = "missing";
             report_mentioned = "not_defined";
             forwarder_report_summary = "Не установлен".

        2. Неполное раскрытие темы.
           Отчёт упомянут, но форма, срок и подтверждающие документы не указаны.
           → presence = "present";
             report_form_specified = "not_defined";
             supporting_documents_required = "not_defined";
             forwarder_report_summary = "Отчёт предусмотрен; форма, срок и подтверждающие документы не указаны".

        3. Противоречие между фрагментами.
           В разных частях договора указаны разные формы или сроки отчёта.
           → presence = "unclear";
             forwarder_report_summary = "Не удалось определить".

        4. Прямое исключение.
           В договоре прямо указано, что отчёт не представляется.
           → presence = "present";
             report_mentioned = "no";
             forwarder_report_summary = "Не предусмотрен".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для forwarder_report_presence используй только: "present", "missing", "unclear".
        - Для статусных enum-полей используй только: "yes", "no", "not_defined".
        - Fallback при отсутствии данных:
          * report_deadline_details → "Не установлен";
          * forwarder_report_summary → "Не установлен".
        - Fallback при противоречии или неоднозначности:
          * forwarder_report_summary → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "forwarder_report_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования об отчёте экспедитора. Внутреннее агрегатное signal-поле."
          required: true

        - name: "report_mentioned"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Предусмотрен ли отчёт экспедитора. Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "report_form_specified"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Указана ли форма отчёта экспедитора. Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "report_deadline_details"
          type: "string"
          presentation: "fact"
          label: "Срок отчёта"
          description: >
            Срок представления отчёта экспедитора или механизм его определения. Fallback: "Не установлено" / "Не удалось определить".
          required: true
          display_in_grid: false

        - name: "supporting_documents_required"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Требуются ли подтверждающие документы или приложения к отчёту. Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "forwarder_report_summary"
          type: "string"
          presentation: "fact"
          label: "Отчёт экспедитора"
          description: >
            Краткое описание условия об отчёте экспедитора: наличие, форма, срок и подтверждающие документы. Fallback: "Не установлено" / "Не удалось определить".
          required: true
          display_in_grid: true
          display_priority: 1

        - name: "evidence"
          type: "array"
          presentation: "diagnostic"
          description: "Точные цитаты из договора, подтверждающие извлечённые значения."
          required: true
          display_in_grid: false

      store_payload: true

  - id: report_approval_mechanism
    name: "Утверждение отчёта: молчаливое согласие (ст. 438 ГК РФ)"
    description: >
      Фактографическая проверка механизма утверждения отчёта экспедитора:
      предусмотрен ли порядок утверждения, есть ли срок возражений,
      предусмотрено ли молчаливое согласие, при котором отчёт считается
      утверждённым при отсутствии возражений клиента.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "утверждение отчёта"
        - "утверждение отчета"
        - "порядок утверждения отчёта"
        - "порядок утверждения отчета"
        - "отчёт считается утверждённым"
        - "отчет считается утвержденным"
        - "отчёт считается принятым"
        - "отчет считается принятым"
        - "отчёт считается согласованным"
        - "отчет считается согласованным"
        - "молчаливое согласие"
        - "отсутствие возражений"
        - "без возражений"
        - "если возражения не поступили"
        - "мотивированные возражения"
        - "мотивированный отказ"
        - "возражения по отчёту"
        - "возражения по отчету"
        - "срок возражений"
        - "срок для возражений"
        - "в течение"
        - "одобрение отчёта"
        - "одобрение отчета"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)отч[её]т.*считается.*(утвержд|принят|согласован)"
        - "(?i)молчалив(ое|ого)\\s+соглас"
        - "(?i)при\\s+отсутствии\\s+возражений"
        - "(?i)возражени[йя]*.*в\\s+течени[ея]"
        - "(?i)если\\s+возражени[йя]*\\s+не\\s+поступил"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор транспортной экспедиции.

        Проверяется только один вопрос: механизм утверждения отчёта экспедитора.

        Нужно установить:
        - предусмотрен ли порядок утверждения отчёта;
        - есть ли срок для направления возражений;
        - предусмотрено ли молчаливое согласие;
        - считается ли отчёт утверждённым при отсутствии возражений клиента.

        Важно:
        - Твоя задача — не оценивать серьёзность риска.
        - Только установить, что прямо есть в тексте договора, а чего прямо нет.
        - Не смешивай утверждение отчёта с актом оказанных услуг, если акт прямо не назван механизмом утверждения отчёта.
        - Молчаливое согласие нельзя додумывать. Для него нужна прямая формулировка вроде
          «отчёт считается утверждённым при отсутствии возражений» или эквивалентная.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Упоминание механизма утверждения отчёта экспедитора.
        2. Срок для направления возражений или срок утверждения отчёта.
        3. Наличие молчаливого согласия: считается ли отчёт утверждённым при отсутствии возражений.
        4. Сформируй краткое пользовательское резюме для поля report_approval_summary.
        5. Собери точные цитаты в evidence.

        [ПРАВИЛА]
        1. Используй только предоставленный текст договора.
        2. Если данные отсутствуют:
           - для статусных и перечислимых полей используй "not_defined";
           - для видимого текстового поля используй "Не установлен".
        3. Не используй null, None, пустые строки.
        4. Если текст есть, но надёжный вывод сделать нельзя:
           - для статусных и перечислимых полей используй "not_defined";
           - для видимого текстового поля используй "Не удалось определить".
        5. Если договор прямо исключает утверждение отчёта или прямо указывает, что отчёт не утверждается, используй:
           - approval_mechanism_present = "no";
           - report_approval_summary = "Не предусмотрен".
        6. Если срок возражений определяется через приложение, заявку или иной названный документ, допустимо вернуть:
           - "Определяется по Приложению № 2";
           - "Определяется по заявке";
           - "Согласно Приложению № 1".
        7. Молчаливое согласие фиксируй только если есть прямое последствие, например:
           - «отчёт считается утверждённым»;
           - «отчёт считается принятым»;
           - «отчёт считается согласованным»;
           - «при отсутствии возражений отчёт считается утверждённым».
        8. Если договор только даёт клиенту право направить возражения или рассмотреть отчёт, но не указывает последствие при их отсутствии, не фиксируй молчаливое согласие.
        9. Верни РОВНО один JSON-объект со всеми 5 ключами без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.
        10. В evidence включай только точные цитаты из документа. Если данных нет, верни пустой массив [].
        11. Поле report_approval_summary должно быть кратким и не должно содержать длинных цитат.

        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1 — молчаливое согласие и срок возражений указаны прямо:
        Фрагмент:
        "Клиент в течение 5 рабочих дней с момента получения отчёта вправе направить мотивированные возражения. При отсутствии возражений отчёт считается утверждённым."
        Ответ:
        {
          "approval_mechanism_present": "yes",
          "silent_consent_present": "yes",
          "objection_period_details": "в течение 5 рабочих дней с момента получения отчёта",
          "report_approval_summary": "Отчёт считается утверждённым при отсутствии возражений в течение 5 рабочих дней с момента получения отчёта",
          "evidence": [
            {
              "clause_ref": "п. 4.3",
              "quote": "Клиент в течение 5 рабочих дней с момента получения отчёта вправе направить мотивированные возражения. При отсутствии возражений отчёт считается утверждённым."
            }
          ]
        }

        Пример 2 — утверждение предусмотрено, но молчаливое согласие не указано:
        Фрагмент:
        "Отчёт экспедитора утверждается сторонами путём подписания акта."
        Ответ:
        {
          "approval_mechanism_present": "yes",
          "silent_consent_present": "not_defined",
          "objection_period_details": "Не установлен",
          "report_approval_summary": "Утверждение отчёта предусмотрено; молчаливое согласие не указано",
          "evidence": [
            {
              "clause_ref": "п. 5.1",
              "quote": "Отчёт экспедитора утверждается сторонами путём подписания акта."
            }
          ]
        }

        Пример 3 — условие отсутствует:
        Фрагмент:
        "Экспедитор организует перевозку груза."
        Ответ:
        {
          "approval_mechanism_present": "not_defined",
          "silent_consent_present": "not_defined",
          "objection_period_details": "Не установлен",
          "report_approval_summary": "Не установлен",
          "evidence": []
        }

        Пример 4 — текст есть, но надёжный вывод сделать нельзя:
        Фрагмент:
        "Клиент рассматривает отчёт экспедитора и вправе направить свои замечания."
        Ответ:
        {
          "approval_mechanism_present": "not_defined",
          "silent_consent_present": "not_defined",
          "objection_period_details": "Не удалось определить",
          "report_approval_summary": "Не удалось определить",
          "evidence": [
            {
              "clause_ref": "п. 4.7",
              "quote": "Клиент рассматривает отчёт экспедитора и вправе направить свои замечания."
            }
          ]
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Есть ли прямое условие о порядке утверждения отчёта?
        2. Есть ли прямое указание на молчаливое согласие?
        3. Указан ли срок для возражений?
        4. Не смешан ли отчёт с актом оказанных услуг без прямой ссылки на отчёт?
        5. Если клиент имеет только право направить возражения, но последствия не указаны, не зафиксировано ли молчаливое согласие ошибочно?
        6. Если текст есть, но вывод невозможен, использовано ли "Не удалось определить"?
        7. Все ли 5 ключей присутствуют в ответе?
        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь РОВНО одним JSON-объектом без какого-либо дополнительного текста до или после, со всеми 5 ключами:
        {
          "approval_mechanism_present": "<yes / no / not_defined>",
          "silent_consent_present": "<yes / no / not_defined>",
          "objection_period_details": "<краткий срок или 'Не установлен' / 'Не удалось определить' / 'Определяется по ...'>",
          "report_approval_summary": "<краткое резюме или 'Не установлен' / 'Не предусмотрен' / 'Не удалось определить'>",
          "evidence": [{"clause_ref": "<пункт или раздел>", "quote": "<точная цитата>"}]
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 700

    retrieval:
      retrieval_profile: "acceptance_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "утверждение отчёта утверждение отчета отчёт считается утвержденным отчет считается утвержденным отчёт считается принятым отчет считается принятым отчёт считается согласованным молчаливое согласие отсутствие возражений мотивированные возражения срок возражений порядок утверждения отчёта если возражения не поступили"
      boost_keywords:
        - "утверждение отчёта"
        - "утверждение отчета"
        - "отчёт считается утверждённым"
        - "отчет считается утвержденным"
        - "отчёт считается принятым"
        - "отчет считается принятым"
        - "отчёт считается согласованным"
        - "молчаливое согласие"
        - "отсутствие возражений"
        - "срок возражений"
        - "мотивированные возражения"
        - "если возражения не поступили"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - procedures
        - obligations
      negative_keywords:
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.25, 0.70]
        boost: 0.12
        scope: segment
      context_k: 6
      max_chunks: 8
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types: []
      preferred_clause_functions:
        - "procedures"
        - "obligations"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 30
      max_snippet_length: 400

    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false
      llm_max_tokens: 900

      presence_signal:
        field: "report_approval_mechanism_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из договора транспортной экспедиции
        сведения о механизме утверждения отчёта экспедитора: наличие порядка
        утверждения, срок возражений и молчаливое согласие.

        Не анализируй оплату, вознаграждение, ответственность, страхование,
        претензии и иные темы, если они не содержат сведений об утверждении
        отчёта экспедитора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. report_approval_mechanism_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (approval_mechanism_present, silent_consent_present) ≠ "not_defined";
           - "missing" — если оба содержательных поля = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - approval_mechanism_present = "not_defined";
           - silent_consent_present = "not_defined";
           - objection_period_details = "Не установлен";
           - report_approval_summary = "Не установлен";
           - не выполняй остальные шаги.

        1. approval_mechanism_present — предусмотрен ли механизм утверждения отчёта:
           "yes", "no" или "not_defined".
        2. silent_consent_present — предусмотрено ли молчаливое согласие:
           "yes", "no" или "not_defined".
        3. objection_period_details — срок возражений или срок утверждения отчёта.
        4. report_approval_summary — краткое пользовательское резюме.
        5. evidence — массив точных цитат из договора.

        Правила заполнения:
        - Для approval_mechanism_present: "yes", если прямо предусмотрен порядок утверждения отчёта, включая подписание акта, молчаливое согласие, срок возражений или иной механизм; "no", если прямо указано, что отчёт не утверждается или механизм утверждения не предусмотрен; "not_defined", если условие отсутствует или вывод невозможен.
        - Для silent_consent_present: "yes", если прямо указано, что отчёт считается утверждённым, принятым или согласованным при отсутствии возражений; "no", если прямо указано, что молчаливое согласие не применяется или требуется явное утверждение; "not_defined", если молчаливое согласие не упомянуто или вывод невозможен.
        - Для objection_period_details: если срок указан, верни его кратко; если определяется через приложение, заявку или иной документ, верни "Определяется по Приложению № 2" (или аналогично); если срок не указан, верни "Не установлен"; если текст есть, но вывод невозможен, верни "Не удалось определить".
        - Для report_approval_summary: если молчаливое согласие и срок указаны, верни краткий факт, например: "Отчёт считается утверждённым при отсутствии возражений в течение 5 рабочих дней"; если механизм есть, но молчаливое согласие не указано, верни "Утверждение отчёта предусмотрено; молчаливое согласие не указано"; если механизм прямо исключён, верни "Не предусмотрен"; если условие отсутствует, верни "Не установлен"; если текст есть, но надёжный вывод сделать нельзя, верни "Не удалось определить".
        - Если данных нет, верни пустой массив [] для evidence.
        </task>

        <context_rules>
        - Перед остальными полями заполни report_approval_mechanism_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined", objection_period_details = "Не установлен", report_approval_summary = "Не установлен".
        - Используй только предоставленный контекст.
        - Не выдумывай срок возражений и последствия отсутствия возражений.
        - Молчаливое согласие фиксируй только при наличии прямого последствия: «считается утверждённым», «считается принятым», «считается согласованным» или эквивалентного.
        - Если клиент имеет только право направить возражения или рассмотреть отчёт, но последствия не указаны, не считай это молчаливым согласием.
        - Не смешивай утверждение отчёта с актом оказанных услуг, если акт прямо не назван механизмом утверждения отчёта.
        - Если фрагменты конфликтуют и не позволяют сделать надёжный вывод, верни "Не удалось определить" для report_approval_summary и включи конфликтующие цитаты в evidence.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет упоминания механизма утверждения отчёта или молчаливого согласия.
           → presence = "missing";
             approval_mechanism_present = silent_consent_present = "not_defined";
             report_approval_summary = "Не установлен".

        2. Неполное раскрытие темы.
           Механизм утверждения предусмотрен (например, подписание акта), но молчаливое согласие не указано.
           → presence = "present";
             approval_mechanism_present = "yes";
             silent_consent_present = "not_defined";
             report_approval_summary = "Утверждение отчёта предусмотрено; молчаливое согласие не указано".

        3. Противоречие между фрагментами.
           В разных частях договора указаны разные сроки возражений или разные последствия их отсутствия.
           → presence = "unclear";
             report_approval_summary = "Не удалось определить".

        4. Прямое исключение.
           В договоре прямо указано, что отчёт не утверждается или механизм утверждения не предусмотрен.
           → presence = "present";
             approval_mechanism_present = "no";
             report_approval_summary = "Не предусмотрен".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для report_approval_mechanism_presence используй только: "present", "missing", "unclear".
        - Для статусных enum-полей используй только: "yes", "no", "not_defined".
        - Fallback при отсутствии данных:
          * objection_period_details → "Не установлен";
          * report_approval_summary → "Не установлен".
        - Fallback при противоречии или неоднозначности:
          * report_approval_summary → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "report_approval_mechanism_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования о механизме утверждения отчёта. Внутреннее агрегатное signal-поле."
          required: true

        - name: "approval_mechanism_present"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Предусмотрен ли механизм утверждения отчёта экспедитора. Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "silent_consent_present"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Предусмотрено ли молчаливое согласие при отсутствии возражений. Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "objection_period_details"
          type: "string"
          presentation: "fact"
          label: "Срок возражений"
          description: >
            Срок для направления возражений по отчёту экспедитора или механизм его определения. Fallback: "Не установлено" / "Не удалось определить".
          required: true
          display_in_grid: false

        - name: "report_approval_summary"
          type: "string"
          presentation: "fact"
          label: "Утверждение отчёта"
          description: >
            Краткое описание механизма утверждения отчёта экспедитора и молчаливого согласия. Fallback: "Не установлено" / "Не удалось определить".
          required: true
          display_in_grid: true
          display_priority: 1

        - name: "evidence"
          type: "array"
          presentation: "diagnostic"
          description: "Точные цитаты из договора, подтверждающие извлечённые значения."
          required: true
          display_in_grid: false

      store_payload: true

  - id: expenses_approval_mechanism
    name: "Предварительное согласование расходов (ст. 804 ГК РФ)"
    description: >
      Фактографическая проверка процедуры согласования расходов экспедитора:
      наличие механизма предварительного согласования, порога согласования,
      порядка согласования и последствий несогласованных расходов.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "предварительное согласование расходов"
        - "согласование расходов"
        - "письменное согласование расходов"
        - "согласование превышения расходов"
        - "согласование дополнительных расходов"
        - "смета расходов"
        - "превышение сметы"
        - "превышение сметы расходов"
        - "лимит расходов"
        - "превышение лимита расходов"
        - "обоснование расходов"
        - "несогласованные расходы"
        - "расходы без согласования"
        - "расходы без предварительного согласования"
        - "не подлежат возмещению"
        - "возмещаются только при наличии согласования"
        - "заявка"
        - "согласованная заявка"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)предварительн.*согласован.*расход"
        - "(?i)письменн.*согласован.*расход"
        - "(?i)согласован(ие|ия)\\s+расход"
        - "(?i)превышени.*расход"
        - "(?i)превышени.*смет"
        - "(?i)несогласованн.*расход"
        - "(?i)смет.*расход"
        - "(?i)лимит.*расход"
        - "(?i)расход.*без.*согласован"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор транспортной экспедиции.

        Проверяется только один вопрос: механизм предварительного согласования
        расходов экспедитора.

        Нужно установить:
        - предусмотрена ли процедура согласования расходов;
        - установлен ли порог, при превышении которого требуется согласование;
        - указан ли порядок согласования;
        - предусмотрены ли последствия для несогласованных расходов.

        Важно:
        - Твоя задача — не оценивать серьёзность риска.
        - Только установить, что прямо есть в тексте договора, а чего прямо нет.
        - Не смешивай общий лимит расходов с механизмом согласования расходов.
        - Если в договоре есть только общий лимит расходов без требования о согласовании,
          это не означает наличие механизма согласования.
        - Если порог или порядок согласования определяются через приложение, заявку,
          тариф или иной названный документ, это допустимый исход.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Упоминание предварительного согласования расходов.
        2. Порог или лимит, при превышении которого требуется согласование расходов.
        3. Порядок согласования расходов.
        4. Последствия несогласованных расходов.
        5. Сформируй краткое пользовательское резюме для поля expenses_approval_summary.
        6. Собери точные цитаты в evidence.

        [ПРАВИЛА]
        1. Используй только предоставленный текст договора.
        2. Если данные отсутствуют:
           - для статусных полей используй "not_defined";
           - для видимого текстового поля используй "Не установлен".
        3. Не используй null, None, пустые строки.
        4. Если текст есть, но надёжный вывод сделать нельзя:
           - для статусных полей используй "not_defined";
           - для видимого текстового поля используй "Не удалось определить".
        5. Если договор прямо указывает, что согласование расходов не требуется, используй:
           - expenses_approval_present = "no";
           - expenses_approval_summary = "Не предусмотрено".
        6. Если порог согласования определяется через названный документ, допустимо вернуть:
           - "Определяется по Приложению № 1";
           - "Определяется по Тарифам";
           - "Определяется по заявке".
        7. Если порядок согласования определяется через названный документ, допустимо вернуть:
           - "Определяется по Приложению № 2";
           - "Согласование в заявке";
           - "Письменное согласие Клиента".
        8. Если последствия несогласованных расходов прямо указаны, верни их кратко.
           Если последствия не указаны, верни "Не установлены".
        9. Не считай механизм согласования существующим только потому, что в договоре есть общий лимит расходов.
           Для механизма согласования нужно прямое требование о согласовании, одобрении или разрешении расходов.
        10. Верни РОВНО один JSON-объект со всеми 6 ключами без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.
        11. В evidence включай только точные цитаты из документа. Если данных нет, верни пустой массив [].
        12. Поле expenses_approval_summary должно быть кратким и не должно содержать длинных цитат.

        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1 — порог, порядок и последствия несогласованных расходов указаны прямо:
        Фрагмент:
        "Расходы, превышающие 50 000 рублей, подлежат предварительному письменному согласованию с Клиентом. Несогласованные расходы возмещению не подлежат."
        Ответ:
        {
          "expenses_approval_present": "yes",
          "approval_threshold_details": "50 000 рублей",
          "approval_procedure_details": "предварительное письменное согласование с Клиентом",
          "unapproved_expenses_consequences": "Несогласованные расходы возмещению не подлежат",
          "expenses_approval_summary": "Расходы свыше 50 000 рублей подлежат письменному согласованию; несогласованные расходы не возмещаются",
          "evidence": [
            {
              "clause_ref": "п. 3.4",
              "quote": "Расходы, превышающие 50 000 рублей, подлежат предварительному письменному согласованию с Клиентом. Несогласованные расходы возмещению не подлежат."
            }
          ]
        }

        Пример 2 — согласование через заявку, порог и последствия не указаны:
        Фрагмент:
        "Дополнительные расходы Экспедитора допускаются только при указании в заявке, согласованной Клиентом."
        Ответ:
        {
          "expenses_approval_present": "yes",
          "approval_threshold_details": "Не установлен",
          "approval_procedure_details": "согласование в заявке Клиента",
          "unapproved_expenses_consequences": "Не установлены",
          "expenses_approval_summary": "Дополнительные расходы допускаются только по согласованной заявке; последствия несогласованных расходов не указаны",
          "evidence": [
            {
              "clause_ref": "п. 3.6",
              "quote": "Дополнительные расходы Экспедитора допускаются только при указании в заявке, согласованной Клиентом."
            }
          ]
        }

        Пример 3 — условие отсутствует:
        Фрагмент:
        "Экспедитор организует перевозку груза."
        Ответ:
        {
          "expenses_approval_present": "not_defined",
          "approval_threshold_details": "Не установлен",
          "approval_procedure_details": "Не установлен",
          "unapproved_expenses_consequences": "Не установлены",
          "expenses_approval_summary": "Не установлен",
          "evidence": []
        }

        Пример 4 — текст есть, но надёжный вывод сделать нельзя:
        Фрагмент:
        "Расходы Экспедитора могут превышать смету при необходимости, порядок их возмещения определяется сторонами дополнительно."
        Ответ:
        {
          "expenses_approval_present": "not_defined",
          "approval_threshold_details": "Не удалось определить",
          "approval_procedure_details": "Не удалось определить",
          "unapproved_expenses_consequences": "Не удалось определить",
          "expenses_approval_summary": "Не удалось определить",
          "evidence": [
            {
              "clause_ref": "п. 4.2",
              "quote": "Расходы Экспедитора могут превышать смету при необходимости, порядок их возмещения определяется сторонами дополнительно."
            }
          ]
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Есть ли прямое требование о согласовании расходов?
        2. Не смешан ли общий лимит расходов с порогом согласования?
        3. Указан ли порог согласования, если он есть?
        4. Указан ли порядок согласования?
        5. Указаны ли последствия несогласованных расходов?
        6. Если текст есть, но вывод невозможен, использовано ли "Не удалось определить"?
        7. Все ли 6 ключей присутствуют в ответе?
        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь РОВНО одним JSON-объектом без какого-либо дополнительного текста до или после, со всеми 6 ключами:
        {
          "expenses_approval_present": "<yes / no / not_defined>",
          "approval_threshold_details": "<порог согласования или 'Не установлен' / 'Не удалось определить' / 'Определяется по ...'>",
          "approval_procedure_details": "<порядок согласования или 'Не установлен' / 'Не удалось определить' / 'Определяется по ...'>",
          "unapproved_expenses_consequences": "<последствия или 'Не установлены' / 'Не удалось определить'>",
          "expenses_approval_summary": "<краткое резюме или 'Не установлен' / 'Не предусмотрено' / 'Не удалось определить'>",
          "evidence": [{"clause_ref": "<пункт или раздел>", "quote": "<точная цитата>"}]
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 800

    retrieval:
      retrieval_profile: "payment_terms_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "предварительное согласование расходов согласование расходов письменное согласование расходов дополнительные расходы смета расходов превышение сметы лимит расходов превышение лимита расходов несогласованные расходы последствия несогласованных расходов возмещению не подлежат заявка согласованная заявка"
      boost_keywords:
        - "предварительное согласование расходов"
        - "согласование расходов"
        - "письменное согласование расходов"
        - "дополнительные расходы"
        - "смета расходов"
        - "превышение сметы"
        - "лимит расходов"
        - "превышение лимита расходов"
        - "несогласованные расходы"
        - "расходы без согласования"
        - "возмещению не подлежат"
        - "заявка"
        - "согласованная заявка"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - procedures
        - limitations
        - obligations
      negative_keywords:
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.20, 0.70]
        boost: 0.12
        scope: segment
      context_k: 6
      max_chunks: 8
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types: []
      preferred_clause_functions:
        - "procedures"
        - "limitations"
        - "obligations"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 30
      max_snippet_length: 400

    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false
      llm_max_tokens: 1000

      presence_signal:
        field: "expenses_approval_mechanism_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из договора транспортной экспедиции
        сведения о процедуре согласования расходов экспедитора: наличие механизма
        согласования, порог согласования, порядок согласования и последствия
        несогласованных расходов.

        Не анализируй вознаграждение, оплату, ответственность, страхование,
        претензии и иные темы, если они не содержат сведений о согласовании
        расходов.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. expenses_approval_mechanism_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если expenses_approval_present = "yes" или "no";
           - "missing" — если expenses_approval_present = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - expenses_approval_present = "not_defined";
           - approval_threshold_details = "Не установлен";
           - approval_procedure_details = "Не установлен";
           - unapproved_expenses_consequences = "Не установлены";
           - expenses_approval_summary = "Не установлен";
           - не выполняй остальные шаги.

        1. expenses_approval_present — предусмотрен ли механизм согласования расходов:
           "yes", "no" или "not_defined".
        2. approval_threshold_details — порог согласования расходов или механизм его определения.
        3. approval_procedure_details — порядок согласования расходов.
        4. unapproved_expenses_consequences — последствия несогласованных расходов.
        5. expenses_approval_summary — краткое пользовательское резюме.
        6. evidence — массив точных цитат из договора.

        Правила заполнения:
        - Для expenses_approval_present: "yes", если прямо предусмотрено требование о предварительном согласовании, одобрении или разрешении расходов; "no", если прямо указано, что согласование расходов не требуется; "not_defined", если условие отсутствует или вывод невозможен.
        - Для approval_threshold_details: если указан порог, верни его кратко; если порог определяется через приложение, заявку, тариф или иной документ, верни, например, "Определяется по Приложению № 1"; если порог не указан, верни "Не установлен"; если текст есть, но вывод невозможен, верни "Не удалось определить".
        - Для approval_procedure_details: если порядок указан, верни его кратко; если порядок определяется через документ, верни, например, "Определяется по Приложению № 2"; если порядок не указан, верни "Не установлен"; если текст есть, но вывод невозможен, верни "Не удалось определить".
        - Для unapproved_expenses_consequences: если последствия прямо указаны, верни их кратко; если последствия не указаны, верни "Не установлены"; если текст есть, но вывод невозможен, верни "Не удалось определить".
        - Для expenses_approval_summary: если механизм, порог и последствия указаны, верни краткий факт; если механизм есть, но детали не указаны, верни, например, "Дополнительные расходы допускаются только по согласованной заявке; последствия несогласованных расходов не указаны"; если механизм прямо исключён, верни "Не предусмотрено"; если условие отсутствует, верни "Не установлен"; если текст есть, но надёжный вывод сделать нельзя, верни "Не удалось определить".
        - Если данных нет, верни пустой массив [] для evidence.
        </task>

        <context_rules>
        - Перед остальными полями заполни expenses_approval_mechanism_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — expenses_approval_present = "not_defined", expenses_approval_summary = "Не установлен".
        - Используй только предоставленный контекст.
        - Не выдумывай порог, порядок согласования и последствия несогласованных расходов.
        - Не смешивай общий лимит расходов с механизмом согласования расходов.
        - Если в договоре есть только общий лимит расходов без требования о согласовании, не фиксируй механизм согласования как существующий.
        - Не считай согласование существующим только потому, что договор предусматривает возмещение расходов.
        - Если фрагменты конфликтуют и не позволяют сделать надёжный вывод, верни "Не удалось определить" для expenses_approval_summary и включи конфликтующие цитаты в evidence.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет упоминания механизма согласования расходов.
           → presence = "missing";
             expenses_approval_present = "not_defined";
             expenses_approval_summary = "Не установлен".

        2. Неполное раскрытие темы.
           Механизм согласования упомянут, но порог или порядок не определены.
           → presence = "present";
             expenses_approval_present = "yes";
             соответствующие детали = "Не установлен";
             expenses_approval_summary = "Механизм согласования предусмотрен, но детали не указаны".

        3. Противоречие между фрагментами.
           В разных частях договора указаны разные пороги или последствия несогласованных расходов.
           → presence = "unclear";
             expenses_approval_summary = "Не удалось определить".

        4. Прямое исключение.
           В договоре прямо указано, что согласование расходов не требуется.
           → presence = "present";
             expenses_approval_present = "no";
             expenses_approval_summary = "Не предусмотрено".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для expenses_approval_mechanism_presence используй только: "present", "missing", "unclear".
        - Для статусных enum-полей используй только: "yes", "no", "not_defined".
        - Fallback при отсутствии данных:
          * approval_threshold_details, approval_procedure_details → "Не установлен";
          * unapproved_expenses_consequences → "Не установлены";
          * expenses_approval_summary → "Не установлен".
        - Fallback при противоречии или неоднозначности:
          * expenses_approval_summary → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "expenses_approval_mechanism_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования о согласовании расходов. Внутреннее агрегатное signal-поле."
          required: true

        - name: "expenses_approval_present"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Предусмотрен ли механизм согласования расходов экспедитора. Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "approval_threshold_details"
          type: "string"
          presentation: "fact"
          label: "Порог согласования"
          description: >
            Порог или лимит, при превышении которого требуется согласование расходов. Fallback: "Не установлено" / "Не удалось определить".
          required: true
          display_in_grid: false

        - name: "approval_procedure_details"
          type: "string"
          presentation: "fact"
          label: "Порядок согласования"
          description: >
            Порядок или форма согласования расходов экспедитора. Fallback: "Не установлено" / "Не удалось определить".
          required: true
          display_in_grid: false

        - name: "unapproved_expenses_consequences"
          type: "string"
          presentation: "fact"
          label: "Последствия несогласованных расходов"
          description: >
            Последствия для расходов, которые не были согласованы с клиентом. Fallback: "Не установлено" / "Не удалось определить".
          required: true
          display_in_grid: false

        - name: "expenses_approval_summary"
          type: "string"
          presentation: "fact"
          label: "Согласование расходов"
          description: >
            Краткое описание процедуры согласования расходов и последствий несогласованных расходов. Fallback: "Не установлено" / "Не удалось определить".
          required: true
          display_in_grid: true
          display_priority: 1

        - name: "evidence"
          type: "array"
          presentation: "diagnostic"
          description: "Точные цитаты из договора, подтверждающие извлечённые значения."
          required: true
          display_in_grid: false

      store_payload: true

  - id: expenses_limit
    name: "Лимит расходов экспедитора: последствия превышения"
    description: >
      Фактографическая проверка последствий превышения максимального лимита
      расходов экспедитора: возмещаются ли расходы сверх лимита, требуется ли
      дополнительное согласование, не возмещаются ли они вовсе. Сам факт и
      значение лимита фиксируются в remuneration_and_expenses_check.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "medium"
    severity_if_pass: "pass"
    severity_if_fail: "medium"
    severity_if_unclear: "low"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "лимит расходов"
        - "максимальная сумма расходов"
        - "предельная сумма расходов"
        - "превышение лимита расходов"
        - "превышение максимальной суммы расходов"
        - "превышение предельной суммы расходов"
        - "расходы сверх лимита"
        - "сверх лимита расходов"
        - "расходы сверх максимальной суммы"
        - "превышение сметы расходов"
        - "расходы возмещению не подлежат"
        - "расходы не подлежат возмещению"
        - "сверх лимита не возмещаются"
        - "сверх лимита возмещаются только"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)превышен.*лимит.*расход"
        - "(?i)превышен.*максимальн.*сумм.*расход"
        - "(?i)превышен.*предельн.*сумм.*расход"
        - "(?i)расход.*сверх.*лимит"
        - "(?i)сверх.*лимит.*расход"
        - "(?i)превышен.*смет.*расход"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор транспортной экспедиции.

        Проверяется только один вопрос: последствия превышения максимального
        лимита расходов экспедитора.

        Нужно установить:
        - есть ли условие о том, что происходит при превышении лимита расходов;
        - возмещаются ли расходы сверх лимита;
        - требуется ли для этого дополнительное согласование;
        - не возмещаются ли такие расходы вовсе.

        Важно:
        - Твоя задача — не оценивать серьёзность риска.
        - Только установить, что прямо есть в тексте договора, а чего прямо нет.
        - Сам факт и значение лимита расходов фиксируются в другом чеке.
          Здесь извлекаем только последствия превышения лимита.
        - Не путай лимит расходов с лимитом ответственности и с неустойками.
        - Если лимит есть, но последствия его превышения не описаны, не додумывай их.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Упоминание последствий превышения лимита расходов.
        2. Конкретные последствия: не возмещаются, возмещаются только с согласованием, возмещаются полностью и т.п.
        3. Сформируй краткое пользовательское резюме для поля overlimit_summary.
        4. Собери точные цитаты в evidence.

        [ПРАВИЛА]
        1. Используй только предоставленный текст договора.
        2. Если данные отсутствуют:
           - для статусных полей используй "not_defined";
           - для видимого текстового поля используй "Не установлено".
        3. Не используй null, None, пустые строки.
        4. Если текст есть, но надёжный вывод сделать нельзя:
           - для статусных полей используй "not_defined";
           - для видимого текстового поля используй "Не удалось определить".
        5. Если договор прямо указывает, что лимит расходов не установлен или последствия превышения не предусмотрены, используй:
           - overlimit_consequences_present = "no";
           - overlimit_summary = "Не предусмотрено".
        6. Если в договоре есть лимит, но последствия его превышения не описаны, используй:
           - overlimit_consequences_present = "no";
           - overlimit_summary = "Лимит установлен; последствия превышения не указаны".
        7. Не извлекай здесь само значение лимита — оно фиксируется в другом чеке.
        8. Не смешивай превышение лимита расходов с лимитом ответственности, неустойками и прочими ограничениями.
        9. Верни РОВНО один JSON-объект со всеми 4 ключами без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.
        10. В evidence включай только точные цитаты из документа. Если данных нет, верни пустой массив [].
        11. Поле overlimit_summary должно быть кратким и не должно содержать длинных цитат.

        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1 — расходы сверх лимита не возмещаются:
        Фрагмент:
        "Расходы, превышающие установленный лимит, возмещению не подлежат."
        Ответ:
        {
          "overlimit_consequences_present": "yes",
          "overlimit_consequences_details": "Расходы сверх лимита возмещению не подлежат",
          "overlimit_summary": "Расходы сверх лимита не возмещаются",
          "evidence": [
            {
              "clause_ref": "п. 3.5",
              "quote": "Расходы, превышающие установленный лимит, возмещению не подлежат."
            }
          ]
        }

        Пример 2 — превышение лимита возмещается только с согласованием:
        Фрагмент:
        "Расходы сверх максимальной суммы возмещаются только при наличии письменного согласования Клиента."
        Ответ:
        {
          "overlimit_consequences_present": "yes",
          "overlimit_consequences_details": "Расходы сверх максимальной суммы возмещаются только с письменного согласования Клиента",
          "overlimit_summary": "Расходы сверх лимита возмещаются только с письменного согласования Клиента",
          "evidence": [
            {
              "clause_ref": "п. 3.7",
              "quote": "Расходы сверх максимальной суммы возмещаются только при наличии письменного согласования Клиента."
            }
          ]
        }

        Пример 3 — лимит есть, но последствия превышения не описаны:
        Фрагмент:
        "Максимальная сумма расходов Экспедитора не может превышать 100 000 рублей."
        Ответ:
        {
          "overlimit_consequences_present": "no",
          "overlimit_consequences_details": "Не установлены",
          "overlimit_summary": "Лимит установлен; последствия превышения не указаны",
          "evidence": [
            {
              "clause_ref": "п. 3.3",
              "quote": "Максимальная сумма расходов Экспедитора не может превышать 100 000 рублей."
            }
          ]
        }

        Пример 4 — текст есть, но надёжный вывод сделать нельзя:
        Фрагмент:
        "Вопрос о расходах, превышающих согласованную сумму, решается сторонами дополнительно."
        Ответ:
        {
          "overlimit_consequences_present": "not_defined",
          "overlimit_consequences_details": "Не удалось определить",
          "overlimit_summary": "Не удалось определить",
          "evidence": [
            {
              "clause_ref": "п. 3.9",
              "quote": "Вопрос о расходах, превышающих согласованную сумму, решается сторонами дополнительно."
            }
          ]
        }

        Пример 5 — условие отсутствует:
        Фрагмент:
        "Экспедитор организует перевозку груза."
        Ответ:
        {
          "overlimit_consequences_present": "not_defined",
          "overlimit_consequences_details": "Не установлены",
          "overlimit_summary": "Не установлено",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Есть ли прямое условие о последствиях превышения лимита расходов?
        2. Не смешан ли лимит расходов с лимитом ответственности или неустойками?
        3. Не извлекается ли здесь само значение лимита вместо последствий?
        4. Если лимит есть, но последствий нет, не додуманы ли они?
        5. Если текст есть, но вывод невозможен, использовано ли "Не удалось определить"?
        6. Все ли 4 ключа присутствуют в ответе?
        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь РОВНО одним JSON-объектом без какого-либо дополнительного текста до или после, со всеми 4 ключами:
        {
          "overlimit_consequences_present": "<yes / no / not_defined>",
          "overlimit_consequences_details": "<последствия или 'Не установлены' / 'Не удалось определить'>",
          "overlimit_summary": "<краткое резюме или 'Не установлено' / 'Не предусмотрено' / 'Не удалось определить'>",
          "evidence": [{"clause_ref": "<пункт или раздел>", "quote": "<точная цитата>"}]
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 700

    retrieval:
      retrieval_profile: "payment_terms_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "лимит расходов максимальная сумма расходов предельная сумма расходов превышение лимита расходов расходы сверх лимита последствия превышения лимита расходы возмещению не подлежат сверх лимита возмещаются только с согласованием"
      boost_keywords:
        - "лимит расходов"
        - "максимальная сумма расходов"
        - "предельная сумма расходов"
        - "превышение лимита расходов"
        - "расходы сверх лимита"
        - "сверх лимита"
        - "расходы возмещению не подлежат"
        - "расходы не подлежат возмещению"
        - "превышение сметы расходов"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - limitations
        - obligations
      negative_keywords:
        - "лимит ответственности"
        - "неустойка"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.20, 0.70]
        boost: 0.12
        scope: segment
      context_k: 6
      max_chunks: 8
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types: []
      preferred_clause_functions:
        - "limitations"
        - "obligations"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 30
      max_snippet_length: 400

    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false
      llm_max_tokens: 900

      presence_signal:
        field: "expenses_limit_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из договора транспортной экспедиции
        сведения о последствиях превышения максимального лимита расходов
        экспедитора. Сам факт и значение лимита фиксируются в другом чеке —
        здесь извлекаем только последствия его превышения.

        Не анализируй лимиты ответственности, неустойки, вознаграждение,
        оплату, страхование и иные темы, если они не содержат сведений о
        последствиях превышения лимита расходов.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. expenses_limit_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если overlimit_consequences_present = "yes" или "no";
           - "missing" — если overlimit_consequences_present = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - overlimit_consequences_present = "not_defined";
           - overlimit_consequences_details = "Не установлены";
           - overlimit_summary = "Не установлено";
           - не выполняй остальные шаги.

        1. overlimit_consequences_present — есть ли условие о последствиях превышения лимита расходов:
           "yes", "no" или "not_defined".
        2. overlimit_consequences_details — описание последствий превышения лимита.
        3. overlimit_summary — краткое пользовательское резюме.
        4. evidence — массив точных цитат из договора.

        Правила заполнения:
        - Для overlimit_consequences_present: "yes", если прямо описано, что происходит при превышении лимита расходов; "no", если прямо указано, что последствия превышения не предусмотрены, либо лимит есть, но последствия не описаны; "not_defined", если условие отсутствует или вывод невозможен.
        - Для overlimit_consequences_details: если последствия указаны, верни их кратко; если последствия не указаны, верни "Не установлены"; если текст есть, но вывод невозможен, верни "Не удалось определить".
        - Для overlimit_summary: если последствия указаны, верни краткий факт, например: "Расходы сверх лимита не возмещаются"; если лимит есть, но последствия не описаны, верни: "Лимит установлен; последствия превышения не указаны"; если лимит или последствия прямо исключены, верни: "Не предусмотрено"; если условие отсутствует, верни: "Не установлено"; если текст есть, но надёжный вывод сделать нельзя, верни: "Не удалось определить".
        - Не извлекай здесь само значение лимита расходов.
        - Если данных нет, верни пустой массив [] для evidence.
        </task>

        <context_rules>
        - Перед остальными полями заполни expenses_limit_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — overlimit_consequences_present = "not_defined", overlimit_summary = "Не установлено".
        - Используй только предоставленный контекст.
        - Не выдумывай последствия превышения лимита.
        - Не путай лимит расходов с лимитом ответственности, неустойками и прочими ограничениями.
        - Если в договоре есть лимит, но последствия его превышения не описаны, не додумывай их.
        - Если фрагменты конфликтуют и не позволяют сделать надёжный вывод, верни "Не удалось определить" для overlimit_summary и включи конфликтующие цитаты в evidence.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет упоминания лимита расходов или последствий его превышения.
           → presence = "missing";
             overlimit_consequences_present = "not_defined";
             overlimit_summary = "Не установлено".

        2. Неполное раскрытие темы.
           Лимит установлен, но последствия его превышения не описаны.
           → presence = "present";
             overlimit_consequences_present = "no";
             overlimit_summary = "Лимит установлен; последствия превышения не указаны".

        3. Противоречие между фрагментами.
           В разных частях договора указаны разные последствия превышения лимита.
           → presence = "unclear";
             overlimit_summary = "Не удалось определить".

        4. Прямое исключение.
           В договоре прямо указано, что последствия превышения не предусмотрены или лимит не установлен.
           → presence = "present";
             overlimit_consequences_present = "no";
             overlimit_summary = "Не предусмотрено".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для expenses_limit_presence используй только: "present", "missing", "unclear".
        - Для статусных enum-полей используй только: "yes", "no", "not_defined".
        - Fallback при отсутствии данных:
          * overlimit_consequences_details → "Не установлены";
          * overlimit_summary → "Не установлено".
        - Fallback при противоречии или неоднозначности:
          * overlimit_summary → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "expenses_limit_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования о последствиях превышения лимита расходов. Внутреннее агрегатное signal-поле."
          required: true

        - name: "overlimit_consequences_present"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Есть ли условие о последствиях превышения лимита расходов. Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "overlimit_consequences_details"
          type: "string"
          presentation: "fact"
          label: "Последствия превышения лимита"
          description: >
            Что происходит при превышении максимального лимита расходов экспедитора. Fallback: "Не установлено" / "Не удалось определить".
          required: true
          display_in_grid: false

        - name: "overlimit_summary"
          type: "string"
          presentation: "fact"
          label: "Лимит расходов: последствия превышения"
          description: >
            Краткое описание последствий превышения максимального лимита расходов экспедитора. Fallback: "Не установлено" / "Не удалось определить".
          required: true
          display_in_grid: true
          display_priority: 1

        - name: "evidence"
          type: "array"
          presentation: "diagnostic"
          description: "Точные цитаты из договора, подтверждающие извлечённые значения."
          required: true
          display_in_grid: false

      store_payload: true

  - id: cargo_insurance_obligation
    name: "Страхование груза: обязательность и покрытие (ст. 4 ФЗ-87)"
    description: >
      Фактографическая проверка наличия обязательства застраховать груз,
      кто страхует, вид покрытия (all risks / named perils), основание
      определения страховой суммы и выгодоприобретатель.
    triggers:
      any: ["cargo_insurance_service"]
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "застраховать груз"
        - "страхование груза"
        - "страховой полис"
        - "от всех рисков"
        - "all risks"
        - "страховая сумма"
        - "в пользу клиента"
        - "выгодоприобретатель"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)застраховать\\s+груз"
        - "(?i)страхован(ие|ия)\\s+груз"
        - "(?i)от\\s+всех\\s+риск"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор транспортной экспедиции (ст. 4 ФЗ-87).

        Проверяется только один вопрос: страхование груза.

        Нормативный ориентир:
        - ст. 4 ФЗ-87 «О транспортно-экспедиционной деятельности».

        Важно:
        - Твоя задача — не оценивать серьёзность риска.
        - Только установить, что прямо есть в тексте договора, а чего прямо нет.
        - Страхование груза не является обязательным по умолчанию. Фиксируй
          обязательность только если в договоре прямо указано «обязан застраховать»
          или эквивалентная формулировка.
        - Не путай страхование груза со страхованием ответственности экспедитора.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Обязательно ли страхование груза, опционально или не предусмотрено.
        2. Кто страхует (экспедитор / клиент).
        3. Вид покрытия (от всех рисков / поименованные риски / только ответственность).
        4. Основание определения страховой суммы.
        5. Выгодоприобретатель.
        6. Сформируй краткое пользовательское резюме для поля cargo_insurance_summary.
        7. Собери точные цитаты в evidence.

        [ПРАВИЛА]
        1. Используй только предоставленный текст договора.
        2. Если данные отсутствуют:
           - для статусных и перечислимых полей используй "not_defined";
           - для видимого текстового поля используй "Не установлено".
        3. Не используй null, None, пустые строки.
        4. Если текст есть, но надёжный вывод сделать нельзя:
           - для статусных и перечислимых полей используй "not_defined";
           - для видимого текстового поля используй "Не удалось определить".
        5. Если договор прямо указывает, что страхование груза не предусмотрено, используй:
           - insurance_required = "no";
           - cargo_insurance_summary = "Не предусмотрено".
        6. Не считай страхование обязательным только потому, что это договор транспортной экспедиции. Обязательность должна быть прямо указана.
        7. Не присваивай покрытие "all_risks" по умолчанию, если вид покрытия не указан в тексте.
        8. Не путай страхование груза со страхованием ответственности экспедитора.
        9. Верни РОВНО один JSON-объект со всеми 7 ключами без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.
        10. В evidence включай только точные цитаты из документа. Если данных нет, верни пустой массив [].
        11. Поле cargo_insurance_summary должно быть кратким и не должно содержать длинных цитат.

        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1 — обязательное страхование экспедитором от всех рисков:
        Фрагмент:
        "Экспедитор обязан застраховать груз от всех рисков на сумму объявленной ценности. Выгодоприобретателем является Клиент."
        Ответ:
        {
          "insurance_required": "yes",
          "who_insures": "forwarder",
          "insurance_coverage": "all_risks",
          "insurance_amount_basis": "declared_value",
          "beneficiary": "client",
          "cargo_insurance_summary": "Экспедитор обязан застраховать груз от всех рисков на сумму объявленной ценности; выгодоприобретатель — Клиент",
          "evidence": [
            {
              "clause_ref": "п. 5.1",
              "quote": "Экспедитор обязан застраховать груз от всех рисков на сумму объявленной ценности. Выгодоприобретателем является Клиент."
            }
          ]
        }

        Пример 2 — опциональное страхование по соглашению сторон:
        Фрагмент:
        "Страхование груза осуществляется по соглашению сторон."
        Ответ:
        {
          "insurance_required": "optional",
          "who_insures": "not_specified",
          "insurance_coverage": "not_specified",
          "insurance_amount_basis": "not_specified",
          "beneficiary": "not_specified",
          "cargo_insurance_summary": "Страхование груза осуществляется по соглашению сторон",
          "evidence": [
            {
              "clause_ref": "п. 5.1",
              "quote": "Страхование груза осуществляется по соглашению сторон."
            }
          ]
        }

        Пример 3 — страхование клиента по поименованным рискам:
        Фрагмент:
        "Клиент самостоятельно страхует груз от рисков утраты и повреждения. Страховая сумма определяется в размере стоимости груза."
        Ответ:
        {
          "insurance_required": "yes",
          "who_insures": "client",
          "insurance_coverage": "named_perils",
          "insurance_amount_basis": "full_value",
          "beneficiary": "not_specified",
          "cargo_insurance_summary": "Клиент самостоятельно страхует груз от рисков утраты и повреждения; страховая сумма — в размере стоимости груза",
          "evidence": [
            {
              "clause_ref": "п. 5.3",
              "quote": "Клиент самостоятельно страхует груз от рисков утраты и повреждения. Страховая сумма определяется в размере стоимости груза."
            }
          ]
        }

        Пример 4 — текст есть, но надёжный вывод сделать нельзя:
        Фрагмент:
        "Вопросы страхования груза решаются сторонами дополнительно, обязанности по страхованию распределяются между сторонами."
        Ответ:
        {
          "insurance_required": "not_defined",
          "who_insures": "not_defined",
          "insurance_coverage": "not_defined",
          "insurance_amount_basis": "not_defined",
          "beneficiary": "not_defined",
          "cargo_insurance_summary": "Не удалось определить",
          "evidence": [
            {
              "clause_ref": "п. 5.5",
              "quote": "Вопросы страхования груза решаются сторонами дополнительно, обязанности по страхованию распределяются между сторонами."
            }
          ]
        }

        Пример 5 — условие отсутствует:
        Фрагмент:
        "Экспедитор организует перевозку груза."
        Ответ:
        {
          "insurance_required": "not_defined",
          "who_insures": "not_defined",
          "insurance_coverage": "not_defined",
          "insurance_amount_basis": "not_defined",
          "beneficiary": "not_defined",
          "cargo_insurance_summary": "Не установлено",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Страхование обязательно, опционально или не предусмотрено?
        2. Определено ли, кто страхует?
        3. Указан ли вид покрытия, а не присвоен ли all_risks по умолчанию?
        4. Определён ли выгодоприобретатель?
        5. Не смешано ли страхование груза со страхованием ответственности?
        6. Если текст есть, но вывод невозможен, использовано ли "Не удалось определить"?
        7. Все ли 7 ключей присутствуют в ответе?
        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь РОВНО одним JSON-объектом без какого-либо дополнительного текста до или после, со всеми 7 ключами:
        {
          "insurance_required": "<yes / optional / no / not_defined>",
          "who_insures": "<forwarder / client / not_specified / not_defined>",
          "insurance_coverage": "<all_risks / named_perils / liability_only / not_specified / not_defined>",
          "insurance_amount_basis": "<full_value / declared_value / other / not_specified / not_defined>",
          "beneficiary": "<client / forwarder / not_specified / not_defined>",
          "cargo_insurance_summary": "<краткое резюме или 'Не установлено' / 'Не предусмотрено' / 'Не удалось определить'>",
          "evidence": [{"clause_ref": "<пункт или раздел>", "quote": "<точная цитата>"}]
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 700

    retrieval:
      retrieval_profile: "insurance_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "страхование груза застраховать груз страховой полис от всех рисков страховая сумма выгодоприобретатель страхование по соглашению сторон"
      boost_keywords:
        - "страхование груза"
        - "застраховать груз"
        - "страховой полис"
        - "от всех рисков"
        - "страховая сумма"
        - "выгодоприобретатель"
        - "в пользу клиента"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
      negative_keywords:
        - "ответственность за третьих лиц"
        - "страхование ответственности"
        - "удержание"
        - "форс-мажор"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.25, 0.75]
        boost: 0.15
        scope: segment
      context_k: 6
      max_chunks: 8
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types: []
      preferred_clause_functions:
        - "obligations"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 600

    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false
      llm_max_tokens: 900

      presence_signal:
        field: "cargo_insurance_obligation_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из договора транспортной экспедиции
        сведения о страховании груза: обязательность, кто страхует, вид покрытия,
        основание страховой суммы и выгодоприобретателя.

        Не анализируй страхование ответственности экспедитора, ответственность
        за третьих лиц, оплату, претензии и иные темы, если они не содержат
        сведений о страховании груза.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. cargo_insurance_obligation_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если insurance_required = "yes", "optional" или "no";
           - "missing" — если insurance_required = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - insurance_required = "not_defined";
           - who_insures = "not_defined";
           - insurance_coverage = "not_defined";
           - insurance_amount_basis = "not_defined";
           - beneficiary = "not_defined";
           - cargo_insurance_summary = "Не установлено";
           - не выполняй остальные шаги.

        1. insurance_required — обязательность страхования груза:
           "yes", "optional", "no" или "not_defined".
        2. who_insures — кто обязан застраховать груз:
           "forwarder", "client", "not_specified" или "not_defined".
        3. insurance_coverage — вид страхового покрытия:
           "all_risks", "named_perils", "liability_only", "not_specified" или "not_defined".
        4. insurance_amount_basis — основание определения страховой суммы:
           "full_value", "declared_value", "other", "not_specified" или "not_defined".
        5. beneficiary — выгодоприобретатель:
           "client", "forwarder", "not_specified" или "not_defined".
        6. cargo_insurance_summary — краткое пользовательское резюме.
        7. evidence — массив точных цитат из договора.

        Правила заполнения:
        - Для insurance_required: "yes", если страхование прямо указано как обязанность; "optional", если осуществляется по соглашению сторон; "no", если прямо указано, что не предусмотрено; "not_defined", если условие отсутствует.
        - Для who_insures: "forwarder", если страхует экспедитор; "client", если страхует клиент; "not_specified", если не указано, кто страхует; "not_defined", если условие отсутствует.
        - Для insurance_coverage: "all_risks", если указано страхование от всех рисков; "named_perils", если указаны конкретные риски; "liability_only", если застрахована только ответственность; "not_specified", если покрытие не указано; "not_defined", если условие отсутствует.
        - Для insurance_amount_basis: "full_value", если в размере полной стоимости; "declared_value", если в размере объявленной ценности; "other", если иное основание; "not_specified", если основание не указано; "not_defined", если условие отсутствует.
        - Для beneficiary: "client", если выгодоприобретатель — клиент; "forwarder", если выгодоприобретатель — экспедитор; "not_specified", если не указан; "not_defined", если условие отсутствует.
        - Для cargo_insurance_summary: если страхование и детали указаны, верни краткий факт; если опционально, верни "Страхование груза осуществляется по соглашению сторон"; если прямо исключено, верни "Не предусмотрено"; если условие отсутствует, верни "Не установлено"; если вывод невозможен, верни "Не удалось определить".
        - Не присваивай покрытие "all_risks" по умолчанию, если оно не указано в тексте.
        - Если данных нет, верни пустой массив [] для evidence.
        </task>

        <context_rules>
        - Перед остальными полями заполни cargo_insurance_obligation_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined", cargo_insurance_summary = "Не установлено".
        - Используй только предоставленный контекст.
        - Не выдумывай страховую сумму, вид покрытия и выгодоприобретателя.
        - Не путай страхование груза со страхованием ответственности экспедитора.
        - Не присваивай покрытие "all_risks" по умолчанию.
        - Не считай страхование обязательным по умолчанию.
        - Если фрагменты конфликтуют и не позволяют сделать надёжный вывод, верни "Не удалось определить" для cargo_insurance_summary и включи конфликтующие цитаты в evidence.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет упоминания страхования груза.
           → presence = "missing";
             insurance_required = "not_defined";
             cargo_insurance_summary = "Не установлено".

        2. Неполное раскрытие темы.
           Страхование упомянуто как опциональное, но детали (кто страхует, покрытие) не указаны.
           → presence = "present";
             insurance_required = "optional";
             соответствующие детали = "not_specified";
             cargo_insurance_summary = "Страхование груза осуществляется по соглашению сторон".

        3. Противоречие между фрагментами.
           В разных частях договора указаны разные условия страхования (например, разные выгодоприобретатели).
           → presence = "unclear";
             cargo_insurance_summary = "Не удалось определить".

        4. Прямое исключение.
           В договоре прямо указано, что страхование груза не предусмотрено.
           → presence = "present";
             insurance_required = "no";
             cargo_insurance_summary = "Не предусмотрено".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для cargo_insurance_obligation_presence используй только: "present", "missing", "unclear".
        - Для статусных enum-полей используй только допустимые значения из списка.
        - Fallback при отсутствии данных:
          * cargo_insurance_summary → "Не установлено".
        - Fallback при противоречии или неоднозначности:
          * cargo_insurance_summary → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "cargo_insurance_obligation_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования о страховании груза. Внутреннее агрегатное signal-поле."
          required: true

        - name: "insurance_required"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["yes", "optional", "no", "not_defined"]
          description: "Обязательность страхования груза. Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "who_insures"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["forwarder", "client", "not_specified", "not_defined"]
          description: "Кто обязан застраховать груз. Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "insurance_coverage"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["all_risks", "named_perils", "liability_only", "not_specified", "not_defined"]
          description: "Вид страхового покрытия. Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "insurance_amount_basis"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["full_value", "declared_value", "other", "not_specified", "not_defined"]
          description: "Основание определения страховой суммы. Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "beneficiary"
          type: "string"
          presentation: "signal"
          risk_weight: "low"
          allowed_values: ["client", "forwarder", "not_specified", "not_defined"]
          description: "Выгодоприобретатель по страхованию груза. Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "cargo_insurance_summary"
          type: "string"
          presentation: "fact"
          label: "Страхование груза"
          description: >
            Краткое описание условий страхования груза: обязательность, кто страхует, покрытие и выгодоприобретатель. Fallback: "Не установлено" / "Не удалось определить".
          required: true
          display_in_grid: true
          display_priority: 1

        - name: "evidence"
          type: "array"
          presentation: "diagnostic"
          description: "Точные цитаты из договора, подтверждающие извлечённые значения."
          required: true
          display_in_grid: false

      store_payload: true

  - id: carrier_selection_approval
    name: "Механизм согласования выбора перевозчика"
    description: >
      Фактографическая проверка наличия процедуры согласования с клиентом
      перевозчика, критериев выбора, раскрытия аффилированности
      и права клиента на вето.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "согласование перевозчика"
        - "выбор перевозчика"
        - "критерии выбора"
        - "критерии выбора перевозчика"
        - "аффилированность"
        - "право вето"
        - "отклонить перевозчика"
        - "финансовая устойчивость перевозчика"
        - "информация о перевозчике"
        - "привлечение перевозчика"
        - "согласование привлечения перевозчика"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)согласован(ие|ия)\\s+перевозчик"
        - "(?i)выбор\\s+перевозчик"
        - "(?i)критери(и|ев)\\s+выбор"
        - "(?i)отклонить\\s+перевозчик"
        - "(?i)аффилированн"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор транспортной экспедиции (ст. 801 ГК РФ).

        Проверяется только один вопрос: механизм согласования выбора перевозчика.

        Нормативный ориентир:
        - ст. 801 ГК РФ.

        Важно:
        - Твоя задача — не оценивать серьёзность риска.
        - Только установить, что прямо есть в тексте договора, а чего прямо нет.
        - По ст. 801 ГК РФ экспедитор по умолчанию вправе привлекать третьих лиц
          для исполнения обязательств, если договор не предусматривает личное исполнение.
          Согласование выбора конкретного перевозчика с клиентом не является
          обязательным по умолчанию. Фиксируй его только если прямо указано.
        - Не путай согласование выбора перевозчика с общей ответственностью
          экспедитора за действия третьих лиц.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Требуется ли согласование выбора перевозчика с клиентом.
        2. Указаны ли критерии выбора перевозчика.
        3. Предусмотрено ли раскрытие аффилированности экспедитора с перевозчиком.
        4. Есть ли у клиента право вето на предложенного перевозчика.
        5. Сформируй краткое пользовательское резюме для поля carrier_selection_summary.
        6. Собери точные цитаты в evidence.

        [ПРАВИЛА]
        1. Используй только предоставленный текст договора.
        2. Если данные отсутствуют:
           - для статусных и перечислимых полей используй "not_defined";
           - для видимого текстового поля используй "Не установлено".
        3. Не используй null, None, пустые строки.
        4. Если текст есть, но надёжный вывод сделать нельзя:
           - для статусных и перечислимых полей используй "not_defined";
           - для видимого текстового поля используй "Не удалось определить".
        5. Если договор прямо указывает, что экспедитор выбирает перевозчика самостоятельно без согласования, используй:
           - carrier_approval_required = "no";
           - carrier_selection_summary = "Экспедитор выбирает перевозчика самостоятельно".
        6. Не считай согласование обязательным по умолчанию. Фиксируй обязательность только если прямо указано «согласовывает с Клиентом», «с согласия Клиента» или эквивалент.
        7. Не путай согласование выбора перевозчика с общей ответственностью экспедитора за действия третьих лиц.
        8. Верни РОВНО один JSON-объект со всеми 6 ключами без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.
        9. В evidence включай только точные цитаты из документа. Если данных нет, верни пустой массив [].
        10. Поле carrier_selection_summary должно быть кратким и не должно содержать длинных цитат.

        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1 — согласование с критериями, раскрытием аффилированности и правом вето:
        Фрагмент:
        "Экспедитор согласовывает выбор перевозчика с Клиентом до заключения договора перевозки. Критерии выбора: наличие лицензии, страхование ответственности, опыт перевозок. Экспедитор раскрывает аффилированность с перевозчиком. Клиент вправе отклонить предложенного перевозчика."
        Ответ:
        {
          "carrier_approval_required": "yes",
          "selection_criteria_specified": "yes",
          "affiliation_disclosure": "yes",
          "client_veto_right": "yes",
          "carrier_selection_summary": "Выбор перевозчика согласовывается с Клиентом; указаны критерии выбора; раскрывается аффилированность; у Клиента есть право вето",
          "evidence": [
            {
              "clause_ref": "п. 4.2",
              "quote": "Экспедитор согласовывает выбор перевозчика с Клиентом до заключения договора перевозки. Критерии выбора: наличие лицензии, страхование ответственности, опыт перевозок. Экспедитор раскрывает аффилированность с перевозчиком. Клиент вправе отклонить предложенного перевозчика."
            }
          ]
        }

        Пример 2 — экспедитор выбирает перевозчика самостоятельно:
        Фрагмент:
        "Экспедитор самостоятельно выбирает перевозчика."
        Ответ:
        {
          "carrier_approval_required": "no",
          "selection_criteria_specified": "not_defined",
          "affiliation_disclosure": "not_defined",
          "client_veto_right": "not_defined",
          "carrier_selection_summary": "Экспедитор выбирает перевозчика самостоятельно",
          "evidence": [
            {
              "clause_ref": "п. 4.2",
              "quote": "Экспедитор самостоятельно выбирает перевозчика."
            }
          ]
        }

        Пример 3 — текст есть, но надёжный вывод сделать нельзя:
        Фрагмент:
        "Экспедитор привлекает перевозчиков с учётом мнения Клиента, при этом порядок такого учёта определяется сторонами дополнительно."
        Ответ:
        {
          "carrier_approval_required": "not_defined",
          "selection_criteria_specified": "not_defined",
          "affiliation_disclosure": "not_defined",
          "client_veto_right": "not_defined",
          "carrier_selection_summary": "Не удалось определить",
          "evidence": [
            {
              "clause_ref": "п. 4.5",
              "quote": "Экспедитор привлекает перевозчиков с учётом мнения Клиента, при этом порядок такого учёта определяется сторонами дополнительно."
            }
          ]
        }

        Пример 4 — условие отсутствует:
        Фрагмент:
        "Экспедитор организует перевозку груза."
        Ответ:
        {
          "carrier_approval_required": "not_defined",
          "selection_criteria_specified": "not_defined",
          "affiliation_disclosure": "not_defined",
          "client_veto_right": "not_defined",
          "carrier_selection_summary": "Не установлено",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Требуется ли согласование выбора перевозчика или экспедитор выбирает самостоятельно?
        2. Не присвоено ли согласование по умолчанию, если оно прямо не указано?
        3. Указаны ли конкретные критерии выбора?
        4. Есть ли раскрытие аффилированности?
        5. Есть ли право вето у клиента?
        6. Если текст есть, но вывод невозможен, использовано ли "Не удалось определить"?
        7. Все ли 6 ключей присутствуют в ответе?
        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь РОВНО одним JSON-объектом без какого-либо дополнительного текста до или после, со всеми 6 ключами:
        {
          "carrier_approval_required": "<yes / no / not_defined>",
          "selection_criteria_specified": "<yes / no / not_defined>",
          "affiliation_disclosure": "<yes / no / not_defined>",
          "client_veto_right": "<yes / no / not_defined>",
          "carrier_selection_summary": "<краткое резюме или 'Не установлено' / 'Экспедитор выбирает перевозчика самостоятельно' / 'Не удалось определить'>",
          "evidence": [{"clause_ref": "<пункт или раздел>", "quote": "<точная цитата>"}]
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 700

    retrieval:
      retrieval_profile: "consent_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "согласование перевозчика выбор перевозчика критерии выбора перевозчика аффилированность право вето отклонить перевозчика информация о перевозчике привлечение перевозчика"
      boost_keywords:
        - "согласование перевозчика"
        - "выбор перевозчика"
        - "критерии выбора"
        - "аффилированность"
        - "право вето"
        - "отклонить перевозчика"
        - "информация о перевозчике"
        - "привлечение перевозчика"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - procedures
        - obligations
      negative_keywords:
        - "ответственность за третьих лиц"
        - "удержание"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.20, 0.70]
        boost: 0.12
        scope: segment
      context_k: 6
      max_chunks: 8
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types: []
      preferred_clause_functions:
        - "procedures"
        - "obligations"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 30
      max_snippet_length: 500

    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false
      llm_max_tokens: 900

      presence_signal:
        field: "carrier_selection_approval_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из договора транспортной экспедиции
        сведения о механизме согласования выбора перевозчика: требуется ли
        согласование, критерии выбора, раскрытие аффилированности и право
        клиента на вето.

        Не анализируй общую ответственность экспедитора за третьих лиц,
        оплату, претензии и иные темы, если они не содержат сведений о
        механизме выбора перевозчика.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. carrier_selection_approval_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если carrier_approval_required = "yes" или "no";
           - "missing" — если carrier_approval_required = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - carrier_approval_required = "not_defined";
           - selection_criteria_specified = "not_defined";
           - affiliation_disclosure = "not_defined";
           - client_veto_right = "not_defined";
           - carrier_selection_summary = "Не установлено";
           - не выполняй остальные шаги.

        1. carrier_approval_required — требуется ли согласование выбора перевозчика:
           "yes", "no" или "not_defined".
        2. selection_criteria_specified — указаны ли критерии выбора перевозчика:
           "yes", "no" или "not_defined".
        3. affiliation_disclosure — предусмотрено ли раскрытие аффилированности:
           "yes", "no" или "not_defined".
        4. client_veto_right — есть ли у клиента право вето на перевозчика:
           "yes", "no" или "not_defined".
        5. carrier_selection_summary — краткое пользовательское резюме.
        6. evidence — массив точных цитат из договора.

        Правила заполнения:
        - Для carrier_approval_required: "yes", если прямо указано, что выбор перевозчика согласовывается с клиентом; "no", если прямо указано, что экспедитор выбирает перевозчика самостоятельно; "not_defined", если условие отсутствует или вывод невозможен.
        - Для selection_criteria_specified: "yes", если указаны конкретные критерии выбора перевозчика; "no", если прямо указано, что критерии не устанавливаются; "not_defined", если критерии не упомянуты.
        - Для affiliation_disclosure: "yes", если предусмотрено раскрытие аффилированности экспедитора с перевозчиком; "no", если прямо указано, что раскрытие не требуется; "not_defined", если условие отсутствует.
        - Для client_veto_right: "yes", если у клиента есть право отклонить предложенного перевозчика; "no", если прямо указано, что такого права нет; "not_defined", если условие отсутствует.
        - Для carrier_selection_summary: если согласование и детали указаны, верни краткий факт; если экспедитор выбирает самостоятельно, верни "Экспедитор выбирает перевозчика самостоятельно"; если условие отсутствует, верни "Не установлено"; если текст есть, но надёжный вывод сделать нельзя, верни "Не удалось определить".
        - Не считай согласование обязательным по умолчанию. По ст. 801 ГК РФ экспедитор вправе привлекать третьих лиц, если договор не предусматривает личное исполнение. Фиксируй согласование только если оно прямо указано.
        - Если данных нет, верни пустой массив [] для evidence.
        </task>

        <context_rules>
        - Перед остальными полями заполни carrier_selection_approval_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined", carrier_selection_summary = "Не установлено".
        - Используй только предоставленный контекст.
        - Не выдумывай критерии выбора, раскрытие аффилированности и право вето.
        - Не присваивай согласование по умолчанию, если оно прямо не указано.
        - Не путай согласование выбора перевозчика с общей ответственностью экспедитора за действия третьих лиц.
        - Если фрагменты конфликтуют и не позволяют сделать надёжный вывод, верни "Не удалось определить" для carrier_selection_summary и включи конфликтующие цитаты в evidence.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет упоминания механизма согласования выбора перевозчика.
           → presence = "missing";
             carrier_approval_required = "not_defined";
             carrier_selection_summary = "Не установлено".

        2. Неполное раскрытие темы.
           Упомянуто, что экспедитор выбирает перевозчика, но критерии, аффилированность и право вето не указаны.
           → presence = "present";
             carrier_approval_required = "no" (или "yes", если указано согласование без деталей);
             соответствующие детали = "not_defined";
             carrier_selection_summary = "Экспедитор выбирает перевозчика самостоятельно" (или аналогично).

        3. Противоречие между фрагментами.
           В разных частях договора указаны разные условия согласования или права вето.
           → presence = "unclear";
             carrier_selection_summary = "Не удалось определить".

        4. Прямое исключение.
           В договоре прямо указано, что экспедитор выбирает перевозчика самостоятельно без согласования.
           → presence = "present";
             carrier_approval_required = "no";
             carrier_selection_summary = "Экспедитор выбирает перевозчика самостоятельно".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для carrier_selection_approval_presence используй только: "present", "missing", "unclear".
        - Для статусных enum-полей используй только: "yes", "no", "not_defined".
        - Fallback при отсутствии данных:
          * carrier_selection_summary → "Не установлено".
        - Fallback при противоречии или неоднозначности:
          * carrier_selection_summary → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "carrier_selection_approval_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования о согласовании выбора перевозчика. Внутреннее агрегатное signal-поле."
          required: true

        - name: "carrier_approval_required"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Требуется ли согласование выбора перевозчика с клиентом. Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "selection_criteria_specified"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Указаны ли критерии выбора перевозчика. Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "affiliation_disclosure"
          type: "string"
          presentation: "signal"
          risk_weight: "low"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Раскрытие аффилированности экспедитора с перевозчиком. Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "client_veto_right"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Право клиента отклонить предложенного перевозчика. Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "carrier_selection_summary"
          type: "string"
          presentation: "fact"
          label: "Согласование выбора перевозчика"
          description: >
            Краткое описание механизма согласования выбора перевозчика: согласование, критерии, аффилированность, право вето. Fallback: "Не установлено" / "Не удалось определить".
          required: true
          display_in_grid: true
          display_priority: 1

        - name: "evidence"
          type: "array"
          presentation: "diagnostic"
          description: "Точные цитаты из договора, подтверждающие извлечённые значения."
          required: true
          display_in_grid: false

      store_payload: true

  - id: customs_liability_allocation
    name: "Таможенное оформление: распределение ответственности (ТК ЕАЭС)"
    description: >
      Фактографическая проверка распределения ответственности за таможенное
      оформление, подтверждение статуса таможенного представителя, штрафы
      таможенных органов и ответственность за недостоверные данные клиента.
    triggers:
      any: ["customs_clearance_service"]
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "таможенное оформление"
        - "таможенный брокер"
        - "таможенный представитель"
        - "таможенная очистка"
        - "ответственность за таможенные нарушения"
        - "штрафы таможенных органов"
        - "таможенная декларация"
        - "достоверность сведений"
        - "сертификаты соответствия"
        - "реестр таможенных представителей"
        - "таможенные платежи"
        - "недостоверные сведения"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)таможенн(ое|ого)\\s+оформлени"
        - "(?i)таможенн(ый|ого)\\s+(брокер|представител)"
        - "(?i)штраф(ы|ов)\\s+таможенн"
        - "(?i)реестр.*таможенн.*представител"
        - "(?i)достоверност.*сведен"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор транспортной экспедиции с таможенным оформлением
        (ТК ЕАЭС, ст. 404–406).

        Проверяется только один вопрос: распределение ответственности
        за таможенное оформление и статус таможенного представителя.

        Нормативный ориентир:
        - ТК ЕАЭС (ст. 404–406).

        Важно:
        - Твоя задача — не оценивать серьёзность риска.
        - Только установить, что прямо есть в тексте договора, а чего прямо нет.
        - Таможенное оформление вправе осуществлять только таможенные
          представители, включённые в реестр (ст. 404 ТК ЕАЭС).
        - Не считай таможенное оформление включённым в услуги по умолчанию.
          Фиксируй его только если прямо указано в тексте.
        - Не путай ответственность за таможенные штрафы с общей ответственностью
          экспедитора за действия третьих лиц (перевозчиков).

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Включено ли таможенное оформление в услуги экспедитора.
        2. Подтверждён ли статус таможенного представителя (включение в реестр, свидетельство).
        3. Распределена ли ответственность за таможенные штрафы между клиентом и экспедитором.
        4. Определена ли ответственность за недостоверные данные, предоставленные для таможенного оформления.
        5. Сформируй краткое пользовательское резюме для поля customs_liability_summary.
        6. Собери точные цитаты в evidence.

        [ПРАВИЛА]
        1. Используй только предоставленный текст договора.
        2. Если данные отсутствуют:
           - для статусных и перечислимых полей используй "not_defined";
           - для видимого текстового поля используй "Не установлено".
        3. Не используй null, None, пустые строки.
        4. Если текст есть, но надёжный вывод сделать нельзя:
           - для статусных и перечислимых полей используй "not_defined";
           - для видимого текстового поля используй "Не удалось определить".
        5. Если договор прямо указывает, что таможенное оформление не входит в услуги экспедитора, используй:
           - customs_service_included = "no";
           - customs_liability_summary = "Не предусмотрено".
        6. Не считай таможенное оформление включённым в услуги по умолчанию. Фиксируй только если прямо указано.
        7. Не присваивай статус таможенного представителя "confirmed", если упомянут только «таможенный брокер» без подтверждения включения в реестр или наличия свидетельства.
        8. Не путай ответственность за таможенные штрафы с общей ответственностью экспедитора за действия третьих лиц.
        9. Верни РОВНО один JSON-объект со всеми 7 ключами без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.
        10. В evidence включай только точные цитаты из документа. Если данных нет, верни пустой массив [].
        11. Поле customs_liability_summary должно быть кратким и не должно содержать длинных цитат.

        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1 — оформление включено, статус подтверждён, ответственность распределена:
        Фрагмент:
        "Экспедитор осуществляет таможенное оформление как таможенный представитель, включённый в реестр (свидетельство № 456). Клиент несёт ответственность за достоверность сведений, предоставленных для таможенного оформления. Штрафы таможенных органов, возникшие по вине Клиента, возмещаются Клиентом."
        Ответ:
        {
          "customs_service_included": "yes",
          "customs_broker_status": "confirmed",
          "customs_liability_client": "yes",
          "customs_liability_forwarder": "not_defined",
          "false_data_liability": "client",
          "customs_liability_summary": "Экспедитор осуществляет таможенное оформление как таможенный представитель из реестра; клиент отвечает за достоверность сведений и штрафы по своей вине",
          "evidence": [
            {
              "clause_ref": "п. 5.3",
              "quote": "Экспедитор осуществляет таможенное оформление как таможенный представитель, включённый в реестр (свидетельство № 456). Клиент несёт ответственность за достоверность сведений, предоставленных для таможенного оформления. Штрафы таможенных органов, возникшие по вине Клиента, возмещаются Клиентом."
            }
          ]
        }

        Пример 2 — оформление включено, но статус представителя не подтверждён:
        Фрагмент:
        "Экспедитор оказывает услуги таможенного оформления."
        Ответ:
        {
          "customs_service_included": "yes",
          "customs_broker_status": "not_confirmed",
          "customs_liability_client": "not_defined",
          "customs_liability_forwarder": "not_defined",
          "false_data_liability": "not_defined",
          "customs_liability_summary": "Таможенное оформление включено в услуги; статус таможенного представителя не подтверждён",
          "evidence": [
            {
              "clause_ref": "п. 5.3",
              "quote": "Экспедитор оказывает услуги таможенного оформления."
            }
          ]
        }

        Пример 3 — текст есть, но надёжный вывод сделать нельзя:
        Фрагмент:
        "Вопросы таможенного оформления решаются сторонами дополнительно, ответственность за таможенные платежи распределяется в порядке, определяемом соглашением сторон."
        Ответ:
        {
          "customs_service_included": "not_defined",
          "customs_broker_status": "not_defined",
          "customs_liability_client": "not_defined",
          "customs_liability_forwarder": "not_defined",
          "false_data_liability": "not_specified",
          "customs_liability_summary": "Не удалось определить",
          "evidence": [
            {
              "clause_ref": "п. 5.7",
              "quote": "Вопросы таможенного оформления решаются сторонами дополнительно, ответственность за таможенные платежи распределяется в порядке, определяемом соглашением сторон."
            }
          ]
        }

        Пример 4 — условие отсутствует:
        Фрагмент:
        "Экспедитор организует перевозку груза."
        Ответ:
        {
          "customs_service_included": "not_defined",
          "customs_broker_status": "not_defined",
          "customs_liability_client": "not_defined",
          "customs_liability_forwarder": "not_defined",
          "false_data_liability": "not_defined",
          "customs_liability_summary": "Не установлено",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Включено ли таможенное оформление в услуги, а не присвоено ли по умолчанию?
        2. Подтверждён ли статус таможенного представителя реестром или свидетельством?
        3. Не присвоен ли статус "confirmed" только по упоминанию «таможенный брокер» без реестра?
        4. Распределена ли ответственность за таможенные штрафы?
        5. Определена ли ответственность за недостоверные данные?
        6. Не смешана ли ответственность за таможенные штрафы с общей ответственностью за третьих лиц?
        7. Если текст есть, но вывод невозможен, использовано ли "Не удалось определить"?
        8. Все ли 7 ключей присутствуют в ответе?
        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь РОВНО одним JSON-объектом без какого-либо дополнительного текста до или после, со всеми 7 ключами:
        {
          "customs_service_included": "<yes / no / not_defined>",
          "customs_broker_status": "<confirmed / not_confirmed / not_defined>",
          "customs_liability_client": "<yes / no / not_defined>",
          "customs_liability_forwarder": "<yes / no / not_defined>",
          "false_data_liability": "<client / forwarder / not_specified / not_defined>",
          "customs_liability_summary": "<краткое резюме или 'Не установлено' / 'Не предусмотрено' / 'Не удалось определить'>",
          "evidence": [{"clause_ref": "<пункт или раздел>", "quote": "<точная цитата>"}]
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 700

    retrieval:
      retrieval_profile: "registration_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "таможенное оформление таможенный брокер таможенный представитель реестр таможенных представителей штрафы таможенных органов ответственность за таможенные нарушения достоверность сведений таможенная декларация недостоверные сведения таможенные платежи сертификаты соответствия"
      boost_keywords:
        - "таможенное оформление"
        - "таможенный брокер"
        - "таможенный представитель"
        - "реестр таможенных представителей"
        - "штрафы таможенных органов"
        - "достоверность сведений"
        - "таможенная декларация"
        - "таможенные платежи"
        - "недостоверные сведения"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - representations
      negative_keywords:
        - "страхование груза"
        - "удержание"
        - "форс-мажор"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.20, 0.75]
        boost: 0.15
        scope: segment
      context_k: 6
      max_chunks: 8
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types: []
      preferred_clause_functions:
        - "obligations"
        - "representations"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.12

    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 600

    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false
      llm_max_tokens: 900

      presence_signal:
        field: "customs_liability_allocation_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из договора транспортной экспедиции
        сведения о таможенном оформлении: включено ли оно в услуги, статус
        таможенного представителя, распределение ответственности за таможенные
        штрафы и за недостоверные данные клиента.

        Не анализируй страхование груза, удержание, претензии и иные темы,
        если они не содержат сведений о таможенном оформлении.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. customs_liability_allocation_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если customs_service_included = "yes" или "no";
           - "missing" — если customs_service_included = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - customs_service_included = "not_defined";
           - customs_broker_status = "not_defined";
           - customs_liability_client = "not_defined";
           - customs_liability_forwarder = "not_defined";
           - false_data_liability = "not_defined";
           - customs_liability_summary = "Не установлено";
           - не выполняй остальные шаги.

        1. customs_service_included — включено ли таможенное оформление в услуги:
           "yes", "no" или "not_defined".
        2. customs_broker_status — подтверждён ли статус таможенного представителя:
           "confirmed", "not_confirmed" или "not_defined".
        3. customs_liability_client — несёт ли клиент ответственность за таможенные штрафы:
           "yes", "no" или "not_defined".
        4. customs_liability_forwarder — несёт ли экспедитор ответственность за таможенные штрафы:
           "yes", "no" или "not_defined".
        5. false_data_liability — кто несёт ответственность за недостоверные данные:
           "client", "forwarder", "not_specified" или "not_defined".
        6. customs_liability_summary — краткое пользовательское резюме.
        7. evidence — массив точных цитат из договора.

        Правила заполнения:
        - Для customs_service_included: "yes", если прямо указано в услугах; "no", если прямо указано, что не входит; "not_defined", если отсутствует.
        - Для customs_broker_status: "confirmed", если прямо указано включение в реестр или наличие свидетельства; "not_confirmed", если упомянуто, но не подтверждено; "not_defined", если отсутствует.
        - Для customs_liability_client/forwarder: "yes" или "no" при прямом указании; "not_defined", если отсутствует.
        - Для false_data_liability: "client" или "forwarder" при прямом указании; "not_specified", если тема упомянута, но ответственный не указан; "not_defined", если отсутствует.
        - Для customs_liability_summary: если оформление включено, статус подтверждён и ответственность распределена, верни краткий факт; если включено, но статус не подтверждён, верни "Таможенное оформление включено в услуги; статус таможенного представителя не подтверждён"; если прямо исключено, верни "Не предусмотрено"; если отсутствует, верни "Не установлено"; если вывод невозможен, верни "Не удалось определить".
        - Не присваивай статус "confirmed" только по упоминанию «таможенный брокер» без подтверждения включения в реестр.
        - Если данных нет, верни пустой массив [] для evidence.
        </task>

        <context_rules>
        - Перед остальными полями заполни customs_liability_allocation_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined", customs_liability_summary = "Не установлено".
        - Используй только предоставленный контекст.
        - Не выдумывай статус таможенного представителя, распределение ответственности и ответственного за недостоверные данные.
        - Не считай таможенное оформление включённым в услуги по умолчанию.
        - Не присваивай статус "confirmed" без прямого подтверждения реестра или свидетельства.
        - Не путай ответственность за таможенные штрафы с общей ответственностью экспедитора за действия третьих лиц.
        - Если фрагменты конфликтуют и не позволяют сделать надёжный вывод, верни "Не удалось определить" для customs_liability_summary и включи конфликтующие цитаты в evidence.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет упоминания таможенного оформления.
           → presence = "missing";
             customs_service_included = "not_defined";
             customs_liability_summary = "Не установлено".

        2. Неполное раскрытие темы.
           Таможенное оформление включено, но статус представителя не подтверждён или ответственность не распределена.
           → presence = "present";
             customs_service_included = "yes";
             соответствующие детали = "not_confirmed" или "not_defined";
             customs_liability_summary = "Таможенное оформление включено в услуги; статус таможенного представителя не подтверждён".

        3. Противоречие между фрагментами.
           В разных частях договора указаны разные условия распределения ответственности за штрафы.
           → presence = "unclear";
             customs_liability_summary = "Не удалось определить".

        4. Прямое исключение.
           В договоре прямо указано, что таможенное оформление не входит в услуги экспедитора.
           → presence = "present";
             customs_service_included = "no";
             customs_liability_summary = "Не предусмотрено".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для customs_liability_allocation_presence используй только: "present", "missing", "unclear".
        - Для статусных enum-полей используй только допустимые значения из списка.
        - Fallback при отсутствии данных:
          * customs_liability_summary → "Не установлено".
        - Fallback при противоречии или неоднозначности:
          * customs_liability_summary → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "customs_liability_allocation_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
