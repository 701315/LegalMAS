        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. limitation_period_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если limitation_period_mentioned = "yes" или "no";
           - "missing" — если limitation_period_mentioned = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - limitation_period_mentioned = "not_defined";
           - limitation_period_value = "Не установлено";
           - limitation_period_summary = "Не установлено";
           - не выполняй остальные шаги.

        1. limitation_period_mentioned — упомянут ли срок исковой давности:
           "yes", "no" или "not_defined".
        2. limitation_period_value — конкретное значение срока.
        3. limitation_period_summary — краткое пользовательское резюме.
        4. evidence — массив точных цитат из договора.

        Правила заполнения:
        - Для limitation_period_mentioned: "yes", если срок исковой давности прямо упомянут; "no", если прямо указано, что срок не устанавливается или применяется общий срок по закону; "not_defined", если отсутствует.
        - Для limitation_period_value: если значение указано (1 год, 12 месяцев, иной срок), верни его кратко; если не указано, верни "Не установлено".
        - Для limitation_period_summary: если срок указан, верни краткий факт; если отсутствует, верни "Не установлено"; если вывод невозможен, верни "Не удалось определить".
        - Не выводи срок давности из закона. Фиксируй только если прямо указан в договоре.
        - Не путай срок исковой давности с претензионным сроком или сроком уведомления.
        - Если данных нет, верни пустой массив [] для evidence.
        </task>

        <context_rules>
        - Перед остальными полями заполни limitation_period_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — limitation_period_mentioned = "not_defined", limitation_period_summary = "Не установлено".
        - Используй только предоставленный контекст.
        - Не выводи срок давности из закона.
        - Не путай срок исковой давности с претензионным сроком или сроком уведомления.
        - Если фрагменты конфликтуют и не позволяют сделать надёжный вывод, верни "Не удалось определить" для limitation_period_summary и включи конфликтующие цитаты в evidence.
        </context_rules>

