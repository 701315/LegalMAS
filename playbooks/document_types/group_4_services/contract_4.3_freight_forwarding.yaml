    extraction:
      store_payload: true

      enabled: true
      mode: "hybrid"
      compact_output: false
      llm_max_tokens: 900
      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из договора транспортной экспедиции
        сведения о праве удержания груза экспедитором: наличие права, условия
        реализации, порядок реализации удержанного груза и распределение
        расходов на хранение.

        Не анализируй страхование, ответственность за третьих лиц, оплату,
        претензии и иные темы, если они не содержат сведений о праве удержания груза.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        1. lien_right_present — предусмотрено ли право удержания груза:
           "yes", "no" или "not_defined".
        2. lien_conditions — условия реализации права удержания.
        3. realization_procedure — указан ли порядок реализации удержанного груза:
           "yes", "no" или "not_defined".
        4. storage_cost_allocation — кто несёт расходы на хранение удержанного груза:
           "client", "forwarder", "not_specified" или "not_defined".
        5. lien_summary — краткое пользовательское резюме.
        6. evidence — массив точных цитат из договора.

        Правила заполнения:

        Для lien_right_present:
        - "yes", если право удержания груза прямо предусмотрено;
        - "no", если прямо указано, что право удержания не предусмотрено;
        - "not_defined", если условие отсутствует или вывод невозможен.

        Для lien_conditions:
        - если условия указаны, верни их кратко;
        - если условия не указаны, верни "Не установлено";
        - если текст есть, но вывод невозможен, верни "Не удалось определить".

        Для realization_procedure:
        - "yes", если порядок реализации удержанного груза указан;
        - "no", если прямо указано, что порядок реализации не устанавливается;
        - "not_defined", если порядок не упомянут.

        Для storage_cost_allocation:
        - "client", если расходы на хранение несёт клиент;
        - "forwarder", если расходы на хранение несёт экспедитор;
        - "not_specified", если тема хранения упомянута, но распределение не указано;
        - "not_defined", если условие отсутствует.

        Для lien_summary:
        - если право удержания и детали указаны, верни краткий факт;
        - если право есть, но детали не указаны, верни, например, "Право удержания предусмотрено; порядок реализации и расходы на хранение не указаны";
        - если право прямо исключено, верни "Не предусмотрено";
        - если условие отсутствует, верни "Не установлено";
        - если текст есть, но надёжный вывод сделать нельзя, верни "Не удалось определить".

        Не считай право удержания существующим по умолчанию. Фиксируй только если прямо указано.
        Не выводи право удержания из ст. 3 ФЗ-87 или ст. 359 ГК РФ — только из текста договора.
        Не путай право удержания груза с обеспечительным платежом, залогом или иными способами обеспечения.

        Если данных нет, верни пустой массив [] для evidence.
        </task>

        <context_rules>
        - Используй только предоставленный контекст.
        - Не выдумывай условия удержания, порядок реализации и распределение расходов на хранение.
        - Не считай право удержания существующим по умолчанию.
        - Не путай право удержания груза с обеспечительным платежом, залогом или иными способами обеспечения обязательств.
        - Если фрагменты конфликтуют и не позволяют сделать надёжный вывод, верни "Не удалось определить" для lien_summary и включи конфликтующие цитаты в evidence.
        </context_rules>

        <output_expectations>
        Все перечисленные ключи должны присутствовать в ответе, даже если значение равно "not_defined", "not_specified", "Не установлено", "Не предусмотрено", "Не удалось определить" или "Определяется по ...".

        Запрещено возвращать:
        - null;
        - None;
        - пустые строки;
        - пояснения до или после JSON;
        - Markdown;
        - код-фенсы;
        - списки вне JSON.

        Верни РОВНО один JSON-объект со всеми 6 ключами без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.
        </output_expectations>

      fields:
        - name: "lien_right_present"
          type: "string"
          presentation: "signal"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Наличие права удержания груза экспедитором."
          required: true
          display_in_grid: false

        - name: "lien_conditions"
          type: "string"
          presentation: "fact"
          label: "Условия удержания"
          description: "Условия реализации права удержания груза."
          required: true
          display_in_grid: false

        - name: "realization_procedure"
          type: "string"
          presentation: "signal"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Наличие порядка реализации удержанного груза."
          required: true
          display_in_grid: false

        - name: "storage_cost_allocation"
          type: "string"
          presentation: "signal"
          allowed_values: ["client", "forwarder", "not_specified", "not_defined"]
          description: "Распределение расходов на хранение удержанного груза."
          required: true
          display_in_grid: false

        - name: "lien_summary"
          type: "string"
          presentation: "fact"
          label: "Право удержания груза"
          description: "Краткое описание права удержания груза: наличие, условия, порядок реализации и расходы на хранение."
          required: true
          display_in_grid: true
          display_priority: 1

        - name: "evidence"
          type: "array"
          presentation: "diagnostic"
          description: "Точные цитаты из договора, подтверждающие извлечённые значения."
          required: true
          display_in_grid: false

  - id: unilateral_refusal_penalty
    name: "Односторонний отказ клиента: штраф 10% (ст. 806 ГК РФ, ст. 6 ФЗ-87)"
    description: >
      Фактографическая проверка наличия условия о праве клиента на односторонний
      отказ от договора транспортной экспедиции с уплатой штрафа 10% от стоимости
      услуг и возмещением фактических расходов, а также срока уведомления об отказе.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "односторонний отказ"
        - "отказ от договора"
        - "отказ от исполнения договора"
        - "штраф 10%"
        - "штраф в размере 10 процентов"
        - "штраф в размере десяти процентов"
        - "возмещение убытков"
        - "фактически понесённые расходы"
        - "фактически понесенные расходы"
        - "фактические расходы"
        - "ст. 806"
        - "ст. 6 ФЗ-87"
        - "уведомление об отказе"
        - "срок уведомления"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)односторонн[её]?[её]?\\s+отказ"
        - "(?i)штраф.*10\\s*%"
        - "(?i)штраф.*10\\s+процент"
        - "(?i)ст\\.?\\s*806|ст\\.?\\s*6.*ФЗ[\\s-]*87"
        - "(?i)фактически\\s+понес[её]нн"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор транспортной экспедиции (ст. 806 ГК РФ; ст. 6 ФЗ-87).

        Проверяется только один вопрос: право клиента на односторонний отказ
        от договора и связанные с ним штрафные санкции.

        Нормативный ориентир:
        - ст. 806 ГК РФ;
        - ст. 6 ФЗ-87 «О транспортно-экспедиционной деятельности».

        Важно:
        - Твоя задача — не оценивать серьёзность риска.
        - Только установить, что прямо есть в тексте договора, а чего прямо нет.
        - Не считай право клиента на односторонний отказ существующим по умолчанию.
          Фиксируй его только если прямо указано в тексте договора.
        - Не путай односторонний отказ клиента с расторжением по соглашению сторон
          или с односторонним отказом экспедитора.
        - Не присваивай штраф 10% по умолчанию, если размер штрафа не указан в тексте.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Упоминается ли право клиента на односторонний отказ от договора.
        2. Предусмотрен ли штраф 10% от стоимости услуг (или иной размер штрафа).
        3. Предусмотрено ли возмещение фактических расходов при отказе.
        4. Установлен ли срок уведомления об отказе.
        5. Сформируй краткое пользовательское резюме для поля unilateral_refusal_summary.
        6. Собери точные цитаты в evidence.

        [ПРАВИЛА]
        1. Используй только предоставленный текст договора.
        2. Если данные отсутствуют:
           - для статусных и перечислимых полей используй "not_defined";
           - для видимого текстового поля используй "Не установлено".
        3. Не используй null, None, пустые строки.
        4. Если текст есть, но надёжный вывод сделать нельзя:
           - для статусных и перечислимых полей используй "not_defined";
           - для видимого текстового поля используй "Не удалось определить".
        5. Если договор прямо указывает, что право клиента на односторонний отказ не предусмотрено, используй:
           - refusal_right_mentioned = "no";
           - unilateral_refusal_summary = "Не предусмотрено".
        6. Не считай право одностороннего отказа существующим по умолчанию. Фиксируй только если прямо указано.
        7. Не путай односторонний отказ клиента с расторжением по соглашению сторон или с односторонним отказом экспедитора.
        8. Для penalty_10_percent:
           - "yes", если штраф прямо указан в размере 10% от стоимости услуг;
           - "other", если указан иной размер штрафа;
           - "no", если прямо указано, что штраф не предусмотрен;
           - "not_defined", если штраф не упомянут.
        9. Верни РОВНО один JSON-объект со всеми 6 ключами без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.
        10. В evidence включай только точные цитаты из документа. Если данных нет, верни пустой массив [].
        11. Поле unilateral_refusal_summary должно быть кратким и не должно содержать длинных цитат.

        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1 — право отказа со штрафом 10%, возмещением расходов и сроком уведомления:
        Фрагмент:
        "Клиент вправе в одностороннем порядке отказаться от исполнения договора, уплатив Экспедитору штраф в размере 10% от стоимости услуг и возместив фактически понесённые расходы. Уведомление направляется за 5 рабочих дней."
        Ответ:
        {
          "refusal_right_mentioned": "yes",
          "penalty_10_percent": "yes",
          "expenses_reimbursement": "yes",
          "notice_period": "5 рабочих дней",
          "unilateral_refusal_summary": "Клиент вправе отказаться от договора; штраф 10% от стоимости услуг; возмещение фактических расходов; уведомление за 5 рабочих дней",
          "evidence": [
            {
              "clause_ref": "п. 8.1",
              "quote": "Клиент вправе в одностороннем порядке отказаться от исполнения договора, уплатив Экспедитору штраф в размере 10% от стоимости услуг и возместив фактически понесённые расходы. Уведомление направляется за 5 рабочих дней."
            }
          ]
        }

        Пример 2 — право отказа с иным размером штрафа:
        Фрагмент:
        "Клиент вправе отказаться от исполнения договора, уведомив Экспедитора за 10 рабочих дней и уплатив штраф в размере 15% от стоимости услуг."
        Ответ:
        {
          "refusal_right_mentioned": "yes",
          "penalty_10_percent": "other",
          "expenses_reimbursement": "not_defined",
          "notice_period": "10 рабочих дней",
          "unilateral_refusal_summary": "Клиент вправе отказаться от договора; штраф 15% от стоимости услуг; уведомление за 10 рабочих дней; возмещение фактических расходов не указано",
          "evidence": [
            {
              "clause_ref": "п. 8.2",
              "quote": "Клиент вправе отказаться от исполнения договора, уведомив Экспедитора за 10 рабочих дней и уплатив штраф в размере 15% от стоимости услуг."
            }
          ]
        }

        Пример 3 — текст есть, но надёжный вывод сделать нельзя:
        Фрагмент:
        "Договор может быть расторгнут в порядке, предусмотренном действующим законодательством, при соблюдении сторонами разумных сроков уведомления."
        Ответ:
        {
          "refusal_right_mentioned": "not_defined",
          "penalty_10_percent": "not_defined",
          "expenses_reimbursement": "not_defined",
          "notice_period": "Не удалось определить",
          "unilateral_refusal_summary": "Не удалось определить",
          "evidence": [
            {
              "clause_ref": "п. 8.3",
              "quote": "Договор может быть расторгнут в порядке, предусмотренном действующим законодательством, при соблюдении сторонами разумных сроков уведомления."
            }
          ]
        }

        Пример 4 — условие отсутствует:
        Фрагмент:
        "Договор может быть расторгнут по соглашению сторон."
        Ответ:
        {
          "refusal_right_mentioned": "not_defined",
          "penalty_10_percent": "not_defined",
          "expenses_reimbursement": "not_defined",
          "notice_period": "Не установлено",
          "unilateral_refusal_summary": "Не установлено",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Есть ли прямое право клиента на односторонний отказ, а не присвоено ли оно по умолчанию?
        2. Не смешан ли односторонний отказ клиента с расторжением по соглашению сторон?
        3. Не смешан ли односторонний отказ клиента с односторонним отказом экспедитора?
        4. Указан ли штраф 10% или иной размер?
        5. Не присвоен ли штраф 10% по умолчанию, если размер не указан?
        6. Предусмотрено ли возмещение фактических расходов?
        7. Установлен ли срок уведомления?
        8. Если текст есть, но вывод невозможен, использовано ли "Не удалось определить"?
        9. Все ли 6 ключей присутствуют в ответе?
        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь РОВНО одним JSON-объектом без какого-либо дополнительного текста до или после, со всеми 6 ключами:
        {
          "refusal_right_mentioned": "<yes / no / not_defined>",
          "penalty_10_percent": "<yes / no / other / not_defined>",
          "expenses_reimbursement": "<yes / no / not_defined>",
          "notice_period": "<срок уведомления или 'Не установлено' / 'Не удалось определить'>",
          "unilateral_refusal_summary": "<краткое резюме или 'Не установлено' / 'Не предусмотрено' / 'Не удалось определить'>",
          "evidence": [{"clause_ref": "<пункт или раздел>", "quote": "<точная цитата>"}]
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 700

    retrieval:
      retrieval_profile: "termination_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "односторонний отказ клиента отказ от исполнения договора штраф 10% штраф в размере 10 процентов возмещение убытков фактически понесённые расходы фактические расходы срок уведомления уведомление об отказе ст. 806 ст. 6 ФЗ-87"
      boost_keywords:
        - "односторонний отказ"
        - "отказ от договора"
        - "отказ от исполнения договора"
        - "штраф 10%"
        - "штраф в размере 10 процентов"
        - "фактически понесённые расходы"
        - "фактические расходы"
        - "срок уведомления"
        - "уведомление об отказе"
        - "ст. 806"
      preferred_unit_types:
        - termination_provision
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - remedies
        - procedures
      negative_keywords:
        - "форс-мажор"
        - "страхование"
        - "удержание"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.45, 0.90]
        boost: 0.15
        scope: segment
      context_k: 6
      max_chunks: 8
      rerank: true

    enrichment_hints:
