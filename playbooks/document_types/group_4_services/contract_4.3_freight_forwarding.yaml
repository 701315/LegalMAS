        }

        Пример 3 — текст есть, но надёжный вывод сделать нельзя:
        Фрагмент:
        "Вопросы таможенного оформления решаются сторонами дополнительно, ответственность за таможенные платежи распределяется в порядке, определяемом соглашением сторон."
        Ответ:
        {
          "customs_service_included": "not_defined",
          "customs_broker_status": "not_defined",
          "customs_liability_client": "not_defined",
          "customs_liability_forwarder": "not_defined",
          "false_data_liability": "not_specified",
          "customs_liability_summary": "Не удалось определить",
          "evidence": [
            {
              "clause_ref": "п. 5.7",
