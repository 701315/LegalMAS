    evidence:
      required: true
      min_snippet_length: 30
      max_snippet_length: 500

    extraction:
      store_payload: true

      enabled: true
      mode: "hybrid"
      compact_output: false
      llm_max_tokens: 900
      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из договора транспортной экспедиции
        сведения о механизме согласования выбора перевозчика: требуется ли
        согласование, критерии выбора, раскрытие аффилированности и право
        клиента на вето.

        Не анализируй общую ответственность экспедитора за третьих лиц,
        оплату, претензии и иные темы, если они не содержат сведений о
        механизме выбора перевозчика.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        1. carrier_approval_required — требуется ли согласование выбора перевозчика:
           "yes", "no" или "not_defined".
        2. selection_criteria_specified — указаны ли критерии выбора перевозчика:
           "yes", "no" или "not_defined".
        3. affiliation_disclosure — предусмотрено ли раскрытие аффилированности:
           "yes", "no" или "not_defined".
        4. client_veto_right — есть ли у клиента право вето на перевозчика:
           "yes", "no" или "not_defined".
        5. carrier_selection_summary — краткое пользовательское резюме.
        6. evidence — массив точных цитат из договора.

        Правила заполнения:

        Для carrier_approval_required:
        - "yes", если прямо указано, что выбор перевозчика согласовывается с клиентом;
        - "no", если прямо указано, что экспедитор выбирает перевозчика самостоятельно;
        - "not_defined", если условие отсутствует или вывод невозможен.

        Для selection_criteria_specified:
        - "yes", если указаны конкретные критерии выбора перевозчика;
        - "no", если прямо указано, что критерии не устанавливаются;
        - "not_defined", если критерии не упомянуты.

        Для affiliation_disclosure:
        - "yes", если предусмотрено раскрытие аффилированности экспедитора с перевозчиком;
        - "no", если прямо указано, что раскрытие не требуется;
        - "not_defined", если условие отсутствует.

        Для client_veto_right:
        - "yes", если у клиента есть право отклонить предложенного перевозчика;
        - "no", если прямо указано, что такого права нет;
        - "not_defined", если условие отсутствует.

        Для carrier_selection_summary:
        - если согласование и детали указаны, верни краткий факт;
        - если экспедитор выбирает самостоятельно, верни "Экспедитор выбирает перевозчика самостоятельно";
        - если условие отсутствует, верни "Не установлено";
        - если текст есть, но надёжный вывод сделать нельзя, верни "Не удалось определить".

        Не считай согласование обязательным по умолчанию. По ст. 801 ГК РФ
        экспедитор вправе привлекать третьих лиц, если договор не предусматривает
        личное исполнение. Фиксируй согласование только если оно прямо указано.

        Если данных нет, верни пустой массив [] для evidence.
        </task>

        <context_rules>
        - Используй только предоставленный контекст.
        - Не выдумывай критерии выбора, раскрытие аффилированности и право вето.
        - Не присваивай согласование по умолчанию, если оно прямо не указано.
        - Не путай согласование выбора перевозчика с общей ответственностью экспедитора за действия третьих лиц.
        - Если фрагменты конфликтуют и не позволяют сделать надёжный вывод, верни "Не удалось определить" для carrier_selection_summary и включи конфликтующие цитаты в evidence.
        </context_rules>

        <output_expectations>
        Все перечисленные ключи должны присутствовать в ответе, даже если значение равно "not_defined", "Не установлено", "Экспедитор выбирает перевозчика самостоятельно", "Не удалось определить" или "Определяется по ...".

        Запрещено возвращать:
        - null;
        - None;
        - пустые строки;
        - пояснения до или после JSON;
        - Markdown;
        - код-фенсы;
        - списки вне JSON.

        Верни РОВНО один JSON-объект со всеми 6 ключами без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.
        </output_expectations>

      fields:
        - name: "carrier_approval_required"
          type: "string"
          presentation: "signal"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Требуется ли согласование выбора перевозчика с клиентом."
          required: true
          display_in_grid: false

        - name: "selection_criteria_specified"
          type: "string"
          presentation: "signal"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Указаны ли критерии выбора перевозчика."
          required: true
          display_in_grid: false

        - name: "affiliation_disclosure"
          type: "string"
          presentation: "signal"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Раскрытие аффилированности экспедитора с перевозчиком."
          required: true
          display_in_grid: false

        - name: "client_veto_right"
          type: "string"
          presentation: "signal"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Право клиента отклонить предложенного перевозчика."
          required: true
          display_in_grid: false

        - name: "carrier_selection_summary"
          type: "string"
          presentation: "fact"
          label: "Согласование выбора перевозчика"
          description: "Краткое описание механизма согласования выбора перевозчика: согласование, критерии, аффилированность, право вето."
          required: true
          display_in_grid: true
          display_priority: 1

        - name: "evidence"
          type: "array"
          presentation: "diagnostic"
          description: "Точные цитаты из договора, подтверждающие извлечённые значения."
          required: true
          display_in_grid: false

  - id: customs_liability_allocation
    name: "Таможенное оформление: распределение ответственности (ТК ЕАЭС)"
    description: >
      Фактографическая проверка распределения ответственности за таможенное
      оформление, подтверждение статуса таможенного представителя, штрафы
      таможенных органов и ответственность за недостоверные данные клиента.
    triggers:
      any: ["customs_clearance_service"]
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "таможенное оформление"
        - "таможенный брокер"
        - "таможенный представитель"
        - "таможенная очистка"
        - "ответственность за таможенные нарушения"
        - "штрафы таможенных органов"
        - "таможенная декларация"
        - "достоверность сведений"
        - "сертификаты соответствия"
        - "реестр таможенных представителей"
        - "таможенные платежи"
        - "недостоверные сведения"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)таможенн(ое|ого)\\s+оформлени"
        - "(?i)таможенн(ый|ого)\\s+(брокер|представител)"
        - "(?i)штраф(ы|ов)\\s+таможенн"
        - "(?i)реестр.*таможенн.*представител"
        - "(?i)достоверност.*сведен"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор транспортной экспедиции с таможенным оформлением
        (ТК ЕАЭС, ст. 404–406).

        Проверяется только один вопрос: распределение ответственности
        за таможенное оформление и статус таможенного представителя.

        Нормативный ориентир:
        - ТК ЕАЭС (ст. 404–406).

        Важно:
        - Твоя задача — не оценивать серьёзность риска.
        - Только установить, что прямо есть в тексте договора, а чего прямо нет.
        - Таможенное оформление вправе осуществлять только таможенные
          представители, включённые в реестр (ст. 404 ТК ЕАЭС).
        - Не считай таможенное оформление включённым в услуги по умолчанию.
          Фиксируй его только если прямо указано в тексте.
        - Не путай ответственность за таможенные штрафы с общей ответственностью
          экспедитора за действия третьих лиц (перевозчиков).

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Включено ли таможенное оформление в услуги экспедитора.
        2. Подтверждён ли статус таможенного представителя (включение в реестр, свидетельство).
        3. Распределена ли ответственность за таможенные штрафы между клиентом и экспедитором.
        4. Определена ли ответственность за недостоверные данные, предоставленные для таможенного оформления.
        5. Сформируй краткое пользовательское резюме для поля customs_liability_summary.
        6. Собери точные цитаты в evidence.

        [ПРАВИЛА]
        1. Используй только предоставленный текст договора.
        2. Если данные отсутствуют:
           - для статусных и перечислимых полей используй "not_defined";
           - для видимого текстового поля используй "Не установлено".
        3. Не используй null, None, пустые строки.
        4. Если текст есть, но надёжный вывод сделать нельзя:
           - для статусных и перечислимых полей используй "not_defined";
           - для видимого текстового поля используй "Не удалось определить".
        5. Если договор прямо указывает, что таможенное оформление не входит в услуги экспедитора, используй:
           - customs_service_included = "no";
           - customs_liability_summary = "Не предусмотрено".
        6. Не считай таможенное оформление включённым в услуги по умолчанию. Фиксируй только если прямо указано.
        7. Не присваивай статус таможенного представителя "confirmed", если упомянут только «таможенный брокер» без подтверждения включения в реестр или наличия свидетельства.
        8. Не путай ответственность за таможенные штрафы с общей ответственностью экспедитора за действия третьих лиц.
        9. Верни РОВНО один JSON-объект со всеми 7 ключами без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.
        10. В evidence включай только точные цитаты из документа. Если данных нет, верни пустой массив [].
        11. Поле customs_liability_summary должно быть кратким и не должно содержать длинных цитат.

        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1 — оформление включено, статус подтверждён, ответственность распределена:
        Фрагмент:
        "Экспедитор осуществляет таможенное оформление как таможенный представитель, включённый в реестр (свидетельство № 456). Клиент несёт ответственность за достоверность сведений, предоставленных для таможенного оформления. Штрафы таможенных органов, возникшие по вине Клиента, возмещаются Клиентом."
        Ответ:
        {
          "customs_service_included": "yes",
          "customs_broker_status": "confirmed",
          "customs_liability_client": "yes",
          "customs_liability_forwarder": "not_defined",
          "false_data_liability": "client",
          "customs_liability_summary": "Экспедитор осуществляет таможенное оформление как таможенный представитель из реестра; клиент отвечает за достоверность сведений и штрафы по своей вине",
          "evidence": [
            {
              "clause_ref": "п. 5.3",
              "quote": "Экспедитор осуществляет таможенное оформление как таможенный представитель, включённый в реестр (свидетельство № 456). Клиент несёт ответственность за достоверность сведений, предоставленных для таможенного оформления. Штрафы таможенных органов, возникшие по вине Клиента, возмещаются Клиентом."
            }
          ]
        }

        Пример 2 — оформление включено, но статус представителя не подтверждён:
        Фрагмент:
        "Экспедитор оказывает услуги таможенного оформления."
        Ответ:
        {
