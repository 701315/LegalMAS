    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор транспортной экспедиции.

        Проверяется только один вопрос: срок оказания экспедиторских услуг.

        Важно:
        - Твоя задача — не оценивать серьёзность риска.
        - Только установить, что прямо есть в тексте договора, а чего прямо нет.
        - Не путай срок оказания услуг со сроком доставки груза — это разные понятия.
        - Не путай срок оказания услуг со сроком действия договора, если договор
          рамочный и услуги оказываются по отдельным поручениям.
        - Если срок определяется через Поручение экспедитору или заявку, это
          допустимый исход.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Указан ли срок оказания экспедиторских услуг.
        2. Дата начала оказания услуг (если указана).
        3. Дата окончания или период оказания (если указаны).
        4. Механизм определения срока (если через документ).
        5. Сформируй краткое пользовательское резюме.
        6. Собери точные цитаты в evidence.

        [ПРАВИЛА]
        1. Используй только предоставленный текст договора.
        2. Если данные отсутствуют:
           - для статусных полей используй "not_defined";
           - для видимых текстовых полей используй "Не установлено".
        3. Не используй null, None, пустые строки.
        4. Если текст есть, но надёжный вывод сделать нельзя:
           - для статусных полей используй "not_defined";
           - для видимых текстовых полей используй "Не удалось определить".
        5. Для service_period_specified:
           - "yes", если конкретный срок оказания услуг указан;
           - "per_order", если срок определяется по каждому Поручению/заявке;
           - "no", если прямо указано, что срок не устанавливается;
           - "not_defined", если условие отсутствует.
        6. Не путай срок оказания услуг со сроком доставки груза.
        7. Не путай срок оказания услуг со сроком действия рамочного договора.
        8. Верни РОВНО один JSON-объект со всеми 4 ключами без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.
        9. В evidence включай только точные цитаты из документа. Если данных нет, верни пустой массив [].
        10. Поле service_period_summary должно быть кратким.

        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1 — конкретный период:
        Фрагмент:
        "Услуги по настоящему договору оказываются в период с 01.01.2026 по 31.12.2026."
        Ответ:
        {
          "service_period_specified": "yes",
          "service_period_details": "с 01.01.2026 по 31.12.2026",
          "service_period_summary": "Срок оказания услуг: с 01.01.2026 по 31.12.2026",
          "evidence": [
            {
              "clause_ref": "п. 2.1",
              "quote": "Услуги по настоящему договору оказываются в период с 01.01.2026 по 31.12.2026."
            }
          ]
        }

        Пример 2 — рамочный договор, срок по поручениям:
        Фрагмент:
        "Сроки оказания услуг по каждой перевозке определяются в соответствующем Поручении экспедитору."
        Ответ:
        {
          "service_period_specified": "per_order",
          "service_period_details": "Определяется по Поручению экспедитору",
          "service_period_summary": "Срок оказания услуг определяется по каждому Поручению экспедитору",
          "evidence": [
            {
              "clause_ref": "п. 2.2",
              "quote": "Сроки оказания услуг по каждой перевозке определяются в соответствующем Поручении экспедитору."
            }
          ]
        }

        Пример 3 — условие отсутствует:
        Фрагмент:
        "Экспедитор обязуется организовать перевозку груза."
        Ответ:
        {
          "service_period_specified": "not_defined",
          "service_period_details": "Не установлено",
          "service_period_summary": "Не установлено",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Есть ли прямое указание на срок оказания услуг?
        2. Не смешан ли срок оказания услуг со сроком доставки?
        3. Не смешан ли срок оказания со сроком действия рамочного договора?
        4. Указаны ли конкретные даты или период?
        5. Если текст есть, но вывод невозможен, использовано ли "Не удалось определить"?
        6. Все ли 4 ключа присутствуют в ответе?
        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь РОВНО одним JSON-объектом без какого-либо дополнительного текста до или после, со всеми 4 ключами:
