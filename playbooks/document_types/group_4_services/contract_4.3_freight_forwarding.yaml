        Ты — российский юрист по договорной работе.
        Анализируется договор транспортной экспедиции опасного груза
        (ДОПОГ/ADR, ФЗ-87, ФЗ-116).
        Проверяется только один вопрос: распределение обязанностей
        при экспедировании опасных грузов.
        Нормативный ориентир:
        - ДОПОГ/ADR
        - ФЗ-87
        Важно:
        - Твоя задача — не оценивать серьёзность риска.
        - Только установить, что прямо есть в тексте договора, а чего прямо нет.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Наличие условий по опасному грузу.
        2. Обязанность клиента раскрыть опасные свойства.
        3. Указание класса опасности.
        4. Требования к специальной упаковке.
        5. Распределение ответственности за разрешения.
        6. Требование аварийной карточки.
        7. Ответственность за нераскрытие свойств.

        [ПРАВИЛА]
        1. Только текст документа.
        2. Если условие не указано прямо — "not_defined".
        3. В evidence — только цитаты из документа.
        4. Верни только один JSON-объект.

        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1:
        Фрагмент:
        "Клиент обязан предоставить полную информацию о классе опасности,
        свойствах и требованиях к упаковке груза в соответствии с ДОПОГ.
        Клиент обеспечивает маркировку и аварийную карточку. Ответственность
        за нераскрытие опасных свойств несёт Клиент."
        Ответ:
        {
          "dangerous_cargo_clause_present": "yes",
          "client_disclosure_duty": "present",
          "hazard_class_specification": "present",
          "special_packaging_requirements": "present",
          "permits_responsibility": "client",
          "emergency_card_required": "present",
          "liability_for_non_disclosure": "present",
          "evidence": [
            {
              "clause_ref": "п. 6.1",
              "quote": "Клиент обязан предоставить полную информацию о классе опасности, свойствах и требованиях к упаковке груза в соответствии с ДОПОГ."
            }
          ]
        }

        Пример 2:
        Фрагмент:
        "Экспедитор организует перевозку груза."
        Ответ:
        {
          "dangerous_cargo_clause_present": "no",
          "client_disclosure_duty": "absent",
          "hazard_class_specification": "absent",
          "special_packaging_requirements": "absent",
          "permits_responsibility": "not_defined",
          "emergency_card_required": "absent",
          "liability_for_non_disclosure": "absent",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Есть ли раздел/условия по опасному грузу?
        2. Есть ли обязанность клиента раскрыть свойства?
        3. Указан ли класс опасности?
        4. Есть ли требования к упаковке и маркировке?
        5. Распределена ли ответственность за разрешения?
        6. Есть ли аварийная карточка?
        7. Есть ли ответственность за нераскрытие?
        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "dangerous_cargo_clause_present": "<yes / no / not_defined>",
          "client_disclosure_duty": "<present / absent / not_defined>",
          "hazard_class_specification": "<present / absent / not_defined>",
          "special_packaging_requirements": "<present / absent / not_defined>",
          "permits_responsibility": "<client / forwarder / shared / not_defined>",
          "emergency_card_required": "<present / absent / not_defined>",
          "liability_for_non_disclosure": "<present / absent / not_defined>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 5
      temperature: 0.0
      max_tokens: 550
      retrieval:
        retrieval_profile: "compliance_check"
        corpus_scope: "primary_segment"
        levels:
          - "legal_unit"
          - "section"
        required_kind: "legal_unit"
        retrieval_query: "опасный груз класс опасности ДОПОГ ADR маркировка опасного груза разрешение на перевозку аварийная карточка информирование об опасных свойствах"
        preferred_unit_types:
          - obligation
          - general_provision
        excluded_unit_types:
          - definition
          - structural_anchor
          - technical_fragment
        preferred_clause_functions:
          - obligations
          - representations
        negative_keywords:
          - "страхование"
          - "удержание"
          - "форс-мажор"
          - "означает"
          - "в целях настоящего"
        position_bias:
          preferred_range: [0.20, 0.70]
          boost: 0.15
          scope: segment
        context_k: 5
        max_chunks: 7
        rerank: true
        enrichment_hints:
          preferred_segment_types:
            - "contract"
            - "amendment"
          excluded_segment_types:
            - "technical_specification"
            - "price_list"
          preferred_clause_functions:
            - "obligations"
            - "representations"
          confidence_bonus_on_match: 0.10
          confidence_penalty_on_excluded_segment: 0.12
      evidence:
        required: true
        min_snippet_length: 35
        max_snippet_length: 550
      extraction:
        enabled: true
        mode: "hybrid"
        compact_output: false
        llm_max_tokens: 800
        llm_prompt_extraction: |
          <role>
          Ты — российский юрист. Извлеки из договора транспортной экспедиции
          сведения об обязанностях при экспедировании опасных грузов.
          Не анализируй иные темы.
          </role>
          <context>
          {context}
          </context>
          <task>
          Заполни строго следующие поля:
          1. dangerous_cargo_clause_present — наличие условий (yes / no / not_defined).
          2. client_disclosure_duty — обязанность раскрытия (present / absent / not_defined).
          3. hazard_class_specification — указание класса (present / absent / not_defined).
          4. special_packaging_requirements — требования к упаковке (present / absent / not_defined).
          5. permits_responsibility — разрешения (client / forwarder / shared / not_defined).
          6. emergency_card_required — аварийная карточка (present / absent / not_defined).
          7. liability_for_non_disclosure — ответственность за нераскрытие (present / absent / not_defined).
          Если данные отсутствуют: указывай "absent" или "not_defined".
          </task>
          <rules>
          - Используй только текст договора.
          - Не выводи обязанности из ДОПОГ/ADR — только из текста.
          - Верни только JSON.
          </rules>
        fields:
          - name: "dangerous_cargo_clause_present"
            type: "string"
            presentation: "signal"
            allowed_values: ["yes", "no", "not_defined"]
            description: "Наличие условий по опасному грузу."
            required: true
          - name: "client_disclosure_duty"
            type: "string"
            presentation: "signal"
            allowed_values: ["present", "absent", "not_defined"]
            description: "Обязанность клиента раскрыть опасные свойства."
            required: false
          - name: "hazard_class_specification"
            type: "string"
            presentation: "signal"
            allowed_values: ["present", "absent", "not_defined"]
            description: "Указание класса опасности."
            required: false
          - name: "special_packaging_requirements"
            type: "string"
            presentation: "signal"
            allowed_values: ["present", "absent", "not_defined"]
            description: "Требования к специальной упаковке."
            required: false
          - name: "permits_responsibility"
            type: "string"
            presentation: "signal"
            allowed_values: ["client", "forwarder", "shared", "not_defined"]
            description: "Распределение ответственности за разрешения."
            required: false
          - name: "emergency_card_required"
            type: "string"
            presentation: "signal"
            allowed_values: ["present", "absent", "not_defined"]
            description: "Требование аварийной карточки."
            required: false
          - name: "liability_for_non_disclosure"
            type: "string"
            presentation: "signal"
            allowed_values: ["present", "absent", "not_defined"]
            description: "Ответственность за нераскрытие опасных свойств."
            required: false
    store_payload: true
