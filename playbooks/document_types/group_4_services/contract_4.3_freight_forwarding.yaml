        scope: segment
      context_k: 6
      max_chunks: 8
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types: []
      preferred_clause_functions:
        - "procedures"
        - "obligations"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 30
      max_snippet_length: 400

    extraction:
      store_payload: true

      enabled: true
      mode: "hybrid"
      compact_output: false
      llm_max_tokens: 1000
      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из договора транспортной экспедиции
        сведения об отчёте экспедитора: наличие обязанности представить отчёт,
        форму отчёта, срок представления и требование приложить подтверждающие
        документы.

        Не анализируй вознаграждение, оплату, ответственность, страхование,
        претензии и иные темы, если они не содержат сведений об отчёте экспедитора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        1. report_mentioned — предусмотрен ли отчёт экспедитора:
           "yes", "no" или "not_defined".
        2. report_form_specified — указана ли форма отчёта:
           "yes", "no" или "not_defined".
        3. report_deadline_details — срок представления отчёта или механизм его определения.
        4. supporting_documents_required — требуются ли подтверждающие документы:
           "yes", "no" или "not_defined".
        5. forwarder_report_summary — краткое пользовательское резюме.
        6. evidence — массив точных цитат из договора.

        Правила заполнения:

        Для report_mentioned:
        - "yes", если прямо упомянут отчёт экспедитора, отчёт о расходах, отчётность экспедитора или обязанность представить отчёт;
        - "no", если прямо указано, что отчёт не представляется;
        - "not_defined", если упоминания нет или вывод невозможен.

        Для report_form_specified:
        - "yes", если форма отчёта прямо указана, включая приложение, шаблон, форму экспедитора или свободную форму;
        - "no", если прямо указано, что форма не установлена;
        - "not_defined", если форма не упомянута или вывод невозможен.

        Для report_deadline_details:
        - если срок указан, верни его кратко;
        - если срок определяется через приложение, заявку или иной документ, верни, например, "Определяется по Приложению № 3";
        - если срок не указан, верни "Не установлен";
        - если текст есть, но вывод невозможен, верни "Не удалось определить".

        Для supporting_documents_required:
        - "yes", если прямо требуется приложить подтверждающие документы, первичные документы, счета, накладные или иные приложения;
        - "no", если прямо указано, что документы не требуются;
        - "not_defined", если вопрос не урегулирован.

        Для forwarder_report_summary:
        - если отчёт предусмотрен и детали понятны, верни краткий факт, например:
          "Отчёт предусмотрен; форма — Приложение № 2; срок — 5 рабочих дней после оказания услуг; подтверждающие документы требуются";
        - если отчёт предусмотрен, но детали не указаны, верни:
          "Отчёт предусмотрен; форма, срок и подтверждающие документы не указаны";
        - если отчёт прямо не предусмотрен, верни:
          "Не предусмотрен";
        - если отчёт не упомянут, верни:
          "Не установлен";
        - если текст есть, но надёжный вывод сделать нельзя, верни:
          "Не удалось определить".

        Если данных нет, верни пустой массив [] для evidence.
        </task>

        <context_rules>
        - Используй только предоставленный контекст.
        - Не выдумывай форму, срок и перечень подтверждающих документов.
        - Не смешивай отчёт экспедитора с актом оказанных услуг, транспортной накладной, счётом или платёжными документами, если они прямо не названы отчётом или документом о расходах.
        - Не считай отчёт существующим только потому, что договор транспортной экспедиции обычно может сопровождаться отчётностью.
        - Если фрагменты конфликтуют и не позволяют сделать надёжный вывод, верни "Не удалось определить" для forwarder_report_summary и включи конфликтующие цитаты в evidence.
        </context_rules>

        <output_expectations>
        Все перечисленные ключи должны присутствовать в ответе, даже если значение равно "not_defined", "Не установлен", "Не предусмотрен", "Не удалось определить" или "Определяется по ...".

        Запрещено возвращать:
        - null;
        - None;
        - пустые строки;
        - пояснения до или после JSON;
        - Markdown;
        - код-фенсы;
        - списки вне JSON.

        Верни РОВНО один JSON-объект со всеми 6 ключами без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.
        </output_expectations>

      fields:
        - name: "report_mentioned"
          type: "string"
          presentation: "signal"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Предусмотрен ли отчёт экспедитора."
          required: true
          display_in_grid: false

        - name: "report_form_specified"
          type: "string"
          presentation: "signal"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Указана ли форма отчёта экспедитора."
          required: true
          display_in_grid: false

        - name: "report_deadline_details"
          type: "string"
          presentation: "fact"
          label: "Срок отчёта"
          description: "Срок представления отчёта экспедитора или механизм его определения."
          required: true
          display_in_grid: false

        - name: "supporting_documents_required"
          type: "string"
          presentation: "signal"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Требуются ли подтверждающие документы или приложения к отчёту."
          required: true
          display_in_grid: false

        - name: "forwarder_report_summary"
          type: "string"
          presentation: "fact"
          label: "Отчёт экспедитора"
          description: "Краткое описание условия об отчёте экспедитора: наличие, форма, срок и подтверждающие документы."
          required: true
          display_in_grid: true
          display_priority: 1

        - name: "evidence"
          type: "array"
          presentation: "diagnostic"
          description: "Точные цитаты из договора, подтверждающие извлечённые значения."
