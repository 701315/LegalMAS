        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь РОВНО одним JSON-объектом без какого-либо дополнительного текста до или после, со всеми 8 ключами:
        {
          "delivery_deadline_specified": "<yes / no / per_order / not_defined>",
          "deadline_value": "<значение срока или 'Не установлено' / 'Не удалось определить' / 'Определяется по ...'>",
          "delay_penalty_present": "<yes / no / not_defined>",
          "delay_penalty_type": "<percentage_per_day / fixed / damages_only / not_defined>",
          "delay_penalty_cap": "<лимит неустойки или 'Не установлено' / 'Не удалось определить'>",
