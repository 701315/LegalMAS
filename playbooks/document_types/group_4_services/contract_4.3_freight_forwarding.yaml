        - "начало оказания услуг"
        - "окончание оказания услуг"
        - "услуги оказываются в период"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)срок\\s+оказани"
        - "(?i)период\\s+оказани"
        - "(?i)дата\\s+начал"
        - "(?i)дата\\s+окончани"
