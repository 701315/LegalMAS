        3. Противоречие между фрагментами.
           В разных частях договора указаны разные значения срока давности.
           → presence = "unclear";
             limitation_period_summary = "Не удалось определить".

        4. Прямое исключение.
           В договоре прямо указано, что применяется общий срок исковой давности по закону.
           → presence = "present";
             limitation_period_mentioned = "no";
             limitation_period_summary = "Применяется общий срок по закону".
        </edge_cases>

