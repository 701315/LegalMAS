    extraction:
      store_payload: true

      enabled: true
      mode: "hybrid"
      compact_output: false
      llm_max_tokens: 900
      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из договора транспортной экспедиции
        сведения об ответственности экспедитора за действия привлечённых третьих лиц:
        перевозчиков, таможенных представителей, субисполнителей и иных лиц.

        Не анализируй страхование, удержание, претензионный порядок, оплату,
        форс-мажор и иные темы, если они не содержат сведений об ответственности
        экспедитора именно за третьих лиц.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        1. liability_for_third_parties_present — наличие ответственности:
           "yes", "no", "limited" или "not_defined".
        2. liability_basis — основание ответственности:
           "own_actions", "joint_and_several", "limited" или "not_defined".
        3. right_to_engage_third_parties — право привлекать третьих лиц:
           "yes", "with_consent", "no" или "not_defined".
        4. exclusions_from_liability — наличие исключений из ответственности за третьих лиц:
           "yes", "no" или "not_defined".
        5. liability_for_third_parties_summary — краткое пользовательское резюме.
        6. evidence — массив точных цитат из договора.

        Правила заполнения:

        Для liability_for_third_parties_present:
        - "yes", если экспедитор прямо отвечает за действия третьих лиц как за свои собственные;
        - "limited", если ответственность за третьих лиц ограничена, в том числе ответственностью за выбор третьих лиц;
        - "no", если прямо указано, что экспедитор не отвечает за действия третьих лиц;
        - "not_defined", если условие не найдено или вывод невозможен.

        Для liability_basis:
        - "own_actions", если ответственность установлена как за свои собственные действия;
        - "joint_and_several", если установлена совместная или солидарная ответственность;
        - "limited", если есть любое ограничение или исключение ответственности, включая прямое освобождение от ответственности;
        - "not_defined", если основание не определено.

        Для right_to_engage_third_parties:
        - "yes", если экспедитор вправе привлекать третьих лиц без дополнительного согласия клиента;
        - "with_consent", если привлечение третьих лиц допускается с согласия клиента;
        - "no", если привлечение третьих лиц запрещено или исполнение осуществляется лично;
        - "not_defined", если право не определено.

        Для exclusions_from_liability:
        - "yes", если есть прямые исключения из ответственности за действия третьих лиц;
        - "no", если прямо указано, что исключения отсутствуют;
        - "not_defined", если исключения не упомянуты или вывод невозможен.

        Для liability_for_third_parties_summary:
        - если ответственность установлена как за свои действия, верни, например:
          "Экспедитор отвечает за действия третьих лиц как за свои собственные";
        - если есть ограничение, верни:
          "Ответственность за действия третьих лиц ограничена";
        - если есть исключение, верни:
          "Ответственность за действия третьих лиц исключена";
        - если право привлекать третьих лиц прямо указано, кратко добавь его в резюме, например:
          "Экспедитор отвечает за действия третьих лиц как за свои собственные; привлечение третьих лиц без согласия клиента";
        - если условие не найдено, верни:
          "Не установлено";
        - если текст есть, но надёжный вывод сделать нельзя, верни:
          "Не удалось определить".

        Если данных нет, верни пустой массив [] для evidence.
        </task>

        <context_rules>
        - Используй только предоставленный контекст.
        - Не выводи ответственность из закона, если она не упомянута в тексте договора.
        - Не считай отсутствие условия автоматическим исключением ответственности.
        - Не смешивай ответственность за третьих лиц с общей ответственностью сторон, лимитами ответственности или форс-мажором, если они не привязаны к третьим лицам.
        - Не смешивай экспедиторскую расписку, транспортную накладную, акты и платёжные документы с условиями об ответственности за третьих лиц.
        - Если фрагменты конфликтуют и не позволяют сделать надёжный вывод, верни "Не удалось определить" для liability_for_third_parties_summary и включи конфликтующие цитаты в evidence.
        - Не давай правовой оценки условиям договора; фиксируй только фактические формулировки.
        </context_rules>

        <output_expectations>
        Все перечисленные ключи должны присутствовать в ответе, даже если значение равно "not_defined", "Не установлено" или "Не удалось определить".

        Запрещено возвращать:
        - null;
        - None;
        - пустые строки;
