# CHECK 17: Срок доставки и ответственность за просрочку (ст. 9 ФЗ-87)
# ──────────────────────────────────────────────────────────────────────────
  - id: delivery_deadline_and_delay_penalty_check
    name: "Срок доставки и ответственность за просрочку (ст. 9 ФЗ-87)"
    description: >
      Фактографическая проверка наличия срока доставки или порядка его определения,
      санкций за просрочку, лимита неустойки и исключений для форс-мажора.
