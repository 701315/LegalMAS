      store_payload: true
  - id: forwarding_subject_extraction
    name: "Предмет экспедиции: перечень услуг, характеристики груза, маршрут"
    description: >
      Фактографическая проверка предмета договора транспортной экспедиции:
      перечень экспедиторских услуг, описание груза, маршрут, тип договора
      (разовый/рамочный), ссылка на Поручение экспедитору и упоминание
      экспедиторской расписки.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "предмет"
        - "экспедиторские услуги"
        - "организация перевозки"
        - "выбор перевозчика"
        - "таможенное оформление"
        - "страхование груза"
        - "оформление документов"
        - "складирование"
        - "упаковка"
        - "отслеживание груза"
        - "поручение экспедитору"
        - "перечень услуг"
        - "груз"
        - "наименование груза"
        - "вес"
        - "объём"
        - "объем"
        - "маршрут"
        - "пункт отправления"
        - "пункт назначения"
        - "заявка"
        - "приложение"
        - "экспедиторская расписка"
        - "разовый"
        - "рамочный"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)(экспедитор.*обязуется.*организовать)"
        - "(?i)(транспортно.*экспедиционн.*услуг)"
        - "(?i)(перечень.*услуг)"
        - "(?i)(маршрут|пункт назначения|пункт отправления)"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор транспортной экспедиции (Глава 41 ГК РФ, ст. 801;
        ФЗ-87 «О транспортно-экспедиционной деятельности»).

        Проверяется только один вопрос: предмет договора — перечень экспедиторских
        услуг, характеристики груза, маршрут, тип договора, упоминание экспедиторской
        расписки и ссылка на Поручение экспедитору / заявку / приложение.

        Нормативный ориентир:
        - ст. 801 ГК РФ;
        - ст. 2 ФЗ-87 «О транспортно-экспедиционной деятельности».

        Важно:
        - Твоя задача — не оценивать серьёзность риска.
        - Только установить, что прямо есть в тексте договора, а чего прямо нет.
        - Не выводи перечень услуг, груз, маршрут или тип договора из закона.
        - Если параметры конкретизируются в Поручениях экспедитору, заявках или
          приложениях, это допустимый исход, если такой механизм прямо указан.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Перечень экспедиторских услуг.
        2. Описание груза: наименование, вес, объём, иные характеристики, если указаны.
        3. Указан ли маршрут: пункт отправления и/или пункт назначения.
        4. Тип договора: разовый или рамочный.
        5. Упоминание экспедиторской расписки.
        6. Ссылку на форму Поручения экспедитору, заявку, приложение или иной документ,
           определяющий условия исполнения.

        [ПРАВИЛА]
        1. Используй только предоставленный текст договора.
        2. Если данных нет:
           - для статусных и перечислимых полей используй "not_defined";
           - для видимых текстовых полей используй "Не установлен" или "Не установлено".
        3. Не используй null, None, пустые строки.
        4. Если текст есть, но надёжный вывод сделать нельзя:
           - для статусных и перечислимых полей используй "not_defined";
           - для видимых текстовых полей используй "Не удалось определить".
        5. Верни РОВНО один JSON-объект со всеми 11 ключами без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.
        6. В evidence включай только точные цитаты из документа. Если данных нет, верни пустой массив [].
        7. Если услуги, груз или маршрут определяются через Поручение экспедитору, заявку, спецификацию или приложение, и это прямо указано в договоре, допустимо вернуть значение вида "Определяется по Поручению экспедитору", "Определяется по заявке" или "Согласно Приложению № 1".
        8. Не ставь "framework" только из-за упоминания Поручения экспедитору. Тип договора должен быть понятен из механизма исполнения.
        9. Видимые текстовые значения должны быть краткими: без длинных пересказов, перечислений на несколько абзацев и без цитирования всего пункта.

        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1 — разовая перевозка с конкретными услугами, грузом и маршрутом:
        Фрагмент:
        "Экспедитор обязуется организовать перевозку груза (оборудование, 5 тонн) по маршруту Москва — Санкт-Петербург, включая выбор перевозчика, оформление документов и отслеживание. При приёме груза Экспедитор выдаёт экспедиторскую расписку."
        Ответ:
        {
          "services_list_status": "defined",
          "services_list_details": "организация перевозки, выбор перевозчика, оформление документов, отслеживание",
          "cargo_description_status": "defined",
          "cargo_description_details": "оборудование, 5 тонн",
          "route_specified": "yes",
          "route_details": "Москва — Санкт-Петербург",
          "contract_type": "single",
          "contract_type_display": "Разовый",
          "forwarding_receipt_mentioned": "yes",
          "order_form_referenced": "not_defined",
          "evidence": [
            {
              "clause_ref": "п. 1.1",
              "quote": "Экспедитор обязуется организовать перевозку груза (оборудование, 5 тонн) по маршруту Москва — Санкт-Петербург, включая выбор перевозчика, оформление документов и отслеживание."
            },
            {
              "clause_ref": "п. 1.2",
              "quote": "При приёме груза Экспедитор выдаёт экспедиторскую расписку."
            }
          ]
        }

        Пример 2 — рамочный договор, параметры определяются поручениями:
        Фрагмент:
        "Экспедитор оказывает услуги, связанные с перевозкой грузов, на основании Поручений экспедитору, оформляемых по форме Приложения № 1. Наименование груза, вес, объём и маршрут указываются в каждом Поручении экспедитору отдельно. При приёме груза выдаётся экспедиторская расписка."
        Ответ:
        {
          "services_list_status": "defined",
          "services_list_details": "услуги, связанные с перевозкой грузов; конкретизируются в Поручениях экспедитору",
          "cargo_description_status": "defined",
          "cargo_description_details": "Определяется по Поручению экспедитору",
          "route_specified": "no",
          "route_details": "Определяется по Поручению экспедитору",
          "contract_type": "framework",
          "contract_type_display": "Рамочный",
          "forwarding_receipt_mentioned": "yes",
          "order_form_referenced": "yes",
          "evidence": [
            {
              "clause_ref": "п. 1.1",
              "quote": "Экспедитор оказывает услуги, связанные с перевозкой грузов, на основании Поручений экспедитору, оформляемых по форме Приложения № 1. Наименование груза, вес, объём и маршрут указываются в каждом Поручении экспедитору отдельно. При приёме груза выдаётся экспедиторская расписка."
            }
          ]
        }

        Пример 3 — предметные данные отсутствуют:
        Фрагмент:
        "Настоящий договор заключён между Экспедитором и Клиентом."
        Ответ:
        {
          "services_list_status": "not_defined",
          "services_list_details": "Не установлен",
          "cargo_description_status": "not_defined",
          "cargo_description_details": "Не установлено",
          "route_specified": "not_defined",
          "route_details": "Не установлен",
          "contract_type": "not_defined",
          "contract_type_display": "Не установлен",
          "forwarding_receipt_mentioned": "not_defined",
          "order_form_referenced": "not_defined",
          "evidence": []
        }

        Пример 4 — текст есть, но надёжный вывод сделать нельзя:
        Фрагмент:
        "Перечень экспедиторских услуг, характеристики груза и маршрут содержатся в документе, который сторонами не определён и не приложен к договору."
        Ответ:
        {
          "services_list_status": "not_defined",
          "services_list_details": "Не удалось определить",
          "cargo_description_status": "not_defined",
          "cargo_description_details": "Не удалось определить",
          "route_specified": "not_defined",
          "route_details": "Не удалось определить",
          "contract_type": "not_defined",
          "contract_type_display": "Не удалось определить",
          "forwarding_receipt_mentioned": "not_defined",
          "order_form_referenced": "not_defined",
          "evidence": [
            {
              "clause_ref": "предмет",
              "quote": "Перечень экспедиторских услуг, характеристики груза и маршрут содержатся в документе, который сторонами не определён и не приложен к договору."
            }
          ]
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Извлечён ли конкретный перечень услуг, а не общая формулировка из закона?
        2. Указаны ли характеристики груза, если они есть в тексте?
        3. Определён ли маршрут хотя бы как направление или как механизм определения?
        4. Разграничены ли разовый и рамочный договор без автоматического вывода по слову «Поручение»?
        5. Упомянута ли экспедиторская расписка?
        6. Есть ли ссылка на форму Поручения экспедитору, заявку или приложение?
        7. Если параметры определяются через приложение или поручение, отражено ли это в значении поля?
        8. Если текст есть, но вывод невозможен, использовано ли "Не удалось определить"?
        9. Все ли 11 ключей присутствуют в ответе?
        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь РОВНО одним JSON-объектом без какого-либо дополнительного текста до или после, со всеми 11 ключами:
        {
          "services_list_status": "<defined / not_defined>",
          "services_list_details": "<краткий перечень услуг или 'Не установлен' / 'Не удалось определить' / 'Определяется по ...'>",
          "cargo_description_status": "<defined / not_defined>",
          "cargo_description_details": "<описание груза или 'Не установлено' / 'Не удалось определить' / 'Определяется по ...'>",
          "route_specified": "<yes / no / not_defined>",
          "route_details": "<маршрут или 'Не установлен' / 'Не удалось определить' / 'Определяется по ...'>",
          "contract_type": "<single / framework / not_defined>",
          "contract_type_display": "<Разовый / Рамочный / Не установлен / Не удалось определить>",
          "forwarding_receipt_mentioned": "<yes / no / not_defined>",
          "order_form_referenced": "<yes / no / not_defined>",
          "evidence": [{"clause_ref": "<пункт или раздел>", "quote": "<точная цитата>"}]
        }
      context_k: 8
      temperature: 0.0
      max_tokens: 900

    retrieval:
      retrieval_profile: "scope_of_work_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "предмет договора транспортная экспедиция экспедиторские услуги перечень услуг организация перевозки выбор перевозчика оформление документов груз наименование вес объем объём характеристики маршрут пункт отправления пункт назначения поручение экспедитору заявка приложение экспедиторская расписка разовый рамочный"
      boost_keywords:
        - "предмет"
        - "экспедиторские услуги"
        - "перечень услуг"
        - "организация перевозки"
        - "груз"
        - "наименование груза"
        - "вес"
        - "объём"
        - "маршрут"
        - "пункт отправления"
        - "пункт назначения"
        - "поручение экспедитору"
        - "заявка"
        - "приложение"
        - "экспедиторская расписка"
        - "разовый"
        - "рамочный"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - definitions
        - obligations
      negative_keywords:
        - "вознаграждение"
        - "ответственность"
        - "удержание"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.0, 0.45]
        boost: 0.15
        scope: segment
      context_k: 8
      max_chunks: 12
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "price_list"
      preferred_clause_functions:
        - "definitions"
        - "obligations"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 50
      max_snippet_length: 800

    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false
      llm_max_tokens: 1300

      presence_signal:
        field: "forwarding_subject_extraction_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из договора транспортной экспедиции
        сведения о предмете: перечень экспедиторских услуг, описание груза,
        маршрут, тип договора, упоминание экспедиторской расписки и ссылку
        на Поручение экспедитору / заявку / приложение.

        Не анализируй вознаграждение, ответственность, претензии, сроки оплаты
        и иные темы, если они не описывают предмет договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. forwarding_subject_extraction_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (services_list_status, cargo_description_status, route_specified) ≠ "not_defined";
           - "missing" — если все три содержательных поля = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - services_list_status = "not_defined";
           - cargo_description_status = "not_defined";
           - route_specified = "not_defined";
           - services_list_details, cargo_description_details, route_details = "Не установлен" или "Не установлено";
           - contract_type = "not_defined";
           - contract_type_display = "Не установлен";
           - не выполняй остальные шаги.

        1. services_list_status — "defined" или "not_defined".
        2. services_list_details — краткий перечень экспедиторских услуг.
        3. cargo_description_status — "defined" или "not_defined".
        4. cargo_description_details — описание груза или механизм его определения.
        5. route_specified — "yes", "no" или "not_defined".
        6. route_details — маршрут или механизм его определения.
        7. contract_type — "single", "framework" или "not_defined".
        8. contract_type_display — пользовательское отображение типа договора.
        9. forwarding_receipt_mentioned — "yes", "no" или "not_defined".
        10. order_form_referenced — "yes", "no" или "not_defined".
        11. evidence — массив точных цитат из договора.

        Правила заполнения:
        - Если данных нет, статусные поля = "not_defined", видимые текстовые поля = "Не установлен" или "Не установлено".
        - Если текст есть, но надёжный вывод сделать нельзя, статусные поля = "not_defined", видимые текстовые поля = "Не удалось определить".
        - Если услуги, груз или маршрут определяются через Поручение экспедитору, заявку, спецификацию или приложение, и это прямо указано в договоре, верни значение вида "Определяется по Поручению экспедитору", "Определяется по заявке" или "Согласно Приложению № 1".
        - Для contract_type:
          "single" — если в договоре зафиксирована конкретная разовая перевозка или конкретный набор услуг;
          "framework" — если договор предполагает исполнение по отдельным поручениям, заявкам или приложениям, а конкретные параметры перевозок будут определяться отдельно;
          "not_defined" — если тип договора невозможно надёжно определить.
        - Не ставь "framework" только из-за упоминания Поручения экспедитору.
        - Для contract_type_display:
          если contract_type = "single" — "Разовый";
          если contract_type = "framework" — "Рамочный";
          если contract_type = "not_defined" из-за отсутствия данных — "Не установлен";
          если contract_type = "not_defined" из-за неоднозначности или конфликта — "Не удалось определить".
        - Для route_specified:
          "yes" — если в тексте указан конкретный маршрут или направление;
          "no" — если маршрут явно не указан и подлежит определению в поручении, заявке или приложении;
          "not_defined" — если сведений нет или они неоднозначны.
        - Для forwarding_receipt_mentioned:
          "yes" — если экспедиторская расписка упомянута;
          "no" — если прямо указано, что расписка не выдаётся;
          "not_defined" — если упоминания нет.
        - Для order_form_referenced:
          "yes" — если есть ссылка на форму Поручения экспедитору, заявку, приложение или иной документ, определяющий исполнение;
          "no" — если прямо указано, что такие документы не используются;
          "not_defined" — если упоминания нет.
        </task>

        <context_rules>
        - Перед остальными полями заполни forwarding_subject_extraction_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined", все *_details/*_display = соответствующий fallback.
        - Используй только предоставленный контекст.
        - Не используй внешние знания и не выводи перечень услуг из закона.
        - Не выдумывай груз, вес, объём, маршрут, тип договора, расписку или форму поручения.
        - Не смешивай предмет договора с вознаграждением, ответственностью, претензиями и оплатой.
        - Если фрагменты конфликтуют и не позволяют сделать надёжный вывод, верни "Не удалось определить" для затронутого видимого поля и включи конфликтующие цитаты в evidence.
        - Если конкретные параметры отсутствуют, но договор прямо отсылает к поручениям, заявкам или приложениям, это допустимый исход и должен быть отражён в видимых полях.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни перечня услуг, ни описания груза, ни маршрута.
           → presence = "missing";
             services_list_status = cargo_description_status = route_specified = "not_defined";
             все *_details = "Не установлен" или "Не установлено".

        2. Неполное раскрытие темы (согласование в будущем).
           Указано, что груз и маршрут будут согласованы дополнительно, без ссылки на конкретный документ.
           → presence = "present";
             соответствующие *_status = "not_defined";
             *_details = "Не установлено" или "Не удалось определить".

        3. Противоречие между фрагментами.
           В разных частях договора указаны разные маршруты или характеристики груза.
           → presence = "unclear";
             соответствующий *_status = "not_defined";
             *_details = "Не удалось определить".

        4. Отсылка на внешний документ (рамочный механизм).
           Предмет, груз и маршрут определяются по Поручению экспедитору или Заявке, и это прямо указано.
           → presence = "present";
             соответствующий *_status = "defined";
             *_details содержит формулировку вида "Определяется по Поручению экспедитору".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для forwarding_subject_extraction_presence используй только: "present", "missing", "unclear".
        - Для статусных enum-полей используй только: "defined" или "not_defined".
        - Fallback при отсутствии данных:
          * services_list_details, route_details → "Не установлен";
          * cargo_description_details → "Не установлено";
          * contract_type_display → "Не установлен".
        - Fallback при противоречии или неоднозначности:
          * все *_details/*_display → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "forwarding_subject_extraction_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования по предмету экспедиции. Внутреннее агрегатное signal-поле."
          required: true

        - name: "services_list_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус определения перечня экспедиторских услуг. Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "services_list_details"
          type: "string"
          presentation: "fact"
          label: "Услуги экспедитора"
          description: >
            Краткий перечень экспедиторских услуг или механизм их определения. Fallback: "Не установлено" / "Не удалось определить".
          required: true
          display_in_grid: true
          display_priority: 1

        - name: "cargo_description_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус описания груза. Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "cargo_description_details"
          type: "string"
          presentation: "fact"
          label: "Груз"
          description: >
            Характеристики груза или механизм их определения. Fallback: "Не установлено" / "Не удалось определить".
          required: true
          display_in_grid: true
          display_priority: 2

        - name: "route_specified"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Указан ли маршрут перевозки. Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "route_details"
          type: "string"
          presentation: "fact"
          label: "Маршрут"
          description: >
            Маршрут перевозки или механизм его определения. Fallback: "Не установлено" / "Не удалось определить".
          required: true
          display_in_grid: false

        - name: "contract_type"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["single", "framework", "not_defined"]
          description: "Тип договора: разовый, рамочный или не определён. Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "contract_type_display"
          type: "string"
          presentation: "fact"
          label: "Тип договора"
          description: >
            Пользовательское отображение типа договора: разовый, рамочный, не установлен или не удалось определить. Fallback: "Не установлено" / "Не удалось определить".
          required: true
          display_in_grid: true
          display_priority: 3

        - name: "forwarding_receipt_mentioned"
          type: "string"
          presentation: "signal"
          risk_weight: "low"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Упоминание экспедиторской расписки. Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "order_form_referenced"
          type: "string"
          presentation: "signal"
          risk_weight: "low"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Ссылка на форму Поручения экспедитору, заявку или приложение. Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "evidence"
          type: "array"
          presentation: "diagnostic"
          description: "Точные цитаты из договора, подтверждающие извлечённые значения."
          required: true
          display_in_grid: false

      store_payload: true
  - id: forwarding_receipt_check
    name: "Экспедиторская расписка: выдача и форма (ст. 2 ФЗ-87)"
    description: >
      Фактографическая проверка наличия условия о выдаче экспедиторской расписки
      при приёме груза, её формы и момента выдачи. Расписка подтверждает принятие
      груза и является типоспецифичным документом транспортной экспедиции.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "экспедиторская расписка"
        - "расписка экспедитора"
        - "приём груза"
        - "передача груза"
        - "выдача расписки"
        - "форма расписки"
        - "момент выдачи"
        - "Приказ Минтранса № 23"
        - "Приказ Минтранса России № 23"
        - "экспедиторский документ"
        - "документ, подтверждающий приём груза"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)экспедиторск(ая|ой)\\s+расписк"
        - "(?i)расписк(а|и)\\s+экспедитор"
        - "(?i)(приём|передача).*груз.*расписк"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор транспортной экспедиции.

        Проверяется только один вопрос: экспедиторская расписка —
        упомянута ли она, указана ли её форма и определён ли момент выдачи.

        Нормативный ориентир:
        - ст. 2 ФЗ-87 «О транспортно-экспедиционной деятельности»;
        - Приказ Минтранса России № 23, если на него есть прямая ссылка в тексте.

        Важно:
        - Твоя задача — не оценивать серьёзность риска.
        - Только установить, что прямо есть в тексте договора, а чего прямо нет.
        - Не подставляй Приказ Минтранса России № 23, если он не упомянут в договоре.
        - Отсутствие упоминания экспедиторской расписки само по себе не является
          автоматическим дефектом договора.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Упоминается ли экспедиторская расписка.
        2. Указана ли форма расписки.
        3. Когда выдаётся расписка: при приёме груза, в иной момент или момент не указан.
        4. Сформируй краткое пользовательское резюме для поля receipt_summary.
        5. Собери точные цитаты в evidence.

        [ПРАВИЛА]
        1. Используй только предоставленный текст договора.
        2. Если данные отсутствуют:
           - для статусных и перечислимых полей используй "not_defined";
           - для видимого текстового поля используй "Не упомянута".
        3. Не используй null, None, пустые строки.
        4. Если текст есть, но надёжный вывод сделать нельзя:
           - для статусных и перечислимых полей используй "not_defined";
           - для видимого текстового поля используй "Не удалось определить".
        5. Верни РОВНО один JSON-объект со всеми 5 ключами без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.
        6. В evidence включай только точные цитаты из документа. Если данных нет, верни пустой массив [].
        7. Для receipt_mentioned:
           "yes" — если экспедиторская расписка прямо упомянута;
           "no" — если прямо указано, что расписка не выдаётся или не оформляется;
           "not_defined" — если упоминания нет или вывод невозможен.
        8. Для receipt_form_specified:
           "yes" — если форма прямо указана, включая ссылку на приказ, приложение, собственную форму или свободную форму;
           "no" — если прямо указано, что форма не установлена;
           "not_defined" — если форма не упомянута или вывод невозможен.
        9. Для when_issued:
           "upon_acceptance" — если расписка выдаётся при приёме груза;
           "other" — если указан иной конкретный момент;
           "not_specified" — если расписка упомянута, но момент выдачи не указан;
           "not_defined" — если расписка не упомянута или момент невозможно определить.
        10. Поле receipt_summary должно быть кратким и не должно содержать длинных цитат.

        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1 — расписка прямо предусмотрена, форма и момент указаны:
        Фрагмент:
        "При приёме груза Экспедитор выдаёт Клиенту экспедиторскую расписку по форме, установленной Приказом Минтранса России № 23."
        Ответ:
        {
          "receipt_mentioned": "yes",
          "receipt_form_specified": "yes",
          "when_issued": "upon_acceptance",
          "receipt_summary": "Выдаётся при приёме груза; форма установлена Приказом Минтранса России № 23",
          "evidence": [
            {
              "clause_ref": "п. 2.1",
              "quote": "При приёме груза Экспедитор выдаёт Клиенту экспедиторскую расписку по форме, установленной Приказом Минтранса России № 23."
            }
          ]
        }

        Пример 2 — расписка упомянута, но форма и момент не указаны:
        Фрагмент:
        "Экспедитор выдаёт клиенту экспедиторскую расписку."
        Ответ:
        {
          "receipt_mentioned": "yes",
          "receipt_form_specified": "not_defined",
          "when_issued": "not_specified",
          "receipt_summary": "Упомянута; форма и момент выдачи не указаны",
          "evidence": [
            {
              "clause_ref": "п. 2.1",
              "quote": "Экспедитор выдаёт клиенту экспедиторскую расписку."
            }
          ]
        }

        Пример 3 — расписка не упомянута:
        Фрагмент:
        "Экспедитор принимает груз для организации перевозки."
        Ответ:
        {
          "receipt_mentioned": "not_defined",
          "receipt_form_specified": "not_defined",
          "when_issued": "not_defined",
          "receipt_summary": "Не упомянута",
          "evidence": []
        }

        Пример 4 — текст есть, но надёжный вывод сделать нельзя:
        Фрагмент:
        "Приём груза подтверждается документом, оформляемым экспедитором, без указания вида документа."
        Ответ:
        {
          "receipt_mentioned": "not_defined",
          "receipt_form_specified": "not_defined",
          "when_issued": "not_defined",
          "receipt_summary": "Не удалось определить",
          "evidence": [
            {
              "clause_ref": "порядок приёма груза",
              "quote": "Приём груза подтверждается документом, оформляемым экспедитором, без указания вида документа."
            }
          ]
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Есть ли прямое упоминание экспедиторской расписки?
        2. Не смешана ли расписка с актом приёма-передачи, транспортной накладной или иным документом?
        3. Указана ли форма расписки, если она упомянута?
        4. Определён ли момент выдачи: при приёме груза, иной момент или момент не указан?
        5. Если текст есть, но вывод невозможен, использовано ли "Не удалось определить"?
        6. Все ли 5 ключей присутствуют в ответе?
        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь РОВНО одним JSON-объектом без какого-либо дополнительного текста до или после, со всеми 5 ключами:
        {
          "receipt_mentioned": "<yes / no / not_defined>",
          "receipt_form_specified": "<yes / no / not_defined>",
          "when_issued": "<upon_acceptance / other / not_specified / not_defined>",
          "receipt_summary": "<краткое резюме или 'Не упомянута' / 'Не удалось определить'>",
          "evidence": [{"clause_ref": "<пункт или раздел>", "quote": "<точная цитата>"}]
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 600

    retrieval:
      retrieval_profile: "acceptance_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "экспедиторская расписка расписка экспедитора приём груза передача груза выдача расписки форма расписки момент выдачи Приказ Минтранса № 23 Приказ Минтранса России № 23 экспедиторский документ документ подтверждающий приём груза"
      boost_keywords:
        - "экспедиторская расписка"
        - "расписка экспедитора"
        - "приём груза"
        - "передача груза"
        - "выдача расписки"
        - "форма расписки"
        - "момент выдачи"
        - "Приказ Минтранса № 23"
        - "Приказ Минтранса России № 23"
        - "экспедиторский документ"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - procedures
        - obligations
      negative_keywords:
        - "вознаграждение"
        - "удержание"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.0, 0.60]
        boost: 0.15
        scope: segment
      context_k: 6
      max_chunks: 8
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "price_list"
      preferred_clause_functions:
        - "procedures"
        - "obligations"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 30
      max_snippet_length: 500

    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false
      llm_max_tokens: 800

      presence_signal:
        field: "forwarding_receipt_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из договора транспортной экспедиции
        сведения об экспедиторской расписке: факт упоминания, форму и момент
        выдачи.

        Не анализируй вознаграждение, ответственность, страхование, претензии,
        оплату и иные темы, если они не содержат сведений об экспедиторской
        расписке.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. forwarding_receipt_check_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если receipt_mentioned = "yes" или "no";
           - "missing" — если receipt_mentioned = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - receipt_mentioned = "not_defined";
           - receipt_form_specified = "not_defined";
           - when_issued = "not_defined";
           - receipt_summary = "Не упомянута";
           - не выполняй остальные шаги.

        1. receipt_mentioned — "yes", "no" или "not_defined".
        2. receipt_form_specified — "yes", "no" или "not_defined".
        3. when_issued — "upon_acceptance", "other", "not_specified" или "not_defined".
        4. receipt_summary — краткое пользовательское резюме об экспедиторской расписке.
        5. evidence — массив точных цитат из договора.

        Правила заполнения:
        - Для receipt_mentioned: "yes", если прямо упомянута; "no", если прямо указано, что не выдаётся; "not_defined", если упоминания нет.
        - Для receipt_form_specified: "yes", если форма прямо указана; "no", если прямо указано, что не установлена; "not_defined", если не упомянута.
        - Для when_issued: "upon_acceptance", если при приёме; "other", если иной момент; "not_specified", если момент не указан; "not_defined", если расписка не упомянута.
        - Для receipt_summary: если расписка прямо предусмотрена и детали понятны, верни краткий факт; если упомянута, но детали не указаны — "Упомянута; форма и момент выдачи не указаны"; если не выдаётся — "Не выдаётся"; если не упомянута — "Не упомянута"; если вывод невозможен — "Не удалось определить".
        - Если данных нет, верни пустой массив [] для evidence.
        </task>

        <context_rules>
        - Перед остальными полями заполни forwarding_receipt_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined", receipt_summary = "Не упомянута".
        - Используй только предоставленный контекст.
        - Не используй внешние знания и не подставляй форму расписки из закона, если она не указана в тексте.
        - Не считай экспедиторскую расписку упомянутой, если в тексте есть только акт приёма-передачи, транспортная накладная или иной документ без прямого указания на расписку.
        - Не выдумывай момент выдачи, если он прямо не указан.
        - Если фрагменты конфликтуют и не позволяют сделать надёжный вывод, верни "Не удалось определить" для receipt_summary и включи конфликтующие цитаты в evidence.
        - Не смешивай экспедиторскую расписку с вознаграждением, удержанием груза, страхованием или ответственностью, если в таких фрагментах нет сведений о расписке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет упоминания экспедиторской расписки.
           → presence = "missing";
             receipt_mentioned = "not_defined";
             receipt_summary = "Не упомянута".

        2. Неполное раскрытие темы.
           Расписка упомянута, но форма и момент выдачи не указаны.
           → presence = "present";
             receipt_form_specified = "not_defined";
             when_issued = "not_specified";
             receipt_summary = "Упомянута; форма и момент выдачи не указаны".

        3. Противоречие между фрагментами.
           В разных частях договора указаны разные моменты выдачи или формы расписки.
           → presence = "unclear";
             receipt_summary = "Не удалось определить".

        4. Прямое исключение.
           В договоре прямо указано, что расписка не выдаётся или не оформляется.
           → presence = "present";
             receipt_mentioned = "no";
             receipt_summary = "Не выдаётся".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для forwarding_receipt_check_presence используй только: "present", "missing", "unclear".
        - Для статусных enum-полей используй только: "yes", "no", "not_defined", "upon_acceptance", "other", "not_specified".
        - Fallback при отсутствии данных:
          * receipt_summary → "Не упомянута".
        - Fallback при противоречии или неоднозначности:
          * receipt_summary → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "forwarding_receipt_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования об экспедиторской расписке. Внутреннее агрегатное signal-поле."
          required: true

        - name: "receipt_mentioned"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Упоминание экспедиторской расписки в договоре. Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "receipt_form_specified"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Указана ли форма экспедиторской расписки. Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "when_issued"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["upon_acceptance", "other", "not_specified", "not_defined"]
          description: "Момент выдачи экспедиторской расписки. Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "receipt_summary"
          type: "string"
          presentation: "fact"
          label: "Экспедиторская расписка"
          description: >
            Краткое описание условия об экспедиторской расписке: упоминание, форма и момент выдачи. Fallback: "Не установлено" / "Не удалось определить".
          required: true
          display_in_grid: true
          display_priority: 1

        - name: "evidence"
          type: "array"
          presentation: "diagnostic"
          description: "Точные цитаты из договора, подтверждающие извлечённые значения."
          required: true
          display_in_grid: false

      store_payload: true
  - id: forwarder_instructions_check
    name: "Поручение экспедитору: форма и порядок (Приказ № 23)"
    description: >
      Фактографическая проверка наличия ссылки на Поручение экспедитору (или
      эквивалентный документ: заявку, заказ) как неотъемлемую часть договора,
      его формы, требований к содержанию и порядка направления. Поручение
      конкретизирует условия по каждой конкретной перевозке.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "поручение экспедитору"
        - "форма поручения"
        - "заявка на перевозку"
        - "заявка на экспедирование"
        - "заказ на перевозку"
        - "приложение к договору"
        - "неотъемлемая часть"
        - "указания клиента"
        - "Приказ № 23"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)поручени[еяюем]\\s+экспедитор"
        - "(?i)форм[аы]\\s+поручени"
        - "(?i)заявк[аиу]\\s+на\\s+(перевозк|экспедир)"
        - "(?i)неотъемлем(ая|ой)\\s+часть"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор транспортной экспедиции (Глава 41 ГК РФ, ФЗ-87,
        Приказ Минтранса России № 23).

        Проверяется только один вопрос: механизм конкретизации условий перевозки
        через Поручение экспедитору (или эквивалентные документы: заявку на перевозку,
        заявку на экспедирование, заказ). Проверяется факт упоминания, форма,
        статус неотъемлемой части договора и требования к содержанию.

        Важно:
        - Твоя задача — не оценивать серьёзность риска.
        - Только установить, что прямо есть в тексте договора, а чего прямо нет.
        - В российской практике вместо «Поручения экспедитору» часто используются
          термины «заявка на перевозку», «заявка на экспедирование» или «заказ».
          Если по смыслу они выполняют ту же функцию конкретизации перевозки,
          они рассматриваются как эквиваленты.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Упоминается ли Поручение экспедитору (или заявка/заказ на перевозку).
        2. Указана ли форма этого документа (приложение, шаблон, свободная форма).
        3. Является ли этот документ неотъемлемой частью договора.
        4. Определены ли требования к его содержанию (сведения о грузе, маршруте и т.д.).
        5. Сформируй краткое пользовательское резюме для поля order_summary.
        6. Собери точные цитаты в evidence.

        [ПРАВИЛА]
        1. Используй только предоставленный текст договора.
        2. Если данные отсутствуют:
           - для статусных полей используй "not_defined";
           - для видимого текстового поля используй "Не упомянуто".
        3. Не используй null, None, пустые строки.
        4. Если текст есть, но надёжный вывод сделать нельзя:
           - для статусных полей используй "not_defined";
           - для видимого текстового поля используй "Не удалось определить".
        5. Верни РОВНО один JSON-объект со всеми 6 ключами без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.
        6. В evidence включай только точные цитаты из документа. Если данных нет, верни пустой массив [].
        7. Не путай Поручение (заявку) с экспедиторской распиской, актом приёма-передачи или транспортной накладной.
        8. Поле order_summary должно быть кратким и не должно содержать длинных цитат.

        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1 — Поручение прямо предусмотрено, форма и статус указаны:
        Фрагмент:
        "Условия конкретной перевозки определяются Поручением экспедитору, которое является неотъемлемой частью настоящего договора. Форма Поручения установлена в Приложении № 1. Поручение должно содержать сведения о грузе, маршруте и сроках доставки."
        Ответ:
        {
          "order_mentioned": "yes",
          "order_form_specified": "yes",
          "order_as_integral_part": "yes",
          "order_content_requirements": "yes",
          "order_summary": "Форма Поручения — Приложение № 1; является неотъемлемой частью договора; требования к содержанию установлены",
          "evidence": [
            {
              "clause_ref": "п. 1.3",
              "quote": "Условия конкретной перевозки определяются Поручением экспедитору, которое является неотъемлемой частью настоящего договора. Форма Поручения установлена в Приложении № 1. Поручение должно содержать сведения о грузе, маршруте и сроках доставки."
            }
          ]
        }

        Пример 2 — используется синоним (заявка), но детали не указаны:
        Фрагмент:
        "Клиент направляет Экспедитору заявки на перевозку не позднее чем за 3 дня до даты отгрузки."
        Ответ:
        {
          "order_mentioned": "yes",
          "order_form_specified": "not_defined",
          "order_as_integral_part": "not_defined",
          "order_content_requirements": "not_defined",
          "order_summary": "Заявки на перевозку упоминаются; форма, статус и требования к содержанию не определены",
          "evidence": [
            {
              "clause_ref": "п. 3.1",
              "quote": "Клиент направляет Экспедитору заявки на перевозку не позднее чем за 3 дня до даты отгрузки."
            }
          ]
        }

        Пример 3 — механизм не упомянут:
        Фрагмент:
        "Экспедитор обязуется организовать перевозку груза из Москвы в Казань."
        Ответ:
        {
          "order_mentioned": "not_defined",
          "order_form_specified": "not_defined",
          "order_as_integral_part": "not_defined",
          "order_content_requirements": "not_defined",
          "order_summary": "Не упомянуто",
          "evidence": []
        }

        Пример 4 — текст есть, но надёжный вывод сделать нельзя:
        Фрагмент:
        "Условия конкретной перевозки согласовываются сторонами путем обмена документами, форма и юридический статус которых настоящим договором не определены."
        Ответ:
        {
          "order_mentioned": "not_defined",
          "order_form_specified": "not_defined",
          "order_as_integral_part": "not_defined",
          "order_content_requirements": "not_defined",
          "order_summary": "Не удалось определить",
          "evidence": [
            {
              "clause_ref": "порядок согласования",
              "quote": "Условия конкретной перевозки согласовываются сторонами путем обмена документами, форма и юридический статус которых настоящим договором не определены."
            }
          ]
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Есть ли прямое упоминание Поручения, заявки или заказа на перевозку?
        2. Не смешан ли этот документ с экспедиторской распиской или накладной?
        3. Указана ли форма (приложение, шаблон)?
        4. Является ли документ неотъемлемой частью договора?
        5. Определены ли требования к его содержанию?
        6. Если текст есть, но вывод невозможен, использовано ли "Не удалось определить"?
        7. Все ли 6 ключей присутствуют в ответе?
        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь РОВНО одним JSON-объектом без какого-либо дополнительного текста до или после, со всеми 6 ключами:
        {
          "order_mentioned": "<yes / no / not_defined>",
          "order_form_specified": "<yes / no / not_defined>",
          "order_as_integral_part": "<yes / no / not_defined>",
          "order_content_requirements": "<yes / no / not_defined>",
          "order_summary": "<краткое резюме или 'Не упомянуто' / 'Не удалось определить'>",
          "evidence": [{"clause_ref": "<пункт или раздел>", "quote": "<точная цитата>"}]
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 700

    retrieval:
      retrieval_profile: "scope_of_work_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "поручение экспедитору форма поручения заявка на перевозку заявка на экспедирование заказ на перевозку неотъемлемая часть приложения требования к содержанию"
      boost_keywords:
        - "поручение экспедитору"
        - "заявка"
        - "заявка на перевозку"
        - "заявка на экспедирование"
        - "заказ"
        - "форма поручения"
        - "форма заявки"
        - "приложение"
        - "неотъемлемая часть"
        - "содержание поручения"
        - "требования к поручению"
        - "порядок направления"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - procedures
        - obligations
      negative_keywords:
        - "вознаграждение"
        - "удержание"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.05, 0.50]
        boost: 0.15
        scope: segment
      context_k: 6
      max_chunks: 8
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "price_list"
      preferred_clause_functions:
        - "procedures"
        - "obligations"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 30
      max_snippet_length: 500

    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false
      llm_max_tokens: 900

      presence_signal:
        field: "forwarder_instructions_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из договора транспортной экспедиции
        сведения о механизме конкретизации перевозок: Поручении экспедитору,
        заявке на перевозку или заказе.

        Не анализируй вознаграждение, ответственность, страхование, претензии
        и иные темы, если они не содержат сведений о механизме Поручений/заявок.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. forwarder_instructions_check_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если order_mentioned = "yes" или "no";
           - "missing" — если order_mentioned = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - order_mentioned = "not_defined";
           - order_form_specified = "not_defined";
           - order_as_integral_part = "not_defined";
           - order_content_requirements = "not_defined";
           - order_summary = "Не упомянуто";
           - не выполняй остальные шаги.

        1. order_mentioned — "yes", "no" или "not_defined".
        2. order_form_specified — "yes", "no" или "not_defined".
        3. order_as_integral_part — "yes", "no" или "not_defined".
        4. order_content_requirements — "yes", "no" или "not_defined".
        5. order_summary — краткое пользовательское резюме.
        6. evidence — массив точных цитат из договора.

        Правила заполнения:
        - Для order_mentioned: "yes", если прямо упомянуто Поручение/заявка/заказ; "no", если прямо указано, что не используются; "not_defined", если упоминания нет.
        - Для order_form_specified: "yes", если форма прямо указана; "no", если прямо указано, что не установлена; "not_defined", если не упомянута.
        - Для order_as_integral_part: "yes", если прямо указано, что является неотъемлемой частью; "no", если прямо указано обратное; "not_defined", если не указано.
        - Для order_content_requirements: "yes", если перечислены требования к содержанию; "no", если прямо указано, что не устанавливаются; "not_defined", если не описаны.
        - Для order_summary: если форма, неотъемлемость и содержание указаны, верни краткий факт; если документ упомянут, но детали не указаны — "Поручение упомянуто; форма и порядок не указаны" (или аналогично для заявки); если не упомянуто — "Не упомянуто"; если вывод невозможен — "Не удалось определить".
        - Если данных нет, верни пустой массив [] для evidence.
        </task>

        <context_rules>
        - Перед остальными полями заполни forwarder_instructions_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined", order_summary = "Не упомянуто".
        - Используй только предоставленный контекст.
        - Не путай Поручение (заявку) с экспедиторской распиской, актом приёма-передачи или транспортной накладной.
        - Не считай Поручение неотъемлемой частью договора только потому, что к договору есть приложения, если это не указано прямо.
        - Не выдумывай форму или требования к содержанию, если они не описаны в тексте.
        - Если фрагменты конфликтуют и не позволяют сделать надёжный вывод, верни "Не удалось определить" для order_summary и включи конфликтующие цитаты в evidence.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет упоминания Поручения, заявки или заказа на перевозку.
           → presence = "missing";
             order_mentioned = "not_defined";
             order_summary = "Не упомянуто".

        2. Неполное раскрытие темы.
           Поручение или заявка упомянуты, но форма, статус или требования к содержанию не указаны.
           → presence = "present";
             соответствующие *_status = "not_defined";
             order_summary = "Поручение/заявка упомянуты; форма и порядок не указаны".

        3. Противоречие между фрагментами.
           В разных частях договора указаны разные требования к форме или статусу документа.
           → presence = "unclear";
             order_summary = "Не удалось определить".

        4. Прямое исключение.
           В договоре прямо указано, что Поручения или заявки не используются.
           → presence = "present";
             order_mentioned = "no";
             order_summary = "Не используются".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для forwarder_instructions_check_presence используй только: "present", "missing", "unclear".
        - Для статусных enum-полей используй только: "yes", "no", "not_defined".
        - Fallback при отсутствии данных:
          * order_summary → "Не упомянуто".
        - Fallback при противоречии или неоднозначности:
          * order_summary → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "forwarder_instructions_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования о Поручении экспедитору/заявке. Внутреннее агрегатное signal-поле."
          required: true

        - name: "order_mentioned"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Упоминание Поручения экспедитору, заявки или заказа на перевозку. Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "order_form_specified"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Указана ли форма Поручения или заявки. Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "order_as_integral_part"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Является ли Поручение или заявка неотъемлемой частью договора. Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "order_content_requirements"
          type: "string"
          presentation: "signal"
          risk_weight: "low"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Определены ли требования к содержанию Поручения или заявки. Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "order_summary"
          type: "string"
          presentation: "fact"
          label: "Поручение экспедитору"
          description: >
            Краткое описание механизма Поручения экспедитору (заявки/заказа): упоминание, форма, неотъемлемая часть, требования к содержанию. Fallback: "Не установлено" / "Не удалось определить".
          required: true
          display_in_grid: true
          display_priority: 1

        - name: "evidence"
          type: "array"
          presentation: "diagnostic"
          description: "Точные цитаты из договора, подтверждающие извлечённые значения."
          required: true
          display_in_grid: false

      store_payload: true
  - id: liability_for_third_parties
    name: "Ответственность экспедитора за третьих лиц (ст. 803, 805 ГК РФ)"
    description: >
      Фактографическая проверка наличия условия о том, что экспедитор отвечает
      за действия привлечённых третьих лиц (перевозчиков, таможенных представителей,
      субисполнителей) как за свои собственные. Также фиксируются право привлекать
      третьих лиц и любые ограничения или исключения такой ответственности.
      Условия, ограничивающие ответственность экспедитора за третьих лиц,
      требуют отдельной правовой оценки.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "отвечает за действия третьих лиц"
        - "как за свои собственные"
        - "третьи лица"
        - "привлечение третьих лиц"
        - "привлечённые лица"
        - "перевозчик"
        - "таможенный представитель"
        - "таможенный брокер"
        - "субисполнитель"
        - "полная ответственность"
        - "ответственность за выбор перевозчика"
        - "ответственность за сохранность груза"
        - "независимо от вины третьих лиц"
        - "ст. 803"
        - "ст. 805"
        - "не несёт ответственности за перевозчика"
        - "только посредник"
        - "с согласия клиента"
        - "письменное согласие клиента"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)отвеча(ет|ть)\\s+за\\s+действия.*третьих\\s+лиц.*как\\s+за\\s+свои"
        - "(?i)третьих\\s+лиц"
        - "(?i)как\\s+за\\s+свои"
        - "(?i)привлечени[еяем]\\s+третьих"
        - "(?i)ст\\.?\\s*803|ст\\.?\\s*805"
        - "(?i)не\\s+нес[её]т\\s+ответственност.*за\\s+перевозчик"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор транспортной экспедиции (Глава 41 ГК РФ; ФЗ-87).

        Проверяется только один вопрос: ответственность экспедитора за действия
        привлечённых третьих лиц — перевозчиков, таможенных представителей,
        субисполнителей и иных лиц, привлечённых экспедитором для исполнения
        обязательств по договору.

        Нормативный ориентир:
        - ст. 803 ГК РФ;
        - ст. 805 ГК РФ;
        - ФЗ-87 «О транспортно-экспедиционной деятельности».

        Важно:
        - Твоя задача — не оценивать серьёзность риска и не оценивать действительность условий.
        - Только установить, что прямо есть в тексте договора, а чего прямо нет.
        - Если встречается формулировка об освобождении или ограничении ответственности,
          зафиксируй её как факт, не оценивая её соответствие закону.
        - Не выводи ответственность из закона, если её нет в тексте договора.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Наличие условия об ответственности экспедитора за третьих лиц.
        2. Основание ответственности: как за свои действия, совместная/солидарная, ограниченная, исключённая или не определена.
        3. Право привлекать третьих лиц: свободно, с согласия клиента, запрещено или не определено.
        4. Наличие исключений из ответственности за третьих лиц.
        5. Сформируй краткое пользовательское резюме для поля liability_for_third_parties_summary.
        6. Собери точные цитаты в evidence.

        [ПРАВИЛА]
        1. Используй только предоставленный текст договора.
        2. Если данные отсутствуют:
           - для статусных и перечислимых полей используй "not_defined";
           - для видимого текстового поля используй "Не установлено".
        3. Не используй null, None, пустые строки.
        4. Если текст есть, но надёжный вывод сделать нельзя:
           - для статусных и перечислимых полей используй "not_defined";
           - для видимого текстового поля используй "Не удалось определить".
        5. Верни РОВНО один JSON-объект со всеми 6 ключами без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.
        6. В evidence включай только точные цитаты из документа. Если данных нет, верни пустой массив [].
        7. Для liability_for_third_parties_present:
           "yes" — если экспедитор прямо отвечает за действия третьих лиц как за свои собственные;
           "limited" — если ответственность за третьих лиц ограничена, в том числе ответственностью за выбор третьих лиц;
           "no" — если прямо указано, что экспедитор не отвечает за действия третьих лиц;
           "not_defined" — если условие не найдено или вывод невозможен.
        8. Для liability_basis:
           "own_actions" — ответственность как за свои собственные действия;
           "joint_and_several" — совместная или солидарная ответственность;
           "limited" — любое ограничение или исключение ответственности, включая прямое освобождение от ответственности;
           "not_defined" — основание не определено.
        9. Для right_to_engage_third_parties:
           "yes" — экспедитор вправе привлекать третьих лиц без дополнительного согласия клиента;
           "with_consent" — привлечение третьих лиц допускается с согласия клиента;
           "no" — привлечение третьих лиц запрещено или исполнение осуществляется лично;
           "not_defined" — право не определено.
        10. Поле exclusions_from_liability фиксирует только исключения из ответственности за действия третьих лиц.
            Общие исключения ответственности, форс-мажор, вина клиента или лимиты ответственности,
            не привязанные к третьим лицам, сюда не относятся.
        11. Поле liability_for_third_parties_summary должно быть кратким, без длинных цитат и правовых оценок.

        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1 — полная ответственность и право привлекать третьих лиц без согласия:
        Фрагмент:
        "Экспедитор отвечает за действия привлечённых им третьих лиц (перевозчиков, таможенных представителей) как за свои собственные в соответствии со ст. 803 ГК РФ. Экспедитор вправе привлекать третьих лиц без дополнительного согласия Клиента."
        Ответ:
        {
          "liability_for_third_parties_present": "yes",
          "liability_basis": "own_actions",
          "right_to_engage_third_parties": "yes",
          "exclusions_from_liability": "not_defined",
          "liability_for_third_parties_summary": "Экспедитор отвечает за действия третьих лиц как за свои собственные; привлечение третьих лиц без согласия клиента",
          "evidence": [
            {
              "clause_ref": "п. 6.1",
              "quote": "Экспедитор отвечает за действия привлечённых им третьих лиц (перевозчиков, таможенных представителей) как за свои собственные в соответствии со ст. 803 ГК РФ. Экспедитор вправе привлекать третьих лиц без дополнительного согласия Клиента."
            }
          ]
        }

        Пример 2 — ограниченная ответственность и привлечение с согласия клиента:
        Фрагмент:
        "Экспедитор вправе привлекать перевозчиков только с письменного согласия Клиента. Экспедитор отвечает за действия привлечённых перевозчиков в пределах своей вины."
        Ответ:
        {
          "liability_for_third_parties_present": "limited",
          "liability_basis": "limited",
          "right_to_engage_third_parties": "with_consent",
          "exclusions_from_liability": "not_defined",
          "liability_for_third_parties_summary": "Ответственность за действия третьих лиц ограничена; привлечение третьих лиц с письменного согласия клиента",
          "evidence": [
            {
              "clause_ref": "п. 5.4",
              "quote": "Экспедитор вправе привлекать перевозчиков только с письменного согласия Клиента. Экспедитор отвечает за действия привлечённых перевозчиков в пределах своей вины."
            }
          ]
        }

        Пример 3 — попытка исключения ответственности:
        Фрагмент:
        "Экспедитор является только посредником и не несёт ответственности за действия перевозчика."
        Ответ:
        {
          "liability_for_third_parties_present": "no",
          "liability_basis": "limited",
          "right_to_engage_third_parties": "not_defined",
          "exclusions_from_liability": "yes",
          "liability_for_third_parties_summary": "Ответственность за действия третьих лиц исключена",
          "evidence": [
            {
              "clause_ref": "п. 6.2",
              "quote": "Экспедитор является только посредником и не несёт ответственности за действия перевозчика."
            }
          ]
        }

        Пример 4 — условие отсутствует:
        Фрагмент:
        "Экспедитор организует перевозку груза."
        Ответ:
        {
          "liability_for_third_parties_present": "not_defined",
          "liability_basis": "not_defined",
          "right_to_engage_third_parties": "not_defined",
          "exclusions_from_liability": "not_defined",
          "liability_for_third_parties_summary": "Не установлено",
          "evidence": []
        }

        Пример 5 — текст есть, но надёжный вывод сделать нельзя:
        Фрагмент:
        "Экспедитор вправе привлекать перевозчиков, при этом распределение ответственности между Экспедитором и перевозчиками определяется отдельными договорами."
        Ответ:
        {
          "liability_for_third_parties_present": "not_defined",
          "liability_basis": "not_defined",
          "right_to_engage_third_parties": "yes",
          "exclusions_from_liability": "not_defined",
          "liability_for_third_parties_summary": "Не удалось определить",
          "evidence": [
            {
              "clause_ref": "п. 5.7",
              "quote": "Экспедитор вправе привлекать перевозчиков, при этом распределение ответственности между Экспедитором и перевозчиками определяется отдельными договорами."
            }
          ]
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Есть ли прямое условие об ответственности экспедитора за третьих лиц?
        2. Сформулировано ли оно как ответственность за свои собственные действия?
        3. Есть ли ограничение или исключение ответственности за третьих лиц?
        4. Определено ли право привлекать третьих лиц: свободно, с согласия или запрещено?
        5. Не смешаны ли исключения за третьих лиц с общими исключениями ответственности?
        6. Если текст есть, но вывод невозможен, использовано ли "Не удалось определить"?
        7. Все ли 6 ключей присутствуют в ответе?
        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь РОВНО одним JSON-объектом без какого-либо дополнительного текста до или после, со всеми 6 ключами:
        {
          "liability_for_third_parties_present": "<yes / no / limited / not_defined>",
          "liability_basis": "<own_actions / joint_and_several / limited / not_defined>",
          "right_to_engage_third_parties": "<yes / with_consent / no / not_defined>",
          "exclusions_from_liability": "<yes / no / not_defined>",
          "liability_for_third_parties_summary": "<краткое резюме или 'Не установлено' / 'Не удалось определить'>",
          "evidence": [{"clause_ref": "<пункт или раздел>", "quote": "<точная цитата>"}]
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 700

    retrieval:
      retrieval_profile: "liability_cap_check"
      corpus_scope: "primary_segment"
