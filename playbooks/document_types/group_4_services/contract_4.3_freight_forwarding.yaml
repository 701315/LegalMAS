        - "obligations"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.12

    evidence:
      required: true
      min_snippet_length: 35
      max_snippet_length: 550

    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false
      llm_max_tokens: 900

      presence_signal:
        field: "risk_transfer_moment_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из договора транспортной экспедиции
        сведения о моменте перехода рисков утраты и повреждения груза: от
        клиента к экспедитору, от экспедитора обратно, распределение рисков
        при хранении и при передаче третьим лицам.

        Не анализируй лимиты ответственности, неустойки, страхование груза,
        обстоятельства освобождения от ответственности и иные темы, если они
        не содержат сведений о моменте перехода рисков.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. risk_transfer_moment_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (risk_transfer_to_forwarder, risk_transfer_from_forwarder) ≠ "not_defined";
           - "missing" — если оба содержательных поля = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - risk_transfer_to_forwarder = "not_defined";
           - risk_transfer_from_forwarder = "not_defined";
           - storage_risk_allocation = "not_defined";
           - third_party_risk_allocation = "not_defined";
           - risk_transfer_summary = "Не установлено";
           - не выполняй остальные шаги.

        1. risk_transfer_to_forwarder — момент перехода риска к экспедитору:
           "upon_acceptance", "upon_first_carrier", "upon_document_signing" или "not_defined".
        2. risk_transfer_from_forwarder — момент перехода риска от экспедитора:
           "upon_delivery", "upon_warehouse", "upon_document_signing" или "not_defined".
        3. storage_risk_allocation — распределение рисков при хранении у экспедитора:
           "forwarder", "client", "shared" или "not_defined".
        4. third_party_risk_allocation — распределение рисков при передаче третьим лицам:
           "forwarder", "client", "shared" или "not_defined".
        5. risk_transfer_summary — краткое пользовательское резюме.
        6. evidence — массив точных цитат из договора.

        Правила заполнения:
        - Для risk_transfer_to_forwarder: "upon_acceptance", если риск переходит при приёме груза экспедитором; "upon_first_carrier", если при передаче первому перевозчику; "upon_document_signing", если при подписании документа; "not_defined", если не определён.
        - Для risk_transfer_from_forwarder: "upon_delivery", если риск переходит при выдаче грузополучателю; "upon_warehouse", если при сдаче на склад; "upon_document_signing", если при подписании документа; "not_defined", если не определён.
        - Для storage_risk_allocation: "forwarder", если риск при хранении несёт экспедитор; "client", если клиент; "shared", если распределён; "not_defined", если не определён.
        - Для third_party_risk_allocation: "forwarder", если риск при передаче третьим лицам несёт экспедитор; "client", если клиент; "shared", если распределён; "not_defined", если не определён.
        - Для risk_transfer_summary: если моменты и распределение указаны, верни краткий факт; если только общий принцип, верни "Риск на экспедиторе с момента приёма до момента выдачи; детали не указаны"; если прямо исключены, верни "Не предусмотрены"; если отсутствуют, верни "Не установлено".
        - Не выводи момент перехода рисков из закона. Фиксируй только если прямо указан.
        - Не путай момент перехода рисков с ответственностью за утрату.
        - Если данных нет, верни пустой массив [] для evidence.
        </task>

        <context_rules>
        - Перед остальными полями заполни risk_transfer_moment_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined", risk_transfer_summary = "Не установлено".
        - Используй только предоставленный контекст.
        - Не выводи момент перехода рисков из закона.
        - Не путай момент перехода рисков с ответственностью за утрату.
        - Не путай риски утраты груза с рисками повреждения тары или упаковки.
        - Если фрагменты конфликтуют и не позволяют сделать надёжный вывод, верни "Не удалось определить" для risk_transfer_summary и включи конфликтующие цитаты в evidence.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет упоминания момента перехода рисков утраты/повреждения груза.
           → presence = "missing";
             все *_status = "not_defined";
             risk_transfer_summary = "Не установлено".

        2. Неполное раскрытие темы.
           Указан только общий принцип («экспедитор несёт ответственность за сохранность с момента приёма до момента выдачи»), но детали хранения и передачи третьим лицам не указаны.
           → presence = "present";
             risk_transfer_to_forwarder = "upon_acceptance";
             risk_transfer_from_forwarder = "upon_delivery";
             storage_risk_allocation = third_party_risk_allocation = "not_defined";
             risk_transfer_summary = "Риск на экспедиторе с момента приёма до момента выдачи; детали не указаны".

        3. Противоречие между фрагментами.
           В разных частях договора указаны разные моменты перехода рисков.
           → presence = "unclear";
             risk_transfer_summary = "Не удалось определить".

        4. Прямое исключение.
           В договоре прямо указано, что риски не переходят или распределяются особым образом.
           → presence = "present";
             соответствующие *_status = "no" или "shared";
             risk_transfer_summary = "Не предусмотрены" или соответствующее резюме.
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для risk_transfer_moment_presence используй только: "present", "missing", "unclear".
        - Для статусных enum-полей используй только: "upon_acceptance", "upon_first_carrier", "upon_document_signing", "upon_delivery", "upon_warehouse", "forwarder", "client", "shared", "not_defined".
        - Fallback при отсутствии данных:
          * risk_transfer_summary → "Не установлено".
        - Fallback при противоречии или неоднозначности:
          * risk_transfer_summary → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "risk_transfer_moment_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования о моменте перехода рисков утраты/повреждения груза. Внутреннее агрегатное signal-поле."
          required: true

        - name: "risk_transfer_to_forwarder"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["upon_acceptance", "upon_first_carrier", "upon_document_signing", "not_defined"]
          description: "Момент перехода риска утраты/повреждения груза от клиента к экспедитору. Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "risk_transfer_from_forwarder"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["upon_delivery", "upon_warehouse", "upon_document_signing", "not_defined"]
          description: "Момент перехода риска утраты/повреждения груза от экспедитора обратно. Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "storage_risk_allocation"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["forwarder", "client", "shared", "not_defined"]
          description: "Распределение рисков при хранении груза у экспедитора. Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "third_party_risk_allocation"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["forwarder", "client", "shared", "not_defined"]
          description: "Распределение рисков при передаче груза третьим лицам (перевозчикам, субэкспедиторам). Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "risk_transfer_summary"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 1
          label: "Момент перехода рисков"
          description: >
            Краткое описание момента перехода рисков утраты/повреждения груза: к экспедитору, от экспедитора, при хранении и передаче третьим лицам. Fallback: "Не установлено" / "Не удалось определить".
          required: true

        - name: "evidence"
          type: "array"
          presentation: "diagnostic"
          description: "Точные цитаты из договора, подтверждающие извлечённые значения."
          required: true
          display_in_grid: false

      store_payload: true

  - id: third_party_engagement
    name: "Привлечение третьих лиц: механизм субститута, уведомление, проверка надёжности"
    description: >
      Фактографическая проверка общего механизма привлечения третьих лиц
      (субэкспедиторов, перевозчиков, складов, таможенных брокеров): модель
      привлечения (свободно / с согласия / запрещено / личное исполнение),
      обязанность экспедитора уведомлять клиента о привлечённых лицах,
      обязанность проверки надёжности третьих лиц, ведение перечня
      привлечённых лиц. Ответственность за действия третьих лиц фиксируется
      в liability_for_third_parties; согласование выбора конкретного
      перевозчика — в carrier_selection_approval.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "привлечение третьих лиц"
        - "привлечение субэкспедиторов"
        - "привлечение перевозчиков"
        - "привлечение складов"
        - "привлечение таможенных брокеров"
        - "право привлекать"
        - "вправе привлекать"
        - "с согласия клиента"
        - "личное исполнение"
        - "уведомление о привлечённых лицах"
        - "перечень привлечённых лиц"
        - "проверка надёжности"
        - "надлежащая проверка"
        - "субститут"
        - "субэкспедитор"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)привлечени[еяем].*третьих\\s+лиц"
        - "(?i)привлечени[еяем].*(субэкспедитор|перевозчик|склад|брокер)"
        - "(?i)вправе\\s+привлекать"
        - "(?i)с\\s+согласи[еяю].*клиент"
        - "(?i)личн(ое|ом)\\s+исполнени"
        - "(?i)уведомлени[еяю].*привлеч[её]нных"
        - "(?i)перечн.*привлеч[её]нных"
        - "(?i)проверк.*над[её]жност"
        - "(?i)субститут"
        - "(?i)субэкспедитор"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор транспортной экспедиции (ст. 805, 806 ГК РФ).

        Проверяется только один вопрос: общий механизм привлечения третьих лиц
        (субэкспедиторов, перевозчиков, складов, таможенных брокеров) —
        модель привлечения, уведомление клиента, проверка надёжности, перечень.

        Нормативный ориентир:
        - ст. 805 ГК РФ (личное исполнение vs. привлечение третьих лиц);
        - ст. 806 ГК РФ (право экспедитора привлекать третьих лиц).

        Важно:
        - Твоя задача — не оценивать серьёзность риска.
        - Только установить, что прямо есть в тексте договора, а чего прямо нет.
        - Не выводи право привлечения из закона. Фиксируй только если прямо указано.
        - Не путай общий механизм субститута с согласованием выбора конкретного перевозчика.
        - Не путай механизм привлечения с ответственностью за действия третьих лиц.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Указано ли право экспедитора привлекать третьих лиц.
        2. Модель привлечения (свободно / с согласия / запрещено / личное исполнение).
        3. Обязанность экспедитора уведомлять клиента о привлечённых лицах.
        4. Обязанность проверки надёжности третьих лиц.
        5. Ведение перечня привлечённых третьих лиц.
        6. Сформируй краткое пользовательское резюме.
        7. Собери точные цитаты в evidence.

        [ПРАВИЛА]
        1. Используй только предоставленный текст договора.
        2. Если данные отсутствуют:
           - для статусных полей используй "not_defined";
           - для видимых текстовых полей используй "Не установлено".
        3. Не используй null, None, пустые строки.
        4. Если текст есть, но надёжный вывод сделать нельзя:
           - для статусных полей используй "not_defined";
           - для видимых текстовых полей используй "Не удалось определить".
        5. Для engagement_model:
           - "free" — экспедитор вправе привлекать третьих лиц без дополнительного согласия;
           - "with_consent" — привлечение третьих лиц допускается с согласия клиента;
           - "prohibited" — привлечение третьих лиц запрещено;
           - "personal_execution" — исполнение осуществляется лично экспедитором;
           - "not_defined" — модель не определена.
        6. Не выводи право привлечения из закона. Фиксируй только если прямо указано.
        7. Верни РОВНО один JSON-объект со всеми 6 ключами без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.
        8. В evidence включай только точные цитаты из документа. Если данных нет, верни пустой массив [].
        9. Поле third_party_engagement_summary должно быть кратким.

        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1 — полная модель:
        Фрагмент:
        "Экспедитор вправе привлекать третьих лиц (субэкспедиторов, перевозчиков, склады) без дополнительного согласия Клиента. Экспедитор обязан уведомить Клиента о привлечённых лицах в течение 3 рабочих дней. Экспедитор осуществляет проверку надёжности привлечённых лиц."
        Ответ:
        {
          "engagement_right_specified": "yes",
          "engagement_model": "free",
          "client_notification_duty": "yes",
          "reliability_check_duty": "yes",
          "third_party_engagement_summary": "Свободное привлечение третьих лиц; уведомление клиента в течение 3 рабочих дней; проверка надёжности",
          "evidence": [
            {
              "clause_ref": "п. 5.2",
              "quote": "Экспедитор вправе привлекать третьих лиц (субэкспедиторов, перевозчиков, склады) без дополнительного согласия Клиента. Экспедитор обязан уведомить Клиента о привлечённых лицах в течение 3 рабочих дней. Экспедитор осуществляет проверку надёжности привлечённых лиц."
            }
          ]
        }

        Пример 2 — привлечение с согласия:
        Фрагмент:
        "Привлечение субэкспедиторов допускается только с письменного согласия Клиента."
        Ответ:
        {
          "engagement_right_specified": "yes",
          "engagement_model": "with_consent",
          "client_notification_duty": "not_defined",
          "reliability_check_duty": "not_defined",
          "third_party_engagement_summary": "Привлечение субэкспедиторов с письменного согласия клиента; уведомление и проверка надёжности не указаны",
          "evidence": [
            {
              "clause_ref": "п. 5.3",
              "quote": "Привлечение субэкспедиторов допускается только с письменного согласия Клиента."
            }
          ]
        }

        Пример 3 — условие отсутствует:
        Фрагмент:
        "Экспедитор организует перевозку груза."
        Ответ:
        {
          "engagement_right_specified": "not_defined",
          "engagement_model": "not_defined",
          "client_notification_duty": "not_defined",
          "reliability_check_duty": "not_defined",
          "third_party_engagement_summary": "Не установлено",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Есть ли прямое указание на право привлечения третьих лиц?
        2. Не выведено ли право из закона по умолчанию?
        3. Определена ли модель привлечения?
        4. Указана ли обязанность уведомления клиента?
        5. Указана ли обязанность проверки надёжности?
        6. Не смешан ли механизм субститута с согласованием выбора перевозчика?
        7. Не смешан ли механизм с ответственностью за действия третьих лиц?
        8. Все ли 6 ключей присутствуют в ответе?
        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь РОВНО одним JSON-объектом без какого-либо дополнительного текста до или после, со всеми 6 ключами:
        {
          "engagement_right_specified": "<yes / no / not_defined>",
          "engagement_model": "<free / with_consent / prohibited / personal_execution / not_defined>",
          "client_notification_duty": "<yes / no / not_defined>",
          "reliability_check_duty": "<yes / no / not_defined>",
          "third_party_engagement_summary": "<краткое резюме или 'Не установлено' / 'Не удалось определить'>",
          "evidence": [{"clause_ref": "<пункт или раздел>", "quote": "<точная цитата>"}]
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 700

    retrieval:
      retrieval_profile: "consent_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "привлечение третьих лиц субэкспедиторов перевозчиков складов таможенных брокеров право привлекать с согласия клиента личное исполнение уведомление о привлечённых лицах проверка надёжности перечень привлечённых лиц субститут"
      boost_keywords:
        - "привлечение третьих лиц"
        - "субэкспедитор"
        - "право привлекать"
        - "с согласия клиента"
        - "личное исполнение"
        - "уведомление о привлечённых"
        - "проверка надёжности"
        - "субститут"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - procedures
      negative_keywords:
        - "означает"
        - "в целях настоящего"
        - "ответственность за действия третьих лиц"
        - "критерии выбора перевозчика"
        - "право вето"
      position_bias:
        preferred_range: [0.25, 0.75]
        boost: 0.15
        scope: segment
      context_k: 6
      max_chunks: 8
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "obligations"
        - "procedures"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 35
      max_snippet_length: 550

    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false
      llm_max_tokens: 900

      presence_signal:
        field: "third_party_engagement_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из договора транспортной экспедиции
        сведения об общем механизме привлечения третьих лиц (субэкспедиторов,
        перевозчиков, складов, таможенных брокеров): модель привлечения,
        обязанность уведомления клиента, проверка надёжности, перечень
        привлечённых лиц.

        Не анализируй ответственность за действия третьих лиц, согласование
        выбора конкретного перевозчика, критерии выбора, право вето,
        вознаграждение и иные темы, если они не содержат сведений об общем
        механизме субститута.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. third_party_engagement_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (engagement_right_specified, engagement_model,
              client_notification_duty, reliability_check_duty) ≠ "not_defined";
           - "missing" — если все четыре содержательных поля = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - engagement_right_specified = "not_defined";
           - engagement_model = "not_defined";
           - client_notification_duty = "not_defined";
           - reliability_check_duty = "not_defined";
           - third_party_engagement_summary = "Не установлено";
           - не выполняй остальные шаги.

        1. engagement_right_specified — указано ли право привлекать третьих лиц:
           "yes", "no" или "not_defined".
        2. engagement_model — модель привлечения:
           "free", "with_consent", "prohibited", "personal_execution" или "not_defined".
        3. client_notification_duty — обязанность уведомлять клиента о привлечённых лицах:
           "yes", "no" или "not_defined".
        4. reliability_check_duty — обязанность проверки надёжности третьих лиц:
           "yes", "no" или "not_defined".
        5. third_party_engagement_summary — краткое пользовательское резюме.
        6. evidence — массив точных цитат из договора.

        Правила заполнения:
        - Для engagement_right_specified: "yes", если право прямо указано; "no", если прямо указано, что привлечение не допускается; "not_defined", если отсутствует.
        - Для engagement_model: "free", если без дополнительного согласия; "with_consent", если с согласия клиента; "prohibited", если запрещено; "personal_execution", если личное исполнение; "not_defined", если не определена.
        - Для client_notification_duty: "yes", если прямо предусмотрена обязанность уведомлять; "no", если прямо указано, что не требуется; "not_defined", если отсутствует.
        - Для reliability_check_duty: "yes", если прямо предусмотрена обязанность проверки; "no", если прямо указано, что не требуется; "not_defined", если отсутствует.
        - Для third_party_engagement_summary: если модель и обязанности указаны, верни краткий факт; если только модель, верни "Привлечение [модель]; уведомление и проверка не указаны"; если прямо исключено, верни "Не допускается"; если отсутствует, верни "Не установлено".
        - Не выводи право привлечения из закона. Фиксируй только если прямо указано.
        - Не путай механизм субститута с согласованием выбора перевозчика или ответственностью за третьих лиц.
        - Если данных нет, верни пустой массив [] для evidence.
        </task>

        <context_rules>
        - Перед остальными полями заполни third_party_engagement_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined", third_party_engagement_summary = "Не установлено".
        - Используй только предоставленный контекст.
        - Не выводи право привлечения третьих лиц из закона.
        - Не путай механизм субститута с согласованием выбора конкретного перевозчика.
        - Не путай механизм привлечения с ответственностью за действия третьих лиц.
        - Если фрагменты конфликтуют и не позволяют сделать надёжный вывод, верни "Не удалось определить" для third_party_engagement_summary и включи конфликтующие цитаты в evidence.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет упоминания механизма привлечения третьих лиц.
           → presence = "missing";
             все *_status = "not_defined";
             third_party_engagement_summary = "Не установлено".

        2. Неполное раскрытие темы.
           Указана только модель привлечения, но уведомление и проверка надёжности не указаны.
           → presence = "present";
             engagement_model = соответствующее значение;
             остальные = "not_defined";
             third_party_engagement_summary = "Привлечение [модель]; уведомление и проверка не указаны".

        3. Противоречие между фрагментами.
           В разных частях договора указаны разные модели привлечения или противоречащие обязанности.
           → presence = "unclear";
             third_party_engagement_summary = "Не удалось определить".

        4. Прямое исключение.
           В договоре прямо указано, что привлечение третьих лиц запрещено или исполнение личное.
           → presence = "present";
             engagement_model = "prohibited" или "personal_execution";
             third_party_engagement_summary = "Не допускается" или "Личное исполнение".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для third_party_engagement_presence используй только: "present", "missing", "unclear".
        - Для статусных enum-полей используй только: "yes", "no", "not_defined", "free", "with_consent", "prohibited", "personal_execution".
        - Fallback при отсутствии данных:
          * third_party_engagement_summary → "Не установлено".
        - Fallback при противоречии или неоднозначности:
          * third_party_engagement_summary → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "third_party_engagement_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования о механизме привлечения третьих лиц. Внутреннее агрегатное signal-поле."
          required: true

        - name: "engagement_right_specified"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Указано ли право экспедитора привлекать третьих лиц. Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "engagement_model"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["free", "with_consent", "prohibited", "personal_execution", "not_defined"]
          description: "Модель привлечения третьих лиц: свободно, с согласия, запрещено, личное исполнение. Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "client_notification_duty"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Обязанность экспедитора уведомлять клиента о привлечённых третьих лицах. Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "reliability_check_duty"
          type: "string"
          presentation: "signal"
          risk_weight: "low"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Обязанность экспедитора проверять надёжность привлечённых третьих лиц. Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "third_party_engagement_summary"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 1
          label: "Привлечение третьих лиц"
          description: >
            Краткое описание механизма субститута: модель привлечения, уведомление клиента, проверка надёжности. Fallback: "Не установлено" / "Не удалось определить".
          required: true

        - name: "evidence"
          type: "array"
          presentation: "diagnostic"
          description: "Точные цитаты из договора, подтверждающие извлечённые значения."
          required: true
          display_in_grid: false

      store_payload: true

  - id: cargo_disposition_instructions
    name: "Распоряжения клиента о грузе: изменение маршрута, грузополучателя, возврат"
    description: >
      Фактографическая проверка права клиента давать распоряжения о грузе в
