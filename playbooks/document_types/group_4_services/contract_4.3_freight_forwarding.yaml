    extraction:
      store_payload: true

      enabled: true
      mode: "hybrid"
      compact_output: false
      llm_max_tokens: 1100
      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из договора транспортной экспедиции
        сведения о вознаграждении экспедитора и порядке возмещения его расходов.

        Не анализируй ответственность, страхование, сроки доставки, претензии
        и иные темы, если они не содержат сведений о вознаграждении и расходах.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        1. remuneration_specified — указано ли вознаграждение:
           "yes", "no" или "not_defined".
        2. remuneration_type — тип вознаграждения:
           "fixed", "percentage", "hourly", "not_specified" или "not_defined".
        3. remuneration_amount — размер вознаграждения или механизм его определения.
        4. expenses_reimbursement_present — предусмотрено ли возмещение расходов:
           "yes", "no" или "not_defined".
        5. expenses_approval_mechanism — есть ли механизм согласования расходов:
           "yes", "no" или "not_defined".
        6. expenses_limit — лимит расходов или предельная сумма расходов.
        7. advance_payment — предусмотрено ли авансирование или предоплата:
           "yes", "no" или "not_defined".
        8. evidence — массив точных цитат из договора.

        Правила заполнения:

        Для remuneration_specified:
        - "yes", если вознаграждение прямо указано суммой, формулой или механизмом определения;
        - "no", если прямо указано, что вознаграждение не выплачивается;
        - "not_defined", если сведений нет или вывод невозможен.

        Для remuneration_type:
        - "fixed", если указана фиксированная сумма;
        - "percentage", если указан процент;
        - "hourly", если указана почасовая оплата;
        - "not_specified", если вознаграждение упомянуто, но тип неясен;
        - "not_defined", если вознаграждение не упомянуто или вывод невозможен.

        Для remuneration_amount:
        - если сумма или формула указаны, верни их кратко;
        - если вознаграждение определяется через приложение, тариф, прайс-лист, заявку или иной документ, верни, например, "Определяется по Приложению № 1";
        - если вознаграждение прямо не предусмотрено, верни "Не применимо";
        - если данных нет, верни "Не установлен";
        - если текст есть, но вывод невозможен, верни "Не удалось определить".

        Для expenses_reimbursement_present:
        - "yes", если прямо предусмотрено возмещение фактических расходов;
        - "no", если прямо указано, что расходы включены в вознаграждение или отдельному возмещению не подлежат;
        - "not_defined", если вопрос не урегулирован.

        Для expenses_approval_mechanism:
        - "yes", если есть предварительное согласование, смета, порядок одобрения расходов или порог, после которого требуется согласование;
        - "no", если прямо указано, что согласование не требуется;
        - "not_defined", если механизм не упомянут.

        Для expenses_limit:
        - если указан максимальный лимит или предельная сумма расходов, верни его кратко;
        - если лимит определяется через названный документ, верни, например, "Определяется по Приложению № 1";
        - если указан только порог согласования, но нет максимального ограничения, не считай это лимитом и верни "Не установлен";
        - если возмещение расходов прямо не предусмотрено, верни "Не применимо";
        - если данных нет, верни "Не установлен";
        - если текст есть, но вывод невозможен, верни "Не удалось определить".

        Для advance_payment:
        - "yes", если прямо предусмотрены аванс, предоплата или авансирование расходов/вознаграждения;
        - "no", если прямо указано, что авансирование не предусмотрено;
        - "not_defined", если вопрос не урегулирован.

        Если данных нет, верни пустой массив [] для evidence.
        </task>

        <context_rules>
        - Используй только предоставленный контекст.
        - Не выдумывай суммы, проценты, тарифы и лимиты.
        - Не подставляй рыночные ставки и не предполагай вознаграждение только потому, что договор транспортной экспедиции обычно является возмездным.
        - Не смешивай вознаграждение экспедитора с возмещением его расходов.
        - Не смешивай аванс с оплатой после оказания услуг.
        - Не считай порог согласования лимитом расходов, если прямо не указано максимальное ограничение.
        - Если фрагменты конфликтуют и не позволяют сделать надёжный вывод, верни "Не удалось определить" для затронутого видимого поля и включи конфликтующие цитаты в evidence.
        </context_rules>

        <output_expectations>
        Все перечисленные ключи должны присутствовать в ответе, даже если значение равно "not_defined", "Не установлен", "Не установлено", "Не применимо", "Не удалось определить" или "Определяется по ...".

        Запрещено возвращать:
        - null;
        - None;
        - пустые строки;
        - пояснения до или после JSON;
        - Markdown;
        - код-фенсы;
        - списки вне JSON.

        Верни РОВНО один JSON-объект со всеми 8 ключами без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.
        </output_expectations>

