            - "price_list"
          preferred_clause_functions:
            - "representations"
            - "obligations"
          confidence_bonus_on_match: 0.10
          confidence_penalty_on_excluded_segment: 0.12
      evidence:
        required: true
        min_snippet_length: 35
        max_snippet_length: 520
      extraction:
        enabled: true
        mode: "hybrid"
        compact_output: false
        llm_max_tokens: 600
        llm_prompt_extraction: |
          <role>
          Ты — российский юрист. Извлеки из текста договора факторинга сведения
          о передаче документов и банкротных заверениях клиента.
          Не анализируй регресс, финансирование или уведомление должника.
          </role>
          <context>
          {context}
          </context>
          <task>
          Заполни строго следующие поля:
          1. document_transfer_status — present / not_defined.
          2. document_list_specificity — specific / generic / not_defined.
          3. bankruptcy_representations_status — present / not_defined.
          4. market_terms_representation — present / not_defined.
          Если данные отсутствуют: используй "not_defined".
          </task>
          <rules>
