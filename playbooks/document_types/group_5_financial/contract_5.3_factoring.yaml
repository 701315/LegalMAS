  - id: framework_assignment_mechanics_check
    name: "Механика рамочного факторинга: заявки, акты, момент перехода требования (ст. 826, 388.1 ГК РФ)"
    description: >
      Проверка механизма уступки конкретных требований в рамочном факторинге:
      через заявку, акт, реестр; момент перехода требования к фактору.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "рамочный факторинг"
        - "рамочный договор"
        - "заявка клиента"
        - "акт уступки"
        - "реестр требований"
        - "реестр уступленных требований"
        - "момент перехода требования"
        - "с даты подписания акта"
        - "уступка будущего требования"
        - "партия требований"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)(рамочн(ый|ого)|рамк).{0,30}договор"
        - "(?i)(заявк|акт\\s+уступк|реестр).{0,40}(требован|уступк)"
        - "(?i)(требовани|право).{0,40}переход.{0,40}(фактор|финансов\\w+\\s+агент)"
        - "(?i)с\\s+дат[ыи].{0,40}(подписани|выплат).{0,40}(акт|финансирован)"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор факторинга по Главе 43 ГК РФ.
        Проверяется только один вопрос: механика уступки конкретных
        требований в рамках рамочного договора и момент перехода требования.
        Нормативные ориентиры:
        - ст. 826 ГК РФ — предмет уступки;
        - ст. 388.1 ГК РФ — уступка будущего требования.
        Важно:
        - Твоя задача — не оценивать серьёзность риска.
        - Только установить, что прямо есть в тексте договора, а чего прямо нет.
        - В РФ доминирует рамочный факторинг: договор устанавливает общие
          условия, а конкретные требования уступаются партиями по заявкам
          клиента и актам уступки (или через реестры).
        - Различай три типа:
            * framework — рамочный: общие условия + заявки/акты;
            * single_claim — единичная уступка: конкретное требование
              уступается сразу;
            * mixed — смешанный: и то, и другое.
        - Механизм уступки:
            * application — через заявку клиента;
            * act — через акт уступки;
            * registry — через реестр требований;
            * other — иной механизм.
        - Момент перехода требования критичен: подписание акта / выплата
          финансирования / получение заявки фактором. Разные моменты =
          разные риски. Отражай конкретику в summary.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Тип договора (рамочный / единичная уступка / смешанный).
        2. Механизм уступки конкретных требований.
        3. Момент перехода требования к фактору.
        4. Составь краткую сводку.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Если данные не указаны прямо:
           - для status-полей верни "not_defined";
           - для display-полей верни "Не установлено" / "Не определён"
             по роду.
        4. Запрещены значения: null, None, пустые строки — не используй их
           никогда. Допустимые fallback-значения: "not_defined",
           "Не установлено", "Не определён".
        5. framework_type_status:
           "framework" — договор прямо определён как рамочный, конкретные
             требования уступаются отдельно;
           "single_claim" — единичная уступка конкретного требования;
           "mixed" — признаки обоих типов;
           "not_defined" — тип не определён.
        6. assignment_mechanism_status:
           "application" — через заявку клиента;
           "act" — через акт уступки;
           "registry" — через реестр требований;
           "other" — иной механизм;
           "not_defined" — механизм не определён.
        7. transfer_moment_status:
           "specified" — прямо указан момент перехода требования;
           "not_defined" — момент не указан.
           Конкретику момента (подписание акта / выплата / иное) обязательно
           отражай в framework_assignment_summary.
        8. framework_assignment_summary — одна строка, формат:
           "Тип: <...>; Механизм: <...>; Момент перехода: <...>".
        9. В evidence включай только дословные цитаты из текста договора.
        10. Верни РОВНО один JSON-объект со всеми 6 ключами без какого-либо
            дополнительного текста до или после. Начни ответ сразу с
            открывающей фигурной скобки и закончи закрывающей. НЕ пиши
            Markdown, списки, код-фенсы. Ответ должен быть валидным JSON,
            пригодным для парсинга через json.loads без предварительной
            обработки.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — рамочный факторинг с чётким механизмом:
        Фрагмент:
        "Настоящий Договор является рамочным. Конкретные требования
        уступаются на основании Заявок Клиента и Актов уступки. Требование
        переходит к Фактору с даты подписания соответствующего Акта уступки."
        Ответ:
        {
          "framework_type_status": "framework",
          "framework_type_display": "Рамочный",
          "assignment_mechanism_status": "act",
          "assignment_mechanism_display": "Через акт",
          "transfer_moment_status": "specified",
          "framework_assignment_summary": "Тип: Рамочный; Механизм: Через акт уступки (по заявкам Клиента); Момент перехода: с даты подписания Акта уступки",
          "evidence": [
            {
              "clause_ref": "п. 1.2",
              "quote": "Настоящий Договор является рамочным. Конкретные требования уступаются на основании Заявок Клиента и Актов уступки."
            }
          ]
        }

        Пример 2 — единичная уступка без рамочной механики:
        Фрагмент:
        "Клиент уступает Фактору конкретное денежное требование к ООО
        «Покупатель» по договору поставки № 45 от 01.03.2024."
        Ответ:
        {
          "framework_type_status": "single_claim",
          "framework_type_display": "Единичная уступка",
          "assignment_mechanism_status": "not_defined",
          "assignment_mechanism_display": "Не установлено",
          "transfer_moment_status": "not_defined",
          "framework_assignment_summary": "Тип: Единичная уступка; Механизм: Не установлено; Момент перехода: Не определён",
          "evidence": [
            {
              "clause_ref": "п. 1.1",
              "quote": "Клиент уступает Фактору конкретное денежное требование к ООО «Покупатель» по договору поставки № 45 от 01.03.2024."
            }
          ]
        }

        Пример 3 — текст есть, но вывод частичный
        (механизм указан, момент перехода не определён):
        Фрагмент:
        "Требования уступаются партиями на основании заявок Клиента,
        оформляемых по форме Приложения № 2."
        Ответ:
        {
          "framework_type_status": "framework",
          "framework_type_display": "Рамочный",
          "assignment_mechanism_status": "application",
          "assignment_mechanism_display": "Через заявку",
          "transfer_moment_status": "not_defined",
          "framework_assignment_summary": "Тип: Рамочный; Механизм: Через заявку Клиента (форма Приложения № 2); Момент перехода: Не определён",
          "evidence": [
            {
              "clause_ref": "п. 1.2",
              "quote": "Требования уступаются партиями на основании заявок Клиента, оформляемых по форме Приложения № 2."
            }
          ]
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о типе договора (рамочный / единичная уступка).
        2. Найди прямую цитату о механизме уступки (заявка / акт / реестр).
        3. Найди прямую цитату о моменте перехода требования.
        4. Если в договоре нет прямого указания на момент перехода —
           transfer_moment_status = "not_defined", но в summary отражай
           всё, что есть.
        5. Согласуй raw enum и display:
           framework_type_status -> framework_type_display:
             "framework" -> "Рамочный";
             "single_claim" -> "Единичная уступка";
             "mixed" -> "Смешанный";
             "not_defined" -> "Не установлено".
           assignment_mechanism_status -> assignment_mechanism_display:
             "application" -> "Через заявку";
             "act" -> "Через акт";
             "registry" -> "Через реестр";
             "other" -> "Иной механизм";
             "not_defined" -> "Не установлено".
        6. Если прямой цитаты нет — верни "not_defined" для status-полей
           и соответствующий fallback для display-полей.
        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь РОВНО одним JSON-объектом без какого-либо дополнительного
        текста до или после, со всеми 6 ключами:
        {
          "framework_type_status": "<framework / single_claim / mixed / not_defined>",
          "framework_type_display": "<Рамочный / Единичная уступка / Смешанный / Не установлено>",
          "assignment_mechanism_status": "<application / act / registry / other / not_defined>",
          "assignment_mechanism_display": "<Через заявку / Через акт / Через реестр / Иной механизм / Не установлено>",
          "transfer_moment_status": "<specified / not_defined>",
          "framework_assignment_summary": "<сводка одной строкой>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 8
      temperature: 0.0
      max_tokens: 750
    store_payload: true

    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false
      llm_max_tokens: 1100
      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора факторинга
        сведения о механике уступки: тип договора (рамочный / единичная
        уступка), механизм (заявка / акт / реестр), момент перехода
        требования к фактору.
        Не анализируй регресс, финансирование, комиссию или уведомление
        должника.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие 6 полей (все ключи должны присутствовать
        в ответе, даже если значение — fallback):
        1.  framework_type_status — framework / single_claim / mixed /
            not_defined.
        2.  framework_type_display — "Рамочный" / "Единичная уступка" /
            "Смешанный" / "Не установлено" (должно соответствовать
            framework_type_status).
        3.  assignment_mechanism_status — application / act / registry /
            other / not_defined.
        4.  assignment_mechanism_display — "Через заявку" / "Через акт" /
            "Через реестр" / "Иной механизм" / "Не установлено"
            (должно соответствовать assignment_mechanism_status).
        5.  transfer_moment_status — specified / not_defined.
        6.  framework_assignment_summary — сводка одной строкой.
        7.  evidence — массив цитат с clause_ref и quote.
        </task>

        <rules>
        - Используй только текст договора.
        - framework_type_status: "framework" — рамочный; "single_claim"
          — единичная уступка; "mixed" — оба типа; "not_defined" — не
          определён.
        - assignment_mechanism_status: "application" — через заявку;
          "act" — через акт; "registry" — через реестр; "other" — иной;
          "not_defined" — не определён.
        - transfer_moment_status: "specified" — момент прямо указан;
          "not_defined" — не указан. Конкретику момента обязательно
          отражай в summary.
        - Display-поля строго соответствуют raw enum:
            framework_type_status:
              framework -> "Рамочный";
              single_claim -> "Единичная уступка";
              mixed -> "Смешанный";
              not_defined -> "Не установлено".
            assignment_mechanism_status:
              application -> "Через заявку";
              act -> "Через акт";
              registry -> "Через реестр";
              other -> "Иной механизм";
              not_defined -> "Не установлено".
        - framework_assignment_summary — одной строкой, формат:
          "Тип: <...>; Механизм: <...>; Момент перехода: <...>".
        - Запрещены значения null, None и пустые строки. Для status-полей
          используй "not_defined". Для display-полей — "Не установлено".
        - В evidence включай только дословные цитаты из текста договора.
        - Верни РОВНО один JSON-объект со всеми 6 ключами без какого-либо
          дополнительного текста до или после. Начни ответ сразу с
          открывающей фигурной скобки и закончи закрывающей. НЕ пиши
          Markdown, списки, код-фенсы. Ответ должен быть валидным JSON,
          пригодным для парсинга через json.loads без предварительной
          обработки.
        </rules>
      fields:
        - name: "framework_type_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["framework", "single_claim", "mixed", "not_defined"]
          description: "Тип договора (raw enum)."
          required: true
          display_in_grid: false
        - name: "framework_type_display"
          type: "string"
          presentation: "fact"
          label: "Тип договора"
          description: "User-facing: Рамочный / Единичная уступка / Смешанный / Не установлено."
          required: true
          display_in_grid: true
          display_priority: 1
        - name: "assignment_mechanism_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["application", "act", "registry", "other", "not_defined"]
          description: "Механизм уступки (raw enum)."
          required: true
          display_in_grid: false
        - name: "assignment_mechanism_display"
          type: "string"
          presentation: "fact"
          label: "Механизм уступки"
          description: "User-facing: Через заявку / Через акт / Через реестр / Иной механизм / Не установлено."
          required: true
          display_in_grid: true
          display_priority: 2
        - name: "transfer_moment_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["specified", "not_defined"]
          description: "Определённость момента перехода (raw enum)."
          required: true
          display_in_grid: false
        - name: "framework_assignment_summary"
          type: "string"
          presentation: "fact"
          label: "Сводка по механике уступки"
          description: "Компактная сводка: тип, механизм, момент перехода."
          required: true
          display_in_grid: true
          display_priority: 3
    retrieval:
      retrieval_profile: "assignment_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "рамочный факторинг заявка клиента акт уступки реестр требований момент перехода требования с даты подписания акта с даты выплаты финансирования уступка будущего требования партия требований оформление уступки"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - procedures
        - obligations
        - definitions
      negative_keywords:
        - "регресс"
        - "комиссия"
        - "уведомление должника"
        - "банкротство"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.10, 0.50]
        boost: 0.15
        scope: segment
      context_k: 8
      max_chunks: 10
      rerank: true
      enrichment_hints:
        preferred_segment_types:
          - "contract"
          - "amendment"
        excluded_segment_types:
          - "technical_specification"
          - "price_list"
        preferred_clause_functions:
          - "procedures"
          - "obligations"
          - "definitions"
        confidence_bonus_on_match: 0.10
        confidence_penalty_on_excluded_segment: 0.12
    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 600

  - id: factor_suspension_right_check
    name: "Право фактора отказать / приостановить финансирование (ст. 824 ГК РФ)"
    description: >
      Проверка наличия у фактора права отказать в финансировании
      конкретного требования, приостановить финансирование по портфелю
      и потребовать досрочного возврата ранее выплаченного.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "право отказать в финансировании"
        - "приостановить финансирование"
        - "приостановление финансирования"
        - "досрочный возврат финансирования"
        - "односторонний отказ фактора"
        - "право фактора отказать"
        - "не финансировать требование"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)(фактор|финансов\\w+\\s+агент).{0,60}(вправе|имеет\\s+право).{0,60}(отказ|приостанов|досрочн)"
        - "(?i)(отказ|приостанов).{0,40}финансирован"
        - "(?i)досрочн\\w+\\s+возврат.{0,40}финансирован"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор факторинга по Главе 43 ГК РФ.
        Проверяется только один вопрос: есть ли у фактора рычаги отказа,
        приостановки и досрочного возврата финансирования.
        Нормативные ориентиры:
        - ст. 824 ГК РФ — диспозитивные обязательства фактора;
        - принцип свободы договора (ст. 421 ГК РФ).
        Важно:
        - Твоя задача — не оценивать серьёзность риска.
        - Только установить, что прямо есть в тексте договора, а чего прямо нет.
        - Различай три разных права фактора:
            * refusal_right — отказать в финансировании конкретного
              требования (например, при появлении признаков его
              недействительности);
            * suspension_right — приостановить финансирование
              по портфелю (например, при ухудшении качества портфеля
              или нарушении заверений клиентом);
            * early_repayment_demand — потребовать досрочного возврата
              ранее выплаченного финансирования (при существенных
              нарушениях).
        - Это ключевые escape mechanisms фактора. Их отсутствие = фактор
          связан обязательствами, даже если появились риски.
        - Условия активации прав отражай в summary: что триггерит отказ /
          приостановку / досрочный возврат.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Право фактора отказать в финансировании конкретного требования.
        2. Право фактора приостановить финансирование по портфелю.
        3. Право фактора потребовать досрочного возврата финансирования.
        4. Составь краткую сводку с указанием условий активации.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Если данные не указаны прямо:
           - для status-полей верни "not_defined";
           - для display-полей верни "Не предусмотрено" / "Не установлено"
             по роду.
        4. Запрещены значения: null, None, пустые строки — не используй их
           никогда. Допустимые fallback-значения: "not_defined",
           "Не предусмотрено", "Не установлено".
        5. refusal_right_status / suspension_right_status /
           early_repayment_demand_status:
           "present" — соответствующее право прямо предусмотрено
             в договоре;
           "not_defined" — право не предусмотрено.
        6. factor_rights_summary — одна строка, формат:
           "Отказ: <да/нет>; Приостановление: <да/нет>;
           Досрочный возврат: <да/нет>".
           Если указаны условия активации — отражай их кратко
           (например, «при недействительности требования»).
        7. В evidence включай только дословные цитаты из текста договора.
        8. Верни РОВНО один JSON-объект со всеми 8 ключами без какого-либо
           дополнительного текста до или после. Начни ответ сразу с
           открывающей фигурной скобки и закончи закрывающей. НЕ пиши
           Markdown, списки, код-фенсы. Ответ должен быть валидным JSON,
           пригодным для парсинга через json.loads без предварительной
           обработки.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — полный набор прав:
        Фрагмент:
        "Фактор вправе отказать в финансировании конкретного требования
        при обнаружении признаков его недействительности. Фактор вправе
        приостановить финансирование по портфелю при нарушении Клиентом
        заверений. При существенном нарушении Клиентом своих обязательств
        Фактор вправе потребовать досрочного возврата ранее выплаченного
        финансирования."
        Ответ:
        {
          "refusal_right_status": "present",
          "refusal_right_display": "Предусмотрено",
          "suspension_right_status": "present",
          "suspension_right_display": "Предусмотрено",
          "early_repayment_demand_status": "present",
          "early_repayment_demand_display": "Предусмотрено",
          "factor_rights_summary": "Отказ: да (при недействительности требования); Приостановление: да (при нарушении заверений); Досрочный возврат: да (при существенном нарушении)",
          "evidence": [
            {
              "clause_ref": "п. 5.4",
              "quote": "Фактор вправе отказать в финансировании конкретного требования при обнаружении признаков его недействительности."
            }
          ]
        }

        Пример 2 — прав фактора нет:
        Фрагмент:
        "Фактор обязуется финансировать все уступаемые Клиентом требования
        в порядке и на условиях, предусмотренных настоящим Договором."
        Ответ:
        {
          "refusal_right_status": "not_defined",
          "refusal_right_display": "Не предусмотрено",
          "suspension_right_status": "not_defined",
          "suspension_right_display": "Не предусмотрено",
          "early_repayment_demand_status": "not_defined",
          "early_repayment_demand_display": "Не предусмотрено",
          "factor_rights_summary": "Отказ: нет; Приостановление: нет; Досрочный возврат: нет",
          "evidence": [
            {
              "clause_ref": "п. 3.1",
              "quote": "Фактор обязуется финансировать все уступаемые Клиентом требования в порядке и на условиях, предусмотренных настоящим Договором."
            }
          ]
        }

        Пример 3 — текст есть, но вывод частичный
        (только право отказа, без приостановки и досрочного возврата):
        Фрагмент:
        "Фактор вправе отказаться от финансирования требования
        в случае выявления обстоятельств, свидетельствующих о его
        недействительности."
        Ответ:
        {
          "refusal_right_status": "present",
          "refusal_right_display": "Предусмотрено",
          "suspension_right_status": "not_defined",
          "suspension_right_display": "Не предусмотрено",
          "early_repayment_demand_status": "not_defined",
          "early_repayment_demand_display": "Не предусмотрено",
          "factor_rights_summary": "Отказ: да (при недействительности требования); Приостановление: нет; Досрочный возврат: нет",
          "evidence": [
            {
              "clause_ref": "п. 5.4",
              "quote": "Фактор вправе отказаться от финансирования требования в случае выявления обстоятельств, свидетельствующих о его недействительности."
            }
          ]
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о праве отказа.
        2. Найди прямую цитату о праве приостановки.
        3. Найди прямую цитату о праве досрочного возврата.
        4. Если указано только одно право — отражай точечно.
        5. Согласуй raw enum и display:
           refusal_right_status / suspension_right_status /
           early_repayment_demand_status -> *_display:
             "present" -> "Предусмотрено";
             "not_defined" -> "Не предусмотрено".
        6. Если прямой цитаты нет — верни "not_defined" для status-полей
           и "Не предусмотрено" для display-полей.
        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь РОВНО одним JSON-объектом без какого-либо дополнительного
        текста до или после, со всеми 8 ключами:
        {
          "refusal_right_status": "<present / not_defined>",
          "refusal_right_display": "<Предусмотрено / Не предусмотрено>",
          "suspension_right_status": "<present / not_defined>",
          "suspension_right_display": "<Предусмотрено / Не предусмотрено>",
          "early_repayment_demand_status": "<present / not_defined>",
          "early_repayment_demand_display": "<Предусмотрено / Не предусмотрено>",
          "factor_rights_summary": "<сводка одной строкой>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 8
      temperature: 0.0
      max_tokens: 800
    store_payload: true

    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false
      llm_max_tokens: 1200
      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора факторинга
        сведения о правах фактора: отказать в финансировании конкретного
        требования, приостановить финансирование по портфелю,
        потребовать досрочного возврата финансирования.
        Не анализируй комиссию, уведомление должника или банкротство.
        Различай три разных права — каждое отражай отдельно.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие 8 полей (все ключи должны присутствовать
        в ответе, даже если значение — fallback):
        1.  refusal_right_status — present / not_defined.
        2.  refusal_right_display — "Предусмотрено" / "Не предусмотрено"
            (должно соответствовать refusal_right_status).
        3.  suspension_right_status — present / not_defined.
        4.  suspension_right_display — "Предусмотрено" /
            "Не предусмотрено" (должно соответствовать
            suspension_right_status).
        5.  early_repayment_demand_status — present / not_defined.
        6.  early_repayment_demand_display — "Предусмотрено" /
            "Не предусмотрено" (должно соответствовать
            early_repayment_demand_status).
        7.  factor_rights_summary — сводка одной строкой.
        8.  evidence — массив цитат с clause_ref и quote.
        </task>

        <rules>
        - Используй только текст договора.
        - refusal_right_status: "present" — есть право отказать
          в финансировании конкретного требования;
          "not_defined" — нет.
        - suspension_right_status: "present" — есть право приостановить
          финансирование по портфелю; "not_defined" — нет.
        - early_repayment_demand_status: "present" — есть право
          потребовать досрочного возврата финансирования;
          "not_defined" — нет.
        - Display-поля строго соответствуют raw enum:
            refusal_right_status:
              present -> "Предусмотрено";
              not_defined -> "Не предусмотрено".
            suspension_right_status:
              present -> "Предусмотрено";
              not_defined -> "Не предусмотрено".
            early_repayment_demand_status:
              present -> "Предусмотрено";
              not_defined -> "Не предусмотрено".
        - factor_rights_summary — одной строкой, формат:
          "Отказ: <да/нет>; Приостановление: <да/нет>;
          Досрочный возврат: <да/нет>". Условия активации указывай
          кратко в скобках.
        - Запрещены значения null, None и пустые строки. Для status-полей
          используй "not_defined". Для display-полей — "Не предусмотрено".
        - В evidence включай только дословные цитаты из текста договора.
        - Верни РОВНО один JSON-объект со всеми 8 ключами без какого-либо
          дополнительного текста до или после. Начни ответ сразу с
          открывающей фигурной скобки и закончи закрывающей. НЕ пиши
          Markdown, списки, код-фенсы. Ответ должен быть валидным JSON,
          пригодным для парсинга через json.loads без предварительной
          обработки.
        </rules>
      fields:
        - name: "refusal_right_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["present", "not_defined"]
          description: "Наличие права отказать в финансировании (raw enum)."
          required: true
          display_in_grid: false
        - name: "refusal_right_display"
          type: "string"
          presentation: "fact"
          label: "Право отказать в финансировании"
          description: "User-facing: Предусмотрено / Не предусмотрено."
          required: true
          display_in_grid: true
          display_priority: 1
        - name: "suspension_right_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["present", "not_defined"]
          description: "Наличие права приостановить финансирование (raw enum)."
          required: true
          display_in_grid: false
        - name: "suspension_right_display"
          type: "string"
          presentation: "fact"
          label: "Право приостановить финансирование"
          description: "User-facing: Предусмотрено / Не предусмотрено."
          required: true
          display_in_grid: true
          display_priority: 2
        - name: "early_repayment_demand_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["present", "not_defined"]
          description: "Наличие права требовать досрочного возврата (raw enum)."
          required: true
