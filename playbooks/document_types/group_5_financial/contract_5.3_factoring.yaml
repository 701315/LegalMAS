  - id: hidden_factoring_penalties_check
    name: "Неустойка за просрочку перечисления при скрытом факторинге (ст. 330, 830 ГК РФ)"
    description: >
      Проверка наличия неустойки / пени за просрочку перечисления
      клиентом полученных от должника сумм в пользу фактора при
      скрытом (конфиденциальном) факторинге.
    triggers:
      any: ["hidden_factoring"]
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "неустойка за просрочку перечисления"
        - "пеня за просрочку"
        - "ответственность клиента за просрочку"
        - "санкции за нарушение срока перечисления"
        - "скрытый факторинг"
        - "конфиденциальный факторинг"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)неустойк.{0,60}(просрочк|перечисл)"
        - "(?i)пен[ия].{0,60}(просрочк|перечисл)"
        - "(?i)просрочк.{0,60}перечисл.{0,60}(полученн|сумм)"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор скрытого (конфиденциального) факторинга
        по Главе 43 ГК РФ.
        Проверяется только один вопрос: финансовые санкции за просрочку
        перечисления клиентом полученных от должника сумм в пользу фактора.
        Нормативные ориентиры:
        - ст. 330 ГК РФ — неустойка;
        - ст. 830 ГК РФ — исполнение должником.
        Важно:
        - Твоя задача — не оценивать серьёзность риска.
        - Только установить, что прямо есть в тексте договора, а чего прямо нет.
        - При скрытом факторинге должник не уведомляется и платит клиенту,
          а клиент перечисляет полученное фактору. Именно неустойка
          стимулирует клиента своевременно перечислять.
        - Различай:
            * late_transfer_penalty_status — есть ли неустойка за
              просрочку перечисления;
            * late_transfer_penalty_rate_status — указан ли конкретный
              размер (процент за день, фиксированная сумма и т.п.).
        - Механизмы защиты фактора (перечисление, срок, спецсчёт,
          отчётность, право уведомить должника) проверяются в отдельном
          check-е hidden_factoring_protection_check. Здесь — только
          финансовые санкции.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Наличие неустойки / пени за просрочку перечисления.
        2. Размер неустойки (если указан).
        3. Составь краткую сводку.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Если данные не указаны прямо:
           - для status-полей верни "not_defined";
           - для display-полей верни "Не предусмотрена" / "Не установлена"
             по роду.
        4. Запрещены значения: null, None, пустые строки — не используй их
           никогда. Допустимые fallback-значения: "not_defined",
           "Не предусмотрена", "Не установлена".
        5. late_transfer_penalty_status:
           "present" — есть неустойка / пеня / иная финансовая санкция
             за просрочку перечисления клиентом полученных от должника
             сумм;
           "not_defined" — такая санкция в тексте отсутствует.
        6. late_transfer_penalty_rate_status:
           "specified" — прямо указан размер неустойки (процент за день,
             фиксированная сумма, комбинированный механизм);
           "not_defined" — размер не указан.
        7. hidden_factoring_penalty_summary — одна строка, формат:
           "Неустойка: <да/нет>; Размер: <...>; Механизм: <...>".
           Если размер указан — включай его (например, «0,2% в день»).
        8. В evidence включай только дословные цитаты из текста договора.
        9. Верни РОВНО один JSON-объект со всеми 6 ключами без какого-либо
           дополнительного текста до или после. Начни ответ сразу с
           открывающей фигурной скобки и закончи закрывающей. НЕ пиши
           Markdown, списки, код-фенсы. Ответ должен быть валидным JSON,
           пригодным для парсинга через json.loads без предварительной
           обработки.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — неустойка с конкретным размером:
        Фрагмент:
        "За нарушение срока перечисления полученных от должника сумм
        Клиент уплачивает Фактору неустойку в размере 0,2% от просроченной
        суммы за каждый день просрочки."
        Ответ:
        {
          "late_transfer_penalty_status": "present",
          "late_transfer_penalty_display": "Предусмотрена",
          "late_transfer_penalty_rate_status": "specified",
          "late_transfer_penalty_rate_display": "0,2% в день",
          "hidden_factoring_penalty_summary": "Неустойка: да (0,2% в день от просроченной суммы); Размер: 0,2% в день; Механизм: за каждый день просрочки",
          "evidence": [
            {
              "clause_ref": "п. 8.4",
              "quote": "За нарушение срока перечисления полученных от должника сумм Клиент уплачивает Фактору неустойку в размере 0,2% от просроченной суммы за каждый день просрочки."
            }
          ]
        }

        Пример 2 — неустойки нет:
        Фрагмент:
        "Клиент обязуется перечислить Фактору полученные от должника
        суммы в течение 1 рабочего дня с даты их поступления."
        Ответ:
        {
          "late_transfer_penalty_status": "not_defined",
          "late_transfer_penalty_display": "Не предусмотрена",
          "late_transfer_penalty_rate_status": "not_defined",
          "late_transfer_penalty_rate_display": "Не установлена",
          "hidden_factoring_penalty_summary": "Неустойка: нет; Размер: Не установлена; Механизм: отсутствует",
          "evidence": [
            {
              "clause_ref": "п. 8.4",
              "quote": "Клиент обязуется перечислить Фактору полученные от должника суммы в течение 1 рабочего дня с даты их поступления."
            }
          ]
        }

        Пример 3 — текст есть, но вывод частичный
        (неустойка упомянута, конкретный размер отсутствует):
        Фрагмент:
        "За нарушение срока перечисления Клиент несёт ответственность
        в соответствии с законодательством Российской Федерации."
        Ответ:
        {
          "late_transfer_penalty_status": "present",
          "late_transfer_penalty_display": "Предусмотрена",
          "late_transfer_penalty_rate_status": "not_defined",
          "late_transfer_penalty_rate_display": "Не установлена",
          "hidden_factoring_penalty_summary": "Неустойка: да (общая отсылка к законодательству); Размер: Не установлена; Механизм: по законодательству РФ",
          "evidence": [
            {
              "clause_ref": "п. 8.4",
              "quote": "За нарушение срока перечисления Клиент несёт ответственность в соответствии с законодательством Российской Федерации."
            }
          ]
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о неустойке за просрочку перечисления.
        2. Найди прямую цитату о размере неустойки (если указан).
        3. Не дублируй детальный анализ механизмов защиты фактора —
           они в отдельном check-е hidden_factoring_protection_check.
        4. Согласуй raw enum и display:
           late_transfer_penalty_status -> late_transfer_penalty_display:
             "present" -> "Предусмотрена";
             "not_defined" -> "Не предусмотрена".
           late_transfer_penalty_rate_status -> late_transfer_penalty_rate_display:
             "specified" -> конкретный размер текстом (например, "0,2% в день");
             "not_defined" -> "Не установлена".
        5. Если прямой цитаты нет — верни "not_defined" для status-полей
           и соответствующий fallback для display-полей.
        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь РОВНО одним JSON-объектом без какого-либо дополнительного
        текста до или после, со всеми 6 ключами:
        {
          "late_transfer_penalty_status": "<present / not_defined>",
          "late_transfer_penalty_display": "<Предусмотрена / Не предусмотрена>",
          "late_transfer_penalty_rate_status": "<specified / not_defined>",
          "late_transfer_penalty_rate_display": "<конкретный размер или 'Не установлена'>",
          "hidden_factoring_penalty_summary": "<сводка одной строкой>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 8
      temperature: 0.0
      max_tokens: 700
    store_payload: true

# ════════════════════════════════════════════════════════════════════════════
# БЛОК 5: DD_REQUEST_TEMPLATES
# Читается: DDRequestTemplateLoader
# ════════════════════════════════════════════════════════════════════════════
    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false
      llm_max_tokens: 1000
      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора скрытого
        факторинга сведения о неустойке за просрочку перечисления
        клиентом полученных от должника сумм: наличие, размер.
        Не анализируй регресс, комиссию, уведомление должника,
        банкротство или механизмы защиты фактора (они в отдельном
        check-е hidden_factoring_protection_check).
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие 6 полей (все ключи должны присутствовать
        в ответе, даже если значение — fallback):
        1.  late_transfer_penalty_status — present / not_defined.
        2.  late_transfer_penalty_display — "Предусмотрена" /
            "Не предусмотрена" (должно соответствовать
            late_transfer_penalty_status).
        3.  late_transfer_penalty_rate_status — specified / not_defined.
        4.  late_transfer_penalty_rate_display — конкретный размер
            текстом (например, "0,2% в день") или "Не установлена"
            (должно соответствовать late_transfer_penalty_rate_status).
        5.  hidden_factoring_penalty_summary — сводка одной строкой.
        6.  evidence — массив цитат с clause_ref и quote.
        </task>

        <rules>
        - Используй только текст договора.
        - late_transfer_penalty_status: "present" — есть неустойка,
          пеня или иная финансовая санкция за просрочку перечисления;
          "not_defined" — нет.
        - late_transfer_penalty_rate_status: "specified" — указан
          конкретный размер; "not_defined" — размер не указан.
        - Display-поля строго соответствуют raw enum:
            late_transfer_penalty_status:
              present -> "Предусмотрена";
              not_defined -> "Не предусмотрена".
            late_transfer_penalty_rate_status:
              specified -> конкретный размер текстом;
              not_defined -> "Не установлена".
        - hidden_factoring_penalty_summary — одной строкой, формат:
          "Неустойка: <да/нет>; Размер: <...>; Механизм: <...>".
        - Запрещены значения null, None и пустые строки. Для status-полей
          используй "not_defined". Для display-полей — "Не предусмотрена"
          / "Не установлена".
        - В evidence включай только дословные цитаты из текста договора.
        - Верни РОВНО один JSON-объект со всеми 6 ключами без какого-либо
          дополнительного текста до или после. Начни ответ сразу с
          открывающей фигурной скобки и закончи закрывающей. НЕ пиши
          Markdown, списки, код-фенсы. Ответ должен быть валидным JSON,
          пригодным для парсинга через json.loads без предварительной
          обработки.
        </rules>
      fields:
        - name: "late_transfer_penalty_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["present", "not_defined"]
          description: "Наличие неустойки за просрочку перечисления (raw enum)."
          required: true
          display_in_grid: false
        - name: "late_transfer_penalty_display"
          type: "string"
          presentation: "fact"
          label: "Неустойка за просрочку перечисления"
          description: "User-facing: Предусмотрена / Не предусмотрена."
          required: true
          display_in_grid: true
          display_priority: 1
        - name: "late_transfer_penalty_rate_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["specified", "not_defined"]
          description: "Определённость размера неустойки (raw enum)."
          required: true
          display_in_grid: false
        - name: "late_transfer_penalty_rate_display"
          type: "string"
          presentation: "fact"
          label: "Размер неустойки"
          description: "User-facing: конкретный размер или 'Не установлена'."
          required: true
          display_in_grid: true
          display_priority: 2
        - name: "hidden_factoring_penalty_summary"
          type: "string"
          presentation: "fact"
          label: "Сводка по санкциям при скрытом факторинге"
          description: "Компактная сводка: неустойка, размер, механизм."
          required: true
          display_in_grid: true
          display_priority: 3
    retrieval:
      retrieval_profile: "assignment_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "неустойка за просрочку перечисления пеня за просрочку скрытый факторинг конфиденциальный факторинг санкции за нарушение срока перечисления ответственность клиента за просрочку перечисления полученных сумм штраф за нарушение срока"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - remedies
      negative_keywords:
        - "регресс"
        - "комиссия"
        - "уведомление должника"
        - "банкротство"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.30, 0.75]
        boost: 0.15
        scope: segment
      context_k: 8
      max_chunks: 10
      rerank: true
      enrichment_hints:
        preferred_segment_types:
          - "contract"
          - "amendment"
        excluded_segment_types:
          - "technical_specification"
          - "price_list"
        preferred_clause_functions:
          - "obligations"
          - "remedies"
        confidence_bonus_on_match: 0.10
        confidence_penalty_on_excluded_segment: 0.12
    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 600
dd_request_templates:
  factoring_parties_identification:
    text: >
      Просим предоставить по {doc_names}: полные реквизиты финансового агента
      и клиента, подтверждение статуса фактора как допустимого субъекта
      (банк / коммерческая организация / факторинговая компания),
      полномочия подписантов.
    addressee: "Фактор / Клиент"
  factoring_subject_extraction:
    text: >
      Просим предоставить по {doc_names}: базовую структуру сделки факторинга —
      финансового агента, клиента, должника, основание уступаемого требования,
      сумму финансирования, вознаграждение фактора, вид факторинга
      (с регрессом / без регресса) и порядок уведомления должника.
    addressee: "Фактор / Клиент"
  assigned_claim_identification_check:
    text: >
      Просим предоставить по {doc_names}: точное описание уступаемых требований,
      сведения о должниках, основаниях возникновения требований, суммах,
      сроках оплаты и реестр уступаемой дебиторской задолженности.
    addressee: "Клиент"
  financing_and_fee_structure_check:
    text: >
      Просим предоставить по {doc_names}: размер финансирования, даты/условия
      его перечисления, полный перечень комиссий, дисконтов и иных платежей,
      а также пример расчёта чистой суммы, подлежащей выплате клиенту.
    addressee: "Фактор"
  recourse_allocation_check:
    text: >
      Просим предоставить по {doc_names}: детальное описание того, является ли
      факторинг регрессным или безрегрессным, кто несёт риск неплатежа должника,
      при каких условиях возникает обязанность клиента вернуть финансирование
      и каков предел такой ответственности.
    addressee: "Фактор / Клиент"
  debtor_notification_check:
    text: >
      Просим предоставить по {doc_names}: порядок уведомления должника об уступке,
      форму уведомления, ответственную сторону, доказательства вручения и указание,
      с какого момента должник обязан платить фактору.
    addressee: "Фактор / Клиент"
  setoff_and_double_assignment_risk_check:
    text: >
      Просим предоставить по {doc_names}: гарантии отсутствия встречных требований
      должника к клиенту, условия компенсации убытков фактора при зачёте,
      а также запрет повторной уступки уже уступленного требования.
    addressee: "Клиент / Фактор"
  document_transfer_and_bankruptcy_check:
    text: >
      Просим предоставить по {doc_names}: перечень первичных документов,
      передаваемых фактору, форму акта приёма-передачи документов,
      а также заверения клиента об отсутствии признаков банкротства
      и о рыночном характере сделки.
    addressee: "Клиент"
  debtor_defenses_check:
    text: >
      Просим предоставить по {doc_names}: заверения клиента об отсутствии
      оснований для возражений должника и встречных требований,
      а также механизм компенсации фактору при успешном зачёте должником.
    addressee: "Клиент / Юридический советник"
  hidden_factoring_protection_check:
    text: >
      По {doc_names} (скрытый факторинг) просим предоставить: порядок перечисления
      клиентом полученных от должника средств фактору, сроки перечисления,
      требования к специальному счёту, отчётность клиента и право фактора
      уведомить должника при нарушении.
    addressee: "Фактор / Юридический советник"
  claim_validity_warranties_check:
    text: >
      Просим предоставить по {doc_names}: полный комплект заверений клиента
      о действительности требования — существование, непогашенность, отсутствие
      оспаривания, действительность основного договора, выполнение поставки/услуг,
      а также условие о возмещении при недействительности.
    addressee: "Клиент"
  excess_collection_return:
    text: >
      Просим уточнить в {doc_names}: как распределяются суммы, полученные фактором
      от должника сверх размера финансирования и вознаграждения, и в какой срок
      излишек перечисляется клиенту.
    addressee: "Фактор"
  tax_risk_allocation:
    text: >
      Просим предоставить по {doc_names}: налоговую квалификацию уступки,
      порядок учёта НДС и иных налогов, распределение налоговых рисков
      между сторонами и подтверждение того, кто несёт налоговые обязательства
      по факторинговому вознаграждению.
    addressee: "Налоговый консультант / Юридический советник"
  assignment_prohibition_disclosure:
    text: >
      Просим предоставить по {doc_names}: заверение клиента об отсутствии запрета
      уступки в договоре с должником или раскрытие такого запрета с указанием,
      как распределяется риск ответственности.
    addressee: "Клиент"
  term_and_termination:
    text: >
      Просим уточнить в {doc_names}: срок действия договора, условия пролонгации,
      основания и порядок расторжения, последствия расторжения для уже уступленных
      требований.
    addressee: "Юридический советник"
  governing_law_and_disputes:
    text: >
      Просим уточнить в {doc_names}: применимое право, компетентный суд
      для разрешения споров, порядок досудебного урегулирования.
    addressee: "Юридический советник"
  confidentiality_clause:
    text: >
      Просим добавить в {doc_names} раздел о конфиденциальности: перечень
      конфиденциальных сведений, срок неразглашения, исключения.
    addressee: "Юридический советник"
  _default:
    text: >
      Просим предоставить дополнительную информацию по вопросу «{check_name}»
      применительно к {doc_names}.
    addressee: "Юридический советник"


