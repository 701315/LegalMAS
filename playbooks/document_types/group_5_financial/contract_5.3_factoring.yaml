    name: "Возврат клиенту излишка, полученного от должника"
    description: "Проверяет наличие механизма возврата клиенту суммы сверх финансирования и вознаграждения фактора"
    legal_base: "ст. 831 ГК РФ"
    severity: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
      keywords:
        - "возврат излишка"
        - "разница подлежит возврату клиенту"
        - "сумма, превышающая финансирование"
        - "остаток перечисляется клиенту"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)превыша(ет|ющая).*финансирован"
        - "(?i)возврат.*клиент"

  - id: "recourse_limitation"
    name: "Регресс: ограничения и лимит ответственности клиента"
    description: "Проверяет наличие понятных условий регресса и ограничения ответственности клиента"
    legal_base: "ст. 831 ГК РФ"
    severity: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers:
      any: ["recourse_factoring"]
    rules:
      keywords:
        - "регрессное требование"
        - "максимальная сумма регресса"
        - "лимит ответственности клиента"
        - "не превышает сумму финансирования"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)регрессн(ое|ого)\\s+требован"
        - "(?i)не\\s+превышает\\s+сумму\\s+финансирован"

  - id: "non_recourse_confirmation"
    name: "Безрегрессный факторинг: прямое подтверждение"
    description: "Проверяет явное закрепление безрегрессного характера и принятия риска фактором"
    legal_base: "ст. 831 ГК РФ"
    severity: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers:
      any: ["non_recourse_factoring"]
    rules:
      keywords:
        - "без регресса"
        - "безрегрессный"
        - "риск неплатежа несет фактор"
        - "фактор не вправе требовать возврата финансирования"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)(без\\s+регресса|безрегрессн)"
        - "(?i)риск\\s+неплатежа\\s+несет\\s+фактор"

  - id: "anti_dilution_and_setoff_protection"
    name: "Защита от зачета встречных требований должника"
    description: "Проверяет наличие гарантий и механизмов защиты от зачета"
    legal_base: "ст. 832 ГК РФ"
    severity: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
      keywords:
        - "встречные требования"
        - "зачет"
        - "отсутствие встречных требований"
        - "компенсация при зачете"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)встречн(ые|ых)\\s+требован"
        - "(?i)зачет"

  - id: "prohibition_of_subsequent_assignment"
    name: "Запрет повторной уступки того же требования"
    description: "Проверяет наличие запрета клиенту повторно уступать уже проданное фактору требование"
    legal_base: "ст. 829 ГК РФ"
    severity: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
      keywords:
        - "запрет последующей уступки"
        - "клиент не вправе уступать"
        - "запрет повторной уступки"
        - "исключительное право фактора"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)не\\s+вправе\\s+уступать"
        - "(?i)повторн(ая|ой)\\s+уступк|последующ(ая|ей)\\s+уступк"

  - id: "document_transfer_obligation"
    name: "Передача подтверждающих документов по требованию"
    description: "Проверяет обязанность клиента передать фактору комплект документов по уступаемому требованию"
    legal_base: "ст. 826, 830 ГК РФ"
    severity: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
      keywords:
        - "передача документов"
        - "оригиналы документов"
        - "накладные"
        - "счета-фактуры"
        - "акт приема-передачи документов"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)передач[аи]\\s+документ"
        - "(?i)накладн|счет[а-]?фактур"
        - "(?i)акт\\s+приема[- ]передачи\\s+документ"

  - id: "bankruptcy_claw_back_protection"
    name: "Банкротные заверения клиента"
    description: "Проверяет наличие заверений клиента об отсутствии признаков банкротства и о рыночности сделки"
    legal_base: "ст. 61.2, 61.3 ФЗ № 127-ФЗ"
    severity: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
      keywords:
        - "отсутствие признаков банкротства"
        - "не находится в процедуре банкротства"
        - "рыночные условия сделки"
        - "эквивалентность встречного предоставления"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)признак(ов)?\\s+банкротств"
        - "(?i)рыночн(ые|ых)\\s+услови"
        - "(?i)эквивалентност"

  - id: "tax_risk_allocation"
    name: "Налоговые последствия и распределение налоговых рисков"
    description: "Проверяет наличие налоговых оговорок по уступке и факторинговому вознаграждению"
    legal_base: "НК РФ ст. 155, 279"
    severity: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
      keywords:
        - "налоговые последствия"
        - "ндс"
        - "налоговая база"
        - "убыток от уступки"
        - "стороны самостоятельно исполняют налоговые обязательства"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)налогов(ые|ых)\\s+последств"
        - "(?i)\\bНДС\\b|налогов(ая|ой)\\s+баз"

  - id: "assignment_prohibition_disclosure"
    name: "Раскрытие запрета уступки в основном договоре (ст. 828 ГК РФ)"
    description: "Проверяет наличие заверений об отсутствии запрета уступки или раскрытие такого запрета"
    legal_base: "ст. 828 ГК РФ"
    severity: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
      keywords:
        - "запрет уступки"
        - "уступка запрещена"
        - "отсутствует запрет"
        - "клиент заверяет"
        - "согласие должника"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)(отсутств|нет).*(запрет|ограничен).*уступк"
        - "(?i)клиент.*(заверяет|гарантирует).*запрет"

  - id: "term_and_termination"
    name: "Срок действия договора и порядок расторжения"
    description: "Проверяет наличие срока действия и условий расторжения договора факторинга"
    legal_base: "ГК РФ (общие положения)"
    severity: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
      keywords:
        - "срок действия"
        - "вступает в силу"
        - "расторжение"
        - "прекращение договора"
        - "односторонний отказ"
        - "уведомление о расторжении"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)срок\\s+действи"
        - "(?i)расторжени[ея]"
        - "(?i)односторонн(ий|его)\\s+отказ"

  - id: "governing_law_and_disputes"
    name: "Применимое право и разрешение споров"
    description: "Проверяет наличие арбитражной оговорки и применимого права"
    legal_base: "ГК РФ, АПК РФ"
    severity: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
      keywords:
        - "применимое право"
        - "арбитражный суд"
        - "разрешение споров"
        - "подсудность"
        - "третейский суд"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)арбитражн(ый|ого)\\s+суд"
        - "(?i)применим(ое|ого)\\s+прав"

  - id: "confidentiality_clause"
    name: "Конфиденциальность условий договора"
    description: "Проверяет наличие условий о конфиденциальности"
    legal_base: "ст. 421 ГК РФ"
    severity: "low"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
      keywords:
        - "конфиденциальность"
        - "неразглашение"
        - "коммерческая тайна"
        - "не раскрывать третьим лицам"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)конфиденциал"
        - "(?i)не\\s+разглаш"

# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 7: DD_REQUEST_TEMPLATES
#  Читается: DDRequestTemplateLoader
#  Ключи = check_id из checks_v8 и doc_type_checks выше.
#  DDRequestTemplateLoader.render() матчит по exact или prefix.
# ════════════════════════════════════════════════════════════════════════════

dd_request_templates:

  factoring_subject_extraction:
    text: >
      Просим предоставить по {doc_names}: базовую структуру сделки факторинга —
      финансового агента, клиента, должника, основание уступаемого требования,
      сумму финансирования, вознаграждение фактора, вид факторинга
      (с регрессом / без регресса) и порядок уведомления должника.
    addressee: "Фактор / Клиент"

  factor_status_required:
    text: >
      Просим предоставить по {doc_names}: полные реквизиты финансового агента,
      организационно-правовую форму, подтверждение статуса коммерческой организации,
      а также сведения о лицензии, если фактором выступает банк или кредитная организация.
    addressee: "Фактор"

  factor_status_unclear:
    text: >
      В {doc_names} не выявлен достаточный статус финансового агента.
      Просим предоставить документы, подтверждающие допустимость участия данного лица
      в качестве фактора по договору факторинга.
    addressee: "Фактор / Юридический советник"

  assigned_claim_identification_check:
    text: >
      Просим предоставить по {doc_names}: точное описание уступаемых требований,
      сведения о должниках, основаниях возникновения требований, суммах,
      сроках оплаты и реестр уступаемой дебиторской задолженности.
    addressee: "Клиент"

  assigned_claim_description_required:
    text: >
      Просим уточнить в {doc_names}: предмет уступки, включая должника,
      сумму требования, основание возникновения требования и документы,
      подтверждающие это требование.
    addressee: "Клиент"

  future_claim_identification_required:
    text: >
      По {doc_names} с уступкой будущих требований просим предоставить:
      идентификацию будущих должников, базовые договоры, сроки возникновения и оплаты требований,
      а также механизм включения таких требований в реестр уступки.
    addressee: "Клиент / Юридический советник"

  future_claim_not_determinable:
    text: >
      В {doc_names} выявлен риск недостаточной определимости будущих требований.
      Просим срочно конкретизировать должников, основания возникновения требований,
      сроки оплаты и реестр требований.
    addressee: "Клиент / Юридический советник"

  financing_and_fee_structure_check:
    text: >
      Просим предоставить по {doc_names}: размер финансирования,
      даты/условия его перечисления, полный перечень комиссий,
      дисконтов и иных платежей, а также пример расчета чистой суммы,
      подлежащей выплате клиенту.
    addressee: "Фактор"

  financing_amount_and_procedure:
    text: >
      Просим уточнить в {doc_names}: сумму финансирования,
      порядок и сроки его предоставления, условия удержаний и основания
      для отказа в перечислении финансирования.
    addressee: "Фактор"

  factor_remuneration_required:
    text: >
      Просим раскрыть по {doc_names}: структуру вознаграждения фактора —
      комиссию, дисконт, проценты, сервисные платежи, и подтвердить,
      что иных платежей сверх указанных не взимается.
    addressee: "Фактор"

  transparent_commission_structure:
    text: >
      Просим предоставить по {doc_names}: исчерпывающий перечень комиссий и платежей
      фактора, исключить открытые ссылки на тарифы/одностороннее изменение
      и подтвердить итоговую стоимость факторингового обслуживания.
    addressee: "Фактор / Юридический советник"

  excess_collection_return:
    text: >
      Просим уточнить в {doc_names}: как распределяются суммы,
      полученные фактором от должника сверх размера финансирования и вознаграждения,
      и в какой срок излишек перечисляется клиенту.
    addressee: "Фактор"

  recourse_allocation_check:
    text: >
      Просим предоставить по {doc_names}: детальное описание того,
      является ли факторинг регрессным или безрегрессным, кто несет риск неплатежа должника,
      при каких условиях возникает обязанность клиента вернуть финансирование
      и каков предел такой ответственности.
    addressee: "Фактор / Клиент"

  factoring_type_required:
    text: >
      Просим прямо указать в {doc_names}, является ли факторинг
      факторингом с регрессом или без регресса, и устранить любые двусмысленные формулировки.
    addressee: "Юридический советник"

  recourse_limitation:
    text: >
      По {doc_names} (регрессный факторинг) просим предоставить:
      исчерпывающий перечень оснований регресса, лимит ответственности клиента,
      сроки предъявления регрессного требования и порядок его расчета.
    addressee: "Фактор / Юридический советник"

  non_recourse_confirmation:
    text: >
      По {doc_names} (безрегрессный факторинг) просим предоставить:
      прямое подтверждение отсутствия права регресса к клиенту
      и закрепление того, что кредитный риск должника несет фактор.
    addressee: "Фактор"

  non_recourse_contradiction:
    text: >
      В {doc_names} выявлено возможное противоречие между безрегрессной формулой
      и регрессными обязанностями клиента. Просим срочно привести договор
      к однозначной модели распределения риска.
    addressee: "Юридический советник / Фактор"

  debtor_notification_check:
    text: >
      Просим предоставить по {doc_names}: порядок уведомления должника об уступке,
      форму уведомления, ответственную сторону, доказательства вручения
      и указание, с какого момента должник обязан платить фактору.
    addressee: "Фактор / Клиент"

  debtor_notification_procedure:
    text: >
      Просим уточнить в {doc_names}: кто уведомляет должника,
      каким способом, в какие сроки и как подтверждается получение уведомления.
    addressee: "Юридический советник"

  debtor_payment_routing_unclear:
    text: >
      В {doc_names} неясно, кому и после какого уведомления должен платить должник.
      Просим срочно уточнить маршрут платежа, форму уведомления
      и последствия исполнения в пользу ненадлежащего получателя.
    addressee: "Юридический советник / Фактор"

  claim_validity_warranty:
    text: >
      Просим предоставить по {doc_names}: заверения клиента о действительности
      уступаемого требования, отсутствии его погашения, оспаривания, прекращения
      и иных обстоятельств, влияющих на взыскание.
    addressee: "Клиент"

  setoff_and_double_assignment_risk_check:
    text: >
      Просим предоставить по {doc_names}: гарантии отсутствия встречных требований
      должника к клиенту, условия компенсации убытков фактора при зачете,
      а также запрет повторной уступки уже уступленного требования.
    addressee: "Клиент / Фактор"

  anti_dilution_and_setoff_protection:
    text: >
      Просим включить/уточнить в {doc_names}: заверения клиента
      об отсутствии оснований для зачета и механизм компенсации фактора
      в случае уменьшения требования вследствие встречных требований должника.
    addressee: "Юридический советник"

  prohibition_of_subsequent_assignment:
    text: >
      Просим включить/уточнить в {doc_names}: прямой запрет повторной уступки
      того же требования третьим лицам и последствия нарушения этого запрета.
    addressee: "Юридический советник"

  document_transfer_and_bankruptcy_check:
    text: >
      Просим предоставить по {doc_names}: перечень первичных документов,
      передаваемых фактору, форму акта приема-передачи документов,
      а также заверения клиента об отсутствии признаков банкротства
      и о рыночном характере сделки.
    addressee: "Клиент"

  document_transfer_obligation:
    text: >
      Просим уточнить в {doc_names}: какие именно документы по уступаемому требованию
      клиент обязан передать фактору, в какие сроки и в какой форме,
      включая оригиналы/копии, электронные документы и подтверждение передачи.
    addressee: "Клиент"

  bankruptcy_claw_back_protection:
    text: >
      Просим предоставить по {doc_names}: заверения клиента об отсутствии признаков банкротства,
      информации о поданных заявлениях о банкротстве, просроченной задолженности,
      а также подтверждение рыночности и эквивалентности условий сделки.
    addressee: "Клиент / Юридический советник"

  tax_risk_allocation:
    text: >
      Просим предоставить по {doc_names}: налоговую квалификацию уступки,
      порядок учета НДС и иных налогов, распределение налоговых рисков между сторонами
      и подтверждение того, кто несет налоговые обязательства по факторинговому вознаграждению.
    addressee: "Налоговый консультант / Юридический советник"

  no_financing_element_red_flag:
    text: >
      В {doc_names} выявлен риск отсутствия самостоятельного элемента финансирования,
      что может переквалифицировать сделку в простую цессию.
      Просим уточнить размер, порядок и сроки финансирования клиента фактором.
    addressee: "Юридический советник / Фактор"

  debtor_defenses_check:
    text: >
      Просим предоставить по {doc_names}: заверения клиента об отсутствии
      оснований для возражений должника и встречных требований, а также
      механизм компенсации фактору при успешном зачёте должником.
    addressee: "Клиент / Юридический советник"

  hidden_factoring_protection_check:
    text: >
      По {doc_names} (скрытый факторинг) просим предоставить: порядок перечисления
      клиентом полученных от должника средств фактору, сроки перечисления,
      требования к специальному счёту, отчётность клиента и право фактора
      уведомить должника при нарушении.
    addressee: "Фактор / Юридический советник"

  hidden_factoring_double_payment_risk:
    text: >
      В {doc_names} выявлен риск двойного платежа при скрытом факторинге.
      Просим срочно предусмотреть механизм перевода средств фактору,
      специальный счёт и право фактора на уведомление должника.
    addressee: "Юридический советник / Фактор"

  claim_validity_warranties_check:
    text: >
      Просим предоставить по {doc_names}: полный комплект заверений клиента
      о действительности требования — существование, непогашенность, отсутствие
      оспаривания, действительность основного договора, выполнение поставки/услуг,
      а также условие о возмещении при недействительности.
    addressee: "Клиент"

  assignment_despite_prohibition_risk:
    text: >
      В {doc_names} выявлен риск наличия запрета уступки в основном договоре.
      Просим предоставить: заверение клиента об отсутствии такого запрета
      или раскрытие информации о запрете с распределением ответственности.
    addressee: "Клиент / Юридический советник"

  international_factoring_currency_control:
    text: >
      По {doc_names} (международный факторинг) просим предоставить: указание валюты,
      порядок соблюдения требований валютного контроля, обязательства по репатриации,
      распределение ответственности за валютные нарушения.
    addressee: "Юридический советник / Фактор"

  pledge_priority_conflict:
    text: >
      В {doc_names} выявлен риск конфликта с залогом дебиторской задолженности.
      Просим предоставить: заверение об отсутствии залога, раскрытие информации
      о существующих залогах, порядок разрешения приоритета.
    addressee: "Клиент / Юридический советник"

  assignment_prohibition_disclosure:
    text: >
      Просим предоставить по {doc_names}: заверение клиента об отсутствии
      запрета уступки в договоре с должником или раскрытие такого запрета
      с указанием, как распределяется риск ответственности.
    addressee: "Клиент"

  term_and_termination:
    text: >
      Просим уточнить в {doc_names}: срок действия договора, условия пролонгации,
      основания и порядок расторжения, последствия расторжения для
      уже уступленных требований.
    addressee: "Юридический советник"

  governing_law_and_disputes:
    text: >
      Просим уточнить в {doc_names}: применимое право, компетентный суд
      для разрешения споров, порядок досудебного урегулирования.
    addressee: "Юридический советник"

  confidentiality_clause:
    text: >
      Просим добавить в {doc_names} раздел о конфиденциальности:
      перечень конфиденциальных сведений, срок неразглашения, исключения.
    addressee: "Юридический советник"

  # Generic fallback
  _default:
    text: >
      Просим предоставить дополнительную информацию по вопросу «{check_name}»
      применительно к {doc_names}.
    addressee: "Юридический советник"
    