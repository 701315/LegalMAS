        weight: 0.82
      - pattern: "(?i)debtor[_\\s-]*finance|финансировани[ея][_\\s-]*(?:под[_\\s-]*)?(?:дебиторск|требовани)"
        kind: specific_subject
        weight: 0.82
      - pattern: "(?i)supply[_\\s-]*chain[_\\s-]*finance|reverse[_\\s-]*factoring"
        kind: specific_subject
        weight: 0.78
      - pattern: "(?i)invoice[_\\s-]*discount(?:ing)?|invoice[_\\s-]*financ(?:ing|e)"
        kind: generic_form
        weight: 0.54
