# CHECK 8: Передача документов и банкротные заверения
# ──────────────────────────────────────────────────────────────────────────
  - id: document_transfer_and_bankruptcy_check
    name: "Передача документов и банкротные заверения клиента (ст. 61.2 ФЗ-127)"
    description: >
      Фактографическая проверка обязанности клиента передать подтверждающие
      документы и заверений об отсутствии признаков банкротства.
