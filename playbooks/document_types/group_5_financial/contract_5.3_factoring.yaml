# ════════════════════════════════════════════════════════════════════════════
shared_patterns:
  money_amount: "(?i)\\b\\d[\\d\\s]*(?:руб|рублей|₽|коп|тыс|млн|млрд)"
  percentage_pattern: "(?i)\\b\\d+(?:[.,]\\d+)?\\s*%\\b"
  date_pattern: "(?i)\\b\\d{1,2}[.]\\d{1,2}[.]\\d{4}\\b"
  invoice_pattern: "(?i)(?:счет|инвойс|invoice|накладн|акт)\\s*№?\\s*[A-ZА-Я0-9\\-/]+"
  debtor_pattern: "(?i)(должник|дебитор)"
  claim_pattern: "(?i)(денежн(ое|ого)\\s+требован|дебиторск(ая|ой)\\s+задолженн)"

compliance_rules: []

# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 4: CHECKS_V8 — единственный рабочий слой юридического анализа
#  Читается: DocTypeCheckLoader._load_doc_type_checks()
# ════════════════════════════════════════════════════════════════════════════

checks_v8:

# ──────────────────────────────────────────────────────────────────────────
# CHECK 1: Стороны договора факторинга
# ──────────────────────────────────────────────────────────────────────────
  - id: factoring_parties_identification
    name: "Стороны договора: идентификация фактора и клиента"
    description: >
      Фактографическая проверка идентификации финансового агента (фактора)
      и клиента, их реквизитов, статуса фактора как допустимого субъекта,
      подписантов и оснований полномочий.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "финансовый агент"
        - "фактор"
        - "клиент"
        - "именуем"
        - "в лице"
        - "действующего на основании"
        - "банк"
        - "коммерческая организация"
        - "факторинговая компания"
        - "ИНН"
        - "ОГРН"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)(финансовый\\s+агент|фактор|клиент).*именуем"
        - "(?i)действующ[а-я]+\\s+на\\s+основании"
        - "(?i)(банк|коммерческ(ая|ой)\\s+организац|факторингов(ая|ой)\\s+компани)"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор финансирования под уступку денежного требования
        (факторинг) по Главе 43 ГК РФ (ст. 824–825).
        Проверяется только один вопрос: идентификация сторон — финансового агента
        (фактора) и клиента, их реквизиты, статус фактора, подписанты и полномочия.
        Нормативный ориентир:
        - ст. 825 ГК РФ — финансовый агент
        - ст. 432 ГК РФ — существенные условия
        Важно:
        - Твоя задача — не оценивать серьёзность риска.
        - Только установить, что прямо есть в тексте договора, а чего прямо нет.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Наименование и реквизиты финансового агента (фактора).
        2. Статус фактора (банк / коммерческая организация / факторинговая компания).
        3. Наименование и реквизиты клиента.
        4. Кто подписывает от каждой стороны и на каком основании.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Если данные не указаны прямо — возвращай "not_defined" / "Данные не определены".
        4. Не используй "None", "null", "not_defined" или пустые строки.
        5. В evidence включай только текст договора.
        6. Верни только один JSON-объект.

        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1:
        Фрагмент:
        "ООО «ФакторПлюс» (ИНН 7700000001, ОГРН 1027700000001), коммерческая
        организация, именуемое «Финансовый агент», в лице Генерального директора
        Иванова И.И., действующего на основании Устава, и ООО «Поставщик»
        (ИНН 7700000002), именуемое «Клиент», в лице директора Петрова П.П."
        Ответ:
        {
          "factor_details_status": "defined",
          "factor_details_value": "ООО «ФакторПлюс», ИНН 7700000001, ОГРН 1027700000001",
          "factor_status": "commercial_organization",
          "factor_signatory": "Генеральный директор Иванов И.И.",
          "factor_signatory_basis": "charter",
          "client_details_status": "defined",
          "client_details_value": "ООО «Поставщик», ИНН 7700000002",
          "client_signatory": "Директор Петров П.П.",
          "client_signatory_basis": "not_defined",
          "evidence": [
            {
              "clause_ref": "Преамбула",
              "quote": "ООО «ФакторПлюс» (ИНН 7700000001, ОГРН 1027700000001), коммерческая организация, именуемое «Финансовый агент»."
            }
          ]
        }

        Пример 2:
        Фрагмент:
        "Стороны заключили настоящий договор факторинга."
        Ответ:
        {
          "factor_details_status": "not_defined",
          "factor_details_value": "Данные не определены",
          "factor_status": "not_defined",
          "factor_signatory": "Данные не определены",
          "factor_signatory_basis": "not_defined",
          "client_details_status": "not_defined",
          "client_details_value": "Данные не определены",
          "client_signatory": "Данные не определены",
          "client_signatory_basis": "not_defined",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату с идентификацией фактора.
        2. Найди прямую цитату с идентификацией клиента.
        3. Найди прямую цитату о статусе фактора.
        4. Найди прямую цитату о подписантах и основаниях.
        5. Если прямой цитаты нет — верни "not_defined".
        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        {
          "factor_details_status": "<defined / not_defined>",
          "factor_details_value": "<реквизиты или 'Данные не определены'>",
          "factor_status": "<bank / commercial_organization / factoring_company / not_defined>",
          "factor_signatory": "<ФИО и должность или 'Данные не определены'>",
          "factor_signatory_basis": "<charter / poa / order / other / not_defined>",
          "client_details_status": "<defined / not_defined>",
          "client_details_value": "<реквизиты или 'Данные не определены'>",
          "client_signatory": "<ФИО и должность или 'Данные не определены'>",
          "client_signatory_basis": "<charter / poa / order / other / not_defined>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 700
      retrieval:
        retrieval_profile: "party_identification_check"
        corpus_scope: "primary_segment"
        levels:
          - "legal_unit"
          - "section"
        required_kind: "legal_unit"
        retrieval_query: "финансовый агент фактор клиент именуем в лице действующего на основании банк коммерческая организация факторинговая компания ИНН ОГРН реквизиты"
        preferred_unit_types:
          - obligation
          - general_provision
        excluded_unit_types:
          - definition
          - structural_anchor
          - technical_fragment
        preferred_clause_functions:
          - representations
          - boilerplate
        negative_keywords:
          - "уступка требования"
          - "финансирование"
          - "регресс"
          - "уведомление должника"
          - "комиссия"
          - "означает"
          - "в целях настоящего"
        position_bias:
          preferred_range: [0.0, 0.20]
          boost: 0.40
          scope: segment
        context_k: 6
        max_chunks: 8
        rerank: true
        enrichment_hints:
          preferred_segment_types:
            - "contract"
            - "amendment"
          excluded_segment_types:
            - "technical_specification"
            - "price_list"
          preferred_clause_functions:
            - "representations"
            - "boilerplate"
          confidence_bonus_on_match: 0.08
          confidence_penalty_on_excluded_segment: 0.15
      evidence:
        required: true
        min_snippet_length: 40
        max_snippet_length: 600
      extraction:
        enabled: true
        mode: "hybrid"
        compact_output: false
        llm_max_tokens: 1300
        llm_prompt_extraction: |
          <role>
          Ты — российский юрист. Извлеки из текста договора факторинга сведения
          о финансовом агенте (факторе) и клиенте: реквизиты, статус фактора,
          подписанты и основания полномочий.
          Не анализируй уступку, финансирование, регресс или уведомление должника.
          </role>
          <context>
          {context}
          </context>
          <task>
          Заполни строго следующие поля:
          1. factor_details_status — "defined" или "not_defined".
          2. factor_details_value — наименование и реквизиты фактора.
          3. factor_status — bank / commercial_organization / factoring_company / not_defined.
          4. factor_signatory — подписант фактора.
          5. factor_signatory_basis — charter / poa / order / other / not_defined.
          6. client_details_status — "defined" или "not_defined".
          7. client_details_value — наименование и реквизиты клиента.
          8. client_signatory — подписант клиента.
          9. client_signatory_basis — charter / poa / order / other / not_defined.
          Если данные отсутствуют:
          - статус = "not_defined"
          - текст = "Данные не определены"
          </task>
          <rules>
          - Используй только текст договора.
          - factor_status:
            "bank" — прямо указан банк или кредитная организация.
            "commercial_organization" — указано ООО, АО или иная коммерческая организация.
            "factoring_company" — прямо указана факторинговая компания.
            "not_defined" — статус не определён.
          - Не выводи статус фактора из нормы ст. 825 ГК РФ.
          - Верни только JSON.
          </rules>
        fields:
          - name: "factor_details_status"
            type: "string"
            presentation: "signal"
            allowed_values: ["defined", "not_defined"]
            description: "Статус идентификации фактора."
            required: true
          - name: "factor_details_value"
            type: "string"
            presentation: "fact"
            label: "Финансовый агент (фактор)"
            description: "Наименование и реквизиты финансового агента."
            required: true
            display_in_grid: true
            display_priority: 1
          - name: "factor_status"
            type: "string"
            presentation: "signal"
            allowed_values: ["bank", "commercial_organization", "factoring_company", "not_defined"]
            description: "Статус фактора как допустимого субъекта."
            required: true
          - name: "factor_signatory"
            type: "string"
            presentation: "fact"
            label: "Подписант фактора"
            description: "Подписант от финансового агента."
            required: false
            display_in_grid: false
          - name: "factor_signatory_basis"
            type: "string"
            presentation: "signal"
            allowed_values: ["charter", "poa", "order", "other", "not_defined"]
            description: "Основание полномочий подписанта фактора."
            required: false
          - name: "client_details_status"
            type: "string"
            presentation: "signal"
            allowed_values: ["defined", "not_defined"]
            description: "Статус идентификации клиента."
            required: true
          - name: "client_details_value"
            type: "string"
            presentation: "fact"
            label: "Клиент"
            description: "Наименование и реквизиты клиента."
            required: true
            display_in_grid: true
            display_priority: 2
          - name: "client_signatory"
            type: "string"
            presentation: "fact"
            label: "Подписант клиента"
            description: "Подписант от клиента."
            required: false
            display_in_grid: false
          - name: "client_signatory_basis"
            type: "string"
            presentation: "signal"
            allowed_values: ["charter", "poa", "order", "other", "not_defined"]
            description: "Основание полномочий подписанта клиента."
            required: false
    store_payload: true
# ──────────────────────────────────────────────────────────────────────────
# CHECK 2: Базовая структура факторинга
# ──────────────────────────────────────────────────────────────────────────
  - id: factoring_subject_extraction
    name: "Базовое извлечение структуры факторинга"
    description: >
      Фактографическая проверка ключевых параметров договора факторинга:
      тип уступаемого требования, основание требования, размер финансирования,
      вознаграждение фактора, вид факторинга и порядок уведомления должника.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "финансовый агент"
        - "фактор"
        - "клиент"
        - "должник"
        - "финансирование"
        - "уступка денежного требования"
        - "с регрессом"
        - "без регресса"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)(финансовый\\s+агент|фактор|клиент|должник)"
        - "(?i)(финансировани[ея]\\s+под\\s+уступку|уступк[аи].*денежн.*требован)"
        - "(?i)(с\\s+регрессом|без\\s+регресса|безрегрессн)"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор финансирования под уступку денежного требования
        (факторинг) по Главе 43 ГК РФ.
        Проверяется только один вопрос: базовая структура сделки факторинга.
        Нормативный ориентир:
        - ст. 824 ГК РФ — договор финансирования под уступку денежного требования
        - ст. 826 ГК РФ — денежное требование
        Важно:
        - Твоя задача — не оценивать серьёзность риска.
        - Только установить, что прямо есть в тексте договора, а чего прямо нет.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Тип уступаемого требования (существующее / будущее / смешанное).
        2. Основание требования (договор поставки, оказания услуг и т.д.).
        3. Размер финансирования.
        4. Вознаграждение фактора.
        5. Вид факторинга (с регрессом / без регресса).
        6. Наличие порядка уведомления должника.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Если данные не указаны прямо — возвращай "not_defined" / "Данные не определены".
        3. Не используй "None", "null", "not_defined" или пустые строки.
        4. В evidence включай только текст договора.
        5. Верни только один JSON-объект.

        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1:
        Фрагмент:
        "Клиент уступает Фактору денежное требование к ООО «Покупатель»
        по договору поставки № 45 от 01.03.2024. Фактор выплачивает Клиенту
        финансирование в размере 90% от суммы требования. Комиссия Фактора —
        2% годовых. Факторинг без регресса. Должник уведомляется Клиентом."
        Ответ:
        {
          "claim_type": "existing",
          "assigned_claim_basis": "договор поставки № 45 от 01.03.2024",
          "financing_amount_status": "defined",
          "financing_amount_value": "90% от суммы требования",
          "factor_fee_status": "defined",
          "factor_fee_value": "2% годовых",
          "factoring_type": "non_recourse",
          "debtor_notification_status": "defined",
          "evidence": [
            {
              "clause_ref": "п. 1.1",
              "quote": "Клиент уступает Фактору денежное требование к ООО «Покупатель» по договору поставки № 45 от 01.03.2024."
            }
          ]
        }

        Пример 2:
        Фрагмент:
        "Фактор предоставляет финансирование Клиенту."
        Ответ:
        {
          "claim_type": "not_defined",
          "assigned_claim_basis": "Данные не определены",
          "financing_amount_status": "not_defined",
          "financing_amount_value": "Данные не определены",
          "factor_fee_status": "not_defined",
          "factor_fee_value": "Данные не определены",
          "factoring_type": "not_defined",
          "debtor_notification_status": "not_defined",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о типе требования.
        2. Найди прямую цитату об основании требования.
        3. Найди прямую цитату о размере финансирования.
        4. Найди прямую цитату о вознаграждении фактора.
        5. Найди прямую цитату о виде факторинга.
        6. Если прямой цитаты нет — верни "not_defined".
        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        {
          "claim_type": "<existing / future / mixed / not_defined>",
          "assigned_claim_basis": "<текст или 'Данные не определены'>",
          "financing_amount_status": "<defined / not_defined>",
          "financing_amount_value": "<текст или 'Данные не определены'>",
          "factor_fee_status": "<defined / not_defined>",
          "factor_fee_value": "<текст или 'Данные не определены'>",
          "factoring_type": "<recourse / non_recourse / not_defined>",
          "debtor_notification_status": "<defined / not_defined>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 750
      retrieval:
        retrieval_profile: "assignment_check"
        corpus_scope: "primary_segment"
        levels:
          - "legal_unit"
          - "section"
        required_kind: "legal_unit"
        retrieval_query: "финансовый агент фактор клиент должник финансирование уступка денежного требования с регрессом без регресса уведомление должника комиссия вознаграждение"
        preferred_unit_types:
          - obligation
          - general_provision
        excluded_unit_types:
          - definition
          - structural_anchor
          - technical_fragment
        preferred_clause_functions:
          - definitions
          - obligations
        negative_keywords:
          - "зачет"
          - "возражения должника"
          - "банкротство"
          - "конфиденциальность"
          - "означает"
          - "в целях настоящего"
        position_bias:
          preferred_range: [0.0, 0.40]
          boost: 0.20
          scope: segment
        context_k: 6
        max_chunks: 10
        rerank: true
        enrichment_hints:
          preferred_segment_types:
            - "contract"
            - "amendment"
          excluded_segment_types:
            - "technical_specification"
            - "price_list"
          preferred_clause_functions:
            - "definitions"
            - "obligations"
          confidence_bonus_on_match: 0.10
          confidence_penalty_on_excluded_segment: 0.12
      evidence:
        required: true
        min_snippet_length: 50
        max_snippet_length: 700
      extraction:
        enabled: true
        mode: "hybrid"
        compact_output: false
        llm_max_tokens: 1200
        llm_prompt_extraction: |
          <role>
          Ты — российский юрист. Извлеки из текста договора факторинга базовую
          структуру сделки: тип требования, основание, финансирование, вознаграждение,
          вид факторинга и уведомление должника.
          Не анализируй зачёт, возражения должника или банкротство.
          </role>
          <context>
          {context}
          </context>
          <task>
          Заполни строго следующие поля:
          1. claim_type — existing / future / mixed / not_defined.
          2. assigned_claim_basis — основание требования.
          3. financing_amount_status — "defined" или "not_defined".
          4. financing_amount_value — размер финансирования.
          5. factor_fee_status — "defined" или "not_defined".
          6. factor_fee_value — вознаграждение фактора.
          7. factoring_type — recourse / non_recourse / not_defined.
          8. debtor_notification_status — "defined" или "not_defined".
          Если данные отсутствуют:
          - статус = "not_defined"
          - текст = "Данные не определены"
          </task>
          <rules>
          - Используй только текст договора.
          - claim_type: "existing" — требование существует на момент договора;
            "future" — требование возникнет в будущем; "mixed" — оба типа.
          - factoring_type: "recourse" — с регрессом; "non_recourse" — без регресса.
          - Верни только JSON.
          </rules>
        fields:
          - name: "claim_type"
            type: "string"
            presentation: "signal"
            allowed_values: ["existing", "future", "mixed", "not_defined"]
            description: "Тип уступаемого требования."
            required: true
          - name: "assigned_claim_basis"
            type: "string"
            presentation: "fact"
            label: "Основание требования"
            description: "Основание возникновения уступаемого требования."
            required: false
            display_in_grid: true
            display_priority: 1
          - name: "financing_amount_status"
            type: "string"
            presentation: "signal"
            allowed_values: ["defined", "not_defined"]
            description: "Статус определения размера финансирования."
            required: true
          - name: "financing_amount_value"
            type: "string"
            presentation: "fact"
            label: "Размер финансирования"
            description: "Размер финансирования клиента фактором."
            required: false
            display_in_grid: true
            display_priority: 2
          - name: "factor_fee_status"
            type: "string"
            presentation: "signal"
            allowed_values: ["defined", "not_defined"]
            description: "Статус определения вознаграждения фактора."
            required: true
          - name: "factor_fee_value"
            type: "string"
            presentation: "fact"
            label: "Вознаграждение фактора"
            description: "Размер и структура вознаграждения фактора."
            required: false
            display_in_grid: true
            display_priority: 3
          - name: "factoring_type"
            type: "string"
            presentation: "signal"
            allowed_values: ["recourse", "non_recourse", "not_defined"]
            description: "Вид факторинга по регрессности."
            required: true
          - name: "debtor_notification_status"
            type: "string"
            presentation: "signal"
            allowed_values: ["defined", "not_defined"]
            description: "Статус наличия порядка уведомления должника."
            required: false
    store_payload: true
# ──────────────────────────────────────────────────────────────────────────
# CHECK 3: Идентификация уступаемого требования
# ──────────────────────────────────────────────────────────────────────────
  - id: assigned_claim_identification_check
    name: "Идентификация уступаемого денежного требования (ст. 826 ГК РФ)"
    description: >
      Фактографическая проверка достаточной определимости уступаемого требования:
      должник, сумма, основание, реестр или приложение с требованиями.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "денежное требование"
        - "дебиторская задолженность"
        - "должник"
        - "основание требования"
        - "договор поставки"
        - "реестр уступленных требований"
        - "сумма требования"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)(денежн(ое|ого)\\s+требован|дебиторск(ая|ой)\\s+задолженн)"
        - "(?i)(должник|дебитор)"
        - "(?i)реестр\\s+уступленн(ых|ые)\\s+требован"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор факторинга по Главе 43 ГК РФ.
        Проверяется только один вопрос: достаточная определимость
        уступаемого денежного требования.
        Нормативный ориентир:
        - ст. 826 ГК РФ — денежное требование
        Важно:
        - Твоя задача — не оценивать серьёзность риска.
        - Только установить, что прямо есть в тексте договора, а чего прямо нет.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Идентифицирован ли должник по уступаемому требованию.
        2. Идентифицирована ли сумма требования.
        3. Указано ли основание требования (договор, счёт, накладная).
        4. Есть ли реестр или приложение с перечнем требований.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Если данные не указаны прямо — возвращай "not_defined".
        3. Не используй "None", "null" или пустые строки.
        4. В evidence включай только текст договора.
        5. Верни только один JSON-объект.

        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1:
        Фрагмент:
        "Клиент уступает Фактору требование к ООО «Покупатель» (ИНН 7700000003)
        по договору поставки № 45 от 01.03.2024 на сумму 5 000 000 рублей.
        Перечень требований — Приложение № 1 (Реестр уступленных требований)."
        Ответ:
        {
          "claim_identification_status": "clear",
          "debtor_identified": "yes",
          "claim_amount_identified": "yes",
          "underlying_contract_identified": "yes",
          "registry_or_schedule_present": "yes",
          "evidence": [
            {
              "clause_ref": "п. 1.1",
              "quote": "Клиент уступает Фактору требование к ООО «Покупатель» (ИНН 7700000003) по договору поставки № 45 от 01.03.2024 на сумму 5 000 000 рублей."
            }
          ]
        }

        Пример 2:
        Фрагмент:
        "Клиент уступает Фактору дебиторскую задолженность."
        Ответ:
        {
          "claim_identification_status": "partial",
          "debtor_identified": "no",
          "claim_amount_identified": "no",
          "underlying_contract_identified": "no",
          "registry_or_schedule_present": "not_defined",
          "evidence": [
            {
              "clause_ref": "п. 1.1",
              "quote": "Клиент уступает Фактору дебиторскую задолженность."
            }
          ]
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату с должником.
        2. Найди прямую цитату с суммой.
        3. Найди прямую цитату с основанием.
        4. Найди прямую цитату о реестре/приложении.
        5. Если прямой цитаты нет — верни "not_defined" или "no".
        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        {
          "claim_identification_status": "<clear / partial / not_defined>",
          "debtor_identified": "<yes / no>",
          "claim_amount_identified": "<yes / no>",
          "underlying_contract_identified": "<yes / no>",
          "registry_or_schedule_present": "<yes / no / not_defined>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 5
      temperature: 0.0
      max_tokens: 550
      retrieval:
        retrieval_profile: "assignment_check"
        corpus_scope: "primary_segment"
        levels:
          - "legal_unit"
          - "section"
        required_kind: "legal_unit"
        retrieval_query: "денежное требование дебиторская задолженность должник основание требования договор поставки реестр уступленных требований сумма требования приложение"
        preferred_unit_types:
          - obligation
          - general_provision
        excluded_unit_types:
          - definition
          - structural_anchor
          - technical_fragment
        preferred_clause_functions:
          - definitions
          - obligations
        negative_keywords:
          - "регресс"
          - "уведомление должника"
          - "комиссия"
          - "банкротство"
          - "означает"
          - "в целях настоящего"
        position_bias:
          preferred_range: [0.0, 0.40]
          boost: 0.20
          scope: segment
        context_k: 5
        max_chunks: 8
        rerank: true
        enrichment_hints:
          preferred_segment_types:
            - "contract"
            - "amendment"
          excluded_segment_types:
            - "technical_specification"
            - "price_list"
          preferred_clause_functions:
            - "definitions"
            - "obligations"
          confidence_bonus_on_match: 0.10
          confidence_penalty_on_excluded_segment: 0.12
      evidence:
        required: true
        min_snippet_length: 40
        max_snippet_length: 600
      extraction:
        enabled: true
        mode: "hybrid"
        compact_output: false
        llm_max_tokens: 700
        llm_prompt_extraction: |
          <role>
          Ты — российский юрист. Извлеки из текста договора факторинга сведения
          об идентификации уступаемого требования: должник, сумма, основание, реестр.
          Не анализируй финансирование, регресс или уведомление должника.
          </role>
          <context>
          {context}
          </context>
          <task>
          Заполни строго следующие поля:
          1. claim_identification_status — clear / partial / not_defined.
          2. debtor_identified — yes / no.
          3. claim_amount_identified — yes / no.
          4. underlying_contract_identified — yes / no.
          5. registry_or_schedule_present — yes / no / not_defined.
          Если данные отсутствуют: используй "no" или "not_defined".
          </task>
          <rules>
          - Используй только текст договора.
          - claim_identification_status: "clear" — должник, сумма и основание
            прямо указаны; "partial" — указана только часть данных;
            "not_defined" — данные отсутствуют.
          - Верни только JSON.
          </rules>
        fields:
          - name: "claim_identification_status"
            type: "string"
            presentation: "signal"
            allowed_values: ["clear", "partial", "not_defined"]
            description: "Статус идентификации уступаемого требования."
            required: true
          - name: "debtor_identified"
            type: "string"
            presentation: "signal"
            allowed_values: ["yes", "no"]
            description: "Идентифицирован ли должник."
            required: true
          - name: "claim_amount_identified"
            type: "string"
            presentation: "signal"
            allowed_values: ["yes", "no"]
            description: "Идентифицирована ли сумма требования."
            required: false
          - name: "underlying_contract_identified"
            type: "string"
            presentation: "signal"
            allowed_values: ["yes", "no"]
            description: "Указано ли основание требования."
            required: false
          - name: "registry_or_schedule_present"
            type: "string"
            presentation: "signal"
            allowed_values: ["yes", "no", "not_defined"]
            description: "Наличие реестра или приложения с требованиями."
            required: false
    store_payload: true
# ──────────────────────────────────────────────────────────────────────────
# CHECK 4: Финансирование и вознаграждение фактора
# ──────────────────────────────────────────────────────────────────────────
  - id: financing_and_fee_structure_check
    name: "Финансирование и структура вознаграждения фактора (ст. 824 ГК РФ)"
    description: >
      Фактографическая проверка размера финансирования, сроков выплаты,
      прозрачности комиссий/дисконта и условия возврата излишка клиенту.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "сумма финансирования"
        - "размер финансирования"
        - "факторинговая комиссия"
        - "вознаграждение"
        - "дисконт"
        - "дополнительные платежи"
        - "по тарифам"
        - "возврат излишка"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)(сумма|размер)\\s+финансирован"
        - "(?i)факторингов(ая|ого)\\s+комисси"
        - "(?i)дисконт|вознаграждени"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор факторинга по Главе 43 ГК РФ.
        Проверяется только один вопрос: условия финансирования и вознаграждения фактора.
        Нормативный ориентир:
        - ст. 824 ГК РФ — финансирование и вознаграждение
        - ст. 831 ГК РФ — распределение сумм
        Важно:
        - Твоя задача — не оценивать серьёзность риска.
        - Только установить, что прямо есть в тексте договора, а чего прямо нет.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Понятность условий финансирования.
        2. Прозрачность структуры вознаграждения фактора.
        3. Наличие открытых/скрытых комиссий.
        4. Условие о возврате клиенту излишка.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Если данные не указаны прямо — возвращай "not_defined".
        3. Не используй "None", "null" или пустые строки.
        4. В evidence включай только текст договора.
        5. Верни только один JSON-объект.

        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1:
        Фрагмент:
        "Фактор выплачивает Клиенту 85% от суммы требования в течение 3 рабочих дней.
        Комиссия Фактора — 1,5% от суммы требования. Иных платежей не взимается.
        Сумма, полученная от должника сверх финансирования и комиссии, возвращается Клиенту."
        Ответ:
        {
          "financing_terms_status": "clear",
          "fee_structure_status": "transparent",
          "open_ended_fees_risk": "low",
          "client_excess_return_clause": "present",
          "evidence": [
            {
              "clause_ref": "п. 3.1",
              "quote": "Фактор выплачивает Клиенту 85% от суммы требования в течение 3 рабочих дней. Комиссия Фактора — 1,5% от суммы требования."
            }
          ]
        }

        Пример 2:
        Фрагмент:
        "Фактор выплачивает финансирование в порядке, определённом тарифами Фактора."
        Ответ:
        {
          "financing_terms_status": "partial",
          "fee_structure_status": "vague",
          "open_ended_fees_risk": "high",
          "client_excess_return_clause": "not_defined",
          "evidence": [
            {
              "clause_ref": "п. 3.1",
              "quote": "Фактор выплачивает финансирование в порядке, определённом тарифами Фактора."
            }
          ]
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о размере и сроках финансирования.
        2. Найди прямую цитату о комиссиях/дисконте.
        3. Найди прямую цитату об открытых тарифах или дополнительных платежах.
        4. Найди прямую цитату о возврате излишка.
        5. Если прямой цитаты нет — верни "not_defined".
        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        {
          "financing_terms_status": "<clear / partial / not_defined>",
          "fee_structure_status": "<transparent / vague / not_defined>",
          "open_ended_fees_risk": "<high / medium / low / not_defined>",
          "client_excess_return_clause": "<present / not_defined>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 550
      retrieval:
        retrieval_profile: "payment_terms_check"
        corpus_scope: "primary_segment"
        levels:
          - "legal_unit"
          - "section"
        required_kind: "legal_unit"
        retrieval_query: "сумма финансирования размер финансирования факторинговая комиссия вознаграждение дисконт тарифы дополнительные платежи возврат излишка"
        preferred_unit_types:
          - obligation
          - general_provision
        excluded_unit_types:
          - definition
          - structural_anchor
          - technical_fragment
        preferred_clause_functions:
          - obligations
          - procedures
        negative_keywords:
          - "регресс"
          - "уведомление должника"
          - "зачет"
          - "банкротство"
          - "означает"
          - "в целях настоящего"
        position_bias:
          preferred_range: [0.15, 0.55]
          boost: 0.18
          scope: segment
        context_k: 6
        max_chunks: 8
        rerank: true
        enrichment_hints:
          preferred_segment_types:
            - "contract"
            - "amendment"
          excluded_segment_types:
            - "technical_specification"
            - "price_list"
          preferred_clause_functions:
            - "obligations"
            - "procedures"
          confidence_bonus_on_match: 0.10
          confidence_penalty_on_excluded_segment: 0.12
      evidence:
        required: true
        min_snippet_length: 45
        max_snippet_length: 650
      extraction:
        enabled: true
        mode: "hybrid"
        compact_output: false
        llm_max_tokens: 700
        llm_prompt_extraction: |
          <role>
          Ты — российский юрист. Извлеки из текста договора факторинга условия
          финансирования и вознаграждения: понятность, прозрачность, открытые комиссии,
          возврат излишка.
          Не анализируй регресс, уведомление должника или банкротство.
          </role>
          <context>
          {context}
          </context>
          <task>
          Заполни строго следующие поля:
          1. financing_terms_status — clear / partial / not_defined.
          2. fee_structure_status — transparent / vague / not_defined.
          3. open_ended_fees_risk — high / medium / low / not_defined.
          4. client_excess_return_clause — present / not_defined.
          Если данные отсутствуют: используй "not_defined".
          </task>
          <rules>
          - Используй только текст договора.
          - fee_structure_status: "transparent" — все комиссии прямо перечислены;
            "vague" — есть ссылки на тарифы, дискрецию фактора или открытые платежи.
          - open_ended_fees_risk: "high" — есть открытые тарифы или одностороннее
            изменение комиссий; "medium" — частично раскрыто; "low" — всё раскрыто.
          - Верни только JSON.
          </rules>
        fields:
          - name: "financing_terms_status"
            type: "string"
            presentation: "signal"
            allowed_values: ["clear", "partial", "not_defined"]
            description: "Понятность условий финансирования."
            required: true
          - name: "fee_structure_status"
            type: "string"
            presentation: "signal"
            allowed_values: ["transparent", "vague", "not_defined"]
            description: "Прозрачность структуры вознаграждения фактора."
            required: true
          - name: "open_ended_fees_risk"
            type: "string"
            presentation: "signal"
            allowed_values: ["high", "medium", "low", "not_defined"]
            description: "Риск скрытых/открытых комиссий."
            required: false
          - name: "client_excess_return_clause"
            type: "string"
            presentation: "signal"
            allowed_values: ["present", "not_defined"]
            description: "Наличие условия о возврате клиенту излишка."
            required: false
    store_payload: true
# ──────────────────────────────────────────────────────────────────────────
# CHECK 5: Регресс / безрегрессность
# ──────────────────────────────────────────────────────────────────────────
  - id: recourse_allocation_check
    name: "Регресс / безрегрессность и распределение кредитного риска (ст. 831 ГК РФ)"
    description: >
      Фактографическая проверка вида факторинга, условий регресса,
      распределения риска неплатежа должника и лимита ответственности клиента.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "с регрессом"
        - "без регресса"
        - "безрегрессный"
        - "регрессное требование"
        - "риск неплатежа"
        - "обязан возвратить финансирование"
        - "лимит ответственности клиента"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)(с\\s+регрессом|без\\s+регресса|безрегрессн)"
        - "(?i)регрессн(ое|ого)\\s+требован"
        - "(?i)риск\\s+неплатежа"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
