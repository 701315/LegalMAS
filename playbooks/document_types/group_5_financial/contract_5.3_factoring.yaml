          context: any
          description: "Реестр уступленных требований как приложение к договору факторинга"
        - pattern: "(?i)уведомлени[ея]\\s+должник[аа]"
          weight: 0.60
          distinctiveness: medium
          context: any
          description: "Уведомление должника об уступке требования фактору"
        - pattern: "(?i)финансировани[ея]\\s+поставщик[аа]"
          weight: 0.60
          distinctiveness: medium
          context: any
          description: "Финансирование поставщика под уступку требований к покупателю"
      low:
