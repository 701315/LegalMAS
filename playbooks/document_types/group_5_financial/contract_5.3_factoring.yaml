        Проверяется только один вопрос: передача документов и банкротные заверения.
        Нормативный ориентир:
        - ст. 826, 830 ГК РФ — документы
        - ст. 61.2, 61.3 ФЗ-127 — оспаривание сделок
        Важно:
        - Твоя задача — не оценивать серьёзность риска.
        - Только установить, что прямо есть в тексте договора, а чего прямо нет.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Наличие обязательства передать документы.
        2. Конкретизация перечня документов.
        3. Наличие банкротных заверений клиента.
        4. Наличие заверения о рыночности условий.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Если данные не указаны прямо — возвращай "not_defined".
        3. В evidence включай только текст договора.
        4. Верни только один JSON-объект.

        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1:
        Фрагмент:
        "Клиент обязан передать Фактору оригиналы накладных, счетов-фактур
        и актов по уступаемому требованию по акту приёма-передачи документов.
        Клиент заверяет, что не находится в процедуре банкротства и не имеет
        признаков неплатёжеспособности."
        Ответ:
        {
          "document_transfer_status": "present",
          "document_list_specificity": "specific",
          "bankruptcy_representations_status": "present",
          "market_terms_representation": "not_defined",
          "evidence": [
            {
              "clause_ref": "п. 7.1",
              "quote": "Клиент обязан передать Фактору оригиналы накладных, счетов-фактур и актов по уступаемому требованию."
            }
          ]
        }

        Пример 2:
        Фрагмент:
        "Клиент предоставляет документы по запросу Фактора."
        Ответ:
        {
          "document_transfer_status": "present",
          "document_list_specificity": "generic",
          "bankruptcy_representations_status": "not_defined",
          "market_terms_representation": "not_defined",
          "evidence": [
