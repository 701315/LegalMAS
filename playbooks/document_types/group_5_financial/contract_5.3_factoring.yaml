trigger_definitions:
  recourse_factoring:
    any_keywords:
      - "(?i)с\\s+регрессом"
      - "(?i)регрессн[оа]е\\s+требовани[ея]"
      - "(?i)фактор\\s+вправе\\s+предъявить\\s+регресс"
      - "(?i)обязан\\s+возвратить\\s+финансировани[ея]"
  non_recourse_factoring:
    any_keywords:
      - "(?i)без\\s+регресс[аа]"
      - "(?i)безрегрессн[ыо]й\\s+факторинг"
      - "(?i)фактор\\s+принимает\\s+риск\\s+неплатеж[аа]"
      - "(?i)фактор\\s+не\\s+вправе\\s+требовать\\s+возврат[аа]\\s+финансировани[яя]"
  future_claim_assignment:
    any_keywords:
