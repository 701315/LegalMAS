        3.  costs_categories_status — specified / generic / not_defined.
        4.  costs_categories_summary — перечень категорий или общая
            формулировка.
        5.  costs_allocation_summary — сводка одной строкой.
        6.  evidence — массив цитат с clause_ref и quote.
        </task>

        <rules>
        - Используй только текст договора.
        - costs_allocation_status: "client" / "factor" / "shared" /
          "not_defined" — по прямому указанию.
        - costs_categories_status: "specified" — есть перечень категорий;
          "generic" — только общая формулировка; "not_defined" — не
          упомянуто.
        - Display-поля строго соответствуют raw enum:
            costs_allocation_status:
              client -> "Клиент";
              factor -> "Фактор";
              shared -> "Пропорционально";
              not_defined -> "Не установлено".
        - costs_allocation_summary — одной строкой, формат:
          "Кто несёт: <...>; Категории: <...>".
        - Запрещены значения null, None и пустые строки. Для status-полей
          используй "not_defined". Для display-полей — "Не установлено".
        - В evidence включай только дословные цитаты из текста договора.
        - Верни РОВНО один JSON-объект со всеми 6 ключами без какого-либо
          дополнительного текста до или после. Начни ответ сразу с
          открывающей фигурной скобки и закончи закрывающей. НЕ пиши
          Markdown, списки, код-фенсы. Ответ должен быть валидным JSON,
          пригодным для парсинга через json.loads без предварительной
          обработки.
        </rules>
      fields:
        - name: "costs_allocation_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["client", "factor", "shared", "not_defined"]
          description: "Кто несёт расходы на взыскание (raw enum)."
          required: true
          display_in_grid: false
        - name: "costs_allocation_display"
