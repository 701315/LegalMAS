        - pattern: "(?i)скрыт[ыо]й\\s+факторинг"
          weight: 0.30
          distinctiveness: low
          context: any
          description: "Упоминание скрытого факторинга"
        - pattern: "(?i)международн[ыо]й\\s+факторинг"
          weight: 0.30
          distinctiveness: low
          context: any
          description: "Упоминание международного факторинга"
        - pattern: "(?i)\\bдисконт\\b"
          weight: 0.30
          distinctiveness: low
          context: any
          description: "Дисконт/скидка к номиналу требований при факторинге"
        - pattern: "(?i)зач[её]т\\s+встречн[ыо]х\\s+требовани[йя]"
          weight: 0.25
          distinctiveness: low
          context: any
          description: "Зачёт взаимных требований, возможный в структуре факторинговых расчётов"
        - pattern: "(?i)дебиторск[аяое]\\s+задолженн[остьости]"
          weight: 0.25
          distinctiveness: low
          context: any
          description: "Дебиторская задолженность как объект финансирования"
        - pattern: "(?i)клиент[а-я]*"
          weight: 0.15
          distinctiveness: low
          context: any
          description: "Клиент (поставщик) как сторона договора факторинга"
        - pattern: "(?i)должник[ауы]"
          weight: 0.15
          distinctiveness: low
          context: any
          description: "Должник по уступаемому требованию"
    exclusions:
      - pattern: "(?i)договор\\s+цесси[ии]"
        severity: hard
        weight: -1.0
        description: "Чистая уступка права требования без элемента финансирования (цессия), а не факторинг"
      - pattern: "(?i)договор\\s+за[йеё]м[аа]"
        severity: hard
        weight: -1.0
        description: "Договор займа, а не финансирование под уступку денежного требования"
      - pattern: "(?i)\\bпоручительств[ооа]\\b"
        severity: hard
