        Учитывай формулировки: судебные расходы, расходы на юристов,
        представителей, оценку, исполнительное производство, госпошлину.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие 5 полей + evidence (всего 6 ключей):
        1.  costs_allocation_status — client / factor / shared /
            not_defined.
        2.  costs_allocation_display — "Клиент" / "Фактор" /
            "Пропорционально" / "Не установлено" (должно соответствовать
