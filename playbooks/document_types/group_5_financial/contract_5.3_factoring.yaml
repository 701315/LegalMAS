      required_kind: "legal_unit"
      retrieval_query: "возражения должника право на возражения основания для возражений возражения против требования заверение отсутствие возражений отсутствие оснований для возражений компенсация при возражениях возмещение убытков при возражениях должник не имеет возражений"
      preferred_unit_types:
