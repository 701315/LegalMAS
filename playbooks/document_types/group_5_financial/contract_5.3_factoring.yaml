        4. misdirected_funds_summary:
           Сводка одной строкой на русском языке в формате:
           "Обязанность перевести: <...>; Срок: <...>; Статус средств: <...>".
           При противоречии — "Не удалось определить".
        </task>

        <context_rules>
        - Перед остальными полями заполни misdirected_funds_handling_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined", misdirected_funds_summary = "Обязанность перевести: нет; Срок: не указан; Статус средств: не определён".
        - Используй только релевантные фрагменты контекста.
        - Не подставляй нормы закона, обычную практику или предположения вместо текста договора.
        - Не делай выводов по типовой структуре договора.
        - Различай: обязанность перевести ошибочно полученные средства фактору; конкретный срок перевода; статус средств (залог / целевое удержание) до момента перевода.
        - Общая обязанность клиента перечислять фактору уступленные платежи ≠ механизм реагирования на ошибочное поступление именно клиенту.
        - Если в разных фрагментах указаны разные данные и конфликт нельзя разрешить по тексту:
          * status-поля → "not_defined";
          * текстовые поля → "Не удалось определить".
        - Не используй пустые строки.
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В договоре нет правил на случай ошибочного получения
           средств клиентом.
           → presence = "missing";
             все *_status = "not_defined";
             misdirected_funds_summary = "Обязанность перевести: нет; Срок: не указан; Статус средств: не определён".

        2. Только обязанность перевести без срока и залога.
           Прямо установлена обязанность клиента вернуть средства
           фактору, но срок и статус средств не прописаны.
           → presence = "present";
             funds_transfer_obligation = "present";
             transfer_deadline_specified = "not_defined";
             pledge_trust_status = "not_defined".

        3. Противоречие между фрагментами.
           В одном пункте — 24 часа на перевод, в другом — 5 рабочих дней.
           → presence = "unclear";
             transfer_deadline_specified = "not_defined";
             misdirected_funds_summary = "Не удалось определить".

        4. Полный механизм.
           Обязанность перевести + конкретный срок + залог в пользу фактора.
           → presence = "present";
             funds_transfer_obligation = "present";
             transfer_deadline_specified = "present";
             pledge_trust_status = "present".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для misdirected_funds_handling_check_presence используй только: "present", "missing", "unclear".
        - Для status-полей используй только: "present", "not_defined".
        - Fallback при отсутствии данных:
          * misdirected_funds_summary → "Обязанность перевести: нет; Срок: не указан; Статус средств: не определён".
        - Fallback при противоречии или неоднозначности:
          * misdirected_funds_summary → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "misdirected_funds_handling_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования об ошибочном получении средств клиентом. Внутреннее агрегатное signal-поле."
          required: true

        - name: "funds_transfer_obligation"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["present", "not_defined"]
          display_in_grid: false
          description: "Обязанность перевести ошибочно полученные средства фактору. Внутреннее enum-поле."
          required: true

        - name: "transfer_deadline_specified"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["present", "not_defined"]
          display_in_grid: false
          description: "Наличие конкретного срока перевода средств. Внутреннее enum-поле."
          required: true

        - name: "pledge_trust_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["present", "not_defined"]
          display_in_grid: false
          description: "Признание средств находящимися в залоге или целевом удержании. Внутреннее enum-поле."
          required: true

        - name: "misdirected_funds_summary"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 1
          label: "Ошибочное получение средств клиентом"
          description: >
            Компактная сводка: обязанность, срок, статус средств.
            Fallback: "Обязанность перевести: нет; Срок: не указан; Статус средств: не определён" / "Не удалось определить".
          required: true

        - name: "evidence"
          type: "array"
          presentation: "diagnostic"
          display_in_grid: false
          description: "Точные цитаты из договора."
          required: true

      store_payload: true

  - id: factor_audit_and_information_rights_check
    name: "Право фактора на аудит и истребование первичных документов"
    description: >
      Проверка закрепления за фактором права требовать от клиента первичные  документы, реестры, а также проводить аудит бухгалтерии клиента для  проверки реальности уступаемых требований.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "право на аудит"
        - "истребование документов"
        - "предоставление реестров"
        - "проверка бухгалтерии"
        - "оригиналы первичных документов"
        - "доступ к информационным системам"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)вправе.{0,40}(требовать|запрашивать|проверять).{0,40}(документ|реестр|аудит)"
        - "(?i)обязан.{0,40}предоставить.{0,40}(оригинал|копия|реестр)"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор факторинга.
        Проверяется только один вопрос: право фактора на получение информации 
        и проведение аудита клиента.
        Важно:
        - Твоя задача — не оценивать серьёзность риска.
        - Только установить, что прямо есть в тексте договора, а чего прямо нет.
        - Различай:
            * document_request_right — право истребовать копии/оригиналы первички (накладные, акты);
            * registry_reporting_duty — обязанность клиента регулярно предоставлять реестры уступок;
            * audit_access_right — право фактора проводить выездные или камеральные проверки бухгалтерии клиента.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Право фактора истребовать первичные документы.
        2. Обязанность клиента предоставлять регулярные реестры.
        3. Право фактора на аудит/проверку деятельности клиента.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Если данные не указаны прямо: верни "not_defined".
        3. Запрещены значения: null, None, пустые строки.
        4. document_request_right: "present" / "not_defined".
        5. registry_reporting_duty: "present" / "not_defined".
        6. audit_access_right: "present" / "not_defined".
        7. В evidence включай только дословные цитаты.
        8. Верни РОВНО один JSON-объект со всеми 7 ключами.

        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1 — полные права на информацию:
        Фрагмент: "Клиент обязан ежемесячно предоставлять Реестр уступок. Фактор вправе в любое время запрашивать оригиналы или заверенные копии первичных документов, а также проводить проверку финансово-хозяйственной деятельности Клиента."
        Ответ: {
          "document_request_right": "present",
          "registry_reporting_duty": "present",
          "audit_access_right": "present",
          "audit_information_summary": "Истребование документов: да; Предоставление реестров: да (ежемесячно); Право на аудит: да",
          "evidence": [{"clause_ref": "п. 10.2", "quote": "Клиент обязан ежемесячно предоставлять Реестр уступок. Фактор вправе в любое время запрашивать оригиналы или заверенные копии первичных документов, а также проводить проверку финансово-хозяйственной деятельности Клиента."}]
        }

        [ФОРМАТ ОТВЕТА]
        {
          "document_request_right": "<present / not_defined>",
          "registry_reporting_duty": "<present / not_defined>",
          "audit_access_right": "<present / not_defined>",
          "audit_information_summary": "<сводка одной строкой>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 600

    retrieval:
      retrieval_profile: "assignment_check"
      corpus_scope: "primary_segment"
      levels: ["legal_unit", "section"]
      required_kind: "legal_unit"
      retrieval_query: "право на аудит истребование документов предоставление реестров проверка бухгалтерии оригиналы первичных документов доступ к информационным системам"
      preferred_unit_types: ["obligation", "general_provision"]
      excluded_unit_types: ["definition", "structural_anchor", "technical_fragment"]
      preferred_clause_functions: ["obligations", "procedures"]
      negative_keywords: ["комиссия", "уведомление должника", "банкротство", "означает"]
      position_bias: {preferred_range: [0.40, 0.80], boost: 0.15, scope: segment}
      context_k: 6
      max_chunks: 8
      rerank: true

    enrichment_hints:
      preferred_segment_types: ["contract", "amendment"]
      excluded_segment_types: ["technical_specification", "price_list"]
      preferred_clause_functions: ["obligations", "procedures"]
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.12

    evidence:
      required: true
      min_snippet_length: 30
      max_snippet_length: 500

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 800

      compact_output: false

      presence_signal:
        field: "factor_audit_and_information_rights_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора факторинга
        сведения о правах фактора на информацию и аудит: истребование
        первичных документов, обязанность клиента предоставлять реестры,
        право фактора на проверку деятельности клиента.
        Не анализируй финансирование, комиссию, уведомление должника
        об уступке и иные разделы.
        Не оценивай риски.
        Анализируй только текст договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. factor_audit_and_information_rights_check_presence:
           - "missing" — если фрагментов по теме в тексте нет вообще
             (следствие: все содержательные поля = "not_defined");
           - "present" — если фрагменты по теме есть: либо хотя бы одно
             содержательное поле ≠ "not_defined", либо тема упомянута,
             но прямо исключена / отложена на будущее / раскрыта только общей фразой;
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - document_request_right = "not_defined";
           - registry_reporting_duty = "not_defined";
           - audit_access_right = "not_defined";
           - audit_information_summary = "Истребование документов: нет; Предоставление реестров: нет; Право на аудит: нет";
           - не выполняй остальные шаги.

        1. document_request_right:
           - "present" — если прямо закреплено право фактора истребовать
             у клиента первичные документы (накладные, акты, счета);
           - "not_defined" — если такое право прямо не установлено.

        2. registry_reporting_duty:
           - "present" — если прямо установлена обязанность клиента
             регулярно предоставлять фактору реестры уступок
             (с указанием периодичности или без);
           - "not_defined" — если такая обязанность прямо не установлена.

        3. audit_access_right:
           - "present" — если прямо закреплено право фактора проводить
             выездные или камеральные проверки бухгалтерии / деятельности
             клиента;
           - "not_defined" — если такое право прямо не установлено.

        4. audit_information_summary:
           Сводка одной строкой на русском языке в формате:
           "Истребование документов: <...>; Предоставление реестров: <...>; Право на аудит: <...>".
           При противоречии — "Не удалось определить".
        </task>

        <context_rules>
        - Перед остальными полями заполни factor_audit_and_information_rights_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined", audit_information_summary = "Истребование документов: нет; Предоставление реестров: нет; Право на аудит: нет".
        - Используй только релевантные фрагменты контекста.
        - Не подставляй нормы закона, обычную практику или предположения вместо текста договора.
        - Не делай выводов по типовой структуре договора.
        - Различай три разных права: истребование первички, обязанность клиента предоставлять реестры, право на выездную/камеральную проверку бухгалтерии.
        - Общая обязанность клиента предоставлять информацию о ходе исполнения основного договора ≠ право фактора на аудит.
        - Если в разных фрагментах указаны разные данные и конфликт нельзя разрешить по тексту:
          * status-поля → "not_defined";
          * текстовые поля → "Не удалось определить".
        - Не используй пустые строки.
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В договоре нет ни права истребовать документы, ни обязанности
           предоставлять реестры, ни права на аудит.
           → presence = "missing";
             все *_status = "not_defined";
             audit_information_summary = "Истребование документов: нет; Предоставление реестров: нет; Право на аудит: нет".

        2. Только обязанность предоставлять реестры.
           Прямо установлена ежемесячная передача реестров,
           но право истребовать первичку и право на аудит не прописаны.
           → presence = "present";
             registry_reporting_duty = "present";
             document_request_right = "not_defined";
             audit_access_right = "not_defined".

        3. Противоречие между фрагментами.
           В одном пункте право фактора на аудит прямо установлено,
           в другом — договор запрещает любые проверки со стороны фактора.
           → presence = "unclear";
             audit_access_right = "not_defined";
             audit_information_summary = "Не удалось определить".

        4. Полный набор прав.
           Истребование первички + реестры + выездной аудит.
           → presence = "present";
             document_request_right = "present";
             registry_reporting_duty = "present";
             audit_access_right = "present".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для factor_audit_and_information_rights_check_presence используй только: "present", "missing", "unclear".
        - Для status-полей используй только: "present", "not_defined".
        - Fallback при отсутствии данных:
          * audit_information_summary → "Истребование документов: нет; Предоставление реестров: нет; Право на аудит: нет".
        - Fallback при противоречии или неоднозначности:
          * audit_information_summary → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "factor_audit_and_information_rights_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования о праве фактора на аудит и информацию. Внутреннее агрегатное signal-поле."
          required: true

        - name: "document_request_right"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["present", "not_defined"]
          display_in_grid: false
          description: "Право истребовать первичные документы. Внутреннее enum-поле."
          required: true

        - name: "registry_reporting_duty"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["present", "not_defined"]
          display_in_grid: false
          description: "Обязанность клиента предоставлять регулярные реестры. Внутреннее enum-поле."
          required: true

        - name: "audit_access_right"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["present", "not_defined"]
          display_in_grid: false
          description: "Право фактора на аудит / проверку деятельности клиента. Внутреннее enum-поле."
          required: true

        - name: "audit_information_summary"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 1
          label: "Право на аудит и информацию"
          description: >
            Компактная сводка: истребование документов, реестры, аудит.
            Fallback: "Истребование документов: нет; Предоставление реестров: нет; Право на аудит: нет" / "Не удалось определить".
          required: true

        - name: "evidence"
          type: "array"
          presentation: "diagnostic"
          display_in_grid: false
          description: "Точные цитаты из договора."
          required: true

      store_payload: true

# ════════════════════════════════════════════════════════════════════════════
# БЛОК 5: DD_REQUEST_TEMPLATES
# Читается: DDRequestTemplateLoader
# ════════════════════════════════════════════════════════════════════════════

dd_request_templates:
  factoring_parties_identification:
    text: >
      Просим предоставить по {doc_names}: полные реквизиты финансового агента
      и клиента, подтверждение статуса фактора как допустимого субъекта
      (банк / коммерческая организация / факторинговая компания),
      полномочия подписантов.
    addressee: "Фактор / Клиент"
  factoring_subject_extraction:
    text: >
      Просим предоставить по {doc_names}: базовую структуру сделки факторинга —
      финансового агента, клиента, должника, основание уступаемого требования,
      сумму финансирования, вознаграждение фактора, вид факторинга
      (с регрессом / без регресса) и порядок уведомления должника.
    addressee: "Фактор / Клиент"
  assigned_claim_identification_check:
    text: >
      Просим предоставить по {doc_names}: точное описание уступаемых требований,
      сведения о должниках, основаниях возникновения требований, суммах,
      сроках оплаты и реестр уступаемой дебиторской задолженности.
    addressee: "Клиент"
  financing_and_fee_structure_check:
    text: >
      Просим предоставить по {doc_names}: размер финансирования, даты/условия
      его перечисления, полный перечень комиссий, дисконтов и иных платежей,
      а также пример расчёта чистой суммы, подлежащей выплате клиенту.
    addressee: "Фактор"
  recourse_allocation_check:
    text: >
      Просим предоставить по {doc_names}: детальное описание того, является ли
      факторинг регрессным или безрегрессным, кто несёт риск неплатежа должника,
      при каких условиях возникает обязанность клиента вернуть финансирование
      и каков предел такой ответственности.
    addressee: "Фактор / Клиент"
  debtor_notification_check:
    text: >
      Просим предоставить по {doc_names}: порядок уведомления должника об уступке,
      форму уведомления, ответственную сторону, доказательства вручения и указание,
      с какого момента должник обязан платить фактору.
    addressee: "Фактор / Клиент"
  setoff_and_double_assignment_risk_check:
    text: >
      Просим предоставить по {doc_names}: гарантии отсутствия встречных требований
      должника к клиенту, условия компенсации убытков фактора при зачёте,
      а также запрет повторной уступки уже уступленного требования.
    addressee: "Клиент / Фактор"
  document_transfer_and_bankruptcy_check:
    text: >
      Просим предоставить по {doc_names}: перечень первичных документов,
      передаваемых фактору, форму акта приёма-передачи документов,
      а также заверения клиента об отсутствии признаков банкротства
      и о рыночном характере сделки.
    addressee: "Клиент"
  debtor_defenses_check:
    text: >
      Просим предоставить по {doc_names}: заверения клиента об отсутствии
      оснований для возражений должника и встречных требований,
      а также механизм компенсации фактору при успешном зачёте должником.
    addressee: "Клиент / Юридический советник"
  hidden_factoring_protection_check:
    text: >
      По {doc_names} (скрытый факторинг) просим предоставить: порядок перечисления
      клиентом полученных от должника средств фактору, сроки перечисления,
      требования к специальному счёту, отчётность клиента и право фактора
      уведомить должника при нарушении.
    addressee: "Фактор / Юридический советник"
  claim_validity_warranties_check:
    text: >
      Просим предоставить по {doc_names}: полный комплект заверений клиента
      о действительности требования — существование, непогашенность, отсутствие
      оспаривания, действительность основного договора, выполнение поставки/услуг,
      а также условие о возмещении при недействительности.
    addressee: "Клиент"
  excess_collection_return:
    text: >
      Просим уточнить в {doc_names}: как распределяются суммы, полученные фактором
      от должника сверх размера финансирования и вознаграждения, и в какой срок
      излишек перечисляется клиенту.
    addressee: "Фактор"
  tax_risk_allocation:
    text: >
      Просим предоставить по {doc_names}: налоговую квалификацию уступки,
      порядок учёта НДС и иных налогов, распределение налоговых рисков
      между сторонами и подтверждение того, кто несёт налоговые обязательства
      по факторинговому вознаграждению.
    addressee: "Налоговый консультант / Юридический советник"
  assignment_prohibition_disclosure:
    text: >
      Просим предоставить по {doc_names}: заверение клиента об отсутствии запрета
      уступки в договоре с должником или раскрытие такого запрета с указанием,
      как распределяется риск ответственности.
    addressee: "Клиент"
  term_and_termination:
    text: >
      Просим уточнить в {doc_names}: срок действия договора, условия пролонгации,
      основания и порядок расторжения, последствия расторжения для уже уступленных
      требований.
    addressee: "Юридический советник"
  governing_law_and_disputes:
    text: >
      Просим уточнить в {doc_names}: применимое право, компетентный суд
      для разрешения споров, порядок досудебного урегулирования.
    addressee: "Юридический советник"
  confidentiality_clause:
    text: >
      Просим добавить в {doc_names} раздел о конфиденциальности: перечень
      конфиденциальных сведений, срок неразглашения, исключения.
    addressee: "Юридический советник"
  _default:
    text: >
      Просим предоставить дополнительную информацию по вопросу «{check_name}»
      применительно к {doc_names}.
    addressee: "Юридический советник"
