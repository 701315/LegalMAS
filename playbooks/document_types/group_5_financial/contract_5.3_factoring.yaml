type: contract_5.3_factoring
name: "Договор финансирования под уступку денежного требования (факторинг)"

description: |
  Договор, по которому финансовый агент (фактор) передает или обязуется передать
  денежные средства клиенту в счет денежного требования клиента к третьему лицу
  (должнику), а клиент уступает или обязуется уступить фактору это денежное требование.
  Регулируется Главой 43 ГК РФ и в соответствующей части общими нормами об уступке
  права требования. На практике ключевыми вопросами являются наличие элемента
  финансирования, определимость уступаемого требования, распределение кредитного риска
  должника, условия регресса, порядок уведомления должника, передача подтверждающих
  документов и защита от споров о действительности требования.

version: 4.0
parent: class_5_financial_security

metadata:
  category: contract
  subcategory: financial_security
  complexity: high
  risk_level: critical
  jurisdiction: RU
  language: ru
  legal_base: "Глава 43 ГК РФ (ст. 824-833)"
  doc_types_supported:
    - "договор факторинга"
    - "договор финансирования под уступку денежного требования"
    - "договор факторинга с регрессом"
    - "договор факторинга без регресса"
    - "договор открытого факторинга"
    - "договор скрытого факторинга"
    - "договор международного факторинга"
    - "договор финансирования под дебиторскую задолженность"
    - "master factoring agreement"
    - "notification factoring agreement"

engine_expectations:
  evidence_required: true
  evidence_style: "pinpoint"
  allow_not_found: true
  output_style: "dd_grid"
  prefer_structured_outputs: true

# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 1: КЛАССИФИКАЦИЯ (L1/L2)
#  Читается: YAMLRegistry → L1FilenameClassifier, L2HeaderClassifier
# ════════════════════════════════════════════════════════════════════════════

classification_runtime_v1:

  scoring:
    accept_threshold: 0.82
    strong_signal_threshold: 0.9
    ambiguity_margin: 0.18
    input_quality_weight: 1.0

  rules:

    filename_patterns:
      - "(?i)факторинг"
      - "(?i)финансировани.*под.*уступ"
      - "(?i)factoring"
      - "(?i)debtor"
      - "(?i)receivables"

    folder_patterns:
      - "(?i)factoring"
      - "(?i)факторинг"
      - "(?i)receivables"

    keywords:

      high:
        - pattern: "(?i)факторинг[ауы]?"
          weight: 1.0
          distinctiveness: high
          context: any
          description: "Общий термин факторинга в заголовке или теле договора"

        - pattern: "(?i)финансировани[ея]\\s+под\\s+уступк[уи]"
          weight: 0.95
          distinctiveness: high
          context: any
          description: "Финансирование под уступку денежного требования"

        - pattern: "(?i)договор\\s+факторинг[ауы]"
          weight: 1.0
          distinctiveness: high
          context: header
          description: "Прямое название договора факторинга"

        - pattern: "(?i)договор\\s+финансировани[ея]\\s+под\\s+уступк[уи]\\s+денежн[огоой\\s]*требован[ияи]"
          weight: 1.0
          distinctiveness: high
          context: header
          description: "Полное наименование договора финансирования под уступку денежного требования"

        - pattern: "(?i)договор\\s+финансировани[ея]\\s+под\\s+дебиторск[уюой\\s]*задолженн[остьости]"
          weight: 0.95
          distinctiveness: high
          context: header
          description: "Факторинг, оформленный как финансирование под дебиторскую задолженность"

        - pattern: "(?i)договор\\s+факторинг[ауы]\\s+с\\s+регресс[ома]"
          weight: 0.95
          distinctiveness: high
          context: header
          description: "Факторинг с регрессом на клиента"

        - pattern: "(?i)договор\\s+факторинг[ауы]\\s+без\\s+регресс[а]"
          weight: 0.95
          distinctiveness: high
          context: header
          description: "Факторинг без регресса (перенос кредитного риска на фактора)"

        - pattern: "(?i)договор\\s+открыт[огоой]\\s+факторинг[ауы]"
          weight: 0.9
          distinctiveness: high
          context: header
          description: "Открытый факторинг с уведомлением должника"

        - pattern: "(?i)договор\\s+скрыт[огоой]\\s+факторинг[ауы]"
          weight: 0.9
          distinctiveness: high
          context: header
          description: "Скрытый (undisclosed) факторинг"

        - pattern: "(?i)договор\\s+международн[огоой]\\s+факторинг[ауы]"
          weight: 0.9
          distinctiveness: high
          context: header
          description: "Международный факторинг"

        - pattern: "(?i)master\\s+factoring\\s+agreement"
          weight: 0.95
          distinctiveness: high
          context: header
          description: "Master factoring agreement — рамочный договор факторинга"

        - pattern: "(?i)notification\\s+factoring\\s+agreement"
          weight: 0.9
          distinctiveness: high
          context: header
          description: "Notification factoring agreement — договор с уведомлением должника"

        - pattern: "(?i)финансов[ыйое]\\s+агент"
          weight: 0.9
          distinctiveness: high
          context: any
          description: "Финансовый агент как фактор по ст. 825 ГК РФ"

        - pattern: "(?i)фактор[а-я]*"
          weight: 0.9
          distinctiveness: high
          context: any
          description: "Фактор как сторона договора факторинга"

        - pattern: "(?i)уступк[аеи]\\s+денежн[огоой\\s]*требован[ияи]"
          weight: 0.9
          distinctiveness: high
          context: any
          description: "Уступка денежного требования в пользу фактора"

        - pattern: "(?i)дебиторск[аяое]\\s+задолженн[остьости]"
          weight: 0.85
          distinctiveness: medium
          context: any
          description: "Дебиторская задолженность как объект финансирования"

        - pattern: "(?i)клиент[а-я]*"
          weight: 0.8
          distinctiveness: medium
          context: any
          description: "Клиент (поставщик) как сторона договора факторинга"

        - pattern: "(?i)должник[ауы]"
          weight: 0.8
          distinctiveness: medium
          context: any
          description: "Должник по уступаемому требованию"

      medium:
        - pattern: "(?i)\\bрегресс\\b"
          weight: 0.65
          distinctiveness: medium
          context: any
          description: "Регресс по факторинговой операции"

        - pattern: "(?i)без\\s+регресс[аа]"
          weight: 0.7
          distinctiveness: medium
          context: any
          description: "Факторинг без регресса"

        - pattern: "(?i)безрегрессн[ыо]й\\s+факторинг"
          weight: 0.7
          distinctiveness: medium
          context: any
          description: "Безрегрессный факторинг"

        - pattern: "(?i)уступк[аа]\\s+будущ[ео]го\\s+требовани[яя]"
          weight: 0.65
          distinctiveness: medium
          context: any
          description: "Уступка будущих денежных требований"

        - pattern: "(?i)факторингов[а-яё]+\\s+комисси[яя]"
          weight: 0.65
          distinctiveness: medium
          context: any
          description: "Комиссия фактора за финансирование и обслуживание"

        - pattern: "(?i)реестр\\s+уступленн[ыо]х\\s+требовани[йя]"
          weight: 0.6
          distinctiveness: medium
          context: any
          description: "Реестр уступленных требований как приложение к договору факторинга"

        - pattern: "(?i)уведомлени[ея]\\s+должник[аа]"
          weight: 0.6
          distinctiveness: medium
          context: any
          description: "Уведомление должника об уступке требования фактору"

        - pattern: "(?i)финансировани[ея]\\s+поставщик[аа]"
          weight: 0.6
          distinctiveness: medium
          context: any
          description: "Финансирование поставщика под уступку требований к покупателю"

      low:
        - pattern: "(?i)инкассировани[ея]\\s+задолженност[ии]"
          weight: 0.35
          distinctiveness: low
          context: any
          description: "Инкассирование задолженности фактором"

        - pattern: "(?i)управлени[ея]\\s+дебиторск[оа]й\\s+задолженност[ьюи]"
          weight: 0.35
          distinctiveness: low
          context: any
          description: "Управление дебиторской задолженностью в контексте факторинга"

        - pattern: "(?i)открыт[ыо]й\\s+факторинг"
          weight: 0.3
          distinctiveness: low
          context: any
          description: "Упоминание открытого факторинга в теле"

        - pattern: "(?i)скрыт[ыо]й\\s+факторинг"
          weight: 0.3
          distinctiveness: low
          context: any
          description: "Упоминание скрытого факторинга"

        - pattern: "(?i)международн[ыо]й\\s+факторинг"
          weight: 0.3
          distinctiveness: low
          context: any
          description: "Упоминание международного факторинга"

        - pattern: "(?i)\\bдисконт\\b"
          weight: 0.3
          distinctiveness: low
          context: any
          description: "Дисконт/скидка к номиналу требований при факторинге"

        - pattern: "(?i)зач[её]т\\s+встречн[ыо]х\\s+требовани[йя]"
          weight: 0.25
          distinctiveness: low
          context: any
          description: "Зачёт взаимных требований, возможный в структуре факторинговых расчётов"

    exclusions:
      - pattern: "(?i)договор\\s+цесси[ии]"
        severity: hard
        weight: -1.0
        description: "Чистая уступка права требования без элемента финансирования (цессия), а не факторинг"

      - pattern: "(?i)договор\\s+за[йеё]м[аа]"
        severity: hard
        weight: -1.0
        description: "Договор займа, а не финансирование под уступку денежного требования"

      - pattern: "(?i)\\bпоручительств[ооа]\\b"
        severity: hard
        weight: -1.0
        description: "Поручительство — акцессорное обеспечение, а не факторинговый договор"

      - pattern: "(?i)агентск[иоя]+\\s+договор"
        severity: hard
        weight: -1.0
        description: "Агентский договор об оказании услуг без финансирования и уступки требований"

      - pattern: "(?i)договор\\s+оказани[яя]\\s+услуг\\s+по\\s+взыскани[юю]"
        severity: hard
        weight: -1.0
        description: "Договор услуг по взысканию задолженности (collection), а не факторинг"

      # ── Soft exclusions

      - pattern: "(?i)кредитн[ыйое]\\s+договор"
        severity: soft
        weight: -0.35
        description: "Кредитный договор может сопровождать уступку требований, но сам по себе не является факторингом"

      - pattern: "(?i)залог\\s+прав\\s+требовани[яй]"
        severity: soft
        weight: -0.3
        description: "Залог прав требования без элемента финансирования клиента — ближе к залоговой конструкции"

      - pattern: "(?i)договор\\s+финансировани[яя]\\s+под\\s+залог"
        severity: soft
        weight: -0.3
        description: "Финансирование под залог, а не под уступку денежного требования"

# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 2: ТРИГГЕРЫ
#  Читается: TriggerDetector → doc.applicable_triggers
# ════════════════════════════════════════════════════════════════════════════

trigger_definitions:

  recourse_factoring:
    any_keywords:
      - "(?i)с\\s+регрессом"
      - "(?i)регрессн[оа]е\\s+требовани[ея]"
      - "(?i)фактор\\s+вправе\\s+предъявить\\s+регресс"
      - "(?i)обязан\\s+возвратить\\s+финансировани[ея]"

  non_recourse_factoring:
    any_keywords:
      - "(?i)без\\s+регресс[аа]"
      - "(?i)безрегрессн[ыо]й\\s+факторинг"
      - "(?i)фактор\\s+принимает\\s+риск\\s+неплатеж[аа]"
      - "(?i)фактор\\s+не\\s+вправе\\s+требовать\\s+возврат[аа]\\s+финансировани[яя]"

  future_claim_assignment:
    any_keywords:
      - "(?i)будущ[ео]е\\s+требовани[ея]"
      - "(?i)требовани[ея],?\\s+котор[оае]\\s+возникнет"
      - "(?i)после\\s+поставк[ии]"
      - "(?i)будущ[а-яё]+\\s+дебиторск[а-яё]+\\s+задолженност[ьи]"

  debtor_notification_required:
    any_keywords:
      - "(?i)уведомлени[ея]\\s+должник[аа]"
      - "(?i)должник\\s+уведомляетс[яьа]"
      - "(?i)после\\s+получени[яя]\\s+уведомлени[яя]"
      - "(?i)плат[её]ж\\s+фактор[уу]"
      - "(?i)извещени[ея]\\s+об\\s+уступк[ее]"

  international_factoring:
    any_keywords:
      - "(?i)международн[ыо]й\\s+факторинг"
      - "(?i)внешнеторгов[ыо]й\\s+контракт"
      - "(?i)иностранн[ыо]й\\s+должник"
      - "(?i)экспортн[ыо]й\\s+факторинг"
      - "(?i)\\bimport\\s+factor\\b"
      - "(?i)\\bexport\\s+factor\\b"

  bank_factor:
    any_keywords:
      - "(?i)\\bбанк\\b"
      - "(?i)кредитн[а-яё]+\\s+организаци[яи]"
      - "(?i)лицензи[яи]\\s+банк[аа]\\s+росси[ии]"

  factoring_company_factor:
    any_keywords:
      - "(?i)финансов[ыо]й\\s+агент"
      - "(?i)факторингов[а-яё]+\\s+компани[яи]"
      - "(?i)коммерческ[а-яё]+\\s+организаци[яи]"

  credit_risk_retained_by_factor:
    any_keywords:
      - "(?i)риск\\s+неплатеж[аа]\\s+нес[её]т\\s+фактор"
      - "(?i)кредитн[ыо]й\\s+риск\\s+должник[аа]\\s+принимает\\s+фактор"
      - "(?i)без\\s+прав[аа]\\s+регресс[аа]"

  secured_by_registry_or_schedule:
    any_keywords:
      - "(?i)реестр\\s+уступленн[ыо]х\\s+требовани[йя]"
      - "(?i)переч[её]нь\\s+требовани[йя]"
      - "(?i)\\bschedule\\s+of\\s+receivables\\b"
      - "(?i)приложени[ея]\\s+с\\s+требовани[яями]"
      - "(?i)реестр\\s+дебитор[оо]в"

  hidden_factoring:
    any_keywords:
      - "(?i)скрыт[ыо]й\\s+факторинг"
      - "(?i)конфиденциальн[ыо]й\\s+факторинг"
      - "(?i)без\\s+уведомлени[яя]\\s+должник[аа]"
      - "(?i)должник\\s+не\\s+уведомляетс[яьа]"
      - "(?i)плат[её]ж\\s+клиент[уу]"
      - "(?i)\\bclosed\\s+factoring\\b"
      - "(?i)\\bundisclosed\\s+factoring\\b"

  pledge_over_receivables:
    any_keywords:
      - "(?i)залог\\s+дебиторск[оа]й\\s+задолженност[ии]"
      - "(?i)залог\\s+денежн[ыо]х\\s+требовани[йя]"
      - "(?i)обеспечительн[а-яё]+\\s+уступк[аа]"
      - "(?i)\\bзалогодержател[ья]\\b"
      - "(?i)залог\\s+требовани[яя]"

  assignment_prohibition_in_underlying:
    any_keywords:
      - "(?i)запрет\\s+уступк[ии]"
      - "(?i)уступк[аа]\\s+запрещен[аа]"
      - "(?i)без\\s+согласи[яя]\\s+должник[аа]"
      - "(?i)требуетс[яьа]\\s+согласи[ея]\\s+должник[аа]"
      - "(?i)ограничени[ея]\\s+уступк[ии]"

  reverse_factoring:
    any_keywords:
      - "(?i)реверсивн[ыо]й\\s+факторинг"
      - "(?i)\\breverse\\s+factoring\\b"
      - "(?i)факторинг\\s+по\\s+инициатив[ее]\\s+покупател[яя]"
      - "(?i)подтвержд[её]нн[ыо]й\\s+факторинг"
      - "(?i)\\bsupply\\s+chain\\s+finance\\b"

# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 3: SHARED PATTERNS
#  Читается: DocTypeCheckLoader через _resolve_yaml_templates()
# ════════════════════════════════════════════════════════════════════════════

shared_patterns:

  money_amount: "(?i)\\b\\d[\\d\\s]*(?:руб|рублей|₽|коп|тыс|млн|млрд)"
  percentage_pattern: "(?i)\\b\\d+(?:[.,]\\d+)?\\s*%\\b"
  date_pattern: "(?i)\\b\\d{1,2}[.]\\d{1,2}[.]\\d{4}\\b"
  invoice_pattern: "(?i)(?:счет|инвойс|invoice|накладн|акт)\\s*№?\\s*[A-ZА-Я0-9\\-\\/]+"
  debtor_pattern: "(?i)(должник|дебитор)"
  claim_pattern: "(?i)(денежн(ое|ого)\\s+требован|дебиторск(ая|ой)\\s+задолженн)"

# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 4: COMPLIANCE RULES
#  Читается: DocTypeCheckLoader._exclusion_logic_to_checks()
# ════════════════════════════════════════════════════════════════════════════

compliance_rules:

  - id: "no_financing_element_red_flag"
    name: "Отсутствует явный элемент финансирования"
    description: "Если в договоре есть уступка требования, но отсутствует финансирование/обязательство предоставить финансирование, конструкция может быть простой цессией, а не факторингом"
    legal_base: "ст. 824 ГК РФ"
    required_triggers: []
    severity: "critical"
    result_if_triggered: "fail"
    detector_type: "rules"
    rules:
      keywords:
        - "уступка"
        - "денежное требование"
      negative_keywords:
        - "финансирование"
        - "денежные средства"
        - "выплата клиенту"
        - "авансирование"
      keyword_mode: "any"
    retrieval:
      context_k: 5
      boost_keywords:
        - "финансирование"
        - "уступка требования"
        - "денежные средства"
      rerank: true

  - id: "factor_status_unclear"
    name: "Неясный статус финансового агента"
    description: "Финансовый агент должен быть надлежащим субъектом по смыслу закона; отсутствие ясной идентификации повышает риск дефектной конструкции"
    legal_base: "ст. 825 ГК РФ"
    required_triggers: []
    severity: "critical"
    result_if_triggered: "fail"
    detector_type: "rules"
    rules:
      negative_keywords:
        - "финансовый агент"
        - "банк"
        - "коммерческая организация"
        - "фактор"
        - "ооо"
        - "ао"
        - "пао"
      keyword_mode: "any"
    retrieval:
      context_k: 4
      boost_keywords:
        - "финансовый агент"
        - "фактор"
        - "коммерческая организация"
      rerank: true

  - id: "future_claim_not_determinable"
    name: "Будущее требование недостаточно определимо"
    description: "При уступке будущего требования необходимо, чтобы требование можно было определить в момент его возникновения"
    legal_base: "ст. 826 ГК РФ"
    required_triggers: ["future_claim_assignment"]
    severity: "critical"
    result_if_triggered: "fail"
    detector_type: "rules"
    rules:
      keywords:
        - "будущее требование"
        - "после поставки"
      negative_keywords:
        - "должник"
        - "основание требования"
        - "договор поставки"
        - "срок оплаты"
        - "реестр уступленных требований"
      keyword_mode: "any"
    retrieval:
      context_k: 5
      boost_keywords:
        - "будущее требование"
        - "должник"
        - "основание требования"
      rerank: true

  - id: "non_recourse_contradiction"
    name: "Противоречие в безрегрессной конструкции"
    description: "Если договор одновременно называет факторинг безрегрессным и предусматривает возврат финансирования клиентом при неплатеже должника, риск конструкции критический"
    legal_base: "ст. 831 ГК РФ"
    required_triggers: ["non_recourse_factoring"]
    severity: "critical"
    result_if_triggered: "fail"
    detector_type: "rules"
    rules:
      keywords:
        - "без регресса"
        - "безрегрессный"
        - "обязан возвратить финансирование"
        - "регрессное требование"
      keyword_mode: "any"
    retrieval:
      context_k: 5
      boost_keywords:
        - "без регресса"
        - "регрессное требование"
        - "возврат финансирования"
      rerank: true

  - id: "debtor_payment_routing_unclear"
    name: "Неясно, кому и после какого уведомления платит должник"
    description: "Если порядок уведомления должника и маршрутизация платежа неясны, высок риск двойного платежа и споров об исполнении"
    legal_base: "ст. 830 ГК РФ"
    required_triggers: []
    severity: "high"
    result_if_triggered: "fail"
    detector_type: "rules"
    rules:
      negative_keywords:
        - "уведомление должника"
        - "платеж финансовому агенту"
        - "после получения уведомления"
        - "исполнение в пользу фактора"
      keyword_mode: "any"
    retrieval:
      context_k: 5
      boost_keywords:
        - "уведомление должника"
        - "платеж фактору"
        - "исполнение должником"
      rerank: true

  - id: "hidden_factoring_double_payment_risk"
    name: "Скрытый факторинг: риск двойного платежа"
    description: |
      При скрытом факторинге должник не уведомляется и платит клиенту.
      Без механизмов перевода средств фактору — высок риск присвоения денег клиентом.
    legal_base: "ст. 830 ГК РФ"
    required_triggers: ["hidden_factoring"]
    severity: "critical"
    result_if_triggered: "fail"
    detector_type: "rules"
    rules:
      keywords:
        - "скрытый факторинг"
        - "конфиденциальный факторинг"
        - "без уведомления должника"
      keyword_mode: "any"
      negative_keywords:
        - "перечислить фактору"
        - "специальный счёт"
        - "в течение"
        - "обязан передать"
    retrieval:
      context_k: 5
      boost_keywords:
        - "перечисление фактору"
        - "специальный счёт"
        - "отчётность"
      rerank: true

  - id: "assignment_despite_prohibition_risk"
    name: "Уступка при запрете в основном договоре — риск ответственности клиента"
    description: |
      По ст. 828 ГК РФ уступка действительна даже при запрете, но клиент
      может нести ответственность перед должником. Фактору важны заверения.
    legal_base: "ст. 828 ГК РФ"
    required_triggers: ["assignment_prohibition_in_underlying"]
    severity: "high"
    result_if_triggered: "warning"
    detector_type: "rules"
    rules:
      keywords:
        - "запрет уступки"
        - "уступка запрещена"
        - "согласие должника"
      keyword_mode: "any"
      negative_keywords:
        - "клиент заверяет"
        - "отсутствует запрет"
        - "клиент гарантирует"
    retrieval:
      context_k: 5
      boost_keywords:
        - "запрет уступки"
        - "заверение"
        - "ответственность клиента"
      rerank: true

  - id: "international_factoring_currency_control"
    name: "Международный факторинг: валютный контроль"
    description: |
      При международном факторинге применяются требования ФЗ-173:
      репатриация выручки, документы валютного контроля.
    legal_base: "ФЗ № 173-ФЗ"
    required_triggers: ["international_factoring"]
    severity: "critical"
    result_if_triggered: "warning"
    detector_type: "rules"
    rules:
      keywords:
        - "международный факторинг"
        - "иностранный должник"
        - "валютная выручка"
        - "экспортный факторинг"
      keyword_mode: "any"
      negative_keywords:
        - "валютный контроль"
        - "репатриация"
        - "паспорт сделки"
    retrieval:
      context_k: 5
      boost_keywords:
        - "валюта"
        - "репатриация"
        - "валютный контроль"
      rerank: true

  - id: "pledge_priority_conflict"
    name: "Конфликт приоритетов: залог vs. уступка дебиторки"
    description: |
      Если дебиторская задолженность уже заложена, уступка фактору
      создаёт конфликт приоритетов с залогодержателем.
    legal_base: "ст. 358.1-358.8 ГК РФ"
    required_triggers: ["pledge_over_receivables"]
    severity: "critical"
    result_if_triggered: "fail"
    detector_type: "rules"
    rules:
      keywords:
        - "залог дебиторской задолженности"
        - "залог требования"
        - "залогодержатель"
      keyword_mode: "any"
      negative_keywords:
        - "отсутствует залог"
        - "не обременено"
        - "клиент заверяет"
    retrieval:
      context_k: 5
      boost_keywords:
        - "залог"
        - "залогодержатель"
        - "приоритет"
      rerank: true

# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 5: CHECKS_V8 — LLM/hybrid проверки
#  Читается: DocTypeCheckLoader._load_doc_type_checks()
# ════════════════════════════════════════════════════════════════════════════

checks_v8:

  - id: factoring_subject_extraction
    name: "Базовое извлечение структуры факторинга"
    description: "Извлекает финансового агента, клиента, должника, финансирование, вид уступаемого требования и регрессность"
    triggers: {}
    severity: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "финансовый агент"
        - "фактор"
        - "клиент"
        - "должник"
        - "финансирование"
        - "уступка денежного требования"
        - "с регрессом"
        - "без регресса"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)(финансовый\\s+агент|фактор|клиент|должник)"
        - "(?i)(финансировани[ея]\\s+под\\s+уступку|уступк[аи].*денежн.*требован)"
        - "(?i)(с\\s+регрессом|без\\s+регресса|безрегрессн)"
    llm:
      prompt_template: |
        Ты — юридический ассистент, анализирующий договор факторинга.
        Извлеки ключевые параметры договора строго по тексту.

        Ответь строго в JSON:
        {
          "factor": "<финансовый агент/фактор или not_found>",
          "client": "<клиент или not_found>",
          "debtor": "<должник или not_found>",
          "claim_type": "<existing / future / mixed / unclear / not_found>",
          "assigned_claim_basis": "<основание требования или not_found>",
          "financing_amount": "<сумма финансирования или not_found>",
          "factor_fee": "<вознаграждение фактора или not_found>",
          "factoring_type": "<recourse / non_recourse / unclear / not_found>",
          "debtor_notification_status": "<present / not_found>"
        }

        Используй только сведения из текста.
        Если данных нет — пиши "not_found".
      prompt_file: null
      context_k: 6
      temperature: 0.0
      max_tokens: 700
    retrieval:
      context_k: 6
      max_chunks: 10
      boost_keywords:
        - "финансовый агент"
        - "уступка денежного требования"
        - "финансирование"
        - "регресс"
        - "уведомление должника"
      rerank: true
      filters: {}
    evidence:
      required: true
      min_snippet_length: 50
      max_snippet_length: 700
    extraction:
      enabled: true
      mode: "hybrid"
      fields:
        - name: "factor"
          type: "string"
          keyword_hints: ["финансовый агент", "фактор"]
          description: "Финансовый агент"
        - name: "client"
          type: "string"
          keyword_hints: ["клиент"]
          description: "Клиент"
        - name: "debtor"
          type: "string"
          keyword_hints: ["должник", "дебитор"]
          description: "Должник"
        - name: "claim_type"
          type: "string"
          allowed_values: ["existing", "future", "mixed", "unclear", "not_found"]
          description: "Тип уступаемого требования"
        - name: "assigned_claim_basis"
          type: "string"
          keyword_hints: ["договор поставки", "договор оказания услуг", "основание требования"]
          description: "Основание требования"
        - name: "financing_amount"
          type: "string"
          keyword_hints: ["сумма финансирования", "размер финансирования", "аванс"]
          description: "Размер финансирования"
        - name: "factor_fee"
          type: "string"
          keyword_hints: ["факторинговая комиссия", "вознаграждение", "дисконт"]
          description: "Вознаграждение фактора"
        - name: "factoring_type"
          type: "string"
          allowed_values: ["recourse", "non_recourse", "unclear", "not_found"]
          description: "Вид факторинга"
        - name: "debtor_notification_status"
          type: "string"
          allowed_values: ["present", "not_found"]
          description: "Наличие порядка уведомления должника"
      store_payload: true

  - id: assigned_claim_identification_check
    name: "Идентификация уступаемого денежного требования"
    description: "Проверяет достаточную определимость уступаемого требования, включая основание, сумму и должника"
    triggers: {}
    severity: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "денежное требование"
        - "дебиторская задолженность"
        - "должник"
        - "основание требования"
        - "договор поставки"
        - "реестр уступленных требований"
        - "сумма требования"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)(денежн(ое|ого)\\s+требован|дебиторск(ая|ой)\\s+задолженн)"
        - "(?i)(должник|дебитор)"
        - "(?i)реестр\\s+уступленн(ых|ые)\\s+требован"
    llm:
      prompt_template: |
        Ты — юридический ассистент, анализирующий договор факторинга.
        Проверь, достаточно ли определено уступаемое требование.

        Ответь строго в JSON:
        {
          "claim_identification_status": "<clear / partial / not_found>",
          "debtor_identified": "<yes / no>",
          "claim_amount_identified": "<yes / no>",
          "underlying_contract_identified": "<yes / no>",
          "registry_or_schedule_present": "<yes / no / not_found>"
        }

        Используй только текст договора.
      prompt_file: null
      context_k: 5
      temperature: 0.0
      max_tokens: 380
    retrieval:
      context_k: 5
      max_chunks: 8
      boost_keywords:
        - "денежное требование"
        - "должник"
        - "реестр уступленных требований"
        - "основание требования"
      rerank: true
      filters: {}
    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 600
    extraction:
      enabled: true
      mode: "hybrid"
      fields:
        - name: "claim_identification_status"
          type: "string"
          allowed_values: ["clear", "partial", "not_found"]
          description: "Статус идентификации требования"
        - name: "debtor_identified"
          type: "string"
          allowed_values: ["yes", "no"]
          description: "Идентифицирован ли должник"
        - name: "claim_amount_identified"
          type: "string"
          allowed_values: ["yes", "no"]
          description: "Идентифицирована ли сумма требования"
        - name: "underlying_contract_identified"
          type: "string"
          allowed_values: ["yes", "no"]
          description: "Указано ли основание требования"
        - name: "registry_or_schedule_present"
          type: "string"
          allowed_values: ["yes", "no", "not_found"]
          description: "Есть ли реестр/приложение с требованиями"
      store_payload: true

  - id: financing_and_fee_structure_check
    name: "Финансирование и структура вознаграждения фактора"
    description: "Проверяет размер финансирования, сроки выплаты и прозрачность комиссий/дисконта"
    triggers: {}
    severity: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "сумма финансирования"
        - "размер финансирования"
        - "факторинговая комиссия"
        - "вознаграждение"
        - "дисконт"
        - "дополнительные платежи"
        - "по тарифам"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)(сумма|размер)\\s+финансирован"
        - "(?i)факторингов(ая|ого)\\s+комисси"
        - "(?i)дисконт|вознаграждени"
    llm:
      prompt_template: |
        Ты — юридический ассистент, анализирующий договор факторинга.
        Проверь условия финансирования и вознаграждения фактора.

        Ответь строго в JSON:
        {
          "financing_terms_status": "<clear / partial / not_found>",
          "fee_structure_status": "<transparent / vague / not_found>",
          "open_ended_fees_risk": "<high / medium / low / not_found>",
          "client_excess_return_clause": "<present / not_found>"
        }

        - "vague" — если есть формулы об оплате по тарифам, дополнительным платежам или дискреции фактора без полного раскрытия.
      prompt_file: null
      context_k: 6
      temperature: 0.0
      max_tokens: 420
    retrieval:
      context_k: 6
      max_chunks: 8
      boost_keywords:
        - "сумма финансирования"
        - "факторинговая комиссия"
        - "дисконт"
        - "тарифы"
      rerank: true
      filters: {}
    evidence:
      required: true
      min_snippet_length: 45
      max_snippet_length: 650
    extraction:
      enabled: true
      mode: "hybrid"
      fields:
        - name: "financing_terms_status"
          type: "string"
          allowed_values: ["clear", "partial", "not_found"]
          description: "Понятность условий финансирования"
        - name: "fee_structure_status"
          type: "string"
          allowed_values: ["transparent", "vague", "not_found"]
          description: "Прозрачность вознаграждения фактора"
        - name: "open_ended_fees_risk"
          type: "string"
          allowed_values: ["high", "medium", "low", "not_found"]
          description: "Риск скрытых/открытых комиссий"
        - name: "client_excess_return_clause"
          type: "string"
          allowed_values: ["present", "not_found"]
          description: "Есть ли условие о возврате клиенту излишка"
      store_payload: true

  - id: recourse_allocation_check
    name: "Регресс / безрегрессность и распределение кредитного риска"
    description: "Проверяет вид факторинга, условия регресса и распределение риска неплатежа должника"
    triggers: {}
    severity: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "с регрессом"
        - "без регресса"
        - "безрегрессный"
        - "регрессное требование"
        - "риск неплатежа"
        - "обязан возвратить финансирование"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)(с\\s+регрессом|без\\s+регресса|безрегрессн)"
        - "(?i)регрессн(ое|ого)\\s+требован"
        - "(?i)риск\\s+неплатежа"
    llm:
      prompt_template: |
        Ты — юридический ассистент, анализирующий договор факторинга.
        Проверь распределение риска неплатежа должника и условия регресса.

        Ответь строго в JSON:
        {
          "factoring_type": "<recourse / non_recourse / mixed_or_contradictory / unclear / not_found>",
          "recourse_trigger_conditions": "<clear / vague / not_found>",
          "client_liability_cap": "<present / not_found>",
          "risk_allocation_clarity": "<clear / unclear / not_found>"
        }

        - "mixed_or_contradictory" — если договор одновременно содержит признаки безрегрессного факторинга и регрессных обязательств клиента.
      prompt_file: null
      context_k: 6
      temperature: 0.0
      max_tokens: 420
    retrieval:
      context_k: 6
      max_chunks: 8
      boost_keywords:
        - "с регрессом"
        - "без регресса"
        - "риск неплатежа"
        - "возврат финансирования"
      rerank: true
      filters: {}
    evidence:
      required: true
      min_snippet_length: 45
      max_snippet_length: 650
    extraction:
      enabled: true
      mode: "hybrid"
      fields:
        - name: "factoring_type"
          type: "string"
          allowed_values: ["recourse", "non_recourse", "mixed_or_contradictory", "unclear", "not_found"]
          description: "Вид факторинга"
        - name: "recourse_trigger_conditions"
          type: "string"
          allowed_values: ["clear", "vague", "not_found"]
          description: "Понятность условий регресса"
        - name: "client_liability_cap"
          type: "string"
          allowed_values: ["present", "not_found"]
          description: "Есть ли лимит ответственности клиента"
        - name: "risk_allocation_clarity"
          type: "string"
          allowed_values: ["clear", "unclear", "not_found"]
          description: "Понятность распределения кредитного риска"
      store_payload: true

  - id: debtor_notification_check
    name: "Уведомление должника и порядок исполнения в пользу фактора"
    description: "Проверяет порядок уведомления должника, ответственного за уведомление и момент, с которого должник должен платить фактору"
    triggers: {}
    severity: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "уведомление должника"
        - "должник уведомляется"
        - "об уступке"
        - "платеж финансовому агенту"
        - "исполнение в пользу фактора"
        - "получение уведомления"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)уведомлени[ея]\\s+должник"
        - "(?i)об\\s+уступк"
        - "(?i)платеж.*финансовому\\s+агенту"
    llm:
      prompt_template: |
        Ты — юридический ассистент, анализирующий договор факторинга.
        Проверь порядок уведомления должника и исполнения уступленного требования.

        Ответь строго в JSON:
        {
          "notification_clause_status": "<present / not_found>",
          "who_notifies_debtor": "<client / factor / both / not_found>",
          "payment_routing_after_notice": "<factor / client / unclear / not_found>",
          "proof_of_notice_mechanism": "<present / not_found>"
        }

        Используй только текст договора.
      prompt_file: null
      context_k: 5
      temperature: 0.0
      max_tokens: 360
    retrieval:
      context_k: 5
      max_chunks: 8
      boost_keywords:
        - "уведомление должника"
        - "об уступке"
        - "платеж фактору"
      rerank: true
      filters: {}
    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 580
    extraction:
      enabled: true
      mode: "hybrid"
      fields:
        - name: "notification_clause_status"
          type: "string"
          allowed_values: ["present", "not_found"]
          description: "Есть ли порядок уведомления должника"
        - name: "who_notifies_debtor"
          type: "string"
          allowed_values: ["client", "factor", "both", "not_found"]
          description: "Кто уведомляет должника"
        - name: "payment_routing_after_notice"
          type: "string"
          allowed_values: ["factor", "client", "unclear", "not_found"]
          description: "Кому платит должник после уведомления"
        - name: "proof_of_notice_mechanism"
          type: "string"
          allowed_values: ["present", "not_found"]
          description: "Есть ли доказательственный механизм уведомления"
      store_payload: true

  - id: setoff_and_double_assignment_risk_check
    name: "Зачет встречных требований и повторная уступка"
