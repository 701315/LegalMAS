      - pattern: "(?i)\\bдоговор[\\s_.-]*финансировани[а-я]*[\\s_.-]*под[\\s_.-]*уступк[а-я]*[\\s_.-]*(?:денежн[а-я]*[\\s_.-]*)?требовани[а-я]*\\b"
        kind: specific_subject
