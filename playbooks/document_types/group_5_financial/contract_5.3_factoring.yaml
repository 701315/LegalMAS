      - "(?i)должник\\s+уведомляетс[яьа]"
      - "(?i)после\\s+получени[яя]\\s+уведомлени[яя]"
      - "(?i)плат[её]ж\\s+фактор[уу]"
      - "(?i)извещени[ея]\\s+об\\s+уступк[ее]"
  international_factoring:
    any_keywords:
      - "(?i)международн[ыо]й\\s+факторинг"
      - "(?i)внешнеторгов[ыо]й\\s+контракт"
      - "(?i)иностранн[ыо]й\\s+должник"
      - "(?i)экспортн[ыо]й\\s+факторинг"
      - "(?i)\\bimport\\s+factor\\b"
      - "(?i)\\bexport\\s+factor\\b"
  bank_factor:
    any_keywords:
      - "(?i)\\bбанк\\b"
      - "(?i)кредитн[а-яё]+\\s+организаци[яи]"
      - "(?i)лицензи[яи]\\s+банк[аа]\\s+росси[ии]"
  factoring_company_factor:
    any_keywords:
      - "(?i)финансов[ыо]й\\s+агент"
      - "(?i)факторингов[а-яё]+\\s+компани[яи]"
      - "(?i)коммерческ[а-яё]+\\s+организаци[яи]"
  credit_risk_retained_by_factor:
    any_keywords:
      - "(?i)риск\\s+неплатеж[аа]\\s+нес[её]т\\s+фактор"
      - "(?i)кредитн[ыо]й\\s+риск\\s+должник[аа]\\s+принимает\\s+фактор"
      - "(?i)без\\s+прав[аа]\\s+регресс[аа]"
