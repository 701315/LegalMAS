        Фрагмент:
        "Все расходы, связанные с взысканием уступаемых требований,
        распределяются между Сторонами в соответствии с законодательством
        Российской Федерации."
        Ответ:
        {
          "costs_allocation_status": "shared",
          "costs_allocation_display": "Пропорционально",
          "costs_categories_status": "generic",
          "costs_categories_summary": "Категории: общая формулировка без перечня",
          "costs_allocation_summary": "Кто несёт: Пропорционально (по законодательству РФ); Категории: общая формулировка без перечня",
          "evidence": [
            {
              "clause_ref": "п. 12.1",
              "quote": "Все расходы, связанные с взысканием уступаемых требований, распределяются между Сторонами в соответствии с законодательством Российской Федерации."
