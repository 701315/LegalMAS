        corpus_scope: "primary_segment"
        levels:
          - "legal_unit"
          - "section"
        required_kind: "legal_unit"
        retrieval_query: "передача документов оригиналы документов акт приема-передачи документов накладные счета-фактуры отсутствие признаков банкротства не находится в процедуре банкротства рыночные условия"
        preferred_unit_types:
