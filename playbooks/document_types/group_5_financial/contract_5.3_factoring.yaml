# ════════════════════════════════════════════════════════════════════════════

shared_patterns:
  money_amount: "(?i)\\b\\d[\\d\\s]*(?:руб|рублей|₽|коп|тыс|млн|млрд)"
  percentage_pattern: "(?i)\\b\\d+(?:[.,]\\d+)?\\s*%\\b"
  date_pattern: "(?i)\\b\\d{1,2}[.]\\d{1,2}[.]\\d{4}\\b"
  invoice_pattern: "(?i)(?:счет|инвойс|invoice|накладн|акт)\\s*№?\\s*[A-ZА-Я0-9\\-/]+"
  debtor_pattern: "(?i)(должник|дебитор)"
  claim_pattern: "(?i)(денежн(ое|ого)\\s+требован|дебиторск(ая|ой)\\s+задолженн)"

compliance_rules: []

# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 4: CHECKS_V8 — единственный рабочий слой юридического анализа
#  Читается: DocTypeCheckLoader._load_doc_type_checks()
# ════════════════════════════════════════════════════════════════════════════

checks_v8:

  - id: factoring_parties_identification
    name: "Стороны договора: идентификация фактора и клиента"
    description: >
      Фактографическая проверка идентификации финансового агента (фактора)
      и клиента, их реквизитов, статуса фактора как допустимого субъекта,
      подписантов и оснований полномочий.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "финансовый агент"
        - "фактор"
        - "клиент"
        - "именуем"
        - "в лице"
        - "действующего на основании"
        - "банк"
        - "коммерческая организация"
        - "факторинговая компания"
        - "ИНН"
        - "ОГРН"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)(финансовый\\s+агент|фактор|клиент).*именуем"
        - "(?i)действующ[а-я]+\\s+на\\s+основании"
        - "(?i)(банк|коммерческ(ая|ой)\\s+организац|факторингов(ая|ой)\\s+компани)"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор финансирования под уступку денежного требования
        (факторинг) по Главе 43 ГК РФ (ст. 824–825).
        Проверяется только один вопрос: идентификация сторон — финансового агента
        (фактора) и клиента, их реквизиты, статус фактора, подписанты и полномочия.
        Нормативный ориентир:
        - ст. 825 ГК РФ — финансовый агент
        - ст. 432 ГК РФ — существенные условия
        Важно:
        - Твоя задача — не оценивать серьёзность риска.
        - Только установить, что прямо есть в тексте договора, а чего прямо нет.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Наименование и реквизиты финансового агента (фактора).
        2. Статус фактора (банк / коммерческая организация / факторинговая компания)
           и его user-facing формулировку для отображения.
        3. Наименование и реквизиты клиента.
        4. Кто подписывает от каждой стороны и на каком основании.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Если данные не указаны прямо:
           - для status-полей верни "not_defined";
           - для текстовых user-facing полей верни "Данные не определены"
             (или "Не установлено" для factor_status_display).
        4. Запрещены значения: null, None, пустые строки — их не используй никогда.
           Допустимые fallback-значения: "not_defined", "Данные не определены",
           "Не установлено".
        5. В evidence включай только дословные цитаты из текста договора.
        6. Верни РОВНО один JSON-объект со всеми 10 ключами без какого-либо
           дополнительного текста до или после. Начни ответ сразу с открывающей
           фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки,
           код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга
           через json.loads без предварительной обработки.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — полная идентификация:
        Фрагмент:
        "ООО «ФакторПлюс» (ИНН 7700000001, ОГРН 1027700000001), коммерческая
        организация, именуемое «Финансовый агент», в лице Генерального директора
        Иванова И.И., действующего на основании Устава, и ООО «Поставщик»
        (ИНН 7700000002), именуемое «Клиент», в лице директора Петрова П.П."
        Ответ:
        {
          "factor_details_status": "defined",
          "factor_details_value": "ООО «ФакторПлюс», ИНН 7700000001, ОГРН 1027700000001",
          "factor_status": "commercial_organization",
          "factor_status_display": "Коммерческая организация",
          "factor_signatory": "Генеральный директор Иванов И.И.",
          "factor_signatory_basis": "charter",
          "client_details_status": "defined",
          "client_details_value": "ООО «Поставщик», ИНН 7700000002",
          "client_signatory": "Директор Петров П.П.",
          "client_signatory_basis": "not_defined",
          "evidence": [
            {
              "clause_ref": "Преамбула",
              "quote": "ООО «ФакторПлюс» (ИНН 7700000001, ОГРН 1027700000001), коммерческая организация, именуемое «Финансовый агент»."
            }
          ]
        }

        Пример 2 — данных в договоре нет:
        Фрагмент:
        "Стороны заключили настоящий договор факторинга."
        Ответ:
        {
          "factor_details_status": "not_defined",
          "factor_details_value": "Данные не определены",
          "factor_status": "not_defined",
          "factor_status_display": "Не установлено",
          "factor_signatory": "Данные не определены",
          "factor_signatory_basis": "not_defined",
          "client_details_status": "not_defined",
          "client_details_value": "Данные не определены",
          "client_signatory": "Данные не определены",
          "client_signatory_basis": "not_defined",
          "evidence": []
        }

        Пример 3 — текст есть, но надёжный вывод сделать нельзя
        (неоднозначная формулировка):
        Фрагмент:
        "ООО «ФакторПлюс», именуемое «Финансовый агент», в лице уполномоченного
        представителя, действующего на основании доверенности, и ООО «Поставщик»,
        именуемое «Клиент», в лице директора Петрова П.П."
        Ответ:
        {
          "factor_details_status": "defined",
          "factor_details_value": "ООО «ФакторПлюс»",
          "factor_status": "not_defined",
          "factor_status_display": "Не установлено",
          "factor_signatory": "Данные не определены",
          "factor_signatory_basis": "poa",
          "client_details_status": "defined",
          "client_details_value": "ООО «Поставщик»",
          "client_signatory": "Директор Петров П.П.",
          "client_signatory_basis": "not_defined",
          "evidence": [
            {
              "clause_ref": "Преамбула",
              "quote": "ООО «ФакторПлюс», именуемое «Финансовый агент», в лице уполномоченного представителя, действующего на основании доверенности."
            }
          ]
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату с идентификацией фактора.
        2. Найди прямую цитату с идентификацией клиента.
        3. Найди прямую цитату о статусе фактора.
        4. Найди прямую цитату о подписантах и основаниях.
        5. Согласуй фактические поля и display-поля: factor_status_display
           должно соответствовать factor_status ("bank" -> "Банк",
           "commercial_organization" -> "Коммерческая организация",
           "factoring_company" -> "Факторинговая компания",
           "not_defined" -> "Не установлено").
        6. Если прямой цитаты нет — верни "not_defined" для status-полей
           и "Данные не определены" / "Не установлено" для текстовых полей.
        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь РОВНО одним JSON-объектом без какого-либо дополнительного текста
        до или после, со всеми 10 ключами:
        {
          "factor_details_status": "<defined / not_defined>",
          "factor_details_value": "<реквизиты или 'Данные не определены'>",
          "factor_status": "<bank / commercial_organization / factoring_company / not_defined>",
          "factor_status_display": "<Банк / Коммерческая организация / Факторинговая компания / Не установлено>",
          "factor_signatory": "<ФИО и должность или 'Данные не определены'>",
          "factor_signatory_basis": "<charter / poa / order / other / not_defined>",
          "client_details_status": "<defined / not_defined>",
          "client_details_value": "<реквизиты или 'Данные не определены'>",
          "client_signatory": "<ФИО и должность или 'Данные не определены'>",
          "client_signatory_basis": "<charter / poa / order / other / not_defined>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 8
      temperature: 0.0
      max_tokens: 700

    retrieval:
      retrieval_profile: "party_identification_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "финансовый агент фактор клиент именуем в лице действующего на основании банк коммерческая организация факторинговая компания ИНН ОГРН реквизиты"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - representations
        - boilerplate
      negative_keywords:
        - "уступка требования"
        - "финансирование"
        - "регресс"
        - "уведомление должника"
        - "комиссия"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.0, 0.20]
        boost: 0.40
        scope: segment
      context_k: 8
      max_chunks: 10
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "representations"
        - "boilerplate"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.15

    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 600

    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false
      llm_max_tokens: 1300

      presence_signal:
        field: "factoring_parties_identification_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора факторинга сведения
        о финансовом агенте (факторе) и клиенте: реквизиты, статус фактора,
        подписанты и основания полномочий.
        Не анализируй уступку, финансирование, регресс или уведомление должника.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. factoring_parties_identification_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (factor_details_status, client_details_status) ≠ "not_defined";
           - "missing" — если оба содержательных поля = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - factor_details_status = "not_defined";
           - factor_status = "not_defined";
           - factor_signatory_basis = "not_defined";
           - client_details_status = "not_defined";
           - client_signatory_basis = "not_defined";
           - factor_details_value, client_details_value, factor_signatory,
             client_signatory = "Данные не определены";
           - factor_status_display = "Не установлено";
           - не выполняй остальные шаги.

        1.  factor_details_status — "defined" или "not_defined".
        2.  factor_details_value — наименование и реквизиты фактора
            или "Данные не определены".
        3.  factor_status — bank / commercial_organization /
            factoring_company / not_defined.
        4.  factor_status_display — "Банк" / "Коммерческая организация" /
            "Факторинговая компания" / "Не установлено"
            (должно соответствовать factor_status).
        5.  factor_signatory — подписант фактора (ФИО и должность)
            или "Данные не определены".
        6.  factor_signatory_basis — charter / poa / order / other /
            not_defined.
        7.  client_details_status — "defined" или "not_defined".
        8.  client_details_value — наименование и реквизиты клиента
            или "Данные не определены".
        9.  client_signatory — подписант клиента (ФИО и должность)
            или "Данные не определены".
        10. client_signatory_basis — charter / poa / order / other /
            not_defined.
        11. evidence — массив точных цитат из договора.
        </task>

        <context_rules>
        - Перед остальными полями заполни factoring_parties_identification_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined", все *_value/*_signatory = "Данные не определены", factor_status_display = "Не установлено".
        - Используй только текст договора.
        - Не выводи статус фактора из нормы ст. 825 ГК РФ — только из текста договора.
        - Не подставляй нормы закона вместо текста договора.
        - Не смешивай финансового агента (фактора) с должником по базовому обязательству.
        - Если фрагменты конфликтуют и не позволяют сделать надёжный вывод, верни "Не удалось определить" для затронутого видимого поля и включи конфликтующие цитаты в evidence.
        - Запрещены значения null, None и пустые строки.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет идентификации фактора или клиента.
           → presence = "missing";
             все *_status = "not_defined";
             все *_value/*_signatory = "Данные не определены";
             factor_status_display = "Не установлено".

        2. Только роли без идентификации.
           Упомянуты "Фактор" и "Клиент", но без реквизитов и подписантов.
           → presence = "present";
             factor_details_status = client_details_status = "not_defined";
             *_value = "Данные не определены".

        3. Противоречие между фрагментами.
           В преамбуле и в реквизитах указаны разные наименования или ИНН одной стороны.
           → presence = "unclear";
             соответствующий *_status = "not_defined";
             *_value = "Не удалось определить".

        4. Отсылка на внешний документ.
           Реквизиты или подписант определяются через приложение или доверенность, и это прямо указано.
           → presence = "present";
             соответствующий *_status = "defined";
             *_value содержит формулировку вида "Определяется по Приложению № 1".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для factoring_parties_identification_presence используй только: "present", "missing", "unclear".
        - Для статусных enum-полей используй только допустимые значения из списка.
        - Fallback при отсутствии данных:
          * factor_details_value, client_details_value, factor_signatory, client_signatory → "Данные не определены";
          * factor_status_display → "Не установлено".
        - Fallback при противоречии или неоднозначности:
          * все *_value / *_display → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "factoring_parties_identification_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие идентификации сторон в договоре факторинга. Внутреннее агрегатное signal-поле."
          required: true

        - name: "factor_details_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус идентификации фактора. Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "factor_details_value"
          type: "string"
          presentation: "fact"
          label: "Финансовый агент (фактор)"
          description: >
            Наименование и реквизиты финансового агента. Fallback: "Не установлено" / "Не удалось определить".
          required: true
          display_in_grid: true
          display_priority: 1

        - name: "factor_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["bank", "commercial_organization", "factoring_company", "not_defined"]
          description: "Статус фактора как допустимого субъекта (raw enum). Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "factor_status_display"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 2
          label: "Статус фактора"
          description: >
            User-facing статус фактора: Банк / Коммерческая организация /
            Факторинговая компания / Не установлено.
            Fallback: "Не установлено" / "Не удалось определить".
          required: true

        - name: "factor_signatory"
          type: "string"
          presentation: "fact"
          label: "Подписант фактора"
          description: >
            Подписант от финансового агента. Fallback: "Не установлено" / "Не удалось определить".
          required: true
          display_in_grid: false

        - name: "factor_signatory_basis"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["charter", "poa", "order", "other", "not_defined"]
          description: "Основание полномочий подписанта фактора. Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "client_details_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус идентификации клиента. Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "client_details_value"
          type: "string"
          presentation: "fact"
          label: "Клиент"
          description: >
            Наименование и реквизиты клиента. Fallback: "Не установлено" / "Не удалось определить".
          required: true
          display_in_grid: true
          display_priority: 3

        - name: "client_signatory"
          type: "string"
          presentation: "fact"
          label: "Подписант клиента"
          description: >
            Подписант от клиента. Fallback: "Не установлено" / "Не удалось определить".
          required: true
          display_in_grid: false

        - name: "client_signatory_basis"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["charter", "poa", "order", "other", "not_defined"]
          description: "Основание полномочий подписанта клиента. Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "evidence"
          type: "array"
          presentation: "diagnostic"
          description: "Точные цитаты из договора, подтверждающие извлечённые значения."
          required: true
          display_in_grid: false

      store_payload: true

  - id: factoring_subject_extraction
    name: "Базовое извлечение структуры факторинга"
    description: >
      Фактографическая проверка ключевых параметров договора факторинга:
      тип уступаемого требования, основание требования, размер финансирования,
      вознаграждение фактора, вид факторинга и порядок уведомления должника.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "финансовый агент"
        - "фактор"
        - "клиент"
        - "должник"
        - "финансирование"
        - "уступка денежного требования"
        - "с регрессом"
        - "без регресса"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)(финансовый\\s+агент|фактор|клиент|должник)"
        - "(?i)(финансировани[ея]\\s+под\\s+уступку|уступк[аи].*денежн.*требован)"
        - "(?i)(с\\s+регрессом|без\\s+регресса|безрегрессн)"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор финансирования под уступку денежного требования
        (факторинг) по Главе 43 ГК РФ.
        Проверяется только один вопрос: базовая структура сделки факторинга.
        Нормативный ориентир:
        - ст. 824 ГК РФ — договор финансирования под уступку денежного требования
        - ст. 826 ГК РФ — денежное требование
        - ст. 830 ГК РФ — уведомление должника
        Важно:
        - Твоя задача — не оценивать серьёзность риска.
        - Только установить, что прямо есть в тексте договора, а чего прямо нет.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Тип уступаемого требования (существующее / будущее / смешанное)
           и его user-facing формулировку.
        2. Основание требования (договор поставки, оказания услуг и т.д.).
        3. Размер финансирования.
        4. Вознаграждение фактора (комиссия / тариф / ставка).
        5. Вид факторинга (с регрессом / без регресса) и его user-facing формулировку.
        6. Порядок уведомления должника (кто, когда, как уведомляет).

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Если данные не указаны прямо:
           - для status-полей верни "not_defined";
           - для текстовых user-facing полей верни "Данные не определены"
             (или "Не установлено" для *_display полей).
        4. Запрещены значения: null, None, пустые строки — их не используй никогда.
           Допустимые fallback-значения: "not_defined", "Данные не определены",
           "Не установлено".
        5. Если параметр определяется по тарифам, заявке, приложению, спецификации,
           реестру, прайс-листу или иному названному документу — это НЕ отсутствие
           регулирования. Верни именно эту отсылку, например:
           "Согласно Тарифам фактора (Приложение №1)",
           "Определяется в Заявке клиента",
           "Согласно графику платежей".
        6. Если размер финансирования или вознаграждение фактора указаны в
           процентах — верни процент и базу (например, "90% от суммы требования",
           "2% годовых от суммы финансирования").
        7. В evidence включай только дословные цитаты из текста договора.
        8. Верни РОВНО один JSON-объект со всеми 11 ключами без какого-либо
           дополнительного текста до или после. Начни ответ сразу с открывающей
           фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки,
           код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга
           через json.loads без предварительной обработки.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — параметры раскрыты в договоре:
        Фрагмент:
        "Клиент уступает Фактору денежное требование к ООО «Покупатель»
        по договору поставки № 45 от 01.03.2024. Фактор выплачивает Клиенту
        финансирование в размере 90% от суммы требования. Комиссия Фактора —
        2% годовых. Факторинг без регресса. Должник уведомляется Клиентом
        при уступке каждого требования."
        Ответ:
        {
          "claim_type": "existing",
          "claim_type_display": "Существующее",
          "assigned_claim_basis": "договор поставки № 45 от 01.03.2024",
          "financing_amount_status": "defined",
          "financing_amount_value": "90% от суммы требования",
          "factor_fee_status": "defined",
          "factor_fee_value": "2% годовых",
          "factoring_type": "non_recourse",
          "factoring_type_display": "Без регресса",
          "debtor_notification_status": "defined",
          "debtor_notification_value": "Должник уведомляется Клиентом при уступке каждого требования",
          "evidence": [
            {
              "clause_ref": "п. 1.1",
              "quote": "Клиент уступает Фактору денежное требование к ООО «Покупатель» по договору поставки № 45 от 01.03.2024."
            }
          ]
        }

        Пример 2 — данных в договоре нет:
        Фрагмент:
        "Фактор предоставляет финансирование Клиенту."
        Ответ:
        {
          "claim_type": "not_defined",
          "claim_type_display": "Не установлено",
          "assigned_claim_basis": "Данные не определены",
          "financing_amount_status": "not_defined",
          "financing_amount_value": "Данные не определены",
          "factor_fee_status": "not_defined",
          "factor_fee_value": "Данные не определены",
          "factoring_type": "not_defined",
          "factoring_type_display": "Не установлено",
          "debtor_notification_status": "not_defined",
          "debtor_notification_value": "Данные не определены",
          "evidence": []
        }

        Пример 3 — параметр определяется через приложение (валидный исход,
        не "не установлено"):
        Фрагмент:
        "Размер финансирования и комиссия Фактора определяются в соответствии
        с Тарифами фактора (Приложение №1) и Заявкой клиента."
        Ответ:
        {
          "claim_type": "future",
          "claim_type_display": "Будущее",
          "assigned_claim_basis": "Данные не определены",
          "financing_amount_status": "defined",
          "financing_amount_value": "Согласно Тарифам фактора (Приложение №1)",
          "factor_fee_status": "defined",
          "factor_fee_value": "Согласно Тарифам фактора (Приложение №1) и Заявке клиента",
          "factoring_type": "not_defined",
          "factoring_type_display": "Не установлено",
          "debtor_notification_status": "not_defined",
          "debtor_notification_value": "Данные не определены",
          "evidence": [
            {
              "clause_ref": "п. 2.1",
              "quote": "Размер финансирования и комиссия Фактора определяются в соответствии с Тарифами фактора (Приложение №1) и Заявкой клиента."
            }
          ]
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о типе требования.
        2. Найди прямую цитату об основании требования.
        3. Найди прямую цитату о размере финансирования.
        4. Найди прямую цитату о вознаграждении фактора.
        5. Найди прямую цитату о виде факторинга (регресс / без регресса).
        6. Найди прямую цитату о порядке уведомления должника.
        7. Согласуй raw enum и display:
           claim_type -> claim_type_display:
             "existing" -> "Существующее";
             "future" -> "Будущее";
             "mixed" -> "Смешанное";
             "not_defined" -> "Не установлено".
           factoring_type -> factoring_type_display:
             "recourse" -> "С регрессом";
             "non_recourse" -> "Без регресса";
             "not_defined" -> "Не установлено".
        8. Если прямой цитаты нет — верни "not_defined" для status-полей
           и "Данные не определены" / "Не установлено" для текстовых полей.
        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь РОВНО одним JSON-объектом без какого-либо дополнительного текста
        до или после, со всеми 11 ключами:
        {
          "claim_type": "<existing / future / mixed / not_defined>",
          "claim_type_display": "<Существующее / Будущее / Смешанное / Не установлено>",
          "assigned_claim_basis": "<текст или 'Данные не определены'>",
          "financing_amount_status": "<defined / not_defined>",
          "financing_amount_value": "<текст или 'Данные не определены'>",
          "factor_fee_status": "<defined / not_defined>",
          "factor_fee_value": "<текст или 'Данные не определены'>",
          "factoring_type": "<recourse / non_recourse / not_defined>",
          "factoring_type_display": "<С регрессом / Без регресса / Не установлено>",
          "debtor_notification_status": "<defined / not_defined>",
          "debtor_notification_value": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 8
      temperature: 0.0
      max_tokens: 900

    retrieval:
      retrieval_profile: "assignment_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "факторинг тип уступаемого требования существующее будущее смешанное основание требования договор поставки размер финансирования сумма вознаграждение фактора комиссия тариф ставка вид факторинга регресс без регресса порядок уведомления должника"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - definitions
        - obligations
      negative_keywords:
        - "зачет"
        - "возражения должника"
        - "банкротство"
        - "конфиденциальность"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.0, 0.40]
        boost: 0.20
        scope: segment
      context_k: 8
      max_chunks: 12
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "definitions"
        - "obligations"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.12

    evidence:
      required: true
      min_snippet_length: 50
      max_snippet_length: 700

    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false
      llm_max_tokens: 1500

      presence_signal:
        field: "factoring_subject_extraction_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора факторинга базовую
        структуру сделки: тип требования, основание, финансирование,
        вознаграждение, вид факторинга и порядок уведомления должника.
        Не анализируй зачёт, возражения должника или банкротство.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. factoring_subject_extraction_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (claim_type, financing_amount_status, factor_fee_status,
              factoring_type, debtor_notification_status) ≠ "not_defined";
           - "missing" — если все пять содержательных полей = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - claim_type = "not_defined";
           - financing_amount_status = "not_defined";
           - factor_fee_status = "not_defined";
           - factoring_type = "not_defined";
           - debtor_notification_status = "not_defined";
           - assigned_claim_basis, financing_amount_value, factor_fee_value,
             debtor_notification_value = "Данные не определены";
           - claim_type_display, factoring_type_display = "Не установлено";
           - не выполняй остальные шаги.

        1.  claim_type — existing / future / mixed / not_defined.
        2.  claim_type_display — "Существующее" / "Будущее" / "Смешанное" /
            "Не установлено" (должно соответствовать claim_type).
        3.  assigned_claim_basis — основание требования
            или "Данные не определены".
        4.  financing_amount_status — "defined" или "not_defined".
        5.  financing_amount_value — размер финансирования
            или "Данные не определены".
        6.  factor_fee_status — "defined" или "not_defined".
        7.  factor_fee_value — вознаграждение фактора
            или "Данные не определены".
        8.  factoring_type — recourse / non_recourse / not_defined.
        9.  factoring_type_display — "С регрессом" / "Без регресса" /
            "Не установлено" (должно соответствовать factoring_type).
        10. debtor_notification_status — "defined" или "not_defined".
        11. debtor_notification_value — порядок уведомления должника
            или "Данные не определены".
        12. evidence — массив точных цитат из договора.
        </task>

        <context_rules>
        - Перед остальными полями заполни factoring_subject_extraction_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined", все *_value = "Данные не определены", все *_display = "Не установлено".
        - Используй только текст договора.
        - Не выводи параметры из закона — только из текста договора.
        - Если параметр определяется по тарифам, заявке, приложению, спецификации, реестру, прайс-листу — это НЕ отсутствие регулирования. Верни именно эту отсылку.
        - Для debtor_notification_value опиши суть порядка: кто уведомляет (Клиент / Фактор), когда (при уступке / после уступки) и как (письменно / по форме приложения).
        - Не смешивай уведомление должника с односторонним отказом от договора.
        - Если фрагменты конфликтуют и не позволяют сделать надёжный вывод, верни "Не удалось определить" для затронутого видимого поля и включи конфликтующие цитаты в evidence.
        - Запрещены значения null, None и пустые строки.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет описания структуры факторинга (тип требования, финансирование, вид факторинга).
           → presence = "missing";
             все *_status = "not_defined";
             все *_value = "Данные не определены";
             все *_display = "Не установлено".

        2. Неполное раскрытие темы.
           Указан только вид факторинга, но не указаны размер финансирования и вознаграждение.
           → presence = "present";
             factoring_type = соответствующее значение;
             остальные *_status = "not_defined";
             соответствующие *_value = "Данные не определены".

        3. Противоречие между фрагментами.
           В разных пунктах договора указаны разные суммы финансирования или разные виды факторинга.
           → presence = "unclear";
             соответствующий *_status = "not_defined";
             соответствующий *_value = "Не удалось определить".

        4. Отсылка на внешний документ.
           Размер финансирования и вознаграждение определяются Тарифами фактора (Приложение №1) и Заявкой клиента.
           → presence = "present";
             financing_amount_status = "defined";
             factor_fee_status = "defined";
             financing_amount_value = "Согласно Тарифам фактора (Приложение №1)";
             factor_fee_value = "Согласно Тарифам фактора (Приложение №1) и Заявке клиента".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для factoring_subject_extraction_presence используй только: "present", "missing", "unclear".
        - Для статусных enum-полей используй только допустимые значения из списка.
        - Fallback при отсутствии данных:
          * assigned_claim_basis, financing_amount_value, factor_fee_value, debtor_notification_value → "Данные не определены";
          * claim_type_display, factoring_type_display → "Не установлено".
        - Fallback при противоречии или неоднозначности:
          * все *_value / *_display → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "factoring_subject_extraction_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования по базовой структуре факторинга. Внутреннее агрегатное signal-поле."
          required: true

        - name: "claim_type"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["existing", "future", "mixed", "not_defined"]
          description: "Тип уступаемого требования (raw enum). Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "claim_type_display"
          type: "string"
          presentation: "fact"
          label: "Тип уступаемого требования"
          description: >
            User-facing тип требования: Существующее / Будущее / Смешанное / Не установлено. Fallback: "Не установлено" / "Не удалось определить".
          required: true
          display_in_grid: true
          display_priority: 1

        - name: "assigned_claim_basis"
          type: "string"
          presentation: "fact"
          label: "Основание требования"
          description: >
            Основание возникновения уступаемого требования. Fallback: "Не установлено" / "Не удалось определить".
          required: true
          display_in_grid: true
          display_priority: 2

        - name: "financing_amount_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус определения размера финансирования. Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "financing_amount_value"
          type: "string"
          presentation: "fact"
          label: "Размер финансирования"
          description: >
            Размер финансирования клиента фактором. Fallback: "Не установлено" / "Не удалось определить".
          required: true
          display_in_grid: true
          display_priority: 3

        - name: "factor_fee_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус определения вознаграждения фактора. Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "factor_fee_value"
          type: "string"
          presentation: "fact"
          label: "Вознаграждение фактора"
          description: >
            Размер и структура вознаграждения фактора. Fallback: "Не установлено" / "Не удалось определить".
          required: true
          display_in_grid: true
          display_priority: 4

        - name: "factoring_type"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["recourse", "non_recourse", "not_defined"]
          description: "Вид факторинга по регрессности (raw enum). Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "factoring_type_display"
          type: "string"
          presentation: "fact"
          label: "Вид факторинга"
          description: >
            User-facing вид факторинга: С регрессом / Без регресса / Не установлено. Fallback: "Не установлено" / "Не удалось определить".
          required: true
          display_in_grid: true
          display_priority: 5

        - name: "debtor_notification_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          description: "Статус наличия порядка уведомления должника. Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "debtor_notification_value"
          type: "string"
          presentation: "fact"
          label: "Уведомление должника"
          description: >
            Суть порядка уведомления должника (кто, когда, как). Fallback: "Не установлено" / "Не удалось определить".
          required: true
          display_in_grid: true
          display_priority: 6

        - name: "evidence"
          type: "array"
          presentation: "diagnostic"
          description: "Точные цитаты из договора, подтверждающие извлечённые значения."
          required: true
          display_in_grid: false

      store_payload: true

  - id: assigned_claim_identification_check
    name: "Идентификация уступаемого денежного требования (ст. 826 ГК РФ)"
    description: >
      Фактографическая проверка достаточной определимости уступаемого требования:
      должник, сумма, основание, реестр или приложение с требованиями.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "денежное требование"
        - "дебиторская задолженность"
        - "должник"
        - "основание требования"
        - "договор поставки"
        - "реестр уступленных требований"
        - "сумма требования"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)(денежн(ое|ого)\\s+требован|дебиторск(ая|ой)\\s+задолженн)"
        - "(?i)(должник|дебитор)"
        - "(?i)реестр\\s+уступленн(ых|ые)\\s+требован"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор факторинга по Главе 43 ГК РФ.
        Проверяется только один вопрос: достаточная определимость
        уступаемого денежного требования.
        Нормативный ориентир:
        - ст. 826 ГК РФ — денежное требование
        Важно:
        - Твоя задача — не оценивать серьёзность риска.
        - Только установить, что прямо есть в тексте договора, а чего прямо нет.
        - Требование может индивидуализироваться не только прямым указанием
          в теле договора, но и через реестр / акт уступки / заявку /
          приложение. Это валидный способ индивидуализации по ст. 826 ГК РФ.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Идентифицирован ли должник по уступаемому требованию.
        2. Идентифицирована ли сумма требования.
        3. Указано ли основание требования (договор, счёт, накладная).
        4. Есть ли реестр или приложение с перечнем требований.
        5. Составь краткую user-facing сводку по параметрам идентификации
           для отображения юристу в DD Grid.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Если данные не указаны прямо:
           - для status-полей верни "not_defined";
           - для yes/no полей верни "no";
           - для текстовых user-facing полей верни "Данные не определены"
             (или "Не установлена" для claim_identification_status_display).
        4. Запрещены значения: null, None, пустые строки — их не используй никогда.
           Допустимые fallback-значения: "not_defined", "no",
           "Данные не определены", "Не установлена".
        5. Если требование индивидуализируется через реестр / акт / заявку /
           приложение — это НЕ отсутствие идентификации. Отражай это как
           registry_or_schedule_present = "yes" и указывай в summary
           конкретный документ (например, "Приложение № 1 — Реестр
           уступленных требований").
        6. claim_identification_summary — короткая сводка одной строкой,
           перечисляющая: должник, сумму, основание, реестр. Не дублируй
           raw enum-значения; используй человекочитаемые формулировки.
           Пример: "Должник: ООО «Покупатель»; Сумма: 5 000 000 руб.;
           Основание: договор поставки № 45 от 01.03.2024;
           Реестр: Приложение № 1".
        7. В evidence включай только дословные цитаты из текста договора.
        8. Верни РОВНО один JSON-объект со всеми 7 ключами без какого-либо
           дополнительного текста до или после. Начни ответ сразу с открывающей
           фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки,
           код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга
           через json.loads без предварительной обработки.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — требование индивидуализировано прямо в договоре:
        Фрагмент:
        "Клиент уступает Фактору требование к ООО «Покупатель» (ИНН 7700000003)
        по договору поставки № 45 от 01.03.2024 на сумму 5 000 000 рублей.
        Перечень требований — Приложение № 1 (Реестр уступленных требований)."
        Ответ:
        {
          "claim_identification_status": "clear",
          "claim_identification_status_display": "Полная",
          "claim_identification_summary": "Должник: ООО «Покупатель»; Сумма: 5 000 000 руб.; Основание: договор поставки № 45 от 01.03.2024; Реестр: Приложение № 1 (Реестр уступленных требований)",
          "debtor_identified": "yes",
          "claim_amount_identified": "yes",
          "underlying_contract_identified": "yes",
          "registry_or_schedule_present": "yes",
          "evidence": [
            {
              "clause_ref": "п. 1.1",
              "quote": "Клиент уступает Фактору требование к ООО «Покупатель» (ИНН 7700000003) по договору поставки № 45 от 01.03.2024 на сумму 5 000 000 рублей."
            }
          ]
        }

        Пример 2 — данных в договоре нет:
        Фрагмент:
        "Клиент уступает Фактору дебиторскую задолженность."
        Ответ:
        {
          "claim_identification_status": "partial",
          "claim_identification_status_display": "Частичная",
          "claim_identification_summary": "Должник: Данные не определены; Сумма: Данные не определены; Основание: Данные не определены; Реестр: не указан",
          "debtor_identified": "no",
          "claim_amount_identified": "no",
          "underlying_contract_identified": "no",
          "registry_or_schedule_present": "not_defined",
          "evidence": [
            {
              "clause_ref": "п. 1.1",
              "quote": "Клиент уступает Фактору дебиторскую задолженность."
            }
          ]
        }

        Пример 3 — требование индивидуализируется только через реестр
        (валидный способ по ст. 826 ГК РФ, не "not_defined"):
        Фрагмент:
        "Клиент уступает Фактору денежные требования, возникающие из договоров
        поставки, заключаемых Клиентом с должниками. Перечень уступаемых
        требований определяется в Реестре уступленных требований (Приложение № 2),
        оформляемом Сторонами по форме Приложения № 3."
        Ответ:
        {
          "claim_identification_status": "clear",
          "claim_identification_status_display": "Полная",
          "claim_identification_summary": "Должник: определяется в Реестре уступленных требований (Приложение № 2); Сумма: определяется в Реестре; Основание: договоры поставки, заключаемые Клиентом с должниками; Реестр: Приложение № 2 (форма — Приложение № 3)",
          "debtor_identified": "yes",
          "claim_amount_identified": "yes",
          "underlying_contract_identified": "yes",
          "registry_or_schedule_present": "yes",
          "evidence": [
            {
              "clause_ref": "п. 1.1",
              "quote": "Перечень уступаемых требований определяется в Реестре уступленных требований (Приложение № 2), оформляемом Сторонами по форме Приложения № 3."
            }
          ]
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату с должником.
        2. Найди прямую цитату с суммой.
        3. Найди прямую цитату с основанием.
        4. Найди прямую цитату о реестре/приложении.
        5. Проверь: если требование индивидуализируется через реестр/акт/заявку —
           это всё равно "yes" по соответствующим полям, а не "no".
        6. Согласуй raw enum и display:
           claim_identification_status -> claim_identification_status_display:
             "clear" -> "Полная";
             "partial" -> "Частичная";
             "not_defined" -> "Не установлена".
        7. Если прямой цитаты нет — верни "not_defined" для status-полей
           и "no" для yes/no полей.
        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь РОВНО одним JSON-объектом без какого-либо дополнительного текста
        до или после, со всеми 8 ключами:
        {
          "claim_identification_status": "<clear / partial / not_defined>",
          "claim_identification_status_display": "<Полная / Частичная / Не установлена>",
          "claim_identification_summary": "<сводка или 'Данные не определены'>",
          "debtor_identified": "<yes / no>",
          "claim_amount_identified": "<yes / no>",
          "underlying_contract_identified": "<yes / no>",
          "registry_or_schedule_present": "<yes / no / not_defined>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 8
      temperature: 0.0
      max_tokens: 700

    retrieval:
      retrieval_profile: "assignment_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "уступаемое денежное требование должник дебитор сумма требования основание требования договор поставки счет накладная реестр уступленных требований акт уступки заявка приложение перечень требований индивидуализация требования"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - definitions
        - obligations
      negative_keywords:
        - "регресс"
        - "уведомление должника"
        - "комиссия"
        - "банкротство"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.0, 0.40]
        boost: 0.20
        scope: segment
      context_k: 8
      max_chunks: 10
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "definitions"
        - "obligations"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.12

    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 600

    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false
      llm_max_tokens: 1000

      presence_signal:
        field: "assigned_claim_identification_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора факторинга сведения
        об идентификации уступаемого требования: должник, сумма, основание,
        реестр/приложение. Отдельно составь user-facing сводку.
        Не анализируй финансирование, регресс или уведомление должника.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. assigned_claim_identification_check_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если claim_identification_status ∈ {clear, partial};
           - "missing" — если claim_identification_status = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - claim_identification_status = "not_defined";
           - debtor_identified = "no";
           - claim_amount_identified = "no";
           - underlying_contract_identified = "no";
           - registry_or_schedule_present = "not_defined";
           - claim_identification_status_display = "Не установлена";
           - claim_identification_summary = "Данные не определены";
           - не выполняй остальные шаги.

        1.  claim_identification_status — clear / partial / not_defined.
        2.  claim_identification_status_display — "Полная" / "Частичная" /
            "Не установлена" (должно соответствовать
            claim_identification_status).
        3.  claim_identification_summary — краткая сводка одной строкой:
            должник; сумма; основание; реестр.
        4.  debtor_identified — yes / no.
        5.  claim_amount_identified — yes / no.
        6.  underlying_contract_identified — yes / no.
        7.  registry_or_schedule_present — yes / no / not_defined.
        8.  evidence — массив цитат с clause_ref и quote.
        </task>

        <context_rules>
        - Перед остальными полями заполни assigned_claim_identification_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — claim_identification_status = "not_defined", все yes/no поля = "no", claim_identification_summary = "Данные не определены".
        - Используй только текст договора.
        - Не подставляй нормы закона вместо текста договора.
        - Если требование индивидуализируется через реестр / акт / заявку / приложение — это валидный способ (ст. 826 ГК РФ). В этом случае соответствующие поля устанавливай в "yes", а в summary укажи конкретный документ.
        - Не смешивай идентификацию требования с уведомлением должника или регрессом.
        - Если фрагменты конфликтуют и не позволяют сделать надёжный вывод, верни "Не удалось определить" для затронутого видимого поля и включи конфликтующие цитаты в evidence.
        - Запрещены значения null, None и пустые строки.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет идентификации уступаемого требования.
           → presence = "missing";
             claim_identification_status = "not_defined";
             все yes/no поля = "no";
             claim_identification_summary = "Данные не определены".

        2. Частичная идентификация.
           Указан только должник или только сумма, без основания и реестра.
           → presence = "present";
             claim_identification_status = "partial";
             соответствующие поля = "yes", остальные = "no";
             claim_identification_summary = "Частичная идентификация: указан только должник/сумма".

        3. Противоречие между фрагментами.
           В разных пунктах договора указаны разные должники или суммы требования.
           → presence = "unclear";
             claim_identification_status = "partial";
             соответствующие поля = "no";
             claim_identification_summary = "Не удалось определить".

        4. Индивидуализация через реестр/приложение.
           Требование индивидуализируется через Реестр уступленных требований (Приложение № 1).
           → presence = "present";
             claim_identification_status = "clear";
             все yes/no поля = "yes";
             registry_or_schedule_present = "yes";
             claim_identification_summary = "Должник/Сумма/Основание: определяются в Реестре уступленных требований (Приложение № 1)".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для assigned_claim_identification_check_presence используй только: "present", "missing", "unclear".
        - Для статусных enum-полей используй только допустимые значения из списка.
        - Fallback при отсутствии данных:
          * claim_identification_summary → "Данные не определены";
          * claim_identification_status_display → "Не установлена".
        - Fallback при противоречии или неоднозначности:
          * claim_identification_summary → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "assigned_claim_identification_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие идентификации уступаемого требования. Внутреннее агрегатное signal-поле."
          required: true

        - name: "claim_identification_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["clear", "partial", "not_defined"]
          description: "Статус идентификации уступаемого требования (raw enum). Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "claim_identification_status_display"
          type: "string"
          presentation: "fact"
          label: "Идентификация требования"
          description: >
            User-facing статус: Полная / Частичная / Не установлена. Fallback: "Не установлено" / "Не удалось определить".
          required: true
          display_in_grid: true
          display_priority: 1

        - name: "claim_identification_summary"
          type: "string"
          presentation: "fact"
          label: "Параметры идентификации"
          description: >
            Сводка: должник; сумма; основание; реестр. Fallback: "Не установлено" / "Не удалось определить".
          required: true
          display_in_grid: true
          display_priority: 2

        - name: "debtor_identified"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["yes", "no"]
          description: "Идентифицирован ли должник. Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "claim_amount_identified"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["yes", "no"]
          description: "Идентифицирована ли сумма требования. Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "underlying_contract_identified"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["yes", "no"]
          description: "Указано ли основание требования. Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "registry_or_schedule_present"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Наличие реестра или приложения с требованиями. Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "evidence"
          type: "array"
          presentation: "diagnostic"
          description: "Точные цитаты из договора, подтверждающие извлечённые значения."
          required: true
          display_in_grid: false

      store_payload: true

  - id: financing_and_fee_structure_check
    name: "Финансирование и структура вознаграждения фактора (ст. 824 ГК РФ)"
    description: >
      Фактографическая проверка размера финансирования, сроков выплаты
      и прозрачности комиссий/дисконта фактора.
      Возврат клиенту излишка, полученного от должника, проверяется
      в отдельном check-е excess_collection_return.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "сумма финансирования"
        - "размер финансирования"
        - "факторинговая комиссия"
        - "вознаграждение"
        - "дисконт"
        - "дополнительные платежи"
        - "по тарифам"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)(сумма|размер)\\s+финансирован"
        - "(?i)факторингов(ая|ого)\\s+комисси"
        - "(?i)дисконт|вознаграждени"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор факторинга по Главе 43 ГК РФ.
        Проверяется только один вопрос: условия финансирования и вознаграждения фактора.
        Нормативный ориентир:
        - ст. 824 ГК РФ — финансирование и вознаграждение
        Важно:
        - Твоя задача — не оценивать серьёзность риска в целом.
        - Только установить, что прямо есть в тексте договора, а чего прямо нет.
        - Отсылка к фиксированным тарифам фактора (Приложение № X) — это
          нормальная практика, а не признак непрозрачности. Признак
          непрозрачности — открытые тарифы, одностороннее изменение
          фактором, «иные платежи по усмотрению фактора».
        - Возврат клиенту излишка, полученного от должника, проверяется
          в отдельном check-е excess_collection_return. Здесь его
          не анализируй.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Степень раскрытия условий финансирования (сумма/процент,
           сроки выплаты, порядок расчёта).
        2. Степень прозрачности вознаграждения фактора (комиссия / дисконт /
           тарифы — раскрыты ли полностью, есть ли открытые платежи).

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Если данные не указаны прямо:
           - для status-полей верни "not_defined";
           - для текстовых display-полей верни "Не установлено"
             (или "Не установлена" по роду).
        4. Запрещены значения: null, None, пустые строки — не используй их
           никогда. Допустимые fallback-значения: "not_defined",
           "Не установлено", "Не установлена".
        5. Различай:
           - ФИКСИРОВАННЫЕ ТАРИФЫ (Приложение № X, отдельный документ с
             постоянными ставками) — это раскрытое условие;
           - ОТКРЫТЫЕ ТАРИФЫ, «по усмотрению фактора», одностороннее
             изменение комиссий — это признак непрозрачности.
        6. Различай комиссию и дисконт. Дисконт — это удержание из суммы
           требования при выплате финансирования; комиссия — отдельное
           вознаграждение фактора. Учитывай оба механизма.
        7. open_ended_fees_risk:
           "high" — есть открытые тарифы, одностороннее изменение комиссий
             фактором, «иные платежи по усмотрению фактора»;
           "medium" — часть комиссий раскрыта прямо, часть — по отсылке;
           "low" — все комиссии и платежи раскрыты прямо или фиксированы
             в приложении к договору.
        8. В evidence включай только дословные цитаты из текста договора.
        9. Верни РОВНО один JSON-объект со всеми 6 ключами без какого-либо
           дополнительного текста до или после. Начни ответ сразу с
           открывающей фигурной скобки и закончи закрывающей. НЕ пиши
           Markdown, списки, код-фенсы. Ответ должен быть валидным JSON,
           пригодным для парсинга через json.loads без предварительной
           обработки.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — все условия раскрыты прямо:
        Фрагмент:
        "Фактор выплачивает Клиенту 85% от суммы требования в течение 3 рабочих
        дней с даты получения подтверждающих документов. Комиссия Фактора —
        1,5% от суммы требования. Иных платежей не взимается."
        Ответ:
        {
          "financing_terms_status": "clear",
          "financing_terms_display": "Прозрачное",
          "fee_structure_status": "transparent",
          "fee_structure_display": "Прозрачная",
          "open_ended_fees_risk": "low",
          "evidence": [
            {
              "clause_ref": "п. 3.1",
              "quote": "Фактор выплачивает Клиенту 85% от суммы требования в течение 3 рабочих дней с даты получения подтверждающих документов. Комиссия Фактора — 1,5% от суммы требования."
            }
          ]
        }

        Пример 2 — отсылка к фиксированным тарифам (нормальная практика):
        Фрагмент:
        "Размер финансирования и вознаграждение Фактора определяются в
        соответствии с Тарифами Фактора (Приложение № 1), являющимися
        неотъемлемой частью настоящего Договора."
        Ответ:
        {
          "financing_terms_status": "clear",
          "financing_terms_display": "Прозрачное",
          "fee_structure_status": "transparent",
          "fee_structure_display": "Прозрачная",
          "open_ended_fees_risk": "low",
          "evidence": [
            {
              "clause_ref": "п. 3.1",
              "quote": "Размер финансирования и вознаграждение Фактора определяются в соответствии с Тарифами Фактора (Приложение № 1), являющимися неотъемлемой частью настоящего Договора."
            }
          ]
        }

        Пример 3 — текст есть, но надёжный вывод сделать нельзя
        (открытые тарифы и «иные платежи по усмотрению» — реальный риск):
        Фрагмент:
        "Финансирование выплачивается Фактором на условиях, определяемых
        Фактором в одностороннем порядке. Фактор вправе взимать иные платежи
        по своему усмотрению."
        Ответ:
        {
          "financing_terms_status": "partial",
          "financing_terms_display": "Частичное",
          "fee_structure_status": "vague",
          "fee_structure_display": "Неопределённая",
          "open_ended_fees_risk": "high",
          "evidence": [
            {
              "clause_ref": "п. 3.1",
              "quote": "Финансирование выплачивается Фактором на условиях, определяемых Фактором в одностороннем порядке. Фактор вправе взимать иные платежи по своему усмотрению."
            }
          ]
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о размере и сроках финансирования.
        2. Найди прямую цитату о комиссиях / дисконте / тарифах.
        3. Найди прямую цитату об открытых тарифах или дополнительных
           платежах.
        4. Различай фиксированные тарифы (Приложение № X) и открытые тарифы
           с односторонним изменением.
        5. Согласуй raw enum и display:
           financing_terms_status -> financing_terms_display:
             "clear" -> "Прозрачное";
             "partial" -> "Частичное";
             "not_defined" -> "Не установлено".
           fee_structure_status -> fee_structure_display:
             "transparent" -> "Прозрачная";
             "vague" -> "Неопределённая";
             "not_defined" -> "Не установлена".
        6. Если прямой цитаты нет — верни "not_defined" для status-полей
           и "Не установлено" / "Не установлена" для display-полей.
        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь РОВНО одним JSON-объектом без какого-либо дополнительного
        текста до или после, со всеми 6 ключами:
        {
          "financing_terms_status": "<clear / partial / not_defined>",
          "financing_terms_display": "<Прозрачное / Частичное / Не установлено>",
          "fee_structure_status": "<transparent / vague / not_defined>",
          "fee_structure_display": "<Прозрачная / Неопределённая / Не установлена>",
          "open_ended_fees_risk": "<high / medium / low / not_defined>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 8
      temperature: 0.0
      max_tokens: 700

    retrieval:
      retrieval_profile: "payment_terms_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "сумма финансирования размер финансирования сроки выплаты порядок расчёта факторинговая комиссия вознаграждение дисконт тарифы дополнительные платежи открытые тарифы"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - procedures
      negative_keywords:
        - "регресс"
        - "уведомление должника"
        - "зачет"
        - "банкротство"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.15, 0.55]
        boost: 0.18
        scope: segment
      context_k: 8
      max_chunks: 10
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "obligations"
        - "procedures"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.12

    evidence:
      required: true
      min_snippet_length: 45
      max_snippet_length: 650

    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false
      llm_max_tokens: 900

      presence_signal:
        field: "financing_and_fee_structure_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора факторинга
        оценку раскрытия финансовых условий: понятность финансирования,
        прозрачность структуры вознаграждения, наличие открытых комиссий.
        Не анализируй регресс, уведомление должника или банкротство.
        Возврат клиенту излишка проверяется в отдельном check-е
        excess_collection_return — здесь его не извлекай.
        Различай фиксированные тарифы (нормальная практика) и открытые
        тарифы с односторонним изменением (признак непрозрачности).
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. financing_and_fee_structure_check_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (financing_terms_status, fee_structure_status) ≠ "not_defined";
           - "missing" — если оба содержательных поля = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - financing_terms_status = "not_defined";
           - fee_structure_status = "not_defined";
           - open_ended_fees_risk = "not_defined";
           - financing_terms_display = "Не установлено";
           - fee_structure_display = "Не установлена";
           - не выполняй остальные шаги.

        1.  financing_terms_status — clear / partial / not_defined.
        2.  financing_terms_display — "Прозрачное" / "Частичное" /
            "Не установлено" (должно соответствовать
            financing_terms_status).
        3.  fee_structure_status — transparent / vague / not_defined.
        4.  fee_structure_display — "Прозрачная" / "Неопределённая" /
            "Не установлена" (должно соответствовать
            fee_structure_status).
        5.  open_ended_fees_risk — high / medium / low / not_defined.
        6.  evidence — массив цитат с clause_ref и quote.
        </task>

        <context_rules>
        - Перед остальными полями заполни financing_and_fee_structure_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined", open_ended_fees_risk = "not_defined", все *_display = "Не установлено" / "Не установлена".
        - Используй только текст договора.
        - Не подставляй нормы закона вместо текста договора.
        - Различай фиксированные тарифы (Приложение № X) и открытые тарифы с односторонним изменением.
        - Не смешивай финансирование и вознаграждение с регрессом или уведомлением должника.
        - Если фрагменты конфликтуют и не позволяют сделать надёжный вывод, верни "Не удалось определить" для затронутого видимого поля и включи конфликтующие цитаты в evidence.
        - Запрещены значения null, None и пустые строки.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет условий финансирования или вознаграждения фактора.
           → presence = "missing";
             financing_terms_status = fee_structure_status = "not_defined";
             open_ended_fees_risk = "not_defined";
             все *_display = "Не установлено" / "Не установлена".

        2. Частичное раскрытие.
           Указан размер финансирования, но не указаны сроки выплаты или порядок расчёта.
           → presence = "present";
             financing_terms_status = "partial";
             соответствующие *_display = "Частичное";
             открытые комиссии не указаны → open_ended_fees_risk = "medium".

        3. Противоречие между фрагментами.
           В разных пунктах договора указаны разные проценты финансирования или разные сроки.
           → presence = "unclear";
             соответствующие *_status = "partial" или "not_defined";
             соответствующие *_display = "Не удалось определить".

        4. Открытые тарифы / одностороннее изменение.
           Фактор вправе изменять комиссии в одностороннем порядке или взимать «иные платежи по усмотрению».
           → presence = "present";
             fee_structure_status = "vague";
             fee_structure_display = "Неопределённая";
             open_ended_fees_risk = "high".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для financing_and_fee_structure_check_presence используй только: "present", "missing", "unclear".
        - Для статусных enum-полей используй только допустимые значения из списка.
        - Fallback при отсутствии данных:
          * financing_terms_display → "Не установлено";
          * fee_structure_display → "Не установлена".
        - Fallback при противоречии или неоднозначности:
          * все *_display → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "financing_and_fee_structure_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования о финансировании и вознаграждении. Внутреннее агрегатное signal-поле."
          required: true

        - name: "financing_terms_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["clear", "partial", "not_defined"]
          description: "Понятность условий финансирования (raw enum). Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "financing_terms_display"
          type: "string"
          presentation: "fact"
          label: "Раскрытие условий финансирования"
          description: >
            User-facing: Прозрачное / Частичное / Не установлено. Fallback: "Не установлено" / "Не удалось определить".
          required: true
          display_in_grid: true
          display_priority: 1

        - name: "fee_structure_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["transparent", "vague", "not_defined"]
          description: "Прозрачность структуры вознаграждения фактора (raw enum). Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "fee_structure_display"
          type: "string"
          presentation: "fact"
          label: "Структура вознаграждения"
          description: >
            User-facing: Прозрачная / Неопределённая / Не установлена. Fallback: "Не установлено" / "Не удалось определить".
          required: true
          display_in_grid: true
          display_priority: 2

        - name: "open_ended_fees_risk"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["high", "medium", "low", "not_defined"]
          description: "Оценка риска скрытых/открытых комиссий (diagnostic). Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "evidence"
          type: "array"
          presentation: "diagnostic"
          description: "Точные цитаты из договора, подтверждающие извлечённые значения."
          required: true
          display_in_grid: false

      store_payload: true

  - id: recourse_allocation_check
    name: "Регресс / безрегрессность и распределение кредитного риска (ст. 831 ГК РФ)"
    description: >
      Фактографическая проверка условий регресса, распределения риска
      неплатежа должника и лимита ответственности клиента.
      Вид факторинга (регресс/безрегресс) извлекается в
      factoring_subject_extraction — здесь проверяется именно механика.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "с регрессом"
        - "без регресса"
        - "безрегрессный"
        - "регрессное требование"
        - "риск неплатежа"
        - "обязан возвратить финансирование"
        - "возместить финансирование"
        - "выкупить требование"
        - "лимит ответственности клиента"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)(с\\s+регрессом|без\\s+регресса|безрегрессн)"
        - "(?i)регрессн(ое|ого)\\s+требован"
        - "(?i)риск\\s+неплатежа"
        - "(?i)(возмест|выкуп|возврат).{0,40}(финансировани|требовани)"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор факторинга по Главе 43 ГК РФ.
        Проверяется только один вопрос: механика распределения кредитного
        риска должника и условия регресса.
        Нормативный ориентир:
        - ст. 831 ГК РФ — распределение сумм, регресс
        Важно:
        - Твоя задача — не оценивать серьёзность риска.
        - Только установить, что прямо есть в тексте договора, а чего прямо нет.
        - Регресс в российской практике часто формулируется НЕ буквально
          словом «регресс», а через обязанность Клиента «возместить
          финансирование», «выкупить требование», «вернуть сумму
          финансирования» при неплатеже должника. Такие формулировки —
          валидный признак регрессного режима.
        - Регресс «после истечения N дней с даты наступления срока платежа
          должника» — это конкретное и понятное условие, а не "vague".

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Условия регресса: триггер (неплатёж должника / истечение срока /
           иное), срок ожидания, механика (возместить / выкупить / вернуть).
        2. Наличие и размер лимита ответственности клиента (в сумме, в
           проценте, по формуле).
        3. Понятность распределения кредитного риска между фактором и
           клиентом.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Если данные не указаны прямо:
           - для status-полей верни "not_defined";
           - для display-полей верни "Не установлено" / "Не установлена"
             / "Не установлен" по роду.
        4. Запрещены значения: null, None, пустые строки — не используй их
           никогда. Допустимые fallback-значения: "not_defined",
           "Не установлено", "Не установлена", "Не установлен".
        5. recourse_trigger_conditions:
           "clear" — прямо указан триггер регресса, срок ожидания и механика
             (возместить / выкупить / вернуть финансирование);
           "vague" — есть только общая отсылка («в случаях, предусмотренных
             договором», «по внутренним правилам Фактора») без триггера и/или
             механики;
           "not_defined" — условия регресса в тексте отсутствуют.
        6. client_liability_cap:
           "present" — есть прямое указание лимита: конкретная сумма,
             процент, формула («не более суммы финансирования»,
             «не более 100% суммы требования»);
           "not_defined" — условие о лимите в тексте отсутствует.
        7. risk_allocation_clarity:
           "clear" — однозначно понятно, кто несёт риск неплатежа должника
             (Фактор при безрегрессном, Клиент при регрессном), и это
             согласовано с механикой регресса;
           "unclear" — распределение риска в тексте противоречиво или не
             согласовано (например, договор называет себя безрегрессным,
             но содержит регрессную обязанность);
           "not_defined" — распределение риска в тексте не выражено.
        8. Если договор называет себя безрегрессным, но содержит регрессную
           обязанность клиента (возместить / выкупить / вернуть
           финансирование) — это признак unclear, а не clear. Отражай это
           явно, не сглаживай.
        9. В evidence включай только дословные цитаты из текста договора.
        10. Верни РОВНО один JSON-объект со всеми 7 ключами без какого-либо
            дополнительного текста до или после. Начни ответ сразу с
            открывающей фигурной скобки и закончи закрывающей. НЕ пиши
            Markdown, списки, код-фенсы. Ответ должен быть валидным JSON,
            пригодным для парсинга через json.loads без предварительной
            обработки.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — безрегрессный факторинг, риск на факторе:
        Фрагмент:
        "Факторинг осуществляется без регресса. Риск неплатежа должника
        несёт Фактор. Фактор не вправе требовать от Клиента возврата
        финансирования при неплатеже должника."
        Ответ:
        {
          "recourse_trigger_conditions": "not_defined",
          "recourse_trigger_display": "Не установлены",
          "client_liability_cap": "not_defined",
          "client_liability_cap_display": "Не установлен",
          "risk_allocation_clarity": "clear",
          "risk_allocation_display": "Определено",
          "evidence": [
            {
              "clause_ref": "п. 4.1",
              "quote": "Факторинг осуществляется без регресса. Риск неплатежа должника несёт Фактор. Фактор не вправе требовать от Клиента возврата финансирования при неплатеже должника."
            }
          ]
        }

        Пример 2 — регрессный факторинг с понятными условиями:
        Фрагмент:
        "Факторинг осуществляется с правом регресса. Если должник не оплатил
        требование в течение 90 календарных дней с даты наступления срока
        платежа, Клиент обязан возместить Фактору сумму финансирования
        в течение 5 рабочих дней с даты получения требования Фактора.
        Общая сумма регрессных обязательств Клиента не может превышать
        сумму финансирования по соответствующему требованию."
        Ответ:
        {
          "recourse_trigger_conditions": "clear",
          "recourse_trigger_display": "Определены",
          "client_liability_cap": "present",
          "client_liability_cap_display": "Установлен",
          "risk_allocation_clarity": "clear",
          "risk_allocation_display": "Определено",
          "evidence": [
            {
              "clause_ref": "п. 4.1",
              "quote": "Если должник не оплатил требование в течение 90 календарных дней с даты наступления срока платежа, Клиент обязан возместить Фактору сумму финансирования."
            }
          ]
        }

        Пример 3 — текст есть, но надёжный вывод сделать нельзя
        (противоречие: договор безрегрессный, но содержит регрессную
        обязанность):
        Фрагмент:
        "Настоящий Договор является договором факторинга без регресса.
        В случае неисполнения должником обязательства Клиент обязан выкупить
        у Фактора соответствующее денежное требование в порядке,
        предусмотренном внутренними правилами Фактора."
        Ответ:
        {
          "recourse_trigger_conditions": "vague",
          "recourse_trigger_display": "Размыты",
          "client_liability_cap": "not_defined",
          "client_liability_cap_display": "Не установлен",
          "risk_allocation_clarity": "unclear",
          "risk_allocation_display": "Не определено",
          "evidence": [
            {
              "clause_ref": "п. 4.1",
              "quote": "В случае неисполнения должником обязательства Клиент обязан выкупить у Фактора соответствующее денежное требование в порядке, предусмотренном внутренними правилами Фактора."
            }
          ]
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату об условиях регресса.
        2. Найди прямую цитату о лимите ответственности.
        3. Проверь, нет ли противоречия между заявленным видом факторинга
           (без регресса / с регрессом) и фактическими регрессными
           обязанностями клиента.
        4. Проверь, не сформулирован ли регресс через синонимы: «возместить
           финансирование», «выкупить требование», «вернуть сумму
           финансирования».
        5. Согласуй raw enum и display:
           recourse_trigger_conditions -> recourse_trigger_display:
             "clear" -> "Определены";
             "vague" -> "Размыты";
             "not_defined" -> "Не установлены".
           client_liability_cap -> client_liability_cap_display:
             "present" -> "Установлен";
             "not_defined" -> "Не установлен".
           risk_allocation_clarity -> risk_allocation_display:
             "clear" -> "Определено";
             "unclear" -> "Не определено";
             "not_defined" -> "Не установлено".
        6. Если прямой цитаты нет — верни "not_defined" для status-полей
           и "Не установлено" / "Не установлена" / "Не установлен" для
           display-полей.
        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь РОВНО одним JSON-объектом без какого-либо дополнительного
        текста до или после, со всеми 7 ключами:
        {
          "recourse_trigger_conditions": "<clear / vague / not_defined>",
          "recourse_trigger_display": "<Определены / Размыты / Не установлены>",
          "client_liability_cap": "<present / not_defined>",
          "client_liability_cap_display": "<Установлен / Не установлен>",
          "risk_allocation_clarity": "<clear / unclear / not_defined>",
          "risk_allocation_display": "<Определено / Не определено / Не установлено>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 8
      temperature: 0.0
      max_tokens: 700

    retrieval:
      retrieval_profile: "liability_cap_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "регресс без регресса безрегрессный регрессное требование риск неплатежа должника обязан возвратить финансирование возместить финансирование выкупить требование вернуть сумму финансирования лимит ответственности клиента распределение кредитного риска"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - limitations
      negative_keywords:
        - "уведомление должника"
        - "комиссия"
        - "зачет"
        - "банкротство"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.25, 0.70]
        boost: 0.18
        scope: segment
      context_k: 8
      max_chunks: 10
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "obligations"
        - "limitations"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.12

    evidence:
      required: true
      min_snippet_length: 45
      max_snippet_length: 650

    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false
      llm_max_tokens: 1000

      presence_signal:
        field: "recourse_allocation_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора факторинга
        сведения о механике распределения кредитного риска: условия
        регресса, лимит ответственности клиента, понятность
        распределения риска.
        Не анализируй финансирование, уведомление должника или банкротство.
        Регресс может быть сформулирован не только словом «регресс»,
        но и через «возместить / выкупить / вернуть финансирование» —
        это валидный признак регрессного режима.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. recourse_allocation_check_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (recourse_trigger_conditions, risk_allocation_clarity) ≠ "not_defined";
           - "missing" — если оба содержательных поля = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - recourse_trigger_conditions = "not_defined";
           - client_liability_cap = "not_defined";
           - risk_allocation_clarity = "not_defined";
           - recourse_trigger_display = "Не установлены";
           - client_liability_cap_display = "Не установлен";
           - risk_allocation_display = "Не установлено";
           - не выполняй остальные шаги.

        1.  recourse_trigger_conditions — clear / vague / not_defined.
        2.  recourse_trigger_display — "Определены" / "Размыты" /
            "Не установлены" (должно соответствовать
            recourse_trigger_conditions).
        3.  client_liability_cap — present / not_defined.
        4.  client_liability_cap_display — "Установлен" / "Не установлен"
            (должно соответствовать client_liability_cap).
        5.  risk_allocation_clarity — clear / unclear / not_defined.
        6.  risk_allocation_display — "Определено" / "Не определено" /
            "Не установлено" (должно соответствовать
            risk_allocation_clarity).
        7.  evidence — массив цитат с clause_ref и quote.
        </task>

        <context_rules>
        - Перед остальными полями заполни recourse_allocation_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined", все *_display = "Не установлены" / "Не установлен" / "Не установлено".
        - Используй только текст договора.
        - Не выводи вид факторинга из нормы ст. 831 ГК РФ — только из текста договора.
        - Регресс может быть сформулирован через синонимы: «возместить финансирование», «выкупить требование», «вернуть сумму финансирования». Это валидный признак регрессного режима.
        - Если договор называет себя безрегрессным, но содержит регрессную обязанность клиента — это признак "unclear", а не "clear". Отражай это явно, не сглаживай.
        - Если фрагменты конфликтуют и не позволяют сделать надёжный вывод, верни "Не удалось определить" для затронутого видимого поля и включи конфликтующие цитаты в evidence.
        - Запрещены значения null, None и пустые строки.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет условий регресса или распределения кредитного риска.
           → presence = "missing";
             все *_status = "not_defined";
             все *_display = "Не установлены" / "Не установлен" / "Не установлено".

        2. Частичное раскрытие.
           Указан только вид факторинга (без регресса), но механика регресса не описана.
           → presence = "present";
             recourse_trigger_conditions = "not_defined";
             risk_allocation_clarity = "clear" (риск на факторе);
             соответствующие *_display = "Не установлены" / "Определено".

        3. Противоречие между фрагментами.
           Договор называет себя безрегрессным, но содержит регрессную обязанность клиента (возместить/выкупить/вернуть финансирование).
           → presence = "present";
             recourse_trigger_conditions = "vague";
             risk_allocation_clarity = "unclear";
             соответствующие *_display = "Размыты" / "Не определено".

        4. Регресс через синонимы.
           В договоре нет слова «регресс», но есть обязанность клиента «возместить финансирование» при неплатеже должника.
           → presence = "present";
             recourse_trigger_conditions = "clear";
             risk_allocation_clarity = "clear";
             соответствующие *_display = "Определены" / "Определено".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для recourse_allocation_check_presence используй только: "present", "missing", "unclear".
        - Для статусных enum-полей используй только допустимые значения из списка.
        - Fallback при отсутствии данных:
          * recourse_trigger_display → "Не установлены";
          * client_liability_cap_display → "Не установлен";
          * risk_allocation_display → "Не установлено".
        - Fallback при противоречии или неоднозначности:
          * все *_display → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "recourse_allocation_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования о регрессе и распределении кредитного риска. Внутреннее агрегатное signal-поле."
          required: true

        - name: "recourse_trigger_conditions"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["clear", "vague", "not_defined"]
          description: "Понятность условий регресса (raw enum). Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "recourse_trigger_display"
          type: "string"
          presentation: "fact"
          label: "Условия регресса"
          description: >
            User-facing: Определены / Размыты / Не установлены. Fallback: "Не установлено" / "Не удалось определить".
          required: true
          display_in_grid: true
          display_priority: 1

        - name: "client_liability_cap"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["present", "not_defined"]
          description: "Наличие лимита ответственности клиента (raw enum). Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "client_liability_cap_display"
          type: "string"
          presentation: "fact"
          label: "Лимит ответственности клиента"
          description: >
            User-facing: Установлен / Не установлен. Fallback: "Не установлено" / "Не удалось определить".
          required: true
          display_in_grid: true
          display_priority: 2

        - name: "risk_allocation_clarity"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["clear", "unclear", "not_defined"]
          description: "Понятность распределения кредитного риска (raw enum). Внутреннее enum-поле."

      store_payload: true
  - id: debtor_notification_check
    name: "Уведомление должника и порядок исполнения в пользу фактора (ст. 830 ГК РФ)"
    description: >
      Фактографическая проверка порядка уведомления должника об уступке,
      ответственной стороны, момента перехода платежа фактору
      и доказательственного механизма уведомления.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "уведомление должника"
        - "должник уведомляется"
        - "об уступке"
        - "платеж финансовому агенту"
        - "исполнение в пользу фактора"
        - "получение уведомления"
        - "скрытый факторинг"
        - "без уведомления должника"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)уведомлени[ея]\\s+должник"
        - "(?i)об\\s+уступк"
        - "(?i)платеж.*финансовому\\s+агенту"
        - "(?i)(заказн(ым|ое)\\s+письм|с\\s+описью\\s+вложени|ЭДО|УКЭП)"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор факторинга по Главе 43 ГК РФ.
        Проверяется только один вопрос: порядок уведомления должника
        и исполнения уступленного требования в пользу фактора.
        Нормативный ориентир:
        - ст. 830 ГК РФ — исполнение должником
        Важно:
        - Твоя задача — не оценивать серьёзность риска.
        - Только установить, что прямо есть в тексте договора, а чего прямо нет.
        - По ст. 830 ГК РФ должник обязан платить фактору ТОЛЬКО после
          получения письменного уведомления об уступке. До уведомления
          должник вправе платить клиенту, и это надлежащее исполнение.
        - Скрытый факторинг (без уведомления должника) — валидная практика,
          но риск на факторе: должник продолжает платить клиенту.
          Отражай это явно, не сглаживай.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Наличие порядка уведомления должника и момент, с которого
           должник обязан платить фактору.
        2. Кто уведомляет должника (клиент / фактор / оба).
        3. Кому платит должник после уведомления (фактору / клиенту /
           неясно / не применимо при скрытом факторинге).
        4. Наличие доказательственного механизма уведомления и его форму
           (заказное письмо / ЭДО / под роспись / по форме приложения).

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Если данные не указаны прямо:
           - для status-полей верни "not_defined";
           - для display-полей верни "Не установлено" / "Не установлена"
             / "Не установлен" / "Не предусмотрено" по роду.
        4. Запрещены значения: null, None, пустые строки — не используй их
           никогда. Допустимые fallback-значения: "not_defined",
           "Не установлено", "Не установлена", "Не установлен",
           "Не предусмотрено", "Не предусмотрен".
        5. notification_clause_status:
           "present" — в договоре есть условие об уведомлении должника
             об уступке (независимо от того, кто уведомляет);
           "not_defined" — условия об уведомлении в тексте нет
             (в том числе при скрытом факторинге).
        6. who_notifies_debtor:
           "client" — уведомляет Клиент;
           "factor" — уведомляет Фактор;
           "both" — уведомление может быть направлено любой из сторон или
             совместно;
           "not_defined" — ответственная сторона в тексте не определена
             (или уведомление не предусмотрено).
        7. payment_routing_after_notice:
           "factor" — должник платит Фактору после уведомления;
           "client" — должник продолжает платить Клиенту
             (скрытый / нераскрытый факторинг);
           "unclear" — маршрутизация платежа в тексте противоречива или
             неоднозначна;
           "not_defined" — условие о маршрутизации в тексте отсутствует.
        8. proof_of_notice_mechanism:
           "present" — есть прямое указание формы/способа уведомления
             (заказное письмо, опись вложения, ЭДО, УКЭП, форма Приложения,
             вручение под роспись и т.п.);
           "not_defined" — доказательственный механизм в тексте
             отсутствует.
        9. В evidence включай только дословные цитаты из текста договора.
        10. Верни РОВНО один JSON-объект со всеми 9 ключами без какого-либо
            дополнительного текста до или после. Начни ответ сразу с
            открывающей фигурной скобки и закончи закрывающей. НЕ пиши
            Markdown, списки, код-фенсы. Ответ должен быть валидным JSON,
            пригодным для парсинга через json.loads без предварительной
            обработки.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — стандартное уведомление должника:
        Фрагмент:
        "Клиент обязан уведомить должника об уступке в течение 3 рабочих
        дней с даты уступки требования. После получения уведомления должник
        обязан производить платежи Фактору. Уведомление направляется заказным
        письмом с описью вложения по форме Приложения № 2."
        Ответ:
        {
          "notification_clause_status": "present",
          "notification_clause_display": "Предусмотрено",
          "who_notifies_debtor": "client",
          "who_notifies_display": "Клиент",
          "payment_routing_after_notice": "factor",
          "payment_routing_display": "В пользу Фактора",
          "proof_of_notice_mechanism": "present",
          "proof_of_notice_display": "Предусмотрен",
          "evidence": [
            {
              "clause_ref": "п. 5.1",
              "quote": "Клиент обязан уведомить должника об уступке в течение 3 рабочих дней с даты уступки требования. Уведомление направляется заказным письмом с описью вложения по форме Приложения № 2."
            }
          ]
        }

        Пример 2 — данных в договоре нет:
        Фрагмент:
        "Фактор приобретает право требования."
        Ответ:
        {
          "notification_clause_status": "not_defined",
          "notification_clause_display": "Не предусмотрено",
          "who_notifies_debtor": "not_defined",
          "who_notifies_display": "Не установлено",
          "payment_routing_after_notice": "not_defined",
          "payment_routing_display": "Не установлено",
          "proof_of_notice_mechanism": "not_defined",
          "proof_of_notice_display": "Не установлен",
          "evidence": []
        }

        Пример 3 — текст есть, но надёжный вывод сделать нельзя
        (скрытый факторинг с неполной оговоркой):
        Фрагмент:
        "Должник уведомляется о состоявшейся уступке в порядке, определяемом
        Сторонами дополнительно."
        Ответ:
        {
          "notification_clause_status": "present",
          "notification_clause_display": "Предусмотрено",
          "who_notifies_debtor": "not_defined",
          "who_notifies_display": "Не установлено",
          "payment_routing_after_notice": "unclear",
          "payment_routing_display": "Не определено",
          "proof_of_notice_mechanism": "not_defined",
          "proof_of_notice_display": "Не установлен",
          "evidence": [
            {
              "clause_ref": "п. 5.1",
              "quote": "Должник уведомляется о состоявшейся уступке в порядке, определяемом Сторонами дополнительно."
            }
          ]
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату об уведомлении должника.
        2. Найди прямую цитату о том, кто уведомляет.
        3. Найди прямую цитату о маршрутизации платежа после уведомления.
        4. Найди прямую цитату о форме/способе уведомления (доказательственный
           механизм).
        5. Проверь признаки скрытого факторинга: отсутствие условия об
           уведомлении или прямая оговорка о нераскрытии уступки должнику.
           В этом случае payment_routing_after_notice = "client".
        6. Согласуй raw enum и display:
           notification_clause_status -> notification_clause_display:
             "present" -> "Предусмотрено";
             "not_defined" -> "Не предусмотрено".
           who_notifies_debtor -> who_notifies_display:
             "client" -> "Клиент";
             "factor" -> "Фактор";
             "both" -> "Обе стороны";
             "not_defined" -> "Не установлено".
           payment_routing_after_notice -> payment_routing_display:
             "factor" -> "В пользу Фактора";
             "client" -> "В пользу Клиента";
             "unclear" -> "Не определено";
             "not_defined" -> "Не установлено".
           proof_of_notice_mechanism -> proof_of_notice_display:
             "present" -> "Предусмотрен";
             "not_defined" -> "Не установлен".
        7. Если прямой цитаты нет — верни "not_defined" для status-полей
           и "Не установлено" / "Не предусмотрено" / "Не установлен" для
           display-полей.
        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь РОВНО одним JSON-объектом без какого-либо дополнительного
        текста до или после, со всеми 9 ключами:
        {
          "notification_clause_status": "<present / not_defined>",
          "notification_clause_display": "<Предусмотрено / Не предусмотрено>",
          "who_notifies_debtor": "<client / factor / both / not_defined>",
          "who_notifies_display": "<Клиент / Фактор / Обе стороны / Не установлено>",
          "payment_routing_after_notice": "<factor / client / unclear / not_defined>",
          "payment_routing_display": "<В пользу Фактора / В пользу Клиента / Не определено / Не установлено>",
          "proof_of_notice_mechanism": "<present / not_defined>",
          "proof_of_notice_display": "<Предусмотрен / Не установлен>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 8
      temperature: 0.0
      max_tokens: 750

    retrieval:
      retrieval_profile: "notice_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "уведомление должника об уступке платеж финансовому агенту исполнение в пользу фактора получение уведомления кто уведомляет доказательство уведомления заказное письмо опись вложения ЭДО УКЭП форма приложения скрытый факторинг"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - procedures
        - obligations
      negative_keywords:
        - "регресс"
        - "комиссия"
        - "зачет"
        - "банкротство"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.20, 0.65]
        boost: 0.18
        scope: segment
      context_k: 8
      max_chunks: 10
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "procedures"
        - "obligations"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.12

    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 580

    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false
      llm_max_tokens: 1100

      presence_signal:
        field: "debtor_notification_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора факторинга сведения
        об уведомлении должника: наличие порядка, ответственная сторона,
        маршрутизация платежа, доказательственный механизм.
        Не анализируй регресс, комиссию или банкротство.
        Различай стандартное уведомление и скрытый факторинг
        (без уведомления должника — валидная практика).
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. debtor_notification_check_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если notification_clause_status = "present";
           - "missing" — если notification_clause_status = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - notification_clause_status = "not_defined";
           - who_notifies_debtor = "not_defined";
           - payment_routing_after_notice = "not_defined";
           - proof_of_notice_mechanism = "not_defined";
           - notification_clause_display = "Не предусмотрено";
           - who_notifies_display = "Не установлено";
           - payment_routing_display = "Не установлено";
           - proof_of_notice_display = "Не установлен";
           - не выполняй остальные шаги.

        1.  notification_clause_status — present / not_defined.
        2.  notification_clause_display — "Предусмотрено" / "Не предусмотрено"
            (должно соответствовать notification_clause_status).
        3.  who_notifies_debtor — client / factor / both / not_defined.
        4.  who_notifies_display — "Клиент" / "Фактор" / "Обе стороны" /
            "Не установлено" (должно соответствовать who_notifies_debtor).
        5.  payment_routing_after_notice — factor / client / unclear /
            not_defined.
        6.  payment_routing_display — "В пользу Фактора" /
            "В пользу Клиента" / "Не определено" / "Не установлено"
            (должно соответствовать payment_routing_after_notice).
        7.  proof_of_notice_mechanism — present / not_defined.
        8.  proof_of_notice_display — "Предусмотрен" / "Не установлен"
            (должно соответствовать proof_of_notice_mechanism).
        9.  evidence — массив цитат с clause_ref и quote.
        </task>

        <context_rules>
        - Перед остальными полями заполни debtor_notification_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined", все *_display = "Не предусмотрено" / "Не установлено" / "Не установлен".
        - Используй только текст договора.
        - Не выводи порядок уведомления из нормы ст. 830 ГК РФ — только из текста договора.
        - Скрытый факторинг (без уведомления должника) — валидная практика. В этом случае payment_routing_after_notice = "client". Отражай это явно, не сглаживай.
        - Если фрагменты конфликтуют и не позволяют сделать надёжный вывод, верни "Не удалось определить" для затронутого видимого поля и включи конфликтующие цитаты в evidence.
        - Запрещены значения null, None и пустые строки.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет порядка уведомления должника.
           → presence = "missing";
             notification_clause_status = "not_defined";
             все *_display = "Не предусмотрено" / "Не установлено" / "Не установлен".

        2. Скрытый факторинг.
           В договоре прямо указано, что должник не уведомляется об уступке, и должник продолжает платить клиенту.
           → presence = "present";
             notification_clause_status = "present" (условие о порядке есть);
             who_notifies_debtor = "not_defined";
             payment_routing_after_notice = "client";
             соответствующие *_display = "Предусмотрено" / "Не установлено" / "В пользу Клиента".

        3. Противоречие между фрагментами.
           В разных пунктах договора указаны разные маршрутизации платежа или разные ответственные за уведомление.
           → presence = "unclear";
             payment_routing_after_notice = "unclear";
             соответствующие *_display = "Не определено".

        4. Стандартное уведомление с доказательственным механизмом.
           В договоре указан порядок уведомления, ответственная сторона и форма (заказное письмо, ЭДО, УКЭП).
           → presence = "present";
             notification_clause_status = "present";
             who_notifies_debtor = соответствующее значение;
             payment_routing_after_notice = "factor";
             proof_of_notice_mechanism = "present";
             соответствующие *_display = "Предусмотрено" / "Клиент" или "Фактор" / "В пользу Фактора" / "Предусмотрен".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для debtor_notification_check_presence используй только: "present", "missing", "unclear".
        - Для статусных enum-полей используй только допустимые значения из списка.
        - Fallback при отсутствии данных:
          * notification_clause_display → "Не предусмотрено";
          * who_notifies_display, payment_routing_display → "Не установлено";
          * proof_of_notice_display → "Не установлен".
        - Fallback при противоречии или неоднозначности:
          * все *_display → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "debtor_notification_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования о уведомлении должника. Внутреннее агрегатное signal-поле."
          required: true

        - name: "notification_clause_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["present", "not_defined"]
          description: "Наличие порядка уведомления должника (raw enum). Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "notification_clause_display"
          type: "string"
          presentation: "fact"
          label: "Уведомление должника"
          description: >
            User-facing: Предусмотрено / Не предусмотрено. Fallback: "Не установлено" / "Не удалось определить".
          required: true
          display_in_grid: true
          display_priority: 1

        - name: "who_notifies_debtor"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["client", "factor", "both", "not_defined"]
          description: "Кто уведомляет должника (raw enum). Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "who_notifies_display"
          type: "string"
          presentation: "fact"
          label: "Кто уведомляет должника"
          description: >
            User-facing: Клиент / Фактор / Обе стороны / Не установлено. Fallback: "Не установлено" / "Не удалось определить".
          required: true
          display_in_grid: true
          display_priority: 2

        - name: "payment_routing_after_notice"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["factor", "client", "unclear", "not_defined"]
          description: "Кому платит должник после уведомления (raw enum). Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "payment_routing_display"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 3
          label: "Платёж после уведомления"
          description: >
            User-facing: В пользу Фактора / В пользу Клиента /
            Не определено / Не установлено.
            Fallback: "Не установлено" / "Не удалось определить".
          required: true

        - name: "proof_of_notice_mechanism"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["present", "not_defined"]
          description: "Наличие доказательственного механизма уведомления (raw enum). Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "proof_of_notice_display"
          type: "string"
          presentation: "fact"
          label: "Доказательственный механизм уведомления"
          description: >
            User-facing: Предусмотрен / Не установлен. Fallback: "Не установлено" / "Не удалось определить".
          required: true
          display_in_grid: true
          display_priority: 4

        - name: "evidence"
          type: "array"
          presentation: "diagnostic"
          description: "Точные цитаты из договора, подтверждающие извлечённые значения."
          required: true
          display_in_grid: false

      store_payload: true

  - id: setoff_and_double_assignment_risk_check
    name: "Защита от зачёта встречных требований и повторной уступки (ст. 832, 388–390 ГК РФ)"
    description: >
      Фактографическая проверка наличия защиты фактора от зачёта встречных
      требований должника и запрета повторной уступки того же требования.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "встречные требования"
        - "зачет"
        - "отсутствие встречных требований"
        - "повторная уступка"
        - "последующая уступка"
        - "клиент не вправе уступать"
        - "запрет последующей уступки"
        - "ранее не уступалось"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)встречн(ые|ых)\\s+требован"
        - "(?i)зачет"
        - "(?i)(повторн(ая|ой)|последующ(ая|ей))\\s+уступк"
        - "(?i)(ранее|прежде).{0,30}уступ"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор факторинга по Глава 43 ГК РФ.
        Проверяется только один вопрос: защита фактора от зачёта встречных
        требований должника и повторной уступки того же требования.
        Нормативные ориентиры:
        - ст. 832 ГК РФ — возражения должника против требования
          финансового агента (в том числе зачёт встречных требований);
        - ст. 388–390 ГК РФ — общие положения об уступке требования,
          ответственность цедента, уступка будущего требования;
        - ст. 828 ГК РФ — запрет уступки в договоре между клиентом и
          должником не делает уступку недействительной, но даёт должнику
          право на возмещение убытков с клиента.
        Важно:
        - Твоя задача — не оценивать серьёзность риска.
        - Только установить, что прямо есть в тексте договора, а чего прямо нет.
        - Заверение клиента об отсутствии встречных требований — это
          механизм защиты через последующую ответственность клиента перед
          фактором. Оно НЕ блокирует право должника на зачёт по ст. 832
          ГК РФ (должник не связан договором факторинга). Различай эти
          аспекты.
        - Запрет уступки между клиентом и должником (по их основному
          договору) не делает уступку фактору недействительной —
          ст. 828 ГК РФ. Если такой запрет упомянут, отражай это как
          факт, но не как блокирующее условие.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Наличие защиты от зачёта встречных требований (заверение,
           компенсация убытков фактору, иные механизмы).
        2. Наличие запрета повторной / последующей уступки того же
           требования.
        3. Наличие заверения клиента об отсутствии встречных требований
           у должника.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Если данные не указаны прямо:
           - для status-полей верни "not_defined";
           - для display-полей верни "Не установлена" / "Не установлен"
             / "Не установлено" по роду.
        4. Запрещены значения: null, None, пустые строки — не используй их
           никогда. Допустимые fallback-значения: "not_defined",
           "Не установлена", "Не установлен", "Не установлено".
        5. setoff_protection_status:
           "present" — есть полноценная защита: сочетание заверения клиента
             об отсутствии встречных требований + обязанности клиента
             компенсировать фактору убытки (или возместить потери), если
             зачёт будет предъявлен должником;
           "partial" — есть только один из элементов: либо заверение без
             компенсации, либо компенсация без заверения;
           "not_defined" — защита от зачёта в тексте отсутствует.
        6. subsequent_assignment_prohibition:
           "present" — в договоре прямо указано, что клиент не вправе
             уступать то же требование третьим лицам / совершать
             последующие уступки;
           "not_defined" — такое условие в тексте отсутствует.
        7. client_warranty_on_no_setoff:
           "present" — в договоре есть прямое заверение клиента об
             отсутствии у должника встречных требований, которые могут
             быть предъявлены к зачёту;
           "not_defined" — такое заверение в тексте отсутствует.
        8. В evidence включай только дословные цитаты из текста договора.
        9. Верни РОВНО один JSON-объект со всеми 7 ключами без какого-либо
           дополнительного текста до или после. Начни ответ сразу с
           открывающей фигурной скобки и закончи закрывающей. НЕ пиши
           Markdown, списки, код-фенсы. Ответ должен быть валидным JSON,
           пригодным для парсинга через json.loads без предварительной
           обработки.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — полная защита от зачёта + запрет повторной уступки:
        Фрагмент:
        "Клиент заверяет, что у должника отсутствуют встречные требования,
        которые могут быть предъявлены к зачёту. Если такое требование будет
        предъявлено, Клиент обязан возместить Фактору соответствующие убытки
        в течение 5 рабочих дней. Клиент не вправе уступать то же требование
        третьим лицам."
        Ответ:
        {
          "setoff_protection_status": "present",
          "setoff_protection_display": "Предусмотрена",
          "subsequent_assignment_prohibition": "present",
          "subsequent_assignment_display": "Предусмотрен",
          "client_warranty_on_no_setoff": "present",
          "client_warranty_display": "Предусмотрено",
          "evidence": [
            {
              "clause_ref": "п. 6.2",
              "quote": "Клиент заверяет, что у должника отсутствуют встречные требования, которые могут быть предъявлены к зачёту. Если такое требование будет предъявлено, Клиент обязан возместить Фактору соответствующие убытки в течение 5 рабочих дней."
            }
          ]
        }

        Пример 2 — данных в договоре нет:
        Фрагмент:
        "Клиент уступает требование Фактору."
        Ответ:
        {
          "setoff_protection_status": "not_defined",
          "setoff_protection_display": "Не установлена",
          "subsequent_assignment_prohibition": "not_defined",
          "subsequent_assignment_display": "Не установлен",
          "client_warranty_on_no_setoff": "not_defined",
          "client_warranty_display": "Не установлено",
          "evidence": []
        }

        Пример 3 — текст есть, но вывод частичный (только заверение,
        без компенсации убытков):
        Фрагмент:
        "Клиент заверяет Фактора, что уступаемое денежное требование свободно
        от встречных требований должника."
        Ответ:
        {
          "setoff_protection_status": "partial",
          "setoff_protection_display": "Частичная",
          "subsequent_assignment_prohibition": "not_defined",
          "subsequent_assignment_display": "Не установлен",
          "client_warranty_on_no_setoff": "present",
          "client_warranty_display": "Предусмотрено",
          "evidence": [
            {
              "clause_ref": "п. 6.2",
              "quote": "Клиент заверяет Фактора, что уступаемое денежное требование свободно от встречных требований должника."
            }
          ]
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о защите от зачёта (заверение / компенсация /
           иной механизм).
        2. Найди прямую цитату о запрете повторной / последующей уступки.
        3. Найди прямую цитату о заверении клиента об отсутствии встречных
           требований.
        4. Проверь: если есть только заверение без компенсации или только
           компенсация без заверения — setoff_protection_status = "partial",
           а не "present".
        5. Согласуй raw enum и display:
           setoff_protection_status -> setoff_protection_display:
             "present" -> "Предусмотрена";
             "partial" -> "Частичная";
             "not_defined" -> "Не установлена".
           subsequent_assignment_prohibition -> subsequent_assignment_display:
             "present" -> "Предусмотрен";
             "not_defined" -> "Не установлен".
           client_warranty_on_no_setoff -> client_warranty_display:
             "present" -> "Предусмотрено";
             "not_defined" -> "Не установлено".
        6. Если прямой цитаты нет — верни "not_defined" для status-полей
           и "Не установлена" / "Не установлен" / "Не установлено" для
           display-полей.
        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь РОВНО одним JSON-объектом без какого-либо дополнительного
        текста до или после, со всеми 7 ключами:
        {
          "setoff_protection_status": "<present / partial / not_defined>",
          "setoff_protection_display": "<Предусмотрена / Частичная / Не установлена>",
          "subsequent_assignment_prohibition": "<present / not_defined>",
          "subsequent_assignment_display": "<Предусмотрен / Не установлен>",
          "client_warranty_on_no_setoff": "<present / not_defined>",
          "client_warranty_display": "<Предусмотрено / Не установлено>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 8
      temperature: 0.0
      max_tokens: 650

    retrieval:
      retrieval_profile: "assignment_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "встречные требования зачет отсутствие встречных требований возражения должника повторная уступка последующая уступка клиент не вправе уступать запрет последующей уступки заверение компенсация убытков возмещение убытков ранее не уступалось"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - representations
        - limitations
      negative_keywords:
        - "регресс"
        - "комиссия"
        - "уведомление должника"
        - "банкротство"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.30, 0.75]
        boost: 0.15
        scope: segment
      context_k: 8
      max_chunks: 10
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "representations"
        - "limitations"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.12

    evidence:
      required: true
      min_snippet_length: 35
      max_snippet_length: 500

    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false
      llm_max_tokens: 900

      presence_signal:
        field: "setoff_and_double_assignment_risk_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора факторинга
        сведения о защите от зачёта встречных требований должника и
        повторной уступки.
        Не анализируй регресс, финансирование или банкротство.
        Различай заверение клиента (ответственность клиента перед
        фактором) и блокировку зачёта против должника — это разные вещи.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. setoff_and_double_assignment_risk_check_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (setoff_protection_status, subsequent_assignment_prohibition,
              client_warranty_on_no_setoff) ≠ "not_defined";
           - "missing" — если все три содержательных поля = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - setoff_protection_status = "not_defined";
           - subsequent_assignment_prohibition = "not_defined";
           - client_warranty_on_no_setoff = "not_defined";
           - setoff_protection_display = "Не установлена";
           - subsequent_assignment_display = "Не установлен";
           - client_warranty_display = "Не установлено";
           - не выполняй остальные шаги.

        1.  setoff_protection_status — present / partial / not_defined.
        2.  setoff_protection_display — "Предусмотрена" / "Частичная" /
            "Не установлена" (должно соответствовать
            setoff_protection_status).
        3.  subsequent_assignment_prohibition — present / not_defined.
        4.  subsequent_assignment_display — "Предусмотрен" /
            "Не установлен" (должно соответствовать
            subsequent_assignment_prohibition).
        5.  client_warranty_on_no_setoff — present / not_defined.
        6.  client_warranty_display — "Предусмотрено" / "Не установлено"
            (должно соответствовать client_warranty_on_no_setoff).
        7.  evidence — массив цитат с clause_ref и quote.
        </task>

        <context_rules>
        - Перед остальными полями заполни setoff_and_double_assignment_risk_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined", все *_display = "Не установлена" / "Не установлен" / "Не установлено".
        - Используй только текст договора.
        - Не подставляй нормы закона вместо текста договора.
        - Различай заверение клиента (ответственность клиента перед фактором) и блокировку зачёта против должника — это разные вещи.
        - Если есть только заверение без компенсации или только компенсация без заверения — setoff_protection_status = "partial", а не "present".
        - Если фрагменты конфликтуют и не позволяют сделать надёжный вывод, верни "Не удалось определить" для затронутого видимого поля и включи конфликтующие цитаты в evidence.
        - Запрещены значения null, None и пустые строки.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет защиты от зачёта и запрета повторной уступки.
           → presence = "missing";
             все *_status = "not_defined";
             все *_display = "Не установлена" / "Не установлен" / "Не установлено".

        2. Частичная защита.
           Есть только заверение клиента об отсутствии встречных требований, но нет обязанности компенсировать убытки.
           → presence = "present";
             setoff_protection_status = "partial";
             client_warranty_on_no_setoff = "present";
             соответствующие *_display = "Частичная" / "Предусмотрено".

        3. Противоречие между фрагментами.
           В разных пунктах договора указаны противоречащие условия защиты.
           → presence = "unclear";
             соответствующие *_status = "partial" или "not_defined";
             соответствующие *_display = "Не удалось определить".

        4. Полная защита.
           Есть заверение клиента + обязанность компенсировать убытки + запрет повторной уступки.
           → presence = "present";
             setoff_protection_status = "present";
             subsequent_assignment_prohibition = "present";
             client_warranty_on_no_setoff = "present";
             соответствующие *_display = "Предусмотрена" / "Предусмотрен" / "Предусмотрено".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для setoff_and_double_assignment_risk_check_presence используй только: "present", "missing", "unclear".
        - Для статусных enum-полей используй только допустимые значения из списка.
        - Fallback при отсутствии данных:
          * setoff_protection_display → "Не установлена";
          * subsequent_assignment_display → "Не установлен";
          * client_warranty_display → "Не установлено".
        - Fallback при противоречии или неоднозначности:
          * все *_display → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "setoff_and_double_assignment_risk_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования о защите от зачёта и повторной уступки. Внутреннее агрегатное signal-поле."
          required: true

        - name: "setoff_protection_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["present", "partial", "not_defined"]
          description: "Статус защиты от зачёта (raw enum). Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "setoff_protection_display"
          type: "string"
          presentation: "fact"
          label: "Защита от зачёта встречных требований"
          description: >
            User-facing: Предусмотрена / Частичная / Не установлена. Fallback: "Не установлено" / "Не удалось определить".
          required: true
          display_in_grid: true
          display_priority: 1

        - name: "subsequent_assignment_prohibition"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["present", "not_defined"]
          description: "Наличие запрета повторной уступки (raw enum). Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "subsequent_assignment_display"
          type: "string"
          presentation: "fact"
          label: "Запрет повторной уступки"
          description: >
            User-facing: Предусмотрен / Не установлен. Fallback: "Не установлено" / "Не удалось определить".
          required: true
          display_in_grid: true
          display_priority: 2

        - name: "client_warranty_on_no_setoff"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["present", "not_defined"]
          description: "Наличие заверения клиента об отсутствии зачёта (raw enum). Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "client_warranty_display"
          type: "string"
          presentation: "fact"
          label: "Заверение об отсутствии встречных требований"
          description: >
            User-facing: Предусмотрено / Не установлено. Fallback: "Не установлено" / "Не удалось определить".
          required: true
          display_in_grid: true
          display_priority: 3

        - name: "evidence"
          type: "array"
          presentation: "diagnostic"
          description: "Точные цитаты из договора, подтверждающие извлечённые значения."
          required: true
          display_in_grid: false

      store_payload: true

  - id: document_transfer_and_bankruptcy_check
    name: "Передача документов и банкротные заверения клиента (ст. 61.2, 61.3 ФЗ-127)"
    description: >
      Фактографическая проверка обязанности клиента передать подтверждающие
      документы и заверений об отсутствии признаков банкротства клиента,
      а также о рыночности условий сделки.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "передача документов"
        - "оригиналы документов"
        - "акт приема-передачи документов"
        - "накладные"
        - "счета-фактуры"
        - "отсутствие признаков банкротства"
        - "не находится в процедуре банкротства"
        - "неплатежеспособность"
        - "рыночные условия"
        - "рыночная стоимость"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)передач[аи]\\s+документ"
        - "(?i)акт\\s+приема[- ]передачи\\s+документ"
        - "(?i)признак(ов)?\\s+банкротств"
        - "(?i)(рыночн(ые|ой|ая)|обычн(ые|ой))\\s+(услови|стоимост|цен)"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор факторинга по Главе 43 ГК РФ.
        Проверяется только один вопрос: передача подтверждающих документов
        и банкротные заверения клиента (с элементами рыночности условий).
        Нормативные ориентиры:
        - ст. 826, 830 ГК РФ — требование и исполнение;
        - ст. 61.2 ФЗ-127 — оспаривание подозрительных сделок
          (неравноценное встречное предоставление);
        - ст. 61.3 ФЗ-127 — оспаривание сделок с предпочтением.
        Важно:
        - Твоя задача — не оценивать серьёзность риска.
        - Только установить, что прямо есть в тексте договора, а чего прямо нет.
        - Банкротные заверения и заверения о рыночности условий —
          стандартные механизмы защиты фактора от оспаривания уступки
          в случае банкротства клиента. Отражай их наличие или отсутствие,
          не додумывая.
        - «Не находится в процедуре банкротства» и «отсутствуют признаки
          неплатёжеспособности» — это разные по смыслу заверения.
          Если в договоре есть только одно из них — отражай это как present
          в общем поле и учитывай при оценке специфичности.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Наличие обязательства клиента передать фактору подтверждающие
           документы по уступаемому требованию.
        2. Конкретизацию перечня документов (накладные, счета-фактуры,
           акты, оригиналы, акт приёма-передачи и т.п.) или только общую
           формулировку.
        3. Наличие банкротных заверений клиента (отсутствие процедуры
           банкротства, отсутствие признаков неплатёжеспособности).
        4. Наличие заверения о рыночности условий сделки / равноценности
           встречного предоставления.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Если данные не указаны прямо:
           - для status-полей верни "not_defined";
           - для display-полей верни "Не предусмотрена" / "Не предусмотрены"
             / "Не предусмотрено" / "Не установлен" / "Общий" по роду.
        4. Запрещены значения: null, None, пустые строки — не используй их
           никогда. Допустимые fallback-значения: "not_defined",
           "Не предусмотрена", "Не предусмотрены", "Не предусмотрено",
           "Не установлен".
        5. document_transfer_status:
           "present" — в договоре прямо предусмотрена обязанность клиента
             передать фактору подтверждающие документы;
           "not_defined" — такая обязанность в тексте отсутствует.
        6. document_list_specificity:
           "specific" — перечислены конкретные виды документов
             (накладные, счета-фактуры, акты, оригиналы, акт приёма-передачи
             и т.п.);
           "generic" — общая формулировка без перечня
             («предоставляет документы по запросу Фактора»);
           "not_defined" — перечень не упоминается вовсе
             (при отсутствии обязанности передачи).
        7. bankruptcy_representations_status:
           "present" — в договоре есть заверение клиента об отсутствии
             процедуры банкротства и/или признаков неплатёжеспособности;
           "not_defined" — такое заверение в тексте отсутствует.
        8. market_terms_representation:
           "present" — в договоре есть заверение о рыночности условий
             сделки, равноценности встречного предоставления, обычных
             условиях оборота и т.п.;
           "not_defined" — такое заверение в тексте отсутствует.
        9. В evidence включай только дословные цитаты из текста договора.
        10. Верни РОВНО один JSON-объект со всеми 9 ключами без какого-либо
            дополнительного текста до или после. Начни ответ сразу с
            открывающей фигурной скобки и закончи закрывающей. НЕ пиши
            Markdown, списки, код-фенсы. Ответ должен быть валидным JSON,
            пригодным для парсинга через json.loads без предварительной
            обработки.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — полный набор заверений и конкретный перечень документов:
        Фрагмент:
        "Клиент обязан передать Фактору оригиналы накладных, счетов-фактур
        и актов по уступаемому требованию по акту приёма-передачи документов.
        Клиент заверяет, что не находится в процедуре банкротства, не имеет
        признаков неплатёжеспособности, а условия настоящего Договора
        являются рыночными и соответствуют обычным условиям оборота."
        Ответ:
        {
          "document_transfer_status": "present",
          "document_transfer_display": "Предусмотрена",
          "document_list_specificity": "specific",
          "document_list_display": "Конкретный",
          "bankruptcy_representations_status": "present",
          "bankruptcy_representations_display": "Предусмотрены",
          "market_terms_representation": "present",
          "market_terms_display": "Предусмотрено",
          "evidence": [
            {
              "clause_ref": "п. 7.1",
              "quote": "Клиент обязан передать Фактору оригиналы накладных, счетов-фактур и актов по уступаемому требованию по акту приёма-передачи документов."
            }
          ]
        }

        Пример 2 — данных в договоре нет:
        Фрагмент:
        "Клиент уступает требование Фактору."
        Ответ:
        {
          "document_transfer_status": "not_defined",
          "document_transfer_display": "Не предусмотрена",
          "document_list_specificity": "not_defined",
          "document_list_display": "Не установлен",
          "bankruptcy_representations_status": "not_defined",
          "bankruptcy_representations_display": "Не предусмотрены",
          "market_terms_representation": "not_defined",
          "market_terms_display": "Не предусмотрено",
          "evidence": []
        }

        Пример 3 — текст есть, но вывод частичный (документы по запросу,
        банкротных заверений нет, рыночность упомянута косвенно):
        Фрагмент:
        "Клиент предоставляет документы по запросу Фактора. Стороны
        подтверждают, что заключают настоящий Договор на обычных условиях."
        Ответ:
        {
          "document_transfer_status": "present",
          "document_transfer_display": "Предусмотрена",
          "document_list_specificity": "generic",
          "document_list_display": "Общий",
          "bankruptcy_representations_status": "not_defined",
          "bankruptcy_representations_display": "Не предусмотрены",
          "market_terms_representation": "present",
          "market_terms_display": "Предусмотрено",
          "evidence": [
            {
              "clause_ref": "п. 7.1",
              "quote": "Клиент предоставляет документы по запросу Фактора. Стороны подтверждают, что заключают настоящий Договор на обычных условиях."
            }
          ]
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о передаче документов.
        2. Найди прямую цитату о перечне документов (если есть).
        3. Найди прямую цитату о банкротных заверениях.
        4. Найди прямую цитату о рыночности условий / равноценности
           встречного предоставления.
        5. Проверь: если перечень документов не детализирован, но
           обязанность передачи есть — document_transfer_status = "present",
           document_list_specificity = "generic".
        6. Согласуй raw enum и display:
           document_transfer_status -> document_transfer_display:
             "present" -> "Предусмотрена";
             "not_defined" -> "Не предусмотрена".
           document_list_specificity -> document_list_display:
             "specific" -> "Конкретный";
             "generic" -> "Общий";
             "not_defined" -> "Не установлен".
           bankruptcy_representations_status -> bankruptcy_representations_display:
             "present" -> "Предусмотрены";
             "not_defined" -> "Не предусмотрены".
           market_terms_representation -> market_terms_display:
             "present" -> "Предусмотрено";
             "not_defined" -> "Не предусмотрено".
        7. Если прямой цитаты нет — верни "not_defined" для status-полей
           и соответствующий fallback для display-полей.
        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь РОВНО одним JSON-объектом без какого-либо дополнительного
        текста до или после, со всеми 9 ключами:
        {
          "document_transfer_status": "<present / not_defined>",
          "document_transfer_display": "<Предусмотрена / Не предусмотрена>",
          "document_list_specificity": "<specific / generic / not_defined>",
          "document_list_display": "<Конкретный / Общий / Не установлен>",
          "bankruptcy_representations_status": "<present / not_defined>",
          "bankruptcy_representations_display": "<Предусмотрены / Не предусмотрены>",
          "market_terms_representation": "<present / not_defined>",
          "market_terms_display": "<Предусмотрено / Не предусмотрено>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 8
      temperature: 0.0
      max_tokens: 700

    retrieval:
      retrieval_profile: "warranties_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "передача документов оригиналы документов акт приема-передачи документов накладные счета-фактуры подтверждающие документы отсутствие признаков банкротства не находится в процедуре банкротства неплатежеспособность рыночные условия рыночная стоимость обычные условия оборота равноценное встречное предоставление"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - representations
        - obligations
      negative_keywords:
        - "регресс"
        - "комиссия"
        - "уведомление должника"
        - "зачет"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.35, 0.80]
        boost: 0.15
        scope: segment
      context_k: 8
      max_chunks: 10
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "representations"
        - "obligations"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.12

    evidence:
      required: true
      min_snippet_length: 35
      max_snippet_length: 520

    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false
      llm_max_tokens: 1100

      presence_signal:
        field: "document_transfer_and_bankruptcy_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора факторинга
        сведения о передаче подтверждающих документов, банкротных
        заверениях клиента и заверении о рыночности условий.
        Не анализируй регресс, финансирование, уведомление должника
        или зачёт.
        Различай заверение об отсутствии процедуры банкротства и заверение
        об отсутствии признаков неплатёжеспособности — это близкие, но
        разные по смыслу заверения.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. document_transfer_and_bankruptcy_check_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (document_transfer_status, bankruptcy_representations_status,
              market_terms_representation) ≠ "not_defined";
           - "missing" — если все три содержательных поля = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - document_transfer_status = "not_defined";
           - document_list_specificity = "not_defined";
           - bankruptcy_representations_status = "not_defined";
           - market_terms_representation = "not_defined";
           - document_transfer_display = "Не предусмотрена";
           - document_list_display = "Не установлен";
           - bankruptcy_representations_display = "Не предусмотрены";
           - market_terms_display = "Не предусмотрено";
           - не выполняй остальные шаги.

        1.  document_transfer_status — present / not_defined.
        2.  document_transfer_display — "Предусмотрена" /
            "Не предусмотрена" (должно соответствовать
            document_transfer_status).
        3.  document_list_specificity — specific / generic / not_defined.
        4.  document_list_display — "Конкретный" / "Общий" /
            "Не установлен" (должно соответствовать
            document_list_specificity).
        5.  bankruptcy_representations_status — present / not_defined.
        6.  bankruptcy_representations_display — "Предусмотрены" /
            "Не предусмотрены" (должно соответствовать
            bankruptcy_representations_status).
        7.  market_terms_representation — present / not_defined.
        8.  market_terms_display — "Предусмотрено" / "Не предусмотрено"
            (должно соответствовать market_terms_representation).
        9.  evidence — массив цитат с clause_ref и quote.
        </task>

        <context_rules>
        - Перед остальными полями заполни document_transfer_and_bankruptcy_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined", все *_display = "Не предусмотрена" / "Не установлен" / "Не предусмотрены" / "Не предусмотрено".
        - Используй только текст договора.
        - Не подставляй нормы закона вместо текста договора.
        - Если перечень документов не детализирован, но обязанность передачи есть — document_transfer_status = "present", document_list_specificity = "generic".
        - Различай заверение об отсутствии процедуры банкротства и заверение об отсутствии признаков неплатёжеспособности — это близкие, но разные по смыслу заверения.
        - Если фрагменты конфликтуют и не позволяют сделать надёжный вывод, верни "Не удалось определить" для затронутого видимого поля и включи конфликтующие цитаты в evidence.
        - Запрещены значения null, None и пустые строки.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет передачи документов и банкротных заверений.
           → presence = "missing";
             все *_status = "not_defined";
             все *_display = "Не предусмотрена" / "Не установлен" / "Не предусмотрены" / "Не предусмотрено".

        2. Частичное раскрытие.
           Есть обязанность передачи документов, но без конкретного перечня и без банкротных заверений.
           → presence = "present";
             document_transfer_status = "present";
             document_list_specificity = "generic";
             остальные *_status = "not_defined";
             соответствующие *_display = "Предусмотрена" / "Общий" / "Не предусмотрены" / "Не предусмотрено".

        3. Противоречие между фрагментами.
           В разных пунктах договора указаны разные перечни документов или противоречащие заверения.
           → presence = "unclear";
             соответствующие *_status = "not_defined" или "partial";
             соответствующие *_display = "Не удалось определить".

        4. Полный набор.
           Есть передача документов с конкретным перечнем + банкротные заверения + рыночность условий.
           → presence = "present";
             document_transfer_status = "present";
             document_list_specificity = "specific";
             bankruptcy_representations_status = "present";
             market_terms_representation = "present";
             соответствующие *_display = "Предусмотрена" / "Конкретный" / "Предусмотрены" / "Предусмотрено".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для document_transfer_and_bankruptcy_check_presence используй только: "present", "missing", "unclear".
        - Для статусных enum-полей используй только допустимые значения из списка.
        - Fallback при отсутствии данных:
          * document_transfer_display → "Не предусмотрена";
          * document_list_display → "Не установлен";
          * bankruptcy_representations_display → "Не предусмотрены";
          * market_terms_display → "Не предусмотрено".
        - Fallback при противоречии или неоднозначности:
          * все *_display → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "document_transfer_and_bankruptcy_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования о передаче документов и банкротных заверениях. Внутреннее агрегатное signal-поле."
          required: true

        - name: "document_transfer_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["present", "not_defined"]
          description: "Наличие обязательства передать документы (raw enum). Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "document_transfer_display"
          type: "string"
          presentation: "fact"
          label: "Передача документов"
          description: >
            User-facing: Предусмотрена / Не предусмотрена. Fallback: "Не установлено" / "Не удалось определить".
          required: true
          display_in_grid: true
          display_priority: 1

        - name: "document_list_specificity"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["specific", "generic", "not_defined"]
          description: "Конкретизация перечня документов (raw enum). Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "document_list_display"
          type: "string"
          presentation: "fact"
          label: "Перечень документов"
          description: >
            User-facing: Конкретный / Общий / Не установлен. Fallback: "Не установлено" / "Не удалось определить".
          required: true
          display_in_grid: true
          display_priority: 2

        - name: "bankruptcy_representations_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["present", "not_defined"]
          description: "Наличие банкротных заверений клиента (raw enum). Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "bankruptcy_representations_display"
          type: "string"
          presentation: "fact"
          label: "Банкротные заверения клиента"
          description: >
            User-facing: Предусмотрены / Не предусмотрены. Fallback: "Не установлено" / "Не удалось определить".
          required: true
          display_in_grid: true
          display_priority: 3

        - name: "market_terms_representation"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["present", "not_defined"]
          description: "Наличие заверения о рыночности условий (raw enum). Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "market_terms_display"
          type: "string"
          presentation: "fact"
          label: "Заверение о рыночности условий"
          description: >
            User-facing: Предусмотрено / Не предусмотрено. Fallback: "Не установлено" / "Не удалось определить".
          required: true
          display_in_grid: true
          display_priority: 4

        - name: "evidence"
          type: "array"
          presentation: "diagnostic"
          description: "Точные цитаты из договора, подтверждающие извлечённые значения."
          required: true
          display_in_grid: false

      store_payload: true

  - id: debtor_defenses_check
    name: "Возражения должника против требования фактора (ст. 832 ГК РФ)"
    description: >
      Фактографическая проверка заверения клиента об отсутствии у должника
      оснований для возражений и механизма компенсации фактору при
      предъявлении должником возражений.
      Зачёт встречных требований детально проверяется отдельно в
      setoff_and_double_assignment_risk_check.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "возражения должника"
        - "право на возражения"
        - "основания для возражений"
        - "возражения против требования"
        - "компенсация при возражениях"
        - "возмещение убытков при возражениях"
        - "должник не имеет возражений"
        - "должник не вправе возражать"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)возражен(ия|ий|ие)\\s+должник"
        - "(?i)(должник).{0,40}(возраж|оснований).{0,40}(требован|не имеет)"
        - "(?i)(компенсир|возмест).{0,40}возражен"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор факторинга по Главе 43 ГК РФ.
        Проверяется только один вопрос: защита фактора от возражений
        должника против требования.
        Нормативный ориентир:
        - ст. 832 ГК РФ — возражения должника против требования
          финансового агента.
        Важно:
        - Твоя задача — не оценивать серьёзность риска.
        - Только установить, что прямо есть в тексте договора, а чего прямо нет.
        - По ст. 832 ГК РФ должник вправе выдвигать против требования
          фактора те возражения, которые он имел против клиента к моменту
          получения уведомления об уступке. Это включает:
            * зачёт встречных требований;
            * возражения по качеству товара / работ / услуг;
            * возражения по срокам исполнения;
            * возражения по сумме требования;
            * возражения по основанию (недействительность, расторжение).
        - Заверение клиента об отсутствии оснований для возражений и
          обязанность клиента компенсировать фактору последствия
          возражений — два основных механизма защиты фактора.
        - Зачёт встречных требований детально проверяется в отдельном
          check-е setoff_and_double_assignment_risk_check. Здесь отражай
          заверение об отсутствии ВСЕХ оснований для возражений (включая
          зачёт) как одно широкое поле — не выноси зачёт в отдельное
          поле и не дублируй детальный анализ.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Наличие заверения клиента об отсутствии у должника оснований
           для возражений против требования (в широком смысле — любые
           категории возражений, включая зачёт, качество, сроки, сумму).
        2. Наличие обязанности клиента компенсировать фактору убытки /
           потери / иным образом возмещать последствия возражений,
           предъявленных должником.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Если данные не указаны прямо:
           - для status-полей верни "not_defined";
           - для display-полей верни "Не предусмотрено" / "Не установлено"
             по роду.
        4. Запрещены значения: null, None, пустые строки — не используй их
           никогда. Допустимые fallback-значения: "not_defined",
           "Не предусмотрено", "Не установлено".
        5. no_defenses_warranty:
           "present" — в договоре есть прямое заверение клиента об
             отсутствии у должника оснований для возражений (в том числе
             при формулировке через «встречные требования», «не имеет
             возражений», «отсутствуют основания для возражений»);
           "not_defined" — такое заверение в тексте отсутствует.
        6. defenses_compensation_clause:
           "present" — в договоре есть обязанность клиента компенсировать
             фактору убытки / потери / иным образом возместить последствия
             возражений, предъявленных должником против требования;
           "not_defined" — такая обязанность в тексте отсутствует.
        7. Если договор содержит только заверение об отсутствии встречных
           требований к зачёту без более широкого заверения об основаниях
           для возражений — отражай это как no_defenses_warranty = "present"
           (зачёт — частный случай возражений). Детальный анализ зачёта —
           в отдельном check-е.
        8. В evidence включай только дословные цитаты из текста договора.
        9. Верни РОВНО один JSON-объект со всеми 5 ключами без какого-либо
           дополнительного текста до или после. Начни ответ сразу с
           открывающей фигурной скобки и закончи закрывающей. НЕ пиши
           Markdown, списки, код-фенсы. Ответ должен быть валидным JSON,
           пригодным для парсинга через json.loads без предварительной
           обработки.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — широкое заверение + компенсация:
        Фрагмент:
        "Клиент заверяет, что должник не имеет оснований для возражений
        против уступаемого требования, включая возражения по качеству,
        срокам, сумме и встречные требования к зачёту. В случае
        предъявления должником возражений Клиент обязан компенсировать
        Фактору соответствующие убытки в течение 5 рабочих дней."
        Ответ:
        {
          "no_defenses_warranty": "present",
          "no_defenses_warranty_display": "Предусмотрено",
          "defenses_compensation_clause": "present",
          "defenses_compensation_display": "Предусмотрена",
          "evidence": [
            {
              "clause_ref": "п. 6.3",
              "quote": "Клиент заверяет, что должник не имеет оснований для возражений против уступаемого требования, включая возражения по качеству, срокам, сумме и встречные требования к зачёту."
            }
          ]
        }

        Пример 2 — данных в договоре нет:
        Фрагмент:
        "Фактор приобретает требование."
        Ответ:
        {
          "no_defenses_warranty": "not_defined",
          "no_defenses_warranty_display": "Не предусмотрено",
          "defenses_compensation_clause": "not_defined",
          "defenses_compensation_display": "Не предусмотрена",
          "evidence": []
        }

        Пример 3 — текст есть, но вывод частичный
        (есть заверение, но нет компенсации):
        Фрагмент:
        "Клиент заверяет Фактора, что должник не имеет возражений против
        уступаемого требования."
        Ответ:
        {
          "no_defenses_warranty": "present",
          "no_defenses_warranty_display": "Предусмотрено",
          "defenses_compensation_clause": "not_defined",
          "defenses_compensation_display": "Не предусмотрена",
          "evidence": [
            {
              "clause_ref": "п. 6.3",
              "quote": "Клиент заверяет Фактора, что должник не имеет возражений против уступаемого требования."
            }
          ]
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о заверении клиента об отсутствии
           возражений (в том числе через формулировки «встречные
           требования», «не имеет возражений», «отсутствуют основания»).
        2. Найди прямую цитату об обязанности клиента компенсировать
           фактору последствия возражений должника.
        3. Не дублируй детальный анализ зачёта — здесь отражается широкое
           заверение, а зачёт детально проверяется в отдельном check-е.
        4. Согласуй raw enum и display:
           no_defenses_warranty -> no_defenses_warranty_display:
             "present" -> "Предусмотрено";
             "not_defined" -> "Не предусмотрено".
           defenses_compensation_clause -> defenses_compensation_display:
             "present" -> "Предусмотрена";
             "not_defined" -> "Не предусмотрена".
        5. Если прямой цитаты нет — верни "not_defined" для status-полей
           и "Не предусмотрено" / "Не предусмотрена" для display-полей.
        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь РОВНО одним JSON-объектом без какого-либо дополнительного
        текста до или после, со всеми 5 ключами:
        {
          "no_defenses_warranty": "<present / not_defined>",
          "no_defenses_warranty_display": "<Предусмотрено / Не предусмотрено>",
          "defenses_compensation_clause": "<present / not_defined>",
          "defenses_compensation_display": "<Предусмотрена / Не предусмотрена>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 650

    retrieval:
      retrieval_profile: "assignment_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "возражения должника право на возражения основания для возражений возражения против требования заверение отсутствие возражений отсутствие оснований для возражений компенсация при возражениях возмещение убытков при возражениях должник не имеет возражений"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - representations
        - remedies
      negative_keywords:
        - "регресс"
        - "комиссия"
        - "уведомление должника"
        - "банкротство"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.30, 0.75]
        boost: 0.15
        scope: segment
      context_k: 6
      max_chunks: 8
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "representations"
        - "remedies"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.12

    evidence:
      required: true
      min_snippet_length: 35
      max_snippet_length: 550

    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false
      llm_max_tokens: 900

      presence_signal:
        field: "debtor_defenses_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора факторинга
        сведения о защите фактора от возражений должника: широкое
        заверение клиента об отсутствии оснований для возражений и
        обязанность клиента компенсировать последствия возражений.
        Не анализируй регресс, финансирование, банкротство или зачёт
        в деталях — зачёт проверяется в отдельном check-е.
        Заверение об отсутствии встречных требований к зачёту —
        частный случай заверения об отсутствии возражений; отражай
        его в широком поле no_defenses_warranty.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. debtor_defenses_check_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (no_defenses_warranty, defenses_compensation_clause) = "present";
           - "missing" — если оба содержательных поля = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - no_defenses_warranty = "not_defined";
           - defenses_compensation_clause = "not_defined";
           - no_defenses_warranty_display = "Не предусмотрено";
           - defenses_compensation_display = "Не предусмотрена";
           - не выполняй остальные шаги.

        1.  no_defenses_warranty — present / not_defined.
        2.  no_defenses_warranty_display — "Предусмотрено" /
            "Не предусмотрено" (должно соответствовать
            no_defenses_warranty).
        3.  defenses_compensation_clause — present / not_defined.
        4.  defenses_compensation_display — "Предусмотрена" /
            "Не предусмотрена" (должно соответствовать
            defenses_compensation_clause).
        5.  evidence — массив цитат с clause_ref и quote.
        </task>

        <context_rules>
        - Перед остальными полями заполни debtor_defenses_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined", все *_display = "Не предусмотрено" / "Не предусмотрена".
        - Используй только текст договора.
        - Не подставляй нормы закона вместо текста договора.
        - Не дублируй детальный анализ зачёта — здесь отражается широкое заверение, а зачёт детально проверяется в отдельном check-е.
        - Если фрагменты конфликтуют и не позволяют сделать надёжный вывод, верни "Не удалось определить" для затронутого видимого поля и включи конфликтующие цитаты в evidence.
        - Запрещены значения null, None и пустые строки.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет защиты от возражений должника.
           → presence = "missing";
             все *_status = "not_defined";
             все *_display = "Не предусмотрено" / "Не предусмотрена".

        2. Частичная защита.
           Есть только заверение клиента об отсутствии возражений, но нет обязанности компенсировать последствия.
           → presence = "present";
             no_defenses_warranty = "present";
             defenses_compensation_clause = "not_defined";
             соответствующие *_display = "Предусмотрено" / "Не предусмотрена".

        3. Противоречие между фрагментами.
           В разных пунктах договора указаны противоречащие условия защиты.
           → presence = "unclear";
             соответствующие *_status = "not_defined";
             соответствующие *_display = "Не удалось определить".

        4. Полная защита.
           Есть заверение клиента об отсутствии возражений + обязанность компенсировать последствия.
           → presence = "present";
             no_defenses_warranty = "present";
             defenses_compensation_clause = "present";
             соответствующие *_display = "Предусмотрено" / "Предусмотрена".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для debtor_defenses_check_presence используй только: "present", "missing", "unclear".
        - Для статусных enum-полей используй только допустимые значения из списка.
        - Fallback при отсутствии данных:
          * no_defenses_warranty_display → "Не предусмотрено";
          * defenses_compensation_display → "Не предусмотрена".
        - Fallback при противоречии или неоднозначности:
          * все *_display → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "debtor_defenses_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования о защите от возражений должника. Внутреннее агрегатное signal-поле."
          required: true

        - name: "no_defenses_warranty"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["present", "not_defined"]
          description: "Заверение клиента об отсутствии оснований для возражений должника (raw enum). Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "no_defenses_warranty_display"
          type: "string"
          presentation: "fact"
          label: "Заверение об отсутствии возражений должника"
          description: >
            User-facing: Предусмотрено / Не предусмотрено. Fallback: "Не установлено" / "Не удалось определить".
          required: true
          display_in_grid: true
          display_priority: 1

        - name: "defenses_compensation_clause"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["present", "not_defined"]
          description: "Обязанность клиента компенсировать последствия возражений должника (raw enum). Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "defenses_compensation_display"
          type: "string"
          presentation: "fact"
          label: "Компенсация при возражениях должника"
          description: >
            User-facing: Предусмотрена / Не предусмотрена. Fallback: "Не установлено" / "Не удалось определить".
          required: true
          display_in_grid: true
          display_priority: 2

        - name: "evidence"
          type: "array"
          presentation: "diagnostic"
          description: "Точные цитаты из договора, подтверждающие извлечённые значения."
          required: true
          display_in_grid: false

      store_payload: true

  - id: hidden_factoring_protection_check
    name: "Скрытый факторинг: механизмы защиты фактора"
    description: >
      Фактографическая проверка наличия механизмов перевода средств фактору
      при скрытом факторинге: обязанность перечисления, сроки, специальный счёт,
      отчётность, право фактора уведомить должника.
    triggers:
      any: ["hidden_factoring"]
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "скрытый факторинг"
        - "конфиденциальный факторинг"
        - "перечислить фактору"
        - "специальный счёт"
        - "отчётность перед фактором"
        - "без уведомления должника"
        - "право уведомить должника"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)перечисл(ить|ение|яет).*фактор"
        - "(?i)специальн(ый|ого)\\s+счёт"
        - "(?i)право.{0,30}уведомить\\s+должник"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор скрытого (конфиденциального) факторинга
        по Главе 43 ГК РФ.
        Проверяется только один вопрос: механизмы защиты фактора
        при скрытом факторинге.
        Нормативный ориентир:
        - ст. 830 ГК РФ — исполнение должником (должник платит клиенту
          до получения уведомления об уступке).
        Важно:
        - Твоя задача — не оценивать серьёзность риска.
        - Только установить, что прямо есть в тексте договора, а чего прямо нет.
        - При скрытом факторинге должник не уведомляется, платит клиенту,
          а клиент перечисляет полученное фактору. Защита фактора строится
          из набора механизмов:
            * обязанность клиента перечислить полученное;
            * конкретный срок перечисления (чем короче — тем сильнее защита);
            * требование специального счёта (чтобы средства не смешивались);
            * отчётность клиента перед фактором;
            * право фактора уведомить должника при нарушениях клиента
              (переход от скрытого к открытому факторингу).
        - Право фактора уведомить должника при нарушении — это
          специфический escape mechanism, отличающийся от обычного
          уведомления об уступке. Отражай его отдельно.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Обязанность клиента перечислить полученное от должника фактору.
        2. Конкретный срок перечисления.
        3. Требование специального счёта.
        4. Отчётность клиента перед фактором.
        5. Право фактора уведомить должника при нарушении клиентом своих
           обязанностей.
        6. Составь краткую user-facing сводку механизмов защиты
           и определи уровень защиты.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Если данные не указаны прямо:
           - для status-полей верни "not_defined";
           - для protection_level верни "absent", если ни одного механизма
             нет, иначе — по правилу 8;
           - для текстовых display-полей верни "Не установлен" /
             "Не установлена" / "Не установлено" / "Отсутствует" по роду.
        4. Запрещены значения: null, None, пустые строки — не используй их
           никогда. Допустимые fallback-значения: "not_defined", "absent",
           "Не установлен", "Не установлена", "Не установлено",
           "Отсутствует".
        5. funds_transfer_obligation:
           "present" — есть прямая обязанность клиента перечислить
             фактору полученное от должника;
           "not_defined" — такая обязанность в тексте отсутствует.
        6. transfer_deadline:
           "specified" — указан конкретный срок перечисления
             (например, «в течение 1 рабочего дня», «не позднее 3 банковских
             дней»);
           "not_defined" — срок не указан.
        7. special_account_requirement / reporting_obligation /
           factor_right_to_notify_debtor:
           "present" — соответствующий механизм предусмотрен прямо;
           "not_defined" — механизм отсутствует.
        8. protection_level (производное от числа присутствующих
           механизмов):
           "strong" — присутствуют 5–6 механизмов;
           "medium" — присутствуют 3–4 механизма;
           "weak" — присутствуют 1–2 механизма;
           "absent" — механизмов нет вовсе.
        9. protection_summary — одна строка, формат:
           "Перечисление: <да/нет>; Срок: <...>; Спецсчёт: <да/нет>;
           Отчётность: <...>; Право уведомить должника: <да/нет>".
           Для отсутствующих параметров — «нет» / «Не установлен».
        10. В evidence включай только дословные цитаты из текста договора.
        11. Верни РОВНО один JSON-объект со всеми 9 ключами без какого-либо
            дополнительного текста до или после. Начни ответ сразу с
            открывающей фигурной скобки и закончи закрывающей. НЕ пиши
            Markdown, списки, код-фенсы. Ответ должен быть валидным JSON,
            пригодным для парсинга через json.loads без предварительной
            обработки.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — все механизмы присутствуют:
        Фрагмент:
        "Клиент обязан перечислить Фактору все суммы, полученные от должника,
        в течение 1 рабочего дня на специальный счёт Фактора. Клиент
        представляет еженедельную отчётность по форме Приложения № 4. При
        нарушении Клиентом срока перечисления Фактор вправе уведомить
        должника об уступке, после чего должник обязан платить Фактору."
        Ответ:
        {
          "funds_transfer_obligation": "present",
          "transfer_deadline": "specified",
          "special_account_requirement": "present",
          "reporting_obligation": "present",
          "factor_right_to_notify_debtor": "present",
          "protection_level": "strong",
          "protection_level_display": "Сильный",
          "protection_summary": "Перечисление: да; Срок: 1 рабочий день; Спецсчёт: да; Отчётность: еженедельная; Право уведомить должника: да",
          "evidence": [
            {
              "clause_ref": "п. 8.1",
              "quote": "Клиент обязан перечислить Фактору все суммы, полученные от должника, в течение 1 рабочего дня на специальный счёт Фактора."
            }
          ]
        }

        Пример 2 — данных в договоре нет:
        Фрагмент:
        "Факторинг является конфиденциальным."
        Ответ:
        {
          "funds_transfer_obligation": "not_defined",
          "transfer_deadline": "not_defined",
          "special_account_requirement": "not_defined",
          "reporting_obligation": "not_defined",
          "factor_right_to_notify_debtor": "not_defined",
          "protection_level": "absent",
          "protection_level_display": "Отсутствует",
          "protection_summary": "Перечисление: нет; Срок: Не установлен; Спецсчёт: нет; Отчётность: Не установлена; Право уведомить должника: нет",
          "evidence": [
            {
              "clause_ref": "п. 8.1",
              "quote": "Факторинг является конфиденциальным."
            }
          ]
        }

        Пример 3 — текст есть, но вывод частичный (только перечисление
        без конкретного срока и без спецсчёта):
        Фрагмент:
        "Клиент обязуется перечислять Фактору полученные от должника суммы
        в порядке, согласованном Сторонами дополнительно."
        Ответ:
        {
          "funds_transfer_obligation": "present",
          "transfer_deadline": "not_defined",
          "special_account_requirement": "not_defined",
          "reporting_obligation": "not_defined",
          "factor_right_to_notify_debtor": "not_defined",
          "protection_level": "weak",
          "protection_level_display": "Слабый",
          "protection_summary": "Перечисление: да; Срок: Не установлен; Спецсчёт: нет; Отчётность: Не установлена; Право уведомить должника: нет",
          "evidence": [
            {
              "clause_ref": "п. 8.1",
              "quote": "Клиент обязуется перечислять Фактору полученные от должника суммы в порядке, согласованном Сторонами дополнительно."
            }
          ]
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату об обязанности перечисления.
        2. Найди прямую цитату о конкретном сроке перечисления (если есть).
        3. Найди прямую цитату о специальном счёте.
        4. Найди прямую цитату об отчётности.
        5. Найди прямую цитату о праве фактора уведомить должника
           при нарушении.
        6. Проверь: если механизм присутствует, но без конкретики
           («в порядке, согласованном Сторонами») — соответствующий
           status = "not_defined", а не "present".
        7. Пересчитай protection_level по числу механизмов, отражённых
           как "present", и согласуй с protection_summary:
             5–6 -> "strong";
             3–4 -> "medium";
             1–2 -> "weak";
             0   -> "absent".
        8. Согласуй raw enum и display:
           protection_level -> protection_level_display:
             "strong" -> "Сильный";
             "medium" -> "Средний";
             "weak" -> "Слабый";
             "absent" -> "Отсутствует".
        9. Если прямой цитаты нет — верни "not_defined" для status-полей
           и соответствующий fallback для display-полей.
        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь РОВНО одним JSON-объектом без какого-либо дополнительного
        текста до или после, со всеми 9 ключами:
        {
          "funds_transfer_obligation": "<present / not_defined>",
          "transfer_deadline": "<specified / not_defined>",
          "special_account_requirement": "<present / not_defined>",
          "reporting_obligation": "<present / not_defined>",
          "factor_right_to_notify_debtor": "<present / not_defined>",
          "protection_level": "<strong / medium / weak / absent>",
          "protection_level_display": "<Сильный / Средний / Слабый / Отсутствует>",
          "protection_summary": "<сводка одной строкой>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 8
      temperature: 0.0
      max_tokens: 800

    retrieval:
      retrieval_profile: "assignment_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "скрытый факторинг конфиденциальный факторинг перечислить фактору полученные от должника суммы срок перечисления специальный счёт отчётность клиента право фактора уведомить должника переход к открытому факторингу без уведомления должника"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - procedures
      negative_keywords:
        - "регресс"
        - "комиссия"
        - "банкротство"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.30, 0.80]
        boost: 0.15
        scope: segment
      context_k: 8
      max_chunks: 10
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "obligations"
        - "procedures"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.12

    evidence:
      required: true
      min_snippet_length: 35
      max_snippet_length: 500

    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false
      llm_max_tokens: 1200

      presence_signal:
        field: "hidden_factoring_protection_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора скрытого
        факторинга механизмы защиты фактора: обязанность перечисления,
        конкретный срок, специальный счёт, отчётность клиента, право
        фактора уведомить должника при нарушении.
        Не анализируй регресс, комиссию или банкротство.
        Право фактора уведомить должника при нарушении — специфический
        escape mechanism, отличай его от обычного уведомления об уступке.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. hidden_factoring_protection_check_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если protection_level ∈ {strong, medium, weak};
           - "missing" — если protection_level = "absent";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - funds_transfer_obligation = "not_defined";
           - transfer_deadline = "not_defined";
           - special_account_requirement = "not_defined";
           - reporting_obligation = "not_defined";
           - factor_right_to_notify_debtor = "not_defined";
           - protection_level = "absent";
           - protection_level_display = "Отсутствует";
           - protection_summary = "Перечисление: нет; Срок: Не установлен; Спецсчёт: нет; Отчётность: Не установлена; Право уведомить должника: нет";
           - не выполняй остальные шаги.

        1.  funds_transfer_obligation — present / not_defined.
        2.  transfer_deadline — specified / not_defined.
        3.  special_account_requirement — present / not_defined.
        4.  reporting_obligation — present / not_defined.
        5.  factor_right_to_notify_debtor — present / not_defined.
        6.  protection_level — strong / medium / weak / absent.
        7.  protection_level_display — "Сильный" / "Средний" / "Слабый" /
            "Отсутствует" (должно соответствовать protection_level).
        8.  protection_summary — сводка одной строкой по формату:
            "Перечисление: <да/нет>; Срок: <...>; Спецсчёт: <да/нет>;
            Отчётность: <...>; Право уведомить должника: <да/нет>".
        9.  evidence — массив цитат с clause_ref и quote.
        </task>

        <context_rules>
        - Перед остальными полями заполни hidden_factoring_protection_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined", protection_level = "absent", protection_summary = "Перечисление: нет; Срок: Не установлен; Спецсчёт: нет; Отчётность: Не установлена; Право уведомить должника: нет".
        - Используй только текст договора.
        - Не подставляй нормы закона вместо текста договора.
        - Если механизм присутствует, но без конкретики («в порядке, согласованном Сторонами») — соответствующий status = "not_defined", а не "present".
        - Право фактора уведомить должника при нарушении — специфический escape mechanism, отличай его от обычного уведомления об уступке.
        - Если фрагменты конфликтуют и не позволяют сделать надёжный вывод, верни "Не удалось определить" для затронутого видимого поля и включи конфликтующие цитаты в evidence.
        - Запрещены значения null, None и пустые строки.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет механизмов защиты фактора при скрытом факторинге.
           → presence = "missing";
             все *_status = "not_defined";
             protection_level = "absent";
             protection_summary = "Перечисление: нет; Срок: Не установлен; Спецсчёт: нет; Отчётность: Не установлена; Право уведомить должника: нет".

        2. Частичная защита.
           Есть только обязанность перечисления, но без конкретного срока и без спецсчёта.
           → presence = "present";
             funds_transfer_obligation = "present";
             остальные *_status = "not_defined";
             protection_level = "weak";
             protection_summary = "Перечисление: да; Срок: Не установлен; Спецсчёт: нет; Отчётность: Не установлена; Право уведомить должника: нет".

        3. Противоречие между фрагментами.
           В разных пунктах договора указаны противоречащие условия защиты.
           → presence = "unclear";
             соответствующие *_status = "not_defined";
             protection_level = "weak" или "absent";
             protection_summary = "Не удалось определить".

        4. Полная защита.
           Все механизмы присутствуют: перечисление, срок, спецсчёт, отчётность, право уведомить должника.
           → presence = "present";
             все *_status = "present" или "specified";
             protection_level = "strong";
             protection_summary = "Перечисление: да; Срок: <...>; Спецсчёт: да; Отчётность: <...>; Право уведомить должника: да".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для hidden_factoring_protection_check_presence используй только: "present", "missing", "unclear".
        - Для статусных enum-полей используй только допустимые значения из списка.
        - Fallback при отсутствии данных:
          * protection_level_display → "Отсутствует";
          * protection_summary → "Перечисление: нет; Срок: Не установлен; Спецсчёт: нет; Отчётность: Не установлена; Право уведомить должника: нет".
        - Fallback при противоречии или неоднозначности:
          * protection_summary → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "hidden_factoring_protection_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования о защите фактора при скрытом факторинге. Внутреннее агрегатное signal-поле."
          required: true

        - name: "funds_transfer_obligation"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["present", "not_defined"]
          description: "Обязанность перечислить средства фактору (raw enum). Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "transfer_deadline"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["specified", "not_defined"]
          description: "Наличие конкретного срока перечисления (raw enum). Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "special_account_requirement"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["present", "not_defined"]
          description: "Требование специального счёта (raw enum). Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "reporting_obligation"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["present", "not_defined"]
          description: "Отчётность клиента перед фактором (raw enum). Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "factor_right_to_notify_debtor"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["present", "not_defined"]
          description: "Право фактора уведомить должника при нарушении (raw enum). Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "protection_level"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["strong", "medium", "weak", "absent"]
          description: "Уровень защиты фактора при скрытом факторинге (raw enum). Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "protection_level_display"
          type: "string"
          presentation: "fact"
          label: "Уровень защиты фактора"
          description: >
            User-facing: Сильный / Средний / Слабый / Отсутствует. Fallback: "Не установлено" / "Не удалось определить".
          required: true
          display_in_grid: true
          display_priority: 1

        - name: "protection_summary"
          type: "string"
          presentation: "fact"
          label: "Сводка механизмов защиты"
          description: >
            Компактная сводка по всем механизмам защиты. Fallback: "Не установлено" / "Не удалось определить".
          required: true
          display_in_grid: true
          display_priority: 2

        - name: "evidence"
          type: "array"
          presentation: "diagnostic"
          description: "Точные цитаты из договора, подтверждающие извлечённые значения."
          required: true
          display_in_grid: false

      store_payload: true

  - id: claim_validity_warranties_check
    name: "Гарантии действительности уступаемого требования (ст. 827 ГК РФ)"
    description: >
      Фактографическая проверка заверений клиента о действительности требования:
      существование, непогашенность, отсутствие оспаривания, действительность
      основного договора, выполнение поставки/услуг, возмещение при недействительности.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "действительность требования"
        - "клиент гарантирует"
        - "клиент заверяет"
        - "требование существует"
        - "не погашено"
        - "не оспорено"
        - "не оспаривается"
        - "основной договор действителен"
        - "товар поставлен"
        - "услуги оказаны"
        - "возмещение при недействительности"
        - "выкуп требования"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)клиент.*(гарантирует|заверяет)"
        - "(?i)требовани[ея].*(существ|действительн|не погашен|не оспар)"
        - "(?i)(выкуп|возмест|возврат).{0,40}(недействительн|требовани)"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор факторинга по Главе 43 ГК РФ.
        Проверяется только один вопрос: заверения клиента о действительности
        уступаемого требования.
        Нормативный ориентир:
        - ст. 827 ГК РФ — ответственность клиента перед фактором
          (диспозитивная норма — может быть ограничена договором).
        Важно:
        - Твоя задача — не оценивать серьёзность риска.
        - Только установить, что прямо есть в тексте договора, а чего прямо нет.
        - Различай:
            * «оспаривание» — судебное оспаривание требования или основного
              договора (иск о недействительности, признание сделки
              недействительной). Это — not_contested_warranty.
            * «возражения должника по ст. 832» — это отдельная тема,
              проверяется в debtor_defenses_check. Здесь её не дублируй.
        - «Возмещение при недействительности» может быть сформулировано
          как «возместить убытки», «выкупить требование по цене
          приобретения», «вернуть финансирование» — все эти формулировки
          отражай как indemnity_for_invalid_claim = "present".

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Наличие заверения о действительности требования.
        2. Наличие заверения о существовании требования.
        3. Наличие заверения о непогашенности.
        4. Наличие заверения об отсутствии оспаривания (в суде).
        5. Наличие заверения о действительности основного договора.
        6. Наличие заверения о выполнении поставки / оказании услуг /
           подписании актов.
        7. Наличие обязанности клиента возместить фактору при
           недействительности требования.
        8. Составь краткую сводку по всем заверениям и определи полноту.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Если данные не указаны прямо:
           - для status-полей верни "not_defined";
           - для warranties_completeness верни "absent", если ни одного
             заверения нет, иначе — по правилу 9;
           - для display-полей верни "Не установлено" / "Отсутствуют"
             по роду.
        4. Запрещены значения: null, None, пустые строки — не используй их
           никогда. Допустимые fallback-значения: "not_defined", "absent",
           "Не установлено", "Отсутствуют".
        5. existence_warranty / not_discharged_warranty /
           not_contested_warranty / underlying_contract_validity /
           delivery_completion_warranty / indemnity_for_invalid_claim:
           "present" — соответствующее заверение прямо выражено в тексте;
           "not_defined" — заверение отсутствует.
        6. not_contested_warranty — про судебное оспаривание требования
           или основного договора. Возражения должника по ст. 832 сюда
           не относятся (они в debtor_defenses_check).
        7. delivery_completion_warranty: "present", если прямо указано,
           что товар поставлен / услуги оказаны / работы выполнены /
           акты подписаны / обязательства клиента по основному договору
           исполнены.
        8. indemnity_for_invalid_claim: "present", если в договоре есть
           обязанность клиента возместить убытки / выкупить требование /
           вернуть финансирование в случае недействительности требования.
        9. warranties_completeness (производное от числа "present"
           заверений из полей 5):
           "comprehensive" — присутствуют 5–6 заверений;
           "partial" — присутствуют 3–4 заверения;
           "minimal" — присутствуют 1–2 заверения;
           "absent" — заверений нет.
        10. warranties_summary — одна строка, формат:
            "Существование: <да/нет>; Непогашенность: <да/нет>;
            Отсутствие оспаривания: <да/нет>; Основной договор: <да/нет>;
            Поставка/услуги: <да/нет>; Возмещение: <да/нет>".
            Для отсутствующих параметров — «нет».
        11. В evidence включай только дословные цитаты из текста договора.
        12. Верни РОВНО один JSON-объект со всеми 11 ключами без какого-либо
            дополнительного текста до или после. Начни ответ сразу с
            открывающей фигурной скобки и закончи закрывающей. НЕ пиши
            Markdown, списки, код-фенсы. Ответ должен быть валидным JSON,
            пригодным для парсинга через json.loads без предварительной
            обработки.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — полный набор заверений:
        Фрагмент:
        "Клиент гарантирует, что требование существует, действительно,
        не погашено, не оспаривается в суде, основной договор действует,
        товар поставлен в полном объёме и принят должником. При
        недействительности требования Клиент возмещает Фактору все убытки."
        Ответ:
        {
          "validity_warranty_present": "yes",
          "existence_warranty": "present",
          "not_discharged_warranty": "present",
          "not_contested_warranty": "present",
          "underlying_contract_validity": "present",
          "delivery_completion_warranty": "present",
          "indemnity_for_invalid_claim": "present",
          "warranties_completeness": "comprehensive",
          "warranties_completeness_display": "Комплексные",
          "warranties_summary": "Существование: да; Непогашенность: да; Отсутствие оспаривания: да; Основной договор: да; Поставка/услуги: да; Возмещение: да",
          "evidence": [
            {
              "clause_ref": "п. 9.1",
              "quote": "Клиент гарантирует, что требование существует, действительно, не погашено, не оспаривается в суде, основной договор действует, товар поставлен в полном объёме и принят должником."
            }
          ]
        }

        Пример 2 — данных в договоре нет:
        Фрагмент:
        "Клиент уступает требование Фактору."
        Ответ:
        {
          "validity_warranty_present": "no",
          "existence_warranty": "not_defined",
          "not_discharged_warranty": "not_defined",
          "not_contested_warranty": "not_defined",
          "underlying_contract_validity": "not_defined",
          "delivery_completion_warranty": "not_defined",
          "indemnity_for_invalid_claim": "not_defined",
          "warranties_completeness": "absent",
          "warranties_completeness_display": "Отсутствуют",
          "warranties_summary": "Существование: нет; Непогашенность: нет; Отсутствие оспаривания: нет; Основной договор: нет; Поставка/услуги: нет; Возмещение: нет",
          "evidence": []
        }

        Пример 3 — текст есть, но вывод частичный
        (есть основные заверения, но нет возмещения при недействительности):
        Фрагмент:
        "Клиент гарантирует, что уступаемое требование существует,
        не погашено и не оспаривается в суде."
        Ответ:
        {
          "validity_warranty_present": "yes",
          "existence_warranty": "present",
          "not_discharged_warranty": "present",
          "not_contested_warranty": "present",
          "underlying_contract_validity": "not_defined",
          "delivery_completion_warranty": "not_defined",
          "indemnity_for_invalid_claim": "not_defined",
          "warranties_completeness": "partial",
          "warranties_completeness_display": "Частичные",
          "warranties_summary": "Существование: да; Непогашенность: да; Отсутствие оспаривания: да; Основной договор: нет; Поставка/услуги: нет; Возмещение: нет",
          "evidence": [
            {
              "clause_ref": "п. 9.1",
              "quote": "Клиент гарантирует, что уступаемое требование существует, не погашено и не оспаривается в суде."
            }
          ]
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о действительности требования.
        2. Найди прямую цитату о существовании.
        3. Найди прямую цитату о непогашенности.
        4. Найди прямую цитату об отсутствии судебного оспаривания.
        5. Найди прямую цитату о действительности основного договора.
        6. Найди прямую цитату о выполнении поставки / оказании услуг.
        7. Найди прямую цитату о возмещении при недействительности.
        8. Разграничь: «оспаривание» — это про суд; «возражения» —
           это про ст. 832 (проверяются в другом check-е).
        9. Пересчитай warranties_completeness по числу заверений,
           отражённых как "present":
             5–6 -> "comprehensive";
             3–4 -> "partial";
             1–2 -> "minimal";
             0   -> "absent".
        10. Согласуй raw enum и display:
            warranties_completeness -> warranties_completeness_display:
              "comprehensive" -> "Комплексные";
              "partial" -> "Частичные";
              "minimal" -> "Минимальные";
              "absent" -> "Отсутствуют".
        11. Если прямой цитаты нет — верни "not_defined" для status-полей
            и соответствующий fallback для display-полей.
        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь РОВНО одним JSON-объектом без какого-либо дополнительного
        текста до или после, со всеми 11 ключами:
        {
          "validity_warranty_present": "<yes / no>",
          "existence_warranty": "<present / not_defined>",
          "not_discharged_warranty": "<present / not_defined>",
          "not_contested_warranty": "<present / not_defined>",
          "underlying_contract_validity": "<present / not_defined>",
          "delivery_completion_warranty": "<present / not_defined>",
          "indemnity_for_invalid_claim": "<present / not_defined>",
          "warranties_completeness": "<comprehensive / partial / minimal / absent>",
          "warranties_completeness_display": "<Комплексные / Частичные / Минимальные / Отсутствуют>",
          "warranties_summary": "<сводка одной строкой>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 8
      temperature: 0.0
      max_tokens: 900

    retrieval:
      retrieval_profile: "warranties_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "действительность требования клиент гарантирует клиент заверяет требование существует требование не погашено требование не оспаривается в суде основной договор действителен товар поставлен услуги оказаны акты подписаны возмещение при недействительности выкуп требования возврат финансирования убытки"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - representations
        - obligations
      negative_keywords:
        - "регресс"
        - "комиссия"
        - "уведомление должника"
        - "банкротство"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.30, 0.80]
        boost: 0.15
        scope: segment
      context_k: 8
      max_chunks: 10
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "representations"
        - "obligations"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.12

    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 600

    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false
      llm_max_tokens: 1400

      presence_signal:
        field: "claim_validity_warranties_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора факторинга
        заверения клиента о действительности уступаемого требования.
        Не анализируй регресс, финансирование или уведомление должника.
        Различай:
          - «оспаривание» — судебное оспаривание требования или основного
            договора (иск, признание недействительности);
          - «возражения должника по ст. 832» — отдельная тема, здесь
            её не дублируй.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. claim_validity_warranties_check_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (existence_warranty, not_discharged_warranty, not_contested_warranty,
              underlying_contract_validity, delivery_completion_warranty,
              indemnity_for_invalid_claim) = "present";
           - "missing" — если все шесть содержательных полей = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - validity_warranty_present = "no";
           - existence_warranty = "not_defined";
           - not_discharged_warranty = "not_defined";
           - not_contested_warranty = "not_defined";
           - underlying_contract_validity = "not_defined";
           - delivery_completion_warranty = "not_defined";
           - indemnity_for_invalid_claim = "not_defined";
           - warranties_completeness = "absent";
           - warranties_completeness_display = "Отсутствуют";
           - warranties_summary = "Существование: нет; Непогашенность: нет; Отсутствие оспаривания: нет; Основной договор: нет; Поставка/услуги: нет; Возмещение: нет";
           - не выполняй остальные шаги.

        1.  validity_warranty_present — yes / no.
        2.  existence_warranty — present / not_defined.
        3.  not_discharged_warranty — present / not_defined.
        4.  not_contested_warranty — present / not_defined.
        5.  underlying_contract_validity — present / not_defined.
        6.  delivery_completion_warranty — present / not_defined.
        7.  indemnity_for_invalid_claim — present / not_defined.
        8.  warranties_completeness — comprehensive / partial / minimal / absent.
        9.  warranties_completeness_display — "Комплексные" / "Частичные" /
            "Минимальные" / "Отсутствуют" (должно соответствовать
            warranties_completeness).
        10. warranties_summary — сводка одной строкой по формату:
            "Существование: <да/нет>; Непогашенность: <да/нет>;
            Отсутствие оспаривания: <да/нет>; Основной договор: <да/нет>;
            Поставка/услуги: <да/нет>; Возмещение: <да/нет>".
        11. evidence — массив цитат с clause_ref и quote.
        </task>

        <context_rules>
        - Перед остальными полями заполни claim_validity_warranties_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_warranty = "not_defined", validity_warranty_present = "no", warranties_completeness = "absent", warranties_summary = "Существование: нет; Непогашенность: нет; Отсутствие оспаривания: нет; Основной договор: нет; Поставка/услуги: нет; Возмещение: нет".
        - Используй только текст договора.
        - warranties_completeness производный от числа "present" заверений: 5–6 -> "comprehensive"; 3–4 -> "partial"; 1–2 -> "minimal"; 0 -> "absent".
        - not_contested_warranty — только про судебное оспаривание. Возражения должника по ст. 832 в это поле не включай.
        - delivery_completion_warranty — "present", если прямо указано, что товар поставлен / услуги оказаны / работы выполнены / акты подписаны.
        - indemnity_for_invalid_claim — "present", если есть обязанность клиента возместить убытки / выкупить требование / вернуть финансирование при недействительности.
        - Если фрагменты конфликтуют и не позволяют сделать надёжный вывод, верни "Не удалось определить" для затронутого видимого поля и включи конфликтующие цитаты в evidence.
        - Запрещены значения null, None и пустые строки.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет заверений о действительности требования.
           → presence = "missing";
             все *_warranty = "not_defined";
             warranties_completeness = "absent";
             warranties_summary = "Существование: нет; Непогашенность: нет; Отсутствие оспаривания: нет; Основной договор: нет; Поставка/услуги: нет; Возмещение: нет".

        2. Частичное раскрытие.
           Есть заверение о существовании и непогашенности, но нет возмещения при недействительности.
           → presence = "present";
             existence_warranty = not_discharged_warranty = "present";
             indemnity_for_invalid_claim = "not_defined";
             warranties_completeness = "partial";
             warranties_summary = "Существование: да; Непогашенность: да; Отсутствие оспаривания: нет; Основной договор: нет; Поставка/услуги: нет; Возмещение: нет".

        3. Противоречие между фрагментами.
           В разных пунктах договора указаны противоречащие условия о действительности требования.
           → presence = "unclear";
             соответствующие *_warranty = "not_defined";
             warranties_summary = "Не удалось определить".

        4. Полный набор заверений.
           Присутствуют все 6 заверений, включая возмещение при недействительности.
           → presence = "present";
             все *_warranty = "present";
             warranties_completeness = "comprehensive";
             warranties_summary = "Существование: да; Непогашенность: да; Отсутствие оспаривания: да; Основной договор: да; Поставка/услуги: да; Возмещение: да".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для claim_validity_warranties_check_presence используй только: "present", "missing", "unclear".
        - Для статусных enum-полей используй только допустимые значения из списка.
        - Fallback при отсутствии данных:
          * warranties_completeness_display → "Отсутствуют";
          * warranties_summary → "Существование: нет; Непогашенность: нет; Отсутствие оспаривания: нет; Основной договор: нет; Поставка/услуги: нет; Возмещение: нет".
        - Fallback при противоречии или неоднозначности:
          * warranties_summary → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "claim_validity_warranties_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования о гарантиях действительности требования. Внутреннее агрегатное signal-поле."
          required: true

        - name: "validity_warranty_present"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["yes", "no"]
          description: "Наличие заверения о действительности требования (raw enum). Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "existence_warranty"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["present", "not_defined"]
          description: "Заверение о существовании требования (raw enum). Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "not_discharged_warranty"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["present", "not_defined"]
          description: "Заверение о непогашенности (raw enum). Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "not_contested_warranty"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["present", "not_defined"]
          description: "Заверение об отсутствии судебного оспаривания (raw enum). Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "underlying_contract_validity"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["present", "not_defined"]
          description: "Заверение о действительности основного договора (raw enum). Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "delivery_completion_warranty"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["present", "not_defined"]
          description: "Заверение о выполнении поставки/услуг (raw enum). Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "indemnity_for_invalid_claim"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["present", "not_defined"]
          description: "Возмещение при недействительности требования (raw enum). Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "warranties_completeness"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["comprehensive", "partial", "minimal", "absent"]
          description: "Полнота заверений клиента (raw enum). Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "warranties_completeness_display"
          type: "string"
          presentation: "fact"
          label: "Полнота гарантий"
          description: >
            User-facing: Комплексные / Частичные / Минимальные / Отсутствуют. Fallback: "Не установлено" / "Не удалось определить".
          required: true
          display_in_grid: true
          display_priority: 1

        - name: "warranties_summary"
          type: "string"
          presentation: "fact"
          label: "Сводка заверений"
          description: >
            Компактная сводка по всем заверениям. Fallback: "Не установлено" / "Не удалось определить".
          required: true
          display_in_grid: true
          display_priority: 2

        - name: "evidence"
          type: "array"
          presentation: "diagnostic"
          description: "Точные цитаты из договора, подтверждающие извлечённые значения."
          required: true
          display_in_grid: false

      store_payload: true

  - id: excess_collection_return
    name: "Возврат клиенту излишка, полученного от должника (ст. 831 ГК РФ)"
    description: >
      Проверка механизма возврата клиенту суммы сверх финансирования
      и вознаграждения фактора: наличие обязанности, срок возврата,
      очерёдность зачётов, судьба излишка при регрессе, отсылка к тарифам.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "возврат излишка"
        - "разница подлежит возврату клиенту"
        - "сумма, превышающая финансирование"
        - "остаток перечисляется клиенту"
        - "излишне полученные суммы"
        - "остаток после удержания"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)превыша(ет|ющая).*финансирован"
        - "(?i)возврат.*клиент"
        - "(?i)(остаток|разниц|излиш).{0,40}(возврат|перечисл|клиент)"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор факторинга по Главе 43 ГК РФ.
        Проверяется только один вопрос: механизм возврата клиенту излишка,
        полученного от должника сверх финансирования и вознаграждения.
        Нормативный ориентир:
        - ст. 831 ГК РФ — распределение сумм, полученных фактором
          от должника; возврат клиенту остатка.
        Важно:
        - Твоя задача — не оценивать серьёзность риска.
        - Только установить, что прямо есть в тексте договора, а чего прямо нет.
        - Возврат излишка может быть сформулирован по-разному:
          «возврат излишка», «разница подлежит возврату клиенту»,
          «остаток перечисляется клиенту», «излишне полученные суммы
          возвращаются», «сумма, превышающая финансирование и комиссию».
          Все эти формулировки — валидные.
        - Отсылка «в порядке, предусмотренном Тарифами» — валидный
          способ установить механизм возврата. Отражай это как present
          с оговоркой в summary.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Наличие обязанности фактора вернуть клиенту излишек.
        2. Конкретный срок возврата (если указан).
        3. Определена ли очерёдность зачётов (что удерживается сначала:
           финансирование, комиссия, неустойка, излишек клиенту).
        4. Судьба излишка при регрессе (если применимо — что происходит
           с излишком после удовлетворения регрессных требований фактора).
        5. Отсылка к тарифам / приложению как способу установить порядок
           возврата.
        6. Составь краткую user-facing сводку по механизму.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Если данные не указаны прямо:
           - для status-полей верни "not_defined";
           - для текстовых display-полей верни "Не установлено" /
             "Не установлена" / "Не установлен" / "Не применимо"
             по роду.
        4. Запрещены значения: null, None, пустые строки — не используй их
           никогда. Допустимые fallback-значения: "not_defined",
           "Не установлено", "Не установлена", "Не установлен",
           "Не применимо".
        5. excess_return_presence:
           "present" — в договоре есть механизм возврата клиенту излишка
             (прямая формулировка или отсылка к тарифам / приложению);
           "not_defined" — механизм в тексте отсутствует.
        6. return_deadline_status:
           "specified" — указан конкретный срок возврата
             (например, «в течение 5 рабочих дней»);
           "not_defined" — срок не указан.
        7. offset_order_clarity:
           "clear" — прямо определена очерёдность удержаний из суммы,
             полученной от должника (например: «сначала удерживается
             финансирование и комиссия, остаток возвращается клиенту»);
           "unclear" — очерёдность определена частично или противоречиво;
           "not_defined" — очерёдность в тексте не определена.
        8. recovery_in_recourse:
           "present" — есть правило о судьбе излишка при регрессе
             (например, «излишек направляется на погашение регрессных
             требований фактора, остаток возвращается клиенту»);
           "not_defined" — правило отсутствует.
        9. reference_to_tariffs:
           "present" — порядок возврата установлен через отсылку к
             тарифам / приложению / иному документу;
           "not_defined" — отсылки нет.
        10. excess_return_summary — одна строка, формат:
            "Возврат: <да/нет>; Срок: <...>; Очерёдность: <...>;
            При регрессе: <...>; Отсылка к тарифам: <да/нет>".
            Для отсутствующих параметров — «нет» / «Не установлен».
        11. В evidence включай только дословные цитаты из текста договора.
        12. Верни РОВНО один JSON-объект со всеми 9 ключами без какого-либо
            дополнительного текста до или после. Начни ответ сразу с
            открывающей фигурной скобки и закончи закрывающей. НЕ пиши
            Markdown, списки, код-фенсы. Ответ должен быть валидным JSON,
            пригодным для парсинга через json.loads без предварительной
            обработки.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — полный механизм возврата:
        Фрагмент:
        "Суммы, полученные Фактором от должника сверх суммы финансирования
        и вознаграждения Фактора, подлежат возврату Клиенту в течение
        5 рабочих дней с даты их поступления. Удержания производятся в
        следующей очерёдности: сначала — сумма финансирования, затем —
        вознаграждение Фактора, затем — неустойка (при наличии), остаток
        возвращается Клиенту."
        Ответ:
        {
          "excess_return_presence": "present",
          "excess_return_display": "Предусмотрен",
          "return_deadline_status": "specified",
          "return_deadline_display": "5 рабочих дней",
          "offset_order_clarity": "clear",
          "recovery_in_recourse": "not_defined",
          "reference_to_tariffs": "not_defined",
          "excess_return_summary": "Возврат: да; Срок: 5 рабочих дней; Очерёдность: определена (финансирование -> вознаграждение -> неустойка -> остаток клиенту); При регрессе: Не установлено; Отсылка к тарифам: нет",
          "evidence": [
            {
              "clause_ref": "п. 3.5",
              "quote": "Суммы, полученные Фактором от должника сверх суммы финансирования и вознаграждения Фактора, подлежат возврату Клиенту в течение 5 рабочих дней с даты их поступления."
            }
          ]
        }

        Пример 2 — данных в договоре нет:
        Фрагмент:
        "Фактор приобретает право требования."
        Ответ:
        {
          "excess_return_presence": "not_defined",
          "excess_return_display": "Не установлен",
          "return_deadline_status": "not_defined",
          "return_deadline_display": "Не установлен",
          "offset_order_clarity": "not_defined",
          "recovery_in_recourse": "not_defined",
          "reference_to_tariffs": "not_defined",
          "excess_return_summary": "Возврат: нет; Срок: Не установлен; Очерёдность: Не установлена; При регрессе: Не установлено; Отсылка к тарифам: нет",
          "evidence": []
        }

        Пример 3 — текст есть, но вывод частичный
        (отсылка к тарифам без конкретики):
        Фрагмент:
        "Возврат Клиенту излишне полученных сумм осуществляется в порядке,
        предусмотренном Тарифами Фактора (Приложение № 1)."
        Ответ:
        {
          "excess_return_presence": "present",
          "excess_return_display": "Предусмотрен",
          "return_deadline_status": "not_defined",
          "return_deadline_display": "Не установлен",
          "offset_order_clarity": "unclear",
          "recovery_in_recourse": "not_defined",
          "reference_to_tariffs": "present",
          "excess_return_summary": "Возврат: да (отсылка к Тарифам); Срок: Не установлен; Очерёдность: Не определена; При регрессе: Не установлено; Отсылка к тарифам: да",
          "evidence": [
            {
              "clause_ref": "п. 3.5",
              "quote": "Возврат Клиенту излишне полученных сумм осуществляется в порядке, предусмотренном Тарифами Фактора (Приложение № 1)."
            }
          ]
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о возврате излишка клиенту.
        2. Найди прямую цитату о сроке возврата (если указан).
        3. Найди прямую цитату об очерёдности удержаний.
        4. Найди прямую цитату о судьбе излишка при регрессе.
        5. Найди прямую цитату об отсылке к тарифам / приложению.
        6. Проверь: если формулировка размытая («в порядке, согласованном
           Сторонами») — соответствующие статусы = "unclear" / "not_defined".
        7. Согласуй raw enum и display:
           excess_return_presence -> excess_return_display:
             "present" -> "Предусмотрен";
             "not_defined" -> "Не установлен".
           return_deadline_status -> return_deadline_display:
             "specified" -> конкретный срок текстом (например, "5 рабочих
               дней");
             "not_defined" -> "Не установлен".
        8. Если прямой цитаты нет — верни "not_defined" для status-полей
           и "Не установлен" / "Не установлена" / "Не установлено" для
           display-полей.
        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь РОВНО одним JSON-объектом без какого-либо дополнительного
        текста до или после, со всеми 9 ключами:
        {
          "excess_return_presence": "<present / not_defined>",
          "excess_return_display": "<Предусмотрен / Не установлен>",
          "return_deadline_status": "<specified / not_defined>",
          "return_deadline_display": "<конкретный срок или 'Не установлен'>",
          "offset_order_clarity": "<clear / unclear / not_defined>",
          "recovery_in_recourse": "<present / not_defined>",
          "reference_to_tariffs": "<present / not_defined>",
          "excess_return_summary": "<сводка одной строкой>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 8
      temperature: 0.0
      max_tokens: 700

    retrieval:
      retrieval_profile: "payment_terms_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "возврат излишка разница подлежит возврату клиенту сумма превышающая финансирование остаток перечисляется клиенту излишне полученные суммы очерёдность удержаний срок возврата излишка тарифы"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - procedures
      negative_keywords:
        - "означает"
        - "в целях настоящего"
        - "уведомление должника"
        - "регресс (применительно к риску)"
      position_bias:
        preferred_range: [0.25, 0.70]
        boost: 0.12
        scope: segment
      context_k: 8
      max_chunks: 10
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "obligations"
        - "procedures"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.12

    evidence:
      required: true
      min_snippet_length: 30
      max_snippet_length: 500

    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false
      llm_max_tokens: 1100

      presence_signal:
        field: "excess_collection_return_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора факторинга
        механизм возврата клиенту излишка, полученного от должника:
        наличие, срок, очерёдность удержаний, судьбу при регрессе,
        отсылку к тарифам.
        Не анализируй регресс как таковой, комиссию или уведомление
        должника — только механизм возврата излишка.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. excess_collection_return_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если excess_return_presence = "present";
           - "missing" — если excess_return_presence = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - excess_return_presence = "not_defined";
           - return_deadline_status = "not_defined";
           - offset_order_clarity = "not_defined";
           - recovery_in_recourse = "not_defined";
           - reference_to_tariffs = "not_defined";
           - excess_return_display = "Не установлен";
           - return_deadline_display = "Не установлен";
           - excess_return_summary = "Возврат: нет; Срок: Не установлен; Очерёдность: Не установлена; При регрессе: Не установлено; Отсылка к тарифам: нет";
           - не выполняй остальные шаги.

        1.  excess_return_presence — present / not_defined.
        2.  excess_return_display — "Предусмотрен" / "Не установлен"
            (должно соответствовать excess_return_presence).
        3.  return_deadline_status — specified / not_defined.
        4.  return_deadline_display — конкретный срок из текста
            (например, "5 рабочих дней") или "Не установлен".
        5.  offset_order_clarity — clear / unclear / not_defined.
        6.  recovery_in_recourse — present / not_defined.
        7.  reference_to_tariffs — present / not_defined.
        8.  excess_return_summary — сводка одной строкой.
        9.  evidence — массив цитат с clause_ref и quote.
        </task>

        <context_rules>
        - Перед остальными полями заполни excess_collection_return_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined", excess_return_display = "Не установлен", return_deadline_display = "Не установлен", excess_return_summary = "Возврат: нет; Срок: Не установлен; Очерёдность: Не установлена; При регрессе: Не установлено; Отсылка к тарифам: нет".
        - Используй только текст договора.
        - excess_return_presence: "present" — есть механизм возврата излишка (прямо или через отсылку к тарифам); "not_defined" — механизма нет.
        - return_deadline_status: "specified" — указан конкретный срок возврата; "not_defined" — срок отсутствует.
        - offset_order_clarity: "clear" — прямо определена очерёдность удержаний; "unclear" — определена частично или противоречиво; "not_defined" — очерёдность не определена.
        - recovery_in_recourse: "present" — есть правило о судьбе излишка при регрессе; "not_defined" — правила нет.
        - reference_to_tariffs: "present" — порядок возврата установлен через отсылку к тарифам / приложению.
        - Если фрагменты конфликтуют и не позволяют сделать надёжный вывод, верни "Не удалось определить" для затронутого видимого поля и включи конфликтующие цитаты в evidence.
        - Запрещены значения null, None и пустые строки.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет механизма возврата излишка.
           → presence = "missing";
             все *_status = "not_defined";
             excess_return_display = "Не установлен";
             return_deadline_display = "Не установлен";
             excess_return_summary = "Возврат: нет; Срок: Не установлен; Очерёдность: Не установлена; При регрессе: Не установлено; Отсылка к тарифам: нет".

        2. Частичное раскрытие (отсылка к тарифам).
           Порядок возврата установлен через отсылку к тарифам, но без конкретики в тексте договора.
           → presence = "present";
             excess_return_presence = "present";
             reference_to_tariffs = "present";
             return_deadline_status = "not_defined";
             offset_order_clarity = "unclear";
             excess_return_summary = "Возврат: да (отсылка к Тарифам); Срок: Не установлен; Очерёдность: Не определена; При регрессе: Не установлено; Отсылка к тарифам: да".

        3. Противоречие между фрагментами.
           В разных пунктах договора указаны противоречащие условия очерёдности удержаний или возврата.
           → presence = "unclear";
             offset_order_clarity = "unclear" или "not_defined";
             excess_return_summary = "Не удалось определить".

        4. Полный механизм возврата.
           Прямо указаны возврат, конкретный срок и чёткая очерёдность удержаний.
           → presence = "present";
             excess_return_presence = "present";
             return_deadline_status = "specified";
             offset_order_clarity = "clear";
             excess_return_summary = "Возврат: да; Срок: <конкретный срок>; Очерёдность: определена; При регрессе: Не установлено; Отсылка к тарифам: нет".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для excess_collection_return_presence используй только: "present", "missing", "unclear".
        - Для статусных enum-полей используй только допустимые значения из списка.
        - Fallback при отсутствии данных:
          * excess_return_display → "Не установлен";
          * return_deadline_display → "Не установлен";
          * excess_return_summary → "Возврат: нет; Срок: Не установлен; Очерёдность: Не установлена; При регрессе: Не установлено; Отсылка к тарифам: нет".
        - Fallback при противоречии или неоднозначности:
          * excess_return_summary → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "excess_collection_return_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования о возврате излишка клиенту. Внутреннее агрегатное signal-поле."
          required: true

        - name: "excess_return_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["present", "not_defined"]
          description: "Наличие механизма возврата излишка (raw enum). Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "excess_return_display"
          type: "string"
          presentation: "fact"
          label: "Возврат излишка клиенту"
          description: >
            User-facing: Предусмотрен / Не установлен. Fallback: "Не установлено" / "Не удалось определить".
          required: true
          display_in_grid: true
          display_priority: 1

        - name: "return_deadline_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["specified", "not_defined"]
          description: "Наличие конкретного срока возврата (raw enum). Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "return_deadline_display"
          type: "string"
          presentation: "fact"
          label: "Срок возврата излишка"
          description: >
            User-facing: конкретный срок или 'Не установлен'. Fallback: "Не установлено" / "Не удалось определить".
          required: true
          display_in_grid: true
          display_priority: 2

        - name: "offset_order_clarity"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["clear", "unclear", "not_defined"]
          description: "Определённость очерёдности удержаний (raw enum). Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "recovery_in_recourse"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["present", "not_defined"]
          description: "Наличие правила о судьбе излишка при регрессе (raw enum). Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "reference_to_tariffs"
          type: "string"
          presentation: "signal"
          risk_weight: "low"
          allowed_values: ["present", "not_defined"]
          description: "Отсылка к тарифам как способ установить порядок (raw enum). Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "excess_return_summary"
          type: "string"
          presentation: "fact"
          label: "Сводка по возврату излишка"
          description: >
            Компактная сводка по механизму возврата излишка. Fallback: "Не установлено" / "Не удалось определить".
          required: true
          display_in_grid: true
          display_priority: 3

        - name: "evidence"
          type: "array"
          presentation: "diagnostic"
          description: "Точные цитаты из договора, подтверждающие извлечённые значения."
          required: true
          display_in_grid: false

      store_payload: true

  - id: tax_risk_allocation
    name: "Налоговые последствия и распределение налоговых рисков (ст. 155, 279 НК РФ)"
    description: >
      Проверка налоговых оговорок по договору факторинга: кто несёт
      налоговые последствия, наличие НДС-оговорки, применимость убытка
      от уступки по ст. 279 НК РФ, самостоятельность исполнения
      налоговых обязательств.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "налоговые последствия"
        - "НДС"
        - "налог на добавленную стоимость"
        - "налоговая база"
        - "убыток от уступки"
        - "налоговые обязательства"
        - "самостоятельно исполняют налоговые обязательства"
        - "включая НДС"
        - "не облагается НДС"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)налогов(ые|ых|ой)\\s+(последств|обязательств|баз)"
        - "(?i)\\bНДС\\b"
        - "(?i)(включая|без|сверх)\\s+НДС"
        - "(?i)убыт(ок|ка|ки)\\s+от\\s+уступк"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор факторинга по Главе 43 ГК РФ.
        Проверяется только один вопрос: налоговые оговорки и распределение
        налоговых последствий между сторонами.
        Нормативные ориентиры:
        - ст. 155 НК РФ — особенности определения налоговой базы при
          уступке (переуступке) права требования (в том числе НДС);
        - ст. 279 НК РФ — особенности определения налоговой базы при
          уступке (переуступке) права требования (убыток от уступки).
        Важно:
        - Твоя задача — не оценивать серьёзность риска.
        - Только установить, что прямо есть в тексте договора, а чего прямо нет.
        - Налоговые оговорки в договорах факторинга бывают трёх типов:
            * распределение налоговой нагрузки («налоговые последствия —
              на Клиенте / на Факторе / каждая сторона самостоятельно»);
            * НДС-оговорка (суммы включают / не включают НДС);
            * оговорка про убыток от уступки по ст. 279 НК РФ.
          Отражай каждый факт отдельно.
        - Если договор прямо не касается налогов — все поля = not_defined.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Наличие налоговых оговорок в целом.
        2. Кто несёт налоговые последствия (Клиент / Фактор / каждая
           сторона самостоятельно).
        3. Наличие НДС-оговорки (включая указание «с НДС» / «без НДС» /
           «НДС сверх суммы»).
        4. Наличие оговорки про убыток от уступки (ст. 279 НК РФ).
        5. Составь краткую user-facing сводку по налоговым оговоркам.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Если данные не указаны прямо:
           - для status-полей верни "not_defined";
           - для текстовых display-полей верни "Не установлено" /
             "Не установлена" / "Не предусмотрено" по роду.
        4. Запрещены значения: null, None, пустые строки — не используй их
           никогда. Допустимые fallback-значения: "not_defined",
           "Не установлено", "Не установлена", "Не предусмотрено".
        5. tax_allocation_presence:
           "present" — есть любая налоговая оговорка (распределение
             нагрузки / НДС / убыток от уступки / самостоятельное
             исполнение обязательств);
           "not_defined" — налоговых оговорок в тексте нет.
        6. tax_burden_party:
           "client" — налоговые последствия несёт Клиент;
           "factor" — налоговые последствия несёт Фактор;
           "each_own" — каждая сторона самостоятельно исполняет свои
             налоговые обязательства;
           "not_defined" — распределение в тексте не определено.
        7. vat_clause_status:
           "present" — есть НДС-оговорка (включая/не включая НДС,
             с НДС сверх суммы, освобождение от НДС);
           "not_defined" — НДС-оговорка отсутствует.
        8. loss_assignment_clause:
           "present" — есть оговорка про убыток от уступки
             (применимость ст. 279 НК РФ, распределение налогового
             эффекта убытка);
           "not_defined" — оговорка отсутствует.
        9. tax_summary — одна строка, формат:
           "Налоговые оговорки: <да/нет>; Кто несёт: <...>;
           НДС-оговорка: <да/нет>; Убыток от уступки: <да/нет>".
           Для отсутствующих параметров — «нет» / «Не установлено».
        10. В evidence включай только дословные цитаты из текста договора.
        11. Верни РОВНО один JSON-объект со всеми 8 ключами без какого-либо
            дополнительного текста до или после. Начни ответ сразу с
            открывающей фигурной скобки и закончи закрывающей. НЕ пиши
            Markdown, списки, код-фенсы. Ответ должен быть валидным JSON,
            пригодным для парсинга через json.loads без предварительной
            обработки.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — полный набор налоговых оговорок:
        Фрагмент:
        "Сумма финансирования включает НДС по ставке, установленной
        законодательством. Налоговые последствия по настоящему Договору
        несёт Клиент. Убыток от уступки требования определяется в
        соответствии со ст. 279 НК РФ."
        Ответ:
        {
          "tax_allocation_presence": "present",
          "tax_allocation_presence_display": "Предусмотрены",
          "tax_burden_party": "client",
          "tax_burden_display": "Клиент",
          "vat_clause_status": "present",
          "loss_assignment_clause": "present",
          "tax_summary": "Налоговые оговорки: да; Кто несёт: Клиент; НДС-оговорка: да (включая НДС); Убыток от уступки: да (ст. 279 НК РФ)",
          "evidence": [
            {
              "clause_ref": "п. 10.1",
              "quote": "Сумма финансирования включает НДС по ставке, установленной законодательством. Налоговые последствия по настоящему Договору несёт Клиент."
            }
          ]
        }

        Пример 2 — налоговых оговорок нет:
        Фрагмент:
        "Фактор приобретает право требования и выплачивает Клиенту финансирование."
        Ответ:
        {
          "tax_allocation_presence": "not_defined",
          "tax_allocation_presence_display": "Не предусмотрены",
          "tax_burden_party": "not_defined",
          "tax_burden_display": "Не установлено",
          "vat_clause_status": "not_defined",
          "loss_assignment_clause": "not_defined",
          "tax_summary": "Налоговые оговорки: нет; Кто несёт: Не установлено; НДС-оговорка: нет; Убыток от уступки: нет",
          "evidence": []
        }

        Пример 3 — текст есть, но вывод частичный
        (только общая оговорка о самостоятельном исполнении, без НДС
        и без убытка):
        Фрагмент:
        "Каждая из Сторон самостоятельно исполняет свои налоговые
        обязательства в соответствии с законодательством РФ."
        Ответ:
        {
          "tax_allocation_presence": "present",
          "tax_allocation_presence_display": "Предусмотрены",
          "tax_burden_party": "each_own",
          "tax_burden_display": "Каждая сторона самостоятельно",
          "vat_clause_status": "not_defined",
          "loss_assignment_clause": "not_defined",
          "tax_summary": "Налоговые оговорки: да; Кто несёт: Каждая сторона самостоятельно; НДС-оговорка: нет; Убыток от уступки: нет",
          "evidence": [
            {
              "clause_ref": "п. 10.1",
              "quote": "Каждая из Сторон самостоятельно исполняет свои налоговые обязательства в соответствии с законодательством РФ."
            }
          ]
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о налоговых оговорках в целом.
        2. Найди прямую цитату о распределении налоговой нагрузки
           (кто несёт).
        3. Найди прямую цитату об НДС (включая/не включая).
        4. Найди прямую цитату об убытке от уступки (ст. 279 НК РФ).
        5. Проверь: если формулировка размытая («в соответствии с
           законодательством») — соответствующие статусы = "not_defined".
        6. Согласуй raw enum и display:
           tax_allocation_presence -> tax_allocation_presence_display:
             "present" -> "Предусмотрены";
             "not_defined" -> "Не предусмотрены".
           tax_burden_party -> tax_burden_display:
             "client" -> "Клиент";
             "factor" -> "Фактор";
             "each_own" -> "Каждая сторона самостоятельно";
             "not_defined" -> "Не установлено".
        7. Если прямой цитаты нет — верни "not_defined" для status-полей
           и соответствующий fallback для display-полей.
        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь РОВНО одним JSON-объектом без какого-либо дополнительного
        текста до или после, со всеми 8 ключами:
        {
          "tax_allocation_presence": "<present / not_defined>",
          "tax_allocation_presence_display": "<Предусмотрены / Не предусмотрены>",
          "tax_burden_party": "<client / factor / each_own / not_defined>",
          "tax_burden_display": "<Клиент / Фактор / Каждая сторона самостоятельно / Не установлено>",
          "vat_clause_status": "<present / not_defined>",
          "loss_assignment_clause": "<present / not_defined>",
          "tax_summary": "<сводка одной строкой>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 8
      temperature: 0.0
      max_tokens: 700

    retrieval:
      retrieval_profile: "tax_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "налоговые последствия налоговые обязательства НДС налог на добавленную стоимость включая НДС без НДС налоговая база убыток от уступки ст. 279 НК РФ стороны самостоятельно исполняют налоговые обязательства распределение налоговой нагрузки"
      preferred_unit_types:
        - general_provision
        - obligation
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - boilerplate
        - obligations
      negative_keywords:
        - "означает"
        - "в целях настоящего"
        - "регресс (как налоговый термин)"
      position_bias:
        preferred_range: [0.40, 1.0]
        boost: 0.12
        scope: segment
      context_k: 8
      max_chunks: 10
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "boilerplate"
        - "obligations"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 30
      max_snippet_length: 500

    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false
      llm_max_tokens: 1100

      presence_signal:
        field: "tax_risk_allocation_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора факторинга
        налоговые оговорки: наличие, кто несёт налоговые последствия,
        НДС-оговорка, оговорка про убыток от уступки.
        Не анализируй регресс, финансирование, уведомление должника
        или банкротство.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. tax_risk_allocation_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (tax_allocation_presence, vat_clause_status, loss_assignment_clause) = "present";
           - "missing" — если все три содержательных поля = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - tax_allocation_presence = "not_defined";
           - tax_burden_party = "not_defined";
           - vat_clause_status = "not_defined";
           - loss_assignment_clause = "not_defined";
           - tax_allocation_presence_display = "Не предусмотрены";
           - tax_burden_display = "Не установлено";
           - tax_summary = "Налоговые оговорки: нет; Кто несёт: Не установлено; НДС-оговорка: нет; Убыток от уступки: нет";
           - не выполняй остальные шаги.

        1.  tax_allocation_presence — present / not_defined.
        2.  tax_allocation_presence_display — "Предусмотрены" /
            "Не предусмотрены" (должно соответствовать
            tax_allocation_presence).
        3.  tax_burden_party — client / factor / each_own / not_defined.
        4.  tax_burden_display — "Клиент" / "Фактор" /
            "Каждая сторона самостоятельно" / "Не установлено"
            (должно соответствовать tax_burden_party).
        5.  vat_clause_status — present / not_defined.
        6.  loss_assignment_clause — present / not_defined.
        7.  tax_summary — сводка одной строкой.
        8.  evidence — массив цитат с clause_ref и quote.
        </task>

        <context_rules>
        - Перед остальными полями заполни tax_risk_allocation_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined", tax_allocation_presence_display = "Не предусмотрены", tax_burden_display = "Не установлено", tax_summary = "Налоговые оговорки: нет; Кто несёт: Не установлено; НДС-оговорка: нет; Убыток от уступки: нет".
        - Используй только текст договора.
        - Не подставляй нормы закона вместо текста договора.
        - tax_allocation_presence: "present" — есть любая налоговая оговорка; "not_defined" — оговорок нет.
        - tax_burden_party: "client" / "factor" / "each_own" / "not_defined" — по прямому указанию в тексте.
        - vat_clause_status: "present" — есть НДС-оговорка (включая / не включая НДС, сверх суммы, освобождение); "not_defined" — НДС-оговорки нет.
        - loss_assignment_clause: "present" — есть оговорка про убыток от уступки (ст. 279 НК РФ); "not_defined" — отсутствует.
        - Если фрагменты конфликтуют и не позволяют сделать надёжный вывод, верни "Не удалось определить" для затронутого видимого поля и включи конфликтующие цитаты в evidence.
        - Запрещены значения null, None и пустые строки.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет налоговых оговорок.
           → presence = "missing";
             все *_status = "not_defined";
             tax_allocation_presence_display = "Не предусмотрены";
             tax_burden_display = "Не установлено";
             tax_summary = "Налоговые оговорки: нет; Кто несёт: Не установлено; НДС-оговорка: нет; Убыток от уступки: нет".

        2. Частичное раскрытие.
           Есть только общая оговорка о самостоятельном исполнении налоговых обязательств, без НДС и убытка.
           → presence = "present";
             tax_allocation_presence = "present";
             tax_burden_party = "each_own";
             vat_clause_status = loss_assignment_clause = "not_defined";
             tax_summary = "Налоговые оговорки: да; Кто несёт: Каждая сторона самостоятельно; НДС-оговорка: нет; Убыток от уступки: нет".

        3. Противоречие между фрагментами.
           В разных пунктах договора указаны противоречащие условия о налоговых последствиях.
           → presence = "unclear";
             соответствующие *_status = "not_defined";
             tax_summary = "Не удалось определить".

        4. Полный набор налоговых оговорок.
           Присутствуют распределение нагрузки, НДС-оговорка и оговорка про убыток от уступки.
           → presence = "present";
             tax_allocation_presence = "present";
             vat_clause_status = "present";
             loss_assignment_clause = "present";
             tax_summary = "Налоговые оговорки: да; Кто несёт: <...>; НДС-оговорка: да; Убыток от уступки: да".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для tax_risk_allocation_presence используй только: "present", "missing", "unclear".
        - Для статусных enum-полей используй только допустимые значения из списка.
        - Fallback при отсутствии данных:
          * tax_allocation_presence_display → "Не предусмотрены";
          * tax_burden_display → "Не установлено";
          * tax_summary → "Налоговые оговорки: нет; Кто несёт: Не установлено; НДС-оговорка: нет; Убыток от уступки: нет".
        - Fallback при противоречии или неоднозначности:
          * tax_summary → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "tax_risk_allocation_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования о налоговых оговорках. Внутреннее агрегатное signal-поле."
          required: true

        - name: "tax_allocation_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["present", "not_defined"]
          description: "Наличие налоговых оговорок (raw enum). Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "tax_allocation_presence_display"
          type: "string"
          presentation: "fact"
          label: "Налоговые оговорки"
          description: >
            User-facing: Предусмотрены / Не предусмотрены. Fallback: "Не установлено" / "Не удалось определить".
          required: true
          display_in_grid: true
          display_priority: 1

        - name: "tax_burden_party"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["client", "factor", "each_own", "not_defined"]
          description: "Кто несёт налоговые последствия (raw enum). Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "tax_burden_display"
          type: "string"
          presentation: "fact"
          label: "Кто несёт налоговые последствия"
          description: >
            User-facing: Клиент / Фактор / Каждая сторона самостоятельно / Не установлено. Fallback: "Не установлено" / "Не удалось определить".
          required: true
          display_in_grid: true
          display_priority: 2

        - name: "vat_clause_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["present", "not_defined"]
          description: "Наличие НДС-оговорки (raw enum). Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "loss_assignment_clause"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["present", "not_defined"]
          description: "Наличие оговорки про убыток от уступки (raw enum). Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "tax_summary"
          type: "string"
          presentation: "fact"
          label: "Сводка по налоговым оговоркам"
          description: >
            Компактная сводка по налоговым оговоркам. Fallback: "Не установлено" / "Не удалось определить".
          required: true
          display_in_grid: true
          display_priority: 3

        - name: "evidence"
          type: "array"
          presentation: "diagnostic"
          description: "Точные цитаты из договора, подтверждающие извлечённые значения."
          required: true
          display_in_grid: false

      store_payload: true

  - id: assignment_prohibition_disclosure
    name: "Раскрытие запрета уступки в основном договоре (ст. 828 ГК РФ)"
    description: >
      Проверка заверений об отсутствии запрета уступки в основном договоре,
      раскрытия существующего запрета и наличия согласия должника.
      По ст. 828 ГК РФ запрет уступки в основном договоре не делает
      уступку недействительной, но даёт должнику право на возмещение
      убытков с клиента.
    triggers:
      any: ["assignment_prohibition_in_underlying"]
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "запрет уступки"
        - "уступка запрещена"
        - "отсутствует запрет"
        - "клиент заверяет"
        - "клиент гарантирует"
        - "согласие должника"
        - "ограничение уступки"
        - "без согласия должника"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)(отсутств|нет).{0,30}(запрет|ограничен).{0,30}уступк"
        - "(?i)клиент.{0,30}(заверяет|гарантирует).{0,30}(запрет|уступк)"
        - "(?i)согласи[ея]\\s+должник"
        - "(?i)уступк.{0,30}(без\\s+согласи|требует\\s+согласи)"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор факторинга по Главе 43 ГК РФ.
        Проверяется только один вопрос: запрет уступки в основном договоре
        между клиентом и должником, его раскрытие и наличие согласия должника.
        Нормативный ориентир:
        - ст. 828 ГК РФ — запрет уступки в основном договоре НЕ делает
          уступку недействительной, но даёт должнику право требовать
          с клиента возмещения убытков.
        Важно:
        - Твоя задача — не оценивать серьёзность риска.
        - Только установить, что прямо есть в тексте договора, а чего прямо нет.
        - Различай три разных юридических факта:
            * заверение клиента об ОТСУТСТВИИ запрета уступки в основном
              договоре — это защита фактора;
            * раскрытие СУЩЕСТВУЮЩЕГО запрета (если запрет в основном
              договоре есть, и стороны факторинга об этом знают);
            * наличие СОГЛАСИЯ должника (если основной договор требует
              согласия для уступки, нужно проверить, получено ли оно).
          Отражай каждый факт отдельно.
        - Если в тексте факторингового договора нет упоминаний про запрет
          уступки в основном договоре — все поля = not_defined.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Заверение клиента об отсутствии запрета уступки в основном
           договоре с должником.
        2. Раскрытие существующего запрета уступки (если стороны прямо
           указывают, что запрет есть / уступка требует согласия).
        3. Наличие согласия должника на уступку (получено / требуется /
           не требуется).
        4. Составь краткую user-facing сводку.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Если данные не указаны прямо:
           - для status-полей верни "not_defined";
           - для display-полей верни "Не установлено" / "Не требуется"
             по роду.
        4. Запрещены значения: null, None, пустые строки — не используй их
           никогда. Допустимые fallback-значения: "not_defined",
           "Не установлено", "Не требуется".
        5. no_prohibition_warranty:
           "present" — в договоре есть прямое заверение клиента об
             отсутствии запрета уступки в основном договоре / об отсутствии
             ограничений на уступку;
           "not_defined" — такое заверение отсутствует.
        6. prohibition_disclosure_status:
           "disclosed" — стороны прямо раскрывают, что в основном договоре
             есть запрет / ограничение уступки;
           "not_disclosed" — в договоре не упоминается ни наличие, ни
             отсутствие запрета;
           "not_defined" — не удалось установить из текста.
        7. debtor_consent_status:
           "obtained" — прямо указано, что согласие должника получено;
           "required_not_obtained" — прямо указано, что согласие требуется,
             но не подтверждено получение;
           "not_required" — прямо указано, что согласие должника не
             требуется;
           "not_defined" — вопрос согласия в тексте не раскрыт.
        8. assignment_prohibition_summary — одна строка, формат:
           "Заверение об отсутствии запрета: <да/нет>;
           Раскрытие запрета: <...>; Согласие должника: <...>".
        9. В evidence включай только дословные цитаты из текста договора.
        10. Верни РОВНО один JSON-объект со всеми 8 ключами без какого-либо
            дополнительного текста до или после. Начни ответ сразу с
            открывающей фигурной скобки и закончи закрывающей. НЕ пиши
            Markdown, списки, код-фенсы. Ответ должен быть валидным JSON,
            пригодным для парсинга через json.loads без предварительной
            обработки.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — заверение об отсутствии запрета:
        Фрагмент:
        "Клиент заверяет, что в договоре поставки № 45 от 01.03.2024
        отсутствуют запрет или ограничения на уступку денежного требования
        третьим лицам. Согласие должника на уступку не требуется."
        Ответ:
        {
          "no_prohibition_warranty": "present",
          "no_prohibition_warranty_display": "Предусмотрено",
          "prohibition_disclosure_status": "not_disclosed",
          "prohibition_disclosure_display": "Не раскрыт",
          "debtor_consent_status": "not_required",
          "debtor_consent_display": "Не требуется",
          "assignment_prohibition_summary": "Заверение об отсутствии запрета: да; Раскрытие запрета: Не раскрыт; Согласие должника: Не требуется",
          "evidence": [
            {
              "clause_ref": "п. 6.4",
              "quote": "Клиент заверяет, что в договоре поставки № 45 от 01.03.2024 отсутствуют запрет или ограничения на уступку денежного требования третьим лицам."
            }
          ]
        }

        Пример 2 — данных в договоре нет:
        Фрагмент:
        "Фактор приобретает право требования."
        Ответ:
        {
          "no_prohibition_warranty": "not_defined",
          "no_prohibition_warranty_display": "Не установлено",
          "prohibition_disclosure_status": "not_disclosed",
          "prohibition_disclosure_display": "Не раскрыт",
          "debtor_consent_status": "not_defined",
          "debtor_consent_display": "Не установлено",
          "assignment_prohibition_summary": "Заверение об отсутствии запрета: нет; Раскрытие запрета: Не раскрыт; Согласие должника: Не установлено",
          "evidence": []
        }

        Пример 3 — текст есть, но раскрытие негативное
        (стороны прямо признают наличие запрета без согласия):
        Фрагмент:
        "Стороны осведомлены, что договор поставки № 45 от 01.03.2024
        содержит запрет уступки требования без предварительного письменного
        согласия должника. Согласие должника на дату подписания настоящего
        Договора не получено."
        Ответ:
        {
          "no_prohibition_warranty": "not_defined",
          "no_prohibition_warranty_display": "Не установлено",
          "prohibition_disclosure_status": "disclosed",
          "prohibition_disclosure_display": "Раскрыт",
          "debtor_consent_status": "required_not_obtained",
          "debtor_consent_display": "Требуется, не получено",
          "assignment_prohibition_summary": "Заверение об отсутствии запрета: нет; Раскрытие запрета: Раскрыт; Согласие должника: Требуется, не получено",
          "evidence": [
            {
              "clause_ref": "п. 6.4",
              "quote": "Стороны осведомлены, что договор поставки № 45 от 01.03.2024 содержит запрет уступки требования без предварительного письменного согласия должника."
            }
          ]
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о заверении клиента об отсутствии запрета.
        2. Найди прямую цитату о раскрытии запрета (если есть).
        3. Найди прямую цитату о согласии должника (если есть).
        4. Проверь: если договор не упоминает запрет вообще — prohibition_disclosure_status = "not_disclosed",
           no_prohibition_warranty = "not_defined".
        5. Согласуй raw enum и display:
           no_prohibition_warranty -> no_prohibition_warranty_display:
             "present" -> "Предусмотрено";
             "not_defined" -> "Не установлено".
           prohibition_disclosure_status -> prohibition_disclosure_display:
             "disclosed" -> "Раскрыт";
             "not_disclosed" -> "Не раскрыт";
             "not_defined" -> "Не установлено".
           debtor_consent_status -> debtor_consent_display:
             "obtained" -> "Получено";
             "required_not_obtained" -> "Требуется, не получено";
             "not_required" -> "Не требуется";
             "not_defined" -> "Не установлено".
        6. Если прямой цитаты нет — верни соответствующие fallback-значения.
        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь РОВНО одним JSON-объектом без какого-либо дополнительного
        текста до или после, со всеми 8 ключами:
        {
          "no_prohibition_warranty": "<present / not_defined>",
          "no_prohibition_warranty_display": "<Предусмотрено / Не установлено>",
          "prohibition_disclosure_status": "<disclosed / not_disclosed / not_defined>",
          "prohibition_disclosure_display": "<Раскрыт / Не раскрыт / Не установлено>",
          "debtor_consent_status": "<obtained / required_not_obtained / not_required / not_defined>",
          "debtor_consent_display": "<Получено / Требуется, не получено / Не требуется / Не установлено>",
          "assignment_prohibition_summary": "<сводка одной строкой>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 8
      temperature: 0.0
      max_tokens: 700

    retrieval:
      retrieval_profile: "assignment_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "запрет уступки уступка запрещена отсутствует запрет клиент заверяет клиент гарантирует согласие должника ограничение уступки без согласия должника уступка требования третьим лицам"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - representations
        - obligations
      negative_keywords:
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.30, 0.75]
        boost: 0.12
        scope: segment
      context_k: 8
      max_chunks: 10
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "representations"
        - "obligations"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 30
      max_snippet_length: 500

    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false
      llm_max_tokens: 1100

      presence_signal:
        field: "assignment_prohibition_disclosure_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора факторинга
        сведения о запрете уступки в основном договоре: заверение об
        отсутствии запрета, раскрытие существующего запрета, наличие
        согласия должника.
        Не анализируй регресс, финансирование, уведомление должника
        или банкротство.
        Различай: заверение об отсутствии запрета ≠ раскрытие
        существующего запрета ≠ согласие должника. Это три разных факта.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. assignment_prohibition_disclosure_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (no_prohibition_warranty, prohibition_disclosure_status,
              debtor_consent_status) ≠ "not_defined";
           - "missing" — если все три содержательных поля = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - no_prohibition_warranty = "not_defined";
           - prohibition_disclosure_status = "not_defined";
           - debtor_consent_status = "not_defined";
           - no_prohibition_warranty_display = "Не установлено";
           - prohibition_disclosure_display = "Не установлено";
           - debtor_consent_display = "Не установлено";
           - assignment_prohibition_summary = "Заверение об отсутствии запрета: нет; Раскрытие запрета: Не установлено; Согласие должника: Не установлено";
           - не выполняй остальные шаги.

        1.  no_prohibition_warranty — present / not_defined.
        2.  no_prohibition_warranty_display — "Предусмотрено" /
            "Не установлено" (должно соответствовать
            no_prohibition_warranty).
        3.  prohibition_disclosure_status — disclosed / not_disclosed /
            not_defined.
        4.  prohibition_disclosure_display — "Раскрыт" / "Не раскрыт" /
            "Не установлено" (должно соответствовать
            prohibition_disclosure_status).
        5.  debtor_consent_status — obtained / required_not_obtained /
            not_required / not_defined.
        6.  debtor_consent_display — "Получено" / "Требуется, не получено"
            / "Не требуется" / "Не установлено" (должно соответствовать
            debtor_consent_status).
        7.  assignment_prohibition_summary — сводка одной строкой.
        8.  evidence — массив цитат с clause_ref и quote.
        </task>

        <context_rules>
        - Перед остальными полями заполни assignment_prohibition_disclosure_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined", все *_display = "Не установлено", assignment_prohibition_summary = "Заверение об отсутствии запрета: нет; Раскрытие запрета: Не установлено; Согласие должника: Не установлено".
        - Используй только текст договора.
        - Не подставляй нормы закона вместо текста договора.
        - Различай: заверение об отсутствии запрета ≠ раскрытие существующего запрета ≠ согласие должника. Это три разных факта.
        - no_prohibition_warranty: "present" — есть заверение клиента об отсутствии запрета/ограничений уступки в основном договоре; "not_defined" — заверения нет.
        - prohibition_disclosure_status: "disclosed" — стороны прямо раскрывают наличие запрета; "not_disclosed" — в договоре не упоминается ни наличие, ни отсутствие запрета; "not_defined" — не удалось установить.
        - debtor_consent_status: "obtained" — согласие получено; "required_not_obtained" — требуется, но не подтверждено; "not_required" — согласие не требуется; "not_defined" — не раскрыто.
        - Если фрагменты конфликтуют и не позволяют сделать надёжный вывод, верни "Не удалось определить" для затронутого видимого поля и включи конфликтующие цитаты в evidence.
        - Запрещены значения null, None и пустые строки.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет упоминания запрета уступки в основном договоре.
           → presence = "missing";
             все *_status = "not_defined";
             все *_display = "Не установлено";
             assignment_prohibition_summary = "Заверение об отсутствии запрета: нет; Раскрытие запрета: Не установлено; Согласие должника: Не установлено".

        2. Заверение об отсутствии запрета.
           Клиент заверяет, что в основном договоре нет запрета уступки.
           → presence = "present";
             no_prohibition_warranty = "present";
             prohibition_disclosure_status = "not_disclosed";
             debtor_consent_status = "not_required";
             соответствующие *_display = "Предусмотрено" / "Не раскрыт" / "Не требуется".

        3. Противоречие между фрагментами.
           В разных пунктах договора указаны противоречащие условия о запрете уступки или согласии должника.
           → presence = "unclear";
             соответствующие *_status = "not_defined";
             assignment_prohibition_summary = "Не удалось определить".

        4. Раскрытие существующего запрета.
           Стороны прямо признают наличие запрета уступки в основном договоре и отсутствие согласия должника.
           → presence = "present";
             no_prohibition_warranty = "not_defined";
             prohibition_disclosure_status = "disclosed";
             debtor_consent_status = "required_not_obtained";
             соответствующие *_display = "Не установлено" / "Раскрыт" / "Требуется, не получено".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для assignment_prohibition_disclosure_presence используй только: "present", "missing", "unclear".
        - Для статусных enum-полей используй только допустимые значения из списка.
        - Fallback при отсутствии данных:
          * no_prohibition_warranty_display → "Не установлено";
          * prohibition_disclosure_display → "Не установлено";
          * debtor_consent_display → "Не установлено";
          * assignment_prohibition_summary → "Заверение об отсутствии запрета: нет; Раскрытие запрета: Не установлено; Согласие должника: Не установлено".
        - Fallback при противоречии или неоднозначности:
          * assignment_prohibition_summary → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "assignment_prohibition_disclosure_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования о запрете уступки в основном договоре. Внутреннее агрегатное signal-поле."
          required: true

        - name: "no_prohibition_warranty"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["present", "not_defined"]
          description: "Заверение об отсутствии запрета уступки (raw enum). Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "no_prohibition_warranty_display"
          type: "string"
          presentation: "fact"
          label: "Заверение об отсутствии запрета"
          description: >
            User-facing: Предусмотрено / Не установлено. Fallback: "Не установлено" / "Не удалось определить".
          required: true
          display_in_grid: true
          display_priority: 1

        - name: "prohibition_disclosure_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["disclosed", "not_disclosed", "not_defined"]
          description: "Раскрытие существующего запрета (raw enum). Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "prohibition_disclosure_display"
          type: "string"
          presentation: "fact"
          label: "Раскрытие запрета уступки"
          description: >
            User-facing: Раскрыт / Не раскрыт / Не установлено. Fallback: "Не установлено" / "Не удалось определить".
          required: true
          display_in_grid: true
          display_priority: 2

        - name: "debtor_consent_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["obtained", "required_not_obtained", "not_required", "not_defined"]
          description: "Наличие согласия должника (raw enum). Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "debtor_consent_display"
          type: "string"
          presentation: "fact"
          label: "Согласие должника"
          description: >
            User-facing: Получено / Требуется, не получено / Не требуется / Не установлено. Fallback: "Не установлено" / "Не удалось определить".
          required: true
          display_in_grid: true
          display_priority: 3

        - name: "assignment_prohibition_summary"
          type: "string"
          presentation: "fact"
          label: "Сводка по запрету уступки"
          description: >
            Компактная сводка по запрету уступки. Fallback: "Не установлено" / "Не удалось определить".
          required: true
          display_in_grid: true
          display_priority: 4

        - name: "evidence"
          type: "array"
          presentation: "diagnostic"
          description: "Точные цитаты из договора, подтверждающие извлечённые значения."
          required: true
          display_in_grid: false

      store_payload: true

  - id: underlying_contract_change_restriction_check
    name: "Запрет изменения основного договора без согласия фактора (ст. 826 ГК РФ)"
    description: >
      Проверка наличия в договоре факторинга запрета клиенту изменять или
      расторгать основной договор с должником без согласия фактора,
      а также последствий нарушения такого запрета.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "запрет изменения основного договора"
        - "изменение основного договора"
        - "расторжение основного договора"
        - "без согласия фактора"
        - "не вправе изменять"
        - "не вправе расторгать"
        - "существенные условия основного договора"
        - "неизменность основного договора"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)(не\\s+вправе|запрещ).{0,40}(измен|расторг).{0,40}(основн|поставк|договор)"
        - "(?i)(измен|расторг).{0,40}без\\s+согласи.{0,40}фактор"
        - "(?i)неизменн(ость|ым).{0,30}основн"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор факторинга по Главе 43 ГК РФ.
        Проверяется только один вопрос: защищён ли фактор от изменения
        или расторжения основного договора между клиентом и должником.
        Нормативный ориентир:
        - ст. 826 ГК РФ — предмет уступки (требование должно быть
          определимо и действительно);
        - ст. 450, 450.1 ГК РФ — изменение и расторжение договора.
        Важно:
        - Твоя задача — не оценивать серьёзность риска.
        - Только установить, что прямо есть в тексте договора, а чего прямо нет.
        - Основной договор — это договор между клиентом и должником
          (поставки, оказания услуг, выполнения работ), из которого
          возникло уступаемое требование.
        - Изменение или расторжение основного договора после уступки
          может изменить или уничтожить предмет уступки. Это критично
          для фактора.
        - Различай три уровня запрета:
            * broad — любые изменения без согласия фактора;
            * material_only — только существенные изменения (влияющие
              на размер, срок или основание требования);
            * specific_cases — отдельные поименованные изменения
              (например, только расторжение или только изменение цены).
        - Последствия нарушения — право фактора потребовать возврата
          финансирования, неустойка, регресс, отказ от дальнейшего
          финансирования. Отражай их отдельно.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Наличие запрета клиенту изменять / расторгать основной
           договор без согласия фактора.
        2. Охват запрета (любые изменения / существенные / отдельные
           случаи).
        3. Последствия нарушения запрета.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Если данные не указаны прямо:
           - для status-полей верни "not_defined";
           - для display-полей верни "Не предусмотрен" / "Не установлено"
             / "Не предусмотрены" по роду.
        4. Запрещены значения: null, None, пустые строки — не используй их
           никогда. Допустимые fallback-значения: "not_defined",
           "Не предусмотрен", "Не предусмотрены", "Не установлено".
        5. change_restriction_status:
           "present" — в договоре есть запрет клиенту изменять / расторгать
             основной договор без согласия фактора;
           "not_defined" — такого запрета в тексте нет.
        6. change_restriction_scope:
           "broad" — запрещены любые изменения и расторжение без согласия;
           "material_only" — запрещены только существенные изменения
             (влияющие на размер, срок, основание требования);
           "specific_cases" — запрещены только отдельные случаи
             (например, только расторжение или только изменение цены);
           "not_defined" — охват не определён.
        7. breach_consequences_status:
           "present" — предусмотрены последствия нарушения (возврат
             финансирования, неустойка, регресс, отказ от финансирования);
           "not_defined" — последствия не предусмотрены.
        8. В evidence включай только дословные цитаты из текста договора.
        9. Верни РОВНО один JSON-объект со всеми 7 ключами без какого-либо
           дополнительного текста до или после. Начни ответ сразу с
           открывающей фигурной скобки и закончи закрывающей. НЕ пиши
           Markdown, списки, код-фенсы. Ответ должен быть валидным JSON,
           пригодным для парсинга через json.loads без предварительной
           обработки.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — полный запрет с последствиями:
        Фрагмент:
        "Клиент не вправе без предварительного письменного согласия Фактора
        изменять или расторгать основной договор с должником, а также
        изменять существенные условия такого договора. При нарушении
        настоящего условия Фактор вправе потребовать досрочного возврата
        выплаченного финансирования и уплаты неустойки в размере 0,1%
        от суммы финансирования за каждый день нарушения."
        Ответ:
        {
          "change_restriction_status": "present",
          "change_restriction_display": "Предусмотрен",
          "change_restriction_scope": "broad",
          "change_restriction_scope_display": "Любые изменения",
          "breach_consequences_status": "present",
          "breach_consequences_display": "Предусмотрены",
          "evidence": [
            {
              "clause_ref": "п. 6.5",
              "quote": "Клиент не вправе без предварительного письменного согласия Фактора изменять или расторгать основной договор с должником."
            }
          ]
        }

        Пример 2 — данных в договоре нет:
        Фрагмент:
        "Клиент уступает Фактору денежное требование к должнику."
        Ответ:
        {
          "change_restriction_status": "not_defined",
          "change_restriction_display": "Не предусмотрен",
          "change_restriction_scope": "not_defined",
          "change_restriction_scope_display": "Не установлено",
          "breach_consequences_status": "not_defined",
          "breach_consequences_display": "Не предусмотрены",
          "evidence": []
        }

        Пример 3 — текст есть, но вывод частичный
        (запрет только на существенные изменения, без последствий):
        Фрагмент:
        "Клиент обязуется не изменять существенные условия основного
        договора без согласования с Фактором."
        Ответ:
        {
          "change_restriction_status": "present",
          "change_restriction_display": "Предусмотрен",
          "change_restriction_scope": "material_only",
          "change_restriction_scope_display": "Существенные изменения",
          "breach_consequences_status": "not_defined",
          "breach_consequences_display": "Не предусмотрены",
          "evidence": [
            {
              "clause_ref": "п. 6.5",
              "quote": "Клиент обязуется не изменять существенные условия основного договора без согласования с Фактором."
            }
          ]
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о запрете изменения основного договора.
        2. Найди прямую цитату об охвате запрета (любые / существенные /
           отдельные случаи).
        3. Найди прямую цитату о последствиях нарушения.
        4. Различай изменение, расторжение и изменение отдельных условий.
        5. Согласуй raw enum и display:
           change_restriction_status -> change_restriction_display:
             "present" -> "Предусмотрен";
             "not_defined" -> "Не предусмотрен".
           change_restriction_scope -> change_restriction_scope_display:
             "broad" -> "Любые изменения";
             "material_only" -> "Существенные изменения";
             "specific_cases" -> "Отдельные случаи";
             "not_defined" -> "Не установлено".
           breach_consequences_status -> breach_consequences_display:
             "present" -> "Предусмотрены";
             "not_defined" -> "Не предусмотрены".
        6. Если прямой цитаты нет — верни "not_defined" для status-полей
           и соответствующий fallback для display-полей.
        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь РОВНО одним JSON-объектом без какого-либо дополнительного
        текста до или после, со всеми 7 ключами:
        {
          "change_restriction_status": "<present / not_defined>",
          "change_restriction_display": "<Предусмотрен / Не предусмотрен>",
          "change_restriction_scope": "<broad / material_only / specific_cases / not_defined>",
          "change_restriction_scope_display": "<Любые изменения / Существенные изменения / Отдельные случаи / Не установлено>",
          "breach_consequences_status": "<present / not_defined>",
          "breach_consequences_display": "<Предусмотрены / Не предусмотрены>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 8
      temperature: 0.0
      max_tokens: 750

    retrieval:
      retrieval_profile: "assignment_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "запрет изменения основного договора без согласия фактора изменение условий основного договора расторжение основного договора согласие фактора на изменение заверение о неизменности существенные условия основного договора"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - representations
        - obligations
        - limitations
      negative_keywords:
        - "уступка требования"
        - "уведомление должника"
        - "комиссия"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.30, 0.75]
        boost: 0.15
        scope: segment
      context_k: 8
      max_chunks: 10
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "representations"
        - "obligations"
        - "limitations"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.12

    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 600

    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false
      llm_max_tokens: 1100

      presence_signal:
        field: "underlying_contract_change_restriction_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора факторинга
        сведения о запрете клиенту изменять или расторгать основной
        договор с должником без согласия фактора, об охвате запрета
        и последствиях его нарушения.
        Не анализируй уступку требования, финансирование, регресс,
        уведомление должника или банкротство.
        Различай изменение, расторжение и изменение отдельных условий
        основного договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. underlying_contract_change_restriction_check_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (change_restriction_status, breach_consequences_status) = "present";
           - "missing" — если оба содержательных поля = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - change_restriction_status = "not_defined";
           - change_restriction_scope = "not_defined";
           - breach_consequences_status = "not_defined";
           - change_restriction_display = "Не предусмотрен";
           - change_restriction_scope_display = "Не установлено";
           - breach_consequences_display = "Не предусмотрены";
           - не выполняй остальные шаги.

        1.  change_restriction_status — present / not_defined.
        2.  change_restriction_display — "Предусмотрен" /
            "Не предусмотрен" (должно соответствовать
            change_restriction_status).
        3.  change_restriction_scope — broad / material_only /
            specific_cases / not_defined.
        4.  change_restriction_scope_display — "Любые изменения" /
            "Существенные изменения" / "Отдельные случаи" /
            "Не установлено" (должно соответствовать
            change_restriction_scope).
        5.  breach_consequences_status — present / not_defined.
        6.  breach_consequences_display — "Предусмотрены" /
            "Не предусмотрены" (должно соответствовать
            breach_consequences_status).
        7.  evidence — массив цитат с clause_ref и quote.
        </task>

        <context_rules>
        - Перед остальными полями заполни underlying_contract_change_restriction_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined", все *_display = "Не предусмотрен" / "Не установлено" / "Не предусмотрены".
        - Используй только текст договора.
        - Не подставляй нормы закона вместо текста договора.
        - Различай изменение, расторжение и изменение отдельных условий основного договора.
        - Если фрагменты конфликтуют и не позволяют сделать надёжный вывод, верни "Не удалось определить" для затронутого видимого поля и включи конфликтующие цитаты в evidence.
        - Запрещены значения null, None и пустые строки.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет запрета изменения основного договора.
           → presence = "missing";
             все *_status = "not_defined";
             все *_display = "Не предусмотрен" / "Не установлено" / "Не предусмотрены".

        2. Частичное раскрытие.
           Есть запрет на изменение существенных условий, но без последствий нарушения.
           → presence = "present";
             change_restriction_status = "present";
             change_restriction_scope = "material_only";
             breach_consequences_status = "not_defined";
             соответствующие *_display = "Предусмотрен" / "Существенные изменения" / "Не предусмотрены".

        3. Противоречие между фрагментами.
           В разных пунктах договора указаны противоречащие условия о запрете изменения.
           → presence = "unclear";
             соответствующие *_status = "not_defined";
             соответствующие *_display = "Не удалось определить".

        4. Полный запрет с последствиями.
           Есть запрет на любые изменения + последствия нарушения (возврат финансирования, неустойка).
           → presence = "present";
             change_restriction_status = "present";
             change_restriction_scope = "broad";
             breach_consequences_status = "present";
             соответствующие *_display = "Предусмотрен" / "Любые изменения" / "Предусмотрены".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для underlying_contract_change_restriction_check_presence используй только: "present", "missing", "unclear".
        - Для статусных enum-полей используй только допустимые значения из списка.
        - Fallback при отсутствии данных:
          * change_restriction_display → "Не предусмотрен";
          * change_restriction_scope_display → "Не установлено";
          * breach_consequences_display → "Не предусмотрены".
        - Fallback при противоречии или неоднозначности:
          * все *_display → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "underlying_contract_change_restriction_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования о запрете изменения основного договора. Внутреннее агрегатное signal-поле."
          required: true

        - name: "change_restriction_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["present", "not_defined"]
          description: "Наличие запрета изменения основного договора (raw enum). Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "change_restriction_display"
          type: "string"
          presentation: "fact"
          label: "Запрет изменения основного договора"
          description: >
            User-facing: Предусмотрен / Не предусмотрен. Fallback: "Не установлено" / "Не удалось определить".
          required: true
          display_in_grid: true
          display_priority: 1

        - name: "change_restriction_scope"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["broad", "material_only", "specific_cases", "not_defined"]
          description: "Охват запрета (raw enum). Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "change_restriction_scope_display"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 2
          label: "Охват запрета"
          description: >
            User-facing: Любые изменения / Существенные изменения /
            Отдельные случаи / Не установлено.
            Fallback: "Не установлено" / "Не удалось определить".
          required: true

        - name: "breach_consequences_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["present", "not_defined"]
          description: "Наличие последствий нарушения (raw enum). Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "breach_consequences_display"
          type: "string"
          presentation: "fact"
          label: "Последствия нарушения запрета"
          description: >
            User-facing: Предусмотрены / Не предусмотрены. Fallback: "Не установлено" / "Не удалось определить".
          required: true
          display_in_grid: true
          display_priority: 3

        - name: "evidence"
          type: "array"
          presentation: "diagnostic"
          description: "Точные цитаты из договора, подтверждающие извлечённые значения."
          required: true
          display_in_grid: false

      store_payload: true

  - id: factor_liability_and_penalties_check
    name: "Ответственность фактора перед клиентом (ст. 824, 831 ГК РФ)"
    description: >
      Проверка симметричной защиты клиента: ответственность фактора
      за просрочку выплаты финансирования, необоснованный отказ
      в финансировании, иные санкции в пользу клиента.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "ответственность фактора"
        - "неустойка за просрочку финансирования"
        - "пеня за просрочку выплаты"
        - "необоснованный отказ в финансировании"
        - "ответственность финансового агента"
        - "санкции в пользу клиента"
        - "просрочка выплаты финансирования"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)(фактор|финансов\\w+\\s+агент).{0,60}(несёт|несет|уплачива|ответственн|обязан)"
        - "(?i)(просрочк|задержк).{0,40}финансирован"
        - "(?i)неустойк.{0,40}(просрочк|фактор)"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор факторинга по Главе 43 ГК РФ.
        Проверяется только один вопрос: симметричная ответственность
        фактора перед клиентом.
        Нормативные ориентиры:
        - ст. 824 ГК РФ — обязательства фактора по финансированию;
        - ст. 831 ГК РФ — распределение сумм;
        - гл. 25 ГК РФ — ответственность за нарушение обязательств.
        Важно:
        - Твоя задача — не оценивать серьёзность риска.
        - Только установить, что прямо есть в тексте договора, а чего прямо нет.
        - Проверяй три основных вида ответственности фактора:
            * просрочка выплаты финансирования;
            * необоснованный отказ в финансировании;
            * нарушение сроков возврата излишка.
        - Ответственность фактора может быть сформулирована через неустойку,
          пеню, проценты по ст. 395 ГК РФ или общую обязанность возместить
          убытки. Все формулировки учитывай.
        - Ответственность фактора может быть ограничена caps. Если есть —
          отражай в сводке.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Наличие ответственности фактора за просрочку выплаты
           финансирования.
        2. Наличие ответственности фактора за необоснованный отказ
           в финансировании.
        3. Составь краткую сводку по ответственности фактора.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Если данные не указаны прямо:
           - для status-полей верни "not_defined";
           - для display-полей верни "Не предусмотрена" / "Не установлена"
             по роду.
        4. Запрещены значения: null, None, пустые строки — не используй их
           никогда. Допустимые fallback-значения: "not_defined",
           "Не предусмотрена", "Не установлена".
        5. late_financing_penalty_status:
           "present" — в договоре есть неустойка / пеня / проценты
             за просрочку выплаты финансирования фактором;
           "not_defined" — такая ответственность в тексте отсутствует.
        6. wrongful_refusal_liability_status:
           "present" — в договоре предусмотрена ответственность фактора
             за необоснованный отказ в финансировании
             (или за необоснованное удержание сумм);
           "not_defined" — такая ответственность в тексте отсутствует.
        7. factor_liability_summary — одна строка, формат:
           "Просрочка финансирования: <да/нет>; Необоснованный отказ: <да/нет>; Иные санкции: <да/нет>".
           Если указан размер неустойки — включай его в summary
           (например, "0,1% в день").
        8. В evidence включай только дословные цитаты из текста договора.
        9. Верни РОВНО один JSON-объект со всеми 6 ключами без какого-либо
           дополнительного текста до или после. Начни ответ сразу с
           открывающей фигурной скобки и закончи закрывающей. НЕ пиши
           Markdown, списки, код-фенсы. Ответ должен быть валидным JSON,
           пригодным для парсинга через json.loads без предварительной
           обработки.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — полный набор ответственности фактора:
        Фрагмент:
        "За просрочку выплаты финансирования Фактор уплачивает Клиенту
        неустойку в размере 0,1% от суммы просроченного финансирования
        за каждый день просрочки. За необоснованный отказ в финансировании
        конкретного требования Фактор несёт ответственность в виде
        возмещения убытков Клиента."
        Ответ:
        {
          "late_financing_penalty_status": "present",
          "late_financing_penalty_display": "Предусмотрена",
          "wrongful_refusal_liability_status": "present",
          "wrongful_refusal_liability_display": "Предусмотрена",
          "factor_liability_summary": "Просрочка финансирования: да (неустойка 0,1% в день); Необоснованный отказ: да (возмещение убытков); Иные санкции: нет",
          "evidence": [
            {
              "clause_ref": "п. 11.2",
              "quote": "За просрочку выплаты финансирования Фактор уплачивает Клиенту неустойку в размере 0,1% от суммы просроченного финансирования за каждый день просрочки."
            }
          ]
        }

        Пример 2 — ответственность фактора не предусмотрена:
        Фрагмент:
        "Фактор выплачивает Клиенту финансирование в порядке, предусмотренном
        настоящим Договором. Ответственность Фактора за просрочку
        не предусмотрена."
        Ответ:
        {
          "late_financing_penalty_status": "not_defined",
          "late_financing_penalty_display": "Не предусмотрена",
          "wrongful_refusal_liability_status": "not_defined",
          "wrongful_refusal_liability_display": "Не предусмотрена",
          "factor_liability_summary": "Просрочка финансирования: нет; Необоснованный отказ: нет; Иные санкции: нет",
          "evidence": [
            {
              "clause_ref": "п. 11.2",
              "quote": "Ответственность Фактора за просрочку не предусмотрена."
            }
          ]
        }

        Пример 3 — текст есть, но вывод частичный
        (только неустойка за просрочку, без ответственности за отказ):
        Фрагмент:
        "В случае нарушения Фактором срока выплаты финансирования Клиент
        вправе требовать уплаты процентов по статье 395 ГК РФ."
        Ответ:
        {
          "late_financing_penalty_status": "present",
          "late_financing_penalty_display": "Предусмотрена",
          "wrongful_refusal_liability_status": "not_defined",
          "wrongful_refusal_liability_display": "Не предусмотрена",
          "factor_liability_summary": "Просрочка финансирования: да (проценты по ст. 395 ГК РФ); Необоснованный отказ: нет; Иные санкции: нет",
          "evidence": [
            {
              "clause_ref": "п. 11.2",
              "quote": "В случае нарушения Фактором срока выплаты финансирования Клиент вправе требовать уплаты процентов по статье 395 ГК РФ."
            }
          ]
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату об ответственности фактора за просрочку
           финансирования.
        2. Найди прямую цитату об ответственности фактора за
           необоснованный отказ.
        3. Проверь: если ответственность только на клиенте, все поля
           = "not_defined".
        4. Согласуй raw enum и display:
           late_financing_penalty_status -> late_financing_penalty_display:
             "present" -> "Предусмотрена";
             "not_defined" -> "Не предусмотрена".
           wrongful_refusal_liability_status -> wrongful_refusal_liability_display:
             "present" -> "Предусмотрена";
             "not_defined" -> "Не предусмотрена".
        5. Если прямой цитаты нет — верни "not_defined" для status-полей
           и "Не предусмотрена" для display-полей.
        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь РОВНО одним JSON-объектом без какого-либо дополнительного
        текста до или после, со всеми 6 ключами:
        {
          "late_financing_penalty_status": "<present / not_defined>",
          "late_financing_penalty_display": "<Предусмотрена / Не предусмотрена>",
          "wrongful_refusal_liability_status": "<present / not_defined>",
          "wrongful_refusal_liability_display": "<Предусмотрена / Не предусмотрена>",
          "factor_liability_summary": "<сводка одной строкой>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 8
      temperature: 0.0
      max_tokens: 700

    retrieval:
      retrieval_profile: "liability_cap_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "ответственность фактора неустойка за просрочку финансирования пеня за просрочку выплаты необоснованный отказ в финансировании санкции в пользу клиента ответственность финансового агента проценты по статье 395 ГК РФ"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - remedies
        - limitations
      negative_keywords:
        - "регресс"
        - "комиссия"
        - "уведомление должника"
        - "банкротство"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.30, 0.75]
        boost: 0.15
        scope: segment
      context_k: 8
      max_chunks: 10
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "obligations"
        - "remedies"
        - "limitations"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.12

    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 600

    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false
      llm_max_tokens: 1000

      presence_signal:
        field: "factor_liability_and_penalties_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора факторинга
        сведения об ответственности фактора перед клиентом:
        просрочка финансирования, необоснованный отказ, иные санкции.
        Не анализируй ответственность клиента, регресс, уступку
        или банкротство.
        Учитывай все формулировки: неустойка, пеня, проценты по ст. 395
        ГК РФ, обязанность возместить убытки.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. factor_liability_and_penalties_check_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (late_financing_penalty_status, wrongful_refusal_liability_status) = "present";
           - "missing" — если оба содержательных поля = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - late_financing_penalty_status = "not_defined";
           - wrongful_refusal_liability_status = "not_defined";
           - late_financing_penalty_display = "Не предусмотрена";
           - wrongful_refusal_liability_display = "Не предусмотрена";
           - factor_liability_summary = "Просрочка финансирования: нет; Необоснованный отказ: нет; Иные санкции: нет";
           - не выполняй остальные шаги.

        1.  late_financing_penalty_status — present / not_defined.
        2.  late_financing_penalty_display — "Предусмотрена" /
            "Не предусмотрена" (должно соответствовать
            late_financing_penalty_status).
        3.  wrongful_refusal_liability_status — present / not_defined.
        4.  wrongful_refusal_liability_display — "Предусмотрена" /
            "Не предусмотрена" (должно соответствовать
            wrongful_refusal_liability_status).
        5.  factor_liability_summary — сводка одной строкой.
        6.  evidence — массив цитат с clause_ref и quote.
        </task>

        <context_rules>
        - Перед остальными полями заполни factor_liability_and_penalties_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined", все *_display = "Не предусмотрена", factor_liability_summary = "Просрочка финансирования: нет; Необоснованный отказ: нет; Иные санкции: нет".
        - Используй только текст договора.
        - Не подставляй нормы закона вместо текста договора.
        - late_financing_penalty_status: "present" — есть неустойка, пеня, проценты по ст. 395 ГК РФ или иная обязанность возместить убытки за просрочку финансирования; "not_defined" — нет.
        - wrongful_refusal_liability_status: "present" — есть ответственность за необоснованный отказ в финансировании; "not_defined" — нет.
        - Если фрагменты конфликтуют и не позволяют сделать надёжный вывод, верни "Не удалось определить" для затронутого видимого поля и включи конфликтующие цитаты в evidence.
        - Запрещены значения null, None и пустые строки.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ответственности фактора перед клиентом.
           → presence = "missing";
             все *_status = "not_defined";
             все *_display = "Не предусмотрена";
             factor_liability_summary = "Просрочка финансирования: нет; Необоснованный отказ: нет; Иные санкции: нет".

        2. Частичное раскрытие.
           Есть только неустойка за просрочку финансирования, но нет ответственности за необоснованный отказ.
           → presence = "present";
             late_financing_penalty_status = "present";
             wrongful_refusal_liability_status = "not_defined";
             соответствующие *_display = "Предусмотрена" / "Не предусмотрена".

        3. Противоречие между фрагментами.
           В разных пунктах договора указаны противоречащие условия ответственности фактора.
           → presence = "unclear";
             соответствующие *_status = "not_defined";
             factor_liability_summary = "Не удалось определить".

        4. Полный набор ответственности.
           Есть неустойка за просрочку + ответственность за необоснованный отказ.
           → presence = "present";
             late_financing_penalty_status = "present";
             wrongful_refusal_liability_status = "present";
             соответствующие *_display = "Предусмотрена" / "Предусмотрена".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для factor_liability_and_penalties_check_presence используй только: "present", "missing", "unclear".
        - Для статусных enum-полей используй только допустимые значения из списка.
        - Fallback при отсутствии данных:
          * late_financing_penalty_display → "Не предусмотрена";
          * wrongful_refusal_liability_display → "Не предусмотрена";
          * factor_liability_summary → "Просрочка финансирования: нет; Необоснованный отказ: нет; Иные санкции: нет".
        - Fallback при противоречии или неоднозначности:
          * factor_liability_summary → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "factor_liability_and_penalties_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования об ответственности фактора перед клиентом. Внутреннее агрегатное signal-поле."
          required: true

        - name: "late_financing_penalty_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["present", "not_defined"]
          description: "Наличие неустойки за просрочку финансирования (raw enum). Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "late_financing_penalty_display"
          type: "string"
          presentation: "fact"
          label: "Неустойка за просрочку финансирования"
          description: >
            User-facing: Предусмотрена / Не предусмотрена. Fallback: "Не установлено" / "Не удалось определить".
          required: true
          display_in_grid: true
          display_priority: 1

        - name: "wrongful_refusal_liability_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["present", "not_defined"]
          description: "Наличие ответственности за необоснованный отказ (raw enum). Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "wrongful_refusal_liability_display"
          type: "string"
          presentation: "fact"
          label: "Ответственность за необоснованный отказ"
          description: >
            User-facing: Предусмотрена / Не предусмотрена. Fallback: "Не установлено" / "Не удалось определить".
          required: true
          display_in_grid: true
          display_priority: 2

        - name: "factor_liability_summary"
          type: "string"
          presentation: "fact"
          label: "Сводка по ответственности фактора"
          description: >
            Компактная сводка по ответственности фактора перед клиентом. Fallback: "Не установлено" / "Не удалось определить".
          required: true
          display_in_grid: true
          display_priority: 3

        - name: "evidence"
          type: "array"
          presentation: "diagnostic"
          description: "Точные цитаты из договора, подтверждающие извлечённые значения."
          required: true
          display_in_grid: false

      store_payload: true

  - id: financing_limits_and_concentration_check
    name: "Лимиты финансирования и концентрация портфеля (ст. 824, 826 ГК РФ)"
    description: >
      Проверка наличия и характера лимитов финансирования: на одного
      должника, на портфель, на одно требование, а также порядка
      пересмотра лимитов.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "лимит финансирования"
        - "лимит на должника"
        - "лимит на портфель"
        - "лимит концентрации"
        - "лимит на одно требование"
        - "максимальная сумма финансирования"
        - "пересмотр лимитов"
        - "кредитная политика фактора"
        - "лимитная политика"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)лимит.{0,40}(финансирован|должник|портфел|требован|концентрац)"
        - "(?i)максимальн(ая|ый).{0,30}(сумм|размер).{0,30}финансирован"
        - "(?i)(пересмотр|изменени).{0,30}лимит"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор факторинга по Главе 43 ГК РФ.
        Проверяется только один вопрос: лимиты финансирования и порядок
        их пересмотра.
        Нормативные ориентиры:
        - ст. 824 ГК РФ — обязательство фактора предоставить финансирование;
        - ст. 826 ГК РФ — предмет уступки;
        - коммерческая практика рамочного факторинга в РФ.
        Важно:
        - Твоя задача — не оценивать серьёзность риска.
        - Только установить, что прямо есть в тексте договора, а чего прямо нет.
        - В рамочном факторинге лимиты определяют реальный объём
          финансирования и концентрацию риска. Различай:
            * лимит на одного должника;
            * лимит на портфель в целом;
            * лимит на одно требование.
        - Лимиты могут быть выражены как:
            * конкретная сумма в рублях;
            * процент от суммы требования;
            * формула / порядок расчёта;
            * отсылка к отдельному документу (Лимитная политика,
              Кредитная политика фактора).
        - Все эти формы — валидны. Если лимиты установлены через отсылку
          к отдельному документу, отражай это как present с оговоркой.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Наличие лимита на одного должника.
        2. Наличие лимита на портфель.
        3. Порядок пересмотра лимитов (односторонне фактором /
           по согласованию / периодически).
        4. Составь краткую сводку по лимитам.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Если данные не указаны прямо:
           - для status-полей верни "not_defined";
           - для display-полей верни "Не установлен" / "Не установлено"
             по роду.
        4. Запрещены значения: null, None, пустые строки — не используй их
           никогда. Допустимые fallback-значения: "not_defined",
           "Не установлен", "Не установлено".
        5. per_debtor_limit_status:
           "present" — установлен лимит финансирования на одного должника
             (сумма, процент, формула, отсылка к лимитной политике);
           "not_defined" — лимит не установлен.
        6. portfolio_limit_status:
           "present" — установлен общий лимит на портфель требований;
           "not_defined" — лимит не установлен.
        7. limits_revision_status:
           "present" — определён порядок пересмотра лимитов (кем,
             как, с каким уведомлением);
           "not_defined" — порядок пересмотра не определён.
        8. financing_limits_summary — одна строка, формат:
           "Лимит на должника: <...>; Лимит на портфель: <...>;
           Лимит на требование: <да/нет>; Пересмотр: <...>".
           Конкретные суммы / проценты / отсылки указывай явно.
        9. В evidence включай только дословные цитаты из текста договора.
        10. Верни РОВНО один JSON-объект со всеми 8 ключами без какого-либо
            дополнительного текста до или после. Начни ответ сразу с
            открывающей фигурной скобки и закончи закрывающей. НЕ пиши
            Markdown, списки, код-фенсы. Ответ должен быть валидным JSON,
            пригодным для парсинга через json.loads без предварительной
            обработки.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — полный набор лимитов с конкретными суммами:
        Фрагмент:
        "Лимит финансирования на одного Должника не может превышать
        10 000 000 рублей. Общий лимит по портфелю уступленных требований
        составляет 100 000 000 рублей. Лимиты могут быть пересмотрены
        Фактором в одностороннем порядке с уведомлением Клиента
        за 10 рабочих дней."
        Ответ:
        {
          "per_debtor_limit_status": "present",
          "per_debtor_limit_display": "Установлен",
          "portfolio_limit_status": "present",
          "portfolio_limit_display": "Установлен",
          "limits_revision_status": "present",
          "limits_revision_display": "Установлен",
          "financing_limits_summary": "Лимит на должника: 10 000 000 руб.; Лимит на портфель: 100 000 000 руб.; Лимит на требование: не установлен; Пересмотр: односторонне Фактором, уведомление за 10 рабочих дней",
          "evidence": [
            {
              "clause_ref": "п. 4.3",
              "quote": "Лимит финансирования на одного Должника не может превышать 10 000 000 рублей. Общий лимит по портфелю уступленных требований составляет 100 000 000 рублей."
            }
          ]
        }

        Пример 2 — данных в договоре нет:
        Фрагмент:
        "Фактор финансирует Клиента в пределах согласованных Сторонами сумм."
        Ответ:
        {
          "per_debtor_limit_status": "not_defined",
          "per_debtor_limit_display": "Не установлен",
          "portfolio_limit_status": "not_defined",
          "portfolio_limit_display": "Не установлен",
          "limits_revision_status": "not_defined",
          "limits_revision_display": "Не установлено",
          "financing_limits_summary": "Лимит на должника: Не установлен; Лимит на портфель: Не установлен; Лимит на требование: не установлен; Пересмотр: Не установлено",
          "evidence": [
            {
              "clause_ref": "п. 4.3",
              "quote": "Фактор финансирует Клиента в пределах согласованных Сторонами сумм."
            }
          ]
        }

        Пример 3 — лимиты установлены через отсылку к отдельному документу:
        Фрагмент:
        "Лимиты финансирования определяются в соответствии с Лимитной
        политикой Фактора (Приложение № 3), являющейся неотъемлемой частью
        настоящего Договора. Фактор вправе пересматривать лимиты
        в одностороннем порядке."
        Ответ:
        {
          "per_debtor_limit_status": "present",
          "per_debtor_limit_display": "Установлен",
          "portfolio_limit_status": "present",
          "portfolio_limit_display": "Установлен",
          "limits_revision_status": "present",
          "limits_revision_display": "Установлен",
          "financing_limits_summary": "Лимит на должника: Согласно Лимитной политике (Приложение № 3); Лимит на портфель: Согласно Лимитной политике; Лимит на требование: не установлен; Пересмотр: односторонне Фактором",
          "evidence": [
            {
              "clause_ref": "п. 4.3",
              "quote": "Лимиты финансирования определяются в соответствии с Лимитной политикой Фактора (Приложение № 3), являющейся неотъемлемой частью настоящего Договора."
            }
          ]
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о лимите на должника (если есть).
        2. Найди прямую цитату о лимите на портфель (если есть).
        3. Найди прямую цитату о порядке пересмотра лимитов (если есть).
        4. Проверь: если лимиты установлены через отсылку к лимитной
           политике или отдельному документу — это "present"
           (не "not_defined").
        5. Согласуй raw enum и display:
           per_debtor_limit_status -> per_debtor_limit_display:
             "present" -> "Установлен";
             "not_defined" -> "Не установлен".
           portfolio_limit_status -> portfolio_limit_display:
             "present" -> "Установлен";
             "not_defined" -> "Не установлен".
           limits_revision_status -> limits_revision_display:
             "present" -> "Установлен";
             "not_defined" -> "Не установлено".
        6. Если прямой цитаты нет — верни "not_defined" для status-полей
           и соответствующий fallback для display-полей.
        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь РОВНО одним JSON-объектом без какого-либо дополнительного
        текста до или после, со всеми 8 ключами:
        {
          "per_debtor_limit_status": "<present / not_defined>",
          "per_debtor_limit_display": "<Установлен / Не установлен>",
          "portfolio_limit_status": "<present / not_defined>",
          "portfolio_limit_display": "<Установлен / Не установлен>",
          "limits_revision_status": "<present / not_defined>",
          "limits_revision_display": "<Установлен / Не установлено>",
          "financing_limits_summary": "<сводка одной строкой>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 8
      temperature: 0.0
      max_tokens: 800

    retrieval:
      retrieval_profile: "payment_terms_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "лимит финансирования лимит на одного должника лимит на портфель лимит концентрации лимит на одно требование максимальная сумма финансирования порядок пересмотра лимитов лимитная политика кредитная политика фактора"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - procedures
        - limitations
      negative_keywords:
        - "регресс"
        - "уведомление должника"
        - "зачет"
        - "банкротство"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.20, 0.60]
        boost: 0.15
        scope: segment
      context_k: 8
      max_chunks: 10
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "obligations"
        - "procedures"
        - "limitations"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.12

    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 600

    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false
      llm_max_tokens: 1200

      presence_signal:
        field: "financing_limits_and_concentration_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора факторинга
        сведения о лимитах финансирования: на одного должника,
        на портфель, на одно требование, а также порядок пересмотра
        лимитов.
        Не анализируй регресс, комиссию, уведомление должника или
        банкротство.
        Учитывай все формы установления лимитов: конкретная сумма,
        процент, формула, отсылка к лимитной политике или приложению.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. financing_limits_and_concentration_check_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (per_debtor_limit_status, portfolio_limit_status, limits_revision_status) = "present";
           - "missing" — если все три содержательных поля = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - per_debtor_limit_status = "not_defined";
           - portfolio_limit_status = "not_defined";
           - limits_revision_status = "not_defined";
           - per_debtor_limit_display = "Не установлен";
           - portfolio_limit_display = "Не установлен";
           - limits_revision_display = "Не установлено";
           - financing_limits_summary = "Лимит на должника: Не установлен; Лимит на портфель: Не установлен; Лимит на требование: не установлен; Пересмотр: Не установлено";
           - не выполняй остальные шаги.

        1.  per_debtor_limit_status — present / not_defined.
        2.  per_debtor_limit_display — "Установлен" / "Не установлен"
            (должно соответствовать per_debtor_limit_status).
        3.  portfolio_limit_status — present / not_defined.
        4.  portfolio_limit_display — "Установлен" / "Не установлен"
            (должно соответствовать portfolio_limit_status).
        5.  limits_revision_status — present / not_defined.
        6.  limits_revision_display — "Установлен" / "Не установлено"
            (должно соответствовать limits_revision_status).
        7.  financing_limits_summary — сводка одной строкой.
        8.  evidence — массив цитат с clause_ref и quote.
        </task>

        <context_rules>
        - Перед остальными полями заполни financing_limits_and_concentration_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined", все *_display = "Не установлен" / "Не установлено", financing_limits_summary = "Лимит на должника: Не установлен; Лимит на портфель: Не установлен; Лимит на требование: не установлен; Пересмотр: Не установлено".
        - Используй только текст договора.
        - Не подставляй нормы закона вместо текста договора.
        - per_debtor_limit_status: "present" — установлен лимит на одного должника (сумма, процент, формула или отсылка); "not_defined" — лимита нет.
        - portfolio_limit_status: "present" — установлен общий лимит на портфель; "not_defined" — нет.
        - limits_revision_status: "present" — определён порядок пересмотра лимитов; "not_defined" — не определён.
        - Если фрагменты конфликтуют и не позволяют сделать надёжный вывод, верни "Не удалось определить" для затронутого видимого поля и включи конфликтующие цитаты в evidence.
        - Запрещены значения null, None и пустые строки.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет упоминания лимитов финансирования или порядка их пересмотра.
           → presence = "missing";
             все *_status = "not_defined";
             все *_display = "Не установлен" / "Не установлено";
             financing_limits_summary = "Лимит на должника: Не установлен; Лимит на портфель: Не установлен; Лимит на требование: не установлен; Пересмотр: Не установлено".

        2. Частичное раскрытие (отсылка к политике).
           Лимиты установлены через отсылку к Лимитной политике, но конкретные суммы в тексте не указаны.
           → presence = "present";
             per_debtor_limit_status = "present";
             portfolio_limit_status = "present";
             limits_revision_status = "present";
             financing_limits_summary = "Лимит на должника: Согласно Лимитной политике; Лимит на портфель: Согласно Лимитной политике; Лимит на требование: не установлен; Пересмотр: односторонне Фактором".

        3. Противоречие между фрагментами.
           В разных пунктах договора указаны противоречащие условия о лимитах или порядке их пересмотра.
           → presence = "unclear";
             соответствующие *_status = "not_defined";
             financing_limits_summary = "Не удалось определить".

        4. Полное раскрытие с конкретными суммами.
           Прямо указаны лимит на должника, лимит на портфель и порядок пересмотра с уведомлением.
           → presence = "present";
             все *_status = "present";
             financing_limits_summary = "Лимит на должника: <сумма>; Лимит на портфель: <сумма>; Лимит на требование: не установлен; Пересмотр: <порядок>".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для financing_limits_and_concentration_check_presence используй только: "present", "missing", "unclear".
        - Для статусных enum-полей используй только допустимые значения из списка.
        - Fallback при отсутствии данных:
          * per_debtor_limit_display → "Не установлен";
          * portfolio_limit_display → "Не установлен";
          * limits_revision_display → "Не установлено";
          * financing_limits_summary → "Лимит на должника: Не установлен; Лимит на портфель: Не установлен; Лимит на требование: не установлен; Пересмотр: Не установлено".
        - Fallback при противоречии или неоднозначности:
          * financing_limits_summary → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "financing_limits_and_concentration_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования о лимитах финансирования. Внутреннее агрегатное signal-поле."
          required: true

        - name: "per_debtor_limit_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["present", "not_defined"]
          description: "Наличие лимита на одного должника (raw enum). Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "per_debtor_limit_display"
          type: "string"
          presentation: "fact"
          label: "Лимит на одного должника"
          description: >
            User-facing: Установлен / Не установлен. Fallback: "Не установлено" / "Не удалось определить".
          required: true
          display_in_grid: true
          display_priority: 1

        - name: "portfolio_limit_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["present", "not_defined"]
          description: "Наличие лимита на портфель (raw enum). Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "portfolio_limit_display"
          type: "string"
          presentation: "fact"
          label: "Лимит на портфель"
          description: >
            User-facing: Установлен / Не установлен. Fallback: "Не установлено" / "Не удалось определить".
          required: true
          display_in_grid: true
          display_priority: 2

        - name: "limits_revision_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["present", "not_defined"]
          description: "Наличие порядка пересмотра лимитов (raw enum). Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "limits_revision_display"
          type: "string"
          presentation: "fact"
          label: "Порядок пересмотра лимитов"
          description: >
            User-facing: Установлен / Не установлено. Fallback: "Не установлено" / "Не удалось определить".
          required: true
          display_in_grid: true
          display_priority: 3

        - name: "financing_limits_summary"
          type: "string"
          presentation: "fact"
          label: "Сводка по лимитам финансирования"
          description: >
            Компактная сводка по лимитам и порядку пересмотра. Fallback: "Не установлено" / "Не удалось определить".
          required: true
          display_in_grid: true
          display_priority: 4

        - name: "evidence"
          type: "array"
          presentation: "diagnostic"
          description: "Точные цитаты из договора, подтверждающие извлечённые значения."
          required: true
          display_in_grid: false

      store_payload: true

  - id: framework_assignment_mechanics_check
    name: "Механика рамочного факторинга: заявки, акты, момент перехода требования (ст. 826, 388.1 ГК РФ)"
    description: >
      Проверка механизма уступки конкретных требований в рамочном факторинге:
      через заявку, акт, реестр; момент перехода требования к фактору.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "рамочный факторинг"
        - "рамочный договор"
        - "заявка клиента"
        - "акт уступки"
        - "реестр требований"
        - "реестр уступленных требований"
        - "момент перехода требования"
        - "с даты подписания акта"
        - "уступка будущего требования"
        - "партия требований"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)(рамочн(ый|ого)|рамк).{0,30}договор"
        - "(?i)(заявк|акт\\s+уступк|реестр).{0,40}(требован|уступк)"
        - "(?i)(требовани|право).{0,40}переход.{0,40}(фактор|финансов\\w+\\s+агент)"
        - "(?i)с\\s+дат[ыи].{0,40}(подписани|выплат).{0,40}(акт|финансирован)"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор факторинга по Главе 43 ГК РФ.
        Проверяется только один вопрос: механика уступки конкретных
        требований в рамках рамочного договора и момент перехода требования.
        Нормативные ориентиры:
        - ст. 826 ГК РФ — предмет уступки;
        - ст. 388.1 ГК РФ — уступка будущего требования.
        Важно:
        - Твоя задача — не оценивать серьёзность риска.
        - Только установить, что прямо есть в тексте договора, а чего прямо нет.
        - В РФ доминирует рамочный факторинг: договор устанавливает общие
          условия, а конкретные требования уступаются партиями по заявкам
          клиента и актам уступки (или через реестры).
        - Различай три типа:
            * framework — рамочный: общие условия + заявки/акты;
            * single_claim — единичная уступка: конкретное требование
              уступается сразу;
            * mixed — смешанный: и то, и другое.
        - Механизм уступки:
            * application — через заявку клиента;
            * act — через акт уступки;
            * registry — через реестр требований;
            * other — иной механизм.
        - Момент перехода требования критичен: подписание акта / выплата
          финансирования / получение заявки фактором. Разные моменты =
          разные риски. Отражай конкретику в summary.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Тип договора (рамочный / единичная уступка / смешанный).
        2. Механизм уступки конкретных требований.
        3. Момент перехода требования к фактору.
        4. Составь краткую сводку.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Если данные не указаны прямо:
           - для status-полей верни "not_defined";
           - для display-полей верни "Не установлено" / "Не определён"
             по роду.
        4. Запрещены значения: null, None, пустые строки — не используй их
           никогда. Допустимые fallback-значения: "not_defined",
           "Не установлено", "Не определён".
        5. framework_type_status:
           "framework" — договор прямо определён как рамочный, конкретные
             требования уступаются отдельно;
           "single_claim" — единичная уступка конкретного требования;
           "mixed" — признаки обоих типов;
           "not_defined" — тип не определён.
        6. assignment_mechanism_status:
           "application" — через заявку клиента;
           "act" — через акт уступки;
           "registry" — через реестр требований;
           "other" — иной механизм;
           "not_defined" — механизм не определён.
        7. transfer_moment_status:
           "specified" — прямо указан момент перехода требования;
           "not_defined" — момент не указан.
           Конкретику момента (подписание акта / выплата / иное) обязательно
           отражай в framework_assignment_summary.
        8. framework_assignment_summary — одна строка, формат:
           "Тип: <...>; Механизм: <...>; Момент перехода: <...>".
        9. В evidence включай только дословные цитаты из текста договора.
        10. Верни РОВНО один JSON-объект со всеми 7 ключами без какого-либо
            дополнительного текста до или после. Начни ответ сразу с
            открывающей фигурной скобки и закончи закрывающей. НЕ пиши
            Markdown, списки, код-фенсы. Ответ должен быть валидным JSON,
            пригодным для парсинга через json.loads без предварительной
            обработки.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — рамочный факторинг с чётким механизмом:
        Фрагмент:
        "Настоящий Договор является рамочным. Конкретные требования
        уступаются на основании Заявок Клиента и Актов уступки. Требование
        переходит к Фактору с даты подписания соответствующего Акта уступки."
        Ответ:
        {
          "framework_type_status": "framework",
          "framework_type_display": "Рамочный",
          "assignment_mechanism_status": "act",
          "assignment_mechanism_display": "Через акт",
          "transfer_moment_status": "specified",
          "framework_assignment_summary": "Тип: Рамочный; Механизм: Через акт уступки (по заявкам Клиента); Момент перехода: с даты подписания Акта уступки",
          "evidence": [
            {
              "clause_ref": "п. 1.2",
              "quote": "Настоящий Договор является рамочным. Конкретные требования уступаются на основании Заявок Клиента и Актов уступки."
            }
          ]
        }

        Пример 2 — единичная уступка без рамочной механики:
        Фрагмент:
        "Клиент уступает Фактору конкретное денежное требование к ООО
        «Покупатель» по договору поставки № 45 от 01.03.2024."
        Ответ:
        {
          "framework_type_status": "single_claim",
          "framework_type_display": "Единичная уступка",
          "assignment_mechanism_status": "not_defined",
          "assignment_mechanism_display": "Не установлено",
          "transfer_moment_status": "not_defined",
          "framework_assignment_summary": "Тип: Единичная уступка; Механизм: Не установлено; Момент перехода: Не определён",
          "evidence": [
            {
              "clause_ref": "п. 1.1",
              "quote": "Клиент уступает Фактору конкретное денежное требование к ООО «Покупатель» по договору поставки № 45 от 01.03.2024."
            }
          ]
        }

        Пример 3 — текст есть, но вывод частичный
        (механизм указан, момент перехода не определён):
        Фрагмент:
        "Требования уступаются партиями на основании заявок Клиента,
        оформляемых по форме Приложения № 2."
        Ответ:
        {
          "framework_type_status": "framework",
          "framework_type_display": "Рамочный",
          "assignment_mechanism_status": "application",
          "assignment_mechanism_display": "Через заявку",
          "transfer_moment_status": "not_defined",
          "framework_assignment_summary": "Тип: Рамочный; Механизм: Через заявку Клиента (форма Приложения № 2); Момент перехода: Не определён",
          "evidence": [
            {
              "clause_ref": "п. 1.2",
              "quote": "Требования уступаются партиями на основании заявок Клиента, оформляемых по форме Приложения № 2."
            }
          ]
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о типе договора (рамочный / единичная уступка).
        2. Найди прямую цитату о механизме уступки (заявка / акт / реестр).
        3. Найди прямую цитату о моменте перехода требования.
        4. Если в договоре нет прямого указания на момент перехода —
           transfer_moment_status = "not_defined", но в summary отражай
           всё, что есть.
        5. Согласуй raw enum и display:
           framework_type_status -> framework_type_display:
             "framework" -> "Рамочный";
             "single_claim" -> "Единичная уступка";
             "mixed" -> "Смешанный";
             "not_defined" -> "Не установлено".
           assignment_mechanism_status -> assignment_mechanism_display:
             "application" -> "Через заявку";
             "act" -> "Через акт";
             "registry" -> "Через реестр";
             "other" -> "Иной механизм";
             "not_defined" -> "Не установлено".
        6. Если прямой цитаты нет — верни "not_defined" для status-полей
           и соответствующий fallback для display-полей.
        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь РОВНО одним JSON-объектом без какого-либо дополнительного
        текста до или после, со всеми 7 ключами:
        {
          "framework_type_status": "<framework / single_claim / mixed / not_defined>",
          "framework_type_display": "<Рамочный / Единичная уступка / Смешанный / Не установлено>",
          "assignment_mechanism_status": "<application / act / registry / other / not_defined>",
          "assignment_mechanism_display": "<Через заявку / Через акт / Через реестр / Иной механизм / Не установлено>",
          "transfer_moment_status": "<specified / not_defined>",
          "framework_assignment_summary": "<сводка одной строкой>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 8
      temperature: 0.0
      max_tokens: 750

    retrieval:
      retrieval_profile: "assignment_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "рамочный факторинг заявка клиента акт уступки реестр требований момент перехода требования с даты подписания акта с даты выплаты финансирования уступка будущего требования партия требований оформление уступки"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - procedures
        - obligations
        - definitions
      negative_keywords:
        - "регресс"
        - "комиссия"
        - "уведомление должника"
        - "банкротство"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.10, 0.50]
        boost: 0.15
        scope: segment
      context_k: 8
      max_chunks: 10
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "procedures"
        - "obligations"
        - "definitions"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.12

    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 600

    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false
      llm_max_tokens: 1100

      presence_signal:
        field: "framework_assignment_mechanics_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора факторинга
        сведения о механике уступки: тип договора (рамочный / единичная
        уступка), механизм (заявка / акт / реестр), момент перехода
        требования к фактору.
        Не анализируй регресс, финансирование, комиссию или уведомление
        должника.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. framework_assignment_mechanics_check_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (framework_type_status, assignment_mechanism_status, transfer_moment_status) ≠ "not_defined";
           - "missing" — если все три содержательных поля = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - framework_type_status = "not_defined";
           - assignment_mechanism_status = "not_defined";
           - transfer_moment_status = "not_defined";
           - framework_type_display = "Не установлено";
           - assignment_mechanism_display = "Не установлено";
           - framework_assignment_summary = "Тип: Не установлено; Механизм: Не установлено; Момент перехода: Не определён";
           - не выполняй остальные шаги.

        1.  framework_type_status — framework / single_claim / mixed / not_defined.
        2.  framework_type_display — "Рамочный" / "Единичная уступка" /
            "Смешанный" / "Не установлено" (должно соответствовать
            framework_type_status).
        3.  assignment_mechanism_status — application / act / registry /
            other / not_defined.
        4.  assignment_mechanism_display — "Через заявку" / "Через акт" /
            "Через реестр" / "Иной механизм" / "Не установлено"
            (должно соответствовать assignment_mechanism_status).
        5.  transfer_moment_status — specified / not_defined.
        6.  framework_assignment_summary — сводка одной строкой.
        7.  evidence — массив цитат с clause_ref и quote.
        </task>

        <context_rules>
        - Перед остальными полями заполни framework_assignment_mechanics_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined", все *_display = "Не установлено", framework_assignment_summary = "Тип: Не установлено; Механизм: Не установлено; Момент перехода: Не определён".
        - Используй только текст договора.
        - Не подставляй нормы закона вместо текста договора.
        - framework_type_status: "framework" — рамочный; "single_claim" — единичная уступка; "mixed" — оба типа; "not_defined" — не определён.
        - assignment_mechanism_status: "application" — через заявку; "act" — через акт; "registry" — через реестр; "other" — иной; "not_defined" — не определён.
        - transfer_moment_status: "specified" — момент прямо указан; "not_defined" — не указан. Конкретику момента обязательно отражай в summary.
        - Если фрагменты конфликтуют и не позволяют сделать надёжный вывод, верни "Не удалось определить" для затронутого видимого поля и включи конфликтующие цитаты в evidence.
        - Запрещены значения null, None и пустые строки.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет упоминания типа договора, механизма уступки или момента перехода требования.
           → presence = "missing";
             все *_status = "not_defined";
             все *_display = "Не установлено";
             framework_assignment_summary = "Тип: Не установлено; Механизм: Не установлено; Момент перехода: Не определён".

        2. Частичное раскрытие (механизм есть, момент не указан).
           Указано, что требования уступаются по заявкам, но момент перехода требования не определён.
           → presence = "present";
             framework_type_status = "framework";
             assignment_mechanism_status = "application";
             transfer_moment_status = "not_defined";
             framework_assignment_summary = "Тип: Рамочный; Механизм: Через заявку; Момент перехода: Не определён".

        3. Противоречие между фрагментами.
           В разных пунктах договора указаны противоречащие условия о механизме уступки или моменте перехода.
           → presence = "unclear";
             соответствующие *_status = "not_defined";
             framework_assignment_summary = "Не удалось определить".

        4. Полное раскрытие рамочной механики.
           Прямо указан рамочный тип, механизм через акт уступки и момент перехода с даты подписания.
           → presence = "present";
             framework_type_status = "framework";
             assignment_mechanism_status = "act";
             transfer_moment_status = "specified";
             framework_assignment_summary = "Тип: Рамочный; Механизм: Через акт уступки; Момент перехода: с даты подписания Акта уступки".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для framework_assignment_mechanics_check_presence используй только: "present", "missing", "unclear".
        - Для статусных enum-полей используй только допустимые значения из списка.
        - Fallback при отсутствии данных:
          * framework_type_display → "Не установлено";
          * assignment_mechanism_display → "Не установлено";
          * framework_assignment_summary → "Тип: Не установлено; Механизм: Не установлено; Момент перехода: Не определён".
        - Fallback при противоречии или неоднозначности:
          * framework_assignment_summary → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "framework_assignment_mechanics_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования о механике уступки требований. Внутреннее агрегатное signal-поле."
          required: true

        - name: "framework_type_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["framework", "single_claim", "mixed", "not_defined"]
          description: "Тип договора (raw enum). Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "framework_type_display"
          type: "string"
          presentation: "fact"
          label: "Тип договора"
          description: >
            User-facing: Рамочный / Единичная уступка / Смешанный / Не установлено. Fallback: "Не установлено" / "Не удалось определить".
          required: true
          display_in_grid: true
          display_priority: 1

        - name: "assignment_mechanism_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["application", "act", "registry", "other", "not_defined"]
          description: "Механизм уступки (raw enum). Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "assignment_mechanism_display"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 2
          label: "Механизм уступки"
          description: >
            User-facing: Через заявку / Через акт / Через реестр /
            Иной механизм / Не установлено.
            Fallback: "Не установлено" / "Не удалось определить".
          required: true

        - name: "transfer_moment_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["specified", "not_defined"]
          description: "Определённость момента перехода (raw enum). Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "framework_assignment_summary"
          type: "string"
          presentation: "fact"
          label: "Сводка по механике уступки"
          description: >
            Компактная сводка: тип, механизм, момент перехода. Fallback: "Не установлено" / "Не удалось определить".
          required: true
          display_in_grid: true
          display_priority: 3

        - name: "evidence"
          type: "array"
          presentation: "diagnostic"
          description: "Точные цитаты из договора, подтверждающие извлечённые значения."
          required: true
          display_in_grid: false

      store_payload: true

  - id: factor_suspension_right_check
    name: "Право фактора отказать / приостановить финансирование (ст. 824 ГК РФ)"
    description: >
      Проверка наличия у фактора права отказать в финансировании
      конкретного требования, приостановить финансирование по портфелю
      и потребовать досрочного возврата ранее выплаченного.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "право отказать в финансировании"
        - "приостановить финансирование"
        - "приостановление финансирования"
        - "досрочный возврат финансирования"
        - "односторонний отказ фактора"
        - "право фактора отказать"
        - "не финансировать требование"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)(фактор|финансов\\w+\\s+агент).{0,60}(вправе|имеет\\s+право).{0,60}(отказ|приостанов|досрочн)"
        - "(?i)(отказ|приостанов).{0,40}финансирован"
        - "(?i)досрочн\\w+\\s+возврат.{0,40}финансирован"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор факторинга по Главе 43 ГК РФ.
        Проверяется только один вопрос: есть ли у фактора рычаги отказа,
        приостановки и досрочного возврата финансирования.
        Нормативные ориентиры:
        - ст. 824 ГК РФ — диспозитивные обязательства фактора;
        - принцип свободы договора (ст. 421 ГК РФ).
        Важно:
        - Твоя задача — не оценивать серьёзность риска.
        - Только установить, что прямо есть в тексте договора, а чего прямо нет.
        - Различай три разных права фактора:
            * refusal_right — отказать в финансировании конкретного
              требования (например, при появлении признаков его
              недействительности);
            * suspension_right — приостановить финансирование
              по портфелю (например, при ухудшении качества портфеля
              или нарушении заверений клиентом);
            * early_repayment_demand — потребовать досрочного возврата
              ранее выплаченного финансирования (при существенных
              нарушениях).
        - Это ключевые escape mechanisms фактора. Их отсутствие = фактор
          связан обязательствами, даже если появились риски.
        - Условия активации прав отражай в summary: что триггерит отказ /
          приостановку / досрочный возврат.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Право фактора отказать в финансировании конкретного требования.
        2. Право фактора приостановить финансирование по портфелю.
        3. Право фактора потребовать досрочного возврата финансирования.
        4. Составь краткую сводку с указанием условий активации.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Если данные не указаны прямо:
           - для status-полей верни "not_defined";
           - для display-полей верни "Не предусмотрено" / "Не установлено"
             по роду.
        4. Запрещены значения: null, None, пустые строки — не используй их
           никогда. Допустимые fallback-значения: "not_defined",
           "Не предусмотрено", "Не установлено".
        5. refusal_right_status / suspension_right_status /
           early_repayment_demand_status:
           "present" — соответствующее право прямо предусмотрено
             в договоре;
           "not_defined" — право не предусмотрено.
        6. factor_rights_summary — одна строка, формат:
           "Отказ: <да/нет>; Приостановление: <да/нет>;
           Досрочный возврат: <да/нет>".
           Если указаны условия активации — отражай их кратко
           (например, «при недействительности требования»).
        7. В evidence включай только дословные цитаты из текста договора.
        8. Верни РОВНО один JSON-объект со всеми 8 ключами без какого-либо
           дополнительного текста до или после. Начни ответ сразу с
           открывающей фигурной скобки и закончи закрывающей. НЕ пиши
           Markdown, списки, код-фенсы. Ответ должен быть валидным JSON,
           пригодным для парсинга через json.loads без предварительной
           обработки.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — полный набор прав:
        Фрагмент:
        "Фактор вправе отказать в финансировании конкретного требования
        при обнаружении признаков его недействительности. Фактор вправе
        приостановить финансирование по портфелю при нарушении Клиентом
        заверений. При существенном нарушении Клиентом своих обязательств
        Фактор вправе потребовать досрочного возврата ранее выплаченного
        финансирования."
        Ответ:
        {
          "refusal_right_status": "present",
          "refusal_right_display": "Предусмотрено",
          "suspension_right_status": "present",
          "suspension_right_display": "Предусмотрено",
          "early_repayment_demand_status": "present",
          "early_repayment_demand_display": "Предусмотрено",
          "factor_rights_summary": "Отказ: да (при недействительности требования); Приостановление: да (при нарушении заверений); Досрочный возврат: да (при существенном нарушении)",
          "evidence": [
            {
              "clause_ref": "п. 5.4",
              "quote": "Фактор вправе отказать в финансировании конкретного требования при обнаружении признаков его недействительности."
            }
          ]
        }

        Пример 2 — прав фактора нет:
        Фрагмент:
        "Фактор обязуется финансировать все уступаемые Клиентом требования
        в порядке и на условиях, предусмотренных настоящим Договором."
        Ответ:
        {
          "refusal_right_status": "not_defined",
          "refusal_right_display": "Не предусмотрено",
          "suspension_right_status": "not_defined",
          "suspension_right_display": "Не предусмотрено",
          "early_repayment_demand_status": "not_defined",
          "early_repayment_demand_display": "Не предусмотрено",
          "factor_rights_summary": "Отказ: нет; Приостановление: нет; Досрочный возврат: нет",
          "evidence": [
            {
              "clause_ref": "п. 3.1",
              "quote": "Фактор обязуется финансировать все уступаемые Клиентом требования в порядке и на условиях, предусмотренных настоящим Договором."
            }
          ]
        }

        Пример 3 — текст есть, но вывод частичный
        (только право отказа, без приостановки и досрочного возврата):
        Фрагмент:
        "Фактор вправе отказаться от финансирования требования
        в случае выявления обстоятельств, свидетельствующих о его
        недействительности."
        Ответ:
        {
          "refusal_right_status": "present",
          "refusal_right_display": "Предусмотрено",
          "suspension_right_status": "not_defined",
          "suspension_right_display": "Не предусмотрено",
          "early_repayment_demand_status": "not_defined",
          "early_repayment_demand_display": "Не предусмотрено",
          "factor_rights_summary": "Отказ: да (при недействительности требования); Приостановление: нет; Досрочный возврат: нет",
          "evidence": [
            {
              "clause_ref": "п. 5.4",
              "quote": "Фактор вправе отказаться от финансирования требования в случае выявления обстоятельств, свидетельствующих о его недействительности."
            }
          ]
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о праве отказа.
        2. Найди прямую цитату о праве приостановки.
        3. Найди прямую цитату о праве досрочного возврата.
        4. Если указано только одно право — отражай точечно.
        5. Согласуй raw enum и display:
           refusal_right_status / suspension_right_status /
           early_repayment_demand_status -> *_display:
             "present" -> "Предусмотрено";
             "not_defined" -> "Не предусмотрено".
        6. Если прямой цитаты нет — верни "not_defined" для status-полей
           и "Не предусмотрено" для display-полей.
        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь РОВНО одним JSON-объектом без какого-либо дополнительного
        текста до или после, со всеми 8 ключами:
        {
          "refusal_right_status": "<present / not_defined>",
          "refusal_right_display": "<Предусмотрено / Не предусмотрено>",
          "suspension_right_status": "<present / not_defined>",
          "suspension_right_display": "<Предусмотрено / Не предусмотрено>",
          "early_repayment_demand_status": "<present / not_defined>",
          "early_repayment_demand_display": "<Предусмотрено / Не предусмотрено>",
          "factor_rights_summary": "<сводка одной строкой>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 8
      temperature: 0.0
      max_tokens: 800

    retrieval:
      retrieval_profile: "liability_cap_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "право фактора отказать в финансировании приостановление финансирования досрочный возврат финансирования односторонний отказ фактора приостановить финансирование при нарушении заверений escape mechanism отказ от финансирования требования"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - remedies
        - limitations
      negative_keywords:
        - "комиссия"
        - "уведомление должника"
        - "банкротство"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.20, 0.65]
        boost: 0.15
        scope: segment
      context_k: 8
      max_chunks: 10
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "obligations"
        - "remedies"
        - "limitations"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.12

    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 600

    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false
      llm_max_tokens: 1200

      presence_signal:
        field: "factor_suspension_right_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора факторинга
        сведения о правах фактора: отказать в финансировании конкретного
        требования, приостановить финансирование по портфелю,
        потребовать досрочного возврата финансирования.
        Не анализируй комиссию, уведомление должника или банкротство.
        Различай три разных права — каждое отражай отдельно.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. factor_suspension_right_check_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (refusal_right_status, suspension_right_status, early_repayment_demand_status) = "present";
           - "missing" — если все три содержательных поля = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - refusal_right_status = "not_defined";
           - suspension_right_status = "not_defined";
           - early_repayment_demand_status = "not_defined";
           - refusal_right_display = "Не предусмотрено";
           - suspension_right_display = "Не предусмотрено";
           - early_repayment_demand_display = "Не предусмотрено";
           - factor_rights_summary = "Отказ: нет; Приостановление: нет; Досрочный возврат: нет";
           - не выполняй остальные шаги.

        1.  refusal_right_status — present / not_defined.
        2.  refusal_right_display — "Предусмотрено" / "Не предусмотрено"
            (должно соответствовать refusal_right_status).
        3.  suspension_right_status — present / not_defined.
        4.  suspension_right_display — "Предусмотрено" /
            "Не предусмотрено" (должно соответствовать
            suspension_right_status).
        5.  early_repayment_demand_status — present / not_defined.
        6.  early_repayment_demand_display — "Предусмотрено" /
            "Не предусмотрено" (должно соответствовать
            early_repayment_demand_status).
        7.  factor_rights_summary — сводка одной строкой.
        8.  evidence — массив цитат с clause_ref и quote.
        </task>

        <context_rules>
        - Перед остальными полями заполни factor_suspension_right_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined", все *_display = "Не предусмотрено", factor_rights_summary = "Отказ: нет; Приостановление: нет; Досрочный возврат: нет".
        - Используй только текст договора.
        - Не подставляй нормы закона вместо текста договора.
        - refusal_right_status: "present" — есть право отказать в финансировании конкретного требования; "not_defined" — нет.
        - suspension_right_status: "present" — есть право приостановить финансирование по портфелю; "not_defined" — нет.
        - early_repayment_demand_status: "present" — есть право потребовать досрочного возврата финансирования; "not_defined" — нет.
        - Если фрагменты конфликтуют и не позволяют сделать надёжный вывод, верни "Не удалось определить" для затронутого видимого поля и включи конфликтующие цитаты в evidence.
        - Запрещены значения null, None и пустые строки.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет упоминания прав фактора на отказ, приостановку или досрочный возврат.
           → presence = "missing";
             все *_status = "not_defined";
             все *_display = "Не предусмотрено";
             factor_rights_summary = "Отказ: нет; Приостановление: нет; Досрочный возврат: нет".

        2. Частичное раскрытие.
           Указано только право отказа в финансировании конкретного требования, без приостановки и досрочного возврата.
           → presence = "present";
             refusal_right_status = "present";
             suspension_right_status = early_repayment_demand_status = "not_defined";
             factor_rights_summary = "Отказ: да (при недействительности требования); Приостановление: нет; Досрочный возврат: нет".

        3. Противоречие между фрагментами.
           В разных пунктах договора указаны противоречащие условия о правах фактора.
           → presence = "unclear";
             соответствующие *_status = "not_defined";
             factor_rights_summary = "Не удалось определить".

        4. Полный набор прав.
           Прямо указаны все три права с условиями их активации.
           → presence = "present";
             все *_status = "present";
             factor_rights_summary = "Отказ: да (при недействительности); Приостановление: да (при нарушении заверений); Досрочный возврат: да (при существенном нарушении)".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для factor_suspension_right_check_presence используй только: "present", "missing", "unclear".
        - Для статусных enum-полей используй только допустимые значения из списка.
        - Fallback при отсутствии данных:
          * refusal_right_display → "Не предусмотрено";
          * suspension_right_display → "Не предусмотрено";
          * early_repayment_demand_display → "Не предусмотрено";
          * factor_rights_summary → "Отказ: нет; Приостановление: нет; Досрочный возврат: нет".
        - Fallback при противоречии или неоднозначности:
          * factor_rights_summary → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "factor_suspension_right_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования о правах фактора на отказ/приостановку/возврат. Внутреннее агрегатное signal-поле."
          required: true

        - name: "refusal_right_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["present", "not_defined"]
          description: "Наличие права отказать в финансировании (raw enum). Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "refusal_right_display"
          type: "string"
          presentation: "fact"
          label: "Право отказать в финансировании"
          description: >
            User-facing: Предусмотрено / Не предусмотрено. Fallback: "Не установлено" / "Не удалось определить".
          required: true
          display_in_grid: true
          display_priority: 1

        - name: "suspension_right_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["present", "not_defined"]
          description: "Наличие права приостановить финансирование (raw enum). Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "suspension_right_display"
          type: "string"
          presentation: "fact"
          label: "Право приостановить финансирование"
          description: >
            User-facing: Предусмотрено / Не предусмотрено. Fallback: "Не установлено" / "Не удалось определить".
          required: true
          display_in_grid: true
          display_priority: 2

        - name: "early_repayment_demand_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["present", "not_defined"]
          description: "Наличие права требовать досрочного возврата (raw enum). Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "early_repayment_demand_display"
          type: "string"
          presentation: "fact"
          label: "Право требовать досрочного возврата"
          description: >
            User-facing: Предусмотрено / Не предусмотрено. Fallback: "Не установлено" / "Не удалось определить".
          required: true
          display_in_grid: true
          display_priority: 3

        - name: "factor_rights_summary"
          type: "string"
          presentation: "fact"
          label: "Сводка по правам фактора"
          description: >
            Компактная сводка с условиями активации. Fallback: "Не установлено" / "Не удалось определить".
          required: true
          display_in_grid: true
          display_priority: 4

        - name: "evidence"
          type: "array"
          presentation: "diagnostic"
          description: "Точные цитаты из договора, подтверждающие извлечённые значения."
          required: true
          display_in_grid: false

      store_payload: true

  - id: factor_reassignment_right_check
    name: "Право фактора переуступить требование (ст. 388, 388.1, 389.1 ГК РФ)"
    description: >
      Проверка права фактора переуступить уступленное требование третьим
      лицам (рефакторинг / переуступка) и наличия требований о согласии
      клиента или должника.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "право фактора переуступить"
        - "переуступка требования"
        - "рефакторинг"
        - "переуступка финансовым агентом"
        - "согласие клиента на переуступку"
        - "согласие должника на переуступку"
        - "переуступка третьим лицам"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)(фактор|финансов\\w+\\s+агент).{0,60}(вправе|имеет\\s+право).{0,60}переуступ"
        - "(?i)переуступк.{0,60}(третьим|иным)"
        - "(?i)согласи.{0,60}(клиент|должник).{0,60}переуступ"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор факторинга по Главе 43 ГК РФ.
        Проверяется только один вопрос: право фактора переуступить
        требование третьему лицу.
        Нормативные ориентиры:
        - ст. 388 ГК РФ — уступка требования;
        - ст. 388.1 ГК РФ — уступка будущего требования;
        - ст. 389.1 ГК РФ — права и обязанности цедента и цессионария.
        Важно:
        - Твоя задача — не оценивать серьёзность риска.
        - Только установить, что прямо есть в тексте договора, а чего прямо нет.
        - Различай три режима:
            * allowed — переуступка прямо разрешена без согласия;
            * prohibited — переуступка прямо запрещена;
            * requires_consent — переуступка допускается только
              с согласия (клиента / должника / обоих).
        - Согласие может требоваться:
            * от клиента — потому что клиент заинтересован в сохранении
              контрагента-фактора;
            * от должника — потому что должник обязан платить новому
              кредитору (ст. 312 ГК РФ);
            * от обоих.
        - Если договор молчит о праве фактора переуступать — по общему
          правилу переуступка возможна, если не запрещена.
          Отражай это как allowed с оговоркой в summary.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Право фактора переуступить требование (режим: allowed /
           prohibited / requires_consent).
        2. Наличие требования о согласии (клиента / должника / обоих).
        3. Составь краткую сводку.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Если данные не указаны прямо:
           - для status-полей верни "not_defined";
           - для display-полей верни "Не установлено" / "Не требуется"
             по роду.
        4. Запрещены значения: null, None, пустые строки — не используй их
           никогда. Допустимые fallback-значения: "not_defined",
           "Не установлено", "Не требуется".
        5. factor_reassignment_status:
           "allowed" — договор прямо разрешает фактору переуступать
             требование без согласия;
           "prohibited" — договор прямо запрещает фактору переуступать
             требование;
           "requires_consent" — договор допускает переуступку только
             с предварительного согласия;
           "not_defined" — режим не установлен (по общему правилу —
             переуступка возможна).
        6. reassignment_consent_status:
           "required" — требуется согласие (клиента / должника / обоих);
           "not_required" — прямо указано, что согласие не требуется;
           "not_defined" — вопрос согласия не раскрыт.
           В summary обязательно указывай, от кого требуется согласие.
        7. factor_reassignment_summary — одна строка, формат:
           "Переуступка фактором: <...>; Согласие: <...>".
        8. В evidence включай только дословные цитаты из текста договора.
        9. Верни РОВНО один JSON-объект со всеми 6 ключами без какого-либо
           дополнительного текста до или после. Начни ответ сразу с
           открывающей фигурной скобки и закончи закрывающей. НЕ пиши
           Markdown, списки, код-фенсы. Ответ должен быть валидным JSON,
           пригодным для парсинга через json.loads без предварительной
           обработки.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — переуступка разрешена без согласия:
        Фрагмент:
        "Фактор вправе переуступить уступаемое требование третьим лицам
        без согласия Клиента и должника."
        Ответ:
        {
          "factor_reassignment_status": "allowed",
          "factor_reassignment_display": "Разрешена",
          "reassignment_consent_status": "not_required",
          "reassignment_consent_display": "Не требуется",
          "factor_reassignment_summary": "Переуступка фактором: Разрешена без согласия; Согласие: Не требуется",
          "evidence": [
            {
              "clause_ref": "п. 9.3",
              "quote": "Фактор вправе переуступить уступаемое требование третьим лицам без согласия Клиента и должника."
            }
          ]
        }

        Пример 2 — переуступка требует согласия клиента:
        Фрагмент:
        "Переуступка требования Фактором третьим лицам допускается только
        с предварительного письменного согласия Клиента."
        Ответ:
        {
          "factor_reassignment_status": "requires_consent",
          "factor_reassignment_display": "Требует согласия",
          "reassignment_consent_status": "required",
          "reassignment_consent_display": "Требуется",
          "factor_reassignment_summary": "Переуступка фактором: Требует согласия Клиента; Согласие: Требуется (от Клиента)",
          "evidence": [
            {
              "clause_ref": "п. 9.3",
              "quote": "Переуступка требования Фактором третьим лицам допускается только с предварительного письменного согласия Клиента."
            }
          ]
        }

        Пример 3 — текст есть, но вывод частичный
        (право переуступать не упомянуто — по общему правилу возможно):
        Фрагмент:
        "Фактор самостоятельно организует взыскание уступаемых требований
        с должников."
        Ответ:
        {
          "factor_reassignment_status": "not_defined",
          "factor_reassignment_display": "Не установлено",
          "reassignment_consent_status": "not_defined",
          "reassignment_consent_display": "Не установлено",
          "factor_reassignment_summary": "Переуступка фактором: Не установлено (по общему правилу возможна); Согласие: Не установлено",
          "evidence": [
            {
              "clause_ref": "п. 9.3",
              "quote": "Фактор самостоятельно организует взыскание уступаемых требований с должников."
            }
          ]
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о праве фактора переуступать требование.
        2. Найди прямую цитату о требовании согласия (если есть).
        3. Проверь, от кого требуется согласие: клиент / должник / оба.
        4. Если договор молчит — factor_reassignment_status = "not_defined",
           но в summary отражай, что по общему правилу переуступка возможна.
        5. Согласуй raw enum и display:
           factor_reassignment_status -> factor_reassignment_display:
             "allowed" -> "Разрешена";
             "prohibited" -> "Запрещена";
             "requires_consent" -> "Требует согласия";
             "not_defined" -> "Не установлено".
           reassignment_consent_status -> reassignment_consent_display:
             "required" -> "Требуется";
             "not_required" -> "Не требуется";
             "not_defined" -> "Не установлено".
        6. Если прямой цитаты нет — верни "not_defined" для status-полей
           и соответствующий fallback для display-полей.
        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь РОВНО одним JSON-объектом без какого-либо дополнительного
        текста до или после, со всеми 6 ключами:
        {
          "factor_reassignment_status": "<allowed / prohibited / requires_consent / not_defined>",
          "factor_reassignment_display": "<Разрешена / Запрещена / Требует согласия / Не установлено>",
          "reassignment_consent_status": "<required / not_required / not_defined>",
          "reassignment_consent_display": "<Требуется / Не требуется / Не установлено>",
          "factor_reassignment_summary": "<сводка одной строкой>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 8
      temperature: 0.0
      max_tokens: 700

    retrieval:
      retrieval_profile: "assignment_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "право фактора переуступить требование рефакторинг переуступка требования финансовым агентом согласие клиента на переуступку согласие должника переуступка третьим лицам последующая уступка фактором"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - limitations
      negative_keywords:
        - "комиссия"
        - "уведомление должника"
        - "банкротство"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.30, 0.75]
        boost: 0.15
        scope: segment
      context_k: 8
      max_chunks: 10
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "obligations"
        - "limitations"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.12

    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 600

    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false
      llm_max_tokens: 1000

      presence_signal:
        field: "factor_reassignment_right_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора факторинга
        сведения о праве фактора переуступить требование третьим лицам:
        режим переуступки, требование согласия (от кого).
        Не анализируй регресс, комиссию или банкротство.
        Если договор молчит о переуступке — отражай это как not_defined,
        но в summary укажи, что по общему правилу переуступка возможна.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. factor_reassignment_right_check_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (factor_reassignment_status, reassignment_consent_status) ≠ "not_defined";
           - "missing" — если оба содержательных поля = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - factor_reassignment_status = "not_defined";
           - reassignment_consent_status = "not_defined";
           - factor_reassignment_display = "Не установлено";
           - reassignment_consent_display = "Не установлено";
           - factor_reassignment_summary = "Переуступка фактором: Не установлено (по общему правилу возможна); Согласие: Не установлено";
           - не выполняй остальные шаги.

        1.  factor_reassignment_status — allowed / prohibited /
            requires_consent / not_defined.
        2.  factor_reassignment_display — "Разрешена" / "Запрещена" /
            "Требует согласия" / "Не установлено" (должно соответствовать
            factor_reassignment_status).
        3.  reassignment_consent_status — required / not_required /
            not_defined.
        4.  reassignment_consent_display — "Требуется" / "Не требуется"
            / "Не установлено" (должно соответствовать
            reassignment_consent_status).
        5.  factor_reassignment_summary — сводка одной строкой.
        6.  evidence — массив цитат с clause_ref и quote.
        </task>

        <context_rules>
        - Перед остальными полями заполни factor_reassignment_right_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined", все *_display = "Не установлено", factor_reassignment_summary = "Переуступка фактором: Не установлено (по общему правилу возможна); Согласие: Не установлено".
        - Используй только текст договора.
        - Не подставляй нормы закона вместо текста договора.
        - factor_reassignment_status: "allowed" — разрешена без согласия; "prohibited" — запрещена; "requires_consent" — только с согласия; "not_defined" — не установлено.
        - reassignment_consent_status: "required" — согласие требуется (клиента / должника / обоих); "not_required" — не требуется; "not_defined" — не раскрыто.
        - Если фрагменты конфликтуют и не позволяют сделать надёжный вывод, верни "Не удалось определить" для затронутого видимого поля и включи конфликтующие цитаты в evidence.
        - Запрещены значения null, None и пустые строки.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет упоминания права фактора переуступать требование или требования согласия.
           → presence = "missing";
             все *_status = "not_defined";
             все *_display = "Не установлено";
             factor_reassignment_summary = "Переуступка фактором: Не установлено (по общему правилу возможна); Согласие: Не установлено".

        2. Разрешена без согласия.
           Прямо указано, что фактор вправе переуступить требование без согласия клиента и должника.
           → presence = "present";
             factor_reassignment_status = "allowed";
             reassignment_consent_status = "not_required";
             factor_reassignment_summary = "Переуступка фактором: Разрешена без согласия; Согласие: Не требуется".

        3. Противоречие между фрагментами.
           В разных пунктах договора указаны противоречащие условия о переуступке или согласии.
           → presence = "unclear";
             соответствующие *_status = "not_defined";
             factor_reassignment_summary = "Не удалось определить".

        4. Требуется согласие.
           Переуступка допускается только с предварительного письменного согласия клиента.
           → presence = "present";
             factor_reassignment_status = "requires_consent";
             reassignment_consent_status = "required";
             factor_reassignment_summary = "Переуступка фактором: Требует согласия Клиента; Согласие: Требуется (от Клиента)".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для factor_reassignment_right_check_presence используй только: "present", "missing", "unclear".
        - Для статусных enum-полей используй только допустимые значения из списка.
        - Fallback при отсутствии данных:
          * factor_reassignment_display → "Не установлено";
          * reassignment_consent_display → "Не установлено";
          * factor_reassignment_summary → "Переуступка фактором: Не установлено (по общему правилу возможна); Согласие: Не установлено".
        - Fallback при противоречии или неоднозначности:
          * factor_reassignment_summary → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "factor_reassignment_right_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования о праве фактора переуступить требование. Внутреннее агрегатное signal-поле."
          required: true

        - name: "factor_reassignment_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["allowed", "prohibited", "requires_consent", "not_defined"]
          description: "Режим переуступки фактором (raw enum). Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "factor_reassignment_display"
          type: "string"
          presentation: "fact"
          label: "Право фактора переуступить требование"
          description: >
            User-facing: Разрешена / Запрещена / Требует согласия / Не установлено. Fallback: "Не установлено" / "Не удалось определить".
          required: true
          display_in_grid: true
          display_priority: 1

        - name: "reassignment_consent_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["required", "not_required", "not_defined"]
          description: "Требование согласия (raw enum). Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "reassignment_consent_display"
          type: "string"
          presentation: "fact"
          label: "Согласие на переуступку"
          description: >
            User-facing: Требуется / Не требуется / Не установлено. Fallback: "Не установлено" / "Не удалось определить".
          required: true
          display_in_grid: true
          display_priority: 2

        - name: "factor_reassignment_summary"
          type: "string"
          presentation: "fact"
          label: "Сводка по переуступке"
          description: >
            Компактная сводка: режим + согласие. Fallback: "Не установлено" / "Не удалось определить".
          required: true
          display_in_grid: true
          display_priority: 3

        - name: "evidence"
          type: "array"
          presentation: "diagnostic"
          description: "Точные цитаты из договора, подтверждающие извлечённые значения."
          required: true
          display_in_grid: false

      store_payload: true

  - id: collection_costs_allocation_check
    name: "Распределение расходов на взыскание и судебных расходов (ст. 393, 831 ГК РФ)"
    description: >
      Проверка распределения между сторонами расходов на взыскание
      требования с должника: судебных расходов, расходов на юристов,
      расходов на исполнительное производство, оценку.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "расходы на взыскание"
        - "судебные расходы"
        - "расходы на юристов"
        - "издержки взыскания"
        - "распределение расходов"
        - "исполнительное производство"
        - "госпошлина"
        - "расходы на оценку"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)расход.{0,40}(взыскан|суд|юрист|оценк|исполнительн)"
        - "(?i)(суд|юрист|оценк).{0,40}расход"
        - "(?i)(издержк|госпошлин).{0,40}(взыскан|несёт|несет)"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор факторинга по Главе 43 ГК РФ.
        Проверяется только один вопрос: как распределяются между сторонами
        расходы на взыскание требования с должника.
        Нормативные ориентиры:
        - ст. 393 ГК РФ — возмещение убытков;
        - ст. 831 ГК РФ — распределение сумм, полученных от должника;
        - гл. 9 АПК РФ — судебные расходы.
        Важно:
        - Твоя задача — не оценивать серьёзность риска.
        - Только установить, что прямо есть в тексте договора, а чего прямо нет.
        - Расходы на взыскание могут включать:
            * судебные расходы (госпошлина, издержки);
            * расходы на юристов / представителей;
            * расходы на оценку требования;
            * расходы на исполнительное производство;
            * расходы на нотариуса, регистратора.
        - Различай три режима распределения:
            * client — все расходы на клиенте;
            * factor — все расходы на факторе;
            * shared — пропорционально / по категориям / с оговорками.
        - Если сказано, что расходы взыскиваются с должника, а при
          недостаточности — с клиента, это shared.
        - Отсутствие оговорки = not_defined.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Кто несёт расходы на взыскание.
        2. Какие категории расходов выделены.
        3. Составь краткую сводку.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Если данные не указаны прямо:
           - для status-полей верни "not_defined";
           - для display-полей верни "Не установлено" по роду.
        4. Запрещены значения: null, None, пустые строки — не используй их
           никогда. Допустимые fallback-значения: "not_defined",
           "Не установлено".
        5. costs_allocation_status:
           "client" — расходы на взыскание несёт Клиент;
           "factor" — расходы на взыскание несёт Фактор;
           "shared" — расходы распределяются между сторонами
             (пропорционально / по категориям / с оговорками);
           "not_defined" — распределение в тексте не определено.
        6. costs_categories_status:
           "specified" — в договоре перечислены конкретные категории
             расходов (судебные, на юристов, на оценку, на исполнительное
             производство и т.п.);
           "generic" — только общая формулировка «расходы на взыскание»
             без перечня категорий;
           "not_defined" — категории расходов не упомянуты.
        7. costs_categories_summary — одна строка, перечисляющая категории
           (если specified) или фиксирующая, что перечень общий.
        8. costs_allocation_summary — одна строка, формат:
           "Кто несёт: <...>; Категории: <...>".
        9. В evidence включай только дословные цитаты из текста договора.
        10. Верни РОВНО один JSON-объект со всеми 6 ключами без какого-либо
            дополнительного текста до или после. Начни ответ сразу с
            открывающей фигурной скобки и закончи закрывающей. НЕ пиши
            Markdown, списки, код-фенсы. Ответ должен быть валидным JSON,
            пригодным для парсинга через json.loads без предварительной
            обработки.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — детальная разбивка по категориям:
        Фрагмент:
        "Расходы на взыскание требования с должника, включая судебные
        расходы, расходы на представителей и расходы на исполнительное
        производство, несёт Фактор. При недостаточности взысканных сумм
        разница относится на Клиента в части, превышающей вознаграждение
        Фактора."
        Ответ:
        {
          "costs_allocation_status": "shared",
          "costs_allocation_display": "Пропорционально",
          "costs_categories_status": "specified",
          "costs_categories_summary": "Категории: судебные расходы, расходы на представителей, расходы на исполнительное производство",
          "costs_allocation_summary": "Кто несёт: Пропорционально (основная часть на Факторе, при недостаточности — на Клиенте); Категории: судебные расходы, представители, исполнительное производство",
          "evidence": [
            {
              "clause_ref": "п. 12.1",
              "quote": "Расходы на взыскание требования с должника, включая судебные расходы, расходы на представителей и расходы на исполнительное производство, несёт Фактор."
            }
          ]
        }

        Пример 2 — расходы не распределены:
        Фрагмент:
        "Фактор приобретает требование и самостоятельно организует его
        взыскание."
        Ответ:
        {
          "costs_allocation_status": "not_defined",
          "costs_allocation_display": "Не установлено",
          "costs_categories_status": "not_defined",
          "costs_categories_summary": "Категории: не указаны",
          "costs_allocation_summary": "Кто несёт: Не установлено; Категории: не указаны",
          "evidence": [
            {
              "clause_ref": "п. 12.1",
              "quote": "Фактор приобретает требование и самостоятельно организует его взыскание."
            }
          ]
        }

        Пример 3 — текст есть, но вывод частичный
        (только общая формулировка без категорий):
        Фрагмент:
        "Все расходы, связанные с взысканием уступаемых требований,
        распределяются между Сторонами в соответствии с законодательством
        Российской Федерации."
        Ответ:
        {
          "costs_allocation_status": "shared",
          "costs_allocation_display": "Пропорционально",
          "costs_categories_status": "generic",
          "costs_categories_summary": "Категории: общая формулировка без перечня",
          "costs_allocation_summary": "Кто несёт: Пропорционально (по законодательству РФ); Категории: общая формулировка без перечня",
          "evidence": [
            {
              "clause_ref": "п. 12.1",
              "quote": "Все расходы, связанные с взысканием уступаемых требований, распределяются между Сторонами в соответствии с законодательством Российской Федерации."
            }
          ]
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о распределении расходов на взыскание.
        2. Найди прямую цитату о категориях расходов.
        3. Проверь: если указано, что расходы взыскиваются с должника,
           а при недостаточности — с клиента, это shared, а не client.
        4. Согласуй raw enum и display:
           costs_allocation_status -> costs_allocation_display:
             "client" -> "Клиент";
             "factor" -> "Фактор";
             "shared" -> "Пропорционально";
             "not_defined" -> "Не установлено".
        5. Если прямой цитаты нет — верни "not_defined" для status-полей
           и "Не установлено" для display-полей.
        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь РОВНО одним JSON-объектом без какого-либо дополнительного
        текста до или после, со всеми 6 ключами:
        {
          "costs_allocation_status": "<client / factor / shared / not_defined>",
          "costs_allocation_display": "<Клиент / Фактор / Пропорционально / Не установлено>",
          "costs_categories_status": "<specified / generic / not_defined>",
          "costs_categories_summary": "<перечень категорий или общая формулировка>",
          "costs_allocation_summary": "<сводка одной строкой>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 8
      temperature: 0.0
      max_tokens: 750

    retrieval:
      retrieval_profile: "payment_terms_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "расходы на взыскание судебные расходы расходы на юристов расходы на представителей расходы на оценку распределение расходов между сторонами издержки взыскания задолженности исполнительное производство госпошлина"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - procedures
        - remedies
      negative_keywords:
        - "комиссия"
        - "уведомление должника"
        - "банкротство"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.30, 0.75]
        boost: 0.15
        scope: segment
      context_k: 8
      max_chunks: 10
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "obligations"
        - "procedures"
        - "remedies"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.12

    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 600

    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false
      llm_max_tokens: 1100

      presence_signal:
        field: "collection_costs_allocation_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора факторинга
        сведения о распределении расходов на взыскание требования:
        кто несёт, какие категории выделены.
        Не анализируй регресс, комиссию или банкротство.
        Учитывай формулировки: судебные расходы, расходы на юристов,
        представителей, оценку, исполнительное производство, госпошлину.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. collection_costs_allocation_check_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если costs_allocation_status ≠ "not_defined";
           - "missing" — если costs_allocation_status = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - costs_allocation_status = "not_defined";
           - costs_categories_status = "not_defined";
           - costs_allocation_display = "Не установлено";
           - costs_categories_summary = "Категории: не указаны";
           - costs_allocation_summary = "Кто несёт: Не установлено; Категории: не указаны";
           - не выполняй остальные шаги.

        1.  costs_allocation_status — client / factor / shared / not_defined.
        2.  costs_allocation_display — "Клиент" / "Фактор" /
            "Пропорционально" / "Не установлено" (должно соответствовать
            costs_allocation_status).
        3.  costs_categories_status — specified / generic / not_defined.
        4.  costs_categories_summary — перечень категорий или общая
            формулировка.
        5.  costs_allocation_summary — сводка одной строкой.
        6.  evidence — массив цитат с clause_ref и quote.
        </task>

        <context_rules>
        - Перед остальными полями заполни collection_costs_allocation_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — costs_allocation_status = "not_defined", costs_allocation_display = "Не установлено", costs_categories_summary = "Категории: не указаны", costs_allocation_summary = "Кто несёт: Не установлено; Категории: не указаны".
        - Используй только текст договора.
        - Не подставляй нормы закона вместо текста договора.
        - costs_allocation_status: "client" / "factor" / "shared" / "not_defined" — по прямому указанию.
        - costs_categories_status: "specified" — есть перечень категорий; "generic" — только общая формулировка; "not_defined" — не упомянуто.
        - Если указано, что расходы взыскиваются с должника, а при недостаточности — с клиента, это shared, а не client.
        - Если фрагменты конфликтуют и не позволяют сделать надёжный вывод, верни "Не удалось определить" для затронутого видимого поля и включи конфликтующие цитаты в evidence.
        - Запрещены значения null, None и пустые строки.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет упоминания распределения расходов на взыскание.
           → presence = "missing";
             costs_allocation_status = "not_defined";
             costs_categories_status = "not_defined";
             costs_allocation_summary = "Кто несёт: Не установлено; Категории: не указаны".

        2. Частичное раскрытие (общая формулировка).
           Указано, что расходы распределяются по законодательству, но категории не перечислены.
           → presence = "present";
             costs_allocation_status = "shared";
             costs_categories_status = "generic";
             costs_allocation_summary = "Кто несёт: Пропорционально (по законодательству РФ); Категории: общая формулировка без перечня".

        3. Противоречие между фрагментами.
           В разных пунктах договора указаны противоречащие условия о том, кто несёт расходы.
           → presence = "unclear";
             costs_allocation_status = "not_defined";
             costs_allocation_summary = "Не удалось определить".

        4. Полная детализация.
           Прямо указано, кто несёт расходы, и перечислены конкретные категории (судебные, юристы, ИП).
           → presence = "present";
             costs_allocation_status = "shared" (или "client"/"factor");
             costs_categories_status = "specified";
             costs_allocation_summary = "Кто несёт: <...>; Категории: судебные расходы, представители, исполнительное производство".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для collection_costs_allocation_check_presence используй только: "present", "missing", "unclear".
        - Для статусных enum-полей используй только допустимые значения из списка.
        - Fallback при отсутствии данных:
          * costs_allocation_display → "Не установлено";
          * costs_categories_summary → "Категории: не указаны";
          * costs_allocation_summary → "Кто несёт: Не установлено; Категории: не указаны".
        - Fallback при противоречии или неоднозначности:
          * costs_allocation_summary → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "collection_costs_allocation_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования о распределении расходов на взыскание. Внутреннее агрегатное signal-поле."
          required: true

        - name: "costs_allocation_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["client", "factor", "shared", "not_defined"]
          description: "Кто несёт расходы на взыскание (raw enum). Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "costs_allocation_display"
          type: "string"
          presentation: "fact"
          label: "Кто несёт расходы на взыскание"
          description: >
            User-facing: Клиент / Фактор / Пропорционально / Не установлено. Fallback: "Не установлено" / "Не удалось определить".
          required: true
          display_in_grid: true
          display_priority: 1

        - name: "costs_categories_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["specified", "generic", "not_defined"]
          description: "Детализация категорий расходов (raw enum). Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "costs_categories_summary"
          type: "string"
          presentation: "fact"
          label: "Категории расходов"
          description: >
            Перечень категорий расходов или общая формулировка. Fallback: "Не установлено" / "Не удалось определить".
          required: true
          display_in_grid: true
          display_priority: 2

        - name: "costs_allocation_summary"
          type: "string"
          presentation: "fact"
          label: "Сводка по расходам"
          description: >
            Компактная сводка: кто несёт + категории. Fallback: "Не установлено" / "Не удалось определить".
          required: true
          display_in_grid: true
          display_priority: 3

        - name: "evidence"
          type: "array"
          presentation: "diagnostic"
          description: "Точные цитаты из договора, подтверждающие извлечённые значения."
          required: true
          display_in_grid: false

      store_payload: true

  - id: hidden_factoring_penalties_check
    name: "Неустойка за просрочку перечисления при скрытом факторинге (ст. 330, 830 ГК РФ)"
    description: >
      Проверка наличия неустойки / пени за просрочку перечисления
      клиентом полученных от должника сумм в пользу фактора при
      скрытом (конфиденциальном) факторинге.
    triggers:
      any: ["hidden_factoring"]
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "неустойка за просрочку перечисления"
        - "пеня за просрочку"
        - "ответственность клиента за просрочку"
        - "санкции за нарушение срока перечисления"
        - "скрытый факторинг"
        - "конфиденциальный факторинг"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)неустойк.{0,60}(просрочк|перечисл)"
        - "(?i)пен[ия].{0,60}(просрочк|перечисл)"
        - "(?i)просрочк.{0,60}перечисл.{0,60}(полученн|сумм)"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор скрытого (конфиденциального) факторинга
        по Главе 43 ГК РФ.
        Проверяется только один вопрос: финансовые санкции за просрочку
        перечисления клиентом полученных от должника сумм в пользу фактора.
        Нормативные ориентиры:
        - ст. 330 ГК РФ — неустойка;
        - ст. 830 ГК РФ — исполнение должником.
        Важно:
        - Твоя задача — не оценивать серьёзность риска.
        - Только установить, что прямо есть в тексте договора, а чего прямо нет.
        - При скрытом факторинге должник не уведомляется и платит клиенту,
          а клиент перечисляет полученное фактору. Именно неустойка
          стимулирует клиента своевременно перечислять.
        - Различай:
            * late_transfer_penalty_status — есть ли неустойка за
              просрочку перечисления;
            * late_transfer_penalty_rate_status — указан ли конкретный
              размер (процент за день, фиксированная сумма и т.п.).
        - Механизмы защиты фактора (перечисление, срок, спецсчёт,
          отчётность, право уведомить должника) проверяются в отдельном
          check-е hidden_factoring_protection_check. Здесь — только
          финансовые санкции.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Наличие неустойки / пени за просрочку перечисления.
        2. Размер неустойки (если указан).
        3. Составь краткую сводку.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Если данные не указаны прямо:
           - для status-полей верни "not_defined";
           - для display-полей верни "Не предусмотрена" / "Не установлена"
             по роду.
        4. Запрещены значения: null, None, пустые строки — не используй их
           никогда. Допустимые fallback-значения: "not_defined",
           "Не предусмотрена", "Не установлена".
        5. late_transfer_penalty_status:
           "present" — есть неустойка / пеня / иная финансовая санкция
             за просрочку перечисления клиентом полученных от должника
             сумм;
           "not_defined" — такая санкция в тексте отсутствует.
        6. late_transfer_penalty_rate_status:
           "specified" — прямо указан размер неустойки (процент за день,
             фиксированная сумма, комбинированный механизм);
           "not_defined" — размер не указан.
        7. hidden_factoring_penalty_summary — одна строка, формат:
           "Неустойка: <да/нет>; Размер: <...>; Механизм: <...>".
           Если размер указан — включай его (например, «0,2% в день»).
        8. В evidence включай только дословные цитаты из текста договора.
        9. Верни РОВНО один JSON-объект со всеми 6 ключами без какого-либо
           дополнительного текста до или после. Начни ответ сразу с
           открывающей фигурной скобки и закончи закрывающей. НЕ пиши
           Markdown, списки, код-фенсы. Ответ должен быть валидным JSON,
           пригодным для парсинга через json.loads без предварительной
           обработки.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — неустойка с конкретным размером:
        Фрагмент:
        "За нарушение срока перечисления полученных от должника сумм
        Клиент уплачивает Фактору неустойку в размере 0,2% от просроченной
        суммы за каждый день просрочки."
        Ответ:
        {
          "late_transfer_penalty_status": "present",
          "late_transfer_penalty_display": "Предусмотрена",
          "late_transfer_penalty_rate_status": "specified",
          "late_transfer_penalty_rate_display": "0,2% в день",
          "hidden_factoring_penalty_summary": "Неустойка: да (0,2% в день от просроченной суммы); Размер: 0,2% в день; Механизм: за каждый день просрочки",
          "evidence": [
            {
              "clause_ref": "п. 8.4",
              "quote": "За нарушение срока перечисления полученных от должника сумм Клиент уплачивает Фактору неустойку в размере 0,2% от просроченной суммы за каждый день просрочки."
            }
          ]
        }

        Пример 2 — неустойки нет:
        Фрагмент:
        "Клиент обязуется перечислить Фактору полученные от должника
        суммы в течение 1 рабочего дня с даты их поступления."
        Ответ:
        {
          "late_transfer_penalty_status": "not_defined",
          "late_transfer_penalty_display": "Не предусмотрена",
          "late_transfer_penalty_rate_status": "not_defined",
          "late_transfer_penalty_rate_display": "Не установлена",
          "hidden_factoring_penalty_summary": "Неустойка: нет; Размер: Не установлена; Механизм: отсутствует",
          "evidence": [
            {
              "clause_ref": "п. 8.4",
              "quote": "Клиент обязуется перечислить Фактору полученные от должника суммы в течение 1 рабочего дня с даты их поступления."
            }
          ]
        }

        Пример 3 — текст есть, но вывод частичный
        (неустойка упомянута, конкретный размер отсутствует):
        Фрагмент:
        "За нарушение срока перечисления Клиент несёт ответственность
        в соответствии с законодательством Российской Федерации."
        Ответ:
        {
          "late_transfer_penalty_status": "present",
          "late_transfer_penalty_display": "Предусмотрена",
          "late_transfer_penalty_rate_status": "not_defined",
          "late_transfer_penalty_rate_display": "Не установлена",
          "hidden_factoring_penalty_summary": "Неустойка: да (общая отсылка к законодательству); Размер: Не установлена; Механизм: по законодательству РФ",
          "evidence": [
            {
              "clause_ref": "п. 8.4",
              "quote": "За нарушение срока перечисления Клиент несёт ответственность в соответствии с законодательством Российской Федерации."
            }
          ]
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о неустойке за просрочку перечисления.
        2. Найди прямую цитату о размере неустойки (если указан).
        3. Не дублируй детальный анализ механизмов защиты фактора —
           они в отдельном check-е hidden_factoring_protection_check.
        4. Согласуй raw enum и display:
           late_transfer_penalty_status -> late_transfer_penalty_display:
             "present" -> "Предусмотрена";
             "not_defined" -> "Не предусмотрена".
           late_transfer_penalty_rate_status -> late_transfer_penalty_rate_display:
             "specified" -> конкретный размер текстом (например, "0,2% в день");
             "not_defined" -> "Не установлена".
        5. Если прямой цитаты нет — верни "not_defined" для status-полей
           и соответствующий fallback для display-полей.
        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь РОВНО одним JSON-объектом без какого-либо дополнительного
        текста до или после, со всеми 6 ключами:
        {
          "late_transfer_penalty_status": "<present / not_defined>",
          "late_transfer_penalty_display": "<Предусмотрена / Не предусмотрена>",
          "late_transfer_penalty_rate_status": "<specified / not_defined>",
          "late_transfer_penalty_rate_display": "<конкретный размер или 'Не установлена'>",
          "hidden_factoring_penalty_summary": "<сводка одной строкой>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 8
      temperature: 0.0
      max_tokens: 700

    retrieval:
      retrieval_profile: "liability_cap_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "неустойка за просрочку перечисления пеня за просрочку ответственность клиента за просрочку санкции за нарушение срока перечисления скрытый факторинг конфиденциальный факторинг"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - remedies
        - limitations
      negative_keywords:
        - "комиссия"
        - "уведомление должника"
        - "банкротство"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.30, 0.75]
        boost: 0.15
        scope: segment
      context_k: 8
      max_chunks: 10
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "obligations"
        - "remedies"
        - "limitations"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.12

    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 600

    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false
      llm_max_tokens: 1000

      presence_signal:
        field: "hidden_factoring_penalties_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора факторинга
        сведения о финансовых санкциях за просрочку перечисления клиентом
        полученных от должника сумм: наличие неустойки, её размер.
        Не анализируй регресс, комиссию или общие механизмы защиты фактора
        (они в отдельном check-е).
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. hidden_factoring_penalties_check_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если late_transfer_penalty_status = "present";
           - "missing" — если late_transfer_penalty_status = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - late_transfer_penalty_status = "not_defined";
           - late_transfer_penalty_rate_status = "not_defined";
           - late_transfer_penalty_display = "Не предусмотрена";
           - late_transfer_penalty_rate_display = "Не установлена";
           - hidden_factoring_penalty_summary = "Неустойка: нет; Размер: Не установлена; Механизм: отсутствует";
           - не выполняй остальные шаги.

        1.  late_transfer_penalty_status — present / not_defined.
        2.  late_transfer_penalty_display — "Предусмотрена" /
            "Не предусмотрена" (должно соответствовать
            late_transfer_penalty_status).
        3.  late_transfer_penalty_rate_status — specified / not_defined.
        4.  late_transfer_penalty_rate_display — конкретный размер или
            "Не установлена" (должно соответствовать
            late_transfer_penalty_rate_status).
        5.  hidden_factoring_penalty_summary — сводка одной строкой.
        6.  evidence — массив цитат с clause_ref и quote.
        </task>

        <context_rules>
        - Перед остальными полями заполни hidden_factoring_penalties_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — late_transfer_penalty_status = "not_defined", late_transfer_penalty_display = "Не предусмотрена", late_transfer_penalty_rate_display = "Не установлена", hidden_factoring_penalty_summary = "Неустойка: нет; Размер: Не установлена; Механизм: отсутствует".
        - Используй только текст договора.
        - Не подставляй нормы закона вместо текста договора.
        - late_transfer_penalty_status: "present" — есть неустойка / пеня / иная финансовая санкция за просрочку перечисления; "not_defined" — нет.
        - late_transfer_penalty_rate_status: "specified" — прямо указан размер неустойки; "not_defined" — размер не указан.
        - Не дублируй детальный анализ механизмов защиты фактора — они в отдельном check-е hidden_factoring_protection_check.
        - Если фрагменты конфликтуют и не позволяют сделать надёжный вывод, верни "Не удалось определить" для затронутого видимого поля и включи конфликтующие цитаты в evidence.
        - Запрещены значения null, None и пустые строки.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет упоминания неустойки или санкций за просрочку перечисления.
           → presence = "missing";
             late_transfer_penalty_status = "not_defined";
             late_transfer_penalty_rate_status = "not_defined";
             hidden_factoring_penalty_summary = "Неустойка: нет; Размер: Не установлена; Механизм: отсутствует".

        2. Частичное раскрытие (общая отсылка).
           Указано, что клиент несёт ответственность по законодательству, но конкретный размер неустойки не установлен.
           → presence = "present";
             late_transfer_penalty_status = "present";
             late_transfer_penalty_rate_status = "not_defined";
             hidden_factoring_penalty_summary = "Неустойка: да (общая отсылка к законодательству); Размер: Не установлена; Механизм: по законодательству РФ".

        3. Противоречие между фрагментами.
           В разных пунктах договора указаны противоречащие условия о размере или наличии неустойки.
           → presence = "unclear";
             late_transfer_penalty_rate_status = "not_defined";
             hidden_factoring_penalty_summary = "Не удалось определить".

        4. Полная детализация.
           Прямо указана неустойка за просрочку перечисления с конкретным размером (например, 0,2% в день).
           → presence = "present";
             late_transfer_penalty_status = "present";
             late_transfer_penalty_rate_status = "specified";
             hidden_factoring_penalty_summary = "Неустойка: да (0,2% в день от просроченной суммы); Размер: 0,2% в день; Механизм: за каждый день просрочки".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для hidden_factoring_penalties_check_presence используй только: "present", "missing", "unclear".
        - Для статусных enum-полей используй только допустимые значения из списка.
        - Fallback при отсутствии данных:
          * late_transfer_penalty_display → "Не предусмотрена";
          * late_transfer_penalty_rate_display → "Не установлена";
          * hidden_factoring_penalty_summary → "Неустойка: нет; Размер: Не установлена; Механизм: отсутствует".
        - Fallback при противоречии или неоднозначности:
          * hidden_factoring_penalty_summary → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "hidden_factoring_penalties_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования о неустойке за просрочку перечисления. Внутреннее агрегатное signal-поле."
          required: true

        - name: "late_transfer_penalty_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["present", "not_defined"]
          description: "Наличие неустойки за просрочку перечисления (raw enum). Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "late_transfer_penalty_display"
          type: "string"
          presentation: "fact"
          label: "Неустойка за просрочку перечисления"
          description: >
            User-facing: Предусмотрена / Не предусмотрена. Fallback: "Не установлено" / "Не удалось определить".
          required: true
          display_in_grid: true
          display_priority: 1

        - name: "late_transfer_penalty_rate_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["specified", "not_defined"]
          description: "Наличие конкретного размера неустойки (raw enum). Внутреннее enum-поле."
          required: true
          display_in_grid: false

        - name: "late_transfer_penalty_rate_display"
          type: "string"
          presentation: "fact"
          label: "Размер неустойки"
          description: >
            User-facing: конкретный размер или 'Не установлена'. Fallback: "Не установлено" / "Не удалось определить".
          required: true
          display_in_grid: true
          display_priority: 2

        - name: "hidden_factoring_penalty_summary"
          type: "string"
          presentation: "fact"
          label: "Сводка по неустойке"
          description: >
            Компактная сводка: наличие неустойки + размер + механизм. Fallback: "Не установлено" / "Не удалось определить".
          required: true
          display_in_grid: true
          display_priority: 3

        - name: "evidence"
          type: "array"
          presentation: "diagnostic"
          description: "Точные цитаты из договора, подтверждающие извлечённые значения."
          required: true
          display_in_grid: false

      store_payload: true

  - id: double_factoring_prohibition_check
    name: "Запрет двойного факторинга и множественной уступки клиентом"
    description: >
      Проверка наличия прямого запрета для клиента уступать одно и то же  денежное требование нескольким факторам или третьим лицам, а также  механизмов ответственности за нарушение этого запрета.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "двойной факторинг"
        - "множественная уступка"
        - "уступка нескольким лицам"
        - "запрет уступки третьим лицам"
        - "штраф за двойной факторинг"
        - "гарантия отсутствия иных уступок"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)не\\s+вправе.{0,40}уступ(ать|ать|ать|ать).{0,40}(третьим|иным)"
        - "(?i)гарантирует.{0,40}не\\s+уступал.{0,40}требован"
        - "(?i)штраф.{0,40}(двойн|множественн).{0,40}уступк"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор факторинга по Главе 43 ГК РФ.
        Проверяется только один вопрос: защита фактора от двойного факторинга 
        (множественной уступки одного и того же требования клиентом).
        Нормативный ориентир:
        - ст. 388.1, 390 ГК РФ — ответственность цедента за действительность 
          переданного требования.
        Важно:
        - Твоя задача — не оценивать серьёзность риска.
        - Только установить, что прямо есть в тексте договора, а чего прямо нет.
        - Различай:
            * prohibition — прямой запрет клиенту уступать требование иным лицам;
            * warranty — заверение клиента, что требование ранее не было уступлено;
            * penalty — специальная неустойка или право на немедленный возврат 
              финансирования при выявлении двойной уступки.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Наличие прямого запрета на множественную уступку.
        2. Наличие заверения клиента об отсутствии prior уступок.
        3. Наличие специальных санкций (штраф, немедленный регресс) за двойной факторинг.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Если данные не указаны прямо:
           - для status-полей верни "not_defined";
           - для display-полей верни "Не предусмотрено" / "Не установлено".
        4. Запрещены значения: null, None, пустые строки.
        5. double_assignment_prohibition: "present" / "not_defined".
        6. prior_assignment_warranty: "present" / "not_defined".
        7. double_factoring_penalty: "present" / "not_defined".
        8. В evidence включай только дословные цитаты.
        9. Верни РОВНО один JSON-объект со всеми 7 ключами.

        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1 — полная защита:
        Фрагмент: "Клиент гарантирует, что не уступал и не уступит данное требование иным лицам. В случае выявления двойного факторинга Клиент уплачивает штраф в размере 20% от суммы финансирования и обязан немедленно вернуть все полученные средства."
        Ответ: {
          "double_assignment_prohibition": "present",
          "prior_assignment_warranty": "present",
          "double_factoring_penalty": "present",
          "double_factoring_summary": "Запрет: да; Заверение об отсутствии prior уступок: да; Санкции: да (штраф 20% и немедленный возврат)",
          "evidence": [{"clause_ref": "п. 7.2", "quote": "Клиент гарантирует, что не уступал и не уступит данное требование иным лицам. В случае выявления двойного факторинга Клиент уплачивает штраф в размере 20% от суммы финансирования."}]
        }

        [ФОРМАТ ОТВЕТА]
        {
          "double_assignment_prohibition": "<present / not_defined>",
          "prior_assignment_warranty": "<present / not_defined>",
          "double_factoring_penalty": "<present / not_defined>",
          "double_factoring_summary": "<сводка одной строкой>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 600

    retrieval:
      retrieval_profile: "assignment_check"
      corpus_scope: "primary_segment"
      levels: ["legal_unit", "section"]
      required_kind: "legal_unit"
      retrieval_query: "двойной факторинг множественная уступка запрет уступки третьим лицам штраф за двойной факторинг гарантия отсутствия иных уступок клиент не уступал требование"
      preferred_unit_types: ["obligation", "general_provision"]
      excluded_unit_types: ["definition", "structural_anchor", "technical_fragment"]
      preferred_clause_functions: ["representations", "limitations", "remedies"]
      negative_keywords: ["комиссия", "уведомление должника", "банкротство", "означает"]
      position_bias: {preferred_range: [0.20, 0.60], boost: 0.15, scope: segment}
      context_k: 6
      max_chunks: 8
      rerank: true

    enrichment_hints:
      preferred_segment_types: ["contract", "amendment"]
      excluded_segment_types: ["technical_specification", "price_list"]
      preferred_clause_functions: ["representations", "limitations"]
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.12

    evidence:
      required: true
      min_snippet_length: 30
      max_snippet_length: 500

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 800

      compact_output: false

      presence_signal:
        field: "double_factoring_prohibition_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора факторинга
        сведения о защите от двойного факторинга: запрет множественной
        уступки, заверение об отсутствии prior-уступок, специальные санкции.
        Не анализируй финансирование, комиссию, уведомление должника
        и иные разделы.
        Не оценивай риски.
        Анализируй только текст договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. double_factoring_prohibition_check_presence:
           - "missing" — если фрагментов по теме в тексте нет вообще
             (следствие: все содержательные поля = "not_defined");
           - "present" — если фрагменты по теме есть: либо хотя бы одно
             содержательное поле ≠ "not_defined", либо тема упомянута,
             но прямо исключена / отложена на будущее / раскрыта только общей фразой;
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - double_assignment_prohibition = "not_defined";
           - prior_assignment_warranty = "not_defined";
           - double_factoring_penalty = "not_defined";
           - double_factoring_summary = "Запрет: нет; Заверение: нет; Санкции: нет";
           - не выполняй остальные шаги.

        1. double_assignment_prohibition:
           - "present" — если в тексте прямо закреплён запрет клиенту
             уступать одно и то же требование иным лицам;
           - "not_defined" — если прямой запрет не установлен.

        2. prior_assignment_warranty:
           - "present" — если клиент прямо заверяет, что требование
             ранее не было уступлено третьим лицам;
           - "not_defined" — если такое заверение прямо не закреплено.

        3. double_factoring_penalty:
           - "present" — если прямо предусмотрены специальные санкции
             за двойной факторинг (штраф, немедленный возврат
             финансирования, регресс);
           - "not_defined" — если специальных санкций нет.

        4. double_factoring_summary:
           Сводка одной строкой на русском языке в формате:
           "Запрет: <есть/нет>; Заверение: <есть/нет>; Санкции: <есть/нет>".
           При противоречии — "Не удалось определить".
        </task>

        <context_rules>
        - Перед остальными полями заполни double_factoring_prohibition_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined", double_factoring_summary = "Запрет: нет; Заверение: нет; Санкции: нет".
        - Используй только релевантные фрагменты контекста.
        - Не подставляй нормы закона, обычную практику или предположения вместо текста договора.
        - Не делай выводов по типовой структуре договора.
        - Не путай запрет множественной уступки с общими заверениями цедента по ст. 390 ГК РФ.
        - Специальная санкция — только явно поименованный штраф, неустойка или механизм регресса за двойной факторинг, а не общая ответственность.
        - Если в разных фрагментах указаны разные данные и конфликт нельзя разрешить по тексту:
          * status-поля → "not_defined";
          * текстовые поля → "Не удалось определить".
        - Не используй пустые строки.
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В договоре нет ни запрета множественной уступки, ни заверения,
           ни санкций за двойной факторинг.
           → presence = "missing";
             все *_status = "not_defined";
             double_factoring_summary = "Запрет: нет; Заверение: нет; Санкции: нет".

        2. Только заверение без запрета и санкций.
           Клиент заверяет, что требование ранее не уступалось,
           но прямой запрет и штраф отсутствуют.
           → presence = "present";
             prior_assignment_warranty = "present";
             double_assignment_prohibition = "not_defined";
             double_factoring_penalty = "not_defined".

        3. Противоречие между фрагментами.
           В одном пункте запрет уступки третьим лицам прямо установлен,
           в другом — допускается уступка без каких-либо ограничений.
           → presence = "unclear";
             double_assignment_prohibition = "not_defined";
             double_factoring_summary = "Не удалось определить".

        4. Полный набор защиты.
           Запрет уступки + заверение об отсутствии prior-уступок +
           специальный штраф за выявленный двойной факторинг.
           → presence = "present";
             double_assignment_prohibition = "present";
             prior_assignment_warranty = "present";
             double_factoring_penalty = "present";
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для double_factoring_prohibition_check_presence используй только: "present", "missing", "unclear".
        - Для status-полей используй только: "present", "not_defined".
        - Fallback при отсутствии данных:
          * double_factoring_summary → "Запрет: нет; Заверение: нет; Санкции: нет".
        - Fallback при противоречии или неоднозначности:
          * double_factoring_summary → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "double_factoring_prohibition_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования о запрете двойного факторинга. Внутреннее агрегатное signal-поле."
          required: true

        - name: "double_assignment_prohibition"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["present", "not_defined"]
          display_in_grid: false
          description: "Наличие прямого запрета на множественную уступку. Внутреннее enum-поле."
          required: true

        - name: "prior_assignment_warranty"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["present", "not_defined"]
          display_in_grid: false
          description: "Наличие заверения об отсутствии prior-уступок. Внутреннее enum-поле."
          required: true

        - name: "double_factoring_penalty"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["present", "not_defined"]
          display_in_grid: false
          description: "Наличие специальных санкций за двойной факторинг. Внутреннее enum-поле."
          required: true

        - name: "double_factoring_summary"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 1
          label: "Защита от двойного факторинга"
          description: >
            Компактная сводка: запрет, заверения, санкции.
            Fallback: "Запрет: нет; Заверение: нет; Санкции: нет" / "Не удалось определить".
          required: true

        - name: "evidence"
          type: "array"
          presentation: "diagnostic"
          display_in_grid: false
          description: "Точные цитаты из договора."
          required: true

      store_payload: true

  - id: underlying_contract_termination_goods_return_check
    name: "Расторжение основного договора и возврат товара (аннулирование требования)"
    description: >
      Проверка механизма действий сторон в случае расторжения основного  договора поставки/услуг или возврата товара должником, что влечет  аннулирование уступленного денежного требования.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "расторжение основного договора"
        - "возврат товара"
        - "аннулирование требования"
        - "замена требования"
        - "немедленный возврат финансирования"
        - "прекращение обязательства"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)возврат.{0,40}товар.{0,40}(расторжен|аннулирован)"
        - "(?i)расторжен.{0,40}основн.{0,40}договор"
        - "(?i)обязан.{0,40}вернуть.{0,40}финансирован"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор факторинга.
        Проверяется только один вопрос: что происходит с финансированием, 
        если основной договор расторгается или товар возвращается должником.
        Нормативный ориентир:
        - ст. 450, 507 ГК РФ — расторжение договора, возврат товара.
        Важно:
        - Твоя задача — не оценивать серьёзность риска.
        - Только установить, что прямо есть в тексте договора, а чего прямо нет.
        - Различай:
            * notification_duty — обязанность клиента немедленно уведомить фактора о расторжении/возврате;
            * repayment_duty — обязанность клиента немедленно вернуть финансирование;
            * substitution_right — право клиента заменить аннулированное требование на новое.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Обязанность клиента уведомить фактора о расторжении/возврате.
        2. Обязанность клиента вернуть финансирование при аннулировании требования.
        3. Право/механизм замены аннулированного требования на новое.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Если данные не указаны прямо: верни "not_defined" для status-полей.
        3. Запрещены значения: null, None, пустые строки.
        4. termination_notification_duty: "present" / "not_defined".
        5. immediate_repayment_duty: "present" / "not_defined".
        6. claim_substitution_mechanism: "present" / "not_defined".
        7. В evidence включай только дословные цитаты.
        8. Верни РОВНО один JSON-объект со всеми 7 ключами.

        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1 — полный механизм:
        Фрагмент: "При возврате товара или расторжении договора поставки Клиент обязан уведомить Фактора в течение 1 рабочего дня и немедленно вернуть сумму финансирования, либо предоставить новое требование на утверждение Фактора."
        Ответ: {
          "termination_notification_duty": "present",
          "immediate_repayment_duty": "present",
          "claim_substitution_mechanism": "present",
          "termination_goods_return_summary": "Уведомление: да (1 раб. день); Возврат финансирования: немедленно; Замена требования: предусмотрена",
          "evidence": [{"clause_ref": "п. 9.1", "quote": "При возврате товара или расторжении договора поставки Клиент обязан уведомить Фактора в течение 1 рабочего дня и немедленно вернуть сумму финансирования, либо предоставить новое требование."}]
        }

        [ФОРМАТ ОТВЕТА]
        {
          "termination_notification_duty": "<present / not_defined>",
          "immediate_repayment_duty": "<present / not_defined>",
          "claim_substitution_mechanism": "<present / not_defined>",
          "termination_goods_return_summary": "<сводка одной строкой>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 600

    retrieval:
      retrieval_profile: "assignment_check"
      corpus_scope: "primary_segment"
      levels: ["legal_unit", "section"]
      required_kind: "legal_unit"
      retrieval_query: "расторжение основного договора возврат товара аннулирование требования замена требования немедленный возврат финансирования прекращение обязательства"
      preferred_unit_types: ["obligation", "general_provision"]
      excluded_unit_types: ["definition", "structural_anchor", "technical_fragment"]
      preferred_clause_functions: ["obligations", "remedies"]
      negative_keywords: ["комиссия", "уведомление должника", "банкротство", "означает"]
      position_bias: {preferred_range: [0.30, 0.70], boost: 0.15, scope: segment}
      context_k: 6
      max_chunks: 8
      rerank: true

    enrichment_hints:
      preferred_segment_types: ["contract", "amendment"]
      excluded_segment_types: ["technical_specification", "price_list"]
      preferred_clause_functions: ["obligations", "remedies"]
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.12

    evidence:
      required: true
      min_snippet_length: 30
      max_snippet_length: 500

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 800

      compact_output: false

      presence_signal:
        field: "underlying_contract_termination_goods_return_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора факторинга
        сведения о действиях при расторжении основного договора
        или возврате товара должником: уведомление фактора, возврат
        финансирования, замена аннулированного требования.
        Не анализируй финансирование, комиссию, уведомление должника
        об уступке и иные разделы.
        Не оценивай риски.
        Анализируй только текст договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. underlying_contract_termination_goods_return_check_presence:
           - "missing" — если фрагментов по теме в тексте нет вообще
             (следствие: все содержательные поля = "not_defined");
           - "present" — если фрагменты по теме есть: либо хотя бы одно
             содержательное поле ≠ "not_defined", либо тема упомянута,
             но прямо исключена / отложена на будущее / раскрыта только общей фразой;
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - termination_notification_duty = "not_defined";
           - immediate_repayment_duty = "not_defined";
           - claim_substitution_mechanism = "not_defined";
           - termination_goods_return_summary = "Уведомление: нет; Возврат: нет; Замена: нет";
           - не выполняй остальные шаги.

        1. termination_notification_duty:
           - "present" — если прямо установлена обязанность клиента
             уведомить фактора о расторжении основного договора
             или возврате товара должником;
           - "not_defined" — если такая обязанность прямо не закреплена.

        2. immediate_repayment_duty:
           - "present" — если прямо установлена обязанность клиента
             вернуть финансирование при аннулировании требования;
           - "not_defined" — если такая обязанность прямо не закреплена.

        3. claim_substitution_mechanism:
           - "present" — если прямо предусмотрена замена аннулированного
             требования на новое;
           - "not_defined" — если механизм замены прямо не предусмотрен.

        4. termination_goods_return_summary:
           Сводка одной строкой на русском языке в формате:
           "Уведомление: <...>; Возврат: <...>; Замена: <...>".
           При противоречии — "Не удалось определить".
        </task>

        <context_rules>
        - Перед остальными полями заполни underlying_contract_termination_goods_return_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined", termination_goods_return_summary = "Уведомление: нет; Возврат: нет; Замена: нет".
        - Используй только релевантные фрагменты контекста.
        - Не подставляй нормы закона, обычную практику или предположения вместо текста договора.
        - Не делай выводов по типовой структуре договора.
        - Различай: расторжение основного договора (полное прекращение), возврат товара должником и аннулирование отдельного требования.
        - Общая обязанность клиента информировать фактора о ходе исполнения основного договора ≠ обязанность уведомлять именно о расторжении/возврате.
        - Если в разных фрагментах указаны разные данные и конфликт нельзя разрешить по тексту:
          * status-поля → "not_defined";
          * текстовые поля → "Не удалось определить".
        - Не используй пустые строки.
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В договоре нет ни уведомления о расторжении/возврате,
           ни обязанности вернуть финансирование, ни механизма замены.
           → presence = "missing";
             все *_status = "not_defined";
             termination_goods_return_summary = "Уведомление: нет; Возврат: нет; Замена: нет".

        2. Только обязанность уведомить.
           Прямо установлено уведомление фактора о расторжении,
           но механизм возврата финансирования не прописан.
           → presence = "present";
             termination_notification_duty = "present";
             immediate_repayment_duty = "not_defined";
             claim_substitution_mechanism = "not_defined".

        3. Противоречие между фрагментами.
           В одном пункте указан немедленный возврат при расторжении,
           в другом — возврат не предусмотрен.
           → presence = "unclear";
             immediate_repayment_duty = "not_defined";
             termination_goods_return_summary = "Не удалось определить".

        4. Полный механизм.
           Уведомление + немедленный возврат + замена требования.
           → presence = "present";
             termination_notification_duty = "present";
             immediate_repayment_duty = "present";
             claim_substitution_mechanism = "present".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для underlying_contract_termination_goods_return_check_presence используй только: "present", "missing", "unclear".
        - Для status-полей используй только: "present", "not_defined".
        - Fallback при отсутствии данных:
          * termination_goods_return_summary → "Уведомление: нет; Возврат: нет; Замена: нет".
        - Fallback при противоречии или неоднозначности:
          * termination_goods_return_summary → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "underlying_contract_termination_goods_return_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования о расторжении основного договора / возврате товара. Внутреннее агрегатное signal-поле."
          required: true

        - name: "termination_notification_duty"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["present", "not_defined"]
          display_in_grid: false
          description: "Обязанность уведомить фактора о расторжении / возврате. Внутреннее enum-поле."
          required: true

        - name: "immediate_repayment_duty"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["present", "not_defined"]
          display_in_grid: false
          description: "Обязанность немедленно вернуть финансирование. Внутреннее enum-поле."
          required: true

        - name: "claim_substitution_mechanism"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["present", "not_defined"]
          display_in_grid: false
          description: "Механизм замены аннулированного требования. Внутреннее enum-поле."
          required: true

        - name: "termination_goods_return_summary"
          type: "string"
          presentation: "fact"
          display_in_grid: true
          display_priority: 1
          label: "Расторжение договора / возврат товара"
          description: >
            Компактная сводка: уведомление, возврат средств, замена требования.
            Fallback: "Уведомление: нет; Возврат: нет; Замена: нет" / "Не удалось определить".
          required: true

        - name: "evidence"
          type: "array"
          presentation: "diagnostic"
          display_in_grid: false
          description: "Точные цитаты из договора."
          required: true

      store_payload: true

  - id: misdirected_funds_handling_check
    name: "Порядок действий при ошибочном получении средств клиентом"
    description: >
      Проверка механизма действий клиента в случае, если должник ошибочно  перечислил оплату по уступленному требению непосредственно клиенту  (например, на старый расчетный счет), а не фактору.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "ошибочное получение средств"
        - "поступление на счет клиента"
        - "удерживать в пользу фактора"
        - "перечислить фактору в течение"
        - "средства в залоге"
        - "целевое использование средств"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)поступлени[ея].{0,40}счет.{0,40}клиент"
        - "(?i)обязан.{0,40}перечислить.{0,40}фактор.{0,40}(час|дн)"
        - "(?i)удержива[еет].{0,40}пользу.{0,40}фактор"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор факторинга.
        Проверяется только один вопрос: что должен делать клиент, если должник 
        по ошибке заплатил ему, а не фактору.
        Важно:
        - Твоя задача — не оценивать серьёзность риска.
        - Только установить, что прямо есть в тексте договора, а чего прямо нет.
        - Различай:
            * transfer_obligation — обязанность перевести средства фактору;
            * transfer_deadline — конкретный срок перевода (часы/дни);
            * pledge_trust_status — признание этих средств находящимися в залоге 
              или целевом доверительном управлении до момента перевода.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Обязанность клиента перевести ошибочно полученные средства фактору.
        2. Конкретный срок такого перевода.
        3. Статус этих средств (залог, целевое удержание) до момента перевода.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Если данные не указаны прямо: верни "not_defined".
        3. Запрещены значения: null, None, пустые строки.
        4. funds_transfer_obligation: "present" / "not_defined".
        5. transfer_deadline_specified: "present" / "not_defined".
        6. pledge_trust_status: "present" / "not_defined".
        7. В evidence включай только дословные цитаты.
        8. Верни РОВНО один JSON-объект со всеми 7 ключами.

        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1 — полный механизм:
        Фрагмент: "В случае поступления денежных средств от должника на счета Клиента, Клиент обязан перечислить их Фактору в течение 24 часов. До момента перечисления указанные средства признаются находящимися в залоге у Фактора."
        Ответ: {
          "funds_transfer_obligation": "present",
          "transfer_deadline_specified": "present",
          "pledge_trust_status": "present",
          "misdirected_funds_summary": "Обязанность перевести: да; Срок: 24 часа; Статус средств: в залоге у Фактора",
          "evidence": [{"clause_ref": "п. 8.5", "quote": "В случае поступления денежных средств от должника на счета Клиента, Клиент обязан перечислить их Фактору в течение 24 часов. До момента перечисления указанные средства признаются находящимися в залоге у Фактора."}]
        }

        [ФОРМАТ ОТВЕТА]
        {
          "funds_transfer_obligation": "<present / not_defined>",
          "transfer_deadline_specified": "<present / not_defined>",
          "pledge_trust_status": "<present / not_defined>",
          "misdirected_funds_summary": "<сводка одной строкой>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 600

    retrieval:
      retrieval_profile: "payment_terms_check"
      corpus_scope: "primary_segment"
      levels: ["legal_unit", "section"]
      required_kind: "legal_unit"
      retrieval_query: "ошибочное получение средств поступление на счет клиента перечислить фактору в течение удерживать в пользу фактора средства в залоге целевое использование"
      preferred_unit_types: ["obligation", "general_provision"]
      excluded_unit_types: ["definition", "structural_anchor", "technical_fragment"]
      preferred_clause_functions: ["obligations", "procedures"]
      negative_keywords: ["комиссия", "уведомление должника", "банкротство", "означает"]
      position_bias: {preferred_range: [0.30, 0.70], boost: 0.15, scope: segment}
      context_k: 6
      max_chunks: 8
      rerank: true

    enrichment_hints:
      preferred_segment_types: ["contract", "amendment"]
      excluded_segment_types: ["technical_specification", "price_list"]
      preferred_clause_functions: ["obligations", "procedures"]
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.12

    evidence:
      required: true
      min_snippet_length: 30
      max_snippet_length: 500

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 800

      compact_output: false

      presence_signal:
        field: "misdirected_funds_handling_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора факторинга
        сведения о порядке действий при ошибочном получении средств
        клиентом: обязанность перевода фактору, конкретный срок,
        статус средств (залог / целевое удержание).
        Не анализируй финансирование, комиссию, уведомление должника
        об уступке и иные разделы.
        Не оценивай риски.
        Анализируй только текст договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. misdirected_funds_handling_check_presence:
           - "missing" — если фрагментов по теме в тексте нет вообще
             (следствие: все содержательные поля = "not_defined");
           - "present" — если фрагменты по теме есть: либо хотя бы одно
             содержательное поле ≠ "not_defined", либо тема упомянута,
             но прямо исключена / отложена на будущее / раскрыта только общей фразой;
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - funds_transfer_obligation = "not_defined";
           - transfer_deadline_specified = "not_defined";
           - pledge_trust_status = "not_defined";
           - misdirected_funds_summary = "Обязанность перевести: нет; Срок: не указан; Статус средств: не определён";
           - не выполняй остальные шаги.

        1. funds_transfer_obligation:
           - "present" — если прямо установлена обязанность клиента
             перевести ошибочно полученные от должника средства фактору;
           - "not_defined" — если такая обязанность прямо не закреплена.

        2. transfer_deadline_specified:
           - "present" — если прямо указан конкретный срок перевода
             (часы / дни);
           - "not_defined" — если конкретный срок прямо не установлен.

        3. pledge_trust_status:
           - "present" — если прямо указано, что до момента перевода
             средства находятся в залоге у фактора или в целевом
