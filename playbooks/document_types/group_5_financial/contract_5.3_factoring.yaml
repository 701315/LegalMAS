        - pattern: "(?i)договор\\s+скрыт[огоой]\\s+факторинг[ауы]"
          weight: 0.90
          distinctiveness: high
          context: header
          description: "Скрытый (undisclosed) факторинг"
        - pattern: "(?i)договор\\s+международн[огоой]\\s+факторинг[ауы]"
          weight: 0.90
          distinctiveness: high
          context: header
          description: "Международный факторинг"
        - pattern: "(?i)master\\s+factoring\\s+agreement"
          weight: 0.95
          distinctiveness: high
          context: header
          description: "Master factoring agreement — рамочный договор факторинга"
        - pattern: "(?i)notification\\s+factoring\\s+agreement"
          weight: 0.90
          distinctiveness: high
          context: header
          description: "Notification factoring agreement — договор с уведомлением должника"
        - pattern: "(?i)финансов[ыйое]\\s+агент"
          weight: 0.90
          distinctiveness: high
