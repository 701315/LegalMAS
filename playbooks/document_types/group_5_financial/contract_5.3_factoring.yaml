# CHECK 11: Гарантии действительности требования
# ──────────────────────────────────────────────────────────────────────────
  - id: claim_validity_warranties_check
    name: "Гарантии действительности уступаемого требования (ст. 827 ГК РФ)"
    description: >
      Фактографическая проверка заверений клиента о действительности требования:
      существование, непогашенность, отсутствие оспаривания, действительность
      основного договора, выполнение поставки/услуг, возмещение при недействительности.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "действительность требования"
        - "клиент гарантирует"
        - "клиент заверяет"
        - "требование существует"
        - "не погашено"
        - "не оспорено"
        - "возмещение при недействительности"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)клиент.*(гарантирует|заверяет)"
        - "(?i)требовани[ея].*(существ|действительн)"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор факторинга по Главе 43 ГК РФ.
        Проверяется только один вопрос: заверения клиента о действительности
        уступаемого требования.
        Нормативный ориентир:
        - ст. 827 ГК РФ — ответственность клиента перед фактором
        Важно:
        - Твоя задача — не оценивать серьёзность риска.
        - Только установить, что прямо есть в тексте договора, а чего прямо нет.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Наличие заверения о действительности требования.
        2. Заверение о существовании требования.
        3. Заверение о непогашенности.
        4. Заверение об отсутствии оспаривания.
        5. Возмещение при недействительности требования.
        6. Полнота заверений.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Если данные не указаны прямо — возвращай "not_defined".
        3. В evidence включай только текст договора.
        4. Верни только один JSON-объект.

        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1:
        Фрагмент:
        "Клиент гарантирует, что требование существует, действительно,
        не погашено, не оспаривается, основной договор действует,
        товар поставлен в полном объёме. При недействительности требования
        Клиент возмещает Фактору все убытки."
        Ответ:
        {
          "validity_warranty_present": "yes",
          "existence_warranty": "present",
          "not_discharged_warranty": "present",
          "not_contested_warranty": "present",
          "underlying_contract_validity": "present",
          "delivery_completion_warranty": "present",
          "indemnity_for_invalid_claim": "present",
          "warranties_completeness": "comprehensive",
          "evidence": [
            {
              "clause_ref": "п. 9.1",
              "quote": "Клиент гарантирует, что требование существует, действительно, не погашено, не оспаривается."
            }
          ]
        }

        Пример 2:
        Фрагмент:
        "Клиент уступает требование Фактору."
        Ответ:
        {
          "validity_warranty_present": "no",
          "existence_warranty": "not_defined",
          "not_discharged_warranty": "not_defined",
          "not_contested_warranty": "not_defined",
          "underlying_contract_validity": "not_defined",
          "delivery_completion_warranty": "not_defined",
          "indemnity_for_invalid_claim": "not_defined",
          "warranties_completeness": "absent",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о действительности.
        2. Найди прямую цитату о непогашенности.
        3. Найди прямую цитату об оспаривании.
        4. Найди прямую цитату о возмещении.
        5. Если прямой цитаты нет — верни "not_defined".
        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        {
          "validity_warranty_present": "<yes / no>",
          "existence_warranty": "<present / not_defined>",
          "not_discharged_warranty": "<present / not_defined>",
          "not_contested_warranty": "<present / not_defined>",
          "underlying_contract_validity": "<present / not_defined>",
          "delivery_completion_warranty": "<present / not_defined>",
          "indemnity_for_invalid_claim": "<present / not_defined>",
          "warranties_completeness": "<comprehensive / partial / minimal / absent>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 600
      retrieval:
        retrieval_profile: "warranties_check"
        corpus_scope: "primary_segment"
        levels:
          - "legal_unit"
          - "section"
        required_kind: "legal_unit"
        retrieval_query: "действительность требования клиент гарантирует клиент заверяет требование существует не погашено не оспорено возмещение при недействительности основной договор"
        preferred_unit_types:
          - warranty
          - obligation
          - general_provision
        excluded_unit_types:
          - definition
          - structural_anchor
          - technical_fragment
        preferred_clause_functions:
          - representations
          - obligations
        negative_keywords:
          - "регресс"
          - "комиссия"
          - "уведомление должника"
          - "зачет"
          - "банкротство"
          - "означает"
          - "в целях настоящего"
        position_bias:
          preferred_range: [0.30, 0.80]
          boost: 0.15
          scope: segment
        context_k: 6
        max_chunks: 8
        rerank: true
        enrichment_hints:
          preferred_segment_types:
            - "contract"
            - "amendment"
          excluded_segment_types:
            - "technical_specification"
            - "price_list"
          preferred_clause_functions:
            - "representations"
            - "obligations"
          confidence_bonus_on_match: 0.10
          confidence_penalty_on_excluded_segment: 0.12
      evidence:
        required: true
        min_snippet_length: 40
        max_snippet_length: 600
      extraction:
        enabled: true
        mode: "hybrid"
        compact_output: false
        llm_max_tokens: 900
        llm_prompt_extraction: |
          <role>
          Ты — российский юрист. Извлеки из текста договора факторинга заверения
          клиента о действительности уступаемого требования.
          Не анализируй регресс, финансирование или уведомление должника.
          </role>
          <context>
          {context}
          </context>
          <task>
          Заполни строго следующие поля:
          1. validity_warranty_present — yes / no.
          2. existence_warranty — present / not_defined.
          3. not_discharged_warranty — present / not_defined.
          4. not_contested_warranty — present / not_defined.
          5. underlying_contract_validity — present / not_defined.
          6. delivery_completion_warranty — present / not_defined.
          7. indemnity_for_invalid_claim — present / not_defined.
          8. warranties_completeness — comprehensive / partial / minimal / absent.
          Если данные отсутствуют: используй "not_defined" или "no".
          </task>
          <rules>
          - Используй только текст договора.
          - warranties_completeness: "comprehensive" — все основные заверения;
            "partial" — часть заверений; "minimal" — только общие формулировки;
            "absent" — заверения отсутствуют.
          - Верни только JSON.
          </rules>
        fields:
          - name: "validity_warranty_present"
            type: "string"
            presentation: "signal"
            allowed_values: ["yes", "no"]
            description: "Наличие заверения о действительности требования."
            required: true
          - name: "existence_warranty"
            type: "string"
            presentation: "signal"
            allowed_values: ["present", "not_defined"]
            description: "Заверение о существовании требования."
            required: false
          - name: "not_discharged_warranty"
            type: "string"
            presentation: "signal"
            allowed_values: ["present", "not_defined"]
            description: "Заверение о непогашенности."
            required: false
          - name: "not_contested_warranty"
            type: "string"
            presentation: "signal"
            allowed_values: ["present", "not_defined"]
            description: "Заверение об отсутствии оспаривания."
            required: false
          - name: "underlying_contract_validity"
            type: "string"
            presentation: "signal"
            allowed_values: ["present", "not_defined"]
            description: "Заверение о действительности основного договора."
            required: false
          - name: "delivery_completion_warranty"
            type: "string"
            presentation: "signal"
            allowed_values: ["present", "not_defined"]
            description: "Заверение о выполнении поставки/услуг."
            required: false
          - name: "indemnity_for_invalid_claim"
            type: "string"
            presentation: "signal"
            allowed_values: ["present", "not_defined"]
            description: "Возмещение при недействительности требования."
            required: false
          - name: "warranties_completeness"
            type: "string"
            presentation: "signal"
            allowed_values: ["comprehensive", "partial", "minimal", "absent"]
            description: "Полнота заверений клиента."
            required: false
    store_payload: true
