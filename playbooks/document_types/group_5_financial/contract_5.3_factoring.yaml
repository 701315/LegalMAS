          weight: 0.35
          distinctiveness: low
          context: any
          description: "Инкассирование задолженности фактором"
        - pattern: "(?i)управлени[ея]\\s+дебиторск[оа]й\\s+задолженност[ьюи]"
          weight: 0.35
          distinctiveness: low
          context: any
          description: "Управление дебиторской задолженностью в контексте факторинга"
        - pattern: "(?i)открыт[ыо]й\\s+факторинг"
          weight: 0.30
          distinctiveness: low
          context: any
          description: "Упоминание открытого факторинга в теле"
        - pattern: "(?i)скрыт[ыо]й\\s+факторинг"
          weight: 0.30
          distinctiveness: low
          context: any
          description: "Упоминание скрытого факторинга"
        - pattern: "(?i)международн[ыо]й\\s+факторинг"
          weight: 0.30
          distinctiveness: low
          context: any
          description: "Упоминание международного факторинга"
        - pattern: "(?i)\\bдисконт\\b"
          weight: 0.30
          distinctiveness: low
          context: any
          description: "Дисконт/скидка к номиналу требований при факторинге"
        - pattern: "(?i)зач[её]т\\s+встречн[ыо]х\\s+требовани[йя]"
          weight: 0.25
          distinctiveness: low
          context: any
          description: "Зачёт взаимных требований, возможный в структуре факторинговых расчётов"
        - pattern: "(?i)дебиторск[аяое]\\s+задолженн[остьости]"
          weight: 0.25
          distinctiveness: low
          context: any
          description: "Дебиторская задолженность как объект финансирования"
        - pattern: "(?i)клиент[а-я]*"
          weight: 0.15
          distinctiveness: low
          context: any
          description: "Клиент (поставщик) как сторона договора факторинга"
        - pattern: "(?i)должник[ауы]"
          weight: 0.15
          distinctiveness: low
          context: any
          description: "Должник по уступаемому требованию"
    exclusions:
      - pattern: "(?i)договор\\s+цесси[ии]"
        severity: hard
        weight: -1.0
        description: "Чистая уступка права требования без элемента финансирования (цессия), а не факторинг"
      - pattern: "(?i)договор\\s+за[йеё]м[аа]"
        severity: hard
        weight: -1.0
        description: "Договор займа, а не финансирование под уступку денежного требования"
      - pattern: "(?i)\\bпоручительств[ооа]\\b"
        severity: hard
        weight: -1.0
        description: "Поручительство — акцессорное обеспечение, а не факторинговый договор"
      - pattern: "(?i)агентск[иоя]+\\s+договор"
        severity: hard
        weight: -1.0
        description: "Агентский договор об оказании услуг без финансирования и уступки требований"
      - pattern: "(?i)договор\\s+оказани[яя]\\s+услуг\\s+по\\s+взыскани[юю]"
        severity: hard
        weight: -1.0
        description: "Договор услуг по взысканию задолженности (collection), а не факторинг"
      - pattern: "(?i)кредитн[ыйое]\\s+договор"
        severity: soft
        weight: -0.35
        description: "Кредитный договор может сопровождать уступку требований, но сам по себе не является факторингом"
      - pattern: "(?i)залог\\s+прав\\s+требовани[яй]"
        severity: soft
        weight: -0.30
        description: "Залог прав требования без элемента финансирования клиента — ближе к залоговой конструкции"
      - pattern: "(?i)договор\\s+финансировани[яя]\\s+под\\s+залог"
        severity: soft
        weight: -0.30
        description: "Финансирование под залог, а не под уступку денежного требования"
