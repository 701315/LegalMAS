      - pattern: "(?i)\\bдоговор[\\s_.-]*(?:финансировани[а-я]*[\\s_.-]*(?:под|дебиторск[а-я]*)|финансировани[а-я]*[\\s_.-]*дебиторск[а-я]*)[\\s_.-]*задолженност[аи]\\b"
