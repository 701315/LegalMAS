      - "(?i)после\\s+получени[яя]\\s+уведомлени[яя]"
      - "(?i)плат[её]ж\\s+фактор[уу]"
      - "(?i)извещени[ея]\\s+об\\s+уступк[ее]"
  international_factoring:
