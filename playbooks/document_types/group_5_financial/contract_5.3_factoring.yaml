        но в summary укажи, что по общему правилу переуступка возможна.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие 6 полей (все ключи должны присутствовать
        в ответе, даже если значение — fallback):
        1.  factor_reassignment_status — allowed / prohibited /
            requires_consent / not_defined.
        2.  factor_reassignment_display — "Разрешена" / "Запрещена" /
