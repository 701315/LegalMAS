          - "remedies"
          - "limitations"
        confidence_bonus_on_match: 0.10
        confidence_penalty_on_excluded_segment: 0.12
    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 600

  - id: financing_limits_and_concentration_check
    name: "Лимиты финансирования и концентрация портфеля (ст. 824, 826 ГК РФ)"
    description: >
      Проверка наличия и характера лимитов финансирования: на одного
      должника, на портфель, на одно требование, а также порядка
      пересмотра лимитов.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "лимит финансирования"
        - "лимит на должника"
        - "лимит на портфель"
        - "лимит концентрации"
        - "лимит на одно требование"
        - "максимальная сумма финансирования"
        - "пересмотр лимитов"
        - "кредитная политика фактора"
        - "лимитная политика"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)лимит.{0,40}(финансирован|должник|портфел|требован|концентрац)"
        - "(?i)максимальн(ая|ый).{0,30}(сумм|размер).{0,30}финансирован"
        - "(?i)(пересмотр|изменени).{0,30}лимит"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор факторинга по Главе 43 ГК РФ.
        Проверяется только один вопрос: лимиты финансирования и порядок
        их пересмотра.
        Нормативные ориентиры:
        - ст. 824 ГК РФ — обязательство фактора предоставить финансирование;
        - ст. 826 ГК РФ — предмет уступки;
        - коммерческая практика рамочного факторинга в РФ.
        Важно:
        - Твоя задача — не оценивать серьёзность риска.
        - Только установить, что прямо есть в тексте договора, а чего прямо нет.
        - В рамочном факторинге лимиты определяют реальный объём
          финансирования и концентрацию риска. Различай:
            * лимит на одного должника;
            * лимит на портфель в целом;
            * лимит на одно требование.
        - Лимиты могут быть выражены как:
            * конкретная сумма в рублях;
            * процент от суммы требования;
            * формула / порядок расчёта;
            * отсылка к отдельному документу (Лимитная политика,
              Кредитная политика фактора).
        - Все эти формы — валидны. Если лимиты установлены через отсылку
          к отдельному документу, отражай это как present с оговоркой.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Наличие лимита на одного должника.
        2. Наличие лимита на портфель.
        3. Порядок пересмотра лимитов (односторонне фактором /
           по согласованию / периодически).
        4. Составь краткую сводку по лимитам.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Если данные не указаны прямо:
           - для status-полей верни "not_defined";
           - для display-полей верни "Не установлен" / "Не установлено"
             по роду.
        4. Запрещены значения: null, None, пустые строки — не используй их
           никогда. Допустимые fallback-значения: "not_defined",
           "Не установлен", "Не установлено".
        5. per_debtor_limit_status:
           "present" — установлен лимит финансирования на одного должника
             (сумма, процент, формула, отсылка к лимитной политике);
           "not_defined" — лимит не установлен.
        6. portfolio_limit_status:
           "present" — установлен общий лимит на портфель требований;
           "not_defined" — лимит не установлен.
        7. limits_revision_status:
           "present" — определён порядок пересмотра лимитов (кем,
             как, с каким уведомлением);
           "not_defined" — порядок пересмотра не определён.
        8. financing_limits_summary — одна строка, формат:
           "Лимит на должника: <...>; Лимит на портфель: <...>;
           Лимит на требование: <да/нет>; Пересмотр: <...>".
           Конкретные суммы / проценты / отсылки указывай явно.
        9. В evidence включай только дословные цитаты из текста договора.
        10. Верни РОВНО один JSON-объект со всеми 8 ключами без какого-либо
            дополнительного текста до или после. Начни ответ сразу с
            открывающей фигурной скобки и закончи закрывающей. НЕ пиши
            Markdown, списки, код-фенсы. Ответ должен быть валидным JSON,
            пригодным для парсинга через json.loads без предварительной
            обработки.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — полный набор лимитов с конкретными суммами:
        Фрагмент:
        "Лимит финансирования на одного Должника не может превышать
        10 000 000 рублей. Общий лимит по портфелю уступленных требований
        составляет 100 000 000 рублей. Лимиты могут быть пересмотрены
        Фактором в одностороннем порядке с уведомлением Клиента
        за 10 рабочих дней."
        Ответ:
        {
          "per_debtor_limit_status": "present",
          "per_debtor_limit_display": "Установлен",
          "portfolio_limit_status": "present",
          "portfolio_limit_display": "Установлен",
          "limits_revision_status": "present",
          "limits_revision_display": "Установлен",
          "financing_limits_summary": "Лимит на должника: 10 000 000 руб.; Лимит на портфель: 100 000 000 руб.; Лимит на требование: не установлен; Пересмотр: односторонне Фактором, уведомление за 10 рабочих дней",
          "evidence": [
            {
              "clause_ref": "п. 4.3",
              "quote": "Лимит финансирования на одного Должника не может превышать 10 000 000 рублей. Общий лимит по портфелю уступленных требований составляет 100 000 000 рублей."
            }
          ]
        }

        Пример 2 — данных в договоре нет:
        Фрагмент:
        "Фактор финансирует Клиента в пределах согласованных Сторонами сумм."
        Ответ:
        {
          "per_debtor_limit_status": "not_defined",
          "per_debtor_limit_display": "Не установлен",
          "portfolio_limit_status": "not_defined",
          "portfolio_limit_display": "Не установлен",
          "limits_revision_status": "not_defined",
          "limits_revision_display": "Не установлено",
          "financing_limits_summary": "Лимит на должника: Не установлен; Лимит на портфель: Не установлен; Лимит на требование: не установлен; Пересмотр: Не установлено",
          "evidence": [
            {
              "clause_ref": "п. 4.3",
              "quote": "Фактор финансирует Клиента в пределах согласованных Сторонами сумм."
            }
          ]
        }

        Пример 3 — лимиты установлены через отсылку к отдельному документу:
        Фрагмент:
        "Лимиты финансирования определяются в соответствии с Лимитной
        политикой Фактора (Приложение № 3), являющейся неотъемлемой частью
        настоящего Договора. Фактор вправе пересматривать лимиты
        в одностороннем порядке."
        Ответ:
        {
          "per_debtor_limit_status": "present",
          "per_debtor_limit_display": "Установлен",
          "portfolio_limit_status": "present",
          "portfolio_limit_display": "Установлен",
          "limits_revision_status": "present",
          "limits_revision_display": "Установлен",
          "financing_limits_summary": "Лимит на должника: Согласно Лимитной политике (Приложение № 3); Лимит на портфель: Согласно Лимитной политике; Лимит на требование: не установлен; Пересмотр: односторонне Фактором",
          "evidence": [
            {
              "clause_ref": "п. 4.3",
              "quote": "Лимиты финансирования определяются в соответствии с Лимитной политикой Фактора (Приложение № 3), являющейся неотъемлемой частью настоящего Договора."
            }
          ]
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о лимите на должника (если есть).
        2. Найди прямую цитату о лимите на портфель (если есть).
        3. Найди прямую цитату о порядке пересмотра лимитов (если есть).
        4. Проверь: если лимиты установлены через отсылку к лимитной
           политике или отдельному документу — это "present"
           (не "not_defined").
        5. Согласуй raw enum и display:
           per_debtor_limit_status -> per_debtor_limit_display:
             "present" -> "Установлен";
             "not_defined" -> "Не установлен".
           portfolio_limit_status -> portfolio_limit_display:
             "present" -> "Установлен";
             "not_defined" -> "Не установлен".
           limits_revision_status -> limits_revision_display:
             "present" -> "Установлен";
             "not_defined" -> "Не установлено".
        6. Если прямой цитаты нет — верни "not_defined" для status-полей
           и соответствующий fallback для display-полей.
        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь РОВНО одним JSON-объектом без какого-либо дополнительного
        текста до или после, со всеми 8 ключами:
        {
          "per_debtor_limit_status": "<present / not_defined>",
          "per_debtor_limit_display": "<Установлен / Не установлен>",
          "portfolio_limit_status": "<present / not_defined>",
          "portfolio_limit_display": "<Установлен / Не установлен>",
          "limits_revision_status": "<present / not_defined>",
          "limits_revision_display": "<Установлен / Не установлено>",
          "financing_limits_summary": "<сводка одной строкой>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 8
      temperature: 0.0
      max_tokens: 800
    store_payload: true

    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false
      llm_max_tokens: 1200
      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора факторинга
        сведения о лимитах финансирования: на одного должника,
        на портфель, на одно требование, а также порядок пересмотра
        лимитов.
        Не анализируй регресс, комиссию, уведомление должника или
        банкротство.
        Учитывай все формы установления лимитов: конкретная сумма,
        процент, формула, отсылка к лимитной политике или приложению.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие 8 полей (все ключи должны присутствовать
        в ответе, даже если значение — fallback):
        1.  per_debtor_limit_status — present / not_defined.
        2.  per_debtor_limit_display — "Установлен" / "Не установлен"
            (должно соответствовать per_debtor_limit_status).
        3.  portfolio_limit_status — present / not_defined.
        4.  portfolio_limit_display — "Установлен" / "Не установлен"
            (должно соответствовать portfolio_limit_status).
        5.  limits_revision_status — present / not_defined.
        6.  limits_revision_display — "Установлен" / "Не установлено"
            (должно соответствовать limits_revision_status).
        7.  financing_limits_summary — сводка одной строкой.
        8.  evidence — массив цитат с clause_ref и quote.
        </task>

        <rules>
        - Используй только текст договора.
        - per_debtor_limit_status: "present" — установлен лимит на
          одного должника (сумма, процент, формула или отсылка);
          "not_defined" — лимита нет.
        - portfolio_limit_status: "present" — установлен общий лимит
          на портфель; "not_defined" — нет.
        - limits_revision_status: "present" — определён порядок
          пересмотра лимитов; "not_defined" — не определён.
        - Display-поля строго соответствуют raw enum:
            per_debtor_limit_status:
              present -> "Установлен";
              not_defined -> "Не установлен".
            portfolio_limit_status:
              present -> "Установлен";
              not_defined -> "Не установлен".
            limits_revision_status:
              present -> "Установлен";
              not_defined -> "Не установлено".
        - financing_limits_summary — одной строкой, формат:
          "Лимит на должника: <...>; Лимит на портфель: <...>;
          Лимит на требование: <да/нет>; Пересмотр: <...>".
          Конкретные суммы / проценты / отсылки указывай явно.
        - Запрещены значения null, None и пустые строки. Для status-полей
          используй "not_defined". Для display-полей — "Не установлен"
          / "Не установлено".
        - В evidence включай только дословные цитаты из текста договора.
        - Верни РОВНО один JSON-объект со всеми 8 ключами без какого-либо
          дополнительного текста до или после. Начни ответ сразу с
          открывающей фигурной скобки и закончи закрывающей. НЕ пиши
          Markdown, списки, код-фенсы. Ответ должен быть валидным JSON,
          пригодным для парсинга через json.loads без предварительной
          обработки.
        </rules>
      fields:
        - name: "per_debtor_limit_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["present", "not_defined"]
          description: "Наличие лимита на одного должника (raw enum)."
          required: true
          display_in_grid: false
        - name: "per_debtor_limit_display"
          type: "string"
          presentation: "fact"
          label: "Лимит на одного должника"
          description: "User-facing: Установлен / Не установлен."
          required: true
          display_in_grid: true
          display_priority: 1
        - name: "portfolio_limit_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["present", "not_defined"]
          description: "Наличие лимита на портфель (raw enum)."
          required: true
          display_in_grid: false
        - name: "portfolio_limit_display"
          type: "string"
          presentation: "fact"
          label: "Лимит на портфель"
          description: "User-facing: Установлен / Не установлен."
          required: true
          display_in_grid: true
          display_priority: 2
        - name: "limits_revision_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["present", "not_defined"]
          description: "Наличие порядка пересмотра лимитов (raw enum)."
          required: true
