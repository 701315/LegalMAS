          "activation_conditions_display": "Не установлены"
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о зачёте встречных требований.
        2. Найди прямую цитату о безакцептном списании.
        3. Определи охват счетов (в Банке / в сторонних банках / все).
        4. Определи условия активации (просрочка / автоматика /
           по требованию).
        5. Найди уведомительный порядок.
        6. Найди ограничения.
        7. Проверь красные флаги: все счета без уведомления;
           automatic активация; счета в сторонних банках.
        8. Сформулируй user-facing display-поля кратко и по-русски.
        9. Если прямых цитат нет — верни fallback по правилам 5–7.

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь РОВНО одним JSON-объектом без какого-либо дополнительного
        текста до или после, со всеми 10 ключами:
        {
          "set_off_right_status": "<present / not_defined>",
          "direct_debit_status": "<present / not_defined>",
          "accounts_scope": "<all_borrower_accounts / specified_accounts / accounts_in_other_banks / mixed / not_defined>",
          "activation_conditions": "<at_default / automatic / on_demand / not_defined>",
          "notification_status": "<present / absent / not_defined>",
          "limitations_status": "<present / not_defined>",
          "set_off_summary": "<краткое summary, 'Не установлено', 'Не применимо' или 'Не удалось определить'>",
          "direct_debit_display": "<текст, 'Не установлено', 'Не применимо' или 'Не удалось определить'>",
          "accounts_scope_display": "<текст, 'Не применимо' или 'Не удалось определить'>",
          "activation_conditions_display": "<текст, 'Не установлены', 'Не применимо' или 'Не удалось определить'>"
        }
      context_k: 8
      temperature: 0.0
      max_tokens: 900

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "зачёт встречных требований безакцептное списание списание без распоряжения заранее данный акцепт direct debit set-off счета заёмщика в банке счета в сторонних банках просроченная задолженность уведомление о списании"
      preferred_unit_types:
        - obligation
        - payment_term
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - procedures
      negative_keywords:
        - "означает"
        - "в целях настоящего"
        - "предмет договора"
        - "обеспечение"
        - "ковенант"
      position_bias:
        preferred_range: [0.40, 0.85]
        boost: 0.13
        scope: segment
      context_k: 8
      max_chunks: 10
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
        - "invoice"
      preferred_clause_functions:
        - "obligations"
        - "procedures"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 35
      max_snippet_length: 550

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1300

      compact_output: false

      presence_signal:
        field: "set_off_and_direct_debit_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста кредитного договора сведения
        о праве банка на зачёт встречных требований (ст. 410 ГК) и
        безакцептное списание средств со счетов заёмщика (ст. 854 ГК):
        наличие, охват счетов, условия активации, уведомление, ограничения.
        Не анализируй обеспечение, ковенанты, проценты или неустойку.
        Не оценивай риски. Анализируй только текст договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля (все ключи должны присутствовать в ответе):

        0. set_off_and_direct_debit_check_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (set_off_right_status, direct_debit_status, accounts_scope,
              activation_conditions, notification_status,
              limitations_status) ≠ "not_defined";
           - "missing" — если все шесть содержательных поля = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Важно: notification_status = "absent" (прямо исключено)
           считается ≠ "not_defined" и даёт presence = "present".

           Если presence = "missing":
           - все enum-поля = "not_defined";
           - set_off_summary = "Не установлено";
           - direct_debit_display = "Не установлено";
           - accounts_scope_display = "Не применимо";
           - activation_conditions_display = "Не установлены";
           - не выполняй остальные шаги.

        1. set_off_right_status — право на зачёт встречных требований:
           - "present" — право Банка на зачёт прямо установлено;
           - "not_defined" — зачёт прямо не упомянут.

        2. direct_debit_status — право на безакцептное списание:
           - "present" — право Банка на безакцептное списание прямо
             установлено (заранее данный акцепт);
           - "not_defined" — не упомянуто.

        3. accounts_scope — охват счетов:
           - "all_borrower_accounts" — все счета заёмщика в Банке;
           - "specified_accounts" — конкретные счета (указан перечень);
           - "accounts_in_other_banks" — счета в сторонних банках
             (через заранее данный акцепт);
           - "mixed" — комбинация (в Банке + в сторонних);
           - "not_defined" — охват не определён.

        4. activation_conditions — условия активации:
           - "at_default" — только при просрочке / дефолте;
           - "automatic" — автоматически в дату платежа;
           - "on_demand" — по требованию Банка в любой момент;
           - "not_defined" — условия не определены.

        5. notification_status — уведомительный порядок:
           - "present" — Банк уведомляет Заёмщика о списании;
           - "absent" — договор прямо исключает уведомление;
           - "not_defined" — не урегулировано.

        6. limitations_status — ограничения:
           - "present" — установлены ограничения (минимальный остаток,
             определённые средства, целевое назначение);
           - "not_defined" — ограничения не установлены.

        7. set_off_summary — КРАТКОЕ summary для юриста.
           Примеры:
           - "Зачёт + безакцептное списание со всех счетов в Банке при просрочке, с уведомлением";
           - "Безакцептное списание со счетов в сторонних банках без уведомления (красный флаг)";
           - "Только зачёт по общим правилам ГК";
           - "Не установлено" / "Не применимо" / "Не удалось определить".

        8. direct_debit_display — краткая формулировка.
           - "Заранее данный акцепт на списание со всех счетов в Банке";
           - "Безакцептное списание при просрочке";
           - "Не установлено" / "Не применимо" / "Не удалось определить".

        9. accounts_scope_display — краткая формулировка охвата.
           - "Все счета Заёмщика в Банке";
           - "Счета Заёмщика в иных банках";
           - "Не применимо" / "Не удалось определить".

        10. activation_conditions_display — краткая формулировка условий.
            - "При наступлении срока платежа или просрочки; уведомление в следующий рабочий день";
            - "По требованию Банка в любой момент, без уведомления";
            - "Не установлены" / "Не применимо" / "Не удалось определить".
        </task>

        <context_rules>
        - Перед остальными полями заполни set_off_and_direct_debit_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все enum-поля = "not_defined", все display-поля = соответствующий fallback.
        - Используй только релевантные фрагменты контекста.
        - Не подставляй нормы закона, обычную практику или предположения вместо текста договора.
        - Различай два института: set-off (зачёт) и direct debit (безакцептное списание).
        - Различай охват: all_borrower_accounts / specified_accounts /
          accounts_in_other_banks / mixed.
        - Различай активацию: at_default / automatic / on_demand.
        - Красные флаги: списание со всех счетов без уведомления;
          automatic активация; списание со счетов в сторонних банках.
          Отражай в summary.
        - Не выдумывай условия списания, которых нет в тексте.
        - Если в разных фрагментах противоречие: enum → "not_defined", display → "Не удалось определить".
        - Не используй null, None, пустые строки или "-".
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни зачёта, ни безакцептного списания.
           → presence = "missing";
             все enum-поля = "not_defined";
             set_off_summary = "Не установлено";
             все display-поля = "Не применимо".

        2. Безакцептное списание со всех счетов без уведомления (красный флаг).
           "Банк вправе списывать средства со всех счетов Заёмщика
           без предварительного уведомления."
           → presence = "present";
             direct_debit_status = "present";
             accounts_scope = "all_borrower_accounts";
             notification_status = "absent";
             set_off_summary содержит «красный флаг».

        3. Противоречие между фрагментами.
           В одной части — списание только со счетов в Банке, в другой —
           со счетов в сторонних банках.
           → presence = "unclear";
             accounts_scope = "not_defined";
             accounts_scope_display = "Не удалось определить".

        4. Только зачёт по общим правилам ГК.
           "Банк вправе произвести зачёт встречных однородных требований
           в порядке ГК РФ."
           → presence = "present";
             set_off_right_status = "present";
             direct_debit_status = "not_defined";
             set_off_summary = "Только зачёт по общим правилам ГК РФ".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для set_off_and_direct_debit_check_presence используй только: "present", "missing", "unclear".
        - Для set_off_right_status, direct_debit_status, limitations_status используй только: "present", "not_defined".
        - Для accounts_scope используй только: "all_borrower_accounts", "specified_accounts", "accounts_in_other_banks", "mixed", "not_defined".
        - Для activation_conditions используй только: "at_default", "automatic", "on_demand", "not_defined".
        - Для notification_status используй только: "present", "absent", "not_defined".
        - Fallback при отсутствии данных:
          * set_off_summary → "Не установлено";
          * direct_debit_display → "Не установлено";
          * accounts_scope_display → "Не применимо";
          * activation_conditions_display → "Не установлены".
        - Fallback при противоречии или неоднозначности:
          * все display-поля → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "set_off_and_direct_debit_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования по зачёту и безакцептному списанию. Внутреннее агрегатное signal-поле."
          required: true

        - name: "set_off_right_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["present", "not_defined"]
          display_in_grid: false
          description: "Право Банка на зачёт встречных требований (ст. 410 ГК). Внутреннее enum-поле."
          required: true

        - name: "direct_debit_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["present", "not_defined"]
          display_in_grid: false
          description: "Право Банка на безакцептное списание (ст. 854 ГК). Внутреннее enum-поле."
          required: true

        - name: "accounts_scope"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["all_borrower_accounts", "specified_accounts", "accounts_in_other_banks", "mixed", "not_defined"]
          display_in_grid: false
          description: >
            Охват счетов: все в Банке / конкретные / в сторонних банках / смешанный.
            Внутреннее enum-поле.
          required: true

        - name: "activation_conditions"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["at_default", "automatic", "on_demand", "not_defined"]
          display_in_grid: false
          description: >
            Условия активации: при просрочке / автоматически / по требованию.
            Внутреннее enum-поле.
          required: true

        - name: "notification_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["present", "absent", "not_defined"]
          display_in_grid: false
          description: "Уведомительный порядок. absent — прямо исключён. Внутреннее enum-поле."
          required: true

        - name: "limitations_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["present", "not_defined"]
          display_in_grid: false
          description: "Установлены ли ограничения списания (минимальный остаток и т.п.). Внутреннее enum-поле."
          required: true

        - name: "set_off_summary"
          type: "string"
          presentation: "fact"
          label: "Зачёт и безакцептное списание"
          display_in_grid: true
          display_priority: 1
          description: >
            Краткое summary прав Банка на зачёт и безакцептное списание.
            Fallback: "Не установлено" / "Не применимо" / "Не удалось определить".
          required: true

        - name: "direct_debit_display"
          type: "string"
          presentation: "fact"
          label: "Безакцептное списание"
          display_in_grid: true
          display_priority: 2
          description: >
            Понятная формулировка права на безакцептное списание.
            Fallback: "Не установлено" / "Не применимо" / "Не удалось определить".
          required: true

        - name: "accounts_scope_display"
          type: "string"
          presentation: "fact"
          label: "Охват счетов"
          display_in_grid: true
          display_priority: 3
          description: >
            Понятная формулировка охвата счетов.
            Fallback: "Не применимо" / "Не удалось определить".
          required: true

        - name: "activation_conditions_display"
          type: "string"
          presentation: "fact"
          label: "Условия активации"
          display_in_grid: true
          display_priority: 4
          description: >
            Понятная формулировка условий активации списания и уведомления.
            Fallback: "Не установлены" / "Не применимо" / "Не удалось определить".
          required: true

      store_payload: true

  - id: representations_and_warranties_check
    name: "Заверения об обстоятельствах (representations & warranties)"
    description: >
      Проверяет наличие заверений заёмщика (ст. 431.2 ГК РФ), охват заверений
      (финансовые / юридические / налоговые / операционные), режим повторения
      заверений на дату выборки (repeating representations), последствия
      нарушения заверений и наличие оговорки о сохранении заверений
      после прекращения договора (survival).

      Отличие от conditions_precedent_check: CP — условия до выдачи
      (разовые). Заверения — длящиеся факты, которые могут повторяться
      на каждую дату выборки и дают самостоятельное основание ответственности
      по ст. 431.2 ГК РФ.
    triggers:
      any:
        - corporate_borrower
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "заверения об обстоятельствах"
        - "заверения"
        - "гарантии"
        - "representations"
        - "warranties"
        - "заемщик заверяет"
        - "заемщик гарантирует"
        - "подтверждает отсутствие"
        - "недостоверность заверений"
        - "ст. 431.2"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)(заверени[яй]|заверяет|заверил)"
        - "(?i)(гарант[ии]|гарантирует)\\s+(что|об|наличи|отсутстви)"
        - "(?i)(representations?|warranties)"
        - "(?i)подтвержда(ет|ю).{0,30}(отсутствие|наличие|соответствие)"
        - "(?i)недостоверн.{0,20}заверен"
        - "(?i)стать[ия]\\s+431\\.?2"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется кредитный договор.
        Проверяется только один вопрос: заверения об обстоятельствах
        (representations & warranties), которые даёт заёмщик.

        Нормативный ориентир:
        - ст. 431.2 ГК РФ — заверения об обстоятельствах; ответственность
          за недостоверные заверения
        - Постановление Пленума ВС РФ от 25.12.2018 № 49 (п. 26–32) —
          заверения как самостоятельное основание ответственности
        - ст. 821 ГК РФ — отказ от предоставления кредита

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора,
          а чего прямо нет.
        - Не оценивай серьёзность риска.
        - Различай заверения и CP (conditions precedent):
            * CP — разовые условия до выдачи (документы, регистрация);
            * заверения — длящиеся факты (отсутствие судов, достоверность
              отчётности, корпоративные полномочия).
        - Различай типы заверений:
            * корпоративные (создан надлежащим образом, имеет лицензии);
            * финансовые (отчётность достоверна, отсутствие ухудшения);
            * юридические (отсутствие судов, нет нарушений
              законодательства);
            * налоговые (нет задолженности по налогам);
            * операционные (отсутствие форс-мажора, соблюдение разрешений).
        - Repeating representations — заверения, повторяемые на дату
          каждой выборки / предоставления транша.
        - Survival — сохранение заверений после прекращения договора
          (обычно до полного погашения).
        - Красные флаги:
            * заверения с размытыми формулировками («в целом», «насколько
              известно Заёмщику»);
            * отсутствие последствий нарушения заверений;
            * заверения без survival clause.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Есть ли заверения заёмщика.
        2. Какие типы заверений установлены.
        3. Полный перечень заверений.
        4. Есть ли режим повторения заверений (repeating).
        5. Указаны ли последствия нарушения заверений.
        6. Есть ли оговорка о сохранении заверений (survival).
        7. Сформулируй понятные для юриста текстовые расшифровки:
           - reps_summary,
           - reps_scope_display,
           - reps_breach_consequences_display,
           - repeating_reps_display.

        [ПРАВИЛА]
        1. Используй только текст документа. Не подставляй нормы закона.
        2. Если параметр прямо указан — возвращай дословно или делай
           точную выжимку.
        3. `reps_list` — массив строк, каждая — одно заверение с краткой
           формулировкой, например: ["отсутствие судебных споров свыше
           10 млн руб.", "достоверность финансовой отчётности", "наличие
           корпоративных полномочий на заключение Договора"].
           Если заверений нет — пустой массив [].
        4. `reps_summary` — КРАТКОЕ summary, например:
           - "8 заверений: корпоративные, финансовые, юридические;
             repeating на каждую выборку";
           - "3 заверения о финансовой состоятельности, без repeating";
           - "Заверения с оговоркой «насколько известно Заёмщику»
             (красный флаг)";
           - "Не установлены".
           НЕ дублируй полный перечень в summary.
        5. Размытые заверения («в целом», «насколько известно»,
           «по мнению Заёмщика») — красный флаг. Отражай в summary.
        6. Если параметр прямо не указан:
           - для сигнальных enum-полей — "not_defined";
           - для текстовых user-facing полей — "Не установлены" /
             "Не установлено" по роду;
           - для массива — [].
        7. Если тема по существу не применима — display-поле =
           "Не применимо", сигнальное = "not_defined".
        8. Если текст есть, но надёжный вывод сделать нельзя — display-поле =
           "Не удалось определить", сигнальное = "not_defined".
        9. Никогда не используй null, None, пустые строки или "-".
        10. Не выдумывай заверения, которых нет в тексте.
        11. При конфликтующих фрагментах — приоритет более позднему.
        12. В evidence включай только текст договора.
        13. Верни РОВНО один JSON-объект со всеми ключами из [ФОРМАТ ОТВЕТА] без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [РОССИЙСКАЯ ПРАКТИКА — ПОДСКАЗКИ]
        - Типичные корпоративные заверения:
            * «Заёмщик создан и действует в соответствии с законодательством
              РФ, обладает всеми необходимыми корпоративными полномочиями
              для заключения Договора»;
            * «Заключение Договора одобрено уполномоченными органами
              Заёмщика в установленном порядке».
        - Типичные финансовые заверения:
            * «Финансовая отчётность Заёмщика за последний отчётный период
              является достоверной и полной, составлена в соответствии
              с РСБУ»;
            * «С даты последней финансовой отчётности не произошло
              существенных изменений, ухудшающих финансовое состояние
              Заёмщика» (MAC clause).
        - Типичные юридические заверения:
            * «В отношении Заёмщика не ведётся судебных и арбитражных
              разбирательств на сумму более N рублей»;
            * «Заёмщик не нарушает применимого законодательства».
        - Типичные налоговые заверения:
            * «Заёмщик надлежащим образом исполняет налоговые
              обязательства; задолженность по налогам отсутствует».
        - Типичная формулировка repeating reps:
            * «Заверения, указанные в разделе X, считаются повторёнными
              Заёмщиком на каждую дату предоставления Транша и дату
              каждого платежа».
        - Типичная survival clause:
            * «Заверения сохраняют силу до полного погашения
              обязательств по настоящему Договору».
        - Красные флаги:
            * «насколько известно Заёмщику» (knowledge qualifier) —
              существенно ослабляет заверение;
            * «в целом», «в основном» — размытые формулировки;
            * отсутствие прямого указания на последствия (ст. 431.2 ГК
              применяется диспозитивно).

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — полный набор заверений с repeating и survival:
        Фрагмент:
        "Заёмщик заверяет Банк в следующем: (а) Заёмщик создан и действует
         в соответствии с законодательством РФ; (б) заключение Договора
         одобрено уполномоченными органами; (в) финансовая отчётность
         за последний период является достоверной; (г) в отношении
         Заёмщика не ведётся судебных разбирательств на сумму более
         10 000 000 рублей; (д) задолженность по налогам отсутствует.
         Указанные заверения считаются повторёнными на каждую дату
         предоставления Транша. Недостоверность заверений является
         событием дефолта. Заверения сохраняют силу до полного
         погашения обязательств."

        Ответ:
        {
          "reps_present_status": "present",
          "reps_scope": "comprehensive",
          "reps_list": [
            "создан и действует в соответствии с законодательством РФ",
            "одобрение заключения Договора уполномоченными органами",
            "достоверность финансовой отчётности за последний период",
            "отсутствие судебных разбирательств свыше 10 000 000 рублей",
            "отсутствие задолженности по налогам"
          ],
          "repeating_reps_status": "present",
          "reps_breach_consequences_status": "present",
          "reps_survival_status": "present",
          "reps_summary": "5 заверений (корпоративные, финансовые, юридические, налоговые); repeating + survival; недостоверность = дефолт",
          "reps_scope_display": "Комплексные заверения: корпоративные, финансовые, юридические, налоговые",
          "reps_breach_consequences_display": "Событие дефолта при недостоверности заверений",
          "repeating_reps_display": "Повторяются на каждую дату предоставления Транша"
        }

        Пример 2 — размытые заверения (красный флаг):
        Фрагмент:
        "Заёмщик заверяет, что, насколько ему известно, его финансовое
         состояние в целом удовлетворительное и не ведётся существенных
         судебных разбирательств."

        Ответ:
        {
          "reps_present_status": "vague",
          "reps_scope": "financial",
          "reps_list": [
            "финансовое состояние удовлетворительное (с оговоркой «насколько известно»)",
            "отсутствие существенных судебных разбирательств (с оговоркой «насколько известно»)"
          ],
          "repeating_reps_status": "not_defined",
          "reps_breach_consequences_status": "not_defined",
          "reps_survival_status": "not_defined",
          "reps_summary": "Заверения с оговоркой «насколько известно Заёмщику» (красный флаг)",
          "reps_scope_display": "Финансовые и юридические заверения с knowledge qualifier",
          "reps_breach_consequences_display": "Не установлены",
          "repeating_reps_display": "Не установлены"
        }

        Пример 3 — только базовые корпоративные заверения:
        Фрагмент:
        "Заёмщик подтверждает, что обладает всеми необходимыми
         корпоративными полномочиями для заключения настоящего Договора."

        Ответ:
        {
          "reps_present_status": "present",
          "reps_scope": "corporate",
          "reps_list": [
            "наличие корпоративных полномочий на заключение Договора"
          ],
          "repeating_reps_status": "not_defined",
          "reps_breach_consequences_status": "not_defined",
          "reps_survival_status": "not_defined",
          "reps_summary": "1 корпоративное заверение; без repeating, без последствий",
          "reps_scope_display": "Только корпоративные заверения",
          "reps_breach_consequences_display": "Не установлены",
          "repeating_reps_display": "Не установлены"
        }

        Пример 4 — заверений нет:
        Фрагмент:
        "Иные условия определяются в соответствии с действующим
         законодательством Российской Федерации."

        Ответ:
        {
          "reps_present_status": "absent",
          "reps_scope": "not_defined",
          "reps_list": [],
          "repeating_reps_status": "not_defined",
          "reps_breach_consequences_status": "not_defined",
          "reps_survival_status": "not_defined",
          "reps_summary": "Не установлены",
          "reps_scope_display": "Не применимо",
          "reps_breach_consequences_display": "Не применимо",
          "repeating_reps_display": "Не применимо"
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямые цитаты о заверениях заёмщика.
        2. Определи тип заверений: корпоративные / финансовые / юридические /
           налоговые / операционные / комплексные.
        3. Составь полный перечень заверений (каждое — отдельная строка).
        4. Проверь наличие knowledge qualifiers («насколько известно»,
           «в целом»). Отражай как красный флаг.
        5. Найди repeating reps.
        6. Найди последствия нарушения.
        7. Найди survival clause.
        8. Сформулируй user-facing display-поля кратко и по-русски.
        9. Если прямых цитат нет — верни fallback по правилам 6–8.

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь РОВНО одним JSON-объектом без какого-либо дополнительного
        текста до или после, со всеми 11 ключами:
        {
          "reps_present_status": "<present / vague / absent / not_defined>",
          "reps_scope": "<corporate / financial / legal / tax / operational / comprehensive / not_defined>",
          "reps_list": ["<заверение 1>", "<заверение 2>"],
          "repeating_reps_status": "<present / not_defined>",
          "reps_breach_consequences_status": "<present / not_defined>",
          "reps_survival_status": "<present / not_defined>",
          "reps_summary": "<краткое summary, 'Не установлены', 'Не применимо' или 'Не удалось определить'>",
          "reps_scope_display": "<текст, 'Не применимо' или 'Не удалось определить'>",
          "reps_breach_consequences_display": "<текст, 'Не установлены', 'Не применимо' или 'Не удалось определить'>",
          "repeating_reps_display": "<текст, 'Не установлены', 'Не применимо' или 'Не удалось определить'>"
        }
      context_k: 8
      temperature: 0.0
      max_tokens: 1000

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "заверения об обстоятельствах заверения гарантии representations warranties заёмщик заверяет заёмщик гарантирует подтверждает отсутствие недостоверность заверений ст. 431.2 повторяются на каждую дату survival корпоративные полномочия финансовая отчётность судебные разбирательства"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - representations
        - obligations
      negative_keywords:
        - "означает"
        - "в целях настоящего"
        - "проценты"
        - "пск"
        - "обеспечение"
        - "неустойка"
      position_bias:
        preferred_range: [0.20, 0.65]
        boost: 0.14
        scope: segment
      context_k: 8
      max_chunks: 10
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
        - "invoice"
      preferred_clause_functions:
        - "representations"
        - "obligations"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 650

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1500

      compact_output: false

      presence_signal:
        field: "representations_and_warranties_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста кредитного договора сведения
        о заверениях заёмщика (representations & warranties по ст. 431.2 ГК РФ):
        наличие и качество формулировок, типы заверений, полный перечень,
        режим повторения (repeating), последствия нарушения, survival clause.
        Не анализируй conditions precedent, обеспечение, ковенанты, проценты
        или ПСК. Не оценивай риски. Анализируй только текст договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля (все ключи должны присутствовать в ответе):

        0. representations_and_warranties_check_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (reps_present_status, reps_scope, repeating_reps_status,
              reps_breach_consequences_status, reps_survival_status)
             ≠ "not_defined";
           - "missing" — если все пять содержательных полей = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Важно: reps_present_status = "absent" (заверений нет) и
           "vague" (размытые заверения) считаются ≠ "not_defined"
           и дают presence = "present" (договор прямо регулирует вопрос).

           Если presence = "missing":
           - все enum-поля = "not_defined";
           - reps_list = [];
           - reps_summary = "Не установлены";
           - reps_scope_display = "Не применимо";
           - reps_breach_consequences_display = "Не применимо";
           - repeating_reps_display = "Не применимо";
           - не выполняй остальные шаги.

        1. reps_present_status — наличие и качество заверений:
           - "present" — заверения прямо установлены с конкретными
             формулировками;
           - "vague" — заверения упомянуты, но с knowledge qualifier
             («насколько известно»), «в целом» или аналогично (красный флаг);
           - "absent" — договор прямо указывает, что заверений нет;
           - "not_defined" — вопрос не урегулирован.

        2. reps_scope — охват заверений:
           - "corporate" — только корпоративные (полномочия, одобрения);
           - "financial" — только финансовые (отчётность, MAC);
           - "legal" — только юридические (суды, соответствие закону);
           - "tax" — только налоговые;
           - "operational" — только операционные (лицензии, форс-мажор);
           - "comprehensive" — комплексные (несколько типов);
           - "not_defined" — охват не определён.

        3. reps_list — массив строк, каждая — одно заверение с краткой
           формулировкой. Если заверений нет — [].

        4. repeating_reps_status — повторение заверений:
           - "present" — заверения повторяются на дату каждой выборки
             / платежа;
           - "not_defined" — repeating не упомянуты.

        5. reps_breach_consequences_status — последствия нарушения:
           - "present" — последствия прямо установлены (event of default,
             право истребования, возмещение убытков);
           - "not_defined" — последствия не указаны.

        6. reps_survival_status — сохранение заверений:
           - "present" — survival clause прямо установлена
             (заверения действуют до полного погашения);
           - "not_defined" — survival не упомянут.

        7. reps_summary — КРАТКОЕ summary для юриста.
           НЕ дублируй полный перечень. Примеры:
           - "8 заверений (корпоративные, финансовые, юридические);
             repeating + survival";
           - "Заверения с оговоркой «насколько известно Заёмщику»
             (красный флаг)";
           - "Не установлены" / "Не применимо" / "Не удалось определить".

        8. reps_scope_display — краткая формулировка охвата.
           - "Комплексные заверения: корпоративные, финансовые,
             юридические, налоговые";
           - "Только корпоративные заверения";
           - "Не применимо" / "Не удалось определить".

        9. reps_breach_consequences_display — краткая формулировка.
           - "Событие дефолта при недостоверности заверений";
           - "Возмещение убытков по ст. 431.2 ГК РФ";
           - "Не установлены" / "Не применимо" / "Не удалось определить".

        10. repeating_reps_display — краткая формулировка repeating.
            - "Повторяются на каждую дату предоставления Транша";
            - "Не установлены" / "Не применимо" / "Не удалось определить".
        </task>

        <context_rules>
        - Перед остальными полями заполни representations_and_warranties_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все enum-поля = "not_defined", reps_list = [], все display-поля = соответствующий fallback.
        - Используй только релевантные фрагменты контекста.
        - Не подставляй нормы закона, обычную практику или предположения вместо текста договора.
        - Различай заверения и conditions precedent:
            * CP — разовые условия до выдачи;
            * заверения — длящиеся факты (могут repeating).
        - Красные флаги: knowledge qualifiers («насколько известно»);
          размытые формулировки; отсутствие последствий; отсутствие survival.
          Отражай в summary.
        - reps_list — массив строк с краткими формулировками. Не дублируй.
        - reps_summary — краткое summary, НЕ полный перечень.
        - Не выдумывай заверения, которых нет в тексте.
        - Если в разных фрагментах противоречие: enum → "not_defined", display → "Не удалось определить".
        - Не используй null, None, пустые строки или "-" в строковых полях.
        - Пустой массив [] — валидное значение для reps_list.
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни заверений, ни упоминания ст. 431.2 ГК.
           → presence = "missing";
             все enum-поля = "not_defined";
             reps_list = [];
             все display-поля = "Не применимо".

        2. Заверения прямо отсутствуют.
           "Заверения об обстоятельствах настоящим Договором не предусмотрены."
           → presence = "present";
             reps_present_status = "absent";
             reps_list = [];
             reps_summary = "Не установлены";
             все display-поля = "Не применимо".

        3. Противоречие между фрагментами.
           В одной части — заверения с repeating, в другой — «заверения
           действуют только на дату подписания».
           → presence = "unclear";
             repeating_reps_status = "not_defined";
             repeating_reps_display = "Не удалось определить".

        4. Размытые заверения с knowledge qualifier (красный флаг).
           "Заёмщик заверяет, что, насколько ему известно, его финансовое
           состояние удовлетворительное."
           → presence = "present";
             reps_present_status = "vague";
             reps_summary = "Заверения с оговоркой «насколько известно Заёмщику» (красный флаг)";
             reps_scope_display включает упоминание knowledge qualifier.
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для representations_and_warranties_check_presence используй только: "present", "missing", "unclear".
        - Для reps_present_status используй только: "present", "vague", "absent", "not_defined".
        - Для reps_scope используй только: "corporate", "financial", "legal", "tax", "operational", "comprehensive", "not_defined".
        - Для repeating_reps_status, reps_breach_consequences_status, reps_survival_status используй только: "present", "not_defined".
        - Для reps_list — массив строк (возможно пустой []).
        - Fallback при отсутствии данных:
          * reps_summary → "Не установлены";
          * reps_scope_display → "Не применимо";
          * reps_breach_consequences_display → "Не установлены";
          * repeating_reps_display → "Не установлены".
        - Fallback при противоречии или неоднозначности:
          * все display-поля → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "representations_and_warranties_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования по заверениям об обстоятельствах. Внутреннее агрегатное signal-поле."
          required: true

        - name: "reps_present_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["present", "vague", "absent", "not_defined"]
          display_in_grid: false
          description: >
            Наличие и качество заверений: present (конкретные),
            vague (с knowledge qualifier — красный флаг), absent, not_defined.
            Внутреннее enum-поле.
          required: true

        - name: "reps_scope"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["corporate", "financial", "legal", "tax", "operational", "comprehensive", "not_defined"]
          display_in_grid: false
          description: "Охват заверений (типы). Внутреннее enum-поле."
          required: true

        - name: "reps_list"
          type: "array"
          presentation: "fact"
          label: "Перечень заверений заёмщика"
          display_in_grid: false
          description: >
            Полный перечень заверений с краткой формулировкой (массив строк для payload). Fallback: "Не установлено" / "Не удалось определить".
          required: true

        - name: "repeating_reps_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["present", "not_defined"]
          display_in_grid: false
          description: "Повторение заверений на дату выборки (repeating reps). Внутреннее enum-поле."
          required: true

        - name: "reps_breach_consequences_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["present", "not_defined"]
          display_in_grid: false
          description: "Установлены ли последствия нарушения заверений. Внутреннее enum-поле."
          required: true

        - name: "reps_survival_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["present", "not_defined"]
          display_in_grid: false
          description: "Survival clause — сохранение заверений после прекращения. Внутреннее enum-поле."
          required: true

        - name: "reps_summary"
          type: "string"
          presentation: "fact"
          label: "Заверения заёмщика"
          display_in_grid: true
          display_priority: 1
          description: >
            Краткое summary заверений (полный перечень — в hidden reps_list).
            Fallback: "Не установлены" / "Не применимо" / "Не удалось определить".
          required: true

        - name: "reps_scope_display"
          type: "string"
          presentation: "fact"
          label: "Охват заверений"
          display_in_grid: true
          display_priority: 2
          description: >
            Понятная формулировка охвата заверений.
            Fallback: "Не применимо" / "Не удалось определить".
          required: true

        - name: "reps_breach_consequences_display"
          type: "string"
          presentation: "fact"
          label: "Последствия нарушения заверений"
          display_in_grid: true
          display_priority: 3
          description: >
            Понятная формулировка последствий нарушения заверений.
            Fallback: "Не установлены" / "Не применимо" / "Не удалось определить".
          required: true

        - name: "repeating_reps_display"
          type: "string"
          presentation: "fact"
          label: "Повторение заверений"
          display_in_grid: true
          display_priority: 4
          description: >
            Понятная формулировка режима повторения заверений (repeating reps).
            Fallback: "Не установлены" / "Не применимо" / "Не удалось определить".
          required: true

      store_payload: true

# ════════════════════════════════════════════════════════════════════════════
# БЛОК 5: DD_REQUEST_TEMPLATES
# Читается: DDRequestTemplateLoader
# ════════════════════════════════════════════════════════════════════════════

dd_request_templates:
  credit_subject_extraction:
    text: >
      Просим предоставить по {doc_names}: полные параметры кредита — кредитор,
      заемщик, сумма и валюта кредита, срок, процентная ставка, ПСК, структура
      погашения, наличие обеспечения, а также вид кредитного продукта
      (потребительский, ипотечный, кредитная линия, овердрафт и т.п.).
    addressee: "Банк / Юридический советник"

  lender_license_check:
    text: >
      Просим предоставить по {doc_names}: сведения о статусе кредитора, реквизиты
      лицензии Банка России, организационно-правовую форму и подтверждение,
      что кредитор вправе осуществлять банковские операции по предоставлению
      кредитов.
    addressee: "Кредитор"

  non_licensed_lender_red_flag:
    text: >
      В {doc_names} не выявлены достаточные признаки лицензии кредитора. Просим
      срочно предоставить реквизиты лицензии Банка России и правовое
      подтверждение допустимости заключения именно кредитного договора.
    addressee: "Кредитор / Юридический советник"

  written_form_required:
    text: >
      Просим подтвердить по {doc_names}, что кредитный договор оформлен
      в письменной форме с надлежащими реквизитами и подписями сторон,
      включая все приложения, являющиеся его неотъемлемой частью.
    addressee: "Обе стороны"

  credit_amount_required:
    text: >
      Просим уточнить по {doc_names}: размер кредита, валюту, а для кредитной
      линии — лимит кредитования и максимальный размер задолженности.
    addressee: "Кредитор"

  interest_psk_fees_check:
    text: >
      Просим предоставить по {doc_names}: процентную ставку, ПСК, полный перечень
      комиссий и иных платежей заемщика, а также пример расчета общей стоимости
      кредита и ежемесячного платежа.
    addressee: "Кредитор"

  interest_free_credit_red_flag:
    text: >
      В {doc_names} выявлен риск беспроцентной конструкции кредитного договора.
      Просим предоставить правовое пояснение и скорректировать договор,
      поскольку кредитный договор по своей природе является возмездным.
    addressee: "Юридический советник"

  consumer_credit_without_psk:
    text: >
      В {doc_names} выявлен риск отсутствия ПСК при потребительском кредите.
      Просим срочно предоставить значение полной стоимости кредита и расчет
      согласно требованиям ФЗ-353 и актам Банка России.
    addressee: "Кредитор / Юридический советник"

  repayment_schedule_and_early_repayment_check:
    text: >
      Просим предоставить по {doc_names}: график платежей, структуру погашения
      (аннуитет / дифференцированная / иная), условия досрочного погашения,
      сроки уведомления и последствия частичного/полного досрочного возврата.
    addressee: "Кредитор"

  early_repayment_right:
    text: >
      Просим уточнить по {doc_names}: вправе ли заемщик осуществить полное или
      частичное досрочное погашение, в какой срок требуется уведомление,
      и взимаются ли какие-либо дополнительные комиссии/санкции.
    addressee: "Кредитор / Юридический советник"

  forced_services_and_insurance_check:
    text: >
      Просим предоставить по {doc_names}: перечень всех дополнительных услуг
      и страховых продуктов, указать, какие из них являются добровольными,
      как оформляется отказ заемщика, и подтвердить, что выдача кредита
      не поставлена в зависимость от приобретения таких услуг.
    addressee: "Кредитор"

  collateral_security:
    text: >
      Просим предоставить по {doc_names}: документы по обеспечению кредита —
      договор залога/ипотеки, поручительство, описание предмета обеспечения,
      оценку, порядок обращения взыскания и случаи утраты обеспечения.
    addressee: "Кредитор / Заемщик"

  acceleration_events_check:
    text: >
      Просим уточнить в {doc_names}: основания для досрочного истребования
      кредита, наличие срока на устранение нарушения, порядок уведомления
      заемщика и последствия предъявления требования о досрочном возврате.
    addressee: "Кредитор / Юридический советник"

  variable_rate_check:
    text: >
      По {doc_names} с плавающей ставкой просим предоставить: формулу ставки,
      источник референсного индикатора, периодичность пересмотра, порядок
      уведомления заемщика и пример перерасчета платежей.
    addressee: "Кредитор"

  payment_allocation_priority_check:
    text: >
      Просим уточнить в {doc_names}: очередность списания поступающих от заемщика
      сумм между расходами, процентами, основным долгом, неустойкой и иными
      платежами, а также привести пример распределения частичного платежа.
    addressee: "Кредитор"

  credit_line_limit_and_tranches:
    text: >
      По {doc_names} (кредитная линия) просим предоставить: лимит кредитования,
      правила выборки траншей, условия доступности лимита, порядок возврата
      траншей и случаи приостановления дальнейшей выборки.
    addressee: "Кредитор"

  credit_line_without_limit_terms:
    text: >
      В {doc_names} выявлен риск неполного регулирования кредитной линии. Просим
      срочно уточнить лимит, порядок выдачи траншей, условия их возврата
      и механизм расчета доступного остатка лимита.
    addressee: "Кредитор / Юридический советник"

  foreign_currency_credit_without_conversion_logic:
    text: >
      В {doc_names} выявлен валютный элемент без достаточной валютной оговорки.
      Просим предоставить условия пересчета, источник курса, дату определения
      курса и правовое обоснование валютной конструкции кредита.
    addressee: "Кредитор / Юридический советник"

  cooling_off_disclosure:
    text: >
      Для {doc_names} как потребительского кредита просим уточнить: право
      заемщика отказаться от кредита в предусмотренный законом срок, порядок
      такого отказа, сумму процентов к уплате за фактический период пользования
      и форму уведомления кредитора.
    addressee: "Кредитор"

  penalty_proportionality:
    text: >
      Просим уточнить по {doc_names}: размер неустойки, пеней и штрафов,
      методику их расчета, предельные значения и соответствие ограничениям,
      применимым к потребительскому кредитованию.
    addressee: "Кредитор / Юридический советник"

  personal_data_and_credit_history:
    text: >
      Просим предоставить по {doc_names}: формулировки согласия на обработку
      персональных данных, сведения о передаче информации в БКИ, перечень
      передаваемых данных и основания такой передачи.
    addressee: "Кредитор"

  financial_covenants_check:
    text: >
      Просим предоставить по {doc_names}: полный перечень финансовых ковенантов,
      методологию расчёта каждого показателя, периодичность тестирования,
      последствия нарушения и наличие срока на исправление (cure period).
    addressee: "Кредитор / Юридический советник"

  cross_default_check:
    text: >
      Просим предоставить по {doc_names}: условия кросс-дефолта, пороговую сумму
      задолженности, перечень охватываемых обязательств, наличие grace period
      и порядок уведомления заёмщика.
    addressee: "Кредитор / Юридический советник"

  cross_default_without_thresholds:
    text: >
      В {doc_names} выявлен кросс-дефолт без порога существенности. Просим
      установить минимальную сумму задолженности, при которой срабатывает
      кросс-дефолт, и предусмотреть grace period.
    addressee: "Юридический советник / Заёмщик"

  purpose_and_control_check:
    text: >
      Просим предоставить по {doc_names}: описание целевого назначения кредита,
      перечень документов для подтверждения целевого использования, сроки
      предоставления и последствия нецелевого использования.
    addressee: "Кредитор"

  purpose_without_control_mechanism:
    text: >
      В {doc_names} указан целевой кредит без механизма контроля использования.
      Просим предусмотреть порядок предоставления подтверждающих документов
      и сроки их представления банку.
    addressee: "Юридический советник"

  negative_pledge_check:
    text: >
      Просим предоставить по {doc_names}: условия негативного залога, перечень
      активов, на которые распространяется ограничение, исключения и порядок
      получения согласия банка.
    addressee: "Кредитор / Юридический советник"

  representations_and_warranties_check:
    text: >
      Просим предоставить по {doc_names}: полный перечень заверений заёмщика,
      момент их предоставления (на дату подписания / каждого транша),
      последствия недостоверности заверений.
    addressee: "Кредитор / Заёмщик"

  change_of_control_clause:
    text: >
      Просим уточнить в {doc_names}: определение смены контроля, последствия
      (досрочное погашение / пересмотр условий / waiver), порядок уведомления
      банка.
    addressee: "Кредитор / Заёмщик"

  grace_period_disclosure:
    text: >
      Просим уточнить по {doc_names}: условия предоставления льготного периода,
      критерии для получения, порядок подачи заявления, влияние на начисление
      процентов и срок кредита.
    addressee: "Кредитор"

  events_of_default_list:
    text: >
      Просим предоставить по {doc_names}: исчерпывающий перечень событий дефолта,
      наличие cure period для каждого события, порядок уведомления и механизм
      waiver.
    addressee: "Кредитор / Юридический советник"

  unilateral_rate_change_risk:
    text: >
      В {doc_names} выявлен риск одностороннего изменения ставки банком. Просим
      привязать изменение к объективному индикатору (ключевая ставка и т.п.)
      или исключить право одностороннего изменения.
    addressee: "Юридический советник / Заёмщик"

  _default:
    text: >
      Просим предоставить дополнительную информацию по вопросу «{check_name}»
      применительно к {doc_names}.
    addressee: "Юридический советник"

