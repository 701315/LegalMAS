        </context>

        <task>
        Заполни строго следующие 6 полей (все ключи должны присутствовать
        в ответе):

        1. purpose_defined_status — "defined" / "not_defined".
           Указана ли цель кредита прямо в договоре.
        2. purpose_kind — "targeted" / "non_targeted" / "not_defined".
           "targeted" — кредит целевой, цель указана;
           "non_targeted" — кредит нецелевой;
           "not_defined" — неясно.
        3. control_mechanism_status — "present" / "not_defined".
           Установлен ли механизм контроля целевого использования.
        4. purpose_display — краткая понятная формулировка цели кредита:
           например, "Приобретение оборудования", "Пополнение оборотных
           средств", "Не установлено", "Не применимо",
           "Не удалось определить".
        5. purpose_kind_display — краткая формулировка типа:
           "Целевой кредит", "Нецелевой кредит", "Не установлено".
        6. control_mechanism_display — краткая формулировка механизма
           контроля: например, "Подтверждение документами в течение 30 дней
           с даты выборки", "Не установлен (цель указана, механизм контроля
           отсутствует)", "Не применимо", "Не удалось определить".
        </task>

        <rules>
        - Используй только текст договора. Не подставляй нормы закона.
        - Не делай предположений о цели или механизме контроля, которых
          нет в тексте.
        - Различай целевой и нецелевой кредит:
            * targeted — цель указана прямо;
            * non_targeted — цель не установлена, использование
