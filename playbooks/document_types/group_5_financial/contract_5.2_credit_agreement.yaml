        <role>
        Ты — российский юрист. Извлеки из текста кредитного договора сведения
        о порядке изменения договора, праве Банка на односторонние изменения,
        режиме waiver и оговорке о сохранении прав. Не анализируй
        обеспечение, ковенанты, проценты, ПСК или неустойку. Не оценивай
        серьёзность риска.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие 8 полей (все ключи должны присутствовать
        в ответе):

        1. amendment_form_status — "present" / "not_defined".
           Указана ли форма изменений (письменная и т.п.).
        2. unilateral_amendment_status — "present" / "absent" /
           "not_defined".
           Есть ли право Банка на односторонние изменения.
        3. waiver_regime_status — "present" / "not_defined".
           Установлен ли режим waiver.
        4. no_waiver_by_conduct_status — "present" / "not_defined".
           Есть ли оговорка «неосуществление права не означает отказа».
        5. amendment_summary — КРАТКОЕ summary.
        6. amendment_form_display — краткая формулировка формы изменений.
        7. unilateral_amendment_display — краткая формулировка
           односторонних изменений.
        8. waiver_display — краткая формулировка режима waiver.
        </task>

        <rules>
        - Используй только текст договора. Не подставляй нормы закона.
        - Не делай предположений о порядке изменения, которых нет в тексте.
        - Различай: изменение по соглашению сторон vs одностороннее
          изменение.
        - Красные флаги: широкое право Банка на односторонние изменения
          ключевых условий (ставка, срок); односторонние изменения
          без уведомления. Отражай в summary.
        - Если параметр прямо не указан:
            * сигнальное enum-поле → "not_defined";
            * user-facing display-поле → "Не установлена" / "Не установлено".
        - Если тема по существу неприменима — display-поле = "Не применимо",
          сигнальное = "not_defined".
        - Никогда не используй null, None, пустые строки или "-".
        - При конфликтующих фрагментах — приоритет более позднему.
        - Верни РОВНО один JSON-объект со всеми 8 ключами без какого-либо
          дополнительного текста до или после. Начни ответ сразу
          с открывающей фигурной скобки и закончи закрывающей. НЕ пиши
          Markdown, списки, код-фенсы. Ответ должен быть валидным JSON,
          пригодным для парсинга через json.loads без предварительной
          обработки.
        </rules>
      fields:
        - name: "amendment_form_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["present", "not_defined"]
          description: "Указана ли форма изменений."
