             порядок);
           - "not_defined" — не описан.

        4. no_waiver_by_conduct_status — оговорка о сохранении прав:
           - "present" — оговорка «неосуществление права не означает
             отказа» прямо установлена;
           - "not_defined" — не установлена.

        5. amendment_summary — КРАТКОЕ summary.
           Примеры:
           - "Изменения по соглашению сторон в письменной форме; оговорка о сохранении прав";
           - "Право Банка изменять тарифы с уведомлением за 10 дней";
           - "Широкое право Банка на односторонние изменения (красный флаг)";
           - "Не установлено" / "Не применимо" / "Не удалось определить".

        6. amendment_form_display — краткая формулировка формы.
           - "Письменная форма, подписание уполномоченными представителями";
           - "Не установлена" / "Не применимо" / "Не удалось определить".

        7. unilateral_amendment_display — краткая формулировка.
           - "Право Банка изменять Тарифы с уведомлением за 10 дней";
           - "Широкое право: ставка, сроки, иные условия (красный флаг)";
           - "Не установлено" / "Не применимо" / "Не удалось определить".

        8. waiver_display — краткая формулировка.
           - "Неосуществление права не означает отказа";
           - "Не установлено" / "Не применимо" / "Не удалось определить".
        </task>

        <context_rules>
        - Перед остальными полями заполни amendment_and_waiver_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все enum-поля = "not_defined", все display-поля = "Не применимо".
        - Используй только релевантные фрагменты контекста.
        - Не подставляй нормы закона, обычную практику или предположения вместо текста договора.
        - Различай: изменение по соглашению сторон vs одностороннее изменение Банком.
        - Красные флаги: широкое право на односторонние изменения ключевых условий;
          без уведомления. Отражай в summary.
        - Не выдумывай условия односторонних изменений, которых нет в тексте.
        - Если в разных фрагментах противоречие: enum → "not_defined", display → "Не удалось определить".
        - Не используй null, None, пустые строки или "-".
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни порядка изменения, ни waiver, ни оговорки.
           → presence = "missing";
             все enum-поля = "not_defined";
             все display-поля = "Не применимо".

        2. Стандартный порядок + оговорка о сохранении прав.
           "Изменения в письменной форме. Неосуществление права не означает отказа."
           → presence = "present";
             amendment_form_status = "present";
             unilateral_amendment_status = "absent";
             no_waiver_by_conduct_status = "present".

        3. Противоречие между фрагментами.
           В одной части — «только по соглашению», в другой —
           «Банк вправе изменять односторонне».
           → presence = "unclear";
             unilateral_amendment_status = "not_defined";
             unilateral_amendment_display = "Не удалось определить".

        4. Широкое право банка (красный флаг).
           "Банк вправе изменять любые условия Договора с уведомлением."
           → presence = "present";
             unilateral_amendment_status = "present";
             amendment_summary = "Широкое право Банка на односторонние изменения (красный флаг)".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для amendment_and_waiver_check_presence используй только: "present", "missing", "unclear".
        - Для amendment_form_status, waiver_regime_status, no_waiver_by_conduct_status используй только: "present", "not_defined".
        - Для unilateral_amendment_status используй только: "present", "absent", "not_defined".
        - Fallback при отсутствии данных:
          * amendment_summary → "Не установлено";
          * amendment_form_display → "Не установлена";
          * unilateral_amendment_display → "Не установлено";
          * waiver_display → "Не установлено".
        - Fallback при противоречии или неоднозначности:
          * все display-поля → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "amendment_and_waiver_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования по порядку изменения и waiver. Внутреннее агрегатное signal-поле."
          required: true

        - name: "amendment_form_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["present", "not_defined"]
          display_in_grid: false
          description: "Указана ли форма изменений. Внутреннее enum-поле."
          required: true

        - name: "unilateral_amendment_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["present", "absent", "not_defined"]
          display_in_grid: false
          description: "Право Банка на односторонние изменения. absent — прямо исключено. Внутреннее enum-поле."
          required: true

        - name: "waiver_regime_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["present", "not_defined"]
          display_in_grid: false
          description: "Режим waiver. Внутреннее enum-поле."
          required: true

        - name: "no_waiver_by_conduct_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["present", "not_defined"]
          display_in_grid: false
          description: "Оговорка о сохранении прав. Внутреннее enum-поле."
          required: true

        - name: "amendment_summary"
          type: "string"
          presentation: "fact"
          label: "Порядок изменения"
          display_in_grid: true
          display_priority: 1
          description: >
            Краткое summary порядка изменения и waiver.
            Fallback: "Не установлено" / "Не применимо" / "Не удалось определить".
          required: true

        - name: "amendment_form_display"
          type: "string"
          presentation: "fact"
          label: "Форма изменений"
          display_in_grid: true
          display_priority: 2
          description: >
            Понятная формулировка формы изменений.
            Fallback: "Не установлена" / "Не применимо" / "Не удалось определить".
          required: true

        - name: "unilateral_amendment_display"
          type: "string"
          presentation: "fact"
          label: "Односторонние изменения"
          display_in_grid: true
          display_priority: 3
          description: >
            Понятная формулировка односторонних изменений.
            Fallback: "Не установлено" / "Не применимо" / "Не удалось определить".
          required: true

        - name: "waiver_display"
          type: "string"
          presentation: "fact"
          label: "Waiver"
          display_in_grid: true
          display_priority: 4
          description: >
            Понятная формулировка режима waiver.
            Fallback: "Не установлено" / "Не применимо" / "Не удалось определить".
          required: true

      store_payload: true

  - id: notices_and_communications_check
    name: "Порядок уведомлений и коммуникации сторон"
    description: >
      Проверяет способы направления уведомлений (почта, email, личный
      кабинет, курьер), момент получения, юридическую силу уведомлений
      по email и указание адресов сторон.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "medium"
    severity_if_pass: "pass"
    severity_if_fail: "medium"
    severity_if_unclear: "low"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "порядок уведомлений"
        - "уведомления направляются"
        - "адрес для уведомлений"
        - "считается полученным"
        - "заказным письмом"
        - "электронной почте"
        - "юридическая сила"
        - "личный кабинет"
        - "курьерской службой"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)уведомлени.{0,30}(направля|считает|получен)"
        - "(?i)заказн(ым|ого)\\s+письм"
        - "(?i)(электронн(ой|ая)\\s+почт|e-?mail)"
        - "(?i)считается\\s+полученн"
        - "(?i)юридическ(ую|ая)\\s+сил"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется кредитный договор.
        Проверяется только один вопрос: порядок направления уведомлений,
        момент их получения и юридическая сила уведомлений по email.

        Нормативный ориентир:
        - ст. 165.1 ГК РФ — юридически значимые сообщения

        Важно:
        - Твоя задача — только установить факты из текста договора.
        - Не оценивай серьёзность риска.

        [ФОРМАТ ОТВЕТА]
        {
          "notice_methods_status": "<present / not_defined>",
          "notice_methods_value": ["<способ 1>"],
          "notice_effective_moment_status": "<present / not_defined>",
          "email_notices_status": "<present / absent / not_defined>",
          "addresses_specified_status": "<present / not_defined>",
          "notices_summary": "<краткое summary>",
          "notice_methods_display": "<текст>",
          "notice_effective_display": "<текст>",
          "email_notices_display": "<текст>"
        }
      context_k: 8
      temperature: 0.0
      max_tokens: 900

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "порядок уведомлений адрес для уведомлений направление уведомлений заказное письмо курьерская служба электронная почта email юридическая сила уведомлений момент получения уведомления считается полученным личный кабинет"
      preferred_unit_types:
        - general_provision
        - obligation
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - boilerplate
        - procedures
      negative_keywords:
        - "означает"
        - "в целях настоящего"
        - "проценты"
        - "пск"
        - "обеспечение"
        - "неустойка"
        - "ковенант"
      position_bias:
        preferred_range: [0.55, 0.95]
        boost: 0.12
        scope: segment
      context_k: 8
      max_chunks: 10
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
        - "invoice"
      preferred_clause_functions:
        - "boilerplate"
        - "procedures"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 35
      max_snippet_length: 500

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1300

      compact_output: false

      presence_signal:
        field: "notices_and_communications_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста кредитного договора сведения
        о порядке уведомлений: способы направления, момент получения,
        юридическая сила email-уведомлений, указание адресов сторон.
        Не анализируй обеспечение, ковенанты, проценты, ПСК или неустойку.
        Не оценивай риски. Анализируй только текст договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля (все ключи должны присутствовать в ответе):

        0. notices_and_communications_check_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (notice_methods_status, notice_effective_moment_status,
              email_notices_status, addresses_specified_status)
             ≠ "not_defined";
           - "missing" — если все четыре содержательных поля = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Важно: email_notices_status = "absent" (прямо исключён)
           считается ≠ "not_defined" и даёт presence = "present".

           Если presence = "missing":
           - все enum-поля = "not_defined";
           - notice_methods_value = [];
           - notices_summary = "Не установлено";
           - все display-поля = "Не применимо";
           - не выполняй остальные шаги.

        1. notice_methods_status — способы уведомления:
           - "present" — способы направления прямо указаны;
           - "not_defined" — не указаны.

        2. notice_methods_value — массив строк, каждая — способ.
           Примеры: "заказное письмо с уведомлением о вручении",
           "электронная почта", "курьерская служба", "личный кабинет".
           Если не указаны — [].

        3. notice_effective_moment_status — момент получения:
           - "present" — момент получения прямо указан;
           - "not_defined" — не указан.

        4. email_notices_status — email-уведомления:
           - "present" — email указан как канал с юридической силой;
           - "absent" — email прямо исключён;
           - "not_defined" — не урегулировано.

        5. addresses_specified_status — адреса сторон:
           - "present" — адреса для уведомлений прямо указаны;
           - "not_defined" — не указаны.

        6. notices_summary — КРАТКОЕ summary.
           Примеры:
           - "Заказное письмо + email, email имеет юр. силу; 5-й рабочий день";
           - "Только заказное письмо; email не установлен";
           - "Не установлено" / "Не применимо" / "Не удалось определить".

        7. notice_methods_display — краткая формулировка способов.
           - "Заказное письмо + электронная почта";
           - "Не установлены" / "Не применимо" / "Не удалось определить".

        8. notice_effective_display — краткая формулировка момента.
           - "Почта — 5-й рабочий день; email — в день отправки";
           - "Не установлен" / "Не применимо" / "Не удалось определить".

        9. email_notices_display — краткая формулировка.
           - "Email-уведомления имеют юридическую силу";
           - "Не установлено" / "Не применимо" / "Не удалось определить".
        </task>

        <context_rules>
        - Перед остальными полями заполни notices_and_communications_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все enum-поля = "not_defined", notice_methods_value = [], все display-поля = "Не применимо".
        - Используй только релевантные фрагменты контекста.
        - Не подставляй нормы закона, обычную практику или предположения вместо текста договора.
        - notice_methods_value — массив строк. Не дублируй способы.
        - Если email упомянут, но без указания юридической силы — email_notices_status = "not_defined".
        - Если email прямо указан как имеющий юридическую силу — "present".
        - Красные флаги: отсутствие способа направления; отсутствие момента получения. Отражай в summary.
        - Не выдумывай способы и сроки, которых нет в тексте.
        - Если в разных фрагментах противоречие: enum → "not_defined", display → "Не удалось определить".
        - Не используй null, None, пустые строки или "-".
        - Пустой массив [] — валидное значение для notice_methods_value.
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни способов уведомления, ни момента получения.
           → presence = "missing";
             все enum-поля = "not_defined";
             notice_methods_value = [];
             все display-поля = "Не применимо".

        2. Только заказное письмо, без email.
           "Уведомления направляются заказным письмом по адресам в реквизитах."
           → presence = "present";
             notice_methods_status = "present";
             notice_methods_value = ["заказное письмо с уведомлением о вручении"];
             email_notices_status = "not_defined";
             addresses_specified_status = "present".

        3. Противоречие между фрагментами.
           В одной части — email имеет юр. силу, в другой — «только почта».
           → presence = "unclear";
             email_notices_status = "not_defined";
             email_notices_display = "Не удалось определить".

        4. Полный набор: почта + email + момент получения.
           "Почта + email. Email имеет юр. силу. Почта — 5-й день, email — день отправки."
           → presence = "present";
             все enum-поля = "present";
             notice_methods_value = ["заказное письмо", "электронная почта"].
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для notices_and_communications_check_presence используй только: "present", "missing", "unclear".
        - Для notice_methods_status, notice_effective_moment_status, addresses_specified_status используй только: "present", "not_defined".
        - Для email_notices_status используй только: "present", "absent", "not_defined".
        - Для notice_methods_value — массив строк (возможно пустой []).
        - Fallback при отсутствии данных:
          * notices_summary → "Не установлено";
          * notice_methods_display → "Не применимо";
          * notice_effective_display → "Не применимо";
          * email_notices_display → "Не применимо".
        - Fallback при противоречии или неоднозначности:
          * все display-поля → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "notices_and_communications_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования по порядку уведомлений. Внутреннее агрегатное signal-поле."
          required: true

        - name: "notice_methods_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["present", "not_defined"]
          display_in_grid: false
          description: "Наличие указания способов уведомления. Внутреннее enum-поле."
          required: true

        - name: "notice_methods_value"
          type: "array"
          presentation: "fact"
          label: "Способы отправки юридически значимых уведомлений"
          display_in_grid: false
          description: >
            Полный перечень способов направления уведомлений (массив строк для payload). Fallback: "Не установлено" / "Не удалось определить".
          required: true

        - name: "notice_effective_moment_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["present", "not_defined"]
          display_in_grid: false
          description: "Указан ли момент получения уведомления. Внутреннее enum-поле."
          required: true

        - name: "email_notices_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["present", "absent", "not_defined"]
          display_in_grid: false
          description: "Email-уведомления и их юридическая сила. absent — прямо исключён. Внутреннее enum-поле."
          required: true

        - name: "addresses_specified_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["present", "not_defined"]
          display_in_grid: false
          description: "Указаны ли адреса сторон для уведомлений. Внутреннее enum-поле."
          required: true

        - name: "notices_summary"
          type: "string"
          presentation: "fact"
          label: "Порядок уведомлений"
          display_in_grid: true
          display_priority: 1
          description: >
            Краткое summary порядка уведомлений.
            Fallback: "Не установлено" / "Не применимо" / "Не удалось определить".
          required: true

        - name: "notice_methods_display"
          type: "string"
          presentation: "fact"
          label: "Способы уведомления"
          display_in_grid: true
          display_priority: 2
          description: >
            Способы направления уведомлений.
            Fallback: "Не установлены" / "Не применимо" / "Не удалось определить".
          required: true

        - name: "notice_effective_display"
          type: "string"
          presentation: "fact"
          label: "Момент получения"
          display_in_grid: true
          display_priority: 3
          description: >
            Момент получения уведомления.
            Fallback: "Не установлен" / "Не применимо" / "Не удалось определить".
          required: true

        - name: "email_notices_display"
          type: "string"
          presentation: "fact"
          label: "Email-уведомления"
          display_in_grid: true
          display_priority: 4
          description: >
            Статус email-уведомлений.
            Fallback: "Не установлено" / "Не применимо" / "Не удалось определить".
          required: true

      store_payload: true

  - id: assignment_and_transfer_check
    name: "Уступка прав требования и перевод долга"
    description: >
      Проверяет право банка на уступку прав требования по кредитному
      договору (ст. 382–386 ГК РФ), требование согласия заёмщика на
      уступку, охват уступки (полная / частичная / синдикация /
      секьюритизация), ограничения по кругу цессионариев и право заёмщика
      на перевод долга.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "уступка прав"
        - "уступка требования"
        - "цессия"
        - "перевод долга"
        - "передача прав"
        - "assignment"
        - "transfer"
        - "без согласия заёмщика"
        - "с согласия заёмщика"
        - "синдикат"
        - "секьюритизация"
        - "коллекторское агентство"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)уступ(ка|ки|ать)\\s+(прав|требован)"
        - "(?i)(цесси|цедент|цессионар)"
        - "(?i)перевод\\s+долг"
        - "(?i)передач.{0,20}прав.{0,20}(третьим|иным)\\s+лиц"
        - "(?i)(assignment|transfer\\s+of\\s+rights)"
        - "(?i)(синдикат|секьюритизаци|коллектор)"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется кредитный договор.
        Проверяется только один вопрос: уступка прав требования Банком
        и перевод долга Заёмщиком.

        Нормативный ориентир:
        - ст. 382 ГК РФ — переход прав кредитора к другому лицу
        - ст. 383 ГК РФ — права, которые не могут переходить к другим лицам
        - ст. 384 ГК РФ — объём прав кредитора, переходящих к другому лицу
        - ст. 385 ГК РФ — уведомление должника о переходе права
        - ст. 388 ГК РФ — условия уступки требования
        - ст. 391 ГК РФ — условие и форма перевода долга
        - Определение ВС РФ от 14.05.2019 № 305-ЭС19-5677 —
          правомерность уступки банком прав по кредитному договору
          коллекторскому агентству
        - ФЗ № 230-ФЗ «О защите прав и законных интересов физических лиц
          при осуществлении деятельности по возврату просроченной
          задолженности»

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора,
          а чего прямо нет.
        - Не оценивай серьёзность риска.
        - По общему правилу (ст. 382 ГК) уступка прав кредитором НЕ требует
          согласия должника, если иное не предусмотрено договором.
        - Для потребительских кредитов (физлица) есть специальные правила
          353-ФЗ: уступка возможна только в случаях, предусмотренных
          законом или договором; возможны ограничения по цессионариям
          (только банки / коллекторы, включённые в реестр).
        - Перевод долга (ст. 391 ГК) всегда требует согласия кредитора.
        - Различай:
            * assignment of rights — уступка прав Банка;
            * assignment of obligations — перевод долга Заёмщика
              (значительно реже);
            * novation — новация (замена договора).
        - Красные флаги:
            * право Банка на уступку любому третьему лицу без ограничений;
            * право уступки без уведомления заёмщика;
            * право передачи персональных данных без согласия
              (для физлиц).
        - «Положительный» для заёмщика сценарий:
            * требование согласия заёмщика на уступку;
            * ограничения по кругу цессионариев;
            * уведомительный порядок.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Есть ли право Банка на уступку прав требования.
        2. Требуется ли согласие Заёмщика на уступку.
        3. Какой охват уступки (полная / частичная / синдикация /
           секьюритизация).
        4. Есть ли ограничения по кругу цессионариев.
        5. Есть ли уведомительный порядок при уступке.
        6. Есть ли право Заёмщика на перевод долга и его условия.
        7. Сформулируй понятные для юриста текстовые расшифровки:
           - assignment_summary,
           - lender_assignment_display,
           - borrower_consent_display,
           - transfer_restrictions_display,
           - borrower_transfer_display.

        [ПРАВИЛА]
        1. Используй только текст документа. Не подставляй нормы закона.
        2. Если параметр прямо указан — возвращай дословно или делай
           точную выжимку.
        3. `assignment_summary` — КРАТКОЕ summary, например:
           - "Банк вправе уступить без согласия Заёмщика любому лицу,
             с уведомлением";
           - "Уступка только с согласия Заёмщика, цессионарий — только
             банки или кредитные организации";
           - "Банк вправе уступить любому лицу без уведомления
             (красный флаг)";
           - "Не установлено".
        4. Если параметр прямо не указан:
           - для сигнальных enum-полей — "not_defined";
           - для текстовых user-facing полей — "Не установлено";
        5. Если тема по существу не применима — display-поле =
           "Не применимо", сигнальное = "not_defined".
        6. Если текст есть, но надёжный вывод сделать нельзя — display-поле =
           "Не удалось определить", сигнальное = "not_defined".
        7. Никогда не используй null, None, пустые строки или "-".
        8. Не выдумывай ограничения, которых нет в тексте.
        9. При конфликтующих фрагментах — приоритет более позднему.
        10. В evidence включай только текст договора.
        11. Верни РОВНО один JSON-объект со всеми ключами из [ФОРМАТ ОТВЕТА] без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [РОССИЙСКАЯ ПРАКТИКА — ПОДСКАЗКИ]
        - Типичная формулировка «без ограничений»:
            * «Банк вправе в любой момент уступить свои права по настоящему
              Договору полностью или частично любому третьему лицу
              без получения согласия Заёмщика».
        - Типичная формулировка с ограничениями:
            * «Банк вправе уступить свои права по настоящему Договору
              только кредитной организации или организации, имеющей
              лицензию Банка России, с предварительным уведомлением
              Заёмщика не менее чем за 30 дней».
        - Типичная формулировка для потребительских кредитов:
            * «Уступка прав допускается только с письменного согласия
              Заёмщика и только лицам, включённым в государственный реестр
              юридических лиц, осуществляющих деятельность по возврату
              просроченной задолженности (коллекторам)».
        - Типичная формулировка перевода долга:
            * «Перевод долга Заёмщика по настоящему Договору допускается
              только с предварительного письменного согласия Банка»
              (стандарт по ст. 391 ГК).
        - Синдикация:
            * «Банк вправе уступить права по настоящему Договору частично
              в рамках синдикации с другими кредитными организациями».
        - Секьюритизация:
            * «Банк вправе уступить права в составе пула требований
              юридическому лицу — эмитенту облигаций с обеспечением
              залогом» — редко в российской практике, но встречается
              для крупных кредитов.
        - Красные флаги:
            * «любому третьему лицу без согласия и без уведомления» —
              максимально невыгодно для заёмщика;
            * отсутствие ограничений по круге цессионариев для
              потребительского кредита.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — уступка с ограничениями и уведомлением:
        Фрагмент:
        "Банк вправе уступить свои права по настоящему Договору только
         кредитной организации, имеющей лицензию Банка России,
         с предварительным уведомлением Заёмщика не менее чем за 30
         календарных дней до даты уступки. Перевод долга Заёмщика
         допускается только с предварительного письменного согласия Банка."

        Ответ:
        {
          "lender_assignment_right_status": "present",
          "borrower_consent_for_assignment_status": "absent",
          "assignment_scope": "full_or_partial",
          "assignee_restrictions_status": "present",
          "assignment_notification_status": "present",
          "borrower_transfer_right_status": "present",
          "assignment_summary": "Банк вправе уступить права только кредитной организации с лицензией ЦБ, с уведомлением за 30 дней; перевод долга Заёмщика — с согласия Банка",
          "lender_assignment_display": "Право на уступку с ограничениями (только кредитные организации с лицензией ЦБ)",
          "borrower_consent_display": "Согласие Заёмщика не требуется, но требуется уведомление за 30 дней",
          "transfer_restrictions_display": "Цессионарий — только кредитная организация с лицензией Банка России",
          "borrower_transfer_display": "Допускается только с предварительного письменного согласия Банка"
        }

        Пример 2 — свободная уступка (красный флаг):
        Фрагмент:
        "Банк вправе в любой момент уступить свои права по настоящему
         Договору полностью или частично любому третьему лицу без получения
         согласия Заёмщика и без предварительного уведомления."

        Ответ:
        {
          "lender_assignment_right_status": "present",
          "borrower_consent_for_assignment_status": "absent",
          "assignment_scope": "full_or_partial",
          "assignee_restrictions_status": "absent",
          "assignment_notification_status": "absent",
          "borrower_transfer_right_status": "not_defined",
          "assignment_summary": "Банк вправе уступить любому лицу без согласия и без уведомления (красный флаг)",
          "lender_assignment_display": "Неограниченное право на уступку любому третьему лицу",
          "borrower_consent_display": "Согласие Заёмщика не требуется",
          "transfer_restrictions_display": "Ограничения по цессионариям отсутствуют (красный флаг)",
          "borrower_transfer_display": "Не установлено"
        }

        Пример 3 — для потребительского кредита с жёсткими ограничениями:
        Фрагмент:
        "Уступка прав по настоящему Договору допускается только с письменного
         согласия Заёмщика и только лицам, включённым в государственный
         реестр юридических лиц, осуществляющих деятельность по возврату
         просроченной задолженности. О произведённой уступке Заёмщик
         уведомляется в письменной форме."

        Ответ:
        {
          "lender_assignment_right_status": "present",
          "borrower_consent_for_assignment_status": "present",
          "assignment_scope": "full_or_partial",
          "assignee_restrictions_status": "present",
          "assignment_notification_status": "present",
          "borrower_transfer_right_status": "not_defined",
          "assignment_summary": "Уступка только с письменного согласия Заёмщика и только включённым в реестр коллекторам (защита заёмщика по 230-ФЗ)",
          "lender_assignment_display": "Право на уступку ограничено: только с согласия Заёмщика",
          "borrower_consent_display": "Требуется письменное согласие Заёмщика на каждую уступку",
          "transfer_restrictions_display": "Цессионарий — только лицо, включённое в государственный реестр коллекторов (230-ФЗ)",
          "borrower_transfer_display": "Не установлено"
        }

        Пример 4 — ничего не установлено:
        Фрагмент:
        "Иные условия определяются в соответствии с действующим
         законодательством Российской Федерации."

        Ответ:
        {
          "lender_assignment_right_status": "not_defined",
          "borrower_consent_for_assignment_status": "not_defined",
          "assignment_scope": "not_defined",
          "assignee_restrictions_status": "not_defined",
          "assignment_notification_status": "not_defined",
          "borrower_transfer_right_status": "not_defined",
          "assignment_summary": "Не установлено (применяются общие правила ст. 382–391 ГК РФ)",
          "lender_assignment_display": "Не установлено",
          "borrower_consent_display": "Не установлено",
          "transfer_restrictions_display": "Не применимо",
          "borrower_transfer_display": "Не установлено"
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о праве Банка на уступку.
        2. Определи, требуется ли согласие Заёмщика.
        3. Определи охват (полная / частичная / синдикация / секьюритизация).
        4. Найди ограничения по кругу цессионариев.
        5. Найди уведомительный порядок.
        6. Найди упоминание перевода долга Заёмщиком.
        7. Проверь красные флаги: уступка любому лицу без согласия
           и без уведомления; отсутствие ограничений для потребительского
           кредита.
        8. Сформулируй user-facing display-поля кратко и по-русски.
        9. Если прямых цитат нет — верни fallback по правилам 5–7.

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь РОВНО одним JSON-объектом без какого-либо дополнительного
        текста до или после, со всеми 11 ключами:
        {
          "lender_assignment_right_status": "<present / not_defined>",
          "borrower_consent_for_assignment_status": "<present / absent / not_defined>",
          "assignment_scope": "<full_or_partial / syndication / securitization / mixed / not_defined>",
          "assignee_restrictions_status": "<present / absent / not_defined>",
          "assignment_notification_status": "<present / absent / not_defined>",
          "borrower_transfer_right_status": "<present / not_defined>",
          "assignment_summary": "<краткое summary, 'Не установлено', 'Не применимо' или 'Не удалось определить'>",
          "lender_assignment_display": "<текст, 'Не установлено', 'Не применимо' или 'Не удалось определить'>",
          "borrower_consent_display": "<текст, 'Не установлено', 'Не применимо' или 'Не удалось определить'>",
          "transfer_restrictions_display": "<текст, 'Не применимо' или 'Не удалось определить'>",
          "borrower_transfer_display": "<текст, 'Не установлено', 'Не применимо' или 'Не удалось определить'>"
        }
      context_k: 8
      temperature: 0.0
      max_tokens: 1000

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "уступка прав требования цессия перевод долга передача прав третьим лицам assignment transfer согласие заёмщика на уступку синдикация секьюритизация коллекторское агентство ст. 382 ГК ст. 388 ГК ст. 391 ГК"
      preferred_unit_types:
        - general_provision
        - obligation
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - boilerplate
        - obligations
      negative_keywords:
        - "означает"
        - "в целях настоящего"
        - "проценты"
        - "пск"
        - "обеспечение"
        - "неустойка"
        - "ковенант"
      position_bias:
        preferred_range: [0.50, 0.95]
        boost: 0.12
        scope: segment
      context_k: 8
      max_chunks: 10
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
        - "invoice"
      preferred_clause_functions:
        - "boilerplate"
        - "obligations"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 35
      max_snippet_length: 550

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1400

      compact_output: false

      presence_signal:
        field: "assignment_and_transfer_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста кредитного договора сведения
        об уступке прав требования Банком и переводе долга Заёмщиком:
        наличие права на уступку, требование согласия заёмщика, охват,
        ограничения по цессионариям, уведомление, право Заёмщика на перевод
        долга. Не анализируй обеспечение, ковенанты, проценты или неустойку.
        Не оценивай риски. Анализируй только текст договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля (все ключи должны присутствовать в ответе):

        0. assignment_and_transfer_check_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (lender_assignment_right_status,
              borrower_consent_for_assignment_status, assignment_scope,
              assignee_restrictions_status, assignment_notification_status,
              borrower_transfer_right_status) ≠ "not_defined";
           - "missing" — если все шесть содержательных поля = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Важно: borrower_consent_for_assignment_status = "absent",
           assignee_restrictions_status = "absent",
           assignment_notification_status = "absent"
           (прямо исключены) считаются ≠ "not_defined" и дают
           presence = "present".

           Если presence = "missing":
           - все enum-поля = "not_defined";
           - assignment_summary = "Не установлено";
           - lender_assignment_display = "Не установлено";
           - borrower_consent_display = "Не установлено";
           - transfer_restrictions_display = "Не применимо";
           - borrower_transfer_display = "Не установлено";
           - не выполняй остальные шаги.

        1. lender_assignment_right_status — право Банка на уступку:
           - "present" — право прямо упомянуто (с ограничениями или без);
           - "not_defined" — вопрос уступки не урегулирован.

        2. borrower_consent_for_assignment_status — согласие Заёмщика:
           - "present" — требуется согласие Заёмщика на уступку;
           - "absent" — договор прямо указывает, что согласие не требуется;
           - "not_defined" — вопрос согласия не урегулирован.

        3. assignment_scope — охват уступки:
           - "full_or_partial" — полная или частичная уступка любых прав;
           - "syndication" — только в рамках синдикации с другими
             кредитными организациями;
           - "securitization" — в составе пула требований для
             секьюритизации;
           - "mixed" — комбинация;
           - "not_defined" — охват не определён.

        4. assignee_restrictions_status — ограничения по цессионариям:
           - "present" — установлен круг допустимых цессионариев
             (только банки, только с лицензией ЦБ, только включённые
             в реестр коллекторов и т.п.);
           - "absent" — договор прямо указывает, что уступка может быть
             любому лицу без ограничений (красный флаг);
           - "not_defined" — ограничения не упомянуты.

        5. assignment_notification_status — уведомление при уступке:
           - "present" — договор требует уведомления Заёмщика;
           - "absent" — договор прямо исключает уведомление;
           - "not_defined" — вопрос уведомления не урегулирован.

        6. borrower_transfer_right_status — право Заёмщика на перевод долга:
           - "present" — вопрос перевода долга Заёмщика прямо урегулирован
             (обычно требуется согласие Банка);
           - "not_defined" — вопрос перевода долга не упомянут.

        7. assignment_summary — КРАТКОЕ summary для юриста.
           Примеры:
           - "Банк вправе уступить только кредитной организации с лицензией ЦБ, с уведомлением за 30 дней";
           - "Уступка только с письменного согласия Заёмщика (защита по 230-ФЗ)";
           - "Банк вправе уступить любому лицу без согласия и без уведомления (красный флаг)";
           - "Не установлено (общие правила ст. 382–391 ГК РФ)";
           - "Не применимо" / "Не удалось определить".

        8. lender_assignment_display — краткая формулировка права Банка.
           - "Неограниченное право на уступку любому третьему лицу";
           - "Право на уступку с ограничениями (только кредитные
             организации с лицензией ЦБ)";
           - "Право на уступку только с согласия Заёмщика";
           - "Не установлено" / "Не применимо" / "Не удалось определить".

        9. borrower_consent_display — краткая формулировка согласия.
           - "Требуется письменное согласие Заёмщика на каждую уступку";
           - "Согласие Заёмщика не требуется";
           - "Согласие Заёмщика не требуется, но требуется уведомление";
           - "Не установлено" / "Не применимо" / "Не удалось определить".

        10. transfer_restrictions_display — краткая формулировка
            ограничений по цессионариям.
            - "Цессионарий — только кредитная организация с лицензией ЦБ";
            - "Цессионарий — только лицо, включённое в реестр коллекторов (230-ФЗ)";
            - "Ограничения по цессионариям отсутствуют (красный флаг)";
            - "Не применимо" / "Не удалось определить".

        11. borrower_transfer_display — краткая формулировка перевода
            долга Заёмщиком.
            - "Допускается только с предварительного письменного согласия Банка";
            - "Прямо запрещено";
            - "Не установлено" / "Не применимо" / "Не удалось определить".
        </task>

        <context_rules>
        - Перед остальными полями заполни assignment_and_transfer_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все enum-поля = "not_defined", все display-поля = соответствующий fallback.
        - Используй только релевантные фрагменты контекста.
        - Не подставляй нормы закона, обычную практику или предположения вместо текста договора.
        - По общему правилу (ст. 382 ГК) уступка не требует согласия должника,
          если иное не предусмотрено договором. Фиксируй то, что прямо указано
          в тексте, не додумывай «по умолчанию».
        - Различай уступку прав (Банка) и перевод долга (Заёмщика) —
          это разные институты.
        - Красные флаги: уступка любому лицу без согласия и без уведомления;
          отсутствие ограничений по цессионариям для потребительского
          кредита. Отражай в summary.
        - Не выдумывай ограничения, которых нет в тексте.
        - Если в разных фрагментах противоречие: enum → "not_defined", display → "Не удалось определить".
        - Не используй null, None, пустые строки или "-".
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни уступки, ни перевода долга.
           → presence = "missing";
             все enum-поля = "not_defined";
             assignment_summary = "Не установлено";
             все display-поля = "Не установлено" / "Не применимо".

        2. Свободная уступка без ограничений (красный флаг).
           "Банк вправе уступить любому третьему лицу без согласия Заёмщика
           и без уведомления."
           → presence = "present";
             lender_assignment_right_status = "present";
             borrower_consent_for_assignment_status = "absent";
             assignee_restrictions_status = "absent";
             assignment_notification_status = "absent";
             assignment_summary содержит «красный флаг».

        3. Противоречие между фрагментами.
           В одной части — уступка только с согласия Заёмщика, в другой —
           без согласия.
           → presence = "unclear";
             borrower_consent_for_assignment_status = "not_defined";
             borrower_consent_display = "Не удалось определить".

        4. Для потребительского кредита с жёсткими ограничениями (230-ФЗ).
           "Уступка только лицам в реестре коллекторов, с согласия Заёмщика."
           → presence = "present";
             borrower_consent_for_assignment_status = "present";
             assignee_restrictions_status = "present";
             transfer_restrictions_display = "Цессионарий — только лицо, включённое в государственный реестр коллекторов (230-ФЗ)".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для assignment_and_transfer_check_presence используй только: "present", "missing", "unclear".
        - Для lender_assignment_right_status, borrower_transfer_right_status используй только: "present", "not_defined".
        - Для borrower_consent_for_assignment_status, assignee_restrictions_status, assignment_notification_status используй только: "present", "absent", "not_defined".
        - Для assignment_scope используй только: "full_or_partial", "syndication", "securitization", "mixed", "not_defined".
        - Fallback при отсутствии данных:
          * assignment_summary → "Не установлено";
          * lender_assignment_display → "Не установлено";
          * borrower_consent_display → "Не установлено";
          * transfer_restrictions_display → "Не применимо";
          * borrower_transfer_display → "Не установлено".
        - Fallback при противоречии или неоднозначности:
          * все display-поля → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "assignment_and_transfer_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования по уступке и переводу долга. Внутреннее агрегатное signal-поле."
          required: true

        - name: "lender_assignment_right_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["present", "not_defined"]
          display_in_grid: false
          description: "Право Банка на уступку прав требования. Внутреннее enum-поле."
          required: true

        - name: "borrower_consent_for_assignment_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["present", "absent", "not_defined"]
          display_in_grid: false
          description: >
            Требование согласия Заёмщика на уступку. absent — прямо исключено.
            Внутреннее enum-поле.
          required: true

        - name: "assignment_scope"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["full_or_partial", "syndication", "securitization", "mixed", "not_defined"]
          display_in_grid: false
          description: "Охват уступки: full_or_partial / syndication / securitization / mixed. Внутреннее enum-поле."
          required: true

        - name: "assignee_restrictions_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["present", "absent", "not_defined"]
          display_in_grid: false
          description: >
            Ограничения по кругу цессионариев. absent — прямо отсутствуют (красный флаг).
            Внутреннее enum-поле.
          required: true

        - name: "assignment_notification_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["present", "absent", "not_defined"]
          display_in_grid: false
          description: "Уведомительный порядок при уступке. absent — прямо исключено. Внутреннее enum-поле."
          required: true

        - name: "borrower_transfer_right_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["present", "not_defined"]
          display_in_grid: false
          description: "Право Заёмщика на перевод долга. Внутреннее enum-поле."
          required: true

        - name: "assignment_summary"
          type: "string"
          presentation: "fact"
          label: "Уступка и перевод долга"
          display_in_grid: true
          display_priority: 1
          description: >
            Краткое summary правил уступки прав и перевода долга.
            Fallback: "Не установлено" / "Не применимо" / "Не удалось определить".
          required: true

        - name: "lender_assignment_display"
          type: "string"
          presentation: "fact"
          label: "Право Банка на уступку"
          display_in_grid: true
          display_priority: 2
          description: >
            Понятная формулировка права Банка на уступку.
            Fallback: "Не установлено" / "Не применимо" / "Не удалось определить".
          required: true

        - name: "borrower_consent_display"
          type: "string"
          presentation: "fact"
          label: "Согласие Заёмщика на уступку"
          display_in_grid: true
          display_priority: 3
          description: >
            Понятная формулировка требования согласия Заёмщика.
            Fallback: "Не установлено" / "Не применимо" / "Не удалось определить".
          required: true

        - name: "transfer_restrictions_display"
          type: "string"
          presentation: "fact"
          label: "Ограничения по цессионариям"
          display_in_grid: true
          display_priority: 4
          description: >
            Понятная формулировка ограничений по кругу допустимых цессионариев.
            Fallback: "Не применимо" / "Не удалось определить".
          required: true

        - name: "borrower_transfer_display"
          type: "string"
          presentation: "fact"
          label: "Перевод долга Заёмщиком"
          display_in_grid: true
          display_priority: 5
          description: >
            Понятная формулировка права Заёмщика на перевод долга и его условий.
            Fallback: "Не установлено" / "Не применимо" / "Не удалось определить".
          required: true

      store_payload: true

  - id: set_off_and_direct_debit_check
    name: "Зачёт встречных требований и безакцептное списание"
    description: >
      Проверяет право банка на зачёт встречных требований (ст. 410 ГК РФ),
      право на безакцептное списание средств со счетов заёмщика (ст. 854 ГК РФ),
      охват счетов (все счета в Банке / указанные счета / счета в сторонних
      банках), уведомительный порядок и ограничения.
    triggers:
      any:
        - set_off_right
        - direct_debit
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "зачёт встречных требований"
        - "зачет встречных требований"
        - "безакцептное списание"
        - "списание без распоряжения"
        - "право на зачёт"
        - "вправе списать"
        - "заранее данный акцепт"
        - "прямое дебетование"
        - "direct debit"
        - "set-off"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)(зач[её]т|set[\\s-]?off)"
        - "(?i)безакцептн.{0,20}списан"
        - "(?i)списан.{0,30}(без\\s+распоряжен|без\\s+согласи|со\\s+счет)"
        - "(?i)вправе\\s+списать"
        - "(?i)заранее\\s+данн(ый|ого)\\s+акцепт"
        - "(?i)прям(ое|ого)\\s+дебетован"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется кредитный договор.
        Проверяется только один вопрос: право банка на зачёт встречных
        требований и безакцептное списание средств со счетов заёмщика.

        Нормативный ориентир:
        - ст. 410 ГК РФ — прекращение обязательства зачётом
        - ст. 411 ГК РФ — случаи недопустимости зачёта
        - ст. 854 ГК РФ — списание денежных средств со счёта
          (с распоряжения владельца, без распоряжения в случаях,
          предусмотренных законом или договором)
        - Постановление Президиума ВАС РФ от 19.01.2010 № 11923/09 —
          законность безакцептного списания при наличии прямого условия
          в договоре

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора,
          а чего прямо нет.
        - Не оценивай серьёзность риска.
        - Различай два принципиально разных института:
            1) set_off (зачёт) — прекращение встречных однородных
               требований (банк гасит свой долг перед заёмщиком
               за счёт долга заёмщика);
            2) direct_debit (безакцептное списание) — активное списание
               банком средств со счёта заёмщика в счёт просроченного
               кредита (без получения распоряжения заёмщика).
        - Различай охват счетов:
            * all_borrower_accounts — любые счета заёмщика в Банке;
            * specified_accounts — конкретные счета (указан перечень);
            * accounts_in_other_banks — счета в сторонних банках
              (через механизм заранее данного акцепта);
            * not_defined — охват не определён.
        - Различай условия активации:
            * at_default — только при наступлении дефолта / просрочки;
            * automatic — автоматически в дату платежа без проверки
              дефолта;
            * on_demand — по требованию Банка в любой момент.
        - Красные флаги:
            * безакцептное списание со ВСЕХ счетов без уведомления;
            * списание без привязки к просрочке (automatic);
            * право списания со счетов в сторонних банках;
            * отсутствие ограничений (например, минимального остатка).

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Есть ли право Банка на зачёт встречных требований.
        2. Есть ли право Банка на безакцептное списание.
        3. Какие счета охвачены.
        4. При каких условиях активируется право (просрочка / автоматика /
           по требованию).
        5. Есть ли уведомительный порядок.
        6. Есть ли ограничения (минимальный остаток, определённые
           средства, целевое назначение).
        7. Сформулируй понятные для юриста текстовые расшифровки:
           - set_off_summary,
           - direct_debit_display,
           - accounts_scope_display,
           - activation_conditions_display.

        [ПРАВИЛА]
        1. Используй только текст документа. Не подставляй нормы закона.
        2. Если параметр прямо указан — возвращай дословно или делай
           точную выжимку.
        3. `set_off_summary` — КРАТКОЕ summary, например:
           - "Безакцептное списание со всех счетов в Банке при просрочке,
             с уведомлением";
           - "Зачёт + списание со счетов в сторонних банках
             (заранее данный акцепт)";
           - "Автоматическое списание без уведомления (красный флаг)";
           - "Не установлено".
        4. Если параметр прямо не указан:
           - для сигнальных enum-полей — "not_defined";
           - для текстовых user-facing полей — "Не установлено";
           - для массивов — [].
        5. Если тема по существу не применима — display-поле =
           "Не применимо", сигнальное = "not_defined".
        6. Если текст есть, но надёжный вывод сделать нельзя — display-поле =
           "Не удалось определить", сигнальное = "not_defined".
        7. Никогда не используй null, None, пустые строки или "-".
        8. Не выдумывай условия списания, которых нет в тексте.
        9. При конфликтующих фрагментах — приоритет более позднему.
        10. В evidence включай только текст договора.
        11. Верни РОВНО один JSON-объект со всеми ключами из [ФОРМАТ ОТВЕТА] без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [РОССИЙСКАЯ ПРАКТИКА — ПОДСКАЗКИ]
        - Типичная формулировка зачёта:
            * «Банк вправе в любой момент произвести зачёт встречных
              однородных требований с Заёмщиком без получения
              дополнительного согласия Заёмщика».
        - Типичная формулировка безакцептного списания со счетов в Банке:
            * «Заёмщик даёт Банку заранее данный акцепт на списание
              со всех своих счетов, открытых в Банке, денежных сумм
              в размере задолженности по настоящему Договору»;
            * «Банк вправе без распоряжения Заёмщика списывать со счетов
              Заёмщика, открытых в Банке, суммы просроченной задолженности
              и начисленных процентов».
        - Типичная формулировка списания со счетов в сторонних банках:
            * «Заёмщик обязуется включить в договоры банковского счёта
              с иными кредитными организациями условие о заранее данном
              акцепте на списание в пользу Банка».
        - Типичные ограничения:
            * «Списание осуществляется в размере, не превышающем сумму
              просроченной задолженности на дату списания»;
            * «Банк уведомляет Заёмщика о произведённом списании
              не позднее следующего рабочего дня».
        - Красные флаги:
            * списание со всех счетов (включая расчётные для операционной
              деятельности) — парализует бизнес;
            * списание без уведомления — заёмщик узнаёт постфактум;
            * списание в автоматическом режиме без проверки просрочки.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — зачёт + безакцептное списание со счетов в Банке:
        Фрагмент:
        "Заёмщик даёт Банку заранее данный акцепт на списание со всех
         своих счетов, открытых в Банке, денежных сумм в размере
         задолженности по настоящему Договору при наступлении срока
         платежа или просрочки. Банк вправе также произвести зачёт
         встречных однородных требований. О произведённом списании
         Банк уведомляет Заёмщика не позднее следующего рабочего дня."

        Ответ:
        {
          "set_off_right_status": "present",
          "direct_debit_status": "present",
          "accounts_scope": "all_borrower_accounts",
          "activation_conditions": "at_default",
          "notification_status": "present",
          "limitations_status": "not_defined",
          "set_off_summary": "Зачёт + безакцептное списание со всех счетов в Банке при просрочке, с уведомлением",
          "direct_debit_display": "Заранее данный акцепт на списание со всех счетов в Банке",
          "accounts_scope_display": "Все счета Заёмщика в Банке",
          "activation_conditions_display": "При наступлении срока платежа или просрочки; уведомление в следующий рабочий день"
        }

        Пример 2 — списание со счетов в сторонних банках (красный флаг):
        Фрагмент:
        "Заёмщик обязуется включить в договоры банковского счёта
         с иными кредитными организациями условие о заранее данном акцепте
         на безакцептное списание средств в пользу Банка. Банк вправе
         в любой момент произвести такое списание без предварительного
         уведомления Заёмщика."

        Ответ:
        {
          "set_off_right_status": "not_defined",
          "direct_debit_status": "present",
          "accounts_scope": "accounts_in_other_banks",
          "activation_conditions": "on_demand",
          "notification_status": "absent",
          "limitations_status": "not_defined",
          "set_off_summary": "Безакцептное списание со счетов в сторонних банках в любой момент без уведомления (красный флаг)",
          "direct_debit_display": "Заранее данный акцепт для счетов в сторонних банках",
          "accounts_scope_display": "Счета Заёмщика в иных банках",
          "activation_conditions_display": "По требованию Банка в любой момент, без уведомления"
        }

        Пример 3 — только зачёт, без безакцептного списания:
        Фрагмент:
        "Банк вправе произвести зачёт встречных однородных требований
         с Заёмщиком в порядке, установленном законодательством Российской
         Федерации."

        Ответ:
        {
          "set_off_right_status": "present",
          "direct_debit_status": "not_defined",
          "accounts_scope": "not_defined",
          "activation_conditions": "not_defined",
          "notification_status": "not_defined",
          "limitations_status": "not_defined",
          "set_off_summary": "Только зачёт встречных требований по общим правилам ГК РФ, без безакцептного списания",
          "direct_debit_display": "Не установлено",
          "accounts_scope_display": "Не применимо",
          "activation_conditions_display": "По общим правилам ГК РФ"
        }

        Пример 4 — ничего не установлено:
        Фрагмент:
        "Иные условия определяются в соответствии с действующим
         законодательством Российской Федерации."

        Ответ:
        {
          "set_off_right_status": "not_defined",
          "direct_debit_status": "not_defined",
          "accounts_scope": "not_defined",
          "activation_conditions": "not_defined",
          "notification_status": "not_defined",
          "limitations_status": "not_defined",
          "set_off_summary": "Не установлено",
