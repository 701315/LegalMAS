  - id: conditions_precedent_check
    name: "Условия предоставления кредита (conditions precedent)"
    description: >
      Проверяет условия, которые должны быть выполнены до предоставления
      кредита, право банка отказать в предоставлении и повторные заверения
      на дату выборки.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "условия предоставления кредита"
        - "условия предоставления транша"
        - "предварительные условия"
        - "conditions precedent"
        - "до предоставления кредита"
        - "до даты выборки"
        - "право отказать в предоставлении"
        - "повторные заверения"
        - "repeating representations"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)условия\\s+предоставлен"
        - "(?i)conditions?\\s+precedent"
        - "(?i)до\\s+(даты\\s+)?(выборк|предоставлен|подписан)"
        - "(?i)вправе\\s+отказать\\s+в\\s+предоставлен"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется кредитный договор.
        Проверяется только один вопрос: условия предоставления кредита
        (conditions precedent), право банка отказать в предоставлении
        и повторные заверения на дату выборки.

        Нормативный ориентир:
        - ст. 821 ГК РФ — отказ от предоставления кредита при обстоятельствах,
          свидетельствующих о невозврате
        - ст. 819 ГК РФ — кредитный договор

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора,
          а чего прямо нет.
        - Не оценивай серьёзность риска.
        - Conditions precedent — предварительные условия, которые должны
          быть выполнены до предоставления кредита / транша.
        - Право банка отказать в предоставлении — отдельное право, может
          быть обусловлено разными обстоятельствами.
        - Repeating representations — заверения, которые повторяются на дату
          каждой выборки / предоставления транша.
        - Красные флаги:
            * широкое право банка отказать без чётких оснований
              («по усмотрению Банка»);
            * отсутствие conditions precedent в кредитной линии
              (нет защиты интересов банка, но и нет предсказуемости для
              заёмщика);
            * отсутствие повторных заверений перед каждой выборкой.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Есть ли условия предоставления (conditions precedent).
        2. Какие условия должны быть выполнены (документы, регистрация,
           согласия, отсутствие дефолта).
        3. Есть ли право банка отказать в предоставлении.
        4. Есть ли повторные заверения на дату выборки.
        5. Сформулируй понятные для юриста текстовые расшифровки:
           - cp_summary,
           - cp_conditions_display,
           - bank_refusal_right_display.

        [ПРАВИЛА]
        1. Используй только текст документа. Не подставляй нормы закона
           вместо текста договора.
        2. Если параметр прямо указан — возвращай дословно или делай
           точную выжимку.
        3. `cp_documents_required` — массив строк, каждая — документ /
           условие, которое должно быть выполнено до предоставления.
           Если перечня нет — пустой массив [].
        4. `cp_summary` — КРАТКОЕ summary, например:
           - "3 условия: документы, регистрация залога, отсутствие дефолта";
           - "Право Банка отказать по усмотрению (красный флаг)";
           - "Не установлены".
           НЕ дублируй полный перечень.
        5. Если право банка отказать широкое и без чётких оснований —
           отражай как красный флаг в bank_refusal_right_display.
        6. Если параметр прямо не указан:
           - для сигнальных enum-полей — "not_defined";
           - для текстовых user-facing полей — "Не установлено";
           - для массива — [].
        7. Если тема по существу не применима — display-поле =
           "Не применимо", сигнальное = "not_defined".
        8. Если текст есть, но надёжный вывод сделать нельзя — display-поле =
           "Не удалось определить", сигнальное = "not_defined".
        9. Никогда не используй null, None, пустые строки или "-".
        10. Не выдумывай условия, которых нет в тексте.
        11. При конфликтующих фрагментах — приоритет более позднему или
            более специальному положению.
        12. В evidence включай только текст договора.
        13. Верни РОВНО один JSON-объект со всеми ключами из [ФОРМАТ ОТВЕТА] без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [РОССИЙСКАЯ ПРАКТИКА — ПОДСКАЗКИ]
        - Типичные conditions precedent:
            * предоставление корпоративных документов (устав, выписка ЕГРЮЛ,
              решения органов управления);
            * предоставление финансовой отчётности;
            * регистрация залога / ипотеки;
            * заключение договора поручительства;
            * отсутствие событий дефолта на дату выборки;
            * заверения о достоверности информации.
        - Типичная формулировка отказа:
            * «Банк вправе отказать в предоставлении Кредита при наличии
              обстоятельств, свидетельствующих о том, что сумма Кредита
              не будет возвращена» (по ст. 821 ГК РФ);
            * «Банк вправе отказать в предоставлении Транша при нарушении
              Заёмщиком условий настоящего Договора».
        - Повторные заверения: «Заверения, указанные в п. X, считаются
          повторёнными Заёмщиком на каждую дату предоставления Транша».
        - Красный флаг: широкое право отказать «по усмотрению Банка».

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — типовые conditions precedent и повторные заверения:
        Фрагмент:
        "Банк обязан предоставить Кредит при выполнении Заёмщиком следующих
         условий: (а) предоставление копий учредительных документов
         Заёмщика и решения об одобрении крупной сделки; (б) государственная
         регистрация ипотеки; (в) предоставление финансовой отчётности
         за последний отчётный период; (г) отсутствие событий дефолта
         на дату предоставления. Заверения, указанные в разделе 5,
         считаются повторёнными на каждую дату предоставления Кредита."

        Ответ:
        {
          "cp_present_status": "present",
          "cp_documents_required": [
            "учредительные документы Заёмщика",
            "решение об одобрении крупной сделки",
            "государственная регистрация ипотеки",
            "финансовая отчётность за последний отчётный период",
            "отсутствие событий дефолта на дату предоставления"
          ],
          "bank_refusal_right_status": "not_defined",
          "repeating_representations_status": "present",
          "cp_summary": "5 условий: документы, одобрение, регистрация ипотеки, отчётность, отсутствие дефолта",
          "cp_conditions_display": "Документы, одобрение крупной сделки, регистрация ипотеки, отчётность, отсутствие дефолта",
          "bank_refusal_right_display": "Не установлено"
        }

        Пример 2 — широкое право банка отказать (красный флаг):
        Фрагмент:
        "Банк вправе отказать в предоставлении Транша по своему усмотрению
         без указания причин."

        Ответ:
        {
          "cp_present_status": "not_defined",
          "cp_documents_required": [],
          "bank_refusal_right_status": "present",
          "repeating_representations_status": "not_defined",
          "cp_summary": "Условия не установлены",
          "cp_conditions_display": "Не установлено",
          "bank_refusal_right_display": "Право Банка отказать по усмотрению без указания причин (красный флаг)"
        }

        Пример 3 — отсутствие conditions precedent:
        Фрагмент:
        "Предоставление Кредита осуществляется в день подписания
         настоящего Договора."

        Ответ:
        {
          "cp_present_status": "absent",
          "cp_documents_required": [],
          "bank_refusal_right_status": "not_defined",
          "repeating_representations_status": "not_defined",
          "cp_summary": "Условия не установлены (предоставление в день подписания)",
          "cp_conditions_display": "Не применимо",
          "bank_refusal_right_display": "Не установлено"
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату об условиях предоставления.
        2. Составь перечень условий и документов.
        3. Найди право банка отказать. Определи, широкое ли оно.
        4. Найди повторные заверения.
        5. Сформулируй user-facing display-поля кратко и по-русски.
        6. Если прямых цитат нет — верни fallback по правилам 6–8.

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь РОВНО одним JSON-объектом без какого-либо дополнительного текста до или после, со всеми 8 ключами:
        {
          "cp_present_status": "<present / absent / not_defined>",
          "cp_documents_required": ["<условие 1>", "<условие 2>"],
          "bank_refusal_right_status": "<present / not_defined>",
          "repeating_representations_status": "<present / not_defined>",
          "cp_summary": "<краткое summary, 'Не применимо' или 'Не удалось определить'>",
          "cp_conditions_display": "<текст, 'Не установлено', 'Не применимо' или 'Не удалось определить'>",
          "bank_refusal_right_display": "<текст, 'Не установлено', 'Не применимо' или 'Не удалось определить'>"
        }
      context_k: 8
      temperature: 0.0
      max_tokens: 900

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "условия предоставления кредита conditions precedent условия выборки транша предоставление документов регистрация залога право отказать в предоставлении повторные заверения repeating representations"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - procedures
      negative_keywords:
        - "означает"
        - "в целях настоящего"
        - "проценты"
        - "пск"
      position_bias:
        preferred_range: [0.10, 0.45]
        boost: 0.14
        scope: segment
      context_k: 8
      max_chunks: 10
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
        - "invoice"
      preferred_clause_functions:
        - "obligations"
        - "procedures"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 35
      max_snippet_length: 550

    extraction:
      store_payload: true

      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1200
      compact_output: false

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста кредитного договора сведения
        об условиях предоставления кредита (conditions precedent): перечень
        условий и документов, право банка отказать в предоставлении,
        повторные заверения. Не анализируй обеспечение, ковенанты,
        проценты или ПСК. Не оценивай серьёзность риска.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие 7 полей + evidence (всего 8 ключей):

        1. cp_present_status — "present" / "absent" / "not_defined".
           Наличие условий предоставления.
        2. cp_documents_required — массив строк, каждая — условие
           / документ, который должен быть выполнен до предоставления.
           Если перечня нет — пустой массив [].
        3. bank_refusal_right_status — "present" / "not_defined".
           Есть ли право банка отказать в предоставлении.
        4. repeating_representations_status — "present" / "not_defined".
           Есть ли повторные заверения на дату выборки.
        5. cp_summary — КРАТКОЕ summary:
           "5 условий: документы, одобрение, регистрация ипотеки, отчётность,
           отсутствие дефолта", "Право Банка отказать по усмотрению
           (красный флаг)", "Условия не установлены", "Не применимо".
        6. cp_conditions_display — краткая формулировка перечня условий.
        7. bank_refusal_right_display — краткая формулировка права отказа:
           "Право Банка отказать при обстоятельствах, свидетельствующих
           о невозврате", "Право Банка отказать по усмотрению без указания
           причин (красный флаг)", "Не установлено", "Не применимо".
        8. evidence — массив цитат из текста договора.
        </task>

        <rules>
        - Используй только текст договора. Не подставляй нормы закона.
        - Не делай предположений об условиях, которых нет в тексте.
        - Красный флаг: широкое право банка отказать «по усмотрению Банка»
          без чётких оснований. Отражай в bank_refusal_right_display.
        - Если параметр прямо не указан:
            * сигнальное enum-поле → "not_defined";
            * user-facing display-поле → "Не установлено";
            * массив → [].
        - Никогда не используй null, None, пустые строки или "-".
        - При конфликтующих фрагментах — приоритет более позднему.
        - Верни РОВНО один JSON-объект со всеми 8 ключами без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.
        </rules>
      fields:
        - name: "cp_present_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["present", "absent", "not_defined"]
          description: "Наличие условий предоставления."
          required: true
          display_in_grid: false
        - name: "cp_documents_required"
          label: "Документы отлагательных условий (CP)"
          type: "array"
          presentation: "fact"
          description: "Полный перечень условий предоставления (для drawer / payload)."
          required: true
          display_in_grid: false
        - name: "bank_refusal_right_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["present", "not_defined"]
          description: "Есть ли право банка отказать."
          required: true
          display_in_grid: false
        - name: "repeating_representations_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["present", "not_defined"]
          description: "Есть ли повторные заверения."
          required: true
          display_in_grid: false
        - name: "cp_summary"
          type: "string"
          presentation: "fact"
          label: "Условия предоставления"
          description: "Краткое summary условий (полный список — в hidden cp_documents_required)."
          required: true
          display_in_grid: true
          display_priority: 1
        - name: "cp_conditions_display"
          type: "string"
          presentation: "fact"
          label: "Перечень условий"
          description: "Понятная формулировка перечня условий предоставления."
          required: true
          display_in_grid: true
          display_priority: 2
        - name: "bank_refusal_right_display"
          type: "string"
          presentation: "fact"
          label: "Право Банка отказать"
          description: "Понятная формулировка права отказа банка в предоставлении."
          required: true
          display_in_grid: true
          display_priority: 3

  - id: non_financial_covenants_check
    name: "Нефинансовые ковенанты (negative и affirmative)"
    description: >
      Проверяет ограничительные (negative) и обязывающие (affirmative)
      нефинансовые ковенанты: asset sale, M&A, дивиденды, новый долг,
      займы третьим лицам, связанные лица, отчётность, страховка,
      поддержание существования и лицензий.
    triggers:
      any:
        - corporate_borrower
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "не вправе без согласия"
        - "обязуется не"
        - "ограничения на распоряжение активами"
        - "запрет на отчуждение"
        - "запрет на выплату дивидендов"
        - "запрет на привлечение нового долга"
        - "сделки со связанными лицами"
        - "affirmative covenants"
        - "negative covenants"
        - "обязуется предоставлять отчётность"
        - "поддерживать существование"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)(не\\s+вправе|обязуется\\s+не)\\s+.{0,60}(актив|имуществ|дол|дивиденд|слиян|приобрет)"
        - "(?i)сделк.{0,20}связанн"
        - "(?i)(asset\\s+sale|merger|covenant)"
        - "(?i)обязуется\\s+предоставлять\\s+(отчёт|отчет)"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется кредитный договор.
        Проверяется только один вопрос: нефинансовые ковенанты —
        ограничительные (negative) и обязывающие (affirmative).

        Нормативный ориентир:
        - ст. 819, 821 ГК РФ — кредитный договор
        - В российском праве нефинансовые ковенанты — договорный институт

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора,
          а чего прямо нет.
        - Не оценивай серьёзность риска.
        - Negative covenants (ограничительные) — обязательства заёмщика
          не совершать определённые действия:
            * asset sale — не продавать / не отчуждать активы;
            * M&A — не совершать слияния / поглощения / реорганизации;
            * dividend restrictions — не выплачивать дивиденды (полностью
              или сверх лимита);
            * debt incurrence — не привлекать новый долг без согласия банка;
            * loans to third parties — не предоставлять займы третьим лицам;
            * capex limits — ограничения на капитальные вложения;
            * related party transactions — ограничения на сделки
              со связанными лицами;
            * изменение основного вида деятельности.
        - Affirmative covenants (обязывающие) — обязанности заёмщика:
            * предоставление финансовой отчётности банку;
            * поддержание страховки;
            * соблюдение применимого законодательства;
            * поддержание существования (maintain existence);
            * поддержание лицензий и разрешений;
            * уведомление банка о существенных событиях.
        - Красные флаги:
            * широкие запреты без исключений и без разрешённых сделок;
            * отсутствие перечня разрешённых действий;
            * обширные запреты на сделки со связанными лицами без порогов.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Есть ли negative covenants (ограничительные).
        2. Какие именно негативные ковенанты установлены.
        3. Есть ли affirmative covenants (обязывающие).
        4. Какие именно позитивные ковенанты установлены.
        5. Сформулируй понятные для юриста текстовые расшифровки:
           - non_financial_covenants_summary,
           - negative_covenants_display,
           - affirmative_covenants_display.

        [ПРАВИЛА]
        1. Используй только текст документа. Не подставляй нормы закона.
        2. Если параметр прямо указан — возвращай дословно или делай
           точную выжимку.
        3. `negative_covenants_types` и `affirmative_covenants_types` —
           массивы строк, каждая — один ковенант с краткой формулировкой,
           например: ["не отчуждать основные средства без согласия Банка",
           "не выплачивать дивиденды сверх 50% чистой прибыли"].
           Если ковенантов нет — пустой массив [].
        4. `non_financial_covenants_summary` — КРАТКОЕ summary, например:
           - "5 negative + 3 affirmative ковенанта";
           - "Negative: asset sale, M&A, дивиденды (3); affirmative:
             отчётность, страховка (2)";
           - "Не установлены".
           НЕ дублируй полные перечни в summary.
        5. Если параметр прямо не указан:
           - для сигнальных enum-полей — "not_defined";
           - для текстовых user-facing полей — "Не установлено";
           - для массивов — [].
        6. Если тема по существу не применима — display-поле =
           "Не применимо", сигнальное = "not_defined".
        7. Если текст есть, но надёжный вывод сделать нельзя — display-поле =
           "Не удалось определить", сигнальное = "not_defined".
        8. Никогда не используй null, None, пустые строки или "-".
        9. Не выдумывай ковенанты, которых нет в тексте.
        10. При конфликтующих фрагментах — приоритет более позднему или
            более специальному положению.
        11. В evidence включай только текст договора.
        12. Верни РОВНО один JSON-объект со всеми ключами из [ФОРМАТ ОТВЕТА] без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [РОССИЙСКАЯ ПРАКТИКА — ПОДСКАЗКИ]
        - Типичные negative covenants в российских корпоративных кредитах:
            * «Заёмщик обязуется не отчуждать и не обременять основные
              средства без предварительного письменного согласия Банка»;
            * «Заёмщик обязуется не совершать сделки по слиянию
              и присоединению, а также не создавать дочерние общества
              без согласия Банка»;
            * «Заёмщик обязуется не выплачивать дивиденды при нарушении
              финансовых ковенантов»;
            * «Заёмщик обязуется не привлекать новые кредиты и займы
              без согласия Банка»;
            * «Заёмщик обязуется не предоставлять займы третьим лицам»;
            * «Ограничение капитальных вложений — не более X рублей
              в год»;
            * «Сделки со связанными лицами сверх X рублей требуют согласия
              Банка».
        - Типичные affirmative covenants:
            * «Заёмщик обязуется предоставлять Банку квартальную
              и годовую финансовую отчётность в течение X дней»;
            * «Заёмщик обязуется поддерживать страхование имущества»;
            * «Заёмщик обязуется соблюдать применимое законодательство»;
            * «Заёмщик обязуется сохранять свой юридический статус
              и не прекращать деятельность»;
            * «Заёмщик обязуется уведомлять Банк о существенных событиях
              в течение X дней».
        - Красный флаг: широкие запреты без перечня разрешённых сделок
          (permitted actions).

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — типовой набор negative + affirmative:
        Фрагмент:
        "Заёмщик обязуется не совершать без предварительного письменного
         согласия Банка: (а) отчуждение или обременение основных средств
         балансовой стоимостью более 1 000 000 рублей; (б) слияние,
         присоединение, создание дочерних обществ; (в) привлечение новых
         кредитов и займов. Заёмщик обязуется: (г) предоставлять Банку
         квартальную и годовую отчётность в течение 30 дней
         по окончании отчётного периода; (д) поддерживать страхование
         имущества."

        Ответ:
        {
          "negative_covenants_present_status": "present",
          "affirmative_covenants_present_status": "present",
          "negative_covenants_types": [
            "не отчуждать и не обременять основные средства балансовой стоимостью более 1 000 000 рублей",
            "не совершать слияние, присоединение, не создавать дочерние общества",
            "не привлекать новые кредиты и займы"
          ],
          "affirmative_covenants_types": [
            "предоставлять квартальную и годовую отчётность в течение 30 дней",
            "поддерживать страхование имущества"
          ],
          "non_financial_covenants_summary": "3 negative + 2 affirmative ковенанта",
          "negative_covenants_display": "Ограничения: отчуждение основных средств, M&A, новый долг",
          "affirmative_covenants_display": "Обязанности: отчётность, страхование"
        }

        Пример 2 — только affirmative ковенанты:
        Фрагмент:
        "Заёмщик обязуется предоставлять Банку финансовую отчётность
         в течение 15 рабочих дней по окончании каждого квартала
         и уведомлять Банк о существенных событиях в течение 5 рабочих дней."

        Ответ:
        {
          "negative_covenants_present_status": "absent",
          "affirmative_covenants_present_status": "present",
          "negative_covenants_types": [],
          "affirmative_covenants_types": [
            "предоставлять квартальную финансовую отчётность в течение 15 рабочих дней",
            "уведомлять Банк о существенных событиях в течение 5 рабочих дней"
          ],
          "non_financial_covenants_summary": "2 affirmative ковенанта, negative не установлены",
          "negative_covenants_display": "Не установлены",
          "affirmative_covenants_display": "Обязанности: отчётность, уведомления"
        }

        Пример 3 — ковенанты отсутствуют:
        Фрагмент:
        "Иные обязательства Заёмщика Договором не предусмотрены."

        Ответ:
        {
          "negative_covenants_present_status": "absent",
          "affirmative_covenants_present_status": "absent",
          "negative_covenants_types": [],
          "affirmative_covenants_types": [],
          "non_financial_covenants_summary": "Не установлены",
          "negative_covenants_display": "Не установлены",
          "affirmative_covenants_display": "Не установлены"
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямые цитаты об ограничениях (negative).
        2. Найди прямые цитаты об обязанностях (affirmative).
        3. Составь два перечня с краткой формулировкой по каждому.
        4. Проверь красные флаги: широкие запреты без перечня разрешённых
           сделок.
        5. Сформулируй user-facing display-поля кратко и по-русски.
        6. Если прямых цитат нет — верни fallback по правилам 5–7.

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь РОВНО одним JSON-объектом без какого-либо дополнительного текста до или после, со всеми 8 ключами:
        {
          "negative_covenants_present_status": "<present / absent / not_defined>",
          "affirmative_covenants_present_status": "<present / absent / not_defined>",
          "negative_covenants_types": ["<ковенант 1>", "<ковенант 2>"],
          "affirmative_covenants_types": ["<обязанность 1>", "<обязанность 2>"],
          "non_financial_covenants_summary": "<краткое summary, 'Не применимо' или 'Не удалось определить'>",
          "negative_covenants_display": "<текст, 'Не установлены', 'Не применимо' или 'Не удалось определить'>",
          "affirmative_covenants_display": "<текст, 'Не установлены', 'Не применимо' или 'Не удалось определить'>"
        }
      context_k: 8
      temperature: 0.0
      max_tokens: 1000

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "нефинансовые ковенанты negative covenants affirmative covenants ограничения распоряжение активами asset sale слияние M&A дивиденды новый долг займы третьим лицам связанные лица отчётность страхование поддержание существования лицензии уведомление банка"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - covenants
      negative_keywords:
        - "означает"
        - "в целях настоящего"
        - "проценты"
        - "пск"
        - "предмет договора"
      position_bias:
        preferred_range: [0.30, 0.75]
        boost: 0.14
        scope: segment
      context_k: 8
      max_chunks: 10
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
        - "invoice"
      preferred_clause_functions:
        - "obligations"
        - "covenants"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 650

    extraction:
      store_payload: true

      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1400
      compact_output: false

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста кредитного договора сведения
        о нефинансовых ковенантах: ограничительных (negative) и обязывающих
        (affirmative). Не анализируй финансовые ковенанты, негативный залог,
        обеспечение, проценты или ПСК. Не оценивай серьёзность риска.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие 7 полей + evidence (всего 8 ключей):

        1. negative_covenants_present_status — "present" / "absent" /
           "not_defined".
        2. affirmative_covenants_present_status — "present" / "absent" /
           "not_defined".
        3. negative_covenants_types — массив строк, каждая — один
           негативный ковенант с краткой формулировкой. Если нет — [].
        4. affirmative_covenants_types — массив строк, каждая — одна
           обязанность с краткой формулировкой. Если нет — [].
        5. non_financial_covenants_summary — КРАТКОЕ summary:
           "3 negative + 2 affirmative ковенанта",
           "Negative: asset sale, M&A, дивиденды; affirmative: отчётность,
           страховка", "Не установлены", "Не применимо".
        6. negative_covenants_display — краткая формулировка негативных
           ковенантов: "Ограничения: отчуждение основных средств, M&A,
           новый долг", "Не установлены", "Не применимо".
        7. affirmative_covenants_display — краткая формулировка позитивных
           ковенантов: "Обязанности: отчётность, страхование",
           "Не установлены", "Не применимо".
        8. evidence — массив цитат из текста договора.
        </task>

        <rules>
        - Используй только текст договора. Не подставляй нормы закона.
        - Не делай предположений о ковенантах, которых нет в тексте.
        - Различай negative (ограничения) и affirmative (обязанности).
        - Красные флаги: широкие запреты без перечня разрешённых сделок.
          Отражай в display.
        - Если параметр прямо не указан:
            * сигнальное enum-поле → "not_defined";
            * user-facing display-поле → "Не установлены";
            * массив → [].
        - Никогда не используй null, None, пустые строки или "-".
        - При конфликтующих фрагментах — приоритет более позднему.
        - Верни РОВНО один JSON-объект со всеми 8 ключами без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.
        </rules>
      fields:
        - name: "negative_covenants_present_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["present", "absent", "not_defined"]
          description: "Наличие негативных ковенантов."
          required: true
          display_in_grid: false
        - name: "affirmative_covenants_present_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["present", "absent", "not_defined"]
          description: "Наличие позитивных ковенантов."
          required: true
          display_in_grid: false
        - name: "negative_covenants_types"
          label: "Виды негативных ковенантов"
          type: "array"
          presentation: "fact"
          description: "Полный перечень негативных ковенантов (для drawer / payload)."
          required: true
          display_in_grid: false
        - name: "affirmative_covenants_types"
          label: "Виды позитивных ковенантов"
          type: "array"
          presentation: "fact"
          description: "Полный перечень позитивных ковенантов (для drawer / payload)."
          required: true
          display_in_grid: false
        - name: "non_financial_covenants_summary"
          type: "string"
          presentation: "fact"
          label: "Нефинансовые ковенанты"
          description: "Краткое summary нефинансовых ковенантов."
          required: true
          display_in_grid: true
          display_priority: 1
        - name: "negative_covenants_display"
          type: "string"
          presentation: "fact"
          label: "Ограничительные ковенанты"
          description: "Понятная формулировка негативных ковенантов."
          required: true
          display_in_grid: true
          display_priority: 2
        - name: "affirmative_covenants_display"
          type: "string"
          presentation: "fact"
          label: "Обязывающие ковенанты"
          description: "Понятная формулировка позитивных ковенантов."
          required: true
          display_in_grid: true
          display_priority: 3

  - id: currency_and_fx_clause_check
    name: "Валютная оговорка, валютный риск и мультивалютность"
    description: >
      Проверяет валюту предоставления и валюту возврата, распределение
      валютного риска, курсовую оговорку, порядок конвертации и наличие
      мультивалютных траншей.
    triggers:
      any:
        - foreign_currency
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "валюта кредита"
        - "валюта предоставления"
        - "валюта возврата"
        - "валютная оговорка"
        - "валютный риск"
        - "курсовая разница"
        - "курс Центрального банка"
        - "курс на дату"
        - "конвертация"
        - "мультивалютный"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)валют(а|ы|ная)\\s+(кредит|предоставлен|возврат|оговорк)"
        - "(?i)валютн(ый|ого)\\s+риск"
        - "(?i)курс.{0,30}(ЦБ|центрального\\s+банка|на\\s+дату)"
        - "(?i)конвертаци"
        - "(?i)мультивалютн"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется кредитный договор (в том числе валютный).
        Проверяется только один вопрос: валютная оговорка, валютный риск
        и порядок конвертации.

        Нормативный ориентир:
        - ст. 317 ГК РФ — валютные обязательства
        - ФЗ № 173-ФЗ «О валютном регулировании и валютном контроле»
        - ст. 807, 819 ГК РФ — заём и кредит

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора,
          а чего прямо нет.
        - Не оценивай серьёзность риска.
        - Различай:
            * валюта предоставления — в какой валюте выдаётся кредит;
            * валюта возврата — в какой валюте возвращается;
            * валюта платежа процентов.
          Валюты могут не совпадать (мультивалютный кредит).
        - Валютный риск — кто несёт риск изменения курса:
            * borrower — заёмщик;
            * lender — банк;
            * shared — стороны делят риск;
            * not_defined — не установлено.
        - Курсовая оговорка — какой курс применяется и на какую дату:
            * официальный курс ЦБ РФ на дату платежа;
            * курс банка;
            * фиксированный курс;
            * курс на дату выборки / предоставления.
        - Красные флаги:
            * валютный риск полностью на заёмщике без ограничений;
            * отсутствие курсовой оговорки;
            * право банка в одностороннем порядке выбирать курс;
            * отсутствие ограничения на максимальный рост курса.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Валюта предоставления.
        2. Валюта возврата и уплаты процентов.
        3. Кто несёт валютный риск.
        4. Какая применяется курсовая оговорка.
        5. Есть ли порядок конвертации.
        6. Сформулируй понятные для юриста текстовые расшифровки:
           - currency_summary,
           - fx_risk_display,
           - fx_clause_display.

        [ПРАВИЛА]
        1. Используй только текст документа. Не подставляй нормы закона.
        2. Если параметр прямо указан — возвращай дословно или делай
           точную выжимку.
        3. `currency_summary` — КРАТКОЕ summary, например:
           - "Рублёвый, без валютного риска";
           - "USD предоставление и возврат, риск на заёмщике";
           - "EUR предоставление, RUB возврат по курсу ЦБ на дату платежа";
           - "Мультивалютный (USD / EUR / RUB)".
        4. Если параметр прямо не указан:
           - для сигнальных enum-полей — "not_defined";
           - для текстовых user-facing полей — "Не установлено".
        5. Если тема по существу не применима (рублёвый кредит без
           валютных условий) — display-поле = "Не применимо",
           сигнальное = "not_defined".
        6. Если текст есть, но надёжный вывод сделать нельзя — display-поле =
           "Не удалось определить", сигнальное = "not_defined".
        7. Никогда не используй null, None, пустые строки или "-".
        8. Не выдумывай курсовые оговорки и валюты, которых нет в тексте.
        9. При конфликтующих фрагментах — приоритет более позднему или
           более специальному положению.
        10. В evidence включай только текст договора.
        11. Верни РОВНО один JSON-объект со всеми ключами из [ФОРМАТ ОТВЕТА] без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [РОССИЙСКАЯ ПРАКТИКА — ПОДСКАЗКИ]
        - Типичные формулировки валютных кредитов:
            * «Кредит предоставляется в долларах США. Возврат Кредита
              и уплата процентов осуществляются в долларах США» →
              валюты совпадают, риск на заёмщике.
            * «Кредит предоставляется в евро. Возврат Кредита
              осуществляется в рублях по официальному курсу ЦБ РФ
              на дату платежа» → валютная оговорка с конвертацией.
            * «Кредит предоставляется в рублях. Сумма Кредита
              и процентов индексируется в соответствии с изменением курса
              доллара США» → валютная оговорка без валютного кредита.
        - Валютный риск в российских кредитах чаще всего на заёмщике
          (при валютных кредитах) либо на банке (при мультивалютных
          с фиксированным курсом).
        - Красный флаг: отсутствие курсовой оговорки при несовпадении
          валюты предоставления и валюты возврата.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — валютный кредит USD, валюты совпадают:
        Фрагмент:
        "Кредит предоставляется в долларах США. Возврат Кредита
         и уплата процентов осуществляются в долларах США. Валютный риск
         изменения курса несёт Заёмщик."

        Ответ:
        {
          "disbursement_currency": "USD",
          "repayment_currency": "USD",
          "fx_risk_bearer": "borrower",
          "fx_clause_status": "not_defined",
          "conversion_mechanism_status": "not_defined",
          "currency_summary": "Валютный (USD), предоставление и возврат в USD, риск на Заёмщике",
          "fx_risk_display": "Валютный риск на Заёмщике",
          "fx_clause_display": "Курсовая оговорка не установлена"
        }

        Пример 2 — валютная оговорка с конвертацией:
        Фрагмент:
        "Кредит предоставляется в евро. Возврат Кредита и уплата процентов
         осуществляются в рублях по официальному курсу ЦБ РФ на дату
         соответствующего платежа."

        Ответ:
        {
          "disbursement_currency": "EUR",
          "repayment_currency": "RUB",
          "fx_risk_bearer": "borrower",
          "fx_clause_status": "present",
          "conversion_mechanism_status": "present",
          "currency_summary": "EUR предоставление, RUB возврат по курсу ЦБ РФ на дату платежа, риск на Заёмщике",
          "fx_risk_display": "Валютный риск на Заёмщике (несовпадение валют)",
          "fx_clause_display": "Официальный курс ЦБ РФ на дату платежа"
        }

        Пример 3 — рублёвый кредит без валютных условий:
        Фрагмент:
        "Кредит предоставляется и возвращается в рублях Российской
         Федерации."

        Ответ:
        {
          "disbursement_currency": "RUB",
          "repayment_currency": "RUB",
          "fx_risk_bearer": "not_defined",
          "fx_clause_status": "not_defined",
          "conversion_mechanism_status": "not_defined",
          "currency_summary": "Рублёвый, без валютного риска",
          "fx_risk_display": "Не применимо (валюты совпадают)",
          "fx_clause_display": "Не применимо"
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о валюте предоставления и валюте возврата.
        2. Определи, совпадают ли валюты.
        3. Найди прямую цитату о валютном риске.
        4. Найди курсовую оговорку.
        5. Найди порядок конвертации.
        6. Сформулируй user-facing display-поля кратко и по-русски.
        7. Если прямых цитат нет — верни fallback по правилам 4–6.

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь РОВНО одним JSON-объектом без какого-либо дополнительного текста до или после, со всеми 8 ключами:
        {
          "disbursement_currency": "<RUB / USD / EUR / other / not_defined>",
          "repayment_currency": "<RUB / USD / EUR / other / not_defined>",
          "fx_risk_bearer": "<borrower / lender / shared / not_defined>",
          "fx_clause_status": "<present / not_defined>",
          "conversion_mechanism_status": "<present / not_defined>",
          "currency_summary": "<краткое summary, 'Не применимо' или 'Не удалось определить'>",
          "fx_risk_display": "<текст, 'Не установлено', 'Не применимо' или 'Не удалось определить'>",
          "fx_clause_display": "<текст, 'Не установлена', 'Не применимо' или 'Не удалось определить'>"
        }
      context_k: 8
      temperature: 0.0
      max_tokens: 900

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "валюта кредита валюта предоставления валюта возврата валютная оговорка валютный риск курсовая разница курс ЦБ РФ на дату платежа конвертация мультивалютный транш"
      preferred_unit_types:
        - obligation
        - payment_term
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
      negative_keywords:
        - "означает"
        - "в целях настоящего"
        - "пск"
        - "комиссия"
      position_bias:
        preferred_range: [0.05, 0.35]
        boost: 0.16
        scope: segment
      context_k: 8
      max_chunks: 10
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
        - "invoice"
      preferred_clause_functions:
        - "obligations"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 35
      max_snippet_length: 500

    extraction:
      store_payload: true

      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1200
      compact_output: false

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста кредитного договора сведения
        о валюте предоставления и возврата, распределении валютного риска,
        курсовой оговорке и порядке конвертации. Не анализируй проценты,
        ПСК, обеспечение или ковенанты. Не оценивай серьёзность риска.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие 8 полей (все ключи должны присутствовать
        в ответе):

        1. disbursement_currency — "RUB" / "USD" / "EUR" / "other" /
           "not_defined". Валюта предоставления.
        2. repayment_currency — "RUB" / "USD" / "EUR" / "other" /
           "not_defined". Валюта возврата.
        3. fx_risk_bearer — "borrower" / "lender" / "shared" /
           "not_defined". Кто несёт валютный риск.
        4. fx_clause_status — "present" / "not_defined".
           Есть ли курсовая оговорка.
        5. conversion_mechanism_status — "present" / "not_defined".
           Есть ли порядок конвертации.
        6. currency_summary — КРАТКОЕ summary: "Рублёвый, без валютного
           риска", "USD предоставление и возврат, риск на Заёмщике",
           "EUR предоставление, RUB возврат по курсу ЦБ на дату платежа",
           "Не применимо", "Не удалось определить".
        7. fx_risk_display — краткая формулировка валютного риска:
           "Валютный риск на Заёмщике", "Валютный риск на Банке",
           "Валютный риск распределён между сторонами",
           "Не установлено", "Не применимо".
        8. fx_clause_display — краткая формулировка курсовой оговорки:
           "Официальный курс ЦБ РФ на дату платежа",
           "Фиксированный курс X руб. за 1 USD",
           "Не установлена", "Не применимо".
        </task>

        <rules>
        - Используй только текст договора. Не подставляй нормы закона.
        - Не делай предположений о курсах и валютах, которых нет в тексте.
        - Если валюты предоставления и возврата совпадают и обе RUB —
          fx_risk_display = "Не применимо".
        - Красные флаги: валютный риск полностью на заёмщике без
          ограничений; отсутствие курсовой оговорки при несовпадении валют.
          Отражай в display.
        - Если параметр прямо не указан:
            * сигнальное enum-поле → "not_defined";
            * user-facing display-поле → "Не установлено".
        - Никогда не используй null, None, пустые строки или "-".
        - При конфликтующих фрагментах — приоритет более позднему.
        - Верни РОВНО один JSON-объект со всеми 8 ключами без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.
        </rules>
      fields:
        - name: "disbursement_currency"
          type: "string"
          presentation: "signal"
          allowed_values: ["RUB", "USD", "EUR", "other", "not_defined"]
          description: "Валюта предоставления."
          required: true
          display_in_grid: false
        - name: "repayment_currency"
          type: "string"
          presentation: "signal"
          allowed_values: ["RUB", "USD", "EUR", "other", "not_defined"]
          description: "Валюта возврата."
          required: true
          display_in_grid: false
        - name: "fx_risk_bearer"
          type: "string"
          presentation: "signal"
          allowed_values: ["borrower", "lender", "shared", "not_defined"]
          description: "Кто несёт валютный риск."
          required: true
          display_in_grid: false
        - name: "fx_clause_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["present", "not_defined"]
          description: "Наличие курсовой оговорки."
          required: true
          display_in_grid: false
        - name: "conversion_mechanism_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["present", "not_defined"]
          description: "Наличие порядка конвертации."
          required: true
          display_in_grid: false
        - name: "currency_summary"
          type: "string"
          presentation: "fact"
          label: "Валюта и валютный риск"
          description: "Краткое summary валютных условий."
          required: true
          display_in_grid: true
          display_priority: 1
        - name: "fx_risk_display"
          type: "string"
          presentation: "fact"
          label: "Валютный риск"
          description: "Понятная формулировка распределения валютного риска."
          required: true
          display_in_grid: true
          display_priority: 2
        - name: "fx_clause_display"
          type: "string"
          presentation: "fact"
          label: "Курсовая оговорка"
          description: "Понятная формулировка курсовой оговорки."
          required: true
          display_in_grid: true
          display_priority: 3

  - id: tax_gross_up_check
    name: "Налоговая оговорка: gross-up, withholding tax, НДС на комиссии"
    description: >
      Проверяет наличие и параметры налоговой оговорки: gross-up
      (компенсация налога заёмщиком), withholding tax на проценты, НДС
      на комиссии, применение соглашений об избежании двойного
      налогообложения.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "налоговая оговорка"
        - "gross-up"
        - "gross up"
        - "налог у источника"
        - "withholding tax"
        - "налог на проценты"
        - "компенсация налога"
        - "НДС на комиссии"
        - "соглашение об избежании двойного налогообложения"
        - "tax indemnity"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)gross[\\s-]?up"
        - "(?i)налог.{0,20}(у\\s+источника|на\\s+процент)"
        - "(?i)withholding\\s+tax"
        - "(?i)компенсац.{0,20}налог"
        - "(?i)НДС.{0,20}(комисси|сбор|плат)"
        - "(?i)(соглашени|избежани).{0,20}двойн"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется кредитный договор.
        Проверяется только один вопрос: налоговая оговорка — gross-up,
        withholding tax, НДС на комиссии, применение соглашений
        об избежании двойного налогообложения.

        Нормативный ориентир:
        - ст. 309, 310 НК РФ — налог у источника при выплате дохода
          иностранной организации
        - ст. 7 НК РФ — приоритет международных договоров (СИДН)
        - ст. 146, 149 НК РФ — НДС, освобождения
        - Соглашения об избежании двойного налогообложения (СИДН)
          между РФ и юрисдикциями кредитора

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора,
          а чего прямо нет.
        - Не оценивай серьёзность риска.
        - Gross-up — оговорка о том, что если банк получает доход,
          облагаемый налогом у источника, заёмщик компенсирует банку
          сумму налога (или увеличивает платеж так, чтобы банк получил
          сумму «на руки»). Типична для кредитов с иностранным кредитором.
        - Withholding tax — налог, удерживаемый заёмщиком при выплате
          процентов иностранному кредитору (по ст. 310 НК РФ).
        - НДС на комиссии — комиссии банка могут облагаться НДС
          (по общему правилу освобождены по ст. 149 НК РФ для банковских
          операций, но не все комиссии попадают под освобождение).
        - Красные флаги:
            * широкий gross-up без ограничений;
            * отсутствие оговорки о СИДН (при наличии иностранного кредитора);
            * отсутствие указания на НДС на комиссии.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Есть ли оговорка о gross-up.
        2. Есть ли оговорка о withholding tax.
        3. Есть ли указание на НДС на комиссии.
        4. Указано ли применение СИДН.
        5. Сформулируй понятные для юриста текстовые расшифровки:
           - tax_summary,
           - gross_up_display,
           - withholding_tax_display,
           - vat_on_fees_display.

        [ПРАВИЛА]
        1. Используй только текст документа. Не подставляй нормы закона.
        2. Если параметр прямо указан — возвращай дословно или делай
           точную выжимку.
        3. `tax_summary` — КРАТКОЕ summary, например:
           - "Gross-up предусмотрен, withholding tax применяется, СИДН
             не упомянуто";
           - "Tax indemnity с ограничениями, СИДН применяется";
           - "Налоговая оговорка не установлена".
        4. Если параметр прямо не указан:
           - для сигнальных enum-полей — "not_defined";
           - для текстовых user-facing полей — "Не установлено".
        5. Если тема по существу не применима (рублёвый кредит
           от российского банка без иностранного участия) — display-поле =
           "Не применимо", сигнальное = "not_defined".
        6. Если текст есть, но надёжный вывод сделать нельзя — display-поле =
           "Не удалось определить", сигнальное = "not_defined".
        7. Никогда не используй null, None, пустые строки или "-".
        8. Не выдумывай налоговые оговорки, которых нет в тексте.
        9. При конфликтующих фрагментах — приоритет более позднему или
           более специальному положению.
        10. В evidence включай только текст договора.
        11. Верни РОВНО один JSON-объект со всеми ключами из [ФОРМАТ ОТВЕТА] без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [РОССИЙСКАЯ ПРАКТИКА — ПОДСКАЗКИ]
        - Типичная формулировка gross-up:
            * «Все суммы, причитающиеся Кредитору по настоящему Договору,
              выплачиваются без каких-либо удержаний и вычетов. Если
              по применимому законодательству Заёмщик обязан удержать
              налог, сумма платежа увеличивается таким образом, чтобы
              Кредитор получил сумму, равную причитающейся без удержания».
        - Ограниченный gross-up:
            * «Gross-up не применяется, если удержание налога вызвано
              изменением юрисдикции Кредитора или его организационной
              структуры после подписания Договора» (типичная защита
              заёмщика).
        - Withholding tax:
            * «При выплате процентов Кредитору-нерезиденту Заёмщик
              удерживает налог по ставке, установленной НК РФ,
              если иное не предусмотрено применимым СИДН».
        - НДС на комиссии: банковские операции освобождены по ст. 149
          НК РФ, но комиссии за отдельные услуги могут облагаться.
        - СИДН: применяется, если кредитор — резидент страны, с которой
          у РФ есть действующее СИДН.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — gross-up без ограничений, СИДН упомянуто:
        Фрагмент:
        "Все платежи по настоящему Договору осуществляются без каких-либо
         удержаний и вычетов. Если Заёмщик обязан удержать налог
         с платежей в пользу Кредитора, сумма платежа увеличивается
         таким образом, чтобы Кредитор получил сумму, равную причитающейся.
         Если Кредитор является резидентом страны, с которой Российской
         Федерацией заключено соглашение об избежании двойного
         налогообложения, применяется ставка, установленная таким
         соглашением."

        Ответ:
        {
          "gross_up_status": "present",
          "withholding_tax_status": "present",
          "vat_on_fees_status": "not_defined",
          "tax_treaty_status": "present",
          "tax_summary": "Gross-up без ограничений, withholding tax применяется, СИДН применяется",
          "gross_up_display": "Полный gross-up (без ограничений)",
          "withholding_tax_display": "Налог у источника удерживается, СИДН применяется",
          "vat_on_fees_display": "Не установлено"
        }

        Пример 2 — ограниченный gross-up:
        Фрагмент:
        "Если Заёмщик обязан удержать налог с платежей в пользу Кредитора,
         сумма платежа увеличивается. Gross-up не применяется, если
         удержание вызвано изменением юрисдикции Кредитора после подписания
         Договора."

        Ответ:
        {
          "gross_up_status": "present",
          "withholding_tax_status": "present",
          "vat_on_fees_status": "not_defined",
          "tax_treaty_status": "not_defined",
          "tax_summary": "Gross-up с ограничениями (не применяется при изменении юрисдикции Кредитора)",
          "gross_up_display": "Ограниченный gross-up (защита Заёмщика)",
          "withholding_tax_display": "Налог у источника удерживается",
          "vat_on_fees_display": "Не установлено"
        }

        Пример 3 — налоговая оговорка не установлена:
        Фрагмент:
        "Иные условия определяются в соответствии с действующим
         законодательством Российской Федерации."

        Ответ:
        {
          "gross_up_status": "not_defined",
          "withholding_tax_status": "not_defined",
          "vat_on_fees_status": "not_defined",
          "tax_treaty_status": "not_defined",
          "tax_summary": "Налоговая оговорка не установлена",
          "gross_up_display": "Не установлено",
          "withholding_tax_display": "Не установлено",
          "vat_on_fees_display": "Не установлено"
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о gross-up.
        2. Найди оговорку о withholding tax.
        3. Найди указание на НДС на комиссии.
        4. Найди упоминание СИДН.
        5. Сформулируй user-facing display-поля кратко и по-русски.
        6. Если прямых цитат нет — верни fallback по правилам 4–6.

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь РОВНО одним JSON-объектом без какого-либо дополнительного текста до или после, со всеми 8 ключами:
        {
          "gross_up_status": "<present / not_defined>",
          "withholding_tax_status": "<present / not_defined>",
          "vat_on_fees_status": "<present / not_defined>",
          "tax_treaty_status": "<present / not_defined>",
          "tax_summary": "<краткое summary, 'Не применимо' или 'Не удалось определить'>",
          "gross_up_display": "<текст, 'Не установлено', 'Не применимо' или 'Не удалось определить'>",
          "withholding_tax_display": "<текст, 'Не установлено', 'Не применимо' или 'Не удалось определить'>",
          "vat_on_fees_display": "<текст, 'Не установлено', 'Не применимо' или 'Не удалось определить'>"
        }
      context_k: 8
      temperature: 0.0
      max_tokens: 900

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "налоговая оговорка gross-up gross up налог у источника withholding tax налог на проценты компенсация налога НДС на комиссии соглашение об избежании двойного налогообложения СИДН tax indemnity"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - procedures
      negative_keywords:
        - "означает"
        - "в целях настоящего"
        - "пск"
        - "обеспечение"
      position_bias:
        preferred_range: [0.40, 0.80]
        boost: 0.14
        scope: segment
      context_k: 8
      max_chunks: 10
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
        - "invoice"
      preferred_clause_functions:
        - "obligations"
        - "procedures"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 35
      max_snippet_length: 550

    extraction:
      store_payload: true

      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1200
      compact_output: false

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста кредитного договора сведения
        о налоговой оговорке: gross-up, withholding tax, НДС на комиссии,
        применение СИДН. Не анализируй проценты, ПСК, обеспечение или
        ковенанты. Не оценивай серьёзность риска.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие 8 полей (все ключи должны присутствовать
        в ответе):

        1. gross_up_status — "present" / "not_defined".
           Есть ли оговорка о gross-up (компенсация налога заёмщиком).
        2. withholding_tax_status — "present" / "not_defined".
           Есть ли оговорка о withholding tax.
        3. vat_on_fees_status — "present" / "not_defined".
           Есть ли указание на НДС на комиссии.
        4. tax_treaty_status — "present" / "not_defined".
           Есть ли упоминание СИДН (соглашения об избежании двойного
           налогообложения).
        5. tax_summary — КРАТКОЕ summary: "Gross-up без ограничений,
           withholding tax применяется, СИДН применяется",
           "Gross-up с ограничениями", "Налоговая оговорка не установлена",
           "Не применимо", "Не удалось определить".
        6. gross_up_display — краткая формулировка: "Полный gross-up",
           "Ограниченный gross-up", "Не установлено", "Не применимо".
        7. withholding_tax_display — краткая формулировка:
           "Налог у источника удерживается", "СИДН применяется",
           "Не установлено", "Не применимо".
        8. vat_on_fees_display — краткая формулировка: "Комиссии
           облагаются НДС", "Комиссии освобождены от НДС",
           "Не установлено", "Не применимо".
        </task>

        <rules>
        - Используй только текст договора. Не подставляй нормы закона.
        - Не делай предположений о налоговых оговорках, которых нет
          в тексте.
        - Различай полный и ограниченный gross-up.
        - Красные флаги: широкий gross-up без ограничений при наличии
          иностранного кредитора; отсутствие оговорки о СИДН.
          Отражай в display.
        - Если параметр прямо не указан:
            * сигнальное enum-поле → "not_defined";
            * user-facing display-поле → "Не установлено".
        - Если тема по существу неприменима (рублёвый кредит от российского
          банка без иностранного участия) — display-поле = "Не применимо",
          сигнальное = "not_defined".
        - Никогда не используй null, None, пустые строки или "-".
        - При конфликтующих фрагментах — приоритет более позднему.
        - Верни РОВНО один JSON-объект со всеми 8 ключами без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.
        </rules>
      fields:
        - name: "gross_up_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["present", "not_defined"]
          description: "Наличие оговорки о gross-up."
          required: true
          display_in_grid: false
        - name: "withholding_tax_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["present", "not_defined"]
          description: "Наличие оговорки о withholding tax."
          required: true
          display_in_grid: false
        - name: "vat_on_fees_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["present", "not_defined"]
          description: "Наличие указания на НДС на комиссии."
          required: true
          display_in_grid: false
        - name: "tax_treaty_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["present", "not_defined"]
          description: "Упоминание СИДН."
          required: true
          display_in_grid: false
        - name: "tax_summary"
          type: "string"
          presentation: "fact"
          label: "Налоговая оговорка"
          description: "Краткое summary налоговых условий."
          required: true
          display_in_grid: true
          display_priority: 1
        - name: "gross_up_display"
          type: "string"
          presentation: "fact"
          label: "Gross-up"
          description: "Понятная формулировка gross-up."
          required: true
          display_in_grid: true
          display_priority: 2
        - name: "withholding_tax_display"
          type: "string"
          presentation: "fact"
          label: "Withholding tax"
          description: "Понятная формулировка withholding tax."
          required: true
          display_in_grid: true
          display_priority: 3
        - name: "vat_on_fees_display"
          type: "string"
          presentation: "fact"
          label: "НДС на комиссии"
          description: "Понятная формулировка НДС на комиссии."
          required: true
          display_in_grid: true
          display_priority: 4

  - id: default_interest_and_penalties_check
    name: "Неустойка и повышенные проценты при просрочке"
    description: >
      Проверяет размер неустойки за просрочку платежей, базу её расчёта,
      неустойку на просроченные проценты, повышенные проценты при нарушении
      условий, а также ограничения неустойки.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "неустойка"
        - "пени"
        - "штраф"
        - "просроченная задолженность"
        - "повышенные проценты"
        - "повышенная ставка"
        - "пеня за просрочку"
        - "за каждый день просрочки"
        - "за каждый день нарушения"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)(неустойк|пен[ия]|штраф)"
        - "(?i)за\\s+каждый\\s+день\\s+просрочк"
        - "(?i)повышенн(ая|ые|ых)\\s+(ставк|процент)"
        - "(?i)\\d+[.,]?\\d*\\s*%.{0,30}(день|годов)"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется кредитный договор.
        Проверяется только один вопрос: неустойка за просрочку платежей,
        база её расчёта, неустойка на просроченные проценты, повышенные
        проценты при нарушении условий и ограничения неустойки.

        Нормативный ориентир:
        - ст. 330, 331, 333 ГК РФ — неустойка, её уменьшение
        - ст. 395 ГК РФ — проценты за пользование чужими денежными
          средствами
        - ст. 6.1 ФЗ № 353-ФЗ — ограничения неустойки для потребительских
          кредитов (20% годовых при начислении процентов, 0,1% в день,
          если проценты не начисляются)

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора,
          а чего прямо нет.
        - Не оценивай серьёзность риска.
        - Различай:
            * неустойка за просрочку платежа (пени по ставке за день);
            * повышенные проценты (ставка увеличивается на N п.п.
              при нарушении);
            * неустойка на просроченные проценты (сложные пени).
        - Различай базу начисления неустойки:
            * на просроченную сумму основного долга;
            * на просроченные проценты;
            * на всю просроченную задолженность (тело + проценты).
        - Красные флаги:
            * неустойка на просроченные проценты (сложные пени);
            * очень высокая ставка неустойки (выше 0,5% в день);
            * отсутствие ограничений неустойки в потребительском кредите.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Установлена ли неустойка за просрочку платежа.
        2. Размер неустойки (ставка в день / % годовых).
        3. База начисления неустойки.
        4. Начисляется ли неустойка на просроченные проценты.
        5. Установлены ли повышенные проценты при нарушении.
        6. Есть ли ограничения неустойки (максимальный размер).
        7. Сформулируй понятные для юриста текстовые расшифровки:
           - penalty_summary,
           - penalty_rate_display,
           - penalty_basis_display,
           - increased_rate_display.

        [ПРАВИЛА]
        1. Используй только текст документа. Не подставляй нормы закона.
        2. Если параметр прямо указан — возвращай дословно или делай
           точную выжимку.
        3. `penalty_summary` — КРАТКОЕ summary, например:
           - «0,1% в день на просроченную задолженность»;
           - «0,2% в день на основной долг, 0,1% на проценты
             (сложные пени)»;
           - «Повышенные проценты +3 п.п. при нарушении ковенант»;
           - «Не установлена».
        4. Если параметр прямо не указан:
           - для сигнальных enum-полей — "not_defined";
           - для текстовых user-facing полей — "Не установлен" /
             "Не установлено" по роду.
        5. Если тема по существу не применима — display-поле =
           "Не применимо", сигнальное = "not_defined".
        6. Если текст есть, но надёжный вывод сделать нельзя — display-поле =
           "Не удалось определить", сигнальное = "not_defined".
        7. Никогда не используй null, None, пустые строки или "-".
        8. Не выдумывай ставки неустойки, которых нет в тексте.
        9. При конфликтующих фрагментах — приоритет более позднему
           или более специальному положению.
        10. В evidence включай только текст договора.
        11. Верни РОВНО один JSON-объект со всеми 9 ключами без какого-либо
            дополнительного текста до или после. Начни ответ сразу
            с открывающей фигурной скобки и закончи закрывающей. НЕ пиши
            Markdown, списки, код-фенсы. Ответ должен быть валидным JSON,
            пригодным для парсинга через json.loads без предварительной
            обработки.

        [РОССИЙСКАЯ ПРАКТИКА — ПОДСКАЗКИ]
        - Типичные формулировки неустойки:
            * «За нарушение сроков уплаты платежей Заёмщик уплачивает Банку
              неустойку в размере 0,1% от суммы просроченной задолженности
              за каждый день просрочки» → 0,1% в день на всю просроченную
              задолженность;
            * «Неустойка начисляется на сумму просроченного основного
              долга по ставке 0,2% в день и на сумму просроченных
              процентов по ставке 0,1% в день» → сложные пени;
            * «При нарушении Заёмщиком ковенант процентная ставка
              увеличивается на 2 процентных пункта» → margin increase
              (повышенные проценты).
        - Типичные ограничения неустойки:
            * «Общий размер неустойки не может превышать 10% от суммы
              просроченной задолженности» → penalty cap.
        - Для потребительских кредитов по 353-ФЗ (ст. 6.1):
            * 20% годовых, если проценты продолжают начисляться;
            * 0,1% в день, если проценты не начисляются.
        - Ст. 333 ГК РФ: суд может снизить неустойку при явной
          несоразмерности. Наличие в договоре высокой неустойки не значит
          её безусловное взыскание, но фиксируется как факт.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — простая неустойка 0,1% в день:
        Фрагмент:
        "За нарушение сроков уплаты платежей по настоящему Договору Заёмщик
         уплачивает Кредитору неустойку в размере 0,1% от суммы просроченной
         задолженности за каждый день просрочки. Неустойка начисляется
         на сумму просроченного основного долга и на сумму просроченных
         процентов."

        Ответ:
        {
          "penalty_present_status": "present",
          "penalty_basis": "full_overdue",
          "penalty_on_overdue_interest_status": "present",
          "increased_rate_penalty_status": "not_defined",
          "penalty_cap_status": "not_defined",
          "penalty_summary": "0,1% в день на всю просроченную задолженность (тело + проценты)",
          "penalty_rate_display": "0,1% в день",
          "penalty_basis_display": "На всю просроченную задолженность (основной долг + проценты)",
          "increased_rate_display": "Не установлены"
        }

        Пример 2 — неустойка только на основной долг:
        Фрагмент:
        "При нарушении срока возврата основного долга Заёмщик уплачивает
         неустойку в размере 0,2% от суммы просроченного основного долга
         за каждый день просрочки. На просроченные проценты неустойка
         не начисляется."

        Ответ:
        {
          "penalty_present_status": "present",
          "penalty_basis": "principal_only",
          "penalty_on_overdue_interest_status": "absent",
          "increased_rate_penalty_status": "not_defined",
          "penalty_cap_status": "not_defined",
          "penalty_summary": "0,2% в день только на просроченный основной долг",
          "penalty_rate_display": "0,2% в день",
          "penalty_basis_display": "Только на просроченный основной долг",
          "increased_rate_display": "Не установлены"
        }

        Пример 3 — повышенные проценты + ограничение неустойки:
        Фрагмент:
        "При нарушении Заёмщиком любого из финансовых ковенантов процентная
         ставка по Кредиту увеличивается на 2 (два) процентных пункта
         до устранения нарушения. За нарушение срока возврата Кредита
         начисляется неустойка 0,1% в день, общий размер которой
         не может превышать 10% от суммы просроченной задолженности."

        Ответ:
        {
          "penalty_present_status": "present",
          "penalty_basis": "full_overdue",
          "penalty_on_overdue_interest_status": "not_defined",
          "increased_rate_penalty_status": "present",
          "penalty_cap_status": "present",
          "penalty_summary": "0,1% в день на просрочку, cap 10%; повышенные проценты +2 п.п. при нарушении ковенант",
          "penalty_rate_display": "0,1% в день (не более 10% от просроченной суммы)",
          "penalty_basis_display": "На всю просроченную задолженность",
          "increased_rate_display": "Повышение ставки на 2 п.п. при нарушении финансовых ковенантов"
        }

        Пример 4 — неустойка не установлена:
        Фрагмент:
        "Иные условия ответственности Сторон определяются в соответствии
         с действующим законодательством Российской Федерации."

        Ответ:
        {
          "penalty_present_status": "not_defined",
          "penalty_basis": "not_defined",
          "penalty_on_overdue_interest_status": "not_defined",
          "increased_rate_penalty_status": "not_defined",
          "penalty_cap_status": "not_defined",
          "penalty_summary": "Не установлена",
          "penalty_rate_display": "Не установлен",
          "penalty_basis_display": "Не установлена",
          "increased_rate_display": "Не установлены"
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о неустойке за просрочку платежа.
        2. Определи базу начисления неустойки (основной долг / проценты /
           вся задолженность).
        3. Проверь, начисляется ли неустойка на просроченные проценты
           (сложные пени).
        4. Найди упоминание повышенных процентов при нарушении.
        5. Найди ограничение неустойки (cap), если оно есть.
        6. Сформулируй user-facing display-поля кратко и по-русски.
        7. Если прямых цитат нет — верни fallback по правилам 4–6.

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь РОВНО одним JSON-объектом без какого-либо дополнительного
        текста до или после, со всеми 9 ключами:
        {
          "penalty_present_status": "<present / not_defined>",
          "penalty_basis": "<principal_only / interest_only / full_overdue / not_defined>",
          "penalty_on_overdue_interest_status": "<present / absent / not_defined>",
          "increased_rate_penalty_status": "<present / not_defined>",
          "penalty_cap_status": "<present / not_defined>",
          "penalty_summary": "<краткое summary, 'Не установлена', 'Не применимо' или 'Не удалось определить'>",
          "penalty_rate_display": "<текст, 'Не установлен', 'Не применимо' или 'Не удалось определить'>",
          "penalty_basis_display": "<текст, 'Не установлена', 'Не применимо' или 'Не удалось определить'>",
          "increased_rate_display": "<текст, 'Не установлены', 'Не применимо' или 'Не удалось определить'>"
        }
      context_k: 8
      temperature: 0.0
      max_tokens: 900

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "неустойка пени штраф просроченная задолженность просроченный основной долг просроченные проценты за каждый день просрочки повышенные проценты повышенная ставка при нарушении ограничение неустойки максимальный размер неустойки"
      preferred_unit_types:
        - obligation
        - liability_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - remedies
      negative_keywords:
        - "означает"
        - "в целях настоящего"
        - "предмет договора"
        - "обеспечение"
        - "ковенант"
      position_bias:
        preferred_range: [0.40, 0.85]
        boost: 0.14
        scope: segment
      context_k: 8
      max_chunks: 10
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
        - "invoice"
      preferred_clause_functions:
        - "obligations"
        - "remedies"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 35
      max_snippet_length: 550

    extraction:
      store_payload: true

      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1300
      compact_output: false

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста кредитного договора сведения
        о неустойке за просрочку платежей: наличие и размер, базу начисления,
        начисление на просроченные проценты (сложные пени), повышенные
        проценты при нарушении, ограничения неустойки. Не анализируй
        обеспечение, ковенанты, проценты как таковые или ПСК. Не оценивай
        серьёзность риска.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие 9 полей (все ключи должны присутствовать
        в ответе):

        1. penalty_present_status — "present" / "not_defined".
        2. penalty_basis — "principal_only" / "interest_only" /
           "full_overdue" / "not_defined".
           "principal_only" — только на просроченный основной долг;
           "interest_only" — только на просроченные проценты;
           "full_overdue" — на всю просроченную задолженность.
        3. penalty_on_overdue_interest_status — "present" / "absent" /
           "not_defined".
           Начисляется ли неустойка на просроченные проценты (сложные пени).
        4. increased_rate_penalty_status — "present" / "not_defined".
           Есть ли повышенные проценты при нарушении (margin increase).
        5. penalty_cap_status — "present" / "not_defined".
           Есть ли ограничение общего размера неустойки.
        6. penalty_summary — КРАТКОЕ summary: "0,1% в день на всю
           просроченную задолженность", "0,2% в день только на основной
           долг", "Не установлена", "Не применимо".
        7. penalty_rate_display — краткая формулировка ставки неустойки:
           "0,1% в день", "0,2% в день (не более 10% от просроченной суммы)",
           "Не установлен", "Не применимо".
        8. penalty_basis_display — краткая формулировка базы: "На всю
           просроченную задолженность (основной долг + проценты)",
           "Только на просроченный основной долг", "Не установлена",
           "Не применимо".
        9. increased_rate_display — краткая формулировка повышенных
           процентов: "Повышение ставки на 2 п.п. при нарушении финансовых
           ковенантов", "Не установлены", "Не применимо".
        </task>

        <rules>
        - Используй только текст договора. Не подставляй нормы закона.
        - Не делай предположений о ставках неустойки, которых нет в тексте.
        - Различай базу неустойки: principal_only / interest_only /
          full_overdue.
        - Красные флаги: неустойка на просроченные проценты (сложные
          пени); очень высокая ставка (выше 0,5% в день); отсутствие
          ограничения в потребительском кредите. Отражай в summary.
        - Если параметр прямо не указан:
            * сигнальное enum-поле → "not_defined";
            * user-facing display-поле → "Не установлен" / "Не установлена".
        - Если тема по существу неприменима — display-поле = "Не применимо",
          сигнальное = "not_defined".
        - Если текст есть, но надёжный вывод сделать нельзя — display-поле =
          "Не удалось определить", сигнальное = "not_defined".
        - Никогда не используй null, None, пустые строки или "-".
        - При конфликтующих фрагментах — приоритет более позднему.
        - Верни РОВНО один JSON-объект со всеми 9 ключами без какого-либо
          дополнительного текста до или после. Начни ответ сразу
          с открывающей фигурной скобки и закончи закрывающей. НЕ пиши
          Markdown, списки, код-фенсы. Ответ должен быть валидным JSON,
          пригодным для парсинга через json.loads без предварительной
          обработки.
        </rules>
      fields:
        - name: "penalty_present_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["present", "not_defined"]
          description: "Наличие неустойки за просрочку."
          required: true
          display_in_grid: false
        - name: "penalty_basis"
          type: "string"
          presentation: "signal"
          allowed_values: ["principal_only", "interest_only", "full_overdue", "not_defined"]
          description: "База начисления неустойки."
          required: true
          display_in_grid: false
        - name: "penalty_on_overdue_interest_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["present", "absent", "not_defined"]
          description: "Начисляется ли неустойка на просроченные проценты."
          required: true
          display_in_grid: false
        - name: "increased_rate_penalty_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["present", "not_defined"]
          description: "Повышенные проценты при нарушении."
          required: true
          display_in_grid: false
        - name: "penalty_cap_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["present", "not_defined"]
          description: "Ограничение размера неустойки."
          required: true
          display_in_grid: false
        - name: "penalty_summary"
          type: "string"
          presentation: "fact"
          label: "Неустойка за просрочку"
          description: "Краткое summary неустойки."
          required: true
          display_in_grid: true
          display_priority: 1
        - name: "penalty_rate_display"
          type: "string"
          presentation: "fact"
          label: "Размер неустойки"
          description: "Ставка неустойки."
          required: true
          display_in_grid: true
          display_priority: 2
        - name: "penalty_basis_display"
          type: "string"
          presentation: "fact"
          label: "База начисления неустойки"
          description: "База начисления неустойки."
          required: true
          display_in_grid: true
          display_priority: 3
        - name: "increased_rate_display"
          type: "string"
          presentation: "fact"
          label: "Повышенные проценты"
          description: "Повышенные проценты при нарушении."
          required: true
          display_in_grid: true
          display_priority: 4

  - id: tranche_and_drawdown_mechanics_check
    name: "Механика траншей, выборки и лимитов"
    description: >
      Проверяет порядок запроса транша, сроки рассмотрения банком, лимиты
      выдачи и задолженности, период доступности кредитной линии, условия
      аннулирования неиспользованного лимита и commitment fee.
    triggers:
      any:
        - credit_line
        - overdraft
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "транш"
        - "выборка"
        - "кредитная линия"
        - "лимит выдачи"
        - "лимит задолженности"
        - "период доступности"
        - "срок предоставления транша"
        - "запрос на предоставление"
        - "commitment fee"
        - "плата за неиспользованный лимит"
        - "аннулирование лимита"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)транш"
        - "(?i)выборк"
        - "(?i)(лимит\\s+(выдачи|задолженност))"
        - "(?i)период\\s+доступност"
        - "(?i)(commitment\\s+fee|плата\\s+за\\s+неиспользован)"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется кредитный договор (кредитная линия / овердрафт).
        Проверяется только один вопрос: механика траншей, выборки
        и лимитов.

        Нормативный ориентир:
        - ст. 819 ГК РФ — кредитный договор
        - ст. 821 ГК РФ — отказ от предоставления кредита
        - В российском праве механика кредитных линий — договорный институт

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора,
          а чего прямо нет.
        - Не оценивай серьёзность риска.
        - Различай:
            * лимит выдачи — максимальная сумма, которая может быть выдана
              за весь срок;
            * лимит задолженности — максимальная сумма единовременной
              задолженности;
            * лимит единовременной выдачи — максимальный размер одного
              транша.
        - Различай:
            * период доступности — до какой даты можно выбирать транши;
            * дата погашения — конечная дата возврата.
        - Commitment fee (плата за неиспользованный лимит) — типичный
          элемент для кредитных линий. Если не установлена — фиксируй.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Есть ли механика траншей и выборки.
        2. Как оформляется запрос на транш (форма, срок уведомления).
        3. Какие установлены лимиты (выдачи / задолженности /
           единовременной выдачи).
        4. Какой установлен период доступности.
        5. Есть ли commitment fee.
        6. Есть ли условия аннулирования неиспользованного лимита.
        7. Сформулируй понятные для юриста текстовые расшифровки:
           - tranche_summary,
           - limits_display,
           - availability_period_display,
           - drawdown_mechanics_display,
           - commitment_fee_display.

        [ПРАВИЛА]
        1. Используй только текст документа. Не подставляй нормы закона.
        2. Если параметр прямо указан — возвращай дословно или делай
           точную выжимку.
        3. `tranche_summary` — КРАТКОЕ summary, например:
           - «Лимит задолженности 100 млн руб., период доступности
             до 31.12.2025, commitment fee 0,5%»;
           - «Кредитная линия без commitment fee, лимит выдачи 80 млн руб.»;
           - «Овердрафт с лимитом 5 млн руб., без траншевой механики».
        4. Если параметр прямо не указан:
           - для сигнальных enum-полей — "not_defined";
           - для текстовых user-facing полей — "Не установлен" /
             "Не установлено" по роду.
        5. Если тема по существу не применима (не кредитная линия) —
           display-поле = "Не применимо", сигнальное = "not_defined".
        6. Если текст есть, но надёжный вывод сделать нельзя — display-поле =
           "Не удалось определить", сигнальное = "not_defined".
        7. Никогда не используй null, None, пустые строки или "-".
        8. Не выдумывай лимиты и сроки, которых нет в тексте.
        9. При конфликтующих фрагментах — приоритет более позднему.
        10. В evidence включай только текст договора.
        11. Верни РОВНО один JSON-объект со всеми 11 ключами без какого-либо
            дополнительного текста до или после. Начни ответ сразу
            с открывающей фигурной скобки и закончи закрывающей. НЕ пиши
            Markdown, списки, код-фенсы. Ответ должен быть валидным JSON,
            пригодным для парсинга через json.loads без предварительной
            обработки.

        [РОССИЙСКАЯ ПРАКТИКА — ПОДСКАЗКИ]
        - Типичная формулировка запроса:
            * «Транш предоставляется на основании письменного запроса
              Заёмщика, направленного Банку не позднее чем за 5 рабочих
              дней до предполагаемой даты выдачи»;
            * «Запрос на предоставление транша направляется по форме
              Приложения №2».
        - Типичные лимиты:
            * «Лимит выдачи — 100 000 000 рублей»;
            * «Лимит задолженности — 80 000 000 рублей»;
            * «Лимит единовременной выдачи — 20 000 000 рублей».
        - Типичный период доступности:
            * «Период доступности — с даты подписания Договора
              по 31.12.2025 включительно»;
            * «Дата окончания периода доступности — 30.06.2026».
        - Типичная формулировка commitment fee:
            * «За неиспользованный лимит взимается плата в размере
              0,5% годовых от суммы неиспользованного лимита»;
            * «Плата за неиспользованный лимит не взимается».
        - Аннулирование неиспользованного лимита:
            * «Неиспользованный лимит аннулируется по окончании периода
              доступности»;
            * «Банк вправе аннулировать неиспользованный лимит
              при наступлении события дефолта».

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — кредитная линия с лимитом, периодом и commitment fee:
        Фрагмент:
        "Банк открывает Заёмщику возобновляемую кредитную линию с лимитом
         задолженности 100 000 000 рублей. Период доступности — с даты
         подписания Договора по 31.12.2025 включительно. Транш
         предоставляется на основании письменного запроса Заёмщика,
         направленного Банку не позднее чем за 5 рабочих дней
         до предполагаемой даты выдачи. За неиспользованный лимит
         взимается плата в размере 0,5% годовых."

        Ответ:
        {
          "tranche_mechanics_status": "present",
          "drawdown_request_status": "present",
          "limit_type": "outstanding_limit",
          "availability_period_status": "present",
          "commitment_fee_status": "present",
          "limit_annulment_status": "not_defined",
          "tranche_summary": "Возобновляемая кредитная линия, лимит задолженности 100 млн руб., период доступности до 31.12.2025, commitment fee 0,5%",
          "limits_display": "Лимит задолженности — 100 000 000 рублей",
          "availability_period_display": "С даты подписания Договора по 31.12.2025 включительно",
          "drawdown_mechanics_display": "Письменный запрос за 5 рабочих дней до даты выдачи",
          "commitment_fee_display": "0,5% годовых от неиспользованного лимита"
        }

        Пример 2 — лимит выдачи и лимит единовременной выдачи:
        Фрагмент:
        "Кредит предоставляется отдельными траншами. Лимит выдачи —
         80 000 000 рублей. Лимит единовременной выдачи —
         15 000 000 рублей. Транш предоставляется на основании заявки
         Заёмщика. За неиспользованный лимит плата не взимается."

        Ответ:
        {
          "tranche_mechanics_status": "present",
          "drawdown_request_status": "present",
          "limit_type": "disbursement_limit",
          "availability_period_status": "not_defined",
          "commitment_fee_status": "absent",
          "limit_annulment_status": "not_defined",
          "tranche_summary": "Лимит выдачи 80 млн руб., лимит одного транша 15 млн руб., без commitment fee",
          "limits_display": "Лимит выдачи 80 000 000 руб., лимит единовременной выдачи 15 000 000 руб.",
          "availability_period_display": "Не установлен",
          "drawdown_mechanics_display": "На основании заявки Заёмщика",
          "commitment_fee_display": "Не взимается"
        }

        Пример 3 — овердрафт без траншевой механики:
        Фрагмент:
        "Банк предоставляет Заёмщику овердрафт к расчётному счёту с лимитом
         5 000 000 рублей. Овердрафт предоставляется отдельными траншами
         по мере поступления платёжных документов. Плата за неиспользованный
         лимит не взимается."

        Ответ:
        {
          "tranche_mechanics_status": "present",
          "drawdown_request_status": "absent",
          "limit_type": "outstanding_limit",
          "availability_period_status": "not_defined",
          "commitment_fee_status": "absent",
          "limit_annulment_status": "not_defined",
          "tranche_summary": "Овердрафт, лимит 5 млн руб., автоматическая выборка, без commitment fee",
          "limits_display": "Лимит овердрафта — 5 000 000 рублей",
          "availability_period_display": "Не установлен",
          "drawdown_mechanics_display": "Автоматически по мере поступления платёжных документов",
          "commitment_fee_display": "Не взимается"
