             limit_type = "outstanding_limit";
             drawdown_mechanics_display = "Автоматически по мере поступления платёжных документов".

        3. Противоречие между фрагментами.
           В одной части — лимит 100 млн, в другой — 80 млн.
           → presence = "unclear";
             limit_type = "not_defined";
             limits_display = "Не удалось определить".

        4. Кредитная линия без commitment fee.
           "Плата за неиспользованный лимит не взимается."
           → presence = "present";
             commitment_fee_status = "absent";
             commitment_fee_display = "Не взимается".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для tranche_and_drawdown_mechanics_check_presence используй только: "present", "missing", "unclear".
        - Для tranche_mechanics_status, availability_period_status, limit_annulment_status используй только: "present", "not_defined".
        - Для drawdown_request_status, commitment_fee_status используй только: "present", "absent", "not_defined".
        - Для limit_type используй только: "disbursement_limit", "outstanding_limit", "per_tranche_limit", "mixed", "not_defined".
        - Fallback при отсутствии данных:
          * tranche_summary → "Не установлено";
          * limits_display → "Не применимо";
          * availability_period_display → "Не применимо";
          * drawdown_mechanics_display → "Не применимо";
          * commitment_fee_display → "Не применимо".
        - Fallback при противоречии или неоднозначности:
          * все display-поля → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
