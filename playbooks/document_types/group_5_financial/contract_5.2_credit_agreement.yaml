      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста кредитного договора сведения
        о механике траншей и выборки: наличие механики, порядок оформления
        запроса, лимиты, период доступности, commitment fee, условия
        аннулирования неиспользованного лимита. Не анализируй обеспечение,
        ковенанты, проценты, ПСК или неустойку. Не оценивай серьёзность
        риска.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие 11 полей (все ключи должны присутствовать
        в ответе):

        1. tranche_mechanics_status — "present" / "not_defined".
        2. drawdown_request_status — "present" / "absent" / "not_defined".
           Есть ли требование оформлять запрос на транш.
        3. limit_type — "disbursement_limit" / "outstanding_limit" /
           "per_tranche_limit" / "mixed" / "not_defined".
           "disbursement_limit" — лимит выдачи;
           "outstanding_limit" — лимит задолженности;
           "per_tranche_limit" — лимит единовременной выдачи;
           "mixed" — комбинация.
        4. availability_period_status — "present" / "not_defined".
        5. commitment_fee_status — "present" / "absent" / "not_defined".
           Взимается ли плата за неиспользованный лимит.
        6. limit_annulment_status — "present" / "not_defined".
           Установлены ли условия аннулирования неиспользованного лимита.
        7. tranche_summary — КРАТКОЕ summary.
        8. limits_display — краткая формулировка лимитов.
        9. availability_period_display — краткая формулировка периода
           доступности.
        10. drawdown_mechanics_display — краткая формулировка механики
            запроса.
        11. commitment_fee_display — краткая формулировка commitment fee.
        </task>

        <rules>
        - Используй только текст договора. Не подставляй нормы закона.
        - Не делай предположений о лимитах и сроках, которых нет в тексте.
        - Различай типы лимитов: disbursement / outstanding /
          per_tranche / mixed.
        - Для овердрафтов с автоматической выборкой drawdown_request_status
          может быть "absent".
        - Если commitment fee прямо не упомянута, но и не исключена —
          ставь "not_defined". Если прямо сказано «не взимается» — "absent".
        - Если параметр прямо не указан:
            * сигнальное enum-поле → "not_defined";
            * user-facing display-поле → "Не установлен" / "Не установлена".
        - Если тема по существу неприменима — display-поле = "Не применимо",
          сигнальное = "not_defined".
        - Никогда не используй null, None, пустые строки или "-".
        - При конфликтующих фрагментах — приоритет более позднему.
        - Верни РОВНО один JSON-объект со всеми 11 ключами без какого-либо
          дополнительного текста до или после. Начни ответ сразу
          с открывающей фигурной скобки и закончи закрывающей. НЕ пиши
          Markdown, списки, код-фенсы. Ответ должен быть валидным JSON,
          пригодным для парсинга через json.loads без предварительной
          обработки.
        </rules>
      fields:
        - name: "tranche_mechanics_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["present", "not_defined"]
          description: "Наличие механики траншей."
          required: true
          display_in_grid: false
        - name: "drawdown_request_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["present", "absent", "not_defined"]
          description: "Требование оформлять запрос на транш."
          required: true
          display_in_grid: false
        - name: "limit_type"
          type: "string"
          presentation: "signal"
          allowed_values: ["disbursement_limit", "outstanding_limit", "per_tranche_limit", "mixed", "not_defined"]
          description: "Тип лимита."
          required: true
          display_in_grid: false
        - name: "availability_period_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["present", "not_defined"]
          description: "Наличие периода доступности."
          required: true
          display_in_grid: false
        - name: "commitment_fee_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["present", "absent", "not_defined"]
          description: "Наличие commitment fee."
          required: true
          display_in_grid: false
        - name: "limit_annulment_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["present", "not_defined"]
          description: "Условия аннулирования неиспользованного лимита."
          required: true
          display_in_grid: false
        - name: "tranche_summary"
          type: "string"
          presentation: "fact"
          label: "Механика траншей"
          description: "Краткое summary."
          required: true
          display_in_grid: true
          display_priority: 1
        - name: "limits_display"
          type: "string"
          presentation: "fact"
          label: "Лимиты"
          description: "Понятная формулировка лимитов."
          required: true
          display_in_grid: true
          display_priority: 2
        - name: "availability_period_display"
          type: "string"
          presentation: "fact"
          label: "Период доступности"
          description: "Период доступности кредитной линии."
          required: true
          display_in_grid: true
          display_priority: 3
        - name: "drawdown_mechanics_display"
          type: "string"
          presentation: "fact"
          label: "Порядок запроса транша"
          description: "Порядок оформления запроса на транш."
          required: true
          display_in_grid: true
          display_priority: 4
        - name: "commitment_fee_display"
          type: "string"
          presentation: "fact"
          label: "Плата за неиспользованный лимит"
          description: "Commitment fee."
          required: true
          display_in_grid: true
          display_priority: 5

  - id: amendment_and_waiver_check
    name: "Порядок изменения договора и waiver"
    description: >
      Проверяет порядок изменения договора (по соглашению сторон /
      односторонне банком), форму изменений, право банка на односторонние
      изменения, режим waiver и наличие оговорки о сохранении прав.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "medium"
    severity_if_pass: "pass"
    severity_if_fail: "medium"
    severity_if_unclear: "low"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "изменение договора"
        - "дополнительное соглашение"
        - "одностороннем порядке"
        - "в письменной форме"
        - "вправе изменять"
        - "waiver"
        - "отказ от права"
        - "неосуществление права"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)(изменени|дополнени).{0,30}договор"
        - "(?i)односторонн.{0,20}порядк"
        - "(?i)вправе\\s+(измен|дополн)"
        - "(?i)(waiver|отказ\\s+от\\s+прав)"
        - "(?i)неосуществлени.{0,20}прав"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется кредитный договор.
        Проверяется только один вопрос: порядок изменения договора,
        односторонние изменения, режим waiver и оговорка о сохранении
        прав.

        Нормативный ориентир:
        - ст. 450, 452 ГК РФ — изменение договора, форма
        - ст. 310 ГК РФ — односторонний отказ и одностороннее изменение
          обязательства
        - ст. 29 ФЗ № 395-1 «О банках и банковской деятельности» —
          одностороннее изменение условий кредитного договора с заёмщиком-
          гражданином
        - ст. 5 п. 16 ФЗ № 353-ФЗ — ограничения односторонних изменений
          для потребительских кредитов

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора,
          а чего прямо нет.
        - Не оценивай серьёзность риска.
        - Различай:
            * изменение по соглашению сторон;
            * одностороннее изменение Банком.
        - Различай:
            * общее условие о письменной форме изменений;
            * конкретное право Банка на односторонние изменения
              (тарифы, ставка, комиссии).
        - Waiver (отказ от права) — добровольный отказ одной стороны
          от реализации права в конкретной ситуации. Не равен изменению
          договора.
        - Оговорка о сохранении прав («неосуществление права не означает
          отказа от него») — защитная оговорка.
        - Красные флаги:
            * широкое право банка на односторонние изменения ключевых
              условий (ставка, срок);
            * односторонние изменения без уведомления.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Порядок изменения договора.
        2. Есть ли право Банка на односторонние изменения.
        3. Какие условия могут меняться односторонне.
        4. Установлен ли режим waiver.
        5. Есть ли оговорка о сохранении прав.
        6. Сформулируй понятные для юриста текстовые расшифровки:
           - amendment_summary,
           - amendment_form_display,
           - unilateral_amendment_display,
           - waiver_display.

        [ПРАВИЛА]
        1. Используй только текст документа. Не подставляй нормы закона.
        2. Если параметр прямо указан — возвращай дословно или делай
           точную выжимку.
        3. `amendment_summary` — КРАТКОЕ summary, например:
           - «Только по соглашению сторон, письменная форма»;
           - «Право Банка на одностороннее изменение тарифов
             с уведомлением за 10 дней»;
           - «Широкое право Банка на односторонние изменения»
             (красный флаг);
           - «Не установлен».
        4. Если параметр прямо не указан:
           - для сигнальных enum-полей — "not_defined";
           - для текстовых user-facing полей — "Не установлен" /
             "Не установлено" по роду.
        5. Если тема по существу не применима — display-поле =
           "Не применимо", сигнальное = "not_defined".
        6. Если текст есть, но надёжный вывод сделать нельзя — display-поле =
           "Не удалось определить", сигнальное = "not_defined".
        7. Никогда не используй null, None, пустые строки или "-".
        8. Не выдумывай условия односторонних изменений, которых нет
           в тексте.
        9. При конфликтующих фрагментах — приоритет более позднему.
        10. В evidence включай только текст договора.
        11. Верни РОВНО один JSON-объект со всеми 8 ключами без какого-либо
            дополнительного текста до или после. Начни ответ сразу
            с открывающей фигурной скобки и закончи закрывающей. НЕ пиши
            Markdown, списки, код-фенсы. Ответ должен быть валидным JSON,
            пригодным для парсинга через json.loads без предварительной
            обработки.

        [РОССИЙСКАЯ ПРАКТИКА — ПОДСКАЗКИ]
        - Типичная формулировка изменения:
            * «Все изменения и дополнения к настоящему Договору
              действительны, если совершены в письменной форме и подписаны
              уполномоченными представителями Сторон».
        - Одностороннее изменение тарифов:
            * «Банк вправе в одностороннем порядке изменять Тарифы Банка,
              уведомив Заёмщика не позднее чем за 10 календарных дней
              до даты введения изменений».
        - Одностороннее изменение ставки:
            * для потребительских кредитов — по общему правилу запрещено
              (ст. 29 ФЗ «О банках»), кроме случаев, установленных
              договором;
            * для корпоративных — возможно по договору, но ограничено
              практикой.
        - Типичная оговорка о сохранении прав:
            * «Неосуществление любой из Сторон любого из своих прав
              по настоящему Договору не означает отказа от такого права
              и не препятствует его осуществлению впоследствии».
        - Типичная оговорка о waiver:
            * «Никакое освобождение от обязательств или согласие
              на отступление от условий Договора не имеет силы, если
              не оформлено в письменной форме».

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — стандартный порядок изменения:
        Фрагмент:
        "Все изменения и дополнения к настоящему Договору действительны,
         если совершены в письменной форме и подписаны уполномоченными
         представителями Сторон. Неосуществление любой из Сторон любого
         из своих прав по настоящему Договору не означает отказа
         от такого права."

        Ответ:
        {
          "amendment_form_status": "present",
          "unilateral_amendment_status": "absent",
          "waiver_regime_status": "present",
          "no_waiver_by_conduct_status": "present",
          "amendment_summary": "Изменения только по соглашению сторон в письменной форме; оговорка о сохранении прав",
          "amendment_form_display": "Письменная форма, подписание уполномоченными представителями",
          "unilateral_amendment_display": "Не установлено",
          "waiver_display": "Установлено: неосуществление права не означает отказа"
        }

        Пример 2 — право банка на одностороннее изменение тарифов:
        Фрагмент:
        "Банк вправе в одностороннем порядке изменять Тарифы Банка, уведомив
         Заёмщика не позднее чем за 10 календарных дней до даты введения
         изменений. Все прочие изменения — по соглашению Сторон в письменной
         форме."

        Ответ:
        {
          "amendment_form_status": "present",
          "unilateral_amendment_status": "present",
          "waiver_regime_status": "not_defined",
          "no_waiver_by_conduct_status": "not_defined",
          "amendment_summary": "Право Банка на одностороннее изменение тарифов с уведомлением за 10 дней; прочие изменения по соглашению сторон",
          "amendment_form_display": "Письменная форма по соглашению сторон",
          "unilateral_amendment_display": "Право Банка изменять Тарифы с уведомлением за 10 календарных дней",
          "waiver_display": "Не установлено"
        }

        Пример 3 — широкое право банка (красный флаг):
        Фрагмент:
        "Банк вправе в одностороннем порядке изменять условия настоящего
         Договора, включая размер процентной ставки, сроки платежей
         и иные условия, с уведомлением Заёмщика."

        Ответ:
        {
          "amendment_form_status": "present",
          "unilateral_amendment_status": "present",
          "waiver_regime_status": "not_defined",
          "no_waiver_by_conduct_status": "not_defined",
          "amendment_summary": "Широкое право Банка на односторонние изменения ключевых условий (красный флаг)",
          "amendment_form_display": "Не установлена",
