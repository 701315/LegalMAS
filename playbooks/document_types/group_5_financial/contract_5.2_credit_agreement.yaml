          required: true
          display_in_grid: true
          display_priority: 2
        - name: "breach_consequences_display"
          type: "string"
          presentation: "fact"
          label: "Последствия нарушения"
          description: "Понятная формулировка последствий нарушения ковенантов."
          required: true
          display_in_grid: true
          display_priority: 3
        - name: "cure_period_display"
          type: "string"
          presentation: "fact"
