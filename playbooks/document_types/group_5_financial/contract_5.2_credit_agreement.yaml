  cross_default:
    any_keywords:
      - "(?i)кросс-?дефолт"
      - "(?i)\\bcross-default\\b"
      - "(?i)дефолт\\s+по\\s+ин[ыа]м\\s+обязательств[аа]м"
      - "(?i)неисполнени[ея]\\s+по\\s+другим\\s+договор[аа]м"
      - "(?i)перекрестн[ыо]й\\s+дефолт"

  financial_covenants:
    any_keywords:
      - "(?i)\\bковенант\\b"
      - "(?i)\\bcovenant\\b"
      - "(?i)финансов[ыо]е\\s+показател[ии]"
      - "(?i)долгов[а-яё]+\\s+нагрузк[аа]"
      - "(?i)\\bebitda\\b"
      - "(?i)\\bdebt/ebitda\\b"
      - "(?i)коэффициент\\s+покрыти[яя]"
      - "(?i)чист[ыо]й\\s+долг"

  syndicated_credit:
    any_keywords:
      - "(?i)синдицированн[ыо]й\\s+кредит"
      - "(?i)консорциум\\s+банк[оо]в"
      - "(?i)агент\\s+по\\s+кредит[уу]"
      - "(?i)кредитн[ыо]й\\s+агент"
      - "(?i)участник[ии]\\s+синдикат[аа]"

  purpose_restricted:
    any_keywords:
      - "(?i)целев[оа]й\\s+кредит"
      - "(?i)целев[оа]е\\s+использовани[ея]"
      - "(?i)цель\\s+кредит[аа]"
      - "(?i)целев[оа]е\\s+назначени[ея]"
      - "(?i)подтверждени[ея]\\s+целев[оа]го\\s+использовани[яя]"

  refinancing:
    any_keywords:
      - "(?i)\\bрефинансировани[ея]\\b"
      - "(?i)погашени[ея]\\s+ране[ее]\\s+выданн[оа]го\\s+кредит[аа]"
      - "(?i)перекредитовани[ея]"
      - "(?i)замен[аа]\\s+кредитор[аа]"

  grace_period:
    any_keywords:
