type: contract_5.2_credit_agreement
name: "Кредитный договор"
version: 6.0
parent: class_5_financial_security
description: |
  Консенсуальный возмездный договор, по которому банк или иная кредитная организация
  обязуется предоставить заемщику денежные средства (кредит) в размере и на условиях,
  предусмотренных договором, а заемщик обязуется возвратить полученную сумму и уплатить
  проценты за пользование кредитом. Регулируется § 2 Главы 42 ГК РФ с субсидиарным
  применением норм о займе, а для отдельных видов кредитования — специальными законами,
  прежде всего Федеральным законом № 353-ФЗ о потребительском кредите.
  Характеризуется обязательной письменной формой, обязательной возмездностью,
  специальным статусом кредитора, повышенной регуляторной нагрузкой и высоким объемом
  типовых банковских рисков для обеих сторон.
metadata:
  category: contract
  subcategory: financial_security
  complexity: high
  risk_level: critical
  jurisdiction: RU
  language: ru
  legal_base: "§ 2 Главы 42 ГК РФ (ст. 819-821)"
  doc_types_supported:
    - "кредитный договор"
    - "банковский кредит"
    - "кредитное соглашение"
    - "договор об открытии кредитной линии"
    - "договор овердрафта"
    - "потребительский кредит"
    - "ипотечный кредит"
    - "корпоративный кредитный договор"
    - "договор рефинансирования"
    - "соглашение о предоставлении траншей"
    - "договор кредитной линии"
    - "договор ипотечного кредита"
    - "договор синдицированного кредита"
    - "договор возобновляемой кредитной линии"
    - "credit agreement"
    - "facilities agreement"
    - "credit facility agreement"
    - "loan facility agreement"
    - "revolving credit facility"
    - "revolving facility agreement"
    - "term loan agreement"
    - "mortgage loan agreement"
    - "syndicated facilities agreement"
    - "multicurrency credit agreement"
    - "senior facilities agreement"
    - "bridge facility agreement"
    - "borrowing base agreement"

