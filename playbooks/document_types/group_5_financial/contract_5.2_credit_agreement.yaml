# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 3: SHARED PATTERNS
#  Читается: DocTypeCheckLoader через _resolve_yaml_templates()
# ════════════════════════════════════════════════════════════════════════════

shared_patterns:
  money_amount: "(?i)\\b\\d[\\d\\s]*(?:руб|рублей|₽|коп|тыс|млн|млрд)"
  percentage_pattern: "(?i)\\b\\d+(?:[.,]\\d+)?\\s*%\\b"
  date_pattern: "(?i)\\b\\d{1,2}[.]\\d{1,2}[.]\\d{4}\\b"
  psk_pattern: "(?i)(?:полная\\s+стоимость\\s+кредита|ПСК).{0,30}\\d+(?:[.,]\\d+)?\\s*%"
  license_pattern: "(?i)лиценз[ияе]\\s*(?:№|N|No\\.)?\\s*[A-ZА-Я0-9\\-\\/]+"

compliance_rules: []

# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 4: CHECKS_V8 — единственный рабочий слой юридического анализа
#  Читается: DocTypeCheckLoader._load_doc_type_checks()
# ════════════════════════════════════════════════════════════════════════════

checks_v8:

  # ──────────────────────────────────────────────────────────────────────────
  # CHECK 1: Базовое извлечение параметров кредитного договора
  # ──────────────────────────────────────────────────────────────────────────
  - id: credit_subject_extraction
    name: "Базовое извлечение параметров кредитного договора"
    description: >
      Извлекает кредитора, заемщика, сумму, валюту, ставку, срок, ПСК
      и вид кредитной конструкции.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "кредитор"
        - "заемщик"
        - "сумма кредита"
        - "процентная ставка"
        - "полная стоимость кредита"
        - "график платежей"
        - "кредитная линия"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)(кредитный\\s+договор|кредитор|заемщик)"
        - "(?i)\\b\\d[\\d\\s]*(?:руб|рублей|₽|коп|тыс|млн|млрд)\\b"
        - "(?i)\\b\\d+(?:[.,]\\d+)?\\s*%\\b"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется кредитный договор по § 2 Главы 42 ГК РФ (ст. 819-821).
        Проверяется только один вопрос: ключевые параметры кредита.

        Нормативный ориентир:
        - ст. 819 ГК РФ — кредитный договор
        - ст. 6 ФЗ № 353-ФЗ — ПСК

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора,
          а чего прямо нет.
        - Не оценивай серьёзность риска.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Кредитор (банк/кредитная организация).
        2. Заемщик.
        3. Вид кредитной конструкции.
        4. Сумма кредита.
        5. Валюта кредита.
        6. Процентная ставка.
        7. Тип ставки (фиксированная / переменная).
        8. Срок кредита.
        9. Полная стоимость кредита (ПСК).
        10. Структура погашения (аннуитет / дифференцированная).

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Если данные не указаны прямо — возвращай "not_defined".
        4. Если текстового значения нет — возвращай строго "Данные не определены".
        5. Не используй "None", "null", "not_defined", "not_defined" или пустые строки.
        6. В evidence включай только текст договора.
        7. Верни только один JSON-объект.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — параметры определены:
        Фрагмент:
        "Банк «Альфа» (лицензия № 1234) предоставляет ООО «Бета» кредит в сумме 10 000 000 рублей сроком на 3 года. Процентная ставка — 15% годовых. Структура погашения — аннуитет."

        Ответ:
        {
          "lender": "Банк «Альфа»",
          "borrower": "ООО «Бета»",
          "credit_type": "standard",
          "credit_amount": "10 000 000 рублей",
          "currency": "RUB",
          "interest_rate": "15%",
          "rate_type": "fixed",
          "term": "3 года",
          "psk": "Данные не определены",
          "repayment_structure": "annuity"
        }

        Пример 2 — данные отсутствуют:
        Фрагмент:
        "Стороны заключили кредитный договор."

        Ответ:
        {
          "lender": "Данные не определены",
          "borrower": "Данные не определены",
          "credit_type": "not_defined",
          "credit_amount": "Данные не определены",
          "currency": "not_defined",
          "interest_rate": "Данные не определены",
          "rate_type": "not_defined",
          "term": "Данные не определены",
          "psk": "Данные не определены",
          "repayment_structure": "not_defined"
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о кредиторе.
        2. Найди прямую цитату о сумме кредита.
        3. Найди прямую цитату о процентной ставке.
        4. Найди прямую цитату о сроке кредита.
        5. Если прямой цитаты нет — верни "not_defined" или "Данные не определены".

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "lender": "<текст или 'Данные не определены'>",
          "borrower": "<текст или 'Данные не определены'>",
          "credit_type": "<standard / consumer / mortgage / credit_line / overdraft / refinancing / unclear / not_defined>",
          "credit_amount": "<текст или 'Данные не определены'>",
          "currency": "<RUB / USD / EUR / other / not_defined>",
          "interest_rate": "<текст или 'Данные не определены'>",
          "rate_type": "<fixed / variable / unclear / not_defined>",
          "term": "<текст или 'Данные не определены'>",
          "psk": "<текст или 'Данные не определены'>",
          "repayment_structure": "<annuity / differentiated / custom / not_defined>"
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 700

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "кредитор заемщик сумма кредита процентная ставка полная стоимость кредита график платежей кредитная линия"
      preferred_unit_types:
        - obligation
        - general_provision
        - payment_term
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - definitions
        - obligations
      negative_keywords:
        - "означает"
        - "в целях настоящего"
        - "приложение"
        - "индекс"
      position_bias:
        preferred_range: [0.0, 0.35]
        boost: 0.20
        scope: segment
      context_k: 6
      max_chunks: 10
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
        - "invoice"
      preferred_clause_functions:
        - "definitions"
        - "obligations"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 50
      max_snippet_length: 700

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1250
      compact_output: false

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Твоя задача — извлечь из текста кредитного договора
        ключевые параметры кредита: кредитора, заемщика, сумму, валюту, ставку,
        срок, ПСК и структуру погашения.
        Не анализируй комиссии, обеспечение, ковенанты или последствия нарушения.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        1. lender — наименование кредитора.
        2. borrower — наименование заемщика.
        3. credit_type — "standard" / "consumer" / "mortgage" / "credit_line" / "overdraft" / "refinancing" / "unclear" / "not_defined".
        4. credit_amount — сумма кредита.
        5. currency — "RUB" / "USD" / "EUR" / "other" / "not_defined".
        6. interest_rate — процентная ставка.
        7. rate_type — "fixed" / "variable" / "unclear" / "not_defined".
        8. term — срок кредита.
        9. psk — полная стоимость кредита.
        10. repayment_structure — "annuity" / "differentiated" / "custom" / "not_defined".

        Если данные отсутствуют:
        - текстовое поле = "Данные не определены"
        - статусное поле = "not_defined"
        </task>

        <rules>
        - Используй только текст договора.
        - Не делай предположений.
        - Верни только JSON.
        </rules>
      fields:
        - name: "lender"
          type: "string"
          presentation: "fact"
          label: "Кредитор"
          description: "Наименование кредитора."
          required: true
          display_in_grid: true
          display_priority: 1
        - name: "borrower"
          type: "string"
          presentation: "fact"
          label: "Заемщик"
          description: "Наименование заемщика."
          required: true
          display_in_grid: true
          display_priority: 2
        - name: "credit_type"
          type: "string"
          presentation: "signal"
          allowed_values: ["standard", "consumer", "mortgage", "credit_line", "overdraft", "refinancing", "unclear", "not_defined"]
          description: "Вид кредитной конструкции."
          required: false
        - name: "credit_amount"
          type: "string"
          presentation: "fact"
          label: "Сумма кредита"
          description: "Сумма кредита."
          required: true
          display_in_grid: true
          display_priority: 3
        - name: "currency"
          type: "string"
          presentation: "signal"
          allowed_values: ["RUB", "USD", "EUR", "other", "not_defined"]
          description: "Валюта кредита."
          required: false
        - name: "interest_rate"
          type: "string"
          presentation: "fact"
          label: "Процентная ставка"
          description: "Процентная ставка по кредиту."
          required: true
          display_in_grid: true
          display_priority: 4
        - name: "rate_type"
          type: "string"
          presentation: "signal"
          allowed_values: ["fixed", "variable", "unclear", "not_defined"]
          description: "Тип процентной ставки."
          required: false
        - name: "term"
          type: "string"
          presentation: "fact"
          label: "Срок кредита"
          description: "Срок кредита."
          required: true
          display_in_grid: true
          display_priority: 5
        - name: "psk"
          type: "string"
          presentation: "fact"
          label: "ПСК"
          description: "Полная стоимость кредита."
          required: false
          display_in_grid: true
          display_priority: 6
        - name: "repayment_structure"
          type: "string"
          presentation: "signal"
          allowed_values: ["annuity", "differentiated", "custom", "not_defined"]
          description: "Структура погашения."
          required: false
      store_payload: true

  # ──────────────────────────────────────────────────────────────────────────
  # CHECK 2: Статус и лицензия кредитора
  # ──────────────────────────────────────────────────────────────────────────
  - id: lender_license_check
    name: "Статус и лицензия кредитора"
    description: >
      Проверяет, что кредитор обозначен как банк/кредитная организация
      и содержатся признаки лицензии.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "банк"
        - "кредитная организация"
        - "лицензия банка россии"
        - "генеральная лицензия"
        - "цб рф"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)лиценз[ияе].{0,40}(банка\\s+россии|цб|центрального\\s+банка)"
        - "(?i)(банк|кредитная\\s+организация)"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется кредитный договор по § 2 Главы 42 ГК РФ.
        Проверяется только один вопрос: статус кредитора и наличие лицензии.

        Нормативный ориентир:
        - ст. 819 ГК РФ
        - ФЗ № 395-1

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора.
        - Не оценивай серьёзность риска.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Как идентифицирован кредитор.
        2. Есть ли ссылка на лицензию Банка России.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Если данные не указаны прямо — возвращай "not_defined".
        3. Если текстового значения нет — возвращай строго "Данные не определены".
        4. Не используй "None", "null", "not_defined", "not_defined" или пустые строки.
        5. В evidence включай только текст договора.
        6. Верни только один JSON-объект.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1:
        Фрагмент:
        "Кредитор — Банк «Альфа», действующий на основании лицензии Банка России № 1234."

        Ответ:
        {
          "lender_status": "bank",
          "license_reference_status": "present",
          "license_details": "№ 1234"
        }

        Пример 2:
        Фрагмент:
        "Кредитор предоставляет заемщику денежные средства."

        Ответ:
        {
          "lender_status": "unclear",
          "license_reference_status": "not_defined",
          "license_details": "Данные не определены"
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о статусе кредитора.
        2. Найди прямую цитату о лицензии.
        3. Если прямой цитаты нет — верни "not_defined" или "Данные не определены".

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "lender_status": "<bank / credit_organization / unclear / not_defined>",
          "license_reference_status": "<present / not_defined>",
          "license_details": "<текст или 'Данные не определены'>"
        }
      context_k: 5
      temperature: 0.0
      max_tokens: 350

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "лицензия банка россии банк кредитная организация цб рф"
      preferred_unit_types:
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - boilerplate
      negative_keywords:
        - "означает"
        - "в целях настоящего"
        - "сумма кредита"
        - "проценты"
      position_bias:
        preferred_range: [0.0, 0.25]
        boost: 0.20
        scope: segment
      context_k: 5
      max_chunks: 7
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
        - "invoice"
      preferred_clause_functions:
        - "boilerplate"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 35
      max_snippet_length: 550

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 600
      compact_output: false

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста кредитного договора сведения
        о статусе кредитора и наличии лицензии.
        Не анализируй условия кредита, комиссии или обеспечение.
        </role>

        <context>
        {context}
        </context>

        <task>
        1. lender_status — "bank" / "credit_organization" / "unclear" / "not_defined".
        2. license_reference_status — "present" / "not_defined".
        3. license_details — реквизиты лицензии или "Данные не определены".
        </task>

        <rules>
        - Используй только текст договора.
        - Верни только JSON.
        </rules>
      fields:
        - name: "lender_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["bank", "credit_organization", "unclear", "not_defined"]
          description: "Статус кредитора."
          required: true
        - name: "license_reference_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["present", "not_defined"]
          description: "Есть ли ссылка на лицензию."
          required: false
        - name: "license_details"
          type: "string"
          presentation: "fact"
          label: "Реквизиты лицензии"
          description: "Реквизиты лицензии кредитора."
          required: false
          display_in_grid: true
          display_priority: 1
      store_payload: true

  # ──────────────────────────────────────────────────────────────────────────
  # CHECK 3: Проценты, ПСК и дополнительные платежи
  # ──────────────────────────────────────────────────────────────────────────
  - id: interest_psk_fees_check
    name: "Проценты, ПСК и дополнительные платежи"
    description: >
      Проверяет процентную ставку, ПСК, комиссии и прозрачность общей стоимости
