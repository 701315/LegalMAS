          "cross_default_present": "yes",
          "threshold_amount": "более 500 000 рублей",
          "covered_obligations": "all",
          "grace_period_for_third_party_default": "present"
        }

        Пример 2:
        Фрагмент:
        "Любое неисполнение обязательств перед третьими лицами является основанием для дефолта."

        Ответ:
        {
          "cross_default_present": "yes",
          "threshold_amount": "no_threshold",
          "covered_obligations": "all",
          "grace_period_for_third_party_default": "absent"
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о кросс-дефолте.
        2. Найди порог существенности.
