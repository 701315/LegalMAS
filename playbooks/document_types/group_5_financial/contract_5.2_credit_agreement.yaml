          "availability_period_display": "<текст, 'Не установлен', 'Не применимо' или 'Не удалось определить'>",
          "drawdown_mechanics_display": "<текст, 'Не установлена', 'Не применимо' или 'Не удалось определить'>",
          "commitment_fee_display": "<текст, 'Не взимается', 'Не применимо' или 'Не удалось определить'>"
