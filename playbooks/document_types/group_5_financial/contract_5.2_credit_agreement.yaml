        - Если в разных фрагментах противоречие: enum → "not_defined", display → "Не удалось определить".
        - Не используй null, None, пустые строки или "-".
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни траншей, ни лимитов, ни периода доступности.
           → presence = "missing";
             все enum-поля = "not_defined";
             все display-поля = "Не применимо".

        2. Овердрафт с автоматической выборкой.
