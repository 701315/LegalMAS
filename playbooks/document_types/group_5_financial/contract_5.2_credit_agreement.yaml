  - id: notices_and_communications_check
    name: "Порядок уведомлений и коммуникации сторон"
    description: >
      Проверяет способы направления уведомлений (почта, email, личный
      кабинет, курьер), момент получения, юридическую силу уведомлений
      по email и указание адресов сторон.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "medium"
    severity_if_pass: "pass"
    severity_if_fail: "medium"
    severity_if_unclear: "low"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "порядок уведомлений"
        - "уведомления направляются"
        - "адрес для уведомлений"
        - "считается полученным"
        - "заказным письмом"
        - "электронной почте"
        - "юридическая сила"
        - "личный кабинет"
        - "курьерской службой"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)уведомлени.{0,30}(направля|считает|получен)"
        - "(?i)заказн(ым|ого)\\s+письм"
        - "(?i)(электронн(ой|ая)\\s+почт|e-?mail)"
        - "(?i)считается\\s+полученн"
        - "(?i)юридическ(ую|ая)\\s+сил"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется кредитный договор.
        Проверяется только один вопрос: порядок направления уведомлений,
        момент их получения и юридическая сила уведомлений по email.

        Нормативный ориентир:
        - ст. 165.1 ГК РФ — юридически значимые сообщения
        - ст. 431.1 ГК РФ — заверения об обстоятельствах
        - Общая практика делового оборота

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора,
          а чего прямо нет.
        - Не оценивай серьёзность риска.
        - Различай:
            * способы направления (почта, email, личный кабинет, курьер);
            * момент получения (дата отправки / дата доставки / N дней
              с даты отправки).
        - Юридическая сила уведомлений по email — отдельный значимый факт.
          Если в договоре прямо указано, что email-уведомления имеют
          юридическую силу, — фиксируй. Если нет — тоже фиксируй.
        - Красные флаги:
            * отсутствие указания способа направления;
            * отсутствие момента получения (невозможно определить,
              когда уведомление вступило в силу);
            * отсутствие email в качестве канала.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Способы направления уведомлений.
        2. Момент, с которого уведомление считается полученным.
        3. Есть ли email в качестве канала коммуникации.
        4. Указаны ли адреса сторон для уведомлений.
        5. Сформулируй понятные для юриста текстовые расшифровки:
           - notices_summary,
           - notice_methods_display,
           - notice_effective_display,
           - email_notices_display.

        [ПРАВИЛА]
        1. Используй только текст документа. Не подставляй нормы закона.
        2. Если параметр прямо указан — возвращай дословно или делай
           точную выжимку.
        3. `notice_methods_value` — массив строк, например:
           ["заказное письмо с уведомлением", "электронная почта",
            "курьерская служба"].
           Если способ не указан — пустой массив [].
        4. `notices_summary` — КРАТКОЕ summary, например:
           - «Почта + email; считается полученным на 5-й рабочий день
             с даты отправки»;
           - «Только заказное письмо; email не установлен»;
           - «Не установлено».
        5. Если параметр прямо не указан:
           - для сигнальных enum-полей — "not_defined";
           - для текстовых user-facing полей — "Не установлен" /
             "Не установлено" по роду;
           - для массива — [].
        6. Если тема по существу не применима — display-поле =
           "Не применимо", сигнальное = "not_defined".
        7. Если текст есть, но надёжный вывод сделать нельзя — display-поле =
           "Не удалось определить", сигнальное = "not_defined".
        8. Никогда не используй null, None, пустые строки или "-".
        9. При конфликтующих фрагментах — приоритет более позднему.
        10. В evidence включай только текст договора.
        11. Верни РОВНО один JSON-объект со всеми 9 ключами без какого-либо
            дополнительного текста до или после. Начни ответ сразу
            с открывающей фигурной скобки и закончи закрывающей. НЕ пиши
            Markdown, списки, код-фенсы. Ответ должен быть валидным JSON,
            пригодным для парсинга через json.loads без предварительной
            обработки.

        [РОССИЙСКАЯ ПРАКТИКА — ПОДСКАЗКИ]
        - Типичные формулировки:
            * «Уведомления направляются по адресам, указанным в реквизитах
              Сторон, заказным письмом с уведомлением о вручении или
              курьерской службой»;
            * «Уведомления могут направляться по электронной почте
              на адреса, указанные в реквизитах Сторон, и имеют
              юридическую силу наравне с письменными уведомлениями»;
            * «Уведомление считается полученным: при направлении заказным
              письмом — на 5-й рабочий день с даты отправки; при
              направлении по email — в день отправки».
        - Ст. 165.1 ГК РФ: юридически значимое сообщение считается
          полученным, даже если адресат его не прочитал, если оно
          доставлено по указанному адресу.
        - Email-уведомления: юридическая сила признаётся, если это прямо
          указано в договоре или стороны обменивались документами
          по этим адресам (практика ВС РФ).
        - Личный кабинет / электронная платформа — становится всё более
          распространённым каналом в потребительских и корпоративных
          кредитах.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — почта + email, момент получения определён:
        Фрагмент:
        "Уведомления направляются по адресам, указанным в реквизитах Сторон,
         заказным письмом с уведомлением о вручении или по электронной почте.
         Уведомления по электронной почте, направленные с адресов, указанных
         в Договоре, имеют юридическую силу. Уведомление считается
         полученным: при направлении заказным письмом — на 5-й рабочий день
         с даты отправки; при направлении по email — в день отправки."

        Ответ:
        {
          "notice_methods_status": "present",
          "notice_methods_value": [
            "заказное письмо с уведомлением о вручении",
            "электронная почта"
          ],
          "notice_effective_moment_status": "present",
          "email_notices_status": "present",
          "addresses_specified_status": "present",
          "notices_summary": "Заказное письмо + email, email имеет юридическую силу; момент получения определён",
          "notice_methods_display": "Заказное письмо + электронная почта",
          "notice_effective_display": "Почта — 5-й рабочий день с даты отправки; email — в день отправки",
          "email_notices_display": "Email-уведомления с адресов Договора имеют юридическую силу"
        }

        Пример 2 — только заказное письмо:
        Фрагмент:
        "Все уведомления по настоящему Договору направляются заказным
         письмом с уведомлением о вручении по адресам, указанным
         в реквизитах Сторон."

        Ответ:
        {
          "notice_methods_status": "present",
          "notice_methods_value": [
            "заказное письмо с уведомлением о вручении"
          ],
          "notice_effective_moment_status": "not_defined",
          "email_notices_status": "not_defined",
          "addresses_specified_status": "present",
          "notices_summary": "Только заказное письмо; момент получения не установлен; email не установлен",
          "notice_methods_display": "Заказное письмо с уведомлением о вручении",
          "notice_effective_display": "Не установлен",
          "email_notices_display": "Не установлено"
        }

        Пример 3 — порядок уведомлений не установлен:
        Фрагмент:
        "Иные условия определяются в соответствии с действующим
         законодательством Российской Федерации."

        Ответ:
        {
          "notice_methods_status": "not_defined",
          "notice_methods_value": [],
          "notice_effective_moment_status": "not_defined",
          "email_notices_status": "not_defined",
          "addresses_specified_status": "not_defined",
          "notices_summary": "Не установлено",
          "notice_methods_display": "Не установлены",
          "notice_effective_display": "Не установлен",
          "email_notices_display": "Не установлено"
        }

