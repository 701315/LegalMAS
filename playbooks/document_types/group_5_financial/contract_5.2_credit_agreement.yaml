type: contract_5.2_credit_agreement
name: "Кредитный договор"

description: |
  Консенсуальный возмездный договор, по которому банк или иная кредитная организация
  обязуется предоставить заемщику денежные средства (кредит) в размере и на условиях,
  предусмотренных договором, а заемщик обязуется возвратить полученную сумму и уплатить
  проценты за пользование кредитом. Регулируется § 2 Главы 42 ГК РФ с субсидиарным
  применением норм о займе, а для отдельных видов кредитования — специальными законами,
  прежде всего Федеральным законом № 353-ФЗ о потребительском кредите.
  Характеризуется обязательной письменной формой, обязательной возмездностью,
  специальным статусом кредитора, повышенной регуляторной нагрузкой и высоким объемом
  типовых банковских рисков для обеих сторон.

version: 4.0
parent: class_5_financial_security

metadata:
  category: contract
  subcategory: financial_security
  complexity: high
  risk_level: critical
  jurisdiction: RU
  language: ru
  legal_base: "§ 2 Главы 42 ГК РФ (ст. 819-821)"
  doc_types_supported:
    - "кредитный договор"
    - "банковский кредит"
    - "кредитное соглашение"
    - "договор об открытии кредитной линии"
    - "договор овердрафта"
    - "потребительский кредит"
    - "ипотечный кредит"
    - "корпоративный кредитный договор"
    - "договор рефинансирования"
    - "соглашение о предоставлении траншей"

engine_expectations:
  evidence_required: true
  evidence_style: "pinpoint"
  allow_not_found: true
  output_style: "dd_grid"
  prefer_structured_outputs: true

# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 1: КЛАССИФИКАЦИЯ (L1/L2)
#  Читается: YAMLRegistry → L1FilenameClassifier, L2HeaderClassifier
# ════════════════════════════════════════════════════════════════════════════

classification_runtime_v1:

  scoring:
    accept_threshold: 0.82
    strong_signal_threshold: 0.9
    ambiguity_margin: 0.18
    input_quality_weight: 1.0

  rules:

    filename_patterns:
      - "(?i)кредитн"
      - "(?i)credit"
      - "(?i)loan[\\s_.]?agreement"
      - "(?i)овердрафт"
      - "(?i)кредитн[аяо]\\s+линия"

    folder_patterns:
      - "(?i)credit"
      - "(?i)кредит"
      - "(?i)banking"

    keywords:

      high:
        - pattern: "(?i)кредитн[ыйое]\\s+договор"
          weight: 1.0
          distinctiveness: high
          context: header
          description: "Основное название кредитного договора с банком/кредитной организацией"

        - pattern: "(?i)банковск[ийое]\\s+кредит"
          weight: 1.0
          distinctiveness: high
          context: header
          description: "Банковский кредит по § 2 Главы 42 ГК РФ"

        - pattern: "(?i)кредитн[оеая]\\s+соглашен[иеия]"
          weight: 0.95
          distinctiveness: high
          context: header
          description: "Кредитное соглашение как синоним кредитного договора"

        - pattern: "(?i)договор\\s+об\\s+открыт[ииии]\\s+кредитн[ойой]\\s+лини[ии]"
          weight: 0.95
          distinctiveness: high
          context: header
          description: "Договор об открытии кредитной линии"

        - pattern: "(?i)договор\\s+овердрафт[ауы]"
          weight: 0.95
          distinctiveness: high
          context: header
          description: "Договор овердрафта как разновидность кредитования по счёту"

        - pattern: "(?i)потребительск[ийое]\\s+кредит"
          weight: 0.9
          distinctiveness: high
          context: header
          description: "Потребительский кредит/займ в смысле 353-ФЗ"

        - pattern: "(?i)ипотечн[ыйое]\\s+кредит"
          weight: 0.9
          distinctiveness: high
          context: header
          description: "Ипотечный кредит под залог недвижимости"

        - pattern: "(?i)корпоративн[ыйое]\\s+кредитн[ыйое]\\s+договор"
          weight: 0.9
          distinctiveness: high
          context: header
          description: "Корпоративный кредитный договор"

        - pattern: "(?i)договор\\s+рефинансирован[ияи]"
          weight: 0.9
          distinctiveness: high
          context: header
          description: "Рефинансирование ранее выданного кредита"

        - pattern: "(?i)соглашен[иея]\\s+о\\s+предоставлен[иии]\\s+транш[еёй]"
          weight: 0.9
          distinctiveness: high
          context: any
          description: "Соглашение о предоставлении кредитных траншей в рамках линии"

        - pattern: "(?i)кредитор[ауы]"
          weight: 0.85
          distinctiveness: medium
          context: any
          description: "Кредитор как сторона по кредитному договору"

        - pattern: "(?i)заемщик[ауы]"
          weight: 0.85
          distinctiveness: medium
          context: any
          description: "Заёмщик по кредитному договору"

        - pattern: "(?i)кредитн[аяое]\\s+организац[ияи]"
          weight: 0.9
          distinctiveness: high
          context: any
          description: "Кредитная организация как специальный субъект кредитного договора"

        - pattern: "(?i)банк[а-я]*"
          weight: 0.85
          distinctiveness: medium
          context: any
          description: "Банк как кредитор"

        - pattern: "(?i)процентн[аяое]\\s+ставк[ауы]"
          weight: 0.9
          distinctiveness: medium
          context: any
          description: "Процентная ставка по кредиту"

        - pattern: "(?i)полн[аяое]\\s+стоимост[ьи]\\s+кредит[ауы]"
          weight: 0.95
          distinctiveness: high
          context: any
          description: "Полная стоимость кредита (ПСК) по 353-ФЗ"

        - pattern: "(?i)\\bpsk\\b"
          weight: 0.9
          distinctiveness: high
          context: any
          description: "Аббревиатура ПСК — полная стоимость кредита"

      medium:
        - pattern: "(?i)процент[ыа]\\s+за\\s+пользовани[ея]\\s+кредит[оо]м"
          weight: 0.7
          distinctiveness: medium
          context: any
          description: "Проценты за пользование кредитом"

        - pattern: "(?i)график\\s+платеж[её]й"
          weight: 0.65
          distinctiveness: medium
          context: any
          description: "График платежей по кредиту"

        - pattern: "(?i)аннуитетн[ыо]й\\s+плат[её]ж"
          weight: 0.65
          distinctiveness: medium
          context: any
          description: "Аннуитетные платежи по кредиту"

        - pattern: "(?i)дифференцированн[ыо]й\\s+плат[её]ж"
          weight: 0.65
          distinctiveness: medium
          context: any
          description: "Дифференцированные платежи по кредиту"

        - pattern: "(?i)погашени[ея]\\s+кредит[аа]"
          weight: 0.65
          distinctiveness: medium
          context: any
          description: "Погашение суммы кредита"

        - pattern: "(?i)\\bтранш\\b"
          weight: 0.6
          distinctiveness: medium
          context: any
          description: "Предоставление кредита отдельными траншами"

        - pattern: "(?i)кредитн[а-яё]+\\s+лини[яя]"
          weight: 0.7
          distinctiveness: medium
          context: any
          description: "Кредитная линия"

        - pattern: "(?i)лимит\\s+кредитовани[яя]"
          weight: 0.65
          distinctiveness: medium
          context: any
          description: "Лимит кредитования по договору"

        - pattern: "(?i)\\bовердрафт\\b"
          weight: 0.7
          distinctiveness: medium
          context: any
          description: "Овердрафт как форма кредитования"

        - pattern: "(?i)досрочн[оа]е\\s+погашени[ея]"
          weight: 0.6
          distinctiveness: medium
          context: any
          description: "Досрочное погашение кредита"

        - pattern: "(?i)обеспечени[ея]\\s+исполнени[яя]"
          weight: 0.55
          distinctiveness: low
          context: any
          description: "Обеспечение исполнения обязательств по кредиту"

      low:
        - pattern: "(?i)потребительск[иоя]+\\s+кредит"
          weight: 0.4
          distinctiveness: low
          context: any
          description: "Упоминание потребительского кредита"

        - pattern: "(?i)ипотечн[ыо]й\\s+кредит"
          weight: 0.4
          distinctiveness: low
          context: any
          description: "Упоминание ипотечного кредита"

        - pattern: "(?i)\\bрефинансировани[ея]\\b"
          weight: 0.35
          distinctiveness: low
          context: any
          description: "Рефинансирование кредита"

        - pattern: "(?i)реструктуризаци[яи]"
          weight: 0.35
          distinctiveness: low
          context: any
          description: "Реструктуризация кредитной задолженности"

        - pattern: "(?i)бюро\\s+кредитн[ыо]х\\s+истори[йи]"
          weight: 0.3
          distinctiveness: low
          context: any
          description: "Бюро кредитных историй"

        - pattern: "(?i)страховани[ея]\\s+жизн[ии]"
          weight: 0.3
          distinctiveness: low
          context: any
          description: "Страхование жизни, привязанное к кредиту"

        - pattern: "(?i)комисси[яи]\\s+за\\s+обслуживани[ея]"
          weight: 0.3
          distinctiveness: low
          context: any
          description: "Комиссия за обслуживание кредита"

    exclusions:
      - pattern: "(?i)договор\\s+за[йеё]м[аа]\\s+между\\s+физическ[иими]+\\s+лицами"
        severity: hard
        weight: -1.0
        description: "Заем между физическими лицами — договор займа, а не банковский кредит"

      - pattern: "(?i)беспроцентн[ыо]й\\s+за[её]м"
        severity: hard
        weight: -1.0
        description: "Беспроцентный заём регулируется нормами о займе, а не о кредитном договоре"

      - pattern: "(?i)\\bмикрозайм\\b"
        severity: hard
        weight: -1.0
        description: "Микрозайм по 151-ФЗ — отдельный микрофинансовый продукт, не банковский кредитный договор"

      - pattern: "(?i)договор\\s+ссуд[ыа]"
        severity: hard
        weight: -1.0
        description: "Ссуда — безвозмездное пользование вещью, а не кредит"

      - pattern: "(?i)товарн[ыо]й\\s+кредит"
        severity: hard
        weight: -1.0
        description: "Товарный кредит по ст. 822 ГК РФ — отдельная конструкция, отличная от банковского кредита"

      # ── Soft exclusions

      - pattern: "(?i)договор\\s+за[йеё]м[аа]"
        severity: soft
        weight: -0.35
        description: "Общее название договора займа снижает уверенность в том, что документ — банковский кредит"

      - pattern: "(?i)займодавец"
        severity: soft
        weight: -0.3
        description: "Маркер классического договора займа, а не кредитного договора"

      - pattern: "(?i)\\bмфо\\b|микрофинансир[ующа-яё]+\\s+организац[ияи]"
        severity: soft
        weight: -0.3
        description: "МФО работают по специальным договорным моделям микрозайма"

# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 2: ТРИГГЕРЫ
