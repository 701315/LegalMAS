    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется кредитный договор.
        Проверяется только один вопрос: наличие и условия кросс-дефолта.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Есть ли условие о кросс-дефолте.
        2. Установлен ли порог существенности.
        3. Какие обязательства охвачены.
        4. Есть ли льготный период.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Если условие не указано прямо — возвращай "not_defined".
        3. Если текстового значения нет — возвращай строго "Данные не определены".
        4. Не используй "None", "null", "not_defined", "not_defined" или пустые строки.
        5. В evidence включай только текст договора.
        6. Верни только один JSON-объект.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1:
        Фрагмент:
        "Кросс-дефолт наступает при неисполнении обязательств на сумму более 500 000 рублей перед любым кредитором. Уведомление банка в течение 10 дней."

