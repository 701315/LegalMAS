      - "(?i)\\bgrace\\s+period\\b"
      - "(?i)отсрочк[аа]\\s+платеж[аа]"
      - "(?i)\\bканикул[ыа]\\b"
      - "(?i)кредитн[ыо]е\\s+каникул[ыа]"

  negative_pledge:
    any_keywords:
      - "(?i)негативн[ыо]й\\s+залог"
      - "(?i)\\bnegative\\s+pledge\\b"
      - "(?i)обязательств[оо]\\s+не\\s+обременять"
      - "(?i)запрет\\s+на\\s+залог"
      - "(?i)не\\s+передавать\\s+в\\s+залог"

# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 3: SHARED PATTERNS
#  Читается: DocTypeCheckLoader через _resolve_yaml_templates()
# ════════════════════════════════════════════════════════════════════════════

shared_patterns:
  money_amount: "(?i)\\b\\d[\\d\\s]*(?:руб|рублей|₽|коп|тыс|млн|млрд)"
  percentage_pattern: "(?i)\\b\\d+(?:[.,]\\d+)?\\s*%\\b"
  date_pattern: "(?i)\\b\\d{1,2}[.]\\d{1,2}[.]\\d{4}\\b"
  psk_pattern: "(?i)(?:полная\\s+стоимость\\s+кредита|ПСК).{0,30}\\d+(?:[.,]\\d+)?\\s*%"
  license_pattern: "(?i)лиценз[ияе]\\s*(?:№|N|No\\.)?\\s*[A-ZА-Я0-9\\-\\/]+"

compliance_rules: []

# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 4: CHECKS_V8 — единственный рабочий слой юридического анализа
#  Читается: DocTypeCheckLoader._load_doc_type_checks()
# ════════════════════════════════════════════════════════════════════════════

checks_v8:

  - id: credit_subject_extraction
    name: "Базовое извлечение параметров кредитного договора"
    description: >
      Извлекает кредитора, заемщика, сумму, валюту, ставку, срок, ПСК
      и вид кредитной конструкции. ПСК и структура погашения
      извлекаются для логики, но детально покрыты
      в interest_psk_fees_check и repayment_schedule_and_early_repayment_check.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "кредитор"
        - "заемщик"
        - "сумма кредита"
        - "процентная ставка"
        - "полная стоимость кредита"
        - "срок кредита"
        - "кредитная линия"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)(кредитный\\s+договор|кредитор|заемщик)"
        - "(?i)\\b\\d[\\d\\s]*(?:руб|рублей|₽|коп|тыс|млн|млрд)\\b"
        - "(?i)\\b\\d+(?:[.,]\\d+)?\\s*%\\b"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется кредитный договор по § 2 Главы 42 ГК РФ (ст. 819-821).
        Проверяется только один вопрос: ключевые параметры кредита
        (стороны, сумма, валюта, ставка, срок, тип конструкции).

        Нормативный ориентир:
        - ст. 819 ГК РФ — кредитный договор
        - ст. 6 ФЗ № 353-ФЗ — ПСК (только для потребительских кредитов)

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора,
          а чего прямо нет.
        - Не оценивай серьёзность риска.
        - Не путай корпоративный кредит и потребительский: ПСК обязательна
          только для потребительских кредитов по ФЗ-353.
        - Не углубляйся в механизм плавающей ставки — это отдельный check
          (variable_rate_check). Здесь фиксируй только значение ставки
          и её тип.
        - Не углубляйся в структуру погашения — это отдельный check
          (repayment_schedule_and_early_repayment_check).

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Кредитор (банк/кредитная организация).
        2. Заемщик.
        3. Вид кредитной конструкции.
        4. Сумма кредита.
        5. Валюта кредита.
        6. Процентная ставка (значение или формула).
        7. Тип ставки (фиксированная / переменная).
        8. Срок кредита.
        9. Полная стоимость кредита (ПСК).

        [ПРАВИЛА]
        1. Используй только текст документа. Не подставляй нормы закона
           вместо текста договора.
        2. Если параметр прямо указан в договоре — возвращай его дословно.
        3. Если параметр определяется через приложение / график /
           индивидуальные условия — возвращай ссылку на этот документ,
           например «Согласно Приложению №1».
        4. Если параметр в договоре прямо не указан:
           - для текстовых полей (lender, borrower, credit_amount,
             interest_rate, term) — возвращай «Данные не определены»;
           - для enum-полей (credit_type, currency, rate_type) —
             возвращай "not_defined";
           - для psk — возвращай «Не применимо» для корпоративных
             кредитов (заёмщик — юр. лицо / ИП), иначе — «Данные
             не определены».
        5. Никогда не используй null, None, пустые строки или "-".
        6. При конфликтующих фрагментах отдавай приоритет более позднему
           или более специальному положению.
        7. В evidence включай только текст договора.
        8. Верни РОВНО один JSON-объект со всеми 9 ключами без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [РОССИЙСКАЯ ПРАКТИКА — ПОДСКАЗКИ]
        - Плавающая ставка часто формулируется как «Ключевая ставка ЦБ РФ +
          N п.п.» или «RUONIA + N%» → rate_type = "variable".
        - Кредитная линия: «невозобновляемая/возобновляемая кредитная
          линия с лимитом выдачи/задолженности» → credit_type = "credit_line".
        - Овердрафт: «овердрафт к расчётному счёту» → credit_type = "overdraft".
        - Ипотечный кредит: «кредит на приобретение недвижимости с залогом»
          → credit_type = "mortgage".
        - Потребительский кредит: заёмщик — физическое лицо, на
          потребительские цели → credit_type = "consumer".

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — параметры полностью определены:
        Фрагмент:
        "Банк «Альфа» (лицензия ЦБ РФ № 1234) предоставляет ООО «Бета» кредит
         в сумме 10 000 000 (десять миллионов) рублей сроком на 3 года.
         Процентная ставка — 15 (пятнадцать) процентов годовых."

        Ответ:
        {
          "lender": "Банк «Альфа»",
          "borrower": "ООО «Бета»",
          "credit_type": "standard",
          "credit_amount": "10 000 000 рублей",
          "currency": "RUB",
          "interest_rate": "15% годовых",
          "rate_type": "fixed",
          "term": "3 года",
          "psk": "Не применимо"
        }

        Пример 2 — плавающая ставка и параметры в приложении:
        Фрагмент:
        "Кредитор открывает Заёмщику невозобновляемую кредитную линию с лимитом
         выдачи, определяемым согласно Индивидуальным условиям (Приложение №1).
         Процентная ставка составляет Ключевую ставку Банка России плюс
         3,5 (три целых пять десятых) процентных пункта годовых.
         Срок пользования кредитом — 60 месяцев с даты открытия линии."

        Ответ:
        {
          "lender": "Данные не определены",
          "borrower": "Данные не определены",
          "credit_type": "credit_line",
          "credit_amount": "Согласно Приложению №1 (Индивидуальные условия)",
          "currency": "not_defined",
          "interest_rate": "Ключевая ставка Банка России + 3,5 п.п. годовых",
          "rate_type": "variable",
          "term": "60 месяцев",
          "psk": "Не применимо"
        }

        Пример 3 — данные полностью отсутствуют:
        Фрагмент:
        "Стороны заключили кредитный договор на условиях, согласованных ранее."

        Ответ:
        {
          "lender": "Данные не определены",
          "borrower": "Данные не определены",
          "credit_type": "not_defined",
          "credit_amount": "Данные не определены",
          "currency": "not_defined",
          "interest_rate": "Данные не определены",
          "rate_type": "not_defined",
          "term": "Данные не определены",
          "psk": "Данные не определены"
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о кредиторе и заёмщике.
        2. Найди прямую цитату о сумме кредита и валюте.
        3. Найди прямую цитату о процентной ставке; определи, фиксированная
           она или привязана к внешнему индикатору (ключевая ставка,
           RUONIA, MOSPRIME).
        4. Найди прямую цитату о сроке кредита.
        5. Определи, потребительский это кредит или корпоративный;
           для корпоративного отсутствие ПСК = «Не применимо».
        6. Если параметр определяется через приложение — верни ссылку
           на приложение, а не «Данные не определены».
        7. Если прямой цитаты нет и приложение не упомянуто —
           верни fallback по правилу 4.

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь РОВНО одним JSON-объектом без какого-либо дополнительного текста до или после, со всеми 9 ключами:
        {
          "lender": "<текст или 'Данные не определены'>",
          "borrower": "<текст или 'Данные не определены'>",
          "credit_type": "<standard / consumer / mortgage / credit_line / overdraft / refinancing / unclear / not_defined>",
          "credit_amount": "<текст, ссылка на приложение или 'Данные не определены'>",
          "currency": "<RUB / USD / EUR / other / not_defined>",
          "interest_rate": "<текст или 'Данные не определены'>",
          "rate_type": "<fixed / variable / unclear / not_defined>",
          "term": "<текст или 'Данные не определены'>",
          "psk": "<текст, 'Не применимо' или 'Данные не определены'>"
        }
      context_k: 8
      temperature: 0.0
      max_tokens: 800

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "кредитор заемщик преамбула сумма кредита валюта кредита процентная ставка срок кредита кредитная линия овердрафт потребительский кредит ипотечный кредит вид кредитной конструкции"
      preferred_unit_types:
        - obligation
        - general_provision
        - payment_term
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - definitions
        - obligations
      negative_keywords:
        - "означает"
        - "в целях настоящего"
        - "график платежей"
        - "комиссия"
        - "обеспечение"
      position_bias:
        preferred_range: [0.0, 0.35]
        boost: 0.20
        scope: segment
      context_k: 8
      max_chunks: 12
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
        - "invoice"
      preferred_clause_functions:
        - "definitions"
        - "obligations"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 50
      max_snippet_length: 700

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1300

      compact_output: false

      presence_signal:
        field: "credit_subject_extraction_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста кредитного договора
        ключевые параметры кредита: кредитора, заемщика, тип кредитной
        конструкции, сумму, валюту, ставку, срок, ПСК.
        Не анализируй комиссии, базу начисления процентов, механизм
        плавающей ставки, структуру погашения, обеспечение, ковенанты
        или последствия нарушения — они покрыты отдельными checks.
        Не оценивай риски. Анализируй только текст договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля (все ключи должны присутствовать в ответе):

        0. credit_subject_extraction_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (credit_type, currency, rate_type, psk) ≠ "not_defined";
           - "missing" — если все четыре содержательных поля = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - credit_type = "not_defined";
           - currency = "not_defined";
           - rate_type = "not_defined";
           - psk = "not_defined";
           - lender, borrower, credit_amount, interest_rate, term = "Данные не определены";
           - не выполняй остальные шаги.

        1. lender — наименование кредитора.
           Если данных нет — "Данные не определены".
           Если данные противоречивы — "Не удалось определить".

        2. borrower — наименование заемщика.
           Если данных нет — "Данные не определены".
           Если данные противоречивы — "Не удалось определить".

        3. credit_type — вид кредитной конструкции:
           - "standard" — обычный кредит без спецификации;
           - "consumer" — потребительский кредит (заёмщик — физлицо на потребительские цели);
           - "mortgage" — ипотечный кредит (на приобретение недвижимости с залогом);
           - "credit_line" — кредитная линия (возобновляемая / невозобновляемая, с лимитом выдачи или задолженности);
           - "overdraft" — овердрафт к расчётному счёту;
           - "refinancing" — рефинансирование;
           - "unclear" — конструкция упомянута, но её тип нельзя надёжно определить;
           - "not_defined" — вид конструкции прямо не указан.

        4. credit_amount — сумма кредита.
           Правила:
           - если сумма прямо указана, возвращай её дословно: "10 000 000 рублей";
           - если сумма определяется через приложение / график / индивидуальные
             условия, возвращай ссылку: "Согласно Приложению №1 (Индивидуальные условия)";
           - если данных нет — "Данные не определены";
           - если данные противоречивы — "Не удалось определить".

        5. currency — валюта кредита:
           - "RUB" / "USD" / "EUR" / "other" / "not_defined".

        6. interest_rate — процентная ставка.
           Правила:
           - если ставка фиксированная — возвращай дословно: "15% годовых";
           - если ставка плавающая — возвращай формулу без деталей механизма пересмотра:
             "Ключевая ставка Банка России + 3,5 п.п. годовых";
           - если данных нет — "Данные не определены";
           - если данные противоречивы — "Не удалось определить".

        7. rate_type — тип ставки:
           - "fixed" — фиксированная ставка;
           - "variable" — плавающая (привязка к ключевой ставке ЦБ, RUONIA, MOSPRIME и т.п.);
           - "unclear" — есть упоминание ставки, но тип нельзя надёжно определить;
           - "not_defined" — ставка прямо не указана.

        8. term — срок кредита.
           Правила:
           - если срок прямо указан — возвращай дословно: "3 года", "60 месяцев";
           - если данных нет — "Данные не определены";
           - если данные противоречивы — "Не удалось определить".

        9. psk — полная стоимость кредита:
           - "present" — ПСК прямо указана в договоре;
           - "not_applicable" — для корпоративных кредитов (заёмщик — юр. лицо / ИП)
             при отсутствии упоминания ПСК;
           - "not_defined" — потребительский кредит, но ПСК отсутствует в тексте;
             либо тип кредита неясен и ПСК не упомянута.
        </task>

        <context_rules>
        - Перед остальными полями заполни credit_subject_extraction_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все enum-поля = "not_defined", все текстовые поля = "Данные не определены".
        - Используй только релевантные фрагменты контекста.
        - Не подставляй нормы закона, обычную практику или предположения вместо текста договора.
        - Не делай выводов по типовой структуре кредитного договора.
        - Если параметр определяется через приложение, график или индивидуальные условия,
          и это прямо видно из текста, считай его определённым и верни ссылку на документ.
        - Не углубляйся в механизм плавающей ставки (периодичность пересмотра, уведомление) —
          это отдельный check variable_rate_check.
        - Не фиксируй структуру погашения (аннуитет, дифференцированные платежи, график) —
          это отдельный check repayment_schedule_and_early_repayment_check.
        - Для psk: корпоративный кредит без упоминания ПСК — "not_applicable", а не "not_defined".
        - При конфликтующих фрагментах приоритет — более позднему или более специальному положению;
          если конфликт неустраним — используй "not_defined" и "Не удалось определить".
        - Не используй null, None, пустые строки или "-".
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни сторон, ни суммы, ни ставки, ни срока.
           → presence = "missing";
             credit_type = currency = rate_type = psk = "not_defined";
             lender, borrower, credit_amount, interest_rate, term = "Данные не определены".

        2. Параметры определяются через приложение / индивидуальные условия.
           "Сумма и срок определяются Индивидуальными условиями (Приложение №1)".
           → presence = "present";
             credit_amount = "Согласно Приложению №1";
             term = "Согласно Приложению №1";
             остальные параметры заполняются по тексту договора.

        3. Противоречие между фрагментами.
           В разных частях указаны разные суммы или ставки.
           → presence = "unclear";
             соответствующие enum-поля = "not_defined";
             соответствующие текстовые поля = "Не удалось определить".

        4. Корпоративный кредит без ПСК.
           Заёмщик — юр. лицо / ИП, ПСК в тексте не упомянута (это норма
           по ФЗ-353, ПСК обязательна только для потребительских).
           → psk = "not_applicable";
             presence всё равно "present", если другие поля определены.
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для credit_subject_extraction_presence используй только: "present", "missing", "unclear".
        - Для credit_type используй только: "standard", "consumer", "mortgage", "credit_line", "overdraft", "refinancing", "unclear", "not_defined".
        - Для currency используй только: "RUB", "USD", "EUR", "other", "not_defined".
        - Для rate_type используй только: "fixed", "variable", "unclear", "not_defined".
        - Для psk используй только: "present", "not_applicable", "not_defined".
        - Fallback при отсутствии данных:
          * lender, borrower → "Данные не определены";
          * credit_amount, interest_rate, term → "Данные не определены".
        - Fallback при противоречии или неоднозначности:
          * все текстовые поля → "Не удалось определить";
          * соответствующие enum-поля → "not_defined" (или "unclear", если это значение допустимо).
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "credit_subject_extraction_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования по базовым параметрам кредита. Внутреннее агрегатное signal-поле."
          required: true

        - name: "lender"
          type: "string"
          presentation: "fact"
          label: "Кредитор"
          display_in_grid: true
          display_priority: 1
          description: >
            Наименование кредитора.
            Fallback: "Данные не определены" / "Не удалось определить".
          required: true

        - name: "borrower"
          type: "string"
          presentation: "fact"
          label: "Заемщик"
          display_in_grid: true
          display_priority: 2
          description: >
            Наименование заемщика.
            Fallback: "Данные не определены" / "Не удалось определить".
          required: true

        - name: "credit_type"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["standard", "consumer", "mortgage", "credit_line", "overdraft", "refinancing", "unclear", "not_defined"]
          display_in_grid: false
          description: "Вид кредитной конструкции. Внутреннее enum-поле."
          required: true

        - name: "credit_amount"
          type: "string"
          presentation: "fact"
          label: "Сумма кредита"
          display_in_grid: true
          display_priority: 3
          description: >
            Сумма кредита или ссылка на приложение / индивидуальные условия.
            Fallback: "Данные не определены" / "Не удалось определить".
          required: true

        - name: "currency"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["RUB", "USD", "EUR", "other", "not_defined"]
          display_in_grid: false
          description: "Валюта кредита. Детально — в currency_and_fx_clause_check. Внутреннее enum-поле."
          required: true

        - name: "interest_rate"
          type: "string"
          presentation: "fact"
          label: "Процентная ставка"
          display_in_grid: true
          display_priority: 4
          description: >
            Значение ставки или формула (без деталей механизма пересмотра — они в variable_rate_check).
            Fallback: "Данные не определены" / "Не удалось определить".
          required: true

        - name: "rate_type"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["fixed", "variable", "unclear", "not_defined"]
          display_in_grid: false
          description: "Тип процентной ставки. Внутреннее enum-поле."
          required: true

        - name: "term"
          type: "string"
          presentation: "fact"
          label: "Срок кредита"
          display_in_grid: true
          display_priority: 5
          description: >
            Срок кредита.
            Fallback: "Данные не определены" / "Не удалось определить".
          required: true

        - name: "psk"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["present", "not_applicable", "not_defined"]
          display_in_grid: false
          description: >
            Статус ПСК: present / not_applicable (для корпоративных кредитов) / not_defined.
            Детально — в interest_psk_fees_check. Внутреннее enum-поле.
          required: true

      store_payload: true

  - id: lender_license_check
    name: "Статус и лицензия кредитора"
    description: >
      Проверяет, что кредитор обозначен как банк/кредитная организация
      и содержатся признаки лицензии.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "банк"
        - "кредитная организация"
        - "лицензия банка россии"
        - "генеральная лицензия"
        - "цб рф"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)лиценз[ияе].{0,40}(банка\\s+россии|цб|центрального\\s+банка)"
        - "(?i)(банк|кредитная\\s+организация)"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется кредитный договор по § 2 Главы 42 ГК РФ.
        Проверяется только один вопрос: статус кредитора и наличие лицензии.

        Нормативный ориентир:
        - ст. 819 ГК РФ — кредитором по кредитному договору может быть
          только банк или иная кредитная организация
        - ФЗ № 395-1 «О банках и банковской деятельности»

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора,
          а чего прямо нет.
        - Не оценивай серьёзность риска.
        - Если кредитор не обозначен как банк или кредитная организация,
          это может указывать на проблему валидности договора, но ты
          только фиксируешь факт, не делаешь выводов.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Как идентифицирован кредитор (банк / кредитная организация / иное).
        2. Есть ли ссылка на лицензию Банка России.
        3. Реквизиты лицензии (номер, дата, тип).
        4. Сформулируй понятный для юриста статус кредитора.

        [ПРАВИЛА]
        1. Используй только текст документа. Не подставляй нормы закона
           вместо текста договора.
        2. Если параметр прямо указан — возвращай его дословно.
        3. Если параметр отсутствует в тексте:
           - для текстовых полей (license_details, lender_status_display) —
             возвращай "Данные не определены";
           - для enum-полей (lender_status, license_reference_status) —
             возвращай "not_defined".
        4. Если лицензия упомянута, но номер/дата не указаны —
           license_reference_status = "present",
           license_details = "Лицензия упомянута, реквизиты не указаны".
        5. Если анализируется дополнительное соглашение, в котором
           реквизиты кредитора не повторяются (ссылка на основной договор) —
           возвращай "Не указаны в данном документе".
        6. Никогда не выдумывай номер или дату лицензии.
        7. Никогда не используй null, None, пустые строки или "-".
        8. В evidence включай только текст договора.
        9. Верни РОВНО один JSON-объект со всеми 4 ключами без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [РОССИЙСКАЯ ПРАКТИКА — ПОДСКАЗКИ]
        - Типичная формулировка: «ПАО "Сбербанк" (Генеральная лицензия
          Банка России на осуществление банковских операций № 1481
          от 11.08.2015 г.)».
        - Варианты: «Генеральная лицензия», «Лицензия на осуществление
          банковских операций», «Универсальная лицензия».
        - Кредитор может быть обозначен как «Банк», «Кредитная организация»,
          «Небанковская кредитная организация (НКО)».
        - В дополнительных соглашениях реквизиты часто не дублируются.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — полная формулировка лицензии:
        Фрагмент:
        "Кредитор — ПАО «Сбербанк России» (Генеральная лицензия Банка России
         на осуществление банковских операций № 1481 от 11.08.2015 г.),
         именуемый в дальнейшем «Банк»."

        Ответ:
        {
          "lender_status": "bank",
          "license_reference_status": "present",
          "license_details": "Генеральная лицензия Банка России № 1481 от 11.08.2015 г.",
          "lender_status_display": "Банк (лицензия ЦБ РФ № 1481)"
        }

        Пример 2 — лицензия упомянута без реквизитов:
        Фрагмент:
        "Кредитор — АО «Коммерческий банк «Развитие», действующий на основании
         лицензии Банка России."

        Ответ:
        {
          "lender_status": "bank",
          "license_reference_status": "present",
          "license_details": "Лицензия упомянута, реквизиты не указаны",
          "lender_status_display": "Банк (лицензия без реквизитов)"
        }

        Пример 3 — статус неясен, лицензия не упомянута:
        Фрагмент:
        "Кредитор предоставляет Заёмщику денежные средства на условиях,
         указанных в разделе 2 настоящего Договора."

        Ответ:
        {
          "lender_status": "unclear",
          "license_reference_status": "not_defined",
          "license_details": "Данные не определены",
          "lender_status_display": "Не определён"
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о наименовании кредитора и его статусе
           (банк / кредитная организация / иное).
        2. Найди прямую цитату о лицензии (номер, дата, тип).
        3. Если лицензия упомянута, но без реквизитов — зафиксируй это
           отдельно, не выдумывай номер.
        4. Сформулируй lender_status_display как краткую понятную фразу
           для юриста (например, «Банк (лицензия ЦБ РФ № 1481)»).
        5. Если данных нет — верни fallback по правилу 3.

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь РОВНО одним JSON-объектом без какого-либо дополнительного текста до или после, со всеми 4 ключами:
        {
          "lender_status": "<bank / credit_organization / unclear / not_defined>",
          "license_reference_status": "<present / not_defined>",
          "license_details": "<текст, 'Лицензия упомянута, реквизиты не указаны', 'Не указаны в данном документе' или 'Данные не определены'>",
          "lender_status_display": "<понятная фраза для юриста или 'Данные не определены'>"
        }
      context_k: 8
      temperature: 0.0
      max_tokens: 350

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "лицензия банка россии банк кредитная организация цб рф"
      preferred_unit_types:
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - boilerplate
      negative_keywords:
        - "означает"
        - "в целях настоящего"
        - "сумма кредита"
        - "проценты"
      position_bias:
        preferred_range: [0.0, 0.25]
        boost: 0.20
        scope: segment
      context_k: 8
      max_chunks: 10
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
        - "invoice"
      preferred_clause_functions:
        - "boilerplate"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 35
      max_snippet_length: 550

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 700

      compact_output: false

      presence_signal:
        field: "lender_license_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста кредитного договора сведения
        о статусе кредитора и наличии лицензии Банка России.
        Не анализируй условия кредита, комиссии, обеспечение или иные темы.
        Не оценивай риски. Анализируй только текст договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля (все ключи должны присутствовать в ответе):

        0. lender_license_check_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (lender_status, license_reference_status) ≠ "not_defined";
           - "missing" — если оба содержательных поля = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - lender_status = "not_defined";
           - license_reference_status = "not_defined";
           - license_details = "Данные не определены";
           - lender_status_display = "Данные не определены";
           - не выполняй остальные шаги.

        1. lender_status — статус кредитора:
           - "bank" — кредитор прямо обозначен как банк (ПАО/АО банк и т.п.);
           - "credit_organization" — кредитор обозначен как кредитная организация,
             небанковская кредитная организация (НКО) или аналогично, но не как банк;
           - "unclear" — кредитор упомянут, но его статус (банк / КО / иное) нельзя надёжно определить;
           - "not_defined" — статус кредитора прямо не указан.

        2. license_reference_status — наличие ссылки на лицензию:
           - "present" — лицензия Банка России упомянута в любой форме
             (с реквизитами или без);
           - "not_defined" — ссылка на лицензию отсутствует.

        3. license_details — реквизиты лицензии.
           Правила:
           - если лицензия с реквизитами — возвращай тип, номер и дату дословно:
             "Генеральная лицензия Банка России № 1481 от 11.08.2015 г.";
           - если лицензия упомянута без номера/даты —
             "Лицензия упомянута, реквизиты не указаны";
           - если анализируется доп. соглашение и реквизиты не дублируются —
             "Не указаны в данном документе";
           - если лицензия вообще не упомянута — "Данные не определены";
           - если данные противоречивы — "Не удалось определить".
           Никогда не выдумывай номер или дату лицензии.

        4. lender_status_display — краткая понятная фраза для юриста:
           - "Банк (лицензия ЦБ РФ № 1481)" — если известны и статус, и номер;
           - "Банк (лицензия без реквизитов)" — если лицензия упомянута без номера;
           - "Банк" — если статус определён, лицензия не упомянута;
           - "Кредитная организация" — для НКО;
           - "Не определён" — если lender_status = "unclear";
           - "Данные не определены" — если lender_status = "not_defined";
           - "Не удалось определить" — при противоречии или неоднозначности.
        </task>

        <context_rules>
        - Перед остальными полями заполни lender_license_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все enum-поля = "not_defined", все текстовые поля = "Данные не определены".
        - Используй только релевантные фрагменты контекста.
        - Не подставляй нормы закона, обычную практику или предположения вместо текста договора.
        - Не делай выводов по типовой структуре кредитного договора.
        - Никогда не выдумывай реквизиты лицензии (номер, дату, тип), которых нет в тексте.
        - Если лицензия упомянута без реквизитов —
          license_reference_status = "present",
          license_details = "Лицензия упомянута, реквизиты не указаны".
        - Если анализируется дополнительное соглашение, в котором реквизиты кредитора
          не повторяются (ссылка на основной договор) — license_details = "Не указаны в данном документе".
        - Если в разных фрагментах указаны разные реквизиты и конфликт нельзя разрешить —
          license_details = "Не удалось определить".
        - Не используй null, None, пустые строки или "-".
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни упоминания статуса кредитора, ни лицензии.
           → presence = "missing";
             lender_status = license_reference_status = "not_defined";
             license_details = lender_status_display = "Данные не определены".

        2. Лицензия упомянута без реквизитов.
           "Действующий на основании лицензии Банка России" без номера и даты.
           → presence = "present";
             lender_status = "bank";
             license_reference_status = "present";
             license_details = "Лицензия упомянута, реквизиты не указаны";
             lender_status_display = "Банк (лицензия без реквизитов)".

        3. Противоречие между фрагментами.
           В разных частях указаны разные номера лицензии.
           → presence = "unclear";
             license_reference_status = "present";
             license_details = "Не удалось определить";
             lender_status_display = "Не удалось определить".

        4. Доп. соглашение со ссылкой на основной договор.
           Анализируется amendment, где реквизиты кредитора не дублируются.
           → presence = "present";
             lender_status заполняется по тексту, если он есть, иначе "not_defined";
             license_details = "Не указаны в данном документе".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для lender_license_check_presence используй только: "present", "missing", "unclear".
        - Для lender_status используй только: "bank", "credit_organization", "unclear", "not_defined".
        - Для license_reference_status используй только: "present", "not_defined".
        - Fallback при отсутствии данных:
          * license_details → "Данные не определены";
          * lender_status_display → "Данные не определены".
        - Fallback при противоречии или неоднозначности:
          * license_details → "Не удалось определить";
          * lender_status_display → "Не удалось определить".
        - Специальные значения:
          * license_details = "Лицензия упомянута, реквизиты не указаны" — если лицензия без номера/даты;
          * license_details = "Не указаны в данном документе" — для доп. соглашений без дублирования реквизитов.
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "lender_license_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования по статусу и лицензии кредитора. Внутреннее агрегатное signal-поле."
          required: true

        - name: "lender_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["bank", "credit_organization", "unclear", "not_defined"]
          display_in_grid: false
          description: "Статус кредитора. Внутреннее enum-поле."
          required: true

        - name: "license_reference_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["present", "not_defined"]
          display_in_grid: false
          description: "Есть ли ссылка на лицензию Банка России. Внутреннее enum-поле."
          required: true

        - name: "lender_status_display"
          type: "string"
          presentation: "fact"
          label: "Статус кредитора"
          display_in_grid: true
          display_priority: 1
          description: >
            Понятная формулировка статуса кредитора для юриста.
            Примеры: "Банк (лицензия ЦБ РФ № 1481)", "Банк (лицензия без реквизитов)",
            "Кредитная организация", "Не определён".
            Fallback: "Данные не определены" / "Не удалось определить".
          required: true

        - name: "license_details"
          type: "string"
          presentation: "fact"
          label: "Реквизиты лицензии"
          display_in_grid: true
          display_priority: 2
          description: >
            Реквизиты лицензии кредитора (тип, номер, дата).
            Специальные значения: "Лицензия упомянута, реквизиты не указаны",
            "Не указаны в данном документе".
            Fallback: "Данные не определены" / "Не удалось определить".
          required: true

      store_payload: true

  - id: interest_psk_fees_check
    name: "Проценты, ПСК и дополнительные платежи"
    description: >
      Проверяет процентную ставку, ПСК, комиссии и прозрачность общей стоимости
      кредита, а также базу начисления процентов.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "процентная ставка"
        - "полная стоимость кредита"
        - "пск"
        - "комиссия"
        - "плата за обслуживание"
        - "проценты за пользование"
        - "иные платежи"
        - "база начисления"
        - "остаток ссудной задолженности"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)процентн(ая|ой)\\s+ставк"
        - "(?i)(полная\\s+стоимость\\s+кредита|ПСК)"
        - "(?i)комисси|плата\\s+за\\s+обслуживан"
        - "(?i)(база|порядок)\\s+начислен"
        - "(?i)остат(ок|ка)\\s+ссудн"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется кредитный договор.
        Проверяется только один вопрос: проценты, ПСК, комиссии и база
        начисления.

        Нормативный ориентир:
        - ст. 809, 819 ГК РФ — начисление процентов и кредитный договор.
        - ст. 6 ФЗ № 353-ФЗ — ПСК (только для потребительских кредитов).

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора,
          а чего прямо нет.
        - Не оценивай серьёзность риска.
        - Ставку как значение фиксирует отдельный check
          (credit_subject_extraction). Здесь фиксируем только статус её
          раскрытия и детали — комиссии, ПСК, базу начисления.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Указана ли процентная ставка (статус).
        2. Указана ли полная стоимость кредита (ПСК).
        3. Есть ли комиссии и иные дополнительные платежи (за выдачу,
           ведение счетов, резервирование лимита, платежи по тарифам
           банка).
        4. Какая установлена база начисления процентов (на остаток
           ссудной задолженности / на первоначальную сумму кредита /
           иная).
        5. Сформулируй понятные для юриста текстовые расшифровки по
           комиссиям и базе начисления.

        [ПРАВИЛА]
        1. Используй только текст документа. Не подставляй нормы закона
           вместо текста договора.
        2. Если параметр прямо указан в договоре — возвращай его дословно
           или делай точную выжимку.
        3. Если комиссии определены через Приложение, График платежей
           или тарифы — возвращай ссылку на них (например, «Определяются
           по Тарифам Банка», «Согласно Приложению №3»).
        4. Если параметр в договоре прямо не указан:
           - для текстовых полей (fees_display, calculation_base_display) —
             возвращай «Данные не определены»;
           - для enum-полей (interest_rate_status, psk_status, fees_status,
             calculation_base) — возвращай "not_defined".
        5. Для ПСК: если заёмщик — юр. лицо / ИП (корпоративный кредит)
           и ПСК не упомянута — psk_status = "not_applicable",
           а не "not_defined".
        6. Никогда не выдумывай базу начисления. Если в тексте прямо
           не написано, от какой суммы считаются проценты, возвращай
           calculation_base = "unclear", calculation_base_display =
           «Не определена».
        7. Никогда не используй null, None, пустые строки или "-".
        8. Верни РОВНО один JSON-объект со всеми 6 ключами без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [РОССИЙСКАЯ ПРАКТИКА — ПОДСКАЗКИ]
        - Опасные формулировки (vague): «иные комиссии согласно Тарифам
          Банка» или «дополнительные платежи по усмотрению Кредитора».
          Это ставит заёмщика в зависимость от односторонних решений банка.
        - База начисления: стандартный и законный вариант — начисление
          «на остаток ссудной (фактической) задолженности»
          (outstanding_balance). Начисление на первоначальную сумму
          лимита (principal) без учёта погашений — редкая кабальная схема.
        - В корпоративных кредитах ПСК не применяется (not_applicable).
        - Формулировки базы начисления:
            * «на остаток ссудной задолженности» →
              outstanding_balance;
            * «на фактическую задолженность» → outstanding_balance;
            * «на первоначальную сумму кредита» → principal;
            * «на сумму выданного транша» → outstanding_balance
              (если далее учитываются погашения) или principal;
            * отсутствие указания базы → unclear.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — условия полностью определены и прозрачны:
        Фрагмент:
        "Процентная ставка составляет 15% годовых. Начисление процентов
         производится на остаток ссудной задолженности Заёмщика. За выдачу
         кредита взимается единовременная комиссия в размере 5 000 рублей.
         Иные комиссии не предусмотрены."

        Ответ:
        {
          "interest_rate_status": "present",
          "psk_status": "not_applicable",
          "fees_status": "enumerated",
          "calculation_base": "outstanding_balance",
          "fees_display": "Единовременная комиссия за выдачу 5 000 руб., иные комиссии отсутствуют",
          "calculation_base_display": "На остаток ссудной задолженности"
        }

        Пример 2 — неясные комиссии по тарифам и отсутствие базы начисления:
        Фрагмент:
        "Процентная ставка по Договору — 12% годовых. Заемщик обязуется
         оплачивать комиссии за совершение операций по ссудному счету
         в соответствии с Тарифами Кредитора, действующими на дату
         проведения операции."

        Ответ:
        {
          "interest_rate_status": "present",
          "psk_status": "not_applicable",
          "fees_status": "vague",
          "calculation_base": "unclear",
          "fees_display": "Комиссии за операции по ссудному счету по Тарифам Кредитора (открытый перечень)",
          "calculation_base_display": "Не определена"
        }

        Пример 3 — данные полностью отсутствуют:
        Фрагмент:
        "Договор вступает в силу с момента его подписания сторонами."

        Ответ:
        {
          "interest_rate_status": "not_defined",
          "psk_status": "not_defined",
          "fees_status": "not_defined",
          "calculation_base": "not_defined",
          "fees_display": "Данные не определены",
          "calculation_base_display": "Данные не определены"
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о процентной ставке и определи её статус.
        2. Найди упоминание ПСК. Если заёмщик юр. лицо и ПСК нет —
           верни "not_applicable".
        3. Найди упоминание комиссий. Они перечислены закрытым списком
           (enumerated), зависят от тарифов без конкретики (vague) или
           прямо указано, что их нет (none_stated)?
        4. Найди упоминание базы начисления процентов. Есть ли слова
           «на остаток задолженности» / «на фактическую задолженность»?
           Не выдумывай базу, если её нет в фрагменте.
        5. Сформулируй понятные для юриста тексты для fees_display
           и calculation_base_display.
        6. Проверь отсутствие null и пустых строк.

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь РОВНО одним JSON-объектом без какого-либо дополнительного текста до или после, со всеми 6 ключами:
        {
          "interest_rate_status": "<present / not_defined>",
          "psk_status": "<present / not_defined / not_applicable>",
          "fees_status": "<none_stated / enumerated / vague / not_defined>",
          "calculation_base": "<outstanding_balance / principal / unclear / not_defined>",
          "fees_display": "<текст, описание комиссий / ссылка на тарифы или 'Данные не определены'>",
          "calculation_base_display": "<текст, описание базы начисления или 'Данные не определены'>"
        }
      context_k: 8
      temperature: 0.0
      max_tokens: 500

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "процентная ставка ПСК полная стоимость кредита комиссия плата за обслуживание база начисления процентов остаток ссудной задолженности фактическая задолженность начисление на остаток начисление на первоначальную сумму порядок начисления процентов"
      preferred_unit_types:
        - obligation
        - payment_term
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - definitions
        - obligations
      negative_keywords:
        - "означает"
        - "в целях настоящего"
        - "предмет договора"
        - "срок кредита"
        - "обеспечение"
      position_bias:
        preferred_range: [0.10, 0.50]
        boost: 0.18
        scope: segment
      context_k: 8
      max_chunks: 10
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
        - "invoice"
      preferred_clause_functions:
        - "definitions"
        - "obligations"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 45
      max_snippet_length: 650

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 950

      compact_output: false

      presence_signal:
        field: "interest_psk_fees_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста кредитного договора сведения
        о процентной ставке (статус раскрытия), ПСК, комиссиях и дополнительных
        платежах, а также о базе начисления процентов.
        Не анализируй значение ставки (оно извлекается в credit_subject_extraction),
        обеспечение, ковенанты или последствия нарушения.
        Не оценивай риски. Анализируй только текст договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля (все ключи должны присутствовать в ответе):

        0. interest_psk_fees_check_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (interest_rate_status, psk_status, fees_status, calculation_base)
             ≠ "not_defined";
           - "missing" — если все четыре содержательных поля = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Важно: calculation_base = "unclear" и psk_status = "not_applicable"
           считаются ≠ "not_defined" и дают presence = "present".

           Если presence = "missing":
           - interest_rate_status = "not_defined";
           - psk_status = "not_defined";
           - fees_status = "not_defined";
           - calculation_base = "not_defined";
           - fees_display = "Данные не определены";
           - calculation_base_display = "Данные не определены";
           - не выполняй остальные шаги.

        1. interest_rate_status — наличие процентной ставки:
           - "present" — если в тексте прямо указана процентная ставка
             (значение, формула или ссылка на приложение с тарифами);
           - "not_defined" — если процентная ставка прямо не упомянута.
           Не извлекай значение ставки — только факт её наличия.

        2. psk_status — статус раскрытия ПСК:
           - "present" — ПСК прямо указана в договоре (числовое значение
             или ссылка на Приложение с расчётом);
           - "not_applicable" — для корпоративных кредитов (заёмщик —
             юр. лицо / ИП) при отсутствии упоминания ПСК;
           - "not_defined" — потребительский кредит, но ПСК отсутствует
             в тексте; либо тип кредита неясен и ПСК не упомянута.

        3. fees_status — раскрытие комиссий и дополнительных платежей:
           - "none_stated" — договор прямо указывает, что комиссии
             и дополнительные платежи отсутствуют;
           - "enumerated" — комиссии перечислены закрытым списком
             с конкретными размерами или ставками;
           - "vague" — комиссии отсылают к тарифам банка, открытым
             перечням или формулировкам вроде «иные платежи по усмотрению
             Кредитора» без конкретики;
           - "not_defined" — вопрос комиссий прямо не урегулирован.

        4. calculation_base — база начисления процентов:
           - "outstanding_balance" — начисление на остаток ссудной
             (фактической) задолженности;
           - "principal" — начисление на первоначальную сумму кредита
             (лимита) без учёта погашений;
           - "unclear" — начисление процентов упомянуто, но база прямо
             не указана;
           - "not_defined" — вопрос начисления процентов вообще не
             урегулирован в тексте.

        5. fees_display — краткое описание комиссий на русском языке.
           Правила:
           - если комиссии перечислены — кратко опиши: "Единовременная
             комиссия за выдачу 5 000 руб., иные комиссии отсутствуют";
           - если комиссии по тарифам — "Комиссии по Тарифам Кредитора
             (открытый перечень)";
           - если комиссий нет — "Комиссии не предусмотрены";
           - если данных нет — "Данные не определены";
           - если данные противоречивы — "Не удалось определить".

        6. calculation_base_display — краткая формулировка базы начисления
           на русском языке.
           Правила:
           - "На остаток ссудной задолженности" — для outstanding_balance;
           - "На первоначальную сумму кредита" — для principal;
           - "Не определена" — для unclear;
           - "Данные не определены" — для not_defined;
           - "Не удалось определить" — при противоречии.
        </task>

        <context_rules>
        - Перед остальными полями заполни interest_psk_fees_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все enum-поля = "not_defined", все display-поля = "Данные не определены".
        - Используй только релевантные фрагменты контекста.
        - Не подставляй нормы закона, обычную практику или предположения вместо текста договора.
        - Не делай выводов по типовой структуре кредитного договора.
        - Не извлекай значение процентной ставки — только её наличие (значение извлекает credit_subject_extraction).
        - Для корпоративных кредитов (заёмщик — юр. лицо / ИП) при отсутствии ПСК:
          psk_status = "not_applicable", а не "not_defined".
        - Если комиссии отсылают к тарифам банка без конкретного перечня —
          fees_status = "vague".
        - Никогда не выдумывай базу начисления: если в тексте нет прямого указания,
          от какой суммы считаются проценты, — calculation_base = "unclear",
          calculation_base_display = "Не определена".
        - Если в разных фрагментах указаны разные данные и конфликт нельзя
          разрешить по тексту: enum → "not_defined", display → "Не удалось определить".
        - Не используй null, None, пустые строки или "-".
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни ставки, ни ПСК, ни комиссий, ни базы начисления.
           → presence = "missing";
             все enum-поля = "not_defined";
             fees_display = calculation_base_display = "Данные не определены".

        2. Ставка есть, но комиссии и база не раскрыты.
           "Процентная ставка — 15% годовых" без упоминания комиссий и базы.
           → presence = "present";
             interest_rate_status = "present";
             fees_status = "not_defined";
             calculation_base = "unclear";
             calculation_base_display = "Не определена".

        3. Противоречие между фрагментами.
           В одной части — начисление на остаток, в другой — на первоначальную сумму.
           → presence = "unclear";
             calculation_base = "not_defined";
             calculation_base_display = "Не удалось определить".

        4. Корпоративный кредит без ПСК.
           Заёмщик — ООО, ПСК не упомянута (норма по ФЗ-353).
           → psk_status = "not_applicable";
             presence = "present" (если другие поля определены).
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для interest_psk_fees_check_presence используй только: "present", "missing", "unclear".
        - Для interest_rate_status используй только: "present", "not_defined".
        - Для psk_status используй только: "present", "not_defined", "not_applicable".
        - Для fees_status используй только: "none_stated", "enumerated", "vague", "not_defined".
        - Для calculation_base используй только: "outstanding_balance", "principal", "unclear", "not_defined".
        - Fallback при отсутствии данных:
          * fees_display → "Данные не определены";
          * calculation_base_display → "Данные не определены".
        - Fallback при противоречии или неоднозначности:
          * fees_display → "Не удалось определить";
          * calculation_base_display → "Не удалось определить".
        - Специальные значения:
          * calculation_base_display = "Не определена" — если calculation_base = "unclear"
            (база начисления не указана, но проценты упомянуты).
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "interest_psk_fees_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования по процентам, ПСК, комиссиям и базе начисления. Внутреннее агрегатное signal-поле."
          required: true

        - name: "interest_rate_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["present", "not_defined"]
          display_in_grid: false
          description: "Наличие процентной ставки в договоре. Внутреннее enum-поле."
          required: true

        - name: "psk_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["present", "not_defined", "not_applicable"]
          display_in_grid: false
          description: "Статус раскрытия ПСК. not_applicable — для корпоративных кредитов. Внутреннее enum-поле."
          required: true

        - name: "fees_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["none_stated", "enumerated", "vague", "not_defined"]
          display_in_grid: false
          description: "Раскрытие комиссий и дополнительных платежей. Внутреннее enum-поле."
          required: true

        - name: "calculation_base"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["outstanding_balance", "principal", "unclear", "not_defined"]
          display_in_grid: false
          description: "База начисления процентов. unclear — проценты упомянуты, но база не указана. Внутреннее enum-поле."
          required: true

        - name: "fees_display"
          type: "string"
          presentation: "fact"
          label: "Комиссии и доп. платежи"
          display_in_grid: true
          display_priority: 1
          description: >
            Текстовое описание комиссий и дополнительных расходов по кредиту.
            Fallback: "Данные не определены" / "Не удалось определить".
          required: true

        - name: "calculation_base_display"
          type: "string"
          presentation: "fact"
          label: "База начисления %"
          display_in_grid: true
          display_priority: 2
          description: >
            Описание базы начисления процентов (на остаток ссудной задолженности или иное).
            Специальное значение: "Не определена" — если база не указана, но проценты есть.
            Fallback: "Данные не определены" / "Не удалось определить".
          required: true

      store_payload: true

  - id: repayment_schedule_and_early_repayment_check
    name: "График погашения и досрочное погашение"
    description: >
      Проверяет наличие графика платежей, структуры погашения, условий
      досрочного возврата (полного и частичного) и наличия комиссии
      за досрочное погашение.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "график платежей"
        - "аннуитетный платеж"
        - "дифференцированный платеж"
        - "досрочное погашение"
        - "частичное досрочное погашение"
        - "полное досрочное погашение"
        - "комиссия за досрочное погашение"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)график\\s+платеж"
        - "(?i)аннуитетн|дифференцированн"
        - "(?i)досрочн(ое|ого)\\s+погашен"
        - "(?i)комисси.{0,30}досрочн"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется кредитный договор.
        Проверяется только один вопрос: порядок погашения, структура графика,
        досрочное погашение (полное и частичное) и комиссия за досрочное
        погашение.

        Нормативный ориентир:
        - ст. 810 ГК РФ — обязанность заёмщика вернуть сумму займа в срок
          и в порядке, предусмотренных договором
        - ст. 11 ФЗ № 353-ФЗ «О потребительском кредите (займе)» — право
          заёмщика на досрочный возврат, порядок уведомления, запрет комиссий
          за досрочное погашение для потребительских кредитов

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора,
          а чего прямо нет.
        - Не оценивай серьёзность риска.
        - Не путай потребительский и корпоративный кредит: для потребительских
          кредитов комиссия за досрочное погашение запрещена (ст. 11 п. 4
          353-ФЗ), для корпоративных — может быть установлена договором.
        - Полное и частичное досрочное погашение могут иметь разные режимы
          (сроки уведомления, порядок согласования). Если договор их
          различает — зафиксируй это.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Есть ли график платежей (и если есть — где он закреплён: в тексте,
           в Приложении, определяется отдельным документом).
        2. Какая структура погашения: аннуитетная, дифференцированная,
           иная (custom).
        3. Разрешено ли досрочное погашение (полное и/или частичное).
        4. Есть ли требование уведомления кредитора о досрочном погашении
           (и если да — срок уведомления, отдельно для полного и частичного,
           если договор их различает).
        5. Есть ли комиссия за досрочное погашение (и если да — размер,
           порядок взимания).
        6. Сформулируй понятные для юриста текстовые расшифровки:
           - repayment_schedule_display,
           - early_repayment_display,
           - early_repayment_commission_display.

        [ПРАВИЛА]
        1. Используй только текст документа. Не подставляй нормы закона
           вместо текста договора.
        2. Если параметр прямо указан в договоре — возвращай его дословно
           или делай точную выжимку.
        3. Если график / структура погашения определяется через Приложение
           или График платежей — возвращай ссылку на этот документ,
           например "Согласно Приложению №1", "Согласно Графику платежей",
           а не "Не установлено".
        4. Если параметр в договоре прямо не указан:
           - для сигнальных enum-полей (schedule_status, payment_structure,
             early_repayment_status, notice_requirement_for_early_repayment,
             early_repayment_commission_status) — возвращай "not_defined";
           - для текстовых user-facing полей (repayment_schedule_display,
             early_repayment_display, early_repayment_commission_display) —
             возвращай "Не установлено".
        5. Если тема по существу не применима к данному договору
           (например, договор не предполагает досрочного погашения как
           отдельного режима) — для user-facing поля возвращай
           "Не применимо", для сигнального — "not_defined".
        6. Если текст есть, но надёжный вывод сделать нельзя (например,
           формулировка допускает двусмысленное толкование) — для user-facing
           поля возвращай "Не удалось определить", для сигнального —
           "not_defined".
        7. Никогда не используй null, None, пустые строки или "-".
        8. Не выдумывай сроки уведомления и размеры комиссий, которых
           нет в тексте.
        9. При конфликтующих фрагментах отдавай приоритет более позднему
           или более специальному положению.
        10. В evidence включай только текст договора.
        11. Верни РОВНО один JSON-объект со всеми ключами из [ФОРМАТ ОТВЕТА] без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [РОССИЙСКАЯ ПРАКТИКА — ПОДСКАЗКИ]
        - График платежей может быть:
          * прямо в тексте договора;
          * в Приложении к договору («Согласно Приложению №1»);
          * в отдельном документе («Согласно Графику платежей,
            являющемуся неотъемлемой частью Договора»).
        - Аннуитет: «равными аннуитетными платежами», «ежемесячно равными
          платежами».
        - Дифференцированный: «равными долями основного долга, проценты
          на остаток», «дифференцированными платежами».
        - Bullet / погашение в конце срока: «погашение основного долга
          в дату окончания срока кредита» — это payment_structure = "custom".
        - Полное досрочное погашение по 353-ФЗ (для потребительских
          кредитов): уведомление за 30 календарных дней, если договором
          не установлен более короткий срок; комиссия запрещена.
        - Частичное досрочное погашение по 353-ФЗ: уведомление за 30
          календарных дней, если договором не установлен более короткий срок.
        - Для корпоративных кредитов сроки уведомления и комиссии
          устанавливаются договором; типичные формулировки — «уведомив
          Кредитора не менее чем за N рабочих дней», «без взимания комиссии»,
          «с уплатой комиссии в размере X% от суммы досрочного погашения».
        - Если договор прямо говорит «без комиссии» / «комиссия не
          взимается» — это не отсутствие регулирования, а явное условие.
          Для user-facing поля возвращай «Не взимается», для сигнального —
          early_repayment_commission_status = "not_applicable".

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — график, досрочное погашение, комиссия не взимается:
        Фрагмент:
        "Погашение кредита осуществляется аннуитетными платежами в соответствии
         с Графиком платежей (Приложение №1). Заёмщик вправе досрочно вернуть
         кредит полностью или частично, уведомив Кредитора не менее чем
         за 5 рабочих дней. Комиссия за досрочное погашение не взимается."

        Ответ:
        {
          "schedule_status": "present",
          "payment_structure": "annuity",
          "early_repayment_status": "allowed",
          "notice_requirement_for_early_repayment": "present",
          "early_repayment_commission_status": "not_applicable",
          "repayment_schedule_display": "Аннуитет, согласно Графику платежей (Приложение №1)",
          "early_repayment_display": "Разрешено (полное и частичное), уведомление за 5 рабочих дней",
          "early_repayment_commission_display": "Не взимается"
        }

        Пример 2 — график есть, структура не определена, досрочка с комиссией:
        Фрагмент:
        "Погашение кредита осуществляется в соответствии с Графиком платежей.
         Досрочное погашение допускается с письменного согласия Кредитора
         при условии уплаты комиссии в размере 1% от суммы досрочного
         погашения."

        Ответ:
        {
          "schedule_status": "present",
          "payment_structure": "not_defined",
          "early_repayment_status": "restricted",
          "notice_requirement_for_early_repayment": "not_defined",
          "early_repayment_commission_status": "present",
          "repayment_schedule_display": "Согласно Графику платежей",
          "early_repayment_display": "Разрешено только с письменного согласия Кредитора",
          "early_repayment_commission_display": "1% от суммы досрочного погашения"
        }

        Пример 3 — данных нет:
        Фрагмент:
        "Иные условия определяются в соответствии с действующим
         законодательством Российской Федерации."

        Ответ:
        {
          "schedule_status": "not_defined",
          "payment_structure": "not_defined",
          "early_repayment_status": "not_defined",
          "notice_requirement_for_early_repayment": "not_defined",
          "early_repayment_commission_status": "not_defined",
          "repayment_schedule_display": "Не установлено",
          "early_repayment_display": "Не установлено",
          "early_repayment_commission_display": "Не установлено"
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о графике платежей. Если график определён
           через Приложение / отдельный документ — зафиксируй ссылку.
        2. Найди прямую цитату о структуре погашения (аннуитет /
           дифференцированный / иная). Если структура не указана прямо —
           payment_structure = "not_defined".
        3. Найди прямую цитату о досрочном погашении. Различает ли договор
           полное и частичное? Есть ли требование согласия Кредитора?
        4. Найди требование уведомления и срок уведомления (отдельно для
           полного и частичного, если договор их различает).
        5. Найди упоминание комиссии за досрочное погашение. Если договор
           прямо говорит «без комиссии» — early_repayment_commission_status
           = "not_applicable", display = "Не взимается".
        6. Сформулируй все три user-facing display-поля кратко и по-русски.
        7. Если прямых цитат нет — верни fallback по правилам 4–6.

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь РОВНО одним JSON-объектом без какого-либо дополнительного текста до или после, со всеми 8 ключами:
        {
          "schedule_status": "<present / not_defined>",
          "payment_structure": "<annuity / differentiated / custom / not_defined>",
          "early_repayment_status": "<allowed / restricted / not_defined>",
          "notice_requirement_for_early_repayment": "<present / not_defined>",
          "early_repayment_commission_status": "<present / not_applicable / not_defined>",
          "repayment_schedule_display": "<текст или 'Не установлено'>",
          "early_repayment_display": "<текст или 'Не установлено'>",
          "early_repayment_commission_display": "<текст, 'Не взимается', 'Не применимо', 'Не установлено' или 'Не удалось определить'>"
        }
      context_k: 8
      temperature: 0.0
      max_tokens: 700

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "график платежей структура погашения аннуитетный дифференцированный платеж досрочное погашение полное частичное комиссия за досрочное погашение уведомление о досрочном погашении"
      preferred_unit_types:
        - obligation
        - payment_term
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - procedures
      negative_keywords:
        - "означает"
        - "в целях настоящего"
        - "процентная ставка"
        - "пск"
      position_bias:
        preferred_range: [0.20, 0.60]
        boost: 0.14
        scope: segment
      context_k: 8
      max_chunks: 10
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
        - "invoice"
      preferred_clause_functions:
        - "obligations"
        - "procedures"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 600

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1100

      compact_output: false

      presence_signal:
        field: "repayment_schedule_and_early_repayment_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста кредитного договора сведения
        о графике погашения, структуре платежей, условиях досрочного погашения
        (полного и частичного) и комиссии за досрочное погашение.
        Не анализируй обеспечение, ковенанты, проценты, ПСК или последствия
        нарушения. Не оценивай риски. Анализируй только текст договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля (все ключи должны присутствовать в ответе):

        0. repayment_schedule_and_early_repayment_check_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (schedule_status, payment_structure, early_repayment_status,
              notice_requirement_for_early_repayment,
              early_repayment_commission_status) ≠ "not_defined";
           - "missing" — если все пять содержательных полей = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Важно: early_repayment_commission_status = "not_applicable"
           (договор прямо говорит «без комиссии») считается ≠ "not_defined"
           и даёт presence = "present".

           Если presence = "missing":
           - schedule_status = "not_defined";
           - payment_structure = "not_defined";
           - early_repayment_status = "not_defined";
           - notice_requirement_for_early_repayment = "not_defined";
           - early_repayment_commission_status = "not_defined";
           - repayment_schedule_display = "Не установлено";
           - early_repayment_display = "Не установлено";
           - early_repayment_commission_display = "Не установлено";
           - не выполняй остальные шаги.

        1. schedule_status — наличие графика платежей:
           - "present" — график есть в тексте договора или определён
             через Приложение / График платежей / отдельный документ;
           - "not_defined" — график прямо не упомянут.

        2. payment_structure — структура погашения:
           - "annuity" — аннуитетные (равные) платежи;
           - "differentiated" — дифференцированные платежи (равные доли
             основного долга + проценты на остаток);
           - "custom" — иная структура (bullet, погашение в конце срока,
             индивидуальный график без чёткой формулы);
           - "not_defined" — структура прямо не указана.

        3. early_repayment_status — статус досрочного погашения:
           - "allowed" — досрочное погашение разрешено (полное и/или
             частичное) без ограничительных условий или с уведомительным
             порядком;
           - "restricted" — досрочное погашение допускается только
             с письменного согласия Кредитора или при иных ограничительных
             условиях;
           - "not_defined" — вопрос досрочного погашения прямо не
             урегулирован.

        4. notice_requirement_for_early_repayment — уведомительный порядок:
           - "present" — договор требует уведомления Кредитора о досрочном
             погашении (независимо от срока и от того, различает ли договор
             полное и частичное);
           - "not_defined" — требование уведомления прямо не указано.

        5. early_repayment_commission_status — комиссия за досрочное погашение:
           - "present" — комиссия установлена (указан размер или порядок);
           - "not_applicable" — договор прямо говорит «без комиссии»,
             «комиссия не взимается» (это явное условие, не отсутствие);
           - "not_defined" — вопрос комиссии прямо не урегулирован.

        6. repayment_schedule_display — краткая формулировка для юриста.
           Правила:
           - "Аннуитет, согласно Графику платежей (Приложение №1)";
           - "Дифференцированный";
           - "Согласно Приложению №2";
           - "Не установлено" — если данных нет;
           - "Не удалось определить" — при противоречии.

        7. early_repayment_display — краткая формулировка условий досрочного
           погашения.
           Правила:
           - "Разрешено (полное и частичное), уведомление за 30 календарных дней";
           - "Разрешено только с письменного согласия Кредитора";
           - "Разрешено, без ограничений" — если досрочка есть, но условия
             не конкретизированы;
           - "Не установлено" — если данных нет;
           - "Не удалось определить" — при противоречии.
           Если договор различает полное и частичное досрочное погашение —
           отрази оба режима.

        8. early_repayment_commission_display — краткая формулировка комиссии.
           Правила:
           - "Не взимается" — если договор прямо говорит «без комиссии»;
           - "1% от суммы досрочного погашения" — если комиссия установлена;
           - "Не установлено" — если данных нет;
           - "Не применимо" — если тема неактуальна для данного договора;
           - "Не удалось определить" — при противоречии.
        </task>

        <context_rules>
        - Перед остальными полями заполни repayment_schedule_and_early_repayment_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все enum-поля = "not_defined", все display-поля = "Не установлено".
        - Используй только релевантные фрагменты контекста.
        - Не подставляй нормы закона, обычную практику или предположения вместо текста договора.
        - Не делай выводов по типовой структуре кредитного договора.
        - Если график / структура определяются через Приложение или отдельный
          документ и это прямо видно из текста — schedule_status = "present",
          в repayment_schedule_display верни ссылку на документ.
        - Если договор прямо говорит «без комиссии» / «комиссия не взимается» —
          early_repayment_commission_status = "not_applicable",
          early_repayment_commission_display = "Не взимается".
          Не путай с "not_defined" (вопрос не урегулирован).
        - Различай полное и частичное досрочное погашение, если договор
          устанавливает для них разные режимы.
        - Не выдумывай сроки уведомления и размеры комиссий, которых нет в тексте.
        - Если в разных фрагментах указаны разные данные и конфликт нельзя
          разрешить по тексту: enum → "not_defined", display → "Не удалось определить".
        - Не используй null, None, пустые строки или "-".
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни графика, ни структуры, ни досрочного погашения.
           → presence = "missing";
             все enum-поля = "not_defined";
             все display-поля = "Не установлено".

        2. График есть, но структура и досрочка не раскрыты.
           "Погашение осуществляется согласно Графику платежей (Приложение №1)"
           без указания структуры и условий досрочного погашения.
           → presence = "present";
             schedule_status = "present";
             payment_structure = "not_defined";
             early_repayment_status = "not_defined";
             repayment_schedule_display = "Согласно Графику платежей (Приложение №1)".

        3. Противоречие между фрагментами.
           В одной части — аннуитет, в другой — дифференцированные платежи.
           → presence = "unclear";
             payment_structure = "not_defined";
             repayment_schedule_display = "Не удалось определить".

        4. Прямое указание «без комиссии» за досрочное погашение.
           "Комиссия за досрочное погашение не взимается."
           → early_repayment_commission_status = "not_applicable";
             early_repayment_commission_display = "Не взимается";
             presence = "present" (это явное условие, не отсутствие регулирования).
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для repayment_schedule_and_early_repayment_check_presence используй только: "present", "missing", "unclear".
        - Для schedule_status используй только: "present", "not_defined".
        - Для payment_structure используй только: "annuity", "differentiated", "custom", "not_defined".
        - Для early_repayment_status используй только: "allowed", "restricted", "not_defined".
        - Для notice_requirement_for_early_repayment используй только: "present", "not_defined".
        - Для early_repayment_commission_status используй только: "present", "not_applicable", "not_defined".
        - Fallback при отсутствии данных:
          * repayment_schedule_display → "Не установлено";
          * early_repayment_display → "Не установлено";
          * early_repayment_commission_display → "Не установлено".
        - Fallback при противоречии или неоднозначности:
          * все display-поля → "Не удалось определить".
        - Специальные значения:
          * early_repayment_commission_display = "Не взимается" — если комиссия прямо исключена;
          * early_repayment_commission_display = "Не применимо" — если тема неактуальна.
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "repayment_schedule_and_early_repayment_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования по графику погашения и досрочному погашению. Внутреннее агрегатное signal-поле."
          required: true

        - name: "schedule_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["present", "not_defined"]
          display_in_grid: false
          description: "Есть ли график платежей. Внутреннее enum-поле."
          required: true

        - name: "payment_structure"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["annuity", "differentiated", "custom", "not_defined"]
          display_in_grid: false
          description: "Структура графика платежей. Внутреннее enum-поле."
          required: true

        - name: "early_repayment_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["allowed", "restricted", "not_defined"]
          display_in_grid: false
          description: "Статус досрочного погашения. Внутреннее enum-поле."
          required: true

        - name: "notice_requirement_for_early_repayment"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["present", "not_defined"]
          display_in_grid: false
          description: "Есть ли уведомительный порядок досрочного погашения. Внутреннее enum-поле."
          required: true

        - name: "early_repayment_commission_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["present", "not_applicable", "not_defined"]
          display_in_grid: false
          description: "Наличие комиссии за досрочное погашение. not_applicable — если прямо исключена. Внутреннее enum-поле."
          required: true

        - name: "repayment_schedule_display"
          type: "string"
          presentation: "fact"
          label: "График погашения"
          display_in_grid: true
          display_priority: 1
          description: >
            Понятная формулировка графика и структуры погашения для юриста.
            Fallback: "Не установлено" / "Не удалось определить".
          required: true

        - name: "early_repayment_display"
          type: "string"
          presentation: "fact"
          label: "Досрочное погашение"
          display_in_grid: true
          display_priority: 2
          description: >
            Понятная формулировка условий досрочного погашения (полного и частичного) для юриста.
            Fallback: "Не установлено" / "Не удалось определить".
          required: true

        - name: "early_repayment_commission_display"
          type: "string"
          presentation: "fact"
          label: "Комиссия за досрочное погашение"
          display_in_grid: true
          display_priority: 3
          description: >
            Понятная формулировка условий комиссии за досрочное погашение для юриста.
            Специальные значения: "Не взимается", "Не применимо".
            Fallback: "Не установлено" / "Не удалось определить".
          required: true

      store_payload: true

  - id: forced_services_and_insurance_check
    name: "Навязанные услуги и страховые продукты"
    description: >
      Проверяет, не поставлена ли выдача кредита в зависимость от приобретения
      дополнительных услуг/страхования, различает добровольное страхование
      и навязанное, фиксирует право отказа и его последствия.
    triggers:
      any:
        - consumer_credit
        - insurance_linked_product
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "страхование жизни"
        - "страхование здоровья"
        - "добровольное страхование"
        - "обязательное условие"
        - "подключение услуги"
        - "заемщик вправе отказаться"
        - "не является обязательным условием"
        - "период охлаждения"
        - "отказ от дополнительной услуги"
        - "повышение процентной ставки"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)страхован(ие|ия)\\s+(жизни|здоровья)"
        - "(?i)не\\s+является\\s+обязательным\\s+условием"
        - "(?i)обязательн(ое|ым)\\s+услови"
        - "(?i)отказ.{0,40}дополнительн(ой|ых)\\s+услуг"
        - "(?i)период.{0,10}охлажден"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется кредитный договор.
        Проверяется только один вопрос: не обусловлена ли выдача кредита
        приобретением дополнительных услуг / страхования, и есть ли у заёмщика
        право отказаться от этих услуг.

        Нормативный ориентир:
        - ст. 7 ФЗ № 353-ФЗ «О потребительском кредите (займе)» —
          запрет требовать приобретения дополнительных услуг как условия
          выдачи кредита; право заёмщика отказаться от дополнительной услуги
          в течение 14 календарных дней
        - ст. 16 ЗоЗПП — недопустимость навязывания дополнительных услуг
        - Указание Банка России № 5000-У — период охлаждения при отказе
          от страхования (14 календарных дней)

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора,
          а чего прямо нет.
        - Не оценивай серьёзность риска.
        - Различай три принципиально разных режима:
            1) дополнительных услуг / страхования в договоре нет;
            2) услуга есть, но она добровольная и не обусловливает выдачу
               кредита;
            3) услуга есть и обусловливает выдачу кредита (навязывание).
        - В корпоративных кредитах 353-ФЗ не применяется, но проверка
          факта обусловленности выдачи кредита приобретением услуги
          остаётся значимой.
        - Ситуация «страхование не обязательно, но без него ставка выше» —
          это не «обусловленность выдачи», но это значимый факт для
          DD-анализа. Зафиксируй его в display отдельно.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Есть ли дополнительные услуги / страхование (факт наличия).
        2. Связано ли страхование с кредитом.
        3. Есть ли обусловленность выдачи кредита приобретением
           дополнительной услуги / страхования (прямая или косвенная).
        4. Есть ли право заёмщика отказаться от дополнительной услуги
           (и если да — в какой срок, например 14 календарных дней).
        5. Есть ли в договоре описание последствий отказа от услуги
           (например, повышение ставки, отказ в предоставлении кредита,
           отказ в снижении ставки).
        6. Сформулируй понятные для юриста текстовые расшифровки:
           - forced_services_status_display,
           - borrower_opt_out_display,
           - opt_out_consequences_display.

        [ПРАВИЛА]
        1. Используй только текст документа. Не подставляй нормы закона
           вместо текста договора.
        2. Если параметр прямо указан в договоре — возвращай его дословно
           или делай точную выжимку.
        3. Если услуга упомянута, но без указания на её обязательность или
           добровольность — forced_services_status = "unclear".
        4. Если параметр в договоре прямо не указан:
           - для сигнальных enum-полей (additional_services_present,
             insurance_linked, forced_services_status, borrower_opt_out_right,
             opt_out_consequences_status) — возвращай "not_defined";
           - для текстовых user-facing полей (forced_services_status_display,
             borrower_opt_out_display, opt_out_consequences_display) —
             возвращай "Не установлено".
        5. Если тема по существу не применима к данному договору
           (например, договор корпоративного кредита без упоминания
           доп. услуг и без признаков потребительского кредита) —
           для user-facing поля возвращай "Не применимо",
           для сигнального — "not_defined".
        6. Если текст есть, но надёжный вывод сделать нельзя
           (двусмысленная формулировка) — для user-facing поля возвращай
           "Не удалось определить", для сигнального — "unclear" (для
           forced_services_status) или "not_defined" (для остальных).
        7. Никогда не используй null, None, пустые строки или "-".
        8. Не выдумывай сроки отказа и последствия отказа, которых нет
           в тексте.
        9. При конфликтующих фрагментах отдавай приоритет более позднему
           или более специальному положению.
        10. В evidence включай только текст договора.
        11. Верни РОВНО один JSON-объект со всеми ключами из [ФОРМАТ ОТВЕТА] без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [РОССИЙСКАЯ ПРАКТИКА — ПОДСКАЗКИ]
        - Типичная корректная формулировка: «Заключение договора страхования
          не является обязательным условием для предоставления кредита.
          Заёмщик вправе отказаться от страхования в течение 14 календарных
          дней с даты заключения договора» → forced_services_status = "voluntary",
          borrower_opt_out_right = "present".
        - Типичная некорректная формулировка (навязывание):
          «Кредит предоставляется при условии заключения заёмщиком договора
          страхования жизни и здоровья» → forced_services_status = "mandatory".
        - Спорная, но часто встречающаяся практика:
          «Заключение договора страхования не является обязательным условием
          предоставления кредита. При отказе от страхования процентная ставка
          увеличивается на 3 п.п.» → forced_services_status = "voluntary",
          но opt_out_consequences_status = "present",
          opt_out_consequences_display = «Повышение ставки на 3 п.п. при отказе».
        - Формулировка «дополнительные услуги отсутствуют» / «иные услуги
          не оказываются» → additional_services_present = "no",
          forced_services_status = "absent".
        - Если в договоре упоминается страхование предмета залога —
          это может быть не «навязанная услуга», а обязательное условие
          обеспечения. Уточни контекст: если страхование обеспечивает
          залог, а не выступает как отдельная услуга заёмщику —
          это не навязывание в смысле 353-ФЗ.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — добровольное страхование с правом отказа:
        Фрагмент:
        "Заключение договора страхования жизни и здоровья не является
         обязательным условием для предоставления кредита. Заёмщик вправе
         отказаться от страхования в течение 14 календарных дней с даты
         заключения договора."

        Ответ:
        {
          "additional_services_present": "yes",
          "insurance_linked": "yes",
          "forced_services_status": "voluntary",
          "borrower_opt_out_right": "present",
          "opt_out_consequences_status": "not_defined",
          "forced_services_status_display": "Страхование добровольное, не обусловливает выдачу кредита",
          "borrower_opt_out_display": "Установлено, 14 календарных дней",
          "opt_out_consequences_display": "Не установлены"
        }

        Пример 2 — страхование как обязательное условие выдачи кредита:
        Фрагмент:
        "Кредит предоставляется при условии заключения Заёмщиком договора
         страхования жизни и здоровья. Заёмщик обязан заключить договор
         страхования на весь срок кредита."

        Ответ:
        {
          "additional_services_present": "yes",
          "insurance_linked": "yes",
          "forced_services_status": "mandatory",
          "borrower_opt_out_right": "not_defined",
          "opt_out_consequences_status": "not_defined",
          "forced_services_status_display": "Страхование — обязательное условие выдачи кредита",
          "borrower_opt_out_display": "Не установлено",
          "opt_out_consequences_display": "Не установлены"
        }

        Пример 3 — добровольное страхование с повышением ставки при отказе:
        Фрагмент:
        "Страхование жизни и здоровья не является обязательным условием
         предоставления кредита. При отказе Заёмщика от страхования
         процентная ставка увеличивается на 3 (три) процентных пункта."

        Ответ:
        {
          "additional_services_present": "yes",
          "insurance_linked": "yes",
          "forced_services_status": "voluntary",
          "borrower_opt_out_right": "present",
          "opt_out_consequences_status": "present",
          "forced_services_status_display": "Страхование добровольное, не обусловливает выдачу кредита",
          "borrower_opt_out_display": "Установлено, срок не указан",
          "opt_out_consequences_display": "Повышение ставки на 3 п.п. при отказе от страхования"
        }

        Пример 4 — дополнительные услуги отсутствуют:
        Фрагмент:
        "Иные дополнительные услуги Кредитором не оказываются. Приобретение
         услуг третьих лиц не является условием предоставления кредита."

        Ответ:
        {
          "additional_services_present": "no",
          "insurance_linked": "not_defined",
          "forced_services_status": "absent",
          "borrower_opt_out_right": "not_defined",
          "opt_out_consequences_status": "not_defined",
          "forced_services_status_display": "Дополнительные услуги отсутствуют",
          "borrower_opt_out_display": "Не применимо",
          "opt_out_consequences_display": "Не применимо"
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о дополнительных услугах / страховании.
        2. Определи, чем является услуга по тексту: отсутствует /
           добровольная / обязательная (обусловливает выдачу).
        3. Найди прямую цитату о праве отказа. Есть ли срок отказа
           (14 дней, иной)?
        4. Найди упоминание последствий отказа (повышение ставки,
           отказ в выдаче, иное).
        5. Отдели «навязанную услугу» от «страхования предмета залога»:
           если страхование обеспечивает залог, а не является отдельной
           услугой заёмщику — это не навязывание.
        6. Сформулируй три user-facing display-поля кратко и по-русски.
        7. Если прямых цитат нет — верни fallback по правилам 4–6.

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь РОВНО одним JSON-объектом без какого-либо дополнительного текста до или после, со всеми 9 ключами:
        {
          "additional_services_present": "<yes / no / not_defined>",
          "insurance_linked": "<yes / no / not_defined>",
          "forced_services_status": "<mandatory / voluntary / absent / unclear / not_defined>",
          "borrower_opt_out_right": "<present / not_defined>",
          "opt_out_consequences_status": "<present / not_defined>",
          "forced_services_status_display": "<текст или 'Не установлено' / 'Не применимо' / 'Не удалось определить'>",
          "borrower_opt_out_display": "<текст или 'Не установлено' / 'Не применимо' / 'Не удалось определить'>",
          "opt_out_consequences_display": "<текст, 'Не установлены', 'Не применимо' или 'Не удалось определить'>"
        }
      context_k: 8
      temperature: 0.0
      max_tokens: 850

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "страхование жизни добровольное страхование обязательное условие выдачи кредита право отказа от дополнительной услуги 14 календарных дней период охлаждения повышение процентной ставки при отказе от страхования"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
      negative_keywords:
        - "означает"
        - "в целях настоящего"
        - "проценты"
        - "пск"
        - "предмет договора"
        - "обеспечение"
      position_bias:
        preferred_range: [0.20, 0.60]
        boost: 0.12
        scope: segment
      context_k: 8
      max_chunks: 10
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
        - "invoice"
      preferred_clause_functions:
        - "obligations"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 35
      max_snippet_length: 550

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1100

      compact_output: false

      presence_signal:
        field: "forced_services_and_insurance_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста кредитного договора сведения
        о дополнительных услугах, страховании, обусловленности выдачи кредита
        приобретением услуги, праве отказа и его последствиях.
        Не анализируй комиссии, проценты, ПСК, обеспечение или последствия
        нарушения. Не оценивай риски. Анализируй только текст договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля (все ключи должны присутствовать в ответе):

        0. forced_services_and_insurance_check_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (additional_services_present, insurance_linked,
              forced_services_status, borrower_opt_out_right,
              opt_out_consequences_status) ≠ "not_defined";
           - "missing" — если все пять содержательных полей = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Важно: forced_services_status = "absent" и
           additional_services_present = "no" считаются ≠ "not_defined"
           и дают presence = "present" (договор прямо регулирует вопрос).
           Аналогично forced_services_status = "unclear" ≠ "not_defined".

           Если presence = "missing":
           - additional_services_present = "not_defined";
           - insurance_linked = "not_defined";
           - forced_services_status = "not_defined";
           - borrower_opt_out_right = "not_defined";
           - opt_out_consequences_status = "not_defined";
           - forced_services_status_display = "Не установлено";
           - borrower_opt_out_display = "Не установлено";
           - opt_out_consequences_display = "Не установлено";
           - не выполняй остальные шаги.

        1. additional_services_present — факт наличия дополнительных
           услуг / страхования:
           - "yes" — в договоре упомянуты дополнительные услуги или
             страхование (жизни, здоровья, имущества и т.п.);
           - "no" — договор прямо указывает, что дополнительные услуги
             не оказываются и страхование не требуется;
           - "not_defined" — вопрос дополнительных услуг вообще не
             урегулирован в тексте.

        2. insurance_linked — связь страхования с кредитом:
           - "yes" — страхование упомянуто как элемент кредитной сделки
             (условие выдачи, снижение ставки, обеспечение);
           - "no" — страхование прямо не связано с кредитом или
             прямо указано, что страхование не требуется;
           - "not_defined" — вопрос не урегулирован.

        3. forced_services_status — режим дополнительной услуги / страхования:
           - "mandatory" — услуга / страхование обусловливает выдачу
             кредита (прямая формулировка «при условии заключения»);
           - "voluntary" — услуга есть, но прямо указано, что она не
             является обязательным условием выдачи кредита;
           - "absent" — дополнительных услуг / страхования нет
             (договор прямо это утверждает);
           - "unclear" — услуга упомянута, но её обязательность /
             добровольность нельзя надёжно определить;
           - "not_defined" — тема вообще не урегулирована.

        4. borrower_opt_out_right — право заёмщика на отказ:
           - "present" — договор прямо предоставляет право отказаться
             от дополнительной услуги (с указанием срока или без);
           - "not_defined" — право отказа прямо не упомянуто.

        5. opt_out_consequences_status — последствия отказа:
           - "present" — договор описывает последствия отказа от услуги
             (повышение ставки, отказ в снижении ставки, иное);
           - "not_defined" — последствия отказа прямо не описаны.

        6. forced_services_status_display — краткая формулировка для юриста.
           Примеры:
           - "Страхование добровольное, не обусловливает выдачу кредита";
           - "Страхование — обязательное условие выдачи кредита";
           - "Дополнительные услуги отсутствуют";
           - "Не установлено" / "Не применимо" / "Не удалось определить".

        7. borrower_opt_out_display — краткая формулировка права отказа.
           Примеры:
           - "Установлено, 14 календарных дней";
           - "Установлено, срок не указан";
           - "Не установлено" / "Не применимо" / "Не удалось определить".

        8. opt_out_consequences_display — краткая формулировка последствий.
           Примеры:
           - "Повышение ставки на 3 п.п. при отказе от страхования";
           - "Не установлены" / "Не применимо" / "Не удалось определить".
        </task>

        <context_rules>
        - Перед остальными полями заполни forced_services_and_insurance_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все enum-поля = "not_defined", все display-поля = "Не установлено".
        - Используй только релевантные фрагменты контекста.
        - Не подставляй нормы закона, обычную практику или предположения вместо текста договора.
        - Не делай выводов по типовой структуре кредитного договора.
        - Различай три режима: absent (услуг нет) / voluntary (есть, но добровольные) / mandatory (обусловливают выдачу).
        - Ситуация «страхование не обязательно, но без него ставка выше» —
          это "voluntary" + opt_out_consequences_status = "present", а НЕ "mandatory".
        - Если услуга упомянута без указания на обязательность / добровольность —
          forced_services_status = "unclear".
        - Страхование предмета залога (обеспечение) — не навязывание в смысле 353-ФЗ.
          Фиксируй контекст в display.
        - Если в разных фрагментах указаны разные данные и конфликт нельзя
          разрешить по тексту: forced_services_status → "unclear",
          остальные enum → "not_defined", display → "Не удалось определить".
        - Не выдумывай сроки отказа и последствия, которых нет в тексте.
        - Не используй null, None, пустые строки или "-".
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни упоминания услуг, ни страхования, ни права отказа.
           → presence = "missing";
             все enum-поля = "not_defined";
             все display-поля = "Не установлено".

        2. Дополнительные услуги прямо отсутствуют.
           "Иные дополнительные услуги Кредитором не оказываются."
           → presence = "present";
             additional_services_present = "no";
             forced_services_status = "absent";
             forced_services_status_display = "Дополнительные услуги отсутствуют";
             borrower_opt_out_display = opt_out_consequences_display = "Не применимо".

        3. Противоречие между фрагментами.
           В одной части — «страхование добровольное», в другой —
           «кредит предоставляется при условии страхования».
           → presence = "unclear";
             forced_services_status = "unclear";
             forced_services_status_display = "Не удалось определить".

        4. Добровольное страхование с повышением ставки при отказе.
           "Страхование не является обязательным. При отказе ставка
           увеличивается на 3 п.п."
           → presence = "present";
             forced_services_status = "voluntary";
             opt_out_consequences_status = "present";
             opt_out_consequences_display = "Повышение ставки на 3 п.п. при отказе".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для forced_services_and_insurance_check_presence используй только: "present", "missing", "unclear".
        - Для additional_services_present используй только: "yes", "no", "not_defined".
        - Для insurance_linked используй только: "yes", "no", "not_defined".
        - Для forced_services_status используй только: "mandatory", "voluntary", "absent", "unclear", "not_defined".
        - Для borrower_opt_out_right используй только: "present", "not_defined".
        - Для opt_out_consequences_status используй только: "present", "not_defined".
        - Fallback при отсутствии данных:
          * forced_services_status_display → "Не установлено";
          * borrower_opt_out_display → "Не установлено";
          * opt_out_consequences_display → "Не установлены".
        - Fallback при противоречии или неоднозначности:
          * все display-поля → "Не удалось определить".
        - Специальные значения:
          * borrower_opt_out_display = "Не применимо" — если услуги отсутствуют;
          * opt_out_consequences_display = "Не применимо" — если услуги отсутствуют.
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "forced_services_and_insurance_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования по навязанным услугам и страхованию. Внутреннее агрегатное signal-поле."
          required: true

        - name: "additional_services_present"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["yes", "no", "not_defined"]
          display_in_grid: false
          description: "Есть ли дополнительные услуги / страхование в договоре. Внутреннее enum-поле."
          required: true

        - name: "insurance_linked"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["yes", "no", "not_defined"]
          display_in_grid: false
          description: "Связан ли кредит со страховым продуктом. Внутреннее enum-поле."
          required: true

        - name: "forced_services_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["mandatory", "voluntary", "absent", "unclear", "not_defined"]
          display_in_grid: false
          description: >
            Режим дополнительной услуги / страхования: mandatory (обусловливает выдачу),
            voluntary (добровольное), absent (услуг нет), unclear (неясно).
            Внутреннее enum-поле.
          required: true

        - name: "borrower_opt_out_right"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["present", "not_defined"]
          display_in_grid: false
          description: "Есть ли право отказаться от дополнительной услуги. Внутреннее enum-поле."
          required: true

        - name: "opt_out_consequences_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["present", "not_defined"]
          display_in_grid: false
          description: "Описаны ли последствия отказа от услуги. Внутреннее enum-поле."
          required: true

        - name: "forced_services_status_display"
          type: "string"
          presentation: "fact"
          label: "Навязанные услуги / страхование"
          display_in_grid: true
          display_priority: 1
          description: >
            Понятная формулировка режима дополнительных услуг / страхования для юриста.
            Fallback: "Не установлено" / "Не применимо" / "Не удалось определить".
          required: true

        - name: "borrower_opt_out_display"
          type: "string"
          presentation: "fact"
          label: "Право отказа"
          display_in_grid: true
          display_priority: 2
          description: >
            Понятная формулировка права отказа от дополнительной услуги
            (с указанием срока, если указан).
            Fallback: "Не установлено" / "Не применимо" / "Не удалось определить".
          required: true

        - name: "opt_out_consequences_display"
          type: "string"
          presentation: "fact"
          label: "Последствия отказа"
          display_in_grid: true
          display_priority: 3
          description: >
            Понятная формулировка последствий отказа от дополнительной услуги.
            Fallback: "Не установлены" / "Не применимо" / "Не удалось определить".
          required: true

      store_payload: true

  - id: acceleration_events_check
    name: "Основания для досрочного истребования кредита"
    description: >
      Проверяет перечень оснований, при которых банк вправе потребовать
      досрочного возврата кредита, режим истребования (право / автоматическое
      наступление / обязанность банка), наличие срока на устранение нарушения
      и требования уведомления заёмщика.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "досрочный возврат по требованию банка"
        - "банк вправе потребовать досрочного возврата"
        - "кредит подлежит досрочному возврату"
        - "нецелевое использование"
        - "ухудшение финансового состояния"
        - "утрата обеспечения"
        - "просрочка платежа"
        - "письменное уведомление о досрочном истребовании"
        - "срок на устранение нарушения"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)банк.*вправе.*потребовать.*досрочного\\s+возврата"
        - "(?i)кредит.*подлежит.*досрочному\\s+возврат"
        - "(?i)утрат[аы]\\s+обеспечения"
        - "(?i)нецелев(ое|ого)\\s+использован"
        - "(?i)уведомлен.{0,30}досрочн"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется кредитный договор.
        Проверяется только один вопрос: основания и механика досрочного
        истребования кредита банком.

        Нормативный ориентир:
        - ст. 811 ГК РФ — последствия нарушения заёмщиком срока возврата
          очередной части кредита
        - ст. 813 ГК РФ — последствия утраты обеспечения
        - ст. 814 ГК РФ — последствия нецелевого использования кредита
        - ст. 821 ГК РФ — отказ от предоставления / досрочный возврат
          при обстоятельствах, свидетельствующих о невозврате
        - ст. 811 п. 2 ГК РФ — законный срок на устранение нарушения
          (30 дней), применим к потребительским кредитам

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора,
          а чего прямо нет.
        - Не оценивай серьёзность риска.
        - Различай три принципиально разных правовых режима:
            1) bank_right — Банк вправе потребовать досрочного возврата
               (право, реализуемое по усмотрению Банка);
            2) automatic — кредит подлежит досрочному возврату
               (автоматическое наступление, без требования);
            3) bank_obligation — Банк обязан потребовать досрочного
               возврата (обязанность, а не право).
        - Различай срок на устранение нарушения (до истребования) и срок
          на исполнение требования (после получения уведомления).
        - Открытые формулировки типа «в случае любого нарушения»,
          «по усмотрению Банка», «при ухудшении финансового состояния
          по оценке Банка» — это красный флаг для заёмщика. Обязательно
          отражай такие формулировки в summary.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Есть ли право (или обязанность) Банка на досрочное истребование.
        2. В каком режиме — право / автоматическое наступление / обязанность.
        3. Какие основания для досрочного истребования (полный перечень).
        4. Есть ли срок на устранение нарушения (до истребования) — и его
           значение.
        5. Есть ли требование уведомления заёмщика о досрочном истребовании.
        6. Сформулируй понятные для юриста текстовые расшифровки:
           - acceleration_right_display,
           - acceleration_triggers_summary,
           - borrower_cure_period_display,
           - notification_required_display.

        [ПРАВИЛА]
        1. Используй только текст документа. Не подставляй нормы закона
           вместо текста договора.
        2. Если параметр прямо указан в договоре — возвращай его дословно
           или делай точную выжимку.
        3. Если режим истребования прямо не определён, но есть указание
           на право / автоматику / обязанность — выбирай соответствующее
           значение acceleration_right_kind. Если неясно — "not_defined".
        4. `acceleration_triggers` — массив строк. Каждая строка — краткая
           формулировка одного основания из договора, например:
           "просрочка платежа более 5 рабочих дней",
           "утрата предмета залога",
           "нецелевое использование кредита".
           Не дублируй одно и то же основание разными формулировками.
           Если оснований нет в тексте — верни пустой массив [].
        5. Если параметр в договоре прямо не указан:
           - для сигнальных enum-полей (acceleration_right_status,
             acceleration_right_kind, borrower_cure_period,
             notification_required_status) — возвращай "not_defined";
           - для текстовых user-facing полей (acceleration_right_display,
             acceleration_triggers_summary, borrower_cure_period_display,
             notification_required_display) — возвращай "Не установлено";
           - для массива acceleration_triggers — пустой массив [].
        6. Если тема по существу не применима к данному договору —
           для user-facing поля возвращай "Не применимо",
           для сигнального — "not_defined".
        7. Если текст есть, но надёжный вывод сделать нельзя
           (двусмысленная формулировка) — для user-facing поля возвращай
           "Не удалось определить", для сигнального — "not_defined".
        8. Никогда не используй null, None, пустые строки или "-"
           внутри строковых значений. Пустой массив [] — валидное
           значение для acceleration_triggers, но не для строковых полей.
        9. Не выдумывай основания и сроки, которых нет в тексте.
        10. При конфликтующих фрагментах отдавай приоритет более позднему
            или более специальному положению.
        11. В evidence включай только текст договора.
        12. Верни РОВНО один JSON-объект со всеми ключами из [ФОРМАТ ОТВЕТА] без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [РОССИЙСКАЯ ПРАКТИКА — ПОДСКАЗКИ]
        - Типовые основания досрочного истребования в банковских кредитах:
            * просрочка уплаты очередного платежа более N дней;
            * просрочка уплаты процентов более N дней;
            * утрата / ухудшение обеспечения, снижение стоимости залога
              ниже согласованной;
            * нецелевое использование кредита;
            * предоставление недостоверных сведений / документов;
            * существенное ухудшение финансового состояния заёмщика;
            * возбуждение процедуры банкротства / ликвидация;
            * неисполнение иных обязательств (cross-default);
            * нарушение ковенант;
            * смена контроля;
            * предъявление значительных требований третьими лицами.
        - Типичная формулировка: «Банк вправе потребовать досрочного
          возврата Кредита, уплаты процентов и иных сумм при наступлении
          любого из следующих обстоятельств: …» → acceleration_right_kind = "bank_right".
        - Реже: «Кредит подлежит досрочному возврату в случае …» →
          acceleration_right_kind = "automatic".
        - Ещё реже: «Банк обязан потребовать досрочного возврата при …» →
          acceleration_right_kind = "bank_obligation".
        - Открытые формулировки («любое нарушение», «по усмотрению Банка»,
          «при ухудшении финансового состояния по оценке Банка») —
          красный флаг, отражай в acceleration_triggers_summary.
        - Для потребительских кредитов законный срок на устранение
          нарушения по ст. 811 п. 2 ГК РФ — 30 дней. Если договор
          не устанавливает иной срок, в display отражай «30 дней (законный)».
          Для корпоративных кредитов срок определяется договором.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — закрытый перечень оснований с cure period:
        Фрагмент:
        "Банк вправе потребовать досрочного возврата Кредита при наступлении
         любого из следующих обстоятельств: (а) просрочка уплаты очередного
         платежа более 5 рабочих дней; (б) утрата предмета залога;
         (в) нецелевое использование Кредита. Заёмщик обязан устранить
         нарушение в течение 10 рабочих дней с даты получения уведомления
         Банка. Банк обязан направить Заёмщику письменное уведомление
         о досрочном истребовании."

        Ответ:
        {
          "acceleration_right_status": "present",
          "acceleration_right_kind": "bank_right",
          "acceleration_triggers": [
            "просрочка уплаты очередного платежа более 5 рабочих дней",
            "утрата предмета залога",
            "нецелевое использование кредита"
          ],
          "borrower_cure_period": "present",
          "notification_required_status": "present",
          "acceleration_right_display": "Право Банка потребовать досрочного возврата",
          "acceleration_triggers_summary": "3 основания: просрочка платежа, утрата залога, нецелевое использование",
          "borrower_cure_period_display": "10 рабочих дней с даты получения уведомления",
          "notification_required_display": "Письменное уведомление Банка обязательно"
        }

        Пример 2 — открытый перечень (красный флаг):
        Фрагмент:
        "Банк вправе потребовать досрочного возврата Кредита в случае любого
         нарушения Заёмщиком условий настоящего Договора, а также при
         ухудшении финансового состояния Заёмщика по оценке Банка."

        Ответ:
        {
          "acceleration_right_status": "present",
          "acceleration_right_kind": "bank_right",
          "acceleration_triggers": [
            "любое нарушение условий договора",
            "ухудшение финансового состояния заёмщика по оценке Банка"
          ],
          "borrower_cure_period": "not_defined",
          "notification_required_status": "not_defined",
          "acceleration_right_display": "Право Банка потребовать досрочного возврата",
          "acceleration_triggers_summary": "Внимание: открытый перечень оснований («любое нарушение», «по оценке Банка»)",
          "borrower_cure_period_display": "Не установлен",
          "notification_required_display": "Не установлено"
        }

        Пример 3 — автоматическое наступление без требования Банка:
        Фрагмент:
        "Кредит подлежит досрочному возврату в случае возбуждения в отношении
         Заёмщика процедуры банкротства или принятия решения о ликвидации.
         Заёмщик обязан погасить задолженность в течение 5 рабочих дней
         с даты наступления указанных обстоятельств."

        Ответ:
        {
          "acceleration_right_status": "present",
          "acceleration_right_kind": "automatic",
          "acceleration_triggers": [
            "возбуждение процедуры банкротства заёмщика",
            "принятие решения о ликвидации заёмщика"
          ],
          "borrower_cure_period": "not_defined",
          "notification_required_status": "not_defined",
          "acceleration_right_display": "Досрочный возврат наступает автоматически",
          "acceleration_triggers_summary": "2 основания: банкротство, ликвидация",
          "borrower_cure_period_display": "Не установлен",
          "notification_required_display": "Не установлено"
        }

        Пример 4 — основания отсутствуют:
        Фрагмент:
        "Иные условия досрочного возврата Кредита Договором не предусмотрены."

        Ответ:
        {
          "acceleration_right_status": "not_defined",
          "acceleration_right_kind": "not_defined",
          "acceleration_triggers": [],
          "borrower_cure_period": "not_defined",
          "notification_required_status": "not_defined",
          "acceleration_right_display": "Не установлено",
          "acceleration_triggers_summary": "Основания не установлены",
          "borrower_cure_period_display": "Не установлено",
          "notification_required_display": "Не установлено"
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о праве / обязанности Банка на досрочное
           истребование или об автоматическом наступлении досрочного возврата.
        2. Определи режим: bank_right / automatic / bank_obligation.
        3. Найди полный перечень оснований. Каждое основание — отдельная
           строка в массиве. Не дублируй одно и то же.
        4. Найди срок на устранение нарушения. Если прямо указан — отражай
           значение. Если для потребительского кредита срок не указан —
           отражай «30 дней (законный)».
        5. Найди требование уведомления заёмщика о досрочном истребовании.
        6. Проверь наличие открытых формулировок («любое нарушение»,
           «по усмотрению Банка») — отражай в summary как красный флаг.
        7. Сформулируй все четыре user-facing display-поля кратко и по-русски.
        8. Если прямых цитат нет — верни fallback по правилам 5–7.

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь РОВНО одним JSON-объектом без какого-либо дополнительного текста до или после, со всеми 9 ключами:
        {
          "acceleration_right_status": "<present / not_defined>",
          "acceleration_right_kind": "<bank_right / automatic / bank_obligation / not_defined>",
          "acceleration_triggers": ["<основание 1>", "<основание 2>"],
          "borrower_cure_period": "<present / not_defined>",
          "notification_required_status": "<present / not_defined>",
          "acceleration_right_display": "<текст или 'Не установлено' / 'Не применимо' / 'Не удалось определить'>",
          "acceleration_triggers_summary": "<текст или 'Основания не установлены' / 'Не применимо' / 'Не удалось определить'>",
          "borrower_cure_period_display": "<текст, 'Не установлен', 'Не применимо' или 'Не удалось определить'>",
          "notification_required_display": "<текст, 'Не установлено', 'Не применимо' или 'Не удалось определить'>"
        }
      context_k: 8
      temperature: 0.0
      max_tokens: 900

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "досрочный возврат по требованию банка право потребовать досрочного возврата кредит подлежит досрочному возврату просрочка платежа утрата обеспечения нецелевое использование ухудшение финансового состояния заемщика предоставление недостоверных сведений cross-default смена контроля срок на устранение нарушения уведомление о досрочном истребовании"
      preferred_unit_types:
        - obligation
        - termination_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - remedies
        - obligations
      negative_keywords:
        - "означает"
        - "в целях настоящего"
        - "процентная ставка"
        - "пск"
        - "предмет договора"
      position_bias:
        preferred_range: [0.30, 0.75]
        boost: 0.15
        scope: segment
      context_k: 8
      max_chunks: 10
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
        - "invoice"
      preferred_clause_functions:
        - "remedies"
        - "obligations"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 600

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1400

      compact_output: false

      presence_signal:
        field: "acceleration_events_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста кредитного договора сведения
        об основаниях и механике досрочного истребования кредита банком:
        режим истребования, полный перечень оснований, срок на устранение
        нарушения, требование уведомления заёмщика.
        Не анализируй обеспечение, ковенанты, проценты, ПСК или последствия
        нарушения (кроме самого механизма истребования).
        Не оценивай риски. Анализируй только текст договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля (все ключи должны присутствовать в ответе):

        0. acceleration_events_check_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (acceleration_right_status, acceleration_right_kind,
              borrower_cure_period, notification_required_status)
             ≠ "not_defined";
           - "missing" — если все четыре содержательных поля = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - acceleration_right_status = "not_defined";
           - acceleration_right_kind = "not_defined";
           - borrower_cure_period = "not_defined";
           - notification_required_status = "not_defined";
           - acceleration_triggers = [];
           - acceleration_right_display = "Не установлено";
           - acceleration_triggers_summary = "Основания не установлены";
           - borrower_cure_period_display = "Не установлено";
           - notification_required_display = "Не установлено";
           - не выполняй остальные шаги.

        1. acceleration_right_status — наличие права / обязанности
           досрочного истребования:
           - "present" — в договоре есть положение о досрочном возврате
             по требованию банка, автоматическом наступлении или
             обязанности банка;
           - "not_defined" — вопрос досрочного истребования прямо
             не урегулирован.

        2. acceleration_right_kind — режим истребования:
           - "bank_right" — «Банк вправе потребовать досрочного возврата»
             (право по усмотрению);
           - "automatic" — «Кредит подлежит досрочному возврату»
             (автоматическое наступление, без требования);
           - "bank_obligation" — «Банк обязан потребовать досрочного
             возврата» (обязанность);
           - "not_defined" — режим не определён.

        3. acceleration_triggers — массив строк, каждая строка — краткая
           формулировка одного основания из договора.
           Правила:
           - каждое основание — отдельная строка;
           - не дублируй одно и то же основание разными формулировками;
           - если оснований нет в тексте — верни пустой массив [];
           - открытые формулировки («любое нарушение», «по усмотрению
             Банка») — включай как отдельные строки.

        4. borrower_cure_period — срок на устранение нарушения:
           - "present" — договор устанавливает срок на устранение
             нарушения до истребования;
           - "not_defined" — срок на устранение прямо не указан.

        5. notification_required_status — требование уведомления:
           - "present" — договор требует уведомления заёмщика о
             досрочном истребовании;
           - "not_defined" — требование уведомления прямо не указано.

        6. acceleration_right_display — краткая формулировка для юриста.
           Примеры:
           - "Право Банка потребовать досрочного возврата";
           - "Досрочный возврат наступает автоматически";
           - "Обязанность Банка потребовать досрочного возврата";
           - "Не установлено" / "Не применимо" / "Не удалось определить".

        7. acceleration_triggers_summary — краткое описание перечня
           оснований для юриста.
           Примеры:
           - "3 основания: просрочка платежа, утрата залога, нецелевое
             использование";
           - "Внимание: открытый перечень оснований («любое нарушение»,
             «по оценке Банка»)";
           - "Основания не установлены";
           - "Не удалось определить".

        8. borrower_cure_period_display — краткая формулировка срока.
           Примеры:
           - "10 рабочих дней с даты получения уведомления";
           - "30 дней (законный, ст. 811 п. 2 ГК РФ)" — для
             потребительского кредита, если срок не указан в договоре;
           - "Не установлен" / "Не применимо" / "Не удалось определить".

        9. notification_required_display — краткая формулировка.
           Примеры:
           - "Письменное уведомление Банка обязательно";
           - "Не установлено" / "Не применимо" / "Не удалось определить".
        </task>

        <context_rules>
        - Перед остальными полями заполни acceleration_events_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все enum-поля = "not_defined", acceleration_triggers = [], все display-поля = "Не установлено" / "Основания не установлены".
        - Используй только релевантные фрагменты контекста.
        - Не подставляй нормы закона, обычную практику или предположения вместо текста договора.
        - Не делай выводов по типовой структуре кредитного договора.
        - Различай три режима: bank_right / automatic / bank_obligation.
        - Открытые формулировки («любое нарушение», «по усмотрению Банка»,
          «по оценке Банка») — включай в acceleration_triggers как отдельные
          строки и обязательно отражай в acceleration_triggers_summary.
        - Не выдумывай основания, сроки и уведомления, которых нет в тексте.
        - Для acceleration_triggers: пустой массив [] — валидное значение
          при отсутствии оснований. Не используй null или пустые строки
          внутри массива.
        - Если в разных фрагментах указаны разные данные и конфликт нельзя
          разрешить по тексту: enum → "not_defined", display → "Не удалось определить".
        - Не используй null, None, пустые строки или "-" в строковых полях.
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни права истребования, ни оснований, ни cure period.
           → presence = "missing";
             все enum-поля = "not_defined";
             acceleration_triggers = [];
             все display-поля = "Не установлено" / "Основания не установлены".

        2. Открытый перечень оснований (красный флаг).
           "Банк вправе потребовать досрочного возврата в случае любого
           нарушения условий Договора."
           → presence = "present";
             acceleration_right_status = "present";
             acceleration_right_kind = "bank_right";
             acceleration_triggers = ["любое нарушение условий договора"];
             acceleration_triggers_summary = "Внимание: открытый перечень
             оснований («любое нарушение»)";
             borrower_cure_period = "not_defined".

        3. Противоречие между фрагментами.
           В одной части — закрытый перечень, в другой — «любое нарушение».
           → presence = "unclear";
             acceleration_right_kind = "not_defined";
             acceleration_triggers_summary = "Не удалось определить".

        4. Автоматическое наступление без cure period.
           "Кредит подлежит досрочному возврату при банкротстве Заёмщика."
           → presence = "present";
             acceleration_right_kind = "automatic";
             acceleration_triggers = ["возбуждение процедуры банкротства"];
             borrower_cure_period = "not_defined";
             borrower_cure_period_display = "Не установлен".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для acceleration_events_check_presence используй только: "present", "missing", "unclear".
        - Для acceleration_right_status используй только: "present", "not_defined".
        - Для acceleration_right_kind используй только: "bank_right", "automatic", "bank_obligation", "not_defined".
        - Для borrower_cure_period используй только: "present", "not_defined".
        - Для notification_required_status используй только: "present", "not_defined".
        - Для acceleration_triggers — массив строк (возможно пустой []).
        - Fallback при отсутствии данных:
          * acceleration_right_display → "Не установлено";
          * acceleration_triggers_summary → "Основания не установлены";
          * borrower_cure_period_display → "Не установлено";
          * notification_required_display → "Не установлено".
        - Fallback при противоречии или неоднозначности:
          * все display-поля → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "acceleration_events_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования по основаниям досрочного истребования. Внутреннее агрегатное signal-поле."
          required: true

        - name: "acceleration_right_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["present", "not_defined"]
          display_in_grid: false
          description: "Есть ли право / обязанность на досрочное истребование. Внутреннее enum-поле."
          required: true

        - name: "acceleration_right_kind"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["bank_right", "automatic", "bank_obligation", "not_defined"]
          display_in_grid: false
          description: >
            Режим досрочного истребования: bank_right (право Банка),
            automatic (автоматическое наступление), bank_obligation (обязанность).
            Внутреннее enum-поле.
          required: true

        - name: "acceleration_triggers"
          type: "array"
          presentation: "fact"
          label: "Основания досрочного истребования кредита"
          display_in_grid: false
          description: >
            Полный перечень оснований для досрочного возврата (массив строк для payload). Fallback: "Не установлено" / "Не удалось определить".
          required: true

        - name: "borrower_cure_period"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["present", "not_defined"]
          display_in_grid: false
          description: "Есть ли срок на устранение нарушения до истребования. Внутреннее enum-поле."
          required: true

        - name: "notification_required_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["present", "not_defined"]
          display_in_grid: false
          description: "Есть ли требование уведомления заёмщика о досрочном истребовании. Внутреннее enum-поле."
          required: true

        - name: "acceleration_right_display"
          type: "string"
          presentation: "fact"
          label: "Право на досрочное истребование"
          display_in_grid: true
          display_priority: 1
          description: >
            Понятная формулировка режима досрочного истребования для юриста.
            Fallback: "Не установлено" / "Не применимо" / "Не удалось определить".
          required: true

        - name: "acceleration_triggers_summary"
          type: "string"
          presentation: "fact"
          label: "Основания досрочного истребования"
          display_in_grid: true
          display_priority: 2
          description: >
            Краткое описание перечня оснований для юриста
            (полный список — в hidden acceleration_triggers).
            Fallback: "Основания не установлены" / "Не удалось определить".
          required: true

        - name: "borrower_cure_period_display"
          type: "string"
          presentation: "fact"
          label: "Срок на устранение нарушения"
          display_in_grid: true
          display_priority: 3
          description: >
            Понятная формулировка срока на устранение нарушения для юриста.
            Fallback: "Не установлено" / "Не применимо" / "Не удалось определить".
          required: true

        - name: "notification_required_display"
          type: "string"
          presentation: "fact"
          label: "Уведомление о досрочном истребовании"
          display_in_grid: true
          display_priority: 4
          description: >
            Понятная формулировка требования уведомления заёмщика для юриста.
            Fallback: "Не установлено" / "Не применимо" / "Не удалось определить".
          required: true

      store_payload: true

  - id: variable_rate_check
    name: "Плавающая ставка: механизм пересмотра и уведомления"
    description: >
      Проверяет формулу плавающей ставки (внешний / внутренний индикатор /
      усмотрение банка), частоту и порядок пересмотра, обязанность и способ
      уведомления заёмщика, а также ограничения на изменение ставки.
    triggers:
      any:
        - variable_rate
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "плавающая ставка"
        - "переменная ставка"
        - "ключевая ставка"
        - "RUONIA"
        - "MOSPRIME"
        - "ставка может изменяться"
        - "уведомление заемщика"
        - "порядок пересмотра"
        - "базовая ставка банка"
        - "одностороннее изменение ставки"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)(плавающ|переменн)\\s+ставк"
        - "(?i)ключев(ая|ой)\\s+ставк"
        - "(?i)(RUONIA|MOSPRIME)"
        - "(?i)уведомлен(ие|ия)\\s+заемщик"
        - "(?i)односторонн.{0,20}изменен"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется кредитный договор с плавающей ставкой.
        Проверяется только один вопрос: механизм изменения плавающей ставки,
        периодичность пересмотра, уведомление заёмщика и ограничения
        на изменение.

        Нормативный ориентир:
        - ст. 29 ФЗ № 395-1 «О банках и банковской деятельности» —
          одностороннее изменение процентной ставки по кредитному договору
          с заёмщиком-гражданином допускается только в случаях,
          предусмотренных федеральным законом или договором
        - ст. 5 п. 16 ФЗ № 353-ФЗ «О потребительском кредите (займе)» —
          ограничения на изменение ставки в одностороннем порядке

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора,
          а чего прямо нет.
        - Не оценивай серьёзность риска.
        - Различай три принципиально разных режима формулы ставки:
            1) external_index — формула привязана к внешнему публичному
               индикатору (ключевая ставка ЦБ РФ, RUONIA, MOSPRIME).
               Это классическая плавающая ставка.
            2) internal_index — формула привязана к внутреннему индикатору
               Банка (базовая ставка Банка, ставка Банка для таких кредитов).
               Это де-факто право Банка на пересмотр.
            3) bank_discretion — ставка определяется по усмотрению Банка
               без формулы. Это красный флаг (для потребительских кредитов —
               прямое нарушение ст. 29 ФЗ «О банках» / 353-ФЗ).
        - Различай уведомление предварительное (до вступления изменения
          в силу) и последующее (после изменения). Для заёмщика это
          принципиально разные режимы.
        - Фиксируй ограничения на изменение ставки, если они установлены
          в договоре (лимит изменения, периодичность изменения).

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Есть ли формула плавающей ставки (и насколько она ясна).
        2. К какому индикатору привязана формула — внешний / внутренний /
           усмотрение банка / не определено.
        3. Есть ли периодичность пересмотра (и её значение).
        4. Есть ли обязанность уведомления заёмщика (и её способ,
           срок, до или после изменения).
        5. Есть ли ограничения на изменение ставки (лимит, периодичность).
        6. Сформулируй понятные для юриста текстовые расшифровки:
           - rate_formula_display,
           - revision_frequency_display,
           - borrower_notice_display,
           - rate_change_limits_display.

        [ПРАВИЛА]
        1. Используй только текст документа. Не подставляй нормы закона
           вместо текста договора.
        2. Если параметр прямо указан в договоре — возвращай его дословно
           или делай точную выжимку.
        3. Если формула привязана к внешнему индикатору (ключевая ставка
           ЦБ РФ, RUONIA, MOSPRIME) — rate_formula_kind = "external_index".
        4. Если формула привязана к внутреннему индикатору Банка
           (базовая ставка Банка, ставка Банка) — rate_formula_kind =
           "internal_index".
        5. Если ставка определяется «по усмотрению Банка» без формулы —
           rate_formula_kind = "bank_discretion", rate_formula_status =
           "unclear", rate_formula_display = "Определяется по усмотрению
           Банка (красный флаг)".
        6. Если параметр в договоре прямо не указан:
           - для сигнальных enum-полей (rate_formula_status,
             rate_formula_kind, revision_frequency_status,
             borrower_notice_status, rate_change_limits_status) —
             возвращай "not_defined";
           - для текстовых user-facing полей (rate_formula_display,
             revision_frequency_display, borrower_notice_display,
             rate_change_limits_display) — возвращай "Не установлено".
        7. Если тема по существу не применима к данному договору —
           для user-facing поля возвращай "Не применимо",
           для сигнального — "not_defined".
        8. Если текст есть, но надёжный вывод сделать нельзя
           (двусмысленная формулировка) — для user-facing поля возвращай
           "Не удалось определить", для сигнального — "not_defined"
           (или "unclear" для rate_formula_status).
        9. Никогда не используй null, None, пустые строки или "-".
        10. Не выдумывай значения периодичности, сроков уведомления
            или лимитов изменения ставки, которых нет в тексте.
        11. При конфликтующих фрагментах отдавай приоритет более позднему
            или более специальному положению.
        12. В evidence включай только текст договора.
        13. Верни РОВНО один JSON-объект со всеми ключами из [ФОРМАТ ОТВЕТА] без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [РОССИЙСКАЯ ПРАКТИКА — ПОДСКАЗКИ]
        - Типичная формулировка плавающей ставки с внешним индексом:
          «Процентная ставка по Кредиту является переменной и определяется
          как сумма ключевой ставки Банка России, действующей на дату
          пересмотра, и 3,5% годовых» → rate_formula_kind = "external_index".
        - Формулировка с внутренним индикатором:
          «Процентная ставка определяется как базовая ставка Банка,
          действующая на дату пересмотра, плюс 2% годовых» →
          rate_formula_kind = "internal_index". Это менее выгодно заёмщику.
        - Формулировка «ставка определяется по усмотрению Банка» /
          «Банк вправе в одностороннем порядке изменять ставку» →
          rate_formula_kind = "bank_discretion", красный флаг.
        - Типичная периодичность: «ежемесячно», «ежеквартально»,
          «при изменении ключевой ставки Банка России».
        - Типичное уведомление:
            * предварительное: «Банк уведомляет Заёмщика об изменении
              ставки не позднее чем за 5 рабочих дней до даты изменения»;
            * последующее: «Банк уведомляет Заёмщика об изменении ставки
              не позднее 3 рабочих дней с даты изменения».
        - Типичные ограничения на изменение:
          «Изменение ставки допускается не чаще одного раза в квартал»,
          «Изменение ставки не может превышать 5 п.п. за один пересмотр».
        - Для потребительских кредитов одностороннее увеличение ставки
          по общему правилу не допускается (ст. 29 ФЗ «О банках»,
          353-ФЗ). Это важно для rate_formula_kind = "bank_discretion".

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — внешний индекс, ежемесячный пересмотр,
        предварительное уведомление:
        Фрагмент:
        "Процентная ставка по Кредиту является переменной и определяется
         как сумма ключевой ставки Банка России, действующей на дату
         пересмотра, и 3,5% годовых. Пересмотр ставки осуществляется
         ежемесячно в первый рабочий день месяца. Банк уведомляет Заёмщика
         об изменении ставки не позднее чем за 5 рабочих дней до даты
         изменения."

        Ответ:
        {
          "rate_formula_status": "clear",
          "rate_formula_kind": "external_index",
          "revision_frequency_status": "present",
          "borrower_notice_status": "present",
          "rate_change_limits_status": "not_defined",
          "rate_formula_display": "Ключевая ставка ЦБ РФ + 3,5 п.п.",
          "revision_frequency_display": "Ежемесячно, в первый рабочий день месяца",
          "borrower_notice_display": "Предварительное, за 5 рабочих дней до даты изменения",
          "rate_change_limits_display": "Не установлены"
        }

        Пример 2 — внутренний индикатор банка (менее выгодно заёмщику):
        Фрагмент:
        "Процентная ставка по Кредиту определяется как базовая ставка Банка,
         действующая на дату пересмотра, плюс 2 (два) процента годовых.
         Пересмотр ставки осуществляется ежеквартально."

        Ответ:
        {
          "rate_formula_status": "clear",
          "rate_formula_kind": "internal_index",
          "revision_frequency_status": "present",
          "borrower_notice_status": "not_defined",
          "rate_change_limits_status": "not_defined",
          "rate_formula_display": "Базовая ставка Банка + 2 п.п.",
          "revision_frequency_display": "Ежеквартально",
          "borrower_notice_display": "Не установлено",
          "rate_change_limits_display": "Не установлены"
        }

        Пример 3 — ставка по усмотрению банка (красный флаг):
        Фрагмент:
        "Банк вправе в одностороннем порядке изменять процентную ставку
         по Кредиту. Новая ставка устанавливается Банком и доводится
         до сведения Заёмщика."

        Ответ:
        {
          "rate_formula_status": "unclear",
          "rate_formula_kind": "bank_discretion",
          "revision_frequency_status": "not_defined",
          "borrower_notice_status": "present",
          "rate_change_limits_status": "not_defined",
          "rate_formula_display": "Определяется по усмотрению Банка (красный флаг)",
          "revision_frequency_display": "Не установлена",
          "borrower_notice_display": "Уведомление предусмотрено, срок не указан",
          "rate_change_limits_display": "Не установлены"
        }

        Пример 4 — ограничения на изменение установлены:
        Фрагмент:
        "Процентная ставка является переменной и определяется как ключевая
         ставка Банка России плюс 2,5% годовых. Изменение ставки допускается
         не чаще одного раза в квартал. Изменение ставки за один пересмотр
         не может превышать 3 (три) процентных пункта. Банк уведомляет
         Заёмщика об изменении ставки не позднее 3 рабочих дней с даты
         изменения."

        Ответ:
        {
          "rate_formula_status": "clear",
          "rate_formula_kind": "external_index",
          "revision_frequency_status": "present",
          "borrower_notice_status": "present",
          "rate_change_limits_status": "present",
          "rate_formula_display": "Ключевая ставка ЦБ РФ + 2,5 п.п.",
          "revision_frequency_display": "Не чаще одного раза в квартал",
          "borrower_notice_display": "После изменения, не позднее 3 рабочих дней",
          "rate_change_limits_display": "Изменение не более 3 п.п. за один пересмотр"
        }

        Пример 5 — данных нет:
        Фрагмент:
        "Иные условия определяются в соответствии с действующим
         законодательством Российской Федерации."

        Ответ:
        {
          "rate_formula_status": "not_defined",
          "rate_formula_kind": "not_defined",
          "revision_frequency_status": "not_defined",
          "borrower_notice_status": "not_defined",
          "rate_change_limits_status": "not_defined",
          "rate_formula_display": "Не установлено",
          "revision_frequency_display": "Не установлена",
          "borrower_notice_display": "Не установлено",
          "rate_change_limits_display": "Не установлены"
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о формуле ставки.
        2. Определи, к какому индикатору привязана формула:
           внешний / внутренний / усмотрение банка / неясно.
        3. Найди прямую цитату о периодичности пересмотра. Зафиксируй
           значение (ежемесячно, ежеквартально, при изменении индикатора).
        4. Найди прямую цитату об уведомлении. Различай предварительное
           и последующее уведомление.
        5. Найди ограничения на изменение ставки, если они есть.
        6. Сформулируй все четыре user-facing display-поля кратко и по-русски.
        7. Если прямых цитат нет — верни fallback по правилам 6–8.

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь РОВНО одним JSON-объектом без какого-либо дополнительного текста до или после, со всеми 9 ключами:
        {
          "rate_formula_status": "<clear / unclear / not_defined>",
          "rate_formula_kind": "<external_index / internal_index / bank_discretion / not_defined>",
          "revision_frequency_status": "<present / not_defined>",
          "borrower_notice_status": "<present / not_defined>",
          "rate_change_limits_status": "<present / not_defined>",
          "rate_formula_display": "<текст или 'Не установлено' / 'Не применимо' / 'Не удалось определить'>",
          "revision_frequency_display": "<текст, 'Не установлена', 'Не применимо' или 'Не удалось определить'>",
          "borrower_notice_display": "<текст, 'Не установлено', 'Не применимо' или 'Не удалось определить'>",
          "rate_change_limits_display": "<текст, 'Не установлены', 'Не применимо' или 'Не удалось определить'>"
        }
      context_k: 8
      temperature: 0.0
      max_tokens: 900

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "плавающая ставка переменная ставка формула ключевая ставка RUONIA MOSPRIME базовая ставка банка порядок пересмотра ставки периодичность пересмотра предварительное уведомление заемщика уведомление об изменении ставки одностороннее изменение ставки ограничения изменения ставки"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
      negative_keywords:
        - "означает"
        - "в целях настоящего"
        - "пск"
        - "комиссия"
        - "предмет договора"
        - "обеспечение"
      position_bias:
        preferred_range: [0.10, 0.50]
        boost: 0.12
        scope: segment
      context_k: 8
      max_chunks: 10
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
        - "invoice"
      preferred_clause_functions:
        - "obligations"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 35
      max_snippet_length: 520

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1300

      compact_output: false

      presence_signal:
        field: "variable_rate_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста кредитного договора сведения
        о механизме плавающей ставки: формулу и её тип (внешний индекс /
        внутренний индекс / усмотрение банка), периодичность пересмотра,
        уведомление заёмщика и ограничения на изменение ставки.
        Не анализируй обеспечение, ковенанты, комиссии или ПСК.
        Не оценивай риски. Анализируй только текст договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля (все ключи должны присутствовать в ответе):

        0. variable_rate_check_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (rate_formula_status, rate_formula_kind,
              revision_frequency_status, borrower_notice_status,
              rate_change_limits_status) ≠ "not_defined";
           - "missing" — если все пять содержательных полей = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Важно: rate_formula_status = "unclear" и
           rate_formula_kind = "bank_discretion" считаются ≠ "not_defined"
           и дают presence = "present".

           Если presence = "missing":
           - rate_formula_status = "not_defined";
           - rate_formula_kind = "not_defined";
           - revision_frequency_status = "not_defined";
           - borrower_notice_status = "not_defined";
           - rate_change_limits_status = "not_defined";
           - rate_formula_display = "Не установлено";
           - revision_frequency_display = "Не установлена";
           - borrower_notice_display = "Не установлено";
           - rate_change_limits_display = "Не установлены";
           - не выполняй остальные шаги.

        1. rate_formula_status — ясность формулы плавающей ставки:
           - "clear" — формула ясно указана в тексте (конкретный индикатор
             + маржа или конкретный порядок определения);
           - "unclear" — формула неясна, двусмысленна или определяется
             по усмотрению Банка без конкретного механизма;
           - "not_defined" — формула плавающей ставки не указана.

        2. rate_formula_kind — тип формулы:
           - "external_index" — привязка к внешнему публичному индикатору
             (ключевая ставка ЦБ РФ, RUONIA, MOSPRIME);
           - "internal_index" — привязка к внутреннему индикатору Банка
             (базовая ставка Банка, ставка Банка для данного продукта);
           - "bank_discretion" — ставка определяется по усмотрению Банка
             без формулы («Банк вправе в одностороннем порядке изменять
             ставку»);
           - "not_defined" — тип формулы не определён.

        3. revision_frequency_status — периодичность пересмотра:
           - "present" — периодичность пересмотра прямо указана
             (ежемесячно, ежеквартально, при изменении индикатора и т.п.);
           - "not_defined" — периодичность прямо не указана.

        4. borrower_notice_status — уведомление заёмщика:
           - "present" — договор устанавливает обязанность уведомления
             заёмщика об изменении ставки (предварительное или последующее);
           - "not_defined" — уведомление прямо не упомянуто.

        5. rate_change_limits_status — ограничения на изменение:
           - "present" — договор устанавливает ограничения (лимит изменения
             за один пересмотр, минимальная периодичность, cap/floor);
           - "not_defined" — ограничения прямо не установлены.

        6. rate_formula_display — краткая формулировка для юриста.
           Примеры:
           - "Ключевая ставка ЦБ РФ + 3,5 п.п.";
           - "Базовая ставка Банка + 2 п.п.";
           - "Определяется по усмотрению Банка (красный флаг)";
           - "Определяется по Приложению №1";
           - "Не установлено" / "Не применимо" / "Не удалось определить".

        7. revision_frequency_display — краткая формулировка.
           Примеры:
           - "Ежемесячно, в первый рабочий день месяца";
           - "Ежеквартально";
           - "При изменении ключевой ставки ЦБ РФ";
           - "Не чаще одного раза в квартал";
           - "Не установлена" / "Не применимо" / "Не удалось определить".

        8. borrower_notice_display — краткая формулировка.
           Примеры:
           - "Предварительное, за 5 рабочих дней до даты изменения";
           - "После изменения, не позднее 3 рабочих дней";
           - "Уведомление предусмотрено, срок не указан";
           - "Не установлено" / "Не применимо" / "Не удалось определить".

        9. rate_change_limits_display — краткая формулировка.
           Примеры:
           - "Изменение не более 3 п.п. за один пересмотр";
           - "Не чаще одного раза в квартал, не более 5 п.п.";
           - "Не установлены" / "Не применимо" / "Не удалось определить".
        </task>

        <context_rules>
        - Перед остальными полями заполни variable_rate_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все enum-поля = "not_defined", все display-поля = соответствующий fallback.
        - Используй только релевантные фрагменты контекста.
        - Не подставляй нормы закона, обычную практику или предположения вместо текста договора.
        - Не делай выводов по типовой структуре кредитного договора.
        - Различай три режима формулы: external_index / internal_index / bank_discretion.
        - «По усмотрению Банка» — это rate_formula_kind = "bank_discretion", а не "unclear"
          в смысле «непонятно». Это осознанный режим (красный флаг).
        - Различай уведомление предварительное (до изменения) и последующее (после).
          Отражай в borrower_notice_display.
        - Фиксируй конкретные значения периодичности и лимитов, а не только факт наличия.
        - Не выдумывай периодичность, сроки уведомления и лимиты, которых нет в тексте.
        - Если в разных фрагментах указаны разные данные и конфликт нельзя
          разрешить по тексту: enum → "not_defined" (или "unclear" для rate_formula_status),
          display → "Не удалось определить".
        - Не используй null, None, пустые строки или "-".
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни формулы, ни механизма пересмотра, ни уведомления.
           → presence = "missing";
             все enum-поля = "not_defined";
             все display-поля = "Не установлено" / "Не установлена" / "Не установлены".

        2. Формула есть, но периодичность и уведомление не раскрыты.
           "Ставка = ключевая ставка ЦБ РФ + 3 п.п." без указания
           периодичности пересмотра и уведомления.
           → presence = "present";
             rate_formula_status = "clear";
             rate_formula_kind = "external_index";
             revision_frequency_status = "not_defined";
             borrower_notice_status = "not_defined".

        3. Противоречие между фрагментами.
           В одной части — пересмотр ежемесячно, в другой — ежеквартально.
           → presence = "unclear";
             revision_frequency_status = "not_defined";
             revision_frequency_display = "Не удалось определить".

        4. Ставка по усмотрению банка (красный флаг).
           "Банк вправе в одностороннем порядке изменять ставку."
           → presence = "present";
             rate_formula_status = "unclear";
             rate_formula_kind = "bank_discretion";
             rate_formula_display = "Определяется по усмотрению Банка (красный флаг)".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для variable_rate_check_presence используй только: "present", "missing", "unclear".
        - Для rate_formula_status используй только: "clear", "unclear", "not_defined".
        - Для rate_formula_kind используй только: "external_index", "internal_index", "bank_discretion", "not_defined".
        - Для revision_frequency_status, borrower_notice_status, rate_change_limits_status используй только: "present", "not_defined".
        - Fallback при отсутствии данных:
          * rate_formula_display → "Не установлено";
          * revision_frequency_display → "Не установлена";
          * borrower_notice_display → "Не установлено";
          * rate_change_limits_display → "Не установлены".
        - Fallback при противоречии или неоднозначности:
          * все display-поля → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "variable_rate_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования по механизму плавающей ставки. Внутреннее агрегатное signal-поле."
          required: true

        - name: "rate_formula_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["clear", "unclear", "not_defined"]
          display_in_grid: false
          description: "Понятность формулы плавающей ставки. unclear — формула неясна или по усмотрению Банка. Внутреннее enum-поле."
          required: true

        - name: "rate_formula_kind"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["external_index", "internal_index", "bank_discretion", "not_defined"]
          display_in_grid: false
          description: >
            Тип формулы: external_index (внешний публичный индикатор),
            internal_index (внутренний индикатор Банка),
            bank_discretion (по усмотрению Банка — красный флаг).
            Внутреннее enum-поле.
          required: true

        - name: "revision_frequency_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["present", "not_defined"]
          display_in_grid: false
          description: "Есть ли периодичность пересмотра ставки. Внутреннее enum-поле."
          required: true

        - name: "borrower_notice_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["present", "not_defined"]
          display_in_grid: false
          description: "Есть ли обязанность уведомления заёмщика об изменении ставки. Внутреннее enum-поле."
          required: true

        - name: "rate_change_limits_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["present", "not_defined"]
          display_in_grid: false
          description: "Есть ли ограничения на изменение ставки (лимит, периодичность). Внутреннее enum-поле."
          required: true

        - name: "rate_formula_display"
          type: "string"
          presentation: "fact"
          label: "Формула плавающей ставки"
          display_in_grid: true
          display_priority: 1
          description: >
            Понятная формулировка формулы плавающей ставки для юриста.
            Fallback: "Не установлено" / "Не применимо" / "Не удалось определить".
          required: true

        - name: "revision_frequency_display"
          type: "string"
          presentation: "fact"
          label: "Периодичность пересмотра"
          display_in_grid: true
          display_priority: 2
          description: >
            Понятная формулировка периодичности пересмотра ставки для юриста.
            Fallback: "Не установлена" / "Не применимо" / "Не удалось определить".
          required: true

        - name: "borrower_notice_display"
          type: "string"
          presentation: "fact"
          label: "Уведомление заёмщика"
          display_in_grid: true
          display_priority: 3
          description: >
            Понятная формулировка способа и срока уведомления заёмщика об изменении ставки.
            Fallback: "Не установлено" / "Не применимо" / "Не удалось определить".
          required: true

        - name: "rate_change_limits_display"
          type: "string"
          presentation: "fact"
          label: "Ограничения изменения ставки"
          display_in_grid: true
          display_priority: 4
          description: >
            Понятная формулировка ограничений на изменение ставки (лимит, периодичность).
            Fallback: "Не установлены" / "Не применимо" / "Не удалось определить".
          required: true

      store_payload: true

  - id: payment_allocation_priority_check
    name: "Очередность списания поступающих платежей"
    description: >
      Проверяет порядок распределения платежей между основным долгом,
      процентами, штрафами и расходами, а также отклонение договорной
      очерёдности от ст. 319 ГК РФ.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "очередность списания"
        - "порядок погашения"
        - "в первую очередь"
        - "направление платежей"
        - "поступающие средства"
        - "при недостаточности средств"
        - "ст. 319 ГК РФ"
        - "неустойка"
        - "по усмотрению банка"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)очередност[ьи]\\s+списан"
        - "(?i)в\\s+первую\\s+очередь"
        - "(?i)направля(ются|ется)\\s+в\\s+следующей\\s+очередности"
        - "(?i)при\\s+недостаточности\\s+средств"
        - "(?i)стать[ия]\\s+319\\s+ГК"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется кредитный договор.
        Проверяется только один вопрос: очерёдность списания поступающих
        платежей и её соответствие / отклонение от ст. 319 ГК РФ.

        Нормативный ориентир:
        - ст. 319 ГК РФ — законная очерёдность погашения требований
          по денежному обязательству: (1) издержки кредитора по получению
          исполнения, (2) проценты, (3) основная сумма долга
        - ст. 5 п. 20 ФЗ № 353-ФЗ — очерёдность погашения задолженности
          заёмщика по потребительскому кредиту

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора,
          а чего прямо нет.
        - Не оценивай серьёзность риска.
        - Различай три принципиально разных режима:
            1) defined — очерёдность прямо установлена договором
               (либо через прямой перечень, либо через отсылку к ст. 319
               ГК РФ, что означает законную очерёдность);
            2) bank_discretion — очерёдность определяется по усмотрению
               Банка (красный флаг);
            3) not_defined — очерёдность в договоре не установлена.
        - Отдельно фиксируй отклонение договорной очерёдности от ст. 319
          ГК РФ:
            * standard — договорная очерёдность совпадает с законной
              (или прямо отсылает к ст. 319 ГК РФ);
            * deviates — договорная очерёдность отличается от законной
              (например, неустойка или штрафы приоритетнее основного долга
              или процентов);
            * not_defined — договорная очерёдность не установлена или
              невозможно определить отклонение.
        - Отсылка к закону («погашение производится в очерёдности,
          установленной законодательством Российской Федерации») —
          это не «отсутствие очерёдности», а законная очерёдность.
          allocation_order_status = "defined",
          allocation_order_deviation_status = "standard".

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Есть ли очерёдность списания (и в каком режиме — договорная,
           законная, по усмотрению банка).
        2. Полный упорядоченный перечень категорий погашения.
        3. Отклоняется ли договорная очерёдность от ст. 319 ГК РФ
           (неустойка / штрафы приоритетнее основного долга или процентов —
           это существенное отклонение).
        4. Сформулируй понятные для юриста текстовые расшифровки:
           - allocation_order_summary (кратко),
           - allocation_order_deviation_display.

        [ПРАВИЛА]
        1. Используй только текст документа. Не подставляй нормы закона
           вместо текста договора, кроме случая, когда договор прямо
           отсылает к закону.
        2. Если очерёдность прямо указана в договоре — возвращай её
           дословно или делай точную выжимку.
        3. `allocation_order_details` — массив строк, каждая строка — одна
           категория в порядке очерёдности, например:
           ["издержки Кредитора", "просроченные проценты",
            "просроченный основной долг", "текущие проценты",
            "текущий основной долг", "неустойка"].
           Если очерёдность не установлена или определяется по усмотрению
           банка — верни пустой массив [].
        4. `allocation_order_summary` — КРАТКОЕ summary, например:
           - "Законная (ст. 319 ГК РФ)";
           - "Договорная: 6 категорий, неустойка в конце";
           - "Договорная: неустойка приоритетнее основного долга
             (существенное отклонение)";
           - "По усмотрению Банка (красный флаг)";
           - "Не установлена".
           НЕ дублируй полный перечень в summary — он хранится в
           allocation_order_details.
        5. Если в договоре очерёдность определяется «по усмотрению Банка»
           или аналогично — allocation_order_status = "bank_discretion",
           allocation_order_details = [].
        6. Если договорная очерёдность отличается от законной в части
           приоритета неустойки / штрафов над основным долгом или
           процентами — allocation_order_deviation_status = "deviates".
           Это существенное отклонение.
        7. Если параметр в договоре прямо не указан:
           - для сигнальных enum-полей (allocation_order_status,
             allocation_order_deviation_status) — возвращай "not_defined";
           - для текстовых user-facing полей (allocation_order_summary,
             allocation_order_deviation_display) — возвращай
             "Не установлена" (или "Не установлено" по роду);
           - для массива allocation_order_details — пустой массив [].
        8. Если тема по существу не применима к данному договору —
           для user-facing поля возвращай "Не применимо",
           для сигнального — "not_defined".
        9. Если текст есть, но надёжный вывод сделать нельзя
           (двусмысленная формулировка) — для user-facing поля возвращай
           "Не удалось определить", для сигнального — "not_defined".
        10. Никогда не используй null, None, пустые строки или "-"
            внутри строковых значений. Пустой массив [] — валидное
            значение для allocation_order_details, но не для строковых
            полей.
        11. При конфликтующих фрагментах отдавай приоритет более позднему
            или более специальному положению.
        12. В evidence включай только текст договора.
        13. Верни РОВНО один JSON-объект со всеми ключами из [ФОРМАТ ОТВЕТА] без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [РОССИЙСКАЯ ПРАКТИКА — ПОДСКАЗКИ]
        - Типичная законная очерёдность (ст. 319 ГК РФ):
            1) издержки кредитора по получению исполнения;
            2) проценты;
            3) основная сумма долга.
        - Типичная договорная очерёдность в банковских кредитах:
            1) издержки Кредитора;
            2) просроченные проценты;
            3) просроченный основной долг;
            4) текущие проценты;
            5) текущий основной долг;
            6) неустойка (штрафы, пени).
          Такая очерёдность в целом соответствует ст. 319 ГК РФ
          (неустойка в конце) → allocation_order_deviation_status = "standard".
        - Существенное отклонение (красный флаг):
            * неустойка / штрафы стоят ВЫШЕ основного долга или процентов;
            * комиссии приоритетнее процентов и основного долга;
            * «очерёдность определяется Банком» / «по усмотрению Банка».
          Для потребительских кредитов такие формулировки спорны и часто
          оспариваются в суде.
        - Формулировка «погашение производится в очерёдности, установленной
          законодательством Российской Федерации» — это отсылка к ст. 319
          ГК РФ, очерёдность = "defined", deviation = "standard".
        - Формулировка «по усмотрению Банка» без конкретного перечня —
          allocation_order_status = "bank_discretion".

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — законная очерёдность через отсылку:
        Фрагмент:
        "Сумма произведённого Заёмщиком платежа, недостаточная для
         исполнения денежного обязательства полностью, погашает прежде
         всего издержки Кредитора по получению исполнения, затем —
         проценты, а в оставшейся части — основную сумму долга."

        Ответ:
        {
          "allocation_order_status": "defined",
          "allocation_order_deviation_status": "standard",
          "allocation_order_details": [
            "издержки Кредитора по получению исполнения",
            "проценты",
            "основная сумма долга"
          ],
          "allocation_order_summary": "Законная (ст. 319 ГК РФ)",
          "allocation_order_deviation_display": "Не отклоняется от ст. 319 ГК РФ"
        }

        Пример 2 — договорная очерёдность, соответствующая ст. 319 ГК РФ:
        Фрагмент:
        "Поступающие от Заёмщика денежные средства направляются
         в следующей очерёдности: 1) издержки Кредитора; 2) просроченные
         проценты; 3) просроченный основной долг; 4) текущие проценты;
         5) текущий основной долг; 6) неустойка."

        Ответ:
        {
          "allocation_order_status": "defined",
          "allocation_order_deviation_status": "standard",
          "allocation_order_details": [
            "издержки Кредитора",
            "просроченные проценты",
            "просроченный основной долг",
            "текущие проценты",
            "текущий основной долг",
            "неустойка"
          ],
          "allocation_order_summary": "Договорная: 6 категорий, неустойка в конце",
          "allocation_order_deviation_display": "Не отклоняется от ст. 319 ГК РФ"
        }

        Пример 3 — существенное отклонение (неустойка выше основного долга):
        Фрагмент:
        "Платежи Заёмщика направляются в следующей очерёдности:
         1) неустойка; 2) просроченные проценты; 3) просроченный основной
         долг; 4) текущие проценты; 5) текущий основной долг."

        Ответ:
        {
          "allocation_order_status": "defined",
          "allocation_order_deviation_status": "deviates",
          "allocation_order_details": [
            "неустойка",
            "просроченные проценты",
            "просроченный основной долг",
            "текущие проценты",
            "текущий основной долг"
          ],
          "allocation_order_summary": "Договорная: неустойка приоритетнее основного долга (существенное отклонение)",
          "allocation_order_deviation_display": "Существенное отклонение: неустойка погашается до основного долга и процентов"
        }

        Пример 4 — по усмотрению банка (красный флаг):
        Фрагмент:
        "Платежи Заёмщика направляются на погашение задолженности
         в очерёдности, определяемой Банком."

        Ответ:
        {
          "allocation_order_status": "bank_discretion",
          "allocation_order_deviation_status": "not_defined",
          "allocation_order_details": [],
          "allocation_order_summary": "По усмотрению Банка (красный флаг)",
          "allocation_order_deviation_display": "Не удалось определить (очерёдность не установлена договором)"
        }

        Пример 5 — данных нет:
        Фрагмент:
        "Иные условия определяются в соответствии с действующим
         законодательством Российской Федерации."

        Ответ:
        {
          "allocation_order_status": "not_defined",
          "allocation_order_deviation_status": "not_defined",
          "allocation_order_details": [],
          "allocation_order_summary": "Не установлена",
          "allocation_order_deviation_display": "Не установлено"
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату об очерёдности списания.
        2. Определи режим: договорная / законная (через отсылку к ст. 319
           ГК РФ) / по усмотрению Банка.
        3. Составь упорядоченный перечень категорий для
           allocation_order_details.
        4. Сравни с законной очерёдностью по ст. 319 ГК РФ. Если неустойка
           или штрафы приоритетнее основного долга / процентов — это
           deviation = "deviates".
        5. Сформулируй краткое summary и deviation_display.
        6. Если прямых цитат нет — верни fallback по правилам 7–9.

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь РОВНО одним JSON-объектом без какого-либо дополнительного текста до или после, со всеми 5 ключами:
        {
          "allocation_order_status": "<defined / bank_discretion / not_defined>",
          "allocation_order_deviation_status": "<standard / deviates / not_defined>",
          "allocation_order_details": ["<категория 1>", "<категория 2>"],
          "allocation_order_summary": "<краткое summary, 'Не установлена', 'Не применимо' или 'Не удалось определить'>",
          "allocation_order_deviation_display": "<текст, 'Не установлено', 'Не применимо' или 'Не удалось определить'>"
        }
      context_k: 8
      temperature: 0.0
      max_tokens: 700

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "очередность списания поступающих платежей порядок погашения задолженности в первую очередь при недостаточности средств направление платежей неустойка основной долг проценты ст. 319 ГК РФ по усмотрению банка"
      preferred_unit_types:
        - obligation
        - payment_term
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - procedures
      negative_keywords:
        - "означает"
        - "в целях настоящего"
        - "процентная ставка"
        - "пск"
        - "предмет договора"
        - "обеспечение"
      position_bias:
        preferred_range: [0.20, 0.60]
        boost: 0.12
        scope: segment
      context_k: 8
      max_chunks: 10
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
        - "invoice"
      preferred_clause_functions:
        - "obligations"
        - "procedures"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 30
      max_snippet_length: 450

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1200

      compact_output: false

      presence_signal:
        field: "payment_allocation_priority_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста кредитного договора сведения
        об очерёдности списания поступающих платежей: режим очерёдности
        (договорная / законная / по усмотрению банка), полный упорядоченный
        перечень категорий погашения и отклонение от ст. 319 ГК РФ.
        Не анализируй обеспечение, ковенанты, проценты, ПСК или последствия
        нарушения. Не оценивай риски. Анализируй только текст договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля (все ключи должны присутствовать в ответе):

        0. payment_allocation_priority_check_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (allocation_order_status, allocation_order_deviation_status)
             ≠ "not_defined";
           - "missing" — если оба содержательных поля = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Важно: allocation_order_status = "bank_discretion" и
           allocation_order_deviation_status = "deviates" считаются
           ≠ "not_defined" и дают presence = "present".

           Если presence = "missing":
           - allocation_order_status = "not_defined";
           - allocation_order_deviation_status = "not_defined";
           - allocation_order_details = [];
           - allocation_order_summary = "Не установлена";
           - allocation_order_deviation_display = "Не установлено";
           - не выполняй остальные шаги.

        1. allocation_order_status — режим очерёдности:
           - "defined" — очерёдность прямо установлена договором
             (прямой перечень категорий или отсылка к ст. 319 ГК РФ /
             законодательству РФ);
           - "bank_discretion" — очерёдность определяется по усмотрению
             Банка («в очерёдности, определяемой Банком»);
           - "not_defined" — очерёдность в договоре не установлена.

        2. allocation_order_deviation_status — отклонение от ст. 319 ГК РФ:
           - "standard" — очерёдность совпадает с законной (ст. 319 ГК РФ)
             или договор прямо отсылает к закону;
           - "deviates" — очерёдность отличается от законной
             (неустойка / штрафы / комиссии приоритетнее основного долга
             или процентов);
           - "not_defined" — очерёдность не установлена или отклонение
             определить невозможно.

        3. allocation_order_details — массив строк, каждая строка — одна
           категория в порядке очерёдности.
           Правила:
           - перечисляй категории в том порядке, в котором они указаны
             в договоре;
           - если очерёдность не установлена или определяется по
             усмотрению Банка — верни пустой массив [];
           - не дублируй категории.

        4. allocation_order_summary — КРАТКОЕ summary для юриста.
           Примеры:
           - "Законная (ст. 319 ГК РФ)";
           - "Договорная: 6 категорий, неустойка в конце";
           - "Договорная: неустойка приоритетнее основного долга
             (существенное отклонение)";
           - "По усмотрению Банка (красный флаг)";
           - "Не установлена" / "Не применимо" / "Не удалось определить".
           НЕ дублируй полный перечень — он в allocation_order_details.

        5. allocation_order_deviation_display — краткая формулировка
           отклонения от ст. 319 ГК РФ.
           Примеры:
           - "Не отклоняется от ст. 319 ГК РФ";
           - "Существенное отклонение: неустойка погашается до основного
             долга и процентов";
           - "Не установлено" / "Не применимо" / "Не удалось определить".
        </task>

        <context_rules>
        - Перед остальными полями заполни payment_allocation_priority_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все enum-поля = "not_defined", allocation_order_details = [], все display-поля = соответствующий fallback.
        - Используй только релевантные фрагменты контекста.
        - Не подставляй нормы закона, кроме случая, когда договор прямо отсылает к закону.
        - Не делай выводов по типовой структуре кредитного договора.
        - Отсылка к закону («в очерёдности, установленной законодательством РФ») —
          это "defined" + deviation = "standard", а НЕ "not_defined".
        - Если неустойка или штрафы приоритетнее основного долга или процентов —
          allocation_order_deviation_status = "deviates". Это существенное отклонение.
        - «По усмотрению Банка» — allocation_order_status = "bank_discretion",
          allocation_order_details = [].
        - allocation_order_summary — краткое summary, НЕ полный перечень.
        - Не выдумывай категории и порядок, которых нет в тексте.
        - Если в разных фрагментах указаны разные данные и конфликт нельзя
          разрешить по тексту: enum → "not_defined", display → "Не удалось определить".
        - Не используй null, None, пустые строки или "-" в строковых полях.
        - Пустой массив [] — валидное значение для allocation_order_details.
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни очерёдности, ни отсылки к ст. 319 ГК РФ.
           → presence = "missing";
             allocation_order_status = allocation_order_deviation_status = "not_defined";
             allocation_order_details = [];
             allocation_order_summary = "Не установлена";
             allocation_order_deviation_display = "Не установлено".

        2. Отсылка к закону без прямого перечня.
           "Погашение производится в очерёдности, установленной
           законодательством Российской Федерации."
           → presence = "present";
             allocation_order_status = "defined";
             allocation_order_deviation_status = "standard";
             allocation_order_details = [];
             allocation_order_summary = "Законная (ст. 319 ГК РФ)";
             allocation_order_deviation_display = "Не отклоняется от ст. 319 ГК РФ".

        3. Противоречие между фрагментами.
           В одной части — неустойка в конце, в другой — неустойка
           в первую очередь.
           → presence = "unclear";
             allocation_order_deviation_status = "not_defined";
             allocation_order_deviation_display = "Не удалось определить".

        4. По усмотрению банка (красный флаг).
           "Очерёдность погашения определяется Банком."
           → presence = "present";
             allocation_order_status = "bank_discretion";
             allocation_order_details = [];
             allocation_order_summary = "По усмотрению Банка (красный флаг)".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для payment_allocation_priority_check_presence используй только: "present", "missing", "unclear".
        - Для allocation_order_status используй только: "defined", "bank_discretion", "not_defined".
        - Для allocation_order_deviation_status используй только: "standard", "deviates", "not_defined".
        - Для allocation_order_details — массив строк (возможно пустой []).
        - Fallback при отсутствии данных:
          * allocation_order_summary → "Не установлена";
          * allocation_order_deviation_display → "Не установлено".
        - Fallback при противоречии или неоднозначности:
          * allocation_order_summary → "Не удалось определить";
          * allocation_order_deviation_display → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "payment_allocation_priority_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования по очерёдности списания платежей. Внутреннее агрегатное signal-поле."
          required: true

        - name: "allocation_order_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "bank_discretion", "not_defined"]
          display_in_grid: false
          description: >
            Режим очерёдности: defined (договорная / законная),
            bank_discretion (по усмотрению банка — красный флаг),
            not_defined. Внутреннее enum-поле.
          required: true

        - name: "allocation_order_deviation_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["standard", "deviates", "not_defined"]
          display_in_grid: false
          description: >
            Отклонение договорной очерёдности от ст. 319 ГК РФ:
            standard (соответствует), deviates (существенное отклонение).
            Внутреннее enum-поле.
          required: true

        - name: "allocation_order_details"
          type: "array"
          presentation: "fact"
          label: "Очередность погашения требований"
          display_in_grid: false
          description: >
            Полный упорядоченный перечень категорий погашения (массив строк для payload). Fallback: "Не установлено" / "Не удалось определить".
          required: true

        - name: "allocation_order_summary"
          type: "string"
          presentation: "fact"
          label: "Очерёдность списания"
          display_in_grid: true
          display_priority: 1
          description: >
            Краткое описание очерёдности списания (полный список — в hidden allocation_order_details).
            Fallback: "Не установлена" / "Не применимо" / "Не удалось определить".
          required: true

        - name: "allocation_order_deviation_display"
          type: "string"
          presentation: "fact"
          label: "Отклонение от ст. 319 ГК РФ"
          display_in_grid: true
          display_priority: 2
          description: >
            Понятная формулировка отклонения договорной очерёдности от ст. 319 ГК РФ.
            Fallback: "Не установлено" / "Не применимо" / "Не удалось определить".
          required: true

      store_payload: true

  - id: financial_covenants_check
    name: "Финансовые ковенанты и последствия их нарушения"
    description: >
      Проверяет наличие финансовых ковенантов, их тип (maintenance /
      incurrence), формулировки и пороги, периодичность проверки,
      последствия нарушения и наличие срока на исправление.

      Специализация global check financial_covenants: в дополнение
      к базовому набору (наличие, тип, пороги, cure mechanism,
      cross-default как ковенант) doc-type дополнительно фиксирует
      breach_consequences (event of default / acceleration /
      margin increase / waiver) и review_frequency_status
      (периодичность проверки ковенантов).
    triggers:
      any:
        - financial_covenants
        - corporate_borrower
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "ковенант"
        - "финансовые показатели"
        - "долговая нагрузка"
        - "ebitda"
        - "чистый долг"
        - "коэффициент покрытия"
        - "собственный капитал"
        - "current ratio"
        - "maintenance"
        - "incurrence"
        - "event of default"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)ковенант"
        - "(?i)debt.*ebitda|ebitda"
        - "(?i)коэффициент\\s+покрытия"
        - "(?i)(current|quick)\\s+ratio"
        - "(?i)event\\s+of\\s+default"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется кредитный договор с финансовыми ковенантами.
        Проверяется только один вопрос: наличие, тип и формулировки
        финансовых ковенантов, периодичность их проверки, последствия
        нарушения и наличие срока на исправление.

        Нормативный ориентир:
        - ст. 819, 821 ГК РФ — кредитный договор и основания для
          досрочного истребования
        - Указание Банка России № 4892-У от 25.10.2018 — для отдельных
          категорий заёмщиков

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора,
          а чего прямо нет.
        - Не оценивай серьёзность риска.
        - Различай два принципиально разных типа ковенантов:
            1) maintenance — поддерживать показатель на определённом
               уровне в течение всего срока (проверяется периодически);
            2) incurrence — не допускать нарушения показателя при
               совершении определённых действий (проверяется при событии).
        - Различай event of default (событие дефолта как триггер)
          и acceleration (досрочное истребование как последствие).
        - Различай waiver (согласие Банка на отступление) — это
          не «последствие нарушения», а «способ обхода».
        - Ковенанты «без конкретных порогов» («по требованию Банка»,
          «по усмотрению Банка») — это красный флаг. Обязательно отражай
          такие формулировки в summary.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Есть ли финансовые ковенанты (и насколько конкретны их
           формулировки).
        2. Какие типы ковенантов установлены — maintenance, incurrence,
           или смешанные.
        3. Полный перечень ковенантов с формулами и порогами.
        4. Какова периодичность проверки ковенантов.
        5. Каковы последствия нарушения (event of default, acceleration,
           margin increase, cross-default, waiver).
        6. Есть ли срок на исправление (cure period) — и его значение.
        7. Сформулируй понятные для юриста текстовые расшифровки:
           - covenants_summary,
           - covenant_kind_display,
           - breach_consequences_display,
           - cure_period_display.

        [ПРАВИЛА]
        1. Используй только текст документа. Не подставляй нормы закона
           вместо текста договора.
        2. Если ковенант указан в договоре — возвращай его формулу
           с порогом (например, «отношение чистого долга к EBITDA
           не более 3,5x»), а не только тип.
        3. `covenant_types` — массив строк, каждая строка — один ковенант
           с формулой и порогом, например:
           ["чистый долг / EBITDA ≤ 3,5x",
            "коэффициент текущей ликвидности ≥ 1,2",
            "собственный капитал ≥ 500 млн руб."].
           Если ковенантов нет в тексте — пустой массив [].
        4. `covenants_summary` — краткое summary для юриста, например:
           - "3 ковенанта, maintenance, проверка ежеквартально";
           - "1 ковенант (incurrence): debt/EBITDA ≤ 4,0x при новом долге";
           - "Внимание: ковенанты без конкретных порогов (красный флаг)";
           - "Не установлены".
           НЕ дублируй полный перечень в summary.
        5. Если ковенанты в договоре сформулированы без конкретных
           порогов («по требованию Банка», «по усмотрению Банка»,
           «по оценке Банка») — covenants_present = "vague",
           covenant_types = [].
        6. Если нарушение ковенанта квалифицируется как событие дефолта
           (event of default), дающее Банку право требовать досрочного
           возврата — breach_consequences = "event_of_default". Если
           в договоре прямо указано «досрочное истребование» — это
           дополнительно фиксируй в breach_consequences_display.
        7. Если нарушение ковенанта ведёт к повышению ставки
           (margin increase) — breach_consequences = "margin_increase".
           Если несколько последствий — выбирай наиболее значимое
           (event_of_default > acceleration > margin_increase > cross_default > waiver_required).
        8. Если параметр в договоре прямо не указан:
           - для сигнальных enum-полей (covenants_present, covenant_kind,
             breach_consequences, cure_period_present,
             review_frequency_status) — возвращай "not_defined";
           - для текстовых user-facing полей (covenants_summary,
             covenant_kind_display, breach_consequences_display,
             cure_period_display) — возвращай "Не установлены" /
             "Не установлено" по роду;
           - для массива covenant_types — пустой массив [].
        9. Если тема по существу не применима к данному договору —
           для user-facing поля возвращай "Не применимо",
           для сигнального — "not_defined".
        10. Если текст есть, но надёжный вывод сделать нельзя —
            для user-facing поля возвращай "Не удалось определить",
            для сигнального — "not_defined".
        11. Никогда не используй null, None, пустые строки или "-"
            внутри строковых значений. Пустой массив [] — валидное
            значение для covenant_types.
        12. Не выдумывай пороги и сроки, которых нет в тексте.
        13. При конфликтующих фрагментах отдавай приоритет более позднему
            или более специальному положению.
        14. В evidence включай только текст договора.
        15. Верни РОВНО один JSON-объект со всеми ключами из [ФОРМАТ ОТВЕТА] без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [РОССИЙСКАЯ ПРАКТИКА — ПОДСКАЗКИ]
        - Типовые maintenance-ковенанты:
            * «Поддерживать отношение чистого долга к EBITDA на уровне
              не выше 3,5x в течение всего срока Кредита»;
            * «Поддерживать коэффициент текущей ликвидности не ниже 1,2»;
            * «Поддерживать размер собственного капитала не менее X рублей».
          Проверка — ежеквартально или ежегодно на основании отчётности.
        - Типовые incurrence-ковенанты:
            * «Не привлекать новый долг, если после его привлечения
              debt/EBITDA превысит 4,0x»;
            * «Не выплачивать дивиденды, если current ratio ниже 1,0».
          Проверка — при совершении действия.
        - Типовые последствия нарушения:
            * event of default → даёт Банку право потребовать досрочного
              возврата Кредита (наиболее часто);
            * margin increase → повышение ставки на N п.п.;
            * cross-default → дефолт по другим договорам;
            * waiver — согласие Банка на отступление (способ обхода,
              а не последствие).
        - Типичный cure period — 10–30 календарных дней с даты
          уведомления Банка. В российских договорах встречается реже,
          чем в западных.
        - Ковенанты «без конкретики» («по требованию Банка»,
          «по оценке Банка») — красный флаг. Такие формулировки
          позволяют Банку в любой момент объявить о нарушении.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — maintenance-ковенанты с cure period и event of default:
        Фрагмент:
        "Заёмщик обязуется в течение всего срока Кредита поддерживать
         следующие финансовые показатели: (а) отношение чистого долга
         к EBITDA — не более 3,5x; (б) коэффициент текущей ликвидности —
         не ниже 1,2. Проверка показателей осуществляется ежеквартально
         на основании отчётности Заёмщика. Нарушение указанных показателей
         является событием дефолта, дающим Банку право потребовать
         досрочного возврата Кредита. Заёмщик вправе устранить нарушение
         в течение 30 календарных дней с даты получения уведомления Банка."

        Ответ:
        {
          "covenants_present": "yes",
          "covenant_kind": "maintenance",
          "covenant_types": [
            "чистый долг / EBITDA ≤ 3,5x",
            "коэффициент текущей ликвидности ≥ 1,2"
          ],
          "breach_consequences": "event_of_default",
          "cure_period_present": "yes",
          "review_frequency_status": "present",
          "covenants_summary": "2 ковенанта, maintenance, проверка ежеквартально",
          "covenant_kind_display": "Maintenance (поддержание показателей)",
          "breach_consequences_display": "Событие дефолта, право Банка потребовать досрочного возврата",
          "cure_period_display": "30 календарных дней с даты уведомления Банка"
        }

        Пример 2 — incurrence-ковенант с margin increase:
        Фрагмент:
        "Заёмщик обязуется не привлекать новый долг, если после его
         привлечения отношение чистого долга к EBITDA превысит 4,0x.
         При нарушении указанного условия процентная ставка по Кредиту
         увеличивается на 1 (один) процентный пункт."

        Ответ:
        {
          "covenants_present": "yes",
          "covenant_kind": "incurrence",
          "covenant_types": [
            "чистый долг / EBITDA ≤ 4,0x при привлечении нового долга"
          ],
          "breach_consequences": "margin_increase",
          "cure_period_present": "not_defined",
          "review_frequency_status": "not_defined",
          "covenants_summary": "1 ковенант (incurrence): debt/EBITDA ≤ 4,0x при новом долге",
          "covenant_kind_display": "Incurrence (при совершении действий)",
          "breach_consequences_display": "Повышение ставки на 1 п.п.",
          "cure_period_display": "Не установлен"
        }

        Пример 3 — ковенанты без конкретики (красный флаг):
        Фрагмент:
        "Заёмщик обязуется соблюдать финансовые показатели, устанавливаемые
         Банком по своему усмотрению."

        Ответ:
        {
          "covenants_present": "vague",
          "covenant_kind": "not_defined",
          "covenant_types": [],
          "breach_consequences": "not_defined",
          "cure_period_present": "not_defined",
          "review_frequency_status": "not_defined",
          "covenants_summary": "Внимание: ковенанты без конкретных порогов («по усмотрению Банка») — красный флаг",
          "covenant_kind_display": "Не удалось определить",
          "breach_consequences_display": "Не установлены",
          "cure_period_display": "Не установлен"
        }

        Пример 4 — ковенантов нет:
        Фрагмент:
        "Иные обязательства Заёмщика Договором не предусмотрены."

        Ответ:
        {
          "covenants_present": "no",
          "covenant_kind": "not_defined",
          "covenant_types": [],
          "breach_consequences": "not_defined",
          "cure_period_present": "not_defined",
          "review_frequency_status": "not_defined",
          "covenants_summary": "Не установлены",
          "covenant_kind_display": "Не применимо",
          "breach_consequences_display": "Не применимо",
          "cure_period_display": "Не применимо"
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о финансовых ковенантах.
        2. Определи тип: maintenance / incurrence / mixed. Для каждого
           ковенанта — формула и порог.
        3. Найди периодичность проверки.
        4. Найди последствия нарушения: event of default / acceleration /
           margin increase / cross-default / waiver.
        5. Найди срок на исправление (cure period).
        6. Проверь наличие формулировок «по усмотрению Банка» /
           «по требованию Банка» — отражай как красный флаг.
        7. Сформулируй все четыре user-facing display-поля кратко
           и по-русски.
        8. Если прямых цитат нет — верни fallback по правилам 8–10.

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь РОВНО одним JSON-объектом без какого-либо дополнительного текста до или после, со всеми 10 ключами:
        {
          "covenants_present": "<yes / no / vague / not_defined>",
          "covenant_kind": "<maintenance / incurrence / mixed / not_defined>",
          "covenant_types": ["<формула с порогом 1>", "<формула с порогом 2>"],
          "breach_consequences": "<event_of_default / acceleration / margin_increase / cross_default / waiver_required / not_defined>",
          "cure_period_present": "<yes / no / not_defined>",
          "review_frequency_status": "<present / not_defined>",
          "covenants_summary": "<краткое summary, 'Не установлены', 'Не применимо' или 'Не удалось определить'>",
          "covenant_kind_display": "<текст, 'Не применимо' или 'Не удалось определить'>",
          "breach_consequences_display": "<текст, 'Не установлены', 'Не применимо' или 'Не удалось определить'>",
          "cure_period_display": "<текст, 'Не установлен', 'Не применимо' или 'Не удалось определить'>"
        }
      context_k: 8
      temperature: 0.0
      max_tokens: 900

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "финансовые ковенанты финансовые показатели чистый долг ebitda коэффициент покрытия коэффициент текущей ликвидности собственный капитал maintenance incurrence последствия нарушения ковенант event of default право потребовать досрочного возврата повышение процентной ставки при нарушении срок на устранение нарушения"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - covenants
      negative_keywords:
        - "означает"
        - "в целях настоящего"
        - "проценты"
        - "пск"
        - "предмет договора"
        - "обеспечение"
      position_bias:
        preferred_range: [0.30, 0.75]
        boost: 0.15
        scope: segment
      context_k: 8
      max_chunks: 10
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
        - "invoice"
      preferred_clause_functions:
        - "obligations"
        - "covenants"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 600

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1500

      compact_output: false

      presence_signal:
        field: "financial_covenants_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста кредитного договора сведения
        о финансовых ковенантах: наличие и конкретность формулировок, тип
        (maintenance / incurrence), полный перечень с формулами и порогами,
        периодичность проверки, последствия нарушения и срок на исправление.
        Не анализируй обеспечение, ковенанты нефинансового характера
        (например, negative pledge), проценты или ПСК.
        Не оценивай риски. Анализируй только текст договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля (все ключи должны присутствовать в ответе):

        0. financial_covenants_check_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (covenants_present, covenant_kind, breach_consequences,
              cure_period_present, review_frequency_status) ≠ "not_defined";
           - "missing" — если все пять содержательных полей = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Важно: covenants_present = "no" (ковенантов нет) и
           covenants_present = "vague" (ковенанты без порогов) считаются
           ≠ "not_defined" и дают presence = "present" (договор прямо
           регулирует вопрос).

           Если presence = "missing":
           - covenants_present = "not_defined";
           - covenant_kind = "not_defined";
           - breach_consequences = "not_defined";
           - cure_period_present = "not_defined";
           - review_frequency_status = "not_defined";
           - covenant_types = [];
           - covenants_summary = "Не установлены";
           - covenant_kind_display = "Не применимо";
           - breach_consequences_display = "Не установлены";
           - cure_period_display = "Не установлен";
           - не выполняй остальные шаги.

        1. covenants_present — наличие и конкретность ковенантов:
           - "yes" — ковенанты есть с конкретными формулами и порогами;
           - "no" — договор прямо указывает, что ковенантов нет;
           - "vague" — ковенанты упомянуты без конкретных порогов
             («по усмотрению Банка», «по требованию Банка»);
           - "not_defined" — вопрос ковенантов не урегулирован.

        2. covenant_kind — тип ковенантов:
           - "maintenance" — поддержание показателей в течение срока;
           - "incurrence" — соблюдение при совершении действий;
           - "mixed" — есть оба типа;
           - "not_defined" — тип не определён.

        3. covenant_types — массив строк, каждая — один ковенант
           с формулой и порогом.
           Примеры: "чистый долг / EBITDA ≤ 3,5x",
           "коэффициент текущей ликвидности ≥ 1,2".
           Если ковенантов нет или они без конкретики — [].

        4. breach_consequences — последствия нарушения:
           - "event_of_default" — нарушение = событие дефолта;
           - "acceleration" — нарушение = право на досрочное истребование;
           - "margin_increase" — повышение ставки;
           - "cross_default" — cross-default как последствие;
           - "waiver_required" — требуется согласие Банка;
           - "not_defined" — последствия не указаны.
           При нескольких — выбирай наиболее значимое
           (event_of_default > acceleration > margin_increase >
           cross_default > waiver_required).

        5. cure_period_present — срок на исправление:
           - "yes" — срок на исправление прямо установлен;
           - "no" — договор прямо исключает cure period;
           - "not_defined" — вопрос не урегулирован.

        6. review_frequency_status — периодичность проверки:
           - "present" — периодичность прямо указана;
           - "not_defined" — не указана.

        7. covenants_summary — КРАТКОЕ summary для юриста.
           НЕ дублируй полный перечень. Примеры:
           - "2 ковенанта, maintenance, проверка ежеквартально";
           - "Внимание: ковенанты без конкретных порогов (красный флаг)";
           - "Не установлены" / "Не применимо" / "Не удалось определить".

        8. covenant_kind_display — краткая формулировка типа.
           - "Maintenance (поддержание показателей)";
           - "Incurrence (при совершении действий)";
           - "Смешанные (maintenance + incurrence)";
           - "Не применимо" / "Не удалось определить".

        9. breach_consequences_display — краткая формулировка последствий.
           - "Событие дефолта, право Банка потребовать досрочного возврата";
           - "Повышение ставки на N п.п.";
           - "Не установлены" / "Не применимо" / "Не удалось определить".

        10. cure_period_display — краткая формулировка срока.
            - "30 календарных дней с даты уведомления";
            - "Не установлен" / "Не применимо" / "Не удалось определить".
        </task>

        <context_rules>
        - Перед остальными полями заполни financial_covenants_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все enum-поля = "not_defined", covenant_types = [], все display-поля = соответствующий fallback.
        - Используй только релевантные фрагменты контекста.
        - Не подставляй нормы закона, обычную практику или предположения вместо текста договора.
        - Различай maintenance (поддержание) и incurrence (при совершении действий).
        - Различай event of default (событие) и acceleration (последствие).
        - waiver_required — способ обхода, не последствие. Используй только если прямо указано.
        - Ковенанты «по усмотрению Банка» — covenants_present = "vague", covenant_types = [],
          covenants_summary содержит «красный флаг».
        - Не выдумывай пороги, сроки и формулы, которых нет в тексте.
        - covenants_summary — краткое summary, НЕ полный перечень.
        - Если в разных фрагментах противоречие: enum → "not_defined", display → "Не удалось определить".
        - Не используй null, None, пустые строки или "-" в строковых полях.
        - Пустой массив [] — валидное значение для covenant_types.
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни ковенантов, ни их последствий, ни cure period.
           → presence = "missing";
             все enum-поля = "not_defined";
             covenant_types = [];
             все display-поля = "Не установлены" / "Не применимо".

        2. Ковенанты прямо отсутствуют.
           "Иные обязательства Заёмщика Договором не предусмотрены."
           → presence = "present";
             covenants_present = "no";
             covenant_types = [];
             covenants_summary = "Не установлены";
             covenant_kind_display = breach_consequences_display = cure_period_display = "Не применимо".

        3. Противоречие между фрагментами.
           В одной части — maintenance, в другой — incurrence для того
           же показателя.
           → presence = "unclear";
             covenant_kind = "not_defined";
             covenant_kind_display = "Не удалось определить".

        4. Ковенанты без конкретных порогов (красный флаг).
           "Заёмщик обязуется соблюдать финансовые показатели,
           устанавливаемые Банком по своему усмотрению."
           → presence = "present";
             covenants_present = "vague";
             covenant_types = [];
             covenants_summary = "Внимание: ковенанты без конкретных порогов (красный флаг)".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для financial_covenants_check_presence используй только: "present", "missing", "unclear".
        - Для covenants_present используй только: "yes", "no", "vague", "not_defined".
        - Для covenant_kind используй только: "maintenance", "incurrence", "mixed", "not_defined".
        - Для breach_consequences используй только: "event_of_default", "acceleration", "margin_increase", "cross_default", "waiver_required", "not_defined".
        - Для cure_period_present используй только: "yes", "no", "not_defined".
        - Для review_frequency_status используй только: "present", "not_defined".
        - Для covenant_types — массив строк (возможно пустой []).
        - Fallback при отсутствии данных:
          * covenants_summary → "Не установлены";
          * covenant_kind_display → "Не применимо";
          * breach_consequences_display → "Не установлены";
          * cure_period_display → "Не установлен".
        - Fallback при противоречии или неоднозначности:
          * все display-поля → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "financial_covenants_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования по финансовым ковенантам. Внутреннее агрегатное signal-поле."
          required: true

        - name: "covenants_present"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["yes", "no", "vague", "not_defined"]
          display_in_grid: false
          description: >
            Наличие и конкретность ковенантов: yes (конкретные), no (отсутствуют),
            vague (без порогов — красный флаг). Внутреннее enum-поле.
          required: true

        - name: "covenant_kind"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["maintenance", "incurrence", "mixed", "not_defined"]
          display_in_grid: false
          description: "Тип ковенантов: maintenance / incurrence / mixed. Внутреннее enum-поле."
          required: true

        - name: "covenant_types"
          type: "array"
          presentation: "fact"
          label: "Перечень финансовых ковенантов"
          display_in_grid: false
          description: >
            Полный перечень ковенантов с формулами и порогами (массив строк для payload). Fallback: "Не установлено" / "Не удалось определить".
          required: true

        - name: "breach_consequences"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["event_of_default", "acceleration", "margin_increase", "cross_default", "waiver_required", "not_defined"]
          display_in_grid: false
          description: "Последствия нарушения ковенантов. Внутреннее enum-поле."
          required: true

        - name: "cure_period_present"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["yes", "no", "not_defined"]
          display_in_grid: false
          description: "Наличие срока на исправление нарушения. Внутреннее enum-поле."
          required: true

        - name: "review_frequency_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["present", "not_defined"]
          display_in_grid: false
          description: "Указана ли периодичность проверки ковенантов. Внутреннее enum-поле."
          required: true

        - name: "covenants_summary"
          type: "string"
          presentation: "fact"
          label: "Финансовые ковенанты"
          display_in_grid: true
          display_priority: 1
          description: >
            Краткое описание ковенантов (полный список — в hidden covenant_types).
            Fallback: "Не установлены" / "Не применимо" / "Не удалось определить".
          required: true

        - name: "covenant_kind_display"
          type: "string"
          presentation: "fact"
          label: "Тип ковенантов"
          display_in_grid: true
          display_priority: 2
          description: >
            Понятная формулировка типа ковенантов (maintenance / incurrence).
            Fallback: "Не применимо" / "Не удалось определить".
          required: true

        - name: "breach_consequences_display"
          type: "string"
          presentation: "fact"
          label: "Последствия нарушения"
          display_in_grid: true
          display_priority: 3
          description: >
            Понятная формулировка последствий нарушения ковенантов.
            Fallback: "Не установлены" / "Не применимо" / "Не удалось определить".
          required: true

        - name: "cure_period_display"
          type: "string"
          presentation: "fact"
          label: "Срок на исправление"
          display_in_grid: true
          display_priority: 4
          description: >
            Понятная формулировка срока на исправление нарушения.
            Fallback: "Не установлен" / "Не применимо" / "Не удалось определить".
          required: true

      store_payload: true

  - id: cross_default_check
    name: "Кросс-дефолт: условия и пороги существенности"
    description: >
      Проверяет наличие кросс-дефолта, его тип (cross-default /
      cross-acceleration), порог существенности и его базу (aggregate /
      individual), охват обязательств, момент срабатывания и наличие
      льготного периода.

      Специализация global check cross_default_and_acceleration:
      в дополнение к базовому набору (наличие, scope, threshold,
      grace period, trigger mechanism) doc-type дополнительно фиксирует
      threshold_basis (aggregate / individual) и
      cross_default_trigger_status (actual_default / declared_default).
    triggers:
      any:
        - cross_default
        - corporate_borrower
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "кросс-дефолт"
        - "cross-default"
        - "кросс-акселерация"
        - "cross-acceleration"
        - "дефолт по иным обязательствам"
        - "неисполнение по другим договорам"
        - "порог существенности"
        - "объявленный дефолт"
        - "льготный период"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)кросс[- ]?дефолт"
        - "(?i)cross[- ]?default"
        - "(?i)кросс[- ]?аксел"
        - "(?i)cross[- ]?acceleration"
        - "(?i)порог\\s+существенност"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется кредитный договор.
        Проверяется только один вопрос: наличие и параметры кросс-дефолта
        (cross-default) и кросс-акселерации (cross-acceleration).

        Нормативный ориентир:
        - ст. 811 ГК РФ — последствия нарушения срока возврата
        - ст. 821 ГК РФ — основания отказа / досрочного истребования
        - В российском праве кросс-дефолт — договорный институт
          (законодательной нормы о кросс-дефолте нет)

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора,
          а чего прямо нет.
        - Не оценивай серьёзность риска.
        - Различай два принципиально разных института:
            1) cross_default — событие дефолта по другому договору
               (даже без предъявления требования третьим кредитором);
            2) cross_acceleration — уже реализованное ускорение
               (требование досрочного возврата по другому договору).
          cross_acceleration мягче для заёмщика.
        - Различай базу порога:
            * aggregate — сумма всех нарушений агрегируется и сравнивается
              с порогом;
            * individual — порог применяется к каждому отдельному нарушению.
          aggregate-порог срабатывает от накопления мелких нарушений.
        - Различай момент срабатывания:
            * actual_default — нарушение фактически наступило;
            * declared_default — требуется объявление дефолта третьим
              кредитором (предъявление требования).
        - Кросс-дефолт без порога («любое неисполнение») — красный флаг.
          Обязательно отражай в summary.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Есть ли условие о кросс-дефолте.
        2. Тип — кросс-дефолт или кросс-акселерация.
        3. Порог существенности (сумма) и его база (aggregate /
           individual).
        4. Какие обязательства охвачены (все / только финансовые /
           указанный перечень).
        5. Момент срабатывания — фактическое нарушение или объявленный
           дефолт третьим кредитором.
        6. Есть ли льготный период (grace period) — и его значение.
        7. Сформулируй понятные для юриста текстовые расшифровки:
           - cross_default_summary,
           - covered_obligations_display,
           - grace_period_display.

        [ПРАВИЛА]
        1. Используй только текст документа. Не подставляй нормы закона
           вместо текста договора.
        2. Если параметр прямо указан в договоре — возвращай его дословно
           или делай точную выжимку.
        3. `threshold_amount` — строка с суммой порога, например:
           «более 5 000 000 рублей», «свыше 1 000 000 евро в эквиваленте».
           Если порог не установлен — «Без порога (красный флаг)».
           Если cross-default отсутствует — «Не установлен».
        4. `cross_default_summary` — КРАТКОЕ summary для юриста, например:
           - «Установлен: порог 5 млн руб. (aggregate), все обязательства,
             grace 10 рабочих дней»;
           - «Установлен без порога (красный флаг)»;
           - «Установлен, только финансовые обязательства, порог 1 млн руб.»;
           - «Не установлен».
           НЕ дублируй полную формулировку в summary.
        5. Если кросс-дефолт распространяется на связанных лиц
           (поручителей, гарантов, группу) — отражай это в summary.
        6. Если параметр в договоре прямо не указан:
           - для сигнальных enum-полей (cross_default_present,
             cross_default_kind, threshold_basis,
             cross_default_trigger_status,
             covered_obligations, grace_period_for_third_party_default) —
             возвращай "not_defined";
           - для текстовых user-facing полей (cross_default_summary,
             threshold_amount, covered_obligations_display,
             grace_period_display) — возвращай «Не установлен» /
             «Не установлено» по роду.
        7. Если тема по существу не применима к данному договору —
           для user-facing поля возвращай «Не применимо»,
           для сигнального — "not_defined".
        8. Если текст есть, но надёжный вывод сделать нельзя —
           для user-facing поля возвращай «Не удалось определить»,
           для сигнального — "not_defined".
        9. Никогда не используй null, None, пустые строки или "-".
        10. Не выдумывай пороги, сроки и перечни, которых нет в тексте.
        11. При конфликтующих фрагментах отдавай приоритет более позднему
            или более специальному положению.
        12. В evidence включай только текст договора.
        13. Верни РОВНО один JSON-объект со всеми ключами из [ФОРМАТ ОТВЕТА] без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [РОССИЙСКАЯ ПРАКТИКА — ПОДСКАЗКИ]
        - Типичная формулировка cross-default:
          «Неисполнение Заёмщиком любого иного обязательства перед любым
          кредитором на сумму более 5 000 000 рублей в течение 10 рабочих
          дней с даты наступления срока исполнения является событием
          дефолта по настоящему Договору» →
          cross_default_present = "yes", cross_default_kind = "cross_default",
          threshold_basis = "individual", cross_default_trigger_status = "actual_default".
        - Типичная формулировка cross-acceleration:
          «Предъявление любому из Заёмщиков требования о досрочном возврате
          задолженности по иным договорам на сумму более 5 000 000 рублей
          является событием дефолта по настоящему Договору» →
          cross_default_kind = "cross_acceleration",
          cross_default_trigger_status = "declared_default".
        - Aggregate-порог формулируется так:
          «неисполнение обязательств на общую сумму более 5 000 000 рублей»
          → threshold_basis = "aggregate".
        - Individual-порог: «по каждому отдельному обязательству на сумму
          более 1 000 000 рублей» → threshold_basis = "individual".
        - Распространение на связанных лиц:
          «неисполнение обязательств Заёмщиком, Поручителем или любым
          лицом, входящим в группу с Заёмщиком» — фиксируй в summary.
        - Красные флаги:
            * кросс-дефолт без порога («любое неисполнение»);
            * порог слишком низкий;
            * охват всех обязательств, включая нефинансовые;
            * срабатывание при фактическом нарушении без grace period;
            * распространение на связанные лица без явного ограничения.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — кросс-дефолт с порогом и grace period:
        Фрагмент:
        "Неисполнение Заёмщиком любого иного обязательства перед любым
         кредитором на сумму более 5 000 000 (пять миллионов) рублей
         в течение 10 (десяти) рабочих дней с даты наступления срока
         исполнения является событием дефолта по настоящему Договору.
         Погашение обязательств по иным договорам на указанную сумму
         устраняет основание для дефолта."

        Ответ:
        {
          "cross_default_present": "yes",
          "cross_default_kind": "cross_default",
          "threshold_basis": "individual",
          "cross_default_trigger_status": "actual_default",
          "covered_obligations": "all",
          "grace_period_for_third_party_default": "present",
          "cross_default_summary": "Установлен: порог 5 000 000 руб., все обязательства, grace 10 рабочих дней",
          "threshold_amount": "более 5 000 000 рублей",
          "covered_obligations_display": "Все обязательства перед любым кредитором",
          "grace_period_display": "10 рабочих дней с даты наступления срока исполнения"
        }

        Пример 2 — кросс-дефолт без порога (красный флаг):
        Фрагмент:
        "Любое неисполнение Заёмщиком обязательств перед третьими лицами
         является основанием для признания Заёмщика допустившим дефолт
         по настоящему Договору."

        Ответ:
        {
          "cross_default_present": "yes",
          "cross_default_kind": "cross_default",
          "threshold_basis": "not_defined",
          "cross_default_trigger_status": "actual_default",
          "covered_obligations": "all",
          "grace_period_for_third_party_default": "absent",
          "cross_default_summary": "Установлен без порога (красный флаг): любое неисполнение перед третьими лицами",
          "threshold_amount": "Без порога (красный флаг)",
          "covered_obligations_display": "Все обязательства перед третьими лицами",
          "grace_period_display": "Не установлен"
        }

        Пример 3 — кросс-акселерация (объявленный дефолт):
        Фрагмент:
        "Предъявление любому из Заёмщиков или Поручителей требования
         о досрочном возврате задолженности по иным договорам на сумму
         более 3 000 000 рублей является событием дефолта по настоящему
         Договору."

        Ответ:
        {
          "cross_default_present": "yes",
          "cross_default_kind": "cross_acceleration",
          "threshold_basis": "individual",
          "cross_default_trigger_status": "declared_default",
          "covered_obligations": "specified_list",
          "grace_period_for_third_party_default": "not_defined",
          "cross_default_summary": "Установлен (cross-acceleration): предъявление требования о досрочном возврате по иным договорам, порог 3 000 000 руб., распространяется на Поручителей",
          "threshold_amount": "более 3 000 000 рублей",
          "covered_obligations_display": "Заёмщик и Поручители, обязательства по иным договорам",
          "grace_period_display": "Не установлен"
        }

        Пример 4 — aggregate-порог, только финансовые обязательства:
        Фрагмент:
        "Неисполнение Заёмщиком финансовых обязательств (кредитов, займов,
         облигаций, лизинговых платежей) на общую сумму более 10 000 000
         рублей является событием дефолта по настоящему Договору."

        Ответ:
        {
          "cross_default_present": "yes",
          "cross_default_kind": "cross_default",
          "threshold_basis": "aggregate",
          "cross_default_trigger_status": "actual_default",
          "covered_obligations": "financial_only",
          "grace_period_for_third_party_default": "not_defined",
          "cross_default_summary": "Установлен: aggregate-порог 10 000 000 руб., только финансовые обязательства",
          "threshold_amount": "на общую сумму более 10 000 000 рублей",
          "covered_obligations_display": "Только финансовые обязательства (кредиты, займы, облигации, лизинг)",
          "grace_period_display": "Не установлен"
        }

        Пример 5 — кросс-дефолт отсутствует:
        Фрагмент:
        "Иные события дефолта Договором не предусмотрены."

        Ответ:
        {
          "cross_default_present": "no",
          "cross_default_kind": "not_defined",
          "threshold_basis": "not_defined",
          "cross_default_trigger_status": "not_defined",
          "covered_obligations": "not_defined",
          "grace_period_for_third_party_default": "not_defined",
          "cross_default_summary": "Не установлен",
          "threshold_amount": "Не установлен",
          "covered_obligations_display": "Не применимо",
          "grace_period_display": "Не применимо"
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о кросс-дефолте или кросс-акселерации.
        2. Определи тип: cross_default (факт нарушения) или
           cross_acceleration (объявленное требование).
        3. Найди порог существенности и его базу (aggregate / individual).
        4. Найди охват обязательств: все / только финансовые / указанный
           перечень. Если указаны связанные лица — фиксируй в summary.
        5. Найди момент срабатывания (фактическое нарушение vs объявленный
           дефолт).
        6. Найди льготный период (grace period) и его значение.
        7. Проверь наличие красного флага «без порога».
        8. Сформулируй три user-facing display-поля кратко и по-русски.
        9. Если прямых цитат нет — верни fallback по правилам 6–8.

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь РОВНО одним JSON-объектом без какого-либо дополнительного текста до или после, со всеми 10 ключами:
        {
          "cross_default_present": "<yes / no / not_defined>",
          "cross_default_kind": "<cross_default / cross_acceleration / mixed / not_defined>",
          "threshold_basis": "<aggregate / individual / not_defined>",
          "cross_default_trigger_status": "<actual_default / declared_default / not_defined>",
          "covered_obligations": "<all / financial_only / specified_list / not_defined>",
          "grace_period_for_third_party_default": "<present / absent / not_defined>",
          "cross_default_summary": "<краткое summary, 'Не установлен', 'Не применимо' или 'Не удалось определить'>",
          "threshold_amount": "<сумма порога, 'Без порога (красный флаг)', 'Не установлен' или 'Не применимо'>",
          "covered_obligations_display": "<текст, 'Не применимо' или 'Не удалось определить'>",
          "grace_period_display": "<текст, 'Не установлен', 'Не применимо' или 'Не удалось определить'>"
        }
      context_k: 8
      temperature: 0.0
      max_tokens: 900

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "кросс-дефолт cross-default кросс-акселерация cross-acceleration дефолт по иным обязательствам неисполнение по другим договорам порог существенности льготный период grace period финансовые обязательства объявленный дефолт"
      preferred_unit_types:
        - obligation
        - termination_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - remedies
      negative_keywords:
        - "означает"
        - "в целях настоящего"
        - "проценты"
        - "пск"
        - "предмет договора"
        - "обеспечение"
      position_bias:
        preferred_range: [0.35, 0.75]
        boost: 0.12
        scope: segment
      context_k: 8
      max_chunks: 10
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
        - "invoice"
      preferred_clause_functions:
        - "obligations"
        - "remedies"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 35
      max_snippet_length: 500

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1500

      compact_output: false

      presence_signal:
        field: "cross_default_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста кредитного договора сведения
        о кросс-дефолте: наличие и тип (cross_default / cross_acceleration),
        порог существенности и его база (aggregate / individual), охват
        обязательств, момент срабатывания (фактическое нарушение vs
        объявленный дефолт третьим кредитором), наличие льготного периода.
        Не анализируй обеспечение, финансовые ковенанты, проценты или ПСК.
        Не оценивай риски. Анализируй только текст договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля (все ключи должны присутствовать в ответе):

        0. cross_default_check_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (cross_default_present, cross_default_kind, threshold_basis,
              cross_default_trigger_status, covered_obligations,
              grace_period_for_third_party_default) ≠ "not_defined";
           - "missing" — если все шесть содержательных полей = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Важно: cross_default_present = "no" (кросс-дефолта нет) и
           grace_period_for_third_party_default = "absent" (льготный период
           прямо исключён) считаются ≠ "not_defined" и дают presence = "present".

           Если presence = "missing":
           - cross_default_present = "not_defined";
           - cross_default_kind = "not_defined";
           - threshold_basis = "not_defined";
           - cross_default_trigger_status = "not_defined";
           - covered_obligations = "not_defined";
           - grace_period_for_third_party_default = "not_defined";
           - cross_default_summary = "Не установлен";
           - threshold_amount = "Не установлен";
           - covered_obligations_display = "Не применимо";
           - grace_period_display = "Не применимо";
           - не выполняй остальные шаги.

        1. cross_default_present — наличие кросс-дефолта:
           - "yes" — кросс-дефолт или кросс-акселерация есть в договоре;
           - "no" — договор прямо указывает, что кросс-дефолта нет;
           - "not_defined" — вопрос не урегулирован.

        2. cross_default_kind — тип:
           - "cross_default" — срабатывает при фактическом неисполнении
             по другому договору;
           - "cross_acceleration" — срабатывает при предъявлении требования
             о досрочном возврате по другому договору;
           - "mixed" — есть оба;
           - "not_defined" — тип не определён.

        3. threshold_basis — база порога:
           - "aggregate" — сумма всех нарушений агрегируется;
           - "individual" — порог по каждому отдельному нарушению;
           - "not_defined" — база не определена или порога нет.

        4. cross_default_trigger_status — момент срабатывания:
           - "actual_default" — при фактическом нарушении;
           - "declared_default" — при объявлении дефолта третьим кредитором;
           - "not_defined" — момент не определён.

        5. covered_obligations — охват обязательств:
           - "all" — все обязательства;
           - "financial_only" — только финансовые;
           - "specified_list" — указанный перечень;
           - "not_defined" — охват не определён.

        6. grace_period_for_third_party_default — льготный период:
           - "present" — льготный период установлен;
           - "absent" — договор прямо исключает льготный период или
             кросс-дефолт срабатывает немедленно;
           - "not_defined" — вопрос не урегулирован.

        7. cross_default_summary — КРАТКОЕ summary для юриста.
           Примеры:
           - "Установлен: порог 5 000 000 руб. (individual), все
             обязательства, grace 10 рабочих дней";
           - "Установлен без порога (красный флаг)";
           - "Не установлен" / "Не применимо" / "Не удалось определить".
           НЕ дублируй полную формулировку.

        8. threshold_amount — строка с суммой порога.
           - "более 5 000 000 рублей";
           - "на общую сумму более 10 000 000 рублей";
           - "Без порога (красный флаг)";
           - "Не установлен" / "Не применимо".

        9. covered_obligations_display — краткая формулировка охвата.
           - "Все обязательства перед любым кредитором";
           - "Только финансовые обязательства";
           - "Не применимо" / "Не удалось определить".

        10. grace_period_display — краткая формулировка.
            - "10 рабочих дней с даты наступления срока";
            - "Не установлен" / "Не применимо" / "Не удалось определить".
        </task>

        <context_rules>
        - Перед остальными полями заполни cross_default_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все enum-поля = "not_defined", все display-поля = соответствующий fallback.
        - Используй только релевантные фрагменты контекста.
        - Не подставляй нормы закона, обычную практику или предположения вместо текста договора.
        - Различай cross_default (факт нарушения) и cross_acceleration (объявленное требование).
        - Различай aggregate («на общую сумму») и individual («по каждому обязательству»).
        - Различай actual_default (фактическое) и declared_default (объявленное).
        - Кросс-дефолт без порога — threshold_amount = "Без порога (красный флаг)",
          cross_default_summary содержит «красный флаг».
        - Если кросс-дефолт распространяется на связанных лиц — отражай в summary.
        - Не выдумывай пороги, сроки и перечни, которых нет в тексте.
        - Если в разных фрагментах противоречие: enum → "not_defined", display → "Не удалось определить".
        - Не используй null, None, пустые строки или "-".
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни кросс-дефолта, ни кросс-акселерации.
           → presence = "missing";
             все enum-поля = "not_defined";
             cross_default_summary = "Не установлен";
             threshold_amount = "Не установлен";
             covered_obligations_display = grace_period_display = "Не применимо".

        2. Кросс-дефолт прямо отсутствует.
           "Иные события дефолта Договором не предусмотрены."
           → presence = "present";
             cross_default_present = "no";
             cross_default_summary = "Не установлен";
             threshold_amount = "Не установлен";
             covered_obligations_display = grace_period_display = "Не применимо".

        3. Противоречие между фрагментами.
           В одной части — cross_default, в другой — cross_acceleration.
           → presence = "unclear";
             cross_default_kind = "not_defined";
             cross_default_summary = "Не удалось определить".

        4. Кросс-дефолт без порога (красный флаг).
           "Любое неисполнение перед третьими лицами — дефолт."
           → presence = "present";
             cross_default_present = "yes";
             threshold_basis = "not_defined";
             threshold_amount = "Без порога (красный флаг)";
             cross_default_summary = "Установлен без порога (красный флаг)".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для cross_default_check_presence используй только: "present", "missing", "unclear".
        - Для cross_default_present используй только: "yes", "no", "not_defined".
        - Для cross_default_kind используй только: "cross_default", "cross_acceleration", "mixed", "not_defined".
        - Для threshold_basis используй только: "aggregate", "individual", "not_defined".
        - Для cross_default_trigger_status используй только: "actual_default", "declared_default", "not_defined".
        - Для covered_obligations используй только: "all", "financial_only", "specified_list", "not_defined".
        - Для grace_period_for_third_party_default используй только: "present", "absent", "not_defined".
        - Fallback при отсутствии данных:
          * cross_default_summary → "Не установлен";
          * threshold_amount → "Не установлен";
          * covered_obligations_display → "Не применимо";
          * grace_period_display → "Не применимо".
        - Fallback при противоречии или неоднозначности:
          * все display-поля → "Не удалось определить".
        - Специальные значения:
          * threshold_amount = "Без порога (красный флаг)" — если порог отсутствует.
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "cross_default_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования по кросс-дефолту. Внутреннее агрегатное signal-поле."
          required: true

        - name: "cross_default_present"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["yes", "no", "not_defined"]
          display_in_grid: false
          description: "Наличие кросс-дефолта или кросс-акселерации. Внутреннее enum-поле."
          required: true

        - name: "cross_default_kind"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["cross_default", "cross_acceleration", "mixed", "not_defined"]
          display_in_grid: false
          description: >
            Тип: cross_default (факт нарушения) или cross_acceleration (объявленное требование).
            Внутреннее enum-поле.
          required: true

        - name: "threshold_basis"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["aggregate", "individual", "not_defined"]
          display_in_grid: false
          description: "База порога: aggregate (сумма всех) или individual (по каждому). Внутреннее enum-поле."
          required: true

        - name: "cross_default_trigger_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["actual_default", "declared_default", "not_defined"]
          display_in_grid: false
          description: "Момент срабатывания: actual_default или declared_default. Внутреннее enum-поле."
          required: true

        - name: "covered_obligations"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["all", "financial_only", "specified_list", "not_defined"]
          display_in_grid: false
          description: "Охват обязательств. Внутреннее enum-поле."
          required: true

        - name: "grace_period_for_third_party_default"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["present", "absent", "not_defined"]
          display_in_grid: false
          description: "Наличие льготного периода. absent — прямо исключён. Внутреннее enum-поле."
          required: true

        - name: "cross_default_summary"
          type: "string"
          presentation: "fact"
          label: "Кросс-дефолт"
          display_in_grid: true
          display_priority: 1
          description: >
            Краткое summary параметров кросс-дефолта для юриста.
            Fallback: "Не установлен" / "Не применимо" / "Не удалось определить".
          required: true

        - name: "threshold_amount"
          type: "string"
          presentation: "fact"
          label: "Порог существенности"
          display_in_grid: true
          display_priority: 2
          description: >
            Порог существенности кросс-дефолта.
            Специальное значение: "Без порога (красный флаг)".
            Fallback: "Не установлен" / "Не применимо".
          required: true

        - name: "covered_obligations_display"
          type: "string"
          presentation: "fact"
          label: "Охват обязательств"
          display_in_grid: true
          display_priority: 3
          description: >
            Понятная формулировка охвата обязательств для юриста.
            Fallback: "Не применимо" / "Не удалось определить".
          required: true

        - name: "grace_period_display"
          type: "string"
          presentation: "fact"
          label: "Льготный период"
          display_in_grid: true

          display_priority: 4
  - id: purpose_and_control_check
    name: "Целевое использование кредита и механизм контроля"
    description: >
      Проверяет указание цели кредита, тип кредита (целевой / нецелевой),
      порядок подтверждения целевого использования и наличие механизма
      контроля.
    triggers:
      any:
        - purpose_restricted
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "целевой кредит"
        - "целевое использование"
        - "цель кредита"
        - "подтверждение целевого использования"
        - "документы, подтверждающие"
        - "нецелевое использование"
        - "контроль целевого использования"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)целев(ой|ое|ого)\\s+(кредит|использован)"
        - "(?i)цель\\s+кредит"
        - "(?i)подтвержд.{0,30}целев"
        - "(?i)контрол.{0,20}целев"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется кредитный договор.
        Проверяется только один вопрос: цель кредита, его целевой характер
        и механизм контроля целевого использования.

        Нормативный ориентир:
        - ст. 814 ГК РФ — целевой заём (кредит): если договор заключён
          с условием использования полученных средств на определённые цели,
          заёмщик обязан обеспечить возможность осуществления займодавцем
          контроля за целевым использованием суммы займа
        - ст. 821 ГК РФ — отказ от предоставления кредита при обстоятельствах,
          свидетельствующих о невозврате

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора,
          а чего прямо нет.
        - Не оценивай серьёзность риска.
        - Различай три режима:
            1) targeted — кредит целевой, цель указана прямо;
            2) non_targeted — кредит нецелевой (использование по усмотрению
               заёмщика), цель не установлена;
            3) not_defined — неясно.
        - Последствия нецелевого использования (право банка требовать
          досрочного возврата) — не в этом check-е, а в отдельном
          check-е про acceleration.
        - Красный флаг: цель указана, но механизм контроля не установлен.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Указана ли цель кредита (и какая).
        2. Является ли кредит целевым или нецелевым.
        3. Установлен ли механизм контроля целевого использования.
        4. Сформулируй понятные для юриста текстовые расшифровки:
           - purpose_display,
           - purpose_kind_display,
           - control_mechanism_display.

        [ПРАВИЛА]
        1. Используй только текст документа. Не подставляй нормы закона
           вместо текста договора.
        2. Если цель кредита указана прямо — возвращай её дословно
           или делай точную выжимку.
        3. Если параметр в договоре прямо не указан:
           - для сигнальных enum-полей (purpose_defined_status,
             purpose_kind, control_mechanism_status) — возвращай
             "not_defined";
           - для текстовых user-facing полей (purpose_display,
             purpose_kind_display, control_mechanism_display) — возвращай
             "Не установлено".
        4. Если тема по существу не применима к данному договору —
           для user-facing поля возвращай "Не применимо",
           для сигнального — "not_defined".
        5. Если текст есть, но надёжный вывод сделать нельзя —
           для user-facing поля возвращай "Не удалось определить",
           для сигнального — "not_defined".
        6. Никогда не используй null, None, пустые строки или "-".
        7. Не выдумывай цели и механизмы контроля, которых нет в тексте.
        8. При конфликтующих фрагментах отдавай приоритет более позднему
           или более специальному положению.
        9. В evidence включай только текст договора.
        10. Верни РОВНО один JSON-объект со всеми ключами из [ФОРМАТ ОТВЕТА] без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [РОССИЙСКАЯ ПРАКТИКА — ПОДСКАЗКИ]
        - Типичные цели кредита: «приобретение оборудования», «пополнение
          оборотных средств», «рефинансирование задолженности»,
          «финансирование инвестиционного проекта», «приобретение
          недвижимости».
        - Целевой кредит: «Кредит предоставляется на цели приобретения
          оборудования (далее — Целевое использование)» →
          purpose_kind = "targeted".
        - Нецелевой кредит: «Кредит предоставляется на любые цели,
          не запрещённые законодательством» → purpose_kind = "non_targeted".
        - Механизм контроля: «Заёмщик обязуется предоставлять Банку
          документы, подтверждающие целевое использование кредита,
          не позднее 30 дней после каждой выборки» → control_mechanism_status
          = "present".
        - Красный флаг: цель указана, но механизм контроля не установлен.
          Это лишает банк возможности проверить целевое использование.
        - Если цель указана через приложение / отдельный документ —
          фиксируй ссылку.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — целевой кредит с механизмом контроля:
        Фрагмент:
        "Кредит предоставляется на цели приобретения оборудования
         (далее — Целевое использование). Заёмщик обязуется предоставлять
         Банку документы, подтверждающие целевое использование Кредита,
         в течение 30 (тридцати) дней с даты каждой выборки."

        Ответ:
        {
          "purpose_defined_status": "defined",
          "purpose_kind": "targeted",
          "control_mechanism_status": "present",
          "purpose_display": "Приобретение оборудования",
          "purpose_kind_display": "Целевой кредит",
          "control_mechanism_display": "Подтверждение документами в течение 30 дней с даты каждой выборки"
        }

        Пример 2 — нецелевой кредит:
        Фрагмент:
        "Кредит предоставляется на любые цели, не запрещённые действующим
         законодательством Российской Федерации."

        Ответ:
        {
          "purpose_defined_status": "not_defined",
          "purpose_kind": "non_targeted",
          "control_mechanism_status": "not_defined",
          "purpose_display": "На любые цели, не запрещённые законодательством",
          "purpose_kind_display": "Нецелевой кредит",
          "control_mechanism_display": "Не применимо"
        }

        Пример 3 — цель указана, механизм контроля отсутствует (красный флаг):
        Фрагмент:
        "Кредит предоставляется на цели пополнения оборотных средств."

        Ответ:
        {
          "purpose_defined_status": "defined",
          "purpose_kind": "targeted",
          "control_mechanism_status": "not_defined",
          "purpose_display": "Пополнение оборотных средств",
          "purpose_kind_display": "Целевой кредит",
          "control_mechanism_display": "Не установлен (цель указана, механизм контроля отсутствует)"
        }

        Пример 4 — данных нет:
        Фрагмент:
        "Иные условия определяются в соответствии с действующим
         законодательством."

        Ответ:
        {
          "purpose_defined_status": "not_defined",
          "purpose_kind": "not_defined",
          "control_mechanism_status": "not_defined",
          "purpose_display": "Не установлено",
          "purpose_kind_display": "Не установлено",
          "control_mechanism_display": "Не установлено"
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о цели кредита.
        2. Определи тип: целевой / нецелевой.
        3. Найди прямую цитату о механизме контроля целевого использования.
        4. Если цель указана, но механизм контроля не установлен —
           отражай это в control_mechanism_display.
        5. Сформулируй три user-facing display-поля кратко и по-русски.
        6. Если прямых цитат нет — верни fallback по правилам 3–5.

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь РОВНО одним JSON-объектом без какого-либо дополнительного текста до или после, со всеми 6 ключами:
        {
          "purpose_defined_status": "<defined / not_defined>",
          "purpose_kind": "<targeted / non_targeted / not_defined>",
          "control_mechanism_status": "<present / not_defined>",
          "purpose_display": "<текст, 'Не установлено', 'Не применимо' или 'Не удалось определить'>",
          "purpose_kind_display": "<текст, 'Не установлено', 'Не применимо' или 'Не удалось определить'>",
          "control_mechanism_display": "<текст, 'Не установлен', 'Не применимо' или 'Не удалось определить'>"
        }
      context_k: 8
      temperature: 0.0
      max_tokens: 700

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "целевое использование цель кредита целевой кредит подтверждение целевого использования документы подтверждающие контроль целевого использования нецелевое использование"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
      negative_keywords:
        - "означает"
        - "в целях настоящего"
        - "проценты"
        - "пск"
        - "предмет договора"
      position_bias:
        preferred_range: [0.15, 0.50]
        boost: 0.12
        scope: segment
      context_k: 8
      max_chunks: 10
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
        - "invoice"
      preferred_clause_functions:
        - "obligations"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 30
      max_snippet_length: 450

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1000

      compact_output: false

      presence_signal:
        field: "purpose_and_control_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста кредитного договора сведения
        о цели кредита, его целевом характере и механизме контроля целевого
        использования. Не анализируй обеспечение, проценты, ПСК или
        последствия нецелевого использования.
        Не оценивай риски. Анализируй только текст договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля (все ключи должны присутствовать в ответе):

        0. purpose_and_control_check_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (purpose_defined_status, purpose_kind, control_mechanism_status)
             ≠ "not_defined";
           - "missing" — если все три содержательных поля = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Важно: purpose_kind = "non_targeted" считается ≠ "not_defined"
           и даёт presence = "present" (договор прямо регулирует вопрос,
           утверждая нецелевой характер).

           Если presence = "missing":
           - purpose_defined_status = "not_defined";
           - purpose_kind = "not_defined";
           - control_mechanism_status = "not_defined";
           - purpose_display = "Не установлено";
           - purpose_kind_display = "Не установлено";
           - control_mechanism_display = "Не установлено";
           - не выполняй остальные шаги.

        1. purpose_defined_status — указана ли цель кредита:
           - "defined" — цель кредита прямо указана в договоре
             (конкретная формулировка или ссылка на приложение);
           - "not_defined" — цель кредита прямо не указана.

        2. purpose_kind — тип кредита:
           - "targeted" — кредит целевой, цель указана прямо;
           - "non_targeted" — кредит нецелевой (использование по
             усмотрению заёмщика, «на любые цели»);
           - "not_defined" — тип не определён.

        3. control_mechanism_status — механизм контроля:
           - "present" — договор устанавливает механизм контроля
             целевого использования (документы, отчёты, проверки);
           - "not_defined" — механизм контроля прямо не установлен.

        4. purpose_display — краткая формулировка цели.
           Примеры:
           - "Приобретение оборудования";
           - "Пополнение оборотных средств";
           - "На любые цели, не запрещённые законодательством";
           - "Согласно Приложению №1";
           - "Не установлено" / "Не применимо" / "Не удалось определить".

        5. purpose_kind_display — краткая формулировка типа.
           - "Целевой кредит";
           - "Нецелевой кредит";
           - "Не установлено" / "Не применимо" / "Не удалось определить".

        6. control_mechanism_display — краткая формулировка механизма.
           Примеры:
           - "Подтверждение документами в течение 30 дней с даты выборки";
           - "Не установлен (цель указана, механизм контроля отсутствует)";
           - "Не применимо" — для нецелевого кредита;
           - "Не удалось определить".
        </task>

        <context_rules>
        - Перед остальными полями заполни purpose_and_control_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все enum-поля = "not_defined", все display-поля = "Не установлено".
        - Используй только релевантные фрагменты контекста.
        - Не подставляй нормы закона, обычную практику или предположения вместо текста договора.
        - Различай targeted (цель указана) и non_targeted (на любые цели).
        - Красный флаг: цель указана (targeted), но механизм контроля не установлен.
          Отражай в control_mechanism_display.
        - Если цель указана через приложение / отдельный документ —
          фиксируй ссылку в purpose_display.
        - Не выдумывай цели и механизмы контроля, которых нет в тексте.
        - Если в разных фрагментах противоречие: enum → "not_defined", display → "Не удалось определить".
        - Не используй null, None, пустые строки или "-".
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни цели кредита, ни указания на целевой/нецелевой характер.
           → presence = "missing";
             все enum-поля = "not_defined";
             все display-поля = "Не установлено".

        2. Нецелевой кредит.
           "Кредит предоставляется на любые цели, не запрещённые законодательством."
           → presence = "present";
             purpose_kind = "non_targeted";
             purpose_kind_display = "Нецелевой кредит";
             control_mechanism_status = "not_defined";
             control_mechanism_display = "Не применимо".

        3. Противоречие между фрагментами.
           В одной части — целевой, в другой — нецелевой.
           → presence = "unclear";
             purpose_kind = "not_defined";
             purpose_kind_display = "Не удалось определить".

        4. Цель указана, механизм контроля отсутствует (красный флаг).
           "Кредит на приобретение оборудования" без механизма контроля.
           → presence = "present";
             purpose_defined_status = "defined";
             purpose_kind = "targeted";
             control_mechanism_status = "not_defined";
             control_mechanism_display = "Не установлен (цель указана, механизм контроля отсутствует)".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для purpose_and_control_check_presence используй только: "present", "missing", "unclear".
        - Для purpose_defined_status используй только: "defined", "not_defined".
        - Для purpose_kind используй только: "targeted", "non_targeted", "not_defined".
        - Для control_mechanism_status используй только: "present", "not_defined".
        - Fallback при отсутствии данных:
          * purpose_display → "Не установлено";
          * purpose_kind_display → "Не установлено";
          * control_mechanism_display → "Не установлено".
        - Fallback при противоречии или неоднозначности:
          * все display-поля → "Не удалось определить".
        - Специальные значения:
          * control_mechanism_display = "Не применимо" — для нецелевого кредита.
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "purpose_and_control_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования по целевому использованию и контролю. Внутреннее агрегатное signal-поле."
          required: true

        - name: "purpose_defined_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Указана ли цель кредита прямо в договоре. Внутреннее enum-поле."
          required: true

        - name: "purpose_kind"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["targeted", "non_targeted", "not_defined"]
          display_in_grid: false
          description: "Тип кредита: targeted (целевой) / non_targeted (нецелевой). Внутреннее enum-поле."
          required: true

        - name: "control_mechanism_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["present", "not_defined"]
          display_in_grid: false
          description: "Установлен ли механизм контроля целевого использования. Внутреннее enum-поле."
          required: true

        - name: "purpose_display"
          type: "string"
          presentation: "fact"
          label: "Цель кредита"
          display_in_grid: true
          display_priority: 1
          description: >
            Понятная формулировка цели кредита.
            Fallback: "Не установлено" / "Не применимо" / "Не удалось определить".
          required: true

        - name: "purpose_kind_display"
          type: "string"
          presentation: "fact"
          label: "Тип кредита"
          display_in_grid: true
          display_priority: 2
          description: >
            Понятная формулировка типа кредита (целевой / нецелевой).
            Fallback: "Не установлено" / "Не применимо" / "Не удалось определить".
          required: true

        - name: "control_mechanism_display"
          type: "string"
          presentation: "fact"
          label: "Контроль целевого использования"
          display_in_grid: true
          display_priority: 3
          description: >
            Понятная формулировка механизма контроля целевого использования.
            Fallback: "Не установлен" / "Не применимо" / "Не удалось определить".
          required: true

      store_payload: true

  - id: negative_pledge_check
    name: "Негативный залог и ограничения на обременение активов"
    description: >
      Проверяет наличие обязательства не обременять активы без согласия
      банка, охват активов и наличие разрешённых исключений (permitted
      liens).
    triggers:
      any:
        - negative_pledge
        - corporate_borrower
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "негативный залог"
        - "negative pledge"
        - "обязательство не обременять"
        - "не передавать в залог"
        - "без согласия банка"
        - "разрешённые обременения"
        - "permitted liens"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)негативн(ый|ого)\\s+залог"
        - "(?i)negative\\s+pledge"
        - "(?i)не\\s+передавать\\s+в\\s+залог"
        - "(?i)(разрешённ|допустим).{0,20}обременен"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется кредитный договор.
        Проверяется только один вопрос: наличие и параметры негативного
        залога — обязательства не обременять активы без согласия банка.

        Нормативный ориентир:
        - ст. 819, 821 ГК РФ — кредитный договор и основания
          для досрочного истребования
        - В российском праве негативный залог — договорный институт
          (законодательного регулирования нет)

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора,
          а чего прямо нет.
        - Не оценивай серьёзность риска.
        - Различай три режима охвата активов:
            1) all_assets — негативный залог на все активы заёмщика;
            2) specified_assets — на конкретный перечень активов;
            3) not_defined — охват не установлен.
        - Различай наличие permitted liens (разрешённых обременений):
          банковские залоги, торговые обременения, лизинг, обременения
          по закону и т.п.
        - Красные флаги:
            * негативный залог на все активы без permitted liens;
            * отсутствие перечня разрешённых обременений;
            * согласие банка требуется в каждом случае, без исключений.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Есть ли негативный залог.
        2. На какие активы он распространяется.
        3. Есть ли permitted liens (разрешённые обременения) и какие.
        4. Сформулируй понятные для юриста текстовые расшифровки:
           - negative_pledge_display,
           - negative_pledge_scope_display,
           - permitted_liens_display.

        [ПРАВИЛА]
        1. Используй только текст документа. Не подставляй нормы закона
           вместо текста договора.
        2. Если параметр прямо указан в договоре — возвращай его дословно
           или делай точную выжимку.
        3. Если параметр в договоре прямо не указан:
           - для сигнальных enum-полей (negative_pledge_status,
             negative_pledge_scope, permitted_liens_status) — возвращай
             "not_defined";
           - для текстовых user-facing полей (negative_pledge_display,
             negative_pledge_scope_display, permitted_liens_display) —
             возвращай "Не установлено" / "Не установлены" по роду.
        4. Если тема по существу не применима к данному договору —
           для user-facing поля возвращай "Не применимо",
           для сигнального — "not_defined".
        5. Если текст есть, но надёжный вывод сделать нельзя —
           для user-facing поля возвращай "Не удалось определить",
           для сигнального — "not_defined".
        6. Никогда не используй null, None, пустые строки или "-".
        7. Не выдумывай перечни активов и permitted liens, которых нет
           в тексте.
        8. При конфликтующих фрагментах отдавай приоритет более позднему
           или более специальному положению.
        9. В evidence включай только текст договора.
        10. Верни РОВНО один JSON-объект со всеми ключами из [ФОРМАТ ОТВЕТА] без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [РОССИЙСКАЯ ПРАКТИКА — ПОДСКАЗКИ]
        - Типичная формулировка: «Заёмщик обязуется не передавать в залог,
          не обременять иным образом свои активы без предварительного
          письменного согласия Банка» → negative_pledge_status = "defined",
          negative_pledge_scope = "all_assets".
        - С ограниченным охватом: «не обременять основные средства
          и объекты недвижимости» → negative_pledge_scope = "specified_assets".
        - Permitted liens — типовые исключения:
            * обременения, возникшие до заключения договора;
            * обременения в пользу Банка;
            * обременения по закону (например, залог в силу закона);
            * лизинговые обременения;
            * торговые обременения в рамках обычной хозяйственной
              деятельности;
            * обременения, возникшие в результате сделки, согласованной
              с Банком.
        - Красный флаг: негативный залог на все активы без перечня
          permitted liens — существенное ограничение для заёмщика.
        - Согласие банка: общее (на любые обременения) или конкретное
          (на отдельные сделки).

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — негативный залог на все активы с permitted liens:
        Фрагмент:
        "Заёмщик обязуется не передавать в залог, не обременять иным
         образом свои активы без предварительного письменного согласия
         Банка, за исключением: (а) обременений, существующих на дату
         заключения Договора; (б) обременений в пользу Банка; (в) залога
         в силу закона."

        Ответ:
        {
          "negative_pledge_status": "defined",
          "negative_pledge_scope": "all_assets",
          "permitted_liens_status": "present",
          "negative_pledge_display": "Установлен",
          "negative_pledge_scope_display": "Все активы Заёмщика",
          "permitted_liens_display": "Разрешены: обременения на дату заключения, в пользу Банка, залог в силу закона"
        }

        Пример 2 — ограниченный охват без permitted liens (красный флаг):
        Фрагмент:
        "Заёмщик обязуется не передавать в залог объекты недвижимости
         без письменного согласия Банка."

        Ответ:
        {
          "negative_pledge_status": "defined",
          "negative_pledge_scope": "specified_assets",
          "permitted_liens_status": "not_defined",
          "negative_pledge_display": "Установлен",
          "negative_pledge_scope_display": "Объекты недвижимости Заёмщика",
          "permitted_liens_display": "Не установлены (перечень разрешённых обременений отсутствует)"
        }

        Пример 3 — негативного залога нет:
        Фрагмент:
        "Иные ограничения по распоряжению активами Договором
         не предусмотрены."

        Ответ:
        {
          "negative_pledge_status": "not_defined",
          "negative_pledge_scope": "not_defined",
          "permitted_liens_status": "not_defined",
          "negative_pledge_display": "Не установлен",
          "negative_pledge_scope_display": "Не применимо",
          "permitted_liens_display": "Не применимо"
        }

        Пример 4 — текст есть, но вывод невозможен (неоднозначная
        формулировка):
        Фрагмент:
        "Заёмщик обязуется соблюдать разумные ограничения по распоряжению
         активами, определяемые Банком в рабочем порядке."

        Ответ:
        {
          "negative_pledge_status": "not_defined",
          "negative_pledge_scope": "not_defined",
          "permitted_liens_status": "not_defined",
          "negative_pledge_display": "Не удалось определить",
          "negative_pledge_scope_display": "Не удалось определить",
          "permitted_liens_display": "Не удалось определить"
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о негативном залоге.
        2. Определи охват активов: все / конкретный перечень.
        3. Найди permitted liens (разрешённые обременения) и перечисли
           их кратко.
        4. Проверь, есть ли красный флаг «негативный залог на все активы
           без permitted liens».
        5. Сформулируй три user-facing display-поля кратко и по-русски.
        6. Если прямых цитат нет — верни fallback по правилам 3–5.

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь РОВНО одним JSON-объектом без какого-либо дополнительного текста до или после, со всеми 6 ключами:
        {
          "negative_pledge_status": "<defined / not_defined>",
          "negative_pledge_scope": "<all_assets / specified_assets / not_defined>",
          "permitted_liens_status": "<present / not_defined>",
          "negative_pledge_display": "<текст, 'Не установлен', 'Не применимо' или 'Не удалось определить'>",
          "negative_pledge_scope_display": "<текст, 'Не применимо' или 'Не удалось определить'>",
          "permitted_liens_display": "<текст, 'Не установлены', 'Не применимо' или 'Не удалось определить'>"
        }
      context_k: 8
      temperature: 0.0
      max_tokens: 700

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "негативный залог negative pledge не обременять согласие банка не передавать в залог ограничения обременения активов разрешённые обременения permitted liens"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - covenants
      negative_keywords:
        - "означает"
        - "в целях настоящего"
        - "проценты"
        - "пск"
        - "предмет договора"
        - "обеспечение"
      position_bias:
        preferred_range: [0.30, 0.70]
        boost: 0.10
        scope: segment
      context_k: 8
      max_chunks: 10
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
        - "invoice"
      preferred_clause_functions:
        - "obligations"
        - "covenants"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 30
      max_snippet_length: 450

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1000

      compact_output: false

      presence_signal:
        field: "negative_pledge_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста кредитного договора сведения
        о негативном залоге: наличие, охват активов, перечень разрешённых
        обременений (permitted liens). Не анализируй финансовые ковенанты,
        обеспечение, проценты или ПСК.
        Не оценивай риски. Анализируй только текст договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля (все ключи должны присутствовать в ответе):

        0. negative_pledge_check_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (negative_pledge_status, negative_pledge_scope,
              permitted_liens_status) ≠ "not_defined";
           - "missing" — если все три содержательных поля = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - negative_pledge_status = "not_defined";
           - negative_pledge_scope = "not_defined";
           - permitted_liens_status = "not_defined";
           - negative_pledge_display = "Не установлен";
           - negative_pledge_scope_display = "Не применимо";
           - permitted_liens_display = "Не применимо";
           - не выполняй остальные шаги.

        1. negative_pledge_status — наличие негативного залога:
           - "defined" — обязательство не обременять активы прямо
             установлено в договоре;
           - "not_defined" — негативный залог прямо не установлен.

        2. negative_pledge_scope — охват активов:
           - "all_assets" — на все активы заёмщика;
           - "specified_assets" — на конкретный перечень активов
             (недвижимость, оборудование и т.п.);
           - "not_defined" — охват не установлен или негативный залог
             отсутствует.

        3. permitted_liens_status — разрешённые обременения:
           - "present" — договор содержит перечень разрешённых
             обременений (permitted liens);
           - "not_defined" — перечень разрешённых обременений отсутствует
             или негативный залог не установлен.

        4. negative_pledge_display — краткая формулировка.
           - "Установлен" / "Не установлен" / "Не применимо" /
             "Не удалось определить".

        5. negative_pledge_scope_display — краткая формулировка охвата.
           Примеры:
           - "Все активы Заёмщика";
           - "Объекты недвижимости Заёмщика";
           - "Оборудование, указанное в Приложении №1";
           - "Не применимо" / "Не удалось определить".

        6. permitted_liens_display — краткая формулировка.
           Примеры:
           - "Разрешены: обременения на дату заключения, в пользу Банка,
             залог в силу закона";
           - "Не установлены (перечень разрешённых обременений отсутствует)";
           - "Не применимо" / "Не удалось определить".
        </task>

        <context_rules>
        - Перед остальными полями заполни negative_pledge_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все enum-поля = "not_defined", все display-поля = соответствующий fallback.
        - Используй только релевантные фрагменты контекста.
        - Не подставляй нормы закона, обычную практику или предположения вместо текста договора.
        - Различай охват: all_assets (все активы) vs specified_assets (конкретный перечень).
        - Красный флаг: негативный залог на все активы без permitted liens.
          Отражай в permitted_liens_display.
        - Не выдумывай перечни активов и permitted liens, которых нет в тексте.
        - Если в разных фрагментах противоречие: enum → "not_defined", display → "Не удалось определить".
        - Не используй null, None, пустые строки или "-".
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни негативного залога, ни ограничений на обременение.
           → presence = "missing";
             все enum-поля = "not_defined";
             negative_pledge_display = "Не установлен";
             negative_pledge_scope_display = permitted_liens_display = "Не применимо".

        2. Негативный залог на все активы без permitted liens (красный флаг).
           "Заёмщик не вправе обременять свои активы без согласия Банка"
           без перечня исключений.
           → presence = "present";
             negative_pledge_status = "defined";
             negative_pledge_scope = "all_assets";
             permitted_liens_status = "not_defined";
             permitted_liens_display = "Не установлены (перечень разрешённых обременений отсутствует)".

        3. Противоречие между фрагментами.
           В одной части — all_assets, в другой — specified_assets.
           → presence = "unclear";
             negative_pledge_scope = "not_defined";
             negative_pledge_scope_display = "Не удалось определить".

        4. Ограниченный охват с permitted liens.
           "Не обременять недвижимость, за исключением залога в силу закона."
           → presence = "present";
             negative_pledge_scope = "specified_assets";
             permitted_liens_status = "present";
             permitted_liens_display = "Разрешены: залог в силу закона".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для negative_pledge_check_presence используй только: "present", "missing", "unclear".
        - Для negative_pledge_status используй только: "defined", "not_defined".
        - Для negative_pledge_scope используй только: "all_assets", "specified_assets", "not_defined".
        - Для permitted_liens_status используй только: "present", "not_defined".
        - Fallback при отсутствии данных:
          * negative_pledge_display → "Не установлен";
          * negative_pledge_scope_display → "Не применимо";
          * permitted_liens_display → "Не применимо".
        - Fallback при противоречии или неоднозначности:
          * все display-поля → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "negative_pledge_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования по негативному залогу. Внутреннее агрегатное signal-поле."
          required: true

        - name: "negative_pledge_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Установлен ли негативный залог. Внутреннее enum-поле."
          required: true

        - name: "negative_pledge_scope"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["all_assets", "specified_assets", "not_defined"]
          display_in_grid: false
          description: "Охват активов: all_assets / specified_assets. Внутреннее enum-поле."
          required: true

        - name: "permitted_liens_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["present", "not_defined"]
          display_in_grid: false
          description: "Есть ли перечень разрешённых обременений (permitted liens). Внутреннее enum-поле."
          required: true

        - name: "negative_pledge_display"
          type: "string"
          presentation: "fact"
          label: "Негативный залог"
          display_in_grid: true
          display_priority: 1
          description: >
            Понятная формулировка наличия негативного залога.
            Fallback: "Не установлен" / "Не применимо" / "Не удалось определить".
          required: true

        - name: "negative_pledge_scope_display"
          type: "string"
          presentation: "fact"
          label: "Охват активов"
          display_in_grid: true
          display_priority: 2
          description: >
            Понятная формулировка охвата активов негативным залогом.
            Fallback: "Не применимо" / "Не удалось определить".
          required: true

        - name: "permitted_liens_display"
          type: "string"
          presentation: "fact"
          label: "Разрешённые обременения"
          display_in_grid: true
          display_priority: 3
          description: >
            Понятная формулировка перечня разрешённых обременений (permitted liens).
            Fallback: "Не установлены" / "Не применимо" / "Не удалось определить".
          required: true

      store_payload: true

  - id: collateral_and_security_check
    name: "Обеспечение по кредиту: виды, оценка, страхование, обращение взыскания"
    description: >
      Проверяет виды обеспечения по кредиту, наличие оценки предмета залога,
      LTV, страхование предмета залога и порядок обращения взыскания.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "залог"
        - "ипотека"
        - "поручительство"
        - "банковская гарантия"
        - "независимая гарантия"
        - "предмет залога"
        - "залоговая стоимость"
        - "оценка предмета залога"
        - "LTV"
        - "обращение взыскания"
        - "внесудебный порядок"
        - "страхование предмета залога"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)(залог|ипотек|поручительств|гаранти[яи])\\b"
        - "(?i)предмет\\s+залога"
        - "(?i)(залогов|оценочн).{0,20}стоимост"
        - "(?i)(внесудебн|судебн).{0,20}порядок.{0,20}взыскан"
        - "(?i)(LTV|loan.to.value)"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется кредитный договор.
        Проверяется только один вопрос: обеспечение по кредиту — его виды,
        оценка предмета залога, LTV, страхование и порядок обращения
        взыскания.

        Нормативный ориентир:
        - ст. 329–342 ГК РФ — способы обеспечения, залог
        - ФЗ № 102-ФЗ «Об ипотеке (залоге недвижимости)»
        - ст. 349 ГК РФ — порядок обращения взыскания на заложенное
          имущество (судебный / внесудебный)
        - ст. 350.1 ГК РФ — реализация имущества
        - ФЗ № 367-ФЗ «О внесении изменений в часть первую ГК РФ»
          (внесудебный порядок по отдельным видам залога)

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора,
          а чего прямо нет.
        - Не оценивай серьёзность риска.
        - Различай виды обеспечения:
            * залог недвижимости (ипотека);
            * залог оборудования / движимого имущества;
            * залог долей / акций;
            * залог транспортных средств;
            * залог прав (интеллектуальной собственности, дебиторки);
            * поручительство;
            * банковская / независимая гарантия;
            * залог денежных средств (залоговый депозит).
        - LTV (loan-to-value) — отношение суммы кредита к рыночной стоимости
          предмета залога. Если в договоре указана и сумма кредита,
          и оценочная стоимость, и соотношение — фиксируй. Если нет —
          "not_defined".
        - Порядок обращения взыскания: судебный / внесудебный (по соглашению
          сторон, нотариальная надпись) / смешанный.
        - Красные флаги:
            * отсутствие оценки предмета залога;
            * LTV выше 80% (высокий риск);
            * отсутствие обязанности заёмщика страховать предмет залога;
            * отсутствие порядка обращения взыскания.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Какие виды обеспечения установлены.
        2. Указана ли оценка предмета залога.
        3. Указано ли значение LTV.
        4. Есть ли обязанность заёмщика страховать предмет залога.
        5. Какой порядок обращения взыскания установлен.
        6. Сформулируй понятные для юриста текстовые расшифровки:
           - collateral_summary,
           - collateral_types_display,
           - ltv_display,
           - collateral_insurance_display,
           - enforcement_order_display.

        [ПРАВИЛА]
        1. Используй только текст документа. Не подставляй нормы закона
           вместо текста договора.
        2. Если параметр прямо указан в договоре — возвращай его дословно
           или делай точную выжимку.
        3. `collateral_types` — массив строк, каждая — вид обеспечения
           с конкретикой, например: ["залог недвижимости: нежилое здание
           по адресу г. Москва, ул. Примерная, д. 1", "поручительство ООО «Гарант»"].
           Если обеспечения нет — пустой массив [].
        4. `collateral_summary` — КРАТКОЕ summary для юриста, например:
           - "Ипотека + поручительство, LTV 65%, страхование предусмотрено";
           - "Залог оборудования, оценка не указана";
           - "Без обеспечения (необеспеченный кредит)";
           - "Обеспечение не установлено".
           НЕ дублируй полный перечень в summary.
        5. Если параметр в договоре прямо не указан:
           - для сигнальных enum-полей — "not_defined";
           - для текстовых user-facing полей — "Не установлено" /
             "Не установлена" по роду;
           - для массива — пустой массив [].
        6. Если тема по существу не применима — display-поле =
           "Не применимо", сигнальное = "not_defined".
        7. Если текст есть, но надёжный вывод сделать нельзя — display-поле =
           "Не удалось определить", сигнальное = "not_defined".
        8. Никогда не используй null, None, пустые строки или "-".
        9. Не выдумывай предметы залога, суммы и порядок обращения
           взыскания, которых нет в тексте.
        10. При конфликтующих фрагментах отдавай приоритет более позднему
            или более специальному положению.
        11. В evidence включай только текст договора.
        12. Верни РОВНО один JSON-объект со всеми ключами из [ФОРМАТ ОТВЕТА] без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [РОССИЙСКАЯ ПРАКТИКА — ПОДСКАЗКИ]
        - Типовые формулировки:
            * «Обеспечением исполнения обязательств Заёмщика по настоящему
              Договору является залог недвижимого имущества (ипотека)
              в силу договора»;
            * «Обеспечением является поручительство ООО «Гарант» в размере
              10 000 000 рублей»;
            * «Предмет залога оценён в 20 000 000 рублей на основании
              отчёта оценщика ООО «Оценка-Профи» от 15.03.2024».
        - LTV-формулировка: «Отношение суммы кредита к стоимости предмета
          залога не превышает 70%».
        - Порядок обращения взыскания:
            * судебный — по решению суда;
            * внесудебный — по нотариально удостоверенному соглашению сторон;
            * обращение взыскания на денежные средства — по договору
              списания с залогового счёта.
        - Страхование предмета залога:
            * типично: «Заёмщик обязуется застраховать предмет залога
              в пользу Банка (выгодоприобретатель — Банк)».

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — ипотека + поручительство, LTV указан, страхование есть:
        Фрагмент:
        "Обеспечением исполнения обязательств Заёмщика по настоящему
         Договору является: (а) залог недвижимого имущества (ипотека) —
         нежилое здание по адресу г. Москва, ул. Примерная, д. 1,
         оценочной стоимостью 20 000 000 рублей; (б) поручительство
         ООО «Гарант» в размере 10 000 000 рублей. Отношение суммы Кредита
         к стоимости предмета залога (LTV) не превышает 70%. Заёмщик
         обязуется застраховать предмет залога в пользу Банка
         (выгодоприобретатель — Банк) на весь срок кредита."

        Ответ:
        {
          "collateral_present_status": "present",
          "collateral_types": [
            "залог недвижимости (ипотека): нежилое здание г. Москва, ул. Примерная, д. 1, оценочная стоимость 20 000 000 рублей",
            "поручительство ООО «Гарант» на 10 000 000 рублей"
          ],
          "collateral_valuation_status": "present",
          "ltv_status": "present",
          "ltv_display": "≤ 70%",
          "collateral_insurance_status": "present",
          "enforcement_order_status": "not_defined",
          "collateral_summary": "Ипотека (оценка 20 млн руб.) + поручительство (10 млн руб.), LTV ≤ 70%, страхование предусмотрено",
          "collateral_types_display": "Ипотека + поручительство",
          "collateral_insurance_display": "Застрахован в пользу Банка на весь срок",
          "enforcement_order_display": "Не установлен"
        }

        Пример 2 — залог оборудования без оценки (красный флаг):
        Фрагмент:
        "Обеспечением является залог производственного оборудования
         Заёмщика. Стороны согласуют перечень оборудования дополнительно."

        Ответ:
        {
          "collateral_present_status": "present",
          "collateral_types": [
            "залог производственного оборудования (перечень согласуется дополнительно)"
          ],
          "collateral_valuation_status": "not_defined",
          "ltv_status": "not_defined",
          "ltv_display": "Не установлено",
          "collateral_insurance_status": "not_defined",
          "enforcement_order_status": "not_defined",
          "collateral_summary": "Залог оборудования, оценка не указана (красный флаг)",
          "collateral_types_display": "Залог оборудования",
          "collateral_insurance_display": "Не установлено",
          "enforcement_order_display": "Не установлен"
        }

        Пример 3 — без обеспечения:
        Фрагмент:
        "Кредит предоставляется без обеспечения."

        Ответ:
        {
          "collateral_present_status": "absent",
          "collateral_types": [],
          "collateral_valuation_status": "not_defined",
          "ltv_status": "not_defined",
          "ltv_display": "Не применимо",
          "collateral_insurance_status": "not_defined",
          "enforcement_order_status": "not_defined",
          "collateral_summary": "Без обеспечения (необеспеченный кредит)",
          "collateral_types_display": "Не применимо",
          "collateral_insurance_display": "Не применимо",
          "enforcement_order_display": "Не применимо"
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату об обеспечении.
        2. Определи виды обеспечения и конкретику по каждому.
        3. Найди оценку предмета залога и LTV.
        4. Найди порядок обращения взыскания.
        5. Найди обязанность страхования предмета залога.
        6. Сформулируй все user-facing display-поля кратко и по-русски.
        7. Если прямых цитат нет — верни fallback по правилам 5–7.

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь РОВНО одним JSON-объектом без какого-либо дополнительного текста до или после, со всеми 11 ключами:
        {
          "collateral_present_status": "<present / absent / not_defined>",
          "collateral_types": ["<вид обеспечения с конкретикой>"],
          "collateral_valuation_status": "<present / not_defined>",
          "ltv_status": "<present / not_defined>",
          "collateral_insurance_status": "<present / not_defined>",
          "enforcement_order_status": "<judicial / extrajudicial / mixed / not_defined>",
          "collateral_summary": "<краткое summary, 'Не применимо' или 'Не удалось определить'>",
          "collateral_types_display": "<текст, 'Не применимо' или 'Не удалось определить'>",
          "ltv_display": "<значение или 'Не установлено' / 'Не применимо' / 'Не удалось определить'>",
          "collateral_insurance_display": "<текст, 'Не установлено', 'Не применимо' или 'Не удалось определить'>",
          "enforcement_order_display": "<текст, 'Не установлен', 'Не применимо' или 'Не удалось определить'>"
        }
      context_k: 8
      temperature: 0.0
      max_tokens: 1100

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "обеспечение кредита залог ипотека поручительство банковская гарантия предмет залога залоговая стоимость оценка предмета залога LTV обращение взыскания судебный внесудебный порядок страхование предмета залога"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - limitations
      negative_keywords:
        - "означает"
        - "в целях настоящего"
        - "проценты"
        - "пск"
      position_bias:
        preferred_range: [0.20, 0.60]
        boost: 0.14
        scope: segment
      context_k: 8
      max_chunks: 10
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
        - "security_document"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
        - "invoice"
      preferred_clause_functions:
        - "obligations"
        - "limitations"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 700

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1600

      compact_output: false

      presence_signal:
        field: "collateral_and_security_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста кредитного договора сведения
        об обеспечении: виды, оценку предмета залога, LTV, страхование
        предмета залога, порядок обращения взыскания. Не анализируй
        финансовые ковенанты, негативный залог, проценты или ПСК.
        Не оценивай риски. Анализируй только текст договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля (все ключи должны присутствовать в ответе):

        0. collateral_and_security_check_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (collateral_present_status, collateral_valuation_status,
              ltv_status, collateral_insurance_status,
              enforcement_order_status) ≠ "not_defined";
           - "missing" — если все пять содержательных полей = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Важно: collateral_present_status = "absent" (обеспечения нет)
           считается ≠ "not_defined" и даёт presence = "present"
           (договор прямо регулирует вопрос).

           Если presence = "missing":
           - collateral_present_status = "not_defined";
           - collateral_valuation_status = "not_defined";
           - ltv_status = "not_defined";
           - collateral_insurance_status = "not_defined";
           - enforcement_order_status = "not_defined";
           - collateral_types = [];
           - collateral_summary = "Не установлено";
           - collateral_types_display = "Не применимо";
           - ltv_display = "Не применимо";
           - collateral_insurance_display = "Не применимо";
           - enforcement_order_display = "Не применимо";
           - не выполняй остальные шаги.

        1. collateral_present_status — наличие обеспечения:
           - "present" — обеспечение установлено (залог, ипотека,
             поручительство, гарантия и т.п.);
           - "absent" — договор прямо указывает, что кредит
             необеспеченный;
           - "not_defined" — вопрос обеспечения не урегулирован.

        2. collateral_types — массив строк, каждая — вид обеспечения
           с конкретикой (предмет, стоимость, размер поручительства).
           Если обеспечения нет или не указано — [].

        3. collateral_valuation_status — оценка предмета залога:
           - "present" — оценка прямо указана (сумма, ссылка на отчёт
             оценщика);
           - "not_defined" — оценка не указана.

        4. ltv_status — значение LTV:
           - "present" — LTV прямо указан (число или формула);
           - "not_defined" — LTV не указан.

        5. collateral_insurance_status — страхование предмета залога:
           - "present" — обязанность страхования прямо установлена;
           - "not_defined" — страхование не упомянуто.

        6. enforcement_order_status — порядок обращения взыскания:
           - "judicial" — судебный порядок;
           - "extrajudicial" — внесудебный (нотариальная надпись,
             соглашение сторон);
           - "mixed" — смешанный;
           - "not_defined" — порядок не указан.

        7. collateral_summary — КРАТКОЕ summary для юриста.
           НЕ дублируй полный перечень. Примеры:
           - "Ипотека + поручительство, LTV ≤ 70%, страхование";
           - "Залог оборудования, оценка не указана (красный флаг)";
           - "Без обеспечения (необеспеченный кредит)";
           - "Не установлено" / "Не применимо" / "Не удалось определить".

        8. collateral_types_display — краткая формулировка видов.
           - "Ипотека + поручительство";
           - "Залог оборудования";
           - "Без обеспечения";
           - "Не применимо" / "Не удалось определить".

        9. ltv_display — значение LTV.
            - "≤ 70%"; "85% (красный флаг)";
            - "Не установлено" / "Не применимо" / "Не удалось определить".

        10. collateral_insurance_display — краткая формулировка.
            - "Застрахован в пользу Банка на весь срок";
            - "Не установлено" / "Не применимо" / "Не удалось определить".

        11. enforcement_order_display — краткая формулировка.
            - "Судебный"; "Внесудебный (нотариальная надпись)";
            - "Смешанный"; "Не установлен" / "Не применимо" /
              "Не удалось определить".
        </task>

        <context_rules>
        - Перед остальными полями заполни collateral_and_security_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все enum-поля = "not_defined", collateral_types = [], все display-поля = соответствующий fallback.
        - Используй только релевантные фрагменты контекста.
        - Не подставляй нормы закона, обычную практику или предположения вместо текста договора.
        - Не выдумывай предметы залога, суммы, LTV и порядок взыскания, которых нет в тексте.
        - collateral_types — массив строк с конкретикой. Не дублируй виды.
        - collateral_summary — краткое summary, НЕ полный перечень.
        - Красные флаги (отражай в summary): отсутствие оценки; LTV > 80%;
          отсутствие страхования; отсутствие порядка взыскания.
        - Если в разных фрагментах противоречие: enum → "not_defined", display → "Не удалось определить".
        - Не используй null, None, пустые строки или "-" в строковых полях.
        - Пустой массив [] — валидное значение для collateral_types.
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни обеспечения, ни залога, ни поручительства.
           → presence = "missing";
             все enum-поля = "not_defined";
             collateral_types = [];
             все display-поля = "Не применимо" / "Не установлено".

        2. Обеспечение прямо отсутствует.
           "Кредит предоставляется без обеспечения."
           → presence = "present";
             collateral_present_status = "absent";
             collateral_types = [];
             collateral_summary = "Без обеспечения (необеспеченный кредит)";
             все остальные display = "Не применимо".

        3. Противоречие между фрагментами.
           В одной части — ипотека, в другой — залог оборудования
           как единственное обеспечение.
           → presence = "unclear";
             collateral_summary = "Не удалось определить".

        4. Залог без оценки и страхования (красные флаги).
           "Обеспечением является залог оборудования" без оценки,
           LTV и страхования.
           → presence = "present";
             collateral_present_status = "present";
             collateral_valuation_status = "not_defined";
             ltv_status = "not_defined";
             collateral_insurance_status = "not_defined";
             collateral_summary = "Залог оборудования, оценка не указана (красный флаг)".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для collateral_and_security_check_presence используй только: "present", "missing", "unclear".
        - Для collateral_present_status используй только: "present", "absent", "not_defined".
        - Для collateral_valuation_status, ltv_status, collateral_insurance_status используй только: "present", "not_defined".
        - Для enforcement_order_status используй только: "judicial", "extrajudicial", "mixed", "not_defined".
        - Для collateral_types — массив строк (возможно пустой []).
        - Fallback при отсутствии данных:
          * collateral_summary → "Не установлено";
          * collateral_types_display → "Не применимо";
          * ltv_display → "Не применимо";
          * collateral_insurance_display → "Не применимо";
          * enforcement_order_display → "Не применимо".
        - Fallback при противоречии или неоднозначности:
          * все display-поля → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "collateral_and_security_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования по обеспечению кредита. Внутреннее агрегатное signal-поле."
          required: true

        - name: "collateral_present_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["present", "absent", "not_defined"]
          display_in_grid: false
          description: "Наличие обеспечения: present / absent (необеспеченный) / not_defined. Внутреннее enum-поле."
          required: true

        - name: "collateral_types"
          type: "array"
          presentation: "fact"
          label: "Виды обеспечения кредита"
          display_in_grid: false
          description: >
            Полный перечень видов обеспечения с конкретикой (массив строк для payload). Fallback: "Не установлено" / "Не удалось определить".
          required: true

        - name: "collateral_valuation_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["present", "not_defined"]
          display_in_grid: false
          description: "Указана ли оценка предмета залога. Внутреннее enum-поле."
          required: true

        - name: "ltv_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["present", "not_defined"]
          display_in_grid: false
          description: "Указано ли значение LTV. Внутреннее enum-поле."
          required: true

        - name: "collateral_insurance_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["present", "not_defined"]
          display_in_grid: false
          description: "Есть ли обязанность страхования предмета залога. Внутреннее enum-поле."
          required: true

        - name: "enforcement_order_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["judicial", "extrajudicial", "mixed", "not_defined"]
          display_in_grid: false
          description: "Порядок обращения взыскания: judicial / extrajudicial / mixed. Внутреннее enum-поле."
          required: true

        - name: "collateral_summary"
          type: "string"
          presentation: "fact"
          label: "Обеспечение по кредиту"
          display_in_grid: true
          display_priority: 1
          description: >
            Краткое summary обеспечения (полный список — в hidden collateral_types).
            Fallback: "Не установлено" / "Не применимо" / "Не удалось определить".
          required: true

        - name: "collateral_types_display"
          type: "string"
          presentation: "fact"
          label: "Виды обеспечения"
          display_in_grid: true
          display_priority: 2
          description: >
            Понятная формулировка видов обеспечения.
            Fallback: "Не применимо" / "Не удалось определить".
          required: true

        - name: "ltv_display"
          type: "string"
          presentation: "fact"
          label: "LTV (кредит / стоимость залога)"
          display_in_grid: true
          display_priority: 3
          description: >
            Значение LTV.
            Fallback: "Не установлено" / "Не применимо" / "Не удалось определить".
          required: true

        - name: "collateral_insurance_display"
          type: "string"
          presentation: "fact"
          label: "Страхование предмета залога"
          display_in_grid: true
          display_priority: 4
          description: >
            Понятная формулировка страхования предмета залога.
            Fallback: "Не установлено" / "Не применимо" / "Не удалось определить".
          required: true

        - name: "enforcement_order_display"
          type: "string"
          presentation: "fact"
          label: "Порядок обращения взыскания"
          display_in_grid: true
          display_priority: 5
          description: >
            Понятная формулировка порядка обращения взыскания.
            Fallback: "Не установлен" / "Не применимо" / "Не удалось определить".
          required: true

      store_payload: true

  - id: conditions_precedent_check
    name: "Условия предоставления кредита (conditions precedent)"
    description: >
      Проверяет условия, которые должны быть выполнены до предоставления
      кредита, право банка отказать в предоставлении и повторные заверения
      на дату выборки.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "условия предоставления кредита"
        - "условия предоставления транша"
        - "предварительные условия"
        - "conditions precedent"
        - "до предоставления кредита"
        - "до даты выборки"
        - "право отказать в предоставлении"
        - "повторные заверения"
        - "repeating representations"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)условия\\s+предоставлен"
        - "(?i)conditions?\\s+precedent"
        - "(?i)до\\s+(даты\\s+)?(выборк|предоставлен|подписан)"
        - "(?i)вправе\\s+отказать\\s+в\\s+предоставлен"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется кредитный договор.
        Проверяется только один вопрос: условия предоставления кредита
        (conditions precedent), право банка отказать в предоставлении
        и повторные заверения на дату выборки.

        Нормативный ориентир:
        - ст. 821 ГК РФ — отказ от предоставления кредита при обстоятельствах,
          свидетельствующих о невозврате
        - ст. 819 ГК РФ — кредитный договор

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора,
          а чего прямо нет.
        - Не оценивай серьёзность риска.
        - Conditions precedent — предварительные условия, которые должны
          быть выполнены до предоставления кредита / транша.
        - Право банка отказать в предоставлении — отдельное право, может
          быть обусловлено разными обстоятельствами.
        - Repeating representations — заверения, которые повторяются на дату
          каждой выборки / предоставления транша.
        - Красные флаги:
            * широкое право банка отказать без чётких оснований
              («по усмотрению Банка»);
            * отсутствие conditions precedent в кредитной линии;
            * отсутствие повторных заверений перед каждой выборкой.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Есть ли условия предоставления (conditions precedent).
        2. Какие условия должны быть выполнены (документы, регистрация,
           согласия, отсутствие дефолта).
        3. Есть ли право банка отказать в предоставлении.
        4. Есть ли повторные заверения на дату выборки.
        5. Сформулируй понятные для юриста текстовые расшифровки:
           - cp_summary,
           - cp_conditions_display,
           - bank_refusal_right_display.

        [ПРАВИЛА]
        1. Используй только текст документа. Не подставляй нормы закона
           вместо текста договора.
        2. Если параметр прямо указан — возвращай дословно или делай
           точную выжимку.
        3. `cp_documents_required` — массив строк, каждая — документ /
           условие, которое должно быть выполнено до предоставления.
           Если перечня нет — пустой массив [].
        4. `cp_summary` — КРАТКОЕ summary, например:
           - "3 условия: документы, регистрация залога, отсутствие дефолта";
           - "Право Банка отказать по усмотрению (красный флаг)";
           - "Не установлены".
           НЕ дублируй полный перечень.
        5. Если право банка отказать широкое и без чётких оснований —
           отражай как красный флаг в bank_refusal_right_display.
        6. Если параметр прямо не указан:
           - для сигнальных enum-полей — "not_defined";
           - для текстовых user-facing полей — "Не установлено";
           - для массива — [].
        7. Если тема по существу не применима — display-поле =
           "Не применимо", сигнальное = "not_defined".
        8. Если текст есть, но надёжный вывод сделать нельзя — display-поле =
           "Не удалось определить", сигнальное = "not_defined".
        9. Никогда не используй null, None, пустые строки или "-".
        10. Не выдумывай условия, которых нет в тексте.
        11. При конфликтующих фрагментах — приоритет более позднему или
            более специальному положению.
        12. В evidence включай только текст договора.
        13. Верни РОВНО один JSON-объект со всеми ключами из [ФОРМАТ ОТВЕТА] без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [РОССИЙСКАЯ ПРАКТИКА — ПОДСКАЗКИ]
        - Типичные conditions precedent:
            * предоставление корпоративных документов;
            * предоставление финансовой отчётности;
            * регистрация залога / ипотеки;
            * заключение договора поручительства;
            * отсутствие событий дефолта на дату выборки;
            * заверения о достоверности информации.
        - Типичная формулировка отказа:
            * «Банк вправе отказать в предоставлении Кредита при наличии
              обстоятельств, свидетельствующих о том, что сумма Кредита
              не будет возвращена» (по ст. 821 ГК РФ);
        - Повторные заверения: «Заверения, указанные в п. X, считаются
          повторёнными Заёмщиком на каждую дату предоставления Транша».
        - Красный флаг: широкое право отказать «по усмотрению Банка».

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — типовые conditions precedent и повторные заверения:
        Фрагмент:
        "Банк обязан предоставить Кредит при выполнении Заёмщиком следующих
         условий: (а) предоставление копий учредительных документов
         Заёмщика и решения об одобрении крупной сделки; (б) государственная
         регистрация ипотеки; (в) предоставление финансовой отчётности
         за последний отчётный период; (г) отсутствие событий дефолта
         на дату предоставления. Заверения, указанные в разделе 5,
         считаются повторёнными на каждую дату предоставления Кредита."

        Ответ:
        {
          "cp_present_status": "present",
          "cp_documents_required": [
            "учредительные документы Заёмщика",
            "решение об одобрении крупной сделки",
            "государственная регистрация ипотеки",
            "финансовая отчётность за последний отчётный период",
            "отсутствие событий дефолта на дату предоставления"
          ],
          "bank_refusal_right_status": "not_defined",
          "repeating_representations_status": "present",
          "cp_summary": "5 условий: документы, одобрение, регистрация ипотеки, отчётность, отсутствие дефолта",
          "cp_conditions_display": "Документы, одобрение крупной сделки, регистрация ипотеки, отчётность, отсутствие дефолта",
          "bank_refusal_right_display": "Не установлено"
        }

        Пример 2 — широкое право банка отказать (красный флаг):
        Фрагмент:
        "Банк вправе отказать в предоставлении Транша по своему усмотрению
         без указания причин."

        Ответ:
        {
          "cp_present_status": "not_defined",
          "cp_documents_required": [],
          "bank_refusal_right_status": "present",
          "repeating_representations_status": "not_defined",
          "cp_summary": "Условия не установлены",
          "cp_conditions_display": "Не установлено",
          "bank_refusal_right_display": "Право Банка отказать по усмотрению без указания причин (красный флаг)"
        }

        Пример 3 — отсутствие conditions precedent:
        Фрагмент:
        "Предоставление Кредита осуществляется в день подписания
         настоящего Договора."

        Ответ:
        {
          "cp_present_status": "absent",
          "cp_documents_required": [],
          "bank_refusal_right_status": "not_defined",
          "repeating_representations_status": "not_defined",
          "cp_summary": "Условия не установлены (предоставление в день подписания)",
          "cp_conditions_display": "Не применимо",
          "bank_refusal_right_display": "Не установлено"
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату об условиях предоставления.
        2. Составь перечень условий и документов.
        3. Найди право банка отказать. Определи, широкое ли оно.
        4. Найди повторные заверения.
        5. Сформулируй user-facing display-поля кратко и по-русски.
        6. Если прямых цитат нет — верни fallback по правилам 6–8.

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь РОВНО одним JSON-объектом без какого-либо дополнительного текста до или после, со всеми 8 ключами:
        {
          "cp_present_status": "<present / absent / not_defined>",
          "cp_documents_required": ["<условие 1>", "<условие 2>"],
          "bank_refusal_right_status": "<present / not_defined>",
          "repeating_representations_status": "<present / not_defined>",
          "cp_summary": "<краткое summary, 'Не применимо' или 'Не удалось определить'>",
          "cp_conditions_display": "<текст, 'Не установлено', 'Не применимо' или 'Не удалось определить'>",
          "bank_refusal_right_display": "<текст, 'Не установлено', 'Не применимо' или 'Не удалось определить'>"
        }
      context_k: 8
      temperature: 0.0
      max_tokens: 900

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "условия предоставления кредита conditions precedent условия выборки транша предоставление документов регистрация залога право отказать в предоставлении повторные заверения repeating representations"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - procedures
      negative_keywords:
        - "означает"
        - "в целях настоящего"
        - "проценты"
        - "пск"
      position_bias:
        preferred_range: [0.10, 0.45]
        boost: 0.14
        scope: segment
      context_k: 8
      max_chunks: 10
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
        - "invoice"
      preferred_clause_functions:
        - "obligations"
        - "procedures"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 35
      max_snippet_length: 550

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1300

      compact_output: false

      presence_signal:
        field: "conditions_precedent_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста кредитного договора сведения
        об условиях предоставления кредита (conditions precedent): перечень
        условий и документов, право банка отказать в предоставлении,
        повторные заверения. Не анализируй обеспечение, ковенанты,
        проценты или ПСК. Не оценивай риски. Анализируй только текст договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля (все ключи должны присутствовать в ответе):

        0. conditions_precedent_check_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (cp_present_status, bank_refusal_right_status,
              repeating_representations_status) ≠ "not_defined";
           - "missing" — если все три содержательных поля = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Важно: cp_present_status = "absent" (условий нет) считается
           ≠ "not_defined" и даёт presence = "present" (договор прямо
           регулирует вопрос).

           Если presence = "missing":
           - cp_present_status = "not_defined";
           - bank_refusal_right_status = "not_defined";
           - repeating_representations_status = "not_defined";
           - cp_documents_required = [];
           - cp_summary = "Не установлено";
           - cp_conditions_display = "Не применимо";
           - bank_refusal_right_display = "Не установлено";
           - не выполняй остальные шаги.

        1. cp_present_status — наличие условий предоставления:
           - "present" — условия предоставления (CP) прямо установлены;
           - "absent" — договор прямо указывает, что условий нет
             (предоставление в день подписания и т.п.);
           - "not_defined" — вопрос не урегулирован.

        2. cp_documents_required — массив строк, каждая — условие
           / документ, который должен быть выполнен до предоставления.
           Если перечня нет — [].

        3. bank_refusal_right_status — право банка отказать:
           - "present" — право отказать прямо установлено;
           - "not_defined" — право отказать прямо не упомянуто.

        4. repeating_representations_status — повторные заверения:
           - "present" — заверения повторяются на дату каждой выборки;
           - "not_defined" — повторные заверения не упомянуты.

        5. cp_summary — КРАТКОЕ summary для юриста.
           НЕ дублируй полный перечень. Примеры:
           - "5 условий: документы, одобрение, регистрация ипотеки,
             отчётность, отсутствие дефолта";
           - "Право Банка отказать по усмотрению (красный флаг)";
           - "Условия не установлены (предоставление в день подписания)";
           - "Не установлено" / "Не применимо" / "Не удалось определить".

        6. cp_conditions_display — краткая формулировка перечня условий.
           - "Документы, одобрение, регистрация ипотеки, отчётность";
           - "Не установлено" / "Не применимо" / "Не удалось определить".

        7. bank_refusal_right_display — краткая формулировка права отказа.
           - "Право Банка отказать при обстоятельствах, свидетельствующих
             о невозврате";
           - "Право Банка отказать по усмотрению без указания причин
             (красный флаг)";
           - "Не установлено" / "Не применимо" / "Не удалось определить".
        </task>

        <context_rules>
        - Перед остальными полями заполни conditions_precedent_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все enum-поля = "not_defined", cp_documents_required = [], все display-поля = соответствующий fallback.
        - Используй только релевантные фрагменты контекста.
        - Не подставляй нормы закона, обычную практику или предположения вместо текста договора.
        - Не выдумывай условия, документы и сроки, которых нет в тексте.
        - cp_documents_required — массив строк. Не дублируй условия.
        - cp_summary — краткое summary, НЕ полный перечень.
        - Красный флаг: широкое право банка отказать «по усмотрению»
          без чётких оснований. Отражай в bank_refusal_right_display.
        - Если в разных фрагментах противоречие: enum → "not_defined", display → "Не удалось определить".
        - Не используй null, None, пустые строки или "-" в строковых полях.
        - Пустой массив [] — валидное значение для cp_documents_required.
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни условий предоставления, ни права отказа,
           ни повторных заверений.
           → presence = "missing";
             все enum-поля = "not_defined";
             cp_documents_required = [];
             cp_summary = "Не установлено";
             cp_conditions_display = bank_refusal_right_display = "Не применимо".

        2. Условия прямо отсутствуют.
           "Предоставление Кредита в день подписания Договора."
           → presence = "present";
             cp_present_status = "absent";
             cp_documents_required = [];
             cp_summary = "Условия не установлены (предоставление в день подписания)";
             cp_conditions_display = "Не применимо".

        3. Противоречие между фрагментами.
           В одной части — 5 условий, в другой — «без условий».
           → presence = "unclear";
             cp_present_status = "not_defined";
             cp_summary = "Не удалось определить".

        4. Широкое право банка отказать (красный флаг).
           "Банк вправе отказать по своему усмотрению без указания причин."
           → presence = "present";
             bank_refusal_right_status = "present";
             bank_refusal_right_display = "Право Банка отказать по усмотрению без указания причин (красный флаг)".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для conditions_precedent_check_presence используй только: "present", "missing", "unclear".
        - Для cp_present_status используй только: "present", "absent", "not_defined".
        - Для bank_refusal_right_status, repeating_representations_status используй только: "present", "not_defined".
        - Для cp_documents_required — массив строк (возможно пустой []).
        - Fallback при отсутствии данных:
          * cp_summary → "Не установлено";
          * cp_conditions_display → "Не применимо";
          * bank_refusal_right_display → "Не установлено".
        - Fallback при противоречии или неоднозначности:
          * все display-поля → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "conditions_precedent_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования по условиям предоставления кредита. Внутреннее агрегатное signal-поле."
          required: true

        - name: "cp_present_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["present", "absent", "not_defined"]
          display_in_grid: false
          description: "Наличие условий предоставления: present / absent / not_defined. Внутреннее enum-поле."
          required: true

        - name: "cp_documents_required"
          type: "array"
          presentation: "fact"
          label: "Документы отлагательных условий (CP)"
          display_in_grid: false
          description: >
            Полный перечень условий предоставления (массив строк для payload). Fallback: "Не установлено" / "Не удалось определить".
          required: true

        - name: "bank_refusal_right_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["present", "not_defined"]
          display_in_grid: false
          description: "Есть ли право банка отказать в предоставлении. Внутреннее enum-поле."
          required: true

        - name: "repeating_representations_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["present", "not_defined"]
          display_in_grid: false
          description: "Есть ли повторные заверения на дату выборки. Внутреннее enum-поле."
          required: true

        - name: "cp_summary"
          type: "string"
          presentation: "fact"
          label: "Условия предоставления"
          display_in_grid: true
          display_priority: 1
          description: >
            Краткое summary условий (полный список — в hidden cp_documents_required).
            Fallback: "Не установлено" / "Не применимо" / "Не удалось определить".
          required: true

        - name: "cp_conditions_display"
          type: "string"
          presentation: "fact"
          label: "Перечень условий"
          display_in_grid: true
          display_priority: 2
          description: >
            Понятная формулировка перечня условий предоставления.
            Fallback: "Не установлено" / "Не применимо" / "Не удалось определить".
          required: true

        - name: "bank_refusal_right_display"
          type: "string"
          presentation: "fact"
          label: "Право Банка отказать"
          display_in_grid: true
          display_priority: 3
          description: >
            Понятная формулировка права отказа банка в предоставлении.
            Fallback: "Не установлено" / "Не применимо" / "Не удалось определить".
          required: true

      store_payload: true

  - id: non_financial_covenants_check
    name: "Нефинансовые ковенанты (negative и affirmative)"
    description: >
      Проверяет ограничительные (negative) и обязывающие (affirmative)
      нефинансовые ковенанты: asset sale, M&A, дивиденды, новый долг,
      займы третьим лицам, связанные лица, отчётность, страховка,
      поддержание существования и лицензий.
    triggers:
      any:
        - corporate_borrower
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "не вправе без согласия"
        - "обязуется не"
        - "ограничения на распоряжение активами"
        - "запрет на отчуждение"
        - "запрет на выплату дивидендов"
        - "запрет на привлечение нового долга"
        - "сделки со связанными лицами"
        - "affirmative covenants"
        - "negative covenants"
        - "обязуется предоставлять отчётность"
        - "поддерживать существование"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)(не\\s+вправе|обязуется\\s+не)\\s+.{0,60}(актив|имуществ|дол|дивиденд|слиян|приобрет)"
        - "(?i)сделк.{0,20}связанн"
        - "(?i)(asset\\s+sale|merger|covenant)"
        - "(?i)обязуется\\s+предоставлять\\s+(отчёт|отчет)"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется кредитный договор.
        Проверяется только один вопрос: нефинансовые ковенанты —
        ограничительные (negative) и обязывающие (affirmative).

        Нормативный ориентир:
        - ст. 819, 821 ГК РФ — кредитный договор
        - В российском праве нефинансовые ковенанты — договорный институт

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора,
          а чего прямо нет.
        - Не оценивай серьёзность риска.
        - Negative covenants (ограничительные) — обязательства заёмщика
          не совершать определённые действия:
            * asset sale — не продавать / не отчуждать активы;
            * M&A — не совершать слияния / поглощения / реорганизации;
            * dividend restrictions — не выплачивать дивиденды;
            * debt incurrence — не привлекать новый долг без согласия банка;
            * loans to third parties — не предоставлять займы третьим лицам;
            * capex limits — ограничения на капитальные вложения;
            * related party transactions — ограничения на сделки
              со связанными лицами;
            * изменение основного вида деятельности.
        - Affirmative covenants (обязывающие) — обязанности заёмщика:
            * предоставление финансовой отчётности банку;
            * поддержание страховки;
            * соблюдение применимого законодательства;
            * поддержание существования (maintain existence);
            * поддержание лицензий и разрешений;
            * уведомление банка о существенных событиях.
        - Красные флаги:
            * широкие запреты без исключений и без разрешённых сделок;
            * отсутствие перечня разрешённых действий;
            * обширные запреты на сделки со связанными лицами без порогов.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Есть ли negative covenants (ограничительные).
        2. Какие именно негативные ковенанты установлены.
        3. Есть ли affirmative covenants (обязывающие).
        4. Какие именно позитивные ковенанты установлены.
        5. Сформулируй понятные для юриста текстовые расшифровки:
           - non_financial_covenants_summary,
           - negative_covenants_display,
           - affirmative_covenants_display.

        [ПРАВИЛА]
        1. Используй только текст документа. Не подставляй нормы закона.
        2. Если параметр прямо указан — возвращай дословно или делай
           точную выжимку.
        3. `negative_covenants_types` и `affirmative_covenants_types` —
           массивы строк, каждая — один ковенант с краткой формулировкой.
           Если ковенантов нет — пустой массив [].
        4. `non_financial_covenants_summary` — КРАТКОЕ summary, например:
           - "5 negative + 3 affirmative ковенанта";
           - "Negative: asset sale, M&A, дивиденды (3); affirmative:
             отчётность, страховка (2)";
           - "Не установлены".
           НЕ дублируй полные перечни в summary.
        5. Если параметр прямо не указан:
           - для сигнальных enum-полей — "not_defined";
           - для текстовых user-facing полей — "Не установлено";
           - для массивов — [].
        6. Если тема по существу не применима — display-поле =
           "Не применимо", сигнальное = "not_defined".
        7. Если текст есть, но надёжный вывод сделать нельзя — display-поле =
           "Не удалось определить", сигнальное = "not_defined".
        8. Никогда не используй null, None, пустые строки или "-".
        9. Не выдумывай ковенанты, которых нет в тексте.
        10. При конфликтующих фрагментах — приоритет более позднему или
            более специальному положению.
        11. В evidence включай только текст договора.
        12. Верни РОВНО один JSON-объект со всеми ключами из [ФОРМАТ ОТВЕТА] без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [РОССИЙСКАЯ ПРАКТИКА — ПОДСКАЗКИ]
        - Типичные negative covenants в российских корпоративных кредитах:
            * «Заёмщик обязуется не отчуждать и не обременять основные
              средства без предварительного письменного согласия Банка»;
            * «Заёмщик обязуется не совершать сделки по слиянию
              и присоединению без согласия Банка»;
            * «Заёмщик обязуется не выплачивать дивиденды при нарушении
              финансовых ковенантов»;
            * «Заёмщик обязуется не привлекать новые кредиты и займы
              без согласия Банка».
        - Типичные affirmative covenants:
            * «Заёмщик обязуется предоставлять Банку квартальную
              и годовую финансовую отчётность»;
            * «Заёмщик обязуется поддерживать страхование имущества»;
            * «Заёмщик обязуется сохранять свой юридический статус».
        - Красный флаг: широкие запреты без перечня разрешённых сделок.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — типовой набор negative + affirmative:
        Фрагмент:
        "Заёмщик обязуется не совершать без предварительного письменного
         согласия Банка: (а) отчуждение или обременение основных средств
         балансовой стоимостью более 1 000 000 рублей; (б) слияние,
         присоединение, создание дочерних обществ; (в) привлечение новых
         кредитов и займов. Заёмщик обязуется: (г) предоставлять Банку
         квартальную и годовую отчётность в течение 30 дней;
         (д) поддерживать страхование имущества."

        Ответ:
        {
          "negative_covenants_present_status": "present",
          "affirmative_covenants_present_status": "present",
          "negative_covenants_types": [
            "не отчуждать и не обременять основные средства балансовой стоимостью более 1 000 000 рублей",
            "не совершать слияние, присоединение, не создавать дочерние общества",
            "не привлекать новые кредиты и займы"
          ],
          "affirmative_covenants_types": [
            "предоставлять квартальную и годовую отчётность в течение 30 дней",
            "поддерживать страхование имущества"
          ],
          "non_financial_covenants_summary": "3 negative + 2 affirmative ковенанта",
          "negative_covenants_display": "Ограничения: отчуждение основных средств, M&A, новый долг",
          "affirmative_covenants_display": "Обязанности: отчётность, страхование"
        }

        Пример 2 — только affirmative ковенанты:
        Фрагмент:
        "Заёмщик обязуется предоставлять Банку финансовую отчётность
         в течение 15 рабочих дней по окончании каждого квартала
         и уведомлять Банк о существенных событиях в течение 5 рабочих дней."

        Ответ:
        {
          "negative_covenants_present_status": "absent",
          "affirmative_covenants_present_status": "present",
          "negative_covenants_types": [],
          "affirmative_covenants_types": [
            "предоставлять квартальную финансовую отчётность в течение 15 рабочих дней",
            "уведомлять Банк о существенных событиях в течение 5 рабочих дней"
          ],
          "non_financial_covenants_summary": "2 affirmative ковенанта, negative не установлены",
          "negative_covenants_display": "Не установлены",
          "affirmative_covenants_display": "Обязанности: отчётность, уведомления"
        }

        Пример 3 — ковенанты отсутствуют:
        Фрагмент:
        "Иные обязательства Заёмщика Договором не предусмотрены."

        Ответ:
        {
          "negative_covenants_present_status": "absent",
          "affirmative_covenants_present_status": "absent",
          "negative_covenants_types": [],
          "affirmative_covenants_types": [],
          "non_financial_covenants_summary": "Не установлены",
          "negative_covenants_display": "Не установлены",
          "affirmative_covenants_display": "Не установлены"
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямые цитаты об ограничениях (negative).
        2. Найди прямые цитаты об обязанностях (affirmative).
        3. Составь два перечня с краткой формулировкой по каждому.
        4. Проверь красные флаги: широкие запреты без перечня разрешённых
           сделок.
        5. Сформулируй user-facing display-поля кратко и по-русски.
        6. Если прямых цитат нет — верни fallback по правилам 5–7.

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь РОВНО одним JSON-объектом без какого-либо дополнительного текста до или после, со всеми 8 ключами:
        {
          "negative_covenants_present_status": "<present / absent / not_defined>",
          "affirmative_covenants_present_status": "<present / absent / not_defined>",
          "negative_covenants_types": ["<ковенант 1>", "<ковенант 2>"],
          "affirmative_covenants_types": ["<обязанность 1>", "<обязанность 2>"],
          "non_financial_covenants_summary": "<краткое summary, 'Не применимо' или 'Не удалось определить'>",
          "negative_covenants_display": "<текст, 'Не установлены', 'Не применимо' или 'Не удалось определить'>",
          "affirmative_covenants_display": "<текст, 'Не установлены', 'Не применимо' или 'Не удалось определить'>"
        }
      context_k: 8
      temperature: 0.0
      max_tokens: 1000

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "нефинансовые ковенанты negative covenants affirmative covenants ограничения распоряжение активами asset sale слияние M&A дивиденды новый долг займы третьим лицам связанные лица отчётность страхование поддержание существования лицензии уведомление банка"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - covenants
      negative_keywords:
        - "означает"
        - "в целях настоящего"
        - "проценты"
        - "пск"
        - "предмет договора"
      position_bias:
        preferred_range: [0.30, 0.75]
        boost: 0.14
        scope: segment
      context_k: 8
      max_chunks: 10
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
        - "invoice"
      preferred_clause_functions:
        - "obligations"
        - "covenants"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 650

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1500

      compact_output: false

      presence_signal:
        field: "non_financial_covenants_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста кредитного договора сведения
        о нефинансовых ковенантах: ограничительных (negative) и обязывающих
        (affirmative). Не анализируй финансовые ковенанты, негативный залог,
        обеспечение, проценты или ПСК.
        Не оценивай риски. Анализируй только текст договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля (все ключи должны присутствовать в ответе):

        0. non_financial_covenants_check_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (negative_covenants_present_status,
              affirmative_covenants_present_status) ≠ "not_defined";
           - "missing" — если оба содержательных поля = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Важно: "absent" (ковенантов нет) считается ≠ "not_defined"
           и даёт presence = "present" (договор прямо регулирует вопрос).

           Если presence = "missing":
           - negative_covenants_present_status = "not_defined";
           - affirmative_covenants_present_status = "not_defined";
           - negative_covenants_types = [];
           - affirmative_covenants_types = [];
           - non_financial_covenants_summary = "Не установлены";
           - negative_covenants_display = "Не установлены";
           - affirmative_covenants_display = "Не установлены";
           - не выполняй остальные шаги.

        1. negative_covenants_present_status — наличие ограничительных
           ковенантов:
           - "present" — negative covenants прямо установлены;
           - "absent" — договор прямо указывает, что ограничений нет;
           - "not_defined" — вопрос не урегулирован.

        2. affirmative_covenants_present_status — наличие обязывающих
           ковенантов:
           - "present" — affirmative covenants прямо установлены;
           - "absent" — договор прямо указывает, что обязанностей нет;
           - "not_defined" — вопрос не урегулирован.

        3. negative_covenants_types — массив строк, каждая — один
           негативный ковенант с краткой формулировкой.
           Примеры: "не отчуждать основные средства без согласия Банка",
           "не выплачивать дивиденды сверх 50% чистой прибыли".
           Если нет — [].

        4. affirmative_covenants_types — массив строк, каждая — одна
           обязанность с краткой формулировкой.
           Примеры: "предоставлять квартальную отчётность в течение 30 дней",
           "поддерживать страхование имущества".
           Если нет — [].

        5. non_financial_covenants_summary — КРАТКОЕ summary.
           НЕ дублируй полные перечни. Примеры:
           - "3 negative + 2 affirmative ковенанта";
           - "Negative: asset sale, M&A, дивиденды; affirmative: отчётность";
           - "Не установлены" / "Не применимо" / "Не удалось определить".

        6. negative_covenants_display — краткая формулировка.
           - "Ограничения: отчуждение основных средств, M&A, новый долг";
           - "Не установлены" / "Не применимо" / "Не удалось определить".

        7. affirmative_covenants_display — краткая формулировка.
           - "Обязанности: отчётность, страхование, поддержание существования";
           - "Не установлены" / "Не применимо" / "Не удалось определить".
        </task>

        <context_rules>
        - Перед остальными полями заполни non_financial_covenants_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все enum-поля = "not_defined", все массивы = [], все display-поля = "Не установлены".
        - Используй только релевантные фрагменты контекста.
        - Не подставляй нормы закона, обычную практику или предположения вместо текста договора.
        - Различай negative (ограничения «не делать») и affirmative (обязанности «делать»).
        - Не выдумывай ковенанты, которых нет в тексте.
        - negative_covenants_types и affirmative_covenants_types — массивы строк. Не дублируй.
        - non_financial_covenants_summary — краткое summary, НЕ полные перечни.
        - Красные флаги: широкие запреты без перечня разрешённых сделок — отражай в display.
        - Если в разных фрагментах противоречие: enum → "not_defined", display → "Не удалось определить".
        - Не используй null, None, пустые строки или "-" в строковых полях.
        - Пустой массив [] — валидное значение для массивов.
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни negative, ни affirmative ковенантов.
           → presence = "missing";
             оба enum-поля = "not_defined";
             оба массива = [];
             все display-поля = "Не установлены".

        2. Ковенанты прямо отсутствуют.
           "Иные обязательства Заёмщика Договором не предусмотрены."
           → presence = "present";
             оба enum-поля = "absent";
             оба массива = [];
             non_financial_covenants_summary = "Не установлены";
             оба display = "Не установлены".

        3. Противоречие между фрагментами.
           В одной части — запрет на отчуждение, в другой —
           «Заёмщик вправе распоряжаться активами без ограничений».
           → presence = "unclear";
             оба enum-поля = "not_defined";
             non_financial_covenants_summary = "Не удалось определить".

        4. Только affirmative ковенанты, negative отсутствуют.
           "Заёмщик обязуется предоставлять отчётность" без ограничений.
           → presence = "present";
             negative_covenants_present_status = "absent";
             affirmative_covenants_present_status = "present";
             negative_covenants_display = "Не установлены".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для non_financial_covenants_check_presence используй только: "present", "missing", "unclear".
        - Для negative_covenants_present_status и affirmative_covenants_present_status используй только: "present", "absent", "not_defined".
        - Для negative_covenants_types и affirmative_covenants_types — массивы строк (возможно пустые []).
        - Fallback при отсутствии данных:
          * non_financial_covenants_summary → "Не установлены";
          * negative_covenants_display → "Не установлены";
          * affirmative_covenants_display → "Не установлены".
        - Fallback при противоречии или неоднозначности:
          * все display-поля → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "non_financial_covenants_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования по нефинансовым ковенантам. Внутреннее агрегатное signal-поле."
          required: true

        - name: "negative_covenants_present_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["present", "absent", "not_defined"]
          display_in_grid: false
          description: "Наличие ограничительных (negative) ковенантов. Внутреннее enum-поле."
          required: true

        - name: "affirmative_covenants_present_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["present", "absent", "not_defined"]
          display_in_grid: false
          description: "Наличие обязывающих (affirmative) ковенантов. Внутреннее enum-поле."
          required: true

        - name: "negative_covenants_types"
          type: "array"
          presentation: "fact"
          label: "Виды негативных ковенантов"
          display_in_grid: false
          description: >
            Полный перечень негативных ковенантов (массив строк для payload). Fallback: "Не установлено" / "Не удалось определить".
          required: true

        - name: "affirmative_covenants_types"
          type: "array"
          presentation: "fact"
          label: "Виды позитивных ковенантов"
          display_in_grid: false
          description: >
            Полный перечень позитивных ковенантов (массив строк для payload). Fallback: "Не установлено" / "Не удалось определить".
          required: true

        - name: "non_financial_covenants_summary"
          type: "string"
          presentation: "fact"
          label: "Нефинансовые ковенанты"
          display_in_grid: true
          display_priority: 1
          description: >
            Краткое summary нефинансовых ковенантов.
            Fallback: "Не установлены" / "Не применимо" / "Не удалось определить".
          required: true

        - name: "negative_covenants_display"
          type: "string"
          presentation: "fact"
          label: "Ограничительные ковенанты"
          display_in_grid: true
          display_priority: 2
          description: >
            Понятная формулировка негативных ковенантов.
            Fallback: "Не установлены" / "Не применимо" / "Не удалось определить".
          required: true

        - name: "affirmative_covenants_display"
          type: "string"
          presentation: "fact"
          label: "Обязывающие ковенанты"
          display_in_grid: true
          display_priority: 3
          description: >
            Понятная формулировка позитивных ковенантов.
            Fallback: "Не установлены" / "Не применимо" / "Не удалось определить".
          required: true

      store_payload: true

  - id: currency_and_fx_clause_check
    name: "Валютная оговорка, валютный риск и мультивалютность"
    description: >
      Проверяет валюту предоставления и валюту возврата, распределение
      валютного риска, курсовую оговорку, порядок конвертации и наличие
      мультивалютных траншей.
    triggers:
      any:
        - foreign_currency
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "валюта кредита"
        - "валюта предоставления"
        - "валюта возврата"
        - "валютная оговорка"
        - "валютный риск"
        - "курсовая разница"
        - "курс Центрального банка"
        - "курс на дату"
        - "конвертация"
        - "мультивалютный"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)валют(а|ы|ная)\\s+(кредит|предоставлен|возврат|оговорк)"
        - "(?i)валютн(ый|ого)\\s+риск"
        - "(?i)курс.{0,30}(ЦБ|центрального\\s+банка|на\\s+дату)"
        - "(?i)конвертаци"
        - "(?i)мультивалютн"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется кредитный договор (в том числе валютный).
        Проверяется только один вопрос: валютная оговорка, валютный риск
        и порядок конвертации.

        Нормативный ориентир:
        - ст. 317 ГК РФ — валютные обязательства
        - ФЗ № 173-ФЗ «О валютном регулировании и валютном контроле»
        - ст. 807, 819 ГК РФ — заём и кредит

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора,
          а чего прямо нет.
        - Не оценивай серьёзность риска.
        - Различай:
            * валюта предоставления — в какой валюте выдаётся кредит;
            * валюта возврата — в какой валюте возвращается;
            * валюта платежа процентов.
          Валюты могут не совпадать (мультивалютный кредит).
        - Валютный риск — кто несёт риск изменения курса:
            * borrower — заёмщик;
            * lender — банк;
            * shared — стороны делят риск;
            * not_defined — не установлено.
        - Курсовая оговорка — какой курс применяется и на какую дату.
        - Красные флаги:
            * валютный риск полностью на заёмщике без ограничений;
            * отсутствие курсовой оговорки;
            * право банка в одностороннем порядке выбирать курс.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Валюта предоставления.
        2. Валюта возврата и уплаты процентов.
        3. Кто несёт валютный риск.
        4. Какая применяется курсовая оговорка.
        5. Есть ли порядок конвертации.
        6. Сформулируй понятные для юриста текстовые расшифровки:
           - currency_summary,
           - fx_risk_display,
           - fx_clause_display.

        [ПРАВИЛА]
        1. Используй только текст документа. Не подставляй нормы закона.
        2. Если параметр прямо указан — возвращай дословно или делай
           точную выжимку.
        3. `currency_summary` — КРАТКОЕ summary, например:
           - "Рублёвый, без валютного риска";
           - "USD предоставление и возврат, риск на заёмщике";
           - "EUR предоставление, RUB возврат по курсу ЦБ на дату платежа".
        4. Если параметр прямо не указан:
           - для сигнальных enum-полей — "not_defined";
           - для текстовых user-facing полей — "Не установлено".
        5. Если тема по существу не применима (рублёвый кредит без
           валютных условий) — display-поле = "Не применимо",
           сигнальное = "not_defined".
        6. Если текст есть, но надёжный вывод сделать нельзя — display-поле =
           "Не удалось определить", сигнальное = "not_defined".
        7. Никогда не используй null, None, пустые строки или "-".
        8. Не выдумывай курсовые оговорки и валюты, которых нет в тексте.
        9. При конфликтующих фрагментах — приоритет более позднему или
           более специальному положению.
        10. В evidence включай только текст договора.
        11. Верни РОВНО один JSON-объект со всеми ключами из [ФОРМАТ ОТВЕТА] без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [РОССИЙСКАЯ ПРАКТИКА — ПОДСКАЗКИ]
        - Типичные формулировки:
            * «Кредит предоставляется в долларах США. Возврат в USD» →
              валюты совпадают, риск на заёмщике.
            * «Кредит в евро. Возврат в рублях по курсу ЦБ РФ на дату
              платежа» → валютная оговорка с конвертацией.
            * «Кредит в рублях» → fx_risk_display = "Не применимо".
        - Красный флаг: отсутствие курсовой оговорки при несовпадении
          валюты предоставления и валюты возврата.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — валютный кредит USD, валюты совпадают:
        Фрагмент:
        "Кредит предоставляется в долларах США. Возврат Кредита
         и уплата процентов осуществляются в долларах США. Валютный риск
         изменения курса несёт Заёмщик."

        Ответ:
        {
          "disbursement_currency": "USD",
          "repayment_currency": "USD",
          "fx_risk_bearer": "borrower",
          "fx_clause_status": "not_defined",
          "conversion_mechanism_status": "not_defined",
          "currency_summary": "Валютный (USD), предоставление и возврат в USD, риск на Заёмщике",
          "fx_risk_display": "Валютный риск на Заёмщике",
          "fx_clause_display": "Курсовая оговорка не установлена"
        }

        Пример 2 — валютная оговорка с конвертацией:
        Фрагмент:
        "Кредит предоставляется в евро. Возврат Кредита и уплата процентов
         осуществляются в рублях по официальному курсу ЦБ РФ на дату
         соответствующего платежа."

        Ответ:
        {
          "disbursement_currency": "EUR",
          "repayment_currency": "RUB",
          "fx_risk_bearer": "borrower",
          "fx_clause_status": "present",
          "conversion_mechanism_status": "present",
          "currency_summary": "EUR предоставление, RUB возврат по курсу ЦБ РФ на дату платежа, риск на Заёмщике",
          "fx_risk_display": "Валютный риск на Заёмщике (несовпадение валют)",
          "fx_clause_display": "Официальный курс ЦБ РФ на дату платежа"
        }

        Пример 3 — рублёвый кредит без валютных условий:
        Фрагмент:
        "Кредит предоставляется и возвращается в рублях Российской
         Федерации."

        Ответ:
        {
          "disbursement_currency": "RUB",
          "repayment_currency": "RUB",
          "fx_risk_bearer": "not_defined",
          "fx_clause_status": "not_defined",
          "conversion_mechanism_status": "not_defined",
          "currency_summary": "Рублёвый, без валютного риска",
          "fx_risk_display": "Не применимо (валюты совпадают)",
          "fx_clause_display": "Не применимо"
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о валюте предоставления и валюте возврата.
        2. Определи, совпадают ли валюты.
        3. Найди прямую цитату о валютном риске.
        4. Найди курсовую оговорку.
        5. Найди порядок конвертации.
        6. Сформулируй user-facing display-поля кратко и по-русски.
        7. Если прямых цитат нет — верни fallback по правилам 4–6.

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь РОВНО одним JSON-объектом без какого-либо дополнительного текста до или после, со всеми 8 ключами:
        {
          "disbursement_currency": "<RUB / USD / EUR / other / not_defined>",
          "repayment_currency": "<RUB / USD / EUR / other / not_defined>",
          "fx_risk_bearer": "<borrower / lender / shared / not_defined>",
          "fx_clause_status": "<present / not_defined>",
          "conversion_mechanism_status": "<present / not_defined>",
          "currency_summary": "<краткое summary, 'Не применимо' или 'Не удалось определить'>",
          "fx_risk_display": "<текст, 'Не установлено', 'Не применимо' или 'Не удалось определить'>",
          "fx_clause_display": "<текст, 'Не установлена', 'Не применимо' или 'Не удалось определить'>"
        }
      context_k: 8
      temperature: 0.0
      max_tokens: 900

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "валюта кредита валюта предоставления валюта возврата валютная оговорка валютный риск курсовая разница курс ЦБ РФ на дату платежа конвертация мультивалютный транш"
      preferred_unit_types:
        - obligation
        - payment_term
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
      negative_keywords:
        - "означает"
        - "в целях настоящего"
        - "пск"
        - "комиссия"
      position_bias:
        preferred_range: [0.05, 0.35]
        boost: 0.16
        scope: segment
      context_k: 8
      max_chunks: 10
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
        - "invoice"
      preferred_clause_functions:
        - "obligations"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 35
      max_snippet_length: 500

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1300

      compact_output: false

      presence_signal:
        field: "currency_and_fx_clause_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста кредитного договора сведения
        о валюте предоставления и возврата, распределении валютного риска,
        курсовой оговорке и порядке конвертации. Не анализируй проценты,
        ПСК, обеспечение или ковенанты.
        Не оценивай риски. Анализируй только текст договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля (все ключи должны присутствовать в ответе):

        0. currency_and_fx_clause_check_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (disbursement_currency, repayment_currency, fx_risk_bearer,
              fx_clause_status, conversion_mechanism_status) ≠ "not_defined";
           - "missing" — если все пять содержательных полей = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - disbursement_currency = "not_defined";
           - repayment_currency = "not_defined";
           - fx_risk_bearer = "not_defined";
           - fx_clause_status = "not_defined";
           - conversion_mechanism_status = "not_defined";
           - currency_summary = "Не установлено";
           - fx_risk_display = "Не применимо";
           - fx_clause_display = "Не применимо";
           - не выполняй остальные шаги.

        1. disbursement_currency — валюта предоставления:
           - "RUB" / "USD" / "EUR" / "other" / "not_defined".

        2. repayment_currency — валюта возврата:
           - "RUB" / "USD" / "EUR" / "other" / "not_defined".

        3. fx_risk_bearer — кто несёт валютный риск:
           - "borrower" — заёмщик;
           - "lender" — банк;
           - "shared" — стороны делят риск;
           - "not_defined" — не установлено.

        4. fx_clause_status — курсовая оговорка:
           - "present" — курсовая оговорка прямо установлена
             (курс ЦБ РФ, фиксированный курс, курс банка и т.п.);
           - "not_defined" — курсовая оговорка не установлена.

        5. conversion_mechanism_status — порядок конвертации:
           - "present" — порядок конвертации прямо описан;
           - "not_defined" — порядок конвертации не описан.

        6. currency_summary — КРАТКОЕ summary.
           Примеры:
           - "Рублёвый, без валютного риска";
           - "USD предоставление и возврат, риск на Заёмщике";
           - "EUR предоставление, RUB возврат по курсу ЦБ на дату платежа";
           - "Мультивалютный (USD / EUR / RUB)";
           - "Не применимо" / "Не удалось определить".

        7. fx_risk_display — краткая формулировка валютного риска.
           Примеры:
           - "Валютный риск на Заёмщике";
           - "Валютный риск на Банке";
           - "Валютный риск распределён между сторонами";
           - "Не применимо (валюты совпадают, RUB/RUB)";
           - "Не установлено" / "Не удалось определить".

        8. fx_clause_display — краткая формулировка курсовой оговорки.
           Примеры:
           - "Официальный курс ЦБ РФ на дату платежа";
           - "Фиксированный курс X руб. за 1 USD";
           - "Не установлена" / "Не применимо" / "Не удалось определить".
        </task>

        <context_rules>
        - Перед остальными полями заполни currency_and_fx_clause_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все enum-поля = "not_defined", все display-поля = соответствующий fallback.
        - Используй только релевантные фрагменты контекста.
        - Не подставляй нормы закона, обычную практику или предположения вместо текста договора.
        - Не выдумывай курсы, валюты и механизмы конвертации, которых нет в тексте.
        - Если валюты предоставления и возврата совпадают и обе RUB —
          fx_risk_display = "Не применимо (валюты совпадают)".
        - Красные флаги: валютный риск полностью на заёмщике без ограничений;
          отсутствие курсовой оговорки при несовпадении валют. Отражай в display.
        - Если в разных фрагментах противоречие: enum → "not_defined", display → "Не удалось определить".
        - Не используй null, None, пустые строки или "-".
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни валюты, ни курсовой оговорки, ни валютного риска.
           → presence = "missing";
             все enum-поля = "not_defined";
             currency_summary = "Не установлено";
             fx_risk_display = fx_clause_display = "Не применимо".

        2. Рублёвый кредит без валютных условий.
           "Кредит предоставляется и возвращается в рублях РФ."
           → presence = "present";
             disbursement_currency = "RUB";
             repayment_currency = "RUB";
             fx_risk_bearer = "not_defined";
             fx_clause_status = "not_defined";
             currency_summary = "Рублёвый, без валютного риска";
             fx_risk_display = "Не применимо (валюты совпадают)";
             fx_clause_display = "Не применимо".

        3. Противоречие между фрагментами.
           В одной части — возврат в USD, в другой — в RUB.
           → presence = "unclear";
             repayment_currency = "not_defined";
             currency_summary = "Не удалось определить".

        4. Валютная оговорка с конвертацией.
           "Кредит в EUR, возврат в RUB по курсу ЦБ на дату платежа."
           → presence = "present";
             disbursement_currency = "EUR";
             repayment_currency = "RUB";
             fx_clause_status = "present";
             conversion_mechanism_status = "present";
             fx_clause_display = "Официальный курс ЦБ РФ на дату платежа".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для currency_and_fx_clause_check_presence используй только: "present", "missing", "unclear".
        - Для disbursement_currency и repayment_currency используй только: "RUB", "USD", "EUR", "other", "not_defined".
        - Для fx_risk_bearer используй только: "borrower", "lender", "shared", "not_defined".
        - Для fx_clause_status и conversion_mechanism_status используй только: "present", "not_defined".
        - Fallback при отсутствии данных:
          * currency_summary → "Не установлено";
          * fx_risk_display → "Не применимо";
          * fx_clause_display → "Не применимо".
        - Fallback при противоречии или неоднозначности:
          * все display-поля → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "currency_and_fx_clause_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования по валютной оговорке и валютному риску. Внутреннее агрегатное signal-поле."
          required: true

        - name: "disbursement_currency"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["RUB", "USD", "EUR", "other", "not_defined"]
          display_in_grid: false
          description: "Валюта предоставления кредита. Внутреннее enum-поле."
          required: true

        - name: "repayment_currency"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["RUB", "USD", "EUR", "other", "not_defined"]
          display_in_grid: false
          description: "Валюта возврата кредита. Внутреннее enum-поле."
          required: true

        - name: "fx_risk_bearer"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["borrower", "lender", "shared", "not_defined"]
          display_in_grid: false
          description: "Кто несёт валютный риск: borrower / lender / shared. Внутреннее enum-поле."
          required: true

        - name: "fx_clause_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["present", "not_defined"]
          display_in_grid: false
          description: "Наличие курсовой оговорки. Внутреннее enum-поле."
          required: true

        - name: "conversion_mechanism_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["present", "not_defined"]
          display_in_grid: false
          description: "Наличие порядка конвертации. Внутреннее enum-поле."
          required: true

        - name: "currency_summary"
          type: "string"
          presentation: "fact"
          label: "Валюта и валютный риск"
          display_in_grid: true
          display_priority: 1
          description: >
            Краткое summary валютных условий.
            Fallback: "Не применимо" / "Не удалось определить".
          required: true

        - name: "fx_risk_display"
          type: "string"
          presentation: "fact"
          label: "Валютный риск"
          display_in_grid: true
          display_priority: 2
          description: >
            Понятная формулировка распределения валютного риска.
            Fallback: "Не установлено" / "Не применимо" / "Не удалось определить".
          required: true

        - name: "fx_clause_display"
          type: "string"
          presentation: "fact"
          label: "Курсовая оговорка"
          display_in_grid: true
          display_priority: 3
          description: >
            Понятная формулировка курсовой оговорки.
            Fallback: "Не установлена" / "Не применимо" / "Не удалось определить".
          required: true

      store_payload: true

  - id: tax_gross_up_check
    name: "Налоговая оговорка: gross-up, withholding tax, НДС на комиссии"
    description: >
      Проверяет наличие и параметры налоговой оговорки: gross-up
      (компенсация налога заёмщиком), withholding tax на проценты, НДС
      на комиссии, применение соглашений об избежании двойного
      налогообложения.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "налоговая оговорка"
        - "gross-up"
        - "gross up"
        - "налог у источника"
        - "withholding tax"
        - "налог на проценты"
        - "компенсация налога"
        - "НДС на комиссии"
        - "соглашение об избежании двойного налогообложения"
        - "tax indemnity"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)gross[\\s-]?up"
        - "(?i)налог.{0,20}(у\\s+источника|на\\s+процент)"
        - "(?i)withholding\\s+tax"
        - "(?i)компенсац.{0,20}налог"
        - "(?i)НДС.{0,20}(комисси|сбор|плат)"
        - "(?i)(соглашени|избежани).{0,20}двойн"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется кредитный договор.
        Проверяется только один вопрос: налоговая оговорка — gross-up,
        withholding tax, НДС на комиссии, применение соглашений
        об избежании двойного налогообложения.

        Нормативный ориентир:
        - ст. 309, 310 НК РФ — налог у источника при выплате дохода
          иностранной организации
        - ст. 7 НК РФ — приоритет международных договоров (СИДН)
        - ст. 146, 149 НК РФ — НДС, освобождения
        - Соглашения об избежании двойного налогообложения (СИДН)
          между РФ и юрисдикциями кредитора

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора,
          а чего прямо нет.
        - Не оценивай серьёзность риска.
        - Gross-up — оговорка о том, что если банк получает доход,
          облагаемый налогом у источника, заёмщик компенсирует банку
          сумму налога. Типична для кредитов с иностранным кредитором.
        - Withholding tax — налог, удерживаемый заёмщиком при выплате
          процентов иностранному кредитору (по ст. 310 НК РФ).
        - НДС на комиссии — комиссии банка могут облагаться НДС.
        - Красные флаги:
            * широкий gross-up без ограничений;
            * отсутствие оговорки о СИДН (при наличии иностранного кредитора);
            * отсутствие указания на НДС на комиссии.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Есть ли оговорка о gross-up.
        2. Есть ли оговорка о withholding tax.
        3. Есть ли указание на НДС на комиссии.
        4. Указано ли применение СИДН.
        5. Сформулируй понятные для юриста текстовые расшифровки:
           - tax_summary,
           - gross_up_display,
           - withholding_tax_display,
           - vat_on_fees_display.

        [ПРАВИЛА]
        1. Используй только текст документа. Не подставляй нормы закона.
        2. Если параметр прямо указан — возвращай дословно или делай
           точную выжимку.
        3. `tax_summary` — КРАТКОЕ summary, например:
           - "Gross-up предусмотрен, withholding tax применяется, СИДН
             не упомянуто";
           - "Налоговая оговорка не установлена".
        4. Если параметр прямо не указан:
           - для сигнальных enum-полей — "not_defined";
           - для текстовых user-facing полей — "Не установлено".
        5. Если тема по существу не применима — display-поле =
           "Не применимо", сигнальное = "not_defined".
        6. Если текст есть, но надёжный вывод сделать нельзя — display-поле =
           "Не удалось определить", сигнальное = "not_defined".
        7. Никогда не используй null, None, пустые строки или "-".
        8. Не выдумывай налоговые оговорки, которых нет в тексте.
        9. При конфликтующих фрагментах — приоритет более позднему или
           более специальному положению.
        10. В evidence включай только текст договора.
        11. Верни РОВНО один JSON-объект со всеми ключами из [ФОРМАТ ОТВЕТА] без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [РОССИЙСКАЯ ПРАКТИКА — ПОДСКАЗКИ]
        - Типичная формулировка gross-up:
            * «Все суммы выплачиваются без удержаний. Если Заёмщик обязан
              удержать налог, сумма платежа увеличивается».
        - Ограниченный gross-up:
            * «Gross-up не применяется при изменении юрисдикции Кредитора».
        - Withholding tax:
            * «Заёмщик удерживает налог по ставке НК РФ, если иное не
              предусмотрено СИДН».
        - НДС на комиссии: банковские операции освобождены по ст. 149 НК РФ,
          но не все комиссии.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — gross-up без ограничений, СИДН упомянуто:
        Фрагмент:
        "Все платежи осуществляются без удержаний. Если Заёмщик обязан
         удержать налог, сумма платежа увеличивается. Если Кредитор —
         резидент страны с СИДН, применяется ставка по соглашению."

        Ответ:
        {
          "gross_up_status": "present",
          "withholding_tax_status": "present",
          "vat_on_fees_status": "not_defined",
          "tax_treaty_status": "present",
          "tax_summary": "Gross-up без ограничений, withholding tax, СИДН применяется",
          "gross_up_display": "Полный gross-up (без ограничений)",
          "withholding_tax_display": "Налог у источника удерживается, СИДН применяется",
          "vat_on_fees_display": "Не установлено"
        }

        Пример 2 — налоговая оговорка не установлена:
        Фрагмент:
        "Иные условия определяются в соответствии с законодательством РФ."

        Ответ:
        {
          "gross_up_status": "not_defined",
          "withholding_tax_status": "not_defined",
          "vat_on_fees_status": "not_defined",
          "tax_treaty_status": "not_defined",
          "tax_summary": "Налоговая оговорка не установлена",
          "gross_up_display": "Не установлено",
          "withholding_tax_display": "Не установлено",
          "vat_on_fees_display": "Не установлено"
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о gross-up.
        2. Найди оговорку о withholding tax.
        3. Найди указание на НДС на комиссии.
        4. Найди упоминание СИДН.
        5. Сформулируй display-поля кратко и по-русски.
        6. Если прямых цитат нет — верни fallback.

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь РОВНО одним JSON-объектом без какого-либо дополнительного текста до или после, со всеми 8 ключами:
        {
          "gross_up_status": "<present / not_defined>",
          "withholding_tax_status": "<present / not_defined>",
          "vat_on_fees_status": "<present / not_defined>",
          "tax_treaty_status": "<present / not_defined>",
          "tax_summary": "<краткое summary, 'Не применимо' или 'Не удалось определить'>",
          "gross_up_display": "<текст, 'Не установлено', 'Не применимо' или 'Не удалось определить'>",
          "withholding_tax_display": "<текст, 'Не установлено', 'Не применимо' или 'Не удалось определить'>",
          "vat_on_fees_display": "<текст, 'Не установлено', 'Не применимо' или 'Не удалось определить'>"
        }
      context_k: 8
      temperature: 0.0
      max_tokens: 900

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "налоговая оговорка gross-up gross up налог у источника withholding tax налог на проценты компенсация налога НДС на комиссии соглашение об избежании двойного налогообложения СИДН tax indemnity"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - procedures
      negative_keywords:
        - "означает"
        - "в целях настоящего"
        - "пск"
        - "обеспечение"
      position_bias:
        preferred_range: [0.40, 0.80]
        boost: 0.14
        scope: segment
      context_k: 8
      max_chunks: 10
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
        - "invoice"
      preferred_clause_functions:
        - "obligations"
        - "procedures"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 35
      max_snippet_length: 550

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1300

      compact_output: false

      presence_signal:
        field: "tax_gross_up_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста кредитного договора сведения
        о налоговой оговорке: gross-up, withholding tax, НДС на комиссии,
        применение СИДН. Не анализируй проценты, ПСК, обеспечение или
        ковенанты. Не оценивай риски. Анализируй только текст договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля (все ключи должны присутствовать в ответе):

        0. tax_gross_up_check_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (gross_up_status, withholding_tax_status, vat_on_fees_status,
              tax_treaty_status) ≠ "not_defined";
           - "missing" — если все четыре содержательных поля = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - gross_up_status = "not_defined";
           - withholding_tax_status = "not_defined";
           - vat_on_fees_status = "not_defined";
           - tax_treaty_status = "not_defined";
           - tax_summary = "Не установлена";
           - gross_up_display = "Не установлено";
           - withholding_tax_display = "Не установлено";
           - vat_on_fees_display = "Не установлено";
           - не выполняй остальные шаги.

        1. gross_up_status — оговорка о gross-up:
           - "present" — gross-up прямо установлен (полный или ограниченный);
           - "not_defined" — gross-up прямо не упомянут.

        2. withholding_tax_status — оговорка о withholding tax:
           - "present" — withholding tax прямо упомянут;
           - "not_defined" — не упомянут.

        3. vat_on_fees_status — НДС на комиссии:
           - "present" — НДС на комиссии прямо упомянут;
           - "not_defined" — не упомянут.

        4. tax_treaty_status — применение СИДН:
           - "present" — СИДН прямо упомянуто;
           - "not_defined" — не упомянуто.

        5. tax_summary — КРАТКОЕ summary.
           Примеры:
           - "Gross-up без ограничений, withholding tax, СИДН применяется";
           - "Gross-up с ограничениями (защита Заёмщика)";
           - "Налоговая оговорка не установлена";
           - "Не применимо" / "Не удалось определить".

        6. gross_up_display — краткая формулировка.
           - "Полный gross-up (без ограничений)";
           - "Ограниченный gross-up (защита Заёмщика)";
           - "Не установлено" / "Не применимо" / "Не удалось определить".

        7. withholding_tax_display — краткая формулировка.
           - "Налог у источника удерживается, СИДН применяется";
           - "Налог у источника удерживается";
           - "Не установлено" / "Не применимо" / "Не удалось определить".

        8. vat_on_fees_display — краткая формулировка.
           - "Комиссии облагаются НДС";
           - "Комиссии освобождены от НДС";
           - "Не установлено" / "Не применимо" / "Не удалось определить".
        </task>

        <context_rules>
        - Перед остальными полями заполни tax_gross_up_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все enum-поля = "not_defined", все display-поля = соответствующий fallback.
        - Используй только релевантные фрагменты контекста.
        - Не подставляй нормы закона, обычную практику или предположения вместо текста договора.
        - Различай полный и ограниченный gross-up. Отражай в display.
        - Красные флаги: широкий gross-up без ограничений; отсутствие СИДН при иностранном кредиторе. Отражай в display.
        - Не выдумывай налоговые оговорки, которых нет в тексте.
        - Если в разных фрагментах противоречие: enum → "not_defined", display → "Не удалось определить".
        - Не используй null, None, пустые строки или "-".
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни gross-up, ни withholding tax, ни НДС, ни СИДН.
           → presence = "missing";
             все enum-поля = "not_defined";
             tax_summary = "Не установлена";
             все display-поля = "Не установлено".

        2. Только gross-up, без СИДН и НДС.
           "Все платежи без удержаний. При удержании налога — gross-up."
           → presence = "present";
             gross_up_status = "present";
             withholding_tax_status = "present";
             vat_on_fees_status = "not_defined";
             tax_treaty_status = "not_defined".

        3. Противоречие между фрагментами.
           В одной части — gross-up, в другой — «платежи с удержанием налога».
           → presence = "unclear";
             gross_up_status = "not_defined";
             gross_up_display = "Не удалось определить".

        4. Рублёвый кредит от российского банка (тема неактуальна).
           Нет ни иностранного кредитора, ни валютных условий.
           → presence = "missing";
             все enum-поля = "not_defined";
             все display-поля = "Не применимо".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для tax_gross_up_check_presence используй только: "present", "missing", "unclear".
        - Для gross_up_status, withholding_tax_status, vat_on_fees_status, tax_treaty_status используй только: "present", "not_defined".
        - Fallback при отсутствии данных:
          * tax_summary → "Не установлена";
          * gross_up_display → "Не установлено";
          * withholding_tax_display → "Не установлено";
          * vat_on_fees_display → "Не установлено".
        - Fallback при противоречии или неоднозначности:
          * все display-поля → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "tax_gross_up_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования по налоговой оговорке. Внутреннее агрегатное signal-поле."
          required: true

        - name: "gross_up_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["present", "not_defined"]
          display_in_grid: false
          description: "Наличие оговорки о gross-up. Внутреннее enum-поле."
          required: true

        - name: "withholding_tax_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["present", "not_defined"]
          display_in_grid: false
          description: "Наличие оговорки о withholding tax. Внутреннее enum-поле."
          required: true

        - name: "vat_on_fees_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["present", "not_defined"]
          display_in_grid: false
          description: "Наличие указания на НДС на комиссии. Внутреннее enum-поле."
          required: true

        - name: "tax_treaty_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["present", "not_defined"]
          display_in_grid: false
          description: "Упоминание СИДН. Внутреннее enum-поле."
          required: true

        - name: "tax_summary"
          type: "string"
          presentation: "fact"
          label: "Налоговая оговорка"
          display_in_grid: true
          display_priority: 1
          description: >
            Краткое summary налоговых условий.
            Fallback: "Не установлена" / "Не применимо" / "Не удалось определить".
          required: true

        - name: "gross_up_display"
          type: "string"
          presentation: "fact"
          label: "Gross-up"
          display_in_grid: true
          display_priority: 2
          description: >
            Понятная формулировка gross-up.
            Fallback: "Не установлено" / "Не применимо" / "Не удалось определить".
          required: true

        - name: "withholding_tax_display"
          type: "string"
          presentation: "fact"
          label: "Withholding tax"
          display_in_grid: true
          display_priority: 3
          description: >
            Понятная формулировка withholding tax.
            Fallback: "Не установлено" / "Не применимо" / "Не удалось определить".
          required: true

        - name: "vat_on_fees_display"
          type: "string"
          presentation: "fact"
          label: "НДС на комиссии"
          display_in_grid: true
          display_priority: 4
          description: >
            Понятная формулировка НДС на комиссии.
            Fallback: "Не установлено" / "Не применимо" / "Не удалось определить".
          required: true

      store_payload: true

  - id: default_interest_and_penalties_check
    name: "Неустойка и повышенные проценты при просрочке"
    description: >
      Проверяет размер неустойки за просрочку платежей, базу её расчёта,
      неустойку на просроченные проценты, повышенные проценты при нарушении
      условий, а также ограничения неустойки.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "неустойка"
        - "пени"
        - "штраф"
        - "просроченная задолженность"
        - "повышенные проценты"
        - "повышенная ставка"
        - "пеня за просрочку"
        - "за каждый день просрочки"
        - "за каждый день нарушения"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)(неустойк|пен[ия]|штраф)"
        - "(?i)за\\s+каждый\\s+день\\s+просрочк"
        - "(?i)повышенн(ая|ые|ых)\\s+(ставк|процент)"
        - "(?i)\\d+[.,]?\\d*\\s*%.{0,30}(день|годов)"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется кредитный договор.
        Проверяется только один вопрос: неустойка за просрочку платежей,
        база её расчёта, неустойка на просроченные проценты, повышенные
        проценты при нарушении условий и ограничения неустойки.

        Нормативный ориентир:
        - ст. 330, 331, 333 ГК РФ — неустойка, её уменьшение
        - ст. 395 ГК РФ — проценты за пользование чужими денежными
          средствами
        - ст. 6.1 ФЗ № 353-ФЗ — ограничения неустойки для потребительских
          кредитов

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора,
          а чего прямо нет.
        - Не оценивай серьёзность риска.
        - Различай:
            * неустойка за просрочку платежа;
            * повышенные проценты;
            * неустойка на просроченные проценты (сложные пени).
        - Различай базу начисления неустойки:
            * на просроченную сумму основного долга;
            * на просроченные проценты;
            * на всю просроченную задолженность.
        - Красные флаги:
            * неустойка на просроченные проценты (сложные пени);
            * очень высокая ставка неустойки (выше 0,5% в день);
            * отсутствие ограничений неустойки в потребительском кредите.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Установлена ли неустойка за просрочку платежа.
        2. Размер неустойки.
        3. База начисления неустойки.
        4. Начисляется ли неустойка на просроченные проценты.
        5. Установлены ли повышенные проценты при нарушении.
        6. Есть ли ограничения неустойки.
        7. Сформулируй понятные для юриста текстовые расшифровки.

        [ПРАВИЛА]
        1. Используй только текст документа. Не подставляй нормы закона.
        2. Если параметр прямо указан — возвращай дословно или делай
           точную выжимку.
        3. `penalty_summary` — КРАТКОЕ summary.
        4. Если параметр прямо не указан:
           - для сигнальных enum-полей — "not_defined";
           - для текстовых user-facing полей — "Не установлен" / "Не установлено".
        5. Если тема по существу не применима — display-поле =
           "Не применимо", сигнальное = "not_defined".
        6. Если текст есть, но надёжный вывод сделать нельзя — display-поле =
           "Не удалось определить", сигнальное = "not_defined".
        7. Никогда не используй null, None, пустые строки или "-".
        8. Не выдумывай ставки неустойки, которых нет в тексте.
        9. При конфликтующих фрагментах — приоритет более позднему.
        10. В evidence включай только текст договора.
        11. Верни РОВНО один JSON-объект со всеми 9 ключами без какого-либо
            дополнительного текста до или после. Начни ответ сразу
            с открывающей фигурной скобки и закончи закрывающей. НЕ пиши
            Markdown, списки, код-фенсы. Ответ должен быть валидным JSON,
            пригодным для парсинга через json.loads без предварительной
            обработки.

        [РОССИЙСКАЯ ПРАКТИКА — ПОДСКАЗКИ]
        - Типичные формулировки:
            * «0,1% от суммы просроченной задолженности за каждый день» →
              full_overdue;
            * «0,2% на основной долг и 0,1% на проценты» → сложные пени;
            * «Ставка увеличивается на 2 п.п. при нарушении» → margin increase.
        - Ограничения: «не более 10% от просроченной суммы» → cap.
        - Для потребительских кредитов по 353-ФЗ: 20% годовых или 0,1% в день.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — простая неустойка 0,1% в день:
        Фрагмент:
        "За нарушение сроков Заёмщик уплачивает неустойку 0,1% от суммы
         просроченной задолженности за каждый день просрочки."

        Ответ:
        {
          "penalty_present_status": "present",
          "penalty_basis": "full_overdue",
          "penalty_on_overdue_interest_status": "present",
          "increased_rate_penalty_status": "not_defined",
          "penalty_cap_status": "not_defined",
          "penalty_summary": "0,1% в день на всю просроченную задолженность",
          "penalty_rate_display": "0,1% в день",
          "penalty_basis_display": "На всю просроченную задолженность",
          "increased_rate_display": "Не установлены"
        }

        Пример 2 — неустойка не установлена:
        Фрагмент:
        "Иные условия ответственности — по законодательству РФ."

        Ответ:
        {
          "penalty_present_status": "not_defined",
          "penalty_basis": "not_defined",
          "penalty_on_overdue_interest_status": "not_defined",
          "increased_rate_penalty_status": "not_defined",
          "penalty_cap_status": "not_defined",
          "penalty_summary": "Не установлена",
          "penalty_rate_display": "Не установлен",
          "penalty_basis_display": "Не установлена",
          "increased_rate_display": "Не установлены"
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о неустойке.
        2. Определи базу начисления.
        3. Проверь сложные пени.
        4. Найди повышенные проценты.
        5. Найди cap.
        6. Сформулируй display-поля.
        7. Если нет цитат — fallback.

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь РОВНО одним JSON-объектом без какого-либо дополнительного
        текста до или после, со всеми 9 ключами:
        {
          "penalty_present_status": "<present / not_defined>",
          "penalty_basis": "<principal_only / interest_only / full_overdue / not_defined>",
          "penalty_on_overdue_interest_status": "<present / absent / not_defined>",
          "increased_rate_penalty_status": "<present / not_defined>",
          "penalty_cap_status": "<present / not_defined>",
          "penalty_summary": "<краткое summary, 'Не установлена', 'Не применимо' или 'Не удалось определить'>",
          "penalty_rate_display": "<текст, 'Не установлен', 'Не применимо' или 'Не удалось определить'>",
          "penalty_basis_display": "<текст, 'Не установлена', 'Не применимо' или 'Не удалось определить'>",
          "increased_rate_display": "<текст, 'Не установлены', 'Не применимо' или 'Не удалось определить'>"
        }
      context_k: 8
      temperature: 0.0
      max_tokens: 900

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "неустойка пени штраф просроченная задолженность просроченный основной долг просроченные проценты за каждый день просрочки повышенные проценты повышенная ставка при нарушении ограничение неустойки максимальный размер неустойки"
      preferred_unit_types:
        - obligation
        - liability_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - remedies
      negative_keywords:
        - "означает"
        - "в целях настоящего"
        - "предмет договора"
        - "обеспечение"
        - "ковенант"
      position_bias:
        preferred_range: [0.40, 0.85]
        boost: 0.14
        scope: segment
      context_k: 8
      max_chunks: 10
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
        - "invoice"
      preferred_clause_functions:
        - "obligations"
        - "remedies"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 35
      max_snippet_length: 550

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1400

      compact_output: false

      presence_signal:
        field: "default_interest_and_penalties_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста кредитного договора сведения
        о неустойке за просрочку платежей: наличие и размер, базу начисления,
        начисление на просроченные проценты (сложные пени), повышенные
        проценты при нарушении, ограничения неустойки. Не анализируй
        обеспечение, ковенанты, проценты как таковые или ПСК.
        Не оценивай риски. Анализируй только текст договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля (все ключи должны присутствовать в ответе):

        0. default_interest_and_penalties_check_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (penalty_present_status, penalty_basis,
              penalty_on_overdue_interest_status,
              increased_rate_penalty_status, penalty_cap_status)
             ≠ "not_defined";
           - "missing" — если все пять содержательных полей = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Важно: penalty_on_overdue_interest_status = "absent"
           (прямо исключено) считается ≠ "not_defined" и даёт
           presence = "present".

           Если presence = "missing":
           - penalty_present_status = "not_defined";
           - penalty_basis = "not_defined";
           - penalty_on_overdue_interest_status = "not_defined";
           - increased_rate_penalty_status = "not_defined";
           - penalty_cap_status = "not_defined";
           - penalty_summary = "Не установлена";
           - penalty_rate_display = "Не установлен";
           - penalty_basis_display = "Не установлена";
           - increased_rate_display = "Не установлены";
           - не выполняй остальные шаги.

        1. penalty_present_status — наличие неустойки:
           - "present" — неустойка за просрочку прямо установлена;
           - "not_defined" — неустойка прямо не установлена.

        2. penalty_basis — база начисления:
           - "principal_only" — только на просроченный основной долг;
           - "interest_only" — только на просроченные проценты;
           - "full_overdue" — на всю просроченную задолженность
             (тело + проценты);
           - "not_defined" — база не определена.

        3. penalty_on_overdue_interest_status — сложные пени:
           - "present" — неустойка начисляется на просроченные проценты;
           - "absent" — договор прямо исключает начисление на проценты;
           - "not_defined" — вопрос не урегулирован.

        4. increased_rate_penalty_status — повышенные проценты:
           - "present" — повышенные проценты при нарушении прямо
             установлены (margin increase);
           - "not_defined" — не установлены.

        5. penalty_cap_status — ограничение неустойки:
           - "present" — ограничение общего размера неустойки прямо
             установлено (cap);
           - "not_defined" — ограничение не установлено.

        6. penalty_summary — КРАТКОЕ summary.
           Примеры:
           - "0,1% в день на всю просроченную задолженность";
           - "0,2% в день только на основной долг";
           - "0,1% в день, cap 10%; повышенные проценты +2 п.п.";
           - "Не установлена" / "Не применимо" / "Не удалось определить".

        7. penalty_rate_display — краткая формулировка ставки.
           - "0,1% в день";
           - "0,2% в день (не более 10% от просроченной суммы)";
           - "Не установлен" / "Не применимо" / "Не удалось определить".

        8. penalty_basis_display — краткая формулировка базы.
           - "На всю просроченную задолженность (основной долг + проценты)";
           - "Только на просроченный основной долг";
           - "Не установлена" / "Не применимо" / "Не удалось определить".

        9. increased_rate_display — краткая формулировка.
           - "Повышение ставки на 2 п.п. при нарушении ковенантов";
           - "Не установлены" / "Не применимо" / "Не удалось определить".
        </task>

        <context_rules>
        - Перед остальными полями заполни default_interest_and_penalties_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все enum-поля = "not_defined", все display-поля = соответствующий fallback.
        - Используй только релевантные фрагменты контекста.
        - Не подставляй нормы закона, обычную практику или предположения вместо текста договора.
        - Различай базу: principal_only / interest_only / full_overdue.
        - Красные флаги: сложные пени (present); ставка > 0,5% в день;
          отсутствие cap в потребительском кредите. Отражай в summary.
        - Не выдумывай ставки неустойки, которых нет в тексте.
        - Если в разных фрагментах противоречие: enum → "not_defined", display → "Не удалось определить".
        - Не используй null, None, пустые строки или "-".
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни неустойки, ни повышенных процентов, ни cap.
           → presence = "missing";
             все enum-поля = "not_defined";
             penalty_summary = "Не установлена";
             все display-поля = "Не установлен" / "Не установлена" / "Не установлены".

        2. Неустойка есть, но сложные пени прямо исключены.
           "Неустойка 0,1% на основной долг. На проценты не начисляется."
           → presence = "present";
             penalty_present_status = "present";
             penalty_basis = "principal_only";
             penalty_on_overdue_interest_status = "absent";
             penalty_basis_display = "Только на просроченный основной долг".

        3. Противоречие между фрагментами.
           В одной части — 0,1% в день, в другой — 0,3% в день.
           → presence = "unclear";
             penalty_present_status = "not_defined";
             penalty_rate_display = "Не удалось определить".

        4. Повышенные проценты + cap.
           "Ставка +2 п.п. при нарушении. Неустойка 0,1%, cap 10%."
           → presence = "present";
             increased_rate_penalty_status = "present";
             penalty_cap_status = "present";
             penalty_summary = "0,1% в день, cap 10%; повышенные проценты +2 п.п.".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для default_interest_and_penalties_check_presence используй только: "present", "missing", "unclear".
        - Для penalty_present_status используй только: "present", "not_defined".
        - Для penalty_basis используй только: "principal_only", "interest_only", "full_overdue", "not_defined".
        - Для penalty_on_overdue_interest_status используй только: "present", "absent", "not_defined".
        - Для increased_rate_penalty_status и penalty_cap_status используй только: "present", "not_defined".
        - Fallback при отсутствии данных:
          * penalty_summary → "Не установлена";
          * penalty_rate_display → "Не установлен";
          * penalty_basis_display → "Не установлена";
          * increased_rate_display → "Не установлены".
        - Fallback при противоречии или неоднозначности:
          * все display-поля → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "default_interest_and_penalties_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования по неустойке и повышенным процентам. Внутреннее агрегатное signal-поле."
          required: true

        - name: "penalty_present_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["present", "not_defined"]
          display_in_grid: false
          description: "Наличие неустойки за просрочку. Внутреннее enum-поле."
          required: true

        - name: "penalty_basis"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["principal_only", "interest_only", "full_overdue", "not_defined"]
          display_in_grid: false
          description: "База начисления неустойки. Внутреннее enum-поле."
          required: true

        - name: "penalty_on_overdue_interest_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["present", "absent", "not_defined"]
          display_in_grid: false
          description: >
            Начисляется ли неустойка на просроченные проценты (сложные пени).
            absent — прямо исключено. Внутреннее enum-поле.
          required: true

        - name: "increased_rate_penalty_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["present", "not_defined"]
          display_in_grid: false
          description: "Повышенные проценты при нарушении (margin increase). Внутреннее enum-поле."
          required: true

        - name: "penalty_cap_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["present", "not_defined"]
          display_in_grid: false
          description: "Ограничение общего размера неустойки (cap). Внутреннее enum-поле."
          required: true

        - name: "penalty_summary"
          type: "string"
          presentation: "fact"
          label: "Неустойка за просрочку"
          display_in_grid: true
          display_priority: 1
          description: >
            Краткое summary неустойки.
            Fallback: "Не установлена" / "Не применимо" / "Не удалось определить".
          required: true

        - name: "penalty_rate_display"
          type: "string"
          presentation: "fact"
          label: "Размер неустойки"
          display_in_grid: true
          display_priority: 2
          description: >
            Ставка неустойки.
            Fallback: "Не установлен" / "Не применимо" / "Не удалось определить".
          required: true

        - name: "penalty_basis_display"
          type: "string"
          presentation: "fact"
          label: "База начисления неустойки"
          display_in_grid: true
          display_priority: 3
          description: >
            База начисления неустойки.
            Fallback: "Не установлена" / "Не применимо" / "Не удалось определить".
          required: true

        - name: "increased_rate_display"
          type: "string"
          presentation: "fact"
          label: "Повышенные проценты"
          display_in_grid: true
          display_priority: 4
          description: >
            Повышенные проценты при нарушении.
            Fallback: "Не установлены" / "Не применимо" / "Не удалось определить".
          required: true

      store_payload: true

  - id: tranche_and_drawdown_mechanics_check
    name: "Механика траншей, выборки и лимитов"
    description: >
      Проверяет порядок запроса транша, сроки рассмотрения банком, лимиты
      выдачи и задолженности, период доступности кредитной линии, условия
      аннулирования неиспользованного лимита и commitment fee.
    triggers:
      any:
        - credit_line
        - overdraft
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "транш"
        - "выборка"
        - "кредитная линия"
        - "лимит выдачи"
        - "лимит задолженности"
        - "период доступности"
        - "срок предоставления транша"
        - "запрос на предоставление"
        - "commitment fee"
        - "плата за неиспользованный лимит"
        - "аннулирование лимита"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)транш"
        - "(?i)выборк"
        - "(?i)(лимит\\s+(выдачи|задолженност))"
        - "(?i)период\\s+доступност"
        - "(?i)(commitment\\s+fee|плата\\s+за\\s+неиспользован)"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется кредитный договор (кредитная линия / овердрафт).
        Проверяется только один вопрос: механика траншей, выборки
        и лимитов.

        Нормативный ориентир:
        - ст. 819 ГК РФ — кредитный договор
        - ст. 821 ГК РФ — отказ от предоставления кредита
        - В российском праве механика кредитных линий — договорный институт

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора,
          а чего прямо нет.
        - Не оценивай серьёзность риска.
        - Различай:
            * лимит выдачи — максимальная сумма за весь срок;
            * лимит задолженности — максимальная сумма единовременной
              задолженности;
            * лимит единовременной выдачи — максимальный размер одного
              транша.
        - Различай:
            * период доступности — до какой даты можно выбирать транши;
            * дата погашения — конечная дата возврата.
        - Commitment fee — плата за неиспользованный лимит.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Есть ли механика траншей и выборки.
        2. Как оформляется запрос на транш.
        3. Какие установлены лимиты.
        4. Какой установлен период доступности.
        5. Есть ли commitment fee.
        6. Есть ли условия аннулирования неиспользованного лимита.

        [ПРАВИЛА]
        1. Используй только текст документа. Не подставляй нормы закона.
        2. Если параметр прямо указан — возвращай дословно.
        3. Если параметр не указан — enum → "not_defined", display →
           "Не установлен", массив → [].
