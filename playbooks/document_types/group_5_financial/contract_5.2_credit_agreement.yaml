        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о механике траншей.
        2. Определи тип лимита: лимит выдачи / лимит задолженности /
           лимит единовременной выдачи.
        3. Найди порядок оформления запроса на транш.
        4. Найди период доступности.
        5. Найди упоминание commitment fee.
        6. Найди условия аннулирования неиспользованного лимита.
        7. Сформулируй user-facing display-поля кратко и по-русски.
        8. Если прямых цитат нет — верни fallback по правилам 4–6.

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь РОВНО одним JSON-объектом без какого-либо дополнительного
        текста до или после, со всеми 11 ключами:
        {
          "tranche_mechanics_status": "<present / not_defined>",
          "drawdown_request_status": "<present / absent / not_defined>",
          "limit_type": "<disbursement_limit / outstanding_limit / per_tranche_limit / mixed / not_defined>",
          "availability_period_status": "<present / not_defined>",
          "commitment_fee_status": "<present / absent / not_defined>",
          "limit_annulment_status": "<present / not_defined>",
