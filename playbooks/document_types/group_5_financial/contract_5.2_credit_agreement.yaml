# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 7: DD_REQUEST_TEMPLATES
#  Читается: DDRequestTemplateLoader
#  Ключи = check_id из checks_v8 и doc_type_checks выше.
#  DDRequestTemplateLoader.render() матчит по exact или prefix.
# ════════════════════════════════════════════════════════════════════════════

dd_request_templates:

  credit_subject_extraction:
    text: >
      Просим предоставить по {doc_names}: полные параметры кредита —
      кредитор, заемщик, сумма и валюта кредита, срок, процентная ставка,
      ПСК, структура погашения, наличие обеспечения, а также вид кредитного продукта
      (потребительский, ипотечный, кредитная линия, овердрафт и т.п.).
    addressee: "Банк / Юридический советник"

  lender_license_check:
    text: >
      Просим предоставить по {doc_names}: сведения о статусе кредитора,
      реквизиты лицензии Банка России, организационно-правовую форму и подтверждение,
      что кредитор вправе осуществлять банковские операции по предоставлению кредитов.
    addressee: "Кредитор"

  lender_identification_and_license:
    text: >
      Просим предоставить по {doc_names}: полное фирменное наименование кредитора,
      ОГРН, ИНН, реквизиты лицензии Банка России и ссылку на публичный реестр.
    addressee: "Кредитор"

  non_licensed_lender_red_flag:
    text: >
      В {doc_names} не выявлены достаточные признаки лицензии кредитора.
      Просим срочно предоставить реквизиты лицензии Банка России
      и правовое подтверждение допустимости заключения именно кредитного договора.
    addressee: "Кредитор / Юридический советник"

  written_form_required:
    text: >
      Просим подтвердить по {doc_names}, что кредитный договор оформлен в письменной форме
      с надлежащими реквизитами и подписями сторон, включая все приложения,
      являющиеся его неотъемлемой частью.
    addressee: "Обе стороны"

  credit_amount_required:
    text: >
      Просим уточнить по {doc_names}: размер кредита, валюту,
      а для кредитной линии — лимит кредитования и максимальный размер задолженности.
    addressee: "Кредитор"

  interest_psk_fees_check:
    text: >
      Просим предоставить по {doc_names}: процентную ставку, ПСК,
      полный перечень комиссий и иных платежей заемщика, а также пример расчета
      общей стоимости кредита и ежемесячного платежа.
    addressee: "Кредитор"

  interest_rate_required:
    text: >
      Просим уточнить в {doc_names}: процентную ставку, базу начисления процентов,
      периодичность уплаты процентов и порядок их изменения (если применимо).
    addressee: "Кредитор"

  interest_free_credit_red_flag:
    text: >
      В {doc_names} выявлен риск беспроцентной конструкции кредитного договора.
      Просим предоставить правовое пояснение и скорректировать договор,
      поскольку кредитный договор по своей природе является возмездным.
    addressee: "Юридический советник"

  psk_required_for_consumer_credit:
    text: >
      Для {doc_names} как потребительского кредита просим предоставить раскрытие ПСК
      в требуемой законом форме, а также расчет всех включаемых в ПСК платежей.
    addressee: "Кредитор"

  consumer_credit_without_psk:
    text: >
      В {doc_names} выявлен риск отсутствия ПСК при потребительском кредите.
      Просим срочно предоставить значение полной стоимости кредита
      и расчет согласно требованиям ФЗ-353 и актам Банка России.
    addressee: "Кредитор / Юридический советник"

  repayment_schedule_and_early_repayment_check:
    text: >
      Просим предоставить по {doc_names}: график платежей, структуру погашения
      (аннуитет / дифференцированная / иная), условия досрочного погашения,
      сроки уведомления и последствия частичного/полного досрочного возврата.
    addressee: "Кредитор"

  repayment_schedule_required:
    text: >
      Просим уточнить в {doc_names}: срок возврата кредита, даты платежей,
      график погашения и порядок изменения графика при досрочном погашении.
    addressee: "Кредитор"

  early_repayment_right:
    text: >
      Просим уточнить по {doc_names}: вправе ли заемщик осуществить полное
      или частичное досрочное погашение, в какой срок требуется уведомление,
      и взимаются ли какие-либо дополнительные комиссии/санкции.
    addressee: "Кредитор / Юридический советник"

  forced_services_and_insurance_check:
    text: >
      Просим предоставить по {doc_names}: перечень всех дополнительных услуг и страховых продуктов,
      указать, какие из них являются добровольными, как оформляется отказ заемщика,
      и подтвердить, что выдача кредита не поставлена в зависимость от приобретения таких услуг.
    addressee: "Кредитор"

  no_forced_services:
    text: >
      Просим включить/уточнить в {doc_names} оговорку о том, что дополнительные услуги
      и страховые продукты не являются обязательным условием выдачи кредита,
      если иное прямо не вытекает из закона и существа продукта.
    addressee: "Юридический советник"

  collateral_security:
    text: >
      Просим предоставить по {doc_names}: документы по обеспечению кредита —
      договор залога/ипотеки, поручительство, описание предмета обеспечения,
      оценку, порядок обращения взыскания и случаи утраты обеспечения.
    addressee: "Кредитор / Заемщик"

  acceleration_events_check:
    text: >
      Просим уточнить в {doc_names}: основания для досрочного истребования кредита,
      наличие срока на устранение нарушения, порядок уведомления заемщика
      и последствия предъявления требования о досрочном возврате.
    addressee: "Кредитор / Юридический советник"

  early_demand_triggers:
    text: >
      Просим предоставить по {doc_names} исчерпывающий перечень оснований,
      при которых банк вправе потребовать досрочного возврата кредита,
      а также правовое обоснование каждого такого основания.
    addressee: "Кредитор / Юридический советник"

  variable_rate_check:
    text: >
      По {doc_names} с плавающей ставкой просим предоставить:
      формулу ставки, источник референсного индикатора, периодичность пересмотра,
      порядок уведомления заемщика и пример перерасчета платежей.
    addressee: "Кредитор"

  variable_rate_conditions:
    text: >
      Просим включить/уточнить в {doc_names}: ясную формулу переменной ставки,
      способ определения базового индикатора, периодичность изменения
      и обязанность предварительного уведомления заемщика.
    addressee: "Юридический советник"

  payment_allocation_priority_check:
    text: >
      Просим уточнить в {doc_names}: очередность списания поступающих от заемщика сумм
      между расходами, процентами, основным долгом, неустойкой и иными платежами,
      а также привести пример распределения частичного платежа.
    addressee: "Кредитор"

  payment_priority_order:
    text: >
      Просим предоставить по {doc_names} формулировку очередности погашения задолженности
      и подтвердить, что она не создает необоснованного приоритета штрафов
      над основным долгом и процентами.
    addressee: "Кредитор / Юридический советник"

  credit_line_limit_and_tranches:
    text: >
      По {doc_names} (кредитная линия) просим предоставить:
      лимит кредитования, правила выборки траншей, условия доступности лимита,
      порядок возврата траншей и случаи приостановления дальнейшей выборки.
    addressee: "Кредитор"

  credit_line_without_limit_terms:
    text: >
      В {doc_names} выявлен риск неполного регулирования кредитной линии.
      Просим срочно уточнить лимит, порядок выдачи траншей,
      условия их возврата и механизм расчета доступного остатка лимита.
    addressee: "Кредитор / Юридический советник"

  foreign_currency_credit_without_conversion_logic:
    text: >
      В {doc_names} выявлен валютный элемент без достаточной валютной оговорки.
      Просим предоставить условия пересчета, источник курса, дату определения курса
      и правовое обоснование валютной конструкции кредита.
    addressee: "Кредитор / Юридический советник"

  cooling_off_disclosure:
    text: >
      Для {doc_names} как потребительского кредита просим уточнить:
      право заемщика отказаться от кредита в предусмотренный законом срок,
      порядок такого отказа, сумму процентов к уплате за фактический период пользования
      и форму уведомления кредитора.
    addressee: "Кредитор"

  penalty_proportionality:
    text: >
      Просим уточнить по {doc_names}: размер неустойки, пеней и штрафов,
      методику их расчета, предельные значения и соответствие ограничениям,
      применимым к потребительскому кредитованию.
    addressee: "Кредитор / Юридический советник"

  personal_data_and_credit_history:
    text: >
      Просим предоставить по {doc_names}: формулировки согласия на обработку персональных данных,
      сведения о передаче информации в БКИ, перечень передаваемых данных
      и основания такой передачи.
    addressee: "Кредитор"

  information_obligations_of_borrower:
    text: >
      Просим уточнить в {doc_names}: какие именно изменения заемщик обязан сообщать банку,
      в какие сроки, в какой форме и каковы последствия нарушения этой обязанности.
    addressee: "Юридический советник"

  financial_covenants_check:
    text: >
      Просим предоставить по {doc_names}: полный перечень финансовых ковенантов,
      методологию расчёта каждого показателя, периодичность тестирования,
      последствия нарушения и наличие срока на исправление (cure period).
    addressee: "Кредитор / Юридический советник"

  financial_covenants_clarity:
    text: >
      Просим уточнить в {doc_names}: формулы расчёта финансовых ковенантов,
      источник данных для расчёта (РСБУ/МСФО), периодичность тестирования
      и механизм waiver при нарушении.
    addressee: "Кредитор"

  cross_default_check:
    text: >
      Просим предоставить по {doc_names}: условия кросс-дефолта,
      пороговую сумму задолженности, перечень охватываемых обязательств,
      наличие grace period и порядок уведомления заёмщика.
    addressee: "Кредитор / Юридический советник"

  cross_default_clause:
    text: >
      Просим уточнить в {doc_names}: какие обязательства заёмщика охватывает
      кросс-дефолт, установлен ли порог существенности по сумме,
      и предусмотрен ли срок на устранение.
    addressee: "Юридический советник"

  cross_default_without_thresholds:
    text: >
      В {doc_names} выявлен кросс-дефолт без порога существенности.
      Просим установить минимальную сумму задолженности, при которой
      срабатывает кросс-дефолт, и предусмотреть grace period.
    addressee: "Юридический советник / Заёмщик"

  purpose_and_control_check:
    text: >
      Просим предоставить по {doc_names}: описание целевого назначения кредита,
      перечень документов для подтверждения целевого использования,
      сроки предоставления и последствия нецелевого использования.
    addressee: "Кредитор"

  purpose_restriction_clause:
    text: >
      Просим уточнить в {doc_names}: цель кредита, порядок контроля
      целевого использования и последствия нарушения.
    addressee: "Кредитор / Заёмщик"

  purpose_without_control_mechanism:
    text: >
      В {doc_names} указан целевой кредит без механизма контроля использования.
      Просим предусмотреть порядок предоставления подтверждающих документов
      и сроки их представления банку.
    addressee: "Юридический советник"

  negative_pledge_check:
    text: >
      Просим предоставить по {doc_names}: условия негативного залога,
      перечень активов, на которые распространяется ограничение,
      исключения и порядок получения согласия банка.
    addressee: "Кредитор / Юридический советник"

  negative_pledge_clause:
    text: >
      Просим уточнить в {doc_names}: охват негативного залога,
      допустимые исключения и порядок получения согласия на обременение.
    addressee: "Юридический советник"

  representations_and_warranties_check:
    text: >
      Просим предоставить по {doc_names}: полный перечень заверений заёмщика,
      момент их предоставления (на дату подписания / каждого транша),
      последствия недостоверности заверений.
    addressee: "Кредитор / Заёмщик"

  borrower_representations:
    text: >
      Просим включить/уточнить в {doc_names}: заверения заёмщика
      о правоспособности, отсутствии судебных споров, достоверности
      финансовой отчётности, отсутствии дефолта и признаков банкротства.
    addressee: "Юридический советник"

  change_of_control_clause:
    text: >
      Просим уточнить в {doc_names}: определение смены контроля,
      последствия (досрочное погашение / пересмотр условий / waiver),
      порядок уведомления банка.
    addressee: "Кредитор / Заёмщик"

  mac_clause:
    text: >
      Просим уточнить в {doc_names}: определение существенного негативного изменения (MAC),
      критерии существенности, право банка на досрочное истребование
      и порядок фиксации MAC.
    addressee: "Юридический советник"

  grace_period_disclosure:
    text: >
      Просим уточнить по {doc_names}: условия предоставления льготного периода,
      критерии для получения, порядок подачи заявления,
      влияние на начисление процентов и срок кредита.
    addressee: "Кредитор"

  events_of_default_list:
    text: >
      Просим предоставить по {doc_names}: исчерпывающий перечень событий дефолта,
      наличие cure period для каждого события, порядок уведомления
      и механизм waiver.
    addressee: "Кредитор / Юридический советник"

  unilateral_rate_change_risk:
    text: >
      В {doc_names} выявлен риск одностороннего изменения ставки банком.
      Просим привязать изменение к объективному индикатору (ключевая ставка и т.п.)
      или исключить право одностороннего изменения.
    addressee: "Юридический советник / Заёмщик"

  # Generic fallback
  _default:
    text: >
      Просим предоставить дополнительную информацию по вопросу «{check_name}»
      применительно к {doc_names}.
    addressee: "Юридический советник"
    