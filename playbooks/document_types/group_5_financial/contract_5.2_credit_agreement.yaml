# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 3: SHARED PATTERNS
#  Читается: DocTypeCheckLoader через _resolve_yaml_templates()
# ════════════════════════════════════════════════════════════════════════════

shared_patterns:

  money_amount: "(?i)\\b\\d[\\d\\s]*(?:руб|рублей|₽|коп|тыс|млн|млрд)"
  percentage_pattern: "(?i)\\b\\d+(?:[.,]\\d+)?\\s*%\\b"
  date_pattern: "(?i)\\b\\d{1,2}[.]\\d{1,2}[.]\\d{4}\\b"
  psk_pattern: "(?i)(?:полная\\s+стоимость\\s+кредита|ПСК).{0,30}\\d+(?:[.,]\\d+)?\\s*%"
  license_pattern: "(?i)лиценз[ияе]\\s*(?:№|N|No\\.)?\\s*[A-ZА-Я0-9\\-\\/]+"

# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 4: COMPLIANCE RULES
#  Читается: DocTypeCheckLoader._exclusion_logic_to_checks()
# ════════════════════════════════════════════════════════════════════════════

compliance_rules:

  - id: "non_licensed_lender_red_flag"
    name: "Отсутствуют признаки банковской/кредитной лицензии у кредитора"
    description: "Кредитный договор может заключаться только банком или иной кредитной организацией"
    legal_base: "ст. 819 ГК РФ, ФЗ № 395-1"
    required_triggers: []
    severity: "critical"
    result_if_triggered: "fail"
    detector_type: "rules"
    rules:
      negative_keywords:
        - "банк"
        - "кредитная организация"
        - "лицензия банка россии"
        - "генеральная лицензия"
        - "цб рф"
      keyword_mode: "any"
    retrieval:
      context_k: 5
      boost_keywords:
        - "лицензия банка россии"
        - "кредитная организация"
        - "банк"
      rerank: true

  - id: "interest_free_credit_red_flag"
    name: "Выявлен риск беспроцентного кредитного договора"
    description: "Кредитный договор является возмездным; беспроцентная конструкция противоречит сущности кредита"
    legal_base: "ст. 819 ГК РФ"
    required_triggers: []
    severity: "critical"
    result_if_triggered: "fail"
    detector_type: "rules"
    rules:
      keywords:
        - "беспроцентный"
        - "проценты не начисляются"
        - "0% годовых"
      keyword_mode: "any"
    retrieval:
      context_k: 4
      boost_keywords:
        - "беспроцентный"
        - "0% годовых"
        - "кредитный договор"
      rerank: true

  - id: "consumer_credit_without_psk"
    name: "Потребительский кредит без раскрытия ПСК"
    description: "Для потребительского кредита раскрытие полной стоимости кредита обязательно"
    legal_base: "ст. 6 ФЗ № 353-ФЗ"
    required_triggers: ["consumer_credit"]
    severity: "critical"
    result_if_triggered: "fail"
    detector_type: "rules"
    rules:
      negative_keywords:
        - "полная стоимость кредита"
        - "пск"
      keyword_mode: "any"
    retrieval:
      context_k: 5
      boost_keywords:
        - "пск"
        - "полная стоимость кредита"
        - "потребительский кредит"
      rerank: true

  - id: "foreign_currency_credit_without_conversion_logic"
    name: "Валютный кредит без ясной валютной оговорки"
    description: "При валютном кредите должны быть понятны валюта обязательства, курс и дата пересчета"
    legal_base: "ст. 140, 317 ГК РФ, валютное регулирование"
    required_triggers: ["foreign_currency_credit"]
    severity: "critical"
    result_if_triggered: "fail"
    detector_type: "rules"
    rules:
      keywords:
        - "доллар"
        - "евро"
        - "usd"
        - "eur"
      negative_keywords:
        - "курс цб рф"
        - "на дату платежа"
        - "валютная оговорка"
      keyword_mode: "any"
    retrieval:
      context_k: 5
      boost_keywords:
        - "курс цб"
        - "валютная оговорка"
        - "дата платежа"
      rerank: true

  - id: "credit_line_without_limit_terms"
    name: "Кредитная линия без лимита и правил выдачи траншей"
    description: "Для кредитной линии критично определить лимит, порядок выборки и возврата траншей"
    legal_base: "ст. 819 ГК РФ, общие положения"
    required_triggers: ["credit_line"]
    severity: "high"
    result_if_triggered: "fail"
    detector_type: "rules"
    rules:
      keywords:
        - "кредитная линия"
        - "транш"
      negative_keywords:
        - "лимит кредитования"
        - "максимальная сумма"
        - "порядок предоставления траншей"
      keyword_mode: "any"
    retrieval:
      context_k: 5
      boost_keywords:
        - "кредитная линия"
        - "лимит"
        - "транш"
      rerank: true

  - id: "purpose_without_control_mechanism"
    name: "Целевой кредит без механизма контроля использования"
    description: |
      При целевом кредите банк вправе контролировать использование средств.
      Отсутствие порядка подтверждения целевого использования создаёт риск
      досрочного истребования по ст. 814 ГК РФ.
    legal_base: "ст. 814 ГК РФ"
    required_triggers: ["purpose_restricted"]
    severity: "high"
    result_if_triggered: "warning"
    detector_type: "rules"
    rules:
      keywords:
        - "целевой кредит"
        - "целевое использование"
      keyword_mode: "any"
      negative_keywords:
        - "подтверждение целевого использования"
        - "документы, подтверждающие"
        - "порядок контроля"
    retrieval:
      context_k: 5
      boost_keywords:
        - "целевое использование"
        - "подтверждение"
        - "контроль"
      rerank: true

  - id: "cross_default_without_thresholds"
    name: "Кросс-дефолт без порогов существенности"
    description: |
      Кросс-дефолт без минимальных порогов по сумме задолженности
      позволяет банку объявить дефолт при любом незначительном нарушении
      по другим обязательствам заёмщика.
    legal_base: "Банковская практика, ст. 310 ГК РФ"
    required_triggers: ["cross_default"]
    severity: "high"
    result_if_triggered: "warning"
    detector_type: "rules"
    rules:
      keywords:
        - "кросс-дефолт"
        - "cross-default"
        - "дефолт по иным обязательствам"
      keyword_mode: "any"
      negative_keywords:
        - "превышающей"
        - "более чем"
        - "порог существенности"
        - "минимальная сумма"
    retrieval:
      context_k: 5
      boost_keywords:
        - "кросс-дефолт"
        - "порог"
        - "существенность"
      rerank: true

  - id: "unilateral_rate_change_risk"
    name: "Односторонее изменение ставки банком"
    description: |
      Условие о праве банка в одностороннем порядке изменять процентную ставку
      (вне привязки к объективному индикатору) противоречит ст. 310 ГК РФ
      и ограничениям ФЗ-353 для потребительских кредитов.
    legal_base: "ст. 310 ГК РФ, ст. 5 ФЗ № 353-ФЗ"
    required_triggers: []
    severity: "critical"
    result_if_triggered: "fail"
    detector_type: "rules"
    rules:
      keywords:
        - "банк вправе изменить ставку"
        - "в одностороннем порядке изменить"
        - "по усмотрению банка"
      keyword_mode: "any"
      negative_keywords:
        - "ключевая ставка"
        - "mosprime"
        - "индикативная ставка"
        - "по соглашению сторон"
    retrieval:
      context_k: 5
      boost_keywords:
        - "одностороннее изменение"
        - "ставка"
        - "усмотрение банка"
      rerank: true

# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 5: CHECKS_V8 — LLM/hybrid проверки
#  Читается: DocTypeCheckLoader._load_doc_type_checks()
# ════════════════════════════════════════════════════════════════════════════

checks_v8:

  - id: credit_subject_extraction
    name: "Базовое извлечение параметров кредитного договора"
    description: "Извлекает кредитора, заемщика, сумму, валюту, ставку, срок, ПСК и вид кредитной конструкции"
    triggers: {}
    severity: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "кредитор"
        - "заемщик"
        - "сумма кредита"
        - "процентная ставка"
        - "полная стоимость кредита"
        - "график платежей"
        - "кредитная линия"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)(кредитный\\s+договор|кредитор|заемщик)"
        - "(?i)\\b\\d[\\d\\s]*(?:руб|рублей|₽|коп|тыс|млн|млрд)\\b"
        - "(?i)\\b\\d+(?:[.,]\\d+)?\\s*%\\b"
    llm:
      prompt_template: |
        Ты — юридический ассистент, анализирующий кредитный договор.
        Извлеки ключевые параметры договора строго по тексту.

        Ответь строго в JSON:
        {
          "lender": "<кредитор или not_found>",
          "borrower": "<заемщик или not_found>",
          "credit_type": "<standard / consumer / mortgage / credit_line / overdraft / refinancing / unclear / not_found>",
          "credit_amount": "<сумма кредита или not_found>",
          "currency": "<RUB / USD / EUR / other / not_found>",
          "interest_rate": "<ставка или not_found>",
          "rate_type": "<fixed / variable / unclear / not_found>",
          "term": "<срок кредита или not_found>",
          "psk": "<значение ПСК или not_found>",
          "repayment_structure": "<annuity / differentiated / custom / not_found>"
        }

        Используй только данные из текста.
        Если сведения отсутствуют — пиши "not_found".
      prompt_file: null
      context_k: 6
      temperature: 0.0
      max_tokens: 700
    retrieval:
      context_k: 6
      max_chunks: 10
      boost_keywords:
        - "сумма кредита"
        - "процентная ставка"
        - "полная стоимость кредита"
        - "график платежей"
        - "аннуитетный платеж"
      rerank: true
      filters: {}
    evidence:
      required: true
      min_snippet_length: 50
      max_snippet_length: 700
    extraction:
      enabled: true
      mode: "hybrid"
      fields:
        - name: "lender"
          type: "string"
          keyword_hints: ["кредитор", "банк", "кредитная организация"]
          description: "Кредитор"
        - name: "borrower"
          type: "string"
          keyword_hints: ["заемщик"]
          description: "Заемщик"
        - name: "credit_type"
          type: "string"
          allowed_values: ["standard", "consumer", "mortgage", "credit_line", "overdraft", "refinancing", "unclear", "not_found"]
          description: "Вид кредитной конструкции"
        - name: "credit_amount"
          type: "string"
          keyword_hints: ["сумма кредита", "лимит кредитования", "размер кредита"]
          description: "Сумма кредита"
        - name: "currency"
          type: "string"
          allowed_values: ["RUB", "USD", "EUR", "other", "not_found"]
          description: "Валюта кредита"
        - name: "interest_rate"
          type: "string"
          regex_patterns:
            - "(?i)\\b\\d+(?:[.,]\\d+)?\\s*%\\b"
          description: "Процентная ставка"
        - name: "rate_type"
          type: "string"
          allowed_values: ["fixed", "variable", "unclear", "not_found"]
          description: "Тип процентной ставки"
        - name: "term"
          type: "string"
          keyword_hints: ["срок кредита", "срок возврата", "дата окончательного погашения"]
          description: "Срок кредита"
        - name: "psk"
          type: "string"
          keyword_hints: ["полная стоимость кредита", "ПСК"]
          description: "ПСК"
        - name: "repayment_structure"
          type: "string"
          allowed_values: ["annuity", "differentiated", "custom", "not_found"]
          description: "Структура платежей"
      store_payload: true

  - id: lender_license_check
    name: "Статус и лицензия кредитора"
    description: "Проверяет, что кредитор обозначен как банк/кредитная организация и содержатся признаки лицензии"
    triggers: {}
    severity: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "банк"
        - "кредитная организация"
        - "лицензия банка россии"
        - "генеральная лицензия"
        - "цб рф"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)лиценз[ияе].{0,40}(банка\\s+россии|цб|центрального\\s+банка)"
        - "(?i)(банк|кредитная\\s+организация)"
    llm:
      prompt_template: |
        Ты — юридический ассистент, анализирующий кредитный договор.
        Проверь, идентифицирован ли кредитор как надлежащий субъект кредитного договора.

        Ответь строго в JSON:
        {
          "lender_status": "<bank / credit_organization / unclear / not_found>",
          "license_reference_status": "<present / not_found>",
          "license_details": "<если указаны, кратко; иначе not_found>"
        }

        Используй только текст документа.
      prompt_file: null
      context_k: 5
      temperature: 0.0
      max_tokens: 350
    retrieval:
      context_k: 5
      max_chunks: 7
      boost_keywords:
        - "лицензия банка россии"
        - "банк"
        - "кредитная организация"
      rerank: true
      filters: {}
    evidence:
      required: true
      min_snippet_length: 35
      max_snippet_length: 550
    extraction:
      enabled: true
      mode: "hybrid"
      fields:
        - name: "lender_status"
          type: "string"
          allowed_values: ["bank", "credit_organization", "unclear", "not_found"]
          description: "Статус кредитора"
        - name: "license_reference_status"
          type: "string"
          allowed_values: ["present", "not_found"]
          description: "Есть ли ссылка на лицензию"
      store_payload: true

  - id: interest_psk_fees_check
    name: "Проценты, ПСК и дополнительные платежи"
    description: "Проверяет процентную ставку, ПСК, комиссии и прозрачность общей стоимости кредита"
    triggers: {}
    severity: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "процентная ставка"
        - "полная стоимость кредита"
        - "пск"
        - "комиссия"
        - "плата за обслуживание"
        - "проценты за пользование"
        - "иные платежи"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)процентн(ая|ой)\\s+ставк"
        - "(?i)(полная\\s+стоимость\\s+кредита|ПСК)"
        - "(?i)комисси|плата\\s+за\\s+обслуживан"
    llm:
      prompt_template: |
        Ты — юридический ассистент, анализирующий кредитный договор.
        Проверь, раскрыты ли проценты, ПСК и дополнительные платежи.

        Ответь строго в JSON:
        {
          "interest_rate_status": "<present / not_found>",
          "psk_status": "<present / not_found / not_applicable>",
          "fees_status": "<none_stated / enumerated / vague / not_found>",
          "hidden_fees_risk": "<high / medium / low / not_found>",
          "calculation_base": "<outstanding_balance / principal / unclear / not_found>"
        }

        - "vague" — если есть открытые формулы вроде "и иные комиссии банка"
        - "not_applicable" — если по тексту не видно, что договор потребительский и ПСК не требуется оценивать в рамках документа
      prompt_file: null
      context_k: 6
      temperature: 0.0
      max_tokens: 450
    retrieval:
      context_k: 6
      max_chunks: 9
      boost_keywords:
        - "процентная ставка"
        - "пск"
        - "полная стоимость кредита"
        - "комиссия"
      rerank: true
      filters: {}
    evidence:
      required: true
      min_snippet_length: 45
      max_snippet_length: 650
    extraction:
      enabled: true
      mode: "hybrid"
      fields:
        - name: "interest_rate_status"
          type: "string"
          allowed_values: ["present", "not_found"]
          description: "Наличие процентной ставки"
        - name: "psk_status"
          type: "string"
          allowed_values: ["present", "not_found", "not_applicable"]
          description: "Статус раскрытия ПСК"
        - name: "fees_status"
          type: "string"
          allowed_values: ["none_stated", "enumerated", "vague", "not_found"]
          description: "Раскрытие комиссий и дополнительных платежей"
        - name: "hidden_fees_risk"
          type: "string"
          allowed_values: ["high", "medium", "low", "not_found"]
          description: "Риск скрытых платежей"
        - name: "calculation_base"
          type: "string"
          allowed_values: ["outstanding_balance", "principal", "unclear", "not_found"]
          description: "База начисления процентов"
      store_payload: true

  - id: repayment_schedule_and_early_repayment_check
    name: "График погашения и досрочное погашение"
    description: "Проверяет наличие графика платежей, структуры погашения и условий досрочного возврата"
    triggers: {}
    severity: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "график платежей"
        - "аннуитетный платеж"
        - "дифференцированный платеж"
        - "досрочное погашение"
        - "частичное досрочное погашение"
        - "полное досрочное погашение"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)график\\s+платеж"
        - "(?i)аннуитетн|дифференцированн"
        - "(?i)досрочн(ое|ого)\\s+погашен"
    llm:
      prompt_template: |
        Ты — юридический ассистент, анализирующий кредитный договор.
        Проверь порядок погашения кредита и условия досрочного погашения.

        Ответь строго в JSON:
        {
          "schedule_status": "<present / not_found>",
          "payment_structure": "<annuity / differentiated / custom / not_found>",
          "early_repayment_status": "<allowed / restricted / not_found>",
          "notice_requirement_for_early_repayment": "<present / not_found>",
          "early_repayment_fee_risk": "<high / medium / low / not_found>"
        }

        Используй только текст документа.
      prompt_file: null
      context_k: 5
      temperature: 0.0
      max_tokens: 420
    retrieval:
      context_k: 5
      max_chunks: 8
      boost_keywords:
        - "график платежей"
        - "досрочное погашение"
        - "аннуитетный платеж"
      rerank: true
      filters: {}
    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 600
    extraction:
      enabled: true
      mode: "hybrid"
      fields:
        - name: "schedule_status"
          type: "string"
          allowed_values: ["present", "not_found"]
          description: "Есть ли график платежей"
        - name: "payment_structure"
          type: "string"
          allowed_values: ["annuity", "differentiated", "custom", "not_found"]
          description: "Структура графика платежей"
        - name: "early_repayment_status"
          type: "string"
          allowed_values: ["allowed", "restricted", "not_found"]
          description: "Статус досрочного погашения"
        - name: "notice_requirement_for_early_repayment"
          type: "string"
          allowed_values: ["present", "not_found"]
          description: "Есть ли уведомительный порядок"
        - name: "early_repayment_fee_risk"
          type: "string"
          allowed_values: ["high", "medium", "low", "not_found"]
          description: "Риск санкций/скрытых издержек при досрочном погашении"
      store_payload: true

  - id: forced_services_and_insurance_check
    name: "Навязанные услуги и страховые продукты"
    description: "Проверяет, не поставлена ли выдача кредита в зависимость от приобретения дополнительных услуг/страхования"
    triggers:
      any: ["consumer_credit", "insurance_linked_product"]
    severity: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "страхование жизни"
        - "страхование здоровья"
        - "добровольное страхование"
        - "обязательное условие"
        - "подключение услуги"
        - "заемщик вправе отказаться"
        - "не является обязательным условием"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)страхован(ие|ия)\\s+(жизни|здоровья)"
        - "(?i)не\\s+является\\s+обязательным\\s+условием"
        - "(?i)обязательн(ое|ым)\\s+услови"
    llm:
      prompt_template: |
        Ты — юридический ассистент, анализирующий кредитный договор.
        Проверь, есть ли риск навязывания дополнительных услуг.

        Ответь строго в JSON:
        {
          "additional_services_present": "<yes / no / not_found>",
          "insurance_linked": "<yes / no / not_found>",
          "borrower_opt_out_right": "<present / not_found>",
          "forced_services_risk": "<high / medium / low / not_found>"
        }

        Используй только текст документа.
      prompt_file: null
      context_k: 5
      temperature: 0.0
      max_tokens: 350
    retrieval:
      context_k: 5
      max_chunks: 8
      boost_keywords:
        - "страхование жизни"
        - "добровольное страхование"
        - "обязательное условие"
        - "вправе отказаться"
      rerank: true
      filters: {}
    evidence:
      required: true
      min_snippet_length: 35
      max_snippet_length: 550
    extraction:
      enabled: true
      mode: "hybrid"
      fields:
        - name: "additional_services_present"
          type: "string"
          allowed_values: ["yes", "no", "not_found"]
          description: "Есть ли дополнительные услуги"
        - name: "insurance_linked"
          type: "string"
          allowed_values: ["yes", "no", "not_found"]
          description: "Связан ли кредит со страховым продуктом"
        - name: "borrower_opt_out_right"
          type: "string"
          allowed_values: ["present", "not_found"]
          description: "Есть ли право отказаться"
        - name: "forced_services_risk"
          type: "string"
          allowed_values: ["high", "medium", "low", "not_found"]
          description: "Риск навязывания услуг"
      store_payload: true

  - id: acceleration_events_check
    name: "Основания для досрочного истребования кредита"
    description: "Проверяет перечень оснований, при которых банк вправе потребовать досрочного возврата кредита"
    triggers: {}
    severity: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
