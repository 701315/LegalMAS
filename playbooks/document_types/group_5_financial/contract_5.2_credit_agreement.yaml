      - "(?i)\\bпотребител[ьяи]\\b"
      - "(?i)физическ[оеая]\\s+лиц[оо]"
      - "(?i)\\bгражданин\\b"
      - "(?i)личн[ыо]е\\s+нужд[ыа]"
      - "(?i)\\bпск\\b"
      - "(?i)полн[а-яё]+\\s+стоимост[ьи]\\s+кредит[аа]"

  mortgage_credit:
