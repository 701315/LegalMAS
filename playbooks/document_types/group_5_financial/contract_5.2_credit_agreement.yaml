  - id: negative_pledge_check
    name: "Негативный залог и ограничения на обременение активов"
    description: >
      Проверяет наличие обязательства не обременять активы без согласия
      банка, охват активов и наличие разрешённых исключений (permitted
      liens).
    triggers:
      any:
        - negative_pledge
        - corporate_borrower
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "негативный залог"
        - "negative pledge"
        - "обязательство не обременять"
        - "не передавать в залог"
        - "без согласия банка"
        - "разрешённые обременения"
        - "permitted liens"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)негативн(ый|ого)\\s+залог"
        - "(?i)negative\\s+pledge"
        - "(?i)не\\s+передавать\\s+в\\s+залог"
        - "(?i)(разрешённ|допустим).{0,20}обременен"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется кредитный договор.
        Проверяется только один вопрос: наличие и параметры негативного
        залога — обязательства не обременять активы без согласия банка.

        Нормативный ориентир:
        - ст. 819, 821 ГК РФ — кредитный договор и основания
          для досрочного истребования
        - В российском праве негативный залог — договорный институт
          (законодательного регулирования нет)

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора,
          а чего прямо нет.
        - Не оценивай серьёзность риска.
        - Различай три режима охвата активов:
            1) all_assets — негативный залог на все активы заёмщика;
            2) specified_assets — на конкретный перечень активов;
            3) not_defined — охват не установлен.
        - Различай наличие permitted liens (разрешённых обременений):
          банковские залоги, торговые обременения, лизинг, обременения
          по закону и т.п.
        - Красные флаги:
            * негативный залог на все активы без permitted liens;
            * отсутствие перечня разрешённых обременений;
            * согласие банка требуется в каждом случае, без исключений.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Есть ли негативный залог.
        2. На какие активы он распространяется.
        3. Есть ли permitted liens (разрешённые обременения) и какие.
        4. Сформулируй понятные для юриста текстовые расшифровки:
           - negative_pledge_display,
           - negative_pledge_scope_display,
           - permitted_liens_display.

        [ПРАВИЛА]
        1. Используй только текст документа. Не подставляй нормы закона
           вместо текста договора.
        2. Если параметр прямо указан в договоре — возвращай его дословно
           или делай точную выжимку.
        3. Если параметр в договоре прямо не указан:
           - для сигнальных enum-полей (negative_pledge_status,
             negative_pledge_scope, permitted_liens_status) — возвращай
             "not_defined";
           - для текстовых user-facing полей (negative_pledge_display,
             negative_pledge_scope_display, permitted_liens_display) —
             возвращай "Не установлено" / "Не установлены" по роду.
        4. Если тема по существу не применима к данному договору —
           для user-facing поля возвращай "Не применимо",
           для сигнального — "not_defined".
        5. Если текст есть, но надёжный вывод сделать нельзя —
           для user-facing поля возвращай "Не удалось определить",
           для сигнального — "not_defined".
        6. Никогда не используй null, None, пустые строки или "-".
        7. Не выдумывай перечни активов и permitted liens, которых нет
           в тексте.
        8. При конфликтующих фрагментах отдавай приоритет более позднему
           или более специальному положению.
        9. В evidence включай только текст договора.
        10. Верни РОВНО один JSON-объект со всеми ключами из [ФОРМАТ ОТВЕТА] без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.

        [РОССИЙСКАЯ ПРАКТИКА — ПОДСКАЗКИ]
        - Типичная формулировка: «Заёмщик обязуется не передавать в залог,
          не обременять иным образом свои активы без предварительного
          письменного согласия Банка» → negative_pledge_status = "defined",
          negative_pledge_scope = "all_assets".
        - С ограниченным охватом: «не обременять основные средства
          и объекты недвижимости» → negative_pledge_scope = "specified_assets".
        - Permitted liens — типовые исключения:
            * обременения, возникшие до заключения договора;
            * обременения в пользу Банка;
            * обременения по закону (например, залог в силу закона);
            * лизинговые обременения;
            * торговые обременения в рамках обычной хозяйственной
              деятельности;
            * обременения, возникшие в результате сделки, согласованной
              с Банком.
        - Красный флаг: негативный залог на все активы без перечня
          permitted liens — существенное ограничение для заёмщика.
        - Согласие банка: общее (на любые обременения) или конкретное
          (на отдельные сделки).

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — негативный залог на все активы с permitted liens:
        Фрагмент:
        "Заёмщик обязуется не передавать в залог, не обременять иным
         образом свои активы без предварительного письменного согласия
         Банка, за исключением: (а) обременений, существующих на дату
         заключения Договора; (б) обременений в пользу Банка; (в) залога
         в силу закона."

        Ответ:
        {
          "negative_pledge_status": "defined",
          "negative_pledge_scope": "all_assets",
          "permitted_liens_status": "present",
          "negative_pledge_display": "Установлен",
          "negative_pledge_scope_display": "Все активы Заёмщика",
          "permitted_liens_display": "Разрешены: обременения на дату заключения, в пользу Банка, залог в силу закона"
        }

        Пример 2 — ограниченный охват без permitted liens (красный флаг):
        Фрагмент:
        "Заёмщик обязуется не передавать в залог объекты недвижимости
         без письменного согласия Банка."

        Ответ:
        {
          "negative_pledge_status": "defined",
          "negative_pledge_scope": "specified_assets",
          "permitted_liens_status": "not_defined",
          "negative_pledge_display": "Установлен",
          "negative_pledge_scope_display": "Объекты недвижимости Заёмщика",
          "permitted_liens_display": "Не установлены (перечень разрешённых обременений отсутствует)"
        }

        Пример 3 — негативного залога нет:
        Фрагмент:
        "Иные ограничения по распоряжению активами Договором
         не предусмотрены."

        Ответ:
        {
          "negative_pledge_status": "not_defined",
          "negative_pledge_scope": "not_defined",
          "permitted_liens_status": "not_defined",
          "negative_pledge_display": "Не установлен",
          "negative_pledge_scope_display": "Не применимо",
          "permitted_liens_display": "Не применимо"
        }

        Пример 4 — текст есть, но вывод невозможен (неоднозначная
        формулировка):
        Фрагмент:
        "Заёмщик обязуется соблюдать разумные ограничения по распоряжению
         активами, определяемые Банком в рабочем порядке."

        Ответ:
        {
          "negative_pledge_status": "not_defined",
          "negative_pledge_scope": "not_defined",
          "permitted_liens_status": "not_defined",
          "negative_pledge_display": "Не удалось определить",
          "negative_pledge_scope_display": "Не удалось определить",
          "permitted_liens_display": "Не удалось определить"
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о негативном залоге.
        2. Определи охват активов: все / конкретный перечень.
        3. Найди permitted liens (разрешённые обременения) и перечисли
           их кратко.
        4. Проверь, есть ли красный флаг «негативный залог на все активы
           без permitted liens».
        5. Сформулируй три user-facing display-поля кратко и по-русски.
        6. Если прямых цитат нет — верни fallback по правилам 3–5.

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь РОВНО одним JSON-объектом без какого-либо дополнительного текста до или после, со всеми 6 ключами:
        {
          "negative_pledge_status": "<defined / not_defined>",
          "negative_pledge_scope": "<all_assets / specified_assets / not_defined>",
          "permitted_liens_status": "<present / not_defined>",
          "negative_pledge_display": "<текст, 'Не установлен', 'Не применимо' или 'Не удалось определить'>",
          "negative_pledge_scope_display": "<текст, 'Не применимо' или 'Не удалось определить'>",
          "permitted_liens_display": "<текст, 'Не установлены', 'Не применимо' или 'Не удалось определить'>"
        }
      context_k: 8
      temperature: 0.0
      max_tokens: 700

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "негативный залог negative pledge не обременять согласие банка не передавать в залог ограничения обременения активов разрешённые обременения permitted liens"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - covenants
      negative_keywords:
        - "означает"
        - "в целях настоящего"
        - "проценты"
        - "пск"
        - "предмет договора"
        - "обеспечение"
      position_bias:
        preferred_range: [0.30, 0.70]
        boost: 0.10
        scope: segment
      context_k: 8
