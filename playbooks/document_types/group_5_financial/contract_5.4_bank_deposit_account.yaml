        - "вкладчик"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)публичн(ый|ого)\\s+договор"

  - id: "account_type_and_currency"
    name: "Счет: тип и валюта"
    description: "Проверяет наличие типа счета и валюты"
    legal_base: "ст. 845, 846 ГК РФ"
    severity: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers:
      any: ["bank_account_contract"]
    rules:
      keywords:
        - "расчетный счет"
        - "текущий счет"
        - "валюта счета"
        - "банковский счет"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)расчетн(ый|ого)\\s+счет|текущ(ий|его)\\s+счет|банковск(ий|ого)\\s+счет"
        - "(?i)валют[аы]\\s+счета|руб|usd|eur|евро|доллар"

  - id: "account_operations_framework"
    name: "Счет: рамка операций по счету"
    description: "Проверяет наличие базового описания операций, совершаемых банком по счету"
    legal_base: "ст. 845 ГК РФ"
    severity: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers:
      any: ["bank_account_contract"]
    rules:
      keywords:
        - "принимать и зачислять"
        - "перечислять"
        - "выдавать денежные средства"
        - "операции по счету"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)принимать\\s+и\\s+зачислять"
        - "(?i)операци[ия]\\s+по\\s+счету"

  - id: "bank_secrecy_clause"
    name: "Банковская тайна"
    description: "Проверяет наличие условий о банковской тайне и ограничениях раскрытия сведений"
    legal_base: "ст. 857 ГК РФ"
    severity: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
      keywords:
        - "банковская тайна"
        - "тайна банковского счета"
        - "операции по счету"
        - "сведения о клиенте"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)банковск(ая|ой)\\s+тайн"

  - id: "aml_ctf_compliance"
    name: "ПОД/ФТ: идентификация и документы"
    description: "Проверяет AML/CFT-условия и обязанность клиента предоставлять документы"
    legal_base: "ФЗ № 115-ФЗ"
    severity: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
      keywords:
        - "идентификация клиента"
        - "115-фз"
        - "документы для идентификации"
        - "подозрительные операции"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)115[- ]?фз"
        - "(?i)идентификац"
        - "(?i)подозрительн(ые|ых)\\s+операц"

  - id: "account_blocking_transparency"
    name: "Блокировка счета / приостановление операций"
    description: "Проверяет наличие оснований блокировки и механизма взаимодействия с клиентом"
    legal_base: "ст. 858 ГК РФ, ФЗ № 115-ФЗ"
    severity: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers:
      any: ["bank_account_contract"]
    rules:
      keywords:
        - "блокировка счета"
        - "приостановление операций"
        - "ограничение распоряжения"
        - "разблокировка"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)блокировк[аи]\\s+счета"
        - "(?i)приостановлени[ея]\\s+операц"

  - id: "unauthorized_debit_protection"
    name: "Безакцептное списание / списание без распоряжения клиента"
    description: "Проверяет основания и режим безакцептного списания"
    legal_base: "ст. 854 ГК РФ"
    severity: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers:
      any: ["bank_account_contract"]
    rules:
      keywords:
        - "безакцептное списание"
        - "списание без распоряжения"
        - "инкассовое поручение"
        - "по распоряжению клиента"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)безакцептн(ое|ого)\\s+списан"
        - "(?i)списани[ея].{0,40}без\\s+распоряжен"

  - id: "tariff_transparency"
    name: "Прозрачность тарифов и комиссий банка"
    description: "Проверяет наличие тарификации обслуживания и комиссий"
    legal_base: "ст. 851 ГК РФ, ЗоЗПП"
    severity: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers:
      any: ["bank_account_contract"]
    rules:
      keywords:
        - "тарифы банка"
        - "стоимость услуг"
        - "комиссия за обслуживание"
        - "плата за ведение счета"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)тариф(ы|ов)\\s+банка"
        - "(?i)комисси|плата\\s+за\\s+ведение\\s+счета"

  - id: "electronic_banking_security"
    name: "Безопасность ДБО / интернет-банка"
    description: "Проверяет наличие условий о безопасности дистанционного банковского обслуживания"
    legal_base: "ФЗ № 161-ФЗ"
    severity: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers:
      any: ["dbs_enabled"]
    rules:
      keywords:
        - "дистанционное банковское обслуживание"
        - "интернет-банк"
        - "электронная подпись"
        - "несанкционированный доступ"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)дистанционн(ое|ого)\\s+банковск(ое|ого)\\s+обслуживан"
        - "(?i)интернет[- ]банк|электронн(ая|ой)\\s+подпис"

  - id: "overdraft_terms"
    name: "Условия овердрафта"
    description: "Проверяет лимит, проценты и погашение при кредитовании счета"
    legal_base: "ст. 850 ГК РФ"
    severity: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers:
      any: ["overdraft_present"]
    rules:
      keywords:
        - "овердрафт"
        - "кредитование счета"
        - "лимит овердрафта"
        - "проценты за овердрафт"
        - "срок погашения"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)овердрафт|кредитовани[ея]\\s+счета"
        - "(?i)лимит\\s+овердрафт"

  - id: "account_closure_procedure"
    name: "Порядок расторжения договора и закрытия счета"
    description: "Проверяет процедуру закрытия счета и возврата/выдачи остатка денежных средств"
    legal_base: "ст. 859 ГК РФ"
    severity: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers:
      any: ["bank_account_contract"]
    rules:
      keywords:
        - "расторжение договора"
        - "закрытие счета"
        - "остаток средств"
        - "по заявлению клиента"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)закрыт(ие|ь)\\s+счета"
        - "(?i)по\\s+заявлению\\s+клиента"
        - "(?i)остат(ок|ка)\\s+средств"

  - id: "interest_on_account_balance"
    name: "Проценты на остаток по счету"
    description: "Проверяет наличие или отсутствие процентов на остаток денежных средств на счете"
    legal_base: "ст. 852 ГК РФ"
    severity: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers:
      any: ["bank_account_contract"]
    rules:
      keywords:
        - "проценты на остаток"
        - "проценты на денежные средства на счете"
        - "банк уплачивает проценты"
        - "проценты не начисляются"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)процент(ы|ов)\\s+на\\s+остат(ок|ка)"
        - "(?i)процент(ы|ов).{0,40}на\\s+счете"

  - id: "tax_agent_obligations"
    name: "Налоговый агент по процентам по вкладу"
    description: "Проверяет раскрытие функций банка как налогового агента, если это применимо"
    legal_base: "НК РФ ст. 214.2"
    severity: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers:
      any: ["deposit_contract", "consumer_depositor"]
    rules:
      keywords:
        - "налоговый агент"
        - "ндфл с процентов"
        - "удержание налога"
        - "проценты по вкладу"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)налогов(ый|ого)\\s+агент"
        - "(?i)НДФЛ"

  - id: "court_and_enforcement_orders"
    name: "Исполнительные документы и судебные акты"
    description: "Проверяет порядок исполнения исполнительных документов и информирования клиента"
    legal_base: "ФЗ № 229-ФЗ, ст. 855 ГК РФ"
    severity: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers:
      any: ["bank_account_contract"]
    rules:
      keywords:
        - "исполнительный документ"
        - "судебный акт"
        - "арест счета"
        - "исполнительное производство"
        - "инкассовое поручение"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)исполнительн(ый|ого)\\s+документ"
        - "(?i)судебн(ый|ого)\\s+акт"
        - "(?i)арест\\s+счета"

  - id: "force_majeure_banking"
    name: "Форс-мажор (санкции, технические сбои)"
    description: "Обстоятельства непреодолимой силы, включая санкции и IT-сбои банка"
    legal_base: "ст. 401 ГК РФ"
    severity: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
      keywords:
        - "форс-мажор"
        - "обстоятельства непреодолимой силы"
        - "санкции"
        - "технический сбой"
        - "недоступность системы"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)форс[- ]?мажор"

  - id: "governing_law_banking"
    name: "Применимое право"
    description: "Выбор применимого права"
    legal_base: "ГК РФ"
    severity: "low"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
      keywords:
        - "применимое право"
        - "регулируется законодательством"
        - "законодательство Российской Федерации"
      keyword_mode: "any"

  - id: "beneficiary_owner_disclosure"
    name: "Раскрытие бенефициарного владельца (115-ФЗ)"
    description: "Обязанность клиента раскрыть бенефициарного владельца"
    legal_base: "ФЗ № 115-ФЗ, ст. 6.1"
    severity: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
      keywords:
        - "бенефициарный владелец"
        - "конечный бенефициар"
        - "выгодоприобретатель"
        - "раскрытие информации"
        - "контролирующее лицо"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)бенефициарн\\w+\\s+владел"

  - id: "account_statement_procedure"
    name: "Порядок предоставления выписок по счёту"
    description: "Периодичность, форма и способ предоставления выписок"
    legal_base: "ст. 853 ГК РФ"
    severity: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers:
      any: ["bank_account_contract"]
    rules:
      keywords:
        - "выписка по счёту"
        - "предоставление выписки"
        - "ежемесячная выписка"
        - "электронная выписка"
      keyword_mode: "any"

# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 7: DD_REQUEST_TEMPLATES
#  Читается: DDRequestTemplateLoader
#  Ключи = check_id из checks_v8 и doc_type_checks выше.
#  DDRequestTemplateLoader.render() матчит по exact или prefix.
# ════════════════════════════════════════════════════════════════════════════

dd_request_templates:

  bank_deposit_account_subject_extraction:
    text: >
      Просим предоставить по {doc_names}: тип банковского договора (вклад/счет),
      сведения о банке и клиенте, сумму и валюту, процентную ставку,
      вид вклада/тип счета, наличие овердрафта, ДБО и иные существенные параметры.
    addressee: "Банк / Юридический советник"

  bank_identification_and_license:
    text: >
      Просим предоставить по {doc_names}: полное наименование банка,
      ОГРН, ИНН, реквизиты лицензии Банка России и подтверждение права
      на привлечение вкладов/ведение счетов соответствующего вида.
    addressee: "Банк"

  bank_license_missing:
    text: >
      В {doc_names} не выявлены достаточные признаки лицензии банка.
      Просим срочно предоставить реквизиты лицензии Банка России
      и подтверждение допустимости соответствующей банковской операции.
    addressee: "Банк / Юридический советник"

  deposit_amount_and_currency:
    text: >
      Просим уточнить по {doc_names}: сумму вклада, валюту вклада,
      дату внесения средств и подтверждение фактического зачисления вклада.
    addressee: "Банк / Вкладчик"

  deposit_type_and_term:
    text: >
      Просим уточнить по {doc_names}: является ли вклад срочным или до востребования,
      каков срок размещения, дата возврата и условия продления/пролонгации.
    addressee: "Банк"

  deposit_interest_and_fixation_check:
    text: >
      Просим предоставить по {doc_names}: процентную ставку, порядок начисления процентов,
      периодичность их выплаты/капитализации, а также подтвердить,
      может ли банк изменять ставку и при каких условиях.
    addressee: "Банк"

  deposit_interest_rate_required:
    text: >
      Просим уточнить в {doc_names}: точную процентную ставку по вкладу,
      способ начисления процентов и дату начала/окончания начисления.
    addressee: "Банк"

  term_deposit_rate_change_risk:
    text: >
      В {doc_names} выявлен риск одностороннего изменения ставки по срочному вкладу гражданина.
      Просим предоставить правовое пояснение и скорректировать договор
      в соответствии со ст. 838 ГК РФ.
    addressee: "Банк / Юридический советник"

  deposit_early_withdrawal_check:
    text: >
      Просим уточнить по {doc_names}: порядок досрочного возврата вклада,
      пересчет процентов при досрочном изъятии, сроки выплаты средств
      и требования к уведомлению банка.
    addressee: "Банк"

  deposit_return_procedure:
    text: >
      Просим уточнить по {doc_names}: процедуру возврата вклада,
      включая стандартный и досрочный возврат, а также способ выдачи денежных средств вкладчику.
    addressee: "Банк"

  deposit_insurance_disclosure:
    text: >
      Просим предоставить по {doc_names}: сведения о страховании вклада,
      участии банка в системе страхования вкладов, размере страхового возмещения
      и случаях, когда страхование может не применяться.
    addressee: "Банк"

  consumer_deposit_without_insurance_disclosure:
    text: >
      В {doc_names} выявлен риск отсутствия раскрытия страхования вкладов физического лица.
      Просим срочно предоставить подтверждение участия банка в системе страхования вкладов
      и пояснение о лимите страхового возмещения.
    addressee: "Банк / Юридический советник"

  public_deposit_nature:
    text: >
      Просим подтвердить по {doc_names}, что вклад гражданина оформляется
      с учетом публичного характера банковского продукта, и предоставить
      стандартные правила/условия обслуживания вкладчиков.
    addressee: "Банк"

  account_type_and_currency:
    text: >
      Просим уточнить по {doc_names}: тип банковского счета, валюту,
      реквизиты счета и допустимый перечень операций по нему.
    addressee: "Банк"

  account_operations_framework:
    text: >
      Просим предоставить по {doc_names}: описание операций, которые банк вправе
      и обязан осуществлять по счету, включая прием, зачисление, перечисление и выдачу средств.
    addressee: "Банк"

  account_tariffs_and_commissions_check:
    text: >
      Просим предоставить по {doc_names}: действующие тарифы банка,
      полный перечень комиссий и платежей, порядок изменения тарифов
      и способ уведомления клиента о таких изменениях.
    addressee: "Банк"

  tariff_transparency:
    text: >
      Просим предоставить по {doc_names}: полный перечень тарифов и комиссий,
      исключить открытые/неопределенные отсылки к будущим тарифам
      либо уточнить механизм уведомления и согласования изменений.
    addressee: "Банк / Юридический советник"

  bank_secrecy_clause:
    text: >
      Просим предоставить по {doc_names}: формулировки о банковской тайне,
      перечень охраняемых сведений и законные основания их раскрытия третьим лицам.
    addressee: "Банк"

  aml_blocking_check:
    text: >
      Просим предоставить по {doc_names}: AML/CFT-положения,
      перечень документов для идентификации/актуализации данных клиента,
      основания приостановления операций и порядок разблокировки счета.
    addressee: "Банк"

  aml_ctf_compliance:
    text: >
      Просим уточнить в {doc_names}: обязанности клиента по предоставлению документов
      для идентификации и прав банка в рамках 115-ФЗ.
    addressee: "Банк / Юридический советник"

  account_blocking_transparency:
    text: >
      Просим уточнить по {doc_names}: основания блокировки счета или приостановления операций,
      порядок уведомления клиента, перечень требуемых документов
      и процедуру возобновления операций.
    addressee: "Банк"

  unauthorized_debit_check:
    text: >
      Просим предоставить по {doc_names}: основания безакцептного списания,
      перечень случаев списания без распоряжения клиента, порядок уведомления клиента
      и механизм оспаривания несанкционированных списаний.
    addressee: "Банк"

  unauthorized_debit_protection:
    text: >
      Просим уточнить в {doc_names}: в каких случаях банк вправе списывать средства
      без распоряжения клиента, на каком правовом основании и как клиент уведомляется о таком списании.
    addressee: "Банк / Юридический советник"

  dbs_security_check:
    text: >
      Просим предоставить по {doc_names}: условия ДБО/интернет-банка,
      способы аутентификации, распределение ответственности при несанкционированном доступе
      и порядок экстренного уведомления банка о компрометации средств доступа.
    addressee: "Банк"

  electronic_banking_security:
    text: >
      Просим уточнить в {doc_names}: кто несет риск при несанкционированном доступе
      к интернет-банку/мобильному приложению, какие меры безопасности обязан соблюдать клиент
      и каков порядок блокировки электронных средств доступа.
    addressee: "Банк / Юридический советник"

  overdraft_terms_check:
    text: >
      По {doc_names} с овердрафтом просим предоставить:
      лимит овердрафта, процентную ставку, срок и порядок погашения,
      основания прекращения лимита и санкции за просрочку.
    addressee: "Банк"

  overdraft_terms:
    text: >
      Просим уточнить в {doc_names}: условия овердрафта,
      включая лимит, проценты, дату/срок погашения и порядок отражения задолженности.
    addressee: "Банк"

  overdraft_without_core_terms:
    text: >
      В {doc_names} выявлен риск неполного регулирования овердрафта.
      Просим срочно уточнить лимит, ставку, срок погашения и прочие существенные условия кредитования счета.
    addressee: "Банк / Юридический советник"

  account_closure_procedure:
    text: >
      Просим уточнить по {doc_names}: порядок закрытия счета,
      сроки прекращения обслуживания, судьбу остатка денежных средств
      и форму распоряжения клиента о закрытии счета.
    addressee: "Банк"

  interest_on_account_balance:
    text: >
      Просим уточнить по {doc_names}: начисляются ли проценты на остаток денежных средств на счете,
      по какой ставке, с какой периодичностью и может ли банк изменять такие условия.
    addressee: "Банк"

  tax_agent_obligations:
    text: >
      Просим предоставить по {doc_names}: правила удержания НДФЛ с процентов по вкладу,
      статус банка как налогового агента и порядок информирования клиента о налоговых удержаниях.
    addressee: "Банк / Налоговый консультант"

  court_and_enforcement_orders:
    text: >
      Просим уточнить в {doc_names}: порядок исполнения исполнительных документов,
      судебных актов, ареста счета и инкассовых поручений,
      а также практику/порядок информирования клиента о таких действиях.
    addressee: "Банк / Юридический советник"

  foreign_currency_terms_unclear:
    text: >
      В {doc_names} выявлен валютный элемент без достаточной ясности условий.
      Просим уточнить валюту счета/вклада, порядок конвертации,
      применимый курс и ограничения на совершение валютных операций.
    addressee: "Банк / Юридический советник"

  deposit_exceeds_insurance_limit:
    text: >
      ВНИМАНИЕ: по {doc_names} сумма вклада может превышать лимит страхового возмещения
      АСВ (1,4 млн руб.). Просим: (а) подтвердить сумму вклада;
      (б) проинформировать вкладчика о незастрахованной части;
      (в) рассмотреть разделение вклада между несколькими банками.
    addressee: "Вкладчик / Финансовый консультант"

  escrow_account_without_special_regime:
    text: >
      По {doc_names} — счёт эскроу. Просим подтвердить соблюдение специального режима
      (ст. 860.7-860.10 ГК РФ): (а) условия раскрытия средств;
      (б) запрет распоряжения средствами до наступления условий;
      (в) роли депонента и бенефициара.
    addressee: "Банк / Юридический советник"

  unilateral_tariff_change_consumer:
    text: >
      По {doc_names} — одностороннее изменение тарифов для физлица.
      Просим: (а) исключить право одностороннего изменения или
      (б) установить обязательное уведомление + право клиента расторгнуть договор
      без штрафных санкций.
    addressee: "Банк / Юридический советник"

  deposit_prolongation_check:
    text: >
      Просим уточнить по {doc_names}: (а) предусмотрена ли пролонгация/автопролонгация;
      (б) на каких условиях (ставка, срок); (в) сколько раз может продлеваться;
      (г) что происходит при отсутствии обращения вкладчика.
    addressee: "Банк"

  account_power_of_attorney_check:
    text: >
      Просим уточнить по {doc_names}: (а) кто вправе распоряжаться счётом;
      (б) порядок оформления доверенностей; (в) требования к подписям;
      (г) порядок отзыва полномочий.
    addressee: "Банк / Клиент"

  interest_calculation_method:
    text: >
      Просим уточнить по {doc_names}: (а) базу расчёта процентов (365/360 дней);
      (б) простые или сложные проценты; (в) периодичность начисления;
      (г) порядок округления.
    addressee: "Банк"

  dispute_resolution_banking:
    text: >
      Просим согласовать по {doc_names}: претензионный порядок,
      подсудность, возможность обращения к финансовому уполномоченному.
    addressee: "Юридический советник"

  personal_data_banking:
    text: >
      По {doc_names} просим уточнить: (а) порядок обработки ПД;
      (б) передачу данных третьим лицам (БКИ, коллекторы);
      (в) отдельное согласие на маркетинговые рассылки.
    addressee: "Банк / DPO"

  force_majeure_banking:
    text: >
      Просим уточнить для {doc_names} условия о форс-мажоре,
      включая санкционные ограничения и технические сбои.
    addressee: "Юридический советник"

  governing_law_banking:
    text: >
      Просим указать применимое право для {doc_names}.
    addressee: "Юридический советник"

  beneficiary_owner_disclosure:
    text: >
      Просим уточнить для {doc_names} порядок раскрытия бенефициарного владельца.
    addressee: "Банк / Комплаенс"

  account_statement_procedure:
    text: >
      Просим уточнить для {doc_names}: периодичность, форму и способ
      предоставления выписок по счёту.
    addressee: "Банк"

  # Generic fallback
  _default:
    text: >
      Просим предоставить дополнительную информацию по вопросу «{check_name}»
      применительно к {doc_names}.
    addressee: "Юридический советник"