    triggers:
      any: ["deposit_contract"]
    rules:
      keywords:
        - "срочный вклад"
        - "до востребования"
        - "срок вклада"
        - "на срок"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)срочн(ый|ого)\\s+вклад|до\\s+востребования"
