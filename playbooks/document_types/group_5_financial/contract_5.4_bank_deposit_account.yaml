      - "(?i)\\busd\\b"
      - "(?i)\\beur\\b"
      - "(?i)иностранн[а-яё]+\\s+валют[аа]"
      - "(?i)валютн[ыо]й\\s+сч[её]т"
      - "(?i)валютн[ыо]й\\s+вклад"
  deposit_insurance_relevant:
    any_keywords:
      - "(?i)страховани[ея]\\s+вклад[оо]в"
      - "(?i)\\bасв\\b"
      - "(?i)страхов[оа]е\\s+возмещени[ея]"
  escrow_account:
    any_keywords:
      - "(?i)\\bэскроу\\b"
      - "(?i)сч[её]т\\s+эскроу"
      - "(?i)\\bescrow\\b"
      - "(?i)депонировани[ея]\\s+средств"
      - "(?i)услови[яя]\\s+раскрыти[яя]"
  joint_account:
    any_keywords:
      - "(?i)совместн[ыо]й\\s+сч[её]т"
      - "(?i)несколько\\s+распорядител[еей]"
      - "(?i)доверенност[ьи]\\s+на\\s+сч[её]т"
      - "(?i)представител[ья]\\s+по\\s+сч[её]т[уу]"
      - "(?i)прав[оа]\\s+подпис[ии]"

# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 3: SHARED PATTERNS
#  Читается: DocTypeCheckLoader через _resolve_yaml_templates()
# ════════════════════════════════════════════════════════════════════════════

shared_patterns:
  money_amount: "(?i)\\b\\d[\\d\\s]*(?:руб|рублей|₽|коп|тыс|млн|млрд)"
  percentage_pattern: "(?i)\\b\\d+(?:[.,]\\d+)?\\s*%\\b"
  date_pattern: "(?i)\\b\\d{1,2}[.]\\d{1,2}[.]\\d{4}\\b"
  iban_or_account_pattern: "(?i)\\b4\\d{19}\\b|\\b\\d{20}\\b"
  license_pattern: "(?i)лиценз[ияе]\\s*(?:№|N|No\\.)?\\s*[A-ZА-Я0-9\\-/]+"

compliance_rules: []

# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 4: CHECKS_V8 — единственный рабочий слой юридического анализа
#  Читается: DocTypeCheckLoader._load_doc_type_checks()
# ════════════════════════════════════════════════════════════════════════════

checks_v8:

  - id: bank_deposit_parties_identification
    name: "Стороны договора: банк и клиент / вкладчик"
    description: >
      Фактографическая проверка идентификации банка и клиента / вкладчика,
      реквизитов, подписантов, оснований полномочий и указания на лицензию банка.
      Role-specific specialization поверх global checks
      party_identification_and_requisites / signatory_authority_and_basis /
      regulatory_licenses_and_permits — выделяет бизнес-роли «Банк» / «Клиент» /
      «Вкладчик» и тип клиента как deal-relevant факт.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "банк"
        - "кредитная организация"
        - "вкладчик"
        - "клиент"
        - "именуем"
        - "в лице"
        - "действующего на основании"
        - "ИНН"
        - "ОГРН"
        - "лицензия"
        - "корреспондентский счет"
        - "БИК"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)(банк|вкладчик|клиент).*именуем"
        - "(?i)действующ[а-я]+\\s+на\\s+основании"
        - "(?i)лиценз[ияе]"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор банковского вклада или банковского счета
        (Главы 44–45 ГК РФ, ФЗ «О банках и банковской деятельности»).
        Проверяется только один вопрос: идентификация банка и клиента / вкладчика,
        реквизиты, подписанты, основания полномочий и указание на лицензию банка.
        Нормативный ориентир:
        - ст. 834, 845 ГК РФ — стороны договора
        - ст. 13 ФЗ «О банках и банковской деятельности» — лицензирование
        Важно:
        - Твоя задача — не оценивать серьёзность риска.
        - Только установить, что прямо есть в тексте договора, а чего прямо нет.
        - Роли: Банк — кредитная организация; Клиент / Вкладчик — контрагент банка
          (юрлицо, ИП или физлицо). Для вклада физлица это deal-relevant факт
          (177-ФЗ о страховании вкладов).

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Наименование и основные реквизиты банка (ИНН, ОГРН, БИК, корр. счёт).
        2. Указание на лицензию банка.
        3. Тип клиента / вкладчика (юрлицо / ИП / физлицо).
        4. Наименование / ФИО и реквизиты клиента / вкладчика.
        5. Кто подписывает договор от каждой стороны и на каком основании.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Не путай «данные отсутствуют» и «данные есть, но вывод неоднозначен»:
          - если в тексте нет сведений — статус "not_defined", значение
            "Данные не определены";
          - если фрагмент есть, но из него нельзя сделать надёжный вывод —
            значение "Не удалось определить".
        4. Не используй "None", "null", пустые строки.
        5. В evidence включай только точные цитаты из договора.
        6. Не додумывай реквизиты, номера лицензий, ФИО подписантов.

        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1 — стороны определены:
        Фрагмент:
        "ПАО «Сбербанк» (ИНН 7707083893, ОГРН 1027700132195, БИК 044525225,
        лицензия Банка России № 1481), именуемое «Банк», в лице управляющего
        отделением Петрова П.П., действующего на основании доверенности № 55,
        и ООО «Альфа» (ИНН 7700000001), именуемое «Клиент», в лице
        Генерального директора Иванова И.И., действующего на основании Устава."
        Ответ:
        {
          "bank_details_status": "defined",
          "bank_details_value": "ПАО «Сбербанк», ИНН 7707083893, ОГРН 1027700132195, БИК 044525225",
          "bank_type": "credit_organization",
          "bank_license_status": "defined",
          "bank_license_details": "лицензия Банка России № 1481",
          "client_details_status": "defined",
          "client_details_value": "ООО «Альфа», ИНН 7700000001",
          "client_type": "legal_entity",
          "client_type_display": "Юридическое лицо",
          "client_signatory": "Генеральный директор Иванов И.И.",
          "client_signatory_basis": "charter",
          "bank_signatory": "Управляющий отделением Петров П.П.",
          "bank_signatory_basis": "poa",
          "evidence": [
            {
              "clause_ref": "Преамбула",
              "quote": "ПАО «Сбербанк» (ИНН 7707083893, ОГРН 1027700132195, БИК 044525225, лицензия Банка России № 1481), именуемое «Банк»."
            }
          ]
        }
        Пример 2 — данные отсутствуют:
        Фрагмент:
        "Банк открывает Клиенту счет."
        Ответ:
        {
          "bank_details_status": "not_defined",
          "bank_details_value": "Данные не определены",
          "bank_type": "not_defined",
          "bank_license_status": "not_defined",
          "bank_license_details": "Данные не определены",
          "client_details_status": "not_defined",
          "client_details_value": "Данные не определены",
          "client_type": "not_defined",
          "client_type_display": "Не удалось определить",
          "client_signatory": "Данные не определены",
          "client_signatory_basis": "not_defined",
          "bank_signatory": "Данные не определены",
          "bank_signatory_basis": "not_defined",
          "evidence": []
        }
        Пример 3 — физлицо-вкладчик подписывает лично:
        Фрагмент:
        "ПАО «Банк ВТБ» (ИНН 7702070139, ОГРН 1027739207462, БИК 044525411,
        генеральная лицензия № 1000), именуемое «Банк», в лице
        вице-президента Сидорова С.С., действующего на основании доверенности
        № 12/2024, и гражданин РФ Кузнецов К.К. (паспорт 45 00 123456),
        именуемый «Вкладчик»."
        Ответ:
        {
          "bank_details_status": "defined",
          "bank_details_value": "ПАО «Банк ВТБ», ИНН 7702070139, ОГРН 1027739207462, БИК 044525411",
          "bank_type": "credit_organization",
          "bank_license_status": "defined",
          "bank_license_details": "генеральная лицензия № 1000",
          "client_details_status": "defined",
          "client_details_value": "Кузнецов К.К., паспорт 45 00 123456",
          "client_type": "individual",
          "client_type_display": "Физическое лицо",
          "client_signatory": "Кузнецов К.К. (лично)",
          "client_signatory_basis": "personal",
          "bank_signatory": "Вице-президент Сидоров С.С.",
          "bank_signatory_basis": "poa",
          "evidence": [
            {
              "clause_ref": "Преамбула",
              "quote": "гражданин РФ Кузнецов К.К. (паспорт 45 00 123456), именуемый «Вкладчик»."
            }
          ]
        }
        Пример 4 — текст есть, но надёжный вывод сделать нельзя (неоднозначная
        формулировка о подписанте банка):
        Фрагмент:
        "ПАО «Сбербанк» (ИНН 7707083893, ОГРН 1027700132195, БИК 044525225),
        именуемое «Банк», в лице уполномоченного представителя, действующего
        на основании внутренних документов Банка, и ООО «Альфа» (ИНН 7700000001),
        именуемое «Клиент», в лице Генерального директора Иванова И.И.,
        действующего на основании Устава."
        Ответ:
        {
          "bank_details_status": "defined",
          "bank_details_value": "ПАО «Сбербанк», ИНН 7707083893, ОГРН 1027700132195, БИК 044525225",
          "bank_type": "credit_organization",
          "bank_license_status": "not_defined",
          "bank_license_details": "Данные не определены",
          "client_details_status": "defined",
          "client_details_value": "ООО «Альфа», ИНН 7700000001",
          "client_type": "legal_entity",
          "client_type_display": "Юридическое лицо",
          "client_signatory": "Генеральный директор Иванов И.И.",
          "client_signatory_basis": "charter",
          "bank_signatory": "Не удалось определить",
          "bank_signatory_basis": "not_defined",
          "evidence": [
            {
              "clause_ref": "Преамбула",
              "quote": "Банк в лице уполномоченного представителя, действующего на основании внутренних документов Банка."
            }
          ]
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату с идентификацией банка.
        2. Найди прямую цитату с идентификацией клиента / вкладчика.
        3. Найди прямую цитату о лицензии банка.
        4. Найди прямую цитату о подписантах и основаниях полномочий.
        5. Разграничь «данных нет» (Данные не определены) и «данные есть,
          но вывод неоднозначен» (Не удалось определить). Не додумывай.
        Не выводи шаги проверки — сформируй итоговый ответ согласно [ФОРМАТ ОТВЕТА].

        [ФОРМАТ ОТВЕТА]

        Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей.

        НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON,

        пригодным для парсинга через json.loads без предварительной обработки.
        Ответь РОВНО одним JSON-объектом без какого-либо дополнительного
        текста до или после, со всеми 14 ключами:
        {
          "bank_details_status": "<defined / not_defined>",
          "bank_details_value": "<текст / 'Данные не определены' / 'Не удалось определить'>",
          "bank_type": "<credit_organization / not_defined>",
          "bank_license_status": "<defined / not_defined>",
          "bank_license_details": "<текст / 'Данные не определены' / 'Не удалось определить'>",
          "client_details_status": "<defined / not_defined>",
          "client_details_value": "<текст / 'Данные не определены' / 'Не удалось определить'>",
          "client_type": "<legal_entity / individual_entrepreneur / individual / not_defined>",
          "client_type_display": "<Юридическое лицо / Индивидуальный предприниматель / Физическое лицо / Не удалось определить>",
          "client_signatory": "<текст / 'Данные не определены' / 'Не удалось определить'>",
          "client_signatory_basis": "<charter / poa / order / personal / other / not_defined>",
          "bank_signatory": "<текст / 'Данные не определены' / 'Не удалось определить'>",
          "bank_signatory_basis": "<charter / poa / order / other / not_defined>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 8
      temperature: 0.0
      max_tokens: 700

    retrieval:
      retrieval_profile: "party_identification_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "банк кредитная организация вкладчик клиент именуем в лице действующего на основании ИНН ОГРН БИК лицензия корреспондентский счет реквизиты"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - representations
        - boilerplate
      negative_keywords:
        - "процентная ставка"
        - "тариф"
        - "комиссия"
        - "овердрафт"
        - "115-ФЗ"
        - "безакцептное"
        - "ДБО"
        - "страхование"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.0, 0.20]
        boost: 0.30
        scope: segment
      context_k: 8
      max_chunks: 10
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "representations"
        - "boilerplate"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.15

    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 600

    extraction:

      enabled: true
      mode: "hybrid"
      compact_output: false
      llm_max_tokens: 1400

      presence_signal:
        field: "bank_deposit_parties_identification_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора банковского вклада
        или банковского счета сведения о банке и клиенте / вкладчике:
        реквизиты, лицензию банка, подписантов и основания полномочий,
        а также тип клиента в читаемом виде.
        Не анализируй проценты, тарифы, AML или ДБО.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. bank_deposit_parties_identification_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (bank_details_status, bank_license_status, client_details_status,
              client_signatory_basis, bank_signatory_basis) ≠ "not_defined";
           - "missing" — если все пять содержательных полей = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - bank_details_status = "not_defined";
           - bank_type = "not_defined";
           - bank_license_status = "not_defined";
           - client_details_status = "not_defined";
           - client_type = "not_defined";
           - client_signatory_basis = "not_defined";
           - bank_signatory_basis = "not_defined";
           - bank_details_value, client_details_value = "Данные не определены";
           - bank_license_details = "Данные не определены";
           - client_type_display = "Не удалось определить";
           - client_signatory, bank_signatory = "Данные не определены";
           - не выполняй остальные шаги.

        1. bank_details_status:
           - "defined" — если банк прямо идентифицирован (наименование и хотя бы один реквизит);
           - "not_defined" — если банк прямо не идентифицирован.

        2. bank_details_value:
           Наименование и основные реквизиты банка (ИНН, ОГРН, БИК, корр. счёт).
           Если данных нет — "Данные не определены";
           если фрагмент есть, но неоднозначен — "Не удалось определить".

        3. bank_type:
           "credit_organization" / "not_defined".

        4. bank_license_status:
           - "defined" — если лицензия банка прямо указана в тексте;
           - "not_defined" — если лицензия прямо не указана.

        5. bank_license_details:
           Номер и реквизиты лицензии банка.
           Если лицензия в договоре не указана — "Данные не определены".
           Если фрагмент есть, но неоднозначен — "Не удалось определить".

        6. client_details_status:
           - "defined" — если клиент / вкладчик прямо идентифицирован (наименование/ФИО и хотя бы один реквизит);
           - "not_defined" — если клиент прямо не идентифицирован.

        7. client_details_value:
           Наименование / ФИО и реквизиты клиента или вкладчика.
           Если данных нет — "Данные не определены";
           если фрагмент есть, но неоднозначен — "Не удалось определить".

        8. client_type:
           "legal_entity" / "individual_entrepreneur" / "individual" / "not_defined".

        9. client_type_display:
           Читаемый тип клиента для DD Grid. Строго соответствует client_type:
           legal_entity → "Юридическое лицо";
           individual_entrepreneur → "Индивидуальный предприниматель";
           individual → "Физическое лицо";
           not_defined → "Не удалось определить".

        10. client_signatory:
            Подписант клиента. Для физлица-вкладчика, который подписывает лично, — "Кузнецов К.К. (лично)" или аналогичная формулировка.
            Если данных нет — "Данные не определены";
            если фрагмент есть, но неоднозначен — "Не удалось определить".

        11. client_signatory_basis:
            charter / poa / order / personal / other / not_defined.
            "personal" используется только когда подписант = сам вкладчик-физлицо.

        12. bank_signatory:
            Подписант банка.
            Если данных нет — "Данные не определены";
            если фрагмент есть, но неоднозначен — "Не удалось определить".

        13. bank_signatory_basis:
            charter / poa / order / other / not_defined.

        14. evidence:
            Массив объектов [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}].
            Включай только прямые цитаты из договора. Если прямых цитат нет — пустой массив.
        </task>

        <context_rules>
        - Перед остальными полями заполни bank_deposit_parties_identification_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все содержательные поля = "not_defined", все *_value = "Данные не определены", все *_display = "Данные не определены" / "Не удалось определить".
        - Используй только текст договора.
        - Не подставляй нормы закона вместо текста договора.
        - Не додумывай реквизиты, номера лицензий, ФИО подписантов.
        - bank_license_status = "defined" только если номер или реквизиты лицензии прямо указаны в тексте.
        - client_type:
          "legal_entity" — ООО, АО, ПАО и иные юрлица;
          "individual_entrepreneur" — ИП (указан ОГРНИП);
          "individual" — физическое лицо без статуса ИП;
          "not_defined" — тип прямо не указан.
        - client_type_display должен строго соответствовать client_type.
        - client_signatory_basis = "personal" только когда подписант — сам вкладчик-физлицо.
        - Если в преамбуле указан только уполномоченный представитель без ФИО и без конкретного документа — bank_signatory = "Не удалось определить", bank_signatory_basis = "not_defined".
        - Не используй "None", "null", пустые строки.
        - Все текстовые значения пиши на русском языке, кроме служебных enum-значений status-полей.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни упоминания сторон, ни их реквизитов, ни подписантов,
           ни указания на лицензию банка.
           → presence = "missing";
             bank_details_status = client_details_status = "not_defined";
             bank_type = "not_defined";
             bank_license_status = "not_defined";
             client_type = "not_defined";
             bank_signatory_basis = client_signatory_basis = "not_defined";
             все *_value / *_display = "Данные не определены".

        2. Прямое исключение или явное отсутствие.
           В договоре прямо указано, что данные не раскрываются, либо
           содержится явная формулировка об отсутствии условия.
           → presence = "present";
             соответствующий *_status = "not_defined";
             *_value содержит дословную цитату об исключении.

        3. Противоречие между фрагментами.
           В разных фрагментах указаны разные ФИО/ИНН для одной стороны,
           разные номера лицензий или противоречивые основания полномочий.
           → presence = "unclear";
             соответствующий *_status = "not_defined";
             *_value = "Не удалось определить".

        4. Только роли без идентификации.
           Упомянуты «Банк» и «Клиент», но без реквизитов, ФИО, лицензии.
           → presence = "present";
             *_status = "not_defined";
             *_value = "Данные не определены".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для bank_deposit_parties_identification_presence используй только: "present", "missing", "unclear".
        - Для status-полей используй только: "defined" или "not_defined".
        - Для enum-полей *_basis используй только значения из allowed_values.
        - Fallback при отсутствии данных:
          * bank_details_value, client_details_value → "Данные не определены";
          * bank_license_details → "Данные не определены";
          * client_type_display → "Не удалось определить";
          * client_signatory, bank_signatory → "Данные не определены".
        - Fallback при противоречии или неоднозначности:
          * все *_value / *_display → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "bank_deposit_parties_identification_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие идентификации сторон / лицензии банка в договоре. Внутреннее агрегатное signal-поле."
          required: true

        - name: "bank_details_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус идентификации банка."
          required: true
          display_in_grid: false

        - name: "bank_details_value"
          type: "string"
          presentation: "fact"
          label: "Банк: реквизиты"
          description: "Наименование и основные реквизиты банка (ИНН, ОГРН, БИК, корр. счёт)."
          required: true
          display_in_grid: true
          display_priority: 1

        - name: "bank_type"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["credit_organization", "not_defined"]
          description: "Тип банка."
          required: true
          display_in_grid: false

        - name: "bank_license_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус указания лицензии банка."
          required: true
          display_in_grid: false

        - name: "bank_license_details"
          type: "string"
          presentation: "fact"
          label: "Лицензия банка"
          description: "Номер и реквизиты лицензии банка."
          required: true
          display_in_grid: true
          display_priority: 2

        - name: "client_details_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус идентификации клиента / вкладчика."
          required: true
          display_in_grid: false

        - name: "client_details_value"
          type: "string"
          presentation: "fact"
          label: "Клиент / Вкладчик: реквизиты"
