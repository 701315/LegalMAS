        excluded_unit_types:
          - definition
          - structural_anchor
          - technical_fragment
        preferred_clause_functions:
          - obligations
          - definitions
        negative_keywords:
          - "тариф"
          - "комиссия"
          - "овердрафт"
          - "115-ФЗ"
          - "безакцептное"
          - "ДБО"
          - "страхование"
          - "закрытие счета"
          - "означает"
          - "в целях настоящего"
        position_bias:
          preferred_range: [0.10, 0.50]
          boost: 0.18
          scope: segment
        context_k: 6
        max_chunks: 8
        rerank: true
        enrichment_hints:
