        - "досрочный возврат вклада"
        - "выдача вклада"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)возврат\\s+вклад"
        - "(?i)досрочн(ое|ого)\\s+(расторжен|возврат)"

  - id: "deposit_insurance_disclosure"
