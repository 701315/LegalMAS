        - "кредитная организация"
        - "лицензия банка россии"
        - "генеральная лицензия"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)(банк|кредитная\\s+организация)"
        - "(?i)лиценз"

  - id: "deposit_amount_and_currency"
    name: "Вклад: сумма и валюта"
    description: "Проверяет наличие суммы и валюты вклада"
    legal_base: "ст. 836, 837 ГК РФ"
    severity: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers:
      any: ["deposit_contract"]
    rules:
      keywords:
        - "сумма вклада"
        - "размер вклада"
        - "валюта вклада"
        - "депозит"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)(сумма|размер)\\s+вклад"
        - "(?i)\\b\\d[\\d\\s]*(?:руб|рублей|₽|тыс|млн|млрд|usd|eur|доллар|евро)"

  - id: "deposit_type_and_term"
