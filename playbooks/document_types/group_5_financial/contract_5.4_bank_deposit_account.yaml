# CHECK 9: Овердрафт
# ──────────────────────────────────────────────────────────────────────────
  - id: overdraft_terms_check
    name: "Овердрафт: лимит, проценты, срок погашения (ст. 850 ГК РФ)"
    description: >
      Фактографическая проверка условий овердрафта: лимит, проценты,
      срок и порядок погашения, основания прекращения лимита.
    triggers:
      any: ["overdraft_present"]
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "овердрафт"
        - "кредитование счета"
        - "лимит овердрафта"
        - "проценты за овердрафт"
        - "срок погашения"
        - "дебетовое сальдо"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)овердрафт|кредитовани[ея]\\s+сч"
        - "(?i)лимит\\s+овердрафт"
        - "(?i)процент(ы|ная\\s+ставка).{0,30}овердрафт"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор банковского счёта с овердрафтом (ст. 850 ГК РФ).
        Проверяется только один вопрос: условия овердрафта.
        Нормативный ориентир:
        - ст. 850 ГК РФ — кредитование счёта
        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора.
        - Не оценивай серьёзность риска.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Есть ли лимит овердрафта.
        2. Есть ли проценты за овердрафт.
        3. Есть ли срок / порядок погашения.
        4. Есть ли основания прекращения лимита.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Если данные не указаны прямо — возвращай "not_defined".
        3. Верни только один JSON-объект.

        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1:
        Фрагмент:
        "Лимит овердрафта — 500 000 рублей. Процентная ставка за пользование
        овердрафтом — 20% годовых. Погашение овердрафта — не позднее 30 дней
        с даты возникновения."
        Ответ:
        {
          "overdraft_limit_status": "defined",
          "overdraft_limit_details": "500 000 рублей",
          "overdraft_interest_status": "defined",
          "overdraft_interest_details": "20% годовых",
          "repayment_status": "defined",
          "repayment_details": "не позднее 30 дней с даты возникновения",
          "termination_grounds_status": "not_defined",
          "termination_grounds_details": "Данные не определены",
          "evidence": [
            {
              "clause_ref": "п. 8.1",
              "quote": "Лимит овердрафта — 500 000 рублей. Процентная ставка за пользование овердрафтом — 20% годовых."
            }
          ]
        }
        Пример 2:
        Фрагмент:
        "Банк предоставляет овердрафт по счёту."
        Ответ:
        {
          "overdraft_limit_status": "not_defined",
          "overdraft_limit_details": "Данные не определены",
          "overdraft_interest_status": "not_defined",
          "overdraft_interest_details": "Данные не определены",
          "repayment_status": "not_defined",
          "repayment_details": "Данные не определены",
          "termination_grounds_status": "not_defined",
          "termination_grounds_details": "Данные не определены",
          "evidence": [
            {
              "clause_ref": "п. 8.1",
              "quote": "Банк предоставляет овердрафт по счёту."
            }
          ]
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о лимите овердрафта.
        2. Найди прямую цитату о процентах.
        3. Найди прямую цитату о сроке / порядке погашения.
        4. Найди прямую цитату об основаниях прекращения лимита.
        5. Если прямой цитаты нет — верни "not_defined".
        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "overdraft_limit_status": "<defined / not_defined>",
          "overdraft_limit_details": "<текст или 'Данные не определены'>",
          "overdraft_interest_status": "<defined / not_defined>",
          "overdraft_interest_details": "<текст или 'Данные не определены'>",
          "repayment_status": "<defined / not_defined>",
          "repayment_details": "<текст или 'Данные не определены'>",
          "termination_grounds_status": "<defined / not_defined>",
          "termination_grounds_details": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 5
      temperature: 0.0
      max_tokens: 600
      retrieval:
        retrieval_profile: "overdraft_check"
        corpus_scope: "primary_segment"
        levels:
          - "legal_unit"
          - "section"
        required_kind: "legal_unit"
        retrieval_query: "овердрафт кредитование счета лимит овердрафта проценты за овердрафт срок погашения дебетовое сальдо"
        preferred_unit_types:
          - obligation
          - general_provision
        excluded_unit_types:
          - definition
          - structural_anchor
          - technical_fragment
        preferred_clause_functions:
          - obligations
          - definitions
        negative_keywords:
          - "процентная ставка по вкладу"
          - "тариф"
          - "комиссия"
          - "115-ФЗ"
          - "безакцептное"
          - "ДБО"
          - "страхование"
          - "закрытие счета"
          - "означает"
          - "в целях настоящего"
        position_bias:
          preferred_range: [0.30, 0.75]
          boost: 0.15
          scope: segment
        context_k: 5
        max_chunks: 7
        rerank: true
        enrichment_hints:
          preferred_segment_types:
            - "contract"
            - "amendment"
          excluded_segment_types:
            - "technical_specification"
            - "price_list"
          preferred_clause_functions:
            - "obligations"
            - "definitions"
          confidence_bonus_on_match: 0.10
          confidence_penalty_on_excluded_segment: 0.12
      evidence:
        required: true
        min_snippet_length: 35
        max_snippet_length: 550
      extraction:
        enabled: true
        mode: "hybrid"
        compact_output: false
        llm_max_tokens: 800
        llm_prompt_extraction: |
          <role>
          Ты — российский юрист. Извлеки из текста договора банковского счёта
          условия овердрафта: лимит, проценты, погашение, прекращение лимита.
          Не анализируй тарифы, AML, ДБО или страхование.
          </role>
          <context>
          {context}
          </context>
          <task>
          1. overdraft_limit_status — "defined" если лимит прямо указан.
          2. overdraft_limit_details — размер лимита.
          3. overdraft_interest_status — "defined" если проценты прямо указаны.
          4. overdraft_interest_details — размер процентов.
          5. repayment_status — "defined" если срок / порядок погашения указан.
          6. repayment_details — формулировка.
          7. termination_grounds_status — "defined" если основания прекращения
            лимита указаны.
          8. termination_grounds_details — формулировка.
          Если данные отсутствуют: статус = "not_defined",
          текст = "Данные не определены".
          </task>
          <rules>
          - Используй только текст договора.
          - Не выводи условия овердрафта из ст. 850 ГК РФ.
          - Верни только JSON.
          </rules>
        fields:
          - name: "overdraft_limit_status"
            type: "string"
            presentation: "signal"
            allowed_values: ["defined", "not_defined"]
            description: "Статус лимита овердрафта."
            required: true
          - name: "overdraft_limit_details"
            type: "string"
            presentation: "fact"
