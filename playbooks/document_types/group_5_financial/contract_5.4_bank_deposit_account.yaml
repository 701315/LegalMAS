# ════════════════════════════════════════════════════════════════════════════
# БЛОК 5: DD_REQUEST_TEMPLATES
# Читается: DDRequestTemplateLoader
# ════════════════════════════════════════════════════════════════════════════
dd_request_templates:
  bank_deposit_parties_identification:
    text: >
      Просим подтвердить по {doc_names}: реквизиты банка (ИНН, ОГРН, БИК,
      номер лицензии), реквизиты клиента / вкладчика, полномочия подписантов
      и правовое основание, по которому банк вправе осуществлять соответствующую
      банковскую операцию.
    addressee: "Банк / Клиент"
  bank_deposit_account_subject_extraction:
    text: >
      Просим предоставить по {doc_names}: сумму вклада или тип счёта, валюту,
      срок, тип договора (вклад / счёт), вид вклада (срочный / до востребования)
      и подтверждение передачи / зачисления средств.
    addressee: "Банк / Клиент"
  deposit_interest_and_fixation_check:
    text: >
      Просим уточнить в {doc_names}: процентную ставку, порядок начисления,
      капитализацию процентов, а также право банка изменять ставку и условия
      такого изменения.
    addressee: "Банк"
  deposit_early_withdrawal_check:
    text: >
      Просим уточнить в {doc_names}: право вкладчика на досрочный возврат,
      порядок пересчета процентов при досрочном возврате, ограничения
      досрочного возврата и порядок / срок возврата средств.
    addressee: "Банк / Вкладчик"
  account_tariffs_and_commissions_check:
    text: >
      Просим предоставить по {doc_names}: действующие тарифы банка, полный
      перечень комиссий, право банка изменять тарифы и порядок уведомления
      об изменениях.
    addressee: "Банк"
  aml_blocking_check:
    text: >
      Просим предоставить по {doc_names}: AML/CFT-положения, перечень документов
      для идентификации, основания приостановления операций и порядок
      разблокировки счёта.
    addressee: "Банк / Комплаенс"
  unauthorized_debit_check:
    text: >
      Просим уточнить в {doc_names}: основания безакцептного списания, перечень
      случаев списания без распоряжения клиента, порядок уведомления клиента
      и защиту от несанкционированных списаний.
    addressee: "Банк / Юридический советник"
  dbs_security_check:
    text: >
      Просим предоставить по {doc_names}: условия ДБО, механизм аутентификации,
      распределение ответственности за инциденты и порядок уведомления
      о компрометации средств доступа.
    addressee: "Банк / IT-служба"
  overdraft_terms_check:
    text: >
      Просим уточнить в {doc_names}: лимит овердрафта, процентную ставку,
      срок и порядок погашения, а также основания прекращения лимита.
    addressee: "Банк"
  _default:
    text: >
      Просим предоставить дополнительную информацию по вопросу «{check_name}»
      применительно к {doc_names}.
    addressee: "Юридический советник"


