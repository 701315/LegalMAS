        - "плата за ведение счета"
        - "изменение тарифов"
        - "в одностороннем порядке"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)тариф(ы|ов)\\s+банка"
        - "(?i)комисси|плата\\s+за\\s+ведение\\s+счета"
        - "(?i)изменени[ея]\\s+тариф"
    llm:
      prompt_template: |
        Ты — юридический ассистент, анализирующий договор банковского счета.
        Проверь тарифы и комиссии.

        Ответь строго в JSON:
        {
          "tariff_disclosure_status": "<clear / partial / not_found>",
          "fee_list_status": "<enumerated / vague / not_found>",
          "unilateral_change_right": "<present / not_found>",
          "notice_of_tariff_change": "<present / not_found>"
        }

        Используй только текст документа.
      prompt_file: null
      context_k: 5
      temperature: 0.0
      max_tokens: 360
    retrieval:
      context_k: 5
      max_chunks: 8
      boost_keywords:
        - "тарифы банка"
        - "комиссия"
        - "изменение тарифов"
      rerank: true
      filters: {}
    evidence:
      required: true
      min_snippet_length: 35
      max_snippet_length: 550
    extraction:
      enabled: true
      mode: "hybrid"
      fields:
        - name: "tariff_disclosure_status"
          type: "string"
          allowed_values: ["clear", "partial", "not_found"]
          description: "Понятность раскрытия тарифов"
        - name: "fee_list_status"
          type: "string"
          allowed_values: ["enumerated", "vague", "not_found"]
          description: "Статус перечня комиссий"
        - name: "unilateral_change_right"
          type: "string"
          allowed_values: ["present", "not_found"]
          description: "Есть ли право банка менять тарифы"
        - name: "notice_of_tariff_change"
          type: "string"
          allowed_values: ["present", "not_found"]
          description: "Есть ли порядок уведомления об изменении тарифов"
      store_payload: true

  - id: aml_blocking_check
    name: "ПОД/ФТ: идентификация клиента и приостановление операций"
    description: "Проверяет AML/CFT-положения, право банка требовать документы и основания приостановления операций"
    triggers:
      any: ["bank_account_contract", "aml_ctf_terms"]
    severity: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "115-фз"
        - "идентификация клиента"
        - "подозрительные операции"
        - "приостановление операций"
        - "документы для идентификации"
        - "блокировка счета"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)115[- ]?фз"
        - "(?i)идентификац"
        - "(?i)приостановлени[ея]\\s+операц|блокировк[аи]\\s+счета"
    llm:
      prompt_template: |
        Ты — юридический ассистент, анализирующий банковский договор.
        Проверь AML/CFT-положения.

        Ответь строго в JSON:
        {
          "aml_terms_status": "<present / partial / not_found>",
          "bank_document_request_right": "<present / not_found>",
          "blocking_grounds_disclosed": "<yes / no / not_found>",
          "unblocking_mechanism": "<present / not_found>"
        }

        Используй только текст договора.
      prompt_file: null
      context_k: 5
      temperature: 0.0
      max_tokens: 360
    retrieval:
      context_k: 5
      max_chunks: 8
      boost_keywords:
        - "115-фз"
        - "идентификация клиента"
        - "блокировка счета"
        - "приостановление операций"
      rerank: true
      filters: {}
    evidence:
      required: true
      min_snippet_length: 35
      max_snippet_length: 550
    extraction:
      enabled: true
      mode: "hybrid"
      fields:
        - name: "aml_terms_status"
          type: "string"
          allowed_values: ["present", "partial", "not_found"]
          description: "Статус AML/CFT-условий"
        - name: "bank_document_request_right"
          type: "string"
          allowed_values: ["present", "not_found"]
          description: "Есть ли право банка запрашивать документы"
        - name: "blocking_grounds_disclosed"
          type: "string"
          allowed_values: ["yes", "no", "not_found"]
          description: "Раскрыты ли основания блокировки/приостановления"
        - name: "unblocking_mechanism"
          type: "string"
          allowed_values: ["present", "not_found"]
          description: "Есть ли механизм разблокировки"
      store_payload: true

  - id: unauthorized_debit_check
    name: "Безакцептное списание и несанкционированные операции"
    description: "Проверяет основания списания без распоряжения клиента и защиту от несанкционированных списаний"
    triggers:
      any: ["bank_account_contract"]
    severity: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "безакцептное списание"
        - "списание без распоряжения"
        - "инкассовое поручение"
        - "не санкционирован"
        - "уведомление о списании"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)безакцептн(ое|ого)\\s+списан"
        - "(?i)списани[ея].{0,40}без\\s+распоряжен"
        - "(?i)инкассов(ое|ого)\\s+поручени"
    llm:
      prompt_template: |
        Ты — юридический ассистент, анализирующий договор банковского счета.
        Проверь основания списания средств без распоряжения клиента и защиту от несанкционированных операций.

        Ответь строго в JSON:
        {
          "debit_without_client_order_status": "<regulated / not_found>",
          "legal_basis_of_debit": "<law_only / law_and_contract / unclear / not_found>",
          "client_notice_mechanism": "<present / not_found>",
          "unauthorized_debit_risk": "<high / medium / low / not_found>"
        }

        Используй только текст договора.
      prompt_file: null
      context_k: 5
      temperature: 0.0
      max_tokens: 360
    retrieval:
      context_k: 5
      max_chunks: 7
      boost_keywords:
        - "безакцептное списание"
        - "инкассовое поручение"
        - "уведомление о списании"
      rerank: true
      filters: {}
    evidence:
      required: true
      min_snippet_length: 35
      max_snippet_length: 550
    extraction:
      enabled: true
      mode: "hybrid"
      fields:
        - name: "debit_without_client_order_status"
          type: "string"
