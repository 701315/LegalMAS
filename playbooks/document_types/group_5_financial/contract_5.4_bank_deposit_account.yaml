        - Не оценивай серьёзность риска.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Есть ли право вкладчика на досрочный возврат.
        2. Порядок пересчета процентов при досрочном возврате.
        3. Есть ли ограничения досрочного возврата.
        4. Порядок и срок возврата средств.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Если данные не указаны прямо — возвращай "not_defined".
        3. Верни только один JSON-объект.

        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1:
        Фрагмент:
        "Вкладчик вправе истребовать вклад досрочно. При досрочном возврате
