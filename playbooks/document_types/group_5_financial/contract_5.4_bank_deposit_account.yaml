shared_patterns:
  money_amount: "(?i)\\b\\d[\\d\\s]*(?:руб|рублей|₽|коп|тыс|млн|млрд)"
  percentage_pattern: "(?i)\\b\\d+(?:[.,]\\d+)?\\s*%\\b"
  date_pattern: "(?i)\\b\\d{1,2}[.]\\d{1,2}[.]\\d{4}\\b"
  iban_or_account_pattern: "(?i)\\b4\\d{19}\\b|\\b\\d{20}\\b"
  license_pattern: "(?i)лиценз[ияе]\\s*(?:№|N|No\\.)?\\s*[A-ZА-Я0-9\\-/]+"

compliance_rules: []

# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 4: CHECKS_V8 — единственный рабочий слой юридического анализа
#  Читается: DocTypeCheckLoader._load_doc_type_checks()
# ════════════════════════════════════════════════════════════════════════════

checks_v8:

# ──────────────────────────────────────────────────────────────────────────
# CHECK 1: Стороны договора — банк и клиент
# ──────────────────────────────────────────────────────────────────────────
  - id: bank_deposit_parties_identification
    name: "Стороны договора: банк и клиент / вкладчик"
    description: >
      Фактографическая проверка идентификации банка и клиента / вкладчика,
      реквизитов, подписантов, оснований полномочий и указания на лицензию банка.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "банк"
        - "кредитная организация"
        - "вкладчик"
        - "клиент"
        - "именуем"
        - "в лице"
        - "действующего на основании"
        - "ИНН"
        - "ОГРН"
        - "лицензия"
        - "корреспондентский счет"
        - "БИК"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)(банк|вкладчик|клиент).*именуем"
        - "(?i)действующ[а-я]+\\s+на\\s+основании"
        - "(?i)лиценз[ияе]"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор банковского вклада или банковского счета
        (Главы 44–45 ГК РФ, ФЗ «О банках и банковской деятельности»).
        Проверяется только один вопрос: идентификация банка и клиента / вкладчика,
        реквизиты, подписанты, основания полномочий и указание на лицензию банка.
        Нормативный ориентир:
        - ст. 834, 845 ГК РФ — стороны договора
        - ст. 13 ФЗ «О банках и банковской деятельности» — лицензирование
        Важно:
        - Твоя задача — не оценивать серьёзность риска.
        - Только установить, что прямо есть в тексте договора, а чего прямо нет.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Наименование и реквизиты банка (ИНН, ОГРН, БИК, корр. счёт, адрес).
        2. Указание на лицензию банка.
        3. Тип клиента / вкладчика (юрлицо / ИП / физлицо).
        4. Наименование и реквизиты клиента / вкладчика.
        5. Кто подписывает договор от каждой стороны и на каком основании.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Если данные не указаны прямо — возвращай "not_defined" / "Данные не определены".
        4. Не используй "None", "null", "not_defined" или пустые строки.
        5. В evidence включай только текст договора.
        6. Верни только один JSON-объект.

        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1 — стороны определены:
        Фрагмент:
        "ПАО «Сбербанк» (ИНН 7707083893, ОГРН 1027700132195, БИК 044525225,
        лицензия Банка России № 1481), именуемое «Банк», в лице управляющего
        отделением Петрова П.П., действующего на основании доверенности № 55,
        и ООО «Альфа» (ИНН 7700000001), именуемое «Клиент», в лице
        Генерального директора Иванова И.И., действующего на основании Устава."
        Ответ:
        {
          "bank_details_status": "defined",
          "bank_details_value": "ПАО «Сбербанк», ИНН 7707083893, ОГРН 1027700132195, БИК 044525225",
          "bank_type": "credit_organization",
          "bank_license_status": "defined",
          "bank_license_details": "лицензия Банка России № 1481",
          "client_details_status": "defined",
          "client_details_value": "ООО «Альфа», ИНН 7700000001",
          "client_type": "legal_entity",
          "client_signatory": "Генеральный директор Иванов И.И.",
          "client_signatory_basis": "charter",
          "bank_signatory": "Управляющий отделением Петров П.П.",
          "bank_signatory_basis": "poa",
          "evidence": [
            {
              "clause_ref": "Преамбула",
              "quote": "ПАО «Сбербанк» (ИНН 7707083893, ОГРН 1027700132195, БИК 044525225, лицензия Банка России № 1481), именуемое «Банк»."
            }
          ]
        }
        Пример 2 — данные отсутствуют:
        Фрагмент:
        "Банк открывает Клиенту счет."
        Ответ:
        {
          "bank_details_status": "not_defined",
          "bank_details_value": "Данные не определены",
          "bank_type": "not_defined",
          "bank_license_status": "not_defined",
          "bank_license_details": "Данные не определены",
          "client_details_status": "not_defined",
          "client_details_value": "Данные не определены",
          "client_type": "not_defined",
          "client_signatory": "Данные не определены",
          "client_signatory_basis": "not_defined",
          "bank_signatory": "Данные не определены",
          "bank_signatory_basis": "not_defined",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату с идентификацией банка.
        2. Найди прямую цитату с идентификацией клиента / вкладчика.
        3. Найди прямую цитату о лицензии банка.
        4. Найди прямую цитату о подписантах и основаниях полномочий.
        5. Если прямой цитаты нет — верни "not_defined". Не додумывай реквизиты.
        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "bank_details_status": "<defined / not_defined>",
          "bank_details_value": "<текст или 'Данные не определены'>",
          "bank_type": "<credit_organization / not_defined>",
          "bank_license_status": "<defined / not_defined>",
          "bank_license_details": "<текст или 'Данные не определены'>",
          "client_details_status": "<defined / not_defined>",
          "client_details_value": "<текст или 'Данные не определены'>",
          "client_type": "<legal_entity / individual_entrepreneur / individual / not_defined>",
          "client_signatory": "<текст или 'Данные не определены'>",
          "client_signatory_basis": "<charter / poa / order / personal / other / not_defined>",
          "bank_signatory": "<текст или 'Данные не определены'>",
          "bank_signatory_basis": "<charter / poa / order / other / not_defined>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 700
      retrieval:
        retrieval_profile: "party_identification_check"
        corpus_scope: "primary_segment"
        levels:
          - "legal_unit"
          - "section"
        required_kind: "legal_unit"
        retrieval_query: "банк кредитная организация вкладчик клиент именуем в лице действующего на основании ИНН ОГРН БИК лицензия корреспондентский счет реквизиты"
        preferred_unit_types:
          - obligation
          - general_provision
        excluded_unit_types:
          - definition
          - structural_anchor
          - technical_fragment
        preferred_clause_functions:
          - representations
          - boilerplate
        negative_keywords:
          - "процентная ставка"
          - "тариф"
          - "комиссия"
          - "овердрафт"
          - "115-ФЗ"
          - "безакцептное"
          - "ДБО"
          - "страхование"
          - "означает"
          - "в целях настоящего"
        position_bias:
          preferred_range: [0.0, 0.20]
          boost: 0.30
          scope: segment
        context_k: 6
        max_chunks: 8
        rerank: true
        enrichment_hints:
          preferred_segment_types:
            - "contract"
            - "amendment"
          excluded_segment_types:
            - "technical_specification"
            - "price_list"
          preferred_clause_functions:
            - "representations"
            - "boilerplate"
          confidence_bonus_on_match: 0.08
          confidence_penalty_on_excluded_segment: 0.15
      evidence:
        required: true
        min_snippet_length: 40
        max_snippet_length: 600
      extraction:
        enabled: true
        mode: "hybrid"
        compact_output: false
        llm_max_tokens: 1300
        llm_prompt_extraction: |
          <role>
          Ты — российский юрист. Извлеки из текста договора банковского вклада
          или банковского счета сведения о банке и клиенте / вкладчике:
          реквизиты, лицензию банка, подписантов и основания полномочий.
          Не анализируй проценты, тарифы, AML или ДБО.
          </role>
          <context>
          {context}
          </context>
          <task>
          Заполни строго следующие поля:
          1. bank_details_status — "defined" если банк прямо идентифицирован,
          иначе "not_defined".
          2. bank_details_value — наименование и реквизиты банка.
          3. bank_type — "credit_organization" / "not_defined".
          4. bank_license_status — "defined" если лицензия прямо указана.
          5. bank_license_details — номер и реквизиты лицензии.
          6. client_details_status — "defined" если клиент прямо идентифицирован.
          7. client_details_value — наименование / ФИО и реквизиты клиента.
          8. client_type — "legal_entity" / "individual_entrepreneur" /
          "individual" / "not_defined".
          9. client_signatory — подписант клиента.
          10. client_signatory_basis — charter / poa / order / personal / other /
          not_defined.
          11. bank_signatory — подписант банка.
          12. bank_signatory_basis — charter / poa / order / other / not_defined.
          Если данные отсутствуют:
          - статус = "not_defined"
          - текст = "Данные не определены"
          </task>
          <rules>
          - Используй только текст договора.
          - bank_license_status = "defined" только если номер или реквизиты
            лицензии прямо указаны в тексте.
          - client_type:
            "legal_entity" — ООО, АО, ПАО и иные юрлица.
            "individual_entrepreneur" — ИП (указан ОГРНИП).
            "individual" — физическое лицо без статуса ИП.
            "not_defined" — тип прямо не указан.
          - Верни только JSON.
          </rules>
        fields:
          - name: "bank_details_status"
            type: "string"
            presentation: "signal"
            allowed_values: ["defined", "not_defined"]
            description: "Статус идентификации банка."
            required: true
          - name: "bank_details_value"
            type: "string"
            presentation: "fact"
            label: "Банк: реквизиты"
            description: "Наименование и реквизиты банка."
            required: true
            display_in_grid: true
            display_priority: 1
          - name: "bank_type"
            type: "string"
            presentation: "signal"
            allowed_values: ["credit_organization", "not_defined"]
            description: "Тип банка."
            required: false
          - name: "bank_license_status"
            type: "string"
            presentation: "signal"
            allowed_values: ["defined", "not_defined"]
            description: "Статус указания лицензии банка."
            required: true
          - name: "bank_license_details"
            type: "string"
            presentation: "fact"
            label: "Лицензия банка"
            description: "Номер и реквизиты лицензии банка."
            required: false
            display_in_grid: true
            display_priority: 2
          - name: "client_details_status"
            type: "string"
            presentation: "signal"
            allowed_values: ["defined", "not_defined"]
            description: "Статус идентификации клиента / вкладчика."
            required: true
          - name: "client_details_value"
            type: "string"
            presentation: "fact"
            label: "Клиент / Вкладчик: реквизиты"
            description: "Наименование / ФИО и реквизиты клиента или вкладчика."
            required: true
            display_in_grid: true
            display_priority: 3
          - name: "client_type"
            type: "string"
            presentation: "signal"
            allowed_values: ["legal_entity", "individual_entrepreneur", "individual", "not_defined"]
            description: "Тип клиента / вкладчика."
            required: false
          - name: "client_signatory"
            type: "string"
            presentation: "fact"
            label: "Подписант клиента"
            description: "Подписант от клиента / вкладчика."
            required: false
            display_in_grid: false
          - name: "client_signatory_basis"
            type: "string"
            presentation: "signal"
            allowed_values: ["charter", "poa", "order", "personal", "other", "not_defined"]
            description: "Основание полномочий подписанта клиента."
            required: false
          - name: "bank_signatory"
            type: "string"
            presentation: "fact"
            label: "Подписант банка"
            description: "Подписант от банка."
            required: false
            display_in_grid: false
          - name: "bank_signatory_basis"
            type: "string"
            presentation: "signal"
            allowed_values: ["charter", "poa", "order", "other", "not_defined"]
            description: "Основание полномочий подписанта банка."
            required: false
    store_payload: true
# ──────────────────────────────────────────────────────────────────────────
# CHECK 2: Предмет, срок и базовые условия вклада / счета
# ──────────────────────────────────────────────────────────────────────────
  - id: bank_deposit_account_subject_extraction
    name: "Предмет вклада / счета: сумма, валюта, срок, тип договора"
    description: >
      Фактографическая проверка наличия в договоре суммы вклада / типа счёта,
      валюты, срока, типа договора (вклад / счёт), вида вклада (срочный /
      до востребования) и указания на подтверждение передачи средств.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "сумма вклада"
        - "размер вклада"
        - "валюта"
        - "срок вклада"
        - "тип счета"
        - "расчетный счет"
        - "текущий счет"
        - "срочный вклад"
        - "до востребования"
        - "внесение вклада"
        - "зачисление"
        - "переданы"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)\\b\\d[\\d\\s]*(?:руб|рублей|₽|коп|тыс|млн|млрд)"
        - "(?i)\\b\\d+(?:[.,]\\d+)?\\s*%"
        - "(?i)(срочн|до\\s+востребовани)"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор банковского вклада или банковского счета
        (Главы 44–45 ГК РФ).
        Проверяется только один вопрос: сумма вклада / тип счёта, валюта,
        срок, тип договора и подтверждение передачи / зачисления средств.
        Нормативный ориентир:
        - ст. 834–837 ГК РФ — банковский вклад
        - ст. 845–849 ГК РФ — банковский счёт
        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора.
        - Не оценивай серьёзность риска.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Тип договора (вклад / счёт / смешанный).
        2. Сумму вклада или тип счёта.
        3. Валюту.
        4. Срок вклада или срок действия договора счёта.
        5. Вид вклада (срочный / до востребования).
        6. Есть ли подтверждение передачи / зачисления средств.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Если данные не указаны прямо — возвращай "not_defined".
        3. Если текстового значения нет — возвращай "Данные не определены".
        4. Не используй "None", "null", "not_defined" или пустые строки.
        5. В evidence включай только текст договора.
        6. Верни только один JSON-объект.

        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1:
        Фрагмент:
        "Банк принимает от Вкладчика денежные средства в размере 1 500 000 рублей
        на срочный вклад сроком на 12 месяцев. Валюта вклада — рубли РФ.
        Средства зачислены на счет Вкладчика в день подписания договора."
        Ответ:
        {
          "contract_type": "deposit",
          "amount_status": "defined",
          "amount_value": "1 500 000 рублей",
          "currency": "RUB",
          "term_status": "defined",
          "term_value": "12 месяцев",
          "deposit_kind": "term",
          "transfer_evidence_status": "defined",
          "transfer_evidence_details": "средства зачислены на счет Вкладчика в день подписания договора",
          "evidence": [
            {
              "clause_ref": "п. 1.1",
              "quote": "Банк принимает от Вкладчика денежные средства в размере 1 500 000 рублей на срочный вклад сроком на 12 месяцев."
            }
          ]
        }
        Пример 2:
        Фрагмент:
        "Банк открывает Клиенту расчетный счет."
        Ответ:
        {
          "contract_type": "account",
          "amount_status": "not_defined",
          "amount_value": "Данные не определены",
          "currency": "not_defined",
          "term_status": "not_defined",
          "term_value": "Данные не определены",
          "deposit_kind": "not_defined",
          "transfer_evidence_status": "not_defined",
          "transfer_evidence_details": "Данные не определены",
          "evidence": [
            {
              "clause_ref": "п. 1.1",
              "quote": "Банк открывает Клиенту расчетный счет."
            }
          ]
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о типе договора (вклад / счёт).
