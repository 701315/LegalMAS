            - "Только отсылка к овердрафту без условий"
            - "Овердрафт в договоре не упомянут"
            - "Не удалось определить"
          description: "Читаемый вывод о раскрытии условий овердрафта."
          required: true
          display_in_grid: true
          display_priority: 5

      store_payload: true

  - id: deposit_insurance_coverage_check
    name: "Страхование вклада: покрытие АСВ и размер возмещения (177-ФЗ)"
    description: >
      Фактографическая проверка страхования вклада в системе обязательного
      страхования вкладов (ССВ) по 177-ФЗ. Для вкладов физлиц и ИП
      страхование в АСВ императивно (кроме исключений ст. 6 177-ФЗ);
      для вкладов юрлиц не применяется. Check даёт юристу сигнал о реальном
      покрытии денежных средств клиента, категории вклада и размере
      страхового возмещения.
    triggers:
      any: ["deposit_contract"]
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "страхование вкладов"
        - "система страхования вкладов"
        - "АСВ"
        - "агентство по страхованию вкладов"
        - "177-ФЗ"
        - "страховое возмещение"
        - "страховой случай"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)страховани[ея]\\s+вклад"
        - "(?i)\\bасв\\b|агентств[оа]\\s+по\\s+страхованию"
        - "(?i)177[- ]?фз"
        - "(?i)страхов(ое|ого)\\s+(возмещени|случа)"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор банковского вклада (Глава 44 ГК РФ).
        Проверяется только один вопрос: страхование вклада в системе
        обязательного страхования вкладов (ССВ) — покрытие АСВ, категория
        вклада, размер страхового возмещения.
        Нормативный ориентир:
        - 177-ФЗ — страхование вкладов в банках РФ;
        - ст. 5 177-ФЗ — какие вклады страхуются;
        - ст. 6 177-ФЗ — что не страхуется (вклады на предъявителя, ОМС,
          средства в доверительном управлении, зарубежные филиалы и др.);
        - ст. 11 177-ФЗ — размер возмещения: базово 1,4 млн ₽;
          до 10 млн ₽ при особых обстоятельствах (продажа жилья,
          наследство, страховые выплаты).
        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора,
          с учётом императивных норм 177-ФЗ.
        - Не оценивай серьёзность риска.
        - Для вклада физлица страхование применяется по закону, даже если
          в договоре не упомянуто (кроме исключений ст. 6 177-ФЗ).
        - Для вклада юрлица страхование не применяется вообще, независимо
          от формулировок договора.
        - Для ИП страхуются только личные вклады, но не счета для
          предпринимательской деятельности.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Есть ли упоминание страхования вклада / АСВ / 177-ФЗ.
        2. Указано ли, что банк — участник ССВ.
        3. Категория вклада — личный вклад физлица / вклад ИП / счёт для
          предпринимательской деятельности / вклад юрлица / иная категория.
        4. Размер страхового покрытия (лимит возмещения).

        [ПРАВИЛА]
        1. Используй только текст документа (плюс императивные нормы 177-ФЗ
          для физлиц, как описано ниже).
        2. Не путай «данные отсутствуют» и «данные есть, но вывод
          неоднозначен»:
          - если в тексте нет сведений и нет применимой императивной
            нормы — статус "not_defined", значение "Данные не определены";
          - если фрагмент есть, но из него нельзя сделать надёжный вывод —
            значение "Не удалось определить".
        3. Не используй "None", "null", пустые строки.
        4. В evidence включай только точные цитаты из договора.
        5. Не додумывай размер покрытия или категорию вклада, если
          они не зафиксированы прямо и не следуют из императивной нормы.

        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1 — вклад физлица, страхование прямо указано:
        Фрагмент:
        "Гражданин РФ Кузнецов К.К., именуемый «Вкладчик». Вклад застрахован
        в системе обязательного страхования вкладов в соответствии с ФЗ
        № 177-ФЗ. Страховое возмещение — до 1 400 000 рублей."
        Ответ:
        {
          "insurance_terms_status": "defined",
          "insurance_terms_details": "вклад застрахован в ССВ по 177-ФЗ, возмещение до 1 400 000 руб.",
          "bank_ssv_status": "defined",
          "insurance_category": "personal_individual",
          "insurance_category_display": "Личный вклад физлица",
          "insurance_coverage_limit_status": "defined",
          "insurance_coverage_limit_value": "1 400 000 рублей",
          "insurance_coverage_display": "Вклад застрахован (АСВ, до 1,4 млн ₽)",
          "evidence": [
            {
              "clause_ref": "п. 1.1",
              "quote": "Вклад застрахован в системе обязательного страхования вкладов в соответствии с ФЗ № 177-ФЗ. Страховое возмещение — до 1 400 000 рублей."
            }
          ]
        }
        Пример 2 — вклад юрлица, страхование не применяется:
        Фрагмент:
        "ООО «Альфа», именуемое «Вкладчик», размещает денежные средства
        на депозитном счёте в Банке."
        Ответ:
        {
          "insurance_terms_status": "not_defined",
          "insurance_terms_details": "Данные не определены",
          "bank_ssv_status": "not_defined",
          "insurance_category": "legal_entity",
          "insurance_category_display": "Вклад юрлица",
          "insurance_coverage_limit_status": "not_defined",
          "insurance_coverage_limit_value": "Данные не определены",
          "insurance_coverage_display": "Вклад не подлежит страхованию (юрлицо)",
          "evidence": [
            {
              "clause_ref": "Преамбула",
              "quote": "ООО «Альфа», именуемое «Вкладчик», размещает денежные средства на депозитном счёте в Банке."
            }
          ]
        }
        Пример 3 — вклад физлица, страхование не упомянуто в договоре
        (применяется по закону):
        Фрагмент:
        "Гражданин РФ Иванов И.И., именуемый «Вкладчик», размещает денежные
        средства на срочном вкладе сроком на 12 месяцев."
        Ответ:
        {
          "insurance_terms_status": "not_defined",
          "insurance_terms_details": "Данные не определены",
          "bank_ssv_status": "not_defined",
          "insurance_category": "personal_individual",
          "insurance_category_display": "Личный вклад физлица",
          "insurance_coverage_limit_status": "defined",
          "insurance_coverage_limit_value": "1 400 000 рублей",
          "insurance_coverage_display": "Вклад застрахован (АСВ, до 1,4 млн ₽)",
          "evidence": [
            {
              "clause_ref": "Преамбула",
              "quote": "Гражданин РФ Иванов И.И., именуемый «Вкладчик», размещает денежные средства на срочном вкладе сроком на 12 месяцев."
            }
          ]
        }
        Пример 4 — текст есть, но надёжный вывод сделать нельзя
        (категория вклада неясна: обезличенный металлический счёт):
        Фрагмент:
        "Клиент размещает средства в обезличенном металлическом счёте.
        Порядок страхования определяется законодательством РФ."
        Ответ:
        {
          "insurance_terms_status": "defined",
          "insurance_terms_details": "порядок страхования определяется законодательством РФ",
          "bank_ssv_status": "not_defined",
          "insurance_category": "other_category",
          "insurance_category_display": "Обезличенный металлический счёт",
          "insurance_coverage_limit_status": "not_defined",
          "insurance_coverage_limit_value": "Не удалось определить",
          "insurance_coverage_display": "Вклад не подлежит страхованию (категория вклада)",
          "evidence": [
            {
              "clause_ref": "п. 1.1",
              "quote": "Клиент размещает средства в обезличенном металлическом счёте."
            }
          ]
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о страховании вклада / АСВ / 177-ФЗ.
        2. Определи тип вкладчика по преамбуле (физлицо / ИП / юрлицо).
        3. Определи категорию вклада: личный вклад физлица / вклад ИП /
          счёт для предпринимательской деятельности / вклад юрлица /
          иная категория (ОМС, предъявитель, доверительное управление).
        4. Для физлица и личного вклада: страхование применяется по закону,
          даже если в договоре не упомянуто (кроме ст. 6 177-ФЗ).
        5. Для юрлица: страхование не применяется.
        6. Разграничь «данных нет» (Данные не определены) и «данные есть,
          но вывод неоднозначен» (Не удалось определить).
        Не выводи шаги проверки — сформируй итоговый ответ согласно [ФОРМАТ ОТВЕТА].

        [ФОРМАТ ОТВЕТА]

        Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей.

        НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON,

        пригодным для парсинга через json.loads без предварительной обработки.
        Ответь РОВНО одним JSON-объектом без какого-либо дополнительного
        текста до или после, со всеми 8 ключами полей (evidence — служебный
        массив цитат, не относящийся к схеме полей):
        {
          "insurance_terms_status": "<defined / not_defined>",
          "insurance_terms_details": "<текст / 'Данные не определены' / 'Не удалось определить'>",
          "bank_ssv_status": "<defined / not_defined>",
          "insurance_category": "<personal_individual / individual_entrepreneur / business_account / legal_entity / other_category / not_defined>",
          "insurance_category_display": "<Личный вклад физлица / Вклад ИП / Счёт для предпринимательской деятельности / Вклад юрлица / Обезличенный металлический счёт / Иная категория / Не удалось определить>",
          "insurance_coverage_limit_status": "<defined / not_defined>",
          "insurance_coverage_limit_value": "<текст / 'Данные не определены' / 'Не удалось определить'>",
          "insurance_coverage_display": "<Вклад застрахован (АСВ, до 1,4 млн ₽) / Вклад застрахован с повышенным покрытием (до 10 млн ₽) / Вклад не подлежит страхованию (юрлицо) / Вклад не подлежит страхованию (категория вклада) / Страхование не урегулировано в договоре / Не удалось определить>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 8
      temperature: 0.0
      max_tokens: 650

    retrieval:
      retrieval_profile: "insurance_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "страхование вкладов АСВ система страхования вкладов 177-ФЗ страховой случай страховое возмещение повышенное покрытие"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - representations
        - boilerplate
      negative_keywords:
        - "тариф"
        - "комиссия"
        - "115-ФЗ"
        - "овердрафт"
        - "ДБО"
        - "процентная ставка"
        - "закрытие счета"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.10, 0.70]
        boost: 0.18
        scope: segment
      context_k: 8
      max_chunks: 10
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "representations"
        - "boilerplate"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.12

    evidence:
      required: true
      min_snippet_length: 35
      max_snippet_length: 550

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 900
      compact_output: false

      presence_signal:
        field: "deposit_insurance_coverage_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора банковского вклада
        сведения о страховании вклада: наличие упоминания ССВ, участие банка,
        категорию вклада, размер страхового покрытия; сформируй читаемый
        вывод о покрытии для DD Grid.
        Не анализируй проценты, тарифы, AML, ДБО или овердрафт.
        Учитывай императивные нормы 177-ФЗ для физлиц.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. deposit_insurance_coverage_check_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (insurance_terms_status, bank_ssv_status, insurance_category,
              insurance_coverage_limit_status) ≠ "not_defined";
           - "missing" — если все четыре содержательных поля = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - insurance_terms_status = "not_defined";
           - bank_ssv_status = "not_defined";
           - insurance_category = "not_defined";
           - insurance_coverage_limit_status = "not_defined";
           - insurance_terms_details, insurance_coverage_limit_value = "Данные не определены";
           - insurance_category_display = "Не удалось определить";
           - insurance_coverage_display = "Страхование не урегулировано в договоре";
           - не выполняй остальные шаги.

        1. insurance_terms_status:
           - "defined" — если в договоре прямо есть упоминание страхования вклада / АСВ / 177-ФЗ;
           - "not_defined" — если упоминания нет.

        2. insurance_terms_details:
           Краткая формулировка о страховании.
           Если данных нет — "Данные не определены";
           если фрагмент неоднозначен — "Не удалось определить".

        3. bank_ssv_status:
           - "defined" — если в договоре прямо указано, что банк — участник ССВ;
           - "not_defined" — если прямо не указано.

        4. insurance_category:
           Тип категории вклада с точки зрения ССВ:
           "personal_individual" — личный вклад физлица;
           "individual_entrepreneur" — вклад ИП (личный);
           "business_account" — счёт для предпринимательской деятельности;
           "legal_entity" — вклад юрлица;
           "other_category" — ОМС, вклад на предъявителя, доверительное управление, зарубежный филиал;
           "not_defined" — категория неясна.

        5. insurance_category_display:
           Читаемая категория для DD Grid. Соответствует insurance_category:
           personal_individual → "Личный вклад физлица";
           individual_entrepreneur → "Вклад ИП";
           business_account → "Счёт для предпринимательской деятельности";
           legal_entity → "Вклад юрлица";
           other_category → "Обезличенный металлический счёт" или иная конкретная формулировка, если она есть в тексте; иначе "Иная категория";
           not_defined → "Не удалось определить".

        6. insurance_coverage_limit_status:
           - "defined" — если размер страхового покрытия прямо указан или однозначно следует из императивной нормы (1,4 млн ₽ для личного вклада физлица);
           - "not_defined" — если размер покрытия неясен.

        7. insurance_coverage_limit_value:
           Конкретный размер покрытия ("1 400 000 рублей", "10 000 000 рублей" и т. п.).
           Если данных нет — "Данные не определены";
           если фрагмент неоднозначен — "Не удалось определить".

        8. insurance_coverage_display:
           Читаемый вывод о покрытии для DD Grid. Строго по правилам:
           - "Вклад застрахован (АСВ, до 1,4 млн ₽)" — для личного вклада физлица без особых обстоятельств;
           - "Вклад застрахован с повышенным покрытием (до 10 млн ₽)" — если применимы особые обстоятельства ст. 11 177-ФЗ;
           - "Вклад не подлежит страхованию (юрлицо)" — для вклада юрлица;
           - "Вклад не подлежит страхованию (категория вклада)" — для исключений ст. 6 177-ФЗ (ОМС, предъявитель и др.);
           - "Страхование не урегулировано в договоре" — если категория вклада неясна и вывод о покрытии сделать нельзя;
           - "Не удалось определить" — если формулировка есть, но вывод сделать нельзя.

        9. evidence:
           Массив объектов [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}].
           Включай только прямые цитаты из договора. Если прямых цитат нет — пустой массив.
        </task>

        <context_rules>
        - Перед остальными полями заполни deposit_insurance_coverage_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined", все *_value/*_display = "Данные не определены" / "Не удалось определить" / "Страхование не урегулировано в договоре".
        - Используй только текст договора + императивные нормы 177-ФЗ для физлиц.
        - Для вкладчика-физлица с личным вкладом: страхование применяется по закону, даже если в договоре не упомянуто. insurance_category = "personal_individual", insurance_coverage_display = "Вклад застрахован (АСВ, до 1,4 млн ₽)", insurance_coverage_limit_value = "1 400 000 рублей".
        - Для вкладчика-юрлица: страхование не применяется независимо от формулировок договора. insurance_coverage_display = "Вклад не подлежит страхованию (юрлицо)".
        - Для вкладов ИП: страхуются только личные вклады; если из текста следует, что счёт предназначен для предпринимательской деятельности — insurance_category = "business_account", insurance_coverage_display = "Вклад не подлежит страхованию (категория вклада)".
        - Исключения ст. 6 177-ФЗ (ОМС, предъявитель, доверительное управление, зарубежные филиалы) → insurance_category = "other_category", insurance_coverage_display = "Вклад не подлежит страхованию (категория вклада)".
        - Не используй "None", "null", пустые строки.
        - Все текстовые значения пиши на русском языке, кроме служебных enum-значений status-полей.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы (и тип вкладчика неясен).
           В тексте нет ни упоминания страхования, ни явных признаков категории вклада.
           → presence = "missing";
             все *_status = "not_defined";
             insurance_coverage_display = "Страхование не урегулировано в договоре".

        2. Вклад юрлица (страхование не применяется).
           В преамбуле указано, что вкладчик — юридическое лицо.
           → presence = "present";
             insurance_category = "legal_entity";
             insurance_coverage_display = "Вклад не подлежит страхованию (юрлицо)".

        3. Противоречие между фрагментами.
           В разных частях договора указаны противоречивые условия страхования
           или категории вклада, и конфликт нельзя разрешить по тексту.
           → presence = "unclear";
             соответствующий *_status = "not_defined";
             соответствующий *_value / *_display = "Не удалось определить".

        4. Специфика темы: вклад физлица, страхование не упомянуто в договоре.
           В преамбуле указан гражданин РФ, но раздел о страховании отсутствует.
           → presence = "present";
             insurance_category = "personal_individual";
             insurance_coverage_limit_status = "defined";
             insurance_coverage_limit_value = "1 400 000 рублей";
             insurance_coverage_display = "Вклад застрахован (АСВ, до 1,4 млн ₽)".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для deposit_insurance_coverage_check_presence используй только: "present", "missing", "unclear".
        - Для status-полей используй только: "defined" или "not_defined".
        - Для insurance_coverage_display и insurance_category_display используй только значения из allowed_values, без свободных формулировок.
        - Fallback при отсутствии данных:
          * insurance_terms_details, insurance_coverage_limit_value → "Данные не определены";
          * insurance_category_display → "Не удалось определить";
          * insurance_coverage_display → "Страхование не урегулировано в договоре".
        - Fallback при противоречии или неоднозначности:
          * все *_value / *_display → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "deposit_insurance_coverage_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования по страхованию вклада. Внутреннее агрегатное signal-поле."
          required: true

        - name: "insurance_terms_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          description: "Статус упоминания страхования вклада в договоре."
          required: true
          display_in_grid: false

        - name: "insurance_terms_details"
          label: "Упоминание системы страхования вкладов (АСВ)"
          type: "string"
          presentation: "fact"
          description: "Формулировка о страховании вклада (внутреннее поле)."
          required: true
          display_in_grid: false

        - name: "bank_ssv_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          description: "Статус участия банка в ССВ."
          required: true
          display_in_grid: false

        - name: "insurance_category"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["personal_individual", "individual_entrepreneur", "business_account", "legal_entity", "other_category", "not_defined"]
          description: "Категория вклада с точки зрения ССВ (внутренний enum)."
          required: true
          display_in_grid: false

        - name: "insurance_category_display"
          type: "string"
          presentation: "fact"
          label: "Категория вклада"
          allowed_values:
            - "Личный вклад физлица"
            - "Вклад ИП"
            - "Счёт для предпринимательской деятельности"
            - "Вклад юрлица"
            - "Обезличенный металлический счёт"
            - "Иная категория"
            - "Не удалось определить"
          description: "Читаемая категория вклада для DD Grid."
          required: true
          display_in_grid: true
          display_priority: 1

        - name: "insurance_coverage_limit_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус размера страхового покрытия."
          required: true
          display_in_grid: false

        - name: "insurance_coverage_limit_value"
          type: "string"
          presentation: "fact"
          label: "Размер покрытия"
          description: "Размер страхового покрытия (лимит возмещения по 177-ФЗ)."
          required: true
          display_in_grid: true
          display_priority: 2

        - name: "insurance_coverage_display"
          type: "string"
          presentation: "fact"
          label: "Страхование вклада"
          allowed_values:
            - "Вклад застрахован (АСВ, до 1,4 млн ₽)"
            - "Вклад застрахован с повышенным покрытием (до 10 млн ₽)"
            - "Вклад не подлежит страхованию (юрлицо)"
            - "Вклад не подлежит страхованию (категория вклада)"
            - "Страхование не урегулировано в договоре"
            - "Не удалось определить"
          description: "Читаемый вывод о покрытии вклада; ключевой сигнал риска для физлиц и юрлиц."
          required: true
          display_in_grid: true
          display_priority: 3

      store_payload: true

  - id: account_closure_and_termination_check
    name: "Закрытие счёта и расторжение договора банковского счёта (ст. 859 ГК РФ)"
    description: >
      Фактографическая проверка механики закрытия счёта и расторжения
      договора банковского счёта: право клиента на закрытие, основания
      расторжения банком, порядок возврата остатка и судьба овердрафта
      при закрытии. Специфика ст. 859 ГК РФ не покрывается global
      termination_grounds (там общая механика расторжения).
    triggers:
      any: ["bank_account_contract"]
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "закрытие счета"
        - "расторжение договора"
        - "расторжение договора банковского счета"
        - "возврат остатка"
        - "отсутствие операций"
        - "заявление клиента"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)закрыти[ея]\\s+сч[её]т"
        - "(?i)расторжени[ея].{0,40}(сч[её]т|договор)"
        - "(?i)возврат\\s+остатк"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор банковского счёта (Глава 45 ГК РФ).
        Проверяется только один вопрос: механика закрытия счёта
        и расторжения договора.
        Нормативный ориентир:
        - ст. 859 п. 1 ГК РФ — расторжение по заявлению клиента в любое
          время;
        - ст. 859 п. 1.1 ГК РФ — расторжение банком при отсутствии
          операций по счёту в течение 2 лет;
        - ст. 859 п. 3 ГК РФ — возврат остатка в течение 7 дней после
          получения заявления (если иное не предусмотрено договором);
        - ст. 860 ГК РФ — расторжение при изменении места жительства /
          места нахождения клиента;
        - ст. 7 п. 5.2 115-ФЗ — расторжение банком при нарушении 115-ФЗ.
        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора.
        - Не оценивай серьёзность риска.
        - Не подставляй нормы ст. 859 ГК РФ вместо текста договора: если
          условие в договоре не зафиксировано — это not_defined.
        - Различай состояния: механика закрытия раскрыта в договоре;
          договор ссылается на закон без раскрытия; механика закрытия
          не урегулирована.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Есть ли право клиента на закрытие счёта и в каком режиме
          (в любой момент / с ограничениями).
        2. По каким основаниям банк вправе расторгнуть договор
          в одностороннем порядке.
        3. Каков порядок и срок возврата остатка средств при закрытии.
        4. Что происходит с овердрафтом при закрытии счёта.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не путай «данные отсутствуют» и «данные есть, но вывод
          неоднозначен»:
          - если в тексте нет сведений — статус "not_defined", значение
            "Данные не определены";
          - если фрагмент есть, но из него нельзя сделать надёжный вывод —
            значение "Не удалось определить".
        3. Не используй "None", "null", пустые строки.
        4. В evidence включай только точные цитаты из договора.
        5. Не додумывай сроки возврата, основания расторжения или судьбу
          овердрафта, если они не зафиксированы прямо.

        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1 — все механики раскрыты:
        Фрагмент:
        "Клиент вправе расторгнуть договор в любое время по письменному
        заявлению. Банк вправе расторгнуть договор при отсутствии операций
        по счёту в течение 2 лет, уведомив Клиента за 30 дней. Остаток
        средств возвращается в течение 7 дней с даты закрытия. Задолженность
        по овердрафту при закрытии счёта подлежит досрочному погашению."
        Ответ:
        {
          "closure_by_client_status": "defined",
          "closure_by_client_display": "Клиент вправе закрыть счёт в любой момент",
          "closure_by_bank_status": "defined",
          "bank_termination_grounds_status": "defined",
          "closure_by_bank_display": "Банк вправе расторгнуть при отсутствии операций 2 года",
          "residual_return_status": "defined",
          "residual_return_details": "7 дней с даты закрытия",
          "overdraft_on_closure_status": "defined",
          "overdraft_on_closure_details": "задолженность по овердрафту подлежит досрочному погашению",
          "evidence": [
            {
              "clause_ref": "п. 9.1",
              "quote": "Клиент вправе расторгнуть договор в любое время по письменному заявлению."
            },
            {
              "clause_ref": "п. 9.2",
              "quote": "Банк вправе расторгнуть договор при отсутствии операций по счёту в течение 2 лет, уведомив Клиента за 30 дней."
            }
          ]
        }
        Пример 2 — только отсылка к закону:
        Фрагмент:
        "Договор может быть расторгнут в порядке, предусмотренном
        законодательством РФ."
        Ответ:
        {
          "closure_by_client_status": "defined",
          "closure_by_client_display": "Право клиента раскрыто только через отсылку к закону",
          "closure_by_bank_status": "not_defined",
          "bank_termination_grounds_status": "not_defined",
          "closure_by_bank_display": "Право банка не урегулировано",
          "residual_return_status": "not_defined",
          "residual_return_details": "Данные не определены",
          "overdraft_on_closure_status": "not_defined",
          "overdraft_on_closure_details": "Данные не определены",
          "evidence": [
            {
              "clause_ref": "п. 9.1",
              "quote": "Договор может быть расторгнут в порядке, предусмотренном законодательством РФ."
            }
          ]
        }
        Пример 3 — механика закрытия не урегулирована:
        Фрагмент:
        "Банк выполняет распоряжения Клиента о перечислении и выдаче
        денежных средств со счёта."
        Ответ:
        {
          "closure_by_client_status": "not_defined",
          "closure_by_client_display": "Право клиента не урегулировано",
          "closure_by_bank_status": "not_defined",
          "bank_termination_grounds_status": "not_defined",
          "closure_by_bank_display": "Право банка не урегулировано",
          "residual_return_status": "not_defined",
          "residual_return_details": "Данные не определены",
          "overdraft_on_closure_status": "not_defined",
          "overdraft_on_closure_details": "Данные не определены",
          "evidence": []
        }
        Пример 4 — текст есть, но надёжный вывод сделать нельзя
        (порядок через «внутренние документы Банка»):
        Фрагмент:
        "Порядок закрытия счёта и возврата остатка определяется внутренними
        документами Банка. Клиент вправе обратиться с заявлением о закрытии
        счёта."
        Ответ:
        {
          "closure_by_client_status": "defined",
          "closure_by_client_display": "Клиент вправе обратиться с заявлением о закрытии",
          "closure_by_bank_status": "not_defined",
          "bank_termination_grounds_status": "not_defined",
          "closure_by_bank_display": "Право банка не урегулировано",
          "residual_return_status": "defined",
          "residual_return_details": "Не удалось определить",
          "overdraft_on_closure_status": "not_defined",
          "overdraft_on_closure_details": "Данные не определены",
          "evidence": [
            {
              "clause_ref": "п. 9.1",
              "quote": "Порядок закрытия счёта и возврата остатка определяется внутренними документами Банка."
            }
          ]
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о праве клиента на закрытие.
        2. Найди прямую цитату об основаниях расторжения банком.
        3. Найди прямую цитату о порядке и сроке возврата остатка.
        4. Найди прямую цитату о судьбе овердрафта при закрытии.
        5. Разграничь «данных нет» (Данные не определены) и «данные есть,
          но вывод неоднозначен» (Не удалось определить). Не подставляй
          ст. 859 ГК РФ вместо текста договора.
        Не выводи шаги проверки — сформируй итоговый ответ согласно [ФОРМАТ ОТВЕТА].

        [ФОРМАТ ОТВЕТА]

        Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей.

        НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON,

        пригодным для парсинга через json.loads без предварительной обработки.
        Ответь РОВНО одним JSON-объектом без какого-либо дополнительного
        текста до или после, со всеми 9 ключами полей (evidence — служебный
        массив цитат, не относящийся к схеме полей):
        {
          "closure_by_client_status": "<defined / not_defined>",
          "closure_by_client_display": "<Клиент вправе закрыть счёт в любой момент / Право клиента ограничено договором / Право клиента раскрыто только через отсылку к закону / Клиент вправе обратиться с заявлением о закрытии / Право клиента не урегулировано / Не удалось определить>",
          "closure_by_bank_status": "<defined / not_defined>",
          "bank_termination_grounds_status": "<defined / not_defined>",
          "closure_by_bank_display": "<Банк вправе расторгнуть при отсутствии операций 2 года / Банк вправе расторгнуть при нарушении 115-ФЗ / Банк вправе расторгнуть в одностороннем порядке по иным основаниям / Право банка не урегулировано / Не удалось определить>",
          "residual_return_status": "<defined / not_defined>",
          "residual_return_details": "<текст / 'Данные не определены' / 'Не удалось определить'>",
          "overdraft_on_closure_status": "<defined / not_defined>",
          "overdraft_on_closure_details": "<текст / 'Данные не определены' / 'Не удалось определить'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 8
      temperature: 0.0
      max_tokens: 650

    retrieval:
      retrieval_profile: "termination_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "закрытие счета расторжение договора банковского счета ст. 859 возврат остатка заявление клиента одностороннее расторжение отсутствие операций"
      preferred_unit_types:
        - obligation
        - termination_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - procedures
        - obligations
      negative_keywords:
        - "тариф"
        - "комиссия"
        - "проценты"
        - "ДБО"
        - "страхование"
        - "115-ФЗ приостановление операций"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.55, 1.00]
        boost: 0.18
        scope: segment
      context_k: 8
      max_chunks: 10
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "procedures"
        - "obligations"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.12

    evidence:
      required: true
      min_snippet_length: 35
      max_snippet_length: 550

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1000
      compact_output: false

      presence_signal:
        field: "account_closure_and_termination_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора банковского счёта
        механику закрытия счёта: право клиента, основания расторжения банком,
        порядок и срок возврата остатка, судьбу овердрафта при закрытии;
        сформируй читаемые выводы для DD Grid.
        Не анализируй тарифы, проценты по вкладу, ДБО или страхование.
        Не подставляй нормы ст. 859 ГК РФ вместо текста договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. account_closure_and_termination_check_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (closure_by_client_status, closure_by_bank_status,
              bank_termination_grounds_status, residual_return_status,
              overdraft_on_closure_status) ≠ "not_defined";
           - "missing" — если все пять содержательных полей = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - closure_by_client_status = "not_defined";
           - closure_by_bank_status = "not_defined";
           - bank_termination_grounds_status = "not_defined";
           - residual_return_status = "not_defined";
           - overdraft_on_closure_status = "not_defined";
           - residual_return_details, overdraft_on_closure_details = "Данные не определены";
           - closure_by_client_display = "Право клиента не урегулировано";
           - closure_by_bank_display = "Право банка не урегулировано";
           - не выполняй остальные шаги.

        1. closure_by_client_status:
           - "defined" — если в договоре прямо урегулировано право клиента на закрытие счёта;
           - "not_defined" — если право клиента прямо не урегулировано.

        2. closure_by_client_display:
           Читаемый вывод о праве клиента на закрытие счёта. Строго по правилам:
           - "Клиент вправе закрыть счёт в любой момент" — если договор прямо закрепляет безусловное право клиента;
           - "Право клиента ограничено договором" — если есть ограничения (сроки, условия, необходимость согласований);
           - "Клиент вправе обратиться с заявлением о закрытии счёта" — если порядок раскрыт через механизм заявления без указания «в любой момент» и без явных ограничений;
           - "Право клиента раскрыто только через отсылку к закону" — если договор ссылается на «порядок, установленный законодательством» без конкретики;
           - "Право клиента не урегулировано" — если тема права клиента на закрытие в договоре не упомянута;
           - "Не удалось определить" — если формулировка есть, но вывод сделать нельзя.

        3. closure_by_bank_status:
           - "defined" — если в договоре прямо указано, по каким основаниям банк вправе расторгнуть договор;
           - "not_defined" — если основания расторжения банком прямо не указаны.

        4. bank_termination_grounds_status:
           - "defined" — если конкретные основания расторжения банком прямо перечислены;
           - "not_defined" — если конкретные основания не перечислены.

        5. closure_by_bank_display:
           Читаемый вывод о праве банка на расторжение. Строго по правилам:
           - "Банк вправе расторгнуть при отсутствии операций 2 года" — если в договоре прямо названо это основание;
           - "Банк вправе расторгнуть при нарушении 115-ФЗ" — если прямо названо это основание;
           - "Банк вправе расторгнуть в одностороннем порядке по иным основаниям" — если договор даёт банку право расторжения по иным конкретным основаниям;
           - "Право банка не урегулировано" — если тема расторжения банком в договоре не упомянута;
           - "Не удалось определить" — если формулировка есть, но вывод сделать нельзя.

        6. residual_return_status:
           - "defined" — если порядок и/или срок возврата остатка при закрытии счёта прямо указаны;
           - "not_defined" — если порядок и/или срок возврата прямо не указаны.

        7. residual_return_details:
           Формулировка о сроке и/или порядке возврата остатка.
           Если данных нет — "Данные не определены";
           если фрагмент неоднозначен — "Не удалось определить".

        8. overdraft_on_closure_status:
           - "defined" — если в договоре прямо урегулирована судьба овердрафта при закрытии счёта;
           - "not_defined" — если судьба овердрафта прямо не урегулирована.

        9. overdraft_on_closure_details:
           Формулировка о судьбе овердрафта при закрытии счёта.
           Если данных нет — "Данные не определены";
           если фрагмент неоднозначен — "Не удалось определить".

        10. evidence:
            Массив объектов [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}].
            Включай только прямые цитаты из договора. Если прямых цитат нет — пустой массив.
        </task>

        <context_rules>
        - Перед остальными полями заполни account_closure_and_termination_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined", все *_details = "Данные не определены", closure_by_client_display = "Право клиента не урегулировано", closure_by_bank_display = "Право банка не урегулировано".
        - Используй только текст договора.
        - Не подставляй нормы ст. 859 ГК РФ вместо текста договора.
          Отсутствие условия — это not_defined.
        - Не додумывай сроки возврата, основания расторжения или судьбу овердрафта, если они не зафиксированы прямо.
        - Если в договоре сказано «в порядке, установленном внутренними документами Банка» без конкретных сроков и оснований — соответствующий status = "defined" (если тема затронута), но details = "Не удалось определить".
        - Закрытие счёта в связи с расторжением по инициативе банка при отсутствии операций 2 года — это основание ст. 859 п. 1.1 ГК РФ. Если оно есть в договоре — closure_by_bank_display = "Банк вправе расторгнуть при отсутствии операций 2 года".
        - Не используй "None", "null", пустые строки.
        - Все текстовые значения пиши на русском языке, кроме служебных enum-значений status-полей.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни права клиента на закрытие, ни оснований расторжения банком,
           ни порядка возврата остатка.
           → presence = "missing";
             все *_status = "not_defined";
             все *_details = "Данные не определены";
             closure_by_client_display = "Право клиента не урегулировано";
             closure_by_bank_display = "Право банка не урегулировано".

        2. Неполное раскрытие темы (только отсылка к закону).
           "Договор может быть расторгнут в порядке, предусмотренном законодательством РФ"
           без раскрытия конкретных сроков или оснований.
           → presence = "present";
             closure_by_client_status = "defined";
             closure_by_client_display = "Право клиента раскрыто только через отсылку к закону";
             соответствующие *_status = "not_defined".

        3. Противоречие между фрагментами.
           В разных частях договора указаны противоречивые сроки возврата остатка
           или основания расторжения, и конфликт нельзя разрешить по тексту.
           → presence = "unclear";
             соответствующий *_status = "not_defined";
             соответствующий *_details = "Не удалось определить".

        4. Специфика темы: порядок через «внутренние документы Банка».
           "Порядок закрытия счёта и возврата остатка определяется внутренними
           документами Банка."
           → presence = "present";
             residual_return_status = "defined";
             residual_return_details = "Не удалось определить".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для account_closure_and_termination_check_presence используй только: "present", "missing", "unclear".
        - Для status-полей используй только: "defined" или "not_defined".
        - Для closure_by_client_display и closure_by_bank_display используй только значения из allowed_values.
        - Fallback при отсутствии данных:
          * residual_return_details, overdraft_on_closure_details → "Данные не определены";
          * closure_by_client_display → "Право клиента не урегулировано";
          * closure_by_bank_display → "Право банка не урегулировано".
        - Fallback при противоречии или неоднозначности:
          * все *_details → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "account_closure_and_termination_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования по закрытию счёта/расторжению. Внутреннее агрегатное signal-поле."
          required: true

        - name: "closure_by_client_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус указания права клиента на закрытие счёта."
          required: true
          display_in_grid: false

        - name: "closure_by_client_display"
          type: "string"
          presentation: "fact"
          label: "Закрытие по инициативе клиента"
          allowed_values:
            - "Клиент вправе закрыть счёт в любой момент"
            - "Право клиента ограничено договором"
            - "Клиент вправе обратиться с заявлением о закрытии счёта"
            - "Право клиента раскрыто только через отсылку к закону"
            - "Право клиента не урегулировано"
            - "Не удалось определить"
          description: "Читаемый вывод о праве клиента на закрытие счёта."
          required: true
          display_in_grid: true
          display_priority: 1

        - name: "closure_by_bank_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус указания права банка на расторжение."
          required: true
          display_in_grid: false

        - name: "bank_termination_grounds_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус конкретных оснований расторжения банком."
          required: true
          display_in_grid: false

        - name: "closure_by_bank_display"
          type: "string"
          presentation: "fact"
          label: "Расторжение по инициативе банка"
          allowed_values:
            - "Банк вправе расторгнуть при отсутствии операций 2 года"
            - "Банк вправе расторгнуть при нарушении 115-ФЗ"
            - "Банк вправе расторгнуть в одностороннем порядке по иным основаниям"
            - "Право банка не урегулировано"
            - "Не удалось определить"
          description: "Читаемый вывод о праве банка на одностороннее расторжение."
          required: true
          display_in_grid: true
          display_priority: 2

        - name: "residual_return_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          description: "Статус порядка возврата остатка."
          required: true
          display_in_grid: false

        - name: "residual_return_details"
          type: "string"
          presentation: "fact"
          label: "Возврат остатка"
          description: "Срок и/или порядок возврата остатка средств при закрытии счёта."
          required: true
          display_in_grid: true
          display_priority: 3

        - name: "overdraft_on_closure_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          description: "Статус судьбы овердрафта при закрытии."
          required: true
          display_in_grid: false

        - name: "overdraft_on_closure_details"
          type: "string"
          presentation: "fact"
          label: "Овердрафт при закрытии"
          description: "Судьба овердрафта при закрытии счёта (досрочное погашение, превращение в кредит, иное)."
          required: true
          display_in_grid: true
          display_priority: 4

      store_payload: true

  - id: payment_allocation_priority_check
    name: "Очерёдность списания при недостаточности средств (ст. 855 ГК РФ)"
    description: >
      Фактографическая проверка очерёдности списания денежных средств
      при их недостаточности на счёте: раскрыта ли очерёдность в договоре,
      ссылается ли договор только на ст. 855 ГК РФ, есть ли отклонения
      от законной очерёдности и приоритет требований банка. Deal-relevant
      для юрлиц и ИП: определяет, чьи платежи пройдут в первую очередь
      при нехватке средств.
    triggers:
      any: ["bank_account_contract"]
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "очерёдность списания"
        - "недостаточность средств"
        - "очередность платежей"
        - "приоритет списания"
        - "ст. 855"
        - "очередь списания"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)очер[её]дност[ьи]\\s+списан"
        - "(?i)недостаточн[оа]ст[ьи]\\s+(денежных\\s+)?средств"
        - "(?i)855"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор банковского счёта (Глава 45 ГК РФ).
        Проверяется только один вопрос: очерёдность списания денежных
        средств при их недостаточности на счёте.
        Нормативный ориентир:
        - ст. 855 ГК РФ — очерёдность списания: пять очередей
          (1 — возмещение вреда жизни/здоровью, алименты;
          2 — выходные пособия, оплата труда, авторские;
          3 — налоги, оплата труда по исполнительным документам;
          4 — иные исполнительные документы;
          5 — прочие платежи в календарной очерёдности).
        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора.
        - Не оценивай серьёзность риска.
        - Не подставляй нормы ст. 855 ГК РФ вместо текста договора:
          если условие в договоре не зафиксировано — это not_defined.
        - Различай состояния: очерёдность раскрыта в договоре конкретно
          (перечень очередей); договор ссылается на законодательство
          без раскрытия; очерёдность в договоре не урегулирована.
        - Отдельно фиксируй отклонения от ст. 855 ГК РФ: договор может
          устанавливать приоритет комиссий банка или иных требований,
          не соответствующий законной очерёдности.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Есть ли указание на очерёдность списания при недостаточности
          средств.
        2. Как раскрыта очерёдность — конкретно / отсылка к закону /
          не указана.
        3. Есть ли приоритет требований банка (комиссии, овердрафт)
          перед платежами клиента.
        4. Есть ли отклонения от очерёдности по ст. 855 ГК РФ.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не путай «данные отсутствуют» и «данные есть, но вывод
          неоднозначен»:
          - если в тексте нет сведений — статус "not_defined", значение
            "Данные не определены";
          - если фрагмент есть, но из него нельзя сделать надёжный вывод —
            значение "Не удалось определить".
        3. Не используй "None", "null", пустые строки.
        4. В evidence включай только точные цитаты из договора.
        5. Не додумывай очерёдность, приоритет банка или отклонения,
          если они не зафиксированы прямо.

        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1 — очерёдность раскрыта конкретно, есть приоритет банка:
        Фрагмент:
        "При недостаточности средств на счёте списание производится
        в очерёдности, установленной ст. 855 ГК РФ. Требования Банка
        по комиссиям и по возврату овердрафта списываются в первую
        очередь по отношению к платежам Клиента."
        Ответ:
        {
          "allocation_status": "defined",
          "allocation_reference_type": "specific",
          "allocation_mode_display": "Очерёдность раскрыта в договоре",
          "allocation_rules_status": "defined",
          "allocation_rules_details": "очерёдность по ст. 855 ГК РФ; требования Банка по комиссиям и овердрафту — в первую очередь",
          "bank_priority_status": "defined",
          "bank_priority_details": "требования Банка по комиссиям и овердрафту — в первую очередь",
          "deviation_from_law_status": "defined",
          "deviation_from_law_display": "Есть отклонение от законной очерёдности (приоритет банка)",
          "evidence": [
            {
              "clause_ref": "п. 10.1",
              "quote": "При недостаточности средств на счёте списание производится в очерёдности, установленной ст. 855 ГК РФ. Требования Банка по комиссиям и по возврату овердрафта списываются в первую очередь по отношению к платежам Клиента."
            }
          ]
        }
        Пример 2 — только отсылка к закону:
        Фрагмент:
        "Списание денежных средств при их недостаточности производится
        в очерёдности, установленной законодательством РФ."
        Ответ:
        {
          "allocation_status": "defined",
          "allocation_reference_type": "law_reference",
          "allocation_mode_display": "Договор ссылается на законодательство",
          "allocation_rules_status": "defined",
          "allocation_rules_details": "очерёдность, установленная законодательством РФ",
          "bank_priority_status": "not_defined",
          "bank_priority_details": "Данные не определены",
          "deviation_from_law_status": "not_defined",
          "deviation_from_law_display": "Отклонений не установлено",
          "evidence": [
            {
              "clause_ref": "п. 10.1",
              "quote": "Списание денежных средств при их недостаточности производится в очерёдности, установленной законодательством РФ."
            }
          ]
        }
        Пример 3 — очерёдность в договоре не урегулирована:
        Фрагмент:
        "Банк выполняет распоряжения Клиента о перечислении и выдаче
        денежных средств со счёта."
        Ответ:
        {
          "allocation_status": "not_defined",
          "allocation_reference_type": "not_defined",
          "allocation_mode_display": "Очерёдность не урегулирована",
          "allocation_rules_status": "not_defined",
          "allocation_rules_details": "Данные не определены",
          "bank_priority_status": "not_defined",
          "bank_priority_details": "Данные не определены",
          "deviation_from_law_status": "not_defined",
          "deviation_from_law_display": "Отклонений не установлено",
          "evidence": []
        }
        Пример 4 — текст есть, но надёжный вывод сделать нельзя
        (порядок через «внутренние правила Банка»):
        Фрагмент:
        "При недостаточности средств списание производится в порядке,
        установленном внутренними правилами Банка."
        Ответ:
        {
          "allocation_status": "defined",
          "allocation_reference_type": "internal_rules",
          "allocation_mode_display": "Очерёдность определяется внутренними правилами Банка",
          "allocation_rules_status": "defined",
          "allocation_rules_details": "Не удалось определить",
          "bank_priority_status": "not_defined",
          "bank_priority_details": "Данные не определены",
          "deviation_from_law_status": "not_defined",
          "deviation_from_law_display": "Не удалось определить",
          "evidence": [
            {
              "clause_ref": "п. 10.1",
              "quote": "При недостаточности средств списание производится в порядке, установленном внутренними правилами Банка."
            }
          ]
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату об очерёдности списания.
        2. Определи режим: конкретное раскрытие / отсылка к закону /
          внутренние правила банка / не урегулирована.
        3. Найди прямую цитату о приоритете требований банка.
        4. Определи, есть ли отклонение от ст. 855 ГК РФ.
        5. Разграничь «данных нет» (Данные не определены) и «данные есть,
          но вывод неоднозначен» (Не удалось определить).
        Не выводи шаги проверки — сформируй итоговый ответ согласно [ФОРМАТ ОТВЕТА].

        [ФОРМАТ ОТВЕТА]

        Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей.

        НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON,

        пригодным для парсинга через json.loads без предварительной обработки.
        Ответь РОВНО одним JSON-объектом без какого-либо дополнительного
        текста до или после, со всеми 9 ключами полей (evidence — служебный
        массив цитат, не относящийся к схеме полей):
        {
          "allocation_status": "<defined / not_defined>",
          "allocation_reference_type": "<specific / law_reference / internal_rules / not_defined>",
          "allocation_mode_display": "<Очерёдность раскрыта в договоре / Договор ссылается на законодательство / Очерёдность определяется внутренними правилами Банка / Очерёдность не урегулирована / Не удалось определить>",
          "allocation_rules_status": "<defined / not_defined>",
          "allocation_rules_details": "<текст / 'Данные не определены' / 'Не удалось определить'>",
          "bank_priority_status": "<defined / not_defined>",
          "bank_priority_details": "<текст / 'Данные не определены' / 'Не удалось определить'>",
          "deviation_from_law_status": "<defined / not_defined>",
          "deviation_from_law_display": "<Есть отклонение от законной очерёдности (приоритет банка) / Есть иное отклонение от законной очерёдности / Отклонений не установлено / Не удалось определить>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 8
      temperature: 0.0
      max_tokens: 650

    retrieval:
      retrieval_profile: "payment_terms_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "очерёдность списания недостаточность средств очередность платежей приоритет списания ст. 855 очередь списания"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - procedures
        - obligations
      negative_keywords:
        - "проценты по вкладу"
        - "тариф на обслуживание"
        - "ДБО"
        - "страхование"
        - "115-ФЗ"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.20, 0.75]
        boost: 0.15
        scope: segment
      context_k: 8
      max_chunks: 10
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "procedures"
        - "obligations"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.12

    evidence:
      required: true
      min_snippet_length: 35
      max_snippet_length: 550

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1000
      compact_output: false

      presence_signal:
        field: "payment_allocation_priority_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора банковского счёта
        сведения об очерёдности списания при недостаточности средств:
        режим (конкретно / отсылка к закону / внутренние правила),
        формулировку, приоритет требований банка, отклонения от ст. 855
        ГК РФ; сформируй читаемые выводы для DD Grid.
        Не анализируй проценты по вкладу, тарифы на обслуживание, ДБО
        или страхование.
        Не подставляй нормы ст. 855 ГК РФ вместо текста договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. payment_allocation_priority_check_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (allocation_status, allocation_rules_status,
              bank_priority_status, deviation_from_law_status) ≠ "not_defined";
           - "missing" — если все четыре содержательных поля = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - allocation_status = "not_defined";
           - allocation_rules_status = "not_defined";
           - bank_priority_status = "not_defined";
           - deviation_from_law_status = "not_defined";
           - allocation_rules_details, bank_priority_details = "Данные не определены";
           - allocation_mode_display = "Очерёдность не урегулирована";
           - deviation_from_law_display = "Отклонений не установлено";
           - не выполняй остальные шаги.

        1. allocation_status:
           - "defined" — если в договоре есть хотя бы одно условие об очерёдности списания при недостаточности средств;
           - "not_defined" — если условие об очерёдности прямо не указано.

        2. allocation_reference_type:
           Режим раскрытия очерёдности:
           - "specific" — конкретный перечень очередей;
           - "law_reference" — отсылка к законодательству / ст. 855 ГК РФ без раскрытия;
           - "internal_rules" — отсылка к внутренним правилам Банка;
           - "not_defined" — очерёдность не урегулирована.

        3. allocation_mode_display:
           Читаемый вывод о режиме раскрытия очерёдности. Строго по правилам:
           - "Очерёдность раскрыта в договоре" — если в договоре прямо названы очереди или порядок списания;
           - "Договор ссылается на законодательство" — если в договоре только отсылка к закону без раскрытия;
           - "Очерёдность определяется внутренними правилами Банка" — если в договоре отсылка к внутренним документам банка;
           - "Очерёдность не урегулирована" — если в договоре нет условия;
           - "Не удалось определить" — если формулировка есть, но вывод сделать нельзя.

        4. allocation_rules_status:
           - "defined" — если формулировка очерёдности прямо приведена в договоре или через отсылку;
           - "not_defined" — если формулировка прямо не приведена.

        5. allocation_rules_details:
           Конкретная формулировка очерёдности.
           Если данных нет — "Данные не определены";
           если фрагмент неоднозначен — "Не удалось определить".

        6. bank_priority_status:
           - "defined" — если в договоре прямо указан приоритет требований банка (комиссии, овердрафт, прочее) относительно платежей клиента;
           - "not_defined" — если приоритет требований банка прямо не указан.

        7. bank_priority_details:
           Формулировка о приоритете требований банка.
           Если данных нет — "Данные не определены";
           если фрагмент неоднозначен — "Не удалось определить".

        8. deviation_from_law_status:
           - "defined" — если в договоре есть отклонение от очерёдности ст. 855 ГК РФ (например, приоритет банка перед законными очередями);
           - "not_defined" — если отклонение прямо не указано.

        9. deviation_from_law_display:
           Читаемый вывод об отклонении:
           - "Есть отклонение от законной очерёдности (приоритет банка)" — если договор устанавливает приоритет банка;
           - "Есть иное отклонение от законной очерёдности" — если в договоре есть несоответствие ст. 855, но не приоритет банка;
           - "Отклонений не установлено" — если отклонений нет или очерёдность полностью соответствует ст. 855;
           - "Не удалось определить" — если формулировка есть, но вывод сделать нельзя.

        10. evidence:
            Массив объектов [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}].
            Включай только прямые цитаты из договора. Если прямых цитат нет — пустой массив.
        </task>

        <context_rules>
        - Перед остальными полями заполни payment_allocation_priority_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined", все *_details = "Данные не определены", allocation_mode_display = "Очерёдность не урегулирована", deviation_from_law_display = "Отклонений не установлено".
        - Используй только текст договора.
        - Не подставляй нормы ст. 855 ГК РФ вместо текста договора.
          Отсутствие условия — это not_defined.
        - Не додумывай очерёдность, приоритет банка или отклонения, если они не зафиксированы прямо.
        - Если в договоре сказано «в порядке, установленном внутренними документами Банка» — allocation_reference_type = "internal_rules", allocation_rules_details = "Не удалось определить".
        - Если в договоре приоритет требований банка (комиссии, овердрафт, иные) прямо указан «в первую очередь» — bank_priority_status = "defined", deviation_from_law_display = "Есть отклонение от законной очерёдности (приоритет банка)".
        - Отсылка «на основании ст. 855 ГК РФ» без перечня очередей — это "law_reference", а не "specific".
        - Не используй "None", "null", пустые строки.
        - Все текстовые значения пиши на русском языке, кроме служебных enum-значений status-полей.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни одного условия об очерёдности списания при недостаточности средств.
           → presence = "missing";
             все *_status = "not_defined";
             все *_details = "Данные не определены";
             allocation_mode_display = "Очерёдность не урегулирована";
             deviation_from_law_display = "Отклонений не установлено".

        2. Неполное раскрытие темы (только отсылка к закону).
           "Списание денежных средств при их недостаточности производится в очерёдности,
           установленной законодательством РФ" без раскрытия конкретных очередей.
           → presence = "present";
             allocation_status = "defined";
             allocation_reference_type = "law_reference";
             allocation_mode_display = "Договор ссылается на законодательство".

        3. Противоречие между фрагментами.
           В разных частях договора указаны противоречивые условия очерёдности
           или приоритета банка, и конфликт нельзя разрешить по тексту.
           → presence = "unclear";
             соответствующий *_status = "not_defined";
             соответствующий *_details = "Не удалось определить".

        4. Специфика темы: отсылка к внутренним правилам банка.
           "При недостаточности средств списание производится в порядке,
           установленном внутренними правилами Банка."
           → presence = "present";
             allocation_status = "defined";
             allocation_reference_type = "internal_rules";
             allocation_rules_details = "Не удалось определить".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для payment_allocation_priority_check_presence используй только: "present", "missing", "unclear".
        - Для status-полей используй только: "defined" или "not_defined".
        - Для allocation_mode_display и deviation_from_law_display используй только значения из allowed_values.
        - Fallback при отсутствии данных:
          * allocation_rules_details, bank_priority_details → "Данные не определены";
          * allocation_mode_display → "Очерёдность не урегулирована";
          * deviation_from_law_display → "Отклонений не установлено".
        - Fallback при противоречии или неоднозначности:
          * все *_details → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "payment_allocation_priority_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования по очерёдности списания. Внутреннее агрегатное signal-поле."
          required: true

        - name: "allocation_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус наличия условия об очерёдности списания."
          required: true
          display_in_grid: false

        - name: "allocation_reference_type"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["specific", "law_reference", "internal_rules", "not_defined"]
          description: "Режим раскрытия очерёдности (внутренний enum)."
          required: true
          display_in_grid: false

        - name: "allocation_mode_display"
          type: "string"
          presentation: "fact"
          label: "Режим очерёдности"
          allowed_values:
            - "Очерёдность раскрыта в договоре"
            - "Договор ссылается на законодательство"
            - "Очерёдность определяется внутренними правилами Банка"
            - "Очерёдность не урегулирована"
            - "Не удалось определить"
          description: "Читаемый вывод о режиме раскрытия очерёдности списания."
          required: true
          display_in_grid: true
          display_priority: 1

        - name: "allocation_rules_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус формулировки очерёдности."
          required: true
          display_in_grid: false

        - name: "allocation_rules_details"
          type: "string"
          presentation: "fact"
          label: "Очерёдность списания"
          description: "Формулировка очерёдности списания при недостаточности средств."
          required: true
          display_in_grid: true
          display_priority: 2

        - name: "bank_priority_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус указания приоритета требований банка."
          required: true
          display_in_grid: false

        - name: "bank_priority_details"
          type: "string"
          presentation: "fact"
          label: "Приоритет требований банка"
          description: "Формулировка о приоритете требований банка (комиссии, овердрафт) перед платежами клиента."
          required: true
          display_in_grid: true
          display_priority: 3

        - name: "deviation_from_law_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус отклонения от очерёдности ст. 855 ГК РФ."
          required: true
          display_in_grid: false

        - name: "deviation_from_law_display"
          type: "string"
          presentation: "fact"
          label: "Отклонения от закона"
          allowed_values:
            - "Есть отклонение от законной очерёдности (приоритет банка)"
            - "Есть иное отклонение от законной очерёдности"
            - "Отклонений не установлено"
            - "Не удалось определить"
          description: "Читаемый вывод о соответствии очерёдности в договоре ст. 855 ГК РФ."
          required: true
          display_in_grid: true
          display_priority: 4

      store_payload: true

  - id: unilateral_setoff_and_collection_check
    name: "Право банка на зачет и безакцептное списание в счет иных обязательств (ст. 410, 854 ГК РФ)"
    description: >
      Фактографическая проверка наличия у банка договорного права на
      безакцептное списание средств или зачет встречных требований для
      погашения задолженности клиента перед банком по другим договорам
      (кредиты, карты, комиссии) или перед третьими лицами.
      Специфика: ст. 410 ГК РФ (зачет), ст. 854 ГК РФ (списание со счета).
      Для клиента deal-relevant: сбережения на вкладе/счете могут быть
      списаны в счет давней задолженности по кредитной карте или иному
      продукту, о котором клиент может не помнить.
    triggers:
      any: ["bank_account_contract", "deposit_contract"]
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "зачет встречных требований"
        - "безакцептное списание в счет погашения"
        - "иные обязательства перед банком"
        - "право удержания"
        - "статья 410"
        - "ст. 410"
        - "списать в счет"
        - "погашение задолженности"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)зачет\\s+(встречных\\s+)?требовани"
        - "(?i)безакцептн.{0,30}списани.{0,30}погашени"
        - "(?i)спис.{0,30}в\\s+счет\\s+(погашени|оплат)"
        - "(?i)право\\s+удержани"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор банковского счёта или вклада.
        Проверяется только один вопрос: наличие у банка договорного права
        на безакцептное списание средств или зачет встречных требований
        для погашения иных обязательств клиента.
        Нормативный ориентир:
        - ст. 410 ГК РФ — зачет встречных однородных требований;
        - ст. 854 ГК РФ — списание со счёта по распоряжению клиента
          или без распоряжения (по закону или по договору).
        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора.
        - Не оценивай серьёзность риска.
        - Не подставляй нормы ГК РФ вместо текста договора: если право
          на зачет/списание в договоре не зафиксировано — это not_defined.
        - Различай три состояния: право на зачет/списание в счет иных
          обязательств раскрыто в договоре; договор не содержит такого
          права; условие не урегулировано.
        - Различай широту права: только по данному договору / по любым
          договорам с банком / также перед третьими лицами.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Есть ли у банка право на зачет или безакцептное списание
          в счет иных обязательств клиента.
        2. В счет каких обязательств может быть применен зачет/списание
          (только по данному договору / по любым договорам с банком /
          также перед третьими лицами).
        3. Обязан ли банк уведомлять клиента о факте такого зачета/списания.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не путай «данные отсутствуют» и «данные есть, но вывод
          неоднозначен»:
          - если в тексте нет сведений — статус "not_defined", значение
            "Данные не определены";
          - если фрагмент есть, но из него нельзя сделать надёжный вывод —
            значение "Не удалось определить".
        3. Не используй "None", "null", пустые строки.
        4. В evidence включай только точные цитаты из договора.
        5. Не додумывай широту права зачета или обязанность уведомления,
          если они не зафиксированы прямо.
        6. Различай обычное списание комиссии за обслуживание по этому
          счету (это не «зачет в счет иных обязательств») и зачет в счет
          погашения долга по другому продукту (кредит, карта).

        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1 — зачет возможен только по обязательствам перед этим банком:
        Фрагмент:
        "Банк вправе произвести зачет встречных однородных требований
        в счет погашения задолженности Клиента по любым договорам,
        заключенным с Банком. О произведенном зачете Банк уведомляет
        Клиента в течение 3 рабочих дней."
        Ответ:
        {
          "setoff_right_status": "defined",
          "setoff_scope": "bank_obligations_only",
          "setoff_scope_details": "по любым договорам, заключенным с Банком",
          "notice_of_setoff_status": "defined",
          "notice_of_setoff_details": "уведомление в течение 3 рабочих дней",
          "setoff_mode_display": "Зачет возможен только по обязательствам перед этим банком",
          "evidence": [
            {
              "clause_ref": "п. 11.1",
              "quote": "Банк вправе произвести зачет встречных однородных требований в счет погашения задолженности Клиента по любым договорам, заключенным с Банком."
            }
          ]
        }
        Пример 2 — зачет возможен также перед третьими лицами:
        Фрагмент:
        "Банк вправе безакцептно списывать денежные средства со счёта
        Клиента в счет погашения задолженности Клиента перед Банком
        или перед третьими лицами на основании исполнительных документов
        или иных законных оснований."
        Ответ:
        {
          "setoff_right_status": "defined",
          "setoff_scope": "including_third_parties",
          "setoff_scope_details": "перед Банком или перед третьими лицами на основании исполнительных документов",
          "notice_of_setoff_status": "not_defined",
          "notice_of_setoff_details": "Данные не определены",
          "setoff_mode_display": "Зачет возможен по любым обязательствам, включая третьих лиц",
          "evidence": [
            {
              "clause_ref": "п. 11.1",
              "quote": "Банк вправе безакцептно списывать денежные средства со счёта Клиента в счет погашения задолженности Клиента перед Банком или перед третьими лицами."
            }
          ]
        }
        Пример 3 — право на зачет не предусмотрено:
        Фрагмент:
        "Банк выполняет распоряжения Клиента о перечислении и выдаче
        денежных средств со счёта. Списание средств производится
        исключительно по распоряжению Клиента."
        Ответ:
        {
          "setoff_right_status": "not_defined",
          "setoff_scope": "not_defined",
          "setoff_scope_details": "Данные не определены",
          "notice_of_setoff_status": "not_defined",
          "notice_of_setoff_details": "Данные не определены",
          "setoff_mode_display": "Право на зачет/списание в счет иных обязательств не предусмотрено",
          "evidence": []
        }
        Пример 4 — текст есть, но надёжный вывод сделать нельзя
        (противоречие между общим запретом и специальным разрешением):
        Фрагмент:
        "Списание средств без распоряжения Клиента не допускается,
        за исключением случаев, предусмотренных законом или договором.
        Банк вправе удерживать денежные средства на счёте в счет
        погашения задолженности по иным договорам."
        Ответ:
        {
          "setoff_right_status": "defined",
          "setoff_scope": "bank_obligations_only",
          "setoff_scope_details": "в счет погашения задолженности по иным договорам",
          "notice_of_setoff_status": "not_defined",
          "notice_of_setoff_details": "Данные не определены",
          "setoff_mode_display": "Зачет возможен только по обязательствам перед этим банком",
          "evidence": [
            {
              "clause_ref": "п. 11.1",
              "quote": "Банк вправе удерживать денежные средства на счёте в счет погашения задолженности по иным договорам."
            }
          ]
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о праве на зачет или безакцептное списание.
        2. Определи широту права: только по этому договору / по любым
          договорам с банком / также перед третьими лицами.
        3. Найди прямую цитату об обязанности уведомления.
        4. Разграничь «данных нет» (Данные не определены) и «данные есть,
          но вывод неоднозначен» (Не удалось определить).
        Не выводи шаги проверки — сформируй итоговый ответ согласно [ФОРМАТ ОТВЕТА].

        [ФОРМАТ ОТВЕТА]

        Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей.

        НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON,

        пригодным для парсинга через json.loads без предварительной обработки.
        Ответь РОВНО одним JSON-объектом без какого-либо дополнительного
        текста до или после, со всеми 6 ключами полей (evidence — служебный
        массив цитат, не относящийся к схеме полей):
        {
          "setoff_right_status": "<defined / not_defined>",
          "setoff_scope": "<bank_obligations_only / including_third_parties / not_defined>",
          "setoff_scope_details": "<текст / 'Данные не определены' / 'Не удалось определить'>",
          "notice_of_setoff_status": "<defined / not_defined>",
          "notice_of_setoff_details": "<текст / 'Данные не определены' / 'Не удалось определить'>",
          "setoff_mode_display": "<Зачет возможен только по обязательствам перед этим банком / Зачет возможен по любым обязательствам, включая третьих лиц / Право на зачет/списание не предусмотрено / Не удалось определить>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 8
      temperature: 0.0
      max_tokens: 600

    retrieval:
      retrieval_profile: "setoff_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "зачет встречных требований безакцептное списание в счет погашения иные обязательства перед банком право удержания ст. 410 списать в счет"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - remedies
      negative_keywords:
        - "процентная ставка"
        - "тариф"
        - "комиссия за открытие"
        - "115-ФЗ приостановление"
        - "ДБО"
        - "страхование"
        - "закрытие счета"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.40, 0.85]
        boost: 0.15
        scope: segment
      context_k: 8
      max_chunks: 10
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "obligations"
        - "remedies"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.12

    evidence:
      required: true
      min_snippet_length: 35
      max_snippet_length: 550

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 900
      compact_output: false

      presence_signal:
        field: "unilateral_setoff_and_collection_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора банковского счёта
        или вклада условия о праве банка на зачет встречных требований
        или безакцептное списание средств в счет иных обязательств клиента;
        сформируй читаемый вывод о широте такого права.
        Не анализируй проценты по вкладу, тарифы, AML, ДБО или страхование.
        Не подставляй нормы ст. 410, 854 ГК РФ вместо текста договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. unilateral_setoff_and_collection_check_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (setoff_right_status, setoff_scope, notice_of_setoff_status)
             ≠ "not_defined";
           - "missing" — если все три содержательных поля = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - setoff_right_status = "not_defined";
           - setoff_scope = "not_defined";
           - notice_of_setoff_status = "not_defined";
           - setoff_scope_details, notice_of_setoff_details = "Данные не определены";
           - setoff_mode_display = "Право на зачет/списание в счет иных обязательств не предусмотрено";
           - не выполняй остальные шаги.

        1. setoff_right_status:
           - "defined" — если в договоре прямо указано право банка на зачет
             встречных требований или безакцептное списание в счет иных
             обязательств клиента;
           - "not_defined" — если такое право прямо не указано.

        2. setoff_scope:
           Широта права зачета/списания:
           - "bank_obligations_only" — только по обязательствам клиента
             перед этим банком (по любым или только по данному договору);
           - "including_third_parties" — также в счет обязательств
             перед третьими лицами;
           - "not_defined" — широта права неясна или право не указано.

        3. setoff_scope_details:
           Формулировка о широте права зачета/списания.
           Если данных нет — "Данные не определены";
           если фрагмент неоднозначен — "Не удалось определить".

        4. notice_of_setoff_status:
           - "defined" — если в договоре прямо указана обязанность банка
             уведомить клиента о факте произведенного зачета/списания;
           - "not_defined" — если обязанность уведомления прямо не указана.

        5. notice_of_setoff_details:
           Формулировка о порядке уведомления о зачете/списании.
           Если данных нет — "Данные не определены";
           если фрагмент неоднозначен — "Не удалось определить".

        6. setoff_mode_display:
           Читаемый вывод о широте права зачета/списания для DD Grid.
           Строго по правилам:
           - "Зачет возможен только по обязательствам перед этим банком" —
             если договор допускает зачет только в счет задолженности
             перед этим банком (по любым или только по данному договору);
           - "Зачет возможен по любым обязательствам, включая третьих лиц" —
             если договор допускает зачет также в счет обязательств
             перед третьими лицами;
           - "Право на зачет/списание не предусмотрено" — если в договоре
             нет условия о зачете/списании в счет иных обязательств;
           - "Не удалось определить" — если формулировка есть, но вывод
             сделать нельзя.

        7. evidence:
           Массив объектов [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}].
           Включай только прямые цитаты из договора. Если прямых цитат нет —
           пустой массив.
        </task>

        <context_rules>
        - Перед остальными полями заполни unilateral_setoff_and_collection_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined", все *_details = "Данные не определены", setoff_mode_display = "Право на зачет/списание в счет иных обязательств не предусмотрено".
        - Используй только текст договора.
        - Не подставляй нормы ст. 410, 854 ГК РФ вместо текста договора.
          Отсутствие условия в договоре — это not_defined.
        - Различай обычное списание комиссии за обслуживание по этому счету
          (это не «зачет в счет иных обязательств») и зачет в счет погашения
          долга по другому продукту (кредит, карта).
        - setoff_scope = "bank_obligations_only", если договор допускает
          зачет только в счет задолженности перед этим банком (по любым
          или только по данному договору).
        - setoff_scope = "including_third_parties", если договор допускает
          зачет также в счет обязательств перед третьими лицами (в т. ч.
          по исполнительным документам).
        - Если в договоре есть противоречие между общим запретом
          безакцептного списания и специальным разрешением на зачет —
          приоритет у специального условия.
        - Не используй "None", "null", пустые строки.
        - Все текстовые значения пиши на русском языке, кроме служебных
          enum-значений status-полей.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни одного условия о зачете встречных требований
           или безакцептном списании в счет иных обязательств клиента.
           → presence = "missing";
             все *_status = "not_defined";
             все *_details = "Данные не определены";
             setoff_mode_display = "Право на зачет/списание в счет иных обязательств не предусмотрено".

        2. Узкий зачет (только по данному договору или только по этому банку).
           "Банк вправе произвести зачет встречных требований в счет
           погашения задолженности Клиента по настоящему договору."
           → presence = "present";
             setoff_right_status = "defined";
             setoff_scope = "bank_obligations_only";
             setoff_mode_display = "Зачет возможен только по обязательствам перед этим банком".

        3. Противоречие между фрагментами.
           В одном пункте договора — общий запрет безакцептного списания,
           в другом — специальное разрешение на зачет в счет иных обязательств.
           → presence = "present" (приоритет у специального условия);
             setoff_right_status = "defined";
             соответствующие *_details отражают специальное разрешение.

        4. Широкий зачет (включая третьих лиц).
           "Банк вправе безакцептно списывать денежные средства со счёта
           Клиента в счет погашения задолженности Клиента перед Банком
           или перед третьими лицами на основании исполнительных документов."
           → presence = "present";
             setoff_right_status = "defined";
             setoff_scope = "including_third_parties";
             setoff_mode_display = "Зачет возможен по любым обязательствам, включая третьих лиц".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для unilateral_setoff_and_collection_check_presence используй только: "present", "missing", "unclear".
        - Для status-полей используй только: "defined" или "not_defined".
        - Для setoff_scope используй только: "bank_obligations_only", "including_third_parties", "not_defined".
        - Для setoff_mode_display используй только значения из allowed_values, без свободных формулировок.
        - Fallback при отсутствии данных:
          * setoff_scope_details, notice_of_setoff_details → "Данные не определены";
          * setoff_mode_display → "Право на зачет/списание в счет иных обязательств не предусмотрено".
        - Fallback при противоречии или неоднозначности:
          * все *_details → "Не удалось определить";
          * setoff_mode_display → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "unilateral_setoff_and_collection_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования по зачету/безакцептному списанию в счет иных обязательств. Внутреннее агрегатное signal-поле."
          required: true

        - name: "setoff_right_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус наличия права на зачет/списание в счет иных обязательств."
          required: true
          display_in_grid: false

        - name: "setoff_scope"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["bank_obligations_only", "including_third_parties", "not_defined"]
          description: "Широта права зачета/списания (внутренний enum)."
          required: true
          display_in_grid: false

        - name: "setoff_scope_details"
          type: "string"
          presentation: "fact"
          label: "В счет каких обязательств"
          description: "Перечень обязательств, в счет которых банк может произвести зачет/списание."
          required: true
          display_in_grid: true
          display_priority: 1

        - name: "notice_of_setoff_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          description: "Статус обязанности уведомить о факте зачета/списания."
          required: true
          display_in_grid: false

        - name: "notice_of_setoff_details"
          type: "string"
          presentation: "fact"
          label: "Уведомление о зачете"
          description: "Порядок уведомления клиента о произведенном зачете или безакцептном списании."
          required: true
          display_in_grid: true
          display_priority: 2

        - name: "setoff_mode_display"
          type: "string"
          presentation: "fact"
          label: "Режим зачета"
          allowed_values:
            - "Зачет возможен только по обязательствам перед этим банком"
            - "Зачет возможен по любым обязательствам, включая третьих лиц"
            - "Право на зачет/списание не предусмотрено"
            - "Не удалось определить"
          description: "Читаемый вывод о широте полномочий банка по зачету/списанию в счет иных обязательств."
          required: true
          display_in_grid: true
          display_priority: 3

      store_payload: true

  - id: legally_significant_messages_check
    name: "Юридически значимые сообщения: каналы связи и распределение рисков (ст. 165.1 ГК РФ)"
    description: >
      Фактографическая проверка порядка направления юридически значимых
      сообщений (уведомлений об изменении тарифов, блокировке, одностороннем
      расторжении), каналов связи и распределения рисков неполучения
      сообщения клиентом. Специфика ст. 165.1 ГК РФ: сообщение, направленное
      по согласованному каналу, считается доставленным, даже если клиент
      фактически его не получил (сменил номер, не проверил e-mail).
      Для клиента deal-relevant: риск пропустить критически важное
      уведомление и потерять средства или право на оспаривание.
    triggers:
      any: ["bank_account_contract", "deposit_contract"]
    ui_mode: "field_extraction"
    severity: "medium"
    severity_if_pass: "pass"
    severity_if_fail: "medium"
    severity_if_unclear: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "юридически значимые сообщения"
        - "считается доставленным"
        - "считается полученным"
        - "обязан уведомить об изменении"
        - "актуальные контактные данные"
        - "риск неполучения"
        - "уведомление по SMS"
        - "уведомление по электронной почте"
        - "размещение на сайте"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)счита[еет]+ся\\s+(доставлен|получен|вручен)"
        - "(?i)обязан.{0,50}уведомить.{0,50}изменени"
        - "(?i)риск.{0,30}неполучени"
        - "(?i)актуальн.{0,30}контактн.{0,30}данн"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор банковского счёта или вклада.
        Проверяется только один вопрос: порядок направления юридически
        значимых сообщений, каналы связи и распределение рисков
        неполучения сообщения клиентом.
        Нормативный ориентир:
        - ст. 165.1 ГК РФ — юридически значимые сообщения;
        - ст. 29 ФЗ «О банках и банковской деятельности» — уведомление
          об изменении тарифов.
        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора.
        - Не оценивай серьёзность риска.
        - Не подставляй нормы ст. 165.1 ГК РФ вместо текста договора:
          если порядок уведомления в договоре не зафиксирован — это
          not_defined.
        - Различай состояния: порядок уведомления раскрыт в договоре
          (с каналами и моментом доставки); договор содержит только
          общую отсылку к закону; порядок уведомления не урегулирован.
        - Отдельно фиксируй условие о возложении риска неполучения
          на клиента (например, «при смене номера без уведомления банка
          риск неполучения лежит на клиенте»).

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Есть ли порядок направления юридически значимых сообщений.
        2. Какие каналы связи согласованы (SMS, e-mail, push, сайт,
          почта, личный кабинет).
        3. Есть ли условие о моменте, когда сообщение считается
          доставленным (презумпция доставки).
        4. Есть ли условие о возложении риска неполучения на клиента.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не путай «данные отсутствуют» и «данные есть, но вывод
          неоднозначен»:
          - если в тексте нет сведений — статус "not_defined", значение
            "Данные не определены";
          - если фрагмент есть, но из него нельзя сделать надёжный вывод —
            значение "Не удалось определить".
        3. Не используй "None", "null", пустые строки.
        4. В evidence включай только точные цитаты из договора.
        5. Не додумывай каналы связи, момент доставки или распределение
          рисков, если они не зафиксированы прямо.
        6. Различай общее упоминание «Банк уведомляет Клиента» (без
          конкретики) и детальное описание каналов с презумпцией доставки.

        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1 — порядок раскрыт: каналы, презумпция доставки, риск
        на клиенте:
        Фрагмент:
        "Банк направляет юридически значимые сообщения Клиенту по SMS
        на номер, указанный в анкете, и (или) по электронной почте.
        Сообщение считается доставленным в момент его отправки Банком.
        Клиент несет риск неполучения сообщения при смене номера телефона
        или e-mail без уведомления Банка."
        Ответ:
        {
          "notification_channels_status": "defined",
          "notification_channels_details": "SMS на номер, указанный в анкете, и (или) по электронной почте",
          "delivery_presumption_status": "defined",
          "delivery_presumption_details": "сообщение считается доставленным в момент его отправки Банком",
          "client_risk_of_undelivered_status": "defined",
          "client_risk_of_undelivered_details": "Клиент несет риск неполучения сообщения при смене номера телефона или e-mail без уведомления Банка",
          "notification_mode_display": "Риск неполучения лежит на клиенте при использовании согласованного канала",
          "evidence": [
            {
              "clause_ref": "п. 12.1",
              "quote": "Банк направляет юридически значимые сообщения Клиенту по SMS на номер, указанный в анкете, и (или) по электронной почте. Сообщение считается доставленным в момент его отправки Банком."
            },
            {
              "clause_ref": "п. 12.2",
              "quote": "Клиент несет риск неполучения сообщения при смене номера телефона или e-mail без уведомления Банка."
            }
          ]
        }
        Пример 2 — только отсылка к сайту банка:
        Фрагмент:
        "Информация об изменении тарифов размещается на официальном
        сайте Банка и считается доведенной до сведения Клиента
        с момента размещения."
        Ответ:
        {
          "notification_channels_status": "defined",
          "notification_channels_details": "официальный сайт Банка",
          "delivery_presumption_status": "defined",
          "delivery_presumption_details": "считается доведенной до сведения Клиента с момента размещения",
          "client_risk_of_undelivered_status": "defined",
          "client_risk_of_undelivered_details": "риск неполучения лежит на клиенте (сообщение считается доставленным с момента размещения на сайте)",
          "notification_mode_display": "Риск неполучения лежит на клиенте при использовании согласованного канала",
          "evidence": [
            {
              "clause_ref": "п. 12.1",
              "quote": "Информация об изменении тарифов размещается на официальном сайте Банка и считается доведенной до сведения Клиента с момента размещения."
            }
          ]
        }
        Пример 3 — порядок уведомления не урегулирован:
        Фрагмент:
        "Банк выполняет распоряжения Клиента о перечислении и выдаче
        денежных средств со счёта."
        Ответ:
        {
          "notification_channels_status": "not_defined",
          "notification_channels_details": "Данные не определены",
          "delivery_presumption_status": "not_defined",
          "delivery_presumption_details": "Данные не определены",
          "client_risk_of_undelivered_status": "not_defined",
          "client_risk_of_undelivered_details": "Данные не определены",
          "notification_mode_display": "Порядок уведомления не урегулирован",
          "evidence": []
        }
        Пример 4 — текст есть, но надёжный вывод сделать нельзя
        (противоречие между «письменным уведомлением» и «считается
        уведомленным через сайт»):
        Фрагмент:
        "Банк уведомляет Клиента об изменении условий в письменной форме.
        Информация об изменении тарифов считается доведенной до сведения
        Клиента с момента её размещения на сайте Банка."
        Ответ:
        {
          "notification_channels_status": "defined",
          "notification_channels_details": "письменная форма и сайт Банка",
          "delivery_presumption_status": "defined",
          "delivery_presumption_details": "считается доведенной до сведения с момента размещения на сайте",
          "client_risk_of_undelivered_status": "not_defined",
          "client_risk_of_undelivered_details": "Не удалось определить",
          "notification_mode_display": "Не удалось определить",
          "evidence": [
            {
              "clause_ref": "п. 12.1",
              "quote": "Банк уведомляет Клиента об изменении условий в письменной форме."
            },
            {
              "clause_ref": "п. 12.2",
              "quote": "Информация об изменении тарифов считается доведенной до сведения Клиента с момента её размещения на сайте Банка."
            }
          ]
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о каналах связи для уведомлений.
        2. Найди прямую цитату о моменте, когда сообщение считается
          доставленным.
        3. Найди прямую цитату о возложении риска неполучения на клиента.
        4. Разграничь «данных нет» (Данные не определены) и «данные есть,
          но вывод неоднозначен» (Не удалось определить).
        Не выводи шаги проверки — сформируй итоговый ответ согласно [ФОРМАТ ОТВЕТА].

        [ФОРМАТ ОТВЕТА]

        Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей.

        НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON,

        пригодным для парсинга через json.loads без предварительной обработки.
        Ответь РОВНО одним JSON-объектом без какого-либо дополнительного
        текста до или после, со всеми 7 ключами полей (evidence — служебный
        массив цитат, не относящийся к схеме полей):
        {
          "notification_channels_status": "<defined / not_defined>",
          "notification_channels_details": "<текст / 'Данные не определены' / 'Не удалось определить'>",
          "delivery_presumption_status": "<defined / not_defined>",
          "delivery_presumption_details": "<текст / 'Данные не определены' / 'Не удалось определить'>",
          "client_risk_of_undelivered_status": "<defined / not_defined>",
          "client_risk_of_undelivered_details": "<текст / 'Данные не определены' / 'Не удалось определить'>",
          "notification_mode_display": "<Риск неполучения лежит на клиенте при использовании согласованного канала / Банк несет риск фактической доставки сообщения / Порядок уведомления не урегулирован / Не удалось определить>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 8
      temperature: 0.0
      max_tokens: 600

    retrieval:
      retrieval_profile: "notification_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "юридически значимые сообщения считается доставленным считается полученным обязан уведомить об изменении актуальные контактные данные риск неполучения SMS электронная почта сайт"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - procedures
        - boilerplate
      negative_keywords:
        - "процентная ставка"
        - "тариф"
        - "комиссия"
        - "115-ФЗ приостановление"
        - "ДБО"
        - "страхование"
        - "очерёдность списания"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.60, 1.00]
        boost: 0.15
        scope: segment
      context_k: 8
      max_chunks: 10
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "procedures"
        - "boilerplate"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.12

    evidence:
      required: true
      min_snippet_length: 35
      max_snippet_length: 550

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 900
      compact_output: false

      presence_signal:
        field: "legally_significant_messages_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора банковского счёта
        или вклада условия о порядке направления юридически значимых
        сообщений: каналы связи, презумпция доставки, распределение рисков
        неполучения; сформируй читаемый вывод для DD Grid.
        Не анализируй проценты по вкладу, тарифы, AML, ДБО, овердрафт
        или страхование.
        Не подставляй нормы ст. 165.1 ГК РФ вместо текста договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. legally_significant_messages_check_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (notification_channels_status, delivery_presumption_status,
              client_risk_of_undelivered_status) ≠ "not_defined";
           - "missing" — если все три содержательных поля = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - notification_channels_status = "not_defined";
           - delivery_presumption_status = "not_defined";
           - client_risk_of_undelivered_status = "not_defined";
           - notification_channels_details, delivery_presumption_details,
             client_risk_of_undelivered_details = "Данные не определены";
           - notification_mode_display = "Порядок уведомления не урегулирован";
           - не выполняй остальные шаги.

        1. notification_channels_status:
           - "defined" — если в договоре прямо указаны каналы связи
             для направления юридически значимых сообщений (SMS, e-mail,
             push, сайт, почта, личный кабинет);
           - "not_defined" — если каналы связи прямо не указаны.

        2. notification_channels_details:
           Перечень согласованных каналов связи.
           Если данных нет — "Данные не определены";
           если фрагмент неоднозначен — "Не удалось определить".

        3. delivery_presumption_status:
           - "defined" — если в договоре прямо указано, в какой момент
             сообщение считается доставленным / полученным (презумпция
             доставки);
           - "not_defined" — если презумпция доставки прямо не указана.

        4. delivery_presumption_details:
           Формулировка о моменте доставки сообщения.
           Если данных нет — "Данные не определены";
           если фрагмент неоднозначен — "Не удалось определить".

        5. client_risk_of_undelivered_status:
           - "defined" — если в договоре прямо возложен риск неполучения
             сообщения на клиента (например, при смене номера без
             уведомления банка);
           - "not_defined" — если риск неполучения прямо не возложен
             на клиента.

        6. client_risk_of_undelivered_details:
           Формулировка о возложении риска неполучения на клиента.
           Если данных нет — "Данные не определены";
           если фрагмент неоднозначен — "Не удалось определить".

        7. notification_mode_display:
           Читаемый вывод о распределении рисков для DD Grid.
           Строго по правилам:
           - "Риск неполучения лежит на клиенте при использовании
             согласованного канала" — если в договоре есть презумпция
             доставки и (или) условие о возложении риска на клиента;
           - "Банк несет риск фактической доставки сообщения" — если
             в договоре прямо указано, что сообщение считается доставленным
             только при фактическом получении клиентом;
           - "Порядок уведомления не урегулирован" — если в договоре
             нет условия о порядке уведомления;
           - "Не удалось определить" — если формулировка есть, но вывод
             сделать нельзя.

        8. evidence:
           Массив объектов [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}].
           Включай только прямые цитаты из договора. Если прямых цитат нет —
           пустой массив.
        </task>

        <context_rules>
        - Перед остальными полями заполни legally_significant_messages_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined", все *_details = "Данные не определены", notification_mode_display = "Порядок уведомления не урегулирован".
        - Используй только текст договора.
        - Не подставляй нормы ст. 165.1 ГК РФ вместо текста договора.
          Отсутствие условия в договоре — это not_defined.
        - Различай общее упоминание «Банк уведомляет Клиента» (без конкретики)
          и детальное описание каналов с презумпцией доставки.
        - Если в договоре сказано «сообщение считается доставленным
          в момент отправки» или «с момента размещения на сайте» —
          это презумпция доставки: delivery_presumption_status = "defined",
          и как следствие — notification_mode_display = "Риск неполучения
          лежит на клиенте при использовании согласованного канала".
        - Если в договоре прямо указано «Клиент несет риск неполучения
          при смене номера без уведомления Банка» — client_risk_of_undelivered_status
          = "defined".
        - Если в договоре прямо указано «сообщение считается доставленным
          только в момент фактического получения Клиентом» — notification_mode_display
          = "Банк несет риск фактической доставки сообщения".
        - Не используй "None", "null", пустые строки.
        - Все текстовые значения пиши на русском языке, кроме служебных
          enum-значений status-полей.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни одного условия о порядке направления юридически
           значимых сообщений, каналах связи или распределении рисков
           неполучения.
           → presence = "missing";
             все *_status = "not_defined";
             все *_details = "Данные не определены";
             notification_mode_display = "Порядок уведомления не урегулирован".

        2. Только отсылка к сайту банка с презумпцией доставки.
           "Информация об изменении тарифов размещается на официальном
           сайте Банка и считается доведенной до сведения Клиента
           с момента размещения."
           → presence = "present";
             notification_channels_status = "defined";
             delivery_presumption_status = "defined";
             client_risk_of_undelivered_status = "defined";
             notification_mode_display = "Риск неполучения лежит на клиенте при использовании согласованного канала".

        3. Противоречие между фрагментами.
           В одном пункте договора — «Банк уведомляет Клиента в письменной
           форме», в другом — «информация считается доведенной с момента
           размещения на сайте».
           → presence = "unclear";
             соответствующий *_status = "not_defined";
             соответствующий *_details = "Не удалось определить";
             notification_mode_display = "Не удалось определить".

        4. Специфика темы: риск неполучения прямо возложен на клиента.
           "Клиент несет риск неполучения сообщения при смене номера
           телефона или e-mail без уведомления Банка."
           → presence = "present";
             client_risk_of_undelivered_status = "defined";
             client_risk_of_undelivered_details = "Клиент несет риск неполучения сообщения при смене номера телефона или e-mail без уведомления Банка";
             notification_mode_display = "Риск неполучения лежит на клиенте при использовании согласованного канала".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для legally_significant_messages_check_presence используй только: "present", "missing", "unclear".
        - Для status-полей используй только: "defined" или "not_defined".
        - Для notification_mode_display используй только значения из allowed_values, без свободных формулировок.
        - Fallback при отсутствии данных:
          * notification_channels_details, delivery_presumption_details, client_risk_of_undelivered_details → "Данные не определены";
          * notification_mode_display → "Порядок уведомления не урегулирован".
        - Fallback при противоречии или неоднозначности:
          * все *_details → "Не удалось определить";
          * notification_mode_display → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "legally_significant_messages_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования по юридически значимым сообщениям. Внутреннее агрегатное signal-поле."
          required: true

        - name: "notification_channels_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          description: "Статус определения каналов связи для юридически значимых сообщений."
          required: true
          display_in_grid: false

        - name: "notification_channels_details"
          type: "string"
          presentation: "fact"
          label: "Каналы уведомлений"
          description: "Перечень согласованных каналов связи (SMS, e-mail, push, сайт, почта, личный кабинет)."
          required: true
          display_in_grid: true
          display_priority: 1

        - name: "delivery_presumption_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус наличия презумпции доставки сообщения."
          required: true
          display_in_grid: false

        - name: "delivery_presumption_details"
          type: "string"
          presentation: "fact"
          label: "Момент доставки"
          description: "Условие, при котором сообщение считается юридически доставленным (презумпция доставки)."
          required: true
          display_in_grid: true
          display_priority: 2

        - name: "client_risk_of_undelivered_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус возложения риска неполучения сообщения на клиента."
          required: true
          display_in_grid: false

        - name: "client_risk_of_undelivered_details"
          type: "string"
          presentation: "fact"
          label: "Риски клиента"
          description: "Условия, при которых клиент несет риск неполучения юридически значимой информации."
          required: true
          display_in_grid: true
          display_priority: 3

        - name: "notification_mode_display"
          type: "string"
          presentation: "fact"
          label: "Режим уведомлений"
          allowed_values:
            - "Риск неполучения лежит на клиенте при использовании согласованного канала"
            - "Банк несет риск фактической доставки сообщения"
            - "Порядок уведомления не урегулирован"
            - "Не удалось определить"
          description: "Читаемый вывод о распределении рисков ненадлежащего уведомления между банком и клиентом."
          required: true
          display_in_grid: true
          display_priority: 4

      store_payload: true

# ════════════════════════════════════════════════════════════════════════════
# БЛОК 5: DD_REQUEST_TEMPLATES
# Читается: DDRequestTemplateLoader
# ════════════════════════════════════════════════════════════════════════════

dd_request_templates:
  bank_deposit_parties_identification:
    text: >
      Просим подтвердить по {doc_names}: реквизиты банка (ИНН, ОГРН, БИК,
      номер лицензии), реквизиты клиента / вкладчика, полномочия подписантов
      и правовое основание, по которому банк вправе осуществлять соответствующую
      банковскую операцию.
    addressee: "Банк / Клиент"
  bank_deposit_account_subject_extraction:
    text: >
      Просим предоставить по {doc_names}: сумму вклада или тип счёта, валюту,
      срок, тип договора (вклад / счёт), вид вклада (срочный / до востребования)
      и подтверждение передачи / зачисления средств.
    addressee: "Банк / Клиент"
  deposit_interest_and_fixation_check:
    text: >
      Просим уточнить в {doc_names}: процентную ставку, порядок начисления,
      капитализацию процентов, а также право банка изменять ставку и условия
      такого изменения.
    addressee: "Банк"
  deposit_early_withdrawal_check:
    text: >
      Просим уточнить в {doc_names}: право вкладчика на досрочный возврат,
      порядок пересчета процентов при досрочном возврате, ограничения
      досрочного возврата и порядок / срок возврата средств.
    addressee: "Банк / Вкладчик"
  account_tariffs_and_commissions_check:
    text: >
      Просим предоставить по {doc_names}: действующие тарифы банка, полный
      перечень комиссий, право банка изменять тарифы и порядок уведомления
      об изменениях.
    addressee: "Банк"
  aml_blocking_check:
    text: >
      Просим предоставить по {doc_names}: AML/CFT-положения, перечень документов
      для идентификации, основания приостановления операций и порядок
      разблокировки счёта.
    addressee: "Банк / Комплаенс"
  unauthorized_debit_check:
    text: >
      Просим уточнить в {doc_names}: основания безакцептного списания, перечень
      случаев списания без распоряжения клиента, порядок уведомления клиента
      и защиту от несанкционированных списаний.
    addressee: "Банк / Юридический советник"
  dbs_security_check:
    text: >
      Просим предоставить по {doc_names}: условия ДБО, механизм аутентификации,
      распределение ответственности за инциденты и порядок уведомления
      о компрометации средств доступа.
    addressee: "Банк / IT-служба"
  overdraft_terms_check:
    text: >
      Просим уточнить в {doc_names}: лимит овердрафта, процентную ставку,
      срок и порядок погашения, а также основания прекращения лимита.
    addressee: "Банк"
  _default:
    text: >
      Просим предоставить дополнительную информацию по вопросу «{check_name}»
      применительно к {doc_names}.
    addressee: "Юридический советник"

