    legal_base: "ст. 426, 834 ГК РФ"
    severity: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers:
      any: ["deposit_contract", "consumer_depositor"]
    rules:
      keywords:
        - "публичный договор"
