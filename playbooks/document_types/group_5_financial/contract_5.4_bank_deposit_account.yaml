type: contract_5.4_bank_deposit_account
name: "Договор банковского вклада (депозита) и банковского счета"

description: |
  Комплексный банковский тип документа, охватывающий две смежные конструкции:
  1) договор банковского вклада — договор, по которому банк принимает денежные средства
  от вкладчика и обязуется возвратить сумму вклада с процентами;
  2) договор банковского счета — договор, по которому банк обязуется открыть счет
  клиенту, принимать и зачислять поступающие денежные средства, выполнять распоряжения
  клиента о перечислении и выдаче средств и совершать иные операции по счету.
  Регулируется Главами 44 и 45 ГК РФ, а также специальным банковским, потребительским,
  AML/CFT и платежным законодательством.
  На практике ключевыми рисками являются статус и лицензия банка, проценты и досрочный
  возврат по вкладу, страхование вкладов физлиц, тарифы и комиссии по счету,
  приостановление операций по 115-ФЗ, безакцептное списание, безопасность ДБО
  и корректное закрытие счета.

version: 4.0
parent: class_5_financial_security

metadata:
  category: contract
  subcategory: financial_security
  complexity: high
  risk_level: critical
  jurisdiction: RU
  language: ru
  legal_base: "Главы 44-45 ГК РФ (ст. 834-860.15)"
  doc_types_supported:
    - "договор банковского вклада"
    - "договор банковского счета"
    - "депозитный договор"
    - "договор на открытие счета"
    - "договор РКО"
    - "договор расчетного счета"
    - "договор текущего счета"
    - "договор срочного вклада"
    - "договор вклада до востребования"
    - "договор банковского вклада физического лица"
    - "договор ДБО как приложение к счету"

engine_expectations:
  evidence_required: true
  evidence_style: "pinpoint"
  allow_not_found: true
  output_style: "dd_grid"
  prefer_structured_outputs: true

# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 1: КЛАССИФИКАЦИЯ (L1/L2)
#  Читается: YAMLRegistry → L1FilenameClassifier, L2HeaderClassifier
# ════════════════════════════════════════════════════════════════════════════

classification_runtime_v1:

  scoring:
    accept_threshold: 0.8
    strong_signal_threshold: 0.88
    ambiguity_margin: 0.18
    input_quality_weight: 1.0

  rules:

    filename_patterns:
      - "(?i)банковск.*вклад"
      - "(?i)банковск.*счет"
      - "(?i)депозит"
      - "(?i)расчетн.*счет"
      - "(?i)account"
      - "(?i)deposit"
      - "(?i)рко"

    folder_patterns:
      - "(?i)bank"
      - "(?i)deposit"
      - "(?i)account"
      - "(?i)вклад"
      - "(?i)счет"

    keywords:

      high:
        - pattern: "(?i)банковск[ийое]\\s+вклад"
          weight: 1.0
          distinctiveness: high
          context: any
          description: "Прямой маркер банковского вклада"

        - pattern: "(?i)банковск[ийое]\\s+сч[её]т"
          weight: 1.0
          distinctiveness: high
          context: any
          description: "Прямой маркер банковского счета"

        - pattern: "(?i)договор\\s+банковск[огоой]\\s+вклад[ауы]"
          weight: 1.0
          distinctiveness: high
          context: header
          description: "Основное название договора банковского вклада"

        - pattern: "(?i)договор\\s+банковск[огоой]\\s+сч[её]т[ауы]"
          weight: 1.0
          distinctiveness: high
          context: header
          description: "Основное название договора банковского счета"

        - pattern: "(?i)депозитн[ыйое]\\s+договор"
          weight: 0.95
          distinctiveness: high
          context: header
          description: "Депозитный договор как синоним договора вклада"

        - pattern: "(?i)договор\\s+на\\s+открыт[иеия]\\s+сч[её]т[ауы]"
          weight: 0.95
          distinctiveness: high
          context: header
          description: "Договор на открытие банковского счета"

        - pattern: "(?i)договор\\s+рко\\b"
          weight: 0.9
          distinctiveness: high
          context: header
          description: "Договор расчетно-кассового обслуживания"

        - pattern: "(?i)договор\\s+расч[её]тн[огоой]\\s+сч[её]т[ауы]"
          weight: 0.95
          distinctiveness: high
          context: header
          description: "Договор расчетного счета"

        - pattern: "(?i)договор\\s+текущ[егоий]\\s+сч[её]т[ауы]"
          weight: 0.95
          distinctiveness: high
          context: header
          description: "Договор текущего счета"

        - pattern: "(?i)договор\\s+срочн[огоой]\\s+вклад[ауы]"
          weight: 0.95
          distinctiveness: high
          context: header
          description: "Договор срочного вклада"

        - pattern: "(?i)договор\\s+вклад[ауы]\\s+до\\s+востребован[ияи]"
          weight: 0.95
          distinctiveness: high
          context: header
          description: "Договор вклада до востребования"

        - pattern: "(?i)договор\\s+банковск[огоой]\\s+вклад[ауы]\\s+физическ[огоой\\s]*лиц[ауы]"
          weight: 0.95
          distinctiveness: high
          context: header
          description: "Вклад физического лица"

        - pattern: "(?i)договор\\s+дбо\\b.*сч[её]т[ауы]"
          weight: 0.85
          distinctiveness: medium
          context: any
          description: "ДБО как приложение или режим обслуживания банковского счета"

        - pattern: "(?i)депозит[ауы]"
          weight: 0.8
          distinctiveness: medium
          context: any
          description: "Депозит как термин банковского вклада"

        - pattern: "(?i)вкладчик[а-я]*"
          weight: 0.9
          distinctiveness: high
          context: any
          description: "Вкладчик как сторона договора банковского вклада"

        - pattern: "(?i)банк[а-я]*"
          weight: 0.8
          distinctiveness: medium
          context: any
          description: "Банк как обязательный специальный субъект"

        - pattern: "(?i)процент[ыо]\\s+по\\s+вклад[уые]"
          weight: 0.9
          distinctiveness: high
          context: any
          description: "Проценты по банковскому вкладу"

        - pattern: "(?i)расч[её]тн[ыйое]\\s+сч[её]т"
          weight: 0.9
          distinctiveness: high
          context: any
          description: "Расчетный счет"

        - pattern: "(?i)текущ[ийее]\\s+сч[её]т"
          weight: 0.9
          distinctiveness: high
          context: any
          description: "Текущий счет"

      medium:
        - pattern: "(?i)срочн[ыо]й\\s+вклад"
          weight: 0.7
          distinctiveness: medium
          context: any
          description: "Срочный вклад"

        - pattern: "(?i)до\\s+востребовани[яя]"
          weight: 0.65
          distinctiveness: medium
          context: any
          description: "Формула вклада до востребования"

        - pattern: "(?i)процентн[а-яё]+\\s+ставк[аа]"
          weight: 0.6
          distinctiveness: medium
          context: any
          description: "Процентная ставка по вкладу или начислению на остаток"

        - pattern: "(?i)капитализаци[яи]\\s+процент[оо]в"
          weight: 0.65
          distinctiveness: medium
          context: any
          description: "Капитализация процентов по вкладу"

        - pattern: "(?i)расч[её]тно-?кассов[оа]е\\s+обслуживани[ея]"
          weight: 0.7
          distinctiveness: medium
          context: any
          description: "Расчетно-кассовое обслуживание по банковскому счету"

        - pattern: "(?i)\\bрко\\b"
          weight: 0.65
          distinctiveness: medium
          context: any
          description: "Сокращенное обозначение расчетно-кассового обслуживания"

        - pattern: "(?i)банковск[а-яё]+\\s+тайн[аа]"
          weight: 0.6
          distinctiveness: medium
          context: any
          description: "Банковская тайна"

        - pattern: "(?i)дистанционн[оа]е\\s+банковск[оа]е\\s+обслуживани[ея]"
          weight: 0.65
          distinctiveness: medium
          context: any
          description: "Дистанционное банковское обслуживание счета"

        - pattern: "(?i)интернет-?банк"
          weight: 0.55
          distinctiveness: medium
          context: any
          description: "Интернет-банк как канал обслуживания счета"

        - pattern: "(?i)\\bовердрафт\\b"
          weight: 0.5
          distinctiveness: low
          context: any
          description: "Овердрафт как сопутствующий режим счета, но не основной тип документа"

        - pattern: "(?i)страховани[ея]\\s+вклад[оо]в"
          weight: 0.65
          distinctiveness: medium
          context: any
          description: "Страхование вкладов физических лиц"

        - pattern: "(?i)\\bасв\\b"
          weight: 0.6
          distinctiveness: medium
          context: any
          description: "Агентство по страхованию вкладов"

        - pattern: "(?i)\\b115-фз\\b"
          weight: 0.55
          distinctiveness: medium
          context: any
          description: "AML/CFT-ограничения по банковскому счету и вкладу"

      low:
        - pattern: "(?i)выписк[аа]\\s+по\\s+сч[её]т[уу]"
          weight: 0.3
          distinctiveness: low
          context: any
          description: "Выписка по банковскому счету"

        - pattern: "(?i)безакцептн[оа]е\\s+списани[ея]"
          weight: 0.35
          distinctiveness: low
          context: any
          description: "Безакцептное списание со счета"

        - pattern: "(?i)исполнительн[ыо]й\\s+документ"
          weight: 0.25
          distinctiveness: low
          context: any
          description: "Исполнительный документ как основание списания/ареста"

        - pattern: "(?i)арест\\s+сч[её]т[аа]"
          weight: 0.25
          distinctiveness: low
          context: any
          description: "Арест банковского счета"

        - pattern: "(?i)налогов[ыо]й\\s+агент"
          weight: 0.2
          distinctiveness: low
          context: any
          description: "Налоговый агент в контексте расчетного счета клиента"

    exclusions:
      - pattern: "(?i)кредитн[ыо]й\\s+договор"
        severity: hard
        weight: -1.0
        description: "Кредитный договор — отдельный банковский продукт из § 2 Главы 42 ГК РФ"

      - pattern: "(?i)договор\\s+за[йеё]м[аа]"
        severity: hard
        weight: -1.0
        description: "Договор займа — самостоятельная конструкция, отличная от вклада и счета"

      - pattern: "(?i)договор\\s+хранени[яя]"
        severity: hard
        weight: -1.0
        description: "Хранение имущества не является договором банковского вклада или счета"

      - pattern: "(?i)договор\\s+факторинг[аа]"
        severity: hard
        weight: -1.0
        description: "Факторинг — отдельный вид финансирования под уступку денежного требования"

      # ── Soft exclusions

      - pattern: "(?i)\\bэскроу\\b"
        severity: soft
        weight: -0.3
        description: "Счет эскроу близок к банковскому счету, но является специальным режимом"

      - pattern: "(?i)номинальн[ыо]й\\s+сч[её]т"
        severity: soft
        weight: -0.3
        description: "Номинальный счет — специальная разновидность счета, может требовать отдельной типизации"

      - pattern: "(?i)публичн[ыо]й\\s+депозитн[ыо]й\\s+сч[её]т"
        severity: soft
        weight: -0.3
        description: "Публичный депозитный счет — специальная банковская конструкция"

# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 2: ТРИГГЕРЫ
#  Читается: TriggerDetector → doc.applicable_triggers
# ════════════════════════════════════════════════════════════════════════════

trigger_definitions:

  deposit_contract:
    any_keywords:
      - "(?i)банковск[иоя]+\\s+вклад"
      - "(?i)\\bдепозит\\b"
      - "(?i)\\bвкладчик\\b"
      - "(?i)сумм[аа]\\s+вклад[аа]"
      - "(?i)процент[ыа]\\s+по\\s+вклад[уу]"

  bank_account_contract:
    any_keywords:
      - "(?i)банковск[иоя]+\\s+сч[её]т"
      - "(?i)расч[её]тн[ыо]й\\s+сч[её]т"
      - "(?i)текущ[иоя]+\\s+сч[её]т"
      - "(?i)банк\\s+обязуетс[яьа]\\s+открыть\\s+сч[её]т"
      - "(?i)операци[ии]\\s+по\\s+сч[её]т[уу]"
      - "(?i)\\bрко\\b"

  consumer_depositor:
    any_keywords:
      - "(?i)физическ[оеая]\\s+лиц[оо]"
      - "(?i)\\bгражданин\\b"
      - "(?i)\\bвкладчик\\b"
      - "(?i)\\bпаспорт\\b"

  term_deposit:
    any_keywords:
      - "(?i)срочн[ыо]й\\s+вклад"
      - "(?i)на\\s+срок"
      - "(?i)срок\\s+вклад[аа]"
      - "(?i)дата\\s+возврат[аа]\\s+вклад[аа]"

  on_demand_deposit:
    any_keywords:
      - "(?i)до\\s+востребовани[яя]"
      - "(?i)вклад\\s+до\\s+востребовани[яя]"
      - "(?i)по\\s+первому\\s+требовани[юя]"

  overdraft_present:
    any_keywords:
      - "(?i)\\bовердрафт\\b"
      - "(?i)кредитовани[ея]\\s+сч[её]т[аа]"
      - "(?i)лимит\\s+овердрафт[аа]"
      - "(?i)дебетов[оа]е\\s+сальдо"

  dbs_enabled:
    any_keywords:
      - "(?i)дистанционн[оа]е\\s+банковск[оа]е\\s+обслуживани[ея]"
      - "(?i)интернет-?банк"
      - "(?i)мобильн[оа]е\\s+приложени[ея]"
      - "(?i)электронн[а-яё]+\\s+подпис[ья]"
      - "(?i)\\bдбо\\b"

  aml_ctf_terms:
    any_keywords:
      - "(?i)\\b115-фз\\b"
      - "(?i)идентификаци[яи]\\s+клиент[аа]"
      - "(?i)подозрительн[ыо]е\\s+операци[ии]"
      - "(?i)противодействи[ея]\\s+легализаци[ии]"
      - "(?i)приостановлени[ея]\\s+операци[ий]"

  foreign_currency_account_or_deposit:
    any_keywords:
      - "(?i)\\bдоллар\\b"
      - "(?i)\\bевро\\b"
      - "(?i)\\busd\\b"
      - "(?i)\\beur\\b"
      - "(?i)иностранн[а-яё]+\\s+валют[аа]"
      - "(?i)валютн[ыо]й\\s+сч[её]т"
      - "(?i)валютн[ыо]й\\s+вклад"

  deposit_insurance_relevant:
    any_keywords:
      - "(?i)страховани[ея]\\s+вклад[оо]в"
      - "(?i)\\bасв\\b"
      - "(?i)страхов[оа]е\\s+возмещени[ея]"

  escrow_account:
    any_keywords:
      - "(?i)\\bэскроу\\b"
      - "(?i)сч[её]т\\s+эскроу"
      - "(?i)\\bescrow\\b"
      - "(?i)депонировани[ея]\\s+средств"
      - "(?i)услови[яя]\\s+раскрыти[яя]"

  joint_account:
    any_keywords:
      - "(?i)совместн[ыо]й\\s+сч[её]т"
      - "(?i)несколько\\s+распорядител[еей]"
      - "(?i)доверенност[ьи]\\s+на\\s+сч[её]т"
      - "(?i)представител[ья]\\s+по\\s+сч[её]т[уу]"
      - "(?i)прав[оа]\\s+подпис[ии]"

# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 3: SHARED PATTERNS
#  Читается: DocTypeCheckLoader через _resolve_yaml_templates()
# ════════════════════════════════════════════════════════════════════════════

shared_patterns:

  money_amount: "(?i)\\b\\d[\\d\\s]*(?:руб|рублей|₽|коп|тыс|млн|млрд)"
  percentage_pattern: "(?i)\\b\\d+(?:[.,]\\d+)?\\s*%\\b"
  date_pattern: "(?i)\\b\\d{1,2}[.]\\d{1,2}[.]\\d{4}\\b"
  iban_or_account_pattern: "(?i)\\b4\\d{19}\\b|\\b\\d{20}\\b"
  license_pattern: "(?i)лиценз[ияе]\\s*(?:№|N|No\\.)?\\s*[A-ZА-Я0-9\\-\\/]+"

# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 4: COMPLIANCE RULES
#  Читается: DocTypeCheckLoader._exclusion_logic_to_checks()
# ════════════════════════════════════════════════════════════════════════════

compliance_rules:

  - id: "bank_license_missing"
    name: "Отсутствуют признаки лицензии банка"
    description: "Банковский вклад и банковский счет могут вестись только банком/кредитной организацией с надлежащей лицензией"
    legal_base: "ст. 834, 845 ГК РФ, ФЗ № 395-1"
    required_triggers: []
    severity: "critical"
    result_if_triggered: "fail"
    detector_type: "rules"
    rules:
      negative_keywords:
        - "банк"
        - "кредитная организация"
        - "лицензия банка россии"
        - "генеральная лицензия"
        - "цб рф"
      keyword_mode: "any"
    retrieval:
      context_k: 5
      boost_keywords:
        - "лицензия банка россии"
        - "банк"
        - "кредитная организация"
      rerank: true

  - id: "consumer_deposit_without_insurance_disclosure"
    name: "Вклад физического лица без раскрытия страхования вкладов"
    description: "Для вкладов физлиц отсутствие признаков раскрытия страхования вкладов является существенным риском"
    legal_base: "ст. 840 ГК РФ, ФЗ № 177-ФЗ"
    required_triggers: ["deposit_contract", "consumer_depositor"]
    severity: "critical"
    result_if_triggered: "fail"
    detector_type: "rules"
    rules:
      negative_keywords:
        - "страхование вкладов"
        - "асв"
        - "страховое возмещение"
        - "1,4 млн"
        - "1 400 000"
      keyword_mode: "any"
    retrieval:
      context_k: 5
      boost_keywords:
        - "страхование вкладов"
        - "асв"
        - "страховое возмещение"
      rerank: true

  - id: "term_deposit_rate_change_risk"
    name: "Риск одностороннего снижения ставки по срочному вкладу гражданина"
    description: "Для срочного вклада гражданина банк не вправе односторонне уменьшать процентную ставку"
    legal_base: "ст. 838 ГК РФ"
    required_triggers: ["deposit_contract", "consumer_depositor", "term_deposit"]
    severity: "critical"
    result_if_triggered: "fail"
    detector_type: "rules"
    rules:
      keywords:
        - "банк вправе изменить процентную ставку"
        - "процентная ставка может быть изменена банком"
        - "в одностороннем порядке изменить ставку"
      keyword_mode: "any"
    retrieval:
      context_k: 5
      boost_keywords:
        - "процентная ставка"
        - "в одностороннем порядке"
        - "срочный вклад"
      rerank: true

  - id: "overdraft_without_core_terms"
    name: "Овердрафт без ясных условий"
    description: "Если в договоре есть овердрафт, должны быть понятны лимит, проценты и порядок погашения"
    legal_base: "ст. 850 ГК РФ"
    required_triggers: ["overdraft_present"]
    severity: "critical"
    result_if_triggered: "fail"
    detector_type: "rules"
    rules:
      keywords:
        - "овердрафт"
        - "кредитование счета"
      negative_keywords:
        - "лимит овердрафта"
        - "проценты за овердрафт"
        - "срок погашения"
      keyword_mode: "any"
    retrieval:
      context_k: 5
      boost_keywords:
        - "овердрафт"
        - "лимит"
        - "проценты"
      rerank: true

  - id: "foreign_currency_terms_unclear"
    name: "Валютный вклад/счет без ясных валютных условий"
    description: "Для валютной банковской конструкции должны быть понятны валюта счета/вклада, пересчет и банковские ограничения"
    legal_base: "ГК РФ, валютное регулирование"
    required_triggers: ["foreign_currency_account_or_deposit"]
    severity: "high"
    result_if_triggered: "fail"
    detector_type: "rules"
    rules:
      keywords:
        - "доллар"
        - "евро"
        - "usd"
        - "eur"
      negative_keywords:
        - "валюта счета"
        - "курс"
        - "конвертация"
        - "пересчет"
      keyword_mode: "any"
    retrieval:
      context_k: 5
      boost_keywords:
        - "валюта счета"
        - "конвертация"
        - "пересчет"
      rerank: true

  - id: "deposit_exceeds_insurance_limit"
    name: "Вклад физлица превышает лимит страхового возмещения АСВ (1,4 млн руб.)"
    description: |
      При отзыве лицензии банка вкладчик получает страховое возмещение
      не более 1,4 млн руб. (ФЗ-177). Если сумма вклада превышает этот лимит,
      разница не застрахована — критический риск для вкладчика.
    legal_base: "ФЗ № 177-ФЗ, ст. 11"
    required_triggers: ["deposit_contract", "consumer_depositor"]
    severity: "high"
    result_if_triggered: "warn"
    detector_type: "rules"
    rules:
      keywords:
        - "свыше 1 400 000"
        - "свыше 1,4 млн"
        - "превышает лимит страхования"
        - "не покрывается страхованием"
      keyword_mode: "any"
    retrieval:
      context_k: 4
      boost_keywords:
        - "1 400 000"
        - "лимит страхования"
        - "страховое возмещение"
      rerank: true

  - id: "escrow_account_without_special_regime"
    name: "Эскроу-счёт без специального режима (ст. 860.7-860.10 ГК РФ)"
    description: |
      Счёт эскроу имеет специальный правовой режим: средства блокируются до наступления
      условий, указанных в договоре. Без соблюдения специальных правил ГК РФ
      «эскроу» превращается в обычный счёт без защиты.
    legal_base: "ст. 860.7-860.10 ГК РФ"
    required_triggers: ["escrow_account"]
    severity: "critical"
    result_if_triggered: "warn"
    detector_type: "rules"
    rules:
      keywords:
        - "условия раскрытия"
        - "основания для перечисления"
        - "блокировка средств"
        - "депонент"
        - "бенефициар"
      keyword_mode: "any"
      negative_keywords:
        - "условия раскрытия не определены"
    retrieval:
      context_k: 5
      boost_keywords:
        - "эскроу"
        - "условия раскрытия"
        - "депонент"
        - "бенефициар"
      rerank: true

  - id: "unilateral_tariff_change_consumer"
    name: "Одностороннее изменение тарифов для потребителя (ЗоЗПП, ст. 16)"
    description: |
      Одностороннее изменение тарифов банком для потребителя (физлица)
      может быть признано ущемляющим права потребителя (ст. 16 ЗоЗПП).
      Роспотребнадзор и суды неоднократно признавали такие условия недействительными.
    legal_base: "ст. 16 ЗоЗПП, ст. 310 ГК РФ"
    required_triggers: ["consumer_depositor"]
    severity: "high"
    result_if_triggered: "warn"
    detector_type: "rules"
    rules:
      keywords:
        - "банк вправе в одностороннем порядке изменить тарифы"
        - "изменение тарифов без согласия клиента"
        - "новые тарифы размещаются на сайте"
      keyword_mode: "any"
    retrieval:
      context_k: 4
      boost_keywords:
        - "одностороннее изменение тарифов"
        - "без согласия клиента"
      rerank: true

# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 5: CHECKS_V8 — LLM/hybrid проверки
#  Читается: DocTypeCheckLoader._load_doc_type_checks()
# ════════════════════════════════════════════════════════════════════════════

checks_v8:

  - id: bank_deposit_account_subject_extraction
    name: "Базовое извлечение параметров вклада/счета"
    description: "Извлекает тип банковского договора, банк, клиента, сумму, валюту, проценты, срок и специальные банковские условия"
    triggers: {}
    severity: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "банковский вклад"
        - "банковский счет"
        - "депозит"
        - "вкладчик"
        - "клиент"
        - "процентная ставка"
        - "расчетный счет"
        - "текущий счет"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)(банковск(ий|ого)\\s+вклад|банковск(ий|ого)\\s+счет|депозит)"
        - "(?i)\\b\\d[\\d\\s]*(?:руб|рублей|₽|коп|тыс|млн|млрд)\\b"
        - "(?i)\\b\\d+(?:[.,]\\d+)?\\s*%\\b"
    llm:
      prompt_template: |
        Ты — юридический ассистент, анализирующий договор банковского вклада или банковского счета.
        Извлеки ключевые параметры строго по тексту.

        Ответь строго в JSON:
        {
          "contract_type": "<deposit / account / mixed / unclear / not_found>",
          "bank": "<банк или not_found>",
          "client": "<клиент/вкладчик или not_found>",
          "amount": "<сумма вклада/лимит/остаток если явно указан или not_found>",
          "currency": "<RUB / USD / EUR / other / not_found>",
          "deposit_type": "<term / on_demand / not_applicable / unclear / not_found>",
          "interest_rate": "<ставка или not_found>",
          "account_type": "<settlement / current / special / other / not_applicable / not_found>",
          "overdraft_status": "<present / absent / not_found>",
          "dbs_status": "<present / absent / not_found>"
        }

        Используй только явно указанные в тексте сведения.
        Если данных нет — пиши "not_found".
      prompt_file: null
      context_k: 6
      temperature: 0.0
      max_tokens: 700
    retrieval:
      context_k: 6
      max_chunks: 10
      boost_keywords:
        - "банковский вклад"
        - "банковский счет"
        - "процентная ставка"
        - "срочный вклад"
        - "расчетный счет"
      rerank: true
      filters: {}
    evidence:
      required: true
      min_snippet_length: 50
      max_snippet_length: 700
    extraction:
      enabled: true
      mode: "hybrid"
      fields:
        - name: "contract_type"
          type: "string"
          allowed_values: ["deposit", "account", "mixed", "unclear", "not_found"]
          description: "Тип банковского договора"
        - name: "bank"
          type: "string"
          keyword_hints: ["банк", "кредитная организация"]
          description: "Банк"
        - name: "client"
          type: "string"
          keyword_hints: ["клиент", "вкладчик"]
          description: "Клиент/вкладчик"
        - name: "amount"
          type: "string"
          keyword_hints: ["сумма вклада", "размер вклада", "остаток", "лимит"]
          description: "Сумма/лимит"
        - name: "currency"
          type: "string"
          allowed_values: ["RUB", "USD", "EUR", "other", "not_found"]
          description: "Валюта"
        - name: "deposit_type"
          type: "string"
          allowed_values: ["term", "on_demand", "not_applicable", "unclear", "not_found"]
          description: "Вид вклада"
        - name: "interest_rate"
          type: "string"
          regex_patterns:
            - "(?i)\\b\\d+(?:[.,]\\d+)?\\s*%\\b"
          description: "Процентная ставка"
        - name: "account_type"
          type: "string"
          allowed_values: ["settlement", "current", "special", "other", "not_applicable", "not_found"]
          description: "Тип счета"
        - name: "overdraft_status"
          type: "string"
          allowed_values: ["present", "absent", "not_found"]
          description: "Наличие овердрафта"
        - name: "dbs_status"
          type: "string"
          allowed_values: ["present", "absent", "not_found"]
          description: "Наличие ДБО"
      store_payload: true

  - id: deposit_interest_and_fixation_check
    name: "Вклад: проценты, капитализация и изменение ставки"
    description: "Проверяет размер процентной ставки, порядок начисления процентов и риск изменения ставки"
    triggers:
      any: ["deposit_contract"]
    severity: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "проценты по вкладу"
        - "процентная ставка"
        - "капитализация процентов"
        - "начисление процентов"
        - "банк вправе изменить ставку"
        - "ставка не подлежит изменению"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)процентн(ая|ой)\\s+ставк"
        - "(?i)капитализац"
        - "(?i)не\\s+подлежит\\s+изменению|вправе\\s+изменить\\s+ставку"
    llm:
      prompt_template: |
        Ты — юридический ассистент, анализирующий договор банковского вклада.
        Проверь условия о процентах.

        Ответь строго в JSON:
        {
          "interest_rate_status": "<present / not_found>",
          "interest_payment_mode": "<periodic / at_maturity / capitalized / mixed / not_found>",
          "rate_change_right": "<bank_can_change / bank_cannot_change / unclear / not_found>",
          "rate_clause_clarity": "<clear / unclear / not_found>"
        }

        Используй только текст договора.
      prompt_file: null
      context_k: 5
      temperature: 0.0
      max_tokens: 380
    retrieval:
      context_k: 5
      max_chunks: 8
      boost_keywords:
        - "проценты по вкладу"
        - "капитализация"
        - "ставка не подлежит изменению"
      rerank: true
      filters: {}
    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 600
    extraction:
      enabled: true
      mode: "hybrid"
      fields:
        - name: "interest_rate_status"
          type: "string"
          allowed_values: ["present", "not_found"]
          description: "Наличие ставки по вкладу"
        - name: "interest_payment_mode"
          type: "string"
          allowed_values: ["periodic", "at_maturity", "capitalized", "mixed", "not_found"]
          description: "Способ выплаты/начисления процентов"
        - name: "rate_change_right"
          type: "string"
          allowed_values: ["bank_can_change", "bank_cannot_change", "unclear", "not_found"]
          description: "Право банка менять ставку"
        - name: "rate_clause_clarity"
          type: "string"
          allowed_values: ["clear", "unclear", "not_found"]
          description: "Понятность процентной оговорки"
      store_payload: true

  - id: deposit_early_withdrawal_check
    name: "Вклад: досрочный возврат и пересчет процентов"
    description: "Проверяет право на досрочное изъятие вклада и порядок пересчета процентов"
    triggers:
      any: ["deposit_contract"]
    severity: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "досрочное расторжение"
        - "досрочный возврат вклада"
        - "пересчет процентов"
        - "ставка до востребования"
        - "по требованию вкладчика"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)досрочн(ое|ого)\\s+(расторжен|возврат)"
        - "(?i)пересчет\\s+процент"
        - "(?i)до\\s+востребования"
    llm:
      prompt_template: |
        Ты — юридический ассистент, анализирующий договор банковского вклада.
        Проверь условия досрочного возврата вклада.

        Ответь строго в JSON:
        {
          "early_withdrawal_status": "<allowed / restricted / not_found>",
          "interest_recalculation_rule": "<on_demand_rate / other / unclear / not_found>",
          "notice_requirement": "<present / not_found>",
          "early_withdrawal_clause_clarity": "<clear / unclear / not_found>"
        }

        Используй только текст договора.
      prompt_file: null
      context_k: 5
      temperature: 0.0
      max_tokens: 360
    retrieval:
      context_k: 5
      max_chunks: 7
      boost_keywords:
        - "досрочный возврат вклада"
        - "пересчет процентов"
        - "до востребования"
      rerank: true
      filters: {}
    evidence:
      required: true
      min_snippet_length: 35
      max_snippet_length: 550
    extraction:
      enabled: true
      mode: "hybrid"
      fields:
        - name: "early_withdrawal_status"
          type: "string"
          allowed_values: ["allowed", "restricted", "not_found"]
          description: "Статус досрочного возврата вклада"
        - name: "interest_recalculation_rule"
          type: "string"
          allowed_values: ["on_demand_rate", "other", "unclear", "not_found"]
          description: "Правило пересчета процентов"
        - name: "notice_requirement"
          type: "string"
          allowed_values: ["present", "not_found"]
          description: "Есть ли требование уведомления"
      store_payload: true

  - id: account_tariffs_and_commissions_check
    name: "Счет: тарифы, комиссии и изменение стоимости услуг"
    description: "Проверяет раскрытие тарифов банка, комиссий за обслуживание и риск одностороннего изменения"
    triggers:
      any: ["bank_account_contract"]
    severity: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
