        - "капитализация"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)процентн(ая|ой)\\s+ставк"
        - "(?i)\\b\\d+(?:[.,]\\d+)?\\s*%\\b"

  - id: "deposit_return_procedure"
    name: "Вклад: порядок возврата"
    description: "Проверяет наличие порядка возврата вклада, включая досрочный возврат"
