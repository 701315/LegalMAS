doc_type_checks:

  - id: "bank_identification_and_license"
    name: "Банк: идентификация и лицензия"
    description: "Проверяет наличие идентификации банка и признаков лицензии Банка России"
    legal_base: "ст. 834, 845 ГК РФ, ФЗ № 395-1"
