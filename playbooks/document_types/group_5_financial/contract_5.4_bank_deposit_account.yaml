          description: "Основание полномочий подписанта банка."
          required: true
          display_in_grid: false
      store_payload: true

  - id: bank_deposit_account_subject_extraction
    name: "Предмет вклада / счета: сумма, валюта, срок, тип договора"
    description: >
      Фактографическая проверка наличия в договоре суммы вклада / типа счёта,
      валюты, срока, типа договора (вклад / счёт / смешанный), вида вклада
      (срочный / до востребования / на иных условиях возврата) и указания
      на подтверждение передачи / зачисления средств. Типоспецифичная проверка
      для договоров банковского вклада и банковского счёта: сумма, валюта,
      срок и вид вклада здесь — существенные условия (ст. 834–837, 845–849
      ГК РФ), а не boilerplate-оговорка.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "сумма вклада"
        - "размер вклада"
        - "валюта"
        - "срок вклада"
        - "тип счета"
        - "расчетный счет"
        - "текущий счет"
        - "срочный вклад"
        - "до востребования"
        - "внесение вклада"
        - "зачисление"
        - "переданы"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)\\b\\d[\\d\\s]*(?:руб|рублей|₽|коп|тыс|млн|млрд)"
        - "(?i)\\b\\d+(?:[.,]\\d+)?\\s*%"
        - "(?i)(срочн|до\\s+востребовани)"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор банковского вклада или банковского счета
        (Главы 44–45 ГК РФ).
        Проверяется только один вопрос: сумма вклада / тип счёта, валюта,
        срок, тип договора, вид вклада и подтверждение передачи / зачисления
        средств.
        Нормативный ориентир:
        - ст. 834–837 ГК РФ — банковский вклад (существенные условия:
          сумма, валюта, срок / вид вклада)
        - ст. 845–849 ГК РФ — банковский счёт
        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора.
        - Не оценивай серьёзность риска.
        - Для договора вклада вид вклада (срочный / до востребования /
          на иных условиях возврата) — существенное условие; для договора
          счёта этот параметр объективно не применим.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Тип договора (вклад / счёт / смешанный).
        2. Сумму вклада или тип счёта (расчётный / текущий / корр.).
        3. Валюту.
        4. Срок вклада или срок действия договора счёта.
        5. Вид вклада (срочный / до востребования / на иных условиях
          возврата).
        6. Есть ли подтверждение передачи / зачисления средств.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не путай «данные отсутствуют» и «данные есть, но вывод
          неоднозначен»:
          - если в тексте нет сведений — статус "not_defined", значение
            "Данные не определены";
          - если фрагмент есть, но из него нельзя сделать надёжный вывод —
            значение "Не удалось определить";
          - если параметр к этому договору объективно не применим —
            значение "Не применимо".
        3. Не используй "None", "null", пустые строки.
        4. В evidence включай только точные цитаты из договора.
        5. Не додумывай сумму, валюту, срок, вид вклада, если они в тексте
          не зафиксированы прямо.

        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1 — срочный вклад с суммой, валютой и подтверждением зачисления:
        Фрагмент:
        "Банк принимает от Вкладчика денежные средства в размере 1 500 000
        рублей на срочный вклад сроком на 12 месяцев. Валюта вклада — рубли РФ.
        Средства зачислены на счет Вкладчика в день подписания договора."
        Ответ:
        {
          "contract_type": "deposit",
          "amount_status": "defined",
          "amount_value": "1 500 000 рублей",
          "currency": "RUB",
          "currency_display": "Российские рубли (RUB)",
          "term_status": "defined",
          "term_value": "12 месяцев",
          "deposit_kind": "term",
          "deposit_kind_display": "Срочный вклад",
          "transfer_evidence_status": "defined",
          "transfer_evidence_details": "средства зачислены на счет Вкладчика в день подписания договора",
          "evidence": [
            {
              "clause_ref": "п. 1.1",
              "quote": "Банк принимает от Вкладчика денежные средства в размере 1 500 000 рублей на срочный вклад сроком на 12 месяцев."
            }
          ]
        }
        Пример 2 — договор счёта: deposit_kind неприменим, amount_value — тип счёта:
        Фрагмент:
        "Банк открывает Клиенту расчетный счет в рублях РФ для проведения
        расчетных операций."
        Ответ:
        {
          "contract_type": "account",
          "amount_status": "not_defined",
          "amount_value": "Расчётный счёт",
          "currency": "RUB",
          "currency_display": "Российские рубли (RUB)",
          "term_status": "not_defined",
          "term_value": "Данные не определены",
          "deposit_kind": "not_defined",
          "deposit_kind_display": "Не применимо",
          "transfer_evidence_status": "not_defined",
          "transfer_evidence_details": "Данные не определены",
          "evidence": [
            {
              "clause_ref": "п. 1.1",
              "quote": "Банк открывает Клиенту расчетный счет в рублях РФ для проведения расчетных операций."
            }
          ]
        }
        Пример 3 — данных в договоре нет вообще:
        Фрагмент:
        "Банк открывает Клиенту счет."
        Ответ:
        {
          "contract_type": "account",
          "amount_status": "not_defined",
          "amount_value": "Данные не определены",
          "currency": "not_defined",
          "currency_display": "Не удалось определить",
          "term_status": "not_defined",
          "term_value": "Данные не определены",
          "deposit_kind": "not_defined",
          "deposit_kind_display": "Не применимо",
          "transfer_evidence_status": "not_defined",
          "transfer_evidence_details": "Данные не определены",
          "evidence": []
        }
        Пример 4 — текст есть, но надёжный вывод сделать нельзя (сумма
        определяется через доп. соглашение, а не в самом договоре):
        Фрагмент:
        "Банк принимает от Вкладчика денежные средства на срочный вклад
        сроком на 24 месяца. Сумма вклада определяется в дополнительном
        соглашении сторон, являющемся неотъемлемой частью настоящего
        договора."
        Ответ:
        {
          "contract_type": "deposit",
          "amount_status": "not_defined",
          "amount_value": "Не удалось определить",
          "currency": "not_defined",
          "currency_display": "Не удалось определить",
          "term_status": "defined",
          "term_value": "24 месяца",
          "deposit_kind": "term",
          "deposit_kind_display": "Срочный вклад",
          "transfer_evidence_status": "not_defined",
          "transfer_evidence_details": "Данные не определены",
          "evidence": [
            {
              "clause_ref": "п. 1.1",
              "quote": "Банк принимает от Вкладчика денежные средства на срочный вклад сроком на 24 месяца."
            },
            {
              "clause_ref": "п. 1.2",
              "quote": "Сумма вклада определяется в дополнительном соглашении сторон, являющемся неотъемлемой частью настоящего договора."
            }
          ]
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о типе договора (вклад / счёт / смешанный).
        2. Найди прямую цитату о сумме или типе счёта.
        3. Найди прямую цитату о валюте.
        4. Найди прямую цитату о сроке.
        5. Найди прямую цитату о виде вклада (срочный / до востребования /
          иные условия возврата).
        6. Найди прямую цитату о подтверждении передачи / зачисления средств.
        7. Разграничь «данных нет» (Данные не определены) и «данные есть,
          но вывод неоднозначен» (Не удалось определить). Для договора счёта
          deposit_kind_display = "Не применимо", а не "Не удалось определить".
          Не додумывай.
        Не выводи шаги проверки — сформируй итоговый ответ согласно [ФОРМАТ ОТВЕТА].

        [ФОРМАТ ОТВЕТА]

        Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей.

        НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON,

        пригодным для парсинга через json.loads без предварительной обработки.
        Ответь РОВНО одним JSON-объектом без какого-либо дополнительного
        текста до или после, со всеми 11 ключами (evidence — служебный
        массив, не считается ключом схемы полей):
        {
          "contract_type": "<deposit / account / mixed / not_defined>",
          "amount_status": "<defined / not_defined>",
          "amount_value": "<текст / 'Данные не определены' / 'Не удалось определить'>",
          "currency": "<RUB / USD / EUR / other / not_defined>",
          "currency_display": "<Российские рубли (RUB) / Доллары США (USD) / Евро (EUR) / Иная валюта / Не удалось определить>",
          "term_status": "<defined / not_defined>",
          "term_value": "<текст / 'Данные не определены' / 'Не удалось определить'>",
          "deposit_kind": "<term / on_demand / other_conditions / not_defined>",
          "deposit_kind_display": "<Срочный вклад / До востребования / На иных условиях возврата / Не удалось определить / Не применимо>",
          "transfer_evidence_status": "<defined / not_defined>",
          "transfer_evidence_details": "<текст / 'Данные не определены' / 'Не удалось определить'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 8
      temperature: 0.0
      max_tokens: 700

    retrieval:
      retrieval_profile: "payment_terms_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "сумма вклада размер вклада валюта срок вклада тип счета расчетный счет текущий счет срочный вклад до востребования внесение вклада зачисление переданы"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - definitions
        - obligations
      negative_keywords:
        - "процентная ставка"
        - "тариф"
        - "комиссия"
        - "овердрафт"
        - "115-ФЗ"
        - "безакцептное"
        - "ДБО"
        - "страхование"
        - "закрытие счета"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.0, 0.35]
        boost: 0.20
        scope: segment
      context_k: 8
      max_chunks: 10
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "definitions"
        - "obligations"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.12

    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 650

    extraction:
      enabled: true
      mode: "hybrid"
      compact_output: false
      llm_max_tokens: 1200

      presence_signal:
        field: "bank_deposit_account_subject_extraction_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора банковского вклада
        или банковского счёта сумму (или тип счёта), валюту, срок, тип
        договора, вид вклада и подтверждение передачи / зачисления средств.
        Не анализируй проценты, тарифы, AML, ДБО или страхование.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. bank_deposit_account_subject_extraction_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (contract_type, amount_status, term_status, transfer_evidence_status)
             ≠ "not_defined";
           - "missing" — если все четыре содержательных поля = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - contract_type = "not_defined";
           - amount_status = "not_defined";
           - currency = "not_defined";
           - term_status = "not_defined";
           - deposit_kind = "not_defined";
           - transfer_evidence_status = "not_defined";
           - amount_value, currency_display, term_value, transfer_evidence_details = "Данные не определены";
           - deposit_kind_display = "Не удалось определить";
           - не выполняй остальные шаги.

        1. contract_type:
           "deposit" / "account" / "mixed" / "not_defined".

        2. amount_status:
           - "defined" — если сумма вклада или тип счёта прямо указаны;
           - "not_defined" — если прямо не указаны.

        3. amount_value:
           Сумма вклада (для "deposit") или тип счёта (для "account": расчётный / текущий / корреспондентский).
           Если данных нет — "Данные не определены"; если фрагмент есть, но неоднозначен — "Не удалось определить".

        4. currency:
           "RUB" / "USD" / "EUR" / "other" / "not_defined".

        5. currency_display:
           Читаемое значение валюты для DD Grid. Строго соответствует currency:
           RUB → "Российские рубли (RUB)";
           USD → "Доллары США (USD)";
           EUR → "Евро (EUR)";
           other → "Иная валюта";
           not_defined → "Не удалось определить".

        6. term_status:
           - "defined" — если срок прямо указан;
           - "not_defined" — если срок прямо не указан.

        7. term_value:
           Срок вклада или срок действия договора счёта.
           Если данных нет — "Данные не определены"; если фрагмент есть, но неоднозначен — "Не удалось определить".

        8. deposit_kind:
           "term" / "on_demand" / "other_conditions" / "not_defined".

        9. deposit_kind_display:
           Читаемый вид вклада для DD Grid. Строго соответствует deposit_kind:
           term → "Срочный вклад";
           on_demand → "До востребования";
           other_conditions → "На иных условиях возврата";
           not_defined:
             - если contract_type = "account" → "Не применимо";
             - иначе → "Не удалось определить".

        10. transfer_evidence_status:
            - "defined" — если подтверждение передачи / зачисления прямо указано;
            - "not_defined" — если прямо не указано.

        11. transfer_evidence_details:
            Формулировка о передаче / зачислении средств.
            Если данных нет — "Данные не определены"; если фрагмент есть, но неоднозначен — "Не удалось определить".

        12. evidence:
            Массив объектов [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}].
            Включай только прямые цитаты из договора. Если прямых цитат нет — пустой массив.
        </task>

        <context_rules>
        - Перед остальными полями заполни bank_deposit_account_subject_extraction_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined", все *_value/*_display = "Данные не определены" (или "Не удалось определить" для currency_display/deposit_kind_display).
        - Используй только текст договора.
        - Не подставляй нормы закона вместо текста договора.
        - Не додумывай сумму, валюту, срок, вид вклада, если они в тексте не зафиксированы прямо.
        - contract_type: "deposit" — договор банковского вклада; "account" — договор банковского счёта; "mixed" — смешанный договор; "not_defined" — тип прямо не определён.
        - amount_value для contract_type = "account" описывает тип счёта (расчётный / текущий / корреспондентский), а не сумму.
        - Если сумма определяется через приложение / доп. соглашение / спецификацию и в самом договоре не зафиксирована числом — amount_status = "not_defined", amount_value = "Не удалось определить".
        - currency_display должен строго соответствовать currency по правилам выше. Не выводи свободные формулировки.
        - deposit_kind: "term" — срочный вклад; "on_demand" — вклад до востребования; "other_conditions" — вклад на иных условиях возврата (ст. 837 п. 3 ГК РФ); "not_defined" — вид прямо не указан.
        - Для contract_type = "account" deposit_kind = "not_defined", deposit_kind_display = "Не применимо" (вид вклада к счёту объективно не применим).
        - transfer_evidence_status = "defined" только если в тексте прямо указано, что средства переданы, зачислены или внесены.
        - Не используй "None", "null", пустые строки.
        - Все текстовые значения пиши на русском языке, кроме служебных enum-значений status-полей.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни типа договора, ни суммы/типа счёта, ни срока, ни подтверждения передачи.
           → presence = "missing";
             все *_status = "not_defined";
             все *_value / *_display = "Данные не определены" (или "Не удалось определить" для currency_display/deposit_kind_display).

        2. Неполное раскрытие темы (согласование в будущем).
           "Стороны согласуют сумму/срок дополнительно" без ссылки на конкретный документ.
           → presence = "present";
             соответствующие *_status = "not_defined";
             соответствующие *_value = "Не удалось определить" или "Данные не определены".

        3. Противоречие между фрагментами.
           В разных частях договора указаны разные суммы, валюты или сроки, и конфликт нельзя разрешить по тексту.
           → presence = "unclear";
             соответствующий *_status = "not_defined";
             соответствующий *_value = "Не удалось определить".

        4. Специфика темы: Договор банковского счёта.
           Параметр "вид вклада" объективно не применим к договору счёта.
           → presence = "present" (если другие поля определены);
             deposit_kind = "not_defined";
             deposit_kind_display = "Не применимо".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для bank_deposit_account_subject_extraction_presence используй только: "present", "missing", "unclear".
        - Для status-полей используй только: "defined" или "not_defined".
        - Для enum-полей используй только значения из allowed_values.
        - Fallback при отсутствии данных:
          * amount_value, term_value, transfer_evidence_details → "Данные не определены";
          * currency_display, deposit_kind_display → "Не удалось определить" (или "Не применимо" для deposit_kind_display при account).
        - Fallback при противоречии или неоднозначности:
          * все *_value / *_display → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "bank_deposit_account_subject_extraction_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования по предмету/сумме/сроку. Внутреннее агрегатное signal-поле."
          required: true

        - name: "contract_type"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["deposit", "account", "mixed", "not_defined"]
          description: "Тип договора (вклад / счёт / смешанный)."
          required: true
          display_in_grid: false

        - name: "amount_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус указания суммы вклада / типа счёта."
          required: true
          display_in_grid: false

        - name: "amount_value"
          type: "string"
          presentation: "fact"
          label: "Сумма вклада / тип счёта"
          description: "Сумма вклада или тип счёта (расчётный / текущий / корр.)."
          required: true
          display_in_grid: true
          display_priority: 1

        - name: "currency"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["RUB", "USD", "EUR", "other", "not_defined"]
          description: "Валюта вклада / счёта (внутренний enum)."
          required: true
          display_in_grid: false

        - name: "currency_display"
          type: "string"
          presentation: "fact"
          label: "Валюта"
          allowed_values:
            - "Российские рубли (RUB)"
            - "Доллары США (USD)"
            - "Евро (EUR)"
            - "Иная валюта"
            - "Не удалось определить"
          description: "Читаемая валюта для DD Grid; для вклада физлица влияет на режим 177-ФЗ."
          required: true
          display_in_grid: true
          display_priority: 2

        - name: "term_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус указания срока."
          required: true
          display_in_grid: false

        - name: "term_value"
          type: "string"
          presentation: "fact"
          label: "Срок"
          description: "Срок вклада или срок действия договора счёта."
          required: true
          display_in_grid: true
          display_priority: 3

        - name: "deposit_kind"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["term", "on_demand", "other_conditions", "not_defined"]
          description: "Вид вклада (внутренний enum). Для договора счёта — not_defined."
          required: true
          display_in_grid: false

        - name: "deposit_kind_display"
          type: "string"
          presentation: "fact"
          label: "Вид вклада"
          allowed_values:
            - "Срочный вклад"
            - "До востребования"
            - "На иных условиях возврата"
            - "Не удалось определить"
            - "Не применимо"
          description: "Читаемый вид вклада для DD Grid; для договора счёта — «Не применимо»."
          required: true
          display_in_grid: true
          display_priority: 4

        - name: "transfer_evidence_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус подтверждения передачи / зачисления средств."
          required: true
          display_in_grid: false

        - name: "transfer_evidence_details"
          type: "string"
          presentation: "fact"
          label: "Подтверждение передачи средств"
          description: "Формулировка о передаче или зачислении средств (реальность договора вклада, ст. 834 ГК РФ)."
          required: true
          display_in_grid: true
          display_priority: 5
      store_payload: true

  - id: deposit_interest_and_fixation_check
    name: "Вклад: проценты, капитализация и изменение ставки (ст. 838 ГК РФ)"
    description: >
      Фактографическая проверка наличия процентной ставки, порядка начисления,
      капитализации и права банка изменять ставку. Проценты и режим их изменения —
      существенное условие договора банковского вклада (ст. 838 ГК РФ),
      а не boilerplate-оговорка: для вкладчика-физлица банк по общему правилу
      не вправе односторонне уменьшить ставку по срочному вкладу, если иное
      прямо не предусмотрено договором.
    triggers:
      any: ["deposit_contract"]
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "процентная ставка"
        - "проценты по вкладу"
        - "капитализация"
        - "начисление процентов"
        - "ставка не подлежит изменению"
        - "банк вправе изменить ставку"
        - "годовых"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)\\b\\d+(?:[.,]\\d+)?\\s*%"
        - "(?i)капитализаци"
        - "(?i)(не\\s+подлежит\\s+изменению|вправе\\s+изменить\\s+ставку)"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор банковского вклада (Глава 44 ГК РФ).
        Проверяется только один вопрос: процентная ставка, порядок начисления,
        капитализация и право банка изменять ставку.
        Нормативный ориентир:
        - ст. 838 ГК РФ — проценты по вкладу; по срочному вкладу граждан
          банк по общему правилу не вправе односторонне уменьшить ставку,
          если иное не предусмотрено договором.
        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора.
        - Не оценивай серьёзность риска.
        - Не подставляй нормы ст. 838 ГК РФ вместо текста договора: если
          в договоре режим изменения ставки не урегулирован — это not_defined,
          а не «по закону ставка не может быть изменена».

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Есть ли процентная ставка и её размер.
        2. Порядок начисления процентов.
        3. Есть ли капитализация процентов.
        4. Есть ли право банка изменять ставку.
        5. Указаны ли условия изменения ставки (в чью пользу зафиксировано).

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не путай «данные отсутствуют» и «данные есть, но вывод
          неоднозначен»:
          - если в тексте нет сведений — статус "not_defined", значение
            "Данные не определены";
          - если фрагмент есть, но из него нельзя сделать надёжный вывод —
            значение "Не удалось определить".
        3. Не используй "None", "null", пустые строки.
        4. В evidence включай только точные цитаты из договора.
        5. Не додумывай размер ставки, порядок начисления, капитализацию
          или режим изменения ставки, если они в тексте не зафиксированы
          прямо.

        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1 — ставка, начисление, капитализация и фиксация указаны прямо:
        Фрагмент:
        "Процентная ставка по вкладу составляет 12% годовых. Проценты
        начисляются ежемесячно и капитализируются. Ставка не подлежит
        изменению в течение срока вклада."
        Ответ:
        {
          "interest_rate_status": "defined",
          "interest_rate_value": "12% годовых",
          "accrual_procedure_status": "defined",
          "accrual_procedure_details": "начисляются ежемесячно",
          "capitalization_status": "defined",
          "capitalization_details": "проценты капитализируются",
          "rate_change_right_status": "defined",
          "rate_change_right_details": "ставка не подлежит изменению в течение срока вклада",
          "rate_change_right_display": "Ставка фиксирована на весь срок вклада",
          "evidence": [
            {
              "clause_ref": "п. 2.1",
              "quote": "Процентная ставка по вкладу составляет 12% годовых. Проценты начисляются ежемесячно и капитализируются."
            },
            {
              "clause_ref": "п. 2.2",
              "quote": "Ставка не подлежит изменению в течение срока вклада."
            }
          ]
        }
        Пример 2 — банк вправе изменить ставку, капитализация не урегулирована:
        Фрагмент:
        "Банк вправе в одностороннем порядке изменять процентную ставку
        по вкладу с уведомлением Вкладчика за 10 дней. Проценты начисляются
        ежемесячно."
        Ответ:
        {
          "interest_rate_status": "not_defined",
          "interest_rate_value": "Данные не определены",
          "accrual_procedure_status": "defined",
          "accrual_procedure_details": "начисляются ежемесячно",
          "capitalization_status": "not_defined",
          "capitalization_details": "Данные не определены",
          "rate_change_right_status": "defined",
          "rate_change_right_details": "Банк вправе в одностороннем порядке изменять ставку с уведомлением за 10 дней",
          "rate_change_right_display": "Банк вправе изменить ставку в одностороннем порядке",
          "evidence": [
            {
              "clause_ref": "п. 2.1",
              "quote": "Банк вправе в одностороннем порядке изменять процентную ставку по вкладу с уведомлением Вкладчика за 10 дней."
            }
          ]
        }
        Пример 3 — данных в договоре нет вообще:
        Фрагмент:
        "Банк открывает Клиенту счет."
        Ответ:
        {
          "interest_rate_status": "not_defined",
          "interest_rate_value": "Данные не определены",
          "accrual_procedure_status": "not_defined",
          "accrual_procedure_details": "Данные не определены",
          "capitalization_status": "not_defined",
          "capitalization_details": "Данные не определены",
          "rate_change_right_status": "not_defined",
          "rate_change_right_details": "Данные не определены",
          "rate_change_right_display": "Изменение ставки не урегулировано",
          "evidence": []
        }
        Пример 4 — текст есть, но надёжный вывод сделать нельзя (ставка
        отсылает к тарифам без конкретных цифр):
        Фрагмент:
        "Проценты по вкладу начисляются в порядке и по ставке, установленным
        тарифами Банка, действующими на дату начисления процентов.
        Капитализация процентов не производится."
        Ответ:
        {
          "interest_rate_status": "not_defined",
          "interest_rate_value": "Не удалось определить",
          "accrual_procedure_status": "defined",
          "accrual_procedure_details": "в порядке и по ставке, установленным тарифами Банка",
          "capitalization_status": "defined",
          "capitalization_details": "капитализация процентов не производится",
          "rate_change_right_status": "not_defined",
          "rate_change_right_details": "Данные не определены",
          "rate_change_right_display": "Изменение ставки не урегулировано",
          "evidence": [
            {
              "clause_ref": "п. 2.1",
              "quote": "Проценты по вкладу начисляются в порядке и по ставке, установленным тарифами Банка, действующими на дату начисления процентов."
            },
            {
              "clause_ref": "п. 2.2",
              "quote": "Капитализация процентов не производится."
            }
          ]
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о процентной ставке.
        2. Найди прямую цитату о порядке начисления.
        3. Найди прямую цитату о капитализации.
        4. Найди прямую цитату о праве изменения ставки.
        5. Если ставка отсылает к тарифам без конкретных цифр — interest_rate_value
          = "Не удалось определить", interest_rate_status = "not_defined".
        6. Разграничь «данных нет» (Данные не определены) и «данные есть,
          но вывод неоднозначен» (Не удалось определить). Не подставляй
          ст. 838 ГК РФ вместо текста договора.
        Не выводи шаги проверки — сформируй итоговый ответ согласно [ФОРМАТ ОТВЕТА].

        [ФОРМАТ ОТВЕТА]

        Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей.

        НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON,

        пригодным для парсинга через json.loads без предварительной обработки.
        Ответь РОВНО одним JSON-объектом без какого-либо дополнительного
        текста до или после, со всеми 9 ключами полей (evidence — служебный
        массив цитат, не относящийся к схеме полей):
        {
          "interest_rate_status": "<defined / not_defined>",
          "interest_rate_value": "<текст / 'Данные не определены' / 'Не удалось определить'>",
          "accrual_procedure_status": "<defined / not_defined>",
          "accrual_procedure_details": "<текст / 'Данные не определены' / 'Не удалось определить'>",
          "capitalization_status": "<defined / not_defined>",
          "capitalization_details": "<текст / 'Данные не определены' / 'Не удалось определить'>",
          "rate_change_right_status": "<defined / not_defined>",
          "rate_change_right_details": "<текст / 'Данные не определены' / 'Не удалось определить'>",
          "rate_change_right_display": "<Ставка фиксирована на весь срок вклада / Ставка не может быть уменьшена в одностороннем порядке / Банк вправе изменить ставку в одностороннем порядке / Изменение ставки не урегулировано / Не удалось определить>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 8
      temperature: 0.0
      max_tokens: 650

    retrieval:
      retrieval_profile: "interest_rate_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "процентная ставка проценты по вкладу капитализация начисление процентов ставка не подлежит изменению банк вправе изменить ставку годовых"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - definitions
      negative_keywords:
        - "тариф"
        - "комиссия"
        - "овердрафт"
        - "115-ФЗ"
        - "безакцептное"
        - "ДБО"
        - "страхование"
        - "закрытие счета"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.10, 0.50]
        boost: 0.18
        scope: segment
      context_k: 8
      max_chunks: 10
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "obligations"
        - "definitions"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.12

    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 600

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1050
      compact_output: false

      presence_signal:
        field: "deposit_interest_and_fixation_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора банковского вклада
        процентную ставку, порядок начисления, капитализацию, право изменения
        ставки и сформируй читаемый вывод о режиме изменения ставки.
        Не анализируй тарифы, AML, ДБО или страхование.
        Не подставляй нормы ст. 838 ГК РФ вместо текста договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. deposit_interest_and_fixation_check_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (interest_rate_status, accrual_procedure_status,
              capitalization_status, rate_change_right_status) ≠ "not_defined";
           - "missing" — если все четыре содержательных поля = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - interest_rate_status = "not_defined";
           - accrual_procedure_status = "not_defined";
           - capitalization_status = "not_defined";
           - rate_change_right_status = "not_defined";
           - interest_rate_value, accrual_procedure_details,
             capitalization_details, rate_change_right_details = "Данные не определены";
           - rate_change_right_display = "Изменение ставки не урегулировано";
           - не выполняй остальные шаги.

        1. interest_rate_status:
           - "defined" — если ставка прямо указана числом или формулой;
           - "not_defined" — если ставка прямо не указана.

        2. interest_rate_value:
           Размер ставки (например, "12% годовых").
           Если данных нет — "Данные не определены";
           если фрагмент есть, но неоднозначен (например, «по ставке, установленной тарифами», без конкретных цифр) — "Не удалось определить".

        3. accrual_procedure_status:
           - "defined" — если порядок начисления указан;
           - "not_defined" — если порядок начисления не указан.

        4. accrual_procedure_details:
           Формулировка о порядке начисления (например, "начисляются ежемесячно").
           Если данных нет — "Данные не определены";
           если фрагмент неоднозначен — "Не удалось определить".

        5. capitalization_status:
           - "defined" — если капитализация прямо урегулирована (есть или отсутствует);
           - "not_defined" — если капитализация не урегулирована.

        6. capitalization_details:
           Формулировка о капитализации (например, "проценты капитализируются" или "капитализация не производится").
           Если данных нет — "Данные не определены";
           если фрагмент неоднозначен — "Не удалось определить".

        7. rate_change_right_status:
           - "defined" — если в тексте прямо указан режим изменения ставки: фиксация, запрет на одностороннее изменение, право банка изменять;
           - "not_defined" — если режим изменения ставки не указан.

        8. rate_change_right_details:
           Формулировка о режиме изменения ставки.
           Если данных нет — "Данные не определены";
           если фрагмент неоднозначен — "Не удалось определить".

        9. rate_change_right_display:
           Читаемый вывод о режиме изменения ставки для DD Grid:
           - "Ставка фиксирована на весь срок вклада" — если в договоре прямо сказано, что ставка не подлежит изменению;
           - "Ставка не может быть уменьшена в одностороннем порядке" — если договор запрещает банку односторонне уменьшать ставку, но допускает иные изменения;
           - "Банк вправе изменить ставку в одностороннем порядке" — если договор прямо даёт банку такое право;
           - "Изменение ставки не урегулировано" — если тема изменения ставки в договоре не упомянута;
           - "Не удалось определить" — если формулировка есть, но вывод сделать нельзя.

        10. evidence:
            Массив объектов [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}].
            Включай только прямые цитаты из договора. Если прямых цитат нет — пустой массив.
        </task>

        <context_rules>
        - Перед остальными полями заполни deposit_interest_and_fixation_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined", все *_value/*_details = "Данные не определены", rate_change_right_display = "Изменение ставки не урегулировано".
        - Используй только текст договора.
        - Не подставляй нормы ст. 838 ГК РФ вместо текста договора.
          Отсутствие условия в договоре — это not_defined, а не «по закону банк не может уменьшить ставку».
        - Не додумывай размер ставки, порядок начисления, капитализацию или режим изменения ставки, если они в тексте не зафиксированы прямо.
        - interest_rate_status = "defined" только если ставка указана конкретным числом, формулой или прямой привязкой к конкретному документу (например, "согласно приложению № 1 с фиксированной ставкой 12% годовых").
        - Если ставка определяется через тарифы / прайс-лист / внутренние документы банка без конкретных цифр — interest_rate_status = "not_defined", interest_rate_value = "Не удалось определить".
        - capitalization_status = "defined" и для случая, когда капитализация прямо отрицается ("не производится").
        - rate_change_right_display должен строго соответствовать формулировке договора; не выводи свободные интерпретации.
        - Не используй "None", "null", пустые строки.
        - Все текстовые значения пиши на русском языке, кроме служебных enum-значений status-полей.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни процентной ставки, ни порядка начисления, ни капитализации,
           ни режима изменения ставки.
           → presence = "missing";
             все *_status = "not_defined";
             все *_value / *_details = "Данные не определены";
             rate_change_right_display = "Изменение ставки не урегулировано".

        2. Неполное раскрытие темы (ставка отсылает к тарифам).
           "Проценты начисляются по ставке, установленной тарифами Банка" без конкретных цифр.
           → presence = "present";
             interest_rate_status = "not_defined";
             interest_rate_value = "Не удалось определить".

        3. Противоречие между фрагментами.
           В разных частях договора указаны разные процентные ставки или противоречивые
           условия изменения ставки, и конфликт нельзя разрешить по тексту.
           → presence = "unclear";
             соответствующий *_status = "not_defined";
             соответствующий *_value / *_details = "Не удалось определить".

        4. Специфика темы: капитализация прямо отрицается.
           "Капитализация процентов не производится" — это всё равно урегулирование темы.
           → presence = "present";
             capitalization_status = "defined";
             capitalization_details = "капитализация процентов не производится".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для deposit_interest_and_fixation_check_presence используй только: "present", "missing", "unclear".
        - Для status-полей используй только: "defined" или "not_defined".
        - Для rate_change_right_display используй только значения из allowed_values, без свободных формулировок.
        - Fallback при отсутствии данных:
          * interest_rate_value, accrual_procedure_details, capitalization_details, rate_change_right_details → "Данные не определены";
          * rate_change_right_display → "Изменение ставки не урегулировано".
        - Fallback при противоречии или неоднозначности:
          * все *_value / *_details → "Не удалось определить";
          * rate_change_right_display → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "deposit_interest_and_fixation_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования по процентам/капитализации/изменению ставки. Внутреннее агрегатное signal-поле."
          required: true

        - name: "interest_rate_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус указания процентной ставки."
          required: true
          display_in_grid: false

        - name: "interest_rate_value"
          type: "string"
          presentation: "fact"
          label: "Процентная ставка"
          description: "Размер процентной ставки по вкладу."
          required: true
          display_in_grid: true
          display_priority: 1

        - name: "accrual_procedure_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          description: "Статус указания порядка начисления."
          required: true
          display_in_grid: false

        - name: "accrual_procedure_details"
          type: "string"
          presentation: "fact"
          label: "Порядок начисления"
          description: "Порядок начисления процентов (периодичность, база)."
          required: true
          display_in_grid: true
          display_priority: 2

        - name: "capitalization_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          description: "Статус указания капитализации (есть или прямо отрицается)."
          required: true
          display_in_grid: false

        - name: "capitalization_details"
          type: "string"
          presentation: "fact"
          label: "Капитализация"
          description: "Формулировка о капитализации процентов; влияет на эффективную доходность вклада."
          required: true
          display_in_grid: true
          display_priority: 3

        - name: "rate_change_right_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус указания режима изменения ставки."
          required: true
          display_in_grid: false

        - name: "rate_change_right_details"
          label: "Право банка на одностороннее изменение ставки"
          type: "string"
          presentation: "fact"
          description: "Формулировка о режиме изменения ставки (внутреннее поле для формирования _display)."
          required: true
          display_in_grid: false

        - name: "rate_change_right_display"
          type: "string"
          presentation: "fact"
          label: "Изменение ставки"
          allowed_values:
            - "Ставка фиксирована на весь срок вклада"
            - "Ставка не может быть уменьшена в одностороннем порядке"
            - "Банк вправе изменить ставку в одностороннем порядке"
            - "Изменение ставки не урегулировано"
            - "Не удалось определить"
          description: "Читаемый вывод о режиме изменения ставки для DD Grid; показывает, в чью пользу условие."
          required: true
          display_in_grid: true
          display_priority: 4

      store_payload: true

  - id: deposit_early_withdrawal_check
    name: "Вклад: досрочный возврат и пересчет процентов (ст. 837 ГК РФ)"
    description: >
      Фактографическая проверка права вкладчика на досрочный возврат,
      порядка пересчёта процентов, ограничений досрочного возврата
      и порядка возврата средств. По ст. 837 п. 2 ГК РФ право вкладчика-физлица
      на досрочное истребование вклада императивно: договорное ограничение
      такого права ничтожно. Для вклада юрлица ограничение допустимо.
      Check даёт юристу сигнал о наличии/отсутствии ограничения, но не выносит
      окончательный юридический вердикт — он выводится отдельно с учётом типа
      вкладчика.
    triggers:
      any: ["deposit_contract"]
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "досрочный возврат"
        - "досрочное истребование"
        - "досрочное расторжение"
        - "пересчет процентов"
        - "по ставке до востребования"
        - "по первому требованию"
        - "возврат вклада"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)досрочн(ый|ого)\\s+возврат"
        - "(?i)досрочн(ое|ого)\\s+(истребовани|расторж)"
        - "(?i)пересчет\\s+процент"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор банковского вклада (Глава 44 ГК РФ).
        Проверяется только один вопрос: право на досрочный возврат вклада,
        порядок пересчёта процентов, ограничения и порядок возврата.
        Нормативный ориентир:
        - ст. 837 п. 2 ГК РФ — право вкладчика требовать возврата вклада
          по первому требованию; для вклада физлица это право императивно
          и не может быть ограничено договором, для вклада юрлица —
          ограничение допустимо;
        - ст. 837 п. 3 ГК РФ — при досрочном возврате срочного вклада
          проценты выплачиваются по ставке вклада до востребования,
          если договором не предусмотрена иная ставка.
        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора.
        - Не оценивай серьёзность риска.
        - Не подставляй нормы ст. 837 ГК РФ вместо текста договора: если
          право досрочного возврата в договоре не упомянуто — это not_defined,
          а не «по закону вкладчик вправе».
        - Отдельное состояние для случая, когда вкладчик — физлицо и право
          ограничено договором: это сигнал для юриста (такое ограничение
          по ст. 837 п. 2 ГК РФ не имеет силы).

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Есть ли право вкладчика на досрочный возврат.
        2. Порядок пересчёта процентов при досрочном возврате.
        3. Есть ли ограничения досрочного возврата.
        4. Порядок и срок возврата средств.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не путай «данные отсутствуют» и «данные есть, но вывод
          неоднозначен»:
          - если в тексте нет сведений — статус "not_defined", значение
            "Данные не определены";
          - если фрагмент есть, но из него нельзя сделать надёжный вывод —
            значение "Не удалось определить".
        3. Не используй "None", "null", пустые строки.
        4. В evidence включай только точные цитаты из договора.
        5. Не додумывай наличие или отсутствие права, порядок пересчёта,
          ограничения и срок возврата, если они в тексте не зафиксированы
          прямо.

        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1 — право есть, пересчёт указан, ограничений нет:
        Фрагмент:
        "Вкладчик вправе истребовать вклад досрочно. При досрочном возврате
        проценты пересчитываются по ставке вклада до востребования.
        Возврат осуществляется в течение 3 рабочих дней."
        Ответ:
        {
          "early_withdrawal_status": "defined",
          "early_withdrawal_details": "вкладчик вправе истребовать вклад досрочно",
          "early_withdrawal_display": "Вкладчик вправе требовать досрочно",
          "recalculation_status": "defined",
          "recalculation_details": "проценты пересчитываются по ставке вклада до востребования",
          "restrictions_status": "not_defined",
          "restrictions_details": "Данные не определены",
          "return_procedure_status": "defined",
          "return_procedure_details": "возврат осуществляется в течение 3 рабочих дней",
          "evidence": [
            {
              "clause_ref": "п. 3.1",
              "quote": "Вкладчик вправе истребовать вклад досрочно. При досрочном возврате проценты пересчитываются по ставке вклада до востребования."
            },
            {
              "clause_ref": "п. 3.2",
              "quote": "Возврат осуществляется в течение 3 рабочих дней."
            }
          ]
        }
        Пример 2 — право не урегулировано, порядок возврата указан:
        Фрагмент:
        "Возврат вклада производится по истечении срока."
        Ответ:
        {
          "early_withdrawal_status": "not_defined",
          "early_withdrawal_details": "Данные не определены",
          "early_withdrawal_display": "Право не урегулировано",
          "recalculation_status": "not_defined",
          "recalculation_details": "Данные не определены",
          "restrictions_status": "not_defined",
          "restrictions_details": "Данные не определены",
          "return_procedure_status": "defined",
          "return_procedure_details": "возврат вклада производится по истечении срока",
          "evidence": [
            {
              "clause_ref": "п. 3.1",
              "quote": "Возврат вклада производится по истечении срока."
            }
          ]
        }
        Пример 3 — право ограничено договором для вкладчика-физлица:
        Фрагмент:
        "Гражданин РФ Кузнецов К.К., именуемый «Вкладчик». Вкладчик не вправе
        требовать досрочного возврата вклада до истечения срока вклада."
        Ответ:
        {
          "early_withdrawal_status": "defined",
          "early_withdrawal_details": "Вкладчик не вправе требовать досрочного возврата до истечения срока",
          "early_withdrawal_display": "Право ограничено (для физлица недействительно)",
          "recalculation_status": "not_defined",
          "recalculation_details": "Данные не определены",
          "restrictions_status": "defined",
          "restrictions_details": "запрет досрочного возврата до истечения срока",
          "return_procedure_status": "not_defined",
          "return_procedure_details": "Данные не определены",
          "evidence": [
            {
              "clause_ref": "п. 3.1",
              "quote": "Вкладчик не вправе требовать досрочного возврата вклада до истечения срока вклада."
            }
          ]
        }
        Пример 4 — текст есть, но надёжный вывод сделать нельзя (право есть
        с ограничением, но пересчёт процентов не урегулирован):
        Фрагмент:
        "Вкладчик вправе истребовать вклад досрочно не ранее чем через 6
        месяцев с даты размещения вклада. Порядок возврата — по заявлению
        Вкладчика."
        Ответ:
        {
          "early_withdrawal_status": "defined",
          "early_withdrawal_details": "право истребовать вклад досрочно не ранее чем через 6 месяцев",
          "early_withdrawal_display": "Право ограничено договором",
          "recalculation_status": "not_defined",
          "recalculation_details": "Не удалось определить",
          "restrictions_status": "defined",
          "restrictions_details": "не ранее чем через 6 месяцев с даты размещения вклада",
          "return_procedure_status": "defined",
          "return_procedure_details": "по заявлению Вкладчика",
          "evidence": [
            {
              "clause_ref": "п. 3.1",
              "quote": "Вкладчик вправе истребовать вклад досрочно не ранее чем через 6 месяцев с даты размещения вклада."
            },
            {
              "clause_ref": "п. 3.2",
              "quote": "Порядок возврата — по заявлению Вкладчика."
            }
          ]
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о праве на досрочный возврат.
        2. Найди прямую цитату о пересчёте процентов.
        3. Найди прямую цитату об ограничениях.
        4. Найди прямую цитату о порядке и сроке возврата.
        5. Определи, является ли вкладчик физлицом (по преамбуле договора).
          Если да и в договоре есть ограничение досрочного возврата —
          early_withdrawal_display = "Право ограничено (для физлица
          недействительно)".
        6. Разграничь «данных нет» (Данные не определены) и «данные есть,
          но вывод неоднозначен» (Не удалось определить). Не подставляй
          ст. 837 ГК РФ вместо текста договора.
        Не выводи шаги проверки — сформируй итоговый ответ согласно [ФОРМАТ ОТВЕТА].

        [ФОРМАТ ОТВЕТА]

        Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей.

        НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON,

        пригодным для парсинга через json.loads без предварительной обработки.
        Ответь РОВНО одним JSON-объектом без какого-либо дополнительного
        текста до или после, со всеми 9 ключами полей (evidence — служебный
        массив цитат, не относящийся к схеме полей):
        {
          "early_withdrawal_status": "<defined / not_defined>",
          "early_withdrawal_details": "<текст / 'Данные не определены' / 'Не удалось определить'>",
          "early_withdrawal_display": "<Вкладчик вправе требовать досрочно / Право ограничено договором / Право ограничено (для физлица недействительно) / Право не урегулировано / Не удалось определить>",
          "recalculation_status": "<defined / not_defined>",
          "recalculation_details": "<текст / 'Данные не определены' / 'Не удалось определить'>",
          "restrictions_status": "<defined / not_defined>",
          "restrictions_details": "<текст / 'Данные не определены' / 'Не удалось определить'>",
          "return_procedure_status": "<defined / not_defined>",
          "return_procedure_details": "<текст / 'Данные не определены' / 'Не удалось определить'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 8
      temperature: 0.0
      max_tokens: 600

    retrieval:
      retrieval_profile: "termination_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "досрочный возврат досрочное истребование досрочное расторжение пересчет процентов по ставке до востребования по первому требованию возврат вклада"
      preferred_unit_types:
        - obligation
        - termination_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - remedies
      negative_keywords:
        - "тариф"
        - "комиссия"
        - "овердрафт"
        - "115-ФЗ"
        - "безакцептное"
        - "ДБО"
        - "страхование"
        - "закрытие счета"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.20, 0.65]
        boost: 0.15
        scope: segment
      context_k: 8
      max_chunks: 10
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "obligations"
        - "remedies"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.12

    evidence:
      required: true
      min_snippet_length: 35
      max_snippet_length: 550

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1050
      compact_output: false

      presence_signal:
        field: "deposit_early_withdrawal_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора банковского вклада
        право на досрочный возврат, порядок пересчёта процентов, ограничения
        и порядок возврата, и сформируй читаемый вывод о режиме досрочного
        возврата с учётом типа вкладчика.
        Не анализируй тарифы, AML, ДБО или страхование.
        Не подставляй нормы ст. 837 ГК РФ вместо текста договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. deposit_early_withdrawal_check_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (early_withdrawal_status, recalculation_status,
              restrictions_status, return_procedure_status) ≠ "not_defined";
           - "missing" — если все четыре содержательных поля = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - early_withdrawal_status = "not_defined";
           - recalculation_status = "not_defined";
           - restrictions_status = "not_defined";
           - return_procedure_status = "not_defined";
           - early_withdrawal_details, recalculation_details,
             restrictions_details, return_procedure_details = "Данные не определены";
           - early_withdrawal_display = "Право не урегулировано";
           - не выполняй остальные шаги.

        1. early_withdrawal_status:
           - "defined" — если в тексте прямо указано право вкладчика на досрочный возврат (в том числе с ограничениями) или прямо указано его отсутствие;
           - "not_defined" — если право прямо не указано.

        2. early_withdrawal_details:
           Формулировка о праве досрочного возврата.
           Если данных нет — "Данные не определены";
           если фрагмент неоднозначен — "Не удалось определить".

        3. early_withdrawal_display:
           Читаемый вывод о режиме досрочного возврата для DD Grid. Строго по правилам:
           - "Вкладчик вправе требовать досрочно" — если в договоре прямо закреплено право досрочного возврата без ограничений;
           - "Право ограничено договором" — если право есть, но с ограничениями (срок, периодичность, условия), и вкладчик не определён как физлицо;
           - "Право ограничено (для физлица недействительно)" — если право ограничено договором и по преамбуле вкладчик — физлицо (гражданин РФ, физическое лицо без статуса ИП);
           - "Право не урегулировано" — если тема досрочного возврата в договоре не упомянута;
           - "Не удалось определить" — если формулировка есть, но вывод сделать нельзя.

        4. recalculation_status:
           - "defined" — если порядок пересчёта процентов при досрочном возврате прямо указан;
           - "not_defined" — если порядок пересчёта прямо не указан.

        5. recalculation_details:
           Формулировка о пересчёте процентов.
           Если данных нет — "Данные не определены";
           если фрагмент неоднозначен — "Не удалось определить".

        6. restrictions_status:
           - "defined" — если ограничения досрочного возврата прямо указаны (включая полный запрет);
           - "not_defined" — если ограничения прямо не указаны.

        7. restrictions_details:
           Формулировка об ограничениях.
           Если данных нет — "Данные не определены";
           если фрагмент неоднозначен — "Не удалось определить".

        8. return_procedure_status:
           - "defined" — если порядок и/или срок возврата средств прямо указаны;
           - "not_defined" — если порядок и/или срок прямо не указаны.

        9. return_procedure_details:
           Формулировка о порядке и сроке возврата.
           Если данных нет — "Данные не определены";
           если фрагмент неоднозначен — "Не удалось определить".

        10. evidence:
            Массив объектов [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}].
            Включай только прямые цитаты из договора. Если прямых цитат нет — пустой массив.
        </task>

        <context_rules>
        - Перед остальными полями заполни deposit_early_withdrawal_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined", все *_details = "Данные не определены", early_withdrawal_display = "Право не урегулировано".
        - Используй только текст договора.
        - Не подставляй нормы ст. 837 ГК РФ вместо текста договора.
          Отсутствие условия в договоре — это not_defined, а не «по закону вкладчик вправе требовать досрочно».
        - Не додумывай наличие или отсутствие права, порядок пересчёта, ограничения и срок возврата, если они не зафиксированы прямо.
        - early_withdrawal_status = "defined" и для случая, когда в договоре прямо запрещён досрочный возврат — это тоже определенность.
        - Для определения типа вкладчика используй преамбулу договора:
          «гражданин РФ», «физическое лицо» без ОГРНИП → физлицо;
          ООО / АО / ПАО / ИП → юрлицо или ИП.
        - Если вкладчик — физлицо и в договоре право досрочного возврата ограничено (или запрещено) — early_withdrawal_display = "Право ограничено (для физлица недействительно)". Это сигнал для юриста, а не окончательный вывод.
        - Если право досрочного возврата прямо закреплено без каких-либо ограничений — early_withdrawal_display = "Вкладчик вправе требовать досрочно".
        - Если право есть, но с ограничениями, и вкладчик — юрлицо или ИП — early_withdrawal_display = "Право ограничено договором".
        - Не используй "None", "null", пустые строки.
        - Все текстовые значения пиши на русском языке, кроме служебных enum-значений status-полей.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни права на досрочный возврат, ни пересчёта процентов,
           ни ограничений, ни порядка возврата.
           → presence = "missing";
             все *_status = "not_defined";
             все *_details = "Данные не определены";
             early_withdrawal_display = "Право не урегулировано".

        2. Неполное раскрытие темы (право есть, пересчет не урегулирован).
           "Вкладчик вправе истребовать вклад досрочно" без указания порядка пересчёта процентов.
           → presence = "present";
             early_withdrawal_status = "defined";
             recalculation_status = "not_defined";
             recalculation_details = "Данные не определены".

        3. Противоречие между фрагментами.
           В разных частях договора указаны противоречивые условия досрочного возврата
           (например, в одном пункте право есть, в другом — запрет), и конфликт нельзя разрешить по тексту.
           → presence = "unclear";
             соответствующий *_status = "not_defined";
             соответствующий *_details = "Не удалось определить";
             early_withdrawal_display = "Не удалось определить".

        4. Специфика темы: ограничение права для вкладчика-физлица.
           Вкладчик — физлицо (гражданин РФ), и в договоре прямо запрещено досрочное истребование.
           → presence = "present";
             early_withdrawal_status = "defined";
             restrictions_status = "defined";
             early_withdrawal_display = "Право ограничено (для физлица недействительно)".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для deposit_early_withdrawal_check_presence используй только: "present", "missing", "unclear".
        - Для status-полей используй только: "defined" или "not_defined".
        - Для early_withdrawal_display используй только значения из allowed_values, без свободных формулировок.
        - Fallback при отсутствии данных:
          * early_withdrawal_details, recalculation_details, restrictions_details, return_procedure_details → "Данные не определены";
          * early_withdrawal_display → "Право не урегулировано".
        - Fallback при противоречии или неоднозначности:
          * все *_details → "Не удалось определить";
          * early_withdrawal_display → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "deposit_early_withdrawal_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования по досрочному возврату/пересчету процентов. Внутреннее агрегатное signal-поле."
          required: true

        - name: "early_withdrawal_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус указания права на досрочный возврат."
          required: true
          display_in_grid: false

        - name: "early_withdrawal_details"
          label: "Условия досрочного истребования вклада"
          type: "string"
          presentation: "fact"
          description: "Формулировка о праве досрочного возврата (внутреннее поле для формирования _display)."
          required: true
          display_in_grid: false

        - name: "early_withdrawal_display"
          type: "string"
          presentation: "fact"
          label: "Досрочный возврат"
          allowed_values:
            - "Вкладчик вправе требовать досрочно"
            - "Право ограничено договором"
            - "Право ограничено (для физлица недействительно)"
            - "Право не урегулировано"
            - "Не удалось определить"
          description: "Читаемый вывод о режиме досрочного возврата; для ограничения права у физлица — сигнал о недействительности ограничения (ст. 837 п. 2 ГК РФ)."
          required: true
          display_in_grid: true
          display_priority: 1

        - name: "recalculation_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус указания пересчёта процентов."
          required: true
          display_in_grid: false

        - name: "recalculation_details"
          type: "string"
          presentation: "fact"
          label: "Пересчёт процентов"
          description: "Формулировка о пересчёте процентов при досрочном возврате (ст. 837 п. 3 ГК РФ)."
          required: true
          display_in_grid: true
          display_priority: 2

        - name: "restrictions_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус указания ограничений досрочного возврата."
          required: true
          display_in_grid: false

        - name: "restrictions_details"
          type: "string"
          presentation: "fact"
          label: "Ограничения досрочного возврата"
          description: "Формулировка об ограничениях (срок, периодичность, условия, запрет)."
          required: true
          display_in_grid: true
          display_priority: 3

        - name: "return_procedure_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          description: "Статус указания порядка возврата."
          required: true
          display_in_grid: false

        - name: "return_procedure_details"
          type: "string"
          presentation: "fact"
          label: "Порядок возврата"
          description: "Формулировка о порядке и сроке возврата средств."
          required: true
          display_in_grid: true
          display_priority: 4

      store_payload: true

  - id: account_tariffs_and_commissions_check
    name: "Счёт: тарифы, комиссии и изменение стоимости услуг"
    description: >
      Фактографическая проверка наличия тарифов, перечня комиссий,
      права банка изменять тарифы и порядка уведомления об изменениях.
      Для договора банковского счёта условия о вознаграждении — существенный
      элемент (ст. 851 ГК РФ: при отсутствии в договоре условия о вознаграждении
      банк не вправе его взимать). Для клиента-физлица односторонний рост
      тарифов ограничен ст. 29 ФЗ «О банках и банковской деятельности».
    triggers:
      any: ["bank_account_contract"]
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "тариф"
        - "комиссия"
        - "плата за обслуживание"
        - "стоимость услуг"
        - "изменение тарифов"
        - "одностороннем порядке"
        - "уведомление об изменении"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)тариф"
        - "(?i)комисси"
        - "(?i)изменени(е|я)\\s+тариф"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор банковского счёта (Глава 45 ГК РФ).
        Проверяется только один вопрос: тарифы, комиссии и режим изменения
        стоимости услуг банка.
        Нормативный ориентир:
        - ст. 851 ГК РФ — комиссионное вознаграждение банка; при отсутствии
          в договоре условия о вознаграждении банк не вправе его взимать;
        - ст. 29 ФЗ «О банках и банковской деятельности» — для клиента-физлица
          односторонний рост тарифов ограничен.
        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора.
        - Не оценивай серьёзность риска.
        - Не подставляй нормы ст. 851 ГК РФ или ст. 29 ФЗ «О банках…» вместо
          текста договора: если условие о тарифах в договоре не зафиксировано —
          это not_defined, а не «по закону банк не вправе взимать плату».
        - Режим изменения тарифов показывает, в чью пользу условие:
          зафиксированы ли тарифы, может ли банк менять их односторонне,
          с уведомлением или без.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Есть ли указание на тарифы (в самом договоре или через приложение).
        2. Есть ли перечень комиссий.
        3. Есть ли право банка изменять тарифы.
        4. Есть ли порядок и срок уведомления об изменении тарифов.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не путай «данные отсутствуют» и «данные есть, но вывод
          неоднозначен»:
          - если в тексте нет сведений — статус "not_defined", значение
            "Данные не определены";
          - если фрагмент есть, но из него нельзя сделать надёжный вывод —
            значение "Не удалось определить".
        3. Не используй "None", "null", пустые строки.
        4. В evidence включай только точные цитаты из договора.
        5. Не додумывай размер комиссий, порядок уведомления или режим
          изменения тарифов, если они не зафиксированы прямо.

        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1 — тарифы через приложение, конкретная комиссия, право
        изменения с уведомлением:
        Фрагмент:
        "Обслуживание счёта осуществляется по Тарифам Банка, являющимся
        Приложением № 1. Комиссия за ведение счёта — 1 000 руб. в месяц.
        Банк вправе изменять Тарифы, уведомив Клиента за 30 дней."
        Ответ:
        {
          "tariff_reference_status": "defined",
          "tariff_reference_details": "по Тарифам Банка, Приложение № 1",
          "fee_list_status": "defined",
          "fee_list_details": "комиссия за ведение счёта — 1 000 руб. в месяц",
          "tariff_change_right_status": "defined",
          "tariff_change_right_details": "банк вправе изменять тарифы",
          "tariff_change_display": "Банк вправе изменить тарифы с уведомлением",
          "tariff_change_notice_status": "defined",
          "tariff_change_notice_details": "уведомление за 30 дней",
          "evidence": [
            {
              "clause_ref": "п. 4.1",
              "quote": "Обслуживание счёта осуществляется по Тарифам Банка, являющимся Приложением № 1."
            },
            {
              "clause_ref": "п. 4.2",
              "quote": "Комиссия за ведение счёта — 1 000 руб. в месяц."
            },
            {
              "clause_ref": "п. 4.3",
              "quote": "Банк вправе изменять Тарифы, уведомив Клиента за 30 дней."
            }
          ]
        }
        Пример 2 — общая отсылка к тарифам, ничего больше не урегулировано:
        Фрагмент:
        "Клиент оплачивает услуги Банка в соответствии с тарифами."
        Ответ:
        {
          "tariff_reference_status": "defined",
          "tariff_reference_details": "в соответствии с тарифами",
          "fee_list_status": "not_defined",
          "fee_list_details": "Данные не определены",
          "tariff_change_right_status": "not_defined",
          "tariff_change_right_details": "Данные не определены",
          "tariff_change_display": "Право изменения тарифов не урегулировано",
          "tariff_change_notice_status": "not_defined",
          "tariff_change_notice_details": "Данные не определены",
          "evidence": [
            {
              "clause_ref": "п. 4.1",
              "quote": "Клиент оплачивает услуги Банка в соответствии с тарифами."
            }
          ]
        }
        Пример 3 — тарифы фиксированы, комиссии перечислены:
        Фрагмент:
        "Тарифы на обслуживание счёта зафиксированы на срок действия
        договора и не подлежат изменению. Комиссия за открытие счёта —
        2 000 руб. единовременно. Комиссия за перевод — 100 руб. за платёж."
        Ответ:
        {
          "tariff_reference_status": "defined",
          "tariff_reference_details": "тарифы на обслуживание счёта зафиксированы на срок договора",
          "fee_list_status": "defined",
          "fee_list_details": "комиссия за открытие счёта — 2 000 руб., комиссия за перевод — 100 руб. за платёж",
          "tariff_change_right_status": "defined",
          "tariff_change_right_details": "тарифы не подлежат изменению в течение срока договора",
          "tariff_change_display": "Тарифы фиксированы на срок договора",
          "tariff_change_notice_status": "not_defined",
          "tariff_change_notice_details": "Данные не определены",
          "evidence": [
            {
              "clause_ref": "п. 4.1",
              "quote": "Тарифы на обслуживание счёта зафиксированы на срок действия договора и не подлежат изменению."
            }
          ]
        }
        Пример 4 — текст есть, но надёжный вывод сделать нельзя (право
        изменения через внутренние документы без конкретного срока):
        Фрагмент:
        "Банк вправе изменять тарифы в порядке, установленном внутренними
        документами Банка. Актуальные тарифы размещаются на сайте Банка."
        Ответ:
        {
          "tariff_reference_status": "defined",
          "tariff_reference_details": "актуальные тарифы размещаются на сайте Банка",
          "fee_list_status": "not_defined",
          "fee_list_details": "Данные не определены",
          "tariff_change_right_status": "defined",
          "tariff_change_right_details": "банк вправе изменять тарифы в порядке, установленном внутренними документами Банка",
          "tariff_change_display": "Банк вправе изменить тарифы без уведомления",
          "tariff_change_notice_status": "not_defined",
          "tariff_change_notice_details": "Не удалось определить",
          "evidence": [
            {
              "clause_ref": "п. 4.1",
              "quote": "Банк вправе изменять тарифы в порядке, установленном внутренними документами Банка."
            }
          ]
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о тарифах.
        2. Найди прямую цитату о перечне комиссий.
        3. Найди прямую цитату о праве изменения тарифов.
        4. Найди прямую цитату о порядке и сроке уведомления.
        5. Определи режим изменения тарифов: фиксированы / банк вправе
          с уведомлением / банк вправе без уведомления / не урегулировано.
        6. Разграничь «данных нет» (Данные не определены) и «данные есть,
          но вывод неоднозначен» (Не удалось определить). Не подставляй
          нормы ГК РФ / ФЗ «О банках…» вместо текста договора.
        Не выводи шаги проверки — сформируй итоговый ответ согласно [ФОРМАТ ОТВЕТА].

        [ФОРМАТ ОТВЕТА]

        Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей.

        НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON,

        пригодным для парсинга через json.loads без предварительной обработки.
        Ответь РОВНО одним JSON-объектом без какого-либо дополнительного
        текста до или после, со всеми 9 ключами полей (evidence — служебный
        массив цитат, не относящийся к схеме полей):
        {
          "tariff_reference_status": "<defined / not_defined>",
          "tariff_reference_details": "<текст / 'Данные не определены' / 'Не удалось определить'>",
          "fee_list_status": "<defined / not_defined>",
          "fee_list_details": "<текст / 'Данные не определены' / 'Не удалось определить'>",
          "tariff_change_right_status": "<defined / not_defined>",
          "tariff_change_right_details": "<текст / 'Данные не определены' / 'Не удалось определить'>",
          "tariff_change_display": "<Тарифы фиксированы на срок договора / Банк вправе изменить тарифы с уведомлением / Банк вправе изменить тарифы без уведомления / Право изменения тарифов не урегулировано / Не удалось определить>",
          "tariff_change_notice_status": "<defined / not_defined>",
          "tariff_change_notice_details": "<текст / 'Данные не определены' / 'Не удалось определить'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 8
      temperature: 0.0
      max_tokens: 600

    retrieval:
      retrieval_profile: "payment_terms_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "тариф комиссия плата за обслуживание стоимость услуг изменение тарифов одностороннем порядке уведомление об изменении"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - procedures
      negative_keywords:
        - "процентная ставка"
        - "овердрафт"
        - "115-ФЗ"
        - "безакцептное"
        - "ДБО"
        - "страхование"
        - "закрытие счета"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.20, 0.60]
        boost: 0.15
        scope: segment
      context_k: 8
      max_chunks: 10
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "obligations"
        - "procedures"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.12

    evidence:
      required: true
      min_snippet_length: 35
      max_snippet_length: 550

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1050
      compact_output: false

      presence_signal:
        field: "account_tariffs_and_commissions_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора банковского счёта
        тарифы, комиссии, право банка изменять тарифы, порядок уведомления
        и сформируй читаемый вывод о режиме изменения тарифов.
        Не анализируй проценты, AML, ДБО или страхование.
        Не подставляй нормы ст. 851 ГК РФ или ст. 29 ФЗ «О банках…» вместо
        текста договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. account_tariffs_and_commissions_check_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (tariff_reference_status, fee_list_status,
              tariff_change_right_status, tariff_change_notice_status) ≠ "not_defined";
           - "missing" — если все четыре содержательных поля = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - tariff_reference_status = "not_defined";
           - fee_list_status = "not_defined";
           - tariff_change_right_status = "not_defined";
           - tariff_change_notice_status = "not_defined";
           - tariff_reference_details, fee_list_details,
             tariff_change_right_details, tariff_change_notice_details = "Данные не определены";
           - tariff_change_display = "Право изменения тарифов не урегулировано";
           - не выполняй остальные шаги.

        1. tariff_reference_status:
           - "defined" — если тарифы указаны в тексте договора или через конкретное приложение;
           - "not_defined" — если тарифы прямо не указаны.

        2. tariff_reference_details:
           Формулировка о тарифах.
           Если данных нет — "Данные не определены";
           если фрагмент неоднозначен — "Не удалось определить".

        3. fee_list_status:
           - "defined" — если перечень комиссий прямо указан (в договоре или через приложение с конкретными ставками);
           - "not_defined" — если перечень комиссий прямо не указан.

        4. fee_list_details:
           Формулировка о перечне комиссий.
           Если данных нет — "Данные не определены";
           если фрагмент неоднозначен — "Не удалось определить".

        5. tariff_change_right_status:
           - "defined" — если в тексте прямо указан режим изменения тарифов: фиксация, запрет, право банка изменять;
           - "not_defined" — если режим изменения тарифов прямо не указан.

        6. tariff_change_right_details:
           Формулировка о режиме изменения тарифов.
           Если данных нет — "Данные не определены";
           если фрагмент неоднозначен — "Не удалось определить".

        7. tariff_change_display:
           Читаемый вывод о режиме изменения тарифов для DD Grid. Строго по правилам:
           - "Тарифы фиксированы на срок договора" — если в договоре прямо сказано, что тарифы не подлежат изменению;
           - "Банк вправе изменить тарифы с уведомлением" — если банк вправе изменять тарифы, и указан конкретный порядок/срок уведомления клиента;
           - "Банк вправе изменить тарифы без уведомления" — если банк вправе изменять тарифы, но конкретный порядок/срок уведомления не назван;
           - "Право изменения тарифов не урегулировано" — если тема изменения тарифов в договоре не упомянута;
           - "Не удалось определить" — если формулировка есть, но вывод сделать нельзя.

        8. tariff_change_notice_status:
           - "defined" — если порядок и/или срок уведомления об изменении тарифов прямо указаны;
           - "not_defined" — если порядок и/или срок уведомления прямо не указаны.

        9. tariff_change_notice_details:
           Формулировка о порядке и сроке уведомления.
           Если данных нет — "Данные не определены";
           если фрагмент неоднозначен — "Не удалось определить".

        10. evidence:
            Массив объектов [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}].
            Включай только прямые цитаты из договора. Если прямых цитат нет — пустой массив.
        </task>

        <context_rules>
        - Перед остальными полями заполни account_tariffs_and_commissions_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined", все *_details = "Данные не определены", tariff_change_display = "Право изменения тарифов не урегулировано".
        - Используй только текст договора.
        - Не подставляй нормы ст. 851 ГК РФ или ст. 29 ФЗ «О банках…» вместо текста договора.
          Отсутствие условия в договоре — это not_defined, а не «по закону банк не вправе взимать плату».
        - Не додумывай размер комиссий, порядок уведомления или режим изменения тарифов, если они не зафиксированы прямо.
        - tariff_reference_status = "defined", если договор содержит отсылку к конкретному приложению с тарифами или прямо называет хотя бы одну ставку/тариф.
        - tariff_change_right_status = "defined" и для случая, когда договор прямо фиксирует тарифы (то есть прямо запрещает изменение).
        - Если в договоре указано, что банк вправе изменять тарифы «в порядке, установленном внутренними документами Банка» без конкретного срока/порядка уведомления — tariff_change_display = "Банк вправе изменить тарифы без уведомления", tariff_change_notice_status = "not_defined", tariff_change_notice_details = "Не удалось определить".
        - Не используй "None", "null", пустые строки.
        - Все текстовые значения пиши на русском языке, кроме служебных enum-значений status-полей.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни тарифов, ни комиссий, ни права изменения тарифов, ни уведомления.
           → presence = "missing";
             все *_status = "not_defined";
             все *_details = "Данные не определены";
             tariff_change_display = "Право изменения тарифов не урегулировано".

        2. Неполное раскрытие темы (общая отсылка к тарифам).
           "Клиент оплачивает услуги Банка в соответствии с тарифами" без приложения и конкретных цифр.
           → presence = "present";
             tariff_reference_status = "defined";
             fee_list_status = "not_defined";
             fee_list_details = "Данные не определены".

        3. Противоречие между фрагментами.
           В разных частях договора указаны противоречивые тарифы или условия изменения,
           и конфликт нельзя разрешить по тексту.
           → presence = "unclear";
             соответствующий *_status = "not_defined";
             соответствующий *_details = "Не удалось определить";
             tariff_change_display = "Не удалось определить".

        4. Специфика темы: право изменения через внутренние документы.
           "Банк вправе изменять тарифы в порядке, установленном внутренними документами Банка"
           без конкретного срока/порядка уведомления.
           → presence = "present";
             tariff_change_right_status = "defined";
             tariff_change_display = "Банк вправе изменить тарифы без уведомления";
             tariff_change_notice_status = "not_defined";
             tariff_change_notice_details = "Не удалось определить".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для account_tariffs_and_commissions_check_presence используй только: "present", "missing", "unclear".
        - Для status-полей используй только: "defined" или "not_defined".
        - Для tariff_change_display используй только значения из allowed_values, без свободных формулировок.
        - Fallback при отсутствии данных:
          * tariff_reference_details, fee_list_details, tariff_change_right_details, tariff_change_notice_details → "Данные не определены";
          * tariff_change_display → "Право изменения тарифов не урегулировано".
        - Fallback при противоречии или неоднозначности:
          * все *_details → "Не удалось определить";
          * tariff_change_display → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "account_tariffs_and_commissions_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования по тарифам/комиссиям/изменению стоимости. Внутреннее агрегатное signal-поле."
          required: true

        - name: "tariff_reference_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус указания тарифов."
          required: true
          display_in_grid: false

        - name: "tariff_reference_details"
          type: "string"
          presentation: "fact"
          label: "Тарифы"
          description: "Формулировка о тарифах (ставки или отсылка к приложению)."
          required: true
          display_in_grid: true
          display_priority: 1

        - name: "fee_list_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          description: "Статус перечня комиссий."
          required: true
          display_in_grid: false

        - name: "fee_list_details"
          type: "string"
          presentation: "fact"
          label: "Комиссии"
          description: "Формулировка о перечне комиссий или отсылке к приложению."
          required: true
          display_in_grid: true
          display_priority: 2

        - name: "tariff_change_right_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус указания режима изменения тарифов."
          required: true
          display_in_grid: false

        - name: "tariff_change_right_details"
          label: "Право банка на изменение тарифов"
          type: "string"
          presentation: "fact"
          description: "Формулировка о режиме изменения тарифов (внутреннее поле для формирования _display)."
          required: true
          display_in_grid: false

        - name: "tariff_change_display"
          type: "string"
          presentation: "fact"
          label: "Изменение тарифов"
          allowed_values:
            - "Тарифы фиксированы на срок договора"
            - "Банк вправе изменить тарифы с уведомлением"
            - "Банк вправе изменить тарифы без уведомления"
            - "Право изменения тарифов не урегулировано"
            - "Не удалось определить"
          description: "Читаемый вывод о режиме изменения тарифов; «без уведомления» — сигнал риска для клиента."
          required: true
          display_in_grid: true
          display_priority: 3

        - name: "tariff_change_notice_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          description: "Статус указания порядка уведомления об изменении тарифов."
          required: true
          display_in_grid: false

        - name: "tariff_change_notice_details"
          type: "string"
          presentation: "fact"
          label: "Уведомление об изменении"
          description: "Формулировка о порядке и сроке уведомления клиента об изменении тарифов."
          required: true
          display_in_grid: true
          display_priority: 4

      store_payload: true

  - id: aml_blocking_check
    name: "ПОД/ФТ: идентификация клиента и приостановление операций (115-ФЗ)"
    description: >
      Фактографическая проверка наличия AML/CFT-положений, права банка
      запрашивать документы, оснований блокировки и порядка разблокировки.
      Специализация поверх global check-а aml_kyc: выделяет типоспецифичную
      для банковского счёта/вклада механику — приостановление операций
      по счёту (ст. 7 п. 10–11, ст. 7.7 115-ФЗ), основания блокировки
      и порядок разблокировки. Для клиента это deal-relevant: деньги
      физически заморожены, и важно видеть, раскрыта ли механика
      в договоре или только отсылка к закону.
    triggers:
      any: ["aml_ctf_terms"]
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "115-ФЗ"
        - "идентификация клиента"
        - "подозрительные операции"
        - "приостановление операций"
        - "блокировка"
        - "разблокировка"
        - "документы для идентификации"
        - "противодействие легализации"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)115[- ]?фз"
        - "(?i)идентификац"
        - "(?i)приостановлени[ея]\\s+операц|блокировк[аи]\\s+сч"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор банковского вклада или банковского счёта.
        Проверяется только один вопрос: AML/CFT-положения — идентификация,
        запрос документов, основания блокировки операций и порядок
        разблокировки.
        Нормативный ориентир:
        - ст. 7 п. 10–11 115-ФЗ — право банка отказать в операции
          и приостановление по решению Росфинмониторинга;
        - ст. 7.7 115-ФЗ — приостановление по решению межведомственного
          органа.
        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора.
        - Не оценивай серьёзность риска.
        - Не подставляй нормы 115-ФЗ вместо текста договора: если AML-условие
          в договоре не зафиксировано — это not_defined, а не «по закону
          115-ФЗ применяется автоматически».
        - Различай три состояния: механика раскрыта в договоре; договор
          только ссылается на 115-ФЗ / «законодательство РФ» без раскрытия
          конкретных оснований и порядка; AML-положения в договоре
          отсутствуют.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Есть ли AML/CFT-условия.
        2. Есть ли право банка запрашивать документы для идентификации.
        3. Раскрыты ли основания блокировки (приостановления операций).
        4. Есть ли механизм и порядок разблокировки.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не путай «данные отсутствуют» и «данные есть, но вывод
          неоднозначен»:
          - если в тексте нет сведений — статус "not_defined", значение
            "Данные не определены";
          - если фрагмент есть, но из него нельзя сделать надёжный вывод —
            значение "Не удалось определить".
        3. Не используй "None", "null", пустые строки.
        4. В evidence включай только точные цитаты из договора.
        5. Не додумывай основания блокировки, порядок разблокировки или
          перечень документов, если они не зафиксированы прямо.

        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1 — механика блокировки и разблокировки раскрыта в договоре:
        Фрагмент:
        "Банк вправе приостановить операции по счёту в случаях, предусмотренных
        115-ФЗ, а также при непредставлении Клиентом запрошенных документов
        в течение 5 рабочих дней. Банк вправе запросить документы для
        идентификации клиента. Разблокировка производится в течение 3 рабочих
        дней после устранения оснований."
        Ответ:
        {
          "aml_terms_status": "defined",
          "aml_terms_details": "банк вправе приостановить операции по счёту в случаях, предусмотренных 115-ФЗ, и при непредставлении документов",
          "document_request_status": "defined",
          "document_request_details": "банк вправе запросить документы для идентификации клиента",
          "blocking_grounds_status": "defined",
          "blocking_grounds_details": "случаи по 115-ФЗ; непредставление документов в течение 5 рабочих дней",
          "blocking_mode_display": "Механика блокировки раскрыта в договоре",
          "unblocking_status": "defined",
          "unblocking_details": "в течение 3 рабочих дней после устранения оснований",
          "evidence": [
            {
              "clause_ref": "п. 5.1",
              "quote": "Банк вправе приостановить операции по счёту в случаях, предусмотренных 115-ФЗ, а также при непредставлении Клиентом запрошенных документов в течение 5 рабочих дней."
            },
            {
              "clause_ref": "п. 5.3",
              "quote": "Разблокировка производится в течение 3 рабочих дней после устранения оснований."
            }
          ]
        }
        Пример 2 — есть только общая отсылка к 115-ФЗ без раскрытия механики:
        Фрагмент:
        "Банк вправе приостановить операции по счёту в случаях, предусмотренных
        законодательством РФ."
        Ответ:
        {
          "aml_terms_status": "defined",
          "aml_terms_details": "банк вправе приостановить операции по счёту в случаях, предусмотренных законодательством РФ",
          "document_request_status": "not_defined",
          "document_request_details": "Данные не определены",
          "blocking_grounds_status": "defined",
          "blocking_grounds_details": "случаи, предусмотренные законодательством РФ (без раскрытия)",
          "blocking_mode_display": "Договор ссылается на 115-ФЗ без раскрытия механики",
          "unblocking_status": "not_defined",
          "unblocking_details": "Данные не определены",
          "evidence": [
            {
              "clause_ref": "п. 5.1",
              "quote": "Банк вправе приостановить операции по счёту в случаях, предусмотренных законодательством РФ."
            }
          ]
        }
        Пример 3 — AML-положений в договоре нет вообще:
        Фрагмент:
        "Клиент обязуется оплачивать услуги Банка согласно тарифам."
        Ответ:
        {
          "aml_terms_status": "not_defined",
          "aml_terms_details": "Данные не определены",
          "document_request_status": "not_defined",
          "document_request_details": "Данные не определены",
          "blocking_grounds_status": "not_defined",
          "blocking_grounds_details": "Данные не определены",
          "blocking_mode_display": "Договор не содержит AML-положений",
          "unblocking_status": "not_defined",
          "unblocking_details": "Данные не определены",
          "evidence": []
        }
        Пример 4 — текст есть, но надёжный вывод сделать нельзя (основания
        через «законодательство РФ» без конкретики, разблокировка описана
        общо):
        Фрагмент:
        "Банк вправе приостановить операции по счёту по основаниям,
        предусмотренным законодательством РФ. Разблокировка производится
        в порядке, установленном законодательством."
        Ответ:
        {
          "aml_terms_status": "defined",
          "aml_terms_details": "банк вправе приостановить операции по счёту по основаниям, предусмотренным законодательством РФ",
          "document_request_status": "not_defined",
          "document_request_details": "Данные не определены",
          "blocking_grounds_status": "defined",
          "blocking_grounds_details": "основания, предусмотренные законодательством РФ (без раскрытия)",
          "blocking_mode_display": "Договор ссылается на 115-ФЗ без раскрытия механики",
          "unblocking_status": "defined",
          "unblocking_details": "Не удалось определить",
          "evidence": [
            {
              "clause_ref": "п. 5.1",
              "quote": "Банк вправе приостановить операции по счёту по основаниям, предусмотренным законодательством РФ."
            },
            {
              "clause_ref": "п. 5.2",
              "quote": "Разблокировка производится в порядке, установленном законодательством."
            }
          ]
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату об AML/CFT-условиях.
        2. Найди прямую цитату о праве запрашивать документы.
        3. Найди прямую цитату об основаниях блокировки.
        4. Найди прямую цитату о механизме разблокировки.
        5. Определи режим: механика раскрыта в договоре / только отсылка
          к 115-ФЗ без раскрытия / AML-положений нет.
        6. Разграничь «данных нет» (Данные не определены) и «данные есть,
          но вывод неоднозначен» (Не удалось определить). Не подставляй
          115-ФЗ вместо текста договора.
        Не выводи шаги проверки — сформируй итоговый ответ согласно [ФОРМАТ ОТВЕТА].

        [ФОРМАТ ОТВЕТА]

        Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей.

        НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON,

        пригодным для парсинга через json.loads без предварительной обработки.
        Ответь РОВНО одним JSON-объектом без какого-либо дополнительного
        текста до или после, со всеми 9 ключами полей (evidence — служебный
        массив цитат, не относящийся к схеме полей):
        {
          "aml_terms_status": "<defined / not_defined>",
          "aml_terms_details": "<текст / 'Данные не определены' / 'Не удалось определить'>",
          "document_request_status": "<defined / not_defined>",
          "document_request_details": "<текст / 'Данные не определены' / 'Не удалось определить'>",
          "blocking_grounds_status": "<defined / not_defined>",
          "blocking_grounds_details": "<текст / 'Данные не определены' / 'Не удалось определить'>",
          "blocking_mode_display": "<Механика блокировки раскрыта в договоре / Договор ссылается на 115-ФЗ без раскрытия механики / Договор не содержит AML-положений / Не удалось определить>",
          "unblocking_status": "<defined / not_defined>",
          "unblocking_details": "<текст / 'Данные не определены' / 'Не удалось определить'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 8
      temperature: 0.0
      max_tokens: 600

    retrieval:
      retrieval_profile: "sanctions_compliance_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "115-ФЗ идентификация клиента подозрительные операции приостановление операций блокировка разблокировка документы для идентификации противодействие легализации"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - procedures
      negative_keywords:
        - "процентная ставка"
        - "тариф"
        - "комиссия"
        - "овердрафт"
        - "безакцептное"
        - "ДБО"
        - "страхование"
        - "закрытие счета"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.30, 0.75]
        boost: 0.15
        scope: segment
      context_k: 8
      max_chunks: 10
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "obligations"
        - "procedures"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.12

    evidence:
      required: true
      min_snippet_length: 35
      max_snippet_length: 550

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1050
      compact_output: false

      presence_signal:
        field: "aml_blocking_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора банковского вклада
        или банковского счёта AML/CFT-положения: идентификацию, запрос
        документов, основания блокировки операций, порядок разблокировки,
        и сформируй читаемый вывод о том, раскрыта ли механика в договоре.
        Не анализируй проценты, тарифы, ДБО или страхование.
        Не подставляй нормы 115-ФЗ вместо текста договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. aml_blocking_check_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (aml_terms_status, document_request_status,
              blocking_grounds_status, unblocking_status) ≠ "not_defined";
           - "missing" — если все четыре содержательных поля = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - aml_terms_status = "not_defined";
           - document_request_status = "not_defined";
           - blocking_grounds_status = "not_defined";
           - unblocking_status = "not_defined";
           - aml_terms_details, document_request_details,
             blocking_grounds_details, unblocking_details = "Данные не определены";
           - blocking_mode_display = "Договор не содержит AML-положений";
           - не выполняй остальные шаги.

        1. aml_terms_status:
           - "defined" — если в договоре есть хотя бы одно AML/CFT-условие (идентификация, запрос документов, блокировка, отсылка к 115-ФЗ);
           - "not_defined" — если AML/CFT-условий нет.

        2. aml_terms_details:
           Краткая формулировка об AML-условиях.
           Если данных нет — "Данные не определены";
           если фрагмент неоднозначен — "Не удалось определить".

        3. document_request_status:
           - "defined" — если право банка запрашивать документы (для идентификации, подтверждения операций) прямо указано;
           - "not_defined" — если право запрашивать документы прямо не указано.

        4. document_request_details:
           Формулировка о праве запрашивать документы.
           Если данных нет — "Данные не определены";
           если фрагмент неоднозначен — "Не удалось определить".

        5. blocking_grounds_status:
           - "defined" — если основания блокировки (приостановления операций) прямо указаны — конкретно или через отсылку к 115-ФЗ / «законодательству РФ»;
           - "not_defined" — если основания блокировки прямо не указаны.

        6. blocking_grounds_details:
           Формулировка об основаниях блокировки.
           Если данных нет — "Данные не определены";
           если фрагмент неоднозначен — "Не удалось определить".

        7. blocking_mode_display:
           Читаемый вывод о раскрытии механики блокировки для DD Grid. Строго по правилам:
           - "Механика блокировки раскрыта в договоре" — если договор содержит конкретные основания и/или сроки блокировки и/или разблокировки;
           - "Договор ссылается на 115-ФЗ без раскрытия механики" — если в договоре есть только общая отсылка к 115-ФЗ / «законодательству РФ» без конкретных оснований, сроков и порядка;
           - "Договор не содержит AML-положений" — если в договоре нет ни одного AML-условия;
           - "Не удалось определить" — если формулировка есть, но вывод сделать нельзя.

        8. unblocking_status:
           - "defined" — если порядок и/или срок разблокировки прямо указаны;
           - "not_defined" — если порядок и/или срок разблокировки прямо не указаны.

        9. unblocking_details:
           Формулировка о порядке и сроке разблокировки.
           Если данных нет — "Данные не определены";
           если фрагмент неоднозначен — "Не удалось определить".

        10. evidence:
            Массив объектов [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}].
            Включай только прямые цитаты из договора. Если прямых цитат нет — пустой массив.
        </task>

        <context_rules>
        - Перед остальными полями заполни aml_blocking_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined", все *_details = "Данные не определены", blocking_mode_display = "Договор не содержит AML-положений".
        - Используй только текст договора.
        - Не подставляй нормы 115-ФЗ вместо текста договора.
          Отсутствие AML-условия в договоре — это not_defined, а не «по закону 115-ФЗ применяется автоматически».
        - Не додумывай основания блокировки, порядок разблокировки или перечень документов, если они не зафиксированы прямо.
        - blocking_grounds_status = "defined" и для случая, когда договор содержит только отсылку к 115-ФЗ / «законодательству РФ» без раскрытия конкретных оснований — это тоже определенность факта наличия условия.
        - Если договор содержит только отсылку к 115-ФЗ / «законодательству РФ» без раскрытия конкретных оснований, сроков и порядка — blocking_mode_display = "Договор ссылается на 115-ФЗ без раскрытия механики".
        - Если в договоре конкретно названы хотя бы один случай блокировки или хотя бы один срок / процедура разблокировки — blocking_mode_display = "Механика блокировки раскрыта в договоре".
        - Если в договоре нет ни одного AML-условия (ни идентификации, ни запроса документов, ни блокировки, ни отсылки к 115-ФЗ) — blocking_mode_display = "Договор не содержит AML-положений".
        - Не используй "None", "null", пустые строки.
        - Все текстовые значения пиши на русском языке, кроме служебных enum-значений status-полей.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни одного AML/CFT-условия: ни идентификации, ни запроса документов,
           ни блокировки, ни отсылки к 115-ФЗ.
           → presence = "missing";
             все *_status = "not_defined";
             все *_details = "Данные не определены";
             blocking_mode_display = "Договор не содержит AML-положений".

        2. Неполное раскрытие темы (только отсылка к 115-ФЗ).
           "Банк вправе приостановить операции по счёту в случаях, предусмотренных
           законодательством РФ" без раскрытия конкретных оснований и порядка.
           → presence = "present";
             aml_terms_status = "defined";
             blocking_grounds_status = "defined";
             blocking_mode_display = "Договор ссылается на 115-ФЗ без раскрытия механики";
             document_request_status = "not_defined";
             unblocking_status = "not_defined".

        3. Противоречие между фрагментами.
           В разных частях договора указаны противоречивые основания блокировки
           или сроки разблокировки, и конфликт нельзя разрешить по тексту.
           → presence = "unclear";
             соответствующий *_status = "not_defined";
             соответствующий *_details = "Не удалось определить";
             blocking_mode_display = "Не удалось определить".

        4. Специфика темы: основания через «законодательство РФ» без конкретики.
           "Банк вправе приостановить операции по основаниям, предусмотренным законодательством РФ.
           Разблокировка производится в порядке, установленном законодательством."
           → presence = "present";
             aml_terms_status = "defined";
             blocking_grounds_status = "defined";
             blocking_mode_display = "Договор ссылается на 115-ФЗ без раскрытия механики";
             unblocking_status = "defined";
             unblocking_details = "Не удалось определить".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для aml_blocking_check_presence используй только: "present", "missing", "unclear".
        - Для status-полей используй только: "defined" или "not_defined".
        - Для blocking_mode_display используй только значения из allowed_values, без свободных формулировок.
        - Fallback при отсутствии данных:
          * aml_terms_details, document_request_details, blocking_grounds_details, unblocking_details → "Данные не определены";
          * blocking_mode_display → "Договор не содержит AML-положений".
        - Fallback при противоречии или неоднозначности:
          * все *_details → "Не удалось определить";
          * blocking_mode_display → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "aml_blocking_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие AML/CFT-регулирования в договоре. Внутреннее агрегатное signal-поле."
          required: true

        - name: "aml_terms_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус наличия AML/CFT-условий (общая тема покрыта global aml_kyc)."
          required: true
          display_in_grid: false

        - name: "aml_terms_details"
          label: "Условия ограничений по 115-ФЗ"
          type: "string"
          presentation: "fact"
          description: "Формулировка об AML/CFT-условиях (внутреннее поле; в grid не выводится — общая тема покрыта global aml_kyc)."
          required: true
          display_in_grid: false

        - name: "document_request_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          description: "Статус права запрашивать документы."
          required: true
          display_in_grid: false

        - name: "document_request_details"
          type: "string"
          presentation: "fact"
          label: "Запрос документов"
          description: "Формулировка о праве банка запрашивать документы (для идентификации, подтверждения операций)."
          required: true
          display_in_grid: true
          display_priority: 1

        - name: "blocking_grounds_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус раскрытия оснований блокировки."
          required: true
          display_in_grid: false

        - name: "blocking_grounds_details"
          type: "string"
          presentation: "fact"
          label: "Основания блокировки"
          description: "Формулировка об основаниях блокировки (приостановления операций)."
          required: true
          display_in_grid: true
          display_priority: 2

        - name: "blocking_mode_display"
          type: "string"
          presentation: "fact"
          label: "Режим блокировки"
          allowed_values:
            - "Механика блокировки раскрыта в договоре"
            - "Договор ссылается на 115-ФЗ без раскрытия механики"
            - "Договор не содержит AML-положений"
            - "Не удалось определить"
          description: "Читаемый вывод о раскрытии механики блокировки; сигнал риска при отсутствии конкретики в договоре."
          required: true
          display_in_grid: true
          display_priority: 3

        - name: "unblocking_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус механизма разблокировки."
          required: true
          display_in_grid: false

        - name: "unblocking_details"
          type: "string"
          presentation: "fact"
          label: "Разблокировка"
          description: "Формулировка о порядке и сроке разблокировки."
          required: true
          display_in_grid: true
          display_priority: 4

      store_payload: true

  - id: unauthorized_debit_check
    name: "Безакцептное списание и несанкционированные операции (ст. 854 ГК РФ)"
    description: >
      Фактографическая проверка оснований списания без распоряжения клиента
      и защиты от несанкционированных списаний. Специализация для договора
      банковского счёта: ст. 854 ГК РФ допускает списание без распоряжения
      только по решению суда, в случаях, установленных законом, либо прямо
      предусмотренных договором. Для клиента deal-relevant является:
      раскрыт ли в договоре конкретный перечень случаев, как клиент
      уведомляется о списании и есть ли у него механизм защиты.
    triggers:
      any: ["bank_account_contract"]
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "безакцептное списание"
        - "списание без распоряжения"
        - "инкассовое поручение"
        - "несанкционированное списание"
        - "уведомление о списании"
        - "исполнительный документ"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)безакцептн(ое|ого)\\s+списан"
        - "(?i)списани[ея].{0,40}без\\s+распоряжен"
        - "(?i)инкассов(ое|ого)\\s+поручени"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор банковского счёта (Глава 45 ГК РФ).
        Проверяется только один вопрос: основания списания без распоряжения
        клиента, уведомление клиента и защита от несанкционированных
        списаний.
        Нормативный ориентир:
        - ст. 854 ГК РФ — списание денежных средств со счёта: по распоряжению
          клиента, а без такого распоряжения — только по решению суда,
          в случаях, установленных законом, либо прямо предусмотренных
          договором между банком и клиентом.
        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора.
        - Не оценивай серьёзность риска.
        - Не подставляй нормы ст. 854 ГК РФ вместо текста договора: если
          случай списания в договоре не назван — это not_defined, а не
          «по закону списание допускается».
        - Различай три состояния: договор раскрывает конкретный перечень
          случаев списания без распоряжения; договор только ссылается
          на закон / «законодательство РФ» без раскрытия; договор вообще
          не предусматривает такого списания.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Есть ли основания списания без распоряжения клиента.
        2. Есть ли конкретный перечень случаев такого списания.
        3. Есть ли порядок и срок уведомления клиента о списании.
        4. Есть ли механизм защиты клиента от несанкционированных списаний
          (порядок оспаривания, возмещения, ответственность банка).

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не путай «данные отсутствуют» и «данные есть, но вывод
          неоднозначен»:
          - если в тексте нет сведений — статус "not_defined", значение
            "Данные не определены";
          - если фрагмент есть, но из него нельзя сделать надёжный вывод —
            значение "Не удалось определить".
        3. Не используй "None", "null", пустые строки.
        4. В evidence включай только точные цитаты из договора.
        5. Не додумывай перечень случаев, порядок уведомления или механизм
          защиты, если они в тексте не зафиксированы прямо.

        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1 — механика раскрыта: перечень случаев, уведомление, защита:
        Фрагмент:
        "Банк вправе списывать средства без распоряжения Клиента на основании
        исполнительных документов, а также в случаях, прямо предусмотренных
        договором: при просрочке платежа по овердрафту свыше 5 рабочих дней.
        Клиент уведомляется о списании не позднее следующего рабочего дня.
        При несанкционированном списании Клиент вправе обратиться в Банк
        с заявлением; Банк рассматривает его в течение 5 рабочих дней."
        Ответ:
        {
          "debit_grounds_status": "defined",
          "debit_grounds_details": "исполнительные документы; просрочка платежа по овердрафту свыше 5 рабочих дней",
          "debit_cases_status": "defined",
          "debit_cases_details": "исполнительные документы; просрочка по овердрафту свыше 5 рабочих дней",
          "debit_mode_display": "Договор раскрывает конкретные случаи списания",
          "client_notice_status": "defined",
          "client_notice_details": "уведомление не позднее следующего рабочего дня",
          "unauthorized_protection_status": "defined",
          "unauthorized_protection_details": "заявление клиента, рассмотрение банком в течение 5 рабочих дней",
          "evidence": [
            {
              "clause_ref": "п. 6.1",
              "quote": "Банк вправе списывать средства без распоряжения Клиента на основании исполнительных документов, а также в случаях, прямо предусмотренных договором: при просрочке платежа по овердрафту свыше 5 рабочих дней."
            },
            {
              "clause_ref": "п. 6.2",
              "quote": "Клиент уведомляется о списании не позднее следующего рабочего дня."
            }
          ]
        }
        Пример 2 — только отсылка к законодательству без раскрытия:
        Фрагмент:
        "Банк вправе списывать средства без распоряжения Клиента в случаях,
        предусмотренных законодательством РФ."
        Ответ:
        {
          "debit_grounds_status": "defined",
          "debit_grounds_details": "случаи, предусмотренные законодательством РФ",
          "debit_cases_status": "not_defined",
          "debit_cases_details": "Данные не определены",
          "debit_mode_display": "Договор ссылается на закон без раскрытия случаев",
          "client_notice_status": "not_defined",
          "client_notice_details": "Данные не определены",
          "unauthorized_protection_status": "not_defined",
          "unauthorized_protection_details": "Данные не определены",
          "evidence": [
            {
              "clause_ref": "п. 6.1",
              "quote": "Банк вправе списывать средства без распоряжения Клиента в случаях, предусмотренных законодательством РФ."
            }
          ]
        }
        Пример 3 — договор не предусматривает списания без распоряжения:
        Фрагмент:
        "Банк выполняет распоряжения Клиента о перечислении и выдаче
        денежных средств со счёта."
        Ответ:
        {
          "debit_grounds_status": "not_defined",
          "debit_grounds_details": "Данные не определены",
          "debit_cases_status": "not_defined",
          "debit_cases_details": "Данные не определены",
          "debit_mode_display": "Договор не предусматривает списания без распоряжения",
          "client_notice_status": "not_defined",
          "client_notice_details": "Данные не определены",
          "unauthorized_protection_status": "not_defined",
          "unauthorized_protection_details": "Данные не определены",
          "evidence": []
        }
        Пример 4 — текст есть, но надёжный вывод сделать нельзя (перечень
        случаев через «законодательство РФ» без раскрытия, уведомление
        описано общо):
        Фрагмент:
        "Банк вправе списывать средства без распоряжения Клиента по основаниям,
        предусмотренным законодательством РФ. Банк уведомляет Клиента
        о произведённом списании в порядке, установленном внутренними
        документами Банка."
        Ответ:
        {
          "debit_grounds_status": "defined",
          "debit_grounds_details": "основания, предусмотренные законодательством РФ",
          "debit_cases_status": "not_defined",
          "debit_cases_details": "Данные не определены",
          "debit_mode_display": "Договор ссылается на закон без раскрытия случаев",
          "client_notice_status": "defined",
          "client_notice_details": "Не удалось определить",
          "unauthorized_protection_status": "not_defined",
          "unauthorized_protection_details": "Данные не определены",
          "evidence": [
            {
              "clause_ref": "п. 6.1",
              "quote": "Банк вправе списывать средства без распоряжения Клиента по основаниям, предусмотренным законодательством РФ."
            },
            {
              "clause_ref": "п. 6.2",
              "quote": "Банк уведомляет Клиента о произведённом списании в порядке, установленном внутренними документами Банка."
            }
          ]
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату об основаниях списания без распоряжения.
        2. Найди прямую цитату о конкретном перечне случаев.
        3. Найди прямую цитату об уведомлении клиента.
        4. Найди прямую цитату о защите клиента от несанкционированных
          списаний.
        5. Определи режим: конкретные случаи раскрыты / только отсылка
          к закону / списание без распоряжения не предусмотрено.
        6. Разграничь «данных нет» (Данные не определены) и «данные есть,
          но вывод неоднозначен» (Не удалось определить). Не подставляй
          ст. 854 ГК РФ вместо текста договора.
        Не выводи шаги проверки — сформируй итоговый ответ согласно [ФОРМАТ ОТВЕТА].

        [ФОРМАТ ОТВЕТА]

        Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей.

        НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON,

        пригодным для парсинга через json.loads без предварительной обработки.
        Ответь РОВНО одним JSON-объектом без какого-либо дополнительного
        текста до или после, со всеми 9 ключами полей (evidence — служебный
        массив цитат, не относящийся к схеме полей):
        {
          "debit_grounds_status": "<defined / not_defined>",
          "debit_grounds_details": "<текст / 'Данные не определены' / 'Не удалось определить'>",
          "debit_cases_status": "<defined / not_defined>",
          "debit_cases_details": "<текст / 'Данные не определены' / 'Не удалось определить'>",
          "debit_mode_display": "<Договор раскрывает конкретные случаи списания / Договор ссылается на закон без раскрытия случаев / Договор не предусматривает списания без распоряжения / Не удалось определить>",
          "client_notice_status": "<defined / not_defined>",
          "client_notice_details": "<текст / 'Данные не определены' / 'Не удалось определить'>",
          "unauthorized_protection_status": "<defined / not_defined>",
          "unauthorized_protection_details": "<текст / 'Данные не определены' / 'Не удалось определить'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 8
      temperature: 0.0
      max_tokens: 600

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "безакцептное списание списание без распоряжения инкассовое поручение несанкционированное списание уведомление о списании исполнительный документ"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - limitations
      negative_keywords:
        - "процентная ставка"
        - "тариф"
        - "комиссия"
        - "овердрафт"
        - "115-ФЗ"
        - "ДБО"
        - "страхование"
        - "закрытие счета"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.30, 0.75]
        boost: 0.15
        scope: segment
      context_k: 8
      max_chunks: 10
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "obligations"
        - "limitations"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.12

    evidence:
      required: true
      min_snippet_length: 35
      max_snippet_length: 550

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1050
      compact_output: false

      presence_signal:
        field: "unauthorized_debit_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора банковского счёта
        основания и случаи списания без распоряжения клиента, порядок
        уведомления клиента и механизм защиты от несанкционированных
        списаний, и сформируй читаемый вывод о раскрытии механики.
        Не анализируй проценты, тарифы, AML или ДБО.
        Не подставляй нормы ст. 854 ГК РФ вместо текста договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. unauthorized_debit_check_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (debit_grounds_status, debit_cases_status,
              client_notice_status, unauthorized_protection_status) ≠ "not_defined";
           - "missing" — если все четыре содержательных поля = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - debit_grounds_status = "not_defined";
           - debit_cases_status = "not_defined";
           - client_notice_status = "not_defined";
           - unauthorized_protection_status = "not_defined";
           - debit_grounds_details, debit_cases_details,
             client_notice_details, unauthorized_protection_details = "Данные не определены";
           - debit_mode_display = "Договор не предусматривает списания без распоряжения";
           - не выполняй остальные шаги.

        1. debit_grounds_status:
           - "defined" — если в договоре есть хотя бы одно условие о списании без распоряжения клиента;
           - "not_defined" — если условий о списании без распоряжения нет.

        2. debit_grounds_details:
           Краткая формулировка оснований списания без распоряжения.
           Если данных нет — "Данные не определены";
           если фрагмент неоднозначен — "Не удалось определить".

        3. debit_cases_status:
           - "defined" — если в договоре прямо перечислены конкретные случаи списания без распоряжения (просрочка, штраф, неисполнение обязательств и т. п.);
           - "not_defined" — если конкретные случаи не перечислены.

        4. debit_cases_details:
           Формулировка конкретных случаев.
           Если данных нет — "Данные не определены";
           если фрагмент неоднозначен — "Не удалось определить".

        5. debit_mode_display:
           Читаемый вывод о раскрытии механики списания без распоряжения для DD Grid. Строго по правилам:
           - "Договор раскрывает конкретные случаи списания" — если в договоре прямо назван хотя бы один конкретный случай списания;
           - "Договор ссылается на закон без раскрытия случаев" — если договор содержит только общую отсылку к закону / «законодательству РФ» / «случаям, предусмотренным законом», без конкретного перечня;
           - "Договор не предусматривает списания без распоряжения" — если в договоре нет ни одного условия о списании без распоряжения;
           - "Не удалось определить" — если формулировка есть, но вывод сделать нельзя.

        6. client_notice_status:
           - "defined" — если порядок и/или срок уведомления клиента о списании без распоряжения прямо указаны;
           - "not_defined" — если порядок и/или срок уведомления прямо не указаны.

        7. client_notice_details:
           Формулировка о порядке уведомления.
           Если данных нет — "Данные не определены";
           если фрагмент неоднозначен — "Не удалось определить".

        8. unauthorized_protection_status:
           - "defined" — если в договоре есть механизм защиты клиента от несанкционированных списаний (порядок оспаривания, возмещения, ответственность банка);
           - "not_defined" — если механизм защиты прямо не указан.

        9. unauthorized_protection_details:
           Формулировка о механизме защиты.
           Если данных нет — "Данные не определены";
           если фрагмент неоднозначен — "Не удалось определить".

        10. evidence:
            Массив объектов [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}].
            Включай только прямые цитаты из договора. Если прямых цитат нет — пустой массив.
        </task>

        <context_rules>
        - Перед остальными полями заполни unauthorized_debit_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined", все *_details = "Данные не определены", debit_mode_display = "Договор не предусматривает списания без распоряжения".
        - Используй только текст договора.
        - Не подставляй нормы ст. 854 ГК РФ вместо текста договора.
          Отсутствие условия в договоре — это not_defined, а не «по закону списание допускается».
        - Не додумывай перечень случаев, порядок уведомления или механизм защиты, если они не зафиксированы прямо.
        - debit_grounds_status = "defined" и для случая, когда договор содержит только отсылку к закону / «законодательству РФ» без раскрытия конкретных случаев — это тоже определенность факта наличия условия.
        - debit_mode_display = "Договор раскрывает конкретные случаи списания" только если в договоре прямо назван хотя бы один конкретный случай списания (например, «просрочка по овердрафту свыше N дней», «неустойка по договору», «по исполнительному листу»).
        - Отсылка «на основании исполнительных документов» без указания конкретного случая — это «Договор ссылается на закон без раскрытия случаев».
        - Если в договоре сказано «в порядке, установленном внутренними документами Банка» без конкретного срока — client_notice_status = "defined", client_notice_details = "Не удалось определить".
        - Не используй "None", "null", пустые строки.
        - Все текстовые значения пиши на русском языке, кроме служебных enum-значений status-полей.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни одного условия о списании без распоряжения клиента.
           → presence = "missing";
             все *_status = "not_defined";
             все *_details = "Данные не определены";
             debit_mode_display = "Договор не предусматривает списания без распоряжения".

        2. Неполное раскрытие темы (только отсылка к закону).
           "Банк вправе списывать средства без распоряжения Клиента в случаях,
           предусмотренных законодательством РФ" без раскрытия конкретных случаев.
           → presence = "present";
             debit_grounds_status = "defined";
             debit_cases_status = "not_defined";
             debit_mode_display = "Договор ссылается на закон без раскрытия случаев".

        3. Противоречие между фрагментами.
           В разных частях договора указаны противоречивые условия списания
           или сроки уведомления, и конфликт нельзя разрешить по тексту.
           → presence = "unclear";
             соответствующий *_status = "not_defined";
             соответствующий *_details = "Не удалось определить";
             debit_mode_display = "Не удалось определить".

        4. Специфика темы: механизм защиты через «внутренние документы».
           "При несанкционированном списании Клиент вправе обратиться в Банк
           в порядке, установленном внутренними документами Банка."
           → presence = "present";
             unauthorized_protection_status = "defined";
             unauthorized_protection_details = "Не удалось определить".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для unauthorized_debit_check_presence используй только: "present", "missing", "unclear".
        - Для status-полей используй только: "defined" или "not_defined".
        - Для debit_mode_display используй только значения из allowed_values, без свободных формулировок.
        - Fallback при отсутствии данных:
          * debit_grounds_details, debit_cases_details, client_notice_details, unauthorized_protection_details → "Данные не определены";
          * debit_mode_display → "Договор не предусматривает списания без распоряжения".
        - Fallback при противоречии или неоднозначности:
          * все *_details → "Не удалось определить";
          * debit_mode_display → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "unauthorized_debit_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования по безакцептному списанию. Внутреннее агрегатное signal-поле."
          required: true

        - name: "debit_grounds_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус оснований списания без распоряжения."
          required: true
          display_in_grid: false

        - name: "debit_grounds_details"
          label: "Случаи безакцептного списания средств"
          type: "string"
          presentation: "fact"
          description: "Краткая формулировка оснований (внутреннее поле; в grid не выводится — дублирует debit_cases_details)."
          required: true
          display_in_grid: false

        - name: "debit_cases_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус конкретного перечня случаев списания."
          required: true
          display_in_grid: false

        - name: "debit_cases_details"
          type: "string"
          presentation: "fact"
          label: "Случаи списания"
          description: "Конкретный перечень случаев списания без распоряжения клиента."
          required: true
          display_in_grid: true
          display_priority: 1

        - name: "debit_mode_display"
          type: "string"
          presentation: "fact"
          label: "Режим списания"
          allowed_values:
            - "Договор раскрывает конкретные случаи списания"
            - "Договор ссылается на закон без раскрытия случаев"
            - "Договор не предусматривает списания без распоряжения"
            - "Не удалось определить"
          description: "Читаемый вывод о раскрытии механики списания без распоряжения."
          required: true
          display_in_grid: true
          display_priority: 2

        - name: "client_notice_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          description: "Статус уведомления клиента о списании."
          required: true
          display_in_grid: false

        - name: "client_notice_details"
          type: "string"
          presentation: "fact"
          label: "Уведомление о списании"
          description: "Порядок и срок уведомления клиента о списании без распоряжения."
          required: true
          display_in_grid: true
          display_priority: 3

        - name: "unauthorized_protection_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          description: "Статус защиты от несанкционированных списаний."
          required: true
          display_in_grid: false

        - name: "unauthorized_protection_details"
          type: "string"
          presentation: "fact"
          label: "Защита от списаний"
          description: "Механизм защиты клиента от несанкционированных списаний (оспаривание, возмещение, ответственность банка)."
          required: true
          display_in_grid: true
          display_priority: 4

      store_payload: true

  - id: dbs_security_check
    name: "ДБО: безопасность и распределение ответственности (161-ФЗ)"
    description: >
      Фактографическая проверка условий дистанционного банковского
      обслуживания: аутентификация, распределение ответственности за инциденты,
      порядок уведомления о компрометации. Специализация поверх global
      checks it_systems_access_and_data_export / cybersecurity_policies_and_incidents:
      выделяет типоспецифичную для банковского счёта механику ДБО —
      электронные средства платежа, ст. 9 161-ФЗ (правила аутентификации),
      распределение рисков при несанкционированных операциях.
    triggers:
      any: ["dbs_enabled"]
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "ДБО"
        - "дистанционное банковское обслуживание"
        - "интернет-банк"
        - "мобильное приложение"
        - "аутентификация"
        - "электронная подпись"
        - "несанкционированный доступ"
        - "компрометация"
        - "средства доступа"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)дистанционн(ое|ого)\\s+банковск(ое|ого)\\s+обслуживан"
        - "(?i)интернет[- ]банк|мобильн(ое|ого)\\s+приложен"
        - "(?i)несанкционированн(ый|ого)\\s+доступ"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор банковского счёта с ДБО.
        Проверяется только один вопрос: безопасность ДБО — условия
        обслуживания, аутентификация, распределение ответственности
        за инциденты и порядок уведомления о компрометации.
        Нормативный ориентир:
        - ст. 9 161-ФЗ — правила аутентификации; если банк не обеспечил
          надлежащую аутентификацию, риск несанкционированной операции
          может быть на банке;
        - ст. 8 161-ФЗ — уведомление клиента о совершённых операциях.
        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора.
        - Не оценивай серьёзность риска.
        - Не подставляй нормы 161-ФЗ вместо текста договора: если условие
          в договоре не зафиксировано — это not_defined, а не «по закону
          риск на банке».
        - Различай состояния: договор раскрывает механику ДБО; договор
          содержит только общую отсылку к внутренним документам банка;
          условия ДБО в договоре отсутствуют.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Есть ли условия ДБО.
        2. Есть ли механизм аутентификации.
        3. Как распределена ответственность за инциденты (кому принадлежит
          риск несанкционированной операции).
        4. Есть ли правило и срок уведомления об инцидентах / компрометации.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не путай «данные отсутствуют» и «данные есть, но вывод
          неоднозначен»:
          - если в тексте нет сведений — статус "not_defined", значение
            "Данные не определены";
          - если фрагмент есть, но из него нельзя сделать надёжный вывод —
            значение "Не удалось определить".
        3. Не используй "None", "null", пустые строки.
        4. В evidence включай только точные цитаты из договора.
        5. Не додумывай механизм аутентификации, распределение ответственности
          или срок уведомления, если они не зафиксированы прямо.

        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1 — механика ДБО, аутентификация, ответственность и уведомление
        раскрыты:
        Фрагмент:
        "ДБО осуществляется через интернет-банк с использованием одноразовых
        паролей, направляемых на номер мобильного телефона Клиента. Клиент
        несёт ответственность за сохранность средств доступа; Банк несёт
        ответственность за технические сбои системы ДБО. При обнаружении
        несанкционированного доступа Клиент обязан уведомить Банк в течение
        24 часов."
        Ответ:
        {
          "dbs_terms_status": "defined",
          "dbs_terms_details": "ДБО осуществляется через интернет-банк",
          "authentication_status": "defined",
          "authentication_details": "одноразовые пароли на номер мобильного телефона",
          "liability_allocation_status": "defined",
          "liability_allocation_details": "клиент — за сохранность средств доступа; банк — за технические сбои ДБО",
          "liability_mode_display": "Ответственность распределена (банк — за сбои, клиент — за средства доступа)",
          "incident_notice_status": "defined",
          "incident_notice_details": "уведомление банка в течение 24 часов",
          "evidence": [
            {
              "clause_ref": "п. 7.1",
              "quote": "ДБО осуществляется через интернет-банк с использованием одноразовых паролей, направляемых на номер мобильного телефона Клиента."
            },
            {
              "clause_ref": "п. 7.3",
              "quote": "При обнаружении несанкционированного доступа Клиент обязан уведомить Банк в течение 24 часов."
            }
          ]
        }
        Пример 2 — только общее упоминание ДБО, механика не раскрыта:
        Фрагмент:
        "Банк предоставляет клиенту доступ к интернет-банку."
        Ответ:
        {
          "dbs_terms_status": "defined",
          "dbs_terms_details": "банк предоставляет клиенту доступ к интернет-банку",
          "authentication_status": "not_defined",
          "authentication_details": "Данные не определены",
          "liability_allocation_status": "not_defined",
          "liability_allocation_details": "Данные не определены",
          "liability_mode_display": "Распределение ответственности не урегулировано",
          "incident_notice_status": "not_defined",
          "incident_notice_details": "Данные не определены",
          "evidence": [
            {
              "clause_ref": "п. 7.1",
              "quote": "Банк предоставляет клиенту доступ к интернет-банку."
            }
          ]
        }
        Пример 3 — ДБО в договоре не упомянуто:
        Фрагмент:
        "Банк открывает Клиенту расчетный счет и выполняет распоряжения
        Клиента о перечислении и выдаче средств."
        Ответ:
        {
          "dbs_terms_status": "not_defined",
          "dbs_terms_details": "Данные не определены",
          "authentication_status": "not_defined",
          "authentication_details": "Данные не определены",
          "liability_allocation_status": "not_defined",
          "liability_allocation_details": "Данные не определены",
          "liability_mode_display": "Распределение ответственности не урегулировано",
          "incident_notice_status": "not_defined",
          "incident_notice_details": "Данные не определены",
          "evidence": []
        }
        Пример 4 — текст есть, но надёжный вывод сделать нельзя
        (ответственность через «внутренние документы Банка» без конкретики):
        Фрагмент:
        "ДБО осуществляется через мобильное приложение Банка. Порядок
        аутентификации и распределение ответственности определяются
        внутренними документами Банка. Клиент обязан сообщать Банку
        об инцидентах в порядке, установленном Банком."
        Ответ:
        {
          "dbs_terms_status": "defined",
          "dbs_terms_details": "ДБО осуществляется через мобильное приложение Банка",
          "authentication_status": "not_defined",
          "authentication_details": "Не удалось определить",
          "liability_allocation_status": "not_defined",
          "liability_allocation_details": "Не удалось определить",
          "liability_mode_display": "Не удалось определить",
          "incident_notice_status": "defined",
          "incident_notice_details": "Не удалось определить",
          "evidence": [
            {
              "clause_ref": "п. 7.1",
              "quote": "ДБО осуществляется через мобильное приложение Банка."
            },
            {
              "clause_ref": "п. 7.2",
              "quote": "Порядок аутентификации и распределение ответственности определяются внутренними документами Банка."
            }
          ]
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату об условиях ДБО.
        2. Найди прямую цитату об аутентификации.
        3. Найди прямую цитату о распределении ответственности.
        4. Найди прямую цитату об уведомлении об инцидентах.
        5. Определи режим: механика раскрыта в договоре / только отсылка
          к внутренним документам банка / ДБО не урегулировано.
        6. Разграничь «данных нет» (Данные не определены) и «данные есть,
          но вывод неоднозначен» (Не удалось определить). Не подставляй
          161-ФЗ вместо текста договора.
        Не выводи шаги проверки — сформируй итоговый ответ согласно [ФОРМАТ ОТВЕТА].

        [ФОРМАТ ОТВЕТА]

        Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей.

        НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON,

        пригодным для парсинга через json.loads без предварительной обработки.
        Ответь РОВНО одним JSON-объектом без какого-либо дополнительного
        текста до или после, со всеми 9 ключами полей (evidence — служебный
        массив цитат, не относящийся к схеме полей):
        {
          "dbs_terms_status": "<defined / not_defined>",
          "dbs_terms_details": "<текст / 'Данные не определены' / 'Не удалось определить'>",
          "authentication_status": "<defined / not_defined>",
          "authentication_details": "<текст / 'Данные не определены' / 'Не удалось определить'>",
          "liability_allocation_status": "<defined / not_defined>",
          "liability_allocation_details": "<текст / 'Данные не определены' / 'Не удалось определить'>",
          "liability_mode_display": "<Ответственность распределена (банк — за сбои, клиент — за средства доступа) / Ответственность на клиенте за средства доступа / Ответственность на банке / Распределение ответственности не урегулировано / Не удалось определить>",
          "incident_notice_status": "<defined / not_defined>",
          "incident_notice_details": "<текст / 'Данные не определены' / 'Не удалось определить'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 8
      temperature: 0.0
      max_tokens: 600

    retrieval:
      retrieval_profile: "cybersecurity_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "ДБО дистанционное банковское обслуживание интернет-банк мобильное приложение аутентификация электронная подпись несанкционированный доступ компрометация средства доступа"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - procedures
      negative_keywords:
        - "процентная ставка"
        - "тариф"
        - "комиссия"
        - "овердрафт"
        - "115-ФЗ"
        - "безакцептное"
        - "страхование"
        - "закрытие счета"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.35, 0.80]
        boost: 0.15
        scope: segment
      context_k: 8
      max_chunks: 10
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "obligations"
        - "procedures"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.12

    evidence:
      required: true
      min_snippet_length: 35
      max_snippet_length: 550

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1050
      compact_output: false

      presence_signal:
        field: "dbs_security_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора банковского счёта
        условия ДБО: канал обслуживания, механизм аутентификации,
        распределение ответственности за инциденты и порядок уведомления
        о компрометации; сформируй читаемый вывод о режиме ответственности.
        Не анализируй проценты, тарифы, AML или страхование.
        Не подставляй нормы 161-ФЗ вместо текста договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. dbs_security_check_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (dbs_terms_status, authentication_status,
              liability_allocation_status, incident_notice_status) ≠ "not_defined";
           - "missing" — если все четыре содержательных поля = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - dbs_terms_status = "not_defined";
           - authentication_status = "not_defined";
           - liability_allocation_status = "not_defined";
           - incident_notice_status = "not_defined";
           - dbs_terms_details, authentication_details,
             liability_allocation_details, incident_notice_details = "Данные не определены";
           - liability_mode_display = "Распределение ответственности не урегулировано";
           - не выполняй остальные шаги.

        1. dbs_terms_status:
           - "defined" — если в договоре есть хотя бы одно условие о ДБО (канал, доступ, приложение, интернет-банк);
           - "not_defined" — если условия ДБО в договоре отсутствуют.

        2. dbs_terms_details:
           Краткая формулировка об условиях ДБО.
           Если данных нет — "Данные не определены";
           если фрагмент неоднозначен — "Не удалось определить".

        3. authentication_status:
           - "defined" — если механизм аутентификации прямо указан (одноразовый пароль, ЭП, биометрия и т. п.);
           - "not_defined" — если механизм аутентификации прямо не указан.

        4. authentication_details:
           Формулировка о механизме аутентификации.
           Если данных нет — "Данные не определены";
           если фрагмент неоднозначен — "Не удалось определить".

        5. liability_allocation_status:
           - "defined" — если распределение ответственности за инциденты прямо указано;
           - "not_defined" — если распределение ответственности прямо не указано.

        6. liability_allocation_details:
           Формулировка о распределении ответственности.
           Если данных нет — "Данные не определены";
           если фрагмент неоднозначен — "Не удалось определить".

        7. liability_mode_display:
           Читаемый вывод о режиме ответственности для DD Grid. Строго по правилам:
           - "Ответственность распределена (банк — за сбои, клиент — за средства доступа)" — если в договоре явно разделены зоны ответственности банка и клиента;
           - "Ответственность на клиенте за средства доступа" — если договор возлагает ответственность за инциденты на клиента без явных исключений для банка;
           - "Ответственность на банке" — если договор явно возлагает ответственность за инциденты на банк;
           - "Распределение ответственности не урегулировано" — если тема распределения ответственности в договоре не упомянута;
           - "Не удалось определить" — если формулировка есть, но вывод сделать нельзя.

        8. incident_notice_status:
           - "defined" — если правило и/или срок уведомления об инцидентах / компрометации прямо указаны;
           - "not_defined" — если правило и/или срок уведомления прямо не указаны.

        9. incident_notice_details:
           Формулировка о порядке уведомления (в т. ч. срок).
           Если данных нет — "Данные не определены";
           если фрагмент неоднозначен — "Не удалось определить".

        10. evidence:
            Массив объектов [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}].
            Включай только прямые цитаты из договора. Если прямых цитат нет — пустой массив.
        </task>

        <context_rules>
        - Перед остальными полями заполни dbs_security_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined", все *_details = "Данные не определены", liability_mode_display = "Распределение ответственности не урегулировано".
        - Используй только текст договора.
        - Не подставляй нормы 161-ФЗ вместо текста договора.
          Отсутствие условия в договоре — это not_defined, а не «по закону риск на банке».
        - Не додумывай механизм аутентификации, распределение ответственности или срок уведомления, если они не зафиксированы прямо.
        - dbs_terms_status = "defined" и для случая, когда договор содержит только общую фразу о предоставлении доступа к интернет-банку / мобильному приложению.
        - liability_mode_display = "Ответственность распределена (банк — за сбои, клиент — за средства доступа)" только если в договоре явно разделены зоны ответственности (например, банк — за технические сбои, клиент — за сохранность ключей / паролей).
        - Если в договоре ответственность возлагается только на клиента без упоминания зоны банка — liability_mode_display = "Ответственность на клиенте за средства доступа".
        - Если в договоре сказано «в порядке, установленном внутренними документами Банка» без конкретного порядка и/или срока — incident_notice_status = "defined", incident_notice_details = "Не удалось определить".
        - Не используй "None", "null", пустые строки.
        - Все текстовые значения пиши на русском языке, кроме служебных enum-значений status-полей.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни одного условия о ДБО (канал, доступ, приложение, интернет-банк).
           → presence = "missing";
             все *_status = "not_defined";
             все *_details = "Данные не определены";
             liability_mode_display = "Распределение ответственности не урегулировано".

        2. Неполное раскрытие темы (только общее упоминание ДБО).
           "Банк предоставляет клиенту доступ к интернет-банку" без указания
           механизма аутентификации и распределения ответственности.
           → presence = "present";
             dbs_terms_status = "defined";
             authentication_status = "not_defined";
             liability_allocation_status = "not_defined".

        3. Противоречие между фрагментами.
           В разных частях договора указаны противоречивые условия распределения
           ответственности, и конфликт нельзя разрешить по тексту.
           → presence = "unclear";
             соответствующий *_status = "not_defined";
             соответствующий *_details = "Не удалось определить";
             liability_mode_display = "Не удалось определить".

        4. Специфика темы: механизм через «внутренние документы Банка».
           "Порядок аутентификации и распределение ответственности определяются
           внутренними документами Банка."
           → presence = "present";
             authentication_status = "not_defined";
             liability_allocation_status = "not_defined";
             authentication_details = "Не удалось определить";
             liability_allocation_details = "Не удалось определить";
             liability_mode_display = "Не удалось определить".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для dbs_security_check_presence используй только: "present", "missing", "unclear".
        - Для status-полей используй только: "defined" или "not_defined".
        - Для liability_mode_display используй только значения из allowed_values, без свободных формулировок.
        - Fallback при отсутствии данных:
          * dbs_terms_details, authentication_details, liability_allocation_details, incident_notice_details → "Данные не определены";
          * liability_mode_display → "Распределение ответственности не урегулировано".
        - Fallback при противоречии или неоднозначности:
          * все *_details → "Не удалось определить";
          * liability_mode_display → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "dbs_security_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования по безопасности ДБО. Внутреннее агрегатное signal-поле."
          required: true

        - name: "dbs_terms_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус условий ДБО."
          required: true
          display_in_grid: false

        - name: "dbs_terms_details"
          type: "string"
          presentation: "fact"
          label: "Условия ДБО"
          description: "Канал дистанционного обслуживания (интернет-банк, мобильное приложение)."
          required: true
          display_in_grid: true
          display_priority: 1

        - name: "authentication_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус механизма аутентификации."
          required: true
          display_in_grid: false

        - name: "authentication_details"
          type: "string"
          presentation: "fact"
          label: "Аутентификация"
          description: "Механизм аутентификации (одноразовые пароли, ЭП, биометрия и т. п.)."
          required: true
          display_in_grid: true
          display_priority: 2

        - name: "liability_allocation_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус распределения ответственности за инциденты."
          required: true
          display_in_grid: false

        - name: "liability_allocation_details"
          label: "Распределение ответственности при компрометации ДБО"
          type: "string"
          presentation: "fact"
          description: "Формулировка о распределении ответственности (внутреннее поле для формирования _display)."
          required: true
          display_in_grid: false

        - name: "liability_mode_display"
          type: "string"
          presentation: "fact"
          label: "Ответственность за инциденты"
          allowed_values:
            - "Ответственность распределена (банк — за сбои, клиент — за средства доступа)"
            - "Ответственность на клиенте за средства доступа"
            - "Ответственность на банке"
            - "Распределение ответственности не урегулировано"
            - "Не удалось определить"
          description: "Читаемый вывод о режиме ответственности за инциденты в ДБО."
          required: true
          display_in_grid: true
          display_priority: 3

        - name: "incident_notice_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          description: "Статус правила уведомления об инцидентах."
          required: true
          display_in_grid: false

        - name: "incident_notice_details"
          type: "string"
          presentation: "fact"
          label: "Уведомление об инцидентах"
          description: "Порядок и срок уведомления банка о компрометации / несанкционированном доступе."
          required: true
          display_in_grid: true
          display_priority: 4

      store_payload: true

  - id: overdraft_terms_check
    name: "Овердрафт: лимит, проценты, срок погашения (ст. 850 ГК РФ)"
    description: >
      Фактографическая проверка условий овердрафта: лимит, проценты,
      срок и порядок погашения, основания прекращения лимита. Овердрафт —
      кредитование банком счёта клиента при недостаточности средств
      (ст. 850 ГК РФ). Для клиента deal-relevant: раскрыт ли лимит
      и проценты конкретно, каков срок погашения и может ли банк
      прекратить лимит в одностороннем порядке.
    triggers:
      any: ["overdraft_present"]
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "овердрафт"
        - "кредитование счета"
        - "лимит овердрафта"
        - "проценты за овердрафт"
        - "срок погашения"
        - "дебетовое сальдо"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)овердрафт|кредитовани[ея]\\s+сч"
        - "(?i)лимит\\s+овердрафт"
        - "(?i)процент(ы|ная\\s+ставка).{0,30}овердрафт"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор банковского счёта с овердрафтом (ст. 850 ГК РФ).
        Проверяется только один вопрос: условия овердрафта — лимит, проценты,
        срок и порядок погашения, основания прекращения лимита.
        Нормативный ориентир:
        - ст. 850 ГК РФ — кредитование банком счёта клиента при недостаточности
          средств; осуществляется на условиях, предусмотренных договором.
        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора.
        - Не оценивай серьёзность риска.
        - Не подставляй нормы ст. 850 ГК РФ вместо текста договора: если
          условие в договоре не зафиксировано — это not_defined.
        - Различай состояния: условия овердрафта раскрыты конкретно
          (лимит, проценты, срок); договор только упоминает овердрафт
          без конкретных условий; овердрафт в договоре не упомянут.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Есть ли лимит овердрафта и его размер.
        2. Есть ли проценты за овердрафт и их размер.
        3. Есть ли срок и/или порядок погашения.
        4. Есть ли основания прекращения лимита.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не путай «данные отсутствуют» и «данные есть, но вывод
          неоднозначен»:
          - если в тексте нет сведений — статус "not_defined", значение
            "Данные не определены";
          - если фрагмент есть, но из него нельзя сделать надёжный вывод —
            значение "Не удалось определить".
        3. Не используй "None", "null", пустые строки.
        4. В evidence включай только точные цитаты из договора.
        5. Не додумывай лимит, проценты, срок или основания прекращения,
          если они не зафиксированы прямо.

        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1 — условия овердрафта раскрыты конкретно:
        Фрагмент:
        "Лимит овердрафта — 500 000 рублей. Процентная ставка за пользование
        овердрафтом — 20% годовых. Погашение овердрафта — не позднее 30 дней
        с даты возникновения дебетового сальдо. Банк вправе прекратить лимит
        при просрочке погашения свыше 10 дней."
        Ответ:
        {
          "overdraft_limit_status": "defined",
          "overdraft_limit_details": "500 000 рублей",
          "overdraft_interest_status": "defined",
          "overdraft_interest_details": "20% годовых",
          "repayment_status": "defined",
          "repayment_details": "не позднее 30 дней с даты возникновения дебетового сальдо",
          "termination_grounds_status": "defined",
          "termination_grounds_details": "просрочка погашения свыше 10 дней",
          "overdraft_mode_display": "Условия овердрафта раскрыты",
          "evidence": [
            {
              "clause_ref": "п. 8.1",
              "quote": "Лимит овердрафта — 500 000 рублей. Процентная ставка за пользование овердрафтом — 20% годовых."
            },
            {
              "clause_ref": "п. 8.2",
              "quote": "Погашение овердрафта — не позднее 30 дней с даты возникновения дебетового сальдо."
            }
          ]
        }
        Пример 2 — только общее упоминание овердрафта без условий:
        Фрагмент:
        "Банк предоставляет овердрафт по счёту."
        Ответ:
        {
          "overdraft_limit_status": "not_defined",
          "overdraft_limit_details": "Данные не определены",
          "overdraft_interest_status": "not_defined",
          "overdraft_interest_details": "Данные не определены",
          "repayment_status": "not_defined",
          "repayment_details": "Данные не определены",
          "termination_grounds_status": "not_defined",
          "termination_grounds_details": "Данные не определены",
          "overdraft_mode_display": "Только отсылка к овердрафту без условий",
          "evidence": [
            {
              "clause_ref": "п. 8.1",
              "quote": "Банк предоставляет овердрафт по счёту."
            }
          ]
        }
        Пример 3 — овердрафт в договоре не упомянут:
        Фрагмент:
        "Банк выполняет распоряжения Клиента о перечислении и выдаче
        денежных средств со счёта."
        Ответ:
        {
          "overdraft_limit_status": "not_defined",
          "overdraft_limit_details": "Данные не определены",
          "overdraft_interest_status": "not_defined",
          "overdraft_interest_details": "Данные не определены",
          "repayment_status": "not_defined",
          "repayment_details": "Данные не определены",
          "termination_grounds_status": "not_defined",
          "termination_grounds_details": "Данные не определены",
          "overdraft_mode_display": "Овердрафт в договоре не упомянут",
          "evidence": []
        }
        Пример 4 — текст есть, но надёжный вывод сделать нельзя
        (условия через «внутренние документы Банка» без конкретики):
        Фрагмент:
        "Банк вправе кредитовать счёт Клиента в порядке и на условиях,
        установленных внутренними документами Банка. Проценты начисляются
        по ставке, определяемой Банком."
        Ответ:
        {
          "overdraft_limit_status": "not_defined",
          "overdraft_limit_details": "Не удалось определить",
          "overdraft_interest_status": "not_defined",
          "overdraft_interest_details": "Не удалось определить",
          "repayment_status": "not_defined",
          "repayment_details": "Данные не определены",
          "termination_grounds_status": "not_defined",
          "termination_grounds_details": "Данные не определены",
          "overdraft_mode_display": "Только отсылка к овердрафту без условий",
          "evidence": [
            {
              "clause_ref": "п. 8.1",
              "quote": "Банк вправе кредитовать счёт Клиента в порядке и на условиях, установленных внутренними документами Банка."
            }
          ]
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о лимите овердрафта.
        2. Найди прямую цитату о процентах за овердрафт.
        3. Найди прямую цитату о сроке / порядке погашения.
        4. Найди прямую цитату об основаниях прекращения лимита.
        5. Определи режим: условия раскрыты / только отсылка без условий /
          овердрафт не упомянут.
        6. Разграничь «данных нет» (Данные не определены) и «данные есть,
          но вывод неоднозначен» (Не удалось определить). Не подставляй
          ст. 850 ГК РФ вместо текста договора.
        Не выводи шаги проверки — сформируй итоговый ответ согласно [ФОРМАТ ОТВЕТА].

        [ФОРМАТ ОТВЕТА]

        Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей.

        НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON,

        пригодным для парсинга через json.loads без предварительной обработки.
        Ответь РОВНО одним JSON-объектом без какого-либо дополнительного
        текста до или после, со всеми 9 ключами полей (evidence — служебный
        массив цитат, не относящийся к схеме полей):
        {
          "overdraft_limit_status": "<defined / not_defined>",
          "overdraft_limit_details": "<текст / 'Данные не определены' / 'Не удалось определить'>",
          "overdraft_interest_status": "<defined / not_defined>",
          "overdraft_interest_details": "<текст / 'Данные не определены' / 'Не удалось определить'>",
          "repayment_status": "<defined / not_defined>",
          "repayment_details": "<текст / 'Данные не определены' / 'Не удалось определить'>",
          "termination_grounds_status": "<defined / not_defined>",
          "termination_grounds_details": "<текст / 'Данные не определены' / 'Не удалось определить'>",
          "overdraft_mode_display": "<Условия овердрафта раскрыты / Только отсылка к овердрафту без условий / Овердрафт в договоре не упомянут / Не удалось определить>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 8
      temperature: 0.0
      max_tokens: 600

    retrieval:
      retrieval_profile: "credit_facility_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "овердрафт кредитование счета лимит овердрафта проценты за овердрафт срок погашения дебетовое сальдо"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - definitions
      negative_keywords:
        - "процентная ставка по вкладу"
        - "тариф"
        - "комиссия"
        - "115-ФЗ"
        - "безакцептное"
        - "ДБО"
        - "страхование"
        - "закрытие счета"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.30, 0.75]
        boost: 0.15
        scope: segment
      context_k: 8
      max_chunks: 10
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "obligations"
        - "definitions"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.12

    evidence:
      required: true
      min_snippet_length: 35
      max_snippet_length: 550

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1050
      compact_output: false

      presence_signal:
        field: "overdraft_terms_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора банковского счёта
        условия овердрафта: лимит, проценты, срок и порядок погашения,
        основания прекращения лимита, и сформируй читаемый вывод о раскрытии
        условий.
        Не анализируй тарифы, AML, ДБО или страхование.
        Не подставляй нормы ст. 850 ГК РФ вместо текста договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. overdraft_terms_check_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (overdraft_limit_status, overdraft_interest_status,
              repayment_status, termination_grounds_status) ≠ "not_defined";
           - "missing" — если все четыре содержательных поля = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - overdraft_limit_status = "not_defined";
           - overdraft_interest_status = "not_defined";
           - repayment_status = "not_defined";
           - termination_grounds_status = "not_defined";
           - overdraft_limit_details, overdraft_interest_details,
             repayment_details, termination_grounds_details = "Данные не определены";
           - overdraft_mode_display = "Овердрафт в договоре не упомянут";
           - не выполняй остальные шаги.

        1. overdraft_limit_status:
           - "defined" — если лимит овердрафта прямо указан (конкретной суммой или через приложение);
           - "not_defined" — если лимит прямо не указан.

        2. overdraft_limit_details:
           Размер лимита овердрафта.
           Если данных нет — "Данные не определены";
           если фрагмент неоднозначен — "Не удалось определить".

        3. overdraft_interest_status:
           - "defined" — если проценты за овердрафт прямо указаны (ставкой, формулой или через приложение);
           - "not_defined" — если проценты прямо не указаны.

        4. overdraft_interest_details:
           Размер процентов за овердрафт.
           Если данных нет — "Данные не определены";
           если фрагмент неоднозначен — "Не удалось определить".

        5. repayment_status:
           - "defined" — если срок и/или порядок погашения овердрафта прямо указаны;
           - "not_defined" — если срок и/или порядок погашения прямо не указаны.

        6. repayment_details:
           Формулировка о сроке / порядке погашения.
           Если данных нет — "Данные не определены";
           если фрагмент неоднозначен — "Не удалось определить".

        7. termination_grounds_status:
           - "defined" — если основания прекращения лимита овердрафта прямо указаны;
           - "not_defined" — если основания прекращения прямо не указаны.

        8. termination_grounds_details:
           Формулировка об основаниях прекращения лимита.
           Если данных нет — "Данные не определены";
           если фрагмент неоднозначен — "Не удалось определить".

        9. overdraft_mode_display:
           Читаемый вывод о раскрытии условий овердрафта для DD Grid. Строго по правилам:
           - "Условия овердрафта раскрыты" — если в договоре прямо указаны хотя бы два из трёх ключевых условий: лимит, проценты, срок погашения;
           - "Только отсылка к овердрафту без условий" — если овердрафт упомянут, но конкретные условия не раскрыты, либо указано менее двух из трёх;
           - "Овердрафт в договоре не упомянут" — если в договоре нет ни одного упоминания об овердрафте;
           - "Не удалось определить" — если формулировка есть, но вывод сделать нельзя.

        10. evidence:
            Массив объектов [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}].
            Включай только прямые цитаты из договора. Если прямых цитат нет — пустой массив.
        </task>

        <context_rules>
        - Перед остальными полями заполни overdraft_terms_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined", все *_details = "Данные не определены", overdraft_mode_display = "Овердрафт в договоре не упомянут".
        - Используй только текст договора.
        - Не подставляй нормы ст. 850 ГК РФ вместо текста договора.
          Отсутствие условия в договоре — это not_defined.
        - Не додумывай лимит, проценты, срок или основания прекращения, если они не зафиксированы прямо.
        - overdraft_limit_status = "defined" только если лимит указан конкретной суммой или через конкретное приложение.
        - Если лимит/проценты определяются «в порядке, установленном внутренними документами Банка» или «по ставке, определяемой Банком» без конкретных цифр — соответствующий status = "not_defined", details = "Не удалось определить".
        - overdraft_mode_display = "Условия овердрафта раскрыты" только если в договоре конкретно указаны минимум два из трёх условий: лимит, проценты, срок погашения.
        - Не используй "None", "null", пустые строки.
        - Все текстовые значения пиши на русском языке, кроме служебных enum-значений status-полей.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни одного упоминания об овердрафте.
           → presence = "missing";
             все *_status = "not_defined";
             все *_details = "Данные не определены";
             overdraft_mode_display = "Овердрафт в договоре не упомянут".

        2. Неполное раскрытие темы (только отсылка к овердрафту без условий).
           "Банк предоставляет овердрафт по счёту" без указания лимита, процентов и срока.
           → presence = "present";
             overdraft_mode_display = "Только отсылка к овердрафту без условий";
             соответствующие *_status = "not_defined".

        3. Противоречие между фрагментами.
           В разных частях договора указаны противоречивые условия овердрафта
           (например, разные лимиты или сроки), и конфликт нельзя разрешить по тексту.
           → presence = "unclear";
             соответствующий *_status = "not_defined";
             соответствующий *_details = "Не удалось определить";
             overdraft_mode_display = "Не удалось определить".

        4. Специфика темы: условия через «внутренние документы Банка» без конкретики.
           "Банк вправе кредитовать счёт Клиента в порядке и на условиях,
           установленных внутренними документами Банка."
           → presence = "present";
             соответствующие *_status = "not_defined";
             соответствующие *_details = "Не удалось определить";
             overdraft_mode_display = "Только отсылка к овердрафту без условий".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для overdraft_terms_check_presence используй только: "present", "missing", "unclear".
        - Для status-полей используй только: "defined" или "not_defined".
        - Для overdraft_mode_display используй только значения из allowed_values, без свободных формулировок.
        - Fallback при отсутствии данных:
          * overdraft_limit_details, overdraft_interest_details, repayment_details, termination_grounds_details → "Данные не определены";
          * overdraft_mode_display → "Овердрафт в договоре не упомянут".
        - Fallback при противоречии или неоднозначности:
          * все *_details → "Не удалось определить";
          * overdraft_mode_display → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "overdraft_terms_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования по условиям овердрафта. Внутреннее агрегатное signal-поле."
          required: true

        - name: "overdraft_limit_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус лимита овердрафта."
          required: true
          display_in_grid: false

        - name: "overdraft_limit_details"
          type: "string"
          presentation: "fact"
          label: "Лимит овердрафта"
          description: "Размер лимита овердрафта."
          required: true
          display_in_grid: true
          display_priority: 1

        - name: "overdraft_interest_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          description: "Статус процентов за овердрафт."
          required: true
          display_in_grid: false

        - name: "overdraft_interest_details"
          type: "string"
          presentation: "fact"
          label: "Проценты за овердрафт"
          description: "Размер процентов за пользование овердрафтом."
          required: true
          display_in_grid: true
          display_priority: 2

        - name: "repayment_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
