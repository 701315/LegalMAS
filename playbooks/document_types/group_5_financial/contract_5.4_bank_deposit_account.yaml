          "capitalization_details": "Данные не определены",
          "rate_change_right_status": "not_defined",
          "rate_change_right_details": "Данные не определены",
          "evidence": [
            {
              "clause_ref": "п. 2.1",
              "quote": "Банк начисляет проценты в порядке, установленном тарифами."
            }
          ]
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о процентной ставке.
        2. Найди прямую цитату о порядке начисления.
        3. Найди прямую цитату о капитализации.
        4. Найди прямую цитату о праве изменения ставки.
        5. Если прямой цитаты нет — верни "not_defined".
        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "interest_rate_status": "<defined / not_defined>",
          "interest_rate_value": "<текст или 'Данные не определены'>",
          "accrual_procedure_status": "<defined / not_defined>",
          "accrual_procedure_details": "<текст или 'Данные не определены'>",
          "capitalization_status": "<defined / not_defined>",
          "capitalization_details": "<текст или 'Данные не определены'>",
          "rate_change_right_status": "<defined / not_defined>",
          "rate_change_right_details": "<текст или 'Данные не определены'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 650
      retrieval:
        retrieval_profile: "interest_rate_check"
        corpus_scope: "primary_segment"
        levels:
          - "legal_unit"
