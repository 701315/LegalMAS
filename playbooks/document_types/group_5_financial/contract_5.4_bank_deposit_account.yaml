          display_in_grid: true
          display_priority: 3

        - name: "client_type"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["legal_entity", "individual_entrepreneur", "individual", "not_defined"]
          description: "Тип клиента / вкладчика (внутренний enum)."
