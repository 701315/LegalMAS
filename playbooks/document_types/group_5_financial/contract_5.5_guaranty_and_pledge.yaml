      - "(?i)повторн[ыо]й\\s+залог"
      - "(?i)следующ[иоя]+\\s+залогодержател[ья]"

  secured_real_estate:
    any_keywords:
      - "(?i)\\bквартир[аеиу]\\b"
      - "(?i)\\bздани[ея]\\b"
      - "(?i)\\bпомещени[ея]\\b"
      - "(?i)земельн[а-яё]+\\s+участ[оа]к"
      - "(?i)объект\\s+недвижимост[ии]"

  share_pledge:
    any_keywords:
      - "(?i)залог\\s+дол[ии]"
      - "(?i)дол[яьи]\\s+в\\s+уставн[оа]м\\s+капитал[ее]"
      - "(?i)залог\\s+дол[ии]\\s+в\\s+ООО"
      - "(?i)нотариальн[а-яё]+\\s+удостоверени[ея]\\s+залог[аа]\\s+дол[ии]"
      - "(?i)\\bЕГРЮЛ\\b"

  consumer_guaranty_pledge:
    any_keywords:
      - "(?i)физическ[оеая]\\s+лиц[оо]"
      - "(?i)\\bгражданин\\b"
      - "(?i)единственн[оа]е\\s+жиль[ёе]"
      - "(?i)ипотечн[ыо]й\\s+кредит"
      - "(?i)потребительск[иоя]+\\s+кредит"
      - "(?i)\\bпаспорт\\b"

# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 3: SHARED PATTERNS
#  Читается: DocTypeCheckLoader через _resolve_yaml_templates()
# ════════════════════════════════════════════════════════════════════════════

shared_patterns:
  money_amount: "(?i)\\b\\d[\\d\\s]*(?:руб|рублей|₽|коп|тыс|млн|млрд)"
  percentage_pattern: "(?i)\\b\\d+(?:[.,]\\d+)?\\s*%\\b"
  date_pattern: "(?i)\\b\\d{1,2}[.]\\d{1,2}[.]\\d{4}\\b"
  cadastral_number: "(?i)\\b\\d{2}:\\d{2}:\\d{6,7}:\\d+\\b"
  registration_number: "(?i)(?:№|N|No\\.)\\s*[A-ZА-Я0-9\\-\\/]+"

compliance_rules: []

# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 4: CHECKS_V8 — единственный рабочий слой юридического анализа
#  Читается: DocTypeCheckLoader._load_doc_type_checks()
# ════════════════════════════════════════════════════════════════════════════

checks_v8:

  - id: security_subject_extraction
    name: "Базовое извлечение параметров поручительства/залога"
    description: >
      Извлекает тип обеспечительного договора, стороны, обеспечиваемое
      обязательство, объем ответственности или предмет залога.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "поручительство"
        - "поручитель"
        - "залог"
        - "залогодатель"
        - "залогодержатель"
        - "основное обязательство"
        - "предмет залога"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)(поручительств|поручитель|залогодатель|залогодержатель|предмет\\s+залога)"
        - "(?i)(обеспечиваем(ое|ого)\\s+обязательств|основн(ое|ого)\\s+обязательств)"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется обеспечительный договор (поручительство или залог)
        по Главе 23 ГК РФ.
        Проверяется только один вопрос: ключевые параметры обеспечительной сделки.

        Нормативный ориентир:
        - ст. 329 ГК РФ — способы обеспечения обязательств
        - ст. 334 ГК РФ — залог
        - ст. 334.1 ГК РФ — ипотека (залог недвижимости)
        - ст. 361 ГК РФ — поручительство
        - ст. 363 ГК РФ — ответственность поручителя

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора,
          а чего прямо нет.
        - Не оценивай серьёзность риска.
        - Если параметр определяется основным договором, спецификацией,
          приложением, отдельным соглашением или иным названным документом —
          это валидный исход, а не отсутствие данных. Отражай это текстом,
          например "Определяется Основным договором № 5 от 01.02.2026".

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Тип обеспечения (поручительство / залог / ипотека).
        2. Кредитор (залогодержатель).
        3. Должник по основному обязательству.
        4. Поручитель или залогодатель.
        5. Ссылка на основное обязательство.
        6. Сумма обеспечиваемого обязательства.
        7. Объем ответственности или предмет залога.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Если данные не указаны прямо — текстовое поле = "not_defined".
        4. Не используй "None", "null" и пустые строки.
        5. В evidence включай только текст договора.
        6. Все 8 ключей должны присутствовать в JSON-ответе.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — поручительство:
        Фрагмент:
        "Поручитель обязуется отвечать перед Кредитором за исполнение ООО «Альфа» обязательств по кредитному договору № 123 от 01.01.2026 на сумму 10 000 000 рублей. Ответственность — солидарная."

        Ответ:
        {
          "security_type": "guaranty",
          "security_type_display": "Поручительство",
          "creditor": "Кредитор",
          "principal_debtor": "ООО «Альфа»",
          "guarantor_or_pledgor": "Поручитель",
          "secured_obligation_reference": "кредитный договор № 123 от 01.01.2026",
          "secured_amount": "10 000 000 рублей",
          "liability_or_collateral_scope": "Солидарная ответственность"
        }

        Пример 2 — залог:
        Фрагмент:
        "Залогодатель передает в залог автомобиль для обеспечения обязательств по договору поставки."

        Ответ:
        {
          "security_type": "pledge",
          "security_type_display": "Залог",
          "creditor": "not_defined",
          "principal_debtor": "not_defined",
          "guarantor_or_pledgor": "Залогодатель",
          "secured_obligation_reference": "договор поставки",
          "secured_amount": "not_defined",
          "liability_or_collateral_scope": "Автомобиль"
        }

        Пример 3 — сумма определяется основным договором (валидный исход, не отсутствие данных):
        Фрагмент:
        "Поручитель отвечает перед Кредитором за исполнение Должником обязательств по Кредитному договору № 47 от 12.03.2026 в пределах суммы основного обязательства, определенной указанным Кредитным договором."

        Ответ:
        {
          "security_type": "guaranty",
          "security_type_display": "Поручительство",
          "creditor": "Кредитор",
          "principal_debtor": "Должник",
          "guarantor_or_pledgor": "Поручитель",
          "secured_obligation_reference": "Кредитный договор № 47 от 12.03.2026",
          "secured_amount": "Определяется Кредитным договором № 47 от 12.03.2026",
          "liability_or_collateral_scope": "Ответственность в пределах суммы основного обязательства"
        }

        Пример 4 — текст есть, но надёжный вывод сделать нельзя (неоднозначная формулировка):
        Фрагмент:
        "Стороны согласовали обеспечение исполнения обязательств в форме, предусмотренной Основным договором. Конкретный способ обеспечения и его параметры определяются в отдельном соглашении сторон."

        Ответ:
        {
          "security_type": "unclear",
          "security_type_display": "Не удалось определить тип",
          "creditor": "not_defined",
          "principal_debtor": "not_defined",
          "guarantor_or_pledgor": "not_defined",
          "secured_obligation_reference": "Основной договор",
          "secured_amount": "not_defined",
          "liability_or_collateral_scope": "Не удалось определить"
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о типе обеспечения.
        2. Найди прямую цитату о кредиторе.
        3. Найди прямую цитату об основном обязательстве.
        4. Если прямой цитаты нет — верни "not_defined" (или "unclear" для типа,
          если в тексте явно есть противоречивые/неполные указания).

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь РОВНО одним JSON-объектом без какого-либо дополнительного текста до или после, со всеми 8 ключами:
        {
          "security_type": "<guaranty / pledge / mortgage / mixed / unclear / not_defined>",
          "security_type_display": "<Поручительство / Залог / Ипотека / Смешанное обеспечение / Не удалось определить тип / Не установлено>",
          "creditor": "<текст или not_defined>",
          "principal_debtor": "<текст или not_defined>",
          "guarantor_or_pledgor": "<текст или not_defined>",
          "secured_obligation_reference": "<текст или not_defined>",
          "secured_amount": "<текст, or not_defined, or Определяется <документ>>",
          "liability_or_collateral_scope": "<текст или not_defined>"
        }

        Верни РОВНО один JSON-объект со всеми 8 ключами без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.
      context_k: 8
      temperature: 0.0
      max_tokens: 900

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "поручительство залог ипотека кредитор залогодержатель должник основной должник поручитель залогодатель основное обязательство кредитный договор договор поставки сумма обеспечиваемого обязательства размер ответственности предмет залога"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - definitions
        - obligations
      negative_keywords:
        - "означает"
        - "в целях настоящего"
        - "приложение"
        - "индекс"
      position_bias:
        preferred_range: [0.0, 0.35]
        boost: 0.20
        scope: segment
      context_k: 8
      max_chunks: 12
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
        - "invoice"
      preferred_clause_functions:
        - "definitions"
        - "obligations"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 50
      max_snippet_length: 700

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1350
      compact_output: false

      presence_signal:
        field: "security_subject_extraction_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Твоя задача — извлечь из текста обеспечительного
        договора ключевые параметры: тип обеспечения, стороны, основное обязательство,
        сумму и объем ответственности или предмет залога.
        Не анализируй процедурные условия, регистрацию или последствия нарушения.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. security_subject_extraction_presence:
           Агрегатное signal-поле — наличие регулирования по теме обеспечения.
           - "present" — если хотя бы одно из содержательных полей
             (security_type, creditor, principal_debtor, guarantor_or_pledgor,
              secured_obligation_reference, secured_amount,
              liability_or_collateral_scope) ≠ "not_defined"
             и security_type ≠ "unclear";
           - "missing" — если все семь содержательных полей = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен, или security_type = "unclear".

           Если presence = "missing":
           - security_type = "not_defined";
           - security_type_display = "Не установлено";
           - creditor = "not_defined";
           - principal_debtor = "not_defined";
           - guarantor_or_pledgor = "not_defined";
           - secured_obligation_reference = "not_defined";
           - secured_amount = "not_defined";
           - liability_or_collateral_scope = "not_defined";
           - не выполняй остальные шаги.

        1. security_type — "guaranty" / "pledge" / "mortgage" / "mixed" / "unclear" / "not_defined".
        2. security_type_display — русскоязычное отображение типа:
          "Поручительство" / "Залог" / "Ипотека" / "Смешанное обеспечение" /
          "Не удалось определить тип" (при security_type = "unclear") /
          "Не установлено" (при security_type = "not_defined").
        3. creditor — кредитор или залогодержатель.
        4. principal_debtor — должник по основному обязательству.
        5. guarantor_or_pledgor — поручитель или залогодатель.
        6. secured_obligation_reference — ссылка на основное обязательство.
        7. secured_amount — сумма обеспечиваемого обязательства.
        8. liability_or_collateral_scope — объем ответственности или предмет залога.

        Все 8 ключей должны присутствовать в JSON-ответе.
        Если данные отсутствуют — текстовое поле = "not_defined"
        (для security_type_display — "Не установлено").
        </task>

        <context_rules>
        - Перед остальными полями заполни security_subject_extraction_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все содержательные поля = "not_defined", security_type_display = "Не установлено".
        - Используй только текст договора из <context>. Не подставляй нормы закона.
        - Не делай предположений и не достраивай отсутствующие реквизиты.
        - Если в <context> попали нерелевантные фрагменты — игнорируй их.
        - Если фрагменты противоречат друг другу и надёжный вывод сделать нельзя —
          верни "unclear" (для типа) / "not_defined" (для фактов) /
          "Не удалось определить" (для liability_or_collateral_scope).
        - Если параметр определяется основным договором, спецификацией, приложением,
          отдельным соглашением или иным названным документом — это валидный исход.
          Отражай это текстом, например "Определяется Основным договором № 5 от 01.02.2026".
        - Не используй "None", "null" и пустые строки.
        - Соблюдай точное соответствие имён ключей схеме полей.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни упоминания типа обеспечения, ни сторон, ни основного обязательства.
           → presence = "missing";
             security_type = "not_defined";
             security_type_display = "Не установлено";
             все факт-поля = "not_defined".

        2. Неполное раскрытие — только тип без деталей.
           Указан тип обеспечения (например, "договор поручительства"), но стороны,
           основное обязательство и сумма не конкретизированы.
           → presence = "present";
             security_type = "guaranty";
             остальные поля = "not_defined" по факту наличия/отсутствия.

        3. Противоречие между фрагментами.
           В разных частях договора указаны разные типы обеспечения или разные суммы.
           → presence = "unclear";
             security_type = "unclear";
             security_type_display = "Не удалось определить тип";
             противоречивые факт-поля = "Не удалось определить".

        4. Отсылка на внешний документ.
           Все параметры обеспечения определяются основным договором или отдельным соглашением.
           → presence = "present";
             security_type определяется по тексту (если назван);
             факт-поля содержат формулировки вида "Определяется Основным договором №...".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для security_subject_extraction_presence используй только: "present", "missing", "unclear".
        - Для security_type используй только: "guaranty", "pledge", "mortgage", "mixed", "unclear", "not_defined".
        - Fallback при отсутствии данных:
          * все факт-поля → "not_defined";
          * security_type_display → "Не установлено".
        - Fallback при противоречии или неоднозначности:
          * security_type → "unclear";
          * security_type_display → "Не удалось определить тип";
          * факт-поля → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "security_subject_extraction_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования по теме обеспечения. Внутреннее агрегатное signal-поле."
          required: true

        - name: "security_type"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["guaranty", "pledge", "mortgage", "mixed", "unclear", "not_defined"]
          description: "Тип обеспечительного договора (внутренний enum)."
          required: true
          display_in_grid: false
        - name: "security_type_display"
          type: "string"
          presentation: "fact"
          label: "Тип обеспечения"
          description: >
            Человекочитаемый тип обеспечительного договора. Fallback: "Не установлено" / "Не удалось определить".
          required: true
          display_in_grid: true
          display_priority: 1
        - name: "creditor"
          type: "string"
          presentation: "fact"
          label: "Кредитор / Залогодержатель"
          description: >
            Кредитор или залогодержатель. Fallback: "Не установлено" / "Не удалось определить".
          required: true
          display_in_grid: true
          display_priority: 2
        - name: "principal_debtor"
          type: "string"
          presentation: "fact"
          label: "Должник по основному обязательству"
          description: >
            Должник по основному обязательству. Fallback: "Не установлено" / "Не удалось определить".
          required: true
          display_in_grid: true
          display_priority: 3
        - name: "guarantor_or_pledgor"
          type: "string"
          presentation: "fact"
          label: "Поручитель / Залогодатель"
          description: >
            Поручитель или залогодатель. Fallback: "Не установлено" / "Не удалось определить".
          required: true
          display_in_grid: true
          display_priority: 4
        - name: "secured_obligation_reference"
          type: "string"
          presentation: "fact"
          label: "Основное обязательство"
          description: >
            Ссылка на основное обязательство. Fallback: "Не установлено" / "Не удалось определить".
          required: true
          display_in_grid: true
          display_priority: 5
        - name: "secured_amount"
          type: "string"
          presentation: "fact"
          label: "Сумма обеспечиваемого обязательства"
          description: >
            Сумма обеспечиваемого обязательства или ссылка на документ, которым она определяется. Fallback: "Не установлено" / "Не удалось определить".
          required: true
          display_in_grid: true
          display_priority: 6
        - name: "liability_or_collateral_scope"
          type: "string"
          presentation: "fact"
          label: "Объем ответственности / Предмет залога"
          description: >
            Объем ответственности поручителя или предмет залога. Fallback: "Не установлено" / "Не удалось определить".
          required: true
          display_in_grid: true
          display_priority: 7
      store_payload: true

  - id: guaranty_liability_scope_check
    name: "Поручительство: объем, вид ответственности и лимит"
    description: >
      Проверяет солидарный/субсидиарный характер ответственности, лимит суммы
      и охват процентов/неустойки.
    triggers:
      any:
        - guaranty_contract
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "солидарная ответственность"
        - "субсидиарная ответственность"
        - "в пределах суммы"
        - "максимальная сумма поручительства"
        - "проценты"
        - "неустойка"
        - "судебные расходы"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)солидарн(ая|ой)\\s+ответственност|субсидиарн(ая|ой)\\s+ответственност"
        - "(?i)максимальн(ая|ой)\\s+сумм[аы]\\s+поручительств"
        - "(?i)в\\s+пределах\\s+суммы"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор поручительства по § 5 Главы 23 ГК РФ.
        Проверяется только один вопрос: объем и вид ответственности поручителя.

        Нормативный ориентир:
        - ст. 363 п. 1 ГК РФ — солидарная ответственность поручителя по умолчанию
        - ст. 363 п. 2 ГК РФ — объем ответственности поручителя равен объему
          ответственности должника, включая проценты, неустойку, возмещение
          судебных издержек и иных убытков кредитора, если иное не предусмотрено
          договором поручительства

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора,
          а чего прямо нет.
        - Не оценивай серьёзность риска.
        - Если лимит определяется суммой основного обязательства или иным
          названным документом — это валидный исход, а не отсутствие данных.
          Отражай это текстом, например "В пределах суммы основного
          обязательства по Кредитному договору № 47 от 12.03.2026".
        - Если в тексте прямо не указан вид ответственности, но применима
          диспозитивная норма ст. 363 п. 1 ГК РФ (солидарная по умолчанию) —
          отражай фактическое состояние договора. Не подменяй текст договора
          нормой закона: если стороны прямо не назвали вид ответственности,
          в liability_type должно быть "not_defined", а не "solidary".

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Какой вид ответственности установлен (солидарная / субсидиарная).
        2. Есть ли лимит ответственности и какая сумма (или чем определяется).
        3. Что входит в объем ответственности (только основной долг или
          также проценты, неустойка, расходы).
        4. Насколько ясна формулировка оговорки об ответственности.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Если условие не указано прямо — текстовое поле = "not_defined",
          display-поле = "Не установлено".
        4. Если текст есть, но надёжный вывод сделать нельзя —
          для internal-полей = "unclear", для display-полей = "Не удалось определить".
        5. Не используй "None", "null" и пустые строки.
        6. Все 7 ключей должны присутствовать в JSON-ответе.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — солидарная с лимитом и полным покрытием:
        Фрагмент:
        "Поручитель несет солидарную ответственность с должником в пределах суммы 5 000 000 рублей, включая проценты и неустойку."

        Ответ:
        {
          "liability_type": "solidary",
          "liability_type_display": "Солидарная",
          "liability_cap_status": "present",
          "liability_cap_display": "5 000 000 рублей",
          "coverage_scope": "principal_plus_accessories",
          "coverage_scope_display": "Основной долг, проценты, неустойка",
          "liability_clause_clarity": "clear"
        }

        Пример 2 — субсидиарная, лимит определяется основным договором (валидный исход):
        Фрагмент:
        "Поручитель отвечает субсидиарно. Ответственность Поручителя ограничена суммой основного обязательства, определенной Кредитным договором № 47 от 12.03.2026."

        Ответ:
        {
          "liability_type": "subsidiary",
          "liability_type_display": "Субсидиарная",
          "liability_cap_status": "present",
          "liability_cap_display": "В пределах суммы основного обязательства по Кредитному договору № 47 от 12.03.2026",
          "coverage_scope": "not_defined",
          "coverage_scope_display": "Не установлено",
          "liability_clause_clarity": "clear"
        }

        Пример 3 — вид ответственности не назван прямо (диспозитивная норма применима, но договор не подтверждает):
        Фрагмент:
        "Поручитель обязуется отвечать перед Кредитором за исполнение Должником обязательств по Основному договору."

        Ответ:
        {
          "liability_type": "not_defined",
          "liability_type_display": "Не установлено",
          "liability_cap_status": "not_defined",
          "liability_cap_display": "Лимит не установлен",
          "coverage_scope": "not_defined",
          "coverage_scope_display": "Не установлено",
          "liability_clause_clarity": "unclear"
        }

        Пример 4 — текст есть, но надёжный вывод сделать нельзя (неоднозначная формулировка):
        Фрагмент:
        "Ответственность Поручителя определяется в соответствии с действующим законодательством Российской Федерации и условиями Основного договора."

        Ответ:
        {
          "liability_type": "unclear",
          "liability_type_display": "Не удалось определить",
          "liability_cap_status": "not_defined",
          "liability_cap_display": "Лимит не установлен",
          "coverage_scope": "unclear",
          "coverage_scope_display": "Не удалось определить",
          "liability_clause_clarity": "unclear"
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о виде ответственности.
        2. Найди прямую цитату о лимите ответственности.
        3. Найди прямую цитату о составе требований.
        4. Если прямой цитаты нет — верни "not_defined" (или "unclear",
          если в тексте есть противоречивые/неполные указания).

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь РОВНО одним JSON-объектом без какого-либо дополнительного текста до или после, со всеми 7 ключами:
        {
          "liability_type": "<solidary / subsidiary / unclear / not_defined>",
          "liability_type_display": "<Солидарная / Субсидиарная / Не удалось определить / Не установлено>",
          "liability_cap_status": "<present / not_defined>",
          "liability_cap_display": "<сумма / чем определяется / Лимит не установлен / Не удалось определить>",
          "coverage_scope": "<principal_only / principal_plus_accessories / unclear / not_defined>",
          "coverage_scope_display": "<Основной долг / Основной долг, проценты, неустойка, расходы / Не удалось определить / Не установлено>",
          "liability_clause_clarity": "<clear / unclear / not_defined>"
        }

        Верни РОВНО один JSON-объект со всеми 7 ключами без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.
      context_k: 8
      temperature: 0.0
      max_tokens: 550

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "солидарная субсидиарная ответственность поручителя максимальная сумма поручительства предел ответственности проценты неустойка судебные расходы основной долг объем ответственности"
      preferred_unit_types:
        - obligation
        - liability_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - limitations
      negative_keywords:
        - "означает"
        - "в целях настоящего"
        - "основное обязательство"
      position_bias:
        preferred_range: [0.15, 0.55]
        boost: 0.16
        scope: segment
      context_k: 8
      max_chunks: 10
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
        - "invoice"
      preferred_clause_functions:
        - "obligations"
        - "limitations"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 600

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 900
      compact_output: false

      presence_signal:
        field: "guaranty_liability_scope_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора поручительства
        сведения об объеме и виде ответственности поручителя.
        Не анализируй условия прекращения поручительства или суброгацию.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. guaranty_liability_scope_check_presence:
           Агрегатное signal-поле — наличие регулирования по теме ответственности поручителя.
           - "present" — если хотя бы одно из содержательных полей
             (liability_type, liability_cap_status, coverage_scope) ≠ "not_defined";
           - "missing" — если все три содержательных поля = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - liability_type = "not_defined";
           - liability_type_display = "Не установлено";
           - liability_cap_status = "not_defined";
           - liability_cap_display = "Лимит не установлен";
           - coverage_scope = "not_defined";
           - coverage_scope_display = "Не установлено";
           - liability_clause_clarity = "not_defined";
           - не выполняй остальные шаги.

        1. liability_type — "solidary" / "subsidiary" / "unclear" / "not_defined".
          Внутренний enum. Указывай значение только если вид ответственности
          прямо назван в тексте договора.

        2. liability_type_display — русскоязычное отображение:
          "Солидарная" / "Субсидиарная" / "Не удалось определить" (при unclear) /
          "Не установлено" (при not_defined).

        3. liability_cap_status — "present" / "not_defined".
          Внутренний признак наличия лимита.

        4. liability_cap_display — сумма лимита, или текстом чем определяется
          ("В пределах суммы основного обязательства по <документ>"), или
          "Лимит не установлен" (при not_defined), или "Не удалось определить"
          (при противоречивых формулировках).

        5. coverage_scope — "principal_only" / "principal_plus_accessories" /
          "unclear" / "not_defined".

        6. coverage_scope_display — "Основной долг" / "Основной долг, проценты,
          неустойка, расходы" / "Не удалось определить" / "Не установлено".

        7. liability_clause_clarity — "clear" / "unclear" / "not_defined".

        Все 7 ключей должны присутствовать в JSON-ответе.
        </task>

        <context_rules>
        - Перед остальными полями заполни guaranty_liability_scope_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status / *_type / *_scope = "not_defined", все *_display = соответствующий fallback, liability_clause_clarity = "not_defined".
        - Используй только текст договора из <context>. Не подставляй нормы закона.
        - Не делай предположений и не достраивай отсутствующие реквизиты.
        - Если в <context> попали нерелевантные фрагменты — игнорируй их.
        - Если фрагменты противоречат друг другу и надёжный вывод сделать нельзя —
          верни "unclear" для liability_type / coverage_scope,
          "not_defined" для liability_cap_status,
          "Не удалось определить" для соответствующих display-полей.
        - Если лимит определяется суммой основного обязательства, спецификацией,
          основным договором или иным названным документом — это валидный исход:
          liability_cap_status = "present", liability_cap_display = текстовая ссылка
          на документ.
        - Если в тексте прямо не назван вид ответственности — liability_type =
          "not_defined", liability_type_display = "Не установлено". Не подставляй
          "solidary" только потому, что ст. 363 п. 1 ГК РФ устанавливает
          солидарность по умолчанию: фиксируй только то, что написано в договоре.
        - Не используй "None", "null" и пустые строки.
        - Соблюдай точное соответствие имён ключей схеме полей.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни вида ответственности, ни лимита, ни состава покрытия.
           → presence = "missing";
             liability_type = "not_defined";
             liability_cap_status = "not_defined";
             coverage_scope = "not_defined";
             все *_display = соответствующий fallback;
             liability_clause_clarity = "not_defined".

        2. Неполное раскрытие — только вид без лимита.
           Указан вид ответственности (например, "солидарная"), но лимит
           и состав покрытия не конкретизированы.
           → presence = "present";
             liability_type = "solidary";
             liability_cap_status = "not_defined";
             coverage_scope = "not_defined".

        3. Противоречие между фрагментами.
           В разных частях договора указаны разные виды ответственности
           или противоречивые формулировки о лимите.
           → presence = "unclear";
             liability_type = "unclear";
             coverage_scope = "unclear";
             liability_clause_clarity = "unclear".

        4. Отсылка на законодательство без конкретики.
           "Ответственность определяется в соответствии с действующим
           законодательством РФ" — без прямого указания вида или лимита.
           → presence = "present";
             liability_type = "not_defined" (не подставлять "solidary" по ст. 363);
             liability_clause_clarity = "unclear".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для guaranty_liability_scope_check_presence используй только: "present", "missing", "unclear".
        - Для liability_type используй только: "solidary", "subsidiary", "unclear", "not_defined".
        - Для liability_cap_status используй только: "present", "not_defined".
        - Для coverage_scope используй только: "principal_only", "principal_plus_accessories", "unclear", "not_defined".
        - Для liability_clause_clarity используй только: "clear", "unclear", "not_defined".
        - Fallback при отсутствии данных:
          * liability_type_display → "Не установлено";
          * liability_cap_display → "Лимит не установлен";
          * coverage_scope_display → "Не установлено".
        - Fallback при противоречии или неоднозначности:
          * все *_display → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "guaranty_liability_scope_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования по теме ответственности поручителя. Внутреннее агрегатное signal-поле."
          required: true

        - name: "liability_type"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["solidary", "subsidiary", "unclear", "not_defined"]
          description: "Вид ответственности поручителя (внутренний enum)."
          required: true
          display_in_grid: false
        - name: "liability_type_display"
          type: "string"
          presentation: "fact"
          label: "Вид ответственности поручителя"
          description: >
            Человекочитаемый вид ответственности поручителя. Fallback: "Не установлено" / "Не удалось определить".
          required: true
          display_in_grid: true
          display_priority: 1
        - name: "liability_cap_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["present", "not_defined"]
          description: "Есть ли лимит ответственности (внутренний признак). Внутреннее enum-поле."
          required: true
          display_in_grid: false
        - name: "liability_cap_display"
          type: "string"
          presentation: "fact"
          label: "Лимит ответственности"
          description: >
            Сумма лимита, документ, которым он определяется, либо отметка об отсутствии. Fallback: "Не установлено" / "Не удалось определить".
          required: true
          display_in_grid: true
          display_priority: 2
        - name: "coverage_scope"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["principal_only", "principal_plus_accessories", "unclear", "not_defined"]
          description: "Объем ответственности по составу требований (внутренний enum)."
          required: true
          display_in_grid: false
        - name: "coverage_scope_display"
          type: "string"
          presentation: "fact"
          label: "Что покрывается поручительством"
          description: >
            Человекочитаемый состав требований, покрываемых поручительством. Fallback: "Не установлено" / "Не удалось определить".
          required: true
          display_in_grid: true
          display_priority: 3
        - name: "liability_clause_clarity"
          type: "string"
          presentation: "diagnostic"
          allowed_values: ["clear", "unclear", "not_defined"]
          description: "Понятность оговорки об ответственности (диагностика)."
          required: true
          display_in_grid: false
      store_payload: true

  - id: guaranty_change_and_termination_check
    name: "Поручительство: изменения основного обязательства и прекращение"
    description: >
      Проверяет правила изменения основного обязательства, уведомления поручителя
      и основания прекращения поручительства.
    triggers:
      any:
        - guaranty_contract
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "согласие поручителя"
        - "изменение основного обязательства"
        - "прекращение поручительства"
        - "срок поручительства"
        - "безусловное согласие"
        - "любые изменения"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)изменени[ея]\\s+основн(ого|ого)\\s+обязательств"
        - "(?i)прекращени[ея]\\s+поручительств"
        - "(?i)срок\\s+поручительств"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор поручительства по § 5 Главы 23 ГК РФ.
        Проверяется только один вопрос: изменения основного обязательства
        и прекращение поручительства.

        Нормативный ориентир:
        - ст. 367 п. 1 ГК РФ — прекращение поручительства при изменении
          основного обязательства без согласия поручителя, если это влечёт
          неблагоприятные последствия
        - ст. 367 п. 2 ГК РФ — если поручитель дал согласие отвечать
          на изменённых условиях, поручительство сохраняется
        - ст. 367 п. 4 ГК РФ — прекращение поручительства при переводе
          долга на другое лицо без согласия поручителя
        - ст. 367 п. 6 ГК РФ — если срок поручительства не установлен,
          оно прекращается по истечении года со дня наступления срока
          исполнения основного обязательства

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора,
          а чего прямо нет.
        - Не оценивай серьёзность риска.
        - Не подставляй нормы закона вместо текста договора. Если срок
          поручительства прямо не установлен в договоре — это фиксируется
          как гарантия_term_status = "not_defined" и display = "Не установлен".
          Не пиши в display "годичный срок по ст. 367 п. 6 ГК РФ" — это
          интерпретация, её делает отдельный слой анализа, а не extraction.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Какая модель согласия поручителя на изменения основного обязательства
          (конкретное согласие на каждое изменение / безусловное согласие на
          любые изменения / не установлено).
        2. Есть ли условия о прекращении поручительства и какие именно.
        3. Есть ли срок поручительства и какой именно.
        4. Есть ли признаки чрезмерно широкого согласия поручителя
          (внутренняя диагностика, не для отображения).

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Если условие не указано прямо — текстовое поле = "not_defined",
          display-поле = "Не установлено".
        4. Если текст есть, но надёжный вывод сделать нельзя —
          для internal-полей = "unclear", для display-полей = "Не удалось определить".
        5. Не используй "None", "null" и пустые строки.
        6. Все 7 ключей должны присутствовать в JSON-ответе.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — конкретное согласие, срок установлен, условия прекращения есть:
        Фрагмент:
        "Изменение основного обязательства допускается только с письменного согласия поручителя. Поручительство прекращается по истечении 3 (трех) лет с даты заключения настоящего договора, а также в случаях, предусмотренных законом."

        Ответ:
        {
          "guarantor_consent_model": "specific_consent",
          "guarantor_consent_model_display": "Конкретное согласие на каждое изменение",
          "guaranty_term_status": "present",
          "guaranty_term_display": "3 (три) года с даты заключения договора",
          "termination_clause_status": "present",
          "termination_clause_display": "Прекращение по истечении 3 лет с даты договора; также в случаях, предусмотренных законом",
          "risk_of_overbroad_consent": "low"
        }

        Пример 2 — безусловное согласие на любые изменения без уведомления (риск широкого согласия):
        Фрагмент:
        "Поручитель дает согласие на любые изменения основного обязательства без дополнительного уведомления. Поручительство действует до полного исполнения обязательств."

        Ответ:
        {
          "guarantor_consent_model": "blanket_consent",
          "guarantor_consent_model_display": "Безусловное согласие на любые изменения",
          "guaranty_term_status": "not_defined",
          "guaranty_term_display": "Не установлен",
          "termination_clause_status": "present",
          "termination_clause_display": "Прекращение по факту полного исполнения обязательств",
          "risk_of_overbroad_consent": "high"
        }

        Пример 3 — модель согласия не установлена, срок определяется через основной договор (валидный исход):
        Фрагмент:
        "Срок поручительства определяется сроком исполнения обязательств по Кредитному договору № 47 от 12.03.2026."

        Ответ:
        {
          "guarantor_consent_model": "not_defined",
          "guarantor_consent_model_display": "Не установлено",
          "guaranty_term_status": "present",
          "guaranty_term_display": "Определяется сроком исполнения обязательств по Кредитному договору № 47 от 12.03.2026",
          "termination_clause_status": "not_defined",
          "termination_clause_display": "Не установлено",
          "risk_of_overbroad_consent": "not_defined"
        }

        Пример 4 — текст есть, но надёжный вывод сделать нельзя (неоднозначная формулировка):
        Фрагмент:
        "Поручительство прекращается по основаниям, предусмотренным действующим законодательством Российской Федерации. Порядок изменения обязательств определяется по соглашению сторон."

        Ответ:
        {
          "guarantor_consent_model": "unclear",
          "guarantor_consent_model_display": "Не удалось определить",
          "guaranty_term_status": "not_defined",
          "guaranty_term_display": "Не установлен",
          "termination_clause_status": "unclear",
          "termination_clause_display": "Не удалось определить",
          "risk_of_overbroad_consent": "not_defined"
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о согласии поручителя на изменения.
        2. Найди прямую цитату о прекращении поручительства.
        3. Найди прямую цитату о сроке поручительства.
        4. Если прямой цитаты нет — верни "not_defined" (или "unclear",
          если в тексте есть противоречивые/неполные указания).

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь РОВНО одним JSON-объектом без какого-либо дополнительного текста до или после, со всеми 7 ключами:
        {
          "guarantor_consent_model": "<specific_consent / blanket_consent / unclear / not_defined>",
          "guarantor_consent_model_display": "<Конкретное согласие на каждое изменение / Безусловное согласие на любые изменения / Не удалось определить / Не установлено>",
          "guaranty_term_status": "<present / not_defined>",
          "guaranty_term_display": "<срок / чем определяется / Не установлен / Не удалось определить>",
          "termination_clause_status": "<present / not_defined>",
          "termination_clause_display": "<описание условий прекращения / Не установлено / Не удалось определить>",
          "risk_of_overbroad_consent": "<high / medium / low / not_defined>"
        }

        Верни РОВНО один JSON-объект со всеми 7 ключами без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.
      context_k: 8
      temperature: 0.0
      max_tokens: 550

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "согласие поручителя изменение основного обязательства прекращение поручительства срок поручительства безусловное согласие любые изменения без дополнительного уведомления перевод долга"
      preferred_unit_types:
        - obligation
        - termination_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - remedies
      negative_keywords:
        - "означает"
        - "в целях настоящего"
        - "основное обязательство"
      position_bias:
        preferred_range: [0.25, 0.65]
        boost: 0.14
        scope: segment
      context_k: 8
      max_chunks: 10
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
        - "invoice"
      preferred_clause_functions:
        - "obligations"
        - "remedies"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 600

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 900
      compact_output: false

      presence_signal:
        field: "guaranty_change_and_termination_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора поручительства
        условия об изменениях основного обязательства и прекращении поручительства.
        Не анализируй срок исковой давности и суброгацию.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. guaranty_change_and_termination_check_presence:
           Агрегатное signal-поле — наличие регулирования по теме изменений
           и прекращения поручительства.
           - "present" — если хотя бы одно из содержательных полей
             (guarantor_consent_model, guaranty_term_status,
              termination_clause_status) ≠ "not_defined";
           - "missing" — если все три содержательных поля = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - guarantor_consent_model = "not_defined";
           - guarantor_consent_model_display = "Не установлено";
           - guaranty_term_status = "not_defined";
           - guaranty_term_display = "Не установлен";
           - termination_clause_status = "not_defined";
           - termination_clause_display = "Не установлено";
           - risk_of_overbroad_consent = "not_defined";
           - не выполняй остальные шаги.

        1. guarantor_consent_model — "specific_consent" / "blanket_consent" /
          "unclear" / "not_defined".
          Внутренний enum модели согласия поручителя.

        2. guarantor_consent_model_display — русскоязычное отображение:
          "Конкретное согласие на каждое изменение" (specific_consent) /
          "Безусловное согласие на любые изменения" (blanket_consent) /
          "Не удалось определить" (unclear) /
          "Не установлено" (not_defined).

        3. guaranty_term_status — "present" / "not_defined".
          Внутренний признак наличия срока поручительства.

        4. guaranty_term_display — конкретный срок, или текстовая ссылка
          ("Определяется сроком исполнения обязательств по <документ>"),
          или "Не установлен" (при not_defined), или "Не удалось определить"
          (при противоречивых формулировках).

        5. termination_clause_status — "present" / "not_defined".
          Внутренний признак наличия условий о прекращении.

        6. termination_clause_display — краткое описание условий прекращения,
          или "Не установлено", или "Не удалось определить".

        7. risk_of_overbroad_consent — "high" / "medium" / "low" / "not_defined".
          Внутренняя диагностика (не для отображения в Grid):
          - "high" — blanket_consent без уведомления и/или без ограничений;
          - "medium" — blanket_consent с отдельными ограничениями;
          - "low" — specific_consent на каждое изменение;
          - "not_defined" — модель согласия не установлена.

        Все 7 ключей должны присутствовать в JSON-ответе.
        </task>

        <context_rules>
        - Перед остальными полями заполни guaranty_change_and_termination_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все содержательные поля = "not_defined", все *_display = соответствующий fallback, risk_of_overbroad_consent = "not_defined".
        - Используй только текст договора из <context>. Не подставляй нормы закона.
        - Не делай предположений и не достраивай отсутствующие реквизиты.
        - Если в <context> попали нерелевантные фрагменты — игнорируй их.
        - Если фрагменты противоречат друг другу и надёжный вывод сделать нельзя —
          верни "unclear" для guarantor_consent_model / termination_clause_status,
          "not_defined" для guaranty_term_status,
          "Не удалось определить" для соответствующих display-полей.
        - Если срок поручительства определяется сроком исполнения основного
          обязательства или иным названным документом — это валидный исход:
          guaranty_term_status = "present", guaranty_term_display = текстовая
          ссылка на документ.
        - Если срок поручительства прямо не установлен — guaranty_term_status =
          "not_defined", guaranty_term_display = "Не установлен". Не подставляй
          "годичный срок по ст. 367 п. 6 ГК РФ" — это интерпретация, её делает
          отдельный слой анализа.
        - Не используй "None", "null" и пустые строки.
        - Соблюдай точное соответствие имён ключей схеме полей.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни условий об изменении обязательства, ни срока
           поручительства, ни оснований прекращения.
           → presence = "missing";
             guarantor_consent_model = "not_defined";
             guaranty_term_status = "not_defined";
             termination_clause_status = "not_defined";
             все *_display = соответствующий fallback;
             risk_of_overbroad_consent = "not_defined".

        2. Неполное раскрытие — только срок без модели согласия.
           Указан срок поручительства, но модель согласия на изменения
           и условия прекращения не конкретизированы.
           → presence = "present";
             guaranty_term_status = "present";
             guarantor_consent_model = "not_defined";
             termination_clause_status = "not_defined".

        3. Противоречие между фрагментами.
           В разных частях договора указаны разные сроки поручительства
           или противоречивые условия прекращения.
           → presence = "unclear";
             guarantor_consent_model = "unclear";
             termination_clause_status = "unclear";
             соответствующие *_display = "Не удалось определить".

        4. Отсылка на законодательство без конкретики.
           "Поручительство прекращается по основаниям, предусмотренным
           действующим законодательством РФ" — без перечисления конкретных
           оснований и без модели согласия.
           → presence = "present";
             termination_clause_status = "present" (отсылка на закон —
             это регулирование, хотя и не конкретизированное);
             termination_clause_display = "По основаниям, предусмотренным законом";
             guarantor_consent_model = "not_defined".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для guaranty_change_and_termination_check_presence используй только: "present", "missing", "unclear".
        - Для guarantor_consent_model используй только: "specific_consent", "blanket_consent", "unclear", "not_defined".
        - Для guaranty_term_status и termination_clause_status используй только: "present", "not_defined".
        - Для risk_of_overbroad_consent используй только: "high", "medium", "low", "not_defined".
        - Fallback при отсутствии данных:
          * guarantor_consent_model_display → "Не установлено";
          * guaranty_term_display → "Не установлен";
          * termination_clause_display → "Не установлено".
        - Fallback при противоречии или неоднозначности:
          * все *_display → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "guaranty_change_and_termination_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования по теме изменений и прекращения поручительства. Внутреннее агрегатное signal-поле."
          required: true

        - name: "guarantor_consent_model"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["specific_consent", "blanket_consent", "unclear", "not_defined"]
          description: "Модель согласия поручителя на изменения (внутренний enum)."
          required: true
          display_in_grid: false
        - name: "guarantor_consent_model_display"
          type: "string"
          presentation: "fact"
          label: "Согласие поручителя на изменения"
          description: >
            Человекочитаемая модель согласия поручителя на изменения основного обязательства. Fallback: "Не установлено" / "Не удалось определить".
          required: true
          display_in_grid: true
          display_priority: 1
        - name: "guaranty_term_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["present", "not_defined"]
          description: "Есть ли срок поручительства (внутренний признак). Внутреннее enum-поле."
          required: true
          display_in_grid: false
        - name: "guaranty_term_display"
          type: "string"
          presentation: "fact"
          label: "Срок поручительства"
          description: >
            Срок поручительства или документ, которым он определяется. Fallback: "Не установлено" / "Не удалось определить".
          required: true
          display_in_grid: true
          display_priority: 2
        - name: "termination_clause_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["present", "not_defined"]
          description: "Есть ли условия о прекращении поручительства (внутренний признак). Внутреннее enum-поле."
          required: true
          display_in_grid: false
        - name: "termination_clause_display"
          type: "string"
          presentation: "fact"
          label: "Условия прекращения поручительства"
          description: >
            Краткое описание условий прекращения поручительства. Fallback: "Не установлено" / "Не удалось определить".
          required: true
          display_in_grid: true
          display_priority: 3
        - name: "risk_of_overbroad_consent"
          type: "string"
          presentation: "diagnostic"
          allowed_values: ["high", "medium", "low", "not_defined"]
          description: "Внутренняя диагностика риска чрезмерно широкого согласия поручителя (не для отображения в Grid)."
          required: true
          display_in_grid: false
      store_payload: true

  - id: pledge_subject_and_valuation_check
    name: "Залог: предмет, индивидуализация и оценка"
    description: >
      Проверяет идентификацию предмета залога, оценку и указание,
      у кого находится имущество.
    triggers:
      any:
        - pledge_contract
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "предмет залога"
        - "оценка предмета залога"
        - "рыночная стоимость"
        - "независимая оценка"
        - "находится у залогодателя"
        - "находится у залогодержателя"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)предмет\\s+залог"
        - "(?i)оценк[аи]\\s+предмета\\s+залога|рыночн(ая|ой)\\s+стоим"
        - "(?i)находитс[яь]\\s+у\\s+(залогодателя|залогодержателя)"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор залога по § 3 Главы 23 ГК РФ.
        Проверяется только один вопрос: индивидуализация предмета залога и оценка.

        Нормативный ориентир:
        - ст. 338 ГК РФ — владение предметом залога, заклад
        - ст. 339 п. 1 ГК РФ — существенные условия договора залога:
          предмет залога и его оценка, существо, размер и срок исполнения
          основного обязательства. Отсутствие описания предмета или оценки
          влечёт незаключённость договора залога (ст. 432 ГК РФ).
        - ст. 340 ГК РФ — оценка предмета залога
        - ст. 357 ГК РФ — залог товаров в обороте
        - п. 2 ст. 340 ГК РФ — залог будущей вещи

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора,
          а чего прямо нет.
        - Не оценивай серьёзность риска.
        - Не подставляй нормы закона вместо текста договора.
        - Если предмет залога определяется через приложение, спецификацию,
          опись или иной названный документ — это валидный исход, а не
          отсутствие данных. Отражай это текстом, например
          "Определяется Описью № 1 (Приложение № 2)".
        - "Оценка отсутствует" и "Оценка согласована сторонами" — разные
          состояния. Если в договоре прямо указана стоимость (рыночная,
          залоговая, согласованная) — фиксируй её. Если оценка не указана
          вообще — valuation_status = "not_defined".

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Как идентифицирован предмет залога (достаточно ли признаков для
          однозначной идентификации).
        2. Есть ли оценка предмета залога и какая именно.
        3. У кого находится предмет залога.
        4. Есть ли ссылка на независимую оценку (отчёт оценщика) и её реквизиты.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Если условие не указано прямо — текстовое поле = "not_defined",
          display-поле = "Не установлено".
        4. Если текст есть, но надёжный вывод сделать нельзя —
          для internal-полей = "unclear", для display-полей = "Не удалось определить".
        5. Не используй "None", "null" и пустые строки.
        6. Все 8 ключей должны присутствовать в JSON-ответе.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — детальная идентификация, оценка есть, независимая оценка есть:
        Фрагмент:
        "Предмет залога — транспортное средство Toyota Camry, 2022 года выпуска, VIN: XW7BF4FK20S123456, государственный регистрационный знак А123БВ777. Оценочная (залоговая) стоимость предмета залога составляет 2 400 000 рублей согласно Отчёту об оценке № 2025-04/115 от 15.04.2025, составленному ООО «Оценка-Профи». Предмет залога находится у Залогодателя."

        Ответ:
        {
          "collateral_identification_status": "clear",
          "collateral_subject_display": "Toyota Camry, 2022 г.в., VIN XW7BF4FK20S123456, г.р.з. А123БВ777",
          "valuation_status": "present",
          "valuation_display": "2 400 000 руб. (залоговая стоимость)",
          "possession_status": "pledgor",
          "possession_display": "У Залогодателя",
          "independent_valuation_reference": "present",
          "independent_valuation_display": "Отчёт об оценке № 2025-04/115 от 15.04.2025 (ООО «Оценка-Профи»)"
        }

        Пример 2 — предмет описан обобщённо, оценки нет, владение не указано:
        Фрагмент:
        "В обеспечение обязательств передаётся движимое имущество, принадлежащее Залогодателю на праве собственности. Состав имущества определяется Описью (Приложение № 1)."

        Ответ:
        {
          "collateral_identification_status": "partial",
          "collateral_subject_display": "Определяется Описью (Приложение № 1)",
          "valuation_status": "not_defined",
          "valuation_display": "Не установлено",
          "possession_status": "not_defined",
          "possession_display": "Не установлено",
          "independent_valuation_reference": "not_defined",
          "independent_valuation_display": "Не установлено"
        }

        Пример 3 — заклад: предмет у залогодержателя, независимой оценки нет, оценка согласована сторонами:
        Фрагмент:
          "Предмет залога передаётся Залогодержателю и находится у него в течение всего срока действия настоящего договора. Стороны согласовали стоимость предмета залога в размере 850 000 рублей."

        Ответ:
        {
          "collateral_identification_status": "clear",
          "collateral_subject_display": "Предмет залога передан Залогодержателю (состав см. в договоре)",
          "valuation_status": "present",
          "valuation_display": "850 000 руб. (согласованная стоимость)",
          "possession_status": "pledgee",
          "possession_display": "У Залогодержателя (заклад)",
          "independent_valuation_reference": "not_defined",
          "independent_valuation_display": "Не установлено"
        }

        Пример 4 — текст есть, но надёжный вывод сделать нельзя (неоднозначная формулировка):
        Фрагмент:
        "Предмет залога определяется в соответствии с условиями Основного договора. Оценка производится в порядке, установленном действующим законодательством."

        Ответ:
        {
          "collateral_identification_status": "partial",
          "collateral_subject_display": "Определяется Основным договором",
          "valuation_status": "unclear",
          "valuation_display": "Не удалось определить",
          "possession_status": "not_defined",
          "possession_display": "Не установлено",
          "independent_valuation_reference": "not_defined",
          "independent_valuation_display": "Не установлено"
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о предмете залога.
        2. Найди прямую цитату об оценке.
        3. Найди прямую цитату о месте нахождения предмета залога.
        4. Если прямой цитаты нет — верни "not_defined" (или "unclear",
          если в тексте есть противоречивые/неполные указания).

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь РОВНО одним JSON-объектом без какого-либо дополнительного текста до или после, со всеми 8 ключами:
        {
          "collateral_identification_status": "<clear / partial / not_defined>",
          "collateral_subject_display": "<текст предмета / чем определяется / Не установлено>",
          "valuation_status": "<present / unclear / not_defined>",
          "valuation_display": "<сумма с указанием вида / Не удалось определить / Не установлено>",
          "possession_status": "<pledgor / pledgee / unclear / not_defined>",
          "possession_display": "<У Залогодателя / У Залогодержателя (заклад) / У третьего лица / Не удалось определить / Не установлено>",
          "independent_valuation_reference": "<present / not_defined>",
          "independent_valuation_display": "<реквизиты отчёта / Не установлено>"
        }

        Верни РОВНО один JSON-объект со всеми 8 ключами без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.
      context_k: 8
      temperature: 0.0
      max_tokens: 600

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "предмет залога идентификация предмета залога оценка предмета залога рыночная залоговая стоимость согласованная стоимость независимая оценка отчёт об оценке оценщик находится у залогодателя находится у залогодержателя заклад владение"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - definitions
        - obligations
      negative_keywords:
        - "означает"
        - "в целях настоящего"
        - "основное обязательство"
      position_bias:
        preferred_range: [0.10, 0.50]
        boost: 0.16
        scope: segment
      context_k: 8
      max_chunks: 10
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
        - "invoice"
      preferred_clause_functions:
        - "definitions"
        - "obligations"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 600

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1050
      compact_output: false

      presence_signal:
        field: "pledge_subject_and_valuation_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора залога сведения
        о предмете залога, его индивидуализации, оценке и месте нахождения.
        Не анализируй обращение взыскания или страхование.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. pledge_subject_and_valuation_check_presence:
           Агрегатное signal-поле — наличие регулирования по теме предмета
           залога, его оценки и владения.
           - "present" — если хотя бы одно из содержательных полей
             (collateral_identification_status, valuation_status,
              possession_status, independent_valuation_reference) ≠ "not_defined";
           - "missing" — если все четыре содержательных поля = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - collateral_identification_status = "not_defined";
           - collateral_subject_display = "Не установлено";
           - valuation_status = "not_defined";
           - valuation_display = "Не установлено";
           - possession_status = "not_defined";
           - possession_display = "Не установлено";
           - independent_valuation_reference = "not_defined";
           - independent_valuation_display = "Не установлено";
           - не выполняй остальные шаги.

        1. collateral_identification_status — "clear" / "partial" / "not_defined".
          Внутренняя диагностика (не для отображения):
          - "clear" — есть достаточные идентифицирующие признаки
            (VIN, кадастровый номер, серийный номер, точный адрес и т.п.);
          - "partial" — есть описание, но недостаточно для однозначной
            идентификации (родовые признаки, отсылка к приложению);
          - "not_defined" — описание предмета отсутствует.

        2. collateral_subject_display — сам текст идентификации предмета залога,
          включая ключевые идентификаторы. Примеры:
          "Toyota Camry, 2022 г.в., VIN XW7BF4FK20S123456, г.р.з. А123БВ777";
          "Нежилое помещение, кадастровый номер 77:01:0001001:1234, адрес: г. Москва, ул. Примерная, д. 5, пом. 3";
          "Определяется Описью (Приложение № 1)";
          "Не установлено" (если описание отсутствует).

        3. valuation_status — "present" / "unclear" / "not_defined".
          Внутренний признак наличия оценки.

        4. valuation_display — сумма с указанием вида оценки:
          "2 400 000 руб. (залоговая стоимость)";
          "850 000 руб. (согласованная стоимость)";
          "5 200 000 руб. (рыночная стоимость)";
          "Не удалось определить" (при unclear);
          "Не установлено" (при not_defined).

        5. possession_status — "pledgor" / "pledgee" / "unclear" / "not_defined".
          Внутренний enum.

        6. possession_display — человекочитаемое описание:
          "У Залогодателя"; "У Залогодержателя (заклад)";
          "У третьего лица" (если прямо указано арендатор / хранитель /
          лизингополучатель); "Не удалось определить"; "Не установлено".

        7. independent_valuation_reference — "present" / "not_defined".
          Есть ли ссылка на независимую оценку (отчёт оценщика).

        8. independent_valuation_display — реквизиты отчёта и оценщик
          ("Отчёт об оценке № 2025-04/115 от 15.04.2025 (ООО «Оценка-Профи»)")
          или "Не установлено".

        Все 8 ключей должны присутствовать в JSON-ответе.
        </task>

        <context_rules>
        - Перед остальными полями заполни pledge_subject_and_valuation_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все содержательные поля = "not_defined", все *_display = "Не установлено".
        - Используй только текст договора из <context>. Не подставляй нормы закона.
        - Не делай предположений и не достраивай отсутствующие реквизиты.
        - Если в <context> попали нерелевантные фрагменты — игнорируй их.
        - Если фрагменты противоречат друг другу и надёжный вывод сделать нельзя —
          верни "unclear" для valuation_status / possession_status,
          "not_defined" для бинарных признаков,
          "Не удалось определить" для соответствующих display-полей.
        - Если предмет залога определяется через приложение, спецификацию, опись
          или иной названный документ — это валидный исход:
          collateral_identification_status = "partial",
          collateral_subject_display = "Определяется <документ>".
        - "Оценка отсутствует" и "Оценка согласована сторонами" — разные состояния.
          Если в договоре прямо указана стоимость (рыночная, залоговая,
          согласованная) — valuation_status = "present", valuation_display =
          сумма + вид оценки.
        - Для транспортных средств идентификаторы: VIN, марка, модель, год,
          г.р.з.; для недвижимости: кадастровый номер, адрес; для доли в ООО:
          сведения об обществе (ОГРН, ИНН), размер доли; для товаров в обороте:
          родовые признаки; для будущей вещи: признаки, позволяющие
          идентифицировать её на момент возникновения.
        - Не используй "None", "null" и пустые строки.
        - Соблюдай точное соответствие имён ключей схеме полей.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни описания предмета залога, ни оценки, ни указания
           на владение, ни ссылки на независимую оценку.
           → presence = "missing";
             collateral_identification_status = "not_defined";
             valuation_status = "not_defined";
             possession_status = "not_defined";
             independent_valuation_reference = "not_defined";
             все *_display = "Не установлено".

        2. Неполное раскрытие — предмет идентифицирован, но оценки нет.
           Предмет залога описан (частично или полностью), но стоимость
           не указана и владение не определено.
           → presence = "present";
             collateral_identification_status = "clear" или "partial";
             valuation_status = "not_defined";
             possession_status = "not_defined".

        3. Противоречие между фрагментами.
           В разных частях договора указаны разные оценки предмета залога
           или противоречивые сведения о владении.
           → presence = "unclear";
             valuation_status = "unclear";
             possession_status = "unclear";
             valuation_display = "Не удалось определить";
             possession_display = "Не удалось определить".

        4. Отсылка на внешний документ.
           Предмет залога и/или оценка определяются через приложение, опись,
           отчёт оценщика или основной договор.
           → presence = "present";
             collateral_identification_status = "partial";
             collateral_subject_display = "Определяется <документ>";
             valuation_status = "present" (если оценка определена документом)
             или "not_defined" (если только отсылка без суммы).
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для pledge_subject_and_valuation_check_presence используй только: "present", "missing", "unclear".
        - Для collateral_identification_status используй только: "clear", "partial", "not_defined".
        - Для valuation_status используй только: "present", "unclear", "not_defined".
        - Для possession_status используй только: "pledgor", "pledgee", "unclear", "not_defined".
        - Для independent_valuation_reference используй только: "present", "not_defined".
        - Fallback при отсутствии данных:
          * collateral_subject_display → "Не установлено";
          * valuation_display → "Не установлено";
          * possession_display → "Не установлено";
          * independent_valuation_display → "Не установлено".
        - Fallback при противоречии или неоднозначности:
          * все *_display → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "pledge_subject_and_valuation_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования по теме предмета залога, оценки и владения. Внутреннее агрегатное signal-поле."
          required: true

        - name: "collateral_identification_status"
          type: "string"
          presentation: "diagnostic"
          allowed_values: ["clear", "partial", "not_defined"]
          description: "Внутренняя диагностика полноты идентификации предмета залога (не для отображения в Grid)."
          required: true
          display_in_grid: false
        - name: "collateral_subject_display"
          type: "string"
          presentation: "fact"
          label: "Предмет залога"
          description: >
            Текст идентификации предмета залога с ключевыми идентификаторами. Fallback: "Не установлено" / "Не удалось определить".
          required: true
          display_in_grid: true
          display_priority: 1
        - name: "valuation_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["present", "unclear", "not_defined"]
          description: "Есть ли оценка предмета залога (внутренний признак). Внутреннее enum-поле."
          required: true
          display_in_grid: false
        - name: "valuation_display"
          type: "string"
          presentation: "fact"
          label: "Оценка предмета залога"
          description: >
            Стоимость предмета залога с указанием вида оценки. Fallback: "Не установлено" / "Не удалось определить".
          required: true
          display_in_grid: true
          display_priority: 2
        - name: "possession_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["pledgor", "pledgee", "unclear", "not_defined"]
          description: "У кого находится предмет залога (внутренний enum)."
          required: true
          display_in_grid: false
        - name: "possession_display"
          type: "string"
          presentation: "fact"
          label: "У кого находится предмет залога"
          description: >
            Человекочитаемое описание владения предметом залога. Fallback: "Не установлено" / "Не удалось определить".
          required: true
          display_in_grid: true
          display_priority: 3
        - name: "independent_valuation_reference"
          type: "string"
          presentation: "signal"
          risk_weight: "low"
          allowed_values: ["present", "not_defined"]
          description: "Есть ли ссылка на независимую оценку (внутренний признак). Внутреннее enum-поле."
          required: true
          display_in_grid: false
        - name: "independent_valuation_display"
          type: "string"
          presentation: "fact"
          label: "Независимая оценка"
          description: >
            Реквизиты отчёта об оценке и оценщик. Fallback: "Не установлено" / "Не удалось определить".
          required: true
          display_in_grid: true
          display_priority: 4
      store_payload: true

  - id: pledge_enforcement_check
    name: "Залог: порядок обращения взыскания и реализации"
    description: >
      Проверяет судебный/внесудебный порядок, уведомления, способ реализации
      и защиту залогодателя.
    triggers:
      any:
        - pledge_contract
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "обращение взыскания"
        - "внесудебный порядок"
        - "только в судебном порядке"
        - "реализация предмета залога"
        - "уведомление залогодателя"
        - "публичные торги"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)обращени[ея]\\s+взыскан"
        - "(?i)внесудебн(ый|ого)\\s+поряд"
        - "(?i)реализац[ияии]\\s+предмета\\s+залога"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор залога по § 3 Главы 23 ГК РФ.
        Проверяется только один вопрос: порядок обращения взыскания и реализации.

        Нормативный ориентир:
        - ст. 348 ГК РФ — основания обращения взыскания (существенность
          нарушения, соразмерность)
        - ст. 349 п. 1 ГК РФ — по умолчанию судебный порядок; внесудебный —
          только если прямо предусмотрен договором
        - ст. 349 п. 3 ГК РФ — случаи, когда взыскание допускается
          исключительно в судебном порядке
        - ст. 350 ГК РФ — реализация на торгах
        - ст. 350.1 ГК РФ — реализация по договору с залогодержателем
          (комиссионная продажа, оставление предмета за собой)
        - ст. 350.2 ГК РФ — процедура торгов
        - ст. 55 ФЗ-102 «Об ипотеке» — внесудебный порядок для ипотеки
          допускается только на основании нотариально удостоверенного
          соглашения сторон

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора,
          а чего прямо нет.
        - Не оценивай серьёзность риска.
        - Не подставляй нормы закона вместо текста договора. Если в договоре
          прямо не указан порядок взыскания — enforcement_mode = "not_defined",
          display = "Не установлено". Не подставляй «судебный порядок по
          ст. 349 ГК РФ» — фиксируй только то, что написано в договоре.
        - Различай два понятия:
          - «обращение взыскания» — действие залогодержателя (судебное /
            внесудебное);
          - «реализация предмета залога» — продажа предмета (торги /
            комиссионная продажа / оставление за собой / продажа по
            договору с залогодержателем).
          Это разные факты в разных полях.
        - Если срок уведомления залогодателя не указан, но уведомление
          в принципе предусмотрено — это не «отсутствие уведомления»,
          а «срок не установлен». Отражай это отдельно.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Режим обращения взыскания (судебный / внесудебный / смешанный).
        2. Способ реализации предмета залога (торги / комиссионная продажа /
          оставление за собой / иное).
        3. Уведомление залогодателя: предусмотрено ли, в какой форме,
          в какой срок.
        4. Есть ли признаки рискованной для залогодателя формулировки
          (внутренняя диагностика, не для отображения).

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Если условие не указано прямо — текстовое поле = "not_defined",
          display-поле = "Не установлено".
        4. Если текст есть, но надёжный вывод сделать нельзя —
          для internal-полей = "unclear", для display-полей = "Не удалось определить".
        5. Не используй "None", "null" и пустые строки.
        6. Все 7 ключей должны присутствовать в JSON-ответе.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — судебный порядок, торги, уведомление с конкретным сроком:
        Фрагмент:
        "Обращение взыскания на предмет залога осуществляется только в судебном порядке. Реализация предмета залога производится на публичных торгах в порядке, установленном законодательством об исполнительном производстве. Залогодержатель уведомляет Залогодателя о намерении обратиться в суд не позднее чем за 15 (пятнадцать) календарных дней до подачи искового заявления."

        Ответ:
        {
          "enforcement_mode": "judicial_only",
          "enforcement_mode_display": "Только судебный порядок",
          "sale_method_status": "present",
          "sale_method_display": "Публичные торги",
          "notice_to_pledgor_status": "present",
          "notice_display": "Предусмотрено; не позднее чем за 15 календарных дней до подачи иска",
          "enforcement_clause_risk": "low"
        }

        Пример 2 — внесудебный порядок без ограничений (риск для залогодателя):
        Фрагмент:
        "Залогодержатель вправе обратить взыскание на предмет залога во внесудебном порядке по своему усмотрению. Реализация предмета залога осуществляется посредством комиссионной продажи."

        Ответ:
        {
          "enforcement_mode": "out_of_court",
          "enforcement_mode_display": "Внесудебный порядок",
          "sale_method_status": "present",
          "sale_method_display": "Комиссионная продажа",
          "notice_to_pledgor_status": "not_defined",
          "notice_display": "Не установлено",
          "enforcement_clause_risk": "high"
        }

        Пример 3 — смешанный режим с уведомлением, но без срока (валидный исход):
        Фрагмент:
        "Обращение взыскания производится по выбору Залогодержателя: в судебном или во внесудебном порядке. При внесудебном порядке Залогодержатель направляет Залогодателю письменное уведомление, срок направления которого определяется Залогодержателем."

        Ответ:
        {
          "enforcement_mode": "mixed",
          "enforcement_mode_display": "Судебный или внесудебный (по выбору Залогодержателя)",
          "sale_method_status": "not_defined",
          "sale_method_display": "Не установлено",
          "notice_to_pledgor_status": "present",
          "notice_display": "Письменное уведомление предусмотрено; срок определяется Залогодержателем",
          "enforcement_clause_risk": "medium"
        }

        Пример 4 — текст есть, но надёжный вывод сделать нельзя (неоднозначная формулировка):
        Фрагмент:
        "Обращение взыскания и реализация предмета залога осуществляются в порядке, установленном действующим законодательством Российской Федерации."

        Ответ:
        {
          "enforcement_mode": "unclear",
          "enforcement_mode_display": "Не удалось определить",
          "sale_method_status": "not_defined",
          "sale_method_display": "Не установлено",
          "notice_to_pledgor_status": "not_defined",
          "notice_display": "Не установлено",
          "enforcement_clause_risk": "not_defined"
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о порядке взыскания.
        2. Найди прямую цитату о способе реализации.
        3. Найди прямую цитату об уведомлении.
        4. Если прямой цитаты нет — верни "not_defined" (или "unclear",
          если в тексте есть противоречивые/неполные указания).

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь РОВНО одним JSON-объектом без какого-либо дополнительного текста до или после, со всеми 7 ключами:
        {
          "enforcement_mode": "<judicial_only / out_of_court / mixed / unclear / not_defined>",
          "enforcement_mode_display": "<Только судебный порядок / Внесудебный порядок / Судебный или внесудебный (по выбору Залогодержателя) / Не удалось определить / Не установлено>",
          "sale_method_status": "<present / not_defined>",
          "sale_method_display": "<Публичные торги / Аукцион / Комиссионная продажа / Оставление предмета за собой / Продажа по договору с Залогодержателем / иное / Не установлено / Не удалось определить>",
          "notice_to_pledgor_status": "<present / not_defined>",
          "notice_display": "<Предусмотрено: <форма, срок> / Не установлено / Не удалось определить>",
          "enforcement_clause_risk": "<high / medium / low / not_defined>"
        }

        Верни РОВНО один JSON-объект со всеми 7 ключами без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.
      context_k: 8
      temperature: 0.0
      max_tokens: 550

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "обращение взыскания судебный порядок внесудебный порядок реализация предмета залога публичные торги аукцион комиссионная продажа оставление предмета за собой уведомление залогодателя извещение"
      preferred_unit_types:
        - obligation
        - termination_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - remedies
        - obligations
      negative_keywords:
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.30, 0.75]
        boost: 0.14
        scope: segment
      context_k: 8
      max_chunks: 10
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
        - "invoice"
      preferred_clause_functions:
        - "remedies"
        - "obligations"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 600

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 900
      compact_output: false

      presence_signal:
        field: "pledge_enforcement_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора залога сведения
        о порядке обращения взыскания и реализации предмета залога.
        Не анализируй основания обращения взыскания (существенность нарушения)
        и оценку предмета залога.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. pledge_enforcement_check_presence:
           Агрегатное signal-поле — наличие регулирования по теме обращения
           взыскания и реализации предмета залога.
           - "present" — если хотя бы одно из содержательных полей
             (enforcement_mode, sale_method_status, notice_to_pledgor_status)
             ≠ "not_defined";
           - "missing" — если все три содержательных поля = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - enforcement_mode = "not_defined";
           - enforcement_mode_display = "Не установлено";
           - sale_method_status = "not_defined";
           - sale_method_display = "Не установлено";
           - notice_to_pledgor_status = "not_defined";
           - notice_display = "Не установлено";
           - enforcement_clause_risk = "not_defined";
           - не выполняй остальные шаги.

        1. enforcement_mode — "judicial_only" / "out_of_court" / "mixed" /
          "unclear" / "not_defined".
          Внутренний enum режима обращения взыскания:
          - "judicial_only" — только в судебном порядке;
          - "out_of_court" — во внесудебном порядке;
          - "mixed" — комбинация / по выбору залогодержателя;
          - "unclear" — формулировка есть, но надёжно классифицировать нельзя;
          - "not_defined" — режим прямо не указан.

        2. enforcement_mode_display — русскоязычное отображение:
          "Только судебный порядок" (judicial_only) /
          "Внесудебный порядок" (out_of_court) /
          "Судебный или внесудебный (по выбору Залогодержателя)" (mixed) /
          "Не удалось определить" (unclear) /
          "Не установлено" (not_defined).

        3. sale_method_status — "present" / "not_defined".
          Внутренний признак наличия способа реализации.

        4. sale_method_display — способ реализации предмета залога:
          "Публичные торги" / "Аукцион" / "Комиссионная продажа" /
          "Оставление предмета за собой" /
          "Продажа по договору с Залогодержателем" / иной способ,
          указанный в договоре / "Не установлено" / "Не удалось определить".

        5. notice_to_pledgor_status — "present" / "not_defined".
          Внутренний признак наличия уведомления.

        6. notice_display — описание уведомления залогодателя:
          "Предусмотрено: письменно, не позднее чем за 15 календарных дней
          до подачи иска" / "Предусмотрено; срок не установлен" /
          "Не установлено" / "Не удалось определить".

        7. enforcement_clause_risk — "high" / "medium" / "low" / "not_defined".
          Внутренняя диагностика (не для отображения в Grid):
          - "high" — внесудебный порядок без ограничений и/или без уведомления
            залогодателя;
          - "medium" — внесудебный порядок с отдельными ограничениями
            (уведомление, сроки, форма) либо смешанный режим;
          - "low" — только судебный порядок;
          - "not_defined" — режим не установлен или надёжно классифицировать
            нельзя.

        Все 7 ключей должны присутствовать в JSON-ответе.
        </task>

        <context_rules>
        - Перед остальными полями заполни pledge_enforcement_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все содержательные поля = "not_defined", все *_display = "Не установлено", enforcement_clause_risk = "not_defined".
        - Используй только текст договора из <context>. Не подставляй нормы закона.
        - Не делай предположений и не достраивай отсутствующие реквизиты.
        - Если в <context> попали нерелевантные фрагменты — игнорируй их.
        - Если фрагменты противоречат друг другу и надёжный вывод сделать нельзя —
          верни "unclear" для enforcement_mode, "not_defined" для бинарных
          признаков, "Не удалось определить" для соответствующих display-полей.
        - Если в договоре прямо не указан порядок взыскания — enforcement_mode =
          "not_defined", enforcement_mode_display = "Не установлено".
          Не подставляй «судебный порядок по ст. 349 ГК РФ» — фиксируй только
          текст договора.
        - Различай «обращение взыскания» (действие залогодержателя) и
          «реализацию предмета залога» (продажа предмета). Это разные поля.
        - Если уведомление предусмотрено, но срок в договоре не установлен —
          notice_to_pledgor_status = "present", notice_display =
          "Предусмотрено; срок не установлен". Не подменяй это на "not_defined".
        - Не используй "None", "null" и пустые строки.
        - Соблюдай точное соответствие имён ключей схеме полей.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни порядка взыскания, ни способа реализации,
           ни уведомления залогодателя.
           → presence = "missing";
             enforcement_mode = "not_defined";
             sale_method_status = "not_defined";
             notice_to_pledgor_status = "not_defined";
             все *_display = "Не установлено";
             enforcement_clause_risk = "not_defined".

        2. Неполное раскрытие — только режим без деталей.
           Указан режим взыскания (например, "только в судебном порядке"),
           но способ реализации и уведомление не конкретизированы.
           → presence = "present";
             enforcement_mode = "judicial_only";
             sale_method_status = "not_defined";
             notice_to_pledgor_status = "not_defined".

        3. Противоречие между фрагментами.
           В разных частях договора указаны разные режимы взыскания
           (например, в одном пункте — судебный, в другом — внесудебный).
           → presence = "unclear";
             enforcement_mode = "unclear";
             enforcement_mode_display = "Не удалось определить";
             enforcement_clause_risk = "not_defined".

        4. Отсылка на законодательство без конкретики.
           "Обращение взыскания и реализация осуществляются в порядке,
           установленном действующим законодательством РФ" — без прямого
           указания режима и способа.
           → presence = "present";
             enforcement_mode = "unclear" (отсылка на закон — регулирование
             есть, но режим из текста договора не определяется);
             sale_method_status = "not_defined";
             notice_to_pledgor_status = "not_defined".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для pledge_enforcement_check_presence используй только: "present", "missing", "unclear".
        - Для enforcement_mode используй только: "judicial_only", "out_of_court", "mixed", "unclear", "not_defined".
        - Для sale_method_status и notice_to_pledgor_status используй только: "present", "not_defined".
        - Для enforcement_clause_risk используй только: "high", "medium", "low", "not_defined".
        - Fallback при отсутствии данных:
          * enforcement_mode_display → "Не установлено";
          * sale_method_display → "Не установлено";
          * notice_display → "Не установлено".
        - Fallback при противоречии или неоднозначности:
          * все *_display → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

