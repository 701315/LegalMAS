          - наличие ссылки на брачный договор или режим раздельной
            собственности (в этом случае согласие обычно не требуется);
          - заверения залогодателя о семейном положении.
        - Не подставляй нормы закона вместо текста договора. Отсутствие
          в тексте согласия ≠ отсутствие согласия: оно может быть
          удостоверено отдельным документом.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Есть ли указание на наличие согласия супруга залогодателя
          на ипотеку и в какой форме.
        2. Есть ли ссылка на брачный договор или режим раздельной
          собственности (что снимает требование о согласии).
        3. Есть ли заверения о семейном положении залогодателя.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Если условие не указано прямо — текстовое поле = "not_defined",
          display-поле = "Не установлено".
        4. Если текст есть, но надёжный вывод сделать нельзя —
          для internal-полей = "unclear", для display-полей = "Не удалось определить".
        5. Не используй "None", "null" и пустые строки.
        6. Все 6 ключей должны присутствовать в JSON-ответе.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — нотариальное согласие супруга прямо указано:
        Фрагмент:
        "Залогодатель подтверждает, что предмет ипотеки находится в совместной собственности супругов. Согласие супруга Залогодателя на передачу предмета ипотеки в залог удостоверено нотариально (согласие № 77 АВ 1234567 от 15.02.2026)."

        Ответ:
        {
          "spousal_consent_status": "present",
          "spousal_consent_display": "Нотариально удостоверенное согласие супруга получено (№ 77 АВ 1234567 от 15.02.2026)",
          "marital_regime_status": "joint_property",
          "marital_regime_display": "Совместная собственность супругов",
          "marital_representation_status": "present",
          "marital_representation_display": "Залогодатель подтверждает наличие супруга и совместного режима собственности"
        }

        Пример 2 — брачный договор с режимом раздельной собственности (согласие не требуется):
        Фрагмент:
        "Имущество, передаваемое в ипотеку, является личной собственностью Залогодателя на основании брачного договора № 77 АБ 7654321 от 20.03.2020, устанавливающего режим раздельной собственности."

        Ответ:
        {
          "spousal_consent_status": "not_required",
          "spousal_consent_display": "Не требуется (брачный договор с режимом раздельной собственности)",
          "marital_regime_status": "separate_property",
          "marital_regime_display": "Раздельная собственность (брачный договор № 77 АБ 7654321 от 20.03.2020)",
          "marital_representation_status": "present",
          "marital_representation_display": "Залогодатель ссылается на брачный договор с режимом раздельной собственности"
        }

        Пример 3 — заверение о семейном положении без деталей:
        Фрагмент:
        "Залогодатель подтверждает, что не состоит в браке."

        Ответ:
        {
          "spousal_consent_status": "not_required",
          "spousal_consent_display": "Не требуется (залогодатель не состоит в браке)",
          "marital_regime_status": "not_applicable",
          "marital_regime_display": "Не применимо (залогодатель не состоит в браке)",
          "marital_representation_status": "present",
          "marital_representation_display": "Залогодатель подтверждает отсутствие брака"
        }

        Пример 4 — текст есть, но надёжный вывод сделать нельзя:
        Фрагмент:
        "Залогодатель гарантирует, что обладает всеми правами, необходимыми для передачи имущества в ипотеку."

        Ответ:
        {
          "spousal_consent_status": "unclear",
          "spousal_consent_display": "Не удалось определить (обобщённая формулировка без прямой ссылки на семейное положение)",
          "marital_regime_status": "not_defined",
          "marital_regime_display": "Не установлено",
          "marital_representation_status": "unclear",
          "marital_representation_display": "Не удалось определить (нет прямого заверения о семейном положении)"
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о согласии супруга.
        2. Найди прямую цитату о брачном договоре или режиме собственности.
        3. Найди прямую цитату о семейном положении.
        4. Если прямой цитаты нет — верни "not_defined".

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь РОВНО одним JSON-объектом без какого-либо дополнительного текста до или после, со всеми 6 ключами:
        {
          "spousal_consent_status": "<present / not_required / unclear / not_defined>",
          "spousal_consent_display": "<Нотариально удостоверенное согласие супруга получено (…) / Письменное согласие супруга получено / Не требуется (…) / Не удалось определить / Не установлено>",
          "marital_regime_status": "<joint_property / separate_property / not_applicable / unclear / not_defined>",
          "marital_regime_display": "<Совместная собственность супругов / Раздельная собственность (…) / Не применимо (…) / Не удалось определить / Не установлено>",
          "marital_representation_status": "<present / unclear / not_defined>",
          "marital_representation_display": "<описание заверения о семейном положении / Не удалось определить / Не установлено>"
        }

