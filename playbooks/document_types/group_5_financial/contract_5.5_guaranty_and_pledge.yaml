  - id: pledge_insurance_check
    name: "Залог: страхование предмета залога"
    description: >
      Проверяет обязанность страхования предмета залога, выгодоприобретателя
      и условия страхования.
    triggers:
      any:
        - pledge_contract
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "страхование предмета залога"
        - "обязан застраховать"
        - "выгодоприобретатель — залогодержатель"
        - "страховой полис"
        - "страховая сумма"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)страховани[ея]\\s+предмета\\s+залога|обязан\\s+застрахова"
        - "(?i)выгодоприобретател.{0,30}залогодержател"
        - "(?i)страхов(ой|ая)\\s+(полис|сумм)"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор залога по § 3 Главы 23 ГК РФ.
        Проверяется только один вопрос: страхование предмета залога.

        Нормативный ориентир:
        - ст. 343 п. 1 ГК РФ — страхование предмета залога: залогодатель,
          если предмет у него, или залогодержатель, если предмет в закладе
        - ст. 343 п. 2 ГК РФ — страхование в пользу залогодержателя
        - ст. 343 п. 3 ГК РФ — последствия неисполнения обязанности
          страхования (право требовать досрочного исполнения
          обеспеченного обязательства)
        - ст. 31, 35 ФЗ-102 — для ипотеки: страхование имущества, а также
          (в кредитной схеме) страхование жизни заёмщика и титула

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора,
          а чего прямо нет.
        - Не оценивай серьёзность риска.
        - Не подставляй нормы закона вместо текста договора. Если в договоре
          прямо не указана обязанность страхования — insurance_obligation_status
          = "not_defined". Не подставляй «обязанность по ст. 343 ГК РФ» —
          фиксируй только текст.
        - Различай три факта:
          - обязанность страхования (кто страхует и в силу чего);
          - выгодоприобретатель по договору страхования;
          - конкретные параметры страхования (страховая сумма, срок,
            страховая компания).
          Это разные поля, не смешивай.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Есть ли обязанность страхования предмета залога и на кого
          она возложена.
        2. Назначен ли залогодержатель выгодоприобретателем по договору
          страхования.
        3. Какие параметры страхования прямо указаны (страховая сумма,
          срок, страховая компания, вид страхования).

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Если условие не указано прямо — текстовое поле = "not_defined",
          display-поле = "Не установлено".
        4. Если текст есть, но надёжный вывод сделать нельзя —
          для internal-полей = "unclear", для display-полей = "Не удалось определить".
        5. Не используй "None", "null" и пустые строки.
        6. Все 6 ключей должны присутствовать в JSON-ответе.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — полная оговорка со страхованием на залогодателя и залогодержателя-выгодоприобретателя:
        Фрагмент:
        "Залогодатель обязан за свой счёт застраховать предмет залога от рисков утраты и повреждения в страховой компании, согласованной с Залогодержателем, на страховую сумму не менее залоговой стоимости предмета залога. Выгодоприобретателем по договору страхования является Залогодержатель. Страхование осуществляется на весь срок действия настоящего договора."

        Ответ:
        {
          "insurance_obligation_status": "present",
          "insurance_obligation_display": "Предусмотрено: страхование Залогодателем за свой счёт",
          "pledgee_as_beneficiary": "present",
          "pledgee_as_beneficiary_display": "Залогодержатель (выгодоприобретатель)",
          "insurance_details_status": "present",
          "insurance_details_display": "Страховая сумма: не менее залоговой стоимости; страховая компания: по согласованию с Залогодержателем; срок: на весь срок договора"
        }

        Пример 2 — страхование предусмотрено, выгодоприобретатель не указан:
        Фрагмент:
        "Залогодатель обязуется застраховать предмет залога на весь срок действия договора."

        Ответ:
        {
          "insurance_obligation_status": "present",
          "insurance_obligation_display": "Предусмотрено: страхование Залогодателем",
          "pledgee_as_beneficiary": "not_defined",
          "pledgee_as_beneficiary_display": "Не установлено",
          "insurance_details_status": "not_defined",
          "insurance_details_display": "Не установлено"
        }

        Пример 3 — ипотека в силу закона: страхование в силу ст. 31/35 ФЗ-102, но прямо в договоре не детализировано:
        Фрагмент:
        "Страхование предмета ипотеки осуществляется в соответствии с требованиями Федерального закона «Об ипотеке (залоге недвижимости)». Конкретные условия страхования определяются отдельным договором страхования."

        Ответ:
        {
          "insurance_obligation_status": "present",
          "insurance_obligation_display": "Предусмотрено: страхование по требованиям ФЗ-102",
          "pledgee_as_beneficiary": "not_defined",
          "pledgee_as_beneficiary_display": "Не установлено",
          "insurance_details_status": "partial",
          "insurance_details_display": "Определяется отдельным договором страхования"
        }

        Пример 4 — текст есть, но надёжный вывод сделать нельзя (неоднозначная формулировка):
        Фрагмент:
        "Стороны принимают меры к обеспечению сохранности предмета залога, включая, при необходимости, его страхование."

        Ответ:
        {
          "insurance_obligation_status": "unclear",
          "insurance_obligation_display": "Не удалось определить (формулировка не обязывает прямо)",
          "pledgee_as_beneficiary": "not_defined",
          "pledgee_as_beneficiary_display": "Не установлено",
          "insurance_details_status": "not_defined",
          "insurance_details_display": "Не установлено"
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату об обязанности страхования.
        2. Найди прямую цитату о выгодоприобретателе.
        3. Найди прямую цитату о параметрах страхования.
        4. Если прямой цитаты нет — верни "not_defined" (или "unclear",
          если в тексте есть противоречивые/неполные указания).

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь РОВНО одним JSON-объектом без какого-либо дополнительного текста до или после, со всеми 6 ключами:
        {
          "insurance_obligation_status": "<present / unclear / not_defined>",
          "insurance_obligation_display": "<Предусмотрено: <кто страхует> / Не удалось определить / Не установлено>",
          "pledgee_as_beneficiary": "<present / unclear / not_defined>",
          "pledgee_as_beneficiary_display": "<Залогодержатель (выгодоприобретатель) / Иное лицо / Не удалось определить / Не установлено>",
          "insurance_details_status": "<present / partial / unclear / not_defined>",
          "insurance_details_display": "<Страховая сумма / срок / страховая компания / Определяется отдельным договором / Не удалось определить / Не установлено>"
        }

        Верни РОВНО один JSON-объект со всеми 6 ключами без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.
      context_k: 8
      temperature: 0.0
      max_tokens: 500

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "страхование предмета залога обязан застраховать выгодоприобретатель залогодержатель страховой полис страховая сумма страховая компания залоговая стоимость"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - procedures
      negative_keywords:
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.20, 0.60]
        boost: 0.14
        scope: segment
      context_k: 8
      max_chunks: 10
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
        - "invoice"
      preferred_clause_functions:
        - "obligations"
        - "procedures"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 35
      max_snippet_length: 550

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 850
      compact_output: false  # [CONSIDER]

      presence_signal:
        field: "pledge_insurance_presence"
        present_values:
          - present
        missing_values:
          - missing
        unclear_values:
          - unclear
      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора залога сведения
        об обязанности страхования предмета залога, о выгодоприобретателе
        и о параметрах страхования.
        Не анализируй банкротные риски, оценку предмета залога и обращение
        взыскания.
        </role>

        <context>
        {context}
        </context>

        <task>
        0. pledge_insurance_presence:
           - "present" — в тексте есть хотя бы одно условие о страховании
             предмета залога (обязанность, выгодоприобретатель или
             параметры страхования);
           - "missing" — страхование предмета залога в тексте не упоминается;
           - "unclear" — упоминания есть, но они фрагментарны или
             противоречивы.

        1. insurance_obligation_status — "present" / "unclear" / "not_defined".
           Внутренний признак наличия обязанности страхования.
           - "present" — обязанность прямо установлена в договоре;
           - "unclear" — упоминание страхования есть, но формулировка
             не создаёт прямой обязанности;
           - "not_defined" — обязанность в договоре не установлена.

        2. insurance_obligation_display — человекочитаемое описание:
           "Предусмотрено: страхование Залогодателем за свой счёт";
           "Предусмотрено: страхование по требованиям ФЗ-102";
           "Не удалось определить (формулировка не обязывает прямо)";
           "Не установлено".

        3. pledgee_as_beneficiary — "present" / "unclear" / "not_defined".
           Внутренний признак указания Залогодержателя выгодоприобретателем.

        4. pledgee_as_beneficiary_display — человекочитаемое описание:
           "Залогодержатель (выгодоприобретатель)";
           "Иное лицо: <кто>" (если выгодоприобретатель прямо указан
           и это не Залогодержатель);
           "Не удалось определить";
           "Не установлено".

        5. insurance_details_status — "present" / "partial" / "unclear" /
           "not_defined".
           Внутренний признак наличия параметров страхования.
           - "present" — прямо указаны страховая сумма, срок, страховая
             компания (или большинство из них);
           - "partial" — указана только часть параметров или отсылка
             к отдельному договору;
           - "unclear" — упоминание параметров есть, но они неясны;
           - "not_defined" — параметры прямо не указаны.

        6. insurance_details_display — человекочитаемое описание:
           "Страховая сумма: <значение>; страховая компания: <...>;
           срок: <...>";
           "Определяется отдельным договором страхования";
           "Не удалось определить";
           "Не установлено".

        Все 7 ключей должны присутствовать в JSON-ответе.
        </task>

        <context_rules>
        - Перед остальными полями заполни pledge_insurance_presence по правилу из пункта 0 task.
        - Агрегируй pledge_insurance_presence по значению хотя бы одного из:
          insurance_obligation_status, pledgee_as_beneficiary,
          insurance_details_status. Если хотя бы одно = "present" →
          "present"; все три = "not_defined" → "missing"; иначе → "unclear".
        - Используй только текст договора из <context>. Не подставляй нормы закона.
        - Не делай предположений и не достраивай отсутствующие реквизиты.
        - Если в <context> попали нерелевантные фрагменты — игнорируй их.
        - Если фрагменты противоречат друг другу и надёжный вывод сделать нельзя —
          верни "unclear" для соответствующих internal-полей,
          "Не удалось определить" для display-полей.
        - Если в договоре прямо не указана обязанность страхования —
          insurance_obligation_status = "not_defined",
          insurance_obligation_display = "Не установлено". Не подставляй
          «обязанность по ст. 343 ГК РФ» — фиксируй только текст договора.
        - Различай три факта: обязанность страхования, выгодоприобретателя
          и параметры страхования. Это разные поля, не смешивай.
        - Страхование жизни заёмщика или титульное страхование ≠ страхование
          предмета залога. Если в тексте только они — pledge_insurance_presence
          = "missing".
        - Не используй "None", "null" и пустые строки.
        - Соблюдай точное соответствие имён ключей схеме полей.
        </context_rules>

        <edge_cases>
        1. Страхование упомянуто только отсылкой к ФЗ-102 без конкретизации →
           insurance_obligation_status = "present" (отсылка к закону = условие),
           insurance_details_status = "partial" (детали в отдельном договоре).
        2. Формулировка «Стороны принимают меры к сохранности предмета залога,
           включая при необходимости его страхование» →
           insurance_obligation_status = "unclear" (нет прямой обязанности).
        3. Выгодоприобретатель указан как «страхователь» или третье лицо,
           а не залогодержатель → pledgee_as_beneficiary = "present",
           pledgee_as_beneficiary_display = "Иное лицо: <кто>".
        4. В договоре ипотеки есть страхование жизни заёмщика и титула,
           но страхование предмета залога не упомянуто →
           pledge_insurance_presence = "missing" (страхование жизни ≠
           страхование предмета залога).
        </edge_cases>

        <output_expectations>
        - Верни РОВНО один JSON-объект со всеми 7 ключами без какого-либо
          дополнительного текста до или после.
        - Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей.
        - НЕ пиши Markdown, списки, код-фенсы.
        - Ответ должен быть валидным JSON, пригодным для парсинга через json.loads
          без предварительной обработки.
        - Технический формат JSON (value / confidence / location) задан отдельным
          контрактом — соблюдай его, но не описывай здесь.
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

