          = "not_defined" → "missing"; иначе → "unclear".
        - Используй только текст договора из <context>. Не подставляй
          нормы закона.
        - Не делай предположений.
        - Если в <context> попали нерелевантные фрагменты — игнорируй их.
        - Если фрагменты противоречат друг другу и надёжный вывод сделать
          нельзя — верни "unclear" для internal-полей, "Не удалось
          определить" для display-полей.
        - Отсутствие в тексте согласия супруга ≠ отсутствие согласия:
          оно может быть удостоверено отдельным документом. Фиксируй
          только текст.
        - Различай: наличие согласия / режим собственности / заверение
          о семейном положении — это разные факты, не смешивай.
        - Ссылка на брачный договор в приложении = "present" для
          marital_regime_status (внешний документ учитывается).
        - Не используй "None", "null" и пустые строки.
        - Соблюдай точное соответствие имён ключей схеме полей.
        </context_rules>

        <edge_cases>
        1. Нотариальное согласие супруга оформлено отдельным документом,
           в договоре только ссылка на него → spousal_consent_status =
           "present", в display укажи реквизиты из ссылки.
        2. Залогодатель — юридическое лицо (вопрос о супруге не возникает) →
