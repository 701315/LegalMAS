  - id: pledge_co_ownership_consent_check
    name: "Залог: согласие сособственников предмета залога"
    description: >
      Проверяет режим собственности на предмет залога и наличие
      согласия всех сособственников на залог (ст. 349.1 ГК РФ).
    triggers:
      any:
        - pledge_contract
        - mortgage_pledge
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "общая собственность"
        - "долевая собственность"
        - "совместная собственность"
        - "согласие сособственников"
        - "согласие всех собственников"
        - "доля в праве"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)общ(ая|ей)\\s+собственност[ьи]|долев(ая|ой)\\s+собственност"
        - "(?i)совместн(ая|ой)\\s+собственност"
        - "(?i)согласи[ея]\\s+(сособственник|всех\\s+собственник)"
        - "(?i)доля\\s+в\\s+прав[еа]"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор залога или ипотеки.
        Проверяется только один вопрос: режим собственности на предмет
        залога и согласие сособственников.

        Нормативный ориентир:
        - ст. 349.1 ГК РФ — залог имущества, находящегося в общей
          собственности: требуется согласие всех сособственников,
          если иное не предусмотрено законом или соглашением
        - ст. 246 ГК РФ — распоряжение долей в праве долевой
          собственности
        - ст. 253 ГК РФ — владение, пользование и распоряжение
          имуществом в совместной собственности
        - ст. 7 ФЗ-102 — для ипотеки: согласие супруга при залоге
          имущества в совместной собственности
        - ст. 35 СК РФ — нотариальное согласие супруга на сделку
          с недвижимостью

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора.
        - Не оценивай серьёзность риска.
        - Различай три факта:
          - режим собственности на предмет залога (единоличная,
            долевая, совместная);
          - наличие согласия сособственников (всех или части);
          - сведения о сособственниках (наименования, доли).
        - Для ипотеки согласие супруга — частный случай согласия
          сособственника. Если в договоре уже есть отдельная оговорка
          о согласии супруга (покрывается другим чеком), фиксируй
          и здесь, но не дублируй оценку.
        - Если предмет залога принадлежит залогодателю на праве
          единоличной собственности — согласие сособственников
          не требуется.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Указан ли режим собственности на предмет залога.
        2. Есть ли согласие сособственников на залог.
        3. Приведены ли сведения о сособственниках.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Если условие не указано прямо — текстовое поле = "not_defined",
          display-поле = "Не установлено".
        4. Если текст есть, но надёжный вывод сделать нельзя —
          для internal-полей = "unclear", для display-полей = "Не удалось определить".
        5. Не используй "None", "null" и пустые строки.
        6. Все 6 ключей должны присутствовать в JSON-ответе.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — единоличная собственность:
        Фрагмент:
        "Залогодатель является единственным собственником предмета залога. Предмет залога не находится в общей собственности с третьими лицами."

        Ответ:
        {
          "ownership_regime_status": "sole",
          "ownership_regime_display": "Единоличная собственность залогодателя",
          "co_owner_consent_status": "not_required",
          "co_owner_consent_display": "Не требуется (единоличная собственность)",
          "co_owner_info_status": "not_defined",
          "co_owner_info_display": "Не установлено"
        }

        Пример 2 — долевая собственность с согласием:
        Фрагмент:
        "Предмет залога находится в долевой собственности: Залогодатель — 2/3, Иванов И.И. — 1/3. Иванов И.И. дал нотариально удостоверенное согласие на залог своей доли (согласие № 77 АВ 9876543 от 10.02.2026)."

        Ответ:
        {
          "ownership_regime_status": "shared_ownership",
          "ownership_regime_display": "Долевая собственность: Залогодатель — 2/3, Иванов И.И. — 1/3",
          "co_owner_consent_status": "present",
          "co_owner_consent_display": "Нотариальное согласие Иванова И.И. получено (№ 77 АВ 9876543 от 10.02.2026)",
          "co_owner_info_status": "present",
          "co_owner_info_display": "Иванов И.И., доля 1/3"
        }

        Пример 3 — совместная собственность супругов (ипотека):
        Фрагмент:
        "Предмет ипотеки находится в совместной собственности супругов. Согласие супруги Залогодателя удостоверено нотариально."

        Ответ:
        {
          "ownership_regime_status": "joint_ownership",
          "ownership_regime_display": "Совместная собственность супругов",
          "co_owner_consent_status": "present",
          "co_owner_consent_display": "Нотариальное согласие супруги получено",
          "co_owner_info_status": "unclear",
          "co_owner_info_display": "Не удалось определить (супруга не названа по имени)"
        }

        Пример 4 — режим собственности не указан:
        Фрагмент:
        "Залогодатель передаёт в залог нежилое помещение, расположенное по адресу: г. Москва, ул. Примерная, д. 1."

        Ответ:
        {
          "ownership_regime_status": "not_defined",
          "ownership_regime_display": "Не установлено",
          "co_owner_consent_status": "not_defined",
          "co_owner_consent_display": "Не установлено",
          "co_owner_info_status": "not_defined",
          "co_owner_info_display": "Не установлено"
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о режиме собственности.
        2. Найди прямую цитату о согласии сособственников.
        3. Найди прямую цитату о сособственниках.
        4. Если прямой цитаты нет — верни "not_defined".

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь РОВНО одним JSON-объектом без какого-либо дополнительного текста до или после, со всеми 6 ключами:
        {
          "ownership_regime_status": "<sole / shared_ownership / joint_ownership / unclear / not_defined>",
          "ownership_regime_display": "<описание режима / Не удалось определить / Не установлено>",
          "co_owner_consent_status": "<present / not_required / unclear / not_defined>",
          "co_owner_consent_display": "<описание согласия / Не требуется / Не удалось определить / Не установлено>",
          "co_owner_info_status": "<present / unclear / not_defined>",
          "co_owner_info_display": "<сведения о сособственниках / Не удалось определить / Не установлено>"
        }

        Верни РОВНО один JSON-объект со всеми 6 ключами без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.
      context_k: 8
