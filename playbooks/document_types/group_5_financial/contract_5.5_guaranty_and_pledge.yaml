           - "unclear" — есть обобщённые заверения о правах на имущество,
             но семейное положение прямо не упомянуто.

        1. spousal_consent_status — "present" / "not_required" / "unclear" /
           "not_defined".
           - "present" — прямо указано, что согласие супруга получено
             (нотариальное или письменное);
           - "not_required" — прямо указано, что залогодатель не состоит
