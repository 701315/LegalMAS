        <task>
        0. spousal_consent_presence:
           - "present" — в тексте есть конкретная информация о согласии
             супруга, режиме собственности на предмет ипотеки или
             заверении о семейном положении залогодателя;
           - "missing" — вопросы согласия супруга, режима собственности
