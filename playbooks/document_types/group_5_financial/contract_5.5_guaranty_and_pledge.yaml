        - "warranties"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 35
      max_snippet_length: 600

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 900
      compact_output: false  # [CONSIDER]

      presence_signal:
        field: "co_ownership_consent_presence"
        present_values:
          - present
        missing_values:
          - missing
        unclear_values:
          - unclear
      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора залога/ипотеки
        сведения о режиме собственности на предмет залога, о согласии
        сособственников и о самих сособственниках.
        Не анализируй оценку предмета, страхование, обращение взыскания
        и согласие супруга (если оно выделено в отдельную оговорку —
        фиксируй, но не дублируй оценку).
        </role>

        <context>
        {context}
        </context>

        <task>
        0. co_ownership_consent_presence:
           - "present" — в тексте указан режим собственности на предмет
             залога, есть согласие сособственников или сведения о них;
           - "missing" — режим собственности и вопросы сособственников
             в тексте не затрагиваются;
           - "unclear" — есть общие заверения о правах на предмет залога,
             но режим собственности не конкретизирован.

        1. ownership_regime_status — "sole" / "shared_ownership" /
           "joint_ownership" / "unclear" / "not_defined".
           - "sole" — прямо указано, что залогодатель является
             единственным собственником;
           - "shared_ownership" — долевая собственность (указаны доли);
           - "joint_ownership" — совместная собственность (без долей,
             обычно супруги);
           - "unclear" — режим упомянут, но не конкретизирован;
           - "not_defined" — режим собственности не указан.

        2. ownership_regime_display — человекочитаемое:
           "Единоличная собственность залогодателя";
           "Долевая собственность: <доли>";
           "Совместная собственность супругов";
           "Не удалось определить";
           "Не установлено".

        3. co_owner_consent_status — "present" / "not_required" /
           "unclear" / "not_defined".
           - "present" — согласие сособственников прямо получено;
           - "not_required" — единоличная собственность или прямо
             указано, что согласие не требуется;
           - "unclear" — упоминание согласия есть, но надёжно
             классифицировать нельзя;
           - "not_defined" — согласие не упомянуто.

        4. co_owner_consent_display — человекочитаемое:
           "Нотариальное согласие <имя> получено (<реквизиты>)";
           "Не требуется (единоличная собственность)";
           "Не удалось определить";
           "Не установлено".

        5. co_owner_info_status — "present" / "unclear" / "not_defined".

        6. co_owner_info_display — человекочитаемое:
           "<имена сособственников>, доли <...>";
           "Не удалось определить";
           "Не установлено".

        Все 7 ключей должны присутствовать в JSON-ответе.
        </task>

        <context_rules>
        - Перед остальными полями заполни co_ownership_consent_presence по правилу из пункта 0 task.
        - Агрегируй co_ownership_consent_presence по значению хотя бы
          одного из: ownership_regime_status, co_owner_consent_status,
          co_owner_info_status. Если ownership_regime_status ∈
          {"sole", "shared_ownership", "joint_ownership"} или
          co_owner_consent_status ∈ {"present", "not_required"} или
          co_owner_info_status = "present" → "present"; все три =
          "not_defined" → "missing"; иначе → "unclear".
        - Используй только текст договора из <context>. Не подставляй
          нормы закона.
        - Не делай предположений.
        - Если в <context> попали нерелевантные фрагменты — игнорируй их.
        - Если фрагменты противоречат друг другу и надёжный вывод сделать
          нельзя — верни "unclear" для internal-полей, "Не удалось
          определить" для display-полей.
        - Различай: режим собственности / согласие сособственников /
          сведения о сособственниках — это три разных факта.
        - Если предмет залога в единоличной собственности →
          co_owner_consent_status = "not_required".
        - Ссылка на выписку из ЕГРН или свидетельство о собственности
          в приложении = "present" для ownership_regime_status (внешний
          документ учитывается).
        - Не используй "None", "null" и пустые строки.
        - Соблюдай точное соответствие имён ключей схеме полей.
        </context_rules>

        <edge_cases>
        1. «Залогодатель является единственным собственником» →
           ownership_regime_status = "sole",
           co_owner_consent_status = "not_required".
        2. Залог доли в праве долевой собственности →
           ownership_regime_status = "shared_ownership",
           co_owner_consent_status зависит от текста (может быть
           "present", "not_defined" или "not_required" если заложен
           весь предмет).
        3. Режим собственности не указан, но есть заверение «Залогодатель
           гарантирует отсутствие прав третьих лиц на предмет залога» →
           ownership_regime_status = "unclear" (заверение не равно
           указанию режима), co_ownership_consent_presence = "unclear".
        4. Совместная собственность супругов с нотариальным согласием
           супруги → ownership_regime_status = "joint_ownership",
           co_owner_consent_status = "present".
        </edge_cases>

        <output_expectations>
        - Верни РОВНО один JSON-объект со всеми 7 ключами без какого-либо
          дополнительного текста до или после.
        - Начни ответ сразу с открывающей фигурной скобки и закончи
          закрывающей.
        - НЕ пиши Markdown, списки, код-фенсы.
        - Ответ должен быть валидным JSON, пригодным для парсинга через
          json.loads без предварительной обработки.
        - Технический формат JSON (value / confidence / location) задан
          отдельным контрактом — соблюдай его, но не описывай здесь.
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "co_ownership_consent_presence"
          type: "string"
          presentation: "signal"
          allowed_values: ["present", "missing", "unclear"]
          description: "Сводный признак наличия в договоре условий о режиме собственности и согласии сособственников. Внутреннее агрегатное signal-поле."
          required: true
          display_in_grid: false
          risk_weight: "info"
        - name: "ownership_regime_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["sole", "shared_ownership", "joint_ownership", "unclear", "not_defined"]
          description: "Режим собственности на предмет залога (внутренний enum)."
          required: true
          display_in_grid: false
          risk_weight: "high"
        - name: "ownership_regime_display"
          type: "string"
          presentation: "fact"
          label: "Режим собственности на предмет залога"
          description: >
            Человекочитаемое описание режима собственности. Fallback: "Не установлено" / "Не удалось определить".
          required: true
          display_in_grid: true
          display_priority: 1
        - name: "co_owner_consent_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["present", "not_required", "unclear", "not_defined"]
          description: "Согласие сособственников на залог (внутренний признак). Внутреннее enum-поле."
          required: true
          display_in_grid: false
          risk_weight: "high"
        - name: "co_owner_consent_display"
          type: "string"
          presentation: "fact"
          label: "Согласие сособственников"
          description: >
            Человекочитаемое описание согласия сособственников. Fallback: "Не установлено" / "Не удалось определить".
          required: true
          display_in_grid: true
          display_priority: 2
        - name: "co_owner_info_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["present", "unclear", "not_defined"]
          description: "Сведения о сособственниках (внутренний признак). Внутреннее enum-поле."
          required: true
          display_in_grid: false
          risk_weight: "medium"
        - name: "co_owner_info_display"
          type: "string"
          presentation: "fact"
          label: "Сособственники предмета залога"
          description: >
            Человекочитаемые сведения о сособственниках. Fallback: "Не установлено" / "Не удалось определить".
          required: true
          display_in_grid: true
          display_priority: 3
      store_payload: true

# ════════════════════════════════════════════════════════════════════════════
# БЛОК 5: DD_REQUEST_TEMPLATES
# Читается: DDRequestTemplateLoader
# ════════════════════════════════════════════════════════════════════════════

dd_request_templates:
  security_subject_extraction:
    text: >
      Просим предоставить по {doc_names}: базовую структуру обеспечительной сделки —
      тип обеспечения (поручительство/залог/ипотека), стороны, основное обеспечиваемое
      обязательство, объем ответственности или предмет залога, сумму обеспечиваемого
      обязательства и порядок обращения взыскания.
    addressee: "Кредитор / Юридический советник"

  secured_obligation_reference:
    text: >
      Просим уточнить по {doc_names}: какое именно обязательство обеспечивается,
      указать номер, дату, стороны, сумму, срок исполнения и приложить основной договор.
    addressee: "Кредитор / Должник"

  no_secured_obligation_reference:
    text: >
      В {doc_names} не выявлена достаточная ссылка на основное обязательство.
      Просим срочно конкретизировать обеспечиваемое обязательство, иначе
      обеспечительная конструкция находится под риском недействительности/
      неопределенности.
    addressee: "Юридический советник"

  guaranty_liability_scope_check:
    text: >
      Просим предоставить по {doc_names}: точное описание объема ответственности
      поручителя, указать, является ли она солидарной или субсидиарной, есть ли
      лимит суммы и включает ли ответственность проценты, неустойку и судебные
      расходы.
    addressee: "Кредитор / Поручитель"

  guarantor_liability_scope:
    text: >
      Просим уточнить в {doc_names}: пределы ответственности поручителя,
      ее вид (солидарная/субсидиарная) и максимальную сумму поручительства.
    addressee: "Юридический советник"

  guaranty_change_and_termination_check:
    text: >
      Просим предоставить по {doc_names}: условия изменения основного обязательства,
      порядок получения согласия поручителя, срок поручительства, основания его
      прекращения и правовые последствия изменения долга без согласия поручителя.
    addressee: "Кредитор / Поручитель"

  guarantor_consent_to_changes:
    text: >
      Просим уточнить в {doc_names}: требуется ли отдельное согласие поручителя
      на изменение основного обязательства, и исключить чрезмерно широкие формулы
      о согласии на любые будущие изменения.
    addressee: "Юридический советник"

  blanket_guarantor_consent_risk:
    text: >
      В {doc_names} выявлен риск бланкетного согласия поручителя на любые будущие
      изменения долга. Просим скорректировать договор, ограничив согласие
      конкретными параметрами либо введя обязанность отдельного письменного
      согласования.
    addressee: "Юридический советник / Поручитель"

  guarantor_default_notice_and_subrogation_check:
    text: >
      Просим уточнить по {doc_names}: обязан ли кредитор уведомлять поручителя
      о дефолте должника, какие документы передаются поручителю после исполнения
      обязательства, и как реализуются регрессные/суброгационные права поручителя.
    addressee: "Кредитор / Поручитель"

  guarantor_notification_of_default:
    text: >
      Просим включить/уточнить в {doc_names}: обязанность кредитора уведомлять
      поручителя о просрочке/неисполнении должником обязательства и срок такого
      уведомления.
    addressee: "Юридический советник"

  guarantor_subrogation_rights:
    text: >
      Просим уточнить в {doc_names}: порядок перехода к поручителю прав кредитора
      после исполнения обязательства, включая передачу документов, обеспечений
      и доказательств задолженности.
    addressee: "Кредитор / Юридический советник"

  pledge_subject_and_valuation_check:
    text: >
      Просим предоставить по {doc_names}: точное описание предмета залога,
      документы, индивидуализирующие имущество, оценку предмета залога
      и указание, у какой стороны находится имущество.
    addressee: "Залогодатель / Залогодержатель"

  pledged_property_description:
    text: >
      Просим уточнить в {doc_names}: предмет залога, его идентификационные признаки,
      правоустанавливающие документы, а для недвижимости — кадастровые данные
      и выписку ЕГРН.
    addressee: "Залогодатель"

  pledge_valuation:
    text: >
      Просим предоставить по {doc_names}: оценку предмета залога, отчет оценщика
      (если есть), методику определения стоимости и дату, на которую определена
      оценка.
    addressee: "Залогодатель / Залогодержатель"

  pledge_subject_location:
    text: >
      Просим уточнить в {doc_names}: у какой стороны находится предмет залога,
      кто несет расходы на его содержание и кто отвечает за риск случайной гибели/
      повреждения.
    addressee: "Обе стороны"

  pledge_enforcement_check:
    text: >
      Просим уточнить по {doc_names}: применяется ли судебный или внесудебный
      порядок обращения взыскания, каков способ реализации предмета залога,
      как и в какие сроки уведомляется залогодатель, и как определяется начальная
      цена реализации.
    addressee: "Залогодержатель / Юридический советник"

  judicial_enforcement_requirement:
    text: >
      Просим уточнить в {doc_names}: порядок обращения взыскания на предмет залога
      и правовое основание для внесудебной реализации, если она предусмотрена.
    addressee: "Юридический советник"

  out_of_court_enforcement_without_procedure:
    text: >
      В {doc_names} выявлен риск внесудебного обращения взыскания без достаточной
      процедуры. Просим детализировать уведомления, оценку, способ реализации,
      сроки и порядок распределения выручки.
    addressee: "Юридический советник / Залогодержатель"

  mortgage_registration_check:
    text: >
      По {doc_names} (ипотека/залог недвижимости) просим предоставить: порядок
      государственной регистрации, комплект документов для Росреестра,
      распределение расходов и сведения о закладной, если она оформляется.
    addressee: "Залогодержатель / Залогодатель"

  mortgage_registration_obligation:
    text: >
      Просим включить/уточнить в {doc_names}: механизм государственной регистрации
      ипотеки, сторону, ответственную за подачу документов, и последствия уклонения
      от регистрации.
    addressee: "Юридический советник"

  mortgage_without_registration_logic:
    text: >
      В {doc_names} выявлено отсутствие достаточного механизма регистрации ипотеки.
      Просим срочно уточнить порядок регистрации в ЕГРН и комплект регистрационных
      документов.
    addressee: "Юридический советник / Залогодержатель"

  pledge_no_encumbrances:
    text: >
      Просим предоставить по {doc_names}: заверения об отсутствии иных обременений,
      подтверждение отсутствия предыдущих залогов и прав третьих лиц, а для
      недвижимости — актуальную выписку ЕГРН.
    addressee: "Залогодатель"

  subsequent_pledge_control:
    text: >
      Просим уточнить в {doc_names}: допускается ли последующий залог, требуется ли
      согласие текущего залогодержателя и каков порядок раскрытия информации
      о уже существующих обременениях.
    addressee: "Залогодержатель / Юридический советник"

  pledge_insurance_and_bankruptcy_check:
    text: >
      Просим предоставить по {doc_names}: условия страхования предмета залога,
      назначение выгодоприобретателя, страховую сумму, а также заверения сторон
      об отсутствии признаков банкротства и иных оснований для оспаривания сделки.
    addressee: "Залогодатель / Залогодержатель"

  pledge_insurance_obligation:
    text: >
      Просим уточнить в {doc_names}: обязанность страхования предмета залога,
      кто оплачивает страховку, кто назначается выгодоприобретателем и как
      используется страховое возмещение.
    addressee: "Залогодатель / Юридический советник"

  pledgor_right_to_use_property:
    text: >
      Просим уточнить по {doc_names}: сохраняет ли залогодатель право владения
      и пользования предметом залога, вправе ли извлекать из него доходы и какие
      ограничения при этом действуют.
    addressee: "Залогодатель / Юридический советник"

  bankruptcy_risks_awareness:
    text: >
      Просим предоставить по {doc_names}: заверения об отсутствии признаков
      банкротства, сведения о финансовом состоянии должника/залогодателя/
      поручителя, а также правовое заключение о рисках оспаривания обеспечительной
      сделки.
    addressee: "Юридический советник / Финансовый консультант"

  guaranty_term_expiry_risk:
    text: >
      ВНИМАНИЕ: в {doc_names} не указан срок поручительства. По ст. 367 п. 6 ГК РФ
      поручительство прекращается через 1 год с момента наступления срока исполнения
      основного обязательства. Просим явно установить срок поручительства.
    addressee: "Кредитор / Юридический советник"

  pledge_registration_movable_required:
    text: >
      По {doc_names} (залог движимого имущества) просим обеспечить регистрацию
      уведомления о залоге в реестре нотариата (ст. 339.1 п. 4 ГК РФ).
      Без уведомления залог не противопоставим третьим лицам.
    addressee: "Залогодержатель / Нотариус"

  consumer_pledge_sole_dwelling:
    text: >
      По {doc_names} — залог жилого помещения. Просим подтвердить: (а) не является ли
      жильё единственным для залогодателя; (б) если является — оформлена ли ипотека
      по ФЗ-102 (без неё обращение взыскания невозможно по ст. 446 ГПК РФ).
    addressee: "Залогодатель / Юридический советник"

  pledge_priority_and_ranking:
    text: >
      По {doc_names} просим уточнить: (а) старшинство залога; (б) наличие
      предшествующих залогов; (в) ссылку на межкредиторское соглашение.
    addressee: "Залогодержатель / Юридический советник"

  guarantor_financial_capacity:
    text: >
      По {doc_names} просим предоставить: (а) заверения о финансовом состоянии
      поручителя; (б) обязательство предоставлять отчётность; (в) финансовые
      ковенанты.
    addressee: "Поручитель / Кредитор"

  pledge_covenants_check:
    text: >
      По {doc_names} просим согласовать ковенанты залогодателя: (а) запрет
      отчуждения/обременения; (б) право залогодержателя на осмотр; (в) обязанность
      содержания и уведомления о рисках.
    addressee: "Залогодатель / Залогодержатель"

  cross_default_acceleration:
    text: >
      По {doc_names} просим согласовать: (а) кросс-дефолт; (б) условия досрочного
      востребования; (в) порядок уведомления.
    addressee: "Юридический советник"

  dispute_resolution_security:
    text: >
      Просим согласовать по {doc_names} порядок разрешения споров: претензионный
      порядок, подсудность, арбитраж.
    addressee: "Юридический советник"

  force_majeure_security:
    text: >
      Просим уточнить для {doc_names} условия о форс-мажоре.
    addressee: "Юридический советник"

  governing_law_security:
    text: >
      Просим указать применимое право для {doc_names}.
    addressee: "Юридический советник"

  confidentiality_security:
    text: >
      Просим согласовать для {doc_names} условия конфиденциальности.
    addressee: "Юридический советник"

  notary_requirement:
    text: >
      По {doc_names} (залог доли в ООО) — требуется нотариальное удостоверение.
      Просим согласовать нотариуса, дату, комплект документов.
    addressee: "Обе стороны / Нотариус"

  guaranty_term_and_termination:
    text: >
      Просим уточнить в {doc_names}: срок поручительства и основания прекращения.
    addressee: "Юридический советник"

  _default:
    text: >
      Просим предоставить дополнительную информацию по вопросу «{check_name}»
      применительно к {doc_names}.
    addressee: "Юридический советник"

