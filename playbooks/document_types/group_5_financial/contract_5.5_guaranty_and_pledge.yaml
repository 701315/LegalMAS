        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор ипотеки.
        Проверяется только один вопрос: согласие супруга залогодателя.

        Нормативный ориентир:
        - ст. 35 СК РФ — владение, пользование и распоряжение общим
          имуществом супругов; для сделок с недвижимостью требуется
          нотариально удостоверенное согласие супруга
        - ст. 7 ФЗ-102 — участие супруга залогодателя; при ипотеке
