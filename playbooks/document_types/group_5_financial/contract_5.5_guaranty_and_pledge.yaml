          требуется согласие супруга, если иное не предусмотрено
          брачным договором
        - ст. 34, 36, 42 СК РФ — совместная собственность, брачный договор,
          режим раздельной собственности
        - п. 3 ст. 35 СК РФ — последствия отсутствия нотариального согласия
          (сделка может быть признана недействительной в течение года)

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора.
        - Не оценивай серьёзность риска.
