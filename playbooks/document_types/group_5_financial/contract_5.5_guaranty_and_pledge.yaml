  - id: guaranty_term_and_claim_period_check
    name: "Поручительство: срок и срок предъявления требований"
    description: >
      Проверяет установление срока поручительства, способ его исчисления
      и срок предъявления требований кредитора к поручителю (п. 4 ст. 367 ГК РФ).
    triggers:
      any:
        - guaranty_contract
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "срок поручительства"
        - "поручительство действует до"
        - "поручительство прекращается"
        - "предъявление требований к поручителю"
        - "срок предъявления требований"
        - "в течение одного года"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)срок\\s+поручительств|поручительств.{0,20}действу"
        - "(?i)предъявлени.{0,15}требован.{0,15}поручител"
        - "(?i)поручительств.{0,20}прекраща"
        - "(?i)в\\s+течени[ея]\\s+\\d+\\s+(год|лет|месяц)"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор поручительства по § 5 Главы 23 ГК РФ.
        Проверяется только один вопрос: срок поручительства и срок
        предъявления требований кредитора.

        Нормативный ориентир:
        - ст. 367 п. 4 ГК РФ — если срок поручительства не установлен,
          оно прекращается, если кредитор в течение одного года со дня
          наступления срока исполнения обеспеченного обязательства
          не предъявит иск к поручителю; если срок исполнения основного
          обязательства не указан — поручительство прекращается через
          два года со дня заключения договора поручительства
        - ст. 367 п. 6 ГК РФ — поручительство прекращается по истечении
          указанного в договоре срока
        - ст. 367 п. 1 ГК РФ — поручительство прекращается с прекращением
          обеспеченного им обязательства
        - Постановление Пленума ВАС РФ от 12.07.2012 № 42 (п. 33–35) —
          порядок исчисления сроков поручительства

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора,
          а чего прямо нет.
        - Не оценивай серьёзность риска и не рассчитывай сроки.
        - Не подставляй нормы закона вместо текста договора. Если срок
          поручительства прямо не указан — guaranty_term_status =
          "not_defined". Не пиши «1 год по ст. 367 п. 4 ГК РФ» как
          present — это закон, а не текст договора.
        - Различай три факта:
          - срок поручительства (период, в течение которого действует
            поручительство);
          - срок предъявления требований (период, в течение которого
            кредитор должен предъявить требование поручителю);
          - способ исчисления срока (календарная дата, период, привязка
            к основному обязательству).
        - В договорах часто срок поручительства и срок предъявления
          требований совпадают или формулируются одним предложением.
          Если формулировка покрывает оба аспекта — отражай в обоих полях.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Установлен ли срок поручительства и какова его формулировка.
        2. Установлен ли срок предъявления требований кредитора
          к поручителю.
        3. Каким способом исчисляется срок (календарная дата, период,
          привязка к основному обязательству).

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Если условие не указано прямо — текстовое поле = "not_defined",
          display-поле = "Не установлено".
        4. Если текст есть, но надёжный вывод сделать нельзя —
          для internal-полей = "unclear", для display-полей = "Не удалось определить".
        5. Не используй "None", "null" и пустые строки.
        6. Все 6 ключей должны присутствовать в JSON-ответе.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — полный срок с привязкой к основному обязательству:
        Фрагмент:
        "Поручительство действует в течение всего срока действия Основного договора, а также в течение трёх лет после наступления срока исполнения обеспеченного обязательства. Кредитор вправе предъявить требование к Поручителю в течение срока действия настоящего договора поручительства."

        Ответ:
        {
          "guaranty_term_status": "present",
          "guaranty_term_display": "Срок действия Основного договора + 3 года после наступления срока исполнения",
          "claim_period_status": "present",
          "claim_period_display": "В течение срока действия договора поручительства",
          "term_calculation_method": "linked_to_obligation",
          "term_calculation_display": "Привязка к сроку Основного договора и сроку исполнения обязательства"
        }

        Пример 2 — фиксированная календарная дата:
        Фрагмент:
        "Настоящее поручительство действует до 31 декабря 2027 года включительно."

        Ответ:
        {
          "guaranty_term_status": "present",
          "guaranty_term_display": "До 31.12.2027 включительно",
          "claim_period_status": "not_defined",
          "claim_period_display": "Не установлено",
          "term_calculation_method": "fixed_date",
          "term_calculation_display": "Фиксированная календарная дата"
        }

        Пример 3 — срок не указан:
        Фрагмент:
        "Поручитель обязуется отвечать перед Кредитором за исполнение Должником обязательств по Кредитному договору № 123 от 01.01.2025."

        Ответ:
        {
          "guaranty_term_status": "not_defined",
          "guaranty_term_display": "Не установлено",
          "claim_period_status": "not_defined",
          "claim_period_display": "Не установлено",
          "term_calculation_method": "not_defined",
          "term_calculation_display": "Не установлено"
        }

        Пример 4 — неоднозначная формулировка:
        Фрагмент:
        "Поручительство действует до полного исполнения Должником своих обязательств по Основному договору."

        Ответ:
        {
          "guaranty_term_status": "present",
          "guaranty_term_display": "До полного исполнения обязательств Должником",
          "claim_period_status": "unclear",
          "claim_period_display": "Не удалось определить (срок предъявления требований не конкретизирован отдельно)",
          "term_calculation_method": "linked_to_obligation",
          "term_calculation_display": "Привязка к полному исполнению основного обязательства"
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о сроке поручительства.
        2. Найди прямую цитату о сроке предъявления требований.
        3. Определи способ исчисления срока.
        4. Если прямой цитаты нет — верни "not_defined".

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь РОВНО одним JSON-объектом без какого-либо дополнительного текста до или после, со всеми 6 ключами:
        {
          "guaranty_term_status": "<present / unclear / not_defined>",
          "guaranty_term_display": "<описание срока / Не удалось определить / Не установлено>",
          "claim_period_status": "<present / unclear / not_defined>",
          "claim_period_display": "<описание срока предъявления / Не удалось определить / Не установлено>",
          "term_calculation_method": "<fixed_date / period / linked_to_obligation / unclear / not_defined>",
          "term_calculation_display": "<описание способа исчисления / Не удалось определить / Не установлено>"
        }

        Верни РОВНО один JSON-объект со всеми 6 ключами без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.
