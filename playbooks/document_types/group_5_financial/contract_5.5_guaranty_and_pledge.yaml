      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора ипотеки сведения
        о закладной: составляется ли она, в какой форме, кто является
        её первоначальным держателем.
        Не анализируй предмет ипотеки, оценку и порядок взыскания.
        </role>

        <context>
        {context}
        </context>

        <task>
        0. zakladnaya_presence:
           - "present" — в тексте прямо указано, что закладная
             составляется или что её составление не предусмотрено,
             либо есть сведения о форме/держателе закладной;
           - "missing" — закладная в тексте не упоминается;
           - "unclear" — есть общие отсылки к оформлению залога,
             но закладная прямо не названа.

        1. zakladnaya_status — "present" / "not_provided" / "unclear" /
           "not_defined".
           - "present" — прямо указано, что закладная составляется;
           - "not_provided" — прямо указано, что составление закладной
             не предусмотрено;
           - "unclear" — упоминание есть, но надёжно классифицировать
             нельзя;
           - "not_defined" — упоминания закладной нет.

        2. zakladnaya_display — человекочитаемое:
           "Закладная составляется";
           "Составление закладной прямо не предусмотрено";
           "Не удалось определить";
           "Не установлено".

        3. zakladnaya_form — "documentary" / "electronic" / "unclear" /
           "not_defined".

        4. zakladnaya_form_display — человекочитаемое:
           "Документарная" / "Электронная" /
           "Не удалось определить (форма не конкретизирована)" /
           "Не установлено".

        5. zakladnaya_holder_status — "present" / "unclear" /
           "not_defined".

        6. zakladnaya_holder_display — человекочитаемое:
           "<Залогодержатель — наименование>"; "<иное лицо>";
           "Не удалось определить";
           "Не установлено".

        Все 7 ключей должны присутствовать в JSON-ответе.
        </task>

        <context_rules>
        - Перед остальными полями заполни zakladnaya_presence по правилу из пункта 0 task.
        - Агрегируй zakladnaya_presence по значению zakladnaya_status:
          если ∈ {"present", "not_provided"} → "present"; если =
          "not_defined" и zakladnaya_form = "not_defined" и
          zakladnaya_holder_status = "not_defined" → "missing";
          иначе → "unclear".
        - Используй только текст договора из <context>. Не подставляй
          нормы закона.
        - Не делай предположений.
        - Если в <context> попали нерелевантные фрагменты — игнорируй их.
        - Если фрагменты противоречат друг другу и надёжный вывод сделать
          нельзя — верни "unclear" для internal-полей, "Не удалось
          определить" для display-полей.
        - Отсутствие указания на закладную ≠ отсутствие закладной: для
          ипотеки в силу закона закладная может быть составлена
          в дальнейшем. Фиксируй только текст.
        - Различай: составление закладной / форму закладной / держателя
          закладной — это разные факты, не смешивай.
        - «Закладная не составляется» (прямой запрет) ≠ отсутствие
          упоминания. Первое = "not_provided", второе = "not_defined".
        - Не используй "None", "null" и пустые строки.
        - Соблюдай точное соответствие имён ключей схеме полей.
        </context_rules>

        <edge_cases>
        1. «Составление закладной настоящим договором не предусмотрено»
           (ипотека в силу закона) → zakladnaya_status = "not_provided",
           zakladnaya_presence = "present" (явное указание есть).
        2. «Стороны договорились о необходимости оформления закладной
           в порядке, установленном законодательством» →
           zakladnaya_status = "present", zakladnaya_form = "unclear"
           (форма не конкретизирована).
        3. Закладная не упоминается вообще → zakladnaya_presence =
           "missing", все status = "not_defined".
        4. Электронная закладная упомянута, держатель не указан →
           zakladnaya_status = "present", zakladnaya_form = "electronic",
           zakladnaya_holder_status = "not_defined".
        </edge_cases>

        <output_expectations>
        - Верни РОВНО один JSON-объект со всеми 7 ключами без какого-либо
          дополнительного текста до или после.
        - Начни ответ сразу с открывающей фигурной скобки и закончи
          закрывающей.
        - НЕ пиши Markdown, списки, код-фенсы.
        - Ответ должен быть валидным JSON, пригодным для парсинга через
          json.loads без предварительной обработки.
        - Технический формат JSON (value / confidence / location) задан
          отдельным контрактом — соблюдай его, но не описывай здесь.
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

