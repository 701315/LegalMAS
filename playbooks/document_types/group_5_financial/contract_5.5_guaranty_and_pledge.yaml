      max_snippet_length: 600

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 850
      compact_output: false  # [CONSIDER]

      presence_signal:
        field: "disposal_restrictions_presence"
        present_values:
          - present
        missing_values:
          - missing
        unclear_values:
          - unclear
      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора залога/ипотеки
        сведения об ограничениях распоряжения предметом залога: продажа,
        аренда/пользование, замена.
        Не анализируй порядок взыскания, страхование и оценку.
        </role>

        <context>
        {context}
        </context>

        <task>
        0. disposal_restrictions_presence:
           - "present" — в тексте есть хотя бы одно прямое ограничение
             на распоряжение предметом залога (отчуждение, аренда,
             замена) или правила замены/восполнения;
           - "missing" — ограничения распоряжения и правила замены
             в тексте не упоминаются;
           - "unclear" — есть общие формулировки о сохранности или
             стоимости, но конкретные ограничения не ясны.

        1. disposal_restriction_status — "present" / "not_defined".
           Есть ли прямое ограничение на продажу/отчуждение.
           - "present" — прямой запрет или ограничение отчуждения
             (включая запрет без согласия залогодержателя);
           - "not_defined" — ограничение прямо не установлено
             (включая случаи, когда отчуждение прямо разрешено).

        2. disposal_restriction_display — человекочитаемое:
           "<описание запрета>";
           "Не установлено (отчуждение прямо разрешено в порядке
           обычной деятельности)";
           "Не удалось определить (обобщённая формулировка без прямой
           ссылки на отчуждение)";
           "Не установлено".

        3. use_and_lease_restriction_status — "present" / "not_defined".
           Есть ли прямое ограничение на аренду / пользование / ссуду.

        4. use_and_lease_restriction_display — человекочитаемое:
           "<описание ограничения>";
           "Не удалось определить";
           "Не установлено".

        5. substitution_rules_status — "present" / "not_defined".
           Есть ли правила замены предмета залога.

        6. substitution_rules_display — человекочитаемое:
           "<описание правил замены / восполнения>";
           "Не удалось определить";
           "Не установлено".

        Все 7 ключей должны присутствовать в JSON-ответе.
        </task>

        <context_rules>
        - Перед остальными полями заполни disposal_restrictions_presence по правилу из пункта 0 task.
        - Агрегируй disposal_restrictions_presence по значению хотя бы
          одного из: disposal_restriction_status,
          use_and_lease_restriction_status, substitution_rules_status.
          Если хотя бы одно = "present" → "present"; все три =
          "not_defined" → "missing"; иначе → "unclear".
        - Используй только текст договора из <context>. Не подставляй
          нормы закона.
        - Не делай предположений.
        - Если в <context> попали нерелевантные фрагменты — игнорируй их.
        - Если фрагменты противоречат друг другу и надёжный вывод сделать
          нельзя — status = "not_defined", display = "Не удалось
          определить".
        - Не подставляй «право следования по ст. 353 ГК РФ» как present —
          оно действует в силу закона, а не по тексту договора.
        - Различай: ограничение продажи / ограничение аренды / правила
          замены — это разные факты, не смешивай.
        - Прямое разрешение отчуждения (товары в обороте) ≠ ограничение.
          Если отчуждение прямо разрешено — disposal_restriction_status =
          "not_defined".
        - Ссылка на приложение или спецификацию с ограничениями =
          "present" (внешний документ учитывается).
        - Не используй "None", "null" и пустые строки.
        - Соблюдай точное соответствие имён ключей схеме полей.
        </context_rules>

        <edge_cases>
        1. Товары в обороте: «Залогодатель вправе отчуждать предмет залога
           в порядке обычной хозяйственной деятельности с восполнением
           запасов» → disposal_restriction_status = "not_defined"
           (разрешение ≠ ограничение), substitution_rules_status =
           "present" (восполнение = правило замены).
        2. Общая фраза «не совершать действий, способных повлечь уменьшение
           стоимости предмета залога» без конкретики → все status =
           "not_defined", display = "Не удалось определить (обобщённая
           формулировка)".
        3. Запрет отчуждения есть, но аренда прямо разрешена →
           disposal_restriction_status = "present",
           use_and_lease_restriction_status = "not_defined".
        4. Ограничения вынесены в отдельное приложение, на которое есть
           ссылка в тексте → disposal_restriction_status = "present",
           в display укажи ссылку на приложение.
        </edge_cases>

        <output_expectations>
        - Верни РОВНО один JSON-объект со всеми 7 ключами без какого-либо
          дополнительного текста до или после.
        - Начни ответ сразу с открывающей фигурной скобки и закончи
          закрывающей.
        - НЕ пиши Markdown, списки, код-фенсы.
        - Ответ должен быть валидным JSON, пригодным для парсинга через
          json.loads без предварительной обработки.
        - Технический формат JSON (value / confidence / location) задан
          отдельным контрактом — соблюдай его, но не описывай здесь.
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

