doc_type_checks:

  - id: "secured_obligation_reference"
    name: "Ссылка на обеспечиваемое обязательство"
    description: "Проверяет наличие идентификации основного обязательства: стороны, дата, номер, сумма, срок"
    legal_base: "ст. 329, 339, 361, 432 ГК РФ"
    severity: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
      keywords:
        - "основное обязательство"
        - "обеспечиваемое обязательство"
        - "кредитный договор"
        - "договор займа"
        - "договор поставки"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)основн(ое|ого)\\s+обязательств|обеспечиваем(ое|ого)\\s+обязательств"
        - "(?i)договор\\s*№?\\s*[A-ZА-Я0-9\\-\\/]+"

