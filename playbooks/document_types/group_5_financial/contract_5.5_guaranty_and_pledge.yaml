  - id: pledge_subsequent_and_priority_check
    name: "Залог: последующий залог и старшинство"
    description: >
      Проверяет, является ли залог последующим, есть ли согласие
      предыдущего залогодержателя и как определяется старшинство.
    triggers:
      any:
        - pledge_contract
        - mortgage_pledge
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "последующий залог"
        - "последующая ипотека"
        - "старший залог"
        - "предыдущий залогодержатель"
        - "очерёдность"
        - "старшинство"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)последующ(ий|ая|его|ей)\\s+(залог|ипотек)"
        - "(?i)предыдущ(ий|его|ей)\\s+залогодержател"
        - "(?i)очерёдност|старшинств"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор залога или ипотеки.
        Проверяется только один вопрос: последующий залог и старшинство.

        Нормативный ориентир:
        - ст. 342 ГК РФ — последующий залог: допускается, если не запрещён
          предшествующим договором залога
        - ст. 342.1 ГК РФ — очерёдность удовлетворения требований
          залогодержателей
        - ст. 335.1 ГК РФ — сопоручительство и очерёдность
        - ст. 43, 46 ФЗ-102 — последующая ипотека; старшинство
          определяется по дате регистрации в ЕГРН

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора,
          а чего прямо нет.
        - Не оценивай серьёзность риска.
        - Не подставляй нормы закона вместо текста договора. Отсутствие
          указания на последующий характер залога ≠ отсутствие последующего
          залога: он мог быть установлен вне текста. Фиксируй только текст.
        - Различай три факта:
          - прямое указание на последующий характер залога;
          - наличие согласия предыдущего залогодержателя;
          - сведения о предыдущем залогодержателе (наименование, договор,
            регистрационная запись).
        - Если предыдущий залогодержатель прямо упомянут — отражай его
          в display. Если нет — не выдумывай.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Прямо ли указано, что залог является последующим
          (или наоборот, что залог первый).
        2. Есть ли указание на согласие предыдущего залогодержателя.
        3. Приведены ли сведения о предыдущем залогодержателе
          и/или о предшествующем залоге.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Если условие не указано прямо — текстовое поле = "not_defined",
          display-поле = "Не установлено".
        4. Если текст есть, но надёжный вывод сделать нельзя —
          для internal-полей = "unclear", для display-полей = "Не удалось определить".
        5. Не используй "None", "null" и пустые строки.
        6. Все 6 ключей должны присутствовать в JSON-ответе.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — прямо указан последующий залог со сведениями о предыдущем залогодержателе:
        Фрагмент:
        "Предмет залога является предметом последующего залога. Предыдущий залогодержатель — ПАО «Банк Пример» по договору залога № З-2024/115 от 12.09.2024. Залогодатель подтверждает наличие письменного согласия предыдущего залогодержателя на заключение настоящего договора."

        Ответ:
        {
          "subsequent_pledge_status": "present",
          "subsequent_pledge_display": "Последующий залог",
          "prior_pledgee_consent_status": "present",
          "prior_pledgee_consent_display": "Согласие предыдущего залогодержателя получено (письменно)",
          "prior_pledgee_info_status": "present",
          "prior_pledgee_info_display": "ПАО «Банк Пример»; договор залога № З-2024/115 от 12.09.2024"
        }

        Пример 2 — прямо указан первый залог:
        Фрагмент:
        "Предмет залога не обременён залогом третьих лиц. Настоящий договор является первым залогом предмета залога."

        Ответ:
        {
          "subsequent_pledge_status": "first_pledge",
          "subsequent_pledge_display": "Первый залог (предмет залога не обременён залогом третьих лиц)",
          "prior_pledgee_consent_status": "not_required",
          "prior_pledgee_consent_display": "Не требуется (залог первый)",
          "prior_pledgee_info_status": "not_defined",
          "prior_pledgee_info_display": "Не установлено"
        }

        Пример 3 — прямое указание на последующий залог без сведений о предыдущем залогодержателе:
        Фрагмент:
        "Предмет залога предоставляется в последующий залог."

        Ответ:
        {
          "subsequent_pledge_status": "present",
          "subsequent_pledge_display": "Последующий залог",
          "prior_pledgee_consent_status": "not_defined",
          "prior_pledgee_consent_display": "Не установлено",
          "prior_pledgee_info_status": "not_defined",
          "prior_pledgee_info_display": "Не установлено"
        }

        Пример 4 — текст есть, но надёжный вывод сделать нельзя:
        Фрагмент:
        "Залогодатель подтверждает, что предмет залога не имеет обременений, способных повлиять на права Залогодержателя."

        Ответ:
        {
          "subsequent_pledge_status": "unclear",
          "subsequent_pledge_display": "Не удалось определить (формулировка не различает первый и последующий залог)",
          "prior_pledgee_consent_status": "not_defined",
          "prior_pledgee_consent_display": "Не установлено",
          "prior_pledgee_info_status": "not_defined",
          "prior_pledgee_info_display": "Не установлено"
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о характере залога (первый / последующий).
        2. Найди прямую цитату о согласии предыдущего залогодержателя.
        3. Найди прямую цитату о предыдущем залогодержателе.
        4. Если прямой цитаты нет — верни "not_defined".

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь РОВНО одним JSON-объектом без какого-либо дополнительного текста до или после, со всеми 6 ключами:
        {
          "subsequent_pledge_status": "<first_pledge / present / unclear / not_defined>",
          "subsequent_pledge_display": "<Первый залог (…) / Последующий залог / Не удалось определить / Не установлено>",
          "prior_pledgee_consent_status": "<present / not_required / unclear / not_defined>",
          "prior_pledgee_consent_display": "<Согласие получено (форма) / Не требуется (залог первый) / Не удалось определить / Не установлено>",
          "prior_pledgee_info_status": "<present / unclear / not_defined>",
          "prior_pledgee_info_display": "<наименование залогодержателя, реквизиты договора, регистрационная запись / Не удалось определить / Не установлено>"
        }

        Верни РОВНО один JSON-объект со всеми 6 ключами без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.
      context_k: 8
      temperature: 0.0
      max_tokens: 500

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "последующий залог последующая ипотека предыдущий залогодержатель согласие предыдущего залогодержателя первый залог старшинство очерёдность обременение залогом"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - representations
      negative_keywords:
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.0, 0.40]
        boost: 0.16
        scope: segment
      context_k: 8
      max_chunks: 10
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
        - "invoice"
      preferred_clause_functions:
        - "obligations"
        - "representations"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 600

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 900
      compact_output: false  # [CONSIDER]

      presence_signal:
        field: "subsequent_pledge_presence"
        present_values:
          - present
        missing_values:
          - missing
        unclear_values:
          - unclear
      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора залога/ипотеки
        сведения о характере залога (первый / последующий), о согласии
        предыдущего залогодержателя и о предыдущем залогодержателе.
        Не анализируй оценку предмета, страхование и порядок взыскания.
        </role>

        <context>
        {context}
        </context>

        <task>
        0. subsequent_pledge_presence:
           - "present" — в тексте прямо указан характер залога (первый
             или последующий), упомянут предыдущий залогодержатель
             или согласие на последующий залог;
           - "missing" — характер залога и связанные вопросы в тексте
             не упоминаются;
           - "unclear" — есть общие формулировки об обременениях,
             но характер залога прямо не определён.

        1. subsequent_pledge_status — "first_pledge" / "present" /
           "unclear" / "not_defined".
           - "first_pledge" — прямо указано, что залог первый / предмет
             не обременён залогом третьих лиц;
           - "present" — прямо указано, что залог последующий;
           - "unclear" — есть формулировка о характере залога, но она
             не позволяет надёжно классифицировать;
           - "not_defined" — характер залога прямо не указан.

        2. subsequent_pledge_display — человекочитаемое:
           "Первый залог (предмет залога не обременён залогом третьих лиц)";
           "Последующий залог";
           "Не удалось определить (формулировка не различает первый
           и последующий залог)";
           "Не установлено".

        3. prior_pledgee_consent_status — "present" / "not_required" /
           "unclear" / "not_defined".
           - "present" — прямо указано наличие согласия предыдущего
             залогодержателя;
           - "not_required" — прямо указано, что залог первый, поэтому
             согласие не требуется;
           - "unclear" — упоминание согласия есть, но надёжно
             классифицировать нельзя;
           - "not_defined" — согласие прямо не упомянуто.

        4. prior_pledgee_consent_display — человекочитаемое:
           "Согласие предыдущего залогодержателя получено (письменно)";
           "Согласие предыдущего залогодержателя получено (иная форма)";
           "Не требуется (залог первый)";
           "Не удалось определить";
           "Не установлено".

        5. prior_pledgee_info_status — "present" / "unclear" /
           "not_defined".

        6. prior_pledgee_info_display — человекочитаемое:
           "<наименование залогодержателя>; <реквизиты договора>;
           <регистрационная запись>";
           "Не удалось определить";
           "Не установлено".

        Все 7 ключей должны присутствовать в JSON-ответе.
        </task>

        <context_rules>
        - Перед остальными полями заполни subsequent_pledge_presence по правилу из пункта 0 task.
        - Агрегируй subsequent_pledge_presence по значению хотя бы одного
          из: subsequent_pledge_status, prior_pledgee_consent_status,
          prior_pledgee_info_status. Если subsequent_pledge_status ∈
          {"first_pledge", "present"} → "present"; все три = "not_defined"
          → "missing"; иначе → "unclear".
        - Используй только текст договора из <context>. Не подставляй нормы
          закона.
        - Не делай предположений и не достраивай отсутствующие реквизиты.
        - Если в <context> попали нерелевантные фрагменты — игнорируй их.
        - Если фрагменты противоречат друг другу и надёжный вывод сделать
          нельзя — верни "unclear" для internal-полей, "Не удалось
          определить" для display-полей.
        - Отсутствие указания на последующий характер залога ≠ отсутствие
          последующего залога: он мог быть установлен вне текста. Фиксируй
          только текст.
        - Различай: «характер залога» / «согласие предыдущего
          залогодержателя» / «сведения о предыдущем залогодержателе».
          Это три разных факта, не смешивай.
        - Ссылка на приложение или спецификацию с данными предыдущего
          залогодержателя = "present" для prior_pledgee_info_status
          (внешний документ учитывается).
        - Не используй "None", "null" и пустые строки.
        - Соблюдай точное соответствие имён ключей схеме полей.
        </context_rules>

        <edge_cases>
        1. Договор прямо указывает «настоящий залог является первым» →
           subsequent_pledge_status = "first_pledge",
           prior_pledgee_consent_status = "not_required".
        2. Указан последующий залог, но согласие предыдущего залогодержателя
           не упомянуто → subsequent_pledge_status = "present",
           prior_pledgee_consent_status = "not_defined" (риск оспоримости).
        3. Общая фраза «предмет залога не обременён правами третьих лиц»
           без различения первый/последующий →
           subsequent_pledge_status = "unclear" (не позволяет надёжно
           классифицировать).
        4. Сведения о предыдущем залогодержателе вынесены в приложение,
           на которое есть ссылка в тексте договора →
           prior_pledgee_info_status = "present", в display укажи
           ссылку на приложение.
        </edge_cases>

        <output_expectations>
        - Верни РОВНО один JSON-объект со всеми 7 ключами без какого-либо
          дополнительного текста до или после.
        - Начни ответ сразу с открывающей фигурной скобки и закончи
          закрывающей.
        - НЕ пиши Markdown, списки, код-фенсы.
        - Ответ должен быть валидным JSON, пригодным для парсинга через
          json.loads без предварительной обработки.
