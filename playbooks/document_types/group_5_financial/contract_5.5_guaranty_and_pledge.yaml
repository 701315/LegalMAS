      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора залога движимого
        имущества сведения о регистрации залога в реестре уведомлений
        о залоге, о регистрирующей стороне и о реквизитах записи.
        Не анализируй предмет залога, оценку и обращение взыскания.
        </role>

        <context>
        {context}
        </context>

        <task>
        0. movable_registration_presence:
           - "present" — в тексте прямо предусмотрена регистрация залога
             в реестре уведомлений о залоге, указана регистрирующая
             сторона или приведены реквизиты записи;
           - "missing" — регистрация залога движимого имущества в тексте
             не упоминается;
           - "unclear" — есть общие формулировки об учёте залога,
             но без прямой ссылки на реестр уведомлений.

        1. movable_registration_status — "present" / "unclear" /
           "not_defined".
           Внутренний признак наличия условия о регистрации залога
           в реестре уведомлений.
           - "present" — прямо предусмотрена регистрация в реестре
             уведомлений о залоге;
           - "unclear" — упоминание регистрации есть, но без прямой
             ссылки на реестр уведомлений;
           - "not_defined" — условие в договоре не установлено.

        2. movable_registration_display — человекочитаемое:
           "Регистрация в реестре уведомлений о залоге предусмотрена";
           "Не удалось определить (обобщённая формулировка без прямой
           ссылки на реестр уведомлений о залоге)";
           "Не установлено".

        3. registrant_party — "pledgor" / "pledgee" / "both" / "unclear" /
           "not_defined".

        4. registrant_party_display — человекочитаемое:
           "Залогодатель" / "Залогодержатель" / "Совместно" /
           "Не удалось определить" / "Не установлено".

        5. registration_details_status — "present" / "unclear" /
           "not_defined".
           Есть ли конкретные реквизиты записи.

        6. registration_details_display — человекочитаемое:
           "Регистрационная запись № <номер> от <дата>";
           "Не удалось определить";
           "Не установлено".

        Все 7 ключей должны присутствовать в JSON-ответе.
        </task>

        <context_rules>
        - Перед остальными полями заполни movable_registration_presence по правилу из пункта 0 task.
        - Агрегируй movable_registration_presence по значению хотя бы
          одного из: movable_registration_status, registrant_party,
          registration_details_status. Если movable_registration_status =
          "present" → "present"; все три = "not_defined" → "missing";
          иначе → "unclear".
        - Используй только текст договора из <context>. Не подставляй
          нормы закона.
        - Не делай предположений.
        - Если в <context> попали нерелевантные фрагменты — игнорируй их.
        - Если фрагменты противоречат друг другу и надёжный вывод сделать
          нельзя — верни "unclear" для соответствующих internal-полей,
          "Не удалось определить" для display-полей.
        - Отсутствие указания на регистрацию ≠ отсутствие регистрации:
          она могла быть произведена вне текста. Фиксируй только текст.
        - Для залога недвижимости (ипотеки) применяется отдельная
          регистрация в ЕГРН — этот check только для движимого имущества.
          Если в тексте упомянута только регистрация в ЕГРН —
          movable_registration_presence = "missing".
        - Ссылка на приложение с реквизитами записи = "present" для
          registration_details_status (внешний документ учитывается).
        - Не используй "None", "null" и пустые строки.
        - Соблюдай точное соответствие имён ключей схеме полей.
        </context_rules>

        <edge_cases>
        1. Прямая отсылка к реестру уведомлений о залоге движимого
           имущества → movable_registration_status = "present".
        2. Общая фраза «учёт залога в установленном законом порядке»
           без ссылки на конкретный реестр →
           movable_registration_status = "unclear".
        3. В тексте упомянута только регистрация в ЕГРН (ипотека),
           реестр уведомлений о залоге не упомянут →
           movable_registration_presence = "missing" (этот check
           только для движимого имущества).
        4. Реквизиты регистрационной записи вынесены в приложение,
           на которое есть ссылка в тексте →
           registration_details_status = "present", в display укажи
           ссылку на приложение.
        </edge_cases>

        <output_expectations>
        - Верни РОВНО один JSON-объект со всеми 7 ключами без какого-либо
          дополнительного текста до или после.
        - Начни ответ сразу с открывающей фигурной скобки и закончи
          закрывающей.
        - НЕ пиши Markdown, списки, код-фенсы.
        - Ответ должен быть валидным JSON, пригодным для парсинга через
