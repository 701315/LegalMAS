  - id: mortgage_registration_check
    name: "Ипотека: государственная регистрация и регистрационная механика"
    description: >
      Проверяет наличие регистрационного механизма ипотеки и распределение
      обязанностей по регистрации.
    triggers:
      any:
        - mortgage_pledge
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "государственная регистрация ипотеки"
        - "егрн"
        - "росреестр"
        - "закладная"
        - "обременение"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)государственн(ая|ой)\\s+регистрац"
        - "(?i)ЕГРН|Росреестр|закладн"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор ипотеки по ФЗ № 102-ФЗ «Об ипотеке
        (залоге недвижимости)».
        Проверяется только один вопрос: регистрационная механика ипотеки.

        Нормативный ориентир:
        - ст. 8.1 ГК РФ — общие правила государственной регистрации прав
        - ст. 339.1 п. 1 ГК РФ — права залогодержателя по договору об ипотеке
          возникают с момента государственной регистрации
        - ст. 551 ГК РФ — государственная регистрация перехода права
          собственности на недвижимость
        - ст. 20 ФЗ-102 — государственная регистрация ипотеки в ЕГРН
        - ст. 29 ФЗ-102 — государственная пошлина за регистрацию ипотеки
        - ст. 13–18 ФЗ-102 — закладная (форма, содержание, регистрация)
        - ст. 64.1 ФЗ-102 — ипотека в силу закона при покупке жилья
          в кредит (регистрируется одновременно с переходом права
          собственности, без отдельного договора об ипотеке)
        - ст. 77 ФЗ-102 — ипотека в силу закона жилого помещения

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора,
          а чего прямо нет.
        - Не оценивай серьёзность риска.
        - Не подставляй нормы закона вместо текста договора. Если в договоре
          прямо не указан орган регистрации — registration_body = "not_defined",
          display = "Не установлено". Не подставляй «Росреестр» по умолчанию,
          даже если это очевидно на практике.
        - Различай две процедуры:
          - «государственная регистрация ипотеки» — обременение в ЕГРН;
          - «государственная регистрация перехода права собственности» —
            отдельная процедура при покупке в кредит.
          В договоре они могут быть описаны вместе или по отдельности.
          Если указана только одна — фиксируй только её.
        - «Расходы распределены» ≠ «расходы не установлены». Если договор
          прямо говорит «расходы несёт Залогодатель» — это распределение
          (registration_costs_allocated = "yes"), а в display фиксируй,
          кто именно несёт.
        - Если упоминается «ипотека в силу закона» — это валидный исход,
          отражай его текстом в registration_clause_display.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Есть ли регистрационная оговорка (предусмотрена ли госрегистрация
          ипотеки).
        2. Какой орган регистрации указан (Росреестр / иной / не указан).
        3. Кто подаёт документы на регистрацию (Залогодатель / Залогодержатель /
          совместно / не установлено).
        4. Кто несёт расходы на регистрацию.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Если условие не указано прямо — текстовое поле = "not_defined",
          display-поле = "Не установлено".
        4. Если текст есть, но надёжный вывод сделать нельзя —
          для internal-полей = "unclear", для display-полей = "Не удалось определить".
        5. Не используй "None", "null" и пустые строки.
        6. Все 8 ключей должны присутствовать в JSON-ответе.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — классическая регистрационная оговорка с полным раскрытием:
        Фрагмент:
        "Ипотека подлежит государственной регистрации в Едином государственном реестре недвижимости. Заявление о государственной регистрации ипотеки подаёт Залогодатель. Расходы, связанные с государственной регистрацией ипотеки, включая государственную пошлину, несёт Залогодатель."

        Ответ:
        {
          "registration_clause_status": "present",
          "registration_clause_display": "Предусмотрена государственная регистрация ипотеки в ЕГРН",
          "registration_body": "rosreestr",
          "registration_body_display": "Росреестр (ЕГРН)",
          "filing_party": "pledgor",
          "filing_party_display": "Залогодатель",
          "registration_costs_allocated": "yes",
          "registration_costs_display": "Расходы несёт Залогодатель (включая государственную пошлину)"
        }

        Пример 2 — ипотека в силу закона при покупке жилья в кредит:
        Фрагмент:
        "Право залога возникает у Залогодержателя с момента государственной регистрации перехода права собственности на квартиру к Залогодателю и одновременно с регистрацией ипотеки в силу закона. Регистрационные действия осуществляются Залогодателем."

        Ответ:
        {
          "registration_clause_status": "present",
          "registration_clause_display": "Ипотека в силу закона; регистрируется одновременно с переходом права собственности",
          "registration_body": "rosreestr",
          "registration_body_display": "Росреестр (ЕГРН)",
          "filing_party": "pledgor",
          "filing_party_display": "Залогодатель",
          "registration_costs_allocated": "not_defined",
          "registration_costs_display": "Не установлено"
        }

        Пример 3 — расходы распределены пополам, закладная предусмотрена:
        Фрагмент:
        "Стороны осуществляют государственную регистрацию ипотеки совместно. Расходы на государственную регистрацию распределяются между Залогодателем и Залогодержателем в равных долях. По договору составляется закладная."

        Ответ:
        {
          "registration_clause_status": "present",
          "registration_clause_display": "Предусмотрена государственная регистрация ипотеки; оформляется закладная",
          "registration_body": "rosreestr",
          "registration_body_display": "Росреестр (ЕГРН)",
          "filing_party": "both",
          "filing_party_display": "Совместно (Залогодатель и Залогодержатель)",
          "registration_costs_allocated": "yes",
          "registration_costs_display": "Расходы распределяются между сторонами в равных долях"
        }

        Пример 4 — текст есть, но надёжный вывод сделать нельзя (неоднозначная формулировка):
        Фрагмент:
        "Ипотека подлежит государственной регистрации в порядке, установленном действующим законодательством. Расходы, связанные с оформлением, распределяются в соответствии с действующим законодательством."

        Ответ:
        {
          "registration_clause_status": "present",
          "registration_clause_display": "Предусмотрена государственная регистрация ипотеки (порядок определяется законодательством)",
          "registration_body": "unclear",
          "registration_body_display": "Не удалось определить",
          "filing_party": "not_defined",
          "filing_party_display": "Не установлено",
          "registration_costs_allocated": "unclear",
          "registration_costs_display": "Не удалось определить"
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о регистрации ипотеки.
        2. Найди прямую цитату о подающей стороне.
        3. Найди прямую цитату о расходах.
        4. Если прямой цитаты нет — верни "not_defined" (или "unclear",
          если в тексте есть противоречивые/неполные указания).

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь РОВНО одним JSON-объектом без какого-либо дополнительного текста до или после, со всеми 8 ключами:
        {
          "registration_clause_status": "<present / not_defined>",
          "registration_clause_display": "<Предусмотрена государственная регистрация ипотеки в ЕГРН / Ипотека в силу закона / Предусмотрена (порядок определяется законодательством) / Не установлено>",
          "registration_body": "<rosreestr / other / unclear / not_defined>",
          "registration_body_display": "<Росреестр (ЕГРН) / <иной орган> / Не удалось определить / Не установлено>",
          "filing_party": "<pledgor / pledgee / both / unclear / not_defined>",
          "filing_party_display": "<Залогодатель / Залогодержатель / Совместно (Залогодатель и Залогодержатель) / Не удалось определить / Не установлено>",
          "registration_costs_allocated": "<yes / no / unclear / not_defined>",
          "registration_costs_display": "<Расходы несёт Залогодатель (...) / Расходы несёт Залогодержатель / Расходы распределяются между сторонами (...) / Не удалось определить / Не установлено>"
        }

        Верни РОВНО один JSON-объект со всеми 8 ключами без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.
      context_k: 8
      temperature: 0.0
      max_tokens: 600

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "государственная регистрация ипотеки егрн росреестр закладная залогодатель заявитель подача заявления государственная пошлина расходы на регистрацию ипотека в силу закона переход права собственности"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - procedures
        - obligations
      negative_keywords:
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.20, 0.65]
        boost: 0.12
        scope: segment
      context_k: 8
      max_chunks: 10
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
        - "invoice"
      preferred_clause_functions:
        - "procedures"
        - "obligations"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 35
      max_snippet_length: 550

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 950
      compact_output: false

      presence_signal:
        field: "mortgage_registration_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора ипотеки сведения
        о государственной регистрации, органе регистрации, подающей стороне
        и распределении расходов.
        Не анализируй предмет залога, оценку и порядок обращения взыскания.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. mortgage_registration_check_presence:
           Агрегатное signal-поле — наличие регулирования по теме государственной
           регистрации ипотеки.
           - "present" — если хотя бы одно из содержательных полей
             (registration_clause_status, registration_body, filing_party,
              registration_costs_allocated) ≠ "not_defined";
           - "missing" — если все четыре содержательных поля = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - registration_clause_status = "not_defined";
           - registration_clause_display = "Не установлено";
           - registration_body = "not_defined";
           - registration_body_display = "Не установлено";
           - filing_party = "not_defined";
           - filing_party_display = "Не установлено";
           - registration_costs_allocated = "not_defined";
           - registration_costs_display = "Не установлено";
           - не выполняй остальные шаги.

        1. registration_clause_status — "present" / "not_defined".
          Внутренний признак наличия регистрационной оговорки.

        2. registration_clause_display — краткое описание регистрационной
          оговорки:
          "Предусмотрена государственная регистрация ипотеки в ЕГРН";
          "Ипотека в силу закона; регистрируется одновременно с переходом
          права собственности";
          "Предусмотрена государственная регистрация ипотеки (порядок
          определяется законодательством)";
          "Не установлено".

        3. registration_body — "rosreestr" / "other" / "unclear" / "not_defined".
          Внутренний enum органа регистрации.
          - "rosreestr" — прямо указан Росреестр / ЕГРН / Росреестр через МФЦ;
          - "other" — указан иной орган (крайне редко, дефект текста);
          - "unclear" — упоминание органа есть, но надёжно классифицировать
            нельзя;
          - "not_defined" — орган прямо не указан.

        4. registration_body_display — человекочитаемое:
          "Росреестр (ЕГРН)" / "<иной орган, как указан в договоре>" /
          "Не удалось определить" / "Не установлено".

        5. filing_party — "pledgor" / "pledgee" / "both" / "unclear" / "not_defined".
          Внутренний enum подающей стороны.

        6. filing_party_display — человекочитаемое:
          "Залогодатель" / "Залогодержатель" /
          "Совместно (Залогодатель и Залогодержатель)" /
          "Не удалось определить" / "Не установлено".

        7. registration_costs_allocated — "yes" / "no" / "unclear" / "not_defined".
          Внутренний признак распределения расходов:
          - "yes" — прямо указано, кто несёт расходы (или как они распределяются);
          - "no" — прямо указано, что расходы не распределяются;
          - "unclear" — упоминание расходов есть, но кто несёт — неясно;
          - "not_defined" — расходы прямо не упоминаются.

        8. registration_costs_display — человекочитаемое описание:
          "Расходы несёт Залогодатель (включая государственную пошлину)";
          "Расходы несёт Залогодержатель";
          "Расходы распределяются между сторонами в равных долях";
          "<иное распределение, как указано в договоре>";
          "Не удалось определить";
          "Не установлено".

        Все 8 ключей должны присутствовать в JSON-ответе.
        </task>

        <context_rules>
        - Перед остальными полями заполни mortgage_registration_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все содержательные поля = "not_defined", все *_display = "Не установлено".
        - Используй только текст договора из <context>. Не подставляй нормы закона.
        - Не делай предположений и не достраивай отсутствующие реквизиты.
        - Если в <context> попали нерелевантные фрагменты — игнорируй их.
        - Если фрагменты противоречат друг другу и надёжный вывод сделать нельзя —
          верни "unclear" для соответствующих internal-полей,
          "Не удалось определить" для display-полей.
        - Если в договоре прямо не указан орган регистрации — registration_body =
          "not_defined", registration_body_display = "Не установлено". Не подставляй
          «Росреестр» по умолчанию, даже если это очевидно на практике.
        - Различай «регистрацию ипотеки» (обременение в ЕГРН) и «регистрацию
          перехода права собственности» (при покупке в кредит). Это разные
          процедуры; в договоре они могут быть описаны вместе или по отдельности.
        - «Расходы распределены» ≠ «расходы не установлены». Если договор прямо
          говорит «расходы несёт Залогодатель» — это распределение
          (registration_costs_allocated = "yes"), а в display фиксируй,
          кто именно несёт.
        - Если упоминается «ипотека в силу закона» (ст. 64.1, 77 ФЗ-102) — это
          валидный исход, отражай его текстом в registration_clause_display.
        - Не используй "None", "null" и пустые строки.
        - Соблюдай точное соответствие имён ключей схеме полей.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни регистрационной оговорки, ни упоминания ЕГРН,
           ни подающей стороны, ни расходов на регистрацию.
           → presence = "missing";
             registration_clause_status = "not_defined";
             registration_body = "not_defined";
             filing_party = "not_defined";
             registration_costs_allocated = "not_defined";
             все *_display = "Не установлено".

        2. Неполное раскрытие — только оговорка без деталей.
           Указано, что ипотека подлежит государственной регистрации,
           но орган, подающая сторона и расходы не конкретизированы.
           → presence = "present";
             registration_clause_status = "present";
             registration_body = "not_defined";
             filing_party = "not_defined";
             registration_costs_allocated = "not_defined".

        3. Противоречие между фрагментами.
           В разных частях договора указаны разные подающие стороны
           или противоречивые условия о расходах.
           → presence = "unclear";
             filing_party = "unclear";
             registration_costs_allocated = "unclear";
             filing_party_display = "Не удалось определить";
             registration_costs_display = "Не удалось определить".

        4. Ипотека в силу закона.
           В договоре указано, что ипотека возникает в силу закона
           (ст. 64.1 или 77 ФЗ-102) и регистрируется одновременно
           с переходом права собственности.
           → presence = "present";
             registration_clause_status = "present";
             registration_clause_display = "Ипотека в силу закона;
             регистрируется одновременно с переходом права собственности";
             остальные поля — по факту наличия/отсутствия в тексте.
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для mortgage_registration_check_presence используй только: "present", "missing", "unclear".
        - Для registration_clause_status используй только: "present", "not_defined".
        - Для registration_body используй только: "rosreestr", "other", "unclear", "not_defined".
        - Для filing_party используй только: "pledgor", "pledgee", "both", "unclear", "not_defined".
        - Для registration_costs_allocated используй только: "yes", "no", "unclear", "not_defined".
        - Fallback при отсутствии данных:
          * registration_clause_display → "Не установлено";
          * registration_body_display → "Не установлено";
          * filing_party_display → "Не установлено";
          * registration_costs_display → "Не установлено".
        - Fallback при противоречии или неоднозначности:
          * все *_display → "Не удалось определить".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "mortgage_registration_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
