             не идентифицировано;
           - "unclear" — есть обобщённые отсылки, но конкретика
             отсутствует.

        1. obligation_identification_status — "present" / "unclear" /
           "not_defined".
           - "present" — обеспечиваемое обязательство конкретизировано
             (номер договора, дата, сумма) или есть чёткая отсылка
             к основному договору;
           - "unclear" — формулировка обобщённая («все обязательства»,
             «обязательства Должника») без конкретизации;
           - "not_defined" — обеспечиваемое обязательство не указано.

        2. obligation_identification_display — человекочитаемое:
           "Кредитный договор № КД-2025/0456 от 15.01.2025";
           "Ссылка на Основной договор (п. 1.1)";
           "Не удалось определить (обобщённая формулировка)";
           "Не установлено".

        3. future_obligation_status — "present" / "excluded" /
           "unclear" / "not_defined".
           - "present" — прямо указано, что поручительство покрывает
             будущие обязательства;
           - "excluded" — прямо указано, что поручительство покрывает
             только конкретное существующее обязательство;
           - "unclear" — формулировка допускает толкование в обе стороны;
           - "not_defined" — вопрос будущих обязательств не затронут.

        4. future_obligation_display — человекочитаемое:
           "Будущие обязательства включены; период: <...>";
           "Будущие обязательства не включены (конкретный договор)";
           "Не удалось определить";
           "Не установлено".

        5. obligation_limit_status — "present" / "unclear" /
           "not_defined".
           - "present" — предельный объём обеспечиваемых обязательств
             прямо указан;
           - "unclear" — есть отсылка к лимиту, но он не конкретизирован;
           - "not_defined" — предельный объём не указан.

        6. obligation_limit_display — человекочитаемое:
           "Предельный объём: 100 000 000 руб.";
           "Сумма Кредитного договора";
           "Не удалось определить";
           "Не установлено".

        Все 7 ключей должны присутствовать в JSON-ответе.
        </task>

        <context_rules>
        - Перед остальными полями заполни secured_obligation_presence по правилу из пункта 0 task.
        - Агрегируй secured_obligation_presence по значению хотя бы
          одного из: obligation_identification_status,
          future_obligation_status, obligation_limit_status. Если хотя
          бы одно = "present" → "present"; все три ∈ {"not_defined",
          "excluded"} → "missing"; иначе → "unclear".
        - Используй только текст договора из <context>. Не подставляй
          нормы закона.
        - Не делай предположений и не достраивай реквизиты.
        - Если в <context> попали нерелевантные фрагменты — игнорируй их.
        - Если фрагменты противоречат друг другу и надёжный вывод сделать
          нельзя — верни "unclear" для internal-полей, "Не удалось
          определить" для display-полей.
        - Различай: идентификация обязательства / будущие обязательства /
          предельный объём — это три разных факта, не смешивай.
        - Не путай предельный объём обеспечиваемых обязательств с лимитом
          ответственности поручителя (это покрывается другим чеком).
        - Ссылка на приложение с реквизитами основного договора =
          "present" для obligation_identification_status (внешний
          документ учитывается).
        - Не используй "None", "null" и пустые строки.
        - Соблюдай точное соответствие имён ключей схеме полей.
        </context_rules>

        <edge_cases>
        1. Конкретный кредитный договор с номером и датой →
           obligation_identification_status = "present",
           future_obligation_status = "excluded".
        2. «Все существующие и будущие обязательства Должника перед
           Кредитором» без лимита и периода →
           obligation_identification_status = "unclear" (слишком
           обобщённо), future_obligation_status = "present",
           obligation_limit_status = "not_defined".
        3. Поручительство за будущие обязательства с указанием периода
           и лимита → все три status = "present".
        4. Ссылка на «Основной договор, указанный в п. 1.1» без
           дополнительных деталей в текущем тексте →
           obligation_identification_status = "present" (отсылка есть),
           future_obligation_status = "not_defined".
        </edge_cases>

        <output_expectations>
        - Верни РОВНО один JSON-объект со всеми 7 ключами без какого-либо
          дополнительного текста до или после.
        - Начни ответ сразу с открывающей фигурной скобки и закончи
          закрывающей.
        - НЕ пиши Markdown, списки, код-фенсы.
        - Ответ должен быть валидным JSON, пригодным для парсинга через
          json.loads без предварительной обработки.
        - Технический формат JSON (value / confidence / location) задан
          отдельным контрактом — соблюдай его, но не описывай здесь.
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

