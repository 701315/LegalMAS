      - "(?i)повторн[ыо]й\\s+залог"
      - "(?i)следующ[иоя]+\\s+залогодержател[ья]"

  secured_real_estate:
    any_keywords:
      - "(?i)\\bквартир[аеиу]\\b"
      - "(?i)\\bздани[ея]\\b"
      - "(?i)\\bпомещени[ея]\\b"
      - "(?i)земельн[а-яё]+\\s+участ[оа]к"
      - "(?i)объект\\s+недвижимост[ии]"

  share_pledge:
    any_keywords:
      - "(?i)залог\\s+дол[ии]"
      - "(?i)дол[яьи]\\s+в\\s+уставн[оа]м\\s+капитал[ее]"
      - "(?i)залог\\s+дол[ии]\\s+в\\s+ООО"
      - "(?i)нотариальн[а-яё]+\\s+удостоверени[ея]\\s+залог[аа]\\s+дол[ии]"
      - "(?i)\\bЕГРЮЛ\\b"

  consumer_guaranty_pledge:
    any_keywords:
      - "(?i)физическ[оеая]\\s+лиц[оо]"
      - "(?i)\\bгражданин\\b"
      - "(?i)единственн[оа]е\\s+жиль[ёе]"
      - "(?i)ипотечн[ыо]й\\s+кредит"
      - "(?i)потребительск[иоя]+\\s+кредит"
      - "(?i)\\bпаспорт\\b"

# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 3: SHARED PATTERNS
#  Читается: DocTypeCheckLoader через _resolve_yaml_templates()
# ════════════════════════════════════════════════════════════════════════════

shared_patterns:
  money_amount: "(?i)\\b\\d[\\d\\s]*(?:руб|рублей|₽|коп|тыс|млн|млрд)"
  percentage_pattern: "(?i)\\b\\d+(?:[.,]\\d+)?\\s*%\\b"
  date_pattern: "(?i)\\b\\d{1,2}[.]\\d{1,2}[.]\\d{4}\\b"
  cadastral_number: "(?i)\\b\\d{2}:\\d{2}:\\d{6,7}:\\d+\\b"
  registration_number: "(?i)(?:№|N|No\\.)\\s*[A-ZА-Я0-9\\-\\/]+"

compliance_rules: []

# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 4: CHECKS_V8 — единственный рабочий слой юридического анализа
#  Читается: DocTypeCheckLoader._load_doc_type_checks()
# ════════════════════════════════════════════════════════════════════════════

checks_v8:

  # ──────────────────────────────────────────────────────────────────────────
  # CHECK 1: Базовое извлечение параметров поручительства/залога
  # ──────────────────────────────────────────────────────────────────────────
  - id: security_subject_extraction
    name: "Базовое извлечение параметров поручительства/залога"
    description: >
      Извлекает тип обеспечительного договора, стороны, обеспечиваемое
      обязательство, объем ответственности или предмет залога.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "поручительство"
        - "поручитель"
        - "залог"
        - "залогодатель"
        - "залогодержатель"
        - "основное обязательство"
        - "предмет залога"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)(поручительств|поручитель|залогодатель|залогодержатель|предмет\\s+залога)"
        - "(?i)(обеспечиваем(ое|ого)\\s+обязательств|основн(ое|ого)\\s+обязательств)"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется обеспечительный договор (поручительство или залог)
        по Главе 23 ГК РФ.
        Проверяется только один вопрос: ключевые параметры обеспечительной сделки.

        Нормативный ориентир:
        - ст. 329 ГК РФ — способы обеспечения обязательств
        - ст. 361 ГК РФ — поручительство
        - ст. 334 ГК РФ — залог

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора,
          а чего прямо нет.
        - Не оценивай серьёзность риска.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Тип обеспечения (поручительство / залог / ипотека).
        2. Кредитор (залогодержатель).
        3. Должник по основному обязательству.
        4. Поручитель или залогодатель.
        5. Ссылка на основное обязательство.
        6. Сумма обеспечиваемого обязательства.
        7. Объем ответственности или предмет залога.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Если данные не указаны прямо — возвращай "not_defined".
        4. Не используй "None", "null", "not_defined" или пустые строки.
        5. В evidence включай только текст договора.
        6. Верни только один JSON-объект.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — поручительство:
        Фрагмент:
        "Поручитель обязуется отвечать перед Кредитором за исполнение ООО «Альфа» обязательств по кредитному договору № 123 от 01.01.2026 на сумму 10 000 000 рублей. Ответственность — солидарная."

        Ответ:
        {
          "security_type": "guaranty",
          "creditor": "Кредитор",
          "principal_debtor": "ООО «Альфа»",
          "guarantor_or_pledgor": "Поручитель",
          "secured_obligation_reference": "кредитный договор № 123 от 01.01.2026",
          "secured_amount": "10 000 000 рублей",
          "liability_or_collateral_scope": "солидарная ответственность"
        }

        Пример 2 — залог:
        Фрагмент:
        "Залогодатель передает в залог автомобиль для обеспечения обязательств по договору поставки."

        Ответ:
        {
          "security_type": "pledge",
          "creditor": "not_defined",
          "principal_debtor": "not_defined",
          "guarantor_or_pledgor": "Залогодатель",
          "secured_obligation_reference": "договор поставки",
          "secured_amount": "not_defined",
          "liability_or_collateral_scope": "автомобиль"
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о типе обеспечения.
        2. Найди прямую цитату о кредиторе.
        3. Найди прямую цитату об основном обязательстве.
        4. Если прямой цитаты нет — верни "not_defined".

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "security_type": "<guaranty / pledge / mortgage / mixed / unclear / not_found>",
          "creditor": "<текст или not_found>",
          "principal_debtor": "<текст или not_found>",
          "guarantor_or_pledgor": "<текст или not_found>",
          "secured_obligation_reference": "<текст или not_found>",
          "secured_amount": "<текст или not_found>",
          "liability_or_collateral_scope": "<текст или not_found>"
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 700

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "основное обязательство поручитель предмет залога обеспечение обязательства кредитор залогодержатель"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - definitions
        - obligations
      negative_keywords:
        - "означает"
        - "в целях настоящего"
        - "приложение"
        - "индекс"
      position_bias:
        preferred_range: [0.0, 0.35]
        boost: 0.20
        scope: segment
      context_k: 6
      max_chunks: 10
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
        - "invoice"
      preferred_clause_functions:
        - "definitions"
        - "obligations"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 50
      max_snippet_length: 700

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1350
      compact_output: false

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Твоя задача — извлечь из текста обеспечительного
        договора ключевые параметры: тип обеспечения, стороны, основное обязательство,
        сумму и объем ответственности или предмет залога.
        Не анализируй процедурные условия, регистрацию или последствия нарушения.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        1. security_type — "guaranty" / "pledge" / "mortgage" / "mixed" / "unclear" / "not_defined".
        2. creditor — кредитор или залогодержатель.
        3. principal_debtor — должник по основному обязательству.
        4. guarantor_or_pledgor — поручитель или залогодатель.
        5. secured_obligation_reference — ссылка на основное обязательство.
        6. secured_amount — сумма обеспечиваемого обязательства.
        7. liability_or_collateral_scope — объем ответственности или предмет залога.

        Если данные отсутствуют:
        - текстовое поле = "not_defined"
        </task>

        <rules>
        - Используй только текст договора.
        - Не делай предположений.
        - Верни только JSON.
        </rules>
      fields:
        - name: "security_type"
          type: "string"
          presentation: "signal"
          allowed_values: ["guaranty", "pledge", "mortgage", "mixed", "unclear", "not_defined"]
          description: "Тип обеспечительного договора."
          required: true
        - name: "creditor"
          type: "string"
          presentation: "fact"
          label: "Кредитор / Залогодержатель"
          description: "Кредитор или залогодержатель."
          required: true
          display_in_grid: true
          display_priority: 1
        - name: "principal_debtor"
          type: "string"
          presentation: "fact"
          label: "Должник по основному обязательству"
          description: "Должник по основному обязательству."
          required: true
          display_in_grid: true
          display_priority: 2
        - name: "guarantor_or_pledgor"
          type: "string"
          presentation: "fact"
          label: "Поручитель / Залогодатель"
          description: "Поручитель или залогодатель."
          required: true
          display_in_grid: true
          display_priority: 3
        - name: "secured_obligation_reference"
          type: "string"
          presentation: "fact"
          label: "Основное обязательство"
          description: "Ссылка на основное обязательство."
          required: true
          display_in_grid: true
          display_priority: 4
        - name: "secured_amount"
          type: "string"
          presentation: "fact"
          label: "Сумма обеспечиваемого обязательства"
          description: "Сумма обеспечиваемого обязательства."
          required: false
          display_in_grid: true
          display_priority: 5
        - name: "liability_or_collateral_scope"
          type: "string"
          presentation: "fact"
          label: "Объем ответственности / Предмет залога"
          description: "Объем ответственности поручителя или предмет залога."
          required: true
          display_in_grid: true
          display_priority: 6
      store_payload: true

  # ──────────────────────────────────────────────────────────────────────────
  # CHECK 2: Поручительство — объем, вид ответственности и лимит
  # ──────────────────────────────────────────────────────────────────────────
  - id: guaranty_liability_scope_check
    name: "Поручительство: объем, вид ответственности и лимит"
    description: >
      Проверяет солидарный/субсидиарный характер ответственности, лимит суммы
      и охват процентов/неустойки.
    triggers:
      any:
        - guaranty_contract
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "солидарная ответственность"
        - "субсидиарная ответственность"
        - "в пределах суммы"
        - "максимальная сумма поручительства"
        - "проценты"
        - "неустойка"
        - "судебные расходы"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)солидарн(ая|ой)\\s+ответственност|субсидиарн(ая|ой)\\s+ответственност"
        - "(?i)максимальн(ая|ой)\\s+сумм[аы]\\s+поручительств"
        - "(?i)в\\s+пределах\\s+суммы"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор поручительства по § 5 Главы 23 ГК РФ.
        Проверяется только один вопрос: объем и вид ответственности поручителя.

        Нормативный ориентир:
        - ст. 363 ГК РФ — ответственность поручителя

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора.
        - Не оценивай серьёзность риска.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Какой вид ответственности установлен (солидарная / субсидиарная).
        2. Есть ли лимит ответственности.
        3. Что входит в объем ответственности.
        4. Насколько ясна формулировка.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Если условие не указано прямо — возвращай "not_defined".
        3. Если текстового значения нет — возвращай "not_defined".
        4. Не используй "None", "null", "not_defined" или пустые строки.
        5. В evidence включай только текст договора.
        6. Верни только один JSON-объект.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1:
        Фрагмент:
        "Поручитель несет солидарную ответственность с должником в пределах суммы 5 000 000 рублей, включая проценты и неустойку."

        Ответ:
        {
          "liability_type": "solidary",
          "liability_cap_status": "present",
          "coverage_scope": "principal_plus_accessories",
          "liability_clause_clarity": "clear"
        }

        Пример 2:
        Фрагмент:
        "Поручитель отвечает перед кредитором в порядке, установленном законом."

        Ответ:
        {
          "liability_type": "not_defined",
          "liability_cap_status": "not_defined",
          "coverage_scope": "not_defined",
          "liability_clause_clarity": "unclear"
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о виде ответственности.
        2. Найди прямую цитату о лимите ответственности.
        3. Найди прямую цитату о составе требований.
        4. Если прямой цитаты нет — верни "not_defined".

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "liability_type": "<solidary / subsidiary / unclear / not_found>",
          "liability_cap_status": "<present / not_found>",
          "coverage_scope": "<principal_only / principal_plus_accessories / unclear / not_found>",
          "liability_clause_clarity": "<clear / unclear / not_found>"
        }
      context_k: 5
      temperature: 0.0
      max_tokens: 380

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "солидарная ответственность субсидиарная ответственность максимальная сумма поручительства"
      preferred_unit_types:
        - obligation
        - liability_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - limitations
      negative_keywords:
        - "означает"
        - "в целях настоящего"
        - "основное обязательство"
        - "предмет залога"
      position_bias:
        preferred_range: [0.15, 0.55]
        boost: 0.16
        scope: segment
      context_k: 5
      max_chunks: 8
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
        - "invoice"
      preferred_clause_functions:
        - "obligations"
        - "limitations"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 600

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 700
      compact_output: false

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора поручительства
        сведения об объеме и виде ответственности поручителя.
        Не анализируй условия прекращения поручительства или суброгацию.
        </role>

        <context>
        {context}
        </context>

        <task>
        1. liability_type — "solidary" / "subsidiary" / "unclear" / "not_defined".
        2. liability_cap_status — "present" / "not_defined".
        3. coverage_scope — "principal_only" / "principal_plus_accessories" / "unclear" / "not_defined".
        4. liability_clause_clarity — "clear" / "unclear" / "not_defined".
        </task>

        <rules>
        - Используй только текст договора.
        - "principal_only" — только основной долг.
        - "principal_plus_accessories" — основной долг, проценты, неустойка, расходы.
        - Верни только JSON.
        </rules>
      fields:
        - name: "liability_type"
          type: "string"
          presentation: "signal"
          allowed_values: ["solidary", "subsidiary", "unclear", "not_defined"]
          description: "Вид ответственности поручителя."
          required: true
        - name: "liability_cap_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["present", "not_defined"]
          description: "Есть ли лимит ответственности."
          required: false
        - name: "coverage_scope"
          type: "string"
          presentation: "signal"
          allowed_values: ["principal_only", "principal_plus_accessories", "unclear", "not_defined"]
          description: "Объем ответственности по составу требований."
          required: false
        - name: "liability_clause_clarity"
          type: "string"
          presentation: "signal"
          allowed_values: ["clear", "unclear", "not_defined"]
          description: "Понятность оговорки об ответственности."
          required: false
      store_payload: true

  # ──────────────────────────────────────────────────────────────────────────
  # CHECK 3: Поручительство — изменения основного обязательства и прекращение
  # ──────────────────────────────────────────────────────────────────────────
  - id: guaranty_change_and_termination_check
    name: "Поручительство: изменения основного обязательства и прекращение"
    description: >
      Проверяет правила изменения основного обязательства, уведомления поручителя
      и основания прекращения поручительства.
    triggers:
      any:
        - guaranty_contract
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "согласие поручителя"
        - "изменение основного обязательства"
        - "прекращение поручительства"
        - "срок поручительства"
        - "безусловное согласие"
        - "любые изменения"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)изменени[ея]\\s+основн(ого|ого)\\s+обязательств"
        - "(?i)прекращени[ея]\\s+поручительств"
        - "(?i)срок\\s+поручительств"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор поручительства по § 5 Главы 23 ГК РФ.
        Проверяется только один вопрос: изменения основного обязательства
        и прекращение поручительства.

        Нормативный ориентир:
        - ст. 367 ГК РФ — прекращение поручительства
        - ст. 367 п. 6 ГК РФ — срок поручительства

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора.
        - Не оценивай серьёзность риска.

