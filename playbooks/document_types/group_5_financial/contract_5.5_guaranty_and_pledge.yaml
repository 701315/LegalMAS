        6. term_calculation_display — человекочитаемое:
           "Фиксированная календарная дата";
           "Период в месяцах/годах";
           "Привязка к сроку Основного договора";
           "Не удалось определить";
           "Не установлено".

        Все 7 ключей должны присутствовать в JSON-ответе.
