      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора поручительства
        сведения о праве поручителя выдвигать возражения должника,
        об отказе поручителя от такого права и об оговорках
        о последствиях отказа кредитора принять исполнение.
        Не анализируй объём ответственности, срок и прекращение.
        </role>

        <context>
        {context}
        </context>

        <task>
        0. guarantor_defenses_presence:
           - "present" — в тексте есть прямое закрепление права
             поручителя на возражения, отказ от возражений или
             оговорка об отказе кредитора принять исполнение;
           - "missing" — ни один из этих вопросов в тексте не затронут;
           - "unclear" — есть обобщённые формулировки о правах
             поручителя, но конкретика отсутствует.

        1. debtor_defenses_right_status — "present" / "unclear" /
           "not_defined".
           - "present" — в договоре прямо закреплено право поручителя
             выдвигать возражения должника;
           - "unclear" — есть обобщённая формулировка, но право прямо
             не закреплено;
           - "not_defined" — нет упоминания.

        2. debtor_defenses_right_display — человекочитаемое:
           "Право поручителя выдвигать возражения должника прямо
           закреплено";
           "Право на возражения прямо не закреплено";
           "Не удалось определить (обобщённая формулировка без прямого
           закрепления права на возражения)";
           "Не установлено".

        3. waiver_of_defenses_status — "present" / "unclear" /
           "not_defined".
           Есть ли отказ поручителя от права на возражения.

        4. waiver_of_defenses_display — человекочитаемое:
           "Поручитель прямо отказался от права выдвигать возражения
           должника";
           "Отказ от возражений не установлен";
           "Не удалось определить";
           "Не установлено".

        5. refusal_of_acceptance_provision_status — "present" /
           "unclear" / "not_defined".
           Есть ли оговорка о последствиях отказа кредитора принять
           надлежащее исполнение.

        6. refusal_of_acceptance_provision_display — человекочитаемое:
           "<описание оговорки>";
           "Не удалось определить";
           "Не установлено".

        Все 7 ключей должны присутствовать в JSON-ответе.
        </task>

        <context_rules>
        - Перед остальными полями заполни guarantor_defenses_presence по правилу из пункта 0 task.
        - Агрегируй guarantor_defenses_presence по значению хотя бы
          одного из: debtor_defenses_right_status,
          waiver_of_defenses_status,
          refusal_of_acceptance_provision_status. Если хотя бы одно =
          "present" → "present"; все три = "not_defined" → "missing";
          иначе → "unclear".
        - Используй только текст договора из <context>. Не подставляй
          нормы закона.
        - Не делай предположений.
        - Если в <context> попали нерелевантные фрагменты — игнорируй их.
        - Если фрагменты противоречат друг другу и надёжный вывод сделать
          нельзя — верни "unclear" для internal-полей, "Не удалось
          определить" для display-полей.
        - Право на возражения должника (ст. 364 ГК РФ) действует в силу
          закона. В debtor_defenses_right_status фиксируй не действие
          нормы, а именно текст договора. Отсутствие упоминания ≠
          лишение права.
        - Различай: право на возражения / отказ от возражений / оговорки
          об отказе кредитора принять исполнение — это три разных факта,
          не смешивай.
        - Если отказ от возражений прямо не установлен — это не «отказ
          отсутствует», а waiver_of_defenses_status = "not_defined".
        - Не используй "None", "null" и пустые строки.
        - Соблюдай точное соответствие имён ключей схеме полей.
        </context_rules>

        <edge_cases>
        1. «Поручитель пользуется всеми правами, предоставленными ему
           действующим законодательством» → debtor_defenses_right_status
           = "unclear" (обобщённая отсылка, не прямое закрепление).
        2. Прямой отказ от возражений: «Поручитель не вправе выдвигать
           возражения должника» → waiver_of_defenses_status = "present",
           debtor_defenses_right_status = "not_defined" (право не
           закреплено, а ограничено).
        3. Оговорка о ст. 367 п. 3 ГК РФ прямо в тексте →
           refusal_of_acceptance_provision_status = "present".
        4. Ни один из трёх вопросов не затронут в договоре →
           guarantor_defenses_presence = "missing", все status =
           "not_defined".
        </edge_cases>

        <output_expectations>
        - Верни РОВНО один JSON-объект со всеми 7 ключами без какого-либо
          дополнительного текста до или после.
        - Начни ответ сразу с открывающей фигурной скобки и закончи
          закрывающей.
        - НЕ пиши Markdown, списки, код-фенсы.
        - Ответ должен быть валидным JSON, пригодным для парсинга через
          json.loads без предварительной обработки.
        - Технический формат JSON (value / confidence / location) задан
          отдельным контрактом — соблюдай его, но не описывай здесь.
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

