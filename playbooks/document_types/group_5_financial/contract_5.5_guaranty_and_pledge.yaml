  - id: mortgage_zakladnaya_check
    name: "Ипотека: закладная"
    description: >
      Проверяет наличие закладной, её форму и сведения о владельце.
    triggers:
      any:
        - mortgage_pledge
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "закладная"
        - "составление закладной"
        - "выдача закладной"
        - "первоначальный держатель закладной"
        - "электронная закладная"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)закладн(ая|ой|ую)"
        - "(?i)электронн(ая|ой)\\s+закладн"
        - "(?i)(составляется|выдается|оформляется)\\s+закладн"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор ипотеки.
        Проверяется только один вопрос: закладная.

        Нормативный ориентир:
        - ст. 13 ФЗ-102 — содержание закладной
        - ст. 14 ФЗ-102 — составление закладной; электронная закладная
        - ст. 15 ФЗ-102 — государственная регистрация закладной
        - ст. 16 ФЗ-102 — закладная при ипотеке в силу закона
        - ст. 17 ФЗ-102 — владелец закладной
        - ст. 18 ФЗ-102 — передача прав по закладной
        - ст. 48 ФЗ-102 — передача прав на закладную

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора.
        - Не оценивай серьёзность риска.
        - Различай:
          - составление закладной (предусмотрено/нет);
          - форму закладной (документарная / электронная);
          - сведения о первоначальном держателе закладной.
        - Отсутствие указания на закладную ≠ отсутствие закладной: для
          ипотеки в силу закона закладная может быть составлена в
          дальнейшем. Фиксируй только текст.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Предусмотрено ли составление закладной.
        2. В какой форме (документарной / электронной).
        3. Кто является первоначальным держателем закладной.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Если условие не указано прямо — текстовое поле = "not_defined",
          display-поле = "Не установлено".
        4. Если текст есть, но надёжный вывод сделать нельзя —
          для internal-полей = "unclear", для display-полей = "Не удалось определить".
        5. Не используй "None", "null" и пустые строки.
        6. Все 6 ключей должны присутствовать в JSON-ответе.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — документарная закладная с указанием держателя:
        Фрагмент:
        "По настоящему договору составляется закладная. Закладная оформляется в документарной форме. Первоначальным держателем закладной является Залогодержатель — ПАО «Банк Пример». Закладная подлежит государственной регистрации в органе регистрации прав."

        Ответ:
        {
          "zakladnaya_status": "present",
          "zakladnaya_display": "Закладная составляется",
          "zakladnaya_form": "documentary",
          "zakladnaya_form_display": "Документарная",
          "zakladnaya_holder_status": "present",
          "zakladnaya_holder_display": "Залогодержатель — ПАО «Банк Пример»"
        }

        Пример 2 — электронная закладная без указания держателя:
        Фрагмент:
        "Закладная составляется в форме электронного документа и подписывается усиленной квалифицированной электронной подписью."

        Ответ:
        {
