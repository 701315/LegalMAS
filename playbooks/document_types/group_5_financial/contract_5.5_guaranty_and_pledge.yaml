  - id: pledge_movable_registration_check
    name: "Залог: госрегистрация залога движимого имущества"
    description: >
      Проверяет регистрацию залога движимого имущества в реестре
      уведомлений о залоге (ст. 339.1 п. 4 ГК РФ).
    triggers:
      any:
        - pledge_contract
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "реестр уведомлений о залоге"
        - "регистрация залога"
        - "учёт залога"
        - "регистрационная запись"
        - "нотариальная регистрация залога"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)реестр[ае]?\\s+уведомлен[ийя]\\s+о\\s+залог"
        - "(?i)регистрац[ияи]\\s+залог|учёт\\s+залог"
        - "(?i)регистрационн(ая|ой)\\s+запис"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор залога движимого имущества.
        Проверяется только один вопрос: регистрация залога в реестре
        уведомлений о залоге.

        Нормативный ориентир:
        - ст. 339.1 п. 4 ГК РФ — учёт залога иного имущества (не относящегося
          к недвижимости) в реестре уведомлений о залоге; учёт осуществляется
          путём регистрации уведомления о возникновении залога
        - ст. 339.1 п. 4 ГК РФ — залогодержатель вправе требовать
          регистрации уведомления; неуведомление влечёт риск для
          залогодержателя при добросовестном приобретателе предмета залога
        - ст. 34.4 Основ законодательства РФ о нотариате — порядок
          регистрации уведомлений о залоге
        - ст. 103.5, 103.6 Основ законодательства РФ о нотариате —
          реестр уведомлений о залоге движимого имущества

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора.
        - Не оценивай серьёзность риска.
        - Не подставляй нормы закона вместо текста договора. Отсутствие
          указания на регистрацию ≠ отсутствие регистрации: она могла быть
          произведена вне текста. Фиксируй только текст.
        - Для залога недвижимости (ипотеки) применяется отдельная
          регистрация в ЕГРН — этот check только для движимого имущества.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Есть ли условие о регистрации залога в реестре уведомлений.
        2. Кто осуществляет регистрацию (залогодатель / залогодержатель /
          совместно).
        3. Есть ли сведения о конкретной регистрационной записи
          (номер, дата, регистратор).

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Если условие не указано прямо — текстовое поле = "not_defined",
          display-поле = "Не установлено".
        4. Если текст есть, но надёжный вывод сделать нельзя —
          для internal-полей = "unclear", для display-полей = "Не удалось определить".
        5. Не используй "None", "null" и пустые строки.
        6. Все 6 ключей должны присутствовать в JSON-ответе.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — полное условие с указанием стороны и записи:
        Фрагмент:
        "Залогодержатель обязуется направить нотариусу уведомление о возникновении залога на движимое имущество для регистрации в реестре уведомлений о залоге. Регистрационная запись: № 2026-000123-77 от 12.02.2026."

        Ответ:
        {
          "movable_registration_status": "present",
          "movable_registration_display": "Регистрация в реестре уведомлений о залоге предусмотрена",
          "registrant_party": "pledgee",
          "registrant_party_display": "Залогодержатель",
          "registration_details_status": "present",
          "registration_details_display": "Регистрационная запись № 2026-000123-77 от 12.02.2026"
        }

        Пример 2 — регистрация предусмотрена, сторона не указана:
        Фрагмент:
        "Залог подлежит учёту в реестре уведомлений о залоге движимого имущества."

        Ответ:
        {
          "movable_registration_status": "present",
          "movable_registration_display": "Регистрация в реестре уведомлений о залоге предусмотрена",
          "registrant_party": "not_defined",
          "registrant_party_display": "Не установлено",
          "registration_details_status": "not_defined",
          "registration_details_display": "Не установлено"
        }

        Пример 3 — регистрация прямо отнесена к залогодателю, запись отсутствует:
        Фрагмент:
        "Залогодатель обязуется в течение 5 (пяти) рабочих дней с даты подписания настоящего договора зарегистрировать уведомление о залоге в реестре уведомлений о залоге движимого имущества."

        Ответ:
        {
          "movable_registration_status": "present",
          "movable_registration_display": "Регистрация в реестре уведомлений о залоге предусмотрена",
          "registrant_party": "pledgor",
          "registrant_party_display": "Залогодатель",
          "registration_details_status": "not_defined",
          "registration_details_display": "Не установлено"
        }

        Пример 4 — текст есть, но надёжный вывод сделать нельзя:
        Фрагмент:
        "Стороны обязуются совершить необходимые действия для учёта залога в установленном законом порядке."

        Ответ:
        {
          "movable_registration_status": "unclear",
          "movable_registration_display": "Не удалось определить (обобщённая формулировка без прямой ссылки на реестр уведомлений о залоге)",
          "registrant_party": "not_defined",
          "registrant_party_display": "Не установлено",
          "registration_details_status": "not_defined",
          "registration_details_display": "Не установлено"
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о регистрации залога.
        2. Найди прямую цитату о регистрирующей стороне.
        3. Найди прямую цитату о регистрационной записи.
        4. Если прямой цитаты нет — верни "not_defined".

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь РОВНО одним JSON-объектом без какого-либо дополнительного текста до или после, со всеми 6 ключами:
        {
          "movable_registration_status": "<present / unclear / not_defined>",
          "movable_registration_display": "<Регистрация в реестре уведомлений о залоге предусмотрена / Не удалось определить / Не установлено>",
          "registrant_party": "<pledgor / pledgee / both / unclear / not_defined>",
          "registrant_party_display": "<Залогодатель / Залогодержатель / Совместно / Не удалось определить / Не установлено>",
          "registration_details_status": "<present / unclear / not_defined>",
          "registration_details_display": "<реквизиты записи / Не удалось определить / Не установлено>"
        }

        Верни РОВНО один JSON-объект со всеми 6 ключами без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.
