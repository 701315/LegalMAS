        - "(?i)замен[аы]\\s+предмета\\s+залога|право\\s+следования"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор залога или ипотеки.
        Проверяется только один вопрос: ограничения распоряжения
        предметом залога.

        Нормативный ориентир:
        - ст. 343.2 ГК РФ — обязанность залогодателя обеспечивать
          сохранность предмета залога
        - ст. 345 ГК РФ — замена и восстановление предмета залога
        - ст. 346 ГК РФ — право пользования и распоряжения предметом
          залога; ограничения
        - ст. 353 ГК РФ — сохранение залога при переходе прав на предмет
          (право следования)
        - ст. 354 ГК РФ — последствия принудительного изъятия
        - ст. 37, 40 ФЗ-102 — для ипотеки

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора.
        - Не оценивай серьёзность риска.
        - Различай:
          - ограничение на продажу/отчуждение предмета залога;
          - ограничение на передачу в аренду, пользование, ссуду;
          - правила замены предмета залога;
          - правила переработки/восполнения (для товаров в обороте).
        - Если в договоре прямо не указано — фиксируй "not_defined".
          Не подставляй «право следования по ст. 353 ГК РФ» — оно
          действует в силу закона, а не по тексту.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Есть ли ограничение на продажу или иное отчуждение предмета
          залога.
        2. Есть ли ограничение на передачу предмета залога в аренду,
          пользование, ссуду.
        3. Есть ли правила замены предмета залога.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Если условие не указано прямо — текстовое поле = "not_defined",
          display-поле = "Не установлено".
        4. Если текст есть, но надёжный вывод сделать нельзя —
          для internal-полей = "unclear", для display-полей = "Не удалось определить".
        5. Не используй "None", "null" и пустые строки.
        6. Все 6 ключей должны присутствовать в JSON-ответе.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — все три типа ограничений установлены:
        Фрагмент:
        "Залогодатель не вправе отчуждать предмет залога, передавать его в аренду, безвозмездное пользование или в залог третьим лицам без письменного согласия Залогодержателя. Замена предмета залога допускается только с письменного согласия Залогодержателя с одновременным заключением дополнительного соглашения."

        Ответ:
        {
          "disposal_restriction_status": "present",
          "disposal_restriction_display": "Отчуждение запрещено без письменного согласия Залогодержателя",
          "use_and_lease_restriction_status": "present",
          "use_and_lease_restriction_display": "Аренда, безвозмездное пользование и последующий залог запрещены без письменного согласия Залогодержателя",
          "substitution_rules_status": "present",
          "substitution_rules_display": "Замена допускается только с письменного согласия Залогодержателя и оформляется дополнительным соглашением"
        }

        Пример 2 — только запрет отчуждения:
        Фрагмент:
        "Залогодатель не вправе продавать предмет залога до полного исполнения обеспеченного обязательства."

        Ответ:
        {
          "disposal_restriction_status": "present",
          "disposal_restriction_display": "Продажа запрещена до полного исполнения обеспеченного обязательства",
          "use_and_lease_restriction_status": "not_defined",
          "use_and_lease_restriction_display": "Не установлено",
          "substitution_rules_status": "not_defined",
          "substitution_rules_display": "Не установлено"
        }

        Пример 3 — товары в обороте: право отчуждения прямо предусмотрено:
        Фрагмент:
        "Залогодатель вправе отчуждать предмет залога в порядке обычной хозяйственной деятельности с одновременным восполнением товарных запасов на эквивалентную сумму."

        Ответ:
        {
          "disposal_restriction_status": "not_defined",
          "disposal_restriction_display": "Не установлено (отчуждение прямо разрешено в порядке обычной деятельности)",
          "use_and_lease_restriction_status": "not_defined",
          "use_and_lease_restriction_display": "Не установлено",
          "substitution_rules_status": "present",
          "substitution_rules_display": "Восполнение товарных запасов на эквивалентную сумму при отчуждении"
        }

        Пример 4 — текст есть, но надёжный вывод сделать нельзя:
        Фрагмент:
        "Залогодатель обязуется не совершать действий, способных повлечь уменьшение стоимости предмета залога."

        Ответ:
        {
          "disposal_restriction_status": "unclear",
          "disposal_restriction_display": "Не удалось определить (обобщённая формулировка без прямой ссылки на отчуждение)",
          "use_and_lease_restriction_status": "not_defined",
          "use_and_lease_restriction_display": "Не установлено",
          "substitution_rules_status": "not_defined",
          "substitution_rules_display": "Не установлено"
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату об отчуждении/продаже.
        2. Найди прямую цитату об аренде/пользовании.
        3. Найди прямую цитату о замене/восполнении.
        4. Если прямой цитаты нет — верни "not_defined".

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь РОВНО одним JSON-объектом без какого-либо дополнительного текста до или после, со всеми 6 ключами:
        {
          "disposal_restriction_status": "<present / not_defined>",
          "disposal_restriction_display": "<описание запрета / Разрешено в порядке обычной деятельности / Не удалось определить / Не установлено>",
          "use_and_lease_restriction_status": "<present / not_defined>",
          "use_and_lease_restriction_display": "<описание ограничения / Не удалось определить / Не установлено>",
          "substitution_rules_status": "<present / not_defined>",
          "substitution_rules_display": "<описание правил замены / Не удалось определить / Не установлено>"
        }

        Верни РОВНО один JSON-объект со всеми 6 ключами без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.
      context_k: 8
