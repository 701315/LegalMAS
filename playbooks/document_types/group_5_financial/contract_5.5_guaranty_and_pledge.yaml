           "Не удалось определить";
           "Не установлено".

        5. marital_representation_status — "present" / "unclear" /
           "not_defined".

        6. marital_representation_display — человекочитаемое:
           "<описание заверения о семейном положении>";
           "Не удалось определить";
           "Не установлено".

        Все 7 ключей должны присутствовать в JSON-ответе.
        </task>

        <context_rules>
        - Перед остальными полями заполни spousal_consent_presence по правилу из пункта 0 task.
        - Агрегируй spousal_consent_presence по значению хотя бы одного
          из: spousal_consent_status, marital_regime_status,
          marital_representation_status. Если spousal_consent_status ∈
