  - id: guarantor_default_notice_and_subrogation_check
    name: "Поручитель: уведомление о дефолте и суброгация"
    description: >
      Проверяет обязанность кредитора уведомлять поручителя о дефолте
      и закрепление регрессных прав поручителя.
    triggers:
      any:
        - guaranty_contract
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "уведомление поручителя о неисполнении"
        - "кредитор обязан уведомить поручителя"
        - "регрессное требование поручителя"
        - "права кредитора переходят к поручителю"
        - "суброгация"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)уведомит.*поручител"
        - "(?i)права\\s+кредитора\\s+переходят\\s+к\\s+поручителю"
        - "(?i)суброгац|регрессн(ое|ого)\\s+требован"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор поручительства по § 5 Главы 23 ГК РФ.
        Проверяется только один вопрос: уведомление поручителя и суброгация.

        Нормативный ориентир:
        - ст. 365 п. 1 ГК РФ — поручитель, исполнивший обязательство,
          получает права кредитора по этому обязательству в объёме,
          в котором поручитель удовлетворил требование (суброгация,
          а не самостоятельное регрессное требование)
        - ст. 365 п. 2 ГК РФ — поручитель вправе требовать от должника
          уплаты процентов на исполненную сумму и возмещения иных убытков
        - ст. 366 п. 1 ГК РФ — должник, исполнивший обязательство, обязан
          немедленно уведомить об этом поручителя
        - ст. 366 п. 2 ГК РФ — поручитель, исполнивший обязательство,
          вправе взыскать с кредитора неосновательно полученное
        - ст. 382–386 ГК РФ — общие правила уступки требования
          (применяются к суброгации субсидиарно)
        - ст. 387 ГК РФ — переход прав кредитора к другому лицу
          на основании закона

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора,
          а чего прямо нет.
        - Не оценивай серьёзность риска.
        - Не подставляй нормы закона вместо текста договора. Отсутствие
          условия о суброгации в договоре ≠ отказ от суброгации: суброгация
          возникает в силу ст. 365 ГК РФ автоматически. Но если в договоре
          прямо указано — фиксируй текст; если прямо не указано — это
          не "not_defined" в смысле «поручитель лишён права», а «условие
          прямо не прописано». Отражай это текстом в display как
          "Прямо не установлено (действует в силу ст. 365 ГК РФ)".
        - Различай:
          - «уведомление кредитором поручителя о дефолте должника» —
            стандартное договорное условие, защищающее поручителя;
          - «уведомление должником поручителя об исполнении обязательства» —
            императивная норма ст. 366 п. 1 ГК РФ.
          Это два разных уведомления, оба могут быть в договоре.
        - Различай «суброгацию» (ст. 365 ГК РФ — переход прав кредитора
          к поручителю) и «регрессное требование» (самостоятельное
          требование поручителя к должнику). Если договор использует одно
          из слов, фиксируй как написано, но классифицируй по смыслу.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Есть ли обязанность кредитора уведомить поручителя о дефолте
          должника (форма, срок).
        2. Есть ли условия о переходе прав кредитора к поручителю
          (суброгация) после исполнения.
        3. Есть ли обязанность кредитора передать поручителю документы,
          подтверждающие исполнение и права требования.
        4. Есть ли признаки слабой или ограниченной защиты поручителя
          после исполнения (внутренняя диагностика, не для отображения).

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Если условие не указано прямо — текстовое поле = "not_defined",
          display-поле = "Не установлено".
        4. Если текст есть, но надёжный вывод сделать нельзя —
          для internal-полей = "unclear", для display-полей = "Не удалось определить".
        5. Не используй "None", "null" и пустые строки.
        6. Все 7 ключей должны присутствовать в JSON-ответе.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — полная защита: уведомление о дефолте, суброгация, передача документов:
        Фрагмент:
        "Кредитор обязан уведомить Поручителя о неисполнении Должником обязательства в течение 5 (пяти) рабочих дней с момента, когда узнал о таком неисполнении. После исполнения Поручителем обязательства к нему переходят все права Кредитора по Основному договору в объёме исполненного. Кредитор обязан в течение 10 (десяти) рабочих дней передать Поручителю оригиналы документов, подтверждающих исполнение, а также документы, удостоверяющие права требования Кредитора к Должнику."

        Ответ:
        {
          "default_notice_status": "present",
          "default_notice_display": "Предусмотрено: письменно, в течение 5 рабочих дней с момента, когда Кредитор узнал о неисполнении",
          "subrogation_status": "present",
          "subrogation_display": "Права Кредитора переходят к Поручителю в объёме исполненного (суброгация)",
          "document_transfer_to_guarantor": "present",
          "document_transfer_display": "Кредитор передаёт оригиналы документов в течение 10 рабочих дней",
          "guarantor_post_payment_protection": "strong"
        }

        Пример 2 — суброгация прямо ограничена договором (риск):
        Фрагмент:
        "Права Кредитора не переходят к Поручителю до момента полного исполнения Должником обязательств по Основному договору. Уведомление Поручителя о неисполнении не предусмотрено."

        Ответ:
        {
          "default_notice_status": "not_defined",
          "default_notice_display": "Не установлено",
          "subrogation_status": "present",
          "subrogation_display": "Суброгация ограничена: права переходят только после полного исполнения Должником",
          "document_transfer_to_guarantor": "not_defined",
          "document_transfer_display": "Не установлено",
          "guarantor_post_payment_protection": "weak"
        }

        Пример 3 — уведомление должника (ст. 366 п. 1) без уведомления кредитора:
        Фрагмент:
        "Должник, исполнивший обязательство, обязан немедленно уведомить об этом Поручителя. Условия о переходе прав Кредитора к Поручителю в договоре не установлены."

        Ответ:
        {
          "default_notice_status": "not_defined",
          "default_notice_display": "Не установлено",
          "subrogation_status": "not_defined",
          "subrogation_display": "Прямо не установлено (действует в силу ст. 365 ГК РФ)",
          "document_transfer_to_guarantor": "not_defined",
          "document_transfer_display": "Не установлено",
          "guarantor_post_payment_protection": "partial"
        }

        Пример 4 — текст есть, но надёжный вывод сделать нельзя (неоднозначная формулировка):
        Фрагмент:
        "Поручитель, исполнивший обязательство, приобретает права в порядке, установленном действующим законодательством. Уведомление Поручителя осуществляется в разумный срок."

        Ответ:
        {
          "default_notice_status": "unclear",
          "default_notice_display": "Не удалось определить (форма и срок уведомления не конкретизированы)",
          "subrogation_status": "unclear",
          "subrogation_display": "Не удалось определить (объём прав не конкретизирован)",
          "document_transfer_to_guarantor": "not_defined",
          "document_transfer_display": "Не установлено",
          "guarantor_post_payment_protection": "not_defined"
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату об уведомлении поручителя.
        2. Найди прямую цитату о переходе прав.
        3. Найди прямую цитату о передаче документов.
        4. Если прямой цитаты нет — верни "not_defined" (или "unclear",
          если в тексте есть противоречивые/неполные указания).

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь РОВНО одним JSON-объектом без какого-либо дополнительного текста до или после, со всеми 7 ключами:
        {
          "default_notice_status": "<present / unclear / not_defined>",
          "default_notice_display": "<Предусмотрено: <форма, срок> / Не удалось определить / Не установлено>",
          "subrogation_status": "<present / unclear / not_defined>",
          "subrogation_display": "<Права Кредитора переходят к Поручителю в объёме исполненного (суброгация) / Суброгация ограничена: <описание> / Прямо не установлено (действует в силу ст. 365 ГК РФ) / Не удалось определить / Не установлено>",
          "document_transfer_to_guarantor": "<present / unclear / not_defined>",
          "document_transfer_display": "<Кредитор передаёт оригиналы документов <срок> / Не удалось определить / Не установлено>",
          "guarantor_post_payment_protection": "<strong / partial / weak / not_defined>"
        }

        Верни РОВНО один JSON-объект со всеми 7 ключами без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.
      context_k: 8
      temperature: 0.0
      max_tokens: 600

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "уведомление поручителя о неисполнении дефолт кредитор обязан уведомить суброгация регресс права кредитора переходят к поручителю передача документов оригиналы исполнивший поручитель"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - remedies
      negative_keywords:
        - "означает"
        - "в целях настоящего"
        - "основное обязательство"
      position_bias:
        preferred_range: [0.25, 0.70]
        boost: 0.12
        scope: segment
      context_k: 8
      max_chunks: 10
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
        - "invoice"
      preferred_clause_functions:
        - "obligations"
        - "remedies"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 35
      max_snippet_length: 550

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 900
      compact_output: false  # [CONSIDER]

      presence_signal:
        field: "guarantor_notice_subrogation_presence"
        present_values:
          - present
        missing_values:
          - missing
        unclear_values:
          - unclear
      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора поручительства
        сведения об уведомлении поручителя о дефолте и о его правах после
        исполнения (суброгация, передача документов).
        Не анализируй срок поручительства, объём ответственности и порядок
        прекращения.
        </role>

        <context>
        {context}
        </context>

        <task>
        0. guarantor_notice_subrogation_presence:
           - "present" — в тексте есть хотя бы одно из условий: уведомление
             поручителя о дефолте, суброгация/переход прав, передача
             документов поручителю;
           - "missing" — ни одно из этих условий в тексте не упоминается;
           - "unclear" — упоминания есть, но они слишком фрагментарны или
             противоречивы для надёжного вывода.

        1. default_notice_status — "present" / "unclear" / "not_defined".
           Внутренний признак наличия условия об уведомлении поручителя
           кредитором о дефолте должника.
           - "present" — условие прямо установлено в договоре;
           - "unclear" — упоминание уведомления есть, но форма/срок
             не конкретизированы настолько, что надёжный вывод невозможен;
           - "not_defined" — условие в договоре не установлено.

        2. default_notice_display — человекочитаемое описание:
           "Предусмотрено: письменно, в течение 5 рабочих дней с момента,
           когда Кредитор узнал о неисполнении";
           "Не удалось определить (форма и срок уведомления
           не конкретизированы)";
           "Не установлено".

        3. subrogation_status — "present" / "unclear" / "not_defined".
           Внутренний признак наличия условия о переходе прав кредитора
           к поручителю.
           - "present" — условие прямо установлено (включая случаи
             ограничения суброгации);
           - "unclear" — упоминание есть, но объём/условия не конкретизированы;
           - "not_defined" — условие прямо не установлено.

        4. subrogation_display — человекочитаемое описание:
           "Права Кредитора переходят к Поручителю в объёме исполненного
           (суброгация)";
           "Суброгация ограничена: <краткое описание ограничения>";
           "Прямо не установлено (действует в силу ст. 365 ГК РФ)"
           (при subrogation_status = "not_defined" — важно не путать
           с «поручитель лишён права»);
           "Не удалось определить";
           "Не установлено".

        5. document_transfer_to_guarantor — "present" / "unclear" / "not_defined".
           Внутренний признак наличия условия о передаче документов.

        6. document_transfer_display — человекочитаемое описание:
           "Кредитор передаёт оригиналы документов <срок>";
           "Не удалось определить";
           "Не установлено".

        7. guarantor_post_payment_protection — "strong" / "partial" /
           "weak" / "not_defined".
           Внутренняя диагностика (не для отображения в Grid):
           - "strong" — есть уведомление о дефолте + суброгация без
             ограничений + передача документов;
           - "partial" — покрыты 1–2 из 3 элементов защиты;
           - "weak" — суброгация ограничена/исключена и/или уведомление
             отсутствует;
           - "not_defined" — надёжно классифицировать нельзя.

        Все 8 ключей должны присутствовать в JSON-ответе.
        </task>

        <context_rules>
        - Перед остальными полями заполни guarantor_notice_subrogation_presence по правилу из пункта 0 task.
        - Агрегируй guarantor_notice_subrogation_presence по значению хотя бы
          одного из полей: default_notice_status, subrogation_status,
          document_transfer_to_guarantor. Если хотя бы одно = "present" →
          "present"; все три = "not_defined" → "missing"; иначе → "unclear".
        - Используй только текст договора из <context>. Не подставляй нормы закона.
        - Не делай предположений и не достраивай отсутствующие реквизиты.
        - Если в <context> попали нерелевантные фрагменты — игнорируй их.
        - Если фрагменты противоречат друг другу и надёжный вывод сделать нельзя —
          верни "unclear" для соответствующих internal-полей,
          "Не удалось определить" для display-полей.
        - Отсутствие условия о суброгации в договоре ≠ отказ от суброгации:
          суброгация возникает в силу ст. 365 ГК РФ автоматически. Если прямо
          не указано — subrogation_status = "not_defined", subrogation_display =
          "Прямо не установлено (действует в силу ст. 365 ГК РФ)".
          НЕ пиши "Не установлено" — это вводит в заблуждение.
        - Различай:
          - «уведомление кредитором поручителя о дефолте должника» —
            договорное условие, покрывается полем default_notice_status;
          - «уведомление должником поручителя об исполнении обязательства» —
            императивная норма ст. 366 п. 1 ГК РФ. В default_notice_status
            НЕ отражай — это другое уведомление.
        - Различай «суброгацию» (ст. 365 ГК РФ — переход прав кредитора
          к поручителю) и «регрессное требование» (самостоятельное требование
          поручителя к должнику). Если договор использует одно из слов,
          фиксируй как написано, но классифицируй по смыслу.
        - Не используй "None", "null" и пустые строки.
        - Соблюдай точное соответствие имён ключей схеме полей.
        </context_rules>

        <edge_cases>
        1. В договоре есть только уведомление должником поручителя об исполнении
           (ст. 366 п. 1 ГК РФ), но нет уведомления кредитором о дефолте →
           default_notice_status = "not_defined", не путай два вида уведомлений.
        2. Суброгация прямо не прописана, но и не ограничена →
           subrogation_status = "not_defined",
           subrogation_display = "Прямо не установлено (действует в силу
           ст. 365 ГК РФ)". НЕ пиши просто "Не установлено".
        3. Формулировка «права переходят в порядке, установленном действующим
           законодательством» без конкретизации объёма →
           subrogation_status = "unclear" (отсылка есть, но объём не ясен).
        4. Договор содержит только общую фразу о «защите прав поручителя после
           исполнения» без какой-либо конкретики → все status-поля = "not_defined",
           guarantor_notice_subrogation_presence = "missing".
        </edge_cases>

        <output_expectations>
        - Верни РОВНО один JSON-объект со всеми 8 ключами без какого-либо
          дополнительного текста до или после.
        - Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей.
        - НЕ пиши Markdown, списки, код-фенсы.
        - Ответ должен быть валидным JSON, пригодным для парсинга через json.loads
          без предварительной обработки.
        - Технический формат JSON (value / confidence / location) задан отдельным
          контрактом — соблюдай его, но не описывай здесь.
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

