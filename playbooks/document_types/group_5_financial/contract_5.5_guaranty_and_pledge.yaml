           - "unclear" — упоминание есть, но надёжно классифицировать
             нельзя;
           - "not_defined" — согласие прямо не упомянуто.

        2. spousal_consent_display — человекочитаемое:
           "Нотариально удостоверенное согласие супруга получено
           (<реквизиты>)";
           "Письменное согласие супруга получено";
           "Не требуется (залогодатель не состоит в браке)";
           "Не требуется (брачный договор с режимом раздельной
           собственности)";
           "Не удалось определить";
           "Не установлено".

        3. marital_regime_status — "joint_property" / "separate_property" /
           "not_applicable" / "unclear" / "not_defined".

        4. marital_regime_display — человекочитаемое:
           "Совместная собственность супругов";
