  - id: guaranty_secured_obligation_check
    name: "Поручительство: обеспечиваемое обязательство"
    description: >
      Проверяет идентификацию обеспечиваемого обязательства, наличие
      поручительства за будущие обязательства и предельный объём
      обеспечения (ст. 361 п. 2 ГК РФ).
    triggers:
      any:
        - guaranty_contract
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "обеспечиваемое обязательство"
        - "основное обязательство"
        - "будущие обязательства"
        - "обязательства, которые могут возникнуть"
        - "предельный объём"
        - "максимальная сумма поручительства"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)обеспечиваем(ое|ого)\\s+обязательств|основн(ое|ого)\\s+обязательств"
        - "(?i)будущ(ие|их)\\s+обязательств|обязательств.{0,20}возникн"
        - "(?i)предельн(ый|ого)\\s+объём|максимальн(ая|ой)\\s+сумм"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор поручительства по § 5 Главы 23 ГК РФ.
        Проверяется только один вопрос: идентификация обеспечиваемого
        обязательства.

        Нормативный ориентир:
        - ст. 361 п. 1 ГК РФ — по договору поручительства поручитель
          обязывается перед кредитором другого лица отвечать за исполнение
          последним его обязательства полностью или в части
        - ст. 361 п. 2 ГК РФ — поручительство может быть дано также
          в обеспечение обязательства, которое возникнет в будущем;
          при этом в договоре поручительства должны быть указаны
          порядок и условия идентификации такого обязательства
        - ст. 329 п. 1 ГК РФ — исполнение обязательств может
          обеспечиваться поручительством
        - ст. 329 п. 3 ГК РФ — недействительность соглашения
          об обеспечении не влечёт недействительности основного
          обязательства

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора.
        - Не оценивай серьёзность риска и не определяй действительность
          поручительства.
        - Различай три факта:
          - идентификация обеспечиваемого обязательства (конкретный
            договор, рамочная отсылка, неопределённая формулировка);
          - наличие поручительства за будущие обязательства;
          - наличие предельного объёма (лимита) обеспечения.
        - Если в договоре есть ссылка на конкретный кредитный договор
          с номером и датой — это полная идентификация. Если отсылка
          обобщённая («все обязательства Должника перед Кредитором») —
          это неопределённая идентификация, которая может быть оспорена.
        - Не путай объём ответственности поручителя (лимит поручительства)
          с предельным объёмом будущих обязательств — это разные понятия.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Как идентифицировано обеспечиваемое обязательство (конкретный
          договор, рамочная отсылка, общая формулировка).
        2. Есть ли поручительство за будущие обязательства и указан ли
          порядок их идентификации.
        3. Есть ли предельный объём (лимит) обеспечиваемых обязательств.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Если условие не указано прямо — текстовое поле = "not_defined",
          display-поле = "Не установлено".
        4. Если текст есть, но надёжный вывод сделать нельзя —
          для internal-полей = "unclear", для display-полей = "Не удалось определить".
        5. Не используй "None", "null" и пустые строки.
        6. Все 6 ключей должны присутствовать в JSON-ответе.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — конкретное обязательство с полной идентификацией:
        Фрагмент:
        "Настоящим договором обеспечивается исполнение Должником обязательств по Кредитному договору № КД-2025/0456 от 15.01.2025, заключённому между Кредитором и Должником, на сумму 50 000 000 (пятьдесят миллионов) рублей."

        Ответ:
        {
          "obligation_identification_status": "present",
          "obligation_identification_display": "Кредитный договор № КД-2025/0456 от 15.01.2025 на сумму 50 000 000 руб.",
          "future_obligation_status": "excluded",
          "future_obligation_display": "Будущие обязательства не включены (конкретный договор)",
          "obligation_limit_status": "present",
          "obligation_limit_display": "50 000 000 руб. (сумма Кредитного договора)"
        }

        Пример 2 — поручительство за будущие обязательства с лимитом:
        Фрагмент:
        "Поручительство даётся в обеспечение всех существующих и будущих обязательств Должника перед Кредитором, возникающих в период с 01.01.2025 по 31.12.2027. Предельный объём обеспечиваемых обязательств составляет 100 000 000 (сто миллионов) рублей."

        Ответ:
        {
          "obligation_identification_status": "present",
          "obligation_identification_display": "Все существующие и будущие обязательства Должника перед Кредитором (период: 01.01.2025–31.12.2027)",
          "future_obligation_status": "present",
          "future_obligation_display": "Будущие обязательства включены; период возникновения: 01.01.2025–31.12.2027",
          "obligation_limit_status": "present",
          "obligation_limit_display": "Предельный объём: 100 000 000 руб."
        }

        Пример 3 — неопределённая идентификация (риск):
        Фрагмент:
        "Поручитель отвечает за все обязательства Должника перед Кредитором."

        Ответ:
        {
          "obligation_identification_status": "unclear",
          "obligation_identification_display": "Не удалось определить (обобщённая формулировка без конкретизации обязательств)",
          "future_obligation_status": "unclear",
          "future_obligation_display": "Не удалось определить (неясно, включены ли будущие обязательства)",
          "obligation_limit_status": "not_defined",
          "obligation_limit_display": "Не установлено"
        }

        Пример 4 — рамочная отсылка к основному договору:
        Фрагмент:
        "Поручительство обеспечивается по Основному договору, указанному в п. 1.1 настоящего договора."

        Ответ:
        {
          "obligation_identification_status": "present",
          "obligation_identification_display": "Ссылка на Основной договор (п. 1.1)",
          "future_obligation_status": "not_defined",
          "future_obligation_display": "Не установлено",
          "obligation_limit_status": "not_defined",
          "obligation_limit_display": "Не установлено"
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату об обеспечиваемом обязательстве.
        2. Найди прямую цитату о будущих обязательствах.
        3. Найди прямую цитату о предельном объёме.
        4. Если прямой цитаты нет — верни "not_defined".

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь РОВНО одним JSON-объектом без какого-либо дополнительного текста до или после, со всеми 6 ключами:
        {
          "obligation_identification_status": "<present / unclear / not_defined>",
          "obligation_identification_display": "<описание обязательства / Не удалось определить / Не установлено>",
          "future_obligation_status": "<present / excluded / unclear / not_defined>",
          "future_obligation_display": "<описание / Не удалось определить / Не установлено>",
          "obligation_limit_status": "<present / unclear / not_defined>",
          "obligation_limit_display": "<описание лимита / Не удалось определить / Не установлено>"
        }

        Верни РОВНО один JSON-объект со всеми 6 ключами без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.
