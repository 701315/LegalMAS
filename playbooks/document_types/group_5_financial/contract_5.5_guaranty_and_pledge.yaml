  - id: pledge_bankruptcy_risk_check
    name: "Залог: банкротные заверения и защита от оспаривания"
    description: >
      Проверяет наличие в договоре заверений об отсутствии признаков
      банкротства и об отсутствии оспоримых сделок.
    triggers:
      any:
        - pledge_contract
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "отсутствие признаков банкротства"
        - "отсутствие процедуры банкротства"
        - "сделка с предпочтением"
        - "подозрительная сделка"
        - "риски оспаривания"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)признак(ов|и)?\\s+банкротств|процедур[ыа]\\s+банкротств"
        - "(?i)сделк[аи]\\s+с\\s+предпочтени|подозрительн(ая|ой)\\s+сделк"
        - "(?i)оспорим(ая|ой)\\s+сделк"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор залога по § 3 Главы 23 ГК РФ.
        Проверяется только один вопрос: банкротные заверения и защита
        от оспаривания сделки.

        Нормативный ориентир:
        - ст. 61.1 ФЗ-127 — общие положения об оспаривании сделок должника
        - ст. 61.2 ФЗ-127 — подозрительные сделки (неравноценное встречное
          предоставление, цель причинения вреда кредиторам)
        - ст. 61.3 ФЗ-127 — сделки с предпочтением (отдельным кредиторам)
        - ст. 61.6 ФЗ-127 — последствия недействительности сделки
        - Постановление Пленума ВАС РФ от 23.12.2010 № 63 — практика
          оспаривания сделок в банкротстве

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора,
          а чего прямо нет.
        - Не оценивай серьёзность риска и устойчивость сделки к оспариванию.
          Это делает отдельный слой анализа, а не extraction.
        - Не подставляй нормы закона вместо текста договора.
        - Различай:
          - «сделка с предпочтением» (ст. 61.3 ФЗ-127) — удовлетворение
            требований одного кредитора в ущерб другим;
          - «подозрительная сделка» (ст. 61.2 ФЗ-127) — неравноценное
            встречное предоставление или цель причинения вреда.
          Это разные конструкции, но в договоре могут быть перечислены
          вместе.
        - Если в договоре прямо нет банкротных заверений сверх тех, что
          уже содержатся в универсальных R&W (по global layer) — фиксируй
          "not_defined". Не нужно «дотягивать» ответ до present из-за
          наличия общих R&W-оговорок.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Есть ли заверения об отсутствии признаков банкротства
          (у залогодателя и/или связанных лиц).
        2. Есть ли заверения об отсутствии оспоримых сделок
          (сделки с предпочтением, подозрительные сделки).
        3. Какие именно формулировки использованы в этих заверениях.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Если условие не указано прямо — текстовое поле = "not_defined",
          display-поле = "Не установлено".
        4. Если текст есть, но надёжный вывод сделать нельзя —
          для internal-полей = "unclear", для display-полей = "Не удалось определить".
        5. Не используй "None", "null" и пустые строки.
        6. Все 4 ключа должны присутствовать в JSON-ответе.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — полные банкротные заверения:
        Фрагмент:
        "Залогодатель заверяет, что в отношении него не введены процедуры банкротства, отсутствуют признаки несостоятельности, предусмотренные Федеральным законом «О несостоятельности (банкротстве)», не поданы заявления о признании его банкротом, а также отсутствуют основания для оспаривания настоящего договора как сделки с предпочтением или подозрительной сделки."

        Ответ:
        {
          "bankruptcy_representation_status": "present",
          "bankruptcy_representation_display": "Предусмотрены заверения об отсутствии признаков банкротства",
          "bankruptcy_rep_details_status": "present",
          "bankruptcy_rep_details_display": "Отсутствие процедур банкротства; отсутствие признаков несостоятельности; отсутствие заявлений о банкротстве; отсутствие оснований для оспаривания договора как сделки с предпочтением или подозрительной сделки"
        }

        Пример 2 — только частичные заверения:
        Фрагмент:
        "Залогодатель подтверждает, что не находится в процедуре банкротства."

        Ответ:
        {
          "bankruptcy_representation_status": "present",
          "bankruptcy_representation_display": "Предусмотрены заверения об отсутствии процедуры банкротства",
          "bankruptcy_rep_details_status": "partial",
          "bankruptcy_rep_details_display": "Отсутствие процедуры банкротства (без заверений об оспоримости сделок)"
        }

        Пример 3 — заверений нет (типично, если R&W покрыты global layer):
        Фрагмент:
        "Залогодатель подтверждает своё право собственности на предмет залога и отсутствие обременений, не указанных в настоящем договоре."

        Ответ:
        {
          "bankruptcy_representation_status": "not_defined",
          "bankruptcy_representation_display": "Не установлено",
          "bankruptcy_rep_details_status": "not_defined",
          "bankruptcy_rep_details_display": "Не установлено"
        }

        Пример 4 — текст есть, но надёжный вывод сделать нельзя (неоднозначная формулировка):
        Фрагмент:
        "Залогодатель заверяет об отсутствии обстоятельств, которые могли бы повлиять на действительность настоящего договора."

        Ответ:
        {
          "bankruptcy_representation_status": "unclear",
          "bankruptcy_representation_display": "Не удалось определить (формулировка не упоминает банкротство прямо)",
          "bankruptcy_rep_details_status": "unclear",
          "bankruptcy_rep_details_display": "Не удалось определить (обобщённая формулировка без прямой ссылки на банкротство)"
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о процедурах банкротства.
        2. Найди прямую цитату об оспоримых сделках (с предпочтением /
          подозрительных).
        3. Если прямой цитаты нет — верни "not_defined".

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь РОВНО одним JSON-объектом без какого-либо дополнительного текста до или после, со всеми 4 ключами:
        {
          "bankruptcy_representation_status": "<present / unclear / not_defined>",
          "bankruptcy_representation_display": "<Предусмотрены заверения об отсутствии признаков банкротства / Предусмотрены заверения об отсутствии процедуры банкротства / Не удалось определить / Не установлено>",
          "bankruptcy_rep_details_status": "<present / partial / unclear / not_defined>",
          "bankruptcy_rep_details_display": "<перечень заверений / Не удалось определить / Не установлено>"
        }

        Верни РОВНО один JSON-объект со всеми 4 ключами без какого-либо дополнительного текста до или после. Начни ответ сразу с открывающей фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга через json.loads без предварительной обработки.
      context_k: 6
      temperature: 0.0
      max_tokens: 500

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "заверения об отсутствии банкротства отсутствие процедуры банкротства признаки несостоятельности сделка с предпочтением подозрительная сделка оспаривание сделки"
      preferred_unit_types:
        - warranty
        - obligation
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - representations
        - warranties
      negative_keywords:
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.35, 0.80]
        boost: 0.14
        scope: segment
      context_k: 6
      max_chunks: 8
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
        - "invoice"
      preferred_clause_functions:
        - "representations"
        - "warranties"
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 35
      max_snippet_length: 550

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 800
      compact_output: false  # [CONSIDER]

      presence_signal:
        field: "bankruptcy_rep_presence"
        present_values:
          - present
        missing_values:
          - missing
        unclear_values:
          - unclear
      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора залога сведения
        о банкротных заверениях и заверениях об отсутствии оспоримых сделок.
        Не анализируй устойчивость сделки к оспариванию и не давай оценок
        риска.
        </role>

        <context>
        {context}
        </context>

        <task>
        0. bankruptcy_rep_presence:
           - "present" — в тексте есть заверения об отсутствии признаков
             банкротства, процедур банкротства или оспоримых сделок;
           - "missing" — банкротные заверения в тексте отсутствуют;
           - "unclear" — есть общие формулировки о действительности
             договора, но банкротство прямо не упомянуто.

        1. bankruptcy_representation_status — "present" / "unclear" /
           "not_defined".
           Внутренний признак наличия банкротных заверений:
           - "present" — в договоре прямо есть заверения об отсутствии
             признаков банкротства или процедур банкротства;
           - "unclear" — есть общая отсылка к действительности договора
             или обстоятельствам, но банкротство прямо не упомянуто;
           - "not_defined" — заверений нет.

        2. bankruptcy_representation_display — человекочитаемое описание:
           "Предусмотрены заверения об отсутствии признаков банкротства";
           "Предусмотрены заверения об отсутствии процедуры банкротства";
           "Не удалось определить (формулировка не упоминает банкротство
           прямо)";
           "Не установлено".

        3. bankruptcy_rep_details_status — "present" / "partial" /
           "unclear" / "not_defined".
           Внутренний признак полноты банкротных заверений:
           - "present" — покрыты и процедуры банкротства, и оспоримость
             сделок (с предпочтением / подозрительные);
           - "partial" — покрыта только одна из тем;
           - "unclear" — покрытие есть, но сформулировано обобщённо;
           - "not_defined" — конкретика отсутствует.

        4. bankruptcy_rep_details_display — человекочитаемый перечень:
           "<перечень заверений, как указаны в договоре>";
           "Не удалось определить";
           "Не установлено".

        Все 5 ключей должны присутствовать в JSON-ответе.
        </task>

        <context_rules>
        - Перед остальными полями заполни bankruptcy_rep_presence по правилу из пункта 0 task.
        - Агрегируй bankruptcy_rep_presence по значению
          bankruptcy_representation_status: если = "present" → "present";
          если = "not_defined" и bankruptcy_rep_details_status = "not_defined"
          → "missing"; иначе → "unclear".
        - Используй только текст договора из <context>. Не подставляй нормы
          закона.
        - Не делай предположений и не достраивай отсутствующие реквизиты.
        - Если в <context> попали нерелевантные фрагменты — игнорируй их.
        - Если фрагменты противоречат друг другу и надёжный вывод сделать
          нельзя — верни "unclear" для internal-полей, "Не удалось
          определить" для display-полей.
        - Различай «сделку с предпочтением» (ст. 61.3 ФЗ-127) и
          «подозрительную сделку» (ст. 61.2 ФЗ-127). Если договор
          перечисляет оба понятия — отражай оба в details.
        - Если в договоре прямо нет банкротных заверений —
          bankruptcy_representation_status = "not_defined". Не дотягивай
          до present из-за общих R&W-оговорок, не упоминающих банкротство.
        - Не используй "None", "null" и пустые строки.
        - Соблюдай точное соответствие имён ключей схеме полей.
        </context_rules>

        <edge_cases>
        1. Общая R&W-оговорка «Стороны заверяют о соблюдении требований
           законодательства» без упоминания банкротства →
           bankruptcy_representation_status = "not_defined" (не дотягивай
           до present).
        2. Заверение только об «отсутствии процедуры банкротства», без
           упоминания оспоримых сделок →
           bankruptcy_representation_status = "present",
           bankruptcy_rep_details_status = "partial".
        3. Формулировка «отсутствие обстоятельств, способных повлиять
           на действительность договора» без прямой ссылки на банкротство →
           bankruptcy_representation_status = "unclear".
        4. Банкротные заверения даны основным должником, а не залогодателем
           (например, в трёхстороннем договоре) →
           bankruptcy_representation_status = "present", в display укажи,
           кем именно даны заверения.
        </edge_cases>

        <output_expectations>
        - Верни РОВНО один JSON-объект со всеми 5 ключами без какого-либо
          дополнительного текста до или после.
        - Начни ответ сразу с открывающей фигурной скобки и закончи
          закрывающей.
        - НЕ пиши Markdown, списки, код-фенсы.
        - Ответ должен быть валидным JSON, пригодным для парсинга через
          json.loads без предварительной обработки.
        - Технический формат JSON (value / confidence / location) задан
          отдельным контрактом — соблюдай его, но не описывай здесь.
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
