  - id: guarantor_defenses_and_objections_check
    name: "Поручитель: возражения против требований кредитора"
    description: >
      Проверяет право поручителя выдвигать возражения должника, отказ
      от возражений и последствия отказа кредитора принять исполнение.
    triggers:
      any:
        - guaranty_contract
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "возражения должника"
        - "поручитель вправе возражать"
        - "отказ от возражений"
        - "не вправе выдвигать возражения"
        - "отказ кредитора принять исполнение"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)возражени[яй]\\s+должник|поручитель\\s+вправе\\s+возраж"
        - "(?i)не\\s+вправе\\s+(выдвигать|заявлять)\\s+возражен"
        - "(?i)отказ.{0,30}принять\\s+исполнени"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор поручительства по § 5 Главы 23 ГК РФ.
        Проверяется только один вопрос: возражения поручителя против
        требований кредитора.

        Нормативный ориентир:
        - ст. 364 ГК РФ — поручитель вправе выдвигать против требований
          кредитора возражения, которые мог бы представить должник,
          даже если должник от этих возражений отказался
        - ст. 364 п. 2 ГК РФ — поручитель не теряет права на возражения
          после смерти должника или признания его банкротом
        - ст. 367 п. 3 ГК РФ — прекращение поручительства при отказе
          кредитора принять надлежащее исполнение от должника или
          поручителя

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора.
        - Не оценивай серьёзность риска.
        - Право поручителя выдвигать возражения должника (ст. 364 ГК РФ) —
          императивная норма; она действует в силу закона независимо
          от текста договора. В поле debtor_defenses_right_status нужно
          фиксировать не действие нормы, а именно текст договора:
          есть ли прямое упоминание (обычно «поручитель вправе выдвигать
          возражения должника» или «поручитель пользуется всеми правами
          кредитора по отношению к должнику»).
        - Различай три разных факта:
          - прямое закрепление права поручителя на возражения;
          - наличие отказа поручителя от возражений;
          - оговорки о последствиях отказа кредитора принять исполнение.
        - Если в договоре прямо нет отказа от возражений — это
          не «отказ отсутствует», а «условие прямо не установлено».

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Есть ли прямое закрепление права поручителя выдвигать
          возражения должника.
        2. Есть ли отказ поручителя от права на возражения.
        3. Есть ли оговорки о последствиях отказа кредитора принять
          надлежащее исполнение.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Если условие не указано прямо — текстовое поле = "not_defined",
          display-поле = "Не установлено".
        4. Если текст есть, но надёжный вывод сделать нельзя —
          для internal-полей = "unclear", для display-полей = "Не удалось определить".
        5. Не используй "None", "null" и пустые строки.
        6. Все 6 ключей должны присутствовать в JSON-ответе.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — прямое закрепление права на возражения, отказа нет:
        Фрагмент:
        "Поручитель вправе выдвигать против требований Кредитора все возражения, которые мог бы представить Должник, даже если Должник от таких возражений отказался."

        Ответ:
        {
          "debtor_defenses_right_status": "present",
          "debtor_defenses_right_display": "Право поручителя выдвигать возражения должника прямо закреплено",
          "waiver_of_defenses_status": "not_defined",
          "waiver_of_defenses_display": "Отказ от возражений не установлен",
          "refusal_of_acceptance_provision_status": "not_defined",
          "refusal_of_acceptance_provision_display": "Не установлено"
        }

        Пример 2 — отказ поручителя от возражений:
        Фрагмент:
        "Поручитель не вправе выдвигать против требований Кредитора какие-либо возражения, которые могли бы быть предъявлены Должником, и отказывается от таких возражений."

        Ответ:
        {
          "debtor_defenses_right_status": "not_defined",
          "debtor_defenses_right_display": "Право на возражения прямо не закреплено",
          "waiver_of_defenses_status": "present",
          "waiver_of_defenses_display": "Поручитель прямо отказался от права выдвигать возражения должника",
          "refusal_of_acceptance_provision_status": "not_defined",
          "refusal_of_acceptance_provision_display": "Не установлено"
        }

        Пример 3 — оговорка о последствиях отказа кредитора принять исполнение:
        Фрагмент:
        "Если Кредитор отказался принять надлежащее исполнение, предложенное Должником или Поручителем, поручительство прекращается."

        Ответ:
        {
          "debtor_defenses_right_status": "not_defined",
          "debtor_defenses_right_display": "Право на возражения прямо не закреплено",
          "waiver_of_defenses_status": "not_defined",
          "waiver_of_defenses_display": "Отказ от возражений не установлен",
          "refusal_of_acceptance_provision_status": "present",
          "refusal_of_acceptance_provision_display": "Поручительство прекращается при отказе Кредитора принять надлежащее исполнение (в соответствии со ст. 367 п. 3 ГК РФ)"
        }

        Пример 4 — текст есть, но надёжный вывод сделать нельзя:
        Фрагмент:
        "Поручитель пользуется всеми правами, предоставленными ему действующим законодательством."

        Ответ:
        {
          "debtor_defenses_right_status": "unclear",
          "debtor_defenses_right_display": "Не удалось определить (обобщённая формулировка без прямого закрепления права на возражения)",
          "waiver_of_defenses_status": "not_defined",
          "waiver_of_defenses_display": "Отказ от возражений не установлен",
          "refusal_of_acceptance_provision_status": "not_defined",
          "refusal_of_acceptance_provision_display": "Не установлено"
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о праве поручителя на возражения.
        2. Найди прямую цитату об отказе от возражений.
        3. Найди прямую цитату об отказе кредитора принять исполнение.
        4. Если прямой цитаты нет — верни "not_defined".

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь РОВНО одним JSON-объектом без какого-либо дополнительного текста до или после, со всеми 6 ключами:
        {
          "debtor_defenses_right_status": "<present / unclear / not_defined>",
