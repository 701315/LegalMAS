    rules:
      keywords:
        - "конфиденциальность"
        - "неразглашение"
        - "коммерческая тайна"
      keyword_mode: "any"

  - id: "notary_requirement"
    name: "Нотариальная форма (для залога доли в ООО и отдельных ипотечных сделок)"
    description: "Залог доли в ООО требует нотариального удостоверения"
    legal_base: "ст. 22 ФЗ-14, ст. 339 ГК РФ"
    severity: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers:
      any: ["share_pledge"]
    rules:
      keywords:
        - "нотариальное удостоверение"
        - "нотариус"
        - "нотариальная форма"
        - "удостоверено нотариусом"
      keyword_mode: "any"

# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 7: DD_REQUEST_TEMPLATES
#  Читается: DDRequestTemplateLoader
#  Ключи = check_id из checks_v8 и doc_type_checks выше.
#  DDRequestTemplateLoader.render() матчит по exact или prefix.
# ════════════════════════════════════════════════════════════════════════════

dd_request_templates:

  security_subject_extraction:
    text: >
      Просим предоставить по {doc_names}: базовую структуру обеспечительной сделки —
      тип обеспечения (поручительство/залог/ипотека), стороны,
      основное обеспечиваемое обязательство, объем ответственности или предмет залога,
      сумму обеспечиваемого обязательства и порядок обращения взыскания.
    addressee: "Кредитор / Юридический советник"

  secured_obligation_reference:
    text: >
      Просим уточнить по {doc_names}: какое именно обязательство обеспечивается,
      указать номер, дату, стороны, сумму, срок исполнения и приложить основной договор.
    addressee: "Кредитор / Должник"

  no_secured_obligation_reference:
    text: >
      В {doc_names} не выявлена достаточная ссылка на основное обязательство.
      Просим срочно конкретизировать обеспечиваемое обязательство,
      иначе обеспечительная конструкция находится под риском недействительности/неопределенности.
    addressee: "Юридический советник"

  guaranty_liability_scope_check:
    text: >
      Просим предоставить по {doc_names}: точное описание объема ответственности поручителя,
      указать, является ли она солидарной или субсидиарной,
      есть ли лимит суммы и включает ли ответственность проценты, неустойку и судебные расходы.
    addressee: "Кредитор / Поручитель"

  guarantor_liability_scope:
    text: >
      Просим уточнить в {doc_names}: пределы ответственности поручителя,
      ее вид (солидарная/субсидиарная) и максимальную сумму поручительства.
    addressee: "Юридический советник"

  guaranty_change_and_termination_check:
    text: >
      Просим предоставить по {doc_names}: условия изменения основного обязательства,
      порядок получения согласия поручителя, срок поручительства,
      основания его прекращения и правовые последствия изменения долга без согласия поручителя.
    addressee: "Кредитор / Поручитель"

  guarantor_consent_to_changes:
    text: >
      Просим уточнить в {doc_names}: требуется ли отдельное согласие поручителя
      на изменение основного обязательства, и исключить чрезмерно широкие формулы
      о согласии на любые будущие изменения.
    addressee: "Юридический советник"

  blanket_guarantor_consent_risk:
    text: >
      В {doc_names} выявлен риск бланкетного согласия поручителя на любые будущие изменения долга.
      Просим скорректировать договор, ограничив согласие конкретными параметрами
      либо введя обязанность отдельного письменного согласования.
    addressee: "Юридический советник / Поручитель"

  guarantor_default_notice_and_subrogation_check:
    text: >
      Просим уточнить по {doc_names}: обязан ли кредитор уведомлять поручителя о дефолте должника,
      какие документы передаются поручителю после исполнения обязательства,
      и как реализуются регрессные/суброгационные права поручителя.
    addressee: "Кредитор / Поручитель"

  guarantor_notification_of_default:
    text: >
      Просим включить/уточнить в {doc_names}: обязанность кредитора уведомлять поручителя
      о просрочке/неисполнении должником обязательства и срок такого уведомления.
    addressee: "Юридический советник"

  guarantor_subrogation_rights:
    text: >
      Просим уточнить в {doc_names}: порядок перехода к поручителю прав кредитора
      после исполнения обязательства, включая передачу документов, обеспечений и доказательств задолженности.
    addressee: "Кредитор / Юридический советник"

  pledge_subject_and_valuation_check:
    text: >
      Просим предоставить по {doc_names}: точное описание предмета залога,
      документы, индивидуализирующие имущество, оценку предмета залога
      и указание, у какой стороны находится имущество.
    addressee: "Залогодатель / Залогодержатель"

  pledged_property_description:
    text: >
      Просим уточнить в {doc_names}: предмет залога, его идентификационные признаки,
      правоустанавливающие документы, а для недвижимости — кадастровые данные и выписку ЕГРН.
    addressee: "Залогодатель"

  pledge_valuation:
    text: >
      Просим предоставить по {doc_names}: оценку предмета залога,
      отчет оценщика (если есть), методику определения стоимости
      и дату, на которую определена оценка.
    addressee: "Залогодатель / Залогодержатель"

  pledge_subject_location:
    text: >
      Просим уточнить в {doc_names}: у какой стороны находится предмет залога,
      кто несет расходы на его содержание и кто отвечает за риск случайной гибели/повреждения.
    addressee: "Обе стороны"

  pledge_enforcement_check:
    text: >
      Просим уточнить по {doc_names}: применяется ли судебный или внесудебный порядок обращения взыскания,
      каков способ реализации предмета залога, как и в какие сроки уведомляется залогодатель,
      и как определяется начальная цена реализации.
    addressee: "Залогодержатель / Юридический советник"

  judicial_enforcement_requirement:
    text: >
      Просим уточнить в {doc_names}: порядок обращения взыскания на предмет залога
      и правовое основание для внесудебной реализации, если она предусмотрена.
    addressee: "Юридический советник"

  out_of_court_enforcement_without_procedure:
    text: >
      В {doc_names} выявлен риск внесудебного обращения взыскания без достаточной процедуры.
      Просим детализировать уведомления, оценку, способ реализации,
      сроки и порядок распределения выручки.
    addressee: "Юридический советник / Залогодержатель"

  mortgage_registration_check:
    text: >
      По {doc_names} (ипотека/залог недвижимости) просим предоставить:
      порядок государственной регистрации, комплект документов для Росреестра,
      распределение расходов и сведения о закладной, если она оформляется.
    addressee: "Залогодержатель / Залогодатель"

  mortgage_registration_obligation:
    text: >
      Просим включить/уточнить в {doc_names}: механизм государственной регистрации ипотеки,
      сторону, ответственную за подачу документов, и последствия уклонения от регистрации.
    addressee: "Юридический советник"

  mortgage_without_registration_logic:
    text: >
      В {doc_names} выявлено отсутствие достаточного механизма регистрации ипотеки.
      Просим срочно уточнить порядок регистрации в ЕГРН и комплект регистрационных документов.
    addressee: "Юридический советник / Залогодержатель"

  pledge_no_encumbrances:
    text: >
      Просим предоставить по {doc_names}: заверения об отсутствии иных обременений,
      подтверждение отсутствия предыдущих залогов и прав третьих лиц,
      а для недвижимости — актуальную выписку ЕГРН.
    addressee: "Залогодатель"

  subsequent_pledge_control:
    text: >
      Просим уточнить в {doc_names}: допускается ли последующий залог,
      требуется ли согласие текущего залогодержателя и каков порядок раскрытия информации
      о уже существующих обременениях.
    addressee: "Залогодержатель / Юридический советник"

  pledge_insurance_and_bankruptcy_check:
    text: >
      Просим предоставить по {doc_names}: условия страхования предмета залога,
      назначение выгодоприобретателя, страховую сумму, а также заверения сторон
      об отсутствии признаков банкротства и иных оснований для оспаривания сделки.
    addressee: "Залогодатель / Залогодержатель"

  pledge_insurance_obligation:
    text: >
      Просим уточнить в {doc_names}: обязанность страхования предмета залога,
      кто оплачивает страховку, кто назначается выгодоприобретателем
      и как используется страховое возмещение.
    addressee: "Залогодатель / Юридический советник"

  pledgor_right_to_use_property:
    text: >
      Просим уточнить по {doc_names}: сохраняет ли залогодатель право владения и пользования
      предметом залога, вправе ли извлекать из него доходы и какие ограничения при этом действуют.
    addressee: "Залогодатель / Юридический советник"

  bankruptcy_risks_awareness:
    text: >
      Просим предоставить по {doc_names}: заверения об отсутствии признаков банкротства,
      сведения о финансовом состоянии должника/залогодателя/поручителя,
      а также правовое заключение о рисках оспаривания обеспечительной сделки.
    addressee: "Юридический советник / Финансовый консультант"

  guaranty_term_expiry_risk:
    text: >
      ВНИМАНИЕ: в {doc_names} не указан срок поручительства.
      По ст. 367 п. 6 ГК РФ поручительство прекращается через 1 год
      с момента наступления срока исполнения основного обязательства.
      Просим явно установить срок поручительства.
    addressee: "Кредитор / Юридический советник"

  pledge_registration_movable_required:
    text: >
      По {doc_names} (залог движимого имущества) просим обеспечить
      регистрацию уведомления о залоге в реестре нотариата (ст. 339.1 п. 4 ГК РФ).
      Без уведомления залог не противопоставим третьим лицам.
    addressee: "Залогодержатель / Нотариус"

  consumer_pledge_sole_dwelling:
    text: >
      По {doc_names} — залог жилого помещения. Просим подтвердить:
      (а) не является ли жильё единственным для залогодателя;
      (б) если является — оформлена ли ипотека по ФЗ-102
      (без неё обращение взыскания невозможно по ст. 446 ГПК РФ).
    addressee: "Залогодатель / Юридический советник"

  pledge_priority_and_ranking:
    text: >
      По {doc_names} просим уточнить: (а) старшинство залога;
      (б) наличие предшествующих залогов; (в) ссылку на межкредиторское соглашение.
    addressee: "Залогодержатель / Юридический советник"

  guarantor_financial_capacity:
    text: >
      По {doc_names} просим предоставить: (а) заверения о финансовом состоянии поручителя;
      (б) обязательство предоставлять отчётность; (в) финансовые ковенанты.
    addressee: "Поручитель / Кредитор"

  pledge_covenants_check:
    text: >
      По {doc_names} просим согласовать ковенанты залогодателя:
      (а) запрет отчуждения/обременения; (б) право залогодержателя на осмотр;
      (в) обязанность содержания и уведомления о рисках.
    addressee: "Залогодатель / Залогодержатель"

  cross_default_acceleration:
    text: >
      По {doc_names} просим согласовать: (а) кросс-дефолт;
      (б) условия досрочного востребования; (в) порядок уведомления.
    addressee: "Юридический советник"

  dispute_resolution_security:
    text: >
      Просим согласовать по {doc_names} порядок разрешения споров:
      претензионный порядок, подсудность, арбитраж.
    addressee: "Юридический советник"

  force_majeure_security:
    text: >
      Просим уточнить для {doc_names} условия о форс-мажоре.
    addressee: "Юридический советник"

  governing_law_security:
    text: >
      Просим указать применимое право для {doc_names}.
    addressee: "Юридический советник"

  confidentiality_security:
    text: >
      Просим согласовать для {doc_names} условия конфиденциальности.
    addressee: "Юридический советник"

  notary_requirement:
    text: >
      По {doc_names} (залог доли в ООО) — требуется нотариальное удостоверение.
      Просим согласовать нотариуса, дату, комплект документов.
    addressee: "Обе стороны / Нотариус"

  guaranty_term_and_termination:
    text: >
      Просим уточнить в {doc_names}: срок поручительства и основания прекращения.
    addressee: "Юридический советник"

  # Generic fallback
  _default:
    text: >
      Просим предоставить дополнительную информацию по вопросу «{check_name}»
      применительно к {doc_names}.
    addressee: "Юридический советник"