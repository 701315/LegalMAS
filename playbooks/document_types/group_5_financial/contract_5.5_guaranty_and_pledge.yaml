type: contract_5.5_guaranty_and_pledge
name: "Договор поручительства / Договор залога"

description: |
  Комплексный обеспечительный тип документа, охватывающий две акцессорные конструкции:
  1) поручительство — обязательство поручителя отвечать перед кредитором должника
  за исполнение последним его обязательства полностью или в части;
  2) залог — право кредитора (залогодержателя) получить удовлетворение из стоимости
  заложенного имущества преимущественно перед другими кредиторами залогодателя.
  Регулируется Главой 23 ГК РФ, а для ипотеки — также Федеральным законом об ипотеке.
  Ключевыми вопросами практики являются корректная привязка к основному обязательству,
  пределы ответственности поручителя, сроки и основания прекращения поручительства,
  индивидуализация и оценка предмета залога, приоритет залога, регистрация ипотеки,
  порядок обращения взыскания и банкротные риски оспаривания обеспечительной сделки.

version: 4.0
parent: class_5_financial_security

# Структура
#   classification_runtime_v1  → YAMLRegistry (L1/L2 классификация)
#   trigger_definitions        → TriggerDetector
#   checks_v8                  → DocTypeCheckLoader (прямое исполнение)
#   doc_type_checks            → DocTypeCheckConverter (авто-конверсия)
#   dd_request_templates       → DDRequestTemplateLoader
#   compliance_rules           → exclusion_logic → compliance-проверки

metadata:
  category: contract
  subcategory: financial_security
  complexity: high
  risk_level: critical
  jurisdiction: RU
  language: ru
  legal_base: "§ 5 Главы 23 ГК РФ (ст. 361-367) — поручительство; § 3 Главы 23 ГК РФ (ст. 334-358.18) — залог"
  doc_types_supported:
    - "договор поручительства"
    - "договор залога"
    - "договор ипотеки"
    - "договор залога движимого имущества"
    - "договор залога прав требования"
    - "договор залога доли"
    - "договор последующего залога"
    - "договор поручительства по кредиту"
    - "договор поручительства по договору поставки"
    - "договор залога товаров в обороте"

engine_expectations:
  evidence_required: true
  evidence_style: "pinpoint"
  allow_not_found: true
  output_style: "dd_grid"
  prefer_structured_outputs: true

# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 1: КЛАССИФИКАЦИЯ (L1/L2)
#  Читается: YAMLRegistry → L1FilenameClassifier, L2HeaderClassifier
# ════════════════════════════════════════════════════════════════════════════

classification_runtime_v1:

  rules:

    filename_patterns:
      - "(?i)поручительств"
      - "(?i)залог"
      - "(?i)ипотек"
      - "(?i)pledge"
      - "(?i)guarant"
      - "(?i)surety"

    folder_patterns:
      - "(?i)security"
      - "(?i)collateral"
      - "(?i)pledge"
      - "(?i)залог"
      - "(?i)поручительств"

    keywords:

      high:
        - "(?i)поручительств[оа]"
        - "(?i)поручител[ьяеи]"
        - "(?i)договор\\s+поручительств[ауы]"
        - "(?i)договор\\s+поручительств[ауы]\\s+по\\s+кредит[уы]"
        - "(?i)договор\\s+поручительств[ауы]\\s+по\\s+договор[уые]\\s+поставк[иуы]"
        - "(?i)залог[ауы]?"
        - "(?i)ипотек[ауы]"
        - "(?i)договор\\s+залога"
        - "(?i)договор\\s+ипотек[иыу]"
        - "(?i)договор\\s+залога\\s+движим[огоой\\s]*имуществ[ао]"
        - "(?i)договор\\s+залога\\s+прав[ао]\\s+требован[ияи]"
        - "(?i)договор\\s+залога\\s+дол[иьи]"
        - "(?i)договор\\s+последующ[егоой]\\s+залога"
        - "(?i)договор\\s+залога\\s+товар[ова]\\s+в\\s+оборот[ееи]"
        - "(?i)залогодател[ьяеи]"
        - "(?i)залогодержател[ьяеи]"
        - "(?i)обеспечен[иеия]\\s+обязательств[аы]"
        - "(?i)основн[оеое]\\s+обязательств[оа]"
        - "(?i)предмет\\s+залога"
        - "(?i)обращен[иеия]\\s+взыскан[ияи]\\s+на\\s+предмет\\s+залога"

      medium:
        - "солидарная ответственность"
        - "субсидиарная ответственность"
        - "регрессное требование"
        - "закладная"
        - "оценка залога"
        - "последующий залог"
        - "страхование предмета залога"
        - "внесудебный порядок"
        - "срок поручительства"
        - "реестр уведомлений о залоге"

      low:
        - "имущественное обеспечение"
        - "обременение"
        - "созалогодержатель"
        - "залог прав"
        - "товары в обороте"
        - "банкротство"
        - "предпочтение"

    exclusions:
      - "независимая гарантия"
      - "банковская гарантия"
      - "купля-продажа"
      - "дарение"
      - "страхование"

# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 2: ТРИГГЕРЫ
#  Читается: TriggerDetector → doc.applicable_triggers
# ════════════════════════════════════════════════════════════════════════════

trigger_definitions:

  guaranty_contract:
    any_keywords:
      - "поручительство"
      - "поручитель"
      - "отвечать за должника"
      - "солидарная ответственность"
      - "субсидиарная ответственность"

  pledge_contract:
    any_keywords:
      - "залог"
      - "залогодатель"
      - "залогодержатель"
      - "предмет залога"
      - "обращение взыскания"

  mortgage_pledge:
    any_keywords:
      - "ипотека"
      - "залог недвижимости"
      - "закладная"
      - "егрн"
      - "государственная регистрация ипотеки"

  movable_pledge:
    any_keywords:
      - "движимое имущество"
      - "транспортное средство"
      - "оборудование"
      - "товары в обороте"
      - "реестр уведомлений о залоге"

  rights_pledge:
    any_keywords:
      - "залог прав"
      - "право требования"
      - "залог имущественных прав"
      - "дебиторская задолженность"

  third_party_pledgor:
    any_keywords:
      - "третье лицо"
      - "залогодатель не является должником"
      - "обеспечивает обязательства должника"
      - "имущество третьего лица"

  subsidiary_guaranty:
    any_keywords:
      - "субсидиарная ответственность"
      - "после предъявления требований к должнику"
      - "сначала к должнику"

  out_of_court_enforcement:
    any_keywords:
      - "внесудебный порядок"
      - "внесудебное обращение взыскания"
      - "без обращения в суд"
      - "соглашение о внесудебном порядке"

  subsequent_pledge:
    any_keywords:
      - "последующий залог"
      - "повторный залог"
      - "следующий залогодержатель"

  secured_real_estate:
    any_keywords:
      - "квартира"
      - "здание"
      - "помещение"
      - "земельный участок"
      - "объект недвижимости"

  share_pledge:
    any_keywords:
      - "залог доли"
      - "доля в уставном капитале"
      - "залог доли в ООО"
      - "нотариальное удостоверение залога доли"
      - "ЕГРЮЛ"

  consumer_guaranty_pledge:
    any_keywords:
      - "физическое лицо"
      - "гражданин"
      - "единственное жильё"
      - "ипотечный кредит"
      - "потребительский кредит"
      - "паспорт"

# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 3: SHARED PATTERNS
#  Читается: DocTypeCheckLoader через _resolve_yaml_templates()
# ════════════════════════════════════════════════════════════════════════════

shared_patterns:

  money_amount: "(?i)\\b\\d[\\d\\s]*(?:руб|рублей|₽|коп|тыс|млн|млрд)"
  percentage_pattern: "(?i)\\b\\d+(?:[.,]\\d+)?\\s*%\\b"
  date_pattern: "(?i)\\b\\d{1,2}[.]\\d{1,2}[.]\\d{4}\\b"
  cadastral_number: "(?i)\\b\\d{2}:\\d{2}:\\d{6,7}:\\d+\\b"
  registration_number: "(?i)(?:№|N|No\\.)\\s*[A-ZА-Я0-9\\-\\/]+"

# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 4: COMPLIANCE RULES
#  Читается: DocTypeCheckLoader._exclusion_logic_to_checks()
# ════════════════════════════════════════════════════════════════════════════

compliance_rules:

  - id: "no_secured_obligation_reference"
    name: "Отсутствует ссылка на основное обязательство"
    description: "Поручительство и залог как акцессорные конструкции требуют идентификации обеспечиваемого обязательства"
    legal_base: "ст. 329, 339, 361, 432 ГК РФ"
    required_triggers: []
    severity: "critical"
    result_if_triggered: "fail"
    detector_type: "rules"
    rules:
      negative_keywords:
        - "основное обязательство"
        - "кредитный договор"
        - "договор займа"
        - "договор поставки"
        - "обеспечиваемое обязательство"
        - "номер договора"
      keyword_mode: "any"
    retrieval:
      context_k: 5
      boost_keywords:
        - "основное обязательство"
        - "обеспечиваемое обязательство"
        - "договор №"
      rerank: true

  - id: "mortgage_without_registration_logic"
    name: "Ипотека без механизма государственной регистрации"
    description: "Без государственной регистрации ипотека не возникает как вещное обременение"
    legal_base: "ст. 339.1 ГК РФ, ФЗ № 102-ФЗ"
    required_triggers: ["mortgage_pledge"]
    severity: "critical"
    result_if_triggered: "fail"
    detector_type: "rules"
    rules:
      negative_keywords:
        - "государственная регистрация ипотеки"
        - "егрн"
        - "росреестр"
        - "закладная"
      keyword_mode: "any"
    retrieval:
      context_k: 5
      boost_keywords:
        - "регистрация ипотеки"
        - "егрн"
        - "росреестр"
      rerank: true

  - id: "out_of_court_enforcement_without_procedure"
    name: "Внесудебное обращение взыскания без достаточной процедуры"
    description: "Если договор допускает внесудебное взыскание, процедура должна быть описана достаточно определенно"
    legal_base: "ст. 349, 350.1 ГК РФ"
    required_triggers: ["out_of_court_enforcement"]
    severity: "critical"
    result_if_triggered: "fail"
    detector_type: "rules"
    rules:
      keywords:
        - "внесудебный порядок"
        - "внесудебное обращение взыскания"
      negative_keywords:
        - "способ реализации"
        - "оценка"
        - "уведомление"
        - "срок"
      keyword_mode: "any"
    retrieval:
      context_k: 5
      boost_keywords:
        - "внесудебное обращение взыскания"
        - "реализация предмета залога"
        - "уведомление"
      rerank: true

  - id: "blanket_guarantor_consent_risk"
    name: "Чрезмерно широкое согласие поручителя на любые будущие изменения долга"
    description: "Бланкетное согласие поручителя на любые изменения основного обязательства создает повышенный риск злоупотреблений и споров о прекращении поручительства"
    legal_base: "ст. 367 ГК РФ, практика ВС РФ"
    required_triggers: ["guaranty_contract"]
    severity: "critical"
    result_if_triggered: "fail"
    detector_type: "rules"
    rules:
      keywords:
        - "поручитель заранее дает согласие на любые изменения"
        - "на любые изменения основного обязательства"
        - "безусловное согласие поручителя"
        - "любое изменение обязательства не требует согласия поручителя"
      keyword_mode: "any"
    retrieval:
      context_k: 5
      boost_keywords:
        - "согласие поручителя"
        - "любые изменения"
        - "основное обязательство"
      rerank: true

  - id: "guaranty_term_expiry_risk"
    name: "Срок поручительства не указан → прекращение через 1 год (ст. 367 п. 6 ГК РФ)"
    description: |
      Если срок поручительства не установлен, оно прекращается через 1 год
      с момента наступления срока исполнения основного обязательства.
      Частая ошибка: кредитор рассчитывает на бессрочное поручительство,
      а оно уже прекратилось.
    legal_base: "ст. 367 п. 6 ГК РФ"
    required_triggers: ["guaranty_contract"]
    severity: "critical"
    result_if_triggered: "warn"
    detector_type: "rules"
    rules:
      negative_keywords:
        - "срок поручительства"
        - "поручительство действует до"
        - "до полного исполнения"
        - "до момента исполнения"
      keyword_mode: "any"
    retrieval:
      context_k: 4
      boost_keywords:
        - "срок поручительства"
        - "действует до"
        - "прекращение поручительства"
      rerank: true

  - id: "pledge_registration_movable_required"
    name: "Уведомление о залоге движимого имущества (ст. 339.1 п. 4 ГК РФ)"
    description: |
      Залог движимого имущества может быть учтён путём регистрации уведомления
      в реестре нотариата. Без уведомления залог не может быть противопоставлен
      третьим лицам, заявившим свои права на предмет залога.
    legal_base: "ст. 339.1 п. 4 ГК РФ"
    required_triggers: ["movable_pledge"]
    severity: "high"
    result_if_triggered: "warn"
    detector_type: "rules"
    rules:
      keywords:
        - "реестр уведомлений о залоге"
        - "нотариус"
        - "уведомление о залоге"
        - "реестр залогов"
      keyword_mode: "any"
    retrieval:
      context_k: 4
      boost_keywords:
        - "реестр уведомлений"
        - "нотариус"
        - "залог движимого"
      rerank: true

  - id: "consumer_pledge_sole_dwelling"
    name: "Залог единственного жилья — ограничения (ст. 446 ГПК РФ, ФЗ-102)"
    description: |
      На единственное жильё нельзя обратить взыскание, КРОМЕ случая ипотеки
      (ФЗ-102). Если залог не является ипотекой по ФЗ-102, обращение взыскания
      на единственное жильё невозможно → залог бесполезен.
    legal_base: "ст. 446 ГПК РФ, ст. 50, 78 ФЗ-102"
    required_triggers: ["consumer_guaranty_pledge", "secured_real_estate"]
    severity: "critical"
    result_if_triggered: "warn"
    detector_type: "rules"
    rules:
      keywords:
        - "единственное жильё"
        - "исполнительский иммунитет"
        - "ст. 446 ГПК"
        - "обращение взыскания на жилое помещение"
      keyword_mode: "any"
    retrieval:
      context_k: 4
      boost_keywords:
        - "единственное жильё"
        - "обращение взыскания"
        - "жилое помещение"
      rerank: true

# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 5: CHECKS_V8 — LLM/hybrid проверки
#  Читается: DocTypeCheckLoader._load_doc_type_checks()
# ════════════════════════════════════════════════════════════════════════════

checks_v8:

  - id: security_subject_extraction
    name: "Базовое извлечение параметров поручительства/залога"
    description: "Извлекает тип обеспечительного договора, стороны, обеспечиваемое обязательство, объем ответственности или предмет залога"
    triggers: {}
    severity: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "поручительство"
        - "поручитель"
        - "залог"
        - "залогодатель"
        - "залогодержатель"
        - "основное обязательство"
        - "предмет залога"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)(поручительств|поручитель|залогодатель|залогодержатель|предмет\\s+залога)"
        - "(?i)(обеспечиваем(ое|ого)\\s+обязательств|основн(ое|ого)\\s+обязательств)"
    llm:
      prompt_template: |
        Ты — юридический ассистент, анализирующий договор поручительства или залога.
        Извлеки ключевые параметры договора строго по тексту.

        Ответь строго в JSON:
        {
          "security_type": "<guaranty / pledge / mortgage / mixed / unclear / not_found>",
          "creditor": "<кредитор/залогодержатель или not_found>",
          "principal_debtor": "<должник по основному обязательству или not_found>",
          "guarantor_or_pledgor": "<поручитель/залогодатель или not_found>",
          "secured_obligation_reference": "<основное обязательство или not_found>",
          "secured_amount": "<сумма обеспечиваемого обязательства или not_found>",
          "liability_or_collateral_scope": "<объем ответственности или предмет залога или not_found>"
        }

        Используй только сведения из текста.
        Если данных нет — пиши "not_found".
      prompt_file: null
      context_k: 6
      temperature: 0.0
      max_tokens: 700
    retrieval:
      context_k: 6
      max_chunks: 10
      boost_keywords:
        - "основное обязательство"
        - "поручитель"
        - "предмет залога"
        - "обеспечение обязательства"
      rerank: true
      filters: {}
    evidence:
      required: true
      min_snippet_length: 50
      max_snippet_length: 700
    extraction:
      enabled: true
      mode: "hybrid"
      fields:
        - name: "security_type"
          type: "string"
          allowed_values: ["guaranty", "pledge", "mortgage", "mixed", "unclear", "not_found"]
          description: "Тип обеспечительного договора"
        - name: "creditor"
          type: "string"
          keyword_hints: ["кредитор", "залогодержатель"]
          description: "Кредитор/залогодержатель"
        - name: "principal_debtor"
          type: "string"
          keyword_hints: ["должник", "заемщик"]
          description: "Должник по основному обязательству"
        - name: "guarantor_or_pledgor"
          type: "string"
          keyword_hints: ["поручитель", "залогодатель"]
          description: "Поручитель/залогодатель"
        - name: "secured_obligation_reference"
          type: "string"
          keyword_hints: ["основное обязательство", "кредитный договор", "договор займа", "договор поставки"]
          description: "Ссылка на основное обязательство"
        - name: "secured_amount"
          type: "string"
          keyword_hints: ["сумма обязательства", "размер обязательства", "сумма долга"]
          description: "Размер обеспечиваемого обязательства"
        - name: "liability_or_collateral_scope"
          type: "string"
          keyword_hints: ["предмет залога", "объем ответственности", "в пределах суммы"]
          description: "Объем ответственности или предмет залога"
      store_payload: true

  - id: guaranty_liability_scope_check
    name: "Поручительство: объем, вид ответственности и лимит"
    description: "Проверяет солидарный/субсидиарный характер ответственности, лимит суммы и охват процентов/неустойки"
    triggers:
      any: ["guaranty_contract"]
    severity: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "солидарная ответственность"
        - "субсидиарная ответственность"
        - "в пределах суммы"
        - "максимальная сумма поручительства"
        - "проценты"
        - "неустойка"
        - "судебные расходы"
      keyword_mode: "any"
      regex_patterns:
