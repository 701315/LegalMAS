# CHECK 3: Подтверждение фактической передачи займа
# ──────────────────────────────────────────────────────────────────────────
  - id: transfer_evidence_check
    name: "Подтверждение фактической передачи суммы займа (ст. 808, 812 ГК РФ)"
    description: >
      Фактографическая проверка наличия доказательств передачи займа:
      расписка, акт, платёжное поручение, указание на передачу при подписании.
      Отсутствие доказательств создаёт риск спора о безденежности.
