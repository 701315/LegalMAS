            }
          ]
        }

        Пример 3 — конвертация по истечении срока (maturity), без кэпа:
        Фрагмент:
        "7.1. По истечении срока займа Займодавец вправе потребовать конвертации
        суммы основного долга в 5% уставного капитала Заёмщика.
        7.2. Конвертация осуществляется путём увеличения уставного капитала."
        (нет кэпа или дисконта)
        Ответ:
