  - id: target_loan_control_check
    name: "Целевой заём: цель, контроль и последствия нарушения (ст. 814 ГК РФ)"
    description: >
      Фактографическая проверка целевого характера займа: конкретная цель
      использования, право контроля займодавца, обязанность предоставления
      отчётности и подтверждающих документов, а также последствия нецелевого
      использования (досрочный возврат по ст. 814(2) ГК РФ, штрафы,
      повышение процентной ставки).
    triggers:
      any: ["target_loan"]
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "целевой заем"
        - "целевой заём"
        - "целевое использование"
        - "целевое назначение"
        - "на цели"
        - "предоставление отчетов"
        - "предоставление отчётов"
        - "подтверждающие документы"
        - "нецелевое использование"
        - "нецелевое расходование"
        - "досрочный возврат"
        - "проверять использование"
        - "контроль за использованием"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)целев(ой|ого|ому|ым)\\s+за[её]м"
        - "(?i)целев(ое|ого|ому|ым)\\s+(назначен|использован|расходован)"
        - "(?i)нецелев(ое|ого|ому|ым)\\s+(использован|расходован)"
        - "(?i)подтверждающ(ие|их|ими)\\s+документ"
        - "(?i)контрол[ь|я].{0,30}целев"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор займа (§ 1 Главы 42 ГК РФ, ст. 814).
        Проверяется только один вопрос: целевой характер займа, условия
        контроля со стороны займодавца и последствия нецелевого
        расходования средств.

        Нормативный ориентир:
        - ст. 814(1) ГК РФ — если договор займа заключён с условием
          использования заёмщиком полученных средств на определённые цели
          (целевой заём), заёмщик обязан обеспечить возможность
          осуществления займодавцем контроля за целевым использованием
          суммы займа.
        - ст. 814(2) ГК РФ — в случае невыполнения заёмщиком условия
          о целевом использовании, а равно при нарушении обязанностей
          по обеспечению контроля, займодавец вправе отказаться
          от исполнения договора займа, потребовать досрочного возврата
          всей суммы займа и уплаты причитающихся процентов по ст. 809 ГК РФ.
        - Судебная практика РФ — указание общей хозяйственной цели
          («на пополнение оборотных средств», «на финансирование текущей
          деятельности») обычно не образует режима строгого целевого займа
          по ст. 814 ГК РФ при отсутствии механизмов контроля конкретных
          расходов.

        Важно:
        - Твоя задача — установить фактические условия договора
          и отразить юридический режим.
        - Не оценивай риск самостоятельно, опирайся строго на текст
          и законные нормы.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Определена ли конкретная цель займа (или заём нецелевой /
           на общие цели).
        2. Предусмотрено ли право контроля займодавца и обязанность
           заёмщика отчитываться (предоставлять первичные документы,
           акты, выписки, отчёты).
        3. Последствия нецелевого использования средств (досрочный
           возврат по ст. 814(2) ГК РФ, договорные штрафы, повышение
           процентной ставки).

        [ПРАВИЛА]
        1. Используй только текст документа. Не выдумывай цели
           расходования или штрафы.
        2. Если в договоре прямо указано конкретное назначение (покупка
           оборудования, оплата конкретного контракта, строительство
           объекта) — заём является целевым.
        3. Если указано «на пополнение оборотных средств» или
           «на текущие расходы»:
           - purpose_defined_status = "defined";
           - purpose_display = "Нецелевой (на пополнение оборотных
             средств / текущие расходы)".
        4. Если цель вообще не упомянута в тексте:
           - purpose_defined_status = "not_defined";
           - purpose_defined_details = "Не установлено";
           - purpose_display = "Нецелевой (цель договором не ограничена)";
           - control_and_reporting_display = "Не применимо
             (нецелевой заём)";
           - misuse_consequences_display = "Не применимо
             (нецелевой заём)".
        5. Запрещены значения: null, None, пустые строки — не используй
           их никогда. Допустимые fallback-значения: "not_defined",
           "Не установлено", "Не определено", "Не применимо".
        6. Контроль и отчётность:
           - lender_control_right_status = "defined", если у займодавца
             прямо есть право проверять использование средств;
           - documentary_reporting_status = "defined", если заёмщик
             прямо обязан предоставлять отчёты, первичку, подтверждающие
             документы.
        7. misuse_consequences — приоритет при комбинированных санкциях:
           acceleration > rate_increase > penalty > other.
           - "acceleration" — есть право на досрочный возврат займа
             (договорное или по ст. 814(2));
           - "rate_increase" — предусмотрено повышение процентной ставки
             за нецелевое использование;
           - "penalty" — только договорный штраф / неустойка без
             досрочного возврата и повышения ставки;
           - "other" — иные санкции, не подходящие под предыдущие;
           - "not_defined" — санкции не предусмотрены.
        8. ВАЖНО: если заём признан целевым, но специальные санкции
           за нецелевое использование в договоре не расписаны — по
           ст. 814(2) ГК РФ займодавец вправе требовать досрочного
           возврата. В этом случае:
           - misuse_consequences = "acceleration";
           - misuse_consequences_display = "Досрочный возврат займа
             (ст. 814(2) ГК РФ)".
        9. Если в документе несколько редакций условий о цели —
           использовать последнюю по тексту.
        10. В evidence включай только дословные цитаты из текста договора.
        11. Верни РОВНО один JSON-объект со всеми 9 ключами
            без какого-либо дополнительного текста до или после.
            Начни ответ сразу с открывающей фигурной скобки и закончи
            закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ
            должен быть валидным JSON, пригодным для парсинга через
            json.loads без предварительной обработки.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — строгий целевой заём с отчётностью и штрафом:
        Фрагмент:
        "1.2. Заём является целевым и предоставляется Заёмщику исключительно
        на оплату технологического оборудования по Контракту поставки № 12
        от 15.02.2024.
        4.3. Заёмщик обязан в течение 10 рабочих дней с момента расходования
        средств предоставить Займодавцу копии платёжных поручений и товарных
        накладных.
        6.2. В случае нецелевого использования суммы займа Займодавец вправе
        потребовать досрочного возврата всей суммы займа, уплаты процентов
        за весь срок пользования, а также уплаты штрафа в размере 10%
        от суммы, использованной не по назначению."
        Ответ:
        {
          "purpose_defined_status": "defined",
          "purpose_defined_details": "Исключительно на оплату технологического оборудования по Контракту поставки № 12 от 15.02.2024",
          "purpose_display": "Целевой (оплата оборудования по Контракту № 12 от 15.02.2024)",
          "lender_control_right_status": "defined",
          "documentary_reporting_status": "defined",
          "control_and_reporting_display": "Предусмотрен (предоставление платёжек и накладных в течение 10 рабочих дней)",
          "misuse_consequences": "acceleration",
          "misuse_consequences_display": "Досрочный возврат займа + штраф 10% от нецелевой суммы",
          "evidence": [
            {
              "clause_ref": "п. 1.2",
              "quote": "Заём является целевым и предоставляется Заёмщику исключительно на оплату технологического оборудования по Контракту поставки № 12 от 15.02.2024."
            },
            {
              "clause_ref": "п. 4.3",
              "quote": "Заёмщик обязан в течение 10 рабочих дней с момента расходования средств предоставить Займодавцу копии платёжных поручений и товарных накладных."
            },
            {
              "clause_ref": "п. 6.2",
              "quote": "В случае нецелевого использования суммы займа Займодавец вправе потребовать досрочного возврата всей суммы займа, уплаты процентов за весь срок пользования, а также уплаты штрафа в размере 10% от суммы, использованной не по назначению."
            }
          ]
        }

        Пример 2 — заём на пополнение оборотных средств:
        Фрагмент:
        "1.2. Сумма займа предоставляется на пополнение оборотных средств
        Заёмщика."
        Ответ:
        {
          "purpose_defined_status": "defined",
          "purpose_defined_details": "На пополнение оборотных средств Заёмщика",
          "purpose_display": "Нецелевой (на пополнение оборотных средств)",
          "lender_control_right_status": "not_defined",
          "documentary_reporting_status": "not_defined",
          "control_and_reporting_display": "Не предусмотрен (общие цели деятельности)",
          "misuse_consequences": "not_defined",
          "misuse_consequences_display": "Не предусмотрены договором",
          "evidence": [
            {
              "clause_ref": "п. 1.2",
              "quote": "Сумма займа предоставляется на пополнение оборотных средств Заёмщика."
            }
          ]
        }

        Пример 3 — нецелевой заём (цель не указана):
        Фрагмент:
        "1.1. Займодавец передаёт Заёмщику денежные средства в размере
        5 000 000 рублей, а Заёмщик обязуется возвратить сумму займа."
        Ответ:
        {
          "purpose_defined_status": "not_defined",
          "purpose_defined_details": "Не установлено",
          "purpose_display": "Нецелевой (цель договором не ограничена)",
          "lender_control_right_status": "not_defined",
          "documentary_reporting_status": "not_defined",
          "control_and_reporting_display": "Не применимо (нецелевой заём)",
          "misuse_consequences": "not_defined",
          "misuse_consequences_display": "Не применимо (нецелевой заём)",
          "evidence": []
        }

        Пример 4 — текст есть, но надёжный вывод сделать нельзя
        (цель упомянута, но не конкретизирована):
        Фрагмент:
        "Сумма займа предоставляется на развитие бизнеса Заёмщика.
        Заёмщик обязан использовать средства эффективно и по целевому
        назначению."
        Ответ:
        {
          "purpose_defined_status": "not_defined",
          "purpose_defined_details": "Не установлено (указано общее направление 'развитие бизнеса' без конкретного проекта или актива)",
          "purpose_display": "Нецелевой (общая цель без конкретизации)",
          "lender_control_right_status": "not_defined",
          "documentary_reporting_status": "not_defined",
          "control_and_reporting_display": "Не предусмотрен (общая формулировка без механизмов контроля)",
          "misuse_consequences": "not_defined",
          "misuse_consequences_display": "Не предусмотрены договором",
          "evidence": [
            {
              "clause_ref": "п. 1.2",
              "quote": "Сумма займа предоставляется на развитие бизнеса Заёмщика. Заёмщик обязан использовать средства эффективно и по целевому назначению."
            }
          ]
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди цитату с указанием цели расходования заёмных средств.
        2. Оцени характер цели: конкретный проект / актив (целевой)
           vs пополнение оборотных средств / общая формулировка
           (нецелевой).
        3. Проверь наличие обязанностей по предоставлению подтверждающих
           документов или права проверок.
        4. Проверь последствия нецелевого расходования (акцелерация
           по ст. 814(2) ГК РФ, договорная неустойка / штраф, повышение
           ставки).
        5. Проверь согласованность enum misuse_consequences и display:
           - acceleration -> "Досрочный возврат займа (ст. 814(2) ГК РФ)"
             или "Досрочный возврат + штраф N%";
           - rate_increase -> "Повышение процентной ставки до N%";
           - penalty -> "Штраф / неустойка N% (или N руб.)";
           - other -> "Иные санкции (указать кратко)";
           - not_defined -> "Не предусмотрены договором" или
             "Не применимо (нецелевой заём)".
        6. Проверь, что все 9 ключей (8 полей + evidence) присутствуют
           в JSON.
        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь РОВНО одним JSON-объектом без какого-либо дополнительного
        текста до или после, со всеми 9 ключами:
        {
          "purpose_defined_status": "<defined / not_defined>",
          "purpose_defined_details": "<точная формулировка цели из договора или 'Не установлено'>",
          "purpose_display": "<Целевой (…) / Нецелевой (на пополнение оборотных средств) / Нецелевой (общая цель без конкретизации) / Нецелевой (цель договором не ограничена)>",
          "lender_control_right_status": "<defined / not_defined>",
          "documentary_reporting_status": "<defined / not_defined>",
          "control_and_reporting_display": "<Предусмотрен (…) / Не предусмотрен договором / Не применимо (нецелевой заём)>",
          "misuse_consequences": "<acceleration / rate_increase / penalty / other / not_defined>",
          "misuse_consequences_display": "<Досрочный возврат займа (ст. 814(2) ГК РФ) / Досрочный возврат + штраф N% / Повышение процентной ставки до N% / Штраф N% / Иные санкции (…) / Не предусмотрены договором / Не применимо (нецелевой заём)>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 8
      temperature: 0.0
      max_tokens: 800
    retrieval:
      retrieval_profile: "credit_facility_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "целевой заем заём целевое назначение целевое использование на цели финансирование пополнение оборотных средств предоставление отчетов подтверждающие документы нецелевое использование нецелевое расходование досрочный возврат штраф неустойка повышение процентной ставки контроль проверка"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - remedies
      negative_keywords:
        - "проценты по займу"
        - "процентная ставка"
        - "неустойка за просрочку"
        - "обеспечение исполнения"
        - "аффилированность"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.05, 0.65]
        boost: 0.20
        scope: segment
      context_k: 8
      max_chunks: 10
      rerank: true
    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - obligations
        - remedies
      confidence_bonus_on_match: 0.12
      confidence_penalty_on_excluded_segment: 0.15
    evidence:
      required: true
      min_snippet_length: 35
      max_snippet_length: 600
    extraction:
      store_payload: true

      enabled: true
      mode: "hybrid"
      compact_output: false
      llm_max_tokens: 1200
      llm_prompt_extraction: |
        <role>
        Ты — российский юрист по договорной работе. Извлеки из текста
        договора займа сведения о целевом назначении займа, порядке
        контроля и отчётности, а также последствиях нецелевого
        использования средств (ст. 814 ГК РФ).
        Не анализируй процентную ставку по ст. 809 ГК РФ или общую
        ответственность.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие 8 полей + evidence (всего 9 ключей).
        Верни все ключи, даже если данные отсутствуют.

        1.  purpose_defined_status — "defined" (если цель прямо указана)
            или "not_defined".
              - "defined" — конкретная цель (покупка оборудования,
                оплата контракта № X, строительство объекта);
              - "defined" — также для формулировок «на пополнение
                оборотных средств», «на текущие расходы»;
              - "not_defined" — цель не упомянута или указана только
                общая формулировка без конкретизации.
        2.  purpose_defined_details — точная формулировка цели из текста
            или "Не установлено".
        3.  purpose_display — user-facing строка:
              - "Целевой (краткая формулировка конкретной цели)";
              - "Нецелевой (на пополнение оборотных средств /
                текущие расходы)";
              - "Нецелевой (общая цель без конкретизации)";
              - "Нецелевой (цель договором не ограничена)".
        4.  lender_control_right_status — "defined" (если у займодавца
            есть право проверок) или "not_defined".
        5.  documentary_reporting_status — "defined" (если заёмщик
            обязан предоставлять отчёты / первичку) или "not_defined".
        6.  control_and_reporting_display — user-facing строка:
              - "Предусмотрен (состав документов и сроки: отчёты
                и первичка в течение N дней)";
              - "Предусмотрен в рамках ст. 814(1) ГК РФ (детали
                в договоре не раскрыты)";
              - "Не предусмотрен договором";
              - "Не применимо (нецелевой заём)".
        7.  misuse_consequences — "acceleration" / "rate_increase" /
            "penalty" / "other" / "not_defined".
              Приоритет при комбинированных санкциях:
              acceleration > rate_increase > penalty > other.
              ВАЖНО: если заём целевой и в договоре нет специальных
              санкций — по ст. 814(2) ГК РФ право на досрочный возврат
              возникает автоматически:
                misuse_consequences = "acceleration".
        8.  misuse_consequences_display — user-facing строка:
              - "Досрочный возврат займа (ст. 814(2) ГК РФ)";
              - "Досрочный возврат + штраф N% (или неустойка N руб.)";
              - "Повышение процентной ставки до N%";
              - "Штраф N% (или неустойка N руб.)";
              - "Иные санкции (указать кратко)";
              - "Не предусмотрены договором";
              - "Не применимо (нецелевой заём)".

        Дополнительно — обязательный массив evidence:
        - цитаты с формулировкой цели, обязанностей по контролю /
          отчётности и санкций за нецелевое расходование;
        - пустой массив [], если заём нецелевой и условий в договоре нет.
        </task>

        <rules>
        - Используй только текст договора. Не выдумывай цели займа
          и штрафы.
        - Не используй null, None или пустые строки — только явные
          fallback-значения ("Не установлено" / "not_defined" /
          "Не определено" / "Не применимо").
        - Формулировки «на пополнение оборотных средств» /
          «на финансирование хозяйственной деятельности» квалифицируй
          как нецелевые.
        - Общая формулировка без конкретизации («на развитие бизнеса»,
          «на цели, согласованные Сторонами» без раскрытия) —
          purpose_defined_status = "not_defined",
          purpose_display = "Нецелевой (общая цель без конкретизации)".
        - Если в тексте прямо согласован целевой заём, но специальные
          санкции не расписаны — по ст. 814(2) ГК РФ:
          misuse_consequences = "acceleration",
          misuse_consequences_display = "Досрочный возврат займа
          (ст. 814(2) ГК РФ)".
        - Приоритет misuse_consequences при комбинированных санкциях:
          acceleration > rate_increase > penalty > other.
        - Маппинг display:
            acceleration -> "Досрочный возврат займа (ст. 814(2) ГК РФ)"
              или "Досрочный возврат + штраф N%";
            rate_increase -> "Повышение процентной ставки до N%";
            penalty -> "Штраф N% (или неустойка N руб.)";
            other -> "Иные санкции (указать кратко)";
            not_defined -> "Не предусмотрены договором" (для целевого)
              или "Не применимо (нецелевой заём)".
        - Если в документе несколько редакций условий о цели —
          использовать последнюю по тексту.
        - Верни РОВНО один JSON-объект со всеми 9 ключами
          без какого-либо дополнительного текста до или после.
          Начни ответ сразу с открывающей фигурной скобки и закончи
          закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ
          должен быть валидным JSON, пригодным для парсинга через
          json.loads без предварительной обработки.
        </rules>
      fields:
        - name: "purpose_defined_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус определения цели займа (raw enum)."
          required: true
          display_in_grid: false
        - name: "purpose_defined_details"
          type: "string"
          presentation: "fact"
          label: "Цель займа (детали)"
          description: "Точная формулировка цели использования заёмных средств из договора."
          required: true
          display_in_grid: false
        - name: "purpose_display"
          type: "string"
          presentation: "fact"
          label: "Целевое назначение"
          description: "User-facing квалификация цели займа (целевой с конкретным назначением / нецелевой)."
          required: true
          display_in_grid: true
          display_priority: 1
        - name: "lender_control_right_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус права контроля займодавца (raw enum)."
          required: true
          display_in_grid: false
        - name: "documentary_reporting_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус обязанности предоставления подтверждающих документов (raw enum)."
          required: true
          display_in_grid: false
        - name: "control_and_reporting_display"
          type: "string"
          presentation: "fact"
          label: "Контроль и отчётность"
          description: "User-facing резюме обязанностей заёмщика по отчётности и контроля займодавца."
          required: true
          display_in_grid: true
          display_priority: 2
        - name: "misuse_consequences"
          type: "string"
          presentation: "signal"
          allowed_values: ["acceleration", "rate_increase", "penalty", "other", "not_defined"]
          description: "Последствия нецелевого использования (raw enum)."
          required: true
          display_in_grid: false
        - name: "misuse_consequences_display"
          type: "string"
          presentation: "fact"
          label: "Последствия нецелевого использования"
          description: "User-facing санкции за нецелевое расходование средств (досрочный возврат по ст. 814(2) ГК РФ, штрафы, повышение ставки)."
          required: true
          display_in_grid: true
          display_priority: 3

  - id: foreign_currency_terms_check
    name: "Валютная оговорка: курс, дата пересчёта, распределение рисков (ст. 140, 317 ГК РФ, 173-ФЗ)"
    description: >
      Фактографическая проверка валютной конструкции займа: тип оговорки
      (валюта долга vs валюта платежа), источник обменного курса
      (ЦБ РФ / коммерческий банк / фиксированный), дата конвертации,
      наличие валютного коридора (cap/floor), распределение валютных
      рисков, соблюдение валютного законодательства (173-ФЗ).
      Критично для оценки валютных рисков и законности расчётов
      между резидентами РФ.
    triggers:
      any: ["foreign_currency_reference"]
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "курс цб рф"
        - "валютная оговорка"
        - "доллар"
        - "евро"
        - "usd"
        - "eur"
        - "на дату платежа"
        - "иностранная валюта"
        - "условные единицы"
        - "у.е."
        - "валютный коридор"
        - "не менее"
        - "не более"
        - "173-фз"
        - "валютное регулирование"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)курс\\s+цб\\s*рф"
        - "(?i)валютн(ая|ой|ую)\\s+оговорк"
        - "(?i)usd|eur|доллар|евро|юань|cny|aed"
        - "(?i)эквивалент.{0,50}(доллар|евро|usd|eur)"
        - "(?i)не\\s+(менее|более).{0,20}(руб|курс)"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор займа с валютным элементом (ст. 140, 317 ГК РФ, 173-ФЗ).
        Проверяется валютная конструкция займа, источник курса, дата пересчёта,
        наличие валютного коридора (ограничений курса) и распределение
        валютных рисков между сторонами.

        Нормативный ориентир:
        - ст. 140 ГК РФ — законным платёжным средством на территории РФ является рубль.
        - ст. 317(2) ГК РФ — денежное обязательство может быть выражено в иностранной валюте
          или в условных денежных единицах, но подлежит оплате в рублях по официальному
          курсу ЦБ РФ на день платежа, если иной курс или дата не установлены договором.
        - ст. 9 Федерального закона № 173-ФЗ «О валютном регулировании» — расчёты
          в иностранной валюте между резидентами РФ запрещены (за исключением отдельных случаев).
          Прямая выдача/возврат займа в долларах/евро между резидентами — незаконная
          валютная операция.
        - ст. 451 ГК РФ — существенное изменение обстоятельств (резкое изменение курса валюты).

        Важно:
        - Твоя задача — установить фактические условия договора и отразить
          юридический режим.
        - Не оценивай риск самостоятельно, опирайся строго на текст и законные нормы.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Тип валютной конструкции (валюта долга с расчётом в рублях /
           прямые расчёты в валюте / чистый рублёвый заём).
        2. Источник обменного курса (ЦБ РФ / коммерческий банк / фиксированный курс).
        3. Дата пересчёта (на дату платежа / на дату возврата / на дату выдачи / иная).
        4. Наличие валютного коридора (минимальный/максимальный курс, cap/floor).
        5. Распределение валютных рисков между сторонами.

        [ПРАВИЛА]
        1. Используй только текст документа. Не выдумывай условия валютной оговорки.
        2. Если в договоре нет валютной оговорки (заём в рублях без привязки к валюте):
           - currency_reference_type = "not_applicable";
           - currency_clause_display = "Не применимо (заём в рублях РФ без валютной оговорки)";
           - conversion_rate_source = "not_applicable";
           - conversion_date = "not_applicable";
           - conversion_rate_display = "Не применимо";
           - currency_collar_display = "Не применимо";
           - currency_risk_allocation = "not_defined";
           - currency_risk_display = "Не применимо".
        3. Если заём выражен в эквиваленте валюты с расчётом в рублях —
           это законная конструкция по ст. 317(2) ГК РФ:
           currency_clause_display = "Эквивалент валюты (долг в USD, расчёты в рублях)".
        4. Если заём предусматривает прямые расчёты в иностранной валюте между резидентами РФ —
           currency_clause_display = "Прямые расчёты в валюте (внимание: риск нарушения 173-ФЗ для резидентов)".
        5. Если курс не указан явно — по ст. 317(2) ГК РФ применяется курс ЦБ РФ
           на дату платежа. Но в извлечении:
           - conversion_rate_source = "not_defined" (не домысливай закон);
           - conversion_date = "not_defined";
           - conversion_rate_display = "Не указан (применяется курс ЦБ РФ на дату платежа
             по ст. 317(2) ГК РФ)".
        6. currency_collar_min / currency_collar_max — только числа (без слов «около»,
           «примерно», «приблизительно»). Если в договоре указано «около 75» —
           всё равно верни "75", а оговорку отрази в currency_collar_display.
        7. currency_risk_allocation — определяется по приоритету:
           - есть валютный коридор (min и/или max) → "shared";
           - фиксированный курс в договоре (fixed_rate) → "lender_bears_all";
           - курс ЦБ РФ / коммерческого банка на дату платежа / выдачи / возврата
             без коридора → "borrower_bears_all";
           - прямые расчёты в валюте (foreign_currency_obligation) → "not_defined";
           - курс не указан и конструкция неясна → "not_defined".
        8. Запрещены значения: null, None, пустые строки — не используй их никогда.
           Допустимые fallback-значения: "not_defined", "not_applicable",
           "Не установлено", "Не применимо", "Не определён".
        9. В evidence включай только дословные цитаты из текста договора.
        10. Верни РОВНО один JSON-объект со всеми 11 ключами без какого-либо
            дополнительного текста до или после. Начни ответ сразу с открывающей
            фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки,
            код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга
            через json.loads без предварительной обработки.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — законная валютная оговорка (эквивалент, курс ЦБ, дата платежа):
        Фрагмент:
        "1.3. Сумма займа составляет эквивалент 100 000 (Сто тысяч) долларов США.
        Возврат займа осуществляется в рублях Российской Федерации по официальному
        курсу ЦБ РФ, действующему на дату фактического платежа."
        Ответ:
        {
          "currency_reference_type": "rub_equivalent",
          "currency_clause_display": "Эквивалент валюты (долг в USD, расчёты в рублях)",
          "conversion_rate_source": "cb_rate",
          "conversion_date": "payment_date",
          "conversion_rate_display": "Курс ЦБ РФ на дату платежа",
