          "transfer_risk_display": "Не применимо (передача ещё не состоялась)",
          "evidence": [
            {
              "clause_ref": "п. 1.1",
              "quote": "Займодавец обязуется предоставить Заёмщику денежные средства в размере 10 000 000 рублей в срок до 30.06.2026. Передача осуществляется путём перечисления на расчётный счёт Заёмщика."
            }
