        - name: "payment_frequency"
          type: "string"
          presentation: "signal"
          allowed_values: ["monthly", "quarterly", "at_maturity", "other", "not_applicable"]
          description: "Периодичность уплаты процентов (raw enum)."
          required: true
          display_in_grid: false
        - name: "payment_frequency_display"
          type: "string"
          presentation: "fact"
          label: "Периодичность уплаты"
