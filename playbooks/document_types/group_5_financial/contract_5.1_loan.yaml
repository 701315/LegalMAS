# БЛОК 5: DD_REQUEST_TEMPLATES
# Читается: DDRequestTemplateLoader
# ════════════════════════════════════════════════════════════════════════════

dd_request_templates:
  loan_parties_identification:
    text: >
      Просим подтвердить по {doc_names}: реквизиты займодавца и заёмщика,
      полномочия подписантов, тип каждой стороны.
    addressee: "Обе стороны"
  loan_subject_extraction:
    text: >
      Просим предоставить по {doc_names}: полные параметры займа —
      займодавец, заемщик, сумма займа, валюта, срок возврата,
      процентная ставка или указание на беспроцентность,
      способ передачи и возврата денежных средств.
    addressee: "Обе стороны"
  transfer_evidence_check:
    text: >
      Просим предоставить по {doc_names} доказательства фактической передачи займа:
      расписку заемщика, платежные поручения, банковские выписки, акт передачи
      либо иную документацию, подтверждающую передачу денежных средств.
    addressee: "Займодавец"
  interest_terms_check:
    text: >
      Просим уточнить по {doc_names}: является ли заем процентным или беспроцентным,
      какова ставка, база начисления процентов, периодичность уплаты,
      а также привести пример расчета процентов.
    addressee: "Обе стороны"
  repayment_and_acceleration_check:
    text: >
      Просим уточнить в {doc_names}: срок и структуру возврата займа,
      наличие графика погашения, право заемщика на досрочный возврат,
      а также право займодавца требовать досрочного возврата при нарушениях.
    addressee: "Обе стороны"
  target_loan_control_check:
    text: >
      По {doc_names} (целевой заем) просим предоставить:
      точную цель использования средств, перечень подтверждающих документов,
      порядок контроля целевого использования и последствия нарушения цели.
    addressee: "Заемщик / Займодавец"
  foreign_currency_terms_check:
    text: >
      По {doc_names} с валютным элементом просим предоставить:
      валюту обязательства, источник курса пересчета, дату пересчета,
      механизм возврата и распределение валютных рисков между сторонами.
    addressee: "Обе стороны / Юридический советник"
  related_party_loan_check:
    text: >
      Просим предоставить по {doc_names}: раскрытие информации об аффилированности
      сторон, заверения о рыночности условий займа, экономическое обоснование сделки
      и документы, подтверждающие деловую цель.
    addressee: "Обе стороны / Юридический советник"
  bankruptcy_claw_back_risk_check:
    text: >
      Просим предоставить по {doc_names}: заверения об отсутствии признаков банкротства,
      подтверждение рыночности условий, деловую цель сделки и оценку рисков
      оспаривания по ст. 61.2, 61.3 ФЗ-127.
    addressee: "Юридический советник"
  convertible_loan_check:
    text: >
      По {doc_names} (конвертируемый заём) просим предоставить: событие конвертации,
      формулу определения доли, кэп оценки или дисконт, порядок корпоративных действий
      и защиту от размытия.
    addressee: "Юридический советник"
  multiple_tranches_check:
    text: >
      По {doc_names} (траншевый заём) просим предоставить: общий лимит,
      порядок запроса транша, условия предоставления (CP), механизм учёта
      и возможность повторного использования.
    addressee: "Займодавец"
  secured_loan_terms:
    text: >
      По {doc_names} просим предоставить документы по обеспечению займа:
      договор залога/ипотеки, поручительство, описание обеспеченного обязательства,
      порядок обращения взыскания и основания утраты обеспечения.
    addressee: "Займодавец / Юридический советник"
  tax_consequences_disclosure:
    text: >
      Просим предоставить по {doc_names} пояснение о налоговых последствиях займа,
      включая возможную материальную выгоду, НДФЛ и иные налоговые эффекты
      для заемщика и займодавца.
    addressee: "Налоговый консультант / Юридический советник"
  novation_set_off_terms:
    text: >
      Просим уточнить по {doc_names}: условия новации или зачёта,
      какие обязательства прекращаются, какие возникают, и правовые последствия.
    addressee: "Юридический советник"
  loan_forgiveness_terms:
    text: >
      Просим предоставить по {doc_names}: условия прощения долга, налоговые последствия
      для заёмщика (внереализационный доход), риски оспаривания в банкротстве займодавца.
    addressee: "Налоговый консультант / Юридический советник"
  fungible_goods_specification:
    text: >
      По {doc_names} (заём вещей) просим предоставить: спецификацию качества (ГОСТ, ТУ),
      точное количество, порядок определения качества возвращаемых вещей,
      акт приёма-передачи.
    addressee: "Обе стороны"
  on_demand_notice_period:
    text: >
      Просим уточнить в {doc_names}: срок возврата займа после предъявления требования,
      форму требования и момент, с которого начинает течь срок.
    addressee: "Обе стороны"
  representations_and_warranties:
    text: >
      Просим включить/уточнить в {doc_names}: заверения сторон о правоспособности,
      отсутствии судебных споров, отсутствии признаков банкротства.
    addressee: "Юридический советник"
  governing_law_and_disputes:
    text: >
      Просим уточнить в {doc_names}: применимое право и компетентный суд
      для разрешения споров.
    addressee: "Юридический советник"
  _default:
    text: >
      Просим предоставить дополнительную информацию по вопросу «{check_name}»
      применительно к {doc_names}.
    addressee: "Юридический советник"

