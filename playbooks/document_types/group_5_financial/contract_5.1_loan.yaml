      llm_max_tokens: 1400
      llm_prompt_extraction: |
        <role>
        Ты — российский юрист по договорной работе. Извлеки из текста
        конвертируемого займа условия конвертации в долю (ООО) или акции
        (АО): триггер, формула расчёта доли, кэп/дисконт, корпоративные
        действия (ст. 429.3, 409, 414 ГК РФ, ст. 19 14-ФЗ).
        Не анализируй проценты по ст. 809 ГК РФ или общую ответственность.
        Различай: для ООО — конвертация в «доли», для АО — в «акции»;
        если форма неясна — используй нейтральное «доли / акции».
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие 8 полей + evidence (всего 9 ключей).
        Верни все ключи, даже если данные отсутствуют.

        1.  conversion_trigger — "maturity" / "next_round" / "at_will" /
            "other" / "not_defined" / "not_applicable":
              - "maturity" — по истечении срока займа;
              - "next_round" — при следующем раунде финансирования;
              - "at_will" — по требованию займодавца в любое время;
              - "other" — иное событие (указать в evidence);
              - "not_defined" — триггер не определён (риск спора);
              - "not_applicable" — заём не конвертируемый.
        2.  conversion_trigger_display — user-facing строка:
              - "По требованию займодавца (в любое время до погашения)";
              - "При следующем раунде финансирования";
              - "По истечении срока займа";
              - "Не определено (риск корпоративного спора)";
              - "Не применимо (заём без права конвертации)".
        3.  conversion_formula_status — "defined" / "not_defined" /
            "not_applicable".
        4.  conversion_formula_display — user-facing строка:
              - "Формула определена (N% доли за сумму займа / N акций)";
              - "Не определена (риск корпоративного спора)";
              - "Не применимо".
        5.  valuation_cap_or_discount_status — "defined" / "not_defined" /
            "not_applicable".
        6.  valuation_cap_display — user-facing строка:
              - "Кэп: N рублей";
              - "Дисконт: N% к оценке следующего раунда";
              - "Не установлен";
              - "Не применимо".
        7.  corporate_actions_status — "defined" / "not_defined" /
            "not_applicable".
        8.  corporate_actions_display — user-facing строка:
              - "Описаны (увеличение УК, внесение в ЕГРЮЛ, зачёт требований)";
              - "Не описаны (риск неисполнимости конвертации)";
              - "Не применимо".

        Дополнительно — обязательный массив evidence:
        - цитаты с условиями конвертации (триггер, формула, кэп/дисконт,
          корпоративные действия);
        - пустой массив [], если заём не конвертируемый.

        Правила заполнения при отсутствии данных:
        - Если заём не конвертируемый — все status = "not_applicable",
          все display = "Не применимо".
        </task>

        <rules>
        - Используй только текст договора. Не выдумывай кэп, дисконт
          или формулы.
        - Не используй null, None или пустые строки — только явные
          fallback-значения ("not_defined" / "not_applicable" /
          "Не установлено" / "Не применимо" / "Не определена").
        - Распознавай синонимы: SAFE, опцион на долю, зачёт требований,
          отступное, новация.
        - SAFE — иностранная конструкция, в РФ напрямую не применяется;
          требует пересборки через опцион или отступное.
        - Если триггер есть, но формула не определена —
          conversion_formula_display = "Не определена (риск корпоративного
          спора)".
        - Если корпоративные действия не описаны —
          corporate_actions_display = "Не описаны (риск неисполнимости
          конвертации)".
        - Дихотомия ООО / АО: для ООО — «доли», для АО — «акции»;
          если форма неясна — нейтральное «доли / акции».
        - Верни РОВНО один JSON-объект со всеми 9 ключами без какого-либо
          дополнительного текста до или после. Начни ответ сразу
          с открывающей фигурной скобки и закончи закрывающей. НЕ пиши
          Markdown, списки, код-фенсы. Ответ должен быть валидным JSON,
          пригодным для парсинга через json.loads без предварительной
          обработки.
        </rules>
      fields:
        - name: "conversion_trigger"
          type: "string"
          presentation: "signal"
          allowed_values: ["maturity", "next_round", "at_will", "other", "not_defined", "not_applicable"]
          description: "Событие конвертации (raw enum)."
