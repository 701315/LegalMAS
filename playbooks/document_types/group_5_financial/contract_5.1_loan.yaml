    extraction:
      store_payload: true

      enabled: true
      mode: "hybrid"
      compact_output: false
      llm_max_tokens: 1200
      llm_prompt_extraction: |
        <role>
        Ты — российский юрист по договорной работе. Извлеки из текста
        договора займа сведения о подтверждении фактической передачи
        суммы займа, типе подтверждающего документа и риске безденежности.
        Учитывай консенсуальный договор (обещание займа с 01.06.2018 по ФЗ-212),
        передачу траншами.
        Различай внешнее подтверждение (расписка / платёжка / акт) и голословное
        указание в тексте договора (contract_clause): только внешнее
        подтверждение считается полноценным доказательством передачи.
        Не анализируй проценты, срок возврата или иные темы — только
        доказательства передачи и риск безденежности.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие 7 полей + evidence (всего 8 ключей).
        Верни все ключи, даже если данные отсутствуют.

        1.  transfer_evidence_status — "defined" / "not_defined".
              - "defined" — только при наличии внешнего подтверждающего
                документа (расписка / платёжка / акт).
              - "not_defined" — при указании только в тексте договора
                (contract_clause), при обещании займа или при отсутствии данных.
        2.  transfer_evidence_details — формулировка о подтверждении:
              - для расписки → "Расписка Заёмщика (Приложение № N)";
              - для платёжки → "Платёжное поручение с отметкой банка";
              - для акта → "Акт приёма-передачи денежных средств";
              - для указания в договоре → "Указание на передачу в договоре
                без внешнего подтверждающего документа";
              - для обещания займа → "Обещание займа, передача обещана
                в будущем (к дате X / траншами по графику)";
              - для траншей → "Передача траншами согласно Графику
                (Приложение № N), подтверждение каждого транша отдельно";
              - если не найдено → "Не установлено".
        3.  transfer_evidence_type — "receipt" / "payment_order" / "act" /
            "contract_clause" / "not_defined".
        4.  transfer_evidence_type_display — user-facing строка:
              - "receipt" → "Расписка";
              - "payment_order" → "Платёжное поручение";
              - "act" → "Акт передачи";
              - "contract_clause" → "Указание в договоре";
              - "not_defined" (обещание займа) → "Не определено (обещание займа)";
              - "not_defined" (нет данных) → "Не определено".
        5.  transfer_at_signing_status — "defined" если прямо указано
            «передача при подписании» / «при заключении договора» /
            «в момент подписания», иначе "not_defined".
        6.  cash_transfer_risk — "high" / "medium" / "low" / "not_applicable" /
            "not_defined".
        7.  transfer_risk_display — user-facing строка:
              - "high" → "Высокий риск безденежности (наличная передача
                без расписки/акта)";
              - "medium" → "Средний риск (наличная передача с распиской)" или
                "Средний риск (наличная передача с актом)";
              - "low" → "Низкий риск (безналичная передача)";
              - "not_applicable" → "Не применимо (передача ещё не состоялась)";
              - "not_defined" → "Не определён".

        Дополнительно — обязательный массив evidence:
        - хотя бы одна цитата о передаче / подтверждении, если данные найдены;
        - пустой массив [], если ничего не найдено.
        </task>

        <rules>
        - Используй только текст договора. Не выдумывай расписки, платёжки, акты.
        - Не используй null, None или пустые строки — только явные
          fallback-значения ("Не установлено" / "not_defined" / "Не определено").
        - Классификация подтверждения:
            - внешний документ (расписка / платёжка / акт) — основной случай
              "defined" для transfer_evidence_status;
            - указание только в тексте договора — transfer_evidence_status
              = "not_defined", transfer_evidence_type = "contract_clause";
            - обещание займа (консенсуальный договор) — transfer_evidence_status
              = "not_defined", transfer_evidence_type = "not_defined",
              cash_transfer_risk = "not_applicable".
        - transfer_evidence_type:
            - "receipt" — расписка заёмщика;
            - "payment_order" — платёжное поручение, банковская выписка;
            - "act" — акт приёма-передачи денежных средств;
            - "contract_clause" — указание на передачу в самом тексте договора
              без отдельного внешнего документа;
            - "not_defined" — не определено (нет информации или обещание займа).
        - Если передача траншами по графику:
            transfer_evidence_details = "Передача траншами согласно Графику
            (Приложение № N), подтверждение каждого транша отдельно";
            transfer_evidence_type определяется по типу подтверждения для
            траншей (расписка / акт / платёжка на каждый транш).
        - Если в документе несколько редакций условий о передаче — использовать
          последнюю по позиции.
        - cash_transfer_risk:
            - безнал (платёжка, зачисление на счёт, банковский перевод) → "low";
            - наличные + расписка/акт → "medium";
            - наличные без внешнего подтверждения (только указание в договоре
              или вообще нет подтверждения) → "high";
            - обещание займа → "not_applicable";
            - способ передачи не определён → "not_defined".
        - transfer_at_signing_status: "defined" только при прямом указании
          «передача при подписании» / «при заключении договора» /
          «в момент подписания».
        - Согласованность: если transfer_evidence_type ∈
          {receipt, payment_order, act} → transfer_evidence_status = "defined";
          если transfer_evidence_type ∈ {contract_clause, not_defined} →
          transfer_evidence_status = "not_defined".
        - transfer_evidence_type_display строго соответствует
          transfer_evidence_type:
              receipt -> "Расписка";
              payment_order -> "Платёжное поручение";
              act -> "Акт передачи";
              contract_clause -> "Указание в договоре";
              not_defined -> "Не определено (обещание займа)"
                при обещании займа, иначе "Не определено".
        - transfer_risk_display строго соответствует cash_transfer_risk:
              high -> "Высокий риск безденежности (наличная передача без расписки/акта)";
              medium -> "Средний риск (наличная передача с распиской/актом)";
              low -> "Низкий риск (безналичная передача)";
              not_applicable -> "Не применимо (передача ещё не состоялась)";
              not_defined -> "Не определён".
        - Верни РОВНО один JSON-объект со всеми 8 ключами без какого-либо
          дополнительного текста до или после. Начни ответ сразу
          с открывающей фигурной скобки и закончи закрывающей. НЕ пиши
          Markdown, списки, код-фенсы. Ответ должен быть валидным JSON,
          пригодным для парсинга через json.loads без предварительной
          обработки.
        </rules>
      fields:
        - name: "transfer_evidence_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус подтверждения передачи займа (raw enum)."
          required: true
          display_in_grid: false
        - name: "transfer_evidence_details"
          type: "string"
          presentation: "fact"
          label: "Подтверждение передачи"
          description: "Формулировка о подтверждении передачи займа (расписка / платёжка / акт / указание в договоре / обещание займа / транши)."
          required: true
          display_in_grid: true
          display_priority: 1
        - name: "transfer_evidence_type"
          type: "string"
          presentation: "signal"
          allowed_values: ["receipt", "payment_order", "act", "contract_clause", "not_defined"]
          description: "Тип подтверждения передачи (raw enum)."
          required: true
          display_in_grid: false
        - name: "transfer_evidence_type_display"
          type: "string"
          presentation: "fact"
          label: "Тип подтверждения"
          description: "User-facing тип подтверждения передачи."
          required: true
          display_in_grid: true
          display_priority: 2
        - name: "transfer_at_signing_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус указания на передачу при подписании договора (raw enum)."
          required: true
          display_in_grid: false
        - name: "cash_transfer_risk"
          type: "string"
          presentation: "signal"
          allowed_values: ["high", "medium", "low", "not_applicable", "not_defined"]
          description: "Риск безденежности при передаче (raw enum)."
          required: true
          display_in_grid: false
        - name: "transfer_risk_display"
          type: "string"
          presentation: "fact"
          label: "Риск безденежности"
          description: "User-facing оценка риска безденежности на основе способа передачи и типа доказательства."
          required: true
          display_in_grid: true
          display_priority: 3

  - id: repayment_and_acceleration_check
    name: "Возврат займа: порядок погашения, досрочный возврат, акцелерация и неустойка (ст. 810, 811 ГК РФ)"
    description: >
      Фактографическая проверка структуры погашения займа (единовременно /
      в рассрочку / по требованию), права заёмщика на досрочный возврат
      (с учётом ст. 810(2) ГК РФ), оснований досрочного истребования
      займа займодавцем (акцелерация по ст. 811(2), 813, 814 ГК РФ),
      договорной неустойки за просрочку и способа подтверждения погашения
      обязательств.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "срок возврата"
        - "график погашения"
        - "досрочный возврат"
        - "досрочное погашение"
        - "потребовать досрочного возврата"
        - "досрочное истребование"
        - "акцелерация"
        - "по требованию"
        - "в случае просрочки"
        - "не позднее"
        - "неустойка"
        - "пеня"
        - "штраф"
        - "395 ГК"
        - "подтверждение возврата"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)досрочн(ый|ого|ое)\\s+(возврат|погашен|истребован|взыскан)"
        - "(?i)потребовать\\s+досрочн"
        - "(?i)график\\s+погашен"
        - "(?i)срок\\s+возврат"
        - "(?i)(пен[яи]|неустойк|штраф).{0,40}(просрочк|возврат)"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор займа (§ 1 Главы 42 ГК РФ, ст. 810, 811, 813, 814).
        Проверяются условия возврата: порядок погашения, право заёмщика
        на досрочный возврат, право займодавца на досрочное истребование
        (акцелерацию) и ответственность за просрочку.

        Нормативный ориентир:
        - ст. 810(1) ГК РФ — заёмщик обязан возвратить сумму займа в срок
          и порядке, предусмотренных договором;
        - ст. 810(2) ГК РФ — сумма БЕСПРОЦЕНТНОГО займа может быть
          возвращена досрочно полностью или по частям без согласия
          займодавца. Сумма ПРОЦЕНТНОГО займа, предоставленного
          под коммерческую деятельность (между юрлицами / ИП), может
          быть возвращена досрочно ТОЛЬКО с согласия займодавца, если
          иное прямо не предусмотрено договором;
        - ст. 811(1) ГК РФ — при просрочке возврата на сумму займа
          подлежат уплате проценты по ст. 395 ГК РФ (если иной размер
          неустойки/пени не установлен договором) независимо от уплаты
          процентов по ст. 809;
        - ст. 811(2) ГК РФ — при нарушении заёмщиком срока возврата
          очередной части займа (при рассрочке) займодавец вправе
          потребовать досрочного возврата всей оставшейся суммы займа
          вместе с процентами;
        - ст. 813, 814 ГК РФ — право займодавца на акцелерацию при утрате
          обеспечения или нецелевом использовании.

        Важно:
        - Твоя задача — установить фактические условия договора и отразить
          юридический режим.
        - Не оценивай риск самостоятельно, опирайся на текст и законные
          презумпции.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Структуру возврата (единовременно в конце срока / в рассрочку
           по графику / по требованию).
        2. Право заёмщика на досрочный возврат (разрешено свободно /
           с согласия / с уведомлением / с комиссией / запрещено).
        3. Право займодавца требовать досрочного возврата всей суммы
           займа (акцелерация) и триггеры такого права.
        4. Неустойку / пеню за просрочку возврата займа и уплаты
           процентов.
        5. Подтверждение факта возврата займа (акт, расписка, выписка).

        [ПРАВИЛА]
        1. Используй только текст документа. Не выдумывай штрафы или
           условия акцелерации.
        2. Если порядок погашения не детализирован, но указана одна
           финальная дата — repayment_structure = "single_payment".
        3. Право досрочного возврата заёмщиком:
           - для БЕСПРОЦЕНТНОГО займа: early_repayment_by_borrower =
             "allowed", early_repayment_display = "Разрешён без ограничений
             (ст. 810(2) ГК РФ, беспроцентный заём)" — если в договоре
             прямо не установлено иное;
           - для ПРОЦЕНТНОГО коммерческого займа (между юрлицами / ИП):
             при отсутствии в тексте пункта о досрочном возврате применяй
             ст. 810(2) ГК РФ: early_repayment_by_borrower =
             "consent_required", early_repayment_display = "Только
             с согласия займодавца (по закону, ст. 810(2) ГК РФ)".
        4. Если неустойка за просрочку в договоре не установлена прямо:
           - late_payment_penalty_status = "not_defined";
           - late_payment_penalty_details = "Не установлено";
           - late_payment_penalty_display = "Не установлена (применяются
             проценты по ст. 395 ГК РФ)".
        5. Запрещены значения: null, None, пустые строки — не используй
           их никогда. Допустимые fallback-значения: "not_defined",
           "Не установлено", "Не предусмотрено договором".
        6. В evidence включай только дословные цитаты из текста договора.
        7. Верни РОВНО один JSON-объект со всеми 13 ключами без какого-либо
           дополнительного текста до или после. Начни ответ сразу
           с открывающей фигурной скобки и закончи закрывающей. НЕ пиши
           Markdown, списки, код-фенсы. Ответ должен быть валидным JSON,
           пригодным для парсинга через json.loads без предварительной
           обработки.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — график, свободный досрочный возврат, акцелерация и пеня:
        Фрагмент:
        "4.1. Заём возвращается ежемесячными платежами согласно Графику
        (Приложение № 2).
        4.5. Заёмщик вправе досрочно возвратить заём без штрафных санкций,
        уведомив Займодавца за 10 дней.
        5.2. При просрочке внесения очередного платежа более чем
        на 5 рабочих дней, а также при утрате обеспечения Займодавец
        вправе потребовать досрочного возврата всей суммы займа и уплаты
        причитающихся процентов.
        6.1. За просрочку возврата займа Заёмщик уплачивает пеню в размере
        0,1% от суммы просроченной задолженности за каждый день просрочки.
        6.3. Возврат займа подтверждается банковской выпиской по счёту
        Займодавца."
        Ответ:
        {
          "repayment_structure": "installments",
          "repayment_structure_display": "В рассрочку (по графику платежей)",
          "early_repayment_by_borrower": "restricted",
          "early_repayment_display": "Разрешён с уведомлением за 10 дней",
          "acceleration_right_status": "defined",
          "acceleration_right_details": "При просрочке платежа более 5 рабочих дней или утрате обеспечения",
          "acceleration_right_display": "Предусмотрено (просрочка > 5 дней, утрата обеспечения)",
          "late_payment_penalty_status": "defined",
          "late_payment_penalty_details": "Пеня 0,1% от суммы просроченной задолженности за каждый день просрочки",
          "late_payment_penalty_display": "Пеня 0,1% в день от суммы просрочки",
          "repayment_confirmation_status": "defined",
          "repayment_confirmation_details": "Банковская выписка по счёту Займодавца",
          "evidence": [
            {
              "clause_ref": "п. 4.1",
              "quote": "Заём возвращается ежемесячными платежами согласно Графику (Приложение № 2)."
            },
            {
              "clause_ref": "п. 4.5",
              "quote": "Заёмщик вправе досрочно возвратить заём без штрафных санкций, уведомив Займодавца за 10 дней."
            },
            {
              "clause_ref": "п. 5.2",
              "quote": "При просрочке внесения очередного платежа более чем на 5 рабочих дней, а также при утрате обеспечения Займодавец вправе потребовать досрочного возврата всей суммы займа и уплаты причитающихся процентов."
            },
            {
              "clause_ref": "п. 6.1",
              "quote": "За просрочку возврата займа Заёмщик уплачивает пеню в размере 0,1% от суммы просроченной задолженности за каждый день просрочки."
            }
          ]
        }

        Пример 2 — единовременный возврат, договор молчит о досрочном
        возврате и неустойке (процентный коммерческий заём):
        Фрагмент:
        "3.1. Заёмщик обязуется возвратить сумму займа в полном объёме
        не позднее 31 декабря 2025 года."
        Ответ:
        {
          "repayment_structure": "single_payment",
          "repayment_structure_display": "Единовременно в конце срока (31.12.2025)",
          "early_repayment_by_borrower": "consent_required",
          "early_repayment_display": "Только с согласия займодавца (ст. 810(2) ГК РФ)",
          "acceleration_right_status": "not_defined",
          "acceleration_right_details": "Не установлено",
          "acceleration_right_display": "Не предусмотрено договором (действуют общие нормы ГК РФ)",
          "late_payment_penalty_status": "not_defined",
          "late_payment_penalty_details": "Не установлено",
          "late_payment_penalty_display": "Не установлена (применяются проценты по ст. 395 ГК РФ)",
          "repayment_confirmation_status": "not_defined",
          "repayment_confirmation_details": "Не установлено",
          "evidence": [
            {
              "clause_ref": "п. 3.1",
              "quote": "Заёмщик обязуется возвратить сумму займа в полном объёме не позднее 31 декабря 2025 года."
            }
          ]
        }

        Пример 3 — возврат по требованию, досрочный возврат с комиссией:
        Фрагмент:
        "2.2. Заём подлежит возврату в течение 30 календарных дней
        со дня предъявления Займодавцем письменного требования.
        2.4. Досрочное погашение займа возможно с уплатой комиссии
        в размере 1% от досрочно возвращаемой суммы.
        5.1. За нарушение срока возврата начисляется штраф 50 000 руб.
        и пеня 0,05% за каждый день просрочки."
        Ответ:
        {
          "repayment_structure": "on_demand",
          "repayment_structure_display": "По требованию (30 дней со дня предъявления)",
          "early_repayment_by_borrower": "restricted",
          "early_repayment_display": "Разрешён с комиссией (1% от суммы досрочного возврата)",
          "acceleration_right_status": "not_defined",
          "acceleration_right_details": "Не установлено",
          "acceleration_right_display": "Не применимо (заём по требованию)",
          "late_payment_penalty_status": "defined",
          "late_payment_penalty_details": "Штраф 50 000 руб. и пеня 0,05% за каждый день просрочки",
          "late_payment_penalty_display": "Штраф 50 000 руб. + пеня 0,05% в день",
          "repayment_confirmation_status": "not_defined",
          "repayment_confirmation_details": "Не установлено",
          "evidence": [
            {
              "clause_ref": "п. 2.2",
              "quote": "Заём подлежит возврату в течение 30 календарных дней со дня предъявления Займодавцем письменного требования."
            },
            {
              "clause_ref": "п. 2.4",
              "quote": "Досрочное погашение займа возможно с уплатой комиссии в размере 1% от досрочно возвращаемой суммы."
            },
            {
              "clause_ref": "п. 5.1",
              "quote": "За нарушение срока возврата начисляется штраф 50 000 руб. и пеня 0,05% за каждый день просрочки."
            }
          ]
        }

        Пример 4 — текст есть, но надёжный вывод сделать нельзя
        (уклончивая формулировка про допсоглашение):
        Фрагмент:
        "7.1. Порядок возврата займа, досрочного погашения и ответственность
        за просрочку определяются Сторонами в дополнительном соглашении
        к настоящему Договору."
        (нет ни структуры погашения, ни условий досрочного возврата,
        ни неустойки в самом договоре)
        Ответ:
        {
          "repayment_structure": "not_defined",
          "repayment_structure_display": "Не определён (определяется дополнительным соглашением)",
          "early_repayment_by_borrower": "not_defined",
          "early_repayment_display": "Не определено (определяется дополнительным соглашением)",
          "acceleration_right_status": "not_defined",
          "acceleration_right_details": "Не установлено",
          "acceleration_right_display": "Не предусмотрено договором (действуют общие нормы ГК РФ)",
          "late_payment_penalty_status": "not_defined",
          "late_payment_penalty_details": "Не установлено",
          "late_payment_penalty_display": "Не установлена (применяются проценты по ст. 395 ГК РФ)",
          "repayment_confirmation_status": "not_defined",
          "repayment_confirmation_details": "Не установлено",
          "evidence": [
            {
              "clause_ref": "п. 7.1",
              "quote": "Порядок возврата займа, досрочного погашения и ответственность за просрочку определяются Сторонами в дополнительном соглашении к настоящему Договору."
            }
          ]
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди цитату о порядке/структуре погашения (график, единовременно,
           по требованию).
        2. Проверь условие о досрочном возврате заёмщиком:
             для беспроцентного займа — "allowed" (ст. 810(2) ГК РФ),
               если в тексте не установлено иное;
             для процентного коммерческого займа при отсутствии пункта —
               "consent_required" (ст. 810(2) ГК РФ).
        3. Найди основания для досрочного истребования займа займодавцем
           (акцелерации).
        4. Найди формулировку договорной неустойки (если нет — укажи
           на ст. 395 ГК РФ).
        5. Проверь наличие подтверждения возврата (расписка/акт/выписка).
        6. Проверь дихотомию:
             в договоре нет условий о возврате ->
               repayment_structure = "not_defined";
             есть одна финальная дата -> "single_payment";
             есть график -> "installments";
             есть условие «по требованию» -> "on_demand".
        7. Проверь, что все 13 ключей (12 полей + evidence) присутствуют
           в JSON.
        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь РОВНО одним JSON-объектом без какого-либо дополнительного
        текста до или после, со всеми 13 ключами:
        {
          "repayment_structure": "<single_payment / installments / on_demand / not_defined>",
          "repayment_structure_display": "<Единовременно в конце срока (…) / В рассрочку (по графику платежей) / По требованию (…) / Не определён (определяется дополнительным соглашением)>",
          "early_repayment_by_borrower": "<allowed / restricted / consent_required / not_defined>",
          "early_repayment_display": "<Разрешён без ограничений (ст. 810(2) ГК РФ, беспроцентный заём) / Разрешён с уведомлением за N дней / Разрешён с комиссией (N% от суммы досрочного возврата) / Только с согласия займодавца (ст. 810(2) ГК РФ) / Запрещён договором / Не определено (определяется дополнительным соглашением)>",
          "acceleration_right_status": "<defined / not_defined>",
          "acceleration_right_details": "<основания досрочного истребования или 'Не установлено'>",
          "acceleration_right_display": "<Предусмотрено (…) / Не предусмотрено договором (действуют общие нормы ГК РФ) / Не применимо (заём по требованию)>",
          "late_payment_penalty_status": "<defined / not_defined>",
          "late_payment_penalty_details": "<формулировка неустойки или 'Не установлено'>",
          "late_payment_penalty_display": "<Пеня N% в день от суммы просрочки / Штраф N руб. + пеня N% / Не установлена (применяются проценты по ст. 395 ГК РФ)>",
          "repayment_confirmation_status": "<defined / not_defined>",
          "repayment_confirmation_details": "<способ подтверждения или 'Не установлено'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
