          "evidence": [
            {
              "clause_ref": "п. 4.1",
              "quote": "Займодавец перечисляет сумму займа на расчётный счёт Заёмщика в течение 3 рабочих дней с даты подписания договора. Подтверждением передачи является платёжное поручение с отметкой банка."
            }
          ]
        }

        Пример 3 — наличная передача БЕЗ внешнего подтверждения (high risk):
        Фрагмент:
        "Займодавец передаёт Заёмщику 500 000 рублей наличными.
        Заёмщик обязуется возвратить сумму займа."
        (нет упоминания расписки, акта или иного внешнего подтверждения)
