  - id: loan_repayment_and_transfer
    name: "Срок возврата и способ передачи займа"
    description: >
      Фактографическая проверка срока возврата займа, способа передачи
      и способа возврата, обязанности заёмщика возвратить предмет займа.
      Учитывает режим возврата по требованию (ст. 810(1) ГК РФ) при отсутствии
      срока. Способ передачи критичен для квалификации безденежности
      (ст. 812 ГК РФ).
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "срок возврата"
        - "возврат займа"
        - "обязуется возвратить"
        - "возвратить сумму займа"
        - "передача займа"
        - "перечислены"
        - "расписка"
        - "платежное поручение"
        - "наличными"
        - "безналичным переводом"
        - "по требованию"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)срок\\s+возврата"
        - "(?i)возврат[а-я]*\\s+за[её]ма"
        - "(?i)обязуетс[яь]\\s+возврат"
        - "(?i)(наличн|безналичн|перечислен|расписк|платежн)"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор займа (§ 1 Главы 42 ГК РФ, ст. 810, 812).
        Проверяется только один вопрос: срок возврата займа, способ передачи
        и способ возврата предмета займа, обязанность заёмщика возвратить заём.

        Нормативный ориентир:
        - ст. 810(1) ГК РФ — срок возврата: если не установлен, заёмщик
          обязан возвратить в течение 30 дней с момента предъявления
          требования займодавцем;
        - ст. 812 ГК РФ — безденежность займа: если заём оформлен распиской,
          но деньги фактически не переданы, заёмщик может оспорить договор.
          Способ передачи — критичный факт DD;
        - ст. 808 ГК РФ — форма договора займа: письменная форма обязательна
          при сумме > 10 000 ₽ (между гражданами) или при участии юрлица.

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора.
        - Применяй правило ст. 810(1), если срок не указан.
        - Не оценивай серьёзность риска.

        [ЗАДАЧА]
        Найди в тексте договора (обычно п. 3–6):
        1. Срок возврата займа.
        2. Способ передачи займа (наличные / безналичный перевод / смешанный).
        3. Способ возврата займа (наличные / безналичный перевод / смешанный).

        [ПРАВИЛА]
        1. Используй только текст документа. Не выдумывай сроки, способы.
        2. Если срок возврата не указан прямо — применяй ст. 810(1) ГК РФ:
           - repayment_term_status = "defined";
           - repayment_term_value = "Срок не установлен (возврат в течение
             30 дней с момента предъявления требования по ст. 810(1) ГК РФ)".
        3. Если срок определяется через график/приложение — верни
           формулировку "Согласно Графику платежей (Приложение № N)".
        4. Запрещены значения: null, None, пустые строки — не используй
           их никогда. Допустимые fallback-значения: "not_defined",
           "Не установлено", "Не определён".
        5. Если в документе несколько редакций условий о сроке — использовать
           последнюю по позиции.
        6. transfer_method / repayment_method:
           - "cash" — наличные;
           - "bank_transfer" — безналичный перевод (расчётный счёт,
             платёжное поручение);
           - "mixed" — смешанный (часть наличными, часть безналом);
           - "not_defined" — способ не указан.
        7. Для вещевого займа (не деньги): transfer_method
           и repayment_method = "not_defined" (способы передачи вещей
           в рамках этого check-а не классифицируются).
        8. В evidence включай только дословные цитаты из текста договора.
        9. Верни РОВНО один JSON-объект со всеми 8 ключами без какого-либо
           дополнительного текста до или после. Начни ответ сразу
           с открывающей фигурной скобки и закончи закрывающей. НЕ пиши
           Markdown, списки, код-фенсы. Ответ должен быть валидным JSON,
           пригодным для парсинга через json.loads без предварительной
           обработки.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — срок указан, безнал передача и возврат:
        Фрагмент:
        "3.1. Срок возврата займа — не позднее 31 декабря 2026 года.
        4.1. Сумма займа перечисляется Займодавцем на расчётный счёт
        Заёмщика в течение 3 рабочих дней с даты подписания договора.
        4.2. Возврат займа осуществляется Заёмщиком путём безналичного
        перечисления на расчётный счёт Займодавца. Заёмщик обязуется
        возвратить сумму займа в срок, указанный в п. 3.1."
        Ответ:
        {
          "repayment_term_status": "defined",
          "repayment_term_value": "не позднее 31 декабря 2026 года",
          "repayment_term_display": "31.12.2026",
          "transfer_method": "bank_transfer",
          "transfer_method_display": "Безналичный перевод",
          "repayment_method": "bank_transfer",
          "repayment_method_display": "Безналичный перевод",
          "evidence": [
            {
              "clause_ref": "п. 3.1",
              "quote": "Срок возврата займа — не позднее 31 декабря 2026 года."
            },
            {
              "clause_ref": "п. 4.1",
              "quote": "Сумма займа перечисляется Займодавцем на расчётный счёт Заёмщика в течение 3 рабочих дней с даты подписания договора."
            },
            {
              "clause_ref": "п. 4.2",
              "quote": "Возврат займа осуществляется Заёмщиком путём безналичного перечисления на расчётный счёт Займодавца. Заёмщик обязуется возвратить сумму займа в срок, указанный в п. 3.1."
            }
          ]
        }

        Пример 2 — срок не указан (ст. 810(1)), наличная передача:
        Фрагмент:
        "Займодавец передал Заёмщику 500 000 рублей наличными,
        что подтверждается распиской Заёмщика. Возврат займа производится
        наличными в кассу Займодавца."
        (срок возврата не указан)
        Ответ:
        {
          "repayment_term_status": "defined",
          "repayment_term_value": "Срок не установлен (возврат в течение 30 дней с момента предъявления требования по ст. 810(1) ГК РФ)",
          "repayment_term_display": "По требованию (30 дней, ст. 810(1) ГК РФ)",
          "transfer_method": "cash",
          "transfer_method_display": "Наличные",
          "repayment_method": "cash",
          "repayment_method_display": "Наличные",
          "evidence": [
            {
              "clause_ref": "п. 1.1",
              "quote": "Займодавец передал Заёмщику 500 000 рублей наличными, что подтверждается распиской Заёмщика."
            },
            {
              "clause_ref": "п. 3.1",
              "quote": "Возврат займа производится наличными в кассу Займодавца."
            }
          ]
        }

        Пример 3 — срок по графику:
        Фрагмент:
        "Срок и порядок возврата займа определяются согласно Графику платежей
        (Приложение № 1 к настоящему договору). Возврат осуществляется
        путём безналичного перечисления."
        Ответ:
        {
          "repayment_term_status": "defined",
          "repayment_term_value": "Согласно Графику платежей (Приложение № 1)",
          "repayment_term_display": "Согласно Графику платежей (Приложение № 1)",
          "transfer_method": "not_defined",
          "transfer_method_display": "Не определён",
          "repayment_method": "bank_transfer",
          "repayment_method_display": "Безналичный перевод",
          "evidence": [
            {
              "clause_ref": "п. 3.1",
              "quote": "Срок и порядок возврата займа определяются согласно Графику платежей (Приложение № 1 к настоящему договору)."
            }
          ]
        }

        Пример 4 — смешанный способ:
        Фрагмент:
        "Передача займа осуществляется: 3 000 000 рублей — безналичным
        переводом, 2 000 000 рублей — наличными. Возврат производится
        в той же пропорции."
        Ответ:
        {
          "repayment_term_status": "not_defined",
          "repayment_term_value": "Не установлено",
          "repayment_term_display": "Не определён",
          "transfer_method": "mixed",
          "transfer_method_display": "Смешанный (безнал + наличные)",
          "repayment_method": "mixed",
          "repayment_method_display": "Смешанный (безнал + наличные)",
          "evidence": [
            {
              "clause_ref": "п. 4.1",
              "quote": "Передача займа осуществляется: 3 000 000 рублей — безналичным переводом, 2 000 000 рублей — наличными."
            }
          ]
        }

        Пример 5 — текст есть, но надёжный вывод сделать нельзя
        (уклончивая формулировка срока и способа):
        Фрагмент:
        "4.1. Срок возврата займа и порядок расчётов определяются Сторонами
        в дополнительном соглашении к настоящему Договору."
        (нет ни конкретного срока, ни способа передачи/возврата
        в самом договоре)
        Ответ:
        {
          "repayment_term_status": "defined",
          "repayment_term_value": "Срок не установлен (возврат в течение 30 дней с момента предъявления требования по ст. 810(1) ГК РФ)",
          "repayment_term_display": "По требованию (30 дней, ст. 810(1) ГК РФ)",
          "transfer_method": "not_defined",
          "transfer_method_display": "Не определён",
          "repayment_method": "not_defined",
          "repayment_method_display": "Не определён",
          "evidence": [
            {
              "clause_ref": "п. 4.1",
              "quote": "Срок возврата займа и порядок расчётов определяются Сторонами в дополнительном соглашении к настоящему Договору."
            }
          ]
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о сроке возврата. Если нет — применяй
           ст. 810(1) ГК РФ.
        2. Найди прямую цитату о способе передачи займа.
        3. Найди прямую цитату о способе возврата займа.
        4. Проверь дихотомию:
             явный срок -> repayment_term_value = конкретная формулировка;
             график -> "Согласно Графику платежей (Приложение № N)";
             срок не указан -> ст. 810(1), 30 дней по требованию;
             неполный контекст -> "Не установлено".
        5. Проверь, что все 8 ключей (7 полей + evidence) присутствуют
           в JSON.
        6. Проверь, что *_display поля собраны из соответствующих значений.
        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь РОВНО одним JSON-объектом без какого-либо дополнительного
        текста до или после, со всеми 8 ключами:
        {
          "repayment_term_status": "<defined / not_defined>",
          "repayment_term_value": "<срок / 'Срок не установлен (возврат в течение 30 дней с момента предъявления требования по ст. 810(1) ГК РФ)' / 'Согласно Графику платежей (Приложение № N)' / 'Не установлено'>",
          "repayment_term_display": "<31.12.2026 / По требованию (30 дней, ст. 810(1) ГК РФ) / Согласно Графику платежей (Приложение № N) / Не определён>",
          "transfer_method": "<cash / bank_transfer / mixed / not_defined>",
          "transfer_method_display": "<Наличные / Безналичный перевод / Смешанный (безнал + наличные) / Не определён>",
          "repayment_method": "<cash / bank_transfer / mixed / not_defined>",
          "repayment_method_display": "<Наличные / Безналичный перевод / Смешанный (безнал + наличные) / Не определён>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 8
      temperature: 0.0
      max_tokens: 800
    retrieval:
      retrieval_profile: "repayment_schedule_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "срок возврата дата возврат займа обязуется возвратить передача перечислены расписка платежное поручение наличными безналичным переводом график платежей по требованию вещевой заём дополнительное соглашение"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - procedures
      negative_keywords:
        - "сумма займа"
        - "проценты"
        - "ставка"
        - "неустойка"
        - "обеспечение"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.20, 0.65]
        boost: 0.20
        scope: segment
      context_k: 8
      max_chunks: 10
      rerank: true
    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
