  - id: secured_loan_terms
    name: "Обеспечение займа: залог, поручительство, задаток, обеспечительный платёж (ст. 334, 361, 380, 381.1 ГК РФ)"
    description: >
      Фактографическая проверка наличия и описания обеспечения исполнения
      обязательства по займу: залог имущества / прав, поручительство,
      независимая гарантия, обеспечительный платёж, задаток.
      Предмет обеспечения, регистрация в реестрах.
      Критично для оценки защищённости требования займодавца.
    triggers:
      any: ["secured_loan"]
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "залог"
        - "поручительство"
        - "обеспечение"
        - "ипотека"
        - "залогодатель"
        - "залогодержатель"
        - "поручитель"
        - "независимая гарантия"
        - "реестр уведомлений о залоге"
        - "ЕГРН"
        - "товары в обороте"
        - "обеспечительный платёж"
        - "задаток"
        - "гарантийный депозит"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)залог|поручительств|ипотек|гаранти[яи]"
        - "(?i)предмет\\s+залога"
        - "(?i)договор\\s+залога|поручительства"
        - "(?i)товар[а-я]*\\s+в\\s+оборот"
        - "(?i)обеспечительн(ый|ого)\\s+плат[её]ж"
        - "(?i)\\bзадат[оа]к\\b"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор займа с обеспечением (ст. 334, 361, 380, 381.1 ГК РФ).
        Проверяются наличие и тип обеспечения, предмет обеспечения,
        регистрация в реестрах.

        Нормативный ориентир:
        - ст. 334 ГК РФ — залог: залогодержатель вправе удовлетворить
          требование из стоимости заложенного имущества преимущественно
          перед другими кредиторами;
        - ст. 357 ГК РФ — залог товаров в обороте: залогодатель вправе
          изменять состав заложенных товаров при условии, что их общая
          стоимость не становится меньше указанной в договоре;
        - ст. 361 ГК РФ — поручительство: поручитель отвечает за должника
          солидарно;
        - ст. 368 ГК РФ — независимая гарантия;
        - ст. 380 ГК РФ — задаток: денежная сумма, выдаваемая одной
          стороной в счёт причитающихся с неё по договору платежей
          другой стороне, в доказательство заключения договора
          и в обеспечение его исполнения;
        - ст. 381.1 ГК РФ — обеспечительный платёж: денежная сумма,
          вносимая одной стороной в пользу другой для обеспечения
          исполнения денежного обязательства; при неисполнении
          обеспечительный платёж засчитывается в счёт обязательства;
        - ст. 131 ГК РФ, ст. 10.1 ФЗ-127 — регистрация ипотеки в ЕГРН,
          залога движимого имущества в реестре уведомлений о залоге
          (нотариус).

        Важно:
        - Твоя задача — установить фактические условия договора.
        - Не выдумывай предмет залога или регистрацию, если их нет
          в тексте.
        - Если обеспечения нет — верни «Нет обеспечения».

        [ЗАДАЧА]
        Найди в тексте договора (обычно раздел «Обеспечение» или отдельный
        договор):
        1. Наличие обеспечения (есть / нет).
        2. Тип обеспечения (залог имущества / залог прав / поручительство /
           гарантия / обеспечительный платёж / задаток).
        3. Предмет обеспечения (описание имущества/прав/поручителя/
           размер обеспечительного платежа).
        4. Регистрация обеспечения (ЕГРН / реестр уведомлений /
           не зарегистрировано).

        [ПРАВИЛА]
        1. Используй только текст документа. Не выдумывай предмет залога
           или регистрацию.
        2. Если в договоре нет обеспечения:
           - security_presence_status = "not_defined";
           - security_presence_display = "Нет обеспечения";
           - security_type = "not_defined";
           - security_type_display = "Не применимо";
           - security_subject = "Не применимо";
           - security_subject_display = "Не применимо";
           - security_registration_status = "not_applicable";
           - security_registration_display = "Не применимо".
        3. Если тип обеспечения указан, но предмет не описан —
           security_subject_display = "Не описан (риск неопределённости
           залога)".
        4. Если регистрация не указана —
           security_registration_display = "Не зарегистрировано
           (риск отсутствия приоритета)".
        5. Поручительство, независимая гарантия, обеспечительный платёж
           и задаток НЕ регистрируются — security_registration_status
           = "not_applicable".
        6. Залог товаров в обороте (ст. 357 ГК РФ) — это подтип залога
           движимого имущества: security_type = "movable_property_pledge",
           в display указывай «(товары в обороте)».
        7. Для обеспечительного платежа — в security_subject указывай
           размер платежа и условия его возврата / зачёта; регистрация
           не применима.
        8. Для задатка — в security_subject указывай размер и назначение
           (обеспечение заключения договора займа); регистрация
           не применима.
        9. Запрещены значения: null, None, пустые строки — не используй
           их никогда. Допустимые fallback-значения: "not_defined",
           "not_applicable", "Не установлено", "Не применимо",
           "Не описан", "Не зарегистрировано".
        10. В evidence включай только дословные цитаты из текста договора.
        11. Верни РОВНО один JSON-объект со всеми 9 ключами без какого-либо
            дополнительного текста до или после. Начни ответ сразу
            с открывающей фигурной скобки и закончи закрывающей. НЕ пиши
            Markdown, списки, код-фенсы. Ответ должен быть валидным JSON,
            пригодным для парсинга через json.loads без предварительной
            обработки.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — залог недвижимости (ипотека) с регистрацией в ЕГРН:
        Фрагмент:
        "3.1. Исполнение обязательства по займу обеспечивается залогом
        недвижимого имущества — зданием склада по адресу: г. Москва,
        ул. Складская, д. 10 (кадастровый номер 77:01:123456:123).
        3.2. Залог подлежит регистрации в ЕГРН. Стороны обязуются
        зарегистрировать ипотеку в течение 30 дней с даты подписания."
        Ответ:
        {
          "security_presence_status": "defined",
          "security_presence_display": "Есть обеспечение (залог недвижимости)",
          "security_type": "real_estate_mortgage",
          "security_type_display": "Залог недвижимости (ипотека)",
          "security_subject": "Здание склада по адресу: г. Москва, ул. Складская, д. 10 (кадастровый номер 77:01:123456:123)",
          "security_subject_display": "Здание склада (г. Москва, ул. Складская, д. 10, кадастр 77:01:123456:123)",
          "security_registration_status": "defined",
          "security_registration_display": "Регистрация в ЕГРН (ипотека)",
          "evidence": [
            {
              "clause_ref": "п. 3.1",
              "quote": "Исполнение обязательства по займу обеспечивается залогом недвижимого имущества — зданием склада по адресу: г. Москва, ул. Складская, д. 10 (кадастровый номер 77:01:123456:123)."
            },
            {
              "clause_ref": "п. 3.2",
              "quote": "Залог подлежит регистрации в ЕГРН. Стороны обязуются зарегистрировать ипотеку в течение 30 дней с даты подписания."
            }
          ]
        }

        Пример 2 — поручительство третьего лица:
        Фрагмент:
        "4.1. Исполнение обязательства обеспечивается поручительством
        ООО «Гарант» (ИНН 7701234567). Поручитель отвечает солидарно
        с Заёмщиком в пределах суммы займа и процентов."
        Ответ:
        {
          "security_presence_status": "defined",
          "security_presence_display": "Есть обеспечение (поручительство)",
          "security_type": "suretyship",
          "security_type_display": "Поручительство третьего лица",
          "security_subject": "ООО «Гарант» (ИНН 7701234567)",
          "security_subject_display": "Поручитель: ООО «Гарант» (ИНН 7701234567)",
          "security_registration_status": "not_applicable",
          "security_registration_display": "Не применимо (поручительство не регистрируется)",
          "evidence": [
            {
              "clause_ref": "п. 4.1",
              "quote": "Исполнение обязательства обеспечивается поручительством ООО «Гарант» (ИНН 7701234567). Поручитель отвечает солидарно с Заёмщиком в пределах суммы займа и процентов."
            }
          ]
        }

        Пример 3 — залог движимого имущества (реестр уведомлений):
        Фрагмент:
        "5.1. Обеспечение: залог оборудования (производственная линия,
        инв. № 12345). Залог подлежит регистрации в реестре уведомлений
        о залоге движимого имущества у нотариуса."
        Ответ:
        {
          "security_presence_status": "defined",
          "security_presence_display": "Есть обеспечение (залог движимого имущества)",
          "security_type": "movable_property_pledge",
          "security_type_display": "Залог движимого имущества",
          "security_subject": "Производственная линия (инв. № 12345)",
          "security_subject_display": "Оборудование (производственная линия, инв. № 12345)",
          "security_registration_status": "defined",
          "security_registration_display": "Регистрация в реестре уведомлений о залоге (нотариус)",
          "evidence": [
            {
              "clause_ref": "п. 5.1",
              "quote": "Обеспечение: залог оборудования (производственная линия, инв. № 12345). Залог подлежит регистрации в реестре уведомлений о залоге движимого имущества у нотариуса."
            }
          ]
        }

        Пример 4 — нет обеспечения:
        Фрагмент:
        "1.1. Займодавец передаёт Заёмщику денежные средства в размере
        10 000 000 рублей."
        (нет упоминаний о залоге, поручительстве, обеспечении)
        Ответ:
        {
          "security_presence_status": "not_defined",
          "security_presence_display": "Нет обеспечения",
          "security_type": "not_defined",
          "security_type_display": "Не применимо",
          "security_subject": "Не применимо",
          "security_subject_display": "Не применимо",
          "security_registration_status": "not_applicable",
          "security_registration_display": "Не применимо",
          "evidence": []
        }

        Пример 5 — залог товаров в обороте без конкретики состава:
        Фрагмент:
        "6.1. Исполнение обязательств по займу обеспечивается залогом
        товаров в обороте. Состав заложенных товаров определяется
        Сторонами дополнительно."
        Ответ:
        {
          "security_presence_status": "defined",
          "security_presence_display": "Есть обеспечение (залог движимого имущества)",
          "security_type": "movable_property_pledge",
          "security_type_display": "Залог движимого имущества (товары в обороте)",
          "security_subject": "Товары в обороте (состав определяется дополнительно)",
          "security_subject_display": "Товары в обороте (состав не определён)",
          "security_registration_status": "not_defined",
          "security_registration_display": "Не зарегистрировано (риск отсутствия приоритета)",
          "evidence": [
            {
              "clause_ref": "п. 6.1",
              "quote": "Исполнение обязательств по займу обеспечивается залогом товаров в обороте. Состав заложенных товаров определяется Сторонами дополнительно."
            }
          ]
        }

        Пример 6 — обеспечительный платёж:
        Фрагмент:
        "7.1. В обеспечение исполнения обязательств по настоящему Договору
        Заёмщик вносит Займодавцу обеспечительный платёж в размере
        500 000 рублей в течение 5 рабочих дней с даты подписания
        Договора.
        7.2. При надлежащем исполнении обязательств обеспечительный платёж
        возвращается Заёмщику в течение 10 рабочих дней после полного
        погашения займа. При неисполнении обязательств сумма
        обеспечительного платежа засчитывается в счёт погашения
        задолженности."
        Ответ:
        {
          "security_presence_status": "defined",
          "security_presence_display": "Есть обеспечение (обеспечительный платёж)",
          "security_type": "security_deposit",
          "security_type_display": "Обеспечительный платёж",
          "security_subject": "500 000 рублей, возврат при надлежащем исполнении, зачёт при неисполнении",
          "security_subject_display": "500 000 руб. (возврат или зачёт при неисполнении)",
          "security_registration_status": "not_applicable",
          "security_registration_display": "Не применимо (обеспечительный платёж не регистрируется)",
          "evidence": [
            {
              "clause_ref": "п. 7.1",
              "quote": "В обеспечение исполнения обязательств по настоящему Договору Заёмщик вносит Займодавцу обеспечительный платёж в размере 500 000 рублей в течение 5 рабочих дней с даты подписания Договора."
            },
            {
              "clause_ref": "п. 7.2",
              "quote": "При надлежащем исполнении обязательств обеспечительный платёж возвращается Заёмщику в течение 10 рабочих дней после полного погашения займа. При неисполнении обязательств сумма обеспечительного платежа засчитывается в счёт погашения задолженности."
            }
          ]
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о наличии обеспечения.
        2. Определи тип обеспечения (залог недвижимости / движимого
           имущества / прав, поручительство, гарантия, обеспечительный
           платёж, задаток).
        3. Найди описание предмета обеспечения (адрес, кадастровый номер,
           ИНН поручителя, размер обеспечительного платежа).
        4. Найди упоминание регистрации (ЕГРН / реестр уведомлений /
           не регистрируется).
        5. Проверь дихотомию тип ↔ регистрация:
           - ипотека → ЕГРН;
           - залог движимого (включая товары в обороте) → реестр
             уведомлений;
           - поручительство / гарантия / обеспечительный платёж /
             задаток → not_applicable.
        6. Проверь, что все 9 ключей (8 полей + evidence) присутствуют
           в JSON.
        7. Если обеспечения нет — верни «Нет обеспечения» для всех полей.
        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь РОВНО одним JSON-объектом без какого-либо дополнительного
        текста до или после, со всеми 9 ключами:
        {
          "security_presence_status": "<defined / not_defined>",
          "security_presence_display": "<Есть обеспечение (…) / Нет обеспечения>",
          "security_type": "<real_estate_mortgage / movable_property_pledge / rights_pledge / suretyship / independent_guarantee / security_deposit / earnest_money / other / not_defined>",
          "security_type_display": "<Залог недвижимости (ипотека) / Залог движимого имущества (…) / Залог прав (требований, акций, долей) / Поручительство третьего лица / Независимая гарантия / Обеспечительный платёж / Задаток / Иное / Не определён / Не применимо>",
          "security_subject": "<описание предмета или 'Не применимо'>",
          "security_subject_display": "<краткое описание предмета или 'Не описан (риск неопределённости залога)' / 'Не применимо'>",
          "security_registration_status": "<defined / not_defined / not_applicable>",
          "security_registration_display": "<Регистрация в ЕГРН (ипотека) / Регистрация в реестре уведомлений о залоге (нотариус) / Не зарегистрировано (риск отсутствия приоритета) / Не применимо (поручительство/гарантия/обеспечительный платёж/задаток не регистрируются)>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 8
      temperature: 0.0
      max_tokens: 900
    retrieval:
      retrieval_profile: "security_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "залог поручительство обеспечение ипотека залогодатель залогодержатель поручитель независимая гарантия обеспечительный платёж задаток гарантийный депозит реестр уведомлений ЕГРН предмет залога товары в обороте"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - limitations
      negative_keywords:
        - "проценты по займу"
        - "процентная ставка"
        - "неустойка за просрочку"
        - "аффилированность"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.30, 0.85]
        boost: 0.18
        scope: segment
      context_k: 8
      max_chunks: 10
      rerank: true
    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - obligations
        - limitations
      confidence_bonus_on_match: 0.12
      confidence_penalty_on_excluded_segment: 0.15
    evidence:
      required: true
      min_snippet_length: 35
      max_snippet_length: 600
    extraction:
      store_payload: true

      enabled: true
      mode: "hybrid"
      compact_output: false
      llm_max_tokens: 1400
      llm_prompt_extraction: |
        <role>
        Ты — российский юрист по договорной работе. Извлеки из текста
        договора займа сведения об обеспечении: наличие, тип, предмет,
        регистрация (ст. 334, 357, 361, 368, 380, 381.1 ГК РФ).
        Не анализируй проценты по ст. 809 ГК РФ или общую ответственность.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие 8 полей + evidence (всего 9 ключей).
        Верни все ключи, даже если данные отсутствуют.

        1.  security_presence_status — "defined" (если есть обеспечение)
            или "not_defined".
        2.  security_presence_display — user-facing строка:
              - "Есть обеспечение (залог недвижимости)";
              - "Есть обеспечение (залог движимого имущества)";
              - "Есть обеспечение (поручительство)";
              - "Есть обеспечение (независимая гарантия)";
              - "Есть обеспечение (обеспечительный платёж)";
              - "Есть обеспечение (задаток)";
              - "Нет обеспечения".
        3.  security_type — "real_estate_mortgage" /
            "movable_property_pledge" / "rights_pledge" / "suretyship" /
            "independent_guarantee" / "security_deposit" / "earnest_money" /
            "other" / "not_defined":
              - "real_estate_mortgage" — ипотека, залог недвижимости;
              - "movable_property_pledge" — залог оборудования,
                транспорта, товаров (в том числе товаров в обороте
                по ст. 357 ГК РФ);
              - "rights_pledge" — залог прав (требований, акций, долей);
              - "suretyship" — поручительство физического или
                юридического лица;
              - "independent_guarantee" — независимая гарантия
                (банковская гарантия);
              - "security_deposit" — обеспечительный платёж
                (ст. 381.1 ГК РФ);
              - "earnest_money" — задаток (ст. 380 ГК РФ);
              - "other" — иное обеспечение (удержание и т.п.);
              - "not_defined" — не определено или нет обеспечения.
        4.  security_type_display — user-facing строка:
              - "Залог недвижимости (ипотека)";
              - "Залог движимого имущества" (или "(товары в обороте)");
              - "Залог прав (требований, акций, долей)";
              - "Поручительство третьего лица";
              - "Независимая гарантия";
              - "Обеспечительный платёж";
              - "Задаток";
              - "Иное обеспечение";
              - "Не определён";
              - "Не применимо".
        5.  security_subject — точное описание предмета из договора
            или "Не применимо".
              - для обеспечительного платежа — размер платежа
                и условия возврата / зачёта;
              - для задатка — размер и назначение (обеспечение
                заключения договора займа).
        6.  security_subject_display — user-facing краткое описание:
              - "Здание склада (адрес, кадастровый номер)";
              - "Оборудование (описание, инв. номер)";
              - "Поручитель: ООО «Название» (ИНН)";
              - "500 000 руб. (возврат или зачёт при неисполнении)";
              - "Не описан (риск неопределённости залога)";
              - "Не применимо".
        7.  security_registration_status — "defined" / "not_defined" /
            "not_applicable".
        8.  security_registration_display — user-facing строка:
              - "Регистрация в ЕГРН (ипотека)";
              - "Регистрация в реестре уведомлений о залоге (нотариус)";
              - "Не зарегистрировано (риск отсутствия приоритета)";
              - "Не применимо (поручительство/гарантия/обеспечительный
                платёж/задаток не регистрируются)".

        Дополнительно — обязательный массив evidence:
        - цитаты с условиями обеспечения (тип, предмет, регистрация);
        - пустой массив [], если обеспечения нет.

        Правила заполнения при отсутствии данных:
        - Если обеспечения нет — все display-поля = «Нет обеспечения»
          / «Не применимо».
        - Залог товаров в обороте (ст. 357 ГК РФ) — подтип залога
          движимого имущества, отражай в display «(товары в обороте)».
        </task>

        <rules>
        - Используй только текст договора. Не выдумывай предмет залога
          или регистрацию.
        - Не используй null, None или пустые строки — только явные
          fallback-значения ("not_defined" / "not_applicable" /
          "Не установлено" / "Не применимо" / "Не описан" /
          "Не зарегистрировано").
        - Распознавай ссылки на ст. 334, 357, 361, 368, 380, 381.1 ГК РФ
          как залог, залог товаров в обороте, поручительство,
          независимую гарантию, задаток, обеспечительный платёж
          соответственно.
        - Если предмет залога не описан конкретно — security_subject_display
          = "Не описан (риск неопределённости залога)".
        - Если регистрация не указана — security_registration_display =
          "Не зарегистрировано (риск отсутствия приоритета)".
        - Поручительство, независимая гарантия, обеспечительный платёж
          и задаток не регистрируются — security_registration_status
          = "not_applicable".
        - Дихотомия тип ↔ регистрация:
            ипотека -> ЕГРН;
            залог движимого (включая товары в обороте) -> реестр
              уведомлений;
            поручительство / гарантия / обеспечительный платёж /
              задаток -> not_applicable.
        - Верни РОВНО один JSON-объект со всеми 9 ключами
          без какого-либо дополнительного текста до или после.
          Начни ответ сразу с открывающей фигурной скобки и закончи
          закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ
          должен быть валидным JSON, пригодным для парсинга через
          json.loads без предварительной обработки.
        </rules>
      fields:
        - name: "security_presence_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус наличия обеспечения займа (raw enum)."
          required: true
          display_in_grid: false
        - name: "security_presence_display"
          type: "string"
          presentation: "fact"
          label: "Наличие обеспечения"
          description: "User-facing наличие и тип обеспечения займа."
          required: true
          display_in_grid: true
          display_priority: 1
        - name: "security_type"
          type: "string"
          presentation: "signal"
          allowed_values: ["real_estate_mortgage", "movable_property_pledge", "rights_pledge", "suretyship", "independent_guarantee", "security_deposit", "earnest_money", "other", "not_defined"]
          description: "Тип обеспечения (raw enum)."
          required: true
          display_in_grid: false
        - name: "security_type_display"
          type: "string"
          presentation: "fact"
          label: "Тип обеспечения"
          description: "User-facing тип обеспечения (ипотека / залог движимого / поручительство / обеспечительный платёж / задаток)."
          required: true
          display_in_grid: true
          display_priority: 2
        - name: "security_subject"
          type: "string"
          presentation: "fact"
          label: "Предмет обеспечения (полное описание)"
          description: "Полное описание предмета обеспечения из договора."
          required: true
          display_in_grid: false
        - name: "security_subject_display"
          type: "string"
          presentation: "fact"
          label: "Предмет обеспечения"
          description: "User-facing краткое описание предмета обеспечения."
          required: true
          display_in_grid: true
          display_priority: 3
        - name: "security_registration_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined", "not_applicable"]
          description: "Статус регистрации обеспечения (raw enum)."
          required: true
          display_in_grid: false
        - name: "security_registration_display"
          type: "string"
          presentation: "fact"
          label: "Регистрация обеспечения"
          description: "User-facing статус регистрации обеспечения (ЕГРН / реестр уведомлений / не применимо)."
          required: true
          display_in_grid: true
          display_priority: 4

  - id: tax_consequences_disclosure
    name: "Налоговые последствия займа: материальная выгода, НДФЛ, налоговый агент (ст. 212, 226 НК РФ)"
    description: >
      Фактографическая проверка раскрытия в договоре налоговых последствий
      займа: материальная выгода от экономии на процентах (ст. 212 НК РФ),
      НДФЛ (35% для резидентов), статус налогового агента у займодавца
      (ст. 226 НК РФ), распределение налогового бремени.
      Критично для беспроцентных займов и займов между аффилированными лицами.
    triggers:
      any: ["interest_free_loan", "related_parties", "individual_parties"]
    ui_mode: "field_extraction"
    severity: "medium"
    severity_if_pass: "pass"
    severity_if_fail: "medium"
    severity_if_unclear: "low"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "материальная выгода"
        - "ндфл"
        - "налоговые последствия"
        - "экономия на процентах"
        - "налоговый агент"
        - "статья 212 нк рф"
        - "статья 226 нк рф"
        - "налог на доходы"
        - "налоговая база"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)материальн(ая|ой)\\s+выгод"
        - "(?i)экономи[яи]\\s+на\\s+процент"
        - "(?i)ндфл|налог\\s+на\\s+доход"
        - "(?i)налогов[ый|ого]\\s+агент"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе и налоговому праву.
        Анализируется договор займа на предмет раскрытия налоговых
        последствий (ст. 212, 226 НК РФ).

        Нормативный ориентир:
        - ст. 212 НК РФ — материальная выгода от экономии на процентах:
          при беспроцентном или низкопроцентном займе у заёмщика-физлица
          возникает доход в виде экономии на процентах, облагаемый НДФЛ
          по ставке 35% (для налоговых резидентов РФ);
        - ст. 226 НК РФ — организация-займодавец признаётся налоговым
          агентом и обязана исчислить, удержать и уплатить НДФЛ
          с материальной выгоды;
        - ст. 250 НК РФ (п. 8) — при беспроцентном займе между
          коммерческими организациями у заёмщика возникает
          внереализационный доход (налог на прибыль);
        - ст. 105.1 НК РФ — для аффилированных лиц риск переквалификации
          займа налоговой (трансфертное ценообразование).

        Важно:
        - Твоя задача — установить фактические условия договора.
        - Не выдумывай налоговые условия, если их нет в тексте.
        - Если налоговые последствия не раскрыты — укажи это явно.

        [ЗАДАЧА]
        Найди в тексте договора (обычно раздел «Налоговые последствия»
        или «Общие положения»):
        1. Раскрытие налоговых последствий (есть / нет).
        2. Тип налоговых последствий (НДФЛ / материальная выгода /
           налог на прибыль / общая оговорка).
        3. Распределение налогового бремени (заёмщик / займодавец /
           налоговый агент).

        [ПРАВИЛА]
        1. Используй только текст документа. Не выдумывай налоговые
           условия.
        2. Если в договоре нет раскрытия налоговых последствий:
           - tax_disclosure_status = "not_defined";
           - tax_disclosure_display = "Не раскрыто";
           - tax_type = "not_defined";
           - tax_type_display = "Не установлено";
           - tax_burden = "not_defined";
           - tax_burden_display = "Не установлено".
        3. Если указана материальная выгода — tax_type = "personal_income_tax",
           tax_type_display = "Материальная выгода (НДФЛ 35%, ст. 212 НК РФ)".
        4. Если указан налоговый агент — tax_burden = "lender_as_agent",
           tax_burden_display = "Займодавец (налоговый агент по НДФЛ)".
        5. НДС не применяется к займу (пп. 1 п. 2 ст. 146, пп. 1 п. 3
           ст. 39 НК РФ — выдача займа в денежной форме не является
           реализацией). Не выделяй НДС как отдельный тип.
        6. Запрещены значения: null, None, пустые строки — не используй
           их никогда. Допустимые fallback-значения: "not_defined",
           "Не раскрыто", "Не установлено".
        7. В evidence включай только дословные цитаты из текста договора.
        8. Верни РОВНО один JSON-объект со всеми 7 ключами без какого-либо
           дополнительного текста до или после. Начни ответ сразу
           с открывающей фигурной скобки и закончи закрывающей. НЕ пиши
           Markdown, списки, код-фенсы. Ответ должен быть валидным JSON,
           пригодным для парсинга через json.loads без предварительной
           обработки.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — раскрыта материальная выгода и налоговый агент:
        Фрагмент:
        "7.1. Заёмщик подтверждает, что при беспроцентном пользовании
        займом у него возникает материальная выгода от экономии
        на процентах, облагаемая НДФЛ по ставке 35% в соответствии
        со ст. 212 НК РФ.
        7.2. Займодавец выступает налоговым агентом и обязуется
        исчислить, удержать и уплатить НДФЛ в бюджет в соответствии
        со ст. 226 НК РФ."
        Ответ:
        {
          "tax_disclosure_status": "defined",
          "tax_disclosure_display": "Раскрыто в договоре",
          "tax_type": "personal_income_tax",
          "tax_type_display": "Материальная выгода (НДФЛ 35%, ст. 212 НК РФ)",
          "tax_burden": "lender_as_agent",
          "tax_burden_display": "Займодавец (налоговый агент по НДФЛ)",
          "evidence": [
            {
              "clause_ref": "п. 7.1",
              "quote": "Заёмщик подтверждает, что при беспроцентном пользовании займом у него возникает материальная выгода от экономии на процентах, облагаемая НДФЛ по ставке 35% в соответствии со ст. 212 НК РФ."
            },
            {
              "clause_ref": "п. 7.2",
              "quote": "Займодавец выступает налоговым агентом и обязуется исчислить, удержать и уплатить НДФЛ в бюджет в соответствии со ст. 226 НК РФ."
            }
          ]
        }

        Пример 2 — раскрыты общие налоговые риски без деталей:
        Фрагмент:
        "8.1. Каждая сторона самостоятельно несёт налоговые последствия,
        связанные с исполнением настоящего договора."
        Ответ:
        {
          "tax_disclosure_status": "defined",
          "tax_disclosure_display": "Раскрыто в договоре",
          "tax_type": "general",
          "tax_type_display": "Общие налоговые риски (без конкретизации)",
          "tax_burden": "each_party_bears_own",
          "tax_burden_display": "Каждая сторона самостоятельно (общая оговорка)",
          "evidence": [
            {
              "clause_ref": "п. 8.1",
              "quote": "Каждая сторона самостоятельно несёт налоговые последствия, связанные с исполнением настоящего договора."
            }
          ]
        }

        Пример 3 — налоговые последствия не раскрыты:
        Фрагмент:
        "1.1. Займодавец передаёт Заёмщику денежные средства в размере
        10 000 000 рублей. Заём является беспроцентным."
        (нет упоминаний о НДФЛ, материальной выгоде, налоговом агенте)
        Ответ:
        {
          "tax_disclosure_status": "not_defined",
          "tax_disclosure_display": "Не раскрыто",
          "tax_type": "not_defined",
          "tax_type_display": "Не установлено",
          "tax_burden": "not_defined",
          "tax_burden_display": "Не установлено",
          "evidence": []
        }

        Пример 4 — текст есть, но надёжный вывод сделать нельзя
        (уклончивая формулировка):
        Фрагмент:
        "10.3. Все налоговые вопросы, возникающие в связи с настоящим
        Договором, разрешаются Сторонами в соответствии с действующим
        законодательством."
        (общая отсылка к НК РФ, нет ни конкретного налога,
        ни распределения бремени)
        Ответ:
        {
          "tax_disclosure_status": "defined",
          "tax_disclosure_display": "Раскрыто в договоре",
          "tax_type": "general",
          "tax_type_display": "Общие налоговые риски (без конкретизации)",
          "tax_burden": "not_defined",
          "tax_burden_display": "Не установлено",
          "evidence": [
            {
              "clause_ref": "п. 10.3",
              "quote": "Все налоговые вопросы, возникающие в связи с настоящим Договором, разрешаются Сторонами в соответствии с действующим законодательством."
            }
          ]
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о налоговых последствиях (НДФЛ,
           материальная выгода, налог на прибыль).
        2. Определи тип налоговых последствий (конкретный налог
           или общая оговорка).
        3. Найди указание на распределение налогового бремени
           (кто платит / налоговый агент).
        4. Проверь дихотомию:
             нет упоминаний -> tax_disclosure_status = "not_defined";
             есть конкретные условия -> "defined" + конкретный tax_type;
             общая отсылка к НК РФ -> "defined" + tax_type = "general".
        5. Проверь, что все 7 ключей (6 полей + evidence) присутствуют
           в JSON.
        6. Если налоговые последствия не раскрыты — верни «Не раскрыто» /
           «Не установлено» для всех полей.
        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь РОВНО одним JSON-объектом без какого-либо дополнительного
        текста до или после, со всеми 7 ключами:
        {
          "tax_disclosure_status": "<defined / not_defined>",
          "tax_disclosure_display": "<Раскрыто в договоре / Не раскрыто>",
          "tax_type": "<personal_income_tax / profit_tax / general / not_defined>",
          "tax_type_display": "<Материальная выгода (НДФЛ 35%, ст. 212 НК РФ) / Налог на прибыль / Общие налоговые риски (без конкретизации) / Не установлено>",
          "tax_burden": "<lender_as_agent / lender_bears_all / borrower_bears_all / each_party_bears_own / not_defined>",
          "tax_burden_display": "<Займодавец (налоговый агент по НДФЛ) / Займодавец (несёт все налоги) / Заёмщик самостоятельно / Каждая сторона самостоятельно (общая оговорка) / Не установлено>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 8
      temperature: 0.0
      max_tokens: 800
    retrieval:
      retrieval_profile: "tax_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "материальная выгода НДФЛ налоговые последствия экономия на процентах налоговый агент ст 212 226 НК РФ налог на доходы налоговая база беспроцентный заём"
      preferred_unit_types:
        - general_provision
        - obligation
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - boilerplate
        - obligations
      negative_keywords:
        - "проценты по займу"
        - "процентная ставка"
        - "неустойка за просрочку"
        - "обеспечение"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.50, 0.95]
        boost: 0.15
        scope: segment
      context_k: 8
      max_chunks: 10
      rerank: true
    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - boilerplate
        - obligations
      confidence_bonus_on_match: 0.12
      confidence_penalty_on_excluded_segment: 0.15
    evidence:
      required: true
      min_snippet_length: 35
      max_snippet_length: 600
    extraction:
      store_payload: true

      enabled: true
      mode: "hybrid"
      compact_output: false
      llm_max_tokens: 1200
      llm_prompt_extraction: |
        <role>
        Ты — российский юрист по налоговому праву. Извлеки из текста
        договора займа сведения о налоговых последствиях: раскрытие,
        тип налогов (НДФЛ, материальная выгода, налог на прибыль),
        распределение налогового бремени (ст. 212, 226, 250 НК РФ).
        Не анализируй проценты по ст. 809 ГК РФ или общую ответственность.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие 6 полей + evidence (всего 7 ключей).
        Верни все ключи, даже если данные отсутствуют.

        1.  tax_disclosure_status — "defined" (если есть раскрытие
            налоговых последствий) или "not_defined".
        2.  tax_disclosure_display — user-facing строка:
              - "Раскрыто в договоре" — если есть условия;
              - "Не раскрыто" — если нет условий.
        3.  tax_type — "personal_income_tax" / "profit_tax" / "general" /
            "not_defined":
              - "personal_income_tax" — НДФЛ, материальная выгода
                (ст. 212 НК РФ);
              - "profit_tax" — налог на прибыль для юрлиц
                (ст. 250 НК РФ);
              - "general" — общая оговорка без конкретизации;
              - "not_defined" — не определено.
        4.  tax_type_display — user-facing строка:
              - "Материальная выгода (НДФЛ 35%, ст. 212 НК РФ)";
              - "Налог на прибыль";
              - "Общие налоговые риски (без конкретизации)";
              - "Не установлено".
        5.  tax_burden — "lender_as_agent" / "lender_bears_all" /
            "borrower_bears_all" / "each_party_bears_own" / "not_defined":
              - "lender_as_agent" — займодавец как налоговый агент;
              - "lender_bears_all" — займодавец несёт все налоги;
              - "borrower_bears_all" — заёмщик несёт все налоги;
              - "each_party_bears_own" — каждая сторона самостоятельно;
              - "not_defined" — не определено.
        6.  tax_burden_display — user-facing строка:
              - "Займодавец (налоговый агент по НДФЛ)";
              - "Займодавец (несёт все налоги)";
              - "Заёмщик самостоятельно";
              - "Каждая сторона самостоятельно (общая оговорка)";
              - "Не установлено".

        Дополнительно — обязательный массив evidence:
        - цитаты с условиями о налоговых последствиях;
        - пустой массив [], если налоговые последствия не раскрыты.

        Правила заполнения при отсутствии данных:
        - Если налоговые последствия не раскрыты — все display-поля
          = «Не раскрыто» / «Не установлено».
        </task>

        <rules>
        - Используй только текст договора. Не выдумывай налоговые условия.
        - Не используй null, None или пустые строки — только явные
          fallback-значения ("not_defined" / "Не раскрыто" /
          "Не установлено").
        - Распознавай ссылки на ст. 212, 226, 250 НК РФ как материальную
          выгоду, налогового агента, налог на прибыль соответственно.
        - Различай сценарии в зависимости от типа сторон:
            * заём юрлицо -> физлицо (беспроцентный): материальная
              выгода у физлица, юрлицо = налоговый агент по НДФЛ;
            * заём юрлицо -> юрлицо (беспроцентный): внереализационный
              доход у заёмщика, налог на прибыль (п. 8 ст. 250 НК РФ);
            * заём между физлицами (беспроцентный, до 1 млн руб.):
              материальная выгода не возникает (пп. 1 п. 1 ст. 212
              НК РФ не применяется).
        - НДС к займу не применяется (пп. 1 п. 2 ст. 146, пп. 1 п. 3
          ст. 39 НК РФ). Не выделяй НДС как отдельный тип.
        - Верни РОВНО один JSON-объект со всеми 7 ключами
          без какого-либо дополнительного текста до или после.
          Начни ответ сразу с открывающей фигурной скобки и закончи
          закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ
          должен быть валидным JSON, пригодным для парсинга через
          json.loads без предварительной обработки.
        </rules>
      fields:
        - name: "tax_disclosure_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус раскрытия налоговых последствий (raw enum)."
          required: true
          display_in_grid: false
        - name: "tax_disclosure_display"
          type: "string"
          presentation: "fact"
          label: "Раскрытие налоговых последствий"
          description: "User-facing статус раскрытия налоговых последствий займа."
          required: true
          display_in_grid: true
          display_priority: 1
        - name: "tax_type"
          type: "string"
          presentation: "signal"
          allowed_values: ["personal_income_tax", "profit_tax", "general", "not_defined"]
          description: "Тип налоговых последствий (raw enum)."
          required: true
          display_in_grid: false
        - name: "tax_type_display"
          type: "string"
          presentation: "fact"
          label: "Тип налоговых последствий"
          description: "User-facing тип налогов (НДФЛ, материальная выгода, налог на прибыль)."
          required: true
          display_in_grid: true
          display_priority: 2
        - name: "tax_burden"
          type: "string"
          presentation: "signal"
          allowed_values: ["lender_as_agent", "lender_bears_all", "borrower_bears_all", "each_party_bears_own", "not_defined"]
          description: "Распределение налогового бремени (raw enum)."
          required: true
          display_in_grid: false
        - name: "tax_burden_display"
          type: "string"
          presentation: "fact"
          label: "Налоговое бремя"
          description: "User-facing распределение налогового бремени между сторонами."
          required: true
          display_in_grid: true
          display_priority: 3

  - id: novation_set_off_terms
    name: "Новация / зачёт: порядок прекращения обязательства по займу (ст. 410, 414 ГК РФ)"
    description: >
      Фактографическая проверка условий новации или зачёта встречных требований
      для прекращения обязательства по займу. Критично для оценки рисков сохранения
      обеспечения (ст. 367 ГК РФ) и возможности альтернативного погашения займа.
    triggers:
      any: ["novation_or_set_off"]
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "новация"
        - "зачет"
        - "зачёт"
        - "прекращение обязательства"
        - "замена обязательства"
        - "встречные требования"
        - "статья 410"
        - "статья 414"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)новаци[яи]"
        - "(?i)зачет\\s+встречн|зачёт\\s+встречн"
        - "(?i)прекращен[иеия]\\s+обязательств"
        - "(?i)замен[аы]\\s+обязательств"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор займа на предмет условий новации или зачёта
        встречных требований (ст. 410, 414 ГК РФ).

        Нормативный ориентир:
        - ст. 410 ГК РФ — зачёт встречных однородных требований:
          обязательство прекращается полностью или частично зачётом
          встречного требования;
        - ст. 414 ГК РФ — новация: прекращение обязательства соглашением
          сторон заменой первоначального обязательства на иное
          (например, займ → поставка);
        - ст. 367 ГК РФ — при новации обеспечение может не сохраниться,
          если не согласовано явно (поручительство прекращается,
          залог требует перерегистрации). Сохранение возможно только
          с письменного согласия залогодателя / поручителя.

        Важно:
        - Твоя задача — установить фактические условия договора.
        - Не выдумывай условия новации/зачёта, если их нет в тексте.
        - Если новация/зачёт не предусмотрены — укажи это явно.

        [ЗАДАЧА]
        Найди в тексте договора (обычно раздел «Прекращение обязательства»
        или «Заключительные положения»):
        1. Наличие условий новации или зачёта (есть / нет).
        2. Тип прекращения (новация / зачёт встречных требований / иное).
        3. Условия прекращения (согласие сторон, уведомление, сроки,
           сохранение обеспечения).

        [ПРАВИЛА]
        1. Используй только текст документа. Не выдумывай условия
           новации/зачёта.
        2. Если в договоре нет условий новации/зачёта:
           - novation_setoff_presence_status = "not_defined";
           - novation_setoff_presence_display = "Не предусмотрено
             (только стандартное погашение)";
           - termination_type = "not_defined";
           - termination_type_display = "Не применимо";
           - termination_conditions = "Не применимо";
           - termination_conditions_display = "Не применимо".
        3. Если указана новация — termination_type = "novation",
           termination_type_display = "Новация (замена обязательства
           по ст. 414 ГК РФ)".
        4. Если указан зачёт — termination_type = "set_off",
           termination_type_display = "Зачёт встречных требований
           (ст. 410 ГК РФ)".
        5. Если указано иное прекращение (не новация и не зачёт,
           например отступное или иной механизм из текста) —
           termination_type = "other",
           termination_type_display = "Иное прекращение (указать
           из текста)".
        6. Если условия не описаны — termination_conditions_display
           = "Не описаны (риск спора о прекращении)".
        7. Запрещены значения: null, None, пустые строки — не используй
           их никогда. Допустимые fallback-значения: "not_defined",
           "not_applicable", "Не применимо", "Не предусмотрено",
           "Не описаны".
        8. В evidence включай только дословные цитаты из текста договора.
        9. Верни РОВНО один JSON-объект со всеми 7 ключами без какого-либо
           дополнительного текста до или после. Начни ответ сразу
           с открывающей фигурной скобки и закончи закрывающей. НЕ пиши
           Markdown, списки, код-фенсы. Ответ должен быть валидным JSON,
           пригодным для парсинга через json.loads без предварительной
           обработки.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — зачёт встречных требований с условиями:
        Фрагмент:
        "9.1. Стороны вправе произвести зачёт встречных однородных
        требований по настоящему договору в соответствии со ст. 410 ГК РФ.
        9.2. Зачёт производится по письменному уведомлению одной из сторон
        не менее чем за 10 рабочих дней до даты зачёта."
        Ответ:
        {
          "novation_setoff_presence_status": "defined",
          "novation_setoff_presence_display": "Предусмотрено в договоре",
          "termination_type": "set_off",
          "termination_type_display": "Зачёт встречных требований (ст. 410 ГК РФ)",
          "termination_conditions": "Письменное уведомление за 10 рабочих дней",
          "termination_conditions_display": "По уведомлению за 10 рабочих дней",
          "evidence": [
            {
              "clause_ref": "п. 9.1",
              "quote": "Стороны вправе произвести зачёт встречных однородных требований по настоящему договору в соответствии со ст. 410 ГК РФ."
            },
            {
              "clause_ref": "п. 9.2",
              "quote": "Зачёт производится по письменному уведомлению одной из сторон не менее чем за 10 рабочих дней до даты зачёта."
            }
          ]
        }

        Пример 2 — новация с сохранением обеспечения:
        Фрагмент:
        "10.1. По соглашению сторон обязательство по возврату займа может
        быть прекращено новацией в обязательство по договору поставки
        в соответствии со ст. 414 ГК РФ.
        10.2. При новации обеспечение по займу сохраняется при условии
        письменного согласия залогодателя/поручителя."
        Ответ:
        {
          "novation_setoff_presence_status": "defined",
          "novation_setoff_presence_display": "Предусмотрено в договоре",
          "termination_type": "novation",
          "termination_type_display": "Новация (замена обязательства по ст. 414 ГК РФ)",
          "termination_conditions": "Соглашение сторон + согласие залогодателя/поручителя на сохранение обеспечения",
          "termination_conditions_display": "По соглашению сторон (обеспечение сохраняется при согласии залогодателя)",
          "evidence": [
            {
              "clause_ref": "п. 10.1",
              "quote": "По соглашению сторон обязательство по возврату займа может быть прекращено новацией в обязательство по договору поставки в соответствии со ст. 414 ГК РФ."
            },
            {
              "clause_ref": "п. 10.2",
              "quote": "При новации обеспечение по займу сохраняется при условии письменного согласия залогодателя/поручителя."
            }
          ]
        }

        Пример 3 — новация/зачёт не предусмотрены:
        Фрагмент:
        "1.1. Займодавец передаёт Заёмщику денежные средства в размере
        10 000 000 рублей. Заёмщик обязуется возвратить сумму займа
        в срок."
        (нет упоминаний о новации, зачёте, прекращении обязательства)
        Ответ:
        {
          "novation_setoff_presence_status": "not_defined",
          "novation_setoff_presence_display": "Не предусмотрено (только стандартное погашение)",
          "termination_type": "not_defined",
          "termination_type_display": "Не применимо",
          "termination_conditions": "Не применимо",
          "termination_conditions_display": "Не применимо",
          "evidence": []
        }

        Пример 4 — текст есть, но надёжный вывод сделать нельзя
        (уклончивая формулировка без конкретного механизма):
        Фрагмент:
        "12.1. Стороны вправе прекратить обязательства по настоящему
        Договору иными способами, предусмотренными действующим
        законодательством Российской Федерации."
        (нет ни новации, ни зачёта; общая отсылка к ГК РФ
        без конкретного механизма)
        Ответ:
        {
          "novation_setoff_presence_status": "not_defined",
          "novation_setoff_presence_display": "Не предусмотрено (только стандартное погашение)",
          "termination_type": "not_defined",
          "termination_type_display": "Не применимо",
          "termination_conditions": "Не применимо",
          "termination_conditions_display": "Не применимо",
          "evidence": [
            {
              "clause_ref": "п. 12.1",
              "quote": "Стороны вправе прекратить обязательства по настоящему Договору иными способами, предусмотренными действующим законодательством Российской Федерации."
            }
          ]
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о новации или зачёте встречных требований.
        2. Определи тип прекращения (новация / зачёт / иное).
        3. Найди условия прекращения (уведомление, сроки, согласие сторон,
           сохранение обеспечения).
        4. Проверь дихотомию:
             новация/зачёт не предусмотрены -> все поля = "not_defined" /
               "Не применимо";
             новация предусмотрена -> termination_type = "novation";
             зачёт предусмотрен -> termination_type = "set_off";
             иной механизм -> termination_type = "other".
        5. Проверь, что все 7 ключей (6 полей + evidence) присутствуют
           в JSON.
        6. Если новация/зачёт не предусмотрены — верни «Не предусмотрено»
           для всех полей.
        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь РОВНО одним JSON-объектом без какого-либо дополнительного
        текста до или после, со всеми 7 ключами:
        {
          "novation_setoff_presence_status": "<defined / not_defined>",
          "novation_setoff_presence_display": "<Предусмотрено в договоре / Не предусмотрено (только стандартное погашение)>",
          "termination_type": "<novation / set_off / other / not_defined>",
          "termination_type_display": "<Новация (замена обязательства по ст. 414 ГК РФ) / Зачёт встречных требований (ст. 410 ГК РФ) / Иное прекращение (указать из текста) / Не применимо>",
          "termination_conditions": "<условия из договора или 'Не применимо'>",
          "termination_conditions_display": "<По соглашению сторон (обеспечение сохраняется при согласии залогодателя) / По соглашению сторон (обеспечение не сохраняется) / По уведомлению за N рабочих дней / Не описаны (риск спора о прекращении) / Не применимо>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 8
      temperature: 0.0
      max_tokens: 800
    retrieval:
      retrieval_profile: "termination_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "новация зачет зачёт прекращение обязательства замена обязательства встречные требования ст 410 414 ГК РФ соглашение сторон уведомление обеспечение сохранение обеспечения"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - procedures
        - obligations
      negative_keywords:
        - "проценты по займу"
        - "процентная ставка"
        - "неустойка за просрочку"
        - "обеспечение исполнения"
        - "аффилированность"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.40, 0.90]
        boost: 0.18
        scope: segment
      context_k: 8
      max_chunks: 10
      rerank: true
    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - procedures
        - obligations
      confidence_bonus_on_match: 0.12
      confidence_penalty_on_excluded_segment: 0.15
    evidence:
      required: true
      min_snippet_length: 35
      max_snippet_length: 600
    extraction:
      store_payload: true

      enabled: true
      mode: "hybrid"
      compact_output: false
      llm_max_tokens: 1200
      llm_prompt_extraction: |
        <role>
        Ты — российский юрист по договорной работе. Извлеки из текста
        договора займа условия новации или зачёта встречных требований
        для прекращения обязательства (ст. 410, 414 ГК РФ).
        Не анализируй проценты по ст. 809 ГК РФ или общую ответственность.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие 6 полей + evidence (всего 7 ключей).
        Верни все ключи, даже если данные отсутствуют.

        1.  novation_setoff_presence_status — "defined" (если есть
            условия новации/зачёта) или "not_defined".
        2.  novation_setoff_presence_display — user-facing строка:
              - "Предусмотрено в договоре" — если есть условия;
              - "Не предусмотрено (только стандартное погашение)" —
                если нет условий.
        3.  termination_type — "novation" / "set_off" / "other" /
            "not_defined":
              - "novation" — новация (замена обязательства,
                ст. 414 ГК РФ);
              - "set_off" — зачёт встречных требований (ст. 410 ГК РФ);
              - "other" — иное прекращение (указать из текста);
              - "not_defined" — не определено или не применимо.
        4.  termination_type_display — user-facing строка:
              - "Новация (замена обязательства по ст. 414 ГК РФ)";
              - "Зачёт встречных требований (ст. 410 ГК РФ)";
              - "Иное прекращение (указать из текста)";
              - "Не применимо".
        5.  termination_conditions — точные условия из договора
            или "Не применимо".
        6.  termination_conditions_display — user-facing краткая строка:
              - "По соглашению сторон (обеспечение сохраняется
                при согласии залогодателя)";
              - "По соглашению сторон (обеспечение не сохраняется)";
              - "По уведомлению за N рабочих дней";
              - "Не описаны (риск спора о прекращении)";
              - "Не применимо".

        Дополнительно — обязательный массив evidence:
        - цитаты с условиями новации/зачёта;
        - пустой массив [], если новация/зачёт не предусмотрены.

        Правила заполнения при отсутствии данных:
        - Если новация/зачёт не предусмотрены — все display-поля
          = «Не предусмотрено» / «Не применимо».
        </task>

        <rules>
        - Используй только текст договора. Не выдумывай условия
          новации/зачёта.
        - Не используй null, None или пустые строки — только явные
          fallback-значения ("not_defined" / "not_applicable" /
          "Не применимо" / "Не предусмотрено" / "Не описаны").
        - Распознавай ссылки на ст. 410, 414 ГК РФ как зачёт и новацию
          соответственно.
        - Если указано сохранение обеспечения при новации — укажи это
          в conditions («обеспечение сохраняется при согласии
          залогодателя»).
        - Если указано, что обеспечение НЕ сохраняется при новации
          (например, поручительство прекращается, залог требует
          перерегистрации) — укажи «обеспечение не сохраняется».
        - Для termination_type = "other" не привязывай к конкретным
          механизмам (отступное, прощение долга и т.п.) — тема прощения
          долга проверяется в отдельном check-е. Display остаётся
          «Иное прекращение (указать из текста)».
        - Верни РОВНО один JSON-объект со всеми 7 ключами
          без какого-либо дополнительного текста до или после.
          Начни ответ сразу с открывающей фигурной скобки и закончи
          закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ
          должен быть валидным JSON, пригодным для парсинга через
          json.loads без предварительной обработки.
        </rules>
      fields:
        - name: "novation_setoff_presence_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус наличия условий новации или зачёта (raw enum)."
          required: true
          display_in_grid: false
        - name: "novation_setoff_presence_display"
          type: "string"
          presentation: "fact"
          label: "Наличие новации/зачёта"
          description: "User-facing наличие условий новации или зачёта встречных требований."
          required: true
          display_in_grid: true
          display_priority: 1
        - name: "termination_type"
          type: "string"
          presentation: "signal"
          allowed_values: ["novation", "set_off", "other", "not_defined"]
          description: "Тип прекращения обязательства (raw enum)."
          required: true
          display_in_grid: false
        - name: "termination_type_display"
          type: "string"
          presentation: "fact"
          label: "Тип прекращения"
          description: "User-facing тип прекращения обязательства (новация / зачёт / иное)."
          required: true
          display_in_grid: true
          display_priority: 2
        - name: "termination_conditions"
          type: "string"
          presentation: "fact"
          label: "Условия прекращения (полное описание)"
          description: "Полное описание условий новации/зачёта из договора."
          required: true
          display_in_grid: false
        - name: "termination_conditions_display"
          type: "string"
          presentation: "fact"
          label: "Условия прекращения"
          description: "User-facing краткое описание условий новации/зачёта."
          required: true
          display_in_grid: true
          display_priority: 3

  - id: loan_forgiveness_terms
    name: "Прощение долга: условия и последствия (ст. 415, 575 ГК РФ)"
    description: >
      Фактографическая проверка условий прощения долга займодавцем:
      наличие условия о прощении, согласие займодавца, письменная форма.
      Фиксирует упоминание гражданско-правового риска переквалификации
      в дарение (ст. 575, 572 ГК РФ) и налоговых последствий у заёмщика
      (ст. 250 НК РФ). Критично для оценки риска переквалификации
      и налоговых доначислений.
    triggers:
      any: ["loan_forgiveness"]
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "прощение долга"
        - "освобождение от обязательства"
        - "отказ от требования"
        - "дарение"
        - "статья 415"
        - "статья 575"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)прощени[ея]\\s+долг"
        - "(?i)освобожден(ие|ия)\\s+от\\s+обязательств"
        - "(?i)отказ\\s+от\\s+требовани"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор займа на предмет условия о прощении долга
        (ст. 415, 575 ГК РФ).

        Нормативный ориентир:
        - ст. 415 ГК РФ — обязательство прекращается прощением долга
          кредитором, если это не нарушает прав других лиц;
        - ст. 575 ГК РФ — дарение в отношениях между коммерческими
          организациями запрещено (риск переквалификации прощения долга
          в дарение);
        - п. 3 ст. 572 ГК РФ — при наличии встречного предоставления
          договор не является дарением;
        - позиция ВС РФ (Обзор от 2017, Постановление Пленума № 25
          от 23.06.2015) — прощение долга НЕ переквалифицируется
          в дарение автоматически: если у прощения есть деловая цель
          или встречное предоставление, оно остаётся прощением долга;
        - ст. 250 НК РФ — прощение долга между коммерческими лицами
          образует внереализационный доход у заёмщика (налоговое
          последствие).

        Важно:
        - Твоя задача — установить фактические условия договора.
        - Различай:
            * гражданско-правовой риск (переквалификация в дарение);
            * налоговое последствие (внереализационный доход
              у заёмщика).
          Это разные правовые концепции, отражай их отдельно.
        - Не выдумывай условия прощения, если их нет в тексте.
        - Если прощение не предусмотрено — укажи это явно.

        [ЗАДАЧА]
        Найди в тексте договора (обычно раздел «Прекращение обязательства»):
        1. Наличие условия о прощении долга (есть / нет).
        2. Условия прощения (согласие займодавца, письменная форма).
        3. Упоминание правовых рисков: запрет дарения (ст. 575 ГК РФ)
           и/или налоговые последствия (ст. 250 НК РФ).

        [ПРАВИЛА]
        1. Используй только текст документа. Не выдумывай условия
           прощения.
        2. Если прощение не предусмотрено:
           - forgiveness_presence_status = "not_defined";
           - forgiveness_presence_display = "Не предусмотрено";
           - forgiveness_conditions = "Не применимо";
           - forgiveness_conditions_display = "Не применимо";
           - tax_consequences_mentioned = "no" (в договоре нет упоминаний);
           - tax_consequences_display = "Не применимо
             (прощение не предусмотрено)".
        3. Если прощение предусмотрено и есть упоминание запрета
           дарения — tax_consequences_mentioned = "yes",
           tax_consequences_display = "Упомянут запрет дарения
           (ст. 575 ГК РФ)".
        4. Если прощение предусмотрено и есть упоминание налоговых
           последствий — tax_consequences_mentioned = "yes",
           tax_consequences_display = "Упомянуты налоговые последствия
           (ст. 250 НК РФ)".
        5. Если упомянуты оба риска — tax_consequences_display =
           "Упомянуты и запрет дарения, и налоговые последствия".
        6. Если прощение предусмотрено, но правовые риски не упомянуты —
           tax_consequences_mentioned = "no",
           tax_consequences_display = "Не упомянуто".
        7. Запрещены значения: null, None, пустые строки — не используй
           их никогда. Допустимые fallback-значения: "not_defined",
           "no", "Не применимо", "Не предусмотрено".
        8. В evidence включай только дословные цитаты из текста договора.
        9. Верни РОВНО один JSON-объект со всеми 7 ключами без какого-либо
           дополнительного текста до или после. Начни ответ сразу
           с открывающей фигурной скобки и закончи закрывающей. НЕ пиши
           Markdown, списки, код-фенсы. Ответ должен быть валидным JSON,
           пригодным для парсинга через json.loads без предварительной
           обработки.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — прощение долга с условиями и упоминанием запрета дарения:
        Фрагмент:
        "10.1. Займодавец вправе простить долг Заёмщика полностью или
        частично по письменному соглашению сторон в соответствии
        со ст. 415 ГК РФ.
        10.2. Стороны подтверждают, что прощение долга не является
        дарением в смысле ст. 575 ГК РФ, так как имеется встречное
        предоставление."
        Ответ:
        {
          "forgiveness_presence_status": "defined",
          "forgiveness_presence_display": "Предусмотрено в договоре",
          "forgiveness_conditions": "Письменное соглашение сторон",
          "forgiveness_conditions_display": "По письменному соглашению сторон",
          "tax_consequences_mentioned": "yes",
          "tax_consequences_display": "Упомянут запрет дарения (ст. 575 ГК РФ)",
          "evidence": [
            {
              "clause_ref": "п. 10.1",
              "quote": "Займодавец вправе простить долг Заёмщика полностью или частично по письменному соглашению сторон в соответствии со ст. 415 ГК РФ."
            },
            {
              "clause_ref": "п. 10.2",
              "quote": "Стороны подтверждают, что прощение долга не является дарением в смысле ст. 575 ГК РФ, так как имеется встречное предоставление."
            }
          ]
        }

        Пример 2 — прощение не предусмотрено:
        Фрагмент:
        "1.1. Займодавец передаёт Заёмщику денежные средства в размере
        10 000 000 рублей. Заёмщик обязуется возвратить сумму займа
        в срок."
        (нет упоминаний о прощении долга)
        Ответ:
        {
          "forgiveness_presence_status": "not_defined",
          "forgiveness_presence_display": "Не предусмотрено",
          "forgiveness_conditions": "Не применимо",
          "forgiveness_conditions_display": "Не применимо",
          "tax_consequences_mentioned": "no",
          "tax_consequences_display": "Не применимо (прощение не предусмотрено)",
          "evidence": []
        }

        Пример 3 — текст есть, но надёжный вывод сделать нельзя
        (уклончивая формулировка без конкретных условий):
        Фрагмент:
        "9.4. Стороны вправе прекратить обязательства по настоящему
        Договору по основаниям, предусмотренным действующим
        законодательством Российской Федерации."
        (нет прямого упоминания прощения долга; общая отсылка
        к ГК РФ)
        Ответ:
        {
          "forgiveness_presence_status": "not_defined",
          "forgiveness_presence_display": "Не предусмотрено",
          "forgiveness_conditions": "Не применимо",
          "forgiveness_conditions_display": "Не применимо",
          "tax_consequences_mentioned": "no",
          "tax_consequences_display": "Не применимо (прощение не предусмотрено)",
          "evidence": [
            {
              "clause_ref": "п. 9.4",
              "quote": "Стороны вправе прекратить обязательства по настоящему Договору по основаниям, предусмотренным действующим законодательством Российской Федерации."
            }
          ]
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о прощении долга.
        2. Найди условия прощения (согласие, форма).
        3. Найди упоминание запрета дарения (ст. 575 ГК РФ) и/или
           налоговых последствий (ст. 250 НК РФ).
        4. Проверь дихотомию:
             прощение не предусмотрено -> tax_consequences_mentioned = "no",
               display = "Не применимо (прощение не предусмотрено)";
             прощение предусмотрено, риски упомянуты ->
               tax_consequences_mentioned = "yes";
             прощение предусмотрено, риски не упомянуты ->
               tax_consequences_mentioned = "no",
               display = "Не упомянуто".
        5. Проверь, что все 7 ключей (6 полей + evidence) присутствуют
           в JSON.
        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь РОВНО одним JSON-объектом без какого-либо дополнительного
        текста до или после, со всеми 7 ключами:
        {
          "forgiveness_presence_status": "<defined / not_defined>",
          "forgiveness_presence_display": "<Предусмотрено в договоре / Не предусмотрено>",
          "forgiveness_conditions": "<условия из договора или 'Не применимо'>",
          "forgiveness_conditions_display": "<По письменному соглашению сторон / По одностороннему решению займодавца / Не описаны (риск спора) / Не применимо>",
          "tax_consequences_mentioned": "<yes / no / not_defined>",
          "tax_consequences_display": "<Упомянут запрет дарения (ст. 575 ГК РФ) / Упомянуты налоговые последствия (ст. 250 НК РФ) / Упомянуты и запрет дарения, и налоговые последствия / Не упомянуто / Не применимо (прощение не предусмотрено)>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 8
      temperature: 0.0
      max_tokens: 800
    retrieval:
      retrieval_profile: "termination_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "прощение долга освобождение от обязательства отказ от требования дарение ст 415 575 ГК РФ налоговые последствия внереализационный доход ст 250 НК РФ встречное предоставление деловая цель"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - procedures
        - obligations
      negative_keywords:
        - "проценты по займу"
        - "процентная ставка"
        - "неустойка за просрочку"
        - "обеспечение"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.40, 0.90]
        boost: 0.18
        scope: segment
      context_k: 8
      max_chunks: 10
      rerank: true
    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - procedures
        - obligations
      confidence_bonus_on_match: 0.12
      confidence_penalty_on_excluded_segment: 0.15
    evidence:
      required: true
      min_snippet_length: 35
      max_snippet_length: 600
    extraction:
      store_payload: true

      enabled: true
      mode: "hybrid"
      compact_output: false
      llm_max_tokens: 1200
      llm_prompt_extraction: |
        <role>
        Ты — российский юрист по договорной работе. Извлеки из текста
        договора займа условия прощения долга (ст. 415, 575, 572 ГК РФ):
        наличие, условия, упоминание правовых рисков (запрет дарения
        и/или налоговые последствия).
        Не анализируй проценты по ст. 809 ГК РФ или общую ответственность.
        Различай гражданско-правовой риск (переквалификация в дарение)
        и налоговое последствие (внереализационный доход по ст. 250 НК РФ).
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие 6 полей + evidence (всего 7 ключей).
        Верни все ключи, даже если данные отсутствуют.

        1.  forgiveness_presence_status — "defined" (если есть условие
            о прощении) или "not_defined".
        2.  forgiveness_presence_display — user-facing строка:
              - "Предусмотрено в договоре" — если есть условие;
              - "Не предусмотрено" — если нет условия.
        3.  forgiveness_conditions — точные условия из договора
            или "Не применимо".
        4.  forgiveness_conditions_display — user-facing краткая строка:
              - "По письменному соглашению сторон";
              - "По одностороннему решению займодавца";
              - "Не описаны (риск спора)";
              - "Не применимо".
        5.  tax_consequences_mentioned — "yes" / "no" / "not_defined":
              - "yes" — упомянут запрет дарения (ст. 575 ГК РФ)
                и/или налоговые последствия (ст. 250 НК РФ);
              - "no" — тема правовых рисков не упомянута;
              - "not_defined" — контекст не позволяет определить.
        6.  tax_consequences_display — user-facing строка:
              - "Упомянут запрет дарения (ст. 575 ГК РФ)";
              - "Упомянуты налоговые последствия (ст. 250 НК РФ)";
              - "Упомянуты и запрет дарения, и налоговые последствия";
              - "Не упомянуто";
              - "Не применимо (прощение не предусмотрено)".

        Дополнительно — обязательный массив evidence:
        - цитаты с условиями о прощении долга и упоминаниями рисков;
        - пустой массив [], если прощение не предусмотрено.

        Правила заполнения при отсутствии данных:
        - Если прощение не предусмотрено:
            forgiveness_presence_status = "not_defined";
            forgiveness_presence_display = "Не предусмотрено";
            forgiveness_conditions = "Не применимо";
            forgiveness_conditions_display = "Не применимо";
            tax_consequences_mentioned = "no";
            tax_consequences_display = "Не применимо
              (прощение не предусмотрено)".
        - Если прощение предусмотрено, но правовые риски не упомянуты:
            tax_consequences_mentioned = "no";
            tax_consequences_display = "Не упомянуто".
        </task>

        <rules>
        - Используй только текст договора. Не выдумывай условия прощения.
        - Не используй null, None или пустые строки — только явные
          fallback-значения ("not_defined" / "no" / "Не применимо" /
          "Не предусмотрено" / "Не упомянуто").
        - Распознавай ссылки на ст. 415, 575, 572 ГК РФ как прощение
          долга, запрет дарения, дарение соответственно.
        - Различай два правовых аспекта:
            * гражданско-правовой риск — переквалификация в дарение
              (ст. 575, 572 ГК РФ);
            * налоговое последствие — внереализационный доход
              у заёмщика (ст. 250 НК РФ).
        - Прощение долга НЕ переквалифицируется в дарение автоматически
          (позиция ВС РФ): при наличии встречного предоставления или
          деловой цели оно остаётся прощением долга.
        - Если прощение не предусмотрено — tax_consequences_mentioned
          = "no" (не "not_defined"), display = "Не применимо
          (прощение не предусмотрено)".
        - Верни РОВНО один JSON-объект со всеми 7 ключами
          без какого-либо дополнительного текста до или после.
          Начни ответ сразу с открывающей фигурной скобки и закончи
          закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ
          должен быть валидным JSON, пригодным для парсинга через
          json.loads без предварительной обработки.
        </rules>
      fields:
        - name: "forgiveness_presence_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус наличия условия о прощении долга (raw enum)."
          required: true
          display_in_grid: false
        - name: "forgiveness_presence_display"
          type: "string"
          presentation: "fact"
          label: "Прощение долга"
          description: "User-facing наличие условия о прощении долга."
          required: true
          display_in_grid: true
          display_priority: 1
        - name: "forgiveness_conditions"
          type: "string"
          presentation: "fact"
          label: "Условия прощения (полное описание)"
          description: "Полное описание условий прощения долга."
          required: true
          display_in_grid: false
        - name: "forgiveness_conditions_display"
          type: "string"
          presentation: "fact"
          label: "Условия прощения"
          description: "User-facing краткое описание условий прощения долга."
          required: true
          display_in_grid: true
          display_priority: 2
        - name: "tax_consequences_mentioned"
          type: "string"
          presentation: "signal"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Упоминание правовых рисков (запрет дарения / налоговые последствия) — raw enum."
          required: true
          display_in_grid: false
        - name: "tax_consequences_display"
          type: "string"
          presentation: "fact"
          label: "Правовые риски (дарение / налоги)"
          description: "User-facing упоминание гражданско-правовых и налоговых рисков прощения долга."
          required: true
          display_in_grid: true
          display_priority: 3

  - id: fungible_goods_specification
    name: "Заём вещей: спецификация качества и количества (ст. 807 ГК РФ)"
    description: >
      Фактографическая проверка определённости предмета вещевых займов:
      описание вещей, определённых родовыми признаками, качество (ГОСТ, ТУ),
      количество, обязательство вернуть вещи того же рода и качества.
      Критично для избежания споров о возврате вещей.
    triggers:
      any: ["fungible_goods_loan"]
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "вещи, определенные родовыми признаками"
        - "качество"
        - "ГОСТ"
        - "ТУ"
        - "спецификация"
        - "того же рода и качества"
        - "количество вещей"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)того\\s+же\\s+рода\\s+и\\s+качества"
        - "(?i)ГОСТ|ТУ|техническ[ий|ого]\\s+услов"
        - "(?i)спецификаци"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется заём вещей, определённых родовыми признаками
        (ст. 807 ГК РФ).

        Нормативный ориентир:
        - ст. 807 ГК РФ — по договору займа одни вещи (деньги или вещи,
          определённые родовыми признаками) передаются в собственность,
          заёмщик обязуется вернуть такую же сумму или равное количество
          вещей того же рода и качества. Обязательство возврата вещей
          того же рода и качества следует из закона, даже если прямо
          в договоре не указано (диспозитивная норма);
        - ст. 469 ГК РФ — качество товара: определяется договором,
          при отсутствии — по обычным требованиям (применяется к вещам
          по аналогии через ст. 421 ГК РФ);
        - ст. 421 ГК РФ — свобода договора: спецификация вещей
          определяется соглашением Сторон.
        - Практика: для вещевых займов критична спецификация (описание,
          ГОСТ, ТУ, количество), иначе споры о возврате.

        Важно:
        - Твоя задача — установить фактические условия договора.
        - Не выдумывай спецификацию, если её нет в тексте.
        - Если заём денежный (не вещевой) — верни «Не применимо».

        [ЗАДАЧА]
        Найди в тексте договора (обычно раздел «Предмет» или «Спецификация»):
        1. Описание вещей (родовые признаки, наименование).
        2. Качество (ГОСТ, ТУ, образец).
        3. Количество (штуки, вес, объём).
        4. Обязательство вернуть вещи того же рода и качества.

        [ПРАВИЛА]
        1. Используй только текст документа. Не выдумывай спецификацию.
        2. Если заём денежный (не вещевой):
           - goods_spec_presence_status = "not_applicable";
           - goods_spec_presence_display = "Не применимо (заём денежный)";
           - goods_description = "Не применимо";
           - goods_description_display = "Не применимо";
           - same_kind_quality_clause = "not_applicable";
           - same_kind_quality_display = "Не применимо".
        3. Если спецификация не описана — goods_description_display
           = «Не описано (риск спора о возврате)».
        4. Если обязательство вернуть вещи того же рода и качества
           в договоре прямо не указано — same_kind_quality_clause
           = "not_defined" (применяется диспозитивная норма ст. 807 ГК РФ).
        5. Запрещены значения: null, None, пустые строки — не используй
           их никогда. Допустимые fallback-значения: "not_defined",
           "not_applicable", "Не установлено", "Не применимо",
           "Не описано".
        6. В evidence включай только дословные цитаты из текста договора.
        7. Верни РОВНО один JSON-объект со всеми 7 ключами без какого-либо
           дополнительного текста до или после. Начни ответ сразу
           с открывающей фигурной скобки и закончи закрывающей. НЕ пиши
           Markdown, списки, код-фенсы. Ответ должен быть валидным JSON,
           пригодным для парсинга через json.loads без предварительной
           обработки.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — вещевой заём с полной спецификацией:
        Фрагмент:
        "1.1. Займодавец передаёт Заёмщику 500 (Пятьсот) мешков пшеницы
        сорта «Московская 39», масса каждого мешка — 50 кг.
        1.2. Качество пшеницы должно соответствовать ГОСТ Р 52554-2006.
        1.3. Заёмщик обязуется возвратить равное количество вещей
        того же рода и качества."
        Ответ:
        {
          "goods_spec_presence_status": "defined",
          "goods_spec_presence_display": "Спецификация предусмотрена",
          "goods_description": "500 мешков пшеницы сорта «Московская 39», масса 50 кг каждый, ГОСТ Р 52554-2006",
          "goods_description_display": "Пшеница (500 мешков по 50 кг, сорт «Московская 39», ГОСТ Р 52554-2006)",
          "same_kind_quality_clause": "yes",
          "same_kind_quality_display": "Обязательство вернуть вещи того же рода и качества",
          "evidence": [
            {
              "clause_ref": "п. 1.1",
              "quote": "Займодавец передаёт Заёмщику 500 (Пятьсот) мешков пшеницы сорта «Московская 39», масса каждого мешка — 50 кг."
            },
            {
              "clause_ref": "п. 1.2",
              "quote": "Качество пшеницы должно соответствовать ГОСТ Р 52554-2006."
            },
            {
              "clause_ref": "п. 1.3",
              "quote": "Заёмщик обязуется возвратить равное количество вещей того же рода и качества."
            }
          ]
        }

        Пример 2 — вещевой заём без спецификации (риск спора):
        Фрагмент:
        "1.1. Займодавец передаёт Заёмщику вещи, определённые родовыми
        признаками. Заёмщик обязуется возвратить вещи того же рода
        и качества."
        (нет описания вещей, количества, качества)
        Ответ:
        {
          "goods_spec_presence_status": "defined",
          "goods_spec_presence_display": "Спецификация предусмотрена",
          "goods_description": "Вещи, определённые родовыми признаками (без конкретизации)",
          "goods_description_display": "Не описано (риск спора о возврате)",
          "same_kind_quality_clause": "yes",
          "same_kind_quality_display": "Обязательство вернуть вещи того же рода и качества",
          "evidence": [
            {
              "clause_ref": "п. 1.1",
              "quote": "Займодавец передаёт Заёмщику вещи, определённые родовыми признаками. Заёмщик обязуется возвратить вещи того же рода и качества."
            }
          ]
        }

        Пример 3 — заём денежный (не вещевой):
        Фрагмент:
        "1.1. Займодавец передаёт Заёмщику денежные средства в размере
        10 000 000 рублей."
        (нет упоминаний о вещах, родовых признаках)
        Ответ:
        {
          "goods_spec_presence_status": "not_applicable",
          "goods_spec_presence_display": "Не применимо (заём денежный)",
          "goods_description": "Не применимо",
          "goods_description_display": "Не применимо",
          "same_kind_quality_clause": "not_applicable",
          "same_kind_quality_display": "Не применимо",
          "evidence": []
        }

        Пример 4 — текст есть, но надёжный вывод сделать нельзя
        (уклончивая формулировка без спецификации в тексте):
        Фрагмент:
        "1.2. Наименование, количество и качество передаваемых вещей
        определяются Сторонами в акте приёма-передачи, подписываемом
        при передаче."
        (в самом договоре спецификация отсутствует — она отнесена
        к отдельному акту)
        Ответ:
        {
          "goods_spec_presence_status": "defined",
          "goods_spec_presence_display": "Спецификация предусмотрена",
          "goods_description": "Определяется актом приёма-передачи при передаче вещей",
          "goods_description_display": "Определяется актом приёма-передачи (риск неопределённости при споре)",
          "same_kind_quality_clause": "not_defined",
          "same_kind_quality_display": "Не указано (применяется ст. 807 ГК РФ — возврат вещей того же рода и качества)",
          "evidence": [
            {
              "clause_ref": "п. 1.2",
              "quote": "Наименование, количество и качество передаваемых вещей определяются Сторонами в акте приёма-передачи, подписываемом при передаче."
            }
          ]
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Определи тип займа (вещевой / денежный).
        2. Найди описание вещей (наименование, количество, качество).
        3. Найди упоминание ГОСТ/ТУ/спецификации.
        4. Найди обязательство вернуть вещи того же рода и качества:
           - "yes" — прямо указано в договоре;
           - "not_defined" — не указано, но применяется ст. 807 ГК РФ;
           - "not_applicable" — заём денежный.
        5. Проверь, что все 7 ключей (6 полей + evidence) присутствуют
           в JSON.
        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь РОВНО одним JSON-объектом без какого-либо дополнительного
        текста до или после, со всеми 7 ключами:
        {
          "goods_spec_presence_status": "<defined / not_defined / not_applicable>",
          "goods_spec_presence_display": "<Спецификация предусмотрена / Не предусмотрена (риск спора) / Не применимо (заём денежный)>",
          "goods_description": "<описание вещей или 'Не применимо'>",
          "goods_description_display": "<краткое описание или 'Не описано (риск спора о возврате)' / 'Не применимо'>",
          "same_kind_quality_clause": "<yes / not_defined / not_applicable>",
          "same_kind_quality_display": "<Обязательство вернуть вещи того же рода и качества / Не указано (применяется ст. 807 ГК РФ — возврат вещей того же рода и качества) / Не применимо>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 8
      temperature: 0.0
      max_tokens: 800
    retrieval:
      retrieval_profile: "scope_of_work_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "вещи определенные родовыми признаками качество ГОСТ ТУ спецификация того же рода и качества количество вещей описание предмет займа"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - definitions
        - obligations
      negative_keywords:
        - "проценты по займу"
        - "процентная ставка"
        - "неустойка за просрочку"
        - "обеспечение"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.05, 0.50]
        boost: 0.18
        scope: segment
      context_k: 8
      max_chunks: 10
      rerank: true
    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - "definitions"
        - "obligations"
      confidence_bonus_on_match: 0.12
      confidence_penalty_on_excluded_segment: 0.15
    evidence:
      required: true
      min_snippet_length: 35
      max_snippet_length: 600
    extraction:
      store_payload: true

      enabled: true
      mode: "hybrid"
      compact_output: false
      llm_max_tokens: 1200
      llm_prompt_extraction: |
        <role>
        Ты — российский юрист по договорной работе. Извлеки из текста
        вещевых займов спецификацию вещей: описание, качество (ГОСТ/ТУ),
        количество, обязательство вернуть того же рода и качества
        (ст. 807, 469, 421 ГК РФ).
        Не анализируй проценты по ст. 809 ГК РФ или общую ответственность.
        Учитывай: обязательство возврата вещей того же рода и качества
        следует из ст. 807 ГК РФ (диспозитивная норма), даже если прямо
        в договоре не указано.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие 6 полей + evidence (всего 7 ключей).
        Верни все ключи, даже если данные отсутствуют.

        1.  goods_spec_presence_status — "defined" (если есть
            спецификация вещей или отсылка к акту передачи) /
            "not_defined" (вещевой заём без спецификации) /
            "not_applicable" (денежный заём).
        2.  goods_spec_presence_display — user-facing строка:
              - "Спецификация предусмотрена";
              - "Не предусмотрена (риск спора)";
              - "Не применимо (заём денежный)".
        3.  goods_description — точное описание вещей из договора
            или "Не применимо".
        4.  goods_description_display — user-facing краткое описание:
              - "Пшеница (500 мешков по 50 кг, сорт «Московская 39», ГОСТ)";
              - "Не описано (риск спора о возврате)";
              - "Не применимо".
        5.  same_kind_quality_clause — "yes" / "not_defined" /
            "not_applicable":
              - "yes" — прямо указано обязательство вернуть вещи
                того же рода и качества;
              - "not_defined" — не указано прямо, применяется
                диспозитивная норма ст. 807 ГК РФ;
              - "not_applicable" — заём денежный.
        6.  same_kind_quality_display — user-facing строка:
              - "Обязательство вернуть вещи того же рода и качества";
              - "Не указано (применяется ст. 807 ГК РФ — возврат вещей
                того же рода и качества)";
              - "Не применимо".

        Дополнительно — обязательный массив evidence:
        - цитаты со спецификацией вещей;
        - пустой массив [], если заём денежный.

        Правила заполнения при отсутствии данных:
        - Если заём денежный — все display-поля = «Не применимо».
        - Если спецификация отнесена к акту приёма-передачи —
          goods_spec_presence_status = "defined", но goods_description
          отражает отсылку к акту.
        </task>

        <rules>
        - Используй только текст договора. Не выдумывай спецификацию.
        - Не используй null, None или пустые строки — только явные
          fallback-значения ("not_defined" / "not_applicable" /
          "Не установлено" / "Не применимо" / "Не описано").
        - Распознавай ссылки на «того же рода и качества» как обязательство
          возврата.
        - Обязательство возврата вещей того же рода и качества следует
          из ст. 807 ГК РФ (диспозитивная норма), даже если прямо
          в договоре не указано. В этом случае:
            same_kind_quality_clause = "not_defined";
            same_kind_quality_display = "Не указано (применяется ст. 807 ГК РФ
              — возврат вещей того же рода и качества)".
        - Значение "no" не используется: обязательство возврата
          не может отсутствовать в вещевом займе.
        - Верни РОВНО один JSON-объект со всеми 7 ключами
          без какого-либо дополнительного текста до или после.
          Начни ответ сразу с открывающей фигурной скобки и закончи
          закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ
          должен быть валидным JSON, пригодным для парсинга через
          json.loads без предварительной обработки.
        </rules>
      fields:
        - name: "goods_spec_presence_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined", "not_applicable"]
          description: "Статус наличия спецификации вещей (raw enum)."
          required: true
          display_in_grid: false
        - name: "goods_spec_presence_display"
          type: "string"
          presentation: "fact"
          label: "Спецификация вещей"
          description: "User-facing наличие спецификации вещевых займов."
          required: true
          display_in_grid: true
          display_priority: 1
        - name: "goods_description"
          type: "string"
          presentation: "fact"
          label: "Описание вещей (полное)"
          description: "Полное описание вещей из договора."
          required: true
          display_in_grid: false
        - name: "goods_description_display"
          type: "string"
          presentation: "fact"
          label: "Описание вещей"
          description: "User-facing краткое описание вещей (наименование, количество, качество)."
          required: true
          display_in_grid: true
          display_priority: 2
        - name: "same_kind_quality_clause"
          type: "string"
          presentation: "signal"
          allowed_values: ["yes", "not_defined", "not_applicable"]
          description: "Наличие обязательства вернуть вещи того же рода и качества (raw enum)."
          required: true
          display_in_grid: false
        - name: "same_kind_quality_display"
          type: "string"
          presentation: "fact"
          label: "Возврат вещей того же рода и качества"
          description: "User-facing наличие обязательства вернуть вещи того же рода и качества."
          required: true
          display_in_grid: true
          display_priority: 3

  - id: on_demand_notice_period
    name: "Заём до востребования: срок возврата после требования (ст. 810 ГК РФ)"
    description: >
      Фактографическая проверка срока для возврата займа после предъявления
      требования займодавцем. По ст. 810(1) ГК РФ по умолчанию — 30 дней,
      но договор может установить иной срок. Критично для оценки ликвидности.
    triggers:
      any: ["on_demand_loan"]
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "по требованию"
        - "до востребования"
        - "в течение 30 дней"
        - "после предъявления требования"
        - "срок уведомления"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)в\\s+течение\\s+\\d+\\s+дн"
        - "(?i)после\\s+предъявлен"
        - "(?i)по\\s+требова"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется заём до востребования (ст. 810 ГК РФ).

        Нормативный ориентир:
        - ст. 810(1) ГК РФ — если срок возврата не установлен договором,
          сумма займа должна быть возвращена в течение 30 дней со дня
          предъявления требования займодавцем;
        - договор может установить иной срок (больше или меньше 30 дней);
        - практика: для займов до востребования критичен срок уведомления,
          так как влияет на ликвидность заёмщика.

        Важно:
        - Твоя задача — установить фактические условия договора.
        - Если заём не до востребования — верни «Не применимо».
        - Если срок не указан — применяется 30 дней по закону.

        [ЗАДАЧА]
        Найди в тексте договора (обычно раздел «Срок возврата»):
        1. Наличие условия о займе до востребования.
        2. Срок возврата после требования (30 дней / иной срок).
        3. Форма требования (письменное / устное).

        [ПРАВИЛА]
        1. Используй только текст документа. Не выдумывай сроки.
        2. Если заём не до востребования:
           - on_demand_status = "not_defined";
           - on_demand_display = "Не применимо (заём с фиксированным сроком)";
           - notice_period = "Не применимо";
           - notice_period_display = "Не применимо";
           - demand_form = "not_applicable";
           - demand_form_display = "Не применимо".
        3. Если заём до востребования, но срок не указан —
           notice_period = "30 дней (по закону)";
           notice_period_display = "30 дней (по умолчанию, ст. 810(1) ГК РФ)".
        4. Если форма требования не указана —
           demand_form = "not_defined";
           demand_form_display = "Не указана (применяется письменная форма
           по практике)".
        5. Запрещены значения: null, None, пустые строки — не используй
           их никогда. Допустимые fallback-значения: "not_defined",
           "not_applicable", "Не применимо", "Не указана".
        6. В evidence включай только дословные цитаты из текста договора.
        7. Верни РОВНО один JSON-объект со всеми 7 ключами без какого-либо
           дополнительного текста до или после. Начни ответ сразу
           с открывающей фигурной скобки и закончи закрывающей. НЕ пиши
           Markdown, списки, код-фенсы. Ответ должен быть валидным JSON,
           пригодным для парсинга через json.loads без предварительной
           обработки.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — заём до востребования с указанием срока:
        Фрагмент:
        "3.1. Заём подлежит возврату по требованию Займодавца.
        3.2. Возврат займа должен быть осуществлён в течение
        15 рабочих дней со дня получения письменного требования."
        Ответ:
        {
          "on_demand_status": "defined",
          "on_demand_display": "Заём до востребования",
          "notice_period": "15 рабочих дней",
          "notice_period_display": "15 рабочих дней со дня получения требования",
          "demand_form": "written",
          "demand_form_display": "Письменное требование",
          "evidence": [
            {
              "clause_ref": "п. 3.1",
              "quote": "Заём подлежит возврату по требованию Займодавца."
            },
            {
              "clause_ref": "п. 3.2",
              "quote": "Возврат займа должен быть осуществлён в течение 15 рабочих дней со дня получения письменного требования."
            }
          ]
        }

        Пример 2 — заём до востребования без указания срока
        (применяется 30 дней):
        Фрагмент:
        "3.1. Заём подлежит возврату по первому требованию Займодавца."
        (нет указания конкретного срока)
        Ответ:
        {
          "on_demand_status": "defined",
          "on_demand_display": "Заём до востребования",
          "notice_period": "30 дней (по закону)",
          "notice_period_display": "30 дней (по умолчанию, ст. 810(1) ГК РФ)",
          "demand_form": "not_defined",
          "demand_form_display": "Не указана (применяется письменная форма по практике)",
          "evidence": [
            {
              "clause_ref": "п. 3.1",
              "quote": "Заём подлежит возврату по первому требованию Займодавца."
            }
          ]
        }

        Пример 3 — заём не до востребования (срок установлен):
        Фрагмент:
        "3.1. Заём подлежит возврату не позднее 31 декабря 2026 года."
        (нет упоминаний о требовании, до востребования)
        Ответ:
        {
          "on_demand_status": "not_defined",
          "on_demand_display": "Не применимо (заём с фиксированным сроком)",
          "notice_period": "Не применимо",
          "notice_period_display": "Не применимо",
          "demand_form": "not_applicable",
          "demand_form_display": "Не применимо",
          "evidence": []
        }

        Пример 4 — текст есть, но надёжный вывод сделать нельзя
        (уклончивая формулировка про допсоглашение):
        Фрагмент:
        "3.1. Возврат займа осуществляется в порядке и сроки,
        определяемые дополнительным соглашением Сторон."
        (нет ни прямого указания «до востребования», ни фиксированного срока)
        Ответ:
        {
          "on_demand_status": "not_defined",
          "on_demand_display": "Не применимо (заём с фиксированным сроком)",
          "notice_period": "Не применимо",
          "notice_period_display": "Не применимо",
          "demand_form": "not_applicable",
          "demand_form_display": "Не применимо",
          "evidence": [
            {
              "clause_ref": "п. 3.1",
              "quote": "Возврат займа осуществляется в порядке и сроки, определяемые дополнительным соглашением Сторон."
            }
          ]
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о займе до востребования.
        2. Найди срок возврата после требования.
        3. Найди форму требования (письменное / устное).
        4. Проверь дихотомию:
             заём до востребования + срок указан -> конкретный срок;
             заём до востребования + срок не указан -> 30 дней
               (ст. 810(1) ГК РФ);
             заём с фиксированным сроком -> все поля = "not_defined" /
               "Не применимо".
        5. Проверь, что все 7 ключей (6 полей + evidence) присутствуют
           в JSON.
        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь РОВНО одним JSON-объектом без какого-либо дополнительного
        текста до или после, со всеми 7 ключами:
        {
          "on_demand_status": "<defined / not_defined>",
          "on_demand_display": "<Заём до востребования / Не применимо (заём с фиксированным сроком)>",
          "notice_period": "<срок из договора / '30 дней (по закону)' / 'Не применимо'>",
          "notice_period_display": "<15 рабочих дней со дня получения требования / 30 дней (по умолчанию, ст. 810(1) ГК РФ) / Не указан (риск спора) / Не применимо>",
          "demand_form": "<written / oral / not_defined / not_applicable>",
          "demand_form_display": "<Письменное требование / Устное требование / Не указана (применяется письменная форма по практике) / Не применимо>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 8
      temperature: 0.0
      max_tokens: 800
    retrieval:
      retrieval_profile: "repayment_schedule_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "по требованию до востребования в течение 30 дней после предъявления требования срок уведомления письменное требование дополнительное соглашение"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - procedures
      negative_keywords:
        - "проценты по займу"
        - "процентная ставка"
        - "неустойка за просрочку"
        - "обеспечение"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.15, 0.60]
        boost: 0.18
        scope: segment
      context_k: 8
      max_chunks: 10
      rerank: true
    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "price_list"
        - "technical_specification"
      preferred_clause_functions:
        - obligations
        - procedures
      confidence_bonus_on_match: 0.12
      confidence_penalty_on_excluded_segment: 0.15
    evidence:
      required: true
      min_snippet_length: 35
      max_snippet_length: 600
    extraction:
      store_payload: true

      enabled: true
      mode: "hybrid"
      compact_output: false
      llm_max_tokens: 1200
      llm_prompt_extraction: |
        <role>
        Ты — российский юрист по договорной работе. Извлеки из текста
        займа условия возврата до востребования: срок после требования,
        форма требования (ст. 810 ГК РФ).
        Не анализируй проценты по ст. 809 ГК РФ или общую ответственность.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие 6 полей + evidence (всего 7 ключей).
        Верни все ключи, даже если данные отсутствуют.

        1.  on_demand_status — "defined" (если заём до востребования)
            или "not_defined".
        2.  on_demand_display — user-facing строка:
              - "Заём до востребования";
              - "Не применимо (заём с фиксированным сроком)".
        3.  notice_period — срок из договора / "30 дней (по закону)" /
            "Не применимо".
        4.  notice_period_display — user-facing краткий срок:
              - "15 рабочих дней со дня получения требования";
              - "30 дней (по умолчанию, ст. 810(1) ГК РФ)";
              - "Не указан (риск спора)";
              - "Не применимо".
        5.  demand_form — "written" / "oral" / "not_defined" /
            "not_applicable":
              - "written" — письменное требование;
              - "oral" — устное требование;
              - "not_defined" — не указано;
              - "not_applicable" — заём не до востребования.
        6.  demand_form_display — user-facing строка:
              - "Письменное требование";
              - "Устное требование";
              - "Не указана (применяется письменная форма по практике)";
              - "Не применимо".

        Дополнительно — обязательный массив evidence:
        - цитаты с условиями о займе до востребования;
        - пустой массив [], если заём не до востребования.

        Правила заполнения при отсутствии данных:
        - Если заём не до востребования — все display-поля
          = «Не применимо».
        - Если срок не указан — применяется 30 дней
          по ст. 810(1) ГК РФ.
        </task>

        <rules>
        - Используй только текст договора. Не выдумывай сроки.
        - Не используй null, None или пустые строки — только явные
          fallback-значения ("not_defined" / "not_applicable" /
          "Не применимо" / "Не указана").
        - Если в тексте есть указание «до востребования» / «по требованию»
          / «по первому требованию» — on_demand_status = "defined",
          даже если конкретный срок не указан (применяется 30 дней
          по ст. 810(1) ГК РФ).
        - Если указан фиксированный срок возврата — on_demand_status
          = "not_defined", все остальные поля = "not_applicable" /
          "Не применимо".
        - Если в тексте ни «до востребования», ни фиксированного срока
          (уклончивая формулировка через допсоглашение) —
          on_demand_status = "not_defined".
        - Верни РОВНО один JSON-объект со всеми 7 ключами
          без какого-либо дополнительного текста до или после.
          Начни ответ сразу с открывающей фигурной скобки и закончи
          закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ
          должен быть валидным JSON, пригодным для парсинга через
          json.loads без предварительной обработки.
        </rules>
      fields:
        - name: "on_demand_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус займа до востребования (raw enum)."
          required: true
          display_in_grid: false
        - name: "on_demand_display"
          type: "string"
          presentation: "fact"
          label: "Заём до востребования"
          description: "User-facing статус займа до востребования."
          required: true
          display_in_grid: true
          display_priority: 1
        - name: "notice_period"
          type: "string"
          presentation: "fact"
          label: "Срок уведомления (полный)"
          description: "Полный срок возврата после требования."
          required: true
          display_in_grid: false
        - name: "notice_period_display"
          type: "string"
          presentation: "fact"
          label: "Срок возврата после требования"
          description: "User-facing срок возврата после предъявления требования."
          required: true
          display_in_grid: true
          display_priority: 2
        - name: "demand_form"
          type: "string"
          presentation: "signal"
          allowed_values: ["written", "oral", "not_defined", "not_applicable"]
          description: "Форма требования (raw enum)."
          required: true
          display_in_grid: false
        - name: "demand_form_display"
          type: "string"
          presentation: "fact"
          label: "Форма требования"
          description: "User-facing форма требования займодавца (письменное/устное)."
          required: true
          display_in_grid: true
          display_priority: 3

  - id: loan_amendment_and_termination_check
    name: "Изменение и расторжение договора займа: реструктуризация, односторонний отказ (ст. 450–453, 811 ГК РФ)"
    description: >
      Фактографическая проверка порядка изменения и расторжения договора займа:
      изменение по соглашению сторон, односторонний отказ (ст. 310, 811 ГК РФ),
      основания расторжения (соглашение, суд, требование одной стороны),
      реструктуризация задолженности (пролонгация, изменение ставки, графика).
      Критично для оценки гибкости сделки и защиты интересов займодавца.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "изменение договора"
        - "расторжение договора"
        - "односторонний отказ"
        - "реструктуризация"
        - "пролонгация"
        - "дополнительное соглашение"
        - "изменение условий"
        - "досрочное расторжение"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)изменени[ея]\\s+(условий|договор)"
        - "(?i)расторжени[ея]\\s+договор"
        - "(?i)односторонн(ий|его|им)\\s+(отказ|расторжен)"
        - "(?i)реструктуризац|пролонгац"
        - "(?i)дополнительн(ое|ым)\\s+соглашени"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор займа на предмет порядка изменения
        и расторжения (ст. 450–453, 811 ГК РФ).

        Нормативный ориентир:
        - ст. 450 ГК РФ — изменение и расторжение договора возможны
          по соглашению сторон, по требованию одной стороны (судебный
          порядок) или в случаях, предусмотренных договором/законом;
        - ст. 450.1 ГК РФ — предоставленное договором право
          на односторонний отказ от договора (исполнения договора);
        - ст. 310 ГК РФ — для сторон-предпринимателей односторонний
          отказ может быть предусмотрен договором;
        - ст. 811 ГК РФ — право займодавца требовать досрочного возврата
          займа при нарушении срока возврата очередной части (акцелерация);
        - ст. 818 ГК РФ — замена долга заёмным обязательством (новация
          долга в заём) — не то же самое, что реструктуризация;
        - Пролонгация — продление срока возврата займа по соглашению сторон
          (дополнительное соглашение) либо в силу автопролонгации, если
          предусмотрена.

        Важно:
        - Твоя задача — установить фактические условия договора.
        - Не выдумывай порядок изменения или расторжения.
        - Акцелерация (право требовать досрочного возврата) уже проверяется
          в `repayment_and_acceleration_check` — здесь фокус на изменениях
          и расторжении договора, не на акцелерации.

        [ЗАДАЧА]
        Найди в тексте договора (обычно разделы «Срок действия»,
        «Изменение и расторжение», «Заключительные положения»):
        1. Порядок изменения договора (по соглашению / односторонне /
           с уведомлением).
        2. Право одностороннего отказа / одностороннего расторжения.
        3. Основания расторжения (соглашение / суд / требование одной
           стороны).
        4. Условия реструктуризации / пролонгации задолженности.

        [ПРАВИЛА]
        1. Используй только текст документа. Не выдумывай условия
           изменения и расторжения.
        2. Если порядок изменения не детализирован, но есть общая
           формулировка «изменения оформляются дополнительным
           соглашением» — amendment_procedure_status = "defined",
           amendment_procedure_display = "По соглашению сторон
           (дополнительным соглашением)".
        3. Если указано право одностороннего отказа / расторжения
           (в т.ч. для займодавца при нарушении заёмщиком условий) —
           unilateral_refusal_status = "defined".
        4. Если основания расторжения не указаны — termination_grounds_status
           = "not_defined", display = "Не предусмотрены договором
           (действуют общие нормы ГК РФ)".
        5. Если условия реструктуризации / пролонгации не упомянуты —
           restructuring_status = "not_defined",
           restructuring_display = "Не предусмотрено".
        6. Запрещены значения: null, None, пустые строки — не используй
           их никогда. Допустимые fallback-значения: "not_defined",
           "not_applicable", "Не предусмотрено договором", "Не предусмотрено".
        7. В evidence включай только дословные цитаты из текста договора.
        8. Верни РОВНО один JSON-объект со всеми 9 ключами без какого-либо
           дополнительного текста до или после. Начни ответ сразу
           с открывающей фигурной скобки и закончи закрывающей. НЕ пиши
           Markdown, списки, код-фенсы. Ответ должен быть валидным JSON,
           пригодным для парсинга через json.loads без предварительной
           обработки.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — полный порядок изменения и расторжения:
        Фрагмент:
        "11.1. Изменения и дополнения к настоящему Договору оформляются
        письменными дополнительными соглашениями, подписываемыми обеими
        Сторонами.
        11.2. Займодавец вправе в одностороннем порядке отказаться
        от настоящего Договора при нарушении Заёмщиком сроков возврата
        займа или уплаты процентов более чем на 30 календарных дней.
        11.3. Пролонгация срока возврата займа возможна по соглашению
        Сторон с оформлением дополнительного соглашения."
        Ответ:
        {
          "amendment_procedure_status": "defined",
          "amendment_procedure_display": "По соглашению сторон (дополнительным соглашением)",
          "unilateral_refusal_status": "defined",
          "unilateral_refusal_display": "Предусмотрено для займодавца (просрочка > 30 дней)",
          "termination_grounds_status": "defined",
          "termination_grounds_display": "По соглашению сторон или односторонний отказ займодавца",
          "restructuring_status": "defined",
          "restructuring_display": "Пролонгация по соглашению сторон",
          "evidence": [
            {
              "clause_ref": "п. 11.1",
              "quote": "Изменения и дополнения к настоящему Договору оформляются письменными дополнительными соглашениями, подписываемыми обеими Сторонами."
            },
            {
              "clause_ref": "п. 11.2",
              "quote": "Займодавец вправе в одностороннем порядке отказаться от настоящего Договора при нарушении Заёмщиком сроков возврата займа или уплаты процентов более чем на 30 календарных дней."
            },
            {
              "clause_ref": "п. 11.3",
              "quote": "Пролонгация срока возврата займа возможна по соглашению Сторон с оформлением дополнительного соглашения."
            }
          ]
        }

        Пример 2 — договор молчит об изменении / расторжении:
        Фрагмент:
        "1.1. Займодавец передаёт Заёмщику денежные средства в размере
        5 000 000 рублей."
        (нет упоминаний о порядке изменения, расторжения, реструктуризации)
        Ответ:
        {
          "amendment_procedure_status": "not_defined",
          "amendment_procedure_display": "Не предусмотрено договором (действуют общие нормы ГК РФ)",
          "unilateral_refusal_status": "not_defined",
          "unilateral_refusal_display": "Не предусмотрено договором (действуют общие нормы ГК РФ)",
          "termination_grounds_status": "not_defined",
          "termination_grounds_display": "Не предусмотрены договором (действуют общие нормы ГК РФ)",
          "restructuring_status": "not_defined",
          "restructuring_display": "Не предусмотрено",
          "evidence": []
        }

        Пример 3 — только общая оговорка про изменения:
        Фрагмент:
        "12.1. Все изменения к настоящему Договору действительны только
        в случае, если они совершены в письменной форме и подписаны
        уполномоченными представителями Сторон."
        (нет отдельного регулирования расторжения или реструктуризации)
        Ответ:
        {
          "amendment_procedure_status": "defined",
          "amendment_procedure_display": "По соглашению сторон (письменная форма)",
          "unilateral_refusal_status": "not_defined",
          "unilateral_refusal_display": "Не предусмотрено договором (действуют общие нормы ГК РФ)",
          "termination_grounds_status": "not_defined",
          "termination_grounds_display": "Не предусмотрены договором (действуют общие нормы ГК РФ)",
          "restructuring_status": "not_defined",
          "restructuring_display": "Не предусмотрено",
          "evidence": [
            {
              "clause_ref": "п. 12.1",
              "quote": "Все изменения к настоящему Договору действительны только в случае, если они совершены в письменной форме и подписаны уполномоченными представителями Сторон."
            }
          ]
        }

        Пример 4 — текст есть, но надёжный вывод сделать нельзя
        (уклончивая формулировка):
        Фрагмент:
        "14.1. Изменение и расторжение настоящего Договора осуществляются
        в порядке, предусмотренном действующим законодательством
        Российской Федерации."
        (общая отсылка к ГК РФ без конкретных механизмов)
        Ответ:
        {
          "amendment_procedure_status": "not_defined",
          "amendment_procedure_display": "Не предусмотрено договором (действуют общие нормы ГК РФ)",
          "unilateral_refusal_status": "not_defined",
          "unilateral_refusal_display": "Не предусмотрено договором (действуют общие нормы ГК РФ)",
          "termination_grounds_status": "not_defined",
          "termination_grounds_display": "Не предусмотрены договором (действуют общие нормы ГК РФ)",
          "restructuring_status": "not_defined",
          "restructuring_display": "Не предусмотрено",
          "evidence": [
            {
              "clause_ref": "п. 14.1",
              "quote": "Изменение и расторжение настоящего Договора осуществляются в порядке, предусмотренном действующим законодательством Российской Федерации."
            }
          ]
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о порядке изменения договора.
        2. Найди прямую цитату о праве одностороннего отказа.
        3. Найди прямую цитату об основаниях расторжения.
        4. Найди прямую цитату о реструктуризации / пролонгации.
        5. Проверь дихотомию:
             нет упоминаний -> все status = "not_defined";
             есть конкретные механизмы -> "defined" + соответствующий display;
             общая отсылка к ГК РФ -> "not_defined".
        6. Проверь, что все 9 ключей (8 полей + evidence) присутствуют
           в JSON.
        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь РОВНО одним JSON-объектом без какого-либо дополнительного
        текста до или после, со всеми 9 ключами:
        {
          "amendment_procedure_status": "<defined / not_defined>",
          "amendment_procedure_display": "<По соглашению сторон (дополнительным соглашением) / По соглашению сторон (письменная форма) / Не предусмотрено договором (действуют общие нормы ГК РФ)>",
          "unilateral_refusal_status": "<defined / not_defined>",
          "unilateral_refusal_display": "<Предусмотрено для займодавца (…) / Предусмотрено для заёмщика (…) / Предусмотрено для обеих сторон / Не предусмотрено договором (действуют общие нормы ГК РФ)>",
          "termination_grounds_status": "<defined / not_defined>",
          "termination_grounds_display": "<краткое резюме оснований / Не предусмотрены договором (действуют общие нормы ГК РФ)>",
          "restructuring_status": "<defined / not_defined>",
          "restructuring_display": "<краткое резюме условий реструктуризации / Не предусмотрено>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 8
      temperature: 0.0
      max_tokens: 800
    retrieval:
      retrieval_profile: "termination_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "изменение договора расторжение договора односторонний отказ одностороннее расторжение реструктуризация пролонгация дополнительное соглашение изменение условий договора досрочное расторжение ст 450 450.1 811 ГК РФ"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - procedures
        - remedies
      negative_keywords:
        - "сумма займа"
        - "проценты по займу"
        - "процентная ставка"
        - "обеспечение исполнения"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.45, 0.95]
        boost: 0.18
        scope: segment
      context_k: 8
      max_chunks: 10
      rerank: true
    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - obligations
        - procedures
        - remedies
      confidence_bonus_on_match: 0.12
      confidence_penalty_on_excluded_segment: 0.15
    evidence:
      required: true
      min_snippet_length: 35
      max_snippet_length: 600
    extraction:
      store_payload: true

      enabled: true
      mode: "hybrid"
      compact_output: false
      llm_max_tokens: 1200
      llm_prompt_extraction: |
        <role>
        Ты — российский юрист по договорной работе. Извлеки из текста
        договора займа сведения о порядке изменения и расторжения:
        порядок изменения, право одностороннего отказа, основания
        расторжения, условия реструктуризации / пролонгации
        (ст. 450–453, 811 ГК РФ).
        Не анализируй акцелерацию (это отдельный check),
        проценты по ст. 809 ГК РФ или общую ответственность.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие 8 полей + evidence (всего 9 ключей).
        Верни все ключи, даже если данные отсутствуют.

        1.  amendment_procedure_status — "defined" / "not_defined".
        2.  amendment_procedure_display — user-facing строка:
              - "По соглашению сторон (дополнительным соглашением)";
              - "По соглашению сторон (письменная форма)";
              - "По соглашению сторон (уведомление за N дней)";
              - "Не предусмотрено договором (действуют общие нормы
                ГК РФ)".
        3.  unilateral_refusal_status — "defined" / "not_defined".
        4.  unilateral_refusal_display — user-facing строка:
              - "Предусмотрено для займодавца (основание: …)";
              - "Предусмотрено для заёмщика (основание: …)";
              - "Предусмотрено для обеих сторон";
              - "Не предусмотрено договором (действуют общие нормы
                ГК РФ)".
        5.  termination_grounds_status — "defined" / "not_defined".
        6.  termination_grounds_display — user-facing строка:
              - краткое резюме оснований (например: "По соглашению
                сторон, односторонний отказ займодавца");
              - "Не предусмотрены договором (действуют общие нормы
                ГК РФ)".
        7.  restructuring_status — "defined" / "not_defined".
        8.  restructuring_display — user-facing строка:
              - краткое резюме условий реструктуризации / пролонгации
                (например: "Пролонгация по соглашению сторон");
              - "Не предусмотрено".

        Дополнительно — обязательный массив evidence:
        - цитаты по каждому найденному условию (порядок изменения,
          односторонний отказ, основания расторжения, реструктуризация);
        - пустой массив [], если в договоре нет соответствующих условий.

        Правила заполнения при отсутствии данных:
        - Если условие не указано в договоре — status = "not_defined",
          display = "Не предусмотрено договором (действуют общие нормы
          ГК РФ)" или "Не предусмотрено".
        </task>

        <rules>
        - Используй только текст договора. Не выдумывай порядок изменения
          или расторжения.
        - Не используй null, None или пустые строки — только явные
          fallback-значения ("not_defined" / "Не предусмотрено договором" /
          "Не предусмотрено").
        - Не анализируй акцелерацию (право займодавца требовать досрочного
          возврата) — это отдельный check.
        - Различай:
            * односторонний отказ (ст. 450.1, 310 ГК РФ) — прекращение
              договора одной стороной без суда;
            * требование о расторжении в судебном порядке (ст. 450(2)
              ГК РФ) — судебное расторжение;
            * акцелерация (ст. 811(2) ГК РФ) — досрочный возврат займа,
              но не расторжение.
        - Если в тексте есть общая отсылка «в порядке, предусмотренном
          законодательством РФ», без конкретных механизмов — все status
          = "not_defined".
        - Верни РОВНО один JSON-объект со всеми 9 ключами
          без какого-либо дополнительного текста до или после.
          Начни ответ сразу с открывающей фигурной скобки и закончи
          закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ
          должен быть валидным JSON, пригодным для парсинга через
          json.loads без предварительной обработки.
        </rules>
      fields:
        - name: "amendment_procedure_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус наличия порядка изменения договора (raw enum)."
          required: true
          display_in_grid: false
        - name: "amendment_procedure_display"
          type: "string"
          presentation: "fact"
          label: "Порядок изменения договора"
          description: "User-facing порядок изменения договора займа."
          required: true
          display_in_grid: true
          display_priority: 1
        - name: "unilateral_refusal_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус наличия права одностороннего отказа (raw enum)."
          required: true
          display_in_grid: false
        - name: "unilateral_refusal_display"
          type: "string"
          presentation: "fact"
          label: "Односторонний отказ / расторжение"
          description: "User-facing право одностороннего отказа от договора и его основания."
          required: true
          display_in_grid: true
          display_priority: 2
        - name: "termination_grounds_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус наличия оснований расторжения (raw enum)."
          required: true
          display_in_grid: false
        - name: "termination_grounds_display"
          type: "string"
          presentation: "fact"
          label: "Основания расторжения"
          description: "User-facing основания расторжения договора займа."
          required: true
          display_in_grid: true
          display_priority: 3
        - name: "restructuring_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус наличия условий реструктуризации (raw enum)."
          required: true
          display_in_grid: false
        - name: "restructuring_display"
          type: "string"
          presentation: "fact"
          label: "Реструктуризация / пролонгация"
          description: "User-facing условия реструктуризации или пролонгации займа."
          required: true
          display_in_grid: true
          display_priority: 4

