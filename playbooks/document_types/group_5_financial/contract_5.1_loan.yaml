      - "(?i)\\bдарени[ея]\\b"
  fungible_goods_loan:
    any_keywords:
      - "(?i)вещ[ии],?\\s+определенн[ыо]е\\s+родов[ыо]ми\\s+признак[аа]ми"
      - "(?i)товарн[ыо]й\\s+за[её]м"
      - "(?i)за[её]м\\s+вещ[ее]й"
      - "(?i)того\\s+же\\s+род[аа]\\s+и\\s+качеств[аа]"
      - "(?i)\\bзерн[оо]\\b"
      - "(?i)\\bтоплив[оо]\\b"
      - "(?i)\\bматериал[ыо]\\b"
  promissory_note:
