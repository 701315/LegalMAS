        }

        Пример 6 — данные полностью отсутствуют:
        Фрагмент:
        "Стороны заключили настоящий договор займа."
        (нет никакой информации о передаче)
        Ответ:
        {
          "transfer_evidence_status": "not_defined",
          "transfer_evidence_details": "Не установлено",
          "transfer_evidence_type": "not_defined",
          "transfer_evidence_type_display": "Не определено",
          "transfer_at_signing_status": "not_defined",
          "cash_transfer_risk": "not_defined",
          "transfer_risk_display": "Не определён",
