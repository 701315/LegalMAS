        - procedures
      confidence_bonus_on_match: 0.10
      confidence_penalty_on_excluded_segment: 0.12
    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 600
    extraction:
      store_payload: true

      enabled: true
      mode: "hybrid"
      compact_output: false
      llm_max_tokens: 1200
      llm_prompt_extraction: |
        <role>
        Ты — российский юрист по договорной работе. Извлеки из текста
        договора займа сведения о сроке возврата, способе передачи
        и способе возврата займа.
        Применяй правило ст. 810(1) ГК РФ при отсутствии срока.
        Не анализируй сумму займа, проценты или иные темы — только
        срок возврата, передачу и возврат.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие 7 полей + evidence (всего 8 ключей).
        Верни все ключи, даже если данные отсутствуют.

        1.  repayment_term_status — "defined" / "not_defined".
        2.  repayment_term_value — срок возврата или
            "Срок не установлен (возврат в течение 30 дней с момента
            предъявления требования по ст. 810(1) ГК РФ)" или
            "Согласно Графику платежей (Приложение № N)" или
            "Не установлено".
        3.  repayment_term_display — краткая версия для DD Grid:
              - для явного срока -> "31.12.2026" или
                "не позднее 31.12.2026";
              - для ст. 810(1) -> "По требованию (30 дней, ст. 810(1) ГК РФ)";
              - для графика -> "Согласно Графику платежей (Приложение № N)";
              - для not_defined -> "Не определён".
        4.  transfer_method — "cash" / "bank_transfer" / "mixed" /
            "not_defined".
        5.  transfer_method_display — user-facing строка:
              - "cash" -> "Наличные";
              - "bank_transfer" -> "Безналичный перевод";
              - "mixed" -> "Смешанный (безнал + наличные)";
              - "not_defined" -> "Не определён".
        6.  repayment_method — "cash" / "bank_transfer" / "mixed" /
            "not_defined".
        7.  repayment_method_display — user-facing строка (правила те же,
            что для transfer_method_display).

        Дополнительно — обязательный массив evidence:
        - хотя бы одна цитата о сроке/передаче/возврате, если данные
          найдены;
        - пустой массив [], если ничего не найдено (но тогда применяется
          ст. 810(1) для срока, а остальное = not_defined).

        Логика заполнения срока (ст. 810(1) ГК РФ):
        - Если срок указан явно -> repayment_term_status = "defined",
          repayment_term_value = точная формулировка.
        - Если срок определяется через график/приложение ->
          repayment_term_status = "defined", repayment_term_value =
          "Согласно Графику платежей (Приложение № N)".
        - Если срок НЕ указан и НЕ определён через приложение ->
          repayment_term_status = "defined" (по ст. 810(1) срок всё
          равно есть — 30 дней), repayment_term_value = "Срок
          не установлен (возврат в течение 30 дней с момента
          предъявления требования по ст. 810(1) ГК РФ)".
        - Только если контекст вообще не содержит пунктов о возврате
          И договор неполный -> repayment_term_status = "not_defined",
          repayment_term_value = "Не установлено".

        Правила заполнения при отсутствии данных:
        - Если срок не указан и не применима ст. 810(1) —
          repayment_term_value = "Не установлено".
        - Для вещевого займа (не деньги): transfer_method
          и repayment_method = "not_defined".
        </task>

        <rules>
        - Используй только текст договора. Не выдумывай сроки, способы
          передачи.
        - Не используй null, None или пустые строки — только явные
          fallback-значения ("not_defined" / "Не установлено" /
          "Не определён").
        - Если срок определяется через график/приложение — верни
          формулировку "Согласно Графику платежей (Приложение № N)".
        - Если в документе несколько редакций условий о сроке —
          использовать последнюю по позиции.
        - transfer_method / repayment_method:
            - "cash" — наличные (фраза «наличными», «в кассу»,
              «расписка»);
            - "bank_transfer" — безналичный перевод («на расчётный
              счёт», «платёжное поручение», «безналичным переводом»);
            - "mixed" — смешанный (часть наличными, часть безналом);
            - "not_defined" — способ не указан.
        - Для вещевого займа: transfer_method и repayment_method
          = "not_defined" (классификация наличные/безнал
          не применима).
        - Верни РОВНО один JSON-объект со всеми 8 ключами без какого-либо
          дополнительного текста до или после. Начни ответ сразу
          с открывающей фигурной скобки и закончи закрывающей. НЕ пиши
          Markdown, списки, код-фенсы. Ответ должен быть валидным JSON,
          пригодным для парсинга через json.loads без предварительной
          обработки.
        </rules>
      fields:
        - name: "repayment_term_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус определения срока возврата (raw enum)."
          required: true
          display_in_grid: false
        - name: "repayment_term_value"
          type: "string"
          presentation: "fact"
          label: "Срок возврата (полная формулировка)"
          description: "Полная формулировка срока, включая ссылки на ст. 810 ГК РФ или приложения."
          required: true
          display_in_grid: false
        - name: "repayment_term_display"
          type: "string"
          presentation: "fact"
          label: "Срок возврата"
          description: "Краткая версия срока для DD Grid."
          required: true
          display_in_grid: true
          display_priority: 1
        - name: "transfer_method"
          type: "string"
          presentation: "signal"
          allowed_values: ["cash", "bank_transfer", "mixed", "not_defined"]
          description: "Способ передачи займа (raw enum)."
          required: true
          display_in_grid: false
        - name: "transfer_method_display"
          type: "string"
          presentation: "fact"
          label: "Способ передачи займа"
          description: "User-facing способ передачи."
          required: true
          display_in_grid: true
          display_priority: 2
        - name: "repayment_method"
          type: "string"
          presentation: "signal"
          allowed_values: ["cash", "bank_transfer", "mixed", "not_defined"]
          description: "Способ возврата займа (raw enum)."
          required: true
          display_in_grid: false
        - name: "repayment_method_display"
          type: "string"
          presentation: "fact"
          label: "Способ возврата займа"
          description: "User-facing способ возврата."
          required: true
          display_in_grid: true
          display_priority: 3

  - id: transfer_evidence_check
    name: "Подтверждение фактической передачи суммы займа (ст. 808, 812 ГК РФ)"
    description: >
      Фактографическая проверка наличия доказательств передачи займа:
      расписка, акт, платёжное поручение, указание на передачу при подписании.
      Учитывает консенсуальный договор (обещание займа с 01.06.2018 по ФЗ-212),
      передачу траншами. Оценивает риск безденежности (ст. 812 ГК РФ) на основе
      способа передачи и наличия подтверждающих документов. Критично для DD.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "денежные средства переданы"
        - "получены заемщиком"
        - "получены заёмщиком"
        - "расписка"
        - "платежное поручение"
        - "платёжное поручение"
        - "зачислены на счет"
        - "зачислены на счёт"
        - "переданы при подписании"
        - "акт передачи"
        - "подтверждается"
        - "обещание займа"
        - "траншами"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)денежн(ые|ых)\\s+средств[ао].{0,40}(передан|получен)"
        - "(?i)расписк"
        - "(?i)платежн(ое|ого|ым)\\s+поручени"
        - "(?i)зачислен[ыа].{0,20}счет"
        - "(?i)акт\\s+передачи"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор займа (§ 1 Главы 42 ГК РФ, ст. 807, 808, 812).
        Проверяется только один вопрос: наличие доказательств фактической
        передачи суммы займа и риск безденежности.

        Нормативный ориентир:
        - ст. 807 ГК РФ — предмет договора займа. С 01.06.2018 (ФЗ-212 от 26.07.2017)
          возможен консенсуальный договор займа (обещание займа) — вступает в силу
          с момента соглашения, передача обещана в будущем;
        - ст. 808 ГК РФ — форма договора займа: письменная форма обязательна
          при сумме > 10 000 ₽ (между гражданами) или при участии юрлица.
          Расписка заёмщика, содержащая условия займа, = договор займа (ст. 808(2));
        - ст. 812 ГК РФ — безденежность: заёмщик может оспорить договор по мотиву
          безденежности, если докажет, что деньги фактически не получал.
          Бремя доказывания на заёмщике (ст. 812(2)), но при наличной передаче
          без расписки займодавцу сложно опровергнуть.

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора.
        - Различай «подтверждение передачи» (внешний документ) и «указание
          в договоре» (голословное утверждение в тексте). Только внешний
          документ считается полноценным подтверждением.
        - Не оценивай иные риски сверх текста.

        [ЗАДАЧА]
        Найди в тексте договора (обычно п. 1–2 «Предмет» или п. 4–6 «Передача»):
        1. Внешний подтверждающий документ передачи (расписка, акт, платёжное
           поручение, банковская выписка).
        2. Если внешнего документа нет, но в тексте договора есть указание
           на передачу — зафиксируй это как «указание в договоре» с
           соответствующим типом.
        3. Указание на передачу при подписании договора.
        4. Если обещание займа (консенсуальный договор) — указание на будущую передачу.
        5. Если передача траншами — указание на график / приложение.
        6. Риск безденежности на основе способа передачи и наличия внешнего
           подтверждающего документа.

        [ПРАВИЛА]
        1. Используй только текст документа. Не выдумывай расписки, платёжки, акты.
        2. Классификация подтверждения:
           - Есть внешний подтверждающий документ (расписка / платёжка / акт) →
             transfer_evidence_status = "defined";
           - Указание на передачу только в тексте договора (без внешнего
             документа) → transfer_evidence_status = "not_defined",
             transfer_evidence_type = "contract_clause";
           - Обещание займа (консенсуальный договор, передача в будущем) →
             transfer_evidence_status = "not_defined",
             transfer_evidence_type = "not_defined",
             cash_transfer_risk = "not_applicable";
           - Ничего не найдено → transfer_evidence_status = "not_defined",
             transfer_evidence_type = "not_defined".
        3. Запрещены значения: null, None, пустые строки — не используй их
           никогда. Допустимые fallback-значения: "not_defined", "Не установлено",
           "Не определено".
        4. Если передача траншами по графику:
           - transfer_evidence_details = "Передача траншами согласно Графику
             (Приложение № N), подтверждение каждого транша отдельно";
           - transfer_evidence_type определяется по типу подтверждения для
             траншей (расписка / акт / платёжка на каждый транш).
        5. Если в документе несколько редакций условий о передаче — использовать
           последнюю по позиции.
        6. cash_transfer_risk определяется так:
           - Безналичная передача (платёжное поручение, зачисление на счёт,
             банковский перевод) → "low";
           - Наличная передача с распиской или актом → "medium";
           - Наличная передача БЕЗ внешнего подтверждающего документа → "high";
           - Обещание займа (передача ещё не состоялась) → "not_applicable";
           - Способ передачи не определён → "not_defined".
        7. transfer_at_signing_status:
           - "defined" — если прямо указано «передача при подписании» /
             «при заключении договора» / «в момент подписания»;
           - "not_defined" — иначе.
        8. В evidence включай только дословные цитаты из текста договора.
        9. Верни РОВНО один JSON-объект со всеми 8 ключами без какого-либо
           дополнительного текста до или после. Начни ответ сразу
           с открывающей фигурной скобки и закончи закрывающей. НЕ пиши
           Markdown, списки, код-фенсы. Ответ должен быть валидным JSON,
           пригодным для парсинга через json.loads без предварительной
           обработки.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — наличная передача при подписании + расписка (medium risk):
        Фрагмент:
        "1.1. Денежные средства в размере 3 000 000 (Три миллиона) рублей
        переданы Займодавцем Заёмщику при подписании настоящего договора
        наличными, что подтверждается распиской Заёмщика (Приложение № 1
        к настоящему договору)."
        Ответ:
        {
          "transfer_evidence_status": "defined",
          "transfer_evidence_details": "Расписка Заёмщика (Приложение № 1)",
