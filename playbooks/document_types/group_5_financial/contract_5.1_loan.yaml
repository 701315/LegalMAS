        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь РОВНО одним JSON-объектом без какого-либо дополнительного
        текста до или после, со всеми 5 ключами:
        {
          "no_insolvency_warranty_status": "<defined / not_defined>",
          "no_insolvency_warranty_display": "<Есть заверение об отсутствии банкротства / Нет заверения (риск оспаривания по ст. 61.2 127-ФЗ)>",
