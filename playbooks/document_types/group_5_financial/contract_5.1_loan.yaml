        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Определи тип валютной конструкции (эквивалент в рублях / прямая
           валюта / чистые рубли).
        2. Найди источник курса (ЦБ РФ / коммерческий банк / фиксированный /
           не указан).
        3. Найди дату пересчёта (платежа / выдачи / возврата / не указана).
        4. Проверь наличие валютного коридора (min/max курс).
        5. Определи распределение валютных рисков по приоритетам из [ПРАВИЛА] п.7.
        6. Согласуй raw enum и display:
             currency_reference_type -> currency_clause_display:
               "rub_equivalent" -> "Эквивалент валюты (…)";
               "foreign_currency_obligation" -> "Прямые расчёты в валюте (…)";
               "not_applicable" -> "Не применимо (…)".
             conversion_rate_source + conversion_date -> conversion_rate_display:
               "cb_rate" + "payment_date" -> "Курс ЦБ РФ на дату платежа";
               "commercial_bank_rate" -> "Курс [БАНК] на дату [СОБЫТИЯ]";
               "fixed_rate" -> "Фиксированный курс (1 [ВАЛЮТА] = N руб.)";
               "not_defined" -> "Не указан (применяется курс ЦБ РФ на дату платежа
                 по ст. 317(2) ГК РФ)";
               "not_applicable" -> "Не применимо".
             currency_risk_allocation -> currency_risk_display:
               "borrower_bears_all" -> "Все риски на заёмщике (…)";
               "lender_bears_all" -> "Все риски на займодавце (…)";
               "shared" -> "Риски разделены (валютный коридор …)";
               "not_defined" -> "Не определено" или "Не применимо".
        7. Проверь, что все 11 ключей (10 полей + evidence) присутствуют в JSON.
        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь РОВНО одним JSON-объектом без какого-либо дополнительного
        текста до или после, со всеми 11 ключами:
        {
          "currency_reference_type": "<rub_equivalent / foreign_currency_obligation / not_applicable>",
          "currency_clause_display": "<Эквивалент валюты (…) / Прямые расчёты в валюте (…) / Не применимо (…)>",
          "conversion_rate_source": "<cb_rate / commercial_bank_rate / fixed_rate / not_applicable / not_defined>",
          "conversion_date": "<payment_date / transfer_date / maturity_date / not_applicable / not_defined>",
          "conversion_rate_display": "<Курс ЦБ РФ на дату платежа / Курс [БАНК] на дату [СОБЫТИЯ] / Фиксированный курс (1 [ВАЛЮТА] = N руб.) / Не указан (…) / Не применимо>",
          "currency_collar_min": "<число или 'not_defined'>",
          "currency_collar_max": "<число или 'not_defined'>",
          "currency_collar_display": "<Установлен: от N до M руб./[ВАЛЮТА] / Не установлен (без ограничений) / Не установлен (фиксированный курс) / Не применимо>",
          "currency_risk_allocation": "<not_defined / borrower_bears_all / lender_bears_all / shared>",
          "currency_risk_display": "<Все риски на заёмщике (…) / Все риски на займодавце (…) / Риски разделены (…) / Не определено / Не применимо>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 8
      temperature: 0.0
      max_tokens: 900
