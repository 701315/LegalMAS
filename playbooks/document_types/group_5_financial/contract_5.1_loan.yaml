# CHECK 7: Валютная оговорка
# ──────────────────────────────────────────────────────────────────────────
  - id: foreign_currency_terms_check
    name: "Валютная оговорка: курс, дата пересчёта, распределение рисков (ст. 140, 317 ГК РФ)"
    description: >
      Фактографическая проверка валютной конструкции займа: тип конструкции,
      источник курса, дата пересчёта, ясность оговорки.
    triggers:
      any: ["foreign_currency_reference"]
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "курс цб рф"
        - "валютная оговорка"
        - "доллар"
        - "евро"
        - "usd"
        - "eur"
        - "на дату платежа"
        - "иностранная валюта"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)курс\\s+цб\\s*рф"
        - "(?i)валютн(ая|ой)\\s+оговорк"
        - "(?i)usd|eur|доллар|евро"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор займа с валютным элементом (ст. 140, 317 ГК РФ, ФЗ-173).
        Проверяется только один вопрос: валютная конструкция, курс пересчёта,
        дата пересчёта и распределение валютных рисков.
        Нормативный ориентир:
        - ст. 140 ГК РФ — валюта
        - ст. 317 ГК РФ — валютная оговорка
        Важно:
        - Твоя задача — не оценивать серьёзность риска.
        - Только установить, что прямо есть в тексте договора, а чего прямо нет.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Тип валютной конструкции.
        2. Источник курса пересчёта.
        3. Дату пересчёта.
        4. Ясность валютной оговорки.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Если условие не указано прямо — возвращай "not_defined".
        3. Не используй "None", "null" или пустые строки.
        4. В evidence включай только текст договора.
        5. Верни только один JSON-объект.

        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1:
        Фрагмент:
        "Сумма займа составляет эквивалент 100 000 долларов США по курсу ЦБ РФ
        на дату платежа. Возврат осуществляется в рублях по курсу ЦБ РФ
        на дату возврата."
        Ответ:
        {
          "currency_reference_type": "rub_equivalent",
          "conversion_rate_source": "cb_rate",
          "conversion_date": "payment_date",
          "currency_risk_clause_clarity": "clear",
          "evidence": [
            {
              "clause_ref": "п. 1.3",
              "quote": "Сумма займа составляет эквивалент 100 000 долларов США по курсу ЦБ РФ на дату платежа."
            }
          ]
        }

        Пример 2:
        Фрагмент:
        "Заём предоставляется в рублях."
        Ответ:
        {
          "currency_reference_type": "not_defined",
          "conversion_rate_source": "not_defined",
          "conversion_date": "not_defined",
          "currency_risk_clause_clarity": "not_defined",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о валютной конструкции.
        2. Найди прямую цитату об источнике курса.
        3. Найди прямую цитату о дате пересчёта.
        4. Если прямой цитаты нет — верни "not_defined".
        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        {
          "currency_reference_type": "<foreign_currency_obligation / rub_equivalent / not_defined>",
          "conversion_rate_source": "<cb_rate / contract_rate / other / not_defined>",
          "conversion_date": "<payment_date / transfer_date / other / not_defined>",
          "currency_risk_clause_clarity": "<clear / unclear / not_defined>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 5
      temperature: 0.0
      max_tokens: 450
      retrieval:
        retrieval_profile: "payment_terms_check"
        corpus_scope: "primary_segment"
        levels:
          - "legal_unit"
          - "section"
        required_kind: "legal_unit"
        retrieval_query: "курс цб рф валютная оговорка на дату платежа доллар евро usd eur иностранная валюта пересчёт валютный риск"
        preferred_unit_types:
          - obligation
          - general_provision
        excluded_unit_types:
          - definition
          - structural_anchor
          - technical_fragment
        preferred_clause_functions:
          - obligations
          - definitions
        negative_keywords:
          - "проценты"
          - "неустойка"
          - "обеспечение"
          - "аффилированность"
          - "означает"
          - "в целях настоящего"
        position_bias:
          preferred_range: [0.05, 0.50]
          boost: 0.18
          scope: segment
        context_k: 5
        max_chunks: 7
        rerank: true
        enrichment_hints:
          preferred_segment_types:
            - "contract"
            - "amendment"
          excluded_segment_types:
            - "technical_specification"
            - "price_list"
          preferred_clause_functions:
            - "obligations"
            - "definitions"
          confidence_bonus_on_match: 0.10
          confidence_penalty_on_excluded_segment: 0.12
      evidence:
        required: true
        min_snippet_length: 35
        max_snippet_length: 520
      extraction:
        enabled: true
        mode: "hybrid"
        compact_output: false
        llm_max_tokens: 550
        llm_prompt_extraction: |
          <role>
          Ты — российский юрист. Извлеки из текста договора займа с валютным
          элементом тип конструкции, источник курса, дату пересчёта и ясность.
          Не анализируй проценты, обеспечение или иные темы.
          </role>
          <context>
          {context}
          </context>
          <task>
          Заполни строго следующие поля:
          1. currency_reference_type — foreign_currency_obligation / rub_equivalent / not_defined.
          2. conversion_rate_source — cb_rate / contract_rate / other / not_defined.
          3. conversion_date — payment_date / transfer_date / other / not_defined.
          4. currency_risk_clause_clarity — clear / unclear / not_defined.
          Если данные отсутствуют: указывай "not_defined".
          </task>
          <rules>
          - Используй только текст договора.
          - currency_reference_type:
            "foreign_currency_obligation" — обязательство в иностранной валюте;
            "rub_equivalent" — рублёвый эквивалент валютной суммы;
            "not_defined" — не определено.
          - Верни только JSON.
          </rules>
        fields:
          - name: "currency_reference_type"
            type: "string"
            presentation: "signal"
            allowed_values: ["foreign_currency_obligation", "rub_equivalent", "not_defined"]
            description: "Тип валютной конструкции."
            required: true
          - name: "conversion_rate_source"
            type: "string"
            presentation: "signal"
            allowed_values: ["cb_rate", "contract_rate", "other", "not_defined"]
            description: "Источник курса пересчёта."
            required: false
          - name: "conversion_date"
            type: "string"
            presentation: "signal"
            allowed_values: ["payment_date", "transfer_date", "other", "not_defined"]
            description: "Дата пересчёта."
            required: false
          - name: "currency_risk_clause_clarity"
            type: "string"
            presentation: "signal"
            allowed_values: ["clear", "unclear", "not_defined"]
            description: "Ясность валютной оговорки."
            required: false
    store_payload: true
