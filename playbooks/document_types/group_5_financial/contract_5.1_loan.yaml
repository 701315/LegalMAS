        Пример 5 — передача траншами + акт по каждому траншу:
        Фрагмент:
        "Сумма займа передаётся Заёмщику траншами согласно Графику траншей
        (Приложение № 2). Передача каждого транша подтверждается Актом
        приёма-передачи денежных средств, подписываемым сторонами."
        Ответ:
        {
