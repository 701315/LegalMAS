        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату с заверением об отсутствии банкротства /
           неплатёжеспособности.
        2. Найди прямую цитату с указанием деловой цели / экономического смысла.
        3. Проверь, что все 5 ключей (4 поля + evidence) присутствуют в JSON.
