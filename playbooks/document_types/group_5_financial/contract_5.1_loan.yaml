          "evidence": [
            {
              "clause_ref": "п. 1.1",
              "quote": "Денежные средства в размере 3 000 000 (Три миллиона) рублей переданы Займодавцем Заёмщику при подписании настоящего договора наличными, что подтверждается распиской Заёмщика (Приложение № 1 к настоящему договору)."
            }
          ]
        }

        Пример 2 — безналичная передача + платёжное поручение (low risk):
