shared_patterns:
  money_amount: "(?i)\\b\\d[\\d\\s]*(?:руб|рублей|₽|коп|тыс|млн|млрд)"
  date_pattern: "(?i)\\b\\d{1,2}[.]\\d{1,2}[.]\\d{4}\\b"
  percentage_pattern: "(?i)\\b\\d+(?:[.,]\\d+)?\\s*%\\b"
  deadline_pattern: "(?i)(?:в течение|не позднее)\\s+\\d+\\s+(?:календарн|рабоч|банковск|дн|дня|дней)"
  currency_pattern: "(?i)\\b(?:руб|рублей|₽|usd|eur|доллар(?:ов)?|евро)\\b"

compliance_rules: []

# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 4: CHECKS_V8 — единственный рабочий слой юридического анализа
#  Читается: DocTypeCheckLoader._load_doc_type_checks()
# ════════════════════════════════════════════════════════════════════════════
checks_v8:
# ──────────────────────────────────────────────────────────────────────────
# CHECK 1: Стороны договора — займодавец и заёмщик
# ──────────────────────────────────────────────────────────────────────────
  - id: loan_parties_identification
    name: "Стороны договора: идентификация займодавца и заёмщика"
    description: >
      Фактографическая проверка идентификации сторон договора займа —
      займодавца и заёмщика, их реквизитов, подписантов и оснований полномочий.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "займодавец"
        - "заемщик"
        - "именуем"
        - "в лице"
        - "действующего на основании"
        - "ИНН"
        - "ОГРН"
        - "паспорт"
        - "гражданин"
        - "юридическое лицо"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)(займодавец|заемщик).*именуем"
        - "(?i)действующ[а-я]+\\s+на\\s+основании"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор займа (§ 1 Главы 42 ГК РФ, ст. 807).
        Проверяется только один вопрос: идентификация сторон — займодавца
        и заёмщика, их реквизиты, подписанты и основания полномочий.
        Нормативный ориентир:
        - ст. 807 ГК РФ — стороны договора займа
        - ст. 182–185 ГК РФ — полномочия представителя
        Важно:
        - Твоя задача — не оценивать серьёзность риска.
        - Только установить, что прямо есть в тексте договора, а чего прямо нет.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Наименование/ФИО и реквизиты Займодавца.
        2. Тип Займодавца (юрлицо / ИП / физлицо).
        3. Кто подписывает от Займодавца и на каком основании.
        4. Наименование/ФИО и реквизиты Заёмщика.
        5. Тип Заёмщика.
        6. Кто подписывает от Заёмщика и на каком основании.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Если данные не указаны прямо — возвращай "not_defined" / "Данные не определены".
        3. Не используй "None", "null", "not_defined" или пустые строки.
        4. В evidence включай только текст договора.
        5. Верни только один JSON-объект.

        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1:
        Фрагмент:
        "ООО «ФинансГрупп» (ИНН 7700000001, ОГРН 1027700000001), именуемое
        «Займодавец», в лице Генерального директора Иванова И.И., действующего
        на основании Устава, и гражданин Петров П.П., паспорт 45 00 № 123456,
        именуемый «Заёмщик»."
        Ответ:
        {
          "lender_details_status": "defined",
          "lender_details_value": "ООО «ФинансГрупп», ИНН 7700000001, ОГРН 1027700000001",
          "lender_type": "legal_entity",
          "lender_signatory": "Генеральный директор Иванов И.И.",
          "lender_signatory_basis": "charter",
          "borrower_details_status": "defined",
          "borrower_details_value": "Петров П.П., паспорт 45 00 № 123456",
          "borrower_type": "individual",
          "borrower_signatory": "Петров П.П.",
          "borrower_signatory_basis": "personal",
          "evidence": [
            {
              "clause_ref": "преамбула",
              "quote": "ООО «ФинансГрупп» (ИНН 7700000001, ОГРН 1027700000001), именуемое «Займодавец», в лице Генерального директора Иванова И.И., действующего на основании Устава."
            }
          ]
        }

        Пример 2:
        Фрагмент:
        "Настоящий договор займа заключён между сторонами."
        Ответ:
        {
          "lender_details_status": "not_defined",
          "lender_details_value": "Данные не определены",
          "lender_type": "not_defined",
          "lender_signatory": "Данные не определены",
          "lender_signatory_basis": "not_defined",
          "borrower_details_status": "not_defined",
          "borrower_details_value": "Данные не определены",
          "borrower_type": "not_defined",
          "borrower_signatory": "Данные не определены",
          "borrower_signatory_basis": "not_defined",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату с идентификацией Займодавца.
        2. Найди прямую цитату с идентификацией Заёмщика.
        3. Найди прямую цитату о подписантах и основаниях полномочий.
        4. Если прямой цитаты нет — верни "not_defined".
        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        {
          "lender_details_status": "<defined / not_defined>",
          "lender_details_value": "<реквизиты или 'Данные не определены'>",
          "lender_type": "<legal_entity / ip / individual / not_defined>",
          "lender_signatory": "<ФИО и должность или 'Данные не определены'>",
          "lender_signatory_basis": "<charter / poa / order / personal / other / not_defined>",
          "borrower_details_status": "<defined / not_defined>",
          "borrower_details_value": "<реквизиты или 'Данные не определены'>",
          "borrower_type": "<legal_entity / ip / individual / not_defined>",
          "borrower_signatory": "<ФИО и должность или 'Данные не определены'>",
          "borrower_signatory_basis": "<charter / poa / order / personal / other / not_defined>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 700
      retrieval:
        retrieval_profile: "party_identification_check"
        corpus_scope: "primary_segment"
        levels:
          - "legal_unit"
          - "section"
        required_kind: "legal_unit"
        retrieval_query: "займодавец заемщик именуем в лице действующего на основании ИНН ОГРН паспорт гражданин юридическое лицо реквизиты сторон"
        preferred_unit_types:
          - obligation
          - general_provision
        excluded_unit_types:
          - definition
          - structural_anchor
          - technical_fragment
        preferred_clause_functions:
          - representations
          - boilerplate
        negative_keywords:
          - "сумма займа"
          - "проценты"
          - "срок возврата"
          - "неустойка"
          - "обеспечение"
          - "означает"
          - "в целях настоящего"
        position_bias:
          preferred_range: [0.0, 0.20]
          boost: 0.40
          scope: segment
        context_k: 6
        max_chunks: 8
        rerank: true
        enrichment_hints:
          preferred_segment_types:
            - "contract"
            - "amendment"
          excluded_segment_types:
            - "technical_specification"
            - "price_list"
          preferred_clause_functions:
            - "representations"
            - "boilerplate"
          confidence_bonus_on_match: 0.08
          confidence_penalty_on_excluded_segment: 0.15
      evidence:
        required: true
        min_snippet_length: 40
        max_snippet_length: 600
      extraction:
        enabled: true
        mode: "hybrid"
        compact_output: false
        llm_max_tokens: 1300
        llm_prompt_extraction: |
          <role>
          Ты — российский юрист. Извлеки из текста договора займа сведения
          о займодавце и заёмщике: реквизиты, тип стороны, подписанта
          и основание полномочий.
          Не анализируй сумму займа, проценты, срок возврата или иные темы.
          </role>
          <context>
          {context}
          </context>
          <task>
          Заполни строго следующие поля:
          1. lender_details_status — "defined" или "not_defined".
          2. lender_details_value — наименование/ФИО и реквизиты займодавца.
          3. lender_type — legal_entity / ip / individual / not_defined.
          4. lender_signatory — подписант займодавца.
          5. lender_signatory_basis — charter / poa / order / personal / other / not_defined.
          6. borrower_details_status — "defined" или "not_defined".
          7. borrower_details_value — наименование/ФИО и реквизиты заёмщика.
          8. borrower_type — legal_entity / ip / individual / not_defined.
          9. borrower_signatory — подписант заёмщика.
          10. borrower_signatory_basis — charter / poa / order / personal / other / not_defined.
          Если данные отсутствуют:
          - статус = "not_defined"
          - текст = "Данные не определены"
          </task>
          <rules>
          - Используй только текст договора.
          - Для физлица, подписывающего лично, используй basis = "personal".
          - Не смешивай займодавца и заёмщика.
          - Верни только JSON.
          </rules>
        fields:
          - name: "lender_details_status"
            type: "string"
            presentation: "signal"
            allowed_values: ["defined", "not_defined"]
            description: "Статус идентификации займодавца."
            required: true
          - name: "lender_details_value"
            type: "string"
            presentation: "fact"
            label: "Займодавец"
            description: "Наименование/ФИО и реквизиты займодавца."
            required: true
            display_in_grid: true
            display_priority: 1
          - name: "lender_type"
            type: "string"
            presentation: "signal"
            allowed_values: ["legal_entity", "ip", "individual", "not_defined"]
            description: "Тип займодавца."
            required: false
          - name: "lender_signatory"
            type: "string"
            presentation: "fact"
            label: "Подписант займодавца"
            description: "Подписант от займодавца."
            required: false
            display_in_grid: false
          - name: "lender_signatory_basis"
            type: "string"
            presentation: "signal"
            allowed_values: ["charter", "poa", "order", "personal", "other", "not_defined"]
            description: "Основание полномочий подписанта займодавца."
            required: false
          - name: "borrower_details_status"
            type: "string"
            presentation: "signal"
            allowed_values: ["defined", "not_defined"]
            description: "Статус идентификации заёмщика."
            required: true
          - name: "borrower_details_value"
            type: "string"
            presentation: "fact"
            label: "Заёмщик"
            description: "Наименование/ФИО и реквизиты заёмщика."
            required: true
            display_in_grid: true
            display_priority: 2
          - name: "borrower_type"
            type: "string"
            presentation: "signal"
            allowed_values: ["legal_entity", "ip", "individual", "not_defined"]
            description: "Тип заёмщика."
            required: false
          - name: "borrower_signatory"
            type: "string"
            presentation: "fact"
            label: "Подписант заёмщика"
            description: "Подписант от заёмщика."
            required: false
            display_in_grid: false
          - name: "borrower_signatory_basis"
            type: "string"
            presentation: "signal"
            allowed_values: ["charter", "poa", "order", "personal", "other", "not_defined"]
            description: "Основание полномочий подписанта заёмщика."
            required: false
    store_payload: true
# ──────────────────────────────────────────────────────────────────────────
# CHECK 2: Базовое извлечение параметров займа
# ──────────────────────────────────────────────────────────────────────────
  - id: loan_subject_extraction
    name: "Предмет займа: сумма, валюта, срок, процентность, способ передачи и возврата"
    description: >
      Фактографическая проверка ключевых параметров займа: предмет (деньги/вещи),
      сумма/количество, валюта, процентность, ставка, срок возврата,
      способ передачи и возврата.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "займодавец"
        - "заемщик"
        - "сумма займа"
        - "проценты"
        - "срок возврата"
        - "беспроцентный"
        - "переданы"
        - "обязуется возвратить"
        - "возвратить сумму займа"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)(займодавец|заемщик|договор\\s+займа)"
        - "(?i)\\b\\d[\\d\\s]*(?:руб|рублей|₽|коп|тыс|млн|млрд)\\b"
        - "(?i)\\b\\d+(?:[.,]\\d+)?\\s*%\\b"
        - "(?i)сумм[ауы]\\s+за[её]ма"
        - "(?i)обязуетс[яь]\\s+возврат"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор займа (§ 1 Главы 42 ГК РФ, ст. 807–810).
        Проверяется только один вопрос: предмет займа, сумма/количество,
        валюта, процентность, срок возврата, способ передачи и возврата.
        Нормативный ориентир:
        - ст. 807 ГК РФ — предмет договора займа
        - ст. 809 ГК РФ — проценты по договору займа
        - ст. 810 ГК РФ — обязанность возврата
        Важно:
        - Твоя задача — не оценивать серьёзность риска.
        - Только установить, что прямо есть в тексте договора, а чего прямо нет.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Предмет займа (деньги / вещи / смешанный).
        2. Сумму займа или количество вещей.
        3. Валюту обязательства.
        4. Процентность (процентный / беспроцентный).
        5. Процентную ставку.
        6. Срок возврата.
        7. Способ передачи займа.
        8. Способ возврата займа.
        9. Прямую обязанность заёмщика возвратить предмет займа.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Если данные не указаны прямо — возвращай "not_defined".
        3. Если текстового значения нет — возвращай "Данные не определены".
        4. Не используй "None", "null", "not_defined" или пустые строки.
        5. В evidence включай только текст договора.
        6. Верни только один JSON-объект.

        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1:
        Фрагмент:
        "Займодавец передаёт Заёмщику денежные средства в размере 5 000 000 рублей.
        Заём является процентным, ставка — 12% годовых. Срок возврата — не позднее
        31.12.2026. Средства перечислены на расчётный счёт Заёмщика. Возврат —
        безналичным переводом. Заёмщик обязуется возвратить сумму займа."
        Ответ:
        {
          "loan_kind": "money",
          "loan_amount_status": "defined",
          "loan_amount_value": "5 000 000 рублей",
          "currency": "RUB",
          "interest_status": "interest_bearing",
          "interest_rate": "12% годовых",
          "repayment_term_status": "defined",
          "repayment_term_value": "не позднее 31.12.2026",
          "transfer_method": "bank_transfer",
          "repayment_method": "bank_transfer",
          "repayment_obligation_status": "defined",
          "repayment_obligation_details": "Заёмщик обязуется возвратить сумму займа",
          "evidence": [
            {
              "clause_ref": "п. 1.1",
              "quote": "Займодавец передаёт Заёмщику денежные средства в размере 5 000 000 рублей."
            }
          ]
        }

        Пример 2:
        Фрагмент:
        "Стороны заключили настоящий договор займа."
        Ответ:
        {
          "loan_kind": "not_defined",
          "loan_amount_status": "not_defined",
          "loan_amount_value": "Данные не определены",
          "currency": "not_defined",
          "interest_status": "not_defined",
          "interest_rate": "Данные не определены",
          "repayment_term_status": "not_defined",
          "repayment_term_value": "Данные не определены",
          "transfer_method": "not_defined",
          "repayment_method": "not_defined",
          "repayment_obligation_status": "not_defined",
          "repayment_obligation_details": "Данные не определены",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о предмете займа.
        2. Найди прямую цитату о сумме/количестве.
        3. Найди прямую цитату о процентности и ставке.
        4. Найди прямую цитату о сроке возврата.
        5. Найди прямую цитату об обязанности возврата.
        6. Если прямой цитаты нет — верни "not_defined".
        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        {
          "loan_kind": "<money / fungible_goods / mixed / not_defined>",
          "loan_amount_status": "<defined / not_defined>",
          "loan_amount_value": "<сумма/количество или 'Данные не определены'>",
          "currency": "<RUB / USD / EUR / other / not_defined>",
          "interest_status": "<interest_bearing / interest_free / not_defined>",
