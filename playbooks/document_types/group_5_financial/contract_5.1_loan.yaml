  - id: multiple_tranches_check
    name: "Траншевый заём: лимит, порядок выдачи, револьверность (кредитная линия)"
    description: >
      Фактографическая проверка условий поэтапного предоставления займа:
      общий лимит траншей, процедура запроса каждого транша, возможность
      повторного использования лимита (револьверная кредитная линия),
      условия выдачи траншей (отсутствие дефолта, отчётность).
      Критично для оценки ликвидности и гибкости финансирования.
    triggers:
      any: ["multiple_tranches", "installment_repayment"]
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "транш"
        - "поэтапное предоставление"
        - "лимит займа"
        - "частями"
        - "заявка на транш"
        - "возобновляемый"
        - "револьверный"
        - "кредитная линия"
        - "лимит выдачи"
        - "повторное использование"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)транш"
        - "(?i)в\\s+пределах\\s+лимита"
        - "(?i)поэтапн(ое|ого)\\s+предоставлен"
        - "(?i)возобновляем(ый|ая|ое)"
        - "(?i)кредитн(ая|ого)\\s+лини"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется траншевый заём / кредитная линия.
        Проверяются условия поэтапного предоставления займа: лимит,
        порядок запроса транша, револьверность, условия выдачи.

        Нормативный ориентир:
        - ст. 807 ГК РФ — договор займа (общая конструкция);
        - ст. 421 ГК РФ — свобода договора: траншевый заём / кредитная
          линия реализуются через свободное согласование условий
          (отдельной статьи о кредитной линии в ГК РФ нет);
        - ст. 819 ГК РФ — кредитный договор (для банковских кредитных
          линий дополнительно применяется);
        - банковская практика: возобновляемая кредитная линия
          (револьверная) позволяет повторно выбирать возвращённые суммы
          в пределах лимита;
        - невозобновляемая кредитная линия — после выдачи транша лимит
          уменьшается, повторная выдача невозможна.

        Важно:
        - Твоя задача — установить фактические условия договора.
        - Не выдумывай лимиты, сроки или условия выдачи.
        - Если заём не траншевый — верни «Не применимо».

        [ЗАДАЧА]
        Найди в тексте договора (обычно раздел «Порядок предоставления займа»):
        1. Общий лимит займа (сумма всех траншей).
        2. Порядок запроса транша (заявка, уведомление, срок).
        3. Револьверность (возможность повторного использования лимита).
        4. Условия выдачи транша (отсутствие дефолта, отчётность, KPI).

        [ПРАВИЛА]
        1. Используй только текст документа. Не выдумывай лимиты или сроки.
        2. Если в договоре нет условий траншевой выдачи (заём единовременный):
           - total_limit_status = "not_applicable";
           - total_limit_value = "Не применимо";
           - total_limit_display = "Не применимо (заём выдаётся единовременно)";
           - tranche_request_procedure_status = "not_applicable";
           - tranche_request_procedure_display = "Не применимо";
           - revolving = "not_applicable";
           - revolving_display = "Не применимо";
           - tranche_conditions_status = "not_applicable";
           - tranche_conditions_display = "Не применимо".
        3. Если лимит указан, но процедура запроса не определена —
           tranche_request_procedure_display = "Не определена (риск задержки выдачи)".
        4. Если револьверность не указана — revolving_display = "Не установлено".
        5. Если условия выдачи транша не описаны —
           tranche_conditions_display = "Не описаны (риск отказа в выдаче)".
        6. Если упоминается «выдача частями / по мере необходимости» без
           лимита и без процедуры — это не полноценный траншевый заём:
           - total_limit_status = "not_defined";
           - total_limit_display = "Не установлен";
           - tranche_request_procedure_status = "not_defined";
           - tranche_request_procedure_display = "Не определена (риск задержки выдачи)".
        7. Запрещены значения: null, None, пустые строки — не используй
           их никогда. Допустимые fallback-значения: "not_defined",
           "not_applicable", "Не установлен", "Не применимо",
           "Не определена".
        8. В evidence включай только дословные цитаты из текста договора.
        9. Верни РОВНО один JSON-объект со всеми 10 ключами без какого-либо
           дополнительного текста до или после. Начни ответ сразу
           с открывающей фигурной скобки и закончи закрывающей. НЕ пиши
           Markdown, списки, код-фенсы. Ответ должен быть валидным JSON,
           пригодным для парсинга через json.loads без предварительной
           обработки.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — возобновляемая кредитная линия (револьверная):
        Фрагмент:
        "2.1. Общий лимит займа составляет 100 000 000 (Сто миллионов) рублей.
        2.2. Заёмщик направляет письменную заявку на транш не менее чем
        за 5 рабочих дней до даты получения средств.
        2.3. Заём является возобновляемым: суммы, возвращённые Заёмщиком,
        могут быть повторно выбраны в пределах общего лимита."
        Ответ:
        {
          "total_limit_status": "defined",
          "total_limit_value": "100 000 000 рублей",
          "total_limit_display": "100 000 000 рублей",
          "tranche_request_procedure_status": "defined",
          "tranche_request_procedure_display": "Письменная заявка за 5 рабочих дней",
          "revolving": "yes",
          "revolving_display": "Возобновляемая кредитная линия (повторное использование лимита)",
          "tranche_conditions_status": "not_defined",
          "tranche_conditions_display": "Не описаны (риск отказа в выдаче)",
          "evidence": [
            {
              "clause_ref": "п. 2.1",
              "quote": "Общий лимит займа составляет 100 000 000 (Сто миллионов) рублей."
            },
            {
              "clause_ref": "п. 2.2",
              "quote": "Заёмщик направляет письменную заявку на транш не менее чем за 5 рабочих дней до даты получения средств."
            },
            {
              "clause_ref": "п. 2.3",
              "quote": "Заём является возобновляемым: суммы, возвращённые Заёмщиком, могут быть повторно выбраны в пределах общего лимита."
            }
          ]
        }

        Пример 2 — невозобновляемая кредитная линия:
        Фрагмент:
        "3.1. Лимит выдачи займа — 50 000 000 рублей. Выдача осуществляется
        тремя равными траншами. После выдачи транша лимит уменьшается
        на сумму выданного транша."
        Ответ:
        {
          "total_limit_status": "defined",
          "total_limit_value": "50 000 000 рублей",
          "total_limit_display": "50 000 000 рублей",
          "tranche_request_procedure_status": "not_defined",
          "tranche_request_procedure_display": "Не определена (риск задержки выдачи)",
          "revolving": "no",
          "revolving_display": "Невозобновляемая (лимит уменьшается после выдачи)",
          "tranche_conditions_status": "not_defined",
          "tranche_conditions_display": "Не описаны (риск отказа в выдаче)",
          "evidence": [
            {
              "clause_ref": "п. 3.1",
              "quote": "Лимит выдачи займа — 50 000 000 рублей. Выдача осуществляется тремя равными траншами. После выдачи транша лимит уменьшается на сумму выданного транша."
            }
          ]
        }

        Пример 3 — транш с условиями выдачи (отсутствие дефолта, отчётность):
        Фрагмент:
        "4.1. Общий лимит — 200 000 000 рублей.
        4.2. Каждый транш выдаётся при условии отсутствия просроченной
        задолженности и предоставления квартальной финансовой отчётности.
        4.3. Заявка на транш подаётся за 10 рабочих дней."
        Ответ:
        {
          "total_limit_status": "defined",
          "total_limit_value": "200 000 000 рублей",
          "total_limit_display": "200 000 000 рублей",
          "tranche_request_procedure_status": "defined",
          "tranche_request_procedure_display": "Заявка за 10 рабочих дней",
          "revolving": "not_defined",
          "revolving_display": "Не установлено",
          "tranche_conditions_status": "defined",
          "tranche_conditions_display": "При отсутствии дефолта и предоставлении отчётности",
          "evidence": [
            {
              "clause_ref": "п. 4.1",
              "quote": "Общий лимит — 200 000 000 рублей."
            },
            {
              "clause_ref": "п. 4.2",
              "quote": "Каждый транш выдаётся при условии отсутствия просроченной задолженности и предоставления квартальной финансовой отчётности."
            },
            {
              "clause_ref": "п. 4.3",
              "quote": "Заявка на транш подаётся за 10 рабочих дней."
            }
          ]
        }

        Пример 4 — заём не траншевый (единовременная выдача):
        Фрагмент:
        "1.1. Займодавец передаёт Заёмщику денежные средства в размере
        10 000 000 рублей в день подписания договора."
        (нет упоминаний о траншах, лимите, кредитной линии)
        Ответ:
        {
          "total_limit_status": "not_applicable",
          "total_limit_value": "Не применимо",
          "total_limit_display": "Не применимо (заём выдаётся единовременно)",
          "tranche_request_procedure_status": "not_applicable",
          "tranche_request_procedure_display": "Не применимо",
          "revolving": "not_applicable",
          "revolving_display": "Не применимо",
          "tranche_conditions_status": "not_applicable",
          "tranche_conditions_display": "Не применимо",
          "evidence": []
        }

        Пример 5 — текст есть, но надёжный вывод сделать нельзя
        (уклончивая формулировка без лимита и процедуры):
        Фрагмент:
        "1.4. Заём предоставляется частями по мере необходимости
        на основании устных договорённостей Сторон."
        (упоминается выдача «частями», но нет лимита, процедуры запроса
        и револьверности)
        Ответ:
        {
          "total_limit_status": "not_defined",
          "total_limit_value": "Не установлен",
          "total_limit_display": "Не установлен",
          "tranche_request_procedure_status": "not_defined",
          "tranche_request_procedure_display": "Не определена (риск задержки выдачи)",
          "revolving": "not_defined",
          "revolving_display": "Не установлено",
          "tranche_conditions_status": "not_defined",
          "tranche_conditions_display": "Не описаны (риск отказа в выдаче)",
          "evidence": [
            {
              "clause_ref": "п. 1.4",
              "quote": "Заём предоставляется частями по мере необходимости на основании устных договорённостей Сторон."
            }
          ]
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату об общем лимите займа.
        2. Найди прямую цитату о процедуре запроса транша (срок, форма
           заявки).
        3. Найди упоминание револьверности (возобновляемый /
           невозобновляемый).
        4. Найди условия выдачи транша (дефолт, отчётность, KPI).
        5. Если заём не траншевый — верни «Не применимо» для всех полей.
        6. Если упоминается только «выдача частями» без лимита и процедуры —
           все status = "not_defined" (не «not_applicable»).
        7. Проверь, что все 10 ключей (9 полей + evidence) присутствуют
           в JSON.
        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь РОВНО одним JSON-объектом без какого-либо дополнительного
        текста до или после, со всеми 10 ключами:
        {
          "total_limit_status": "<defined / not_defined / not_applicable>",
          "total_limit_value": "<сумма или 'Не применимо' / 'Не установлен'>",
          "total_limit_display": "<N рублей / Не установлен / Не применимо (заём выдаётся единовременно)>",
          "tranche_request_procedure_status": "<defined / not_defined / not_applicable>",
          "tranche_request_procedure_display": "<Заявка за N рабочих дней / Письменное уведомление / Не определена (риск задержки выдачи) / Не применимо>",
          "revolving": "<yes / no / not_defined / not_applicable>",
          "revolving_display": "<Возобновляемая кредитная линия (повторное использование лимита) / Невозобновляемая (лимит уменьшается после выдачи) / Не установлено / Не применимо>",
          "tranche_conditions_status": "<defined / not_defined / not_applicable>",
          "tranche_conditions_display": "<При отсутствии дефолта и предоставлении отчётности / Без условий / Не описаны (риск отказа в выдаче) / Не применимо>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 8
      temperature: 0.0
      max_tokens: 800
    retrieval:
      retrieval_profile: "credit_facility_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "транш поэтапное предоставление лимит займа частями заявка на транш возобновляемый револьверный кредитная линия лимит выдачи повторное использование кредитный договор"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - procedures
      negative_keywords:
        - "проценты по займу"
        - "процентная ставка"
        - "неустойка за просрочку"
        - "обеспечение исполнения"
        - "аффилированность"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.10, 0.65]
        boost: 0.18
        scope: segment
      context_k: 8
      max_chunks: 10
      rerank: true
    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - obligations
        - procedures
      confidence_bonus_on_match: 0.12
      confidence_penalty_on_excluded_segment: 0.15
    evidence:
      required: true
      min_snippet_length: 35
      max_snippet_length: 600
    extraction:
      store_payload: true

      enabled: true
      mode: "hybrid"
      compact_output: false
      llm_max_tokens: 1200
      llm_prompt_extraction: |
        <role>
        Ты — российский юрист по договорной работе. Извлеки из текста
        траншевого займа условия поэтапной выдачи: общий лимит, процедуру
        запроса транша, револьверность, условия выдачи (ст. 807, 421, 819
        ГК РФ, банковская практика кредитных линий).
        Не анализируй проценты по ст. 809 ГК РФ или общую ответственность.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие 9 полей + evidence (всего 10 ключей).
        Верни все ключи, даже если данные отсутствуют.

        1.  total_limit_status — "defined" / "not_defined" / "not_applicable":
              - "defined" — лимит прямо указан в договоре;
              - "not_defined" — упоминается транш / выдача частями,
                но лимит не указан;
              - "not_applicable" — заём не траншевый (единовременная
                выдача).
        2.  total_limit_value — сумма лимита, "Не установлен"
            или "Не применимо".
        3.  total_limit_display — user-facing строка:
              - "N рублей" — если лимит указан;
              - "Не установлен" — если транш есть, но лимит не указан;
              - "Не применимо (заём выдаётся единовременно)" — если
                не траншевый.
        4.  tranche_request_procedure_status — "defined" / "not_defined" /
            "not_applicable".
        5.  tranche_request_procedure_display — user-facing строка:
              - "Заявка за N рабочих дней" — если срок указан;
              - "Письменное уведомление" — если форма указана без срока;
              - "Не определена (риск задержки выдачи)" — если процедура
                не описана;
              - "Не применимо" — если не траншевый.
        6.  revolving — "yes" / "no" / "not_defined" / "not_applicable":
              - "yes" — прямо указана возобновляемость / револьверность;
              - "no" — прямо указано, что лимит уменьшается /
                невозобновляемый;
              - "not_defined" — не указано;
              - "not_applicable" — заём не траншевый.
        7.  revolving_display — user-facing строка:
              - "Возобновляемая кредитная линия (повторное использование
                лимита)";
              - "Невозобновляемая (лимит уменьшается после выдачи)";
              - "Не установлено";
              - "Не применимо".
        8.  tranche_conditions_status — "defined" / "not_defined" /
            "not_applicable".
        9.  tranche_conditions_display — user-facing строка:
              - "При отсутствии дефолта и предоставлении отчётности" —
                если условия есть;
              - "Без условий" — если прямо указано отсутствие условий;
              - "Не описаны (риск отказа в выдаче)" — если условия
                не описаны;
              - "Не применимо" — если не траншевый.

        Дополнительно — обязательный массив evidence:
        - цитаты с условиями траншевой выдачи (лимит, процедура,
          револьверность, условия);
        - пустой массив [], если заём не траншевый.

        Правила заполнения при отсутствии данных:
        - Если заём не траншевый — все status = "not_applicable",
          все display = "Не применимо";
        - Если упоминается только «выдача частями» без лимита
          и процедуры — все status = "not_defined" (не «not_applicable»).
        </task>

        <rules>
        - Используй только текст договора. Не выдумывай лимиты, сроки
          или условия.
        - Не используй null, None или пустые строки — только явные
          fallback-значения ("not_defined" / "not_applicable" /
          "Не установлен" / "Не применимо" / "Не определена").
        - Распознавай синонимы: кредитная линия, лимит выдачи,
          поэтапное финансирование.
        - Различай:
            - полноценный траншевый заём (лимит + процедура) — status
              по каждому полю отдельно;
            - «выдача частями по мере необходимости» без лимита
              и процедуры — total_limit_status = "not_defined",
              tranche_request_procedure_status = "not_defined";
            - единовременная выдача — все status = "not_applicable".
        - Если в документе несколько редакций условий — использовать
          последнюю по тексту.
        - Верни РОВНО один JSON-объект со всеми 10 ключами
          без какого-либо дополнительного текста до или после.
          Начни ответ сразу с открывающей фигурной скобки и закончи
          закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ
          должен быть валидным JSON, пригодным для парсинга через
          json.loads без предварительной обработки.
        </rules>
      fields:
        - name: "total_limit_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined", "not_applicable"]
          description: "Статус определения общего лимита займа (raw enum)."
          required: true
          display_in_grid: false
        - name: "total_limit_value"
          type: "string"
          presentation: "fact"
          label: "Лимит займа (значение)"
          description: "Сумма общего лимита траншей."
          required: true
          display_in_grid: false
        - name: "total_limit_display"
          type: "string"
          presentation: "fact"
          label: "Общий лимит"
          description: "User-facing общий лимит траншевого займа."
          required: true
          display_in_grid: true
          display_priority: 1
        - name: "tranche_request_procedure_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined", "not_applicable"]
          description: "Статус порядка запроса транша (raw enum)."
          required: true
          display_in_grid: false
        - name: "tranche_request_procedure_display"
          type: "string"
          presentation: "fact"
          label: "Порядок запроса транша"
          description: "User-facing процедура запроса каждого транша."
          required: true
          display_in_grid: true
          display_priority: 2
        - name: "revolving"
          type: "string"
          presentation: "signal"
          allowed_values: ["yes", "no", "not_defined", "not_applicable"]
          description: "Револьверность займа (raw enum)."
          required: true
