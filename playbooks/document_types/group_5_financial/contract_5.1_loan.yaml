          required: true
          display_in_grid: true
          display_priority: 5
        - name: "borrower_signatory"
          type: "string"
          presentation: "fact"
          label: "Подписант заёмщика (ФИО/должность)"
          description: "ФИО и должность подписанта от заёмщика."
          required: true
          display_in_grid: false
        - name: "borrower_signatory_basis_code"
          type: "string"
          presentation: "signal"
          allowed_values: ["charter", "poa", "order", "personal", "other", "not_defined"]
          description: "Основание полномочий подписанта заёмщика (raw enum)."
          required: true
          display_in_grid: false
        - name: "borrower_signatory_basis_details"
          type: "string"
          presentation: "fact"
          label: "Основание полномочий заёмщика (детали)"
          description: "Номер и дата доверенности/приказа, если указаны."
          required: true
          display_in_grid: false
        - name: "borrower_signatory_display"
          type: "string"
          presentation: "fact"
