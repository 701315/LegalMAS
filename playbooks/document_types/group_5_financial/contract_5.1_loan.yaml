        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о передаче средств (фактическая передача
           или обещание).
        2. Найди прямую цитату о внешнем подтверждающем документе
           (расписка / платёжка / акт).
        3. Найди прямую цитату о способе передачи (наличные / безнал).
        4. Определи тип подтверждения:
             - receipt / payment_order / act — при наличии внешнего документа;
             - contract_clause — при указании на передачу только в тексте;
             - not_defined — при обещании займа или отсутствии данных.
        5. Проверь согласованность status и type:
             - если type ∈ {receipt, payment_order, act} → status = "defined";
             - если type ∈ {contract_clause, not_defined} → status = "not_defined".
        6. Определи риск безденежности:
             - безнал + платёжка → low;
             - наличные + расписка/акт → medium;
             - наличные без внешнего подтверждения → high;
             - обещание займа → not_applicable;
             - способ не определён → not_defined.
        7. Согласуй raw enum и display:
             transfer_evidence_type -> transfer_evidence_type_display:
               "receipt" -> "Расписка";
               "payment_order" -> "Платёжное поручение";
               "act" -> "Акт передачи";
               "contract_clause" -> "Указание в договоре";
               "not_defined" (обещание займа) -> "Не определено (обещание займа)";
               "not_defined" (нет данных) -> "Не определено".
             cash_transfer_risk -> transfer_risk_display:
               "high" -> "Высокий риск безденежности (наличная передача без расписки/акта)";
               "medium" -> "Средний риск (наличная передача с распиской)" или
                 "Средний риск (наличная передача с актом)";
               "low" -> "Низкий риск (безналичная передача)";
               "not_applicable" -> "Не применимо (передача ещё не состоялась)";
               "not_defined" -> "Не определён".
        8. Проверь, что все 8 ключей (7 полей + evidence) присутствуют
           в JSON.
        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь РОВНО одним JSON-объектом без какого-либо дополнительного
        текста до или после, со всеми 8 ключами:
        {
          "transfer_evidence_status": "<defined / not_defined>",
          "transfer_evidence_details": "<формулировка о подтверждении, указании или обещании займа>",
          "transfer_evidence_type": "<receipt / payment_order / act / contract_clause / not_defined>",
          "transfer_evidence_type_display": "<Расписка / Платёжное поручение / Акт передачи / Указание в договоре / Не определено (обещание займа) / Не определено>",
          "transfer_at_signing_status": "<defined / not_defined>",
          "cash_transfer_risk": "<high / medium / low / not_applicable / not_defined>",
          "transfer_risk_display": "<Высокий риск безденежности (…) / Средний риск (…) / Низкий риск (…) / Не применимо (…) / Не определён>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 8
      temperature: 0.0
      max_tokens: 800
    retrieval:
      retrieval_profile: "payment_terms_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "передача займа расписка платежное поручение переданы получены зачислены на счет акт передачи подтверждение обещание займа траншами график"
