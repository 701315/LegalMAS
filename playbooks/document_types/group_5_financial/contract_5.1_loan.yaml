          required: true
          display_in_grid: true
          display_priority: 1
        - name: "economic_purpose_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус указания на деловую цель сделки (raw enum)."
          required: true
          display_in_grid: false
        - name: "economic_purpose_display"
          type: "string"
          presentation: "fact"
          label: "Деловая цель сделки"
          description: "User-facing указание на деловую цель / экономический смысл займа."
          required: true
          display_in_grid: true
          display_priority: 2

  - id: convertible_loan_check
    name: "Конвертируемый заём: условия конвертации в долю/акции (ст. 429.3 ГК РФ)"
    description: >
      Фактографическая проверка условий конвертации займа в долю участия
      (ООО) или акции (АО) общества: событие конвертации (триггер), формула
      расчёта доли, наличие кэпа оценки или дисконта, требуемые корпоративные
      действия (увеличение УК, внесение в ЕГРЮЛ).
      Критично для оценки исполнимости права конвертации и риска
      корпоративных споров.
    triggers:
      any: ["convertible_loan"]
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "конвертируемый заем"
        - "конвертируемый заём"
        - "конвертация в долю"
        - "право конвертации"
        - "опцион"
        - "в счет оплаты доли"
        - "в счёт оплаты доли"
        - "увеличение уставного капитала"
        - "оценка компании"
        - "кэп"
        - "дисконт"
        - "SAFE"
        - "раунд финансирования"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)конвертируем(ый|ого|ому)\\s+за[её]м"
        - "(?i)конвертац(ия|ии|ию)\\s+в\\s+дол"
        - "(?i)опцион\\s+на\\s+(долю|акции)"
        - "(?i)оценк[аы].{0,30}(компани|обществ)"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется конвертируемый заём.
        Правовая конструкция в РФ:
        - ст. 429.3 ГК РФ — опцион на заключение договора (право одной стороны
          заключить договор в будущем на заранее согласованных условиях);
        - ст. 409 ГК РФ — прекращение обязательства отступным (зачёт доли
          в уставном капитале в счёт погашения займа);
        - ст. 414 ГК РФ — прекращение обязательства новацией (замена
          обязательства займа на обязательство по оплате доли).
        Проверяются условия конвертации займа в долю (для ООО) или акции
        (для АО) общества.

        Нормативный ориентир:
        - ст. 19, 21 14-ФЗ — увеличение уставного капитала ООО требует
          решения общего собрания, участники имеют преимущественное право
          покупки доли;
        - ФЗ-208 «Об акционерных обществах» — эмиссия акций, увеличение
          уставного капитала АО;
        - Практика РФ: прямой институт «конвертируемого займа» в ГК РФ
          отсутствует, используется конструкция опциона или отступного.
          Иностранная конструкция SAFE в РФ напрямую не применяется —
          требует пересборки через опцион или отступное.

        Важно:
        - Твоя задача — установить фактические условия договора.
        - Не выдумывай условия конвертации, если их нет в тексте.
        - Если заём не конвертируемый — верни «Не применимо».

        [ЗАДАЧА]
        Найди в тексте договора (обычно раздел «Конвертация» или «Опцион»):
        1. Событие конвертации (триггер): по требованию / при раунде /
           по истечении срока.
        2. Формула расчёта доли (процент доли за сумму займа / количество
           акций).
        3. Наличие кэпа оценки (valuation cap) или дисконта к следующему раунду.
        4. Описание корпоративных действий (увеличение УК, внесение в ЕГРЮЛ,
           оценка доли, эмиссия).

        [ПРАВИЛА]
        1. Используй только текст документа. Не выдумывай кэп, дисконт
           или формулы.
        2. Если в договоре нет условий конвертации (заём обычный,
           не конвертируемый):
           - conversion_trigger = "not_applicable";
           - conversion_trigger_display = "Не применимо (заём без права конвертации)";
           - conversion_formula_status = "not_applicable";
           - conversion_formula_display = "Не применимо";
           - valuation_cap_or_discount_status = "not_applicable";
           - valuation_cap_display = "Не применимо";
           - corporate_actions_status = "not_applicable";
           - corporate_actions_display = "Не применимо".
        3. Если триггер конвертации указан, но формула не определена —
           conversion_formula_display = "Не определена (риск корпоративного спора)".
        4. Если кэп/дисконт не указан — valuation_cap_display = "Не установлен".
        5. Если корпоративные действия не описаны —
           corporate_actions_display = "Не описаны (риск неисполнимости конвертации)".
        6. Дихотомия организационно-правовой формы:
           - для ООО конвертация идёт в «доли» уставного капитала;
           - для АО — в «акции».
           Если форма Заёмщика из текста неясна — используй нейтральную
           формулировку «доли / акции». Не называй акции у ООО.
        7. Запрещены значения: null, None, пустые строки — не используй
           их никогда. Допустимые fallback-значения: "not_defined",
           "not_applicable", "Не установлено", "Не применимо",
           "Не определена".
        8. В evidence включай только дословные цитаты из текста договора.
        9. Верни РОВНО один JSON-объект со всеми 9 ключами без какого-либо
           дополнительного текста до или после. Начни ответ сразу
           с открывающей фигурной скобки и закончи закрывающей. НЕ пиши
           Markdown, списки, код-фенсы. Ответ должен быть валидным JSON,
           пригодным для парсинга через json.loads без предварительной
           обработки.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — полная конвертация (триггер, формула, кэп, корпоративные действия):
        Фрагмент:
        "6.1. Займодавец вправе потребовать конвертации суммы займа в долю
        в уставном капитале Заёмщика в размере 10% при проведении следующего
        раунда финансирования.
        6.2. Оценка компании для целей конвертации не превышает 50 000 000 рублей
        (valuation cap).
        6.3. Конвертация оформляется решением общего собрания об увеличении
        уставного капитала и внесением изменений в ЕГРЮЛ в течение 30 дней."
