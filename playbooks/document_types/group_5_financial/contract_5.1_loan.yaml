  - id: loan_subject_and_amount
    name: "Предмет и сумма займа"
    description: >
      Фактографическая проверка предмета займа (деньги / вещи), суммы/количества
      и валюты обязательства. Ключевые параметры для квалификации займа
      по ст. 807 ГК РФ и оценки валютных ограничений (173-ФЗ).
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "сумма займа"
        - "размер займа"
        - "предмет займа"
        - "денежные средства"
        - "вещи"
        - "валюта"
        - "рубли"
        - "доллары"
        - "евро"
        - "передаёт"
        - "передает"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)\\b\\d[\\d\\s]*(?:руб|рублей|₽|коп|тыс|млн|млрд)\\b"
        - "(?i)\\b\\d[\\d\\s]*(?:USD|долларов|евро|EUR)\\b"
        - "(?i)сумм[ауы]\\s+за[её]ма"
        - "(?i)размер\\s+за[её]ма"
        - "(?i)предмет\\s+за[её]ма"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор займа (§ 1 Главы 42 ГК РФ, ст. 807).
        Проверяется только один вопрос: предмет займа (деньги или вещи),
        сумма/количество и валюта обязательства.

        Нормативный ориентир:
        - ст. 807 ГК РФ — предмет договора займа (деньги или вещи,
          определённые родовыми признаками);
        - 173-ФЗ «О валютном регулировании» — ограничения на валютные займы
          между резидентами РФ.

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора.
        - Не оценивай серьёзность риска и не делай выводов сверх текста.

        [ЗАДАЧА]
        Найди в тексте договора (обычно п. 1 «Предмет договора»):
        1. Предмет займа (деньги / вещи / смешанный).
        2. Сумму займа или количество вещей.
        3. Валюту обязательства.

        [ПРАВИЛА]
        1. Используй только текст документа. Не выдумывай суммы, валюты.
        2. Если данные не указаны прямо:
           - для статусных полей (*_status) возвращай "not_defined";
           - для текстовых полей (*_value, *_display) возвращай "Не установлено".
        3. Запрещены значения: null, None, пустые строки — не используй
           их никогда. Допустимые fallback-значения: "not_defined",
           "not_applicable", "Не установлено".
        4. Если сумма/валюта определяется через приложение/спецификацию —
           верни формулировку "Согласно Приложению № N" или аналогичную
           в loan_amount_value и currency_display. Не возвращай "not_defined".
        5. Если в документе несколько редакций условий о сумме (например,
           черновой пункт и финальный) — использовать последнюю по позиции.
        6. Для вещевого займа (редкий случай) — указать род/количество вещей.
           Приоритет: если loan_kind = "fungible_goods", то currency
           = "not_applicable" (не "not_defined").
        7. В evidence включай только дословные цитаты из текста договора.
        8. Верни РОВНО один JSON-объект со всеми 7 ключами без какого-либо
           дополнительного текста до или после. Начни ответ сразу
           с открывающей фигурной скобки и закончи закрывающей. НЕ пиши
           Markdown, списки, код-фенсы. Ответ должен быть валидным JSON,
           пригодным для парсинга через json.loads без предварительной
           обработки.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — денежный заём в рублях:
        Фрагмент:
        "1.1. Займодавец передаёт Заёмщику денежные средства в размере
        5 000 000 (Пять миллионов) рублей. Сумма займа перечисляется
        на расчётный счёт Заёмщика."
        Ответ:
        {
          "loan_kind": "money",
          "loan_kind_display": "Денежный заём",
          "loan_amount_status": "defined",
          "loan_amount_value": "5 000 000 (Пять миллионов) рублей",
          "currency": "RUB",
          "currency_display": "Рубли РФ",
          "evidence": [
            {
              "clause_ref": "п. 1.1",
              "quote": "Займодавец передаёт Заёмщику денежные средства в размере 5 000 000 (Пять миллионов) рублей."
            }
          ]
        }

        Пример 2 — денежный заём в долларах США:
        Фрагмент:
        "Предмет договора: передача Займодавцем Заёмщику 100 000 (Сто тысяч)
        долларов США. Валюта займа — USD."
        Ответ:
        {
          "loan_kind": "money",
          "loan_kind_display": "Денежный заём",
          "loan_amount_status": "defined",
          "loan_amount_value": "100 000 (Сто тысяч) долларов США",
          "currency": "USD",
          "currency_display": "Доллары США",
          "evidence": [
            {
              "clause_ref": "п. 1.1",
              "quote": "Предмет договора: передача Займодавцем Заёмщику 100 000 (Сто тысяч) долларов США."
            }
          ]
        }

        Пример 3 — вещевой заём (редкий случай):
        Фрагмент:
        "Займодавец передаёт Заёмщику 500 (Пятьсот) мешков пшеницы
        сорта «Московская 39», масса каждого мешка — 50 кг."
        Ответ:
        {
          "loan_kind": "fungible_goods",
          "loan_kind_display": "Заём вещей",
          "loan_amount_status": "defined",
          "loan_amount_value": "500 мешков пшеницы сорта «Московская 39», по 50 кг каждый",
          "currency": "not_applicable",
          "currency_display": "Не применимо (вещевой заём)",
          "evidence": [
            {
              "clause_ref": "п. 1.1",
              "quote": "Займодавец передаёт Заёмщику 500 (Пятьсот) мешков пшеницы сорта «Московская 39», масса каждого мешка — 50 кг."
            }
          ]
        }

        Пример 4 — сумма и валюта определяются по приложению:
        Фрагмент:
        "Сумма займа и валюта определяются согласно Графику траншей
        (Приложение № 1 к настоящему договору)."
        Ответ:
        {
          "loan_kind": "money",
          "loan_kind_display": "Денежный заём",
          "loan_amount_status": "defined",
          "loan_amount_value": "Согласно Графику траншей (Приложение № 1)",
          "currency": "not_defined",
          "currency_display": "Согласно Графику траншей (Приложение № 1)",
          "evidence": [
            {
              "clause_ref": "п. 1.1",
              "quote": "Сумма займа и валюта определяются согласно Графику траншей (Приложение № 1 к настоящему договору)."
            }
          ]
        }

        Пример 5 — данные отсутствуют:
        Фрагмент:
        "Стороны заключили настоящий договор займа на условиях,
        изложенных ниже."
        Ответ:
        {
          "loan_kind": "not_defined",
          "loan_kind_display": "Не определён",
          "loan_amount_status": "not_defined",
          "loan_amount_value": "Не установлено",
          "currency": "not_defined",
          "currency_display": "Не установлено",
          "evidence": []
        }

        Пример 6 — текст есть, но надёжный вывод сделать нельзя
        (уклончивая формулировка про дополнительное соглашение):
        Фрагмент:
        "1.3. Сумма займа и валюта расчётов определяются Сторонами
        в дополнительном соглашении к настоящему Договору."
        (нет ни суммы, ни валюты в самом договоре, отсылка
        к будущему документу)
        Ответ:
        {
          "loan_kind": "money",
          "loan_kind_display": "Денежный заём",
          "loan_amount_status": "not_defined",
          "loan_amount_value": "Не установлено (определяется дополнительным соглашением)",
          "currency": "not_defined",
          "currency_display": "Не установлено (определяется дополнительным соглашением)",
          "evidence": [
            {
              "clause_ref": "п. 1.3",
              "quote": "Сумма займа и валюта расчётов определяются Сторонами в дополнительном соглашении к настоящему Договору."
            }
          ]
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о предмете займа (деньги/вещи).
        2. Найди прямую цитату о сумме/количестве.
        3. Найди прямую цитату о валюте (если денежный заём).
        4. Проверь дихотомию:
             loan_kind = "fungible_goods" -> currency = "not_applicable";
             loan_kind = "money" и валюта не указана -> currency = "not_defined".
        5. Проверь, что все 7 ключей (6 полей + evidence) присутствуют
           в JSON.
        6. Проверь, что *_display поля собраны из соответствующих raw enum.
        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь РОВНО одним JSON-объектом без какого-либо дополнительного
        текста до или после, со всеми 7 ключами:
        {
          "loan_kind": "<money / fungible_goods / mixed / not_defined>",
          "loan_kind_display": "<Денежный заём / Заём вещей / Смешанный заём / Не определён>",
          "loan_amount_status": "<defined / not_defined>",
          "loan_amount_value": "<сумма/количество / 'Не установлено' / 'Согласно Приложению № N' / 'Не установлено (определяется дополнительным соглашением)'>",
          "currency": "<RUB / USD / EUR / CNY / other / not_applicable / not_defined>",
          "currency_display": "<Рубли РФ / Доллары США / Евро / Юани КНР / Иная валюта / Не применимо (вещевой заём) / Не установлено / Согласно Приложению № N>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
