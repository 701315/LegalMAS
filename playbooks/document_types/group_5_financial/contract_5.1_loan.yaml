    extraction:
      store_payload: true

      enabled: true
      mode: "hybrid"
      compact_output: false
      llm_max_tokens: 1600
      llm_prompt_extraction: |
        <role>
        Ты — российский юрист по договорной работе. Извлеки из текста
        договора займа условия возврата: структуру погашения, право
        заёмщика на досрочный возврат, триггеры досрочного истребования
        займа займодавцем (акцелерацию), неустойку за просрочку
        и подтверждение погашения займа.
        Не анализируй расчет процентов по ст. 809 ГК РФ или предмет
        займа.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие 12 полей + evidence (всего 13 ключей).
        Верни все ключи, даже если данные отсутствуют.

        1.  repayment_structure — "single_payment" / "installments" /
            "on_demand" / "not_defined".
        2.  repayment_structure_display — user-facing строка:
              - "single_payment" -> "Единовременно в конце срока"
                (+ дата, если указана);
              - "installments" -> "В рассрочку (по графику платежей)";
              - "on_demand" -> "По требованию (ст. 810(1) ГК РФ)";
              - "not_defined" -> "Не определён (определяется
                дополнительным соглашением)".
        3.  early_repayment_by_borrower — "allowed" / "restricted" /
            "consent_required" / "not_defined":
              - "allowed" — прямо разрешён без согласия и комиссий,
                ЛИБО заём беспроцентный (по ст. 810(2) ГК РФ);
              - "restricted" — разрешён, но с комиссией / штрафом /
                заблаговременным уведомлением;
              - "consent_required" — прямо указано требование согласия
                займодавца ЛИБО договор процентного коммерческого займа
                молчит (ст. 810(2) ГК РФ);
              - "not_defined" — невозможно определить.
        4.  early_repayment_display — user-facing строка:
              - "Разрешён без ограничений (ст. 810(2) ГК РФ,
                беспроцентный заём)";
              - "Разрешён с уведомлением за N дней";
              - "Разрешён с комиссией (N% от суммы досрочного возврата)";
              - "Только с согласия займодавца (ст. 810(2) ГК РФ)";
              - "Запрещён договором";
              - "Не определено (определяется дополнительным соглашением)".
        5.  acceleration_right_status — "defined" (если есть прямо
            оговорённые триггеры) или "not_defined".
        6.  acceleration_right_details — точные основания досрочного
            истребования из договора или "Не установлено".
        7.  acceleration_right_display — user-facing краткая строка:
              - краткий перечень триггеров: "Предусмотрено (просрочка
                платежа, утрата обеспечения, нецелевое использование)";
              - "Не предусмотрено договором (действуют общие нормы
                ГК РФ)";
              - "Не применимо (заём по требованию)".
        8.  late_payment_penalty_status — "defined" или "not_defined".
        9.  late_payment_penalty_details — точная формулировка
            договорной неустойки / пени / штрафа или "Не установлено".
        10. late_payment_penalty_display — user-facing краткая строка:
              - "Пеня N% в день от суммы просрочки";
              - "Штраф N руб. + пеня N%";
              - "Не установлена (применяются проценты по ст. 395 ГК РФ)".
        11. repayment_confirmation_status — "defined" или "not_defined".
        12. repayment_confirmation_details — способ подтверждения
            возврата (расписка, выписка, акт) или "Не установлено".

        Дополнительно — обязательный массив evidence:
        - цитаты по каждому найденному условию (порядок погашения,
          досрочный возврат, акцелерация, пеня, подтверждение).

        Правила заполнения при отсутствии данных:
        - Если условие не указано в договоре — соответствующий status
          = "not_defined", details = "Не установлено";
        - Для late_payment_penalty_details при отсутствии неустойки —
          "Не установлено", display = "Не установлена (применяются
          проценты по ст. 395 ГК РФ)".
        </task>

        <rules>
        - Используй только текст договора. Не выдумывай неустойку
          или триггеры досрочного истребования.
        - Не используй null, None или пустые строки — только явные
          fallback-значения ("not_defined" / "Не установлено" /
          "Не предусмотрено договором").
        - Логика досрочного возврата заёмщиком:
            * БЕСПРОЦЕНТНЫЙ заём -> "allowed" (ст. 810(2) ГК РФ),
              если в тексте не установлено иное;
            * ПРОЦЕНТНЫЙ коммерческий заём (между юрлицами / ИП)
              при отсутствии в тексте пункта о досрочном возврате ->
              "consent_required" (ст. 810(2) ГК РФ);
            * если в тексте есть явные условия (разрешён / комиссия /
              уведомление / запрещён) — отражай строго по тексту.
        - Если договор не содержит условий об ответственности
          за просрочку:
            late_payment_penalty_status = "not_defined";
            late_payment_penalty_details = "Не установлено";
            late_payment_penalty_display = "Не установлена (применяются
              проценты по ст. 395 ГК РФ)".
        - Если в документе несколько редакций условий о возврате —
          использовать последнюю по тексту.
        - Верни РОВНО один JSON-объект со всеми 13 ключами
          без какого-либо дополнительного текста до или после.
          Начни ответ сразу с открывающей фигурной скобки и закончи
          закрывающей. НЕ пиши Markdown, списки, код-фенсы. Ответ
          должен быть валидным JSON, пригодным для парсинга через
          json.loads без предварительной обработки.
        </rules>
      fields:
        - name: "repayment_structure"
          type: "string"
          presentation: "signal"
          allowed_values: ["single_payment", "installments", "on_demand", "not_defined"]
          description: "Структура возврата займа (raw enum)."
          required: true
          display_in_grid: false
        - name: "repayment_structure_display"
