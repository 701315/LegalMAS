        {
          "transfer_evidence_status": "defined",
          "transfer_evidence_details": "Платёжное поручение с отметкой банка",
          "transfer_evidence_type": "payment_order",
          "transfer_evidence_type_display": "Платёжное поручение",
          "transfer_at_signing_status": "not_defined",
          "cash_transfer_risk": "low",
