    extraction:
      store_payload: true

      enabled: true
      mode: "hybrid"
      compact_output: false
      llm_max_tokens: 1400
      llm_prompt_extraction: |
        <role>
        Ты — российский юрист по договорной работе. Извлеки из текста
        договора займа сведения о процентности (процентный/беспроцентный),
        процентной ставке, базе начисления процентов и периодичности
        уплаты.
        Применяй презумпцию возмездности денежного займа по ст. 809(1)
        ГК РФ. Размер процентов — ключевая ставка Банка России,
        действовавшая в соответствующие периоды.
        Не анализируй сумму займа, срок возврата или иные темы — только
        проценты, ставку, базу и периодичность.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие 8 полей + evidence (всего 9 ключей).
        Верни все ключи, даже если данные отсутствуют.

        1.  interest_status — "interest_bearing" / "interest_free".
        2.  interest_status_display — user-facing строка:
              - "interest_bearing" -> "Процентный" (если ставка
                указана явно) или "Процентный (применяется ключевая
                ставка Банка России, действовавшая в соответствующие
                периоды, по ст. 809(1) ГК РФ)" (если ставка не указана,
                но и не сказано «беспроцентный»);
              - "interest_free" -> "Беспроцентный".
        3.  interest_rate — точная ставка (например, "12% годовых")
                           или "Не применимо (беспроцентный заём)"
                           или "Ставка не установлена (применяется
                             ключевая ставка Банка России, действовавшая
                             в соответствующие периоды, по ст. 809(1) ГК РФ)"
                           или "Ставка не установлена (определяется
                             дополнительным соглашением)"
                           или "Согласно Графику процентов (Приложение № N)".
        4.  interest_rate_display — краткая версия для DD Grid:
              - для явной ставки -> "12% годовых";
              - для беспроцентного -> "Не применимо";
              - для презумпции ст. 809 -> "Ключевая ставка Банка России
                (по умолчанию, ст. 809(1) ГК РФ)";
              - для допсоглашения -> "Не установлена (определяется
                дополнительным соглашением)";
              - для графика -> "Согласно Графику процентов (Приложение № N)".
        5.  calculation_base — "principal" / "outstanding_balance" /
            "not_applicable".
        6.  calculation_base_display — user-facing строка:
              - "principal" -> "На сумму займа";
              - "outstanding_balance" -> "На остаток задолженности"
                (если указано явно) или "На остаток задолженности
                (по умолчанию)" (если не указано);
              - "not_applicable" -> "Не применимо (беспроцентный заём)".
        7.  payment_frequency — "monthly" / "quarterly" / "at_maturity" /
            "other" / "not_applicable".
        8.  payment_frequency_display — user-facing строка:
              - "monthly" -> "Ежемесячно" (если указано явно) или
                "Ежемесячно (по умолчанию, ст. 809(3) ГК РФ)"
                (если не указано);
              - "quarterly" -> "Ежеквартально";
              - "at_maturity" -> "При возврате основного долга";
              - "other" -> "Иная периодичность (указать из текста)";
              - "not_applicable" -> "Не применимо (беспроцентный заём)".

        Дополнительно — массив evidence (может быть пустым [], если
        применяется презумпция ст. 809 и в тексте вообще нет упоминаний
        о процентах):
        - хотя бы одна цитата о процентности/ставке/базе/периодичности,
          если найдена.

        Логика заполнения (ст. 809(1) ГК РФ):
        - Если прямо указана ставка -> interest_bearing + конкретная
          ставка.
        - Если прямо сказано «беспроцентный» -> interest_free
          + "Не применимо".
        - Если НИ ставка, НИ «беспроцентный» не указаны ->
          interest_bearing + "Ставка не установлена (применяется
          ключевая ставка Банка России, действовавшая
          в соответствующие периоды, по ст. 809(1) ГК РФ)".
        - Если ставка отнесена к «дополнительному соглашению» (будущий
          документ), а не к существующему приложению -> interest_bearing
          + "Ставка не установлена (определяется дополнительным
          соглашением)".

        Логика заполнения базы начисления:
        - Если явно указано «на сумму займа» / «на основную сумму
          долга» -> principal.
        - Если явно указано «на остаток задолженности» / «на фактический
          остаток» / «на текущую задолженность» -> outstanding_balance.
        - Если база не указана явно и заём процентный -> outstanding_balance
          (стандарт российской практики, по умолчанию).
        - Если заём беспроцентный -> not_applicable.

        Логика заполнения периодичности уплаты:
        - Если явно указано «ежемесячно» -> monthly.
        - Если явно указано «ежеквартально» -> quarterly.
        - Если явно указано «при возврате займа» / «единовременно
          при возврате» -> at_maturity.
        - Если указана иная периодичность (еженедельно, раз в полгода
          и т.п.) -> other.
        - Если периодичность не указана и заём процентный -> monthly
          (по ст. 809(3) ГК РФ проценты выплачиваются ежемесячно
          до дня возврата суммы займа, если договором
          не предусмотрено иное).
        - Если заём беспроцентный -> not_applicable.

        Правила заполнения при отсутствии данных:
        - Если заём процентный, но ставка/база/периодичность не указаны —
          применяй презумпции ГК РФ (см. логику выше).
        </task>

        <rules>
        - Используй только текст договора. Не выдумывай ставки, базу,
          периодичность.
        - Не используй null, None или пустые строки — только явные
          fallback-значения ("not_defined" / "not_applicable" /
          "Не применимо" / "Не установлена").
        - Если ставка определяется через приложение/график — верни
          формулировку "Согласно Графику процентов (Приложение № N)".
        - Если ставка отнесена к «дополнительному соглашению» (будущий
          документ) — верни "Ставка не установлена (определяется
          дополнительным соглашением)".
        - Если база начисления не указана явно — применяй
          "outstanding_balance" (стандарт российской практики).
        - Если периодичность уплаты не указана явно — применяй "monthly"
          (по ст. 809(3) ГК РФ).
        - Если в документе несколько редакций условий о ставке —
          использовать последнюю по позиции.
        - Презумпция ст. 809(1) применяется ТОЛЬКО к денежному займу
          (loan_kind = money). Для вещевого займа проценты обычно
          не применимы, но это проверка другого check-а — здесь считай,
          что контекст уже отобран для денежного займа.
        - Верни РОВНО один JSON-объект со всеми 9 ключами без какого-либо
          дополнительного текста до или после. Начни ответ сразу
          с открывающей фигурной скобки и закончи закрывающей. НЕ пиши
          Markdown, списки, код-фенсы. Ответ должен быть валидным JSON,
          пригодным для парсинга через json.loads без предварительной
          обработки.
        </rules>
      fields:
        - name: "interest_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["interest_bearing", "interest_free"]
          description: "Процентность займа (raw enum)."
          required: true
          display_in_grid: false
        - name: "interest_status_display"
          type: "string"
          presentation: "fact"
          label: "Процентность"
          description: "User-facing процентность займа."
          required: true
          display_in_grid: true
          display_priority: 1
        - name: "interest_rate"
          type: "string"
          presentation: "fact"
          label: "Процентная ставка (полная формулировка)"
          description: "Полная формулировка ставки, включая ссылки на ст. 809 ГК РФ или приложения."
          required: true
          display_in_grid: false
        - name: "interest_rate_display"
          type: "string"
          presentation: "fact"
          label: "Ставка"
          description: "Краткая версия ставки для DD Grid."
          required: true
          display_in_grid: true
          display_priority: 2
        - name: "calculation_base"
          type: "string"
          presentation: "signal"
          allowed_values: ["principal", "outstanding_balance", "not_applicable"]
          description: "База начисления процентов (raw enum)."
          required: true
          display_in_grid: false
        - name: "calculation_base_display"
          type: "string"
          presentation: "fact"
          label: "База начисления"
          description: "User-facing база начисления процентов."
          required: true
          display_in_grid: true
