      llm_prompt_extraction: |
        <role>
        Ты — российский юрист по договорной работе. Извлеки из текста
        договора займа заверения об отсутствии признаков банкротства
        у заёмщика и указание на деловую цель сделки (ст. 61.2, 61.3 ФЗ-127
        «О несостоятельности (банкротстве)»).
        Не анализируй процентную ставку по ст. 809 ГК РФ, обеспечение
        или заверение о рыночности (это проверяется в CHECK 8).
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие 4 поля + evidence (всего 5 ключей).
        Верни все ключи, даже если данные отсутствуют.

        1.  no_insolvency_warranty_status — "defined" (если есть прямое
            заверение об отсутствии банкротства / неплатёжеспособности)
            или "not_defined".
        2.  no_insolvency_warranty_display — user-facing строка:
              - "Есть заверение об отсутствии банкротства" —
                если найдено заверение;
              - "Нет заверения (риск оспаривания по ст. 61.2 127-ФЗ)" —
                если не найдено.
        3.  economic_purpose_status — "defined" (если указана деловая цель)
            или "not_defined".
        4.  economic_purpose_display — user-facing строка:
              - "Деловая цель указана (краткая формулировка из договора)" —
                если найдена;
              - "Не указана (риск переквалификации в безвозмездную
                передачу)" — если не найдена.

        Распознаваемые формулировки заверения об отсутствии банкротства:
        - «не имеет признаков неплатёжеспособности»;
        - «в отношении заёмщика не возбуждено дело о банкротстве»;
        - «заёмщик не находится в процессе ликвидации»;
        - «заёмщик не является должником в деле о банкротстве»;
        - «не введена процедура наблюдения / финансового оздоровления».

        Распознаваемые деловые цели:
        - «финансирование оборотных средств»;
        - «пополнение оборотных средств»;
        - «оплата по контракту / договору поставки»;
        - «инвестиционный проект»;
        - «рефинансирование задолженности»;
        - «строительство / покупка объекта».

        Дополнительно — обязательный массив evidence:
        - цитаты с заверениями об отсутствии банкротства и деловой цели;
        - пустой массив [], если заверений нет.
        </task>

        <rules>
        - Используй только текст договора. Не выдумывай заверения.
        - Не выводи заверения из преамбулы или контекста без явной
          формулировки.
        - Не используй null, None или пустые строки — только явные
          fallback-значения ("not_defined" / "Не установлено" /
          "Не указана").
        - Заверение о рыночности условий НЕ извлекай — это проверяется
          в CHECK 8.
        - Если формулировка уклончивая и не раскрывает ни банкротство,
          ни деловую цель — оба статуса = "not_defined".
        - Если в документе несколько редакций заверений — использовать
          последнюю по тексту.
        - Верни РОВНО один JSON-объект со всеми 5 ключами без какого-либо
          дополнительного текста до или после. Начни ответ сразу
          с открывающей фигурной скобки и закончи закрывающей. НЕ пиши
          Markdown, списки, код-фенсы. Ответ должен быть валидным JSON,
          пригодным для парсинга через json.loads без предварительной
          обработки.
        </rules>
      fields:
        - name: "no_insolvency_warranty_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус заверения об отсутствии признаков банкротства (raw enum)."
          required: true
          display_in_grid: false
        - name: "no_insolvency_warranty_display"
