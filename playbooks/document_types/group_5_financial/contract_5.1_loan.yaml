        {
          "transfer_evidence_status": "not_defined",
          "transfer_evidence_details": "Указание на передачу в договоре без внешнего подтверждающего документа",
          "transfer_evidence_type": "contract_clause",
          "transfer_evidence_type_display": "Указание в договоре",
          "transfer_at_signing_status": "not_defined",
          "cash_transfer_risk": "high",
          "transfer_risk_display": "Высокий риск безденежности (наличная передача без расписки/акта)",
          "evidence": [
            {
              "clause_ref": "п. 1.1",
              "quote": "Займодавец передаёт Заёмщику 500 000 рублей наличными."
            }
          ]
        }

        Пример 4 — обещание займа (консенсуальный договор):
        Фрагмент:
        "Займодавец обязуется предоставить Заёмщику денежные средства
        в размере 10 000 000 рублей в срок до 30.06.2026. Передача
        осуществляется путём перечисления на расчётный счёт Заёмщика."
        (передача обещана в будущем, ещё не состоялась)
        Ответ:
        {
          "transfer_evidence_status": "not_defined",
          "transfer_evidence_details": "Обещание займа, передача обещана в будущем (до 30.06.2026, безналичным переводом)",
          "transfer_evidence_type": "not_defined",
          "transfer_evidence_type_display": "Не определено (обещание займа)",
          "transfer_at_signing_status": "not_defined",
