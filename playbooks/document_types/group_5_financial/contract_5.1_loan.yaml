shared_patterns:
  money_amount: "(?i)\\b\\d[\\d\\s]*(?:руб|рублей|₽|коп|тыс|млн|млрд)"
  date_pattern: "(?i)\\b\\d{1,2}[.]\\d{1,2}[.]\\d{4}\\b"
  percentage_pattern: "(?i)\\b\\d+(?:[.,]\\d+)?\\s*%\\b"
  deadline_pattern: "(?i)(?:в течение|не позднее)\\s+\\d+\\s+(?:календарн|рабоч|банковск|дн|дня|дней)"
  currency_pattern: "(?i)\\b(?:руб|рублей|₽|usd|eur|доллар(?:ов)?|евро)\\b"

compliance_rules: []

# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 4: CHECKS_V8 — единственный рабочий слой юридического анализа
#  Читается: DocTypeCheckLoader._load_doc_type_checks()
# ════════════════════════════════════════════════════════════════════════════

checks_v8:

  - id: loan_parties_identification
    name: "Стороны договора: идентификация займодавца и заёмщика"
    description: >
      Фактографическая проверка идентификации сторон договора займа —
      займодавца и заёмщика, их реквизитов, подписантов и оснований полномочий.
      Role-specific specialization относительно global-проверок
      party_identification_and_requisites и signatory_authority_and_basis:
      фиксирует тип стороны (юрлицо / ИП / физлицо), что критично для
      квалификации займа (потребкредит, микрофинансовая деятельность,
      режим процентов, НДФЛ с матвыгоды).
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "займодавец"
        - "заимодавец"
        - "заемщик"
        - "заёмщик"
        - "именуем"
        - "в лице"
        - "действующего на основании"
        - "ИНН"
        - "ОГРН"
        - "ОГРНИП"
        - "паспорт"
        - "гражданин"
        - "индивидуальный предприниматель"
        - "юридическое лицо"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)(займодавец|заимодавец|заемщик|заёмщик).*именуем"
        - "(?i)действующ[а-я]+\\s+на\\s+основании"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор займа (§ 1 Главы 42 ГК РФ, ст. 807–808).
        Проверяется только один вопрос: идентификация сторон — займодавца
        и заёмщика, их реквизиты, тип, подписанты и основания полномочий.

        Нормативный ориентир:
        - ст. 807 ГК РФ — стороны договора займа;
        - ст. 808 ГК РФ — форма договора займа;
        - ст. 182–185 ГК РФ — полномочия представителя;
        - ст. 53 ГК РФ — органы юридического лица.

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора.
        - Не оценивай серьёзность риска и не делай выводов сверх текста.
        - Не смешивай стороны между собой.
        - Тип стороны (юрлицо / ИП / физлицо) важен для последующей
          квалификации займа (потребкредит, микрофинансовая деятельность,
          НДФЛ с матвыгоды). Определяй его строго по прямому указанию
          в тексте.

        [ЗАДАЧА]
        Найди в тексте договора (обычно преамбула и блок подписей):
        1. Наименование/ФИО и реквизиты Займодавца.
        2. Тип Займодавца (юрлицо / ИП / физлицо) и его user-facing
           отображение.
        3. Кто подписывает от Займодавца и на каком основании
           (включая реквизиты документа-основания).
        4. Наименование/ФИО и реквизиты Заёмщика.
        5. Тип Заёмщика и его user-facing отображение.
        6. Кто подписывает от Заёмщика и на каком основании
           (включая реквизиты документа-основания).

        [ПРАВИЛА]
        1. Используй только текст документа. Ничего не додумывай — не выдумывай
           ИНН, ОГРН, паспортные данные, номера доверенностей и приказов.
        2. Если данные не указаны прямо:
           - для status-полей (*_status, *_type, *_basis_code) верни "not_defined";
           - для текстовых полей верни "Не установлено".
        3. Запрещены значения: null, None, пустые строки — не используй их
           никогда. Допустимые fallback-значения: "not_defined",
           "Не установлено".
        4. Если реквизиты стороны указаны частично (например, только
           наименование без ИНН/ОГРН) — статус = "defined", в value
           указать всё, что есть. В value можно явно отразить неполноту:
           "Иванов И.И. (тип стороны в тексте не указан)".
        5. Если найдено несколько редакций преамбулы (например, черновой
           блок и финальный) — использовать последнюю по позиции
           в документе.
        6. Для физлица, подписывающего лично: basis_code = "personal".
        7. Для органа юрлица (директор по Уставу): basis_code = "charter".
        8. Для доверенности: basis_code = "poa", заполнить
           *_signatory_basis_details (например, "доверенность № 12 от 15.03.2024").
        9. Для приказа/распоряжения: basis_code = "order", заполнить
           *_signatory_basis_details (например, "приказ № 5 от 10.01.2024").
        10. *_type_display формируй строго по значению *_type:
            "legal_entity" -> "Юрлицо";
            "ip" -> "ИП";
            "individual" -> "Физлицо";
            "not_defined" -> "Не установлено".
        11. *_signatory_display формируй по паре (signatory, basis_code):
            - charter: "<ФИО> (Устав)";
            - poa: "<ФИО> (доверенность № N от DD.MM.YYYY)" —
              либо "<ФИО> (доверенность)" без реквизитов;
            - order: "<ФИО> (приказ № N от DD.MM.YYYY)" —
              либо "<ФИО> (приказ)";
            - personal: "<ФИО> (лично)";
            - other: "<ФИО> (иное основание)";
            - not_defined, но signatory известен: "<ФИО> (основание не установлено)";
            - signatory не установлен: "Не установлено".
        12. В evidence включай только дословные цитаты из текста договора.
        13. Верни РОВНО один JSON-объект со всеми 17 ключами без какого-либо
            дополнительного текста до или после. Начни ответ сразу
            с открывающей фигурной скобки и закончи закрывающей. НЕ пиши
            Markdown, списки, код-фенсы. Ответ должен быть валидным JSON,
            пригодным для парсинга через json.loads без предварительной
            обработки.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — юрлицо и физлицо:
        Фрагмент:
        "ООО «ФинансГрупп» (ИНН 7700000001, ОГРН 1027700000001), именуемое
        «Займодавец», в лице Генерального директора Иванова И.И., действующего
        на основании Устава, с одной стороны, и гражданин Петров Пётр Петрович,
        паспорт 45 00 № 123456, именуемый «Заёмщик», с другой стороны."
        Ответ:
        {
          "lender_details_status": "defined",
          "lender_details_value": "ООО «ФинансГрупп», ИНН 7700000001, ОГРН 1027700000001",
          "lender_type": "legal_entity",
          "lender_type_display": "Юрлицо",
          "lender_signatory": "Генеральный директор Иванов И.И.",
          "lender_signatory_basis_code": "charter",
          "lender_signatory_basis_details": "Не установлено",
          "lender_signatory_display": "Иванов И.И. (Устав)",
          "borrower_details_status": "defined",
          "borrower_details_value": "Петров Пётр Петрович, паспорт 45 00 № 123456",
          "borrower_type": "individual",
          "borrower_type_display": "Физлицо",
          "borrower_signatory": "Петров Пётр Петрович",
          "borrower_signatory_basis_code": "personal",
          "borrower_signatory_basis_details": "Не установлено",
          "borrower_signatory_display": "Петров П.П. (лично)",
          "evidence": [
            {
              "clause_ref": "преамбула",
              "quote": "ООО «ФинансГрупп» (ИНН 7700000001, ОГРН 1027700000001), именуемое «Займодавец», в лице Генерального директора Иванова И.И., действующего на основании Устава"
            },
            {
              "clause_ref": "преамбула",
              "quote": "гражданин Петров Пётр Петрович, паспорт 45 00 № 123456, именуемый «Заёмщик»"
            }
          ]
        }

        Пример 2 — ИП и юрлицо с доверенностью:
        Фрагмент:
        "Индивидуальный предприниматель Сидоров С.С. (ОГРНИП 315774600000001,
        ИНН 771234567890), именуемый «Займодавец», с одной стороны, и
        ООО «Ромашка» (ИНН 7701234567), именуемое «Заёмщик», в лице
        коммерческого директора Кузнецова К.К., действующего на основании
        доверенности № 15 от 10.01.2024, с другой стороны."
        Ответ:
        {
          "lender_details_status": "defined",
          "lender_details_value": "ИП Сидоров С.С., ОГРНИП 315774600000001, ИНН 771234567890",
          "lender_type": "ip",
          "lender_type_display": "ИП",
          "lender_signatory": "Сидоров С.С.",
          "lender_signatory_basis_code": "personal",
          "lender_signatory_basis_details": "Не установлено",
          "lender_signatory_display": "Сидоров С.С. (лично)",
          "borrower_details_status": "defined",
          "borrower_details_value": "ООО «Ромашка», ИНН 7701234567",
          "borrower_type": "legal_entity",
          "borrower_type_display": "Юрлицо",
          "borrower_signatory": "Коммерческий директор Кузнецов К.К.",
          "borrower_signatory_basis_code": "poa",
          "borrower_signatory_basis_details": "доверенность № 15 от 10.01.2024",
          "borrower_signatory_display": "Кузнецов К.К. (доверенность № 15 от 10.01.2024)",
          "evidence": [
            {
              "clause_ref": "преамбула",
              "quote": "Индивидуальный предприниматель Сидоров С.С. (ОГРНИП 315774600000001, ИНН 771234567890), именуемый «Займодавец»"
            },
            {
              "clause_ref": "преамбула",
              "quote": "ООО «Ромашка» (ИНН 7701234567), именуемое «Заёмщик», в лице коммерческого директора Кузнецова К.К., действующего на основании доверенности № 15 от 10.01.2024"
            }
          ]
        }

        Пример 3 — данных в договоре нет:
        Фрагмент:
        "Настоящий договор займа заключён между Сторонами на условиях,
        изложенных ниже."
        Ответ:
        {
          "lender_details_status": "not_defined",
          "lender_details_value": "Не установлено",
          "lender_type": "not_defined",
          "lender_type_display": "Не установлено",
          "lender_signatory": "Не установлено",
          "lender_signatory_basis_code": "not_defined",
          "lender_signatory_basis_details": "Не установлено",
          "lender_signatory_display": "Не установлено",
          "borrower_details_status": "not_defined",
          "borrower_details_value": "Не установлено",
          "borrower_type": "not_defined",
          "borrower_type_display": "Не установлено",
          "borrower_signatory": "Не установлено",
          "borrower_signatory_basis_code": "not_defined",
          "borrower_signatory_basis_details": "Не установлено",
          "borrower_signatory_display": "Не установлено",
          "evidence": []
        }

        Пример 4 — текст есть, но надёжный вывод сделать нельзя
        (одна сторона идентифицирована, тип другой не указан):
        Фрагмент:
        "ООО «Альфа» (ИНН 7700000001), именуемое «Займодавец», в лице
        директора Смирнова С.С., действующего на основании Устава, и
        Иванов И.И., именуемый «Заёмщик», заключили настоящий договор."
        Ответ:
        {
          "lender_details_status": "defined",
          "lender_details_value": "ООО «Альфа», ИНН 7700000001",
          "lender_type": "legal_entity",
          "lender_type_display": "Юрлицо",
          "lender_signatory": "Директор Смирнов С.С.",
          "lender_signatory_basis_code": "charter",
          "lender_signatory_basis_details": "Не установлено",
          "lender_signatory_display": "Смирнов С.С. (Устав)",
          "borrower_details_status": "defined",
          "borrower_details_value": "Иванов И.И. (тип стороны в тексте не указан)",
          "borrower_type": "not_defined",
          "borrower_type_display": "Не установлено",
          "borrower_signatory": "Иванов И.И.",
          "borrower_signatory_basis_code": "not_defined",
          "borrower_signatory_basis_details": "Не установлено",
          "borrower_signatory_display": "Иванов И.И. (основание не установлено)",
          "evidence": [
            {
              "clause_ref": "преамбула",
              "quote": "ООО «Альфа» (ИНН 7700000001), именуемое «Займодавец», в лице директора Смирнова С.С., действующего на основании Устава"
            },
            {
              "clause_ref": "преамбула",
              "quote": "Иванов И.И., именуемый «Заёмщик»"
            }
          ]
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату с идентификацией Займодавца.
        2. Найди прямую цитату с идентификацией Заёмщика.
        3. Найди прямую цитату о подписантах и основаниях полномочий.
        4. Если прямой цитаты нет — верни "not_defined" для status-полей
           и "Не установлено" для текстовых.
        5. Проверь, что все 17 ключей (16 полей + evidence) присутствуют
           в JSON.
        6. Согласуй raw enum и display:
           lender_type -> lender_type_display:
             "legal_entity" -> "Юрлицо";
             "ip" -> "ИП";
             "individual" -> "Физлицо";
             "not_defined" -> "Не установлено".
           borrower_type -> borrower_type_display: аналогично.
           lender_signatory_basis_code / borrower_signatory_basis_code ->
           *_signatory_display: правила в [ПРАВИЛА] п.11.
        7. Если signatory известен, а basis_code = "not_defined" —
           display = "<ФИО> (основание не установлено)".
        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь РОВНО одним JSON-объектом без какого-либо дополнительного
        текста до или после, со всеми 17 ключами:
        {
          "lender_details_status": "<defined / not_defined>",
          "lender_details_value": "<реквизиты или 'Не установлено'>",
          "lender_type": "<legal_entity / ip / individual / not_defined>",
          "lender_type_display": "<Юрлицо / ИП / Физлицо / Не установлено>",
          "lender_signatory": "<ФИО и должность или 'Не установлено'>",
          "lender_signatory_basis_code": "<charter / poa / order / personal / other / not_defined>",
          "lender_signatory_basis_details": "<номер/дата документа или 'Не установлено'>",
          "lender_signatory_display": "<'ФИО (основание)' или 'Не установлено'>",
          "borrower_details_status": "<defined / not_defined>",
          "borrower_details_value": "<реквизиты или 'Не установлено'>",
          "borrower_type": "<legal_entity / ip / individual / not_defined>",
          "borrower_type_display": "<Юрлицо / ИП / Физлицо / Не установлено>",
          "borrower_signatory": "<ФИО и должность или 'Не установлено'>",
          "borrower_signatory_basis_code": "<charter / poa / order / personal / other / not_defined>",
          "borrower_signatory_basis_details": "<номер/дата документа или 'Не установлено'>",
          "borrower_signatory_display": "<'ФИО (основание)' или 'Не установлено'>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 8
      temperature: 0.0
      max_tokens: 900
    retrieval:
      retrieval_profile: "party_identification_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "займодавец заимодавец заемщик заёмщик именуем в лице действующего на основании Устава доверенности приказа ИНН ОГРН ОГРНИП паспорт гражданин индивидуальный предприниматель юридическое лицо реквизиты сторон преамбула подписи"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - representations
        - boilerplate
      negative_keywords:
        - "сумма займа"
        - "проценты"
        - "срок возврата"
        - "неустойка"
        - "обеспечение"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.0, 0.20]
        boost: 0.40
        scope: segment
      context_k: 8
      max_chunks: 10
      rerank: true
    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - representations
        - boilerplate
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.15
    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 600
    extraction:
      store_payload: true

      enabled: true
      mode: "hybrid"
      compact_output: false
      llm_max_tokens: 1550
      llm_prompt_extraction: |
        <role>
        Ты — российский юрист по договорной работе. Извлеки из текста
        договора займа сведения о займодавце и заёмщике: реквизиты, тип
        стороны, подписанта и основание полномочий, а также сформируй
        user-facing строки о типе стороны и подписантах.
        Не анализируй сумму займа, проценты, срок возврата, обеспечение
        или иные темы — только идентификацию сторон.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие 16 полей + evidence (всего 17 ключей).
        Верни все ключи, даже если данные отсутствуют.

        1.  lender_details_status — "defined" или "not_defined".
        2.  lender_details_value — наименование/ФИО и реквизиты займодавца
            (ИНН, ОГРН/ОГРНИП, паспортные данные) или "Не установлено".
            Если данные частичны (например, только ФИО без типа стороны) —
            можно явно указать: "Иванов И.И. (тип стороны в тексте не указан)".
        3.  lender_type — "legal_entity" / "ip" / "individual" / "not_defined".
        4.  lender_type_display — "Юрлицо" / "ИП" / "Физлицо" / "Не установлено"
            (строго по значению lender_type).
        5.  lender_signatory — ФИО и должность подписанта займодавца
            или "Не установлено".
        6.  lender_signatory_basis_code — "charter" / "poa" / "order" /
            "personal" / "other" / "not_defined".
        7.  lender_signatory_basis_details — номер/дата документа-основания
            (для poa/order) или "Не установлено".
        8.  lender_signatory_display — user-facing строка формата
            "<ФИО> (основание человеческим языком)":
              - charter: "<ФИО> (Устав)";
              - poa: "<ФИО> (доверенность № N от DD.MM.YYYY)" либо
                "<ФИО> (доверенность)", если реквизиты не указаны;
              - order: "<ФИО> (приказ № N от DD.MM.YYYY)" либо
                "<ФИО> (приказ)";
              - personal: "<ФИО> (лично)";
              - other: "<ФИО> (иное основание)";
              - not_defined, но signatory известен:
                "<ФИО> (основание не установлено)";
              - signatory не установлен: "Не установлено".
        9.  borrower_details_status — "defined" или "not_defined".
        10. borrower_details_value — реквизиты заёмщика или "Не установлено".
        11. borrower_type — "legal_entity" / "ip" / "individual" / "not_defined".
        12. borrower_type_display — "Юрлицо" / "ИП" / "Физлицо" / "Не установлено"
            (строго по значению borrower_type).
        13. borrower_signatory — ФИО и должность подписанта заёмщика
            или "Не установлено".
        14. borrower_signatory_basis_code — "charter" / "poa" / "order" /
            "personal" / "other" / "not_defined".
        15. borrower_signatory_basis_details — номер/дата документа-основания
            или "Не установлено".
        16. borrower_signatory_display — user-facing строка (правила те же,
            что для lender_signatory_display).

        Дополнительно — обязательный массив evidence:
        - хотя бы одна цитата на займодавца и одна на заёмщика, если данные найдены;
        - пустой массив [], если ни одна сторона не идентифицирована.

        Правила заполнения при отсутствии данных:
        - status-поле = "not_defined";
        - текстовое поле = "Не установлено";
        - enum-поле = "not_defined".
        </task>

        <rules>
        - Используй только текст договора. Не выдумывай ИНН, ОГРН,
          паспортные данные, номера и даты доверенностей/приказов.
        - Не используй null, None или пустые строки — только явные
          fallback-значения ("Не установлено" / "not_defined").
        - Если реквизиты стороны указаны частично (только наименование
          без ИНН) — статус = "defined", в value указать всё, что есть.
        - Если в документе несколько редакций преамбулы — использовать
          последнюю по позиции.
        - Для физлица, подписывающего лично — basis_code = "personal",
          *_signatory_basis_details = "Не установлено".
        - Для органа юрлица (директор по Уставу) — basis_code = "charter",
          *_signatory_basis_details = "Не установлено".
        - Для доверенности — basis_code = "poa"; в details по возможности
          указать "доверенность № N от DD.MM.YYYY".
        - Для приказа — basis_code = "order"; в details по возможности
          указать "приказ № N от DD.MM.YYYY".
        - Не смешивай данные займодавца и заёмщика.
        - Не путай подписанта одной стороны с представителем другой.
        - *_type_display строго соответствует *_type:
            legal_entity -> "Юрлицо";
            ip -> "ИП";
            individual -> "Физлицо";
            not_defined -> "Не установлено".
        - *_signatory_display формируй по правилам из <task> п.8.
        - Верни РОВНО один JSON-объект со всеми 17 ключами без какого-либо
          дополнительного текста до или после. Начни ответ сразу
          с открывающей фигурной скобки и закончи закрывающей. НЕ пиши
          Markdown, списки, код-фенсы. Ответ должен быть валидным JSON,
          пригодным для парсинга через json.loads без предварительной
          обработки.
        </rules>
      fields:
        - name: "lender_details_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус идентификации займодавца (raw enum)."
          required: true
          display_in_grid: false
        - name: "lender_details_value"
          type: "string"
          presentation: "fact"
          label: "Займодавец"
          description: "Наименование/ФИО и реквизиты займодавца."
          required: true
          display_in_grid: true
          display_priority: 1
        - name: "lender_type"
          type: "string"
          presentation: "signal"
          allowed_values: ["legal_entity", "ip", "individual", "not_defined"]
          description: "Тип займодавца (raw enum)."
          required: true
          display_in_grid: false
        - name: "lender_type_display"
          type: "string"
          presentation: "fact"
          label: "Тип займодавца"
          description: "User-facing: Юрлицо / ИП / Физлицо / Не установлено."
          required: true
          display_in_grid: true
          display_priority: 2
        - name: "lender_signatory"
          type: "string"
          presentation: "fact"
          label: "Подписант займодавца (ФИО/должность)"
          description: "ФИО и должность подписанта от займодавца."
          required: true
          display_in_grid: false
        - name: "lender_signatory_basis_code"
          type: "string"
          presentation: "signal"
          allowed_values: ["charter", "poa", "order", "personal", "other", "not_defined"]
          description: "Основание полномочий подписанта займодавца (raw enum)."
          required: true
          display_in_grid: false
        - name: "lender_signatory_basis_details"
          type: "string"
          presentation: "fact"
          label: "Основание полномочий займодавца (детали)"
          description: "Номер и дата доверенности/приказа, если указаны."
          required: true
          display_in_grid: false
        - name: "lender_signatory_display"
          type: "string"
          presentation: "fact"
          label: "Подписант займодавца"
          description: "User-facing строка: '<ФИО> (основание)'."
          required: true
          display_in_grid: true
          display_priority: 3
        - name: "borrower_details_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус идентификации заёмщика (raw enum)."
