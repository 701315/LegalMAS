      position_bias:
        preferred_range: [0.05, 0.55]
        boost: 0.20
        scope: segment
      context_k: 8
      max_chunks: 10
      rerank: true
    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - obligations
        - definitions
      confidence_bonus_on_match: 0.12
      confidence_penalty_on_excluded_segment: 0.15
    evidence:
      required: true
      min_snippet_length: 35
      max_snippet_length: 600
    extraction:
      store_payload: true

      enabled: true
      mode: "hybrid"
      compact_output: false
      llm_max_tokens: 1400
      llm_prompt_extraction: |
        <role>
        Ты — российский юрист по договорной работе. Извлеки из текста договора
        займа сведения о валютной конструкции, источнике курса, дате пересчёта,
        наличии валютного коридора и распределении валютных рисков
        (ст. 317 ГК РФ, 173-ФЗ).
        Не анализируй процентную ставку по ст. 809 ГК РФ или общую ответственность.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие 10 полей + evidence (всего 11 ключей).
        Верни все ключи, даже если данные отсутствуют.

        1.  currency_reference_type — "rub_equivalent" / "foreign_currency_obligation" /
            "not_applicable":
              - "rub_equivalent" — долг выражен в валюте/у.е., но расчёты
                в рублях (законно по ст. 317(2) ГК РФ);
              - "foreign_currency_obligation" — прямые расчёты в иностранной
                валюте (риск 173-ФЗ для резидентов);
              - "not_applicable" — чистый рублёвый заём без валютной оговорки.
        2.  currency_clause_display — user-facing строка:
              - "Эквивалент валюты (долг в [ВАЛЮТА], расчёты в рублях)";
              - "Эквивалент валюты (условные единицы, расчёты в рублях)";
              - "Прямые расчёты в валюте (внимание: риск нарушения 173-ФЗ
                для резидентов)";
              - "Не применимо (заём в рублях РФ без валютной оговорки)".
        3.  conversion_rate_source — "cb_rate" / "commercial_bank_rate" /
            "fixed_rate" / "not_applicable" / "not_defined":
              - "cb_rate" — курс ЦБ РФ;
              - "commercial_bank_rate" — курс коммерческого банка
                (Сбербанк, ВТБ и т.п.);
              - "fixed_rate" — фиксированный курс прямо в договоре
                (например, «1 USD = 90 руб.»);
              - "not_applicable" — для not_applicable и foreign_currency_obligation;
              - "not_defined" — если источник не указан.
        4.  conversion_date — "payment_date" / "transfer_date" / "maturity_date" /
            "not_applicable" / "not_defined":
              - "payment_date" — на дату фактического платежа;
              - "transfer_date" — на дату выдачи / списания;
              - "maturity_date" — на дату возврата / погашения;
              - "not_applicable" — для not_applicable и foreign_currency_obligation;
              - "not_defined" — если дата не указана.
        5.  conversion_rate_display — user-facing строка:
              - "Курс ЦБ РФ на дату платежа";
              - "Курс ЦБ РФ на дату платежа (с ограничениями)";
              - "Курс [НАЗВАНИЕ БАНКА] на дату [СОБЫТИЯ]";
              - "Фиксированный курс (1 [ВАЛЮТА] = N руб.)";
              - "Не указан (курс согласуется дополнительно)";
              - "Не указан (применяется курс ЦБ РФ на дату платежа
                по ст. 317(2) ГК РФ)";
              - "Не применимо".
        6.  currency_collar_min — минимальный курс (число) или "not_defined".
            Только число, без слов «около», «примерно», «приблизительно».
        7.  currency_collar_max — максимальный курс (число) или "not_defined".
            Только число, без слов «около», «примерно», «приблизительно».
        8.  currency_collar_display — user-facing строка:
              - "Установлен: от N до M руб./[ВАЛЮТА]";
              - "Не установлен (без ограничений)";
              - "Не установлен (фиксированный курс)";
              - "Не применимо".
        9.  currency_risk_allocation — "not_defined" / "borrower_bears_all" /
            "lender_bears_all" / "shared".
            Приоритет определения:
              1) есть валютный коридор (min и/или max) → "shared";
              2) фиксированный курс в договоре (fixed_rate) → "lender_bears_all";
              3) курс ЦБ РФ / коммерческого банка на дату платежа / выдачи /
                 возврата без коридора → "borrower_bears_all";
              4) прямые расчёты в валюте (foreign_currency_obligation)
                 → "not_defined";
              5) курс не указан и конструкция неясна → "not_defined".
        10. currency_risk_display — user-facing строка о распределении рисков:
              - "Все риски на заёмщике (курс ЦБ РФ / коммерческого банка
                на дату платежа, без коридора)";
              - "Все риски на займодавце (фиксированный курс 1 [ВАЛЮТА] = N руб.)";
              - "Риски разделены (валютный коридор N–M руб./[ВАЛЮТА])";
              - "Не определено (условия расчёта не раскрыты)";
              - "Не применимо".

        Дополнительно — обязательный массив evidence:
        - цитаты с формулировкой валютной оговорки, курса, даты и коридора;
        - пустой массив [], если заём чисто рублёвый.

        Правила заполнения при отсутствии данных:
        - Если в договоре нет валютной оговорки — все display-поля
          = "Не применимо";
        - Если распределение рисков не указано —
          currency_risk_display = "Не определено" или "Не применимо".
        </task>

        <rules>
        - Используй только текст договора. Не выдумывай условия валютной оговорки.
        - Не используй null, None или пустые строки — только явные
          fallback-значения ("not_defined" / "not_applicable" /
          "Не установлено" / "Не применимо" / "Не определён").
        - Если курс не указан явно — по ст. 317(2) ГК РФ применяется
          курс ЦБ РФ на дату платежа. НО в извлечении:
            conversion_rate_source = "not_defined";
            conversion_date = "not_defined";
            conversion_rate_display = "Не указан (применяется курс ЦБ РФ
              на дату платежа по ст. 317(2) ГК РФ)".
          Не домысливай закон в raw enum.
        - Если есть ограничения курса (не менее N / не более M) — извлеки
          min и max как числа (только цифры, без слов «около» / «примерно»).
        - Для прямых расчётов в валюте (foreign_currency_obligation) —
          conversion_rate_source = "not_applicable",
          conversion_date = "not_applicable",
          currency_risk_allocation = "not_defined".
        - currency_risk_allocation определяется по приоритету:
            1) есть валютный коридор (min и/или max) → "shared";
            2) фиксированный курс в договоре (fixed_rate) → "lender_bears_all";
            3) курс ЦБ РФ / коммерческого банка на дату платежа / выдачи /
               возврата без коридора → "borrower_bears_all";
            4) прямые расчёты в валюте (foreign_currency_obligation)
               → "not_defined";
            5) курс не указан и конструкция неясна → "not_defined".
        - Маппинг display:
            currency_reference_type -> currency_clause_display:
              rub_equivalent -> "Эквивалент валюты (…)";
              foreign_currency_obligation -> "Прямые расчёты в валюте (…)";
              not_applicable -> "Не применимо (…)".
            conversion_rate_source + conversion_date -> conversion_rate_display
              по правилам <task> п.5.
            currency_risk_allocation -> currency_risk_display по правилам
              <task> п.10.
        - Если в документе несколько редакций условий о валютной оговорке —
          использовать последнюю по тексту.
        - Верни РОВНО один JSON-объект со всеми 11 ключами без какого-либо
          дополнительного текста до или после. Начни ответ сразу с открывающей
          фигурной скобки и закончи закрывающей. НЕ пиши Markdown, списки,
          код-фенсы. Ответ должен быть валидным JSON, пригодным для парсинга
          через json.loads без предварительной обработки.
        </rules>
      fields:
        - name: "currency_reference_type"
          type: "string"
          presentation: "signal"
          allowed_values: ["rub_equivalent", "foreign_currency_obligation", "not_applicable"]
          description: "Тип валютной конструкции (raw enum)."
          required: true
          display_in_grid: false
        - name: "currency_clause_display"
          type: "string"
          presentation: "fact"
          label: "Валютная конструкция"
          description: "User-facing тип валютной оговорки (эквивалент / прямая валюта / не применимо)."
          required: true
          display_in_grid: true
          display_priority: 1
        - name: "conversion_rate_source"
          type: "string"
          presentation: "signal"
          allowed_values: ["cb_rate", "commercial_bank_rate", "fixed_rate", "not_applicable", "not_defined"]
          description: "Источник обменного курса (raw enum)."
          required: true
          display_in_grid: false
        - name: "conversion_date"
          type: "string"
          presentation: "signal"
          allowed_values: ["payment_date", "transfer_date", "maturity_date", "not_applicable", "not_defined"]
          description: "Дата пересчёта (raw enum)."
          required: true
          display_in_grid: false
        - name: "conversion_rate_display"
          type: "string"
          presentation: "fact"
          label: "Курс и дата пересчёта"
          description: "User-facing источник курса и дата конвертации."
          required: true
          display_in_grid: true
          display_priority: 2
        - name: "currency_collar_min"
          type: "string"
          presentation: "fact"
          label: "Валютный коридор (min)"
          description: "Минимальный курс (пол валютного коридора). Только число."
          required: true
          display_in_grid: false
        - name: "currency_collar_max"
          type: "string"
          presentation: "fact"
          label: "Валютный коридор (max)"
          description: "Максимальный курс (потолок валютного коридора). Только число."
          required: true
          display_in_grid: false
        - name: "currency_collar_display"
          type: "string"
          presentation: "fact"
          label: "Валютный коридор (cap/floor)"
          description: "User-facing наличие и параметры валютного коридора."
          required: true
          display_in_grid: true
          display_priority: 3
        - name: "currency_risk_allocation"
          type: "string"
          presentation: "signal"
          allowed_values: ["not_defined", "borrower_bears_all", "lender_bears_all", "shared"]
          description: "Распределение валютных рисков (raw enum)."
          required: true
          display_in_grid: false
        - name: "currency_risk_display"
          type: "string"
          presentation: "fact"
          label: "Распределение валютных рисков"
          description: "User-facing резюме распределения валютных рисков между сторонами."
          required: true
          display_in_grid: true
          display_priority: 4

  - id: related_party_loan_check
    name: "Заём между аффилированными лицами: раскрытие и рыночность (Обзор ВС РФ 29.01.2020, ст. 61.2 127-ФЗ)"
    description: >
      Фактографическая проверка признаков аффилированности сторон займа,
      раскрытия связанности в договоре, заверения о рыночности условий.
      Критично для оценки рисков субординации требований в банкротстве
      (ст. 61.2 127-ФЗ), оспаривания сделок как подозрительных, налоговых
      рисков (ст. 54.1 НК РФ) и необходимости корпоративного одобрения
      (ст. 45 14-ФЗ, ст. 83.1 208-ФЗ).
    triggers:
      any: ["related_parties", "commercial_parties"]
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "аффилирован"
        - "взаимозависим"
        - "участник общества"
        - "директор"
        - "контролирующее лицо"
        - "бенефициар"
        - "одна группа лиц"
        - "рыночные условия"
        - "не являются аффилированными"
        - "заинтересованность"
        - "крупная сделка"
        - "субординация"
        - "банкротство"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)аффилирован|взаимозависим"
        - "(?i)контролирующ(ее|его)\\s+лиц"
        - "(?i)участник.*общества"
        - "(?i)рыночн(ые|ым)\\s+услови"
        - "(?i)не\\s+являютс[яь]\\s+аффилирован"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор займа на предмет аффилированности сторон
        (Обзор ВС РФ от 29.01.2020, ст. 61.2 127-ФЗ о банкротстве, ст. 54.1 НК РФ).
        Проверяются признаки аффилированности, раскрытие связанности
        и заверение о рыночности условий займа.

        Нормативный ориентир:
        - ст. 61.2 127-ФЗ «О несостоятельности (банкротстве)» — требования
          аффилированных кредиторов могут быть субординированы (удовлетворяются
          после всех независимых кредиторов), если заём предоставлен в период
          финансового кризиса заёмщика;
        - Обзор ВС РФ от 29.01.2020 — заверение о рыночности условий является
          критической защитой для аффилированного займодавца при оспаривании сделки;
        - ст. 45 14-ФЗ, ст. 83.1 208-ФЗ — сделка с заинтересованностью требует
          корпоративного одобрения, если стороны аффилированы;
        - ст. 54.1 НК РФ — нерыночные условия между аффилированными лицами
          могут привести к налоговым доначислениям (трансфертное ценообразование).

        Важно:
        - Твоя задача — установить фактические условия договора
          и отразить юридический режим.
        - Не выводи аффилированность из преамбулы (доли, общие директора)
          без явного заверения в тексте договора.
        - Извлекай только явные заверения сторон из текста договора.
        - Если статус аффилированности НЕ раскрыт, то вопрос рыночности
          не обсуждается — о заверении говорить не на что.

        [ЗАДАЧА]
        Найди в тексте договора (обычно раздел «Заверения сторон»
        или «Особые условия»):
        1. Есть ли прямое указание на аффилированность сторон
           (положительное или отрицательное).
        2. Тип аффилированности (общий участник / мать-дочка /
           один директор / группа лиц).
        3. Есть ли заверение о рыночности условий займа.
        4. Есть ли отрицательное заверение («не являются аффилированными»).

        [ПРАВИЛА]
        1. Используй только текст документа. Не выдумывай аффилированность.
        2. Если в договоре прямо указано, что стороны являются аффилированными:
           - affiliation_disclosed_status = "defined";
           - affiliation_status_display = "Аффилированные лица (раскрыто в договоре)".
        3. Если в договоре прямо указано, что стороны НЕ являются
           аффилированными:
           - affiliation_disclosed_status = "defined";
           - affiliation_status_display = "Не являются аффилированными
             (заверение сторон)".
        4. Если в договоре нет никаких упоминаний об аффилированности:
           - affiliation_disclosed_status = "not_defined";
           - affiliation_status_display = "Статус не раскрыт
             (риск субординации в банкротстве)";
           - market_terms_warranty_display = "Не применимо
             (аффилированность не раскрыта)" — вопрос рыночности
             не обсуждается, пока статус не раскрыт;
           - affiliation_consequences_display = "Не определено".
        5. Если аффилированность раскрыта положительно, но нет заверения
           о рыночности:
           - market_terms_warranty_status = "not_defined";
           - market_terms_warranty_display = "Нет заверения о рыночности
             (риск субординации в банкротстве)".
        6. Если стороны заверяют, что НЕ аффилированы:
           - affiliation_type = "not_applicable";
           - affiliation_type_display = "Не применимо";
           - market_terms_warranty_status = "not_defined";
           - market_terms_warranty_display = "Не применимо
             (стороны не аффилированы)";
           - affiliation_consequences = "not_defined";
           - affiliation_consequences_display = "Не применимо
             (стороны не аффилированы)".
        7. Запрещены значения: null, None, пустые строки — не используй
           их никогда. Допустимые fallback-значения: "not_defined",
           "not_applicable", "Не определено", "Не применимо".
        8. В evidence включай только дословные цитаты из текста договора.
        9. Верни РОВНО один JSON-объект со всеми 9 ключами без какого-либо
           дополнительного текста до или после. Начни ответ сразу
           с открывающей фигурной скобки и закончи закрывающей. НЕ пиши
           Markdown, списки, код-фенсы. Ответ должен быть валидным JSON,
           пригодным для парсинга через json.loads без предварительной
           обработки.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — аффилированность раскрыта + есть заверение о рыночности:
        Фрагмент:
        "8.1. Стороны подтверждают, что являются аффилированными лицами:
        Займодавец является единственным участником Заёмщика с долей 100%
        уставного капитала.
        8.2. Стороны заверяют, что все условия настоящего договора займа,
        включая процентную ставку, соответствуют рыночным условиям."
        Ответ:
        {
          "affiliation_status_display": "Аффилированные лица (раскрыто в договоре)",
          "affiliation_type": "parent_subsidiary",
          "affiliation_type_display": "Мать-дочка (100% доля участия)",
          "affiliation_disclosed_status": "defined",
          "market_terms_warranty_status": "defined",
          "market_terms_warranty_display": "Есть заверение о рыночности условий",
          "affiliation_consequences": "combined",
          "affiliation_consequences_display": "Риск субординации в банкротстве + требуется корпоративное одобрение + налоговые риски",
          "evidence": [
            {
              "clause_ref": "п. 8.1",
              "quote": "Стороны подтверждают, что являются аффилированными лицами: Займодавец является единственным участником Заёмщика с долей 100% уставного капитала."
            },
            {
              "clause_ref": "п. 8.2",
              "quote": "Стороны заверяют, что все условия настоящего договора займа, включая процентную ставку, соответствуют рыночным условиям."
            }
          ]
        }

        Пример 2 — аффилированность раскрыта, но нет заверения о рыночности
        (красный флаг):
        Фрагмент:
        "7.3. Заёмщик и Займодавец являются взаимозависимыми лицами
        в соответствии со ст. 105.1 НК РФ (общий генеральный директор)."
        (нет заверения о рыночности условий)
        Ответ:
        {
          "affiliation_status_display": "Аффилированные лица (раскрыто в договоре)",
          "affiliation_type": "common_director",
          "affiliation_type_display": "Один директор (общий единоличный исполнительный орган)",
          "affiliation_disclosed_status": "defined",
          "market_terms_warranty_status": "not_defined",
          "market_terms_warranty_display": "Нет заверения о рыночности (риск субординации в банкротстве)",
          "affiliation_consequences": "subordination_risk",
          "affiliation_consequences_display": "Риск субординации в банкротстве (нет заверения о рыночности)",
          "evidence": [
            {
              "clause_ref": "п. 7.3",
              "quote": "Заёмщик и Займодавец являются взаимозависимыми лицами в соответствии со ст. 105.1 НК РФ (общий генеральный директор)."
            }
          ]
        }

        Пример 3 — отрицательное заверение («не являются аффилированными»):
        Фрагмент:
        "9.1. Стороны заверяют, что не являются аффилированными или
        взаимозависимыми лицами по смыслу ст. 105.1 НК РФ и ст. 45 14-ФЗ."
        Ответ:
        {
          "affiliation_status_display": "Не являются аффилированными (заверение сторон)",
          "affiliation_type": "not_applicable",
          "affiliation_type_display": "Не применимо",
          "affiliation_disclosed_status": "defined",
          "market_terms_warranty_status": "not_defined",
          "market_terms_warranty_display": "Не применимо (стороны не аффилированы)",
          "affiliation_consequences": "not_defined",
          "affiliation_consequences_display": "Не применимо (стороны не аффилированы)",
          "evidence": [
            {
              "clause_ref": "п. 9.1",
              "quote": "Стороны заверяют, что не являются аффилированными или взаимозависимыми лицами по смыслу ст. 105.1 НК РФ и ст. 45 14-ФЗ."
            }
          ]
        }

        Пример 4 — статус не раскрыт
        (нет никаких упоминаний об аффилированности):
        Фрагмент:
        "1.1. Займодавец передаёт Заёмщику денежные средства в размере
        10 000 000 рублей."
        (нет упоминаний об аффилированности, рыночности, связанности)
        Ответ:
        {
          "affiliation_status_display": "Статус не раскрыт (риск субординации в банкротстве)",
          "affiliation_type": "not_defined",
          "affiliation_type_display": "Не определён",
          "affiliation_disclosed_status": "not_defined",
          "market_terms_warranty_status": "not_defined",
          "market_terms_warranty_display": "Не применимо (аффилированность не раскрыта)",
          "affiliation_consequences": "not_defined",
          "affiliation_consequences_display": "Не определено",
          "evidence": []
        }

        Пример 5 — текст есть, но надёжный вывод сделать нельзя
        (уклончивая формулировка без раскрытия статуса):
        Фрагмент:
        "6.4. Стороны подтверждают, что действуют добросовестно и в своих
        интересах, и заключают настоящий Договор на условиях, отвечающих
        их коммерческим целям."
        (нет прямого указания ни на аффилированность, ни на её отсутствие)
        Ответ:
        {
          "affiliation_status_display": "Статус не раскрыт (риск субординации в банкротстве)",
          "affiliation_type": "not_defined",
          "affiliation_type_display": "Не определён",
          "affiliation_disclosed_status": "not_defined",
          "market_terms_warranty_status": "not_defined",
          "market_terms_warranty_display": "Не применимо (аффилированность не раскрыта)",
          "affiliation_consequences": "not_defined",
          "affiliation_consequences_display": "Не определено",
          "evidence": [
            {
              "clause_ref": "п. 6.4",
              "quote": "Стороны подтверждают, что действуют добросовестно и в своих интересах, и заключают настоящий Договор на условиях, отвечающих их коммерческим целям."
            }
          ]
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о статусе аффилированности (положительное
           или отрицательное заверение).
        2. Определи тип аффилированности (общий участник / мать-дочка /
           один директор / группа лиц) — только при положительном
           раскрытии.
        3. Найди заверение о рыночности условий (только если
           аффилированность раскрыта положительно).
        4. Согласуй raw enum и display:
           affiliation_type -> affiliation_type_display:
             "parent_subsidiary" -> "Мать-дочка (N% доля участия)";
             "common_shareholder" -> "Общий участник (группа лиц)";
             "common_director" -> "Один директор (общий ЕИО)";
             "group_of_companies" -> "Группа лиц (взаимозависимые лица)";
             "other" -> "Иной тип связанности";
             "not_applicable" -> "Не применимо";
             "not_defined" -> "Не определён".
           market_terms_warranty_status -> market_terms_warranty_display
             по правилам [ПРАВИЛА] п.5–6.
           affiliation_consequences -> affiliation_consequences_display
             по правилам [ПРАВИЛА] п.4–6.
        5. Проверь, что все 9 ключей (8 полей + evidence) присутствуют
           в JSON.
        6. Не выводи аффилированность из преамбулы без явного заверения
           в тексте.
        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь РОВНО одним JSON-объектом без какого-либо дополнительного
        текста до или после, со всеми 9 ключами:
        {
          "affiliation_status_display": "<Аффилированные лица (раскрыто в договоре) / Не являются аффилированными (заверение сторон) / Статус не раскрыт (риск субординации в банкротстве)>",
          "affiliation_type": "<common_shareholder / common_director / group_of_companies / parent_subsidiary / other / not_applicable / not_defined>",
          "affiliation_type_display": "<Мать-дочка (…) / Общий участник (…) / Один директор (…) / Группа лиц (…) / Иной тип связанности / Не применимо / Не определён>",
          "affiliation_disclosed_status": "<defined / not_defined>",
          "market_terms_warranty_status": "<defined / not_defined>",
          "market_terms_warranty_display": "<Есть заверение о рыночности условий / Нет заверения о рыночности (риск субординации в банкротстве) / Не применимо (стороны не аффилированы) / Не применимо (аффилированность не раскрыта)>",
          "affiliation_consequences": "<not_defined / subordination_risk / approval_required / tax_risk / combined>",
          "affiliation_consequences_display": "<краткое резюме последствий / Не определено / Не применимо (стороны не аффилированы)>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 8
      temperature: 0.0
      max_tokens: 800
    retrieval:
      retrieval_profile: "event_of_default_check"
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "аффилированность взаимозависимость участник общества директор контролирующее лицо бенефициар группа лиц рыночные условия не являются аффилированными заинтересованность крупная сделка субординация банкротство 127-фз 105.1 НК РФ 45 14-ФЗ"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - representations
        - obligations
      negative_keywords:
        - "проценты по займу"
        - "процентная ставка"
        - "неустойка за просрочку"
        - "обеспечение исполнения"
        - "означает"
        - "в целях настоящего"
      position_bias:
        preferred_range: [0.30, 0.90]
        boost: 0.15
        scope: segment
      context_k: 8
      max_chunks: 10
      rerank: true
    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
      preferred_clause_functions:
        - representations
        - obligations
      confidence_bonus_on_match: 0.12
      confidence_penalty_on_excluded_segment: 0.15
    evidence:
      required: true
      min_snippet_length: 35
      max_snippet_length: 600
    extraction:
      store_payload: true

      enabled: true
      mode: "hybrid"
      compact_output: false
      llm_max_tokens: 1200
      llm_prompt_extraction: |
        <role>
        Ты — российский юрист по договорной работе. Извлеки из текста
        договора займа сведения об аффилированности сторон, типе
        связанности и заверении о рыночности условий
        (Обзор ВС РФ 29.01.2020, ст. 61.2 127-ФЗ).
        Не анализируй процентную ставку по ст. 809 ГК РФ или общую
        ответственность.
        Не выводи аффилированность из преамбулы (доли, общие директора)
        без явного заверения в тексте.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие 8 полей + evidence (всего 9 ключей).
        Верни все ключи, даже если данные отсутствуют.

        1.  affiliation_status_display — user-facing строка:
              - "Аффилированные лица (раскрыто в договоре)" —
                если прямо указано, что являются;
              - "Не являются аффилированными (заверение сторон)" —
                если прямо указано, что не являются;
              - "Статус не раскрыт (риск субординации в банкротстве)" —
                если нет упоминаний.
        2.  affiliation_type — "common_shareholder" / "common_director" /
            "group_of_companies" / "parent_subsidiary" / "other" /
            "not_applicable" / "not_defined":
              - "common_shareholder" — общий участник / акционер;
              - "common_director" — один директор / ЕИО;
              - "group_of_companies" — одна группа лиц;
              - "parent_subsidiary" — мать-дочка;
              - "other" — иной тип связанности;
              - "not_applicable" — при отрицательном заверении
                (стороны не аффилированы);
              - "not_defined" — тип не определён или статус не раскрыт.
        3.  affiliation_type_display — user-facing строка:
              - "Мать-дочка (N% доля участия)";
              - "Общий участник (группа лиц)";
              - "Один директор (общий единоличный исполнительный орган)";
              - "Группа лиц (взаимозависимые лица)";
              - "Иной тип связанности";
              - "Не применимо";
              - "Не определён".
        4.  affiliation_disclosed_status — "defined" / "not_defined":
              - "defined" — есть прямое заверение (положительное
                или отрицательное);
              - "not_defined" — нет никаких упоминаний.
        5.  market_terms_warranty_status — "defined" / "not_defined":
              - "defined" — есть заверение о рыночности;
              - "not_defined" — заверения нет или оно не применимо.
        6.  market_terms_warranty_display — user-facing строка:
              - "Есть заверение о рыночности условий";
              - "Нет заверения о рыночности (риск субординации
                в банкротстве)" — если аффилированность раскрыта
                положительно, но заверения нет;
              - "Не применимо (стороны не аффилированы)";
              - "Не применимо (аффилированность не раскрыта)".
        7.  affiliation_consequences — "not_defined" / "subordination_risk" /
            "approval_required" / "tax_risk" / "combined":
              - "subordination_risk" — риск субординации в банкротстве;
              - "approval_required" — требуется корпоративное одобрение;
              - "tax_risk" — налоговые риски;
              - "combined" — комбинация;
              - "not_defined" — не определено (или не применимо).
        8.  affiliation_consequences_display — user-facing строка:
              - "Риск субординации в банкротстве (нет заверения
                о рыночности)";
              - "Требуется корпоративное одобрение (ст. 45 14-ФЗ)";
              - "Налоговые риски (трансфертное ценообразование)";
              - "Риск субординации + корпоративное одобрение +
                налоговые риски";
              - "Не определено";
              - "Не применимо (стороны не аффилированы)".

        Дополнительно — обязательный массив evidence:
        - цитаты с заверениями об аффилированности и рыночности;
        - пустой массив [], если нет упоминаний об аффилированности.
        </task>

        <rules>
        - Используй только текст договора. Не выдумывай аффилированность.
        - Не выводи аффилированность из преамбулы (доли, общие директора)
          без явного заверения.
        - Не используй null, None или пустые строки — только явные
          fallback-значения ("not_defined" / "not_applicable" /
          "Не определено" / "Не применимо").
        - Если аффилированность раскрыта положительно, но нет заверения
          о рыночности:
            market_terms_warranty_status = "not_defined";
            market_terms_warranty_display = "Нет заверения о рыночности
              (риск субординации в банкротстве)".
        - Если стороны заверяют, что НЕ являются аффилированными:
            affiliation_type = "not_applicable";
            affiliation_type_display = "Не применимо";
            market_terms_warranty_status = "not_defined";
            market_terms_warranty_display = "Не применимо
              (стороны не аффилированы)";
            affiliation_consequences = "not_defined";
            affiliation_consequences_display = "Не применимо
              (стороны не аффилированы)".
        - Если нет никаких упоминаний об аффилированности:
            affiliation_disclosed_status = "not_defined";
            affiliation_status_display = "Статус не раскрыт
              (риск субординации в банкротстве)";
            market_terms_warranty_display = "Не применимо
              (аффилированность не раскрыта)";
            affiliation_consequences_display = "Не определено".
        - Маппинг display:
            affiliation_type -> affiliation_type_display по правилам <task> п.3;
            market_terms_warranty_status -> market_terms_warranty_display
              по правилам <task> п.6;
            affiliation_consequences -> affiliation_consequences_display
              по правилам <task> п.8.
        - Верни РОВНО один JSON-объект со всеми 9 ключами без какого-либо
          дополнительного текста до или после. Начни ответ сразу
          с открывающей фигурной скобки и закончи закрывающей. НЕ пиши
          Markdown, списки, код-фенсы. Ответ должен быть валидным JSON,
          пригодным для парсинга через json.loads без предварительной
          обработки.
        </rules>
      fields:
        - name: "affiliation_status_display"
          type: "string"
          presentation: "fact"
          label: "Аффилированность сторон"
          description: "User-facing статус аффилированности (раскрыто / не раскрыто / отрицательное заверение)."
          required: true
          display_in_grid: true
          display_priority: 1
        - name: "affiliation_type"
          type: "string"
          presentation: "signal"
          allowed_values: ["common_shareholder", "common_director", "group_of_companies", "parent_subsidiary", "other", "not_applicable", "not_defined"]
          description: "Тип аффилированности (raw enum)."
          required: true
          display_in_grid: false
        - name: "affiliation_type_display"
          type: "string"
          presentation: "fact"
          label: "Тип связанности"
          description: "User-facing тип аффилированности (мать-дочка / общий директор / группа лиц)."
          required: true
          display_in_grid: true
          display_priority: 2
        - name: "affiliation_disclosed_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус раскрытия связанности сторон (raw enum)."
          required: true
          display_in_grid: false
        - name: "market_terms_warranty_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус заверения о рыночности условий (raw enum)."
          required: true
          display_in_grid: false
        - name: "market_terms_warranty_display"
          type: "string"
          presentation: "fact"
          label: "Заверение о рыночности"
          description: "User-facing наличие заверения о рыночности условий займа."
          required: true
          display_in_grid: true
          display_priority: 3
        - name: "affiliation_consequences"
          type: "string"
          presentation: "signal"
          allowed_values: ["not_defined", "subordination_risk", "approval_required", "tax_risk", "combined"]
          description: "Последствия аффилированности (raw enum)."
          required: true
          display_in_grid: false
        - name: "affiliation_consequences_display"
          type: "string"
          presentation: "fact"
          label: "Правовые последствия"
          description: "User-facing резюме правовых последствий аффилированности (субординация, одобрение, налоги)."
          required: true
          display_in_grid: true
          display_priority: 4

  - id: bankruptcy_claw_back_risk_check
    name: "Риск оспаривания займа в банкротстве (ст. 61.2, 61.3 ФЗ-127)"
    description: >
      Фактографическая проверка наличия в договоре заверений об отсутствии
      признаков банкротства у заёмщика и деловой цели сделки. Критично для
      защиты от оспаривания по ст. 61.2 (подозрительная сделка), ст. 61.3
      (сделка с предпочтением) ФЗ-127 «О несостоятельности (банкротстве)».
      Примечание: заверение о рыночности условий проверяется в CHECK 8
      (related_party_loan_check), чтобы избежать дублирования.
    triggers:
      any: ["related_parties", "interest_free_loan", "commercial_parties"]
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "банкротство"
        - "несостоятельность"
        - "признаки неплатежеспособности"
        - "дело о банкротстве"
        - "ликвидация"
        - "финансовое оздоровление"
        - "деловая цель"
        - "экономический смысл"
        - "финансирование деятельности"
        - "инвестиционный проект"
        - "оборотные средства"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)банкротств|несостоятельност"
        - "(?i)признак[и].{0,30}неплатёжеспособн"
        - "(?i)не\\s+возбуждено\\s+дело\\s+о\\s+банкротств"
        - "(?i)делов[а-я]*\\s+цел"
        - "(?i)экономическ(ий|ого)\\s+смысл"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор займа на предмет рисков оспаривания
        в банкротстве (ст. 61.2, 61.3 ФЗ-127 «О несостоятельности (банкротстве)»).
        Проверяются заверения об отсутствии признаков банкротства у заёмщика
        и наличие деловой цели сделки.

        Нормативный ориентир:
        - ст. 61.2 ФЗ-127 — подозрительная сделка: сделка, совершённая в период
          подозрительности (до 1 года для аффилированных, до 6 месяцев
          для независимых) с целью причинения вреда кредиторам, может быть
          оспорена.
        - ст. 61.3 ФЗ-127 — сделка с предпочтением: удовлетворение требований
          одного кредитора в ущерб другим может быть оспорено.
        - Обзор ВС РФ от 29.01.2020 — заверения об отсутствии банкротства
          и деловой цели снижают риск оспаривания займа как подозрительной сделки.
        - ст. 572 ГК РФ — отсутствие деловой цели может привести
          к переквалификации займа в безвозмездную передачу средств
          (дарение между коммерческими лицами запрещено).

        Важно:
        - Твоя задача — установить фактические заверения из текста договора.
        - Не выводи заверения из контекста — только явные формулировки
          в договоре.
        - Заверение о рыночности условий проверяется в CHECK 8, здесь
          не дублируется.

        [ЗАДАЧА]
        Найди в тексте договора (обычно раздел «Заверения сторон»
        или «Особые условия»):
        1. Заверение об отсутствии признаков банкротства / неплатёжеспособности
           у заёмщика.
        2. Указание на деловую цель / экономический смысл сделки.

        [ПРАВИЛА]
        1. Используй только текст документа. Не выдумывай заверения.
        2. Распознавай различные формулировки заверения об отсутствии банкротства:
           - «не имеет признаков неплатёжеспособности»;
           - «в отношении заёмщика не возбуждено дело о банкротстве»;
           - «заёмщик не находится в процессе ликвидации»;
           - «заёмщик не является должником в деле о банкротстве».
        3. Распознавай конкретные деловые цели:
           - «финансирование оборотных средств»;
           - «оплата по контракту / договору поставки»;
           - «инвестиционный проект»;
           - «пополнение оборотных средств»;
           - «рефинансирование задолженности».
        4. Если заверение об отсутствии банкротства не найдено:
           - no_insolvency_warranty_status = "not_defined";
           - no_insolvency_warranty_display = "Нет заверения (риск оспаривания
             по ст. 61.2 127-ФЗ)".
        5. Если деловая цель не указана:
           - economic_purpose_status = "not_defined";
           - economic_purpose_display = "Не указана (риск переквалификации
             в безвозмездную передачу)".
        6. Если формулировка уклончивая и не раскрывает ни банкротство,
           ни деловую цель — соответствующий статус = "not_defined",
           display по правилам п.4 и п.5.
        7. Запрещены значения: null, None, пустые строки — не используй
           их никогда. Допустимые fallback-значения: "not_defined",
           "Не установлено", "Не указана".
        8. В evidence включай только дословные цитаты из текста договора.
        9. Верни РОВНО один JSON-объект со всеми 5 ключами без какого-либо
           дополнительного текста до или после. Начни ответ сразу
           с открывающей фигурной скобки и закончи закрывающей. НЕ пиши
           Markdown, списки, код-фенсы. Ответ должен быть валидным JSON,
           пригодным для парсинга через json.loads без предварительной
           обработки.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — оба заверения есть:
        Фрагмент:
        "9.1. Заёмщик заверяет, что на дату заключения настоящего договора
        не имеет признаков неплатёжеспособности, в отношении Заёмщика
        не возбуждено дело о банкротстве и не проводится ликвидация.
        9.2. Заём предоставляется для финансирования оборотных средств
        Заёмщика в целях исполнения контракта поставки № 45 от 10.01.2024."
