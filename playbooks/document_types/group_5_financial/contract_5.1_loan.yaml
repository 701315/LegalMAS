        }

        Пример 7 — текст есть, но надёжный вывод сделать нельзя
        (уклончивая формулировка о расчётах):
        Фрагмент:
        "Стороны подтверждают, что расчёты по настоящему Договору произведены
        в полном объёме в порядке, предусмотренном законодательством
        Российской Федерации."
        (нет ни указания на конкретный способ передачи, ни внешнего
        подтверждающего документа)
        Ответ:
        {
          "transfer_evidence_status": "not_defined",
          "transfer_evidence_details": "Уклончивая формулировка о расчётах без указания способа передачи и внешнего подтверждения",
          "transfer_evidence_type": "not_defined",
          "transfer_evidence_type_display": "Не определено",
          "transfer_at_signing_status": "not_defined",
          "cash_transfer_risk": "not_defined",
          "transfer_risk_display": "Не определён",
          "evidence": [
            {
              "clause_ref": "п. 4.1",
              "quote": "Стороны подтверждают, что расчёты по настоящему Договору произведены в полном объёме в порядке, предусмотренном законодательством Российской Федерации."
            }
