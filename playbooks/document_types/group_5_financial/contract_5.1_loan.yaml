    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "денежные средства переданы"
        - "получены заемщиком"
        - "расписка"
        - "платежное поручение"
        - "зачислены на счет"
        - "переданы при подписании"
        - "акт передачи"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)денежн(ые|ых)\\s+средств[ао].{0,40}(передан|получен)"
        - "(?i)расписк"
        - "(?i)платежн(ое|ого)\\s+поручени"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор займа (§ 1 Главы 42 ГК РФ, ст. 808, 812).
        Проверяется только один вопрос: наличие доказательств фактической
        передачи суммы займа и риск безденежности.
        Нормативный ориентир:
        - ст. 808 ГК РФ — форма договора займа
        - ст. 812 ГК РФ — безденежность
        Важно:
        - Твоя задача — не оценивать серьёзность риска.
        - Только установить, что прямо есть в тексте договора, а чего прямо нет.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Есть ли подтверждение передачи займа (расписка, акт, платёжное поручение).
        2. Тип подтверждения.
        3. Указание на передачу при подписании договора.
        4. Риск безденежности при наличной передаче.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Если подтверждение не найдено — возвращай "not_defined".
        3. Не используй "None", "null" или пустые строки.
        4. В evidence включай только текст договора.
        5. Верни только один JSON-объект.

        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1:
        Фрагмент:
        "Денежные средства в размере 3 000 000 рублей переданы Заёмщику
        при подписании настоящего договора, что подтверждается распиской
        Заёмщика (Приложение № 1)."
        Ответ:
        {
          "transfer_evidence_status": "defined",
          "transfer_evidence_details": "расписка Заёмщика (Приложение № 1)",
          "transfer_evidence_type": "receipt",
          "transfer_at_signing_status": "defined",
          "cash_transfer_risk": "high",
          "evidence": [
            {
              "clause_ref": "п. 2.1",
              "quote": "Денежные средства в размере 3 000 000 рублей переданы Заёмщику при подписании настоящего договора, что подтверждается распиской Заёмщика (Приложение № 1)."
            }
          ]
        }

        Пример 2:
        Фрагмент:
        "Займодавец предоставляет Заёмщику заём."
        Ответ:
        {
          "transfer_evidence_status": "not_defined",
          "transfer_evidence_details": "Данные не определены",
          "transfer_evidence_type": "not_defined",
          "transfer_at_signing_status": "not_defined",
          "cash_transfer_risk": "not_defined",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о передаче средств.
        2. Найди прямую цитату о подтверждающем документе.
        3. Найди прямую цитату о передаче при подписании.
        4. Если прямой цитаты нет — верни "not_defined".
        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        {
          "transfer_evidence_status": "<defined / not_defined>",
          "transfer_evidence_details": "<текст или 'Данные не определены'>",
          "transfer_evidence_type": "<receipt / payment_order / act / contract_clause / not_defined>",
          "transfer_at_signing_status": "<defined / not_defined>",
          "cash_transfer_risk": "<high / medium / low / not_defined>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 5
      temperature: 0.0
      max_tokens: 500
      retrieval:
        retrieval_profile: "payment_terms_check"
        corpus_scope: "primary_segment"
        levels:
          - "legal_unit"
          - "section"
        required_kind: "legal_unit"
        retrieval_query: "расписка платежное поручение переданы получены зачислены на счет акт передачи передача при подписании подтверждение передачи займа"
        preferred_unit_types:
          - obligation
          - general_provision
        excluded_unit_types:
          - definition
          - structural_anchor
          - technical_fragment
        preferred_clause_functions:
          - obligations
          - procedures
        negative_keywords:
          - "проценты"
          - "неустойка"
          - "обеспечение"
          - "залог"
          - "аффилированность"
          - "означает"
          - "в целях настоящего"
        position_bias:
          preferred_range: [0.05, 0.50]
          boost: 0.20
          scope: segment
        context_k: 5
        max_chunks: 8
        rerank: true
        enrichment_hints:
          preferred_segment_types:
            - "contract"
            - "amendment"
          excluded_segment_types:
            - "technical_specification"
            - "price_list"
          preferred_clause_functions:
            - "obligations"
            - "procedures"
          confidence_bonus_on_match: 0.10
          confidence_penalty_on_excluded_segment: 0.12
      evidence:
        required: true
        min_snippet_length: 40
        max_snippet_length: 600
      extraction:
        enabled: true
        mode: "hybrid"
        compact_output: false
        llm_max_tokens: 600
        llm_prompt_extraction: |
          <role>
          Ты — российский юрист. Извлеки из текста договора займа сведения
          о подтверждении фактической передачи суммы займа.
          Не анализируй проценты, срок возврата или иные темы.
          </role>
          <context>
          {context}
          </context>
          <task>
          Заполни строго следующие поля:
          1. transfer_evidence_status — "defined" если подтверждение передачи
             прямо указано, иначе "not_defined".
          2. transfer_evidence_details — формулировка о подтверждении.
          3. transfer_evidence_type — receipt / payment_order / act / contract_clause / not_defined.
          4. transfer_at_signing_status — "defined" если передача при подписании
             прямо указана, иначе "not_defined".
          5. cash_transfer_risk — high / medium / low / not_defined.
          Если данные отсутствуют:
          - статус = "not_defined"
          - текст = "Данные не определены"
          </task>
          <rules>
          - Используй только текст договора.
          - transfer_evidence_type:
            "receipt" — расписка;
            "payment_order" — платёжное поручение;
            "act" — акт передачи;
            "contract_clause" — указание в самом договоре;
            "not_defined" — не определено.
          - cash_transfer_risk: "high" — наличная передача без внешнего документа;
            "medium" — наличная передача с распиской;
            "low" — безналичная передача;
            "not_defined" — способ не определён.
          - Верни только JSON.
          </rules>
        fields:
          - name: "transfer_evidence_status"
            type: "string"
            presentation: "signal"
            allowed_values: ["defined", "not_defined"]
            description: "Статус подтверждения передачи займа."
            required: true
          - name: "transfer_evidence_details"
            type: "string"
            presentation: "fact"
            label: "Подтверждение передачи"
            description: "Формулировка о подтверждении передачи займа."
            required: false
            display_in_grid: true
            display_priority: 1
          - name: "transfer_evidence_type"
            type: "string"
