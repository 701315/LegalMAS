    extraction:
      store_payload: true

      enabled: true
      mode: "hybrid"
      compact_output: false
      llm_max_tokens: 1000
      llm_prompt_extraction: |
        <role>
        Ты — российский юрист по договорной работе. Извлеки из текста
        договора займа сведения о предмете займа (деньги или вещи),
        сумме/количестве и валюте обязательства.
        Не анализируй проценты, срок возврата или иные темы — только
        предмет, сумму и валюту.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие 6 полей + evidence (всего 7 ключей).
        Верни все ключи, даже если данные отсутствуют.

        1.  loan_kind — "money" / "fungible_goods" / "mixed" / "not_defined":
              - "money" — денежный заём (по умолчанию, если не указано иное);
              - "fungible_goods" — заём вещей, определённых родовыми
                признаками;
              - "mixed" — смешанный (деньги + вещи), крайне редко;
              - "not_defined" — предмет не определён.
        2.  loan_kind_display — user-facing строка:
              - "Денежный заём";
              - "Заём вещей";
              - "Смешанный заём";
              - "Не определён".
        3.  loan_amount_status — "defined" / "not_defined".
        4.  loan_amount_value — сумма/количество или "Не установлено"
            или "Согласно Приложению № N" (если определяется через
            приложение).
        5.  currency — "RUB" / "USD" / "EUR" / "CNY" / "other" /
            "not_applicable" / "not_defined".
              Приоритет: если loan_kind = "fungible_goods" —
              currency = "not_applicable" (не "not_defined").
        6.  currency_display — user-facing строка:
              - "Рубли РФ";
              - "Доллары США";
              - "Евро";
              - "Юани КНР";
              - "Иная валюта";
              - "Не применимо (вещевой заём)";
              - "Не установлено";
              - "Согласно Приложению № N".

        Дополнительно — обязательный массив evidence:
        - хотя бы одна цитата с предметом/суммой/валютой, если данные
          найдены;
        - пустой массив [], если ничего не найдено.

        Правила заполнения при отсутствии данных:
        - статус = "not_defined";
        - текстовое поле = "Не установлено";
        - enum-поле = "not_defined".
        </task>

        <rules>
        - Используй только текст договора. Не выдумывай суммы, валюты.
        - Не используй null, None или пустые строки — только явные
          fallback-значения ("Не установлено" / "not_defined" /
          "not_applicable").
        - Если сумма/валюта определяется через приложение/график/
          спецификацию — верни формулировку "Согласно Приложению № N",
          не "not_defined".
        - Если в документе несколько редакций условий о сумме —
          использовать последнюю по позиции.
        - Для вещевого займа: currency = "not_applicable",
          currency_display = "Не применимо (вещевой заём)".
        - loan_kind = "money" — денежный заём (по умолчанию).
        - loan_kind = "fungible_goods" — заём вещей, определённых
          родовыми признаками (мешки пшеницы, литры нефти и т.п.).
        - loan_kind = "mixed" — смешанный (деньги + вещи), крайне редко.
        - Верни РОВНО один JSON-объект со всеми 7 ключами без какого-либо
          дополнительного текста до или после. Начни ответ сразу
          с открывающей фигурной скобки и закончи закрывающей. НЕ пиши
          Markdown, списки, код-фенсы. Ответ должен быть валидным JSON,
          пригодным для парсинга через json.loads без предварительной
          обработки.
        </rules>
      fields:
        - name: "loan_kind"
          type: "string"
          presentation: "signal"
          allowed_values: ["money", "fungible_goods", "mixed", "not_defined"]
          description: "Предмет займа (raw enum)."
          required: true
          display_in_grid: false
        - name: "loan_kind_display"
          type: "string"
          presentation: "fact"
          label: "Предмет займа"
          description: "User-facing тип займа: денежный / вещевой / смешанный."
          required: true
          display_in_grid: true
          display_priority: 1
        - name: "loan_amount_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Статус определения суммы/количества займа (raw enum)."
          required: true
          display_in_grid: false
        - name: "loan_amount_value"
          type: "string"
          presentation: "fact"
          label: "Сумма займа"
          description: "Сумма или количество предмета займа."
          required: true
          display_in_grid: true
          display_priority: 2
        - name: "currency"
          type: "string"
          presentation: "signal"
          allowed_values: ["RUB", "USD", "EUR", "CNY", "other", "not_applicable", "not_defined"]
          description: "Валюта займа (raw enum)."
          required: true
          display_in_grid: false
        - name: "currency_display"
          type: "string"
          presentation: "fact"
          label: "Валюта"
          description: "User-facing валюта займа."
          required: true
          display_in_grid: true
          display_priority: 3

  - id: loan_interest_terms
    name: "Проценты по займу: процентность, ставка, база начисления, периодичность"
    description: >
      Фактографическая проверка процентности займа (процентный / беспроцентный),
      процентной ставки, базы начисления процентов и периодичности уплаты.
      Учитывает презумпцию возмездности денежного займа по ст. 809(1) ГК РФ:
      если ставка не указана прямо и не сказано «беспроцентный» — применяется
      ключевая ставка Банка России, действовавшая в соответствующие периоды.
      База начисления (сумма займа vs остаток задолженности) и периодичность
      уплаты критичны для финансовой модели сделки.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "проценты"
        - "процентная ставка"
        - "ставка"
        - "беспроцентный"
        - "беспроцентно"
        - "годовых"
        - "% годовых"
        - "ключевая ставка"
        - "ставка ЦБ"
        - "на остаток задолженности"
        - "на фактический остаток"
        - "на сумму займа"
        - "ежемесячно"
        - "при возврате"
        - "капитализация"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)\\b\\d+(?:[.,]\\d+)?\\s*%\\b"
        - "(?i)\\b\\d+(?:[.,]\\d+)?\\s*процент"
        - "(?i)беспроцент"
        - "(?i)процент[а-я]*\\s+ставк"
        - "(?i)остат(ок|ка)\\s+задолженн"
        - "(?i)на\\s+сумм[уы]\\s+за[её]ма"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор займа (§ 1 Главы 42 ГК РФ, ст. 809).
        Проверяется только один вопрос: процентность займа (процентный или
        беспроцентный), процентная ставка, база начисления процентов
        и периодичность их уплаты.

        Нормативный ориентир:
        - ст. 809(1) ГК РФ — презумпция возмездности денежного займа:
          если иное не предусмотрено договором или законом, займодавец
          вправе получать проценты. Размер процентов — ключевая ставка
          Банка России, действовавшая в соответствующие периоды, если
          договор не определяет ставку иначе.
        - ст. 809(3) ГК РФ — беспроцентными являются:
          (а) займы между гражданами на сумму ≤ 100 000 ₽ (если иное
              не предусмотрено);
          (б) займы, по которым прямо указано «беспроцентный».
        - ст. 809(3) ГК РФ — если периодичность уплаты процентов
          не установлена договором, проценты выплачиваются ежемесячно
          до дня возврата суммы займа.
        - ст. 317.1 ГК РФ — капитализация процентов (присоединение
          неуплаченных процентов к сумме долга) допустима, если
          предусмотрена договором.

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте
          договора.
        - Применяй презумпцию ст. 809(1), если текст молчит
          о процентности.
        - Не оценивай серьёзность риска.

        [ЗАДАЧА]
        Найди в тексте договора (обычно п. 2–3 «Права и обязанности сторон»
        или «Проценты»):
        1. Процентность (процентный / беспроцентный).
        2. Процентную ставку (если процентный).
        3. Базу начисления процентов (на сумму займа / на остаток
           задолженности).
        4. Периодичность уплаты процентов (ежемесячно / при возврате /
           иное).

        [ПРАВИЛА]
        1. Используй только текст документа. Не выдумывай ставки, базу,
           периодичность.
        2. Если данные не указаны прямо — применяй презумпцию ст. 809(1)
           ГК РФ (см. логику ниже).
        3. Запрещены значения: null, None, пустые строки — не используй
           их никогда. Допустимые fallback-значения: "not_defined",
           "not_applicable", "Не применимо", "Не установлена".
        4. Если ставка определяется через приложение/график — верни
           формулировку "Согласно Графику процентов (Приложение № N)".
        5. Если база начисления не указана — по умолчанию считай
           "на остаток задолженности" (стандарт российской практики).
        6. Если периодичность уплаты не указана — по ст. 809(3) ГК РФ
           применяй "ежемесячно до дня возврата суммы займа".
        7. Если в документе несколько редакций условий о ставке —
           использовать последнюю по позиции.
        8. В evidence включай только дословные цитаты из текста договора.
        9. Верни РОВНО один JSON-объект со всеми 9 ключами без какого-либо
           дополнительного текста до или после. Начни ответ сразу
           с открывающей фигурной скобки и закончи закрывающей. НЕ пиши
           Markdown, списки, код-фенсы. Ответ должен быть валидным JSON,
           пригодным для парсинга через json.loads без предварительной
           обработки.

        Логика заполнения (ст. 809(1) ГК РФ):
        - Если прямо указана ставка → interest_bearing + конкретная ставка.
        - Если прямо сказано «беспроцентный» → interest_free + "Не применимо".
        - Если НИ ставка, НИ «беспроцентный» не указаны → interest_bearing +
          "Ставка не установлена (применяется ключевая ставка Банка России,
          действовавшая в соответствующие периоды, по ст. 809(1) ГК РФ)".

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — процентный заём с явной ставкой, база и периодичность указаны:
        Фрагмент:
        "2.1. Заём является процентным. Процентная ставка составляет
        12% (Двенадцать процентов) годовых от остатка задолженности по займу.
        Проценты начисляются со дня, следующего за днём передачи суммы займа,
        и уплачиваются Заёмщиком ежемесячно, не позднее 5-го числа месяца,
        следующего за отчётным."
        Ответ:
        {
          "interest_status": "interest_bearing",
          "interest_status_display": "Процентный",
          "interest_rate": "12% годовых от остатка задолженности по займу",
          "interest_rate_display": "12% годовых",
          "calculation_base": "outstanding_balance",
          "calculation_base_display": "На остаток задолженности",
          "payment_frequency": "monthly",
          "payment_frequency_display": "Ежемесячно",
          "evidence": [
            {
              "clause_ref": "п. 2.1",
              "quote": "Заём является процентным. Процентная ставка составляет 12% (Двенадцать процентов) годовых от остатка задолженности по займу. Проценты начисляются со дня, следующего за днём передачи суммы займа, и уплачиваются Заёмщиком ежемесячно, не позднее 5-го числа месяца, следующего за отчётным."
            }
          ]
        }

        Пример 2 — беспроцентный заём:
        Фрагмент:
        "Настоящий договор займа является беспроцентным. Проценты за пользование
        суммой займа не начисляются и не уплачиваются."
        Ответ:
        {
          "interest_status": "interest_free",
          "interest_status_display": "Беспроцентный",
          "interest_rate": "Не применимо (беспроцентный заём)",
          "interest_rate_display": "Не применимо",
          "calculation_base": "not_applicable",
          "calculation_base_display": "Не применимо (беспроцентный заём)",
          "payment_frequency": "not_applicable",
          "payment_frequency_display": "Не применимо (беспроцентный заём)",
          "evidence": [
            {
              "clause_ref": "п. 2.1",
              "quote": "Настоящий договор займа является беспроцентным. Проценты за пользованием суммой займа не начисляются и не уплачиваются."
            }
          ]
        }

        Пример 3 — процентный заём, ставка не указана (презумпция ст. 809(1)):
        Фрагмент:
        "Займодавец передаёт Заёмщику 5 000 000 рублей на срок до 31.12.2026.
        Заёмщик обязуется возвратить сумму займа в указанный срок."
        (нет упоминания о процентах, нет слова «беспроцентный»)
        Ответ:
        {
          "interest_status": "interest_bearing",
          "interest_status_display": "Процентный (применяется ключевая ставка Банка России, действовавшая в соответствующие периоды, по ст. 809(1) ГК РФ)",
          "interest_rate": "Ставка не установлена (применяется ключевая ставка Банка России, действовавшая в соответствующие периоды, по ст. 809(1) ГК РФ)",
          "interest_rate_display": "Ключевая ставка Банка России (по умолчанию, ст. 809(1) ГК РФ)",
          "calculation_base": "outstanding_balance",
          "calculation_base_display": "На остаток задолженности (по умолчанию)",
          "payment_frequency": "monthly",
          "payment_frequency_display": "Ежемесячно (по умолчанию, ст. 809(3) ГК РФ)",
          "evidence": []
        }

        Пример 4 — ставка по графику, база не указана, периодичность не указана:
        Фрагмент:
        "Процентная ставка определяется согласно Графику процентов
        (Приложение № 2 к настоящему договору)."
        Ответ:
        {
          "interest_status": "interest_bearing",
          "interest_status_display": "Процентный",
          "interest_rate": "Согласно Графику процентов (Приложение № 2)",
          "interest_rate_display": "Согласно Графику процентов (Приложение № 2)",
          "calculation_base": "outstanding_balance",
          "calculation_base_display": "На остаток задолженности (по умолчанию)",
          "payment_frequency": "monthly",
          "payment_frequency_display": "Ежемесячно (по умолчанию, ст. 809(3) ГК РФ)",
          "evidence": [
            {
              "clause_ref": "п. 2.1",
              "quote": "Процентная ставка определяется согласно Графику процентов (Приложение № 2 к настоящему договору)."
            }
          ]
        }

        Пример 5 — ставка указана, база «на сумму займа», уплата при возврате:
        Фрагмент:
        "Ставка — 8% годовых на сумму займа. Проценты уплачиваются единовременно
        при возврате основного долга."
        Ответ:
        {
          "interest_status": "interest_bearing",
          "interest_status_display": "Процентный",
          "interest_rate": "8% годовых на сумму займа",
          "interest_rate_display": "8% годовых",
          "calculation_base": "principal",
          "calculation_base_display": "На сумму займа",
          "payment_frequency": "at_maturity",
          "payment_frequency_display": "При возврате основного долга",
          "evidence": [
            {
              "clause_ref": "п. 2.1",
              "quote": "Ставка — 8% годовых на сумму займа. Проценты уплачиваются единовременно при возврате основного долга."
            }
          ]
        }

        Пример 6 — ставка указана, база указана, периодичность ежеквартально:
        Фрагмент:
        "Процентная ставка — 15% годовых на фактический остаток задолженности.
        Проценты уплачиваются ежеквартально."
        Ответ:
        {
          "interest_status": "interest_bearing",
          "interest_status_display": "Процентный",
          "interest_rate": "15% годовых на фактический остаток задолженности",
          "interest_rate_display": "15% годовых",
          "calculation_base": "outstanding_balance",
          "calculation_base_display": "На остаток задолженности",
          "payment_frequency": "quarterly",
          "payment_frequency_display": "Ежеквартально",
          "evidence": [
            {
              "clause_ref": "п. 2.1",
              "quote": "Процентная ставка — 15% годовых на фактический остаток задолженности. Проценты уплачиваются ежеквартально."
            }
          ]
        }

        Пример 7 — текст есть, но надёжный вывод сделать нельзя
        (уклончивая формулировка про ставку):
        Фрагмент:
        "3.2. Размер процентов за пользование суммой займа определяется
        Сторонами в дополнительном соглашении к настоящему Договору."
        (нет ни конкретной ставки, ни слова «беспроцентный»;
        отсылка к будущему документу — не приложение к договору)
        Ответ:
        {
          "interest_status": "interest_bearing",
          "interest_status_display": "Процентный (ставка определяется дополнительным соглашением)",
          "interest_rate": "Ставка не установлена (определяется дополнительным соглашением)",
          "interest_rate_display": "Не установлена (определяется дополнительным соглашением)",
          "calculation_base": "outstanding_balance",
          "calculation_base_display": "На остаток задолженности (по умолчанию)",
          "payment_frequency": "monthly",
          "payment_frequency_display": "Ежемесячно (по умолчанию, ст. 809(3) ГК РФ)",
          "evidence": [
            {
              "clause_ref": "п. 3.2",
              "quote": "Размер процентов за пользование суммой займа определяется Сторонами в дополнительном соглашении к настоящему Договору."
            }
          ]
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о процентности (процентный/беспроцентный).
        2. Найди прямую цитату о ставке (если процентный).
        3. Найди прямую цитату о базе начисления («на сумму займа» /
           «на остаток задолженности» / «на фактический остаток» и т.п.).
        4. Найди прямую цитату о периодичности уплаты («ежемесячно» /
           «ежеквартально» / «при возврате» / «единовременно» и т.п.).
        5. Если ни цитаты о процентности, ни о ставке нет — применяй
           презумпцию ст. 809(1): interest_bearing + ключевая ставка
           Банка России, действовавшая в соответствующие периоды.
        6. Если база начисления не указана — применяй "outstanding_balance"
           (стандарт российской практики).
        7. Если периодичность уплаты не указана — применяй "monthly"
           (по ст. 809(3) ГК РФ).
        8. Если ставка отнесена к «дополнительному соглашению» (а не
           к существующему приложению), статус = "interest_bearing",
           display для ставки = "Не установлена (определяется
           дополнительным соглашением)".
        9. Проверь, что все 9 ключей (8 полей + evidence) присутствуют
           в JSON.
        10. Проверь, что *_display поля собраны из соответствующих значений.
        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь РОВНО одним JSON-объектом без какого-либо дополнительного
        текста до или после, со всеми 9 ключами:
        {
          "interest_status": "<interest_bearing / interest_free>",
          "interest_status_display": "<Процентный / Беспроцентный / Процентный (применяется ключевая ставка Банка России, действовавшая в соответствующие периоды, по ст. 809(1) ГК РФ) / Процентный (ставка определяется дополнительным соглашением)>",
          "interest_rate": "<ставка или 'Не применимо (беспроцентный заём)' / 'Ставка не установлена (применяется ключевая ставка Банка России, действовавшая в соответствующие периоды, по ст. 809(1) ГК РФ)' / 'Ставка не установлена (определяется дополнительным соглашением)' / 'Согласно Графику процентов (Приложение № N)'>",
          "interest_rate_display": "<12% годовых / Не применимо / Ключевая ставка Банка России (по умолчанию, ст. 809(1) ГК РФ) / Не установлена (определяется дополнительным соглашением) / Согласно Графику процентов (Приложение № N)>",
          "calculation_base": "<principal / outstanding_balance / not_applicable>",
          "calculation_base_display": "<На сумму займа / На остаток задолженности / На остаток задолженности (по умолчанию) / Не применимо (беспроцентный заём)>",
          "payment_frequency": "<monthly / quarterly / at_maturity / other / not_applicable>",
          "payment_frequency_display": "<Ежемесячно / Ежеквартально / При возврате основного долга / Иная периодичность / Ежемесячно (по умолчанию, ст. 809(3) ГК РФ) / Не применимо (беспроцентный заём)>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
