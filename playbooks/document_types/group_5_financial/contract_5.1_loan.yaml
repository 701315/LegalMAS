        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о триггере конвертации (когда происходит).
        2. Найди прямую цитату о формуле расчёта доли (процент / количество
           акций).
        3. Найди упоминание кэпа оценки или дисконта к раунду.
        4. Найди описание корпоративных действий (увеличение УК, ЕГРЮЛ,
           зачёт, эмиссия).
        5. Проверь дихотомию ООО / АО: для ООО — «доли», для АО — «акции»;
           если форма неясна — нейтральное «доли / акции».
        6. Проверь, что все 9 ключей (8 полей + evidence) присутствуют
           в JSON.
        7. Если конвертация не предусмотрена — верни «Не применимо»
           для всех полей.
        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь РОВНО одним JSON-объектом без какого-либо дополнительного
        текста до или после, со всеми 9 ключами:
        {
          "conversion_trigger": "<maturity / next_round / at_will / other / not_defined / not_applicable>",
          "conversion_trigger_display": "<По требованию займодавца (в любое время до погашения) / При следующем раунде финансирования / По истечении срока займа / Не определено (риск спора) / Не применимо (заём без права конвертации)>",
          "conversion_formula_status": "<defined / not_defined / not_applicable>",
          "conversion_formula_display": "<Формула определена (…) / Не определена (риск корпоративного спора) / Не применимо>",
          "valuation_cap_or_discount_status": "<defined / not_defined / not_applicable>",
          "valuation_cap_display": "<Кэп: N рублей / Дисконт: N% / Не установлен / Не применимо>",
          "corporate_actions_status": "<defined / not_defined / not_applicable>",
          "corporate_actions_display": "<Описаны (…) / Не описаны (риск неисполнимости) / Не применимо>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
