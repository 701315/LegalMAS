  protective_clauses:
    buyer_protection:
      - clause_id: "warranties_and_ip_validity"
        name: "Гарантии лицензиара и обеспечение действительности исключительного права"
        risk_if_missing: |
          Лицензиат инвестирует в использование объекта ИС. Если право лицензиара оспорено или патент аннулирован, 
          лицензия становится бесполезной. Без гарантий наличия прав и обязательств лицензиара поддерживать их 
          действительность (уплачивать пошлины, защищать от нарушителей) лицензиат несет все риски недействительности лицензии.
        legal_base: "ст. 1235, 431.2, 1252 ГК РФ"
        severity: "critical"
        affected_party: "buyer"
        detection:
          positive_keywords:
            - "лицензиар гарантирует наличие права"
            - "исключительное право действительно"
            - "отсутствие обременений"
            - "обязанность поддерживать патент в силе"
            - "уплата патентных пошлин"
            - "защита от нарушений третьими лицами"
            - "прединфрингинг"
            - "уведомление о претензиях третьих лиц"
          context_patterns:
            - '(?i)лицензиар\s+гарантирует.*что\s+является\s+правообладател\w+\s+и\s+право\s+не\s+обременено'
            - '(?i)лицензиар\s+обязуется\s+поддерживать\s+действительность\s+(патента|товарного\s+знака)'
        extraction_hints: {}
      - clause_id: "defense_against_infringement"
        name: "Обязанность лицензиара защищать право от нарушителей"
        risk_if_missing: |
          Если третьи лица нарушают исключительное право, лицензиат (особенно при неисключительной лицензии) может быть 
          не вправе предъявлять иски самостоятельно. Без обязанности лицензиара защищать право лицензиат страдает от 
          конкуренции нарушителей, но не может защититься.
        legal_base: "ст. 1254 ГК РФ"
        severity: "high"
        affected_party: "buyer"
        detection:
          positive_keywords:
            - "защита от нарушителей"
            - "пресечение нарушений"
            - "обязанность защищать право"
            - "иск к нарушителям"
            - "содействие в защите"
            - "право лицензиата защищать"
          context_patterns:
            - '(?i)лицензиар\s+обязуется\s+пресекать\s+нарушения\s+права'
            - '(?i)лицензиат\s+вправе\s+предъявлять\s+иски\s+к\s+нарушителям'
        extraction_hints: {}
    seller_protection:
      - clause_id: "royalty_reporting_and_audit"
        name: "Отчетность лицензиата и право аудита (при роялти)"
        risk_if_missing: |
          При вознаграждении в виде роялти лицензиар зависит от честности отчетности лицензиата. 
          Без права аудита и четких требований к отчетности лицензиат может занижать показатели, 
          и лицензиар недополучит вознаграждение. Особенно критично при процентных отчислениях от выручки.
        legal_base: "ст. 1235, 1237 ГК РФ"
        severity: "critical"
        affected_party: "seller"
        detection:
          positive_keywords:
            - "отчетность лицензиата"
            - "отчет о продажах"
            - "отчет об использовании"
            - "право аудита"
            - "проверка бухгалтерии"
            - "периодические отчеты"
            - "расчет роялти"
            - "подтверждающие документы"
          context_patterns:
            - '(?i)лицензиат\s+обязан\s+представлять\s+отчеты\s+об\s+использовании'
            - '(?i)лицензиар\s+вправе\s+проводить\s+аудит.*для\s+проверки\s+(расчета\s+)?роялти'
        conditional_checks:
          - trigger: "royalty_payment"
            keywords: ["роялти", "процент от выручки", "процент от продаж", "периодические платежи"]
            rule: "reporting_and_audit_required"
            severity: "critical"
        extraction_hints: {}
      - clause_id: "quality_control_trademark"
        name: "Контроль качества продукции/услуг под товарным знаком"
        risk_if_missing: |
          При лицензировании товарного знака лицензиар несет репутационные риски. Без контроля качества 
          лицензиат может выпускать некачественную продукцию, что нанесет ущерб репутации бренда. 
          Потеря контроля качества - основание для досрочной отмены регистрации товарного знака.
        legal_base: "ст. 1489, 1486 ГК РФ"
        severity: "critical"
        affected_party: "seller"
        detection:
          positive_keywords:
            - "контроль качества"
            - "стандарты качества"
            - "требования к продукции"
            - "соответствие стандартам"
            - "инспекция качества"
            - "одобрение образцов"
            - "маркировка"
            - "руководство по бренду"
          context_patterns:
            - '(?i)лицензиат\s+обязан\s+соблюдать\s+стандарты\s+качества'
            - '(?i)лицензиар\s+вправе\s+контролировать\s+качество.*продукции'
        conditional_checks:
          - trigger: "trademark_license"
            keywords: ["товарный знак", "торговая марка", "бренд", "знак обслуживания"]
            rule: "quality_control_mandatory"
            severity: "critical"
        extraction_hints: {}

  additional_protective_clauses:
    buyer_protection:
      - clause_id: "most_favored_licensee"
        name: "Условие о наиболее благоприятном режиме (MFN)"
        risk_if_missing: |
          При неисключительной лицензии лицензиар может выдать другим лицензиатам более выгодные условия (ниже роялти, шире права). 
          Без условия MFN лицензиат может оказаться в неконкурентном положении по сравнению с последующими лицензиатами.
        legal_base: "Договорная практика, ст. 1 ГК РФ (добросовестность)"
        severity: "medium"
        affected_party: "buyer"
        detection:
          positive_keywords:
            - "наиболее благоприятные условия"
            - "MFN"
            - "most favored licensee"
            - "равные условия"
            - "не хуже условий других лицензиатов"
          context_patterns:
            - '(?i)условия.*не\s+менее\s+благоприятны.*чем.*другим\s+лицензиатам'
            - '(?i)в\s+случае\s+предоставления.*более\s+выгодных\s+условий.*автоматически\s+распространяются'
        extraction_hints: {}
      - clause_id: "improvements_and_derivatives"
        name: "Права на улучшения и производные произведения"
        risk_if_missing: |
          Лицензиат может создать улучшения, модификации, производные произведения на основе лицензированного объекта. 
          Без урегулирования прав на них возникают споры: принадлежат ли они лицензиату, лицензиару или совместно? 
          Может ли лицензиат использовать их после прекращения лицензии?
        legal_base: "ст. 1259, 1260, 1358 ГК РФ"
        severity: "high"
        affected_party: "buyer"
        detection:
          positive_keywords:
            - "улучшения"
            - "модификации"
            - "производные произведения"
            - "права на улучшения"
            - "обратная лицензия"
            - "grant-back"
            - "совместные права"
          context_patterns:
            - '(?i)права\s+на\s+улучшения.*принадлежат\s+(лицензиату|лицензиару|сторонам\s+совместно)'
            - '(?i)лицензиат\s+вправе\s+создавать\s+производные\s+произведения'
        extraction_hints: {}
    seller_protection:
      - clause_id: "minimum_royalty_guarantee"
        name: "Минимальные гарантированные платежи (minimum guarantee)"
        risk_if_missing: |
          При вознаграждении только в виде роялти лицензиар зависит от активности лицензиата. Если лицензиат не использует 
          объект (или использует минимально), лицензиар не получает вознаграждения. Минимальный гарантированный платеж 
          обеспечивает базовый доход и стимулирует лицензиата к активному использованию.
        legal_base: "ст. 1235 п. 5 ГК РФ"
        severity: "high"
        affected_party: "seller"
        detection:
          positive_keywords:
            - "минимальный платеж"
            - "минимальное роялти"
            - "гарантированный платеж"
            - "minimum guarantee"
            - "минимальный объем использования"
            - "неснижаемый платеж"
          context_patterns:
            - '(?i)минимальн\w+\s+(гарантированн\w+\s+)?платеж\s+составляет'
            - '(?i)роялти\s+выплачивается\s+в\s+размере\s+не\s+менее'
        extraction_hints: {}
      - clause_id: "non_assertion_covenant"
        name: "Обязательство лицензиата не оспаривать право"
        risk_if_missing: |
          Лицензиат, получив доступ к информации об объекте, может попытаться оспорить патент или товарный знак лицензиара. 
          Хотя такие условия имеют ограниченную силу (особенно в ЕС), в России они применяются. Без такого условия лицензиар 
          рискует потерять право по иску лицензиата.
        legal_base: "ст. 10 ГК РФ, судебная практика"
        severity: "medium"
        affected_party: "seller"
        detection:
          positive_keywords:
            - "не оспаривать право"
            - "non-assertion"
            - "запрет оспаривания"
            - "признание действительности"
            - "отказ от претензий к праву"
          context_patterns:
            - '(?i)лицензиат\s+обязуется\s+не\s+оспаривать.*прав\w+\s+лицензиар'
            - '(?i)лицензиат\s+признает\s+действительность.*права'
        extraction_hints: {}
    both_protection:
      - clause_id: "registration_procedure"
        name: "Порядок государственной регистрации и распределение расходов"
        risk_if_missing: |
          Для регистрируемых объектов лицензия вступает в силу с момента регистрации. Без четкого распределения обязанностей 
          стороны могут затягивать процесс. Споры о расходах на регистрацию - частая проблема.
        legal_base: "ст. 1232, 1235 ГК РФ"
        severity: "high"
        affected_party: "both"
        detection:
          positive_keywords:
            - "регистрация лицензии"
            - "расходы на регистрацию"
            - "государственная пошлина"
            - "подача заявления в Роспатент"
            - "обязанность по регистрации"
          context_patterns:
            - '(?i)расходы\s+на\s+регистрацию.*несет\s+(лицензиар|лицензиат|стороны\s+поровну)'
            - '(?i)заявление\s+о\s+регистрации.*подается\s+(лицензиаром|лицензиатом|совместно)'
        conditional_checks:
          - trigger: "registrable_ip"
            keywords: ["патент", "товарный знак", "Роспатент"]
            rule: "registration_procedure_required"
            severity: "high"
        extraction_hints: {}

