type: contract_7.2_license
name: "Лицензионный договор"

description: |
  Соглашение, по которому правообладатель (лицензиар) предоставляет или обязуется предоставить другой стороне (лицензиату) право использования результата интеллектуальной деятельности или средства индивидуализации в установленных пределах. Исключительное право не отчуждается, лицензиар остается правообладателем. Лицензия бывает исключительной (лицензиар не может выдавать лицензии другим и может быть ограничен в собственном использовании) и неисключительной (простой). Для объектов, подлежащих регистрации (патенты, товарные знаки), договор подлежит государственной регистрации в Роспатенте. Регулируется § 6 Главы 69, § 5 Главы 71 и § 5 Главы 72 ГК РФ.

version: 2.1
parent: class_7_intellectual_property

metadata:
  category: contract
  subcategory: intellectual_property
  complexity: high
  risk_level: medium-high
  jurisdiction: RU
  language: ru
  legal_base: "ГК РФ, ч. 4, ст. 1235"
  doc_types_supported:
    - "Лицензионное соглашение"
    - "Договор о предоставлении права использования"
    - "Лицензия на использование"
    - "Патентная лицензия"
    - "Лицензия на товарный знак"
    - "Авторский лицензионный договор"

engine_expectations:
  evidence_required: true
  evidence_style: "pinpoint"
  allow_not_found: true
  output_style: "dd_grid"
  prefer_structured_outputs: true

