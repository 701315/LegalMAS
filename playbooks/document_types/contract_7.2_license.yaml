# ════════════════════════════════
#  VALIDATION ENGINE v3.2
# ════════════════════════════════
validation_engine_v3_2:
  rules_enhanced:
    phrases:
      high:
        - "Лицензиар предоставляет Лицензиату право использования [объект ИС] на условиях настоящего договора"
        - "Лицензия является исключительной/неисключительной (простой)"
        - "Лицензиат выплачивает вознаграждение в виде [фиксированного платежа / роялти]"
        - "Право использования предоставляется на срок [срок] и на территории [территория]"
        - "Лицензиар гарантирует наличие исключительного права"
      medium:
        - "Лицензиат обязуется предоставлять регулярные отчеты об использовании"
        - "Лицензиат не вправе заключать сублицензионные договоры без письменного согласия Лицензиара"
        - "За нарушение условий договора предусмотрена неустойка"
        - "Срок действия лицензии привязан к сроку действия патента"
    patterns:
      required:
        - "(?i)(лицензионн\\w+\\s+договор|лицензи\\w+.*предоставл\\w+.*прав\\w+.*использовани\\w+|лицензиар.*лицензиат)"
      optional:
        - "(?i)(исключительн\\w+|неисключительн\\w+|простая).*лицензи\\w+"
        - "(?i)вознаграждение\\s+в\\s+виде\\s+(роялти|паушальн\\w+\\s+платеж\\w+)"
        - "(?i)срок\\s+действия\\s+лицензи\\w+.*территори\\w+"
    exclusion_logic:
      - condition: "full_transfer_keywords AND no_license_type"
        target: "rejection"
        confidence: 0.85
        description: "Если присутствует указание на передачу права в полном объеме без упоминания лицензии - это отчуждение"
      - condition: "franchise_elements_present AND know_how_transfer"
        target: "rejection"
        confidence: 0.80
        description: "Если помимо права использования передаются коммерческая тайна, ноу-хау и право на фирменное наименование - это коммерческая концессия"
    weights:
      keyword_high: 3.0
      keyword_medium: 1.5
      keyword_low: 0.5
      phrase_high: 2.5
      phrase_medium: 1.0
      pattern_required: 4.0
      pattern_optional: 1.0
    classification:
      min_confidence: 0.75
      max_matches: 3

    party_roles:
      - "Лицензиар (правообладатель, предоставляющий право использования)"
      - "Лицензиат (лицо, получающее право использования)"
    essential_terms:
      - "Предмет договора: четкое указание на объект ИС, право использования которого предоставляется (с реквизитами регистрации, если есть)"
      - "Способы использования: исчерпывающий перечень действий, которые лицензиат вправе совершать с объектом ИС (существенное условие)"
      - "Территория, на которой допускается использование (если не указана - на всей территории РФ)"
      - "Срок действия лицензии (если не указан - 5 лет, для товарных знаков - не более срока действия исключительного права)"
    aliases:
      - "Лицензионное соглашение"
      - "Договор о предоставлении права использования"
      - "Лицензия на использование"
      - "Патентная лицензия"
      - "Лицензия на товарный знак"
      - "Авторский лицензионный договор"
    section_markers:
      - "Предмет договора (объект ИС, реквизиты патента/свидетельства, вид лицензии)"
      - "Объем предоставляемых прав (способы использования, территория, срок)"
      - "Лицензионное вознаграждение (размер, форма, порядок выплаты, отчетность)"
      - "Права и обязанности сторон"
      - "Гарантии лицензиара"
      - "Контроль качества (для товарных знаков)"
      - "Порядок предоставления сублицензии"
      - "Ответственность сторон"
      - "Основания и порядок досрочного расторжения"
      - "Последствия прекращения действия исключительного права"
      - "Конфиденциальность"
      - "Порядок разрешения споров"
      - "Заключительные положения (о регистрации, применимое право)"

