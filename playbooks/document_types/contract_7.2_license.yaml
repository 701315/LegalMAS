  # ──────────────────────────────────────────────────────────
  # ESSENTIAL ELEMENTS
  # ──────────────────────────────────────────────────────────
  
  essential_elements:
    - element: "parties"
      required: true
      legal_base: "ст. 432, 1235 ГК РФ"
      validation_rules:
        - "presence_check"
        - "legal_capacity_indicators"
        - "licensor_is_rightsholder"
      extraction_hints: {}
      description: "Лицензиар (правообладатель) и Лицензиат; проверка правоспособности"
      conditional_checks: []
      extraction_hints: {}
    
    - element: "subject_ip_object"
      name: "Объект интеллектуальной собственности"
      required: true
      legal_base: "ст. 1235 п. 1 ГК РФ"
      description: "Конкретный объект ИС, право использования которого предоставляется"
      validation_rules:
        - "presence_check"
        - "definiteness_check"
        - "ip_object_identification"
      conditional_checks:
        - trigger: "registered_ip_objects"
          keywords: ["патент", "товарный знак", "полезная модель", "промышленный образец", "НМПТ"]
          rule: "registration_details_required"
          legal_base: "ст. 1232, 1235 ГК РФ"
          severity: "critical"
          validation_rules:
            - "registration_number_present"
            - "registration_date_present"
            - "validity_period_present"
    - element: "permitted_uses"
      name: "Способы использования"
      required: true
      legal_base: "ст. 1235 п. 1 ГК РФ"
      description: "Способы использования объекта ИС — существенное условие; права, не указанные в договоре, считаются непредоставленными"
      validation_rules:
        - "presence_check"
        - "uses_enumerated"
        - "definiteness_check"
      conditional_checks:
        - trigger: "license_agreement"
          keywords: ["лицензия", "право использования", "лицензионный договор"]
          rule: "permitted_uses_mandatory"
          legal_base: "ст. 1235 п. 1 ГК РФ"
          severity: "critical"
          risk_msg: "Без указания способов использования договор может быть признан незаключенным"
          validation_rules:
            - "uses_list_present"
            - "uses_clear_and_definite"
      extraction_hints: {}
    - element: "license_type"
      name: "Вид лицензии"
      required: false
      legal_base: "п. 3 ст. 1236 ГК РФ"
      description: "Вид лицензии (исключительная/неисключительная). При отсутствии считается простой."
      validation_rules:
        - "license_type_identifiable"
      conditional_checks:
        - trigger: "exclusive_license_indicators"
          keywords: ["исключительная", "эксклюзивная", "лицензиар не вправе", "только лицензиат"]
          rule: "exclusive_license_consequences_check"
          legal_base: "п. 1 ст. 1236 ГК РФ"
          severity: "high"
          risk_msg: "При исключительной лицензии лицензиар не может предоставлять аналогичные права другим лицам и может быть ограничен в собственном использовании"
      extraction_hints: {}
    - element: "territory"
      name: "Территория действия"
      required: false
      legal_base: "п. 3 ст. 1235 ГК РФ"
      description: "Территория, на которой допускается использование. При отсутствии - вся территория РФ"
      validation_rules:
        - "territory_specified_or_default"
      conditional_checks: []
      extraction_hints: {}
    - element: "term"
      name: "Срок действия лицензии"
      required: false
      legal_base: "п. 4 ст. 1235 ГК РФ"
      description: "Срок действия лицензии. При отсутствии - 5 лет. Не может превышать срок действия права"
      validation_rules:
        - "term_specified_or_default"
        - "term_within_right_validity"
      conditional_checks: []
      extraction_hints: {}
    - element: "consideration"
      name: "Вознаграждение"
      required: true
      legal_base: "п. 5 ст. 1235 ГК РФ"
      description: "Размер вознаграждения или порядок его определения. Для возмездного договора - существенное условие"
      validation_rules:
        - "remuneration_specified_or_gratuitous"
        - "calculation_method_if_variable"
      conditional_checks:
        - trigger: "commercial_parties"
          keywords: ["ООО", "АО", "ЗАО", "ПАО", "ИП", "юридическое лицо", "коммерческая организация"]
          rule: "gratuitous_between_commercial_suspicious"
          legal_base: "ст. 1235 п. 5, 575 ГК РФ"
          severity: "medium"
          risk_msg: "Безвозмездная лицензия между коммерческими лицами может быть признана притворной сделкой"
      extraction_hints: {}
    - element: "registration_obligation"
      name: "Обязанность государственной регистрации"
      required: true
      legal_base: "ст. 1232, 1235 ГК РФ"
      description: "Обязанность государственной регистрации для регистрируемых объектов"
      validation_rules:
        - "registration_clause_if_applicable"
      conditional_checks:
        - trigger: "registrable_ip"
          keywords: ["патент", "товарный знак", "полезная модель", "промышленный образец", "НМПТ", "Роспатент"]
          rule: "registration_mandatory"
          legal_base: "п. 2 ст. 1235 ГК РФ"
          severity: "critical"
          risk_msg: "Без государственной регистрации лицензионный договор на регистрируемый объект считается недействительным"
      extraction_hints: {}

