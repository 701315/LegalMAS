type: contract_2.1
name: "Договор аренды (общая коммерческая)"
description: |
  Базовая конструкция (locatio-conductio rerum) для возмездного владения и пользования имуществом. 
  Ориентирована на B2B сектор (офисы, склады, оборудование). Соответствует essentialia negotii арендных отношений.
version: 2.1
parent: class_2_transfer_for_use
metadata:
  category: contract
  subcategory: use_transfer
  complexity: medium
  risk_level: medium
  legal_base: § 1 Главы 34 ГК РФ (ст. 606-625)

# ════════════════════════════════════════════════════════════
# БАЗОВАЯ ИНФОРМАЦИЯ (LEGACY SECTIONS)
# ════════════════════════════════════════════════════════════
rules:
  keywords:
    high:
      - "аренд"
      - "арендодатель"
      - "арендатор"
      - "временное пользование"
      - "временное владение"
      - "арендная плата"
    medium:
      - "помещение"
      - "здание"
      - "оборудование"
      - "нежилое помещение"
      - "акт приема-передачи"
      - "ежемесячная плата"
    low:
      - "коммунальные услуги"
      - "обеспечительный платеж"
      - "срок действия"
      - "субаренд"
  phrases:
    high:
      - Арендодатель обязуется предоставить Арендатору имущество за плату
      - Имущество передается во временное владение и пользование
      - Арендатор обязан вносить арендную плату в установленные сроки
      - Капитальный ремонт производит Арендодатель, текущий — Арендатор
    medium:
      - использовать помещение по назначению
      - без права субаренды
      - возврат имущества в исправном состоянии
      - соответствие назначению имущества
  patterns:
    required:
      - (?i)(аренд|арендодатель|арендатор|плата|пользование)
    optional:
      - (?i)(нежилое|помещение|здание|земельный участок|оборудование|техника)
  exclusions:
    - жилой наем
    - лизинг
    - прокат
    - безвозмездное пользование
    - ссуда
  weights:
    keyword_high: 3.0
    keyword_medium: 1.5
    keyword_low: 0.5
    phrase_high: 3.0
    phrase_medium: 1.5
    pattern_required: 4.0
    pattern_optional: 1.0
  classification:
    min_confidence: 0.70
    max_matches: 5

party_roles:
  - Арендодатель (Lessor) — собственник или управомоченное законом лицо
  - Арендатор (Lessee) — принимающее имущество во временное пользование

essential_terms:
  - Предмет договора (индивидуально-определенная вещь, ст. 607 ГК РФ)
  - Размер арендной платы (существенное условие для недвижимости, ст. 654 ГК РФ)

specific_risks:
  - Недостаточная индивидуализация объекта (риск признания незаключенным)
  - Неурегулированность судьбы улучшений (риск неосновательного обогащения)
  - Отсутствие акта приема-передачи (риск недоказанности исполнения обязательств)
  - Неопределенность условий расторжения (риск затяжных споров)

aliases:
  - Договор аренды нежилого помещения
  - Договор имущественного найма
  - Договор коммерческой аренды

section_markers:
  - Предмет договора
  - Срок действия договора
  - Арендная плата и порядок расчетов
  - Права и обязанности сторон
  - Порядок содержания и ремонта имущества
  - Ответственность сторон
  - Изменение и расторжение договора
  - Порядок разрешения споров
  - Реквизиты и подписи сторон

notes: |
  Договор аренды здания/сооружения на срок не менее года подлежит государственной регистрации (ст. 651 ГК РФ).
  Акт приема-передачи является неотъемлемой частью договора и подтверждает исполнение обязательства по передаче имущества.

# ════════════════════════════════════════════════════════════
# 🆕 ВАЛИДАЦИОННЫЕ СЕКЦИИ (VALIDATION ENGINE v2.0)
# ════════════════════════════════════════════════════════════

validation_metadata:
  validation_version: "2.1"
  last_updated: "2026-02-06"
  author: "Legal AI Team"
  
  # ──────────────────────────────────────────────────────────
  # СЕКЦИЯ 1: ПРИМЕНИМОЕ ЗАКОНОДАТЕЛЬСТВО
  # ──────────────────────────────────────────────────────────
  legal_base:
    primary:
      - "§ 1 Главы 34 ГК РФ (ст. 606-625) — Общие положения об аренде"
    secondary:
      - "§ 4 Главы 34 ГК РФ (ст. 650-655) — Аренда зданий и сооружений"
      - "Информационное письмо Президиума ВАС РФ № 66 от 11.01.2002"
      - "ФЗ-218 «О государственной регистрации недвижимости»"
    related:
      - "ст. 450.1 ГК РФ (Отказ от договора)"
      - "ст. 330 ГК РФ (Неустойка)"
      - "ст. 395 ГК РФ (Проценты за пользование чужими денежными средствами)"

  # ──────────────────────────────────────────────────────────
  # СЕКЦИЯ 2: ОБЯЗАТЕЛЬНЫЕ ЭЛЕМЕНТЫ (ESSENTIALIA NEGOTII)
  # ──────────────────────────────────────────────────────────
  essential_elements:
    - element: "parties_identification"
      name: "Идентификация сторон и полномочия"
      required: true
      legal_base: "ст. 432, 608 ГК РФ"
      risk_msg: "Отсутствие четкого указания на полномочия подписанта может привести к оспариванию сделки по ст. 174 ГК РФ"
      validation_rules:
        - "presence_check"
        - "legal_capacity_indicators"
        - "identify_signatory_authority"
    
    - element: "subject_definition"
      name: "Индивидуализация предмета аренды"
      required: true
      legal_base: "ст. 607 ГК РФ"
      risk_msg: "Неопределенный предмет договора ведет к признанию договора незаключенным (п. 3 ст. 607 ГК РФ)"
      validation_rules:
        - "presence_check"
        - "definiteness_check"
        - "address_presence"
      conditional_checks:
        - trigger: "real_estate_keywords"
          keywords: ["помещение", "здание", "недвижимость", "офис", "склад", "нежилое"]
          rule: "cadastral_number_required"
          legal_base: "ст. 607 ГК РФ, ст. 8 ФЗ-218"
          severity: "critical"
          validation_rules:
            - "cadastral_check"
            - "area_specification"
    
    - element: "rent_payment"
      name: "Определение арендной платы"
      required: true
      legal_base: "ст. 614, 654 ГК РФ"
      risk_msg: "Для договоров аренды зданий/сооружений отсутствие условия о размере арендной платы делает договор незаключенным"
      validation_rules:
        - "presence_check"
        - "amount_specified"
        - "payment_frequency"
        - "currency_check"
        - "calculation_method"
      conditional_checks:
        - trigger: "variable_payment_keywords"
          keywords: ["переменная часть", "доля выручки", "процент от", "индексирование"]
          rule: "calculation_mechanism_required"
          severity: "high"

    - element: "term"
      name: "Срок действия договора"
      required: false
      legal_base: "ст. 610 ГК РФ"
      description: "Если срок не указан, договор считается заключенным на неопределенный срок"
      validation_rules:
        - "term_clarity_if_present"
        - "start_end_date_consistency"
      conditional_checks:
        - trigger: "long_term_lease"
          keywords: ["лет", "год", "месяцев"]
          rule: "registration_clause_required"
          legal_base: "ст. 651 ГК РФ"
          severity: "high"
          validation_rules:
            - "registration_obligation_specified"
            - "cost_allocation_clause"

  # ──────────────────────────────────────────────────────────
  # СЕКЦИЯ 3: ЗАЩИТНЫЕ УСЛОВИЯ (PROTECTIVE CLAUSES)
  # ──────────────────────────────────────────────────────────
  protective_clauses:
    
    # --- ЗАЩИТА АРЕНДОДАТЕЛЯ (Lessor Protection) ---
    lessor_protection:
      - clause_id: "improvements_ownership"
        name: "Регулирование судьбы улучшений"
        risk_if_missing: |
          Если арендатор произведет неотделимые улучшения без согласия арендодателя, возникнет спор о компенсации их стоимости.
          По ст. 623 ГК РФ, при наличии согласия арендодатель обязан оплатить улучшения, что может стать незапланированным расходом.
          Отсутствие регулирования создает неопределенность в распределении прав и обязанностей.
        legal_base: "ст. 623 ГК РФ"
        severity: "high"
        affected_party: "lessor"
        detection:
          positive_keywords:
            - "улучшения"
            - "неотделимые улучшения"
            - "отделимые улучшения"
            - "реконструкция"
            - "модернизация"
            - "переоборудование"
            - "компенсация затрат"
            - "стоимость улучшений"
          negative_keywords:
            - "безвозмездно"
            - "без компенсации"
          context_patterns:
            - '(?i)(неотделим|отделим).*улучшени'
            - '(?i)произвед.*улучшени.*согласи'
            - '(?i)стоимость.*улучшени.*возмещ'

      - clause_id: "penalty_late_payment"
        name: "Неустойка за просрочку оплаты"
        risk_if_missing: |
          Без договорной неустойки арендодатель сможет взыскать только проценты по ст. 395 ГК РФ (ключевая ставка),
          что часто не покрывает реальные убытки от кассового разрыва и административные издержки по взысканию.
        legal_base: "ст. 330 ГК РФ"
        severity: "medium"
        affected_party: "lessor"
        detection:
          positive_keywords:
            - "неустойка"
            - "пени"
            - "штраф"
            - "0,1%"
            - "0,5%"
            - "процент от суммы"
            - "за каждый день просрочки"
          context_patterns:
            - '(?i)просрочк.*оплат.*пени'
            - '(?i)неустойк.*за.*просрочку'

      - clause_id: "sublease_control"
        name: "Контроль передачи третьим лицам"
        risk_if_missing: |
          Арендатор может передать имущество в субаренду без надлежащего контроля со стороны собственника.
          Хотя ст. 615 ГК РФ требует согласия арендодателя, прямое условие о запрете или конкретном порядке дает
          более сильные правовые основания для защиты интересов собственника.
        legal_base: "ст. 615 ГК РФ"
        severity: "medium"
        affected_party: "lessor"
        detection:
          positive_keywords:
            - "субаренда"
            - "перенаем"
            - "передача третьим лицам"
            - "с письменного согласия"
            - "запрет субаренды"
            - "без права передачи"
          context_patterns:
            - '(?i)запрещено.*передават.*пользование'
            - '(?i)субаренд.*разрешает.*согласи'

      - clause_id: "access_rights"
        name: "Право доступа и контроля"
        risk_if_missing: |
          Арендодатель лишается возможности контролировать состояние имущества и его использование,
          что повышает риск несанкционированных перепланировок, ухудшения состояния или нарушения целевого использования.
        legal_base: "ст. 615, 616 ГК РФ"
        severity: "medium"
        affected_party: "lessor"
        detection:
          positive_keywords:
            - "доступ в помещение"
            - "право осмотра"
            - "контроль использования"
            - "проверка состояния"
            - "с предварительным уведомлением"
          context_patterns:
            - '(?i)арендодатель.*вправе.*посещат'
            - '(?i)осмотр.*помещен.*уведомлением'

    # --- ЗАЩИТА АРЕНДАТОРА (Lessee Protection) ---
    lessee_protection:
      - clause_id: "early_termination_right"
        name: "Право на внесудебный отказ"
        risk_if_missing: |
          В срочном договоре аренды арендатор не может просто съехать, предупредив за месяц,
          если это право прямо не прописано (ст. 620 ГК РФ). Арендодатель вправе начислять
          плату до конца срока договора, даже если помещение фактически не используется.
        legal_base: "ст. 620, 450.1 ГК РФ"
        severity: "high"
        affected_party: "lessee"
        detection:
          positive_keywords:
            - "односторонний отказ"
            - "внесудебный порядок"
            - "уведомление за"
            - "право расторгнуть"
            - "досрочное расторжение"
            - "предупредив за"
          context_patterns:
            - '(?i)арендатор.*вправе.*отказаться'
            - '(?i)уведомление.*за.*месяц.*расторжени'

      - clause_id: "maintenance_duties"
        name: "Распределение обязанностей по ремонту"
        risk_if_missing: |
          Если не разграничить виды ремонта, арендодатель может уклоняться от капитального ремонта,
          ссылаясь на неправильную эксплуатацию, или переложить эти расходы на арендатора
          через расплывчатые формулировки об "обеспечении исправности".
        legal_base: "ст. 616 ГК РФ"
        severity: "medium"
        affected_party: "lessee"
        detection:
          positive_keywords:
            - "капитальный ремонт"
            - "текущий ремонт"
            - "бремя содержания"
            - "неотложный ремонт"
            - "обязанность ремонта"
            - "эксплуатационные расходы"
          context_patterns:
            - '(?i)арендодатель.*обязуется.*производит.*капитальн'
            - '(?i)текущий.*ремонт.*арендатор'

      - clause_id: "warranty_fitness"
        name: "Гарантия пригодности имущества"
        risk_if_missing: |
          Арендодатель может передать имущество с существенными недостатками, делающими его непригодным
          для использования по назначению. Без условия о гарантии арендатор будет вынужден производить
          ремонт за свой счет или доказывать нарушение в судебном порядке.
        legal_base: "ст. 611, 612 ГК РФ"
        severity: "medium"
        affected_party: "lessee"
        detection:
          positive_keywords:
            - "состояние имущества"
            - "пригодность для использования"
            - "исправное состояние"
            - "соответствие назначению"
            - "отсутствие недостатков"
            - "гарантия арендодателя"
          context_patterns:
            - '(?i)передаетс.*исправном.*состоянии'
            - '(?i)пригодн.*для.*использования.*по.*назначению'

      - clause_id: "improvements_reimbursement"
        name: "Компенсация улучшений арендатору"
        risk_if_missing: |
          Арендатор может произвести улучшения с согласия арендодателя, но не получить компенсацию
          их стоимости при возврате имущества. По ст. 623 ГК РФ неотделимые улучшения без компенсации
          могут создать ситуацию неосновательного обогащения арендодателя.
        legal_base: "ст. 623 ГК РФ"
        severity: "medium"
        affected_party: "lessee"
        detection:
          positive_keywords:
            - "компенсация улучшений"
            - "возмещение затрат"
            - "стоимость улучшений"
            - "отделимые улучшения"
            - "право забрать улучшения"
          context_patterns:
            - '(?i)компенсаци.*улучшени.*согласи'
            - '(?i)возмещени.*стоимости.*улучшени'

  # ──────────────────────────────────────────────────────────
  # СЕКЦИЯ 4: ДОПОЛНИТЕЛЬНЫЕ УСЛОВИЯ (ПОДТИПЫ И СПЕЦИФИКА)
  # ──────────────────────────────────────────────────────────
  additional_protective_clauses:
    
    # Для аренды земельных участков
    lessor_protection:
      - clause_id: "land_use_vri"
        name: "Соблюдение вида разрешенного использования"
        risk_if_missing: |
          Использование земельного участка не по целевому назначению (ВРИ) влечет крупные административные
          штрафы по ст. 8.8 КоАП РФ, которые могут быть наложены на собственника (арендодателя),
          даже если нарушение совершено арендатором.
        legal_base: "ст. 8.8 КоАП РФ, ст. 42 ЗК РФ"
        severity: "high"
        affected_party: "lessor"
        detection:
          positive_keywords:
            - "целевое использование"
            - "вид разрешенного использования"
            - "ВРИ"
            - "земли населенных пунктов"
            - "сельскохозяйственного назначения"
            - "промышленного назначения"
          context_patterns:
            - '(?i)использовани.*земл.*соответстви.*назначени'

    # Для аренды оборудования и техники
    lessee_protection:
      - clause_id: "equipment_warranty"
        name: "Гарантийное обслуживание оборудования"
        risk_if_missing: |
          При аренде сложного оборудования отсутствие условия о гарантийном обслуживании и ремонте
          может привести к простоям в производстве и финансовым потерям арендатора, который будет
          вынужден самостоятельно устранять неисправности.
        legal_base: "ст. 612, 623 ГК РФ"
        severity: "medium"
        affected_party: "lessee"
        detection:
          positive_keywords:
            - "гарантийное обслуживание"
            - "техническое обслуживание"
            - "ремонт оборудования"
            - "устранение неисправностей"
            - "сервисное обслуживание"
            - "запасные части"
          context_patterns:
            - '(?i)оборудовани.*гарантийн.*обслуживани'
            - '(?i)арендодатель.*обязуется.*ремонт'