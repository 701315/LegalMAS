type: contract_2.2
name: Договор проката
description: |
  Публичный договор возмездного временного пользования движимым имуществом, 
  предназначенным для потребительских (бытовых) нужд. Специальный вид аренды, 
  характеризующийся: 1) профессиональным арендодателем-предпринимателем, 
  2) потребительской целью арендатора-гражданина, 3) краткосрочностью (до 1 года),
  4) движимым характером имущества, 5) особым распределением обязанностей по ремонту.
  Регулируется специальными нормами § 2 Главы 34 ГК РФ.
version: 2.1
parent: class_2_transfer_for_use
sibling_contracts:
  - contract_2.1 # Договор аренды (общая коммерческая)
  - contract_2.3 # Договор аренды транспортного средства
  - contract_2.6 # Договор безвозмездного пользования (ссуды)

metadata:
  category: contract
  subcategory: use_transfer
  complexity: medium
  risk_level: medium-high
  legal_base: § 2 Главы 34 ГК РФ (ст. 626-631)
  hierarchy_position: "child_specialized_consumer"

# ════════════════════════════════════════════════════════════
# БАЗОВАЯ ИНФОРМАЦИЯ (LEGACY SECTIONS - ОПТИМИЗИРОВАНО)
# ════════════════════════════════════════════════════════════
rules:
  keywords:
    high:
      - "прокат"
      - "бытовые нужды"
      - "потребительские цели"
      - "гражданин-арендатор"
      - "предприниматель-арендодатель"
      - "публичный договор"
      - "пункт проката"
    medium:
      - "почасовая аренда"
      - "посуточная аренда"
      - "краткосрочная аренда"
      - "бытовой прокат"
      - "движимое имущество"
      - "аренда инвентаря"
      - "проверка исправности"
      - "инструкция по эксплуатации"
    low:
      - "залог"
      - "страховой депозит"
      - "обеспечительный платеж"
      - "квитанция проката"
      - "каршеринг"
      - "кикшеринг"
      - "самокаты"
      - "нормальный износ"
  phrases:
    high:
      - Арендодатель, осуществляющий сдачу имущества в аренду в качестве постоянной предпринимательской деятельности
      - имущество предоставляется для бытовых (потребительских) нужд
      - Арендатор вправе отказаться от договора проката в любое время
      - Арендодатель обязан проверить исправность имущества и ознакомить с правилами эксплуатации
      - Капитальный и текущий ремонт осуществляет Арендодатель
    medium:
      - аренда на срок до одного года
      - оплата производится за период пользования в твердой сумме
      - имущество подлежит возврату в исправном состоянии с учетом нормального износа
      - залоговая сумма удерживается при повреждении
      - субаренда и передача третьим лицам запрещены
  patterns:
    required:
      - (?i)(прокат|бытов.*нужд|потребительск.*цел|гражданин.*арендатор)
    optional:
      - (?i)(пункт|пункт).*прокат
      - (?i)(почасов|посуточн|краткосрочн).*аренд
      - (?i)(инвентар|инструмент|техник|костюм).*прокат
  exclusions:
    - долгосрочная аренда (более года)
    - аренда недвижимости
    - аренда для предпринимательской деятельности арендатора
    - аренда транспортного средства с экипажем
    - лизинг (финансовая аренда)
  exclusion_logic:
    - condition: "commercial_purpose_of_lessee"
      target: "reclassification_to_general_lease"
      confidence: 0.90
      description: "Если арендатор использует имущество для предпринимательской деятельности — это общая аренда (ст. 606 ГК РФ)"
    - condition: "real_estate_property"
      target: "reclassification_to_general_lease"
      confidence: 0.95
      description: "Прокат касается только движимого имущества (ст. 626 ГК РФ)"
  weights:
    keyword_high: 3.5
    keyword_medium: 1.5
    keyword_low: 0.5
    phrase_high: 4.0
    phrase_medium: 1.5
    pattern_required: 5.0
    pattern_optional: 1.0
  classification:
    min_confidence: 0.85
    max_matches: 2

party_roles:
  - Арендодатель (Наймодатель) — коммерческая организация или ИП, для которой прокат является постоянной предпринимательской деятельностью (профессионал)
  - Арендатор (Наниматель) — преимущественно гражданин для личных, семейных, бытовых нужд (потребитель)

essential_terms:
  - Явное указание на потребительский (бытовой) характер использования имущества
  - Индивидуализация движимого имущества (марка, модель, серийный номер)
  - Размер арендной платы в твердой сумме (ст. 630 ГК РФ)
  - Срок договора (до 1 года, ст. 627 ГК РФ)

specific_risks:
  - Порча или утрата имущества арендатором (потребительская небрежность)
  - Споры о нормальном износе vs. повреждение по вине арендатора
  - Применение Закона о защите прав потребителей (претензии, возмещение морального вреда)
  - Риск признания непубличным договором при отсутствии признаков ст. 426 ГК РФ
  - Невозврат залога при необоснованных претензиях арендодателя
  - Навязывание дополнительных услуг (страховка, доп. оборудование)

aliases:
  - Договор бытового проката
  - Публичный договор проката
  - Аренда оборудования (краткосрочная)
  - Прокат инвентаря
  - Кикшеринг (оферта)

section_markers:
  - Предмет договора (описание имущества, состояние, комплектность)
  - Срок проката (часы/сутки, максимально до 1 года)
  - Арендная плата и залог (твердая сумма, обеспечительный платеж)
  - Права и обязанности сторон (ремонт, инструктаж)
  - Возврат имущества и возврат залога
  - Ответственность сторон
  - Порядок разрешения споров
  - Подписи, реквизиты, приложения (акты, правила)

notes: |
  ОСОБЕННОСТИ ДОГОВОРА ПРОКАТА (§ 2 Главы 34 ГК РФ):
  1. Публичный договор (ст. 426 ГК РФ) — арендодатель обязан заключать с любым обратившимся
  2. Преимущественно для бытовых нужд граждан (потребительский характер)
  3. Арендатор вправе отказаться в любое время, предупредив за срок, указанный в договоре (ст. 627 ГК РФ)
  4. Все виды ремонта (капитальный и текущий) осуществляет Арендодатель (ст. 631 ГК РФ)
  5. Субаренда и передача прав третьим лицам запрещены (ст. 631 ГК РФ)
  6. Максимальный срок — 1 год (ст. 627 ГК РФ)
  7. Применяется Закон РФ "О защите прав потребителей"
  8. Форма подтверждения — квитанция, чек, электронный документ

# ════════════════════════════════════════════════════════════
# 🆕 ВАЛИДАЦИОННЫЕ СЕКЦИИ (VALIDATION ENGINE v2.0)
# ════════════════════════════════════════════════════════════

validation_metadata:
  validation_version: "2.1"
  last_updated: "2026-02-07"
  author: "Legal AI Team"
  
  # ──────────────────────────────────────────────────────────
  # СЕКЦИЯ 1: ПРИМЕНИМОЕ ЗАКОНОДАТЕЛЬСТВО
  # ──────────────────────────────────────────────────────────
  legal_base:
    primary:
      - "§ 2 Главы 34 ГК РФ (ст. 626-631) — Договор проката"
      - "Закон РФ от 07.02.1992 № 2300-1 «О защите прав потребителей» (при арендаторе-гражданине)"
    secondary:
      - "ст. 426 ГК РФ (Публичный договор)"
      - "Постановление Правительства РФ от 15.08.1997 № 1025 «Правила бытового обслуживания населения»"
      - "ст. 310 ГК РФ (Недопустимость одностороннего отказа) — с учетом изъятия ст. 627 ГК РФ"
    related:
      - "ст. 612, 614, 615 ГК РФ (Общие положения об аренде, применяемые субсидиарно)"
      - "ст. 329, 334, 381.1 ГК РФ (Способы обеспечения исполнения)"
      - "ГК РФ ст. 1064 (Общие основания ответственности за причинение вреда)"

  # ──────────────────────────────────────────────────────────
  # СЕКЦИЯ 2: ОБЯЗАТЕЛЬНЫЕ ЭЛЕМЕНТЫ ДОГОВОРА
  # ──────────────────────────────────────────────────────────
  essential_elements:
    - element: "consumer_purpose_declaration"
      name: "Явное указание на потребительский (бытовой) характер использования"
      required: true
      legal_base: "ст. 626 ГК РФ"
      risk_msg: |
        Отсутствие указания на бытовые нужды ведет к переквалификации в общую аренду (ст. 606 ГК РФ),
        что лишает арендатора специальных прав (односторонний отказ по ст. 627 ГК РФ) 
        и применяет общий режим ответственности и ремонта.
      validation_rules:
        - "presence_check"
        - "consumer_keywords_present"
        - "purpose_clarity_check"
      conditional_checks:
        - trigger: "commercial_lessee_keywords"
          keywords: ["для предпринимательской деятельности", "для бизнеса", "в коммерческих целях", "для извлечения прибыли"]
          rule: "reclassification_to_general_lease_required"
          legal_base: "ст. 626 ГК РФ"
          severity: "critical"
          risk_msg: "Если арендатор — юрлицо или ИП, и цель — предпринимательская, договор должен квалифицироваться как общая аренда"

    - element: "movable_property_identification"
      name: "Индивидуализация движимого имущества"
      required: true
      legal_base: "ст. 607, 626 ГК РФ"
      risk_msg: |
        Неопределенность предмета (например, «инструмент» без марки и модели) делает невозможным
        идентификацию при возврате, приводит к спорам о состоянии и может быть основанием для 
        признания договора незаключенным по формальным основаниям.
      validation_rules:
        - "presence_check"
        - "definiteness_check"
        - "inventory_number_or_serial_present"
        - "technical_state_description_present"
        - "completeness_list_present"
    
    - element: "fixed_rent_payment"
      name: "Условие об арендной плате в твердой сумме"
      required: true
      legal_base: "ст. 630 ГК РФ"
      risk_msg: |
        Плата по договору проката должна вноситься в виде определенных в твердой сумме платежей.
        Отсутствие твердой суммы или использование переменных формул (процент от выручки и т.п.)
        противоречит природе проката и может повлечь переквалификацию договора.
      validation_rules:
        - "presence_check"
        - "fixed_amount_check"
        - "payment_frequency_specified"
        - "currency_check"
        - "no_variable_payment_formulas"
    
    - element: "term_limitation_one_year"
      name: "Срок договора (не более 1 года)"
      required: true
      legal_base: "ст. 627 ГК РФ"
      description: "Договор проката заключается на срок до одного года. Срок, превышающий один год, ничтожен в этой части"
      risk_msg: "Срок проката, превышающий один год, переводит договор в категорию общей аренды со всеми вытекающими последствиями"
      validation_rules:
        - "presence_check"
        - "term_max_1_year_check"
        - "start_end_date_consistency"
        - "no_perpetual_auto_renewal"

  # ──────────────────────────────────────────────────────────
  # СЕКЦИЯ 3: ЗАЩИТНЫЕ УСЛОВИЯ (PROTECTIVE CLAUSES)
  # ──────────────────────────────────────────────────────────

  protective_clauses:
    
    # --- ЗАЩИТА АРЕНДАТОРА-ПОТРЕБИТЕЛЯ (Consumer Protection) ---
    buyer_protection:
      - clause_id: "unilateral_termination_anytime"
        name: "Право на односторонний отказ в любое время"
        risk_if_missing: |
          Арендатор теряет специальное право, предоставленное п. 3 ст. 627 ГК РФ. 
          Без этого условия он будет связан договором на весь срок и обязан платить,
          даже если имущество больше не нужно. Условия типа "деньги не возвращаются" 
          или "минимальный срок аренды" при отказе являются ничтожными (ст. 16 ЗоЗПП).
        legal_base: "ст. 627 п. 3 ГК РФ, ст. 16 ЗоЗПП"
        severity: "critical"
        affected_party: "buyer"
        detection:
          positive_keywords:
            - "вправе отказаться в любое время"
            - "односторонний отказ от договора"
            - "досрочный возврат имущества"
            - "предупредив за"
            - "уведомление за"
            - "возврат части арендной платы"
            - "перерасчет за неиспользованный период"
          negative_keywords:
            - "не подлежат возврату"
            - "удерживаются в полном объеме"
            - "минимальный срок аренды обязателен"
          context_patterns:
            - '(?i)арендатор.*вправе.*отказаться.*от.*договора.*в.*любое.*время'
            - '(?i)при.*досрочном.*возврате.*производится.*перерасчет'
      
      - clause_id: "all_repairs_by_lessor"
        name: "Обязанность Арендодателя по всем видам ремонта"
        risk_if_missing: |
          В договор может быть включено условие о возложении текущего ремонта на арендатора,
          что прямо противоречит ст. 631 ГК РФ. Арендатор будет нести незаконные расходы
          на поддержание имущества в рабочем состоянии.
        legal_base: "ст. 631 ГК РФ"
        severity: "high"
        affected_party: "buyer"
        detection:
          positive_keywords:
            - "капитальный и текущий ремонт"
            - "все виды ремонта осуществляет арендодатель"
            - "ремонт за счет арендодателя"
            - "устранение недостатков"
            - "замена неисправного имущества"
            - "поддержание в исправном состоянии"
          negative_keywords:
            - "текущий ремонт за счет арендатора"
            - "арендатор обязан ремонтировать"
            - "эксплуатационные расходы несет арендатор"
          context_patterns:
            - '(?i)ремонт.*осуществляет.*арендодатель'
            - '(?i)арендатор.*не.*несет.*расходов.*на.*ремонт'
      
      - clause_id: "fitness_warranty_and_safety_briefing"
        name: "Гарантия исправности и обязательный инструктаж"
        risk_if_missing: |
          Арендодатель может передать неисправное имущество или не проинструктировать по правилам безопасности.
          При поломке или травме он будет ссылаться на нарушение правил эксплуатации. 
          Без документального подтверждения проверки и инструктажа доказать невиновность арендатору сложно.
        legal_base: "ст. 628 ГК РФ"
        severity: "high"
        affected_party: "buyer"
        detection:
          positive_keywords:
            - "исправное состояние"
            - "проверка исправности в присутствии арендатора"
            - "ознакомление с правилами эксплуатации"
            - "инструктаж по технике безопасности"
            - "правила безопасного использования"
            - "техническая исправность"
            - "отсутствие скрытых недостатков"
            - "подпись об ознакомлении"
          context_patterns:
            - '(?i)арендодатель.*обязуется.*проверить.*исправность.*в.*присутствии'
            - '(?i)ознакомить.*арендатора.*с.*правилами.*эксплуатации.*и.*безопасности'

    # --- ЗАЩИТА АРЕНДОДАТЕЛЯ-ПРОФЕССИОНАЛА (Professional Lessor Protection) ---
    seller_protection:
      - clause_id: "absolute_prohibition_of_sublease"
        name: "Абсолютный запрет субаренды и передачи третьим лицам"
        risk_if_missing: |
          Арендатор может передать дорогостоящее оборудование третьим лицам без контроля собственника.
          Хотя ст. 631 п. 2 ГК РФ устанавливает запрет, прямое условие в договоре дает основания
          для немедленного расторжения и взыскания убытков при нарушении.
        legal_base: "ст. 631 п. 2 ГК РФ"
        severity: "high"
        affected_party: "seller"
        detection:
          positive_keywords:
            - "субаренда запрещена"
            - "передача третьим лицам не допускается"
            - "без права передачи в пользование"
            - "использование только лично арендатором"
            - "запрещена передача во временное владение"
          context_patterns:
            - '(?i)запрещаетс.*передават.*имуществ.*третьим.*лицам'
            - '(?i)субаренд.*не.*допускаетс'
      
      - clause_id: "security_deposit_mechanism"
        name: "Механизм залога (обеспечительного платежа)"
        risk_if_missing: |
          При повреждении или утрате имущества взыскание через суд — длительный процесс.
          Залог (ст. 334 ГК РФ) или обеспечительный платеж (ст. 381.1 ГК РФ) служат эффективной
          гарантией. Отсутствие такого механизма повышает риск невозмещения ущерба.
        legal_base: "ст. 329, 334, 381.1 ГК РФ"
        severity: "high"
        affected_party: "seller"
        detection:
          positive_keywords:
            - "залог"
            - "обеспечительный платеж"
            - "страховой депозит"
            - "денежное обеспечение"
            - "возвращаемый депозит"
            - "гарантийная сумма"
            - "удержание из залога"
          context_patterns:
            - '(?i)арендатор.*вносит.*залог.*в.*размере'
            - '(?i)депозит.*удерживается.*при.*повреждении.*или.*утрате'
      
      - clause_id: "clear_liability_for_damage"
        name: "Четкая ответственность за утрату и повреждение"
        risk_if_missing: |
          Арендатор может ссылаться на нормальный износ (ст. 629 ГК РФ) или отсутствие вины.
          Без четких критериев и размера ответственности взыскание стоимости ремонта или
          полной стоимости имущества становится спорным и затруднительным.
        legal_base: "ст. 629, 1064 ГК РФ"
        severity: "high"
        affected_party: "seller"
        detection:
          positive_keywords:
            - "полная стоимость при утрате"
            - "возмещение ущерба при повреждении"
            - "стоимость ремонта"
            - "рыночная стоимость"
            - "вина арендатора"
            - "ответственность за порчу"
            - "компенсация стоимости"
            - "акт о повреждении"
          context_patterns:
            - '(?i)арендатор.*несет.*ответственность.*за.*утрат.*в.*полном.*размере'
            - '(?i)повреждение.*имущества.*возмещается.*по.*стоимости.*ремонта'

  # ──────────────────────────────────────────────────────────
  # СЕКЦИЯ 4: ДОПОЛНИТЕЛЬНЫЕ PROTECTIVE CLAUSES (СПЕЦИФИКА ПРОКАТА)
  # ──────────────────────────────────────────────────────────
  additional_protective_clauses:
    
    # Для защиты от злоупотреблений ЗоЗПП (арендодатель)
    seller_protection:
      - clause_id: "consumer_law_application_disclosure"
        name: "Раскрытие применения Закона о защите прав потребителей"
        risk_if_missing: |
          Арендатор-гражданин будет иметь все права потребителя: обращаться в Роспотребнадзор,
          требовать возмещения убытков и морального вреда в упрощенном порядке.
          Явное упоминание о применении Закона структурирует отношения и предупреждает
          о повышенных стандартах ответственности арендодателя.
        legal_base: "Закон РФ № 2300-1, ст. 626 ГК РФ"
        severity: "medium"
        affected_party: "seller"
        detection:
          positive_keywords:
            - "отношения регулируются Законом о защите прав потребителей"
            - "права потребителя сохраняются"
            - "претензионный порядок урегулирования споров"
            - "возмещение морального вреда"
            - "Роспотребнадзор"
          context_patterns:
            - '(?i)к.*отношениям.*сторон.*применяетс.*закон.*о.*защите.*прав.*потребителей'
    
    # Для защиты арендатора при поломке (арендатор)
    buyer_protection:
      - clause_id: "emergency_procedure_for_breakdown"
        name: "Процедура действий при поломке в период пользования"
        risk_if_missing: |
          При внезапной поломке арендатор не знает, как действовать: пытаться ремонтировать,
          везти обратно, звонить арендодателю. Неправильные действия могут быть расценены
          как причинение дополнительного вреда. Четкий регламент снимает неопределенность
          и защищает от необоснованных претензий.
        legal_base: "ст. 628 ГК РФ"
        severity: "medium"
        affected_party: "buyer"
        detection:
          positive_keywords:
            - "действия при поломке"
            - "экстренная связь"
            - "аварийная ситуация"
            - "не пытаться ремонтировать самостоятельно"
            - "немедленно уведомить арендодателя"
            - "контактный телефон для экстренных случаев"
            - "процедура замены неисправного имущества"
          context_patterns:
            - '(?i)в.*случае.*поломк.*арендатор.*обязан.*немедленно.*уведомить.*арендодателя'
            - '(?i)запрещаетс.*самостоятельн.*ремонтироват.*имуществ'
    
    # Фиксация публичного характера (защита обеих сторон)
    buyer_seller_protection:
      - clause_id: "explicit_public_contract_declaration"
        name: "Явное указание на публичный характер договора"
        risk_if_missing: |
          Арендодатель может пытаться отказать в заключении договора или навязать индивидуальные условия.
          Арендатор может не знать о своих правах на равные условия. Признание договора публичным
          (ст. 426 ГК РФ) создает правовую определенность: арендодатель обязан заключать с каждым
          обратившимся, арендатор вправе требовать одинаковых условий.
        legal_base: "ст. 426 ГК РФ"
        severity: "high"
        affected_party: "both"
        detection:
          positive_keywords:
            - "публичный договор"
            - "заключается с каждым обратившимся потребителем"
            - "единые условия для всех потребителей"
            - "недопустимость необоснованного отказа"
            - "публичная оферта"
            - "типовые условия договора"
          context_patterns:
            - '(?i)договор.*является.*публичным.*в.*соответстви.*со.*ст.*426.*ГК.*РФ'
            - '(?i)условия.*являются.*едиными.*для.*всех.*потребителей.*обращающихся.*за.*услугой'
    
    # Защита от споров о нормальном износе (арендатор)
    buyer_protection:
      - clause_id: "normal_wear_and_tear_exclusion"
        name: "Освобождение от ответственности за нормальный износ"
        risk_if_missing: |
          Арендодатель может потребовать компенсацию за естественный износ имущества (потертости,
          мелкие царапины от эксплуатации), хотя ст. 629 ГК РФ прямо освобождает арендатора от такой
          ответственности. Явное упоминание этого правила в договоре предотвращает споры и необоснованное
          удержание залога.
        legal_base: "ст. 629 ГК РФ"
        severity: "medium"
        affected_party: "buyer"
        detection:
          positive_keywords:
            - "нормальный износ"
            - "естественный износ"
            - "не несет ответственности за износ"
            - "возникающий при правильной эксплуатации"
            - "обычный износ от использования"
            - "износ не является повреждением"
          context_patterns:
            - '(?i)арендатор.*не.*отвечает.*за.*нормальн.*износ.*возникающий.*при.*правильной.*эксплуатации'
            - '(?i)ответственность.*не.*распространяется.*на.*естественн.*износ'
            