type: contract_2.3
name: Договор аренды транспортного средства
description: |
  Специальный вид договора аренды, предметом которого является транспортное средство (автомобиль, судно, 
  воздушное или космическое судно). Существует в двух принципиально различных видах с разным распределением 
  рисков и обязанностей:
  1. **С экипажем (фрахтование на время)** — арендодатель предоставляет услуги управления и эксплуатации,
     несет ответственность за вред третьим лицам (ст. 632-635 ГК РФ).
  2. **Без экипажа** — арендатор самостоятельно управляет ТС, несет расходы и ответственность как владелец
     источника повышенной опасности (ст. 636-641 ГК РФ).
  Критически важно четкое определение вида аренды.
version: 2.1
parent: class_2_transfer_for_use
sibling_contracts:
  - contract_2.1 # Договор аренды (общая коммерческая)
  - contract_2.2 # Договор проката
  - contract_2.4 # Договор лизинга (финансовой аренды)

metadata:
  category: contract
  subcategory: use_transfer
  complexity: high # Из-за двух принципиально разных правовых режимов
  risk_level: high # Риск ДТП, угона, гибели ТС, ответственности перед третьими лицами
  legal_base: § 3 Главы 34 ГК РФ (ст. 632-641)
  hierarchy_position: "child_specialized_complex"

# ════════════════════════════════════════════════════════════
# БАЗОВАЯ ИНФОРМАЦИЯ (LEGACY SECTIONS - ОПТИМИЗИРОВАНО)
# ════════════════════════════════════════════════════════════
rules:
  keywords:
    high:
      - "транспортное средство"
      - "аренда автомобиля"
      - "с экипажем"
      - "без экипажа"
      - "фрахтование на время"
      - "VIN номер"
      - "госномер"
      - "управление транспортным средством"
    medium:
      - "аренда ТС"
      - "судно"
      - "воздушное судно"
      - "техническое обслуживание"
      - "полис ОСАГО"
      - "ГСМ"
      - "путевой лист"
      - "эксплуатация ТС"
    low:
      - "водитель"
      - "штрафы ГИБДД"
      - "пробег"
      - "КАСКО"
      - "диагностическая карта"
      - "ПТС"
      - "техосмотр"
      - "страховой случай"
  phrases:
    high:
      - предоставляет во временное владение и пользование транспортное средство
      - оказывает услуги по управлению и технической эксплуатации
      - несет расходы на оплату топлива
      - ответственность за вред, причиненный третьим лицам
      - Арендатор обязан иметь действующее водительское удостоверение соответствующей категории
    medium:
      - ТС передается в исправном техническом состоянии
      - ограничения по территории использования
      - запрет на субаренду и передачу управления третьим лицам
      - порядок возмещения расходов на ремонт после ДТП
      - обязанность уведомления о страховом случае
  patterns:
    required:
      - (?i)(аренд.*транспортн.*средств|аренд.*автомобил|фрахтован)
    optional:
      - (?i)(с|без).*экипаж
      - (?i)VIN.*[A-HJ-NPR-Z0-9]{17}
      - (?i)гос.*номер.*[АВЕКМНОРСТУХ0-9]{6,9}
  exclusions:
    - прокат (если это краткосрочная аренда гражданином у профильной фирмы)
    - лизинг (финансовая аренда с правом выкупа)
    - договор перевозки (услуга по доставке груза, а не аренда ТС)
  exclusion_logic:
    - condition: "consumer_purpose_and_short_term"
      target: "reclassify_to_contract_2.2"
      confidence: 0.85
      description: "Если аренда для бытовых нужд гражданина и срок до 1 года — это прокат"
    - condition: "purchase_option_present"
      target: "reclassify_to_contract_2.4"
      confidence: 0.90
      description: "При наличии опциона выкупа ТС — это лизинг"
  weights:
    keyword_high: 3.5
    keyword_medium: 1.5
    keyword_low: 0.5
    phrase_high: 4.0
    phrase_medium: 1.5
    pattern_required: 5.0
    pattern_optional: 1.0
  classification:
    min_confidence: 0.85
    max_matches: 3

party_roles:
  - Арендодатель (Фрахтовщик) — собственник ТС, предоставляющий его во временное пользование
  - Арендатор (Фрахтователь) — сторона, принимающая ТС во временное пользование
  - Экипаж (при аренде с экипажем) — лица, осуществляющие управление и техническую эксплуатацию ТС

essential_terms:
  - Индивидуализация ТС (марка, модель, VIN, гос. номер)
  - Четкое указание вида аренды: с экипажем или без экипажа
  - Размер и порядок оплаты арендной платы (фрахта)
  - Срок договора аренды

specific_risks:
  - ДТП и споры об ответственности (кто был за рулем? чей работник?)
  - Нестраховые случаи (пьяный водитель, угон с ключами)
  - 'Письма счастья (штрафы с камер) — приходят собственнику, нужен механизм регресса'
  - Нарушение условий использования (выезд за разрешенный регион, передача управления неуполномоченным лицам)
  - Споры о характере поломки (эксплуатационная vs. техническая неисправность)
  - Риск неюридической чистоты ТС (залог, арест, ограничения)

aliases:
  - Договор аренды автомобиля
  - Фрахтование на время (для судов)
  - Тайм-чартер
  - Аренда спецтехники
  - Аренда ТС с экипажем / без экипажа
  - Каршеринг (разновидность аренды без экипажа)

section_markers:
  - Предмет договора (ТС: марка, модель, VIN, гос. номер)
  - Управление и эксплуатация (Экипаж / самостоятельное управление)
  - Расходы на содержание (ГСМ, ремонт, страховка)
  - Страхование (ОСАГО/КАСКО)
  - Ответственность за ущерб (ДТП, вред третьим лицам)
  - Арендная плата и порядок расчетов
  - Ограничения использования (территория, водители)
  - Акт приема-передачи ТС

notes: |
  КРИТИЧЕСКИ ВАЖНЫЕ РАЗЛИЧИЯ МЕЖДУ ВИДАМИ:
  1. АРЕНДА С ЭКИПАЖЕМ (ст. 632-635 ГК РФ):
     - Арендодатель предоставляет услуги управления и технической эксплуатации
     - Ответственность за вред третьим лицам несет Арендодатель
     - Риск случайной гибели ТС — на Арендодателе
  
  2. АРЕНДА БЕЗ ЭКИПАЖА (ст. 636-641 ГК РФ):
     - Арендатор самостоятельно управляет ТС
     - Ответственность за вред третьим лицам несет Арендатор как владелец ИПО
     - Обязанность текущего и капитального ремонта — на Арендаторе
  
  ПРАКТИЧЕСКИЕ РИСКИ:
  - "Письма счастья" (штрафы с камер) приходят собственнику
  - Нестраховые случаи: управление в состоянии опьянения, угон с ключами
  - Выезд за пределы разрешенной территории или за границу

# ════════════════════════════════════════════════════════════
# 🆕 ВАЛИДАЦИОННЫЕ СЕКЦИИ (VALIDATION ENGINE v2.0)
# ════════════════════════════════════════════════════════════

validation_metadata:
  validation_version: "2.1"
  last_updated: "2026-02-07"
  author: "Legal AI Team"
  
  # ──────────────────────────────────────────────────────────
  # СЕКЦИЯ 1: ПРИМЕНИМОЕ ЗАКОНОДАТЕЛЬСТВО
  # ──────────────────────────────────────────────────────────
  legal_base:
    primary:
      - "§ 3 Главы 34 ГК РФ (ст. 632-641) — Аренда транспортного средства"
    secondary:
      - "Федеральный закон от 25.04.2002 № 40-ФЗ «Об ОСАГО»"
      - "Кодекс РФ об административных правонарушениях (глава 12 — нарушения ПДД)"
      - "Кодекс торгового мореплавания РФ (для судов)"
      - "Воздушный кодекс РФ (для воздушных судов)"
    related:
      - "ст. 1079 ГК РФ (Ответственность за вред от источника повышенной опасности)"
      - "§ 1 Главы 34 ГК РФ (Общие положения об аренде) — применяются субсидиарно"
      - "Устав автомобильного транспорта"

  # ──────────────────────────────────────────────────────────
  # СЕКЦИЯ 2: ОБЯЗАТЕЛЬНЫЕ ЭЛЕМЕНТЫ ДОГОВОРА
  # ──────────────────────────────────────────────────────────
  essential_elements:
    - element: "vehicle_identification"
      name: "Индивидуализация транспортного средства"
      required: true
      legal_base: "ст. 607, 632, 636 ГК РФ"
      risk_msg: |
        Неполная идентификация ТС (отсутствие VIN, гос. номера) делает невозможным определение предмета договора,
        что может привести к признанию договора незаключенным.
      validation_rules:
        - "presence_check"
        - "vin_number_present"
        - "state_registration_number_present"
        - "make_model_year_specified"
    
    - element: "crew_status_declaration"
      name: "Определение вида аренды (с экипажем / без)"
      required: true
      legal_base: "ст. 632, 636 ГК РФ"
      risk_msg: |
        Неопределенность вида аренды создает правовую неопределенность в распределении:
        1) расходов на содержание и ремонт,
        2) ответственности за ДТП и вред третьим лицам,
        3) риска случайной гибели ТС.
        Это приводит к затяжным судебным спорам.
      validation_rules:
        - "presence_check"
        - "explicit_type_declaration"
        - "no_contradictory_terms"
        - "crew_status_check"
    
    - element: "rent_payment_terms"
      name: "Условия об арендной плате"
      required: true
      legal_base: "ст. 614, 635, 639 ГК РФ"
      risk_msg: "Отсутствие или неопределенность условия об арендной плате может привести к признанию договора незаключенным"
      validation_rules:
        - "presence_check"
        - "amount_specified"
        - "payment_schedule"
        - "currency_check"
    
    - element: "term_of_lease"
      name: "Срок аренды"
      required: false
      legal_base: "ст. 610 ГК РФ"
      description: "Если срок не указан, договор считается заключенным на неопределенный срок"
      validation_rules:
        - "term_clarity_if_present"
        - "start_end_date_consistency"

  # ──────────────────────────────────────────────────────────
  # СЕКЦИЯ 3: ЗАЩИТНЫЕ УСЛОВИЯ (PROTECTIVE CLAUSES)
  # ──────────────────────────────────────────────────────────

  protective_clauses:
    
    # --- ОБЩИЕ ДЛЯ ОБОИХ ВИДОВ АРЕНДЫ ---
    buyer_seller_protection:
      - clause_id: "detailed_handover_protocol"
        name: "Детальный акт приема-передачи ТС"
        risk_if_missing: |
          При возврате ТС возникают споры о состоянии, наличии повреждений, пробеге.
          Без детального акта с фотографиями невозможно доказать, были ли повреждения до аренды.
          Это приводит к конфликтам при удержании залога или взыскании ущерба.
        legal_base: "ст. 655 ГК РФ (по аналогии)"
        severity: "high"
        affected_party: "both"
        detection:
          positive_keywords:
            - "акт приема-передачи"
            - "техническое состояние"
            - "внешний вид с фотофиксацией"
            - "пробег на момент передачи"
            - "существующие повреждения (сколы, царапины)"
            - "подписи сторон"
          context_patterns:
            - '(?i)передач.*тс.*оформляетс.*двусторонним.*актом'
            - '(?i)состояни.*тс.*фиксируетс.*в.*акте.*с.*приложением.*фотографий'
      
      - clause_id: "insurance_requirements"
        name: "Требования к страхованию (ОСАГО)"
        risk_if_missing: |
          ТС нельзя эксплуатировать без ОСАГО. Нестраховые случаи (пьяный водитель, угон с ключами) 
          не покрываются полисом. Договор должен четко определять, чья обязанность — страхование.
        legal_base: "ФЗ «Об ОСАГО», ст. 637, 646 ГК РФ"
        severity: "critical"
        affected_party: "both"
        detection:
          positive_keywords:
            - "ОСАГО"
            - "страхование гражданской ответственности"
            - "полис"
            - "действующий страховой полис"
            - "страховая сумма"
          context_patterns:
            - '(?i)тс.*застрахован.*по.*осаго.*на.*момент.*передачи'
            - '(?i)обязанность.*по.*страхованию.*возлагается.*на'
        conditional_checks:
          - trigger: "with_crew"
            rule: "lessor_insures"
            legal_base: "ст. 637 ГК РФ"
            description: "При аренде с экипажем страхование — обязанность арендодателя"
          - trigger: "without_crew"
            rule: "lessee_insures"
            legal_base: "ст. 646 ГК РФ"
            description: "При аренде без экипажа страхование — обязанность арендатора"
    
    # --- ЗАЩИТА АРЕНДОДАТЕЛЯ (Lessor Protection) ---
    seller_protection:
      - clause_id: "traffic_fines_reimbursement"
        name: "Возмещение штрафов (ПДД) — «письма счастья»"
        risk_if_missing: |
          Штрафы с камер приходят собственнику (Арендодателю). Без условия о безусловном возмещении (регрессе) 
          их придется оспаривать в ГИБДД, доказывая аренду. Это время и административные издержки.
        legal_base: "КоАП РФ гл. 12"
        severity: "high"
        affected_party: "seller"
        detection:
          positive_keywords:
            - "административные штрафы"
            - "нарушение ПДД"
            - "обязан возместить"
            - "письма счастья"
            - "штрафы ГИБДД"
            - "уведомление о штрафах"
            - "срок возмещения"
          context_patterns:
            - '(?i)арендатор.*несет.*ответственность.*за.*все.*штраф.*выписанные.*в.*период.*аренды'
            - '(?i)штраф.*возмещаетс.*арендодателю.*в.*течени.*[0-9]+.*дней'
      
      - clause_id: "usage_territory_limits"
        name: "Ограничение территории эксплуатации"
        risk_if_missing: |
          Без ограничения территории Арендатор может уехать в другой регион или за границу, 
          что повышает риски угона, сложность возврата и контроля за состоянием ТС.
        legal_base: "ст. 615 ГК РФ"
        severity: "medium"
        affected_party: "seller"
        detection:
          positive_keywords:
            - "территория эксплуатации"
            - "в пределах региона"
            - "выезд за пределы РФ"
            - "географические ограничения"
            - "запрещенные зоны"
          context_patterns:
            - '(?i)использовани.*тс.*разрешаетс.*только.*в.*пределах'
            - '(?i)выезд.*за.*пределы.*[А-Яа-я]+.*области.*запрещен'
      
      - clause_id: "security_deposit_mechanism"
        name: "Залог (депозит) на случай повреждений"
        risk_if_missing: |
          При повреждении ТС или нарушении условий договора взыскание ущерба через суд — длительный процесс.
          Залог позволяет оперативно компенсировать убытки, что особенно важно при краткосрочной аренде.
        legal_base: "ст. 329, 334, 381.1 ГК РФ"
        severity: "high"
        affected_party: "seller"
        detection:
          positive_keywords:
            - "залог (депозит)"
            - "обеспечительный платеж"
            - "возвращается при отсутствии претензий"
            - "удержание при повреждениях"
            - "гарантийная сумма"
          context_patterns:
            - '(?i)арендатор.*вносит.*залог.*в.*размере.*который.*возвращаетс.*после.*возврата.*тс'
    
    # --- ЗАЩИТА АРЕНДАТОРА (Lessee Protection) ---
    buyer_protection:
      - clause_id: "vehicle_fitness_warranty"
        name: "Гарантия технической исправности и юридической чистоты"
        risk_if_missing: |
          Арендатор может получить технически неисправное ТС, что приведет к поломке, ДТП, затратам на ремонт.
          Также возможна аренда ТС с обременениями (залог, арест), что грозит изъятием у арендатора.
        legal_base: "ст. 612, 634, 638 ГК РФ"
        severity: "critical"
        affected_party: "buyer"
        detection:
          positive_keywords:
            - "исправное техническое состояние"
            - "отсутствие обременений"
            - "юридическая чистота"
            - "действующий техосмотр"
            - "диагностическая карта"
            - "гарантия арендодателя"
            - "отсутствие скрытых недостатков"
          context_patterns:
            - '(?i)арендодатель.*гарантирует.*техническую.*исправность.*тс'
            - '(?i)тс.*не.*обременено.*залогом.*арестом.*иными.*ограничениями'
      
      - clause_id: "accident_procedure_clear"
        name: "Четкая процедура действий при ДТП"
        risk_if_missing: |
          При ДТП арендатор может не знать порядка действий, что приведет к потере доказательств,
          проблемам со страховой компанией, дополнительным расходам. Особенно критично при нестраховых случаях.
        legal_base: "ФЗ «Об ОСАГО», ст. 1079 ГК РФ"
        severity: "high"
        affected_party: "buyer"
        detection:
          positive_keywords:
            - "действия при ДТП"
            - "вызов сотрудников ГИБДД"
            - "уведомление арендодателя в течение"
            - "европротокол"
            - "запрет на ремонт без согласия"
            - "страховой случай"
            - "нестраховые случаи"
          context_patterns:
            - '(?i)в.*случае.*дтп.*арендатор.*обязан.*немедленно.*уведомить.*арендодателя'
            - '(?i)ремонт.*после.*дтп.*осуществляется.*только.*с.*согласия.*арендодателя'

  # ──────────────────────────────────────────────────────────
  # СЕКЦИЯ 4: ДОПОЛНИТЕЛЬНЫЕ PROTECTIVE CLAUSES (ВИДОСПЕЦИФИЧНЫЕ)
  # ──────────────────────────────────────────────────────────
  additional_protective_clauses:
    
    # --- СПЕЦИФИКА: БЕЗ ЭКИПАЖА ---
    # Ответственность на Арендаторе
    seller_protection:
      - clause_id: "maintenance_duty_tenant"
        name: "Обязанность ремонта (Арендатор)"
        risk_if_missing: |
          В аренде без экипажа Арендатор обязан проводить И текущий, И капитальный ремонт (ст. 641 ГК РФ).
          Если договор возложит это на Арендодателя, это невыгодно. Проверяем соответствие закону.
        legal_base: "ст. 641 ГК РФ"
        severity: "medium"
        affected_party: "seller"
        detection:
          positive_keywords:
            - "поддерживать в исправном состоянии"
            - "текущий и капитальный ремонт"
            - "расходы на ремонт несет арендатор"
            - "эксплуатационные расходы"
            - "техническое обслуживание"
          conditional_checks:
            - trigger: "without_crew"
              rule: "required"
              validation_rules:
                - "maintenance_on_lessee"
          context_patterns:
            - '(?i)арендатор.*обязуется.*осуществлять.*текущий.*и.*капитальный.*ремонт'
      
      - clause_id: "liability_for_third_party_damage_tenant"
        name: "Ответственность за вред третьим лицам (ИПО)"
        risk_if_missing: |
          При аренде без экипажа за вред третьим лицам (ДТП) отвечает Арендатор (ст. 640 ГК РФ).
          Важно продублировать это в договоре, чтобы избежать исков к собственнику как владельцу ИПО.
        legal_base: "ст. 640 ГК РФ"
        severity: "high"
        affected_party: "seller"
        detection:
          positive_keywords:
            - "ответственность за вред"
            - "перед третьими лицами"
            - "несет арендатор"
            - "источник повышенной опасности"
            - "владелец ИПО"
          conditional_checks:
            - trigger: "without_crew"
              rule: "required"
          context_patterns:
            - '(?i)арендатор.*несет.*ответственность.*за.*вред.*причиненный.*третьим.*лицам'
    
    buyer_protection:
      - clause_id: "driver_verification_protection"
        name: "Проверка водителей и ограничения (защита арендатора)"
        risk_if_missing: |
          Непроверенный водитель (без опыта, с нарушениями) повышает риск ДТП. Передача управления
          неуказанному лицу может привести к отказу в страховом возмещении. Важен механизм проверки.
        legal_base: "ст. 637 ГК РФ"
        severity: "medium"
        affected_party: "buyer"
        detection:
          positive_keywords:
            - "только указанные в договоре водители"
            - "копия водительского удостоверения"
            - "требования к стажу"
            - "возрастные ограничения"
            - "запрет на передачу управления"
          conditional_checks:
            - trigger: "without_crew"
              rule: "recommended"
          context_patterns:
            - '(?i)управлени.*тс.*разрешаетс.*только.*лицам.*предоставившим.*копию.*водительского.*удостоверения'
    
    # --- СПЕЦИФИКА: С ЭКИПАЖЕМ ---
    # Ответственность на Арендодателе
    buyer_protection:
      - clause_id: "liability_for_accidents_lessor"
        name: "Ответственность Арендодателя за ДТП"
        risk_if_missing: |
          При аренде с экипажем за вред отвечает Арендодатель (ст. 634 ГК РФ).
          Арендатору важно проверить, что договор не перекладывает эту ответственность на него
          (это оспоримо, но создает проблемы и судебные споры).
        legal_base: "ст. 634 ГК РФ"
        severity: "high"
        affected_party: "buyer"
        detection:
          positive_keywords:
            - "ответственность несет арендодатель"
            - "вред возмещает арендодатель"
            - "ответственность за действия экипажа"
            - "риск случайной гибели на арендодателе"
          conditional_checks:
            - trigger: "with_crew"
              rule: "required"
          context_patterns:
            - '(?i)арендодатель.*несет.*ответственность.*за.*вред.*причиненный.*третьим.*лицам'
      
      - clause_id: "crew_qualification_guarantee"
        name: "Квалификация экипажа"
        risk_if_missing: |
          Арендатор платит за "управление". Экипаж должен быть компетентным.
          Арендодатель отвечает за квалификацию (ст. 635 ГК РФ). Неподготовленный экипаж — риск аварии.
        legal_base: "ст. 635 ГК РФ"
        severity: "medium"
        affected_party: "buyer"
        detection:
          positive_keywords:
            - "квалификация водителя"
            - "соответствующие права"
            - "трудовые отношения с арендодателем"
            - "опыт работы"
            - "медицинская справка"
          conditional_checks:
            - trigger: "with_crew"
              rule: "recommended"
          context_patterns:
            - '(?i)экипаж.*имеет.*необходимую.*квалификацию.*и.*разрешительные.*документы'
    
    seller_protection:
      - clause_id: "crew_obligations_specified"
        name: "Обязанности экипажа и график работы"
        risk_if_missing: |
          Экипаж может отказываться выполнять определенные работы, не соблюдать график.
          Без четкого перечня обязанностей арендодатель рискует претензиями от арендатора
          о некачественном оказании услуг по управлению.
        legal_base: "ст. 633 ГК РФ"
        severity: "medium"
        affected_party: "seller"
        detection:
          positive_keywords:
            - "обязанности экипажа"
            - "график работы"
            - "управление ТС"
            - "техническое обслуживание"
            - "соблюдение расписания"
          conditional_checks:
            - trigger: "with_crew"
              rule: "recommended"
          context_patterns:
            - '(?i)экипаж.*обязуется.*выполнять.*следующие.*обязанности'