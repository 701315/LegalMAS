type: contract_2.5
name: Договор найма жилого помещения
description: |
  Договор возмездного временного пользования исключительно жилым помещением (квартира, комната, жилой дом) 
  для проживания граждан. Характеризуется сильной социальной и правовой защитой нанимателя-гражданина: 
  ограничение выселения, преимущественное право на продление, контроль за повышением платы. 
  Нанимателем может быть только гражданин; для юридических лиц применяется общий режим аренды. 
  Регулируется специальными нормами Главы 35 ГК РФ с учетом жилищного законодательства.
version: 2.1
parent: class_2_transfer_for_use
sibling_contracts:
  - contract_2.1 # Договор аренды (общая коммерческая)
  - contract_2.2 # Договор проката
  - contract_2.6 # Договор безвозмездного пользования (ссуды)

metadata:
  category: contract
  subcategory: use_transfer
  complexity: medium-high # Прост структурно, но сложен в исполнении из-за социальной защиты
  risk_level: high # Риск невозможности быстрого выселения, "вечных" жильцов, неплатежей
  legal_base: Глава 35 ГК РФ (ст. 671-688), Жилищный кодекс РФ
  hierarchy_position: "child_specialized_social"

# ════════════════════════════════════════════════════════════
# БАЗОВАЯ ИНФОРМАЦИЯ (LEGACY SECTIONS - ОПТИМИЗИРОВАНО)
# ════════════════════════════════════════════════════════════
rules:
  keywords:
    high:
      - "жилое помещение"
      - "квартира"
      - "для проживания"
      - "наймодатель"
      - "наниматель"
      - "вселение"
      - "плата за наем"
    medium:
      - "наем жилья"
      - "граждане, проживающие совместно"
      - "временные жильцы"
      - "коммунальные услуги"
      - "краткосрочный наем"
      - "преимущественное право на заключение договора"
    low:
      - "страховой депозит"
      - "выселение"
      - "регистрация по месту пребывания"
      - "прописка"
      - "апартаменты"
      - "служебное жилье"
  phrases:
    high:
      - Наймодатель обязуется предоставить Нанимателю жилое помещение за плату во временное владение и пользование для проживания
      - использовать жилое помещение только для проживания
      - договор краткосрочного найма (до 1 года)
      - преимущественное право нанимателя на заключение договора на новый срок
      - Нанимателем может быть только гражданин
    medium:
      - распределение оплаты коммунальных услуг
      - порядок вселения членов семьи и временных жильцов
      - условия возврата страхового депозита
      - порядок посещения собственником
      - автоматическое продление договора при неуведомлении за 3 месяца
  patterns:
    required:
      - (?i)(жил.*помещени|квартир|комнат|для.*проживания)
    optional:
      - (?i)(наем|найм|наймодател|нанимател)
      - (?i)краткосрочн.*наем
      - (?i)страхов.*депозит
  exclusions:
    - нежилое помещение (офис, склад, апартаменты)
    - гостиничные услуги (посуточно с уборкой, обслуживанием)
    - договор с юридическим лицом (это аренда по § 1 Гл. 34 ГК РФ)
  exclusion_logic:
    - condition: "non_residential_or_apartments"
      target: "reclassify_to_contract_2.1"
      confidence: 0.90
      description: "Апартаменты юридически — нежилые помещения, для них применяется общая аренда"
    - condition: "legal_entity_tenant"
      target: "reclassify_to_contract_2.1"
      confidence: 0.95
      description: "Нанимателем по договору найма может быть только гражданин (ст. 671 ГК РФ)"
  weights:
    keyword_high: 3.5
    keyword_medium: 1.5
    keyword_low: 0.5
    phrase_high: 4.0
    phrase_medium: 1.5
    pattern_required: 5.0
    pattern_optional: 1.0
  classification:
    min_confidence: 0.85
    max_matches: 3

party_roles:
  - Наймодатель (Landlord) — собственник жилого помещения
  - Наниматель (Tenant) — гражданин (физическое лицо), заключающий договор для личного проживания
  - Члены семьи нанимателя — супруг, дети, родители, вселяемые совместно (ст. 677 ГК РФ)
  - Временные жильцы — лица, вселяемые на срок до 6 месяцев (ст. 680 ГК РФ)

essential_terms:
  - Предмет (точный адрес жилого помещения: квартира, дом, комната)
  - Плата за наем (размер, порядок, сроки внесения)
  - Срок договора (критично для разграничения прав краткосрочного/долгосрочного найма)

specific_risks:
  - Невозможность выселения без суда даже при неуплате (ст. 687 ГК РФ)
  - Автоматическое продление договора (если наймодатель забыл уведомить об отказе за 3 месяца — ст. 684 ГК РФ)
  - Регистрация "вечных" жильцов (членов семьи нанимателя)
  - Резкое повышение платы за коммунальные услуги и споры об их распределении
  - Необоснованное удержание страхового депозита под предлогом "естественного износа"
  - Незаконное проникновение наймодателя в помещение без согласия нанимателя

aliases:
  - Аренда квартиры (бытовое название)
  - Договор коммерческого найма жилого помещения
  - Residential Lease Agreement
  - Договор найма жилья

section_markers:
  - Предмет договора (адрес, площадь, этаж, количество комнат)
  - Срок найма (краткосрочный/долгосрочный)
  - Плата за наем и порядок расчетов
  - Коммунальные и эксплуатационные платежи
  - Страховой депозит (залог)
  - Права и обязанности сторон (проживающие, пользование)
  - Порядок вселения и регистрации
  - Расторжение договора и выселение
  - Ответственность сторон
  - Порядок посещения наймодателем
  - Заключительные положения

notes: |
  КРИТИЧЕСКИЕ ОСОБЕННОСТИ НАЙМА ЖИЛЬЯ:
  1. НАНИМАТЕЛЬ — ТОЛЬКО ГРАЖДАНИН. Для юрлиц — договор аренды (§ 1 Гл. 34 ГК РФ)
  2. КРАТКОСРОЧНЫЙ НАЕМ (до 1 года): меньше прав у нанимателя, проще выселение
  3. ДОЛГОСРОЧНЫЙ НАЕМ (5 лет при неуказании срока): 
     - Преимущественное право нанимателя на продление (ст. 684 ГК РФ)
     - Сложная судебная процедура выселения
     - Право вселять временных жильцов
  4. АВТОМАТИЧЕСКОЕ ПРОДЛЕНИЕ: если наймодатель не уведомил об отказе за 3 месяца до окончания
  
  ПРАКТИЧЕСКИЕ РИСКИ:
  - "Забытый" депозит при выезде
  - Неожиданное повышение платы за коммунальные услуги
  - Конфликты из-за посещения собственником
  - Сложности с выселением даже злостного неплательщика

# ════════════════════════════════════════════════════════════
# 🆕 ВАЛИДАЦИОННЫЕ СЕКЦИИ (VALIDATION ENGINE v2.0)
# ════════════════════════════════════════════════════════════

validation_metadata:
  validation_version: "2.1"
  last_updated: "2026-02-07"
  author: "Legal AI Team"
  
  # ──────────────────────────────────────────────────────────
  # СЕКЦИЯ 1: ПРИМЕНИМОЕ ЗАКОНОДАТЕЛЬСТВО
  # ──────────────────────────────────────────────────────────
  legal_base:
    primary:
      - "Глава 35 ГК РФ (ст. 671-688) — Наем жилого помещения"
      - "Жилищный кодекс РФ (правила пользования жилыми помещениями)"
    secondary:
      - "Постановление Конституционного Суда РФ № 23-П от 23.06.1995 (о краткосрочном найме)"
      - "Правила пользования жилыми помещениями (утв. Постановлением Правительства РФ № 25)"
    related:
      - "Федеральный закон от 25.06.1993 № 5242-1 «О праве граждан на свободу передвижения...» (регистрация)"
      - "Кодекс РФ об административных правонарушениях ст. 19.15 (нарушение правил регистрации)"
      - "Гражданский процессуальный кодекс РФ (процедура выселения)"

  # ──────────────────────────────────────────────────────────
  # СЕКЦИЯ 2: ОБЯЗАТЕЛЬНЫЕ ЭЛЕМЕНТЫ ДОГОВОРА
  # ──────────────────────────────────────────────────────────
  essential_elements:
    - element: "premises_address_specification"
      name: "Точная адресная идентификация жилого помещения"
      required: true
      legal_base: "ст. 673 ГК РФ"
      risk_msg: |
        Неполный адрес (без номера квартиры, этажа) делает предмет договора неопределенным, 
        что может привести к признанию договора незаключенным. Также критично для регистрации 
        по месту пребывания и разрешения споров о состоянии помещения.
      validation_rules:
        - "presence_check"
        - "address_structure_check"
        - "apartment_number_specified"
        - "floor_specified_if_multi_story"
    
    - element: "rent_amount_payment_terms"
      name: "Размер платы за наем и условия оплаты"
      required: true
      legal_base: "ст. 682 ГК РФ"
      risk_msg: |
        Отсутствие условия о размере платы за наем делает договор незаключенным. Нечеткий порядок оплаты 
        (сроки, способ) приводит к спорам о просрочке и начислении неустойки. Для наймодателя также важен 
        налоговый учет доходов от сдачи жилья.
      validation_rules:
        - "presence_check"
        - "amount_specified"
        - "payment_schedule_clear"
        - "payment_method_specified"
        - "currency_specified"
    
    - element: "contract_term_definition"
      name: "Определение срока договора найма"
      required: false
      legal_base: "ст. 683, 684 ГК РФ"
      description: "Если срок не указан, договор считается заключенным на пять лет (долгосрочный наем)"
      risk_msg: |
        Неуказание срока автоматически делает договор долгосрочным (5 лет), что дает нанимателю 
        преимущественное право на продление и существенно осложняет выселение. Для наймодателя, 
        планировавшего краткосрочную сдачу, это критичный риск.
      validation_rules:
        - "term_clarity_if_present"
        - "start_end_date_consistency"
      conditional_checks:
        - trigger: "long_term_or_unspecified"
          keywords: ["5 лет", "пять лет", "долгосрочный", "срок не указан"]
          rule: "renewal_right_warning_required"
          legal_base: "ст. 684 ГК РФ"
          severity: "critical"
          risk_msg: "Долгосрочный наем дает нанимателю преимущественное право на заключение договора на новый срок"

  # ──────────────────────────────────────────────────────────
  # СЕКЦИЯ 3: ЗАЩИТНЫЕ УСЛОВИЯ (PROTECTIVE CLAUSES)
  # ──────────────────────────────────────────────────────────

  protective_clauses:
    
    # --- ЗАЩИТА НАЙМОДАТЕЛЯ (Landlord Protection) ---
    seller_protection:
      - clause_id: "short_term_lease_protection"
        name: "Ограничение срока наймом до 1 года (краткосрочный наем)"
        risk_if_missing: |
          Если срок договора не указан или превышает 1 год, договор становится долгосрочным (5 лет). 
          Это дает нанимателю право на преимущественное продление, вселение временных жильцов и замену нанимателя. 
          Краткосрочный наем (до 1 года, обычно 11 месяцев) позволяет избежать этих рисков.
        legal_base: "ст. 683 ГК РФ"
        severity: "critical"
        affected_party: "seller"
        detection:
          positive_keywords:
            - "срок найма составляет 11 месяцев"
            - "менее одного года"
            - "краткосрочный наем"
            - "до [дата], но не более 1 года"
          negative_keywords:
            - "на 5 лет"
            - "на неопределенный срок"
            - "долгосрочный наем"
          context_patterns:
            - '(?i)договор.*заключен.*на.*срок.*до.*[0-9]+.*месяц.*но.*не.*более.*одного.*года'
      
      - clause_id: "utility_payments_allocation"
        name: "Четкое распределение оплаты коммунальных услуг"
        risk_if_missing: |
          По умолчанию наниматель обязан оплачивать коммунальные услуги (ст. 678 ГК РФ), но споры возникают 
          из-за неясности: что именно входит, как распределяются общие домовые расходы. Без детализации 
          наймодатель рискует получить долги по квитанциям УК и пени.
        legal_base: "ст. 678 ГК РФ, Жилищный кодекс РФ"
        severity: "high"
        affected_party: "seller"
        detection:
          positive_keywords:
            - "электроэнергия по счетчику"
            - "водоснабжение по счетчику"
            - "отопление"
            - "вывоз ТБО"
            - "коммунальные услуги оплачивает наниматель"
            - "квитанции управляющей компании"
            - "оплата напрямую поставщикам"
          context_patterns:
            - '(?i)наниматель.*обязуется.*самостоятельно.*оплачивать.*коммунальные.*услуги.*по.*счетчикам'
            - '(?i)расходы.*на.*[электроэнергию|воду|газ].*несет.*наниматель.*в.*соответствии.*с.*показаниями.*счетчиков'
      
      - clause_id: "eviction_conditions_clear"
        name: "Условия расторжения договора и выселения"
        risk_if_missing: |
          Наймодатель не может выселить нанимателя во внесудебном порядке. Попытки включить условия 
          "выселение в 3 дня при неуплате" ничтожны. Однако важно четко прописать основания для обращения 
          в суд: систематическая неуплата, разрушение помещения, использование не по назначению.
        legal_base: "ст. 687 ГК РФ"
        severity: "high"
        affected_party: "seller"
        detection:
          positive_keywords:
            - "расторжение в судебном порядке"
            - "просрочка оплаты более 2 раз в течение года"
            - "разрушение или порча жилого помещения"
            - "систематическое нарушение прав соседей"
            - "использование не по назначению"
            - "основания для выселения"
          negative_keywords:
            - "выселение в одностороннем порядке"
            - "выселение в течение 3 дней"
            - "по усмотрению наймодателя"
          context_patterns:
            - '(?i)договор.*может.*быть.*расторгнут.*по.*требованию.*наймодателя.*только.*в.*случаях'
            - '(?i)выселение.*производится.*только.*по.*решению.*суда'
    
    # --- ЗАЩИТА НАНИМАТЕЛЯ (Tenant Protection) ---
    buyer_protection:
      - clause_id: "security_deposit_return_guarantee"
        name: "Гарантия возврата страхового депозита (залога)"
        risk_if_missing: |
          Наймодатели часто удерживают депозит под предлогом "естественного износа" или незначительных повреждений. 
          Без четких условий возврата наниматель теряет значительную сумму. Важно указать: депозит возвращается 
          при выезде за вычетом только доказанного ущерба, естественный износ не учитывается.
        legal_base: "ст. 329, 334 ГК РФ"
        severity: "high"
        affected_party: "buyer"
        detection:
          positive_keywords:
            - "возврат депозита"
            - "страховой депозит возвращается при"
            - "естественный износ не является основанием для удержания"
            - "при отсутствии задолженности и повреждений"
            - "срок возврата депозита"
            - "акт возврата помещения"
          context_patterns:
            - '(?i)депозит.*возвращается.*нанимателю.*в.*течение.*[0-9]+.*дней.*после.*выезда'
            - '(?i)естественный.*износ.*не.*является.*основанием.*для.*удержания.*средств.*из.*депозита'
      
      - clause_id: "landlord_access_regulation"
        name: "Регламент посещения помещения наймодателем"
        risk_if_missing: |
          Наймодатель не имеет права входить в квартиру без согласия нанимателя (неприкосновенность жилища, ст. 25 Конституции). 
          Однако для контроля состояния имущества необходим компромиссный порядок: посещение по предварительной договоренности, 
          в удобное время, в присутствии нанимателя.
        legal_base: "ст. 25 Конституции РФ, ст. 3 ЖК РФ"
        severity: "medium"
        affected_party: "buyer"
        detection:
          positive_keywords:
            - "посещение по предварительному согласованию"
            - "один раз в месяц"
            - "в присутствии нанимателя"
            - "в удобное для нанимателя время"
            - "уведомление не менее чем за"
            - "неприкосновенность жилища"
          context_patterns:
            - '(?i)наймодатель.*вправе.*посещать.*помещение.*не.*чаще.*одного.*раза.*в.*месяц.*по.*предварительному.*согласованию'
            - '(?i)посещение.*осуществляется.*только.*в.*присутствии.*нанимателя'
      
      - clause_id: "rent_increase_limitations"
        name: "Ограничения на повышение платы за наем"
        risk_if_missing: |
          Наймодатель может попытаться повышать плату чаще, чем разрешено законом, или в одностороннем порядке. 
          Для договоров найма ст. 682 ГК РФ устанавливает: повышение не чаще одного раза в год, уведомление за 3 месяца. 
          Без этих ограничений наниматель подвергается риску неконтролируемого роста расходов.
        legal_base: "ст. 682 ГК РФ"
        severity: "high"
        affected_party: "buyer"
        detection:
          positive_keywords:
            - "изменение размера платы"
            - "не чаще одного раза в год"
            - "уведомление за 3 месяца"
            - "индекс потребительских цен"
            - "согласование увеличения"
          negative_keywords:
            - "в одностороннем порядке"
            - "по усмотрению наймодателя"
            - "ежеквартальная индексация"
          context_patterns:
            - '(?i)размер.*платы.*может.*быть.*изменен.*не.*чаще.*одного.*раза.*в.*год'
            - '(?i)уведомление.*об.*изменении.*платы.*направляется.*не.*позднее.*чем.*за.*3.*месяца'

  # ──────────────────────────────────────────────────────────
  # СЕКЦИЯ 4: ДОПОЛНИТЕЛЬНЫЕ PROTECTIVE CLAUSES (СПЕЦИФИКА НАЙМА)
  # ──────────────────────────────────────────────────────────
  additional_protective_clauses:
    
    # Контроль за вселением и проживанием
    seller_protection:
      - clause_id: "residents_list_and_control"
        name: "Список проживающих и контроль за вселением"
        risk_if_missing: |
          Наниматель имеет право вселить супруга, детей, родителей без согласия наймодателя (ст. 677 ГК РФ). 
          Других лиц — только с согласия (ст. 679). Без списка проживающих квартира может превратиться 
          в общежитие с неконтролируемым числом жильцов, что увеличивает износ и риски.
        legal_base: "ст. 677, 679 ГК РФ"
        severity: "high"
        affected_party: "seller"
        detection:
          positive_keywords:
            - "совместно с нанимателем проживают"
            - "список граждан"
            - "члены семьи нанимателя"
            - "без права вселения иных лиц"
            - "временные жильцы с согласия наймодателя"
            - "вселение третьих лиц запрещено"
          context_patterns:
            - '(?i)наниматель.*вправе.*вселить.*только.*указанных.*в.*приложении.*лиц'
            - '(?i)вселение.*иных.*лиц.*допускается.*только.*с.*письменного.*согласия.*наймодателя'
    
    # Защита от автоматического продления
    seller_protection:
      - clause_id: "renewal_notice_procedure"
        name: "Процедура уведомления об отказе от продления"
        risk_if_missing: |
          При долгосрочном найме (5 лет) договор автоматически продлевается, если наймодатель не уведомил 
          об отказе за 3 месяца до окончания (ст. 684 ГК РФ). Многие собственники "забывают" об этом, 
          и наниматель получает право требовать продления. Явная процедура уведомления дисциплинирует.
        legal_base: "ст. 684 ГК РФ"
        severity: "medium"
        affected_party: "seller"
        detection:
          positive_keywords:
            - "уведомление об отказе от продления"
            - "не позднее чем за 3 месяца до окончания срока"
            - "письменное уведомление"
            - "договор не продлевается автоматически"
            - "процедура продления"
          context_patterns:
            - '(?i)если.*наймодатель.*не.*направит.*уведомление.*об.*отказе.*за.*3.*месяца.*договор.*считается.*продленным'
    
    # Защита прав нанимателя на регистрацию
    buyer_protection:
      - clause_id: "registration_right_procedure"
        name: "Порядок регистрации по месту пребывания"
        risk_if_missing: |
          Наниматель и члены его семьи имеют право на временную регистрацию по месту пребывания. 
          Без четкой процедуры наймодатель может отказываться предоставлять документы, что нарушает права 
          нанимателя (получение медицинской помощи, устройство детей в школу).
        legal_base: "Закон РФ № 5242-1, ст. 680 ГК РФ"
        severity: "medium"
        affected_party: "buyer"
        detection:
          positive_keywords:
            - "регистрация по месту пребывания"
            - "временная регистрация"
            - "наймодатель обязуется содействовать"
            - "срок для регистрации"
            - "документы для регистрации"
            - "прописка"
          context_patterns:
            - '(?i)наймодатель.*обязуется.*предоставить.*документы.*для.*оформления.*временной.*регистрации'
            - '(?i)наниматель.*имеет.*право.*на.*регистрацию.*по.*месту.*пребывания.*в.*течение.*[0-9]+.*дней'
    
    # Защита от скрытых дефектов и проверка прав собственности
    buyer_protection:
      - clause_id: "premises_condition_warranty"
        name: "Гарантия состояния помещения и проверка права собственности"
        risk_if_missing: |
          Наниматель может столкнуться с: 1) скрытыми дефектами помещения, 2) мошенником, снимающим чужую квартиру. 
          Без акта приема-передачи с фотофиксацией и проверки выписки из ЕГРН риски существенно возрастают.
        legal_base: "ст. 612, 671 ГК РФ"
        severity: "critical"
        affected_party: "buyer"
        detection:
          positive_keywords:
            - "акт приема-передачи с фотофиксацией"
            - "выписка из ЕГРН"
            - "право собственности подтверждено"
            - "отсутствие скрытых недостатков"
            - "техническое состояние"
            - "инвентаризационная опись имущества"
          context_patterns:
            - '(?i)передач.*помещени.*оформляется.*двусторонним.*актом.*с.*приложением.*фотографий'
            - '(?i)наймодатель.*гарантирует.*что.*является.*собственником.*и.*помещение.*не.*обременено'