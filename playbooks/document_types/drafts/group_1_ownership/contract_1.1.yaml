type: contract_1.1
name: "Договор купли-продажи (общая)"
description: |
  БАЗОВАЯ (РОДОВАЯ) конструкция (emptio-venditio) для возмездной передачи права собственности на имущество.
  РОДИТЕЛЬСКИЙ ТИП для всех возмездных договоров передачи собственности в группе "Передача имущества в собственность".
  Применяется, когда сделка не содержит явных признаков специализированных типов (поставка, розница, недвижимость и др.).
  Является residuary contract для группы.
version: 2.1
parent: class_1_transfer_of_ownership
sibling_contracts:  # Новое поле: братские типы в группе
  - contract_1.2: "Розничная купля-продажа"
  - contract_1.3: "Договор поставки"
  - contract_1.4: "Договор контрактации"
  - contract_1.5: "Договор энергоснабжения"
  - contract_1.6: "Договор купли-продажи недвижимости"
  - contract_1.7: "Договор мены (Бартер)"
  - contract_1.8: "Договор дарения"
  - contract_1.9: "Договор ренты"
  - contract_1.10: "Договор уступки права требования (цессия)"
  - contract_1.11: "Договор купли-продажи корпоративных прав (долей/акций)"
  - contract_1.12: "Соглашение об отступном"
  - contract_1.13: "Договор продажи предприятия"
metadata:
  category: contract
  subcategory: ownership_transfer
  complexity: low-medium  # Базовая конструкция должна быть проще
  risk_level: medium
  legal_base: § 1 Главы 30 ГК РФ (ст. 454-491)
  hierarchy_position: "parent_general"  # Новое поле
  classification_priority: "fallback"  # Применяется, если нет признаков специализированных типов

