party_roles:
  - Продавец (Seller) — отчуждатель вещи, передающий право собственности
  - Покупатель (Buyer) — приобретатель вещи, принимающий право собственности

essential_terms:
  - Наименование товара (индивидуально-определенная вещь, ст. 455 ГК РФ)
  - Количество товара (ст. 455, 465 ГК РФ)
  - Цена товара (рекомендуется как существенное условие, ст. 485 ГК РФ)

specific_risks:
  - Неопределенность предмета → договор незаключен (ст. 455 ГК РФ)
  - Наличие обременений у товара → риск эвикции (ст. 460 ГК РФ)
  - Неверная квалификация договора → применение неверных норм права

aliases:
  - ДКП
  - Купля-продажа имущества
  - Соглашение о продаже
  - Общая купля-продажа

section_markers:
  - Предмет договора
  - Цена товара и порядок расчетов
  - Качество и комплектность товара
  - Порядок передачи товара
  - Переход права собственности и рисков
  - Ответственность сторон
  - Разрешение споров
  - Реквизиты и подписи

notes: |
  ЭТО БАЗОВЫЙ (ОБЩИЙ) ТИП договора купли-продажи.
  
  ПРИМЕНЯЕТСЯ КАК FALLBACK:
  - Если нет признаков специализированных типов (поставка, розница, недвижимость и др.)
  - Для разовых сделок между любыми субъектами
  - Когда цель использования товара не указана или не является определяющей
  
  ОСОБЕННОСТИ:
  - Регулируется общими нормами § 1 Гл. 30 ГК РФ
  - Не требует специальной квалификации сторон
  - Может применяться к любым вещам, кроме изъятых из оборота
  
  ПРОВЕРЬТЕ ПРИЗНАКИ СПЕЦИАЛИЗИРОВАННЫХ ТИПОВ:
  1. Розничная купля-продажа (contract_1.2) → если покупатель-гражданин для личных нужд
  2. Поставка (contract_1.3) → если обе стороны юрлица/ИП и товар для бизнеса
  3. Контрактация (contract_1.4) → если сельхозпродукция от производителя
  4. Энергоснабжение (contract_1.5) → если предмет — энергия
  5. Недвижимость (contract_1.6) → если объект недвижимости
  6. Мена (contract_1.7) → если встречная передача вещей
  7. Дарение (contract_1.8) → если безвозмездно
  8. Рента (contract_1.9) → если передача за содержание
  9. Цессия (contract_1.10) → если предмет — право требования

