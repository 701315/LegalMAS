      - "§ 1 Главы 30 ГК РФ (ст. 454-491) — Общие положения о купле-продаже"
    secondary:
      - "Постановление Пленума ВАС РФ № 16 от 14.03.2014 (Свобода договора)"
    related:
      - "ст. 223, 224 ГК РФ (Момент возникновения права собственности)"
      - "ст. 211, 459 ГК РФ (Риск случайной гибели имущества)"
      - "ст. 317.1 ГК РФ (Законные проценты)"
    note: |
      При квалификации как специализированный тип (розница, поставка и т.д.) 
      применяются соответствующие специальные нормы (§ 2, 3, 6 Гл. 30 ГК РФ и др.)

  # ──────────────────────────────────────────────────────────
  # СЕКЦИЯ 2: ОБЯЗАТЕЛЬНЫЕ ЭЛЕМЕНТЫ (ESSENTIALIA NEGOTII)
  # ──────────────────────────────────────────────────────────
  essential_elements:
    - element: "parties_general"
      name: "Стороны договора"
      required: true
      legal_base: "ст. 432 ГК РФ"
      description: "Любые субъекты гражданского права (физические, юридические лица, публичные образования)"
      validation_rules:
        - "presence_check"
        - "legal_capacity_indicators"

    - element: "subject_general"
      name: "Предмет договора (общие требования)"
      required: true
      legal_base: "ст. 455 ГК РФ"
      description: "Любая вещь, не изъятая из оборота. Должна быть определима через наименование и количество"
      risk_msg: "Неиндивидуализированный предмет → договор незаключен"
      validation_rules:
        - "presence_check"
        - "quantity_units_check"
        - "identifiability_check"

    - element: "price_general"
      name: "Цена (рекомендуется для ясности)"
      required: false  # По ст. 424 может определяться по аналогии
      legal_base: "ст. 424, 485 ГК РФ"
      description: "Может быть определена по соглашению или по цене аналогичных товаров"
      validation_rules:
        - "price_determinability_check"  # Проверка, что цена может быть определена

  # ──────────────────────────────────────────────────────────
  # СЕКЦИЯ 3: ЗАЩИТНЫЕ УСЛОВИЯ (PROTECTIVE CLAUSES)
  # ──────────────────────────────────────────────────────────
  protective_clauses:
    
    # --- ОБЩИЕ ЗАЩИТНЫЕ УСЛОВИЯ (применимы к любому виду купли-продажи) ---
    seller_protection:
      - clause_id: "retention_of_title_general"
        name: "Удержание права собственности до оплаты"
        risk_if_missing: |
          Для сделок с отсрочкой платежа: риск утраты товара без оплаты при банкротстве покупателя.
          Особенно актуально для дорогостоящего или уникального имущества.
        legal_base: "ст. 491 ГК РФ"
        severity: "medium"
        detection:
          positive_keywords:
            - "право собственности переходит после оплаты"
            - "сохраняется за продавцом до полной оплаты"
          context_patterns:
            - '(?i)до.*полной.*оплаты.*право.*собственности.*не.*переходит'

      - clause_id: "acceptance_deadline_general"
        name: "Срок для проверки товара и заявления претензий"
        risk_if_missing: |
          Риск предъявления претензий спустя длительное время, когда доказать состояние товара 
          на момент передачи затруднительно или невозможно.
        legal_base: "ст. 477, 483 ГК РФ"
        severity: "medium"
        detection:
          positive_keywords:
            - "срок приемки"
            - "претензии заявляются в течение"
            - "акт приема-передачи"

    buyer_protection:
      - clause_id: "encumbrance_warranty_general"
        name: "Гарантия отсутствия прав третьих лиц"
        risk_if_missing: |
          Риск эвикции: изъятия товара третьими лицами (залогодержателями, кредиторами и др.)
          с последующими убытками и судебными разбирательствами.
        legal_base: "ст. 460-462 ГК РФ"
        severity: "high"
        detection:
          positive_keywords:
            - "свободен от прав третьих лиц"
            - "не обременен"
            - "гарантирует отсутствие обременений"

      - clause_id: "quality_warranty_general"
        name: "Гарантия качества товара"
        risk_if_missing: |
          Бремя доказывания, что недостатки возникли до передачи, лежит на покупателе.
          С явной гарантией это бремя переходит на продавца.
        legal_base: "ст. 470, 476 ГК РФ"
        severity: "medium"
        detection:
          positive_keywords:
            - "гарантийный срок"
            - "гарантия качества"
            - "соответствует требованиям"

  # ──────────────────────────────────────────────────────────
  # СЕКЦИЯ 4: ПЕРЕХОДНЫЕ/СПЕЦИАЛЬНЫЕ УСЛОВИЯ
  # (Для случаев, когда договор может иметь признаки смешанного типа)
  # ──────────────────────────────────────────────────────────
  mixed_type_indicators:
    - indicator: "contains_both_general_and_special_terms"
      description: "Договор содержит элементы общей купли-продажи и признаки специализированного типа"
      examples:
        - "Есть условие о 'розничной продаже', но стороны — две коммерческие организации"
        - "Указан 'товар для предпринимательской деятельности', но нет систематических поставок"
        - "Предмет — движимое имущество, но есть ссылка на кадастровый номер"
      recommendation: |
        Приоритет квалификации:
        1. Специальные нормы (если явно применимы)
        2. Общие нормы купли-продажи
        3. Аналогия закона/права
        
        Возможна квалификация как смешанного договора (ст. 421 ГК РФ).

  # ──────────────────────────────────────────────────────────
  # СЕКЦИЯ 5: СПЕЦИФИЧЕСКИЕ ВАЛИДАЦИИ ДЛЯ FALLBACK-ТИПА
  # ──────────────────────────────────────────────────────────
  fallback_validations:
    - validation_id: "check_for_specialization_absence"
      name: "Проверка отсутствия признаков специализированных типов"
      description: "Убедиться, что договор правомерно квалифицирован как общая купля-продажа"
      checks:
        - check: "no_consumer_indicators"
          description: "Нет признаков розничной купли-продажи"
          indicators_absent: ["потребитель", "для личных нужд", "розничн"]
        - check: "no_business_to_business_indicators"
          description: "Нет явных признаков поставки"
          indicators_absent: ["поставк", "для предпринимательской деятельности", "партия"]
        - check: "no_special_subject"
          description: "Предмет не относится к специальным категориям"
          indicators_absent: ["недвижимость", "энерги", "сельхозпродукци"]
      action_if_found: "requalify_to_specific_type"
      action_if_not_found: "confirm_as_general_sale"

    - validation_id: "general_contract_completeness"
      name: "Полнота общих условий"
      description: "Проверка, что договор содержит минимально необходимые условия"
      required_elements:
        - "identifiable_parties"
        - "determinable_subject"
        - "price_or_price_determination_mechanism"
        - "transfer_mechanism"
      recommended_elements:
        - "quality_terms"
        - "warranty_against_encumbrances"
        - "risk_allocation"
        - "dispute_resolution"

notes_for_validator: |
  ВАЖНО: Этот шаблон является БАЗОВЫМ (ОБЩИМ) для всей группы договоров передачи собственности.
  
  АЛГОРИТМ РАБОТЫ:
  1. Провести квалификационные проверки (qualification_checks)
  2. Если найден явный признак специализированного типа → перейти к соответствующему contract_X.X
  3. Если признаки неоднозначны или смешаны → рассмотреть как смешанный договор
  4. Если признаки специализации отсутствуют → применять данный contract_1.1
  
  ОСОБЕННОСТИ КВАЛИФИКАЦИИ:
  - Розничная купля-продажа: покупатель-гражданин + для личных нужд
  - Поставка: обе стороны предприниматели + товар для бизнеса
  - Контрактация: сельхозпродукция + продавец-производитель
  - Недвижимость: объект с признаками недвижимого имущества
  - Дарение: безвозмездность
  - Мена: встречная передача вещей
  
  ДАННЫЙ ТИП — ЭТО "ОБЩАЯ ЧАСТЬ" ДЛЯ ВСЕХ ВОЗМЕЗДНЫХ ПЕРЕДАЧ СОБСТВЕННОСТИ.