type: contract_1.2
name: "Розничная купля-продажа"
description: |
  Специализированный вид купли-продажи (B2C), являющийся публичным договором (ст. 426 ГК РФ).
  Продавец-предприниматель передает Покупателю-гражданину товар для личного, семейного, 
  домашнего или иного использования, не связанного с предпринимательской деятельностью.
version: 2.1
parent: class_1_transfer_of_ownership
metadata:
  category: contract
  subcategory: ownership_transfer
  complexity: low
  risk_level: high
  legal_base: § 2 Главы 30 ГК РФ (ст. 492-505)

# ════════════════════════════════════════════════════════════
# БАЗОВАЯ ИНФОРМАЦИЯ (LEGACY SECTIONS)
# ════════════════════════════════════════════════════════════
rules:
  keywords:
    high:
      - "потребител"
      - "личны нужд"
      - "публичн оферт"
      - "розничн торговл"
      - "розничн магазин"
      - "чек"
      - "кассов чек"
      - "товарн чек"
    medium:
      - "закон о защите прав потребителей"
      - "гарантийн талон"
      - "правил торговл"
      - "уголок потребител"
      - "ценник"
      - "интернет-магазин"
    low:
      - "пункт выдач"
      - "курьерск доставк"
  phrases:
    high:
      - товар приобретается для личных, семейных, домашних нужд
      - не связанного с осуществлением предпринимательской деятельности
      - договор считается заключенным с момента выдачи чека
      - права потребителя регулируются законом
    medium:
      - вправе отказаться от товара в любое время до его передачи
      - гарантийный срок устанавливается изготовителем
  patterns:
    required:
      - (?i)(розничн|потребител|личн.*нужд|семейн.*нужд|покупатель-?гражданин)  # → contract_1.2
    optional:
      - (?i)(чек|оферта|магазин|интернет-заказ)
  exclusions:
    - pattern: "поставка|для перепродажи"
      reason: "Коммерческое использование"
    - pattern: "оптовая партия"
      reason: "Не розничная продажа"
    - pattern: "между юридическими лицами"
      reason: "B2B договор"
  weights:
    keyword_high: 3.5
    keyword_medium: 1.5
    phrase_high: 4.0
    pattern_required: 5.0
  classification:
    min_confidence: 0.80
    max_matches: 1

party_roles:
  - Продавец (Seller) — только коммерческая организация или ИП
  - Покупатель (Consumer) — физическое лицо (гражданин)

essential_terms:
  - Предмет договора (наименование и количество).
  - Цена (существенное условие для публичного договора — ст. 500 ГК РФ).

specific_risks:
  - Включение ущемляющих условий (ничтожны по ст. 16 ЗоЗПП).
  - Нарушение права на информацию (ст. 10 ЗоЗПП) → право на отказ и возврат денег.
  - Нарушение сроков удовлетворения требований потребителя (неустойка 1% в день).

aliases:
  - Публичная оферта интернет-магазина
  - Пользовательское соглашение (E-commerce)
  - Договор розничной продажи

section_markers:
  - Предмет оферты/договора
  - Цена и порядок оплаты
  - Доставка и передача товара
  - Возврат и обмен товара
  - Гарантийные обязательства
  - Права потребителя
  - Ответственность сторон

notes: |
  Внимание: Постановление № 55 отменено. Действует Постановление № 2463.
  Договор часто заключается путем конклюдентных действий (оплата чека).

# ════════════════════════════════════════════════════════════
# 🆕 ВАЛИДАЦИОННЫЕ СЕКЦИИ (VALIDATION ENGINE v2.0)
# ════════════════════════════════════════════════════════════

validation_metadata:
  validation_version: "2.0"
  last_updated: "2026-02-06"
  author: "Legal AI Team"

  # ──────────────────────────────────────────────────────────
  # СЕКЦИЯ 1: ПРИМЕНИМОЕ ЗАКОНОДАТЕЛЬСТВО
  # ──────────────────────────────────────────────────────────
  legal_base:
    primary:
      - "Закон РФ от 07.02.1992 № 2300-1 «О защите прав потребителей» (ЗоЗПП)"
      - "§ 2 Главы 30 ГК РФ (ст. 492-505)"
    secondary:
      - "Постановление Правительства РФ от 31.12.2020 № 2463 (Правила продажи товаров)"
      - "ст. 426 ГК РФ (Публичный договор)"
      - "ст. 26.1 ЗоЗПП (Дистанционный способ продажи)"
    related:
      - "КоАП РФ ст. 14.8 (Нарушение прав потребителей)"
      - "ст. 395 ГК РФ (Проценты за пользование чужими средствами)"
      - "ст. 330 ГК РФ (Неустойка)"
      - "ст. 23.1 ЗоЗПП (Ответственность за нарушение сроков передачи товара)"

  # ──────────────────────────────────────────────────────────
  # СЕКЦИЯ 2: ОБЯЗАТЕЛЬНЫЕ ЭЛЕМЕНТЫ (ESSENTIALIA NEGOTII)
  # ──────────────────────────────────────────────────────────
  essential_elements:
    - element: "parties"
      required: true
      legal_base: "ст. 9 ЗоЗПП, ст. 495 ГК РФ"
      description: "Продавец обязан предоставить информацию о себе (Наименование, ОГРН, Адрес) и покупателе"
      validation_rules:
        - "presence_check"
        - "seller_details_check"
    
    - element: "subject"
      required: true
      legal_base: "ст. 455, 495 ГК РФ, ст. 10 ЗоЗПП"
      description: "Предмет должен быть описан с указанием основных потребительских свойств"
      validation_rules:
        - "presence_check"
        - "consumer_properties_check"
      conditional_checks:
        - trigger: "technical_goods_keywords"
          keywords: ["технически сложный", "электроника", "оборудование", "сложный товар"]
          rule: "technical_specifications_required"
          legal_base: "ст. 10 ЗоЗПП"
          severity: "high"
          validation_rules:
            - "manufacturer_info_present"
            - "technical_characteristics_listed"
            - "warranty_terms_specified"
    
    - element: "price"
      required: true
      legal_base: "ст. 500 ГК РФ"
      description: "Цена товара является существенным условием публичного договора розничной купли-продажи"
      validation_rules:
        - "presence_check"
        - "amount_specified"
    
    - element: "term"
      required: false
      legal_base: "ст. 492, 500 ГК РФ, ст. 23.1 ЗоЗПП"
      description: "Срок передачи товара потребителю (особенно важно для дистанционной продажи)"
      validation_rules:
        - "delivery_timeframe_check"
      conditional_checks:
        - trigger: "distance_selling_keywords"
          keywords: ["дистанционный", "интернет", "доставка", "курьер"]
          rule: "delivery_deadline_required"
          legal_base: "ст. 23.1 ЗоЗПП"
          severity: "medium"

  # ──────────────────────────────────────────────────────────
  # СЕКЦИЯ 3: ЗАЩИТНЫЕ УСЛОВИЯ (PROTECTIVE CLAUSES)
  # ──────────────────────────────────────────────────────────
  protective_clauses:
    
    # --- ЗАЩИТА ПОКУПАТЕЛЯ (Compliance Check) ---
    buyer_protection:
      - clause_id: "return_rights_info"
        name: "Информация о праве на возврат/обмен"
        risk_if_missing: |
          Если потребителю не предоставлена информация о порядке и сроках возврата товара надлежащего качества,
          срок возврата может быть увеличен (для дистанционной торговли — до 3 месяцев по ст. 26.1 ЗоЗПП).
          Отсутствие информации нарушает ст. 10 ЗоЗПП и может привести к административной ответственности продавца.
        legal_base: "ст. 25, 26.1 ЗоЗПП"
        severity: "high"
        affected_party: "buyer"
        detection:
          positive_keywords:
            - "возврат товара"
            - "в течение 14 дней"
            - "в течение 7 дней"
            - "обмен непродовольственного товара"
            - "право на отказ"
          context_patterns:
            - '(?i)потребитель.*вправе.*отказаться'
            - '(?i)обмен.*товар.*надлежащего.*качества'

      - clause_id: "no_illegal_restrictions"
        name: "Отсутствие ущемляющих условий"
        risk_if_missing: |
          Условия, ограничивающие права потребителя по сравнению с ЗоЗПП (например, «возврат товара по акции запрещен» 
          или «претензии принимаются в течение 3 дней»), являются ничтожными по ст. 16 ЗоЗПП.
          Включение таких условий влечет административную ответственность по ст. 14.8 КоАП РФ и дает потребителю 
          право требовать возмещения убытков.
        legal_base: "ст. 16 ЗоЗПП"
        severity: "critical"
        affected_party: "buyer"
        detection:
          positive_keywords:
            - "права потребителя"
            - "в соответствии с законодательством РФ"
            - "закон о защите прав потребителей"
          negative_keywords:
            - "возврат невозможен"
            - "обмену не подлежит"
            - "только ремонт"
            - "претензии принимаются в течение 3 дней"
            - "не принимаются претензии по"
            - "гарантия не предоставляется"
          context_patterns:
            - '(?i)не.*принимаются.*претензии.*после.*дней'
            - '(?i)ответственность.*ограничена.*стоимостью.*товара'

      - clause_id: "warranty_rights_clarification"
        name: "Разъяснение прав при обнаружении недостатков"
        risk_if_missing: |
          Без явного указания прав потребителя при обнаружении недостатков продавец может вводить потребителя 
          в заблуждение относительно возможных требований. Потребитель может не знать, что вправе требовать 
          замены товара, соразмерного уменьшения цены или возврата денег по своему выбору.
        legal_base: "ст. 18 ЗоЗПП"
        severity: "medium"
        affected_party: "buyer"
        detection:
          positive_keywords:
            - "безвозмездное устранение недостатков"
            - "замена товара"
            - "возврат уплаченной суммы"
            - "соразмерное уменьшение цены"
            - "права при недостатках"
          context_patterns:
            - '(?i)потребитель.*вправе.*потребовать.*ремонта'
            - '(?i)при.*обнаружении.*недостатков.*потребитель'

    # --- ЗАЩИТА ПРОДАВЦА (Seller Protection) ---
    seller_protection:
      - clause_id: "non_returnable_goods_reference"
        name: "Ссылка на перечень невозвратных товаров"
        risk_if_missing: |
          Без информирования покупателя о том, что товар входит в Перечень непродовольственных товаров надлежащего 
          качества, не подлежащих обмену (Постановление № 2463), продавец рискует столкнуться с необоснованными 
          требованиями о возврате (например, нижнего белья, косметики, парфюмерии).
        legal_base: "Постановление Правительства РФ № 2463"
        severity: "medium"
        affected_party: "seller"
        detection:
          positive_keywords:
            - "Перечень № 2463"
            - "не подлежат обмену"
            - "предметы личной гигиены"
            - "парфюмерия"
            - "нижнее белье"
          context_patterns:
            - '(?i)товары.*не.*подлежащие.*обмену.*постановление'

      - clause_id: "delivery_cost_retention"
        name: "Удержание расходов на доставку при возврате"
        risk_if_missing: |
          При отказе потребителя от товара надлежащего качества при дистанционной продаже продавец должен вернуть 
          сумму, уплаченную потребителем. Если в оферте не указано право удержать расходы на обратную доставку, 
          продавец будет обязан вернуть полную стоимость, понеся убытки на логистику.
        legal_base: "п. 4 ст. 26.1 ЗоЗПП"
        severity: "medium"
        affected_party: "seller"
        detection:
          positive_keywords:
            - "за исключением расходов на доставку"
            - "минус расходы продавца"
            - "расходы на возврат"
            - "обратная пересылка"
          context_patterns:
            - '(?i)продавец.*вправе.*удержать.*расходы.*доставк'
        conditional_checks:
          - trigger: "distance_selling_keywords"
            keywords: ["интернет-магазин", "сайт", "доставка", "курьер", "дистанционный"]
            rule: "retention_clause_recommended"
            severity: "medium"

      - clause_id: "order_cancellation_before_shipment"
        name: "Право отказать в отмене заказа после начала исполнения"
        risk_if_missing: |
          Если не указано, что отмена заказа возможна только до момента передачи товара в службу доставки или начала 
          его комплектации, потребитель может требовать отмены заказа в последний момент, что приведет к прямым убыткам продавца.
        legal_base: "ст. 23.1 ЗоЗПП"
        severity: "medium"
        affected_party: "seller"
        detection:
          positive_keywords:
            - "до передачи в службу доставки"
            - "до момента отгрузки"
            - "до начала комплектации"
            - "отмена до передачи товара"
          context_patterns:
            - '(?i)отказ.*возможен.*до.*передачи.*доставке'

  # ──────────────────────────────────────────────────────────
  # СЕКЦИЯ 4: ДОПОЛНИТЕЛЬНЫЕ PROTECTIVE CLAUSES
  # ──────────────────────────────────────────────────────────
  additional_protective_clauses:
    
    # Специфика для технически сложных товаров (ТСТ)
    seller_protection:
      - clause_id: "technical_goods_return_limit"
        name: "Ограничение возврата технически сложных товаров"
        risk_if_missing: |
          Технически сложные товары (ТСТ) при наличии недостатков подлежат возврату/обмену только в течение 15 дней.
          По истечении этого срока — только ремонт (кроме существенных недостатков).
          Если это не разъяснить, потребитель может требовать возврата денег в течение всего гарантийного срока.
        legal_base: "ст. 18 ЗоЗПП"
        severity: "medium"
        affected_party: "seller"
        detection:
          positive_keywords:
            - "технически сложный товар"
            - "в течение 15 дней"
            - "существенный недостаток"
            - "перечень технически сложных товаров"
          context_patterns:
            - '(?i)технически.*сложный.*товар.*возврат.*15.*дней'
        conditional_checks:
          - trigger: "tech_goods_keywords"
            keywords: ["электроника", "смартфон", "ноутбук", "автомобиль", "телевизор", "холодильник"]
            rule: "tst_rules_required"
            severity: "high"
    
    # Для продажи продовольственных товаров
    seller_protection:
      - clause_id: "food_expiration_info"
        name: "Информация о сроке годности продовольственных товаров"
        risk_if_missing: |
          Для продовольственных товаров отсутствие четкой информации о сроке годности является нарушением 
          требований безопасности. Продажа товара с истекшим сроком годности влечет серьезные штрафы и может 
          причинить вред здоровью потребителя.
        legal_base: "ст. 5, 10 ЗоЗПП, Технический регламент ТР ТС 021/2011"
        severity: "critical"
        affected_party: "seller"
        detection:
          positive_keywords:
            - "срок годности"
            - "употребить до"
            - "годен до"
            - "пищевой продукт"
            - "продовольственный товар"
          context_patterns:
            - '(?i)срок.*годности.*истекает'
        conditional_checks:
          - trigger: "food_keywords"
            keywords: ["продукт", "пищевой", "еда", "напиток", "молочный", "мясной", "кондитерский"]
            rule: "expiration_date_required"
            severity: "critical"
    
    # Для предварительных заказов
    buyer_protection:
      - clause_id: "preorder_cancellation_right"
        name: "Право на отмену предварительного заказа"
        risk_if_missing: |
          При предварительном заказе товара покупатель может быть лишен права отказаться от заказа до его 
          исполнения, что противоречит природе розничной купли-продажи. Продавец может удерживать предоплату 
          безосновательно, если это право не оговорено.
        legal_base: "ст. 23.1 ЗоЗПП, ст. 487 ГК РФ"
        severity: "medium"
        affected_party: "buyer"
        detection:
          positive_keywords:
            - "предварительный заказ"
            - "предзаказ"
            - "отмена заказа"
            - "возврат предоплаты"
            - "до поступления товара"
          context_patterns:
            - '(?i)предзаказ.*может.*быть.*отменен'
        conditional_checks:
          - trigger: "preorder_keywords"
            keywords: ["предзаказ", "предварительный заказ", "ожидается поставка", "предоплата за предзаказ"]
            rule: "preorder_cancellation_right_required"
            severity: "medium"