type: contract_1.4
name: "Договор контрактации"
description: |
  Специализированный вид купли-продажи сельскохозяйственной продукции, регулируемый § 5 Главы 30 ГК РФ.
  Характеризуется особым субъектным составом (производитель-фермер vs заготовитель) и учетом
  зависимости производства от природных факторов и обстоятельств непреодолимой силы.
version: 2.0
parent: class_1_transfer_of_ownership
metadata:
  category: contract
  subcategory: ownership_transfer
  complexity: medium
  risk_level: medium
  legal_base: § 5 Главы 30 ГК РФ (ст. 535-538)

# ════════════════════════════════════════════════════════════
# БАЗОВАЯ ИНФОРМАЦИЯ (LEGACY SECTIONS)
# ════════════════════════════════════════════════════════════
rules:
  keywords:
    high:
      - "контрактаци"
      - "производител"
      - "заготовител"
      - "сельскохозяйственн продукци"
    medium:
      - "урожай"
      - "закупка"
      - "аграрный"
      - "фермер"
      - "сельхозпродукция"
    low:
      - "зерно"
      - "овощи"
      - "молоко"
      - "мясо"
  phrases:
    high:
      - Производитель обязуется произвести и сдать, а Заготовитель — принять и оплатить сельскохозяйственную продукцию
      - Стороны освобождаются от ответственности при наступлении обстоятельств непреодолимой силы
      - выращенная продукция
      - урожай
    medium:
      - неблагоприятные погодные условия
      - эпидемии
      - сельскохозяйственное производство
  patterns:
    required:
      - (?i)(контрактаци|производител.*сельскохозяйственн.*продукц|заготовител.*сельскохозяйственн.*продукц)  # → contract_1.4
    optional:
      - (?i)(урожай|зерно|овощ|молок|мяс|фермер)
  exclusions:
    - перепродажа
    - промышленные товары
    - для личных нужд
  weights:
    keyword_high: 3.0
    keyword_medium: 1.5
    keyword_low: 0.5
    phrase_high: 2.5
    phrase_medium: 1.0
    pattern_required: 4.0
    pattern_optional: 1.0
  classification:
    min_confidence: 0.70
    max_matches: 3

party_roles:
  - Производитель (Producer) — сельскохозяйственное предприятие или фермер, производящее продукцию
  - Заготовитель (Purchaser) — лицо, закупающее продукцию для последующей переработки или продажи

essential_terms:
  - Вид и количество сельскохозяйственной продукции
  - Сроки сдачи (поставки) продукции

specific_risks:
  - Невозможность исполнения из-за гибели урожая (риск лежит на производителе, если не форс-мажор)
  - Непринятие заготовителем продукции
  - Несвоевременная оплата
  - Сложность доказывания форс-мажорных обстоятельств

aliases:
  - Контрактация
  - Договор закупки сельхозпродукции
  - Договор на закупку сельскохозяйственной продукции

section_markers:
  - Предмет договора (вид, качество, количество продукции)
  - Обязанности заготовителя (принятие продукции, обеспечение тарой, расчет)
  - Обязанности производителя (сдача выращенной продукции)
  - Цена и порядок расчетов
  - Ответственность сторон
  - Обстоятельства непреодолимой силы (форс-мажор)

notes: |
  Специальный вид договора купли-продажи, учитывающий зависимость производства от природных факторов.
  Цель заготовителя — последующая перепродажа или переработка продукции.
  Производитель несет повышенную ответственность при отсутствии форс-мажорных обстоятельств.

# ════════════════════════════════════════════════════════════
# 🆕 ВАЛИДАЦИОННЫЕ СЕКЦИИ (VALIDATION ENGINE v2.0)
# (ДОБАВИТЬ В КОНЕЦ ФАЙЛА)
# ════════════════════════════════════════════════════════════

validation_metadata:
  validation_version: "2.0"
  last_updated: "2026-02-06"
  author: "Legal AI Team"
  
  # ──────────────────────────────────────────────────────────
  # СЕКЦИЯ 1: ПРИМЕНИМОЕ ЗАКОНОДАТЕЛЬСТВО
  # ──────────────────────────────────────────────────────────
  legal_base:
    primary:
      - "§ 5 Главы 30 ГК РФ (ст. 535-538)"
    secondary:
      - "ст. 506-524 ГК РФ (положения о договоре поставки, применяемые субсидиарно)"
      - "Федеральный закон от 29.12.2006 № 264-ФЗ «О развитии сельского хозяйства»"
      - "ст. 401 ГК РФ (ответственность за нарушение обязательств)"
    related:
      - "ст. 330-333 ГК РФ (неустойка)"
      - "ст. 15 ГК РФ (возмещение убытков)"
      - "ст. 450-451 ГК РФ (изменение и расторжение договора)"

  # ──────────────────────────────────────────────────────────
  # СЕКЦИЯ 2: ОБЯЗАТЕЛЬНЫЕ ЭЛЕМЕНТЫ ДОГОВОРА
  # ──────────────────────────────────────────────────────────
  essential_elements:
    - element: "parties"
      required: true
      legal_base: "ст. 432, 535 ГК РФ"
      validation_rules:
        - "presence_check"
        - "legal_capacity_indicators"
    
    - element: "subject"
      required: true
      legal_base: "ст. 535, 455 ГК РФ"
      description: "Сельскохозяйственная продукция, выращенная (произведенная) производителем"
      validation_rules:
        - "presence_check"
        - "definiteness_check"
      conditional_checks:
        - trigger: "agricultural_product_keywords"
          keywords: ["зерно", "овощи", "фрукты", "молоко", "мясо", "урожай", "сельхозкультуры"]
          rule: "product_specification_required"
          legal_base: "ст. 535 ГК РФ"
          severity: "high"
    
    - element: "price"
      required: true
      legal_base: "ст. 424, 485 ГК РФ"
      description: "Цена сельскохозяйственной продукции"
      validation_rules:
        - "presence_check"
        - "amount_specified"
    
    - element: "term"
      required: true
      legal_base: "ст. 536, 508 ГК РФ"
      description: "Срок сдачи (поставки) сельскохозяйственной продукции"
      validation_rules:
        - "presence_check"
        - "term_clarity_if_present"
      conditional_checks:
        - trigger: "seasonal_keywords"
          keywords: ["сезон", "урожай", "период сбора", "по мере созревания"]
          rule: "seasonal_schedule_required"
          legal_base: "ст. 536 ГК РФ"
          severity: "medium"

  # ──────────────────────────────────────────────────────────
  # СЕКЦИЯ 3: ЗАЩИТНЫЕ УСЛОВИЯ (PROTECTIVE CLAUSES)
  # ──────────────────────────────────────────────────────────
  protective_clauses:
    
    # --- ЗАЩИТА ПРОИЗВОДИТЕЛЯ (Producer Protection) ---
    producer_protection:
      - clause_id: "force_majeure_specific"
        name: "Специальная оговорка о форс-мажоре для сельского хозяйства"
        risk_if_missing: |
          Без детализированного перечня сельскохозяйственных форс-мажорных обстоятельств
          производитель может нести ответственность за неисполнение обязательств по причинам,
          не зависящим от его воли (неблагоприятные погодные условия, засуха, наводнения,
          эпидемии, нашествия вредителей).
        legal_base: "ст. 401, 416, 538 ГК РФ"
        severity: "critical"
        affected_party: "producer"
        detection:
          positive_keywords:
            - "неблагоприятные погодные условия"
            - "засуха"
            - "наводнение"
            - "заморозки"
            - "град"
            - "эпидемии"
            - "нашествие вредителей"
            - "стихийные бедствия"
            - "сельскохозяйственный форс-мажор"
          context_patterns:
            - '(?i)производитель.*освобождается.*ответственности.*при.*наступлении'
            - '(?i)неблагоприятные.*погодные.*условия.*являются.*форс.*мажором'
      
      - clause_id: "obligation_to_accept"
        name: "Обязанность заготовителя принять выращенную продукцию"
        risk_if_missing: |
          Без четкого условия об обязанности заготовителя принять выращенную продукцию
          производитель может столкнуться с отказом от приемки, что приведет к убыткам
          от порчи продукции и невозможности ее реализации другим покупателям.
        legal_base: "ст. 536 ГК РФ"
        severity: "high"
        affected_party: "producer"
        detection:
          positive_keywords:
            - "обязан принять продукцию"
            - "обязанность заготовителя принять"
            - "не вправе отказаться от приемки"
            - "принять выращенную продукцию"
            - "сдать продукцию заготовителю"
          context_patterns:
            - '(?i)заготовитель.*обязан.*принять.*продукцию.*произведенную'
      
      - clause_id: "advance_payment_producer"
        name: "Авансирование производителя заготовителем"
        risk_if_missing: |
          Без условия об авансировании или предоплате производитель несет все расходы
          по производству сельскохозяйственной продукции. Авансирование снижает
          финансовые риски производителя и обеспечивает его ресурсами для производства.
        legal_base: "ст. 536, 487 ГК РФ"
        severity: "medium"
        affected_party: "producer"
        detection:
          positive_keywords:
            - "авансирование производителя"
            - "предварительная оплата"
            - "авансовый платеж"
            - "финансирование производства"
            - "частичная предоплата"
          context_patterns:
            - '(?i)заготовитель.*обязуется.*авансировать.*производителя'
    
    # --- ЗАЩИТА ЗАГОТОВИТЕЛЯ (Purchaser Protection) ---
    purchaser_protection:
      - clause_id: "product_quality_requirements"
        name: "Требования к качеству сельскохозяйственной продукции"
        risk_if_missing: |
          Без четких требований к качеству продукции заготовитель может получить
          продукцию, не соответствующую стандартам для последующей переработки или продажи.
          Отсутствие стандартов качества затрудняет отказ от приемки некачественной продукции.
        legal_base: "ст. 469, 536 ГК РФ"
        severity: "high"
        affected_party: "purchaser"
        detection:
          positive_keywords:
            - "качество продукции"
            - "требования к качеству"
            - "стандарты качества"
            - "соответствие ГОСТ"
            - "технические условия"
            - "параметры качества"
          context_patterns:
            - '(?i)продукция.*должна.*соответствовать.*требованиям.*качества'
      
      - clause_id: "delivery_schedule"
        name: "График сдачи (поставки) сельскохозяйственной продукции"
        risk_if_missing: |
          Без графика сдачи продукции заготовитель не сможет планировать логистику,
          хранение и переработку продукции. Неравномерная сдача может привести
          к простоям перерабатывающих мощностей или, наоборот, их перегрузке.
        legal_base: "ст. 508, 536 ГК РФ"
        severity: "medium"
        affected_party: "purchaser"
        detection:
          positive_keywords:
            - "график сдачи"
            - "график поставки"
            - "периоды сдачи"
            - "сроки сдачи по периодам"
            - "календарный план поставок"
          context_patterns:
            - '(?i)продукция.*сдается.*по.*графику.*приложенному'
      
      - clause_id: "penalty_for_non_delivery"
        name: "Неустойка за недопоставку или несвоевременную сдачу продукции"
        risk_if_missing: |
          Без договорной неустойки за недопоставку заготовитель сможет взыскать
          только убытки, доказывание которых в сельском хозяйстве затруднено.
          Неустойка стимулирует производителя к своевременной сдаче продукции.
        legal_base: "ст. 330, 521 ГК РФ"
        severity: "medium"
        affected_party: "purchaser"
        detection:
          positive_keywords:
            - "неустойка за недопоставку"
            - "пеня за просрочку сдачи"
            - "штраф за нарушение сроков"
            - "ответственность за недопоставку"
            - "0,1% от стоимости"
          context_patterns:
            - '(?i)за.*недопоставку.*продукции.*уплачивается.*неустойка'

  # ──────────────────────────────────────────────────────────
  # СЕКЦИЯ 4: ДОПОЛНИТЕЛЬНЫЕ PROTECTIVE CLAUSES
  # ──────────────────────────────────────────────────────────
  additional_protective_clauses:
    
    # Для многолетних насаждений и многолетних культур
    producer_protection:
      - clause_id: "long_term_crops_protection"
        name: "Особые условия для многолетних культур и насаждений"
        risk_if_missing: |
          Для многолетних культур (плодовые деревья, виноградники, многолетние травы)
          отсутствие особых условий о распределении рисков гибели насаждений может
          привести к существенным убыткам производителя при форс-мажорных обстоятельствах.
        legal_base: "ст. 538 ГК РФ"
        severity: "high"
        affected_party: "producer"
        detection:
          positive_keywords:
            - "многолетние насаждения"
            - "плодовые деревья"
            - "виноградники"
            - "многолетние культуры"
            - "многолетние травы"
            - "гибель насаждений"
          context_patterns:
            - '(?i)многолетн.*насажден.*гибель.*насажден.*освобождает'
        conditional_checks:
          - trigger: "perennial_crops_keywords"
            keywords: ["многолетний", "дерево", "кустарник", "виноград", "сад", "плантация"]
            rule: "long_term_crops_clause_required"
            severity: "medium"
    
    # Для обеспечения производственного процесса
    purchaser_protection:
      - clause_id: "production_support_obligations"
        name: "Обязанности заготовителя по обеспечению производства"
        risk_if_missing: |
          Без условий об обязанности заготовителя предоставлять семенной материал,
          удобрения, средства защиты растений или технику производитель может
          нести повышенные расходы, что снижает рентабельность производства.
        legal_base: "ст. 536 ГК РФ"
        severity: "medium"
        affected_party: "purchaser"
        detection:
          positive_keywords:
            - "предоставление семян"
            - "обеспечение удобрениями"
            - "средства защиты растений"
            - "предоставление техники"
            - "агрономическое сопровождение"
            - "обеспечение производственного процесса"
          context_patterns:
            - '(?i)заготовитель.*обязуется.*предоставить.*семен.*материал'
        conditional_checks:
          - trigger: "production_support_keywords"
            keywords: ["семена", "удобрения", "пестициды", "техника", "агроном"]
            rule: "production_support_clause_recommended"
            severity: "low"
    
    # Для страхования урожая
    producer_protection:
      - clause_id: "crop_insurance_obligation"
        name: "Обязанность страхования урожая"
        risk_if_missing: |
          Без условия о страховании урожая производитель несет все риски гибели
          продукции. Страхование урожая распределяет риски между сторонами и
          обеспечивает финансовую защиту при наступлении страхового случая.
        legal_base: "ст. 927-970 ГК РФ (договор страхования)"
        severity: "medium"
        affected_party: "producer"
        detection:
          positive_keywords:
            - "страхование урожая"
            - "страхование сельскохозяйственных рисков"
            - "страховой полис"
            - "страховая сумма"
            - "страховой случай"
          context_patterns:
            - '(?i)производитель.*обязуется.*застраховать.*урожай'
        conditional_checks:
          - trigger: "high_value_crops_keywords"
            keywords: ["дорогостоящие культуры", "элитные семена", "ценные сорта"]
            rule: "insurance_clause_recommended"
            severity: "high"