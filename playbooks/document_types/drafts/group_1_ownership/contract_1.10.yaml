type: contract_1.10
name: "Договор цессии (уступки права требования)"
description: |
  Договор, по которому первоначальный кредитор (Цедент) передает новому кредитору (Цессионарию) право требовать исполнения обязательства от Должника.
  Один из самых "судебных" договоров с колоссальными рисками: от продажи "воздуха" (несуществующего долга) до двойной продажи одного и того же права.
  Ключевые особенности: необходимость точной индивидуализации требования, обязательное уведомление должника, различие между действительностью
  и исполнимостью требования. Регулируется Главой 24 ГК РФ.
version: 2.0
parent: class_2_modification_of_obligations
sibling_contracts:
  - contract_1.1  # Цессия может быть возмездной (купля-продажа права)
  - contract_1.8  # Цессия может быть безвозмездной (дарение права)
  - contract_2.4  # Факторинг (финансирование под уступку)
metadata:
  category: contract
  subcategory: obligation_modification
  complexity: high  # Сложная идентификация предмета, риск неопределенности
  risk_level: high  # Риск покупки "пустышки", признания незаключенным
  legal_base: Глава 24 ГК РФ (ст. 382-390)
  hierarchy_position: "child_specialized"

# ════════════════════════════════════════════════════════════
# БАЗОВАЯ ИНФОРМАЦИЯ (LEGACY SECTIONS)
# ════════════════════════════════════════════════════════════
rules:
  keywords:
    high:
      - "цесси"
      - "уступк прав требовани"
      - "цедент"
      - "цессионари"
      - "прав требовани"
      - "переход прав кредитор"
      - "уведомлени должник"
      - "делькредере"
    medium:
      - "договор-основание"
      - "дебиторская задолженность"
      - "объем передаваемых прав"
      - "гарантии цедента"
      - "действительность требования"
      - "продажа долга"
    low:
      - "должник"
      - "акт сверки"
      - "решение суда"
      - "регрессное требование"
      - "обеспечительные права"
      - "будущее требование"
  phrases:
    high:
      - Цедент уступает, а Цессионарий принимает право требования
      - Право требования к Должнику по Договору № ___ от ___
      - Цедент гарантирует действительность уступаемого права
      - Уведомление должника осуществляется в течение ___ дней
      - Право переходит в полном объеме со всеми обеспечивающими его правами
    medium:
      - Право переходит в том объеме и на тех условиях, которые существовали к моменту уступки
      - Цедент не отвечает за платежеспособность Должника, если иное не предусмотрено договором
      - Передача оригиналов документов, подтверждающих право требования
      - Стоимость уступки составляет ___ рублей
  patterns:
    required:
      - (?i)(цесси[яи]|уступк[аи].*прав[аи].*требовани|передач[аеи].*прав[аи].*требовани|цедент.*цессионар) # → contract_1.10
    optional:
      - (?i)(цедент|цессионарий|уведомлени[ея]\\s+должника|гаранти[ия]\\s+цедента)
  exclusions:
    - факторинг (финансирование под уступку)
    - перевод долга (смена должника)
    - инкассо-цессия (уступка для взыскания)
    - новация (прекращение обязательства)
  exclusion_logic:
    - condition: "financing_keywords AND factoring_indicators"
      target: "reclassify"
      confidence: 0.90
      description: "Наличие финансирования, фактора, лимита финансирования указывает на факторинг (Глава 43 ГК РФ)"
    - condition: "debtor_change_keywords AND creditor_consent"
      target: "reclassify"
      confidence: 0.85
      description: "Изменение должника при сохранении кредитора - это перевод долга (ст. 391 ГК РФ)"
  weights:
    keyword_high: 3.5
    keyword_medium: 1.5
    keyword_low: 0.5
    phrase_high: 4.0
    phrase_medium: 1.5
    pattern_required: 5.0
    pattern_optional: 1.0
  classification:
    min_confidence: 0.85  # Высокий порог для специфичного договора
    max_matches: 1

party_roles:
  - Цедент (Assignor) — первоначальный кредитор, передающий право требования
  - Цессионарий (Assignee) — новый кредитор, приобретающий право требования
  - Должник (Debtor) — третье лицо, обязанное по переданному требованию (не сторона договора, но критически важный участник)

essential_terms:
  - Конкретное обязательство, из которого возникло право (договор №, дата, накладная, расписка - "по расписке от 01.01.2023 на 100 руб.")
  - Идентификация Должника (ФИО/наименование, реквизиты)
  - Цена уступки для возмездной цессии (может отличаться от номинала долга, дисконт)

specific_risks:
  - Признание договора незаключенным из-за неопределенности предмета ("Продаю долг Иванова" - ничтожно)
  - Недействительность уступаемого требования (долг уже погашен или никогда не существовал - "воздух")
  - Исполнение Должником прежнему кредитору из-за неуведомления об уступке
  - Двойная уступка одного и того же права разным цессионариям
  - Наличие запрета уступки в основном договоре с Должником
  - Риск неплатежеспособности Должника (цедент не отвечает, если не принял поручительство)

aliases:
  - Договор уступки права требования
  - Соглашение об уступке права требования
  - Договор продажи долга
  - Цессионный договор
  - Assignment Agreement

section_markers:
  - Предмет договора (детальная идентификация уступаемого права)
  - Права и обязанности сторон
  - Цена уступки и порядок расчетов
  - Гарантии Цедента (действительность, отсутствие предыдущих уступок)
  - Передача документов, подтверждающих право требования
  - Порядок уведомления Должника
  - Ответственность сторон (включая делькредере - ответственность за исполнение)
  - Переход обеспечительных прав (залог, поручительство)
  - Порядок разрешения споров
  - Заключительные положения

notes: |
  КРИТИЧЕСКИЕ ТРЕБОВАНИЯ И ОСОБЕННОСТИ ДОГОВОРА ЦЕССИИ:
  1. Индивидуализация требования: должно быть точно определено, какой именно долг передается (Основание + Должник + Сумма + Период)
  2. Уведомление Должника обязательно (ст. 385 ГК РФ): пока Должник не уведомлен, он вправе платить Цеденту
  3. Цедент отвечает за ДЕЙСТВИТЕЛЬНОСТЬ требования (существование), но не за ИСПОЛНИМОСТЬ (платежеспособность Должника), если не принял поручительство
  4. По умолчанию переходят все права (проценты, неустойка, залог, поручительство) - ст. 384 ГК РФ
  5. Уступка будущего права возможна (ст. 388.1 ГК РФ), но требует детального описания критериев возникновения
  6. Право переходит в момент заключения договора, если иное не предусмотрено (ст. 389.1 ГК РФ)

# ════════════════════════════════════════════════════════════
# 🆕 ВАЛИДАЦИОННЫЕ СЕКЦИИ (VALIDATION ENGINE v2.0)
# ════════════════════════════════════════════════════════════

validation_metadata:
  validation_version: "2.0"
  last_updated: "2026-02-06"
  author: "Legal AI Team"
  
  # ──────────────────────────────────────────────────────────
  # СЕКЦИЯ 1: ПРИМЕНИМОЕ ЗАКОНОДАТЕЛЬСТВО
  # ──────────────────────────────────────────────────────────
  legal_base:
    primary:
      - "Глава 24 ГК РФ (ст. 382-390)"
    secondary:
      - "ст. 384 ГК РФ (объем передаваемых прав)"
      - "ст. 385 ГК РФ (права и обязанности цедента, уведомление должника)"
      - "ст. 388 ГК РФ (условия допустимости уступки)"
      - "ст. 390 ГК РФ (ответственность цедента)"
    related:
      - "Постановление Пленума ВС РФ № 54 от 21.12.2017 «О некоторых вопросах применения положений главы 24 ГК РФ»"
      - "Глава 43 ГК РФ (факторинг - финансирование под уступку денежного требования)"
      - "ст. 391 ГК РФ (перевод долга - для отличия)"
      - "ФЗ-229 «Об исполнительном производстве» (уступка взыскателем исполнительного документа)"
      - "НК РФ ст. 279 (налогообложение уступки права требования)"

  # ──────────────────────────────────────────────────────────
  # СЕКЦИЯ 2: ОБЯЗАТЕЛЬНЫЕ ЭЛЕМЕНТЫ ДОГОВОРА
  # ──────────────────────────────────────────────────────────
  essential_elements:
    - element: "claim_identification"
      name: "Идентификация уступаемого права требования"
      required: true
      legal_base: "ст. 382, 432 ГК РФ"
      description: |
        Требование должно быть определено так, чтобы его нельзя было спутать ни с чем другим.
        Формула: Основание возникновения (договор №, дата, расписка) + Должник (ФИО/наименование) + Сумма + Срок исполнения.
        Пример правильной идентификации: "право требования к Иванову И.И. по расписке от 01.01.2023 на сумму 100 000 рублей".
      validation_rules:
        - "debtor_clearly_identified"
        - "claim_basis_specified"
        - "claim_amount_specified"
      conditional_checks:
        - trigger: "assignment_keywords"
          keywords: ["цессия", "уступка права", "передача права требования"]
          rule: "claim_specificity_required"
          legal_base: "ст. 432 ГК РФ"
          severity: "critical"
          risk_msg: "Неопределенность предмета ('Продаю долг Иванова') делает договор незаключенным. Нужно: 'Продаю долг Иванова по расписке от 01.01.2023 на 100 руб.'"
    
    - element: "assignment_consideration"
      name: "Цена уступки для возмездной цессии"
      required: false
      legal_base: "ст. 424, 575, 384.1 ГК РФ"
      description: |
        Для возмездной уступки цена является существенным условием. Цена может отличаться от номинала долга (дисконт).
        Безвозмездная уступка между коммерческими организациями ограничена (ст. 575 ГК РФ - как дарение).
      validation_rules:
        - "price_specified_if_compensated"
      conditional_checks:
        - trigger: "commercial_parties_both"
          keywords: ["ООО", "АО", "ЗАО", "ИП", "коммерческая организация", "юридическое лицо"]
          rule: "compensation_check_required"
          legal_base: "ст. 575 ГК РФ"
          severity: "high"
          risk_msg: "Безвозмездная уступка между коммерческими организациями возможна только как обычный подарок стоимостью до 3000 рублей"
    
    - element: "debtor_notification_procedure"
      name: "Порядок уведомления Должника"
      required: true
      legal_base: "ст. 385 ГК РФ"
      description: |
        Должник должен быть письменно уведомлен об уступке. До уведомления исполнение Цеденту считается надлежащим.
        Договор должен определять: кто уведомляет (Цедент/Цессионарий), срок уведомления, способ (заказное письмо, курьер).
      validation_rules:
        - "notification_procedure_specified"
        - "notification_responsibility_clear"
      conditional_checks:
        - trigger: "assignment_to_third_party"
          rule: "debtor_notification_clause_required"
          legal_base: "ст. 385 ГК РФ"
          severity: "critical"
          risk_msg: "Без уведомления Должник может заплатить Цеденту, и долг погасится. Цессионарий останется ни с чем."

  # ──────────────────────────────────────────────────────────
  # СЕКЦИЯ 3: ЗАЩИТНЫЕ УСЛОВИЯ (PROTECTIVE CLAUSES)
  # ──────────────────────────────────────────────────────────
  protective_clauses:
    
    # --- ЗАЩИТА ЦЕССИОНАРИЯ (Assignee Protection) ---
    buyer_protection:
      - clause_id: "cedent_warranties_validity_existence"
        name: "Гарантии Цедента о действительности и существовании требования"
        risk_if_missing: |
          Без явных гарантий Цессионарий принимает на себя риск недействительности, несуществования
          или погашения требования. Цедент может передать "воздух" - долг, который уже погашен или никогда не существовал.
          Цессионарий останется без возможности взыскания с Должника и без регресса к Цеденту.
        legal_base: "ст. 390 ГК РФ"
        severity: "critical"
        affected_party: "buyer"
        detection:
          positive_keywords:
            - "цедент гарантирует действительность"
            - "право требования существует на момент уступки"
            - "долг не погашен"
            - "требование не прекращено"
            - "цедент отвечает за недействительность требования"
            - "право требования принадлежит цеденту"
            - "отсутствуют основания для оспаривания"
            - "цедент подтверждает существование долга"
            - "требование не было уступлено ранее"
            - "цедент несет ответственность за пороки права"
          context_patterns:
            - '(?i)цедент.*гарантирует.*что.*передаваемое.*право.*требования.*является.*действительным.*и.*существующим'
            - '(?i)цедент.*несет.*ответственность.*за.*недействительность.*или.*отсутствие.*переданного.*требования'
      
      - clause_id: "documents_transfer_and_authenticity"
        name: "Передача документов, подтверждающих право требования"
        risk_if_missing: |
          Без оригиналов договоров, актов, расписок, решений суда Цессионарий не сможет доказать
          существование долга в суде или при взыскании. Цедент обязан передать все документы,
          но без конкретного перечня и сроков может затягивать передачу или передать неполный комплект.
        legal_base: "ст. 385 ГК РФ"
        severity: "critical"
        affected_party: "buyer"
        detection:
          positive_keywords:
            - "передать документы"
            - "оригиналы договоров"
            - "акты приема-передачи"
            - "расписки"
            - "решения суда"
            - "исполнительные листы"
            - "перечень передаваемых документов"
            - "в течение ___ рабочих дней"
            - "цедент обязуется передать"
            - "подлинники документов"
            - "акт сверки с должником"
          context_patterns:
            - '(?i)цедент.*обязуется.*передать.*цессионарию.*следующие.*документы'
            - '(?i)передача.*документов.*оформляется.*актом.*приема.*передачи'
      
      - clause_id: "transfer_of_accessory_rights"
        name: "Переход обеспечительных и дополнительных прав"
        risk_if_missing: |
          По умолчанию вместе с правом требования переходят все обеспечивающие его права: залог,
          поручительство, неустойка, проценты (ст. 384 ГК РФ). Однако без явного указания
          и передачи документов по обеспечению Цессионарий может получить "голое" требование
          без реальных возможностей взыскания.
        legal_base: "ст. 384 п. 2, 387 ГК РФ"
        severity: "high"
        affected_party: "buyer"
        detection:
          positive_keywords:
            - "переход обеспечительных прав"
            - "права из договора залога"
            - "передача прав по поручительству"
            - "право на неустойку"
            - "проценты за пользование"
            - "право требования переходит в полном объеме"
            - "все дополнительные права"
            - "цедент передает права обеспечения"
            - "документы по залогу"
            - "права из обеспечительных сделок"
          context_patterns:
            - '(?i)вместе.*с.*правом.*требования.*переходят.*все.*права.*обеспечивающие.*его.*исполнение'
            - '(?i)цедент.*обязуется.*передать.*цессионарию.*права.*из.*договоров.*залога.*и.*поручительства'

    # --- ЗАЩИТА ЦЕДЕНТА (Cedent Protection) ---
    seller_protection:
      - clause_id: "limitation_of_liability_for_solvency"
        name: "Ограничение ответственности за платежеспособность Должника"
        risk_if_missing: |
          Цедент отвечает за ДЕЙСТВИТЕЛЬНОСТЬ требования, но НЕ отвечает за ИСПОЛНИМОСТЬ
          (платежеспособность Должника), если не принял на себя поручительство (ст. 390 ГК РФ).
          Без явного ограничения Цессионарий может пытаться взыскать с Цедента, если Должник окажется банкротом.
        legal_base: "ст. 390 ГК РФ"
        severity: "high"
        affected_party: "seller"
        detection:
          positive_keywords:
            - "цедент не отвечает за платежеспособность"
            - "не несет ответственности за неисполнение Должником"
            - "кроме случая принятия поручительства"
            - "цедент не гарантирует исполнение требования"
            - "цессионарий принимает на себя кредитный риск"
            - "ответственность только за действительность"
            - "отказ от гарантий исполнимости"
            - "риск неплатежа лежит на цессионарии"
          context_patterns:
            - '(?i)цедент.*не.*несет.*ответственности.*за.*неисполнение.*требования.*должником'
            - '(?i)цессионарий.*принимает.*на.*себя.*риск.*неплатежеспособности.*должника'
      
      - clause_id: "final_settlement_no_recourse"
        name: "Окончательность расчета и отсутствие регресса"
        risk_if_missing: |
          При отсутствии условия об окончательности расчета Цедент может столкнуться с регрессными
          требованиями Цессионария даже после полной оплаты. Особенно важно при уступке
          по дисконтированной стоимости или при последующем улучшении финансового состояния Должника.
        legal_base: "ст. 390 ГК РФ"
        severity: "medium"
        affected_party: "seller"
        detection:
          positive_keywords:
            - "расчеты являются окончательными"
            - "отсутствие регрессных требований"
            - "без права обратного требования"
            - "уплаченная сумма не подлежит возврату"
            - "прекращение обязательств цедента"
            - "цедент не имеет дополнительных обязательств"
            - "после передачи права обязательства цедента прекращаются"
          context_patterns:
            - '(?i)расчеты.*по.*договору.*являются.*окончательными.*и.*не.*подлежат.*пересмотру'
            - '(?i)после.*исполнения.*обязательств.*по.*передаче.*права.*обязательства.*цедента.*прекращаются'

  # ──────────────────────────────────────────────────────────
  # СЕКЦИЯ 4: ДОПОЛНИТЕЛЬНЫЕ PROTECTIVE CLAUSES
  # ──────────────────────────────────────────────────────────
  additional_protective_clauses:
    
    # Защита от запрета уступки в основном договоре
    buyer_protection:
      - clause_id: "prohibition_of_assignment_verification"
        name: "Проверка отсутствия запрета уступки в основном обязательстве"
        risk_if_missing: |
          Если основной договор с Должником содержит запрет на уступку права требования,
          уступка является недействительной (ст. 388 ГК РФ). Цессионарий рискует получить
          ничтожное требование без возможности взыскания. Особенно часто в кредитных договорах.
        legal_base: "ст. 388 ГК РФ"
        severity: "critical"
        affected_party: "buyer"
        detection:
          positive_keywords:
            - "отсутствие запрета на уступку"
            - "цедент подтверждает допустимость уступки"
            - "основной договор разрешает уступку"
            - "получено согласие Должника на уступку"
            - "уступка не противоречит условиям основного договора"
            - "цедент гарантирует отсутствие ограничений"
            - "основное обязательство не содержит запрета"
          negative_keywords:
            - "запрещена уступка"
            - "требуется согласие Должника"
            - "уступка не допускается"
          context_patterns:
            - '(?i)цедент.*подтверждает.*что.*уступка.*не.*запрещена.*основным.*договором.*с.*должником'
            - '(?i)основное.*обязательство.*не.*содержит.*ограничений.*на.*уступку.*права.*требования'
    
    # Защита от двойной уступки
    buyer_protection:
      - clause_id: "protection_against_double_assignment"
        name: "Защита от двойной уступки одного требования"
        risk_if_missing: |
          Цедент может уступить одно и то же требование нескольким Цессионариям.
          Приоритет определяется моментом уведомления Должника (ст. 388.1 ГК РФ).
          Отсутствие гарантий и механизмов проверки создает риск конфликта с другими приобретателями.
        legal_base: "ст. 388.1 ГК РФ"
        severity: "critical"
        affected_party: "buyer"
        detection:
          positive_keywords:
            - "требование не уступалось ранее"
            - "цедент гарантирует отсутствие предыдущих уступок"
            - "первичность уступки по данному договору"
            - "отсутствие прав третьих лиц на требование"
            - "цедент подтверждает исключительность передачи"
            - "право требования не обременено"
            - "цедент обязуется не уступать требование другим лицам"
            - "отсутствие конкурирующих прав"
          context_patterns:
            - '(?i)цедент.*гарантирует.*что.*право.*требования.*не.*было.*уступлено.*ранее'
            - '(?i)на.*момент.*заключения.*договора.*требование.*не.*обременено.*правами.*третьих.*лиц'
    
    # Условия для уступки будущих требований
    buyer_protection:
      - clause_id: "future_claims_assignment_conditions"
        name: "Условия уступки будущих требований"
        risk_if_missing: |
          Уступка будущих требований допустима (ст. 388.2 ГК РФ), но требует специальных условий
          об их индивидуализации. Без четких критериев (какие именно требования, из каких договоров,
          за какой период) договор может быть признан незаключенным.
        legal_base: "ст. 388.2 ГК РФ"
        severity: "high"
        affected_party: "buyer"
        detection:
          positive_keywords:
            - "будущие требования"
            - "права, которые возникнут"
            - "критерии определения будущих требований"
            - "период возникновения будущих требований"
            - "определение будущего Должника"
            - "основание будущих требований"
            - "уступка требований, которые будут заключены"
            - "описание будущих правоотношений"
            - "будущие денежные требования"
          context_patterns:
            - '(?i)уступаются.*права.*требования.*которые.*возникнут.*из.*договоров.*заключенных.*в.*период'
            - '(?i)будущие.*требования.*определяются.*по.*следующим.*критериям'
        conditional_checks:
          - trigger: "future_claims_keywords"
            keywords: ["будут возникать", "в будущем", "после заключения", "которые появятся", "ожидаемые требования"]
            rule: "future_claims_specification_required"
            severity: "high"
    
    # Ответственность за исполнение (делькредере)
    buyer_protection:
      - clause_id: "del_credere_responsibility_explicit"
        name: "Ответственность Цедента за исполнение Должником (делькредере)"
        risk_if_missing: |
          По умолчанию Цедент не отвечает за неисполнение требования Должником.
          Если стороны хотят иного (Цедент принимает на себя риск неплатежа),
          это должно быть явно оговорено. Особенно важно при уступке сомнительных долгов.
        legal_base: "ст. 390 ГК РФ"
        severity: "high"
        affected_party: "buyer"
        detection:
          positive_keywords:
            - "делькредере"
            - "цедент отвечает за исполнение Должником"
            - "гарантия платежеспособности Должника"
            - "цедент принимает на себя риск неплатежа"
            - "ответственность за неисполнение требования"
            - "обязанность возмещения при неплатеже"
            - "цедент выступает поручителем"
            - "гарантия возврата уплаченного"
          context_patterns:
            - '(?i)цедент.*несет.*ответственность.*за.*исполнение.*должником.*переданного.*требования'
            - '(?i)в.*случае.*неисполнения.*должником.*цедент.*обязан.*возместить.*цессионарию.*уплаченную.*сумму'
    
    # Уступка в рамках исполнительного производства
    buyer_protection:
      - clause_id: "enforcement_proceedings_specifics"
        name: "Особенности уступки требования в рамках исполнительного производства"
        risk_if_missing: |
          Уступка взыскателем исполнительного документа имеет особенности: необходимо уведомление
          судебного пристава-исполнителя, изменение взыскателя в исполнительном производстве.
          Несоблюдение этих правил делает взыскание невозможным.
        legal_base: "ФЗ-229 «Об исполнительном производстве» ст. 52"
        severity: "critical"
        affected_party: "buyer"
        detection:
          positive_keywords:
            - "исполнительный документ"
            - "исполнительное производство"
            - "судебный пристав-исполнитель"
            - "изменение взыскателя"
            - "уведомление пристава"
            - "исполнительный лист"
            - "цессия взыскателем"
            - "права из исполнительного документа"
          context_patterns:
            - '(?i)цедент.*обязуется.*уведомить.*судебного.*пристава.*исполнителя.*об.*уступке'
            - '(?i)уступка.*права.*требования.*по.*исполнительному.*документу'
        conditional_checks:
          - trigger: "enforcement_keywords"
            keywords: ["исполнительный лист", "пристав", "исполнительное производство", "взыскание"]
            rule: "enforcement_specific_clauses_required"
            severity: "critical"
