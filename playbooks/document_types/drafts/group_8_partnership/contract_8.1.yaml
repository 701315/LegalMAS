type: contract_8.1
name: Договор простого товарищества (о совместной деятельности)
description: |
  Договор, по которому двое или несколько лиц (товарищей) обязуются соединить свои вклады
  и совместно действовать без образования юридического лица для извлечения прибыли или
  достижения иной не противоречащей закону цели. Вклады могут быть денежными, имущественными,
  в виде профессиональных знаний, навыков, деловой репутации, деловых связей.
  Имущество товарищей — общая долевая собственность. Если договор связан с предпринимательской
  деятельностью и хотя бы один товарищ является предпринимателем — все товарищи несут
  солидарную ответственность по общим обязательствам. Ведение общих дел может быть возложено
  на одного или нескольких товарищей. Регулируется Главой 55 ГК РФ (ст. 1041–1054). Гибкая
  форма кооперации без государственной регистрации, но с высокими рисками личной ответственности.
version: 2.0
parent: class_8_partnership
metadata:
  category: contract
  subcategory: partnership
  complexity: high
  risk_level: high
  legal_base: "Глава 55 ГК РФ (ст. 1041–1054)"

