rules:
  keywords:
    high:
      - "простое товарищество"
      - "совместная деятельность"
      - "товарищ"
      - "соединение вкладов"
      - "общая цель"
      - "без образования юридического лица"
      - "ведение общих дел"
      - "общее имущество товарищей"
      - "солидарная ответственность"
    medium:
      - "вклад товарища"
      - "распределение прибыли"
      - "распределение убытков"
      - "долевая собственность"
      - "товарищ ведущий дела"
      - "выход из товарищества"
      - "негласное товарищество"
    low:
      - "инвестиционное товарищество"
      - "общие расходы"
      - "раздел имущества"
      - "внутренняя отчетность"
      - "deadlock"
  phrases:
    high:
      - Товарищи обязуются путём соединения вкладов совместно действовать для достижения общей цели
      - совместная деятельность без образования юридического лица
      - Ведение общих дел товарищей возлагается на
      - Прибыль распределяется между товарищами пропорционально стоимости вкладов
      - имущество является общей долевой собственностью товарищей
      - товарищи несут солидарную ответственность по общим обязательствам
    medium:
      - вклад товарища оценивается в сумме
      - товарищ, ведущий общие дела, действует на основании доверенности
      - расходы и убытки покрываются за счёт общего имущества
      - решения по общим делам принимаются единогласно/большинством
      - при выходе товарища ему возвращается его доля
      - каждый товарищ вправе знакомиться со всей документацией
  patterns:
    required:
      - (?i)(прост\w+\s+товарищест|совместн\w+\s+деятельност|товарищ\w*|соединени\w+\s+вклад|общ\w+\s+цел)
    optional:
      - (?i)(без\s+образования\s+юридического\s+лица|ведение\s+общих\s+дел|общ\w+\s+долев\w+\s+собственност)
      - (?i)(распределени\w+\s+прибыл|солидарн\w+\s+ответственност|негласн\w+\s+товарищест|тупиков\w+\s+ситуаци)
  exclusions:
    - создание юридического лица (ООО, АО, товарищество на вере)
    - учредительный договор
    - трудовые отношения
    - агентский договор
    - договор инвестиционного товарищества (ФЗ-335)
  exclusion_logic:
    - condition: "legal_entity_creation AND registration_required"
      target: "rejection"
      confidence: 0.90
      description: "Если создаётся юридическое лицо — это не простое товарищество"
    - condition: "investment_partnership_keywords AND special_regime"
      target: "rejection"
      confidence: 0.80
      description: "Если присутствуют элементы инвестиционного товарищества (ФЗ-335) — это отдельный тип договора"
  weights:
    keyword_high: 3.0
    keyword_medium: 1.5
    keyword_low: 0.5
    phrase_high: 2.5
    phrase_medium: 1.0
    pattern_required: 4.0
    pattern_optional: 1.0
  classification:
    min_confidence: 0.75
    max_matches: 3

party_roles:
  - "Товарищ 1 (участник совместной деятельности)"
  - "Товарищ 2 (участник совместной деятельности)"
  - "... (другие товарищи — участники)"
  - "Товарищ, ведущий общие дела (ведущий дела, управляющий товарищ)"

essential_terms:
  - "Соединение вкладов — состав, размер, денежная оценка вкладов каждого товарища"
  - "Цель совместной деятельности — общая цель, ради которой создаётся товарищество"
  - "Порядок ведения общих дел — кто ведёт дела, как принимаются решения, пределы полномочий"
  - "Порядок распределения прибыли и покрытия убытков"

specific_risks:
  - "Солидарная ответственность: если хотя бы один товарищ — предприниматель, все отвечают солидарно всем личным имуществом по общим обязательствам (ст. 1047 ГК РФ)"
  - "Риск утраты личного имущества товарищей для покрытия долгов товарищества"
  - "Конфликты из-за нечёткого распределения полномочий и порядка принятия решений, риск deadlock (тупиковой ситуации)"
  - "Выход товарища с требованием раздела имущества — может парализовать деятельность"
  - "Смерть/ликвидация товарища прекращает договор (если не предусмотрено иное)"
  - "Налоговые сложности: каждый товарищ учитывает свою долю прибыли/расходов, риск расхождений в учете и двойного налогообложения"
  - "Риск злоупотребления полномочиями товарищем, ведущим дела, и сокрытия информации"
  - "Риск переквалификации в трудовые отношения или признания фактического создания юрлица"
  - "Негласное товарищество: товарищ, заключивший сделку, отвечает единолично (ст. 1054 ГК РФ)"

aliases:
  - Простое товарищество
  - Договор о совместной деятельности
  - Партнёрское соглашение
  - Договор простого товарищества
  - Consortium agreement (без образования юрлица)
  - Joint Venture Agreement (в значении договора о сотрудничестве)

section_markers:
  - Предмет договора (цель совместной деятельности)
  - Вклады товарищей (размер, состав, оценка, сроки внесения)
  - Общее имущество товарищей (режим собственности, учёт)
  - Порядок ведения общих дел (полномочия, доверенности, лимиты)
  - Порядок принятия решений (единогласие, большинство, компетенция, deadlock)
  - Права и обязанности товарищей
  - Отчётность и право на информацию
  - Порядок покрытия общих расходов и убытков
  - Порядок распределения прибыли
  - Ответственность товарищей перед третьими лицами и друг перед другом (регресс)
  - Конфиденциальность
  - Запрет конкуренции
  - Порядок выхода товарища и его последствия
  - Порядок принятия нового товарища
  - Последствия смерти, банкротства или ликвидации товарища
  - Порядок передачи доли
  - Срок действия договора
  - Порядок прекращения и раздела имущества
  - Налоговый и бухгалтерский учёт
  - Порядок разрешения споров
  - Заключительные положения

notes: |
  КРИТИЧЕСКИ ВАЖНЫЕ АСПЕКТЫ:
  1. Простое товарищество не является юридическим лицом — не требует госрегистрации, но и не защищает личное имущество участников (ст. 1041 ГК РФ).
  2. При предпринимательской цели и участии ИП/коммерческой организации — солидарная ответственность всех товарищей по общим обязательствам (ст. 1047 ГК РФ).
  3. Имущество товарищей — общая долевая собственность (ст. 1043 ГК РФ). Чёткая денежная оценка всех вкладов (особенно неимущественных) обязательна.
  4. Ведение общих дел — совместно или одним/несколькими товарищами по доверенности (ст. 1044 ГК РФ). Необходимы механизмы контроля и отчётности.
  5. Решения по умолчанию принимаются по общему согласию. Договором должен быть установлен ясный порядок для избежания тупиков (deadlock).
  6. Прибыль/убытки распределяются пропорционально вкладам, если иное не установлено договором (ст. 1046, 1048 ГК РФ).
  7. Каждый товарищ имеет неотчуждаемое право на полную информацию о деятельности (ст. 1045 ГК РФ).
  8. Выход из бессрочного договора — уведомление за 3 месяца (ст. 1051 ГК РФ). Желательно детально урегулировать порядок выдела доли.
  9. Смерть товарища-гражданина, ликвидация/банкротство товарища-юрлица по умолчанию прекращают договор (ст. 1050 ГК РФ).
  10. Негласное товарищество (третьи лица не знают о его существовании) — товарищ, совершивший сделку, отвечает единолично (ст. 1054 ГК РФ).
  11. Налоговый учёт ведётся каждым товарищем отдельно на своей налоговой базе (ст. 278 НК РФ). Требуется согласованность.

