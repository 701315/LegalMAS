validation_metadata:
  validation_version: "2.0"
  last_updated: "2026-02-07"
  author: "Legal AI Team"

  # ──────────────────────────────────────────────────────────
  # СЕКЦИЯ 1: ПРИМЕНИМОЕ ЗАКОНОДАТЕЛЬСТВО
  # ──────────────────────────────────────────────────────────
  legal_base:
    primary:
      - "Глава 55 ГК РФ (ст. 1041–1054) — простое товарищество"
    secondary:
      - "ст. 1041 ГК РФ — понятие договора простого товарищества"
      - "ст. 1042 ГК РФ — вклады товарищей"
      - "ст. 1043 ГК РФ — общее имущество товарищей"
      - "ст. 1044 ГК РФ — ведение общих дел товарищей"
      - "ст. 1045 ГК РФ — право на информацию"
      - "ст. 1046 ГК РФ — общие расходы и убытки"
      - "ст. 1047 ГК РФ — ответственность товарищей"
      - "ст. 1048 ГК РФ — распределение прибыли"
      - "ст. 1049 ГК РФ — выдел доли при обращении взыскания"
      - "ст. 1050 ГК РФ — прекращение договора"
      - "ст. 1051 ГК РФ — отказ от бессрочного договора"
      - "ст. 1052 ГК РФ — расторжение срочного договора"
      - "ст. 1053 ГК РФ — ответственность при прекращении"
      - "ст. 1054 ГК РФ — негласное товарищество"
    related:
      - "ст. 244–259 ГК РФ — общая долевая собственность"
      - "ст. 321, 322, 325 ГК РФ — солидарные обязательства и регресс"
      - "НК РФ ст. 278.1-278.3 — налогообложение участников договора простого товарищества"
      - "НК РФ ст. 180 — НДС при совместной деятельности"
      - "Федеральный закон от 28.11.2011 № 335-ФЗ 'Об инвестиционном товариществе' (для разграничения)"
      - "ФЗ от 26.10.2002 № 127-ФЗ «О банкротстве»"

  # ──────────────────────────────────────────────────────────
  # СЕКЦИЯ 2: ОБЯЗАТЕЛЬНЫЕ ЭЛЕМЕНТЫ ДОГОВОРА
  # ──────────────────────────────────────────────────────────
  essential_elements:
    - element: "parties"
      required: true
      legal_base: "ст. 1041, 432 ГК РФ"
      description: "Двое или несколько товарищей (участников). Могут быть как физические, так и юридические лица."
      validation_rules:
        - "presence_check"
        - "legal_capacity_indicators"
        - "minimum_two_parties"
      conditional_checks:
        - trigger: "single_party"
          keywords: []
          rule: "minimum_two_parties_required"
          legal_base: "ст. 1041 ГК РФ"
          severity: "critical"
          risk_msg: "Договор простого товарищества требует минимум двух участников"

    - element: "common_goal"
      required: true
      legal_base: "ст. 1041 ГК РФ"
      description: "Общая цель совместной деятельности (извлечение прибыли или иная не противоречащая закону цель)"
      validation_rules:
        - "goal_specified"
        - "goal_lawful"
      conditional_checks:
        - trigger: "partnership_keywords"
          keywords: ["простое товарищество", "совместная деятельность"]
          rule: "common_goal_mandatory"
          legal_base: "ст. 1041 ГК РФ"
          severity: "critical"
          risk_msg: "Без указания общей цели договор может быть признан незаключенным"

    - element: "contributions"
      required: true
      legal_base: "ст. 1042 ГК РФ"
      description: "Соединение вкладов товарищей (деньги, иное имущество, профессиональные знания, навыки, деловая репутация, деловые связи)"
      validation_rules:
        - "contributions_specified"
        - "contribution_valuation"
      conditional_checks:
        - trigger: "partnership_agreement"
          keywords: ["вклады", "внесение", "соединение вкладов"]
          rule: "contributions_must_be_specified"
          legal_base: "ст. 1042 ГК РФ"
          severity: "critical"
          validation_rules:
            - "each_party_contribution"
            - "monetary_valuation_provided"

    - element: "management_structure"
      required: true
      legal_base: "ст. 1044 ГК РФ"
      description: "Порядок ведения общих дел (совместно всеми товарищами, поручено одному или нескольким товарищам)"
      validation_rules:
        - "management_specified"
        - "authority_limits_defined"
      conditional_checks:
        - trigger: "partnership_management"
          keywords: ["ведение общих дел", "ведущий дела", "полномочия"]
          rule: "management_procedure_required"
          legal_base: "ст. 1044 ГК РФ"
          severity: "high"
          risk_msg: "Без четкого определения порядка ведения дел возможны конфликты и злоупотребления"

    - element: "profit_distribution"
      required: true
      legal_base: "ст. 1048 ГК РФ"
      description: "Порядок распределения прибыли между товарищами. По умолчанию - пропорционально стоимости вкладов."
      validation_rules:
        - "profit_distribution_specified"
      conditional_checks:
        - trigger: "commercial_goal"
          keywords: ["извлечение прибыли", "коммерческая деятельность", "доход"]
          rule: "profit_distribution_mandatory"
          legal_base: "ст. 1048 ГК РФ"
          severity: "high"
          risk_msg: "Для товарищества с коммерческой целью порядок распределения прибыли является существенным условием"

    - element: "liability_provisions"
      required: true
      legal_base: "ст. 1047 ГК РФ"
      description: "Положения об ответственности товарищей по общим обязательствам"
      validation_rules:
        - "liability_specified"
      conditional_checks:
        - trigger: "entrepreneur_present"
          keywords: ["ИП", "индивидуальный предприниматель", "коммерческая организация", "ООО", "АО"]
          rule: "joint_and_several_liability_applies"
          legal_base: "ст. 1047 ГК РФ"
          severity: "critical"
          risk_msg: "При наличии предпринимателя среди товарищей возникает солидарная ответственность по общим обязательствам"

  # ──────────────────────────────────────────────────────────
  # СЕКЦИЯ 3: ЗАЩИТНЫЕ УСЛОВИЯ (PROTECTIVE CLAUSES)
  # ──────────────────────────────────────────────────────────
  protective_clauses:
    # --- ЗАЩИТА ВСЕХ ТОВАРИЩЕЙ (All Partners Protection) ---
    both_protection:
      - clause_id: "clear_contribution_valuation"
        name: "Чёткая денежная оценка всех вкладов"
        risk_if_missing: |
          Без денежной оценки вкладов (особенно неденежных: знания, репутация) невозможно определить
          доли в общей собственности, пропорции распределения прибыли и убытков. Споры о размере долей —
          одна из главных причин конфликтов. По умолчанию вклады признаются равными (ст. 1042 ГК РФ).
        legal_base: "ст. 1042 ГК РФ"
        severity: "critical"
        affected_party: "both"
        detection:
          positive_keywords:
            - "вклад оценивается"
            - "денежная оценка вклада"
            - "стоимость вклада"
            - "оценка имущества"
            - "вклад в размере"
            - "доля товарища"
            - "независимая оценка"
          context_patterns:
            - '(?i)вклад\s+товарищ\w+\s+оценивается\s+в\s+сумме'
            - '(?i)стоимость\s+вклада\s+составляет'

      - clause_id: "decision_making_procedure"
        name: "Процедура принятия решений по ключевым вопросам"
        risk_if_missing: |
          Без четкой процедуры принятия решений (квалифицированное большинство, единогласие) возникают тупиковые ситуации
          и конфликты. Особенно критично для вопросов, затрагивающих общее имущество, крупные сделки,
          изменение цели деятельности. Риск блокировки деятельности одним недобросовестным товарищем.
        legal_base: "ст. 1044, 1045 ГК РФ"
        severity: "critical"
        affected_party: "both"
        detection:
          positive_keywords:
            - "порядок принятия решений"
            - "единогласное решение"
            - "квалифицированное большинство"
            - "вопросы, требующие согласия всех товарищей"
            - "кворум"
            - "протокол собрания"
            - "уведомление о собрании"
          context_patterns:
            - '(?i)решения\s+по\s+вопросам.*принимаются.*(единогласно|большинством)'
            - '(?i)для\s+принятия\s+решения\s+требуется\s+согласие.*всех\s+товарищей'

      - clause_id: "information_rights_and_reporting"
        name: "Право на информацию и регулярная отчетность"
        risk_if_missing: |
          Товарищи, не ведущие дела, рискуют быть исключенными из информационного поля. Без права на регулярную отчетность
          и доступ ко всей документации они не могут контролировать действия ведущего дела, оценивать результаты деятельности,
          выявлять нарушения. Риск злоупотреблений и сокрытия прибыли.
        legal_base: "ст. 1045 ГК РФ"
        severity: "high"
        affected_party: "both"
        detection:
          positive_keywords:
            - "право на информацию"
            - "отчетность"
            - "ежеквартальный отчет"
            - "доступ к документации"
            - "бухгалтерская отчетность"
            - "аудиторская проверка"
            - "финансовые результаты"
            - "инвентаризация"
          context_patterns:
            - '(?i)ведущий\s+дела\s+обязан\s+предоставлять.*отчет.*о\s+деятельности'
            - '(?i)каждый\s+товарищ\s+вправе\s+знакомиться\s+со\s+всей\s+документацией'

      - clause_id: "liability_distribution_and_regress"
        name: "Распределение ответственности и порядок регрессных требований"
        risk_if_missing: |
          При солидарной ответственности кредитор может взыскать весь долг с любого товарища. Без внутреннего соглашения
          о порядке регресса товарищ, уплативший долг, может не получить возмещения от других. Необходимо определить
          пропорции возмещения (обычно пропорционально долям/вкладам).
        legal_base: "ст. 1047, 325 ГК РФ"
        severity: "critical"
        affected_party: "both"
        detection:
          positive_keywords:
            - "солидарная ответственность"
            - "регресс"
            - "возмещение уплаченного"
            - "распределение ответственности"
            - "пропорционально долям"
            - "внутренние расчёты"
            - "право обратного требования"
          context_patterns:
            - '(?i)товарищ.*уплативший.*вправе\s+требовать\s+от\s+других\s+товарищей\s+возмещения'
            - '(?i)ответственность.*распределяется.*пропорционально\s+(долям|вкладам)'

    # --- ЗАЩИТА ТОВАРИЩЕЙ, НЕ ВЕДУЩИХ ДЕЛА (Non-Managing Partners / Buyer Protection) ---
    buyer_protection:
      - clause_id: "managing_partner_limitations"
        name: "Ограничения полномочий ведущего дела и контрольные механизмы"
        risk_if_missing: |
          Ведущий дела товарищ может совершать сделки от имени всех товарищей без необходимых ограничений. Без четких лимитов
          (максимальная сумма сделки, требование одобрения для определенных действий) и механизмов контроля (вторая подпись,
          одобрение собрания) возникает риск злоупотребления полномочиями, заключения невыгодных сделок, растраты общего имущества.
        legal_base: "ст. 1044 ГК РФ"
        severity: "critical"
        affected_party: "buyer"
        detection:
          positive_keywords:
            - "ограничение полномочий"
            - "максимальная сумма сделки"
            - "требуется согласие товарищей"
            - "сделки, требующие одобрения"
            - "вторая подпись"
            - "предварительное согласование"
            - "лимит представительства"
            - "исключительная компетенция собрания"
          context_patterns:
            - '(?i)ведущий\s+дела\s+не\s+вправе\s+совершать\s+сделки\s+на\s+сумму\s+свыше'
            - '(?i)для\s+совершения.*сделок\s+требуется\s+предварительное\s+согласие'

      - clause_id: "withdrawal_rights_and_compensation"
        name: "Право на выход из товарищества и порядок компенсации"
        risk_if_missing: |
          Товарищ, желающий выйти из договора, может столкнуться с невозможностью реализовать это право или получить
          справедливую компенсацию за свою долю в общем имуществе. Без четкого порядка выхода (срок уведомления, оценка доли,
          порядок выплаты) возникает риск "замораживания" инвестиций и затяжных споров о разделе имущества.
        legal_base: "ст. 1050, 1051, 1052 ГК РФ"
        severity: "high"
        affected_party: "buyer"
        detection:
          positive_keywords:
            - "право на выход"
            - "выход из товарищества"
            - "уведомление о выходе"
            - "выдел доли"
            - "оценка доли при выходе"
            - "порядок расчетов"
            - "срок выплаты компенсации"
            - "имущественные последствия выхода"
          context_patterns:
            - '(?i)товарищ\s+вправе\s+выйти\s+из\s+договора.*уведомив.*за\s+\d+\s+месяцев'
            - '(?i)при\s+выходе\s+товарища\s+его\s+доля\s+в\s+общем\s+имуществе\s+подлежит\s+выделу'

      - clause_id: "minority_protection_mechanisms"
        name: "Механизмы защиты миноритарных участников"
        risk_if_missing: |
          При принятии решений большинством голосов товарищи с малыми долями могут быть лишены влияния на существенные вопросы.
          Без механизмов защиты (право вето по ключевым вопросам, квалифицированное большинство для изменения долей)
          миноритарии становятся заложниками решений большинства.
        legal_base: "ст. 1044 ГК РФ, принципы добросовестности"
        severity: "high"
        affected_party: "buyer"
        detection:
          positive_keywords:
            - "право вето"
            - "квалифицированное большинство"
            - "защита миноритария"
            - "единогласие по ключевым вопросам"
            - "существенные вопросы"
            - "изменение долей"
            - "блокирующий пакет"
          context_patterns:
            - '(?i)решения\s+по\s+следующим\s+вопросам\s+принимаются\s+единогласно'
            - '(?i)товарищ\s+с\s+долей\s+свыше\s+\d+%'

  # ──────────────────────────────────────────────────────────
  # СЕКЦИЯ 4: ДОПОЛНИТЕЛЬНЫЕ PROTECTIVE CLAUSES
  # ──────────────────────────────────────────────────────────
  additional_protective_clauses:
    both_protection:
      - clause_id: "deadlock_resolution_mechanism"
        name: "Механизм разрешения тупиковых ситуаций (deadlock)"
        risk_if_missing: |
          При равенстве голосов или невозможности достичь согласия по ключевым вопросам деятельность товарищества парализуется.
          Без механизмов разрешения тупиков (привлечение медиатора, "русская рулетка", право выкупа доли) конфликт может привести
          к распаду товарищества с существенными потерями для всех участников.
        legal_base: "Договорная практика, ст. 10 ГК РФ (добросовестность)"
        severity: "high"
        affected_party: "both"
        detection:
          positive_keywords:
            - "разрешение тупиковых ситуаций"
            - "deadlock"
            - "медиация"
            - "третейский суд"
            - "право выкупа доли"
            - "русская рулетка"
            - "shotgun clause"
            - "принудительный выход"
          context_patterns:
            - '(?i)в\s+случае\s+невозможности\s+принять\s+решение.*спор\s+передается\s+на\s+рассмотрение'
            - '(?i)при\s+тупиковой\s+ситуации.*любой\s+товарищ\s+вправе\s+предложить\s+выкуп\s+доли'

      - clause_id: "termination_and_liquidation_procedure"
        name: "Порядок прекращения договора и ликвидации общего имущества"
        risk_if_missing: |
          При прекращении товарищества (истечение срока, достижение цели, соглашение сторон) отсутствие четкой процедуры
          ликвидации общего имущества приводит к затяжным спорах о разделе, оценке долей, распределении обязательств.
          Риск утраты имущества, возникновения налоговых обязательств, судебных издержек.
        legal_base: "ст. 1050, 1052, 1053 ГК РФ, ст. 252 ГК РФ"
        severity: "high"
        affected_party: "both"
        detection:
          positive_keywords:
            - "прекращение договора"
            - "ликвидация общего имущества"
            - "ликвидационная комиссия"
            - "оценка имущества при ликвидации"
            - "порядок раздела"
            - "распределение обязательств"
            - "ликвидационный баланс"
            - "сроки ликвидации"
          context_patterns:
            - '(?i)при\s+прекращении\s+договора\s+образуется\s+ликвидационная\s+комиссия'
            - '(?i)общее\s+имущество\s+подлежит\s+оценке.*и\s+разделу\s+пропорционально\s+долям'

      - clause_id: "tax_and_accounting_coordination"
        name: "Согласование налогового и бухгалтерского учета"
        risk_if_missing: |
          Каждый товарищ учитывает свою долю прибыли и расходов на своем балансе. Без согласованных правил учета, документооборота,
          распределения налоговых обязательств возникают риски двойного налогообложения, налоговых доначислений, расхождений в отчетности.
          Особенно критично при участии лиц на разных налоговых режимах (ОСН, УСН, патент).
        legal_base: "НК РФ ст. 278.1-278.3, ст. 180, ФЗ-402 «О бухгалтерском учёте»"
        severity: "high"
        affected_party: "both"
        detection:
          positive_keywords:
            - "налоговый учет"
            - "бухгалтерский учет"
            - "документооборот"
            - "распределение налоговых обязательств"
            - "отчетность товарищества"
            - "налоговый агент"
            - "согласованные правила учета"
            - "разные налоговые режимы"
          context_patterns:
            - '(?i)стороны\s+договорились\s+о\s+единых\s+правилах\s+налогового\s+учета'
            - '(?i)ведущий\s+дела\s+обеспечивает\s+ведение\s+бухгалтерского\s+учета.*и\s+предоставление\s+отчетности'

      - clause_id: "death_or_bankruptcy_consequences"
        name: "Последствия смерти/банкротства товарища и порядок продолжения деятельности"
        risk_if_missing: |
          По умолчанию смерть товарища-гражданина или ликвидация/банкротство товарища-юрлица прекращают договор (ст. 1050 ГК РФ).
          Без условия о продолжении деятельности с наследниками/правопреемниками или о праве выкупа доли остальными товарищами,
          успешный бизнес может быть принудительно ликвидирован.
        legal_base: "ст. 1050 ГК РФ"
        severity: "high"
        affected_party: "both"
        detection:
          positive_keywords:
            - "смерть товарища"
            - "наследники"
            - "правопреемники"
            - "банкротство товарища"
            - "ликвидация участника"
            - "продолжение с наследниками"
            - "выкуп доли наследника"
            - "право преимущественного выкупа"
          context_patterns:
            - '(?i)в\s+случае\s+смерти\s+товарища.*договор\s+(продолжается|не\s+прекращается)'
            - '(?i)оставшиеся\s+товарищи\s+имеют\s+преимущественное\s+право\s+на\s+выкуп\s+доли'

    seller_protection:
      - clause_id: "non_compete_and_conflict_of_interest"
        name: "Запрет конкуренции и урегулирование конфликта интересов"
        risk_if_missing: |
          Товарищи могут использовать полученную в рамках товарищества информацию, клиентскую базу, технологии для конкурирующей
          деятельности в ущерб общим интересам. Без запрета конкуренции и правил урегулирования конфликта интересов возникает риск
          "паразитирования" на общем бизнесе и раскола товарищества.
        legal_base: "ст. 10 ГК РФ (добросовестность), ФЗ-98 «О коммерческой тайне»"
        severity: "high"
        affected_party: "seller"
        detection:
          positive_keywords:
            - "запрет конкуренции"
            - "non-compete"
            - "конфликт интересов"
            - "независимая деятельность"
            - "использование информации"
            - "конкурирующий бизнес"
            - "лояльность товарищу"
            - "приоритет общих интересов"
            - "коммерческая тайна"
          context_patterns:
            - '(?i)товарищи\s+обязуются\s+не\s+осуществлять.*конкурирующую\s+деятельность'
            - '(?i)в\s+случае\s+конфликта\s+интересов.*товарищ\s+обязан\s+уведомить'

      - clause_id: "admission_of_new_partners"
        name: "Порядок принятия новых товарищей и защиты существующих"
        risk_if_missing: |
          Принятие нового товарища без согласия всех существующих участников или без четких условий может изменить баланс сил,
          размыть доли, привести к конфликтам. Без права вето для существующих товарищей и четкой процедуры оценки вклада нового
          участника возникает риск девальвации первоначальных инвестиций.
        legal_base: "ст. 1041, 1042, 1044 ГК РФ"
        severity: "medium"
        affected_party: "seller"
        detection:
          positive_keywords:
            - "принятие нового товарища"
            - "требуется единогласное решение"
            - "оценка вклада нового участника"
            - "изменение долей"
            - "право преимущественного отказа"
            - "пересмотр условий договора"
            - "право вето"
          context_patterns:
            - '(?i)принятие\s+нового\s+товарища\s+допускается\s+только\s+с\s+согласия.*всех\s+участников'
            - '(?i)вклад\s+нового\s+товарища\s+подлежит\s+оценке.*по\s+единогласному\s+решению'

      - clause_id: "transfer_of_share_restrictions"
        name: "Ограничения на передачу/уступку доли в товариществе"
        risk_if_missing: |
          Законодательство не предусматривает свободного оборота долей в простом товариществе. Передача доли третьему лицу
          требует изменения договора. Без четкого порядка (обязательное согласие всех, преимущественное право остальных,
          запрет на передачу) возникает риск нежелательного вхождения нового участника.
        legal_base: "ст. 1041 ГК РФ, договорная практика"
        severity: "medium"
        affected_party: "seller"
        detection:
          positive_keywords:
            - "передача доли"
            - "уступка доли"
            - "цессия доли"
            - "требуется согласие всех товарищей"
            - "запрет на уступку"
            - "преимущественное право"
          context_patterns:
            - '(?i)уступка\s+доли\s+в\s+товариществе\s+допускается\s+только\s+с\s+согласия'
            - '(?i)товарищ\s+не\s+вправе\s+передавать\s+свою\s+долю\s+третьим\s+лицам'