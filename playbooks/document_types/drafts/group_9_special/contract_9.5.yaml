rules:
  keywords:
    high:
      - "договор об учреждении"
      - "учредительный договор"
      - "учредители общества"
      - "создание ооо"
      - "создание ао"
      - "уставный капитал"
      - "доля в уставном капитале"
      - "солидарная ответственность"
    medium:
      - "номинальная стоимость доли"
      - "порядок оплаты доли"
      - "совместная деятельность по созданию"
      - "расходы на учреждение"
      - "неденежный вклад"
      - "оценка имущества"
      - "регистрация юридического лица"
    low:
      - "единогласное решение"
      - "распределение расходов"
      - "избрание директора"
      - "предрегистрационные договоры"
      - "выход учредителя"
  phrases:
    high:
      - Учредители обязуются создать Общество с ограниченной ответственностью
      - Учредители несут солидарную ответственность по обязательствам, связанным с созданием общества
      - Уставный капитал Общества составляет [сумма] рублей
      - Размер доли Учредителя составляет [%], номинальная стоимость — [сумма] рублей
      - Каждый Учредитель обязан оплатить свою долю в срок до [дата]
    medium:
      - Порядок совместной деятельности Учредителей по созданию Общества
      - Расходы на учреждение распределяются между Учредителями пропорционально размеру их долей
      - Для оплаты доли неденежными средствами требуется оценка независимым оценщиком
      - Решения по вопросам создания Общества принимаются учредителями единогласно
      - Договор действует до момента государственной регистрации Общества
  patterns:
    required:
      - (?i)(договор\s+об\s+учреждении|учредительн\w+\s+договор|создани[ея]\s+(ооо|ао|общества\s+с\s+ограниченной\s+ответственностью))
    optional:
      - (?i)уставный\s+капитал\s+составляет\s+(\d+)
      - (?i)солидарн\w+\s+ответственность\s+по\s+обязательствам
      - (?i)номинальная\s+стоимость\s+доли
      - (?i)оплата\s+доли\s+неденежными\s+средствами
  exclusions:
    - устав общества (основной документ после регистрации ООО)
    - договор простого товарищества (договор о совместной деятельности)
    - корпоративный договор (заключается после создания общества между участниками)
    - решение единственного учредителя
  exclusion_logic:
    - condition: "charter_keywords AND (post_registration OR internal_regulation)"
      target: "rejection"
      confidence: 0.95
      description: "Устав ООО — документ, действующий после регистрации, не является договором об учреждении."
    - condition: "single_founder_keywords AND decision_keywords"
      target: "rejection"
      confidence: 0.90
      description: "При единственном учредителе заключается не договор, а решение об учреждении."
  weights:
    keyword_high: 3.0
    keyword_medium: 1.5
    keyword_low: 0.5
    phrase_high: 2.5
    phrase_medium: 1.0
    pattern_required: 4.0
    pattern_optional: 1.0
  classification:
    min_confidence: 0.75
    max_matches: 3

party_roles:
  - "Учредитель (будущий участник/акционер) – физическое или юридическое лицо, принимающее на себя обязательства по созданию общества и оплате доли/акций."

essential_terms:
  - "Предмет договора: обязательство создать конкретное хозяйственное общество (ООО/АО) с указанием его полного наименования."
  - "Размер уставного капитала общества (для ООО — не менее 10 000 рублей)."
  - "Размер и номинальная стоимость доли (количества и категории акций) каждого учредителя."
  - "Порядок, сроки и способ оплаты долей (акций) каждым учредителем."
  - "Порядок осуществления учредителями совместной деятельности по подготовке к регистрации и распределению связанных с этим расходов."

specific_risks:
  - "**Солидарная ответственность:** Все учредители несут солидарную ответственность по любым обязательствам, возникшим до регистрации общества (договоры аренды, услуги и т.д.). Кредитор может взыскать весь долг с любого учредителя."
  - "**Риск неоплаты доли:** Неисполнение одним учредителем обязанности по оплате доли ведет к переходу неоплаченной части доли к обществу, изменению структуры собственности и возможному срыву бизнес-планов."
  - "**Конфликты на этапе создания:** Отсутствие четкого регламента по принятию решений (выбор директора, юрисдикция, оценка вклада) может привести к тупику и срыву регистрации."
  - "**Коллизия с уставом:** После регистрации ООО условия договора об учреждении, противоречащие уставу, не применяются. Важные договоренности, не включенные в устав, теряют силу."
  - "**Риски неденежного вклада:** Завышение стоимости неденежного вклада (свыше 20 000 руб. без оценки) влечет субсидиарную ответственность учредителей и оценщика в течение 3 лет."
  - "**Неопределенность с расходами:** Непредусмотренные или несправедливо распределенные расходы на регистрацию становятся источником конфликтов."

aliases:
  - Договор об учреждении ООО
  - Договор о создании АО
  - Учредительный договор (устар.)
  - Соглашение учредителей о создании общества
  - Founders Agreement (в части учреждения)
  - Договор о совместной деятельности по учреждению общества

section_markers:
  - Преамбула (стороны-учредители)
  - Предмет договора (намерение создать общество, наименование, ОПФ)
  - Сведения о создаваемом обществе (место нахождения, цели)
  - Размер уставного капитала
  - Размер, номинальная стоимость и порядок оплаты долей каждого учредителя
  - Порядок осуществления совместной деятельности по созданию
  - Распределение расходов, связанных с учреждением
  - Ответственность учредителей (солидарная ответственность до регистрации)
  - Порядок разрешения споров между учредителями
  - Срок действия договора и заключительные положения
  - Подписи и реквизиты учредителей

notes: |
  КРИТИЧЕСКИ ВАЖНЫЕ АСПЕКТЫ (императивные ограничения):
  1.  **Солидарная ответственность (ст. 11 ФЗ-14):** Ключевой риск. Все обязательства, принятые до регистрации от имени создаваемого общества, лежат на учредителях солидарно. После регистрации общество может их одобрить.
  2.  **Минимальный уставный капитал ООО:** 10 000 руб. (ст. 14 ФЗ-14). Должен быть полностью оплачен в срок, указанный в договоре, но не позднее 4 месяцев с даты регистрации.
  3.  **Оценка неденежного вклада:** При стоимости вклада свыше 20 000 руб. обязательна оценка независимым оценщиком (ст. 15 ФЗ-14). За завышение стоимости — субсидиарная ответственность.
  4.  **Соотношение с уставом:** Для ООО устав — единственный учредительный документ (ст. 12 ФЗ-14). Условия договора об учреждении, противоречащие уставу, не действуют.
  5.  **Форма договора:** Простая письменная. Нотариальное удостоверение требуется, если в уставный капитал ООО вносится неденежный вклад (п. 1 ст. 89.1 ГК РФ).

