type: contract_9.5
name: Договор об учреждении общества (Учредительный договор)
description: |
  Соглашение между учредителями (будущими участниками/акционерами) о совместной деятельности по созданию хозяйственного общества (ООО или АО).
  Определяет порядок учреждения, размер уставного капитала, размер, номинальную стоимость и порядок оплаты долей (акций), распределение расходов на создание.
  Учредители несут **солидарную ответственность** по всем обязательствам, возникшим до государственной регистрации общества.
  **Не является учредительным документом.** Для ООО после регистрации внутренние отношения регулируются уставом; условия договора, ему противоречащие, не применяются.
  Для АО договор утрачивает силу после регистрации. Регулируется ст. 89.1 ГК РФ, ст. 11 ФЗ-14 «Об ООО», ст. 9 ФЗ-208 «Об АО».
version: 2.0
parent: class_9_special_imperative
metadata:
  category: contract
  subcategory: corporate_law
  complexity: high
  risk_level: high
  legal_base: "ст. 89.1 ГК РФ, ст. 11 Федерального закона от 08.02.1998 № 14-ФЗ «Об ООО», ст. 9 Федерального закона от 26.12.1995 № 208-ФЗ «Об АО»"

