validation_metadata:
  validation_version: "2.0"
  last_updated: "2026-02-07"
  author: "Legal AI Team"

  # ──────────────────────────────────────────────────────────
  # СЕКЦИЯ 1: ПРИМЕНИМОЕ ЗАКОНОДАТЕЛЬСТВО
  # ──────────────────────────────────────────────────────────
  legal_base:
    primary:
      - "Гражданский кодекс РФ, ст. 89.1 — Договор об учреждении общества с ограниченной ответственностью"
      - "Федеральный закон от 08.02.1998 № 14-ФЗ «Об обществах с ограниченной ответственностью», ст. 11, 12, 14–16"
      - "Федеральный закон от 26.12.1995 № 208-ФЗ «Об акционерных обществах», ст. 9, 25, 34"
    secondary:
      - "ст. 66.2, 66.3 ГК РФ — Основные положения о хозяйственных обществах"
      - "ст. 67.2 ГК РФ — Корпоративный договор"
      - "ст. 434.1 ГК РФ — Конфиденциальность переговоров"
    related:
      - "Федеральный закон от 08.08.2001 № 129-ФЗ «О государственной регистрации юридических лиц и индивидуальных предпринимателей»"
      - "Федеральный закон от 29.07.1998 № 135-ФЗ «Об оценочной деятельности»"
      - "Постановление Пленума Верховного Суда РФ от 23.06.2015 № 25 (п. 76 — о солидарной ответственности)"

  # ──────────────────────────────────────────────────────────
  # СЕКЦИЯ 2: ОБЯЗАТЕЛЬНЫЕ ЭЛЕМЕНТЫ ДОГОВОРА
  # ──────────────────────────────────────────────────────────
  essential_elements:
    - element: "obligation_to_establish_company"
      required: true
      legal_base: "ст. 89.1 ГК РФ, ст. 11 ФЗ-14"
      description: "Ясное обязательство учредителей создать конкретное хозяйственное общество с указанием его полного наименования и организационно-правовой формы."
      validation_rules:
        - "company_formation_obligation_mentioned"
        - "company_name_specified"
        - "company_legal_form_specified"

    - element: "charter_capital_amount_and_shares"
      required: true
      legal_base: "ст. 11 ФЗ-14, ст. 14 ФЗ-14"
      description: "Указание общего размера уставного капитала, а также размера и номинальной стоимости доли (количества акций) каждого учредителя."
      validation_rules:
        - "charter_capital_amount_specified"
        - "share_size_for_each_founder_specified"
        - "nominal_value_for_each_share_specified"
        - "shares_sum_to_100_percent"
      conditional_checks:
        - trigger: "ooo_formation"
          keywords: ["ооо", "общество с ограниченной ответственностью"]
          rule: "minimum_charter_capital_check"
          legal_base: "ст. 14 ФЗ-14"
          severity: "critical"
          risk_msg: "Уставный капитал ООО не может быть менее 10 000 рублей."

    - element: "procedure_and_deadline_for_share_payment"
      required: true
      legal_base: "ст. 11, 16 ФЗ-14"
      description: "Четкое определение порядка (способа), срока и условий оплаты каждым учредителем своей доли."
      validation_rules:
        - "payment_deadline_for_each_founder_specified"
        - "payment_method_specified (money/property/rights)"
        - "payment_deadline_within_4_months"

    - element: "solidary_liability_clause"
      required: true
      legal_base: "ст. 11 ФЗ-14"
      description: "Прямое указание на солидарную ответственность всех учредителей по обязательствам, возникшим в связи с созданием общества до его государственной регистрации."
      validation_rules:
        - "solidary_liability_mentioned"

  # ──────────────────────────────────────────────────────────
  # СЕКЦИЯ 3: ЗАЩИТНЫЕ УСЛОВИЯ (PROTECTIVE CLAUSES)
  # ──────────────────────────────────────────────────────────
  protective_clauses:
    # --- ЗАЩИТА ИНТЕРЕСОВ ВСЕХ УЧРЕДИТЕЛЕЙ (All Founders Protection) ---
    buyer_protection:
      - clause_id: "unanimous_decision_making_on_key_issues"
        name: "Единогласное принятие решений по ключевым вопросам"
        risk_if_missing: |
          Без требования единогласия мажоритарный учредитель может навязать решения по выбору директора, утверждению крупных расходов или оценке вклада, игнорируя интересы миноритариев, что ведет к конфликтам и срыву создания.
        legal_base: "ст. 89.1 ГК РФ (диспозитивная норма)"
        severity: "high"
        affected_party: "buyer"
        detection:
          positive_keywords:
            - "решения принимаются единогласно"
            - "единогласное решение всех учредителей"
            - "каждый учредитель обладает правом вето по вопросам"
            - "список вопросов, требующих единогласия"
          context_patterns:
            - '(?i)решения\s+по\s+вопросам.*создания.*принимаются\s+единогласно'

      - clause_id: "detailed_distribution_of_costs_and_prepayment"
        name: "Детальное распределение расходов на учреждение и порядок авансирования"
        risk_if_missing: |
          Расходы на госпошлину, юридические, нотариальные услуги, оценку имущества могут быть существенными. Без четкого распределения (пропорционально долям, поровну) и порядка возмещения (аванс, последующий зачет) возникают споры и задержки.
        legal_base: "Договорная практика"
        severity: "high"
        affected_party: "buyer"
        detection:
          positive_keywords:
            - "расходы на учреждение распределяются"
            - "пропорционально размеру доли"
            - "авансовый взнос на расходы"
            - "смета расходов"
            - "отчет об использовании средств"
          context_patterns:
            - '(?i)расходы\s+распределяются\s+между\s+учредителями\s+пропорционально\s+долям'

      - clause_id: "non_monetary_contribution_valuation_procedure"
        name: "Процедура оценки неденежного вклада и ответственность"
        risk_if_missing: |
          Завышение стоимости неденежного вклада (свыше 20 000 руб. без оценки) влечет субсидиарную ответственность учредителей и оценщика в течение 3 лет. Без четкой процедуры (выбор оценщика, утверждение отчета) высоки риски споров и ответственности.
        legal_base: "ст. 15 ФЗ-14"
        severity: "critical"
        affected_party: "buyer"
        detection:
          positive_keywords:
            - "независимая оценка"
            - "оценщик"
            - "отчет об оценке"
            - "утверждение оценки единогласным решением"
            - "ответственность за завышение стоимости"
          context_patterns:
            - '(?i)стоимость\s+неденежного\s+вклада\s+определяется\s+независимым\s+оценщиком'

      - clause_id: "director_election_and_authority_limits"
        name: "Порядок избрания директора и пределы его полномочий до регистрации"
        risk_if_missing: |
          Неопределенность в кандидатуре, порядке избрания и полномочиях единоличного исполнительного органа на этапе создания ведет к конфликтам. Директор, действуя до регистрации, создает солидарные обязательства для всех учредителей.
        legal_base: "ст. 40 ФЗ-14"
        severity: "high"
        affected_party: "buyer"
        detection:
          positive_keywords:
            - "избрание директора"
            - "единоличный исполнительный орган"
            - "кандидатура"
            - "полномочия до регистрации"
            - "пределы полномочий"
          context_patterns:
            - '(?i)директор\s+избирается\s+единогласным\s+решением\s+учредителей'

      - clause_id: "pre_incorporation_contracts_approval_mechanism"
        name: "Механизм одобрения договоров, заключенных до регистрации (pre-incorporation contracts)"
        risk_if_missing: |
          Обязательства, принятые от имени создаваемого общества до его регистрации, ложатся на учредителей солидарно. Без механизма предварительного одобрения таких договоров всеми учредителями или правил последующей ратификации обществом риски личной ответственности неконтролируемы.
        legal_base: "ст. 11 ФЗ-14"
        severity: "high"
        affected_party: "buyer"
        detection:
          positive_keywords:
            - "договоры до регистрации"
            - "предварительное одобрение учредителей"
            - "ратификация обществом после регистрации"
            - "предел сумм для единоличного заключения"
          context_patterns:
            - '(?i)заключение\s+договоров\s+до\s+регистрации\s+требует\s+одобрения'

    # --- ЗАЩИТА ИНТЕРЕСОВ УЧРЕДИТЕЛЯ-ОРГАНИЗАТОРА / МИНОРИТАРИЯ (Seller / Minority Protection) ---
    seller_protection:
      - clause_id: "withdrawal_procedure_and_consequences"
        name: "Порядок выхода учредителя из процесса учреждения и его последствия"
        risk_if_missing: |
          Если учредитель отказывается от участия до регистрации, процесс создания может встать. Без процедуры выхода (уведомление, срок), порядка распределения его будущей доли и возмещения понесенных расходов остальные учредители несут неопределенные риски.
        legal_base: "Договорная практика, ст. 450.1 ГК РФ"
        severity: "medium"
        affected_party: "seller"
        detection:
          positive_keywords:
            - "выход учредителя из договора"
            - "письменное уведомление за [срок]"
            - "распределение доли выходящего учредителя"
            - "возмещение фактически понесенных расходов"
          context_patterns:
            - '(?i)учредитель\s+вправе\s+выйти\s+из\s+договора.*уведомив\s+других'

      - clause_id: "reimbursement_of_organizer_expenses"
        name: "Возмещение расходов учредителю, взявшему на себя организационные функции"
        risk_if_missing: |
          Учредитель, взявший на себя основную работу по подготовке документов и взаимодействию с госорганами, несет временные и организационные издержки. Без права на компенсацию этих расходов или фиксированного вознаграждения его мотивация снижается, а бремя распределяется несправедливо.
        legal_base: "Договорная практика"
        severity: "medium"
        affected_party: "seller"
        detection:
          positive_keywords:
            - "возмещение расходов учредителя-организатора"
            - "организаторское вознаграждение"
            - "ответственный за регистрацию"
            - "компенсация временных затрат"
          context_patterns:
            - '(?i)учредитель\s+[ФИО],\s+ответственный\s+за\s+регистрацию.*имеет\s+право\s+на\s+возмещение'

  # ──────────────────────────────────────────────────────────
  # СЕКЦИЯ 4: ДОПОЛНИТЕЛЬНЫЕ PROTECTIVE CLAUSES
  # ──────────────────────────────────────────────────────────
  additional_protective_clauses:
    both_protection:
      - clause_id: "confidentiality_of_negotiations_and_terms"
        name: "Конфиденциальность переговоров и условий договора"
        risk_if_missing: |
          Идея бизнеса, коммерческие планы, структура собственности, информация об учредителях, раскрытые на этапе создания, могут быть использованы третьими лицами или бывшими участниками переговоров во вред, особенно если создание общества не состоялось.
        legal_base: "ст. 434.1 ГК РФ"
        severity: "medium"
        affected_party: "both"
        detection:
          positive_keywords:
            - "конфиденциальность условий договора"
            - "обязательство не разглашать информацию о создаваемом обществе"
            - "коммерческая тайна на этапе учреждения"
          context_patterns:
            - '(?i)стороны\s+обязуются\s+сохранять\s+конфиденциальность\s+информации.*связанной\s+с\s+учреждением'

      - clause_id: "dispute_resolution_and_jurisdiction"
        name: "Досудебный порядок урегулирования споров и подсудность"
        risk_if_missing: |
          Любые разногласия между учредителями на этапе создания могут привести к немедленному судебному разбирательству, что гарантированно сорвет сроки регистрации. Отсутствие соглашения о подсудности ведет к спорам о том, в какой суд обращаться.
        legal_base: "АПК РФ, ГПК РФ"
        severity: "high"
        affected_party: "both"
        detection:
          positive_keywords:
            - "досудебный порядок урегулирования споров"
            - "претензионный порядок"
            - "разрешение споров путем переговоров"
            - "подсудность споров"
            - "арбитражный суд [субъекта]"
          context_patterns:
            - '(?i)все\s+споры.*разрешаются\s+путём\s+переговоров.*претензионный\s+порядок'

      - clause_id: "post_registration_provisions_separability"
        name: "Выделение положений, действующих после регистрации, и их автономность"
        risk_if_missing: |
          Если договор содержит условия, которые учредители хотят сохранить в силе после регистрации ООО (о конфиденциальности, порядке разрешения споров между ними), они могут быть признаны недействующими из-за коллизии с уставом. Необходимо прямое указание на их автономность.
        legal_base: "ст. 422, 431.2 ГК РФ"
        severity: "medium"
        affected_party: "both"
        detection:
          positive_keywords:
            - "положения статей [номера] сохраняют силу после регистрации Общества"
            - "независимость (автономность) условий"
            - "действуют наряду с Уставом"
          context_patterns:
            - '(?i)положения\s+разделов\s+[X,Y]\s+остаются\s+в\s+силе\s+после\s+регистрации'

      - clause_id: "corporate_agreement_preview_or_obligation"
        name: "Предварительные условия или обязательство заключить корпоративный договор"
        risk_if_missing: |
          Договор об учреждении не регулирует отношения после регистрации. Без договоренности о ключевых условиях будущего корпоративного договора (порядок голосования, опционы, drag-along/tag-along) учредители могут оказаться в уязвимом положении сразу после создания общества.
        legal_base: "ст. 67.2 ГК РФ"
        severity: "medium"
        affected_party: "both"
        detection:
          positive_keywords:
            - "корпоративный договор"
            - "обязательство заключить корпоративный договор"
            - "предварительные условия корпоративного договора"
            - "право первого отказа"
            - "drag-along / tag-along"
          context_patterns:
            - '(?i)учредители\s+обязуются\s+заключить\s+корпоративный\s+договор\s+в\s+течение'