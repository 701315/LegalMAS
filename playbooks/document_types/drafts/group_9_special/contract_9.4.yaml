validation_metadata:
  validation_version: "2.0"
  last_updated: "2026-02-07"
  author: "Legal AI Team"

  # ──────────────────────────────────────────────────────────
  # СЕКЦИЯ 1: ПРИМЕНИМОЕ ЗАКОНОДАТЕЛЬСТВО
  # ──────────────────────────────────────────────────────────
  legal_base:
    primary:
      - "Семейный кодекс РФ, Глава 16 (ст. 99-105) — соглашение об уплате алиментов"
    secondary:
      - "ст. 99 СК РФ — заключение соглашения об уплате алиментов"
      - "ст. 100 СК РФ — форма соглашения об уплате алиментов (нотариальная), сила исполнительного листа"
      - "ст. 101 СК РФ — порядок заключения, исполнения, изменения, расторжения"
      - "ст. 102 СК РФ — признание недействительным соглашения, нарушающего интересы получателя"
      - "ст. 103 СК РФ — размер алиментов по соглашению на несовершеннолетних детей"
      - "ст. 104 СК РФ — способы и порядок уплаты алиментов по соглашению"
      - "ст. 105 СК РФ — индексация размера алиментов"
    related:
      - "СК РФ Главы 13-15 — алиментные обязательства членов семьи"
      - "ГК РФ (Глава 9 — сделки, Глава 29 — изменение и расторжение)"
      - "ФЗ от 02.10.2007 № 229-ФЗ «Об исполнительном производстве» (ст. 12)"
      - "Основы законодательства РФ о нотариате"
      - "Постановление Пленума ВС РФ от 26.12.2017 № 56 «О применении судами законодательства при рассмотрении дел, связанных со взысканием алиментов»"

  # ──────────────────────────────────────────────────────────
  # СЕКЦИЯ 2: ОБЯЗАТЕЛЬНЫЕ ЭЛЕМЕНТЫ ДОГОВОРА
  # ──────────────────────────────────────────────────────────
  essential_elements:
    - element: "notarial_form_and_executive_force"
      required: true
      legal_base: "ст. 100 СК РФ"
      description: "Явное указание на обязательность нотариального удостоверения и силу исполнительного листа. Без этого соглашение ничтожно."
      validation_rules:
        - "notarial_certification_mentioned"
        - "executive_force_mentioned"
      conditional_checks:
        - trigger: "alimony_agreement_keywords"
          keywords: ["алиментное соглашение", "соглашение об уплате алиментов"]
          rule: "notarial_form_mandatory"
          legal_base: "ст. 100 СК РФ"
          severity: "critical"
          risk_msg: "Алиментное соглашение без нотариального удостоверения является ничтожным."

    - element: "clear_identification_of_parties_and_beneficiary"
      required: true
      legal_base: "ст. 99 СК РФ"
      description: "Четкое указание плательщика, получателя (или его законного представителя) и лица, на содержание которого уплачиваются алименты."
      validation_rules:
        - "payer_identified"
        - "recipient_or_representative_identified"
        - "beneficiary_clearly_named"

    - element: "amount_and_method_of_payment"
      required: true
      legal_base: "ст. 103, 104 СК РФ"
      description: "Конкретный размер алиментов (в долях, твердой сумме, смешанно) и порядок их выплаты (сроки, способ)."
      validation_rules:
        - "amount_specified"
        - "payment_method_specified"
      conditional_checks:
        - trigger: "child_maintenance"
          keywords: ["несовершеннолетний ребенок", "алименты на ребенка", "до совершеннолетия"]
          rule: "minimum_amount_for_children"
          legal_base: "ст. 103 СК РФ"
          severity: "critical"
          risk_msg: "Размер алиментов на ребенка по соглашению не может быть ниже, чем по ст. 81 СК РФ."

    - element: "indexation_procedure_for_fixed_amount"
      required: true
      legal_base: "ст. 105 СК РФ"
      description: "Для алиментов в твердой сумме — указание на порядок индексации. По умолчанию — пропорционально росту прожиточного минимума."
      validation_rules:
        - "indexation_clause_present_for_fixed_amount"
      conditional_checks:
        - trigger: "fixed_amount_keywords"
          keywords: ["твердая денежная сумма", "в сумме", "ежемесячно в размере"]
          rule: "indexation_required_for_fixed_amount"
          legal_base: "ст. 105 СК РФ"
          severity: "high"
          risk_msg: "Для алиментов в твердой сумме закон устанавливает обязательную индексацию."

    - element: "term_of_agreement"
      required: true
      legal_base: "ст. 99, 120 СК РФ"
      description: "Срок действия соглашения (до совершеннолетия, до наступления иных условий)."
      validation_rules:
        - "term_specified"

  # ──────────────────────────────────────────────────────────
  # СЕКЦИЯ 3: ЗАЩИТНЫЕ УСЛОВИЯ (PROTECTIVE CLAUSES)
  # ──────────────────────────────────────────────────────────
  protective_clauses:
    # --- ЗАЩИТА ИНТЕРЕСОВ ПОЛУЧАТЕЛЯ АЛИМЕНТОВ (Recipient / Buyer Protection) ---
    buyer_protection:
      - clause_id: "protection_of_minimum_amount_for_children"
        name: "Гарантия минимального размера алиментов на детей"
        risk_if_missing: |
          Риск установления заниженного размера. Закон (ст. 103 СК РФ) устанавливает императивный минимум. Явное упоминание усиливает защиту.
        legal_base: "ст. 81, 103 СК РФ"
        severity: "critical"
        affected_party: "buyer"
        detection:
          positive_keywords:
            - "не ниже размера, установленного статьей 81 СК РФ"
            - "не менее 1/4 (одной четверти) заработка"
            - "соответствует размеру, который мог бы быть взыскан в судебном порядке"
          context_patterns:
            - '(?i)размер\s+алиментов\s+установлен\s+с\s+учётом\s+требований\s+ст.\s*81'

      - clause_id: "automatic_indexation_and_protection_from_inflation"
        name: "Автоматическая индексация твердой суммы"
        risk_if_missing: |
          Без индексации реальная покупательная способность алиментов снижается из-за инфляции.
        legal_base: "ст. 105 СК РФ"
        severity: "high"
        affected_party: "buyer"
        detection:
          positive_keywords:
            - "индексация размера алиментов"
            - "пропорционально росту величины прожиточного минимума"
            - "в соответствии со статьей 105 СК РФ"
          context_patterns:
            - '(?i)индексация\s+производится.*пропорционально.*прожиточному\s+минимуму'

      - clause_id: "penalty_for_late_payment"
        name: "Неустойка за просрочку платежа"
        risk_if_missing: |
          Отсутствие неустойки лишает получателя финансового рычага воздействия при задержках.
        legal_base: "ст. 115 СК РФ"
        severity: "high"
        affected_party: "buyer"
        detection:
          positive_keywords:
            - "неустойка (пеня) за просрочку"
            - "0,1% от суммы невыплаченных алиментов за каждый день просрочки"
          context_patterns:
            - '(?i)за\s+просрочку\s+уплаты.*уплачивается\s+неустойка'

      - clause_id: "detailed_payment_procedure_and_proof"
        name: "Детальный порядок выплаты и подтверждения"
        risk_if_missing: |
          Нерегулярные или недокументированные выплаты затрудняют доказательство оплаты и расчет задолженности.
        legal_base: "ст. 104 СК РФ"
        severity: "medium"
        affected_party: "buyer"
        detection:
          positive_keywords:
            - "не позднее [число] каждого месяца"
            - "путем перечисления на банковский счет"
            - "обязанность предоставить копию платежного поручения"
          context_patterns:
            - '(?i)алименты\s+перечисляются.*на\s+банковский\s+счет.*реквизиты'

    # --- ЗАЩИТА ИНТЕРЕСОВ ПЛАТЕЛЬЩИКА АЛИМЕНТОВ (Payer / Seller Protection) ---
    seller_protection:
      - clause_id: "flexibility_and_adjustment_mechanisms"
        name: "Механизмы корректировки при изменении обстоятельств"
        risk_if_missing: |
          При установлении твердой суммы плательщик несет риски при потере работы или снижении доходов. Без возможности пересмотра — тяжелое финансовое положение.
        legal_base: "ст. 101, 119 СК РФ"
        severity: "high"
        affected_party: "seller"
        detection:
          positive_keywords:
            - "при существенном изменении материального положения плательщика"
            - "право на пересмотр размера алиментов"
            - "досудебный порядок обсуждения изменений"
          context_patterns:
            - '(?i)в\s+случае\s+существенного\s+снижения\s+доходов\s+плательщик\s+вправе'

      - clause_id: "offset_of_additional_expenses"
        name: "Зачет дополнительных расходов на ребенка"
        risk_if_missing: |
          Дополнительные расходы на ребенка (лечение, образование) не учитываются в фиксированных алиментах, увеличивая бремя плательщика.
        legal_base: "ст. 86, 104 СК РФ"
        severity: "medium"
        affected_party: "seller"
        detection:
          positive_keywords:
            - "дополнительные расходы на ребенка"
            - "зачет произведенных расходов"
            - "оплата образования, лечения"
          context_patterns:
            - '(?i)расходы\s+на.*подлежат\s+зачёту\s+в\s+счёт\s+уплаты\s+алиментов'

      - clause_id: "clear_termination_conditions"
        name: "Четкие условия прекращения обязательств"
        risk_if_missing: |
          Неясность в дате окончания выплат может привести к спорам и попыткам взыскания после достижения ребенком совершеннолетия.
        legal_base: "ст. 120 СК РФ"
        severity: "high"
        affected_party: "seller"
        detection:
          positive_keywords:
            - "действует до достижения ребенком 18 лет"
            - "прекращается в случае смерти плательщика или получателя"
            - "при оспаривании отцовства"
          context_patterns:
            - '(?i)соглашение\s+утрачивает\s+силу\s+с\s+момента.*совершеннолетия'

  # ──────────────────────────────────────────────────────────
  # СЕКЦИЯ 4: ДОПОЛНИТЕЛЬНЫЕ PROTECTIVE CLAUSES
  # ──────────────────────────────────────────────────────────
  additional_protective_clauses:
    both_protection:
      - clause_id: "procedure_for_modification_and_termination"
        name: "Процедура изменения и расторжения"
        risk_if_missing: |
          Без четкой процедуры (письменное уведомление, переговоры, нотариальная форма) одна из сторон может быть связана несправедливыми условиями.
        legal_base: "ст. 101 СК РФ"
        severity: "high"
        affected_party: "both"
        detection:
          positive_keywords:
            - "изменение или расторжение соглашения"
            - "по взаимному согласию сторон"
            - "в нотариальной форме"
            - "письменное уведомление"
          context_patterns:
            - '(?i)любые\s+изменения\s+подлежат\s+нотариальному\s+удостоверению'

      - clause_id: "dispute_resolution_and_confidentiality"
        name: "Порядок разрешения споров и конфиденциальность"
        risk_if_missing: |
          Отсутствие досудебного порядка урегулирования усугубляет конфликты. Условия соглашения могут стать публичными.
        legal_base: "ГПК РФ, ГК РФ"
        severity: "medium"
        affected_party: "both"
        detection:
          positive_keywords:
            - "споры разрешаются путем переговоров"
            - "досудебный порядок урегулирования"
            - "конфиденциальность условий соглашения"
          context_patterns:
            - '(?i)споры.*разрешаются\s+путём\s+переговоров'
            - '(?i)условия\s+соглашения.*не\s+подлежат\s+разглашению'

    buyer_protection:
      - clause_id: "reporting_on_childs_needs"
        name: "Отчетность об использовании алиментов (для целевых выплат)"
        risk_if_missing: |
          Плательщик может подозревать нецелевое использование средств, что порождает конфликты. Отчетность повышает доверие.
        legal_base: "ст. 60 СК РФ"
        severity: "low"
        affected_party: "buyer"
        detection:
          positive_keywords:
            - "целевое использование алиментов"
            - "отчет об использовании средств"
            - "по требованию плательщика"
          context_patterns:
            - '(?i)получатель\s+обязуется\s+по\s+требованию.*предоставлять\s+отчёт'

    seller_protection:
      - clause_id: "offset_and_credit_of_overpayment"
        name: "Зачет переплаты и авансовых платежей"
        risk_if_missing: |
          Без условия о зачете плательщик может не получить возврат при ошибочной переплате или авансе.
        legal_base: "ГК РФ ст. 410–412"
        severity: "medium"
        affected_party: "seller"
        detection:
          positive_keywords:
            - "зачет переплаты"
            - "авансовый платеж"
            - "в счет будущих платежей"
          context_patterns:
            - '(?i)переплата.*зачитывается\s+в\s+счёт\s+будущих\s+платежей'