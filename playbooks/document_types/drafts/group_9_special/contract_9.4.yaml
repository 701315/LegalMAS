type: contract_9.4
name: Алиментное соглашение (соглашение об уплате алиментов)
description: |
  Соглашение между лицом, обязанным уплачивать алименты (плательщиком), и лицом, имеющим право на их получение (получателем) или его законным представителем. Определяет размер, условия, порядок и сроки выплаты средств на содержание.
  Заключается в отношении: несовершеннолетних детей, нетрудоспособных совершеннолетних детей, супруга (бывшего супруга), родителей, других членов семьи.
  **Требует обязательного нотариального удостоверения.** Имеет силу исполнительного листа — при неисполнении может быть предъявлено в службу судебных приставов для принудительного взыскания без обращения в суд.
version: 2.0
parent: class_9_special_imperative
metadata:
  category: contract
  subcategory: family_law
  complexity: medium-high
  risk_level: high
  legal_base: "Семейный кодекс РФ (Глава 16, ст. 99–105)"

# ════════════════════════════════════════════════════════════
# БАЗОВАЯ ИНФОРМАЦИЯ (LEGACY SECTIONS — ОПТИМИЗИРОВАНО)
# ════════════════════════════════════════════════════════════
rules:
  keywords:
    high:
      - "алиментное соглашение"
      - "соглашение об уплате алиментов"
      - "плательщик алиментов"
      - "получатель алиментов"
      - "нотариальное удостоверение"
      - "исполнительный лист"
    medium:
      - "размер алиментов"
      - "твердая денежная сумма"
      - "доля от заработка"
      - "индексация алиментов"
      - "несовершеннолетний ребенок"
      - "содержание ребенка"
    low:
      - "порядок выплаты"
      - "срок действия"
      - "неустойка"
      - "прожиточный минимум"
      - "судебные приставы"
  phrases:
    high:
      - Плательщик обязуется уплачивать алименты на содержание
      - настоящее соглашение подлежит нотариальному удостоверению
      - настоящее соглашение имеет силу исполнительного листа
      - алименты выплачиваются ежемесячно
      - размер алиментов составляет
    medium:
      - в твердой денежной сумме
      - в долях от заработка (дохода)
      - индексация производится пропорционально росту прожиточного минимума
      - до достижения ребенком совершеннолетия
      - неустойка за просрочку выплаты
  patterns:
    required:
      - (?i)(алиментн\w+\s+соглашени\w+|соглашени\w+\s+об\s+уплате\s+алимент\w+)
    optional:
      - (?i)(плательщик\s+алимент\w+|получатель\s+алимент\w+)
      - (?i)(нотариальн\w+\s+удостоверени\w+|исполнительн\w+\s+лист)
      - (?i)(твёрд\w+\s+денежн\w+\s+сумм\w+|\d+/\d+\s+дол\w+)
  exclusions:
    - судебное решение о взыскании алиментов
    - судебный приказ о взыскании алиментов
    - добровольные выплаты без нотариального соглашения
    - обязательства по содержанию из брачного договора
  exclusion_logic:
    - condition: "court_decision_keywords AND enforcement_sheet"
      target: "rejection"
      confidence: 0.95
      description: "Судебный акт, а не добровольное соглашение сторон"
    - condition: "informal_payments AND no_notarial_form"
      target: "rejection"
      confidence: 0.85
      description: "Отсутствие нотариальной формы — ключевой признак ничтожности алиментного соглашения"
  weights:
    keyword_high: 3.0
    keyword_medium: 1.5
    keyword_low: 0.5
    phrase_high: 2.5
    phrase_medium: 1.0
    pattern_required: 4.0
    pattern_optional: 1.0
  classification:
    min_confidence: 0.75
    max_matches: 3

party_roles:
  - "Плательщик алиментов (лицо, обязанное уплачивать алименты: родитель, супруг, совершеннолетний ребенок, иной член семьи)"
  - "Получатель алиментов (лицо, имеющее право на получение алиментов: ребенок, супруг, родитель) или его законный представитель (второй родитель, опекун, попечитель)"

essential_terms:
  - "Предмет соглашения (лицо, на содержание которого уплачиваются алименты, основание обязанности)."
  - "Размер алиментов (в долях от заработка/иного дохода, в твердой денежной сумме, в смешанной форме)."
  - "Порядок, сроки и способ выплаты (ежемесячно, перечисление на счет, наличными под расписку)."
  - "Срок действия соглашения (до достижения ребенком 18 лет, до восстановления трудоспособности)."
  - "Порядок индексации алиментов, уплачиваемых в твердой сумме."

specific_risks:
  - "**Для получателя (чаще ребенка):** Установление размера ниже того, который мог бы быть взыскан через суд (для детей — ниже размеров ст. 81 СК РФ: 1/4, 1/3, 1/2 заработка). Такое соглашение может быть оспорено в интересах ребенка."
  - "**Для плательщика:** Финансовое бремя твердой суммы при потере работы или снижении доходов. Риск принудительного взыскания через приставов без суда."
  - "**Для обеих сторон:** Риск оспаривания соглашения в суде, если его условия существенно нарушают интересы несовершеннолетнего или нетрудоспособного получателя (ст. 102 СК РФ)."
  - "**Процедурный риск:** Несоблюдение обязательной нотариальной формы влечет недействительность (ничтожность) соглашения (ст. 100 СК РФ)."

aliases:
  - Алиментное соглашение
  - Соглашение об уплате алиментов
  - Нотариальное соглашение об алиментах
  - Соглашение о содержании ребенка
  - Child Support Agreement

section_markers:
  - Преамбула (стороны, основание алиментной обязанности)
  - Предмет соглашения (лицо, на содержание которого уплачиваются алименты)
  - Размер, форма и порядок выплаты алиментов
  - Сроки и способ выплаты
  - Порядок индексации размера алиментов
  - Права и обязанности сторон
  - Ответственность за просрочку выплаты (неустойка)
  - Срок действия соглашения
  - Порядок изменения и расторжения соглашения
  - Заключительные положения (расходы на нотариуса, экземпляры)
  - Подписи сторон

notes: |
  КРИТИЧЕСКИ ВАЖНЫЕ АСПЕКТЫ (императивные ограничения):
  1.  **Обязательная нотариальная форма** (ст. 100 СК РФ). Несоблюдение влечет ничтожность.
  2.  **Минимальный размер для детей:** Размер алиментов на несовершеннолетних детей по соглашению не может быть ниже размера по ст. 81 СК РФ (1/4, 1/3, 1/2 заработка). Нотариус обязан это проверить.
  3.  **Сила исполнительного листа:** Соглашение является исполнительным документом (ст. 100 СК РФ) для предъявления приставам.
  4.  **Индексация алиментов в твердой сумме** производится пропорционально росту прожиточного минимума, если соглашением не установлен иной порядок (ст. 105 СК РФ).
  5.  **Изменение/расторжение:** По взаимному согласию сторон в нотариальной форме. В судебном порядке — при существенном изменении обстоятельств (ст. 101 СК РФ).

