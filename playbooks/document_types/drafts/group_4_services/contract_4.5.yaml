type: contract_4.5
name: Договор страхования
description: |
  Соглашение, по которому страховщик обязуется за плату (страховую премию) при наступлении определенного 
  события (страхового случая) возместить убытки (имущественное страхование) или выплатить страховую сумму 
  (личное страхование). Регулируется Гл. 48 ГК РФ и Законом № 4015-1 «Об организации страхового дела».
  Характеризуется сильной формализованностью, может заключаться путем составления одного документа или 
  вручения Страхового полиса. Договор вступает в силу с момента уплаты премии (ст. 957 ГК РФ), если в нем 
  не написано иное.
version: 2.2
parent: class_4_service_provision
sibling_contracts:
  - contract_4.1 # Возмездное оказание услуг (родственная категория)
  - contract_2.3 # Аренда ТС с экипажем (часто включает условия о КАСКО)
  - contract_4.2 # Перевозка (включает страхование груза)
metadata:
  category: contract
  subcategory: financial_services
  complexity: high
  risk_level: high
  legal_base: Глава 48 ГК РФ (ст. 927-970) + Закон № 4015-1
  hierarchy_position: "specialized_insurance"

# ════════════════════════════════════════════════════════════
# БАЗОВАЯ ИНФОРМАЦИЯ (OPTIMIZED HYBRID)
# ════════════════════════════════════════════════════════════
rules:
  keywords:
    high:
      - "Страховщик"
      - "Страхователь"
      - "Страховой полис"
      - "Страховая премия"
      - "Страховая выплата"
      - "страховой случай"
      - "страховая сумма"
      - "выгодоприобретатель"
    medium:
      - "застрахованное лицо"
      - "франшиза"
      - "страховой риск"
      - "Правила страхования"
      - "имущественное страхование"
      - "личное страхование"
      - "обязательное страхование"
    low:
      - "суброгация"
      - "абандон"
      - "тоталь полная гибель"
      - "ОСАГО"
      - "КАСКО"
      - "страхование жизни"
      - "страхование ответственности"
  phrases:
    high:
      - Страховщик обязуется выплатить страховое возмещение
      - Договор заключен на основании Правил страхования
      - Страхователь обязан уплатить страховую премию
      - При наступлении страхового случая
      - Страховая сумма является пределом ответственности страховщика
      - Ссылка на Правила страхования в полисе делает их обязательными для Страхователя
    medium:
      - Страховщик вправе оценивать страховой риск (осмотр, запрос документов)
      - При наступлении страхового случая страхователь обязан принять разумные меры для уменьшения убытков
      - Франшиза освобождает страховщика от возмещения убытков в определенном размере
  patterns:
    required:
      - (?i)(страхов.*полис|страхован|страховщик|страхователь|страховой.*случай)
    optional:
      - (?i)(премия|выплата|франшиза|риск|выгодоприобретатель)
  exclusions:
    - социальное страхование (ОМС, ПФР — публичное право)
    - банковская гарантия (способ обеспечения, а не услуга)
    - поручительство
    - игра, пари
  exclusion_logic:
    - condition: "social_security_terms AND mandatory_participation"
      target: "reject:social_insurance"
      confidence: 0.95
      description: "Если предусмотрено обязательное участие в государственной системе - это социальное страхование"
    - condition: "guarantee_for_debt AND no_premium_payment"
      target: "reclassify:suretyship"
      confidence: 0.90
      description: "Если лицо обязуется отвечать за долг другого без уплаты премии - это поручительство"
  weights:
    keyword_high: 3.5
    keyword_medium: 1.5
    keyword_low: 0.5
    phrase_high: 4.0
    phrase_medium: 1.0
    pattern_required: 5.0
    pattern_optional: 1.0
  classification:
    min_confidence: 0.90
    max_matches: 2

party_roles:
  - Страховщик (Insurer) — страховая компания (лицензия ЦБ РФ обязательна)
  - Страхователь (Policyholder) — плательщик страховой премии
  - Выгодоприобретатель (Beneficiary) — получатель страховой выплаты
  - Застрахованное лицо (Insured Person) — чьи интересы защищаются

essential_terms:
  - Объект страхования (имущественный интерес, жизнь, здоровье, ответственность)
  - Страховой случай (событие, при наступлении которого производится выплата)
  - Страховая сумма (лимит выплаты, не может превышать действительную стоимость имущества)
  - Срок действия договора (период, в который должен произойти случай)

specific_risks:
  - Отказ в выплате из-за "нестрахового случая" (мелкий шрифт в Правилах страхования)
  - Уведомление с опозданием (ст. 961 ГК РФ дает право на отказ)
  - Неполное раскрытие информации при заключении (признание недействительным по ст. 944 ГК РФ)
  - Страховое мошенничество, недооценка риска страховщиком
  - Неисполнение обязательств страховщиком (банкротство, отзыв лицензии)
  - Споры о наличии/отсутствии страхового случая и размере ущерба

aliases:
  - Страховой полис
  - Генеральный полис
  - Insurance Policy
  - Договор добровольного страхования
  - Полис страхования

section_markers:
  - Объект страхования (интерес)
  - Страховые риски (случаи) и исключения из покрытия
  - Страховая сумма и франшиза
  - Страховая премия (взнос) и порядок уплаты
  - Права и обязанности сторон
  - Действия при наступлении страхового случая
  - Порядок определения ущерба и страховой выплаты
  - Срок действия договора
  - Суброгация (переход права требования)
  - Порядок урегулирования споров
  - Заключительные положения

notes: |
  ОСОБЕННОСТИ И ПРАВИЛА ПРИМЕНЕНИЯ:
  1. Договор вступает в силу с момента уплаты премии (ст. 957 ГК РФ), если в нем не написано иное
  2. Ссылка на Правила страхования в полисе делает их обязательными для Страхователя (ст. 943 ГК РФ)
  3. Обязательное страхование (ОСАГО, страхование опасных объектов) регулируется специальными законами
  4. При страховании имущества действует принцип суброгации - переход к страховщику права требования к причинителю (ст. 965 ГК РФ)
  5. Для страхования граждан применяется Закон о защите прав потребителей

# ════════════════════════════════════════════════════════════
# 🆕 ВАЛИДАЦИОННЫЕ СЕКЦИИ (VALIDATION ENGINE v2.0) - HYBRID PRO
# ════════════════════════════════════════════════════════════

validation_metadata:
  validation_version: "2.2"
  last_updated: "2026-02-07"
  author: "Legal AI Team (Insurance Hybrid Pro)"

  # ──────────────────────────────────────────────────────────
  # СЕКЦИЯ 1: ПРИМЕНИМОЕ ЗАКОНОДАТЕЛЬСТВО (оптимизированное)
  # ──────────────────────────────────────────────────────────
  legal_base:
    primary:
      - "Глава 48 ГК РФ (ст. 927-970) - общие положения"
      - "Закон РФ от 27.11.1992 № 4015-1 «Об организации страхового дела в РФ»"
    secondary:
      - "ст. 942 ГК РФ - существенные условия договора"
      - "ст. 943 ГК РФ - правила страхования"
      - "ст. 957 ГК РФ - момент вступления в силу"
      - "ст. 961 ГК РФ - уведомление о страховом случае"
    related:
      - "Федеральный закон от 25.04.2002 № 40-ФЗ «Об ОСАГО»"
      - "Постановление Пленума ВС РФ № 20 «О применении законодательства о добровольном страховании»"
      - "Закон РФ от 07.02.1992 № 2300-1 «О защите прав потребителей» (для страхования граждан)"

  # ──────────────────────────────────────────────────────────
  # СЕКЦИЯ 2: ОБЯЗАТЕЛЬНЫЕ ЭЛЕМЕНТЫ (ESSENTIALIA NEGOTII)
  # ──────────────────────────────────────────────────────────
  essential_elements:
    - element: "insured_interest_object"
      name: "Объект страхования (Интерес)"
      required: true
      legal_base: "ст. 942 ГК РФ"
      description: "Четкое указание: имущество, ответственность, жизнь, здоровье. Нельзя страховать противоправные интересы."
      validation_rules:
        - "presence_check"
        - "interest_check"
        - "legal_object_check"
    
    - element: "insured_event_definition"
      name: "Страховой случай"
      required: true
      legal_base: "ст. 942 ГК РФ"
      description: "Событие, при наступлении которого платится возмещение. Должно обладать признаками вероятности и случайности. Исключения должны быть явными."
      validation_rules:
        - "presence_check"
        - "event_definition_check"
        - "exclusions_clarity_check"
    
    - element: "sum_insured_limit"
      name: "Страховая сумма"
      required: true
      legal_base: "ст. 942, 947, 951 ГК РФ"
      description: "Лимит выплаты. Для имущества не может превышать его действительную стоимость на момент заключения договора."
      validation_rules:
        - "presence_check"
        - "limit_check"
        - "reasonable_amount_check"
    
    - element: "contract_term_duration"
      name: "Срок действия"
      required: true
      legal_base: "ст. 942, 957 ГК РФ"
      description: "Период, в который должен произойти страховой случай. Договор вступает в силу с момента уплаты премии."
      validation_rules:
        - "term_dates_check"
        - "effective_date_specified"

  # ──────────────────────────────────────────────────────────
  # СЕКЦИЯ 3: ЗАЩИТНЫЕ УСЛОВИЯ (PROTECTIVE CLAUSES) - OPTIMIZED
  # ──────────────────────────────────────────────────────────
  protective_clauses:
    
    # --- ЗАЩИТА СТРАХОВАТЕЛЯ (Policyholder Protection) ---
    policyholder_protection:
      - clause_id: "rules_attachment_proof"
        name: "Доказательство вручения Правил страхования"
        risk_if_missing: |
          Условия часто прописаны в Правилах страхования (многостраничный документ). 
          Если в Полисе нет отметки "Правила получил", страховщик не может ссылаться на них при отказе (ст. 943 ГК РФ).
          Критично иметь доказательство вручения.
        legal_base: "ст. 943 ГК РФ"
        severity: "critical"
        affected_party: "policyholder"
        detection:
          positive_keywords:
            - "Правила страхования вручены"
            - "с Правилами ознакомлен"
            - "получил на руки"
            - "экземпляр Правил прилагается"
            - "отметка о получении Правил"
          context_patterns:
            - '(?i)страхователь.*подтверждает.*что.*получил.*экземпляр.*правил.*страхования'
      
      - clause_id: "franchise_type_clarity"
        name: "Ясность типа и размера франшизы"
        risk_if_missing: |
          Франшиза — часть убытка, которую не платит страховщик. Безусловная франшиза вычитается всегда, 
          условная — только если убыток меньше установленного размера. Непонимание ведет к разочарованию при выплате.
        legal_base: "ст. 9 Закона № 4015-1"
        severity: "high"
        affected_party: "policyholder"
        detection:
          positive_keywords:
            - "безусловная франшиза"
            - "условная франшиза"
            - "невозмещаемая часть"
            - "размер франшизы"
            - "франшиза в размере"
            - "вычет из страхового возмещения"
          context_patterns:
            - '(?i)безусловная.*франшиза.*в.*размере.*\d+.*рублей.*вычитается.*из.*суммы.*возмещения'
      
      - clause_id: "claims_payment_deadlines"
        name: "Четкие сроки и перечень документов для выплаты"
        risk_if_missing: |
          Страховщики могут затягивать выплату, требуя "все необходимые документы" без конкретики. 
          Нужен исчерпывающий перечень и четкий срок (например, 15 рабочих дней с момента предоставления полного комплекта).
        legal_base: "ЗоЗПП ст. 31 (для граждан), ст. 12.1 Закона № 4015-1"
        severity: "high"
        affected_party: "policyholder"
        detection:
          positive_keywords:
            - "в течение рабочих дней"
            - "с момента получения полного комплекта"
            - "исчерпывающий перечень документов"
            - "срок выплаты страхового возмещения"
            - "перечень прилагаемых документов"
            - "штраф за просрочку выплаты"
          context_patterns:
            - '(?i)страховщик.*обязан.*произвести.*выплату.*в.*течение.*\d+.*рабочих.*дней.*с.*момента'
    
    # --- ЗАЩИТА СТРАХОВЩИКА (Insurer Protection) ---
    insurer_protection:
      - clause_id: "notification_duty_timing"
        name: "Срок и способ уведомления о страховом случае"
        risk_if_missing: |
          Если страхователь поздно сообщил о случае (пожар, ДТП), страховщик не может расследовать причины и оценить ущерб.
          Ст. 961 ГК РФ дает право отказать в выплате при просрочке уведомления. Нужны четкие сроки и способы уведомления.
        legal_base: "ст. 961 ГК РФ"
        severity: "high"
        affected_party: "insurer"
        detection:
          positive_keywords:
            - "незамедлительно уведомить"
            - "в течение 24 часов"
            - "сообщить любым доступным способом"
            - "уведомление по телефону"
            - "письменное уведомление"
            - "последствия несвоевременного уведомления"
          context_patterns:
            - '(?i)страхователь.*обязан.*уведомить.*страховщика.*о.*наступлении.*страхового.*случая.*в.*течение.*\d+.*часов'
      
      - clause_id: "subrogation_rights_preservation"
        name: "Сохранение права суброгации"
        risk_if_missing: |
          После выплаты возмещения страховщик имеет право взыскать сумму с виновника (ст. 965 ГК РФ).
          Договор может исключать это право (что невыгодно страховщику). Нужно проверять, что суброгация не исключена.
        legal_base: "ст. 965 ГК РФ"
        severity: "medium"
        affected_party: "insurer"
        detection:
          positive_keywords:
            - "переходит право требования"
            - "к лицу, ответственному за убытки"
            - "право суброгации"
            - "обязанность передать документы"
            - "возмещение выплаченного возмещения"
          negative_keywords:
            - "без права суброгации"
            - "отказ от права требования"
          context_patterns:
            - '(?i)после.*выплаты.*страхового.*возмещения.*к.*страховщику.*переходит.*право.*требования'

  # ──────────────────────────────────────────────────────────
  # СЕКЦИЯ 4: ДОПОЛНИТЕЛЬНЫЕ PROTECTIVE CLAUSES
  # ──────────────────────────────────────────────────────────
  additional_protective_clauses:
    
    # Исключения из покрытия (самый важный раздел)
    policyholder_protection:
      - clause_id: "exclusions_transparency_check"
        name: "Прозрачность исключений из страхового покрытия"
        risk_if_missing: |
          Самый важный раздел. Обычно не платят за: умысел, ядерный взрыв, военные действия (ст. 964), 
          грубую неосторожность (иногда). Страхователь должен четко видеть "что НЕ является страховым случаем".
          Размытые формулировки ("иные обстоятельства") недопустимы.
        legal_base: "ст. 963, 964 ГК РФ"
        severity: "critical"
        affected_party: "policyholder"
        detection:
          positive_keywords:
            - "не является страховым случаем"
            - "исключения из страхового покрытия"
            - "отказ в выплате"
            - "грубая неосторожность"
            - "умысел страхователя"
            - "военные действия"
            - "ядерный взрыв"
            - "гражданские волнения"
          negative_keywords:
            - "иные обстоятельства"
            - "по усмотрению страховщика"
            - "непредвиденные обстоятельства"
          context_patterns:
            - '(?i)выплата.*не.*производится.*при.*наступлении.*следующих.*событий'
    
    # Материальные факты (для страховщика)
    insurer_protection:
      - clause_id: "material_facts_disclosure_consequences"
        name: "Раскрытие существенных обстоятельств и последствия сокрытия"
        risk_if_missing: |
          Страхователь может скрыть важную информацию (техническое состояние, заболевания, предыдущие случаи).
          Без явного обязательства и последствий страховщик не сможет отказать в выплате или расторгнуть договор.
        legal_base: "ст. 944, 951 ГК РФ"
        severity: "critical"
        affected_party: "insurer"
        detection:
          positive_keywords:
            - "обязан сообщить все известные обстоятельства"
            - "существенные для оценки риска"
            - "последствия сокрытия информации"
            - "право отказать в выплате"
            - "расторжение договора"
            - "опросный лист"
            - "анкета страхователя"
          context_patterns:
            - '(?i)страхователь.*обязан.*сообщить.*страховщику.*все.*известные.*ему.*обстоятельства.*имеющие.*существенное.*значение'
    
    # Для обязательного страхования
    policyholder_protection:
      - clause_id: "compulsory_insurance_law_reference"
        name: "Ссылка на специальный закон для обязательного страхования"
        risk_if_missing: |
          Для ОСАГО, страхования опасных объектов действуют специальные законы с фиксированными тарифами, лимитами.
          Если договор не ссылается на соответствующий закон, могут применяться не те правила.
        legal_base: "ФЗ № 40-ФЗ (ОСАГО), ФЗ № 225-ФЗ (опасные объекты)"
        severity: "critical"
        affected_party: "policyholder"
        detection:
          positive_keywords:
            - "в соответствии с Федеральным законом"
            - "обязательное страхование"
            - "ОСАГО"
            - "страхование опасных объектов"
            - "установленные тарифы"
            - "лимиты ответственности"
          context_patterns:
            - '(?i)договор.*заключается.*в.*соответствии.*с.*Федеральным.*законом.*№.*40.*ФЗ.*.*Об.*ОСАГО'
        conditional_checks:
          - trigger: "compulsory_insurance_keywords"
            keywords: ["ОСАГО", "обязательное", "опасный объект", "гражданская ответственность"]
            rule: "compulsory_insurance_law_reference_required"
            severity: "critical"