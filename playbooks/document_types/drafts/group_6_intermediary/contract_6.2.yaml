validation_metadata:
  validation_version: "2.0"
  last_updated: "2026-02-07"
  author: "Legal AI Team (Integrated)"

  # ──────────────────────────────────────────────────────────
  # СЕКЦИЯ 1: ПРИМЕНИМОЕ ЗАКОНОДАТЕЛЬСТВО
  # ──────────────────────────────────────────────────────────
  legal_base:
    primary:
      - "Глава 51 ГК РФ (ст. 990–1004) — договор комиссии"
    secondary:
      - "ст. 992 ГК РФ — дополнительная выгода"
      - "ст. 993 ГК РФ — делькредере (ручательство за третье лицо)"
      - "ст. 995 ГК РФ — ответственность за отступление от указаний о цене"
      - "ст. 997 ГК РФ — право удержания комиссионера"
      - "ст. 1003, 1004 ГК РФ — отмена поручения и отказ от договора"
    related:
      - "ФЗ от 26.10.2002 № 127-ФЗ 'О несостоятельности (банкротстве)' (ст. 134 — обособление имущества)"
      - "Постановление Правительства РФ от 06.06.1998 № 569 'Правила комиссионной торговли'"
      - "НК РФ ст. 156 (НДС при комиссии), ст. 251 п. 1 пп. 9 (средства комитента не доход)"
      - "Информационное письмо Президиума ВАС РФ от 17.11.2004 № 85"
      - "Закон РФ от 07.02.1992 № 2300-1 'О защите прав потребителей' (для розничной комиссии)"

  # ──────────────────────────────────────────────────────────
  # СЕКЦИЯ 2: ОБЯЗАТЕЛЬНЫЕ ЭЛЕМЕНТЫ ДОГОВОРА
  # ──────────────────────────────────────────────────────────
  essential_elements:
    - element: "subject_specific_transactions"
      required: true
      legal_base: "ст. 432, 990 ГК РФ"
      description: "Определенный перечень или критерии сделок, которые комиссионер обязуется совершить (вид, товар, параметры)"
      validation_rules:
        - "transactions_description_present"
        - "scope_of_mandate_clear"
      risk_if_missing: "Без определенного предмета договор считается незаключенным"
      conditional_checks:
        - trigger: "commission_keywords"
          keywords: ["комиссия", "совершить сделки", "от своего имени"]
          rule: "subject_must_be_defined"
          legal_base: "ст. 990 ГК РФ"
          severity: "critical"

    - element: "commission_remuneration"
      required: true
      legal_base: "ст. 990, 991 ГК РФ"
      description: "Размер, порядок и сроки выплаты вознаграждения комиссионеру (договор всегда возмездный)"
      validation_rules:
        - "remuneration_amount_specified"
        - "payment_procedure_defined"
      risk_if_missing: "Отсутствие условия о вознаграждении не делает договор безвозмездным; ведет к спорам по ст. 424 ГК РФ."

    - element: "price_terms_limitation"
      required: true
      legal_base: "ст. 990, 995 ГК РФ"
      description: "Ценовые условия совершения сделок: минимальная цена продажи / максимальная цена закупки"
      validation_rules:
        - "price_limits_specified"
      conditional_checks:
        - trigger: "sale_commission"
          keywords: ["продажа", "реализация", "продать"]
          rule: "minimum_price_specified"
          legal_base: "ст. 995 ГК РФ"
          severity: "critical"
          risk_msg: "Продажа ниже установленной цены без согласия комитента влечет обязанность возместить разницу"
        - trigger: "purchase_commission"
          keywords: ["закупка", "приобретение", "купить"]
          rule: "maximum_price_specified"
          legal_base: "ст. 995 ГК РФ"
          severity: "critical"

    - element: "ownership_preservation_clause"
      required: true
      legal_base: "ст. 996 ГК РФ"
      description: "Прямое указание на сохранение права собственности на товар за комитентом"
      validation_rules:
        - "ownership_clause_present"
      risk_if_missing: "Риск признания товара собственностью комиссионера, особенно при банкротстве последнего."

  # ──────────────────────────────────────────────────────────
  # СЕКЦИЯ 3: ЗАЩИТНЫЕ УСЛОВИЯ (PROTECTIVE CLAUSES)
  # ──────────────────────────────────────────────────────────
  protective_clauses:
    
    # --- ЗАЩИТА КОМИТЕНТА (Principal Protection) ---
    principal_protection:
      - clause_id: "segregation_and_bankruptcy_protection"
        name: "Обособление имущества комитента и защита от взыскания по долгам комиссионера"
        risk_if_missing: |
          Без условия об обособленном учете и прямого запрета товар комитента может быть включен
          в конкурсную массу при банкротстве комиссионера или арестован за его долги.
          Доказывание права собственности в суде — длительный и затратный процесс.
        legal_base: "ст. 996 ГК РФ, ст. 134 ФЗ-127 'О банкротстве'"
        severity: "critical"
        affected_party: "principal"
        detection:
          positive_keywords:
            - "имущество комитента учитывается на отдельном балансе"
            - "не подлежит взысканию по долгам комиссионера"
            - "обособленный учет"
            - "раздельное хранение"
            - "маркировка товара комитента"
          context_patterns:
            - '(?i)товар\s+комитента\s+не\s+может\s+быть\s+обращен\s+взыскание\s+по\s+долгам\s+комиссионера'

      - clause_id: "proceeds_transfer_timing"
        name: "Сроки перечисления выручки комитенту"
        risk_if_missing: |
          Без четких сроков комиссионер может задерживать средства комитента, используя их
          в обороте. При банкротстве комиссионера деньги на его счетах включаются в конкурсную
          массу, и комитент становится обычным кредитором.
        legal_base: "ст. 999 ГК РФ"
        severity: "critical"
        affected_party: "principal"
        detection:
          positive_keywords:
            - "перечисление выручки"
            - "срок перечисления"
            - "не позднее X рабочих дней"
            - "обособленный счет для расчетов"
          context_patterns:
            - '(?i)комиссионер\s+обязан\s+перечислить\s+выручку\s+комитенту\s+в\s+течение\s+[0-9]+\s+(дней|рабочих\s+дней)'

      - clause_id: "report_approval_and_dispute_procedure"
        name: "Порядок утверждения отчета и оспаривания"
        risk_if_missing: |
          Комитент обязан утвердить отчет или сообщить о возражениях (ст. 999 ГК РФ). Без срока и процедуры
          комиссионер может считать отчет утвержденным молчанием, а комитент лишается возможности
          оспорить необоснованные расходы или невыгодные условия сделки.
        legal_base: "ст. 999 ГК РФ"
        severity: "high"
        affected_party: "principal"
        detection:
          positive_keywords:
            - "срок утверждения отчета"
            - "порядок заявления возражений"
            - "молчание считается согласием"
            - "мотивированный отказ"
            - "процедура урегулирования разногласий"
          context_patterns:
            - '(?i)отчет\s+считается\s+утвержденным,\s+если\s+в\s+течение\s+[0-9]+\s+дней\s+не\s+поступят\s+возражения'

    # --- ЗАЩИТА КОМИССИОНЕРА (Commissioner Protection) ---
    commissioner_protection:
      - clause_id: "reimbursement_of_expenses_procedure"
        name: "Порядок возмещения комиссионеру расходов"
        risk_if_missing: |
          Комитент обязан возместить комиссионеру израсходованные на исполнение поручения суммы (ст. 1001 ГК РФ).
          Без процедуры (смета, аванс, отчет с чеками) комитент может оспорить необходимость и размер расходов.
          Особенно рисковы транспортные, складские, рекламные расходы.
        legal_base: "ст. 1001 ГК РФ"
        severity: "critical"
        affected_party: "commissioner"
        detection:
          positive_keywords:
            - "возмещение необходимых расходов"
            - "аванс на расходы"
            - "смета расходов"
            - "документальное подтверждение расходов"
            - "срок возмещения"
          context_patterns:
            - '(?i)комитент\s+обязуется\s+возместить\s+комиссионеру\s+фактически\s+понесенные\s+расходы'

      - clause_id: "right_of_retention_clause"
        name: "Закрепление права удержания в обеспечение своих требований"
        risk_if_missing: |
          Комиссионер вправе удерживать причитающиеся ему суммы из денег, поступивших за счет комитента (ст. 997 ГК РФ).
          Без явного закрепления комитент может требовать передачи всей выручки до расчета, создавая риск
          неполучения вознаграждения и невозмещения расходов.
        legal_base: "ст. 997 ГК РФ"
        severity: "high"
        affected_party: "commissioner"
        detection:
          positive_keywords:
            - "право удержания"
            - "удерживать причитающиеся суммы"
            - "обеспечение требований комиссионера"
            - "из поступивших денежных средств"
          context_patterns:
            - '(?i)комиссионер\s+вправе\s+удерживать\s+причитающиеся\s+ему\s+суммы\s+из\s+всех\s+средств,\s+поступивших\s+от\s+комитента'

  # ──────────────────────────────────────────────────────────
  # СЕКЦИЯ 4: ДОПОЛНИТЕЛЬНЫЕ PROTECTIVE CLAUSES
  # ──────────────────────────────────────────────────────────
  additional_protective_clauses:
    
    # Защита комитента
    principal_protection:
      - clause_id: "subcommission_control"
        name: "Контроль привлечения субкомиссионера"
        risk_if_missing: |
          Комиссионер вправе привлечь субкомиссионера, оставаясь ответственным перед комитентом (ст. 994 ГК РФ).
          Без условия о предварительном согласовании комитент сталкивается с неизвестным и, возможно,
          ненадежным субкомиссионером, что увеличивает риски.
        legal_base: "ст. 994 ГК РФ"
        severity: "high"
        affected_party: "principal"
        detection:
          positive_keywords:
            - "субкомиссия допускается с письменного согласия комитента"
            - "запрет на субкомиссию"
            - "комиссионер отвечает за действия субкомиссионера"
          context_patterns:
            - '(?i)привлечение\s+субкомиссионера\s+допускается\s+только\s+с\s+предварительного\s+согласия\s+комитента'

      - clause_id: "unsold_goods_return_procedure"
        name: "Порядок возврата нереализованного товара"
        risk_if_missing: |
          При прекращении договора комиссионер обязан возвратить товар комитенту. Без четкого порядка,
          сроков и условий возврата (состояние товара, расходы) комитент рискует потерять товар
          или получить его в ненадлежащем состоянии.
        legal_base: "ст. 996, 1003 ГК РФ"
        severity: "high"
        affected_party: "principal"
        detection:
          positive_keywords:
            - "возврат нереализованного товара"
            - "срок возврата товара"
            - "акт возврата"
            - "расходы на возврат"
            - "состояние товара при возврате"
          context_patterns:
            - '(?i)нереализованный\s+товар\s+подлежит\s+возврату\s+комитенту\s+в\s+течение\s+[0-9]+\s+дней'

    # Защита комиссионера
    commissioner_protection:
      - clause_id: "delcredere_conditions"
        name: "Условия и последствия принятия комиссионером делькредере"
        risk_if_missing: |
          Делькредере — дополнительная ответственность за исполнение сделки третьим лицом (ст. 993 ГК РФ).
          Без четких условий (размер доп. вознаграждения, порядок наступления ответственности)
          комиссионер может нести неограниченную ответственность.
        legal_base: "ст. 993 ГК РФ"
        severity: "critical"
        affected_party: "commissioner"
        detection:
          positive_keywords:
            - "делькредере"
            - "ручательство за исполнение третьим лицом"
            - "дополнительное вознаграждение за делькредере"
            - "условия наступления ответственности"
          negative_keywords:
            - "комиссионер не отвечает за неисполнение третьим лицом"
          context_patterns:
            - '(?i)комиссионер\s+принимает\s+на\s+себя\s+делькредере\s+за\s+исполнение\s+сделки'
        conditional_checks:
          - trigger: "delcredere_keywords"
            keywords: ["делькредере", "ручательство за исполнение"]
            rule: "delcredere_terms_required"
            severity: "critical"

      - clause_id: "termination_compensation_clause"
        name: "Компенсация при досрочной отмене поручения комитентом"
        risk_if_missing: |
          При отмене поручения комитент обязан выплатить вознаграждение за совершенные сделки и возместить расходы
          (ст. 1003 ГК РФ). Без конкретизации этих обязательств комиссионер рискует не получить оплату
          за проделанную работу и понесенные издержки.
        legal_base: "ст. 1003 ГК РФ"
        severity: "high"
        affected_party: "commissioner"
        detection:
          positive_keywords:
            - "вознаграждение при досрочной отмене"
            - "компенсация расходов при отмене"
            - "распоряжение имуществом в 15-дневный срок"
          context_patterns:
            - '(?i)при\s+отмене\s+поручения\s+комитентом\s+комиссионер\s+сохраняет\s+право\s+на\s+вознаграждение'

    # Общие защитные условия
    both_parties_protection:
      - clause_id: "additional_benefit_distribution"
        name: "Распределение дополнительной выгоды"
        risk_if_missing: |
          Если комиссионер совершил сделку на более выгодных условиях, чем указал комитент, дополнительная
          выгода по умолчанию делится поровну (ст. 992 ГК РФ). Без явного регулирования возникают споры
          о размере выгоды и порядке ее распределения.
        legal_base: "ст. 992 ГК РФ"
        severity: "medium"
        affected_party: "both"
        detection:
          positive_keywords:
            - "дополнительная выгода"
            - "распределение выгоды"
            - "более выгодные условия"
            - "превышение цены"
          context_patterns:
            - '(?i)дополнительная\s+выгода\s+делится\s+между\s+сторонами\s+поровну'

      - clause_id: "tax_risks_clarification"
        name: "Разъяснение налоговых рисков и порядка документооборота"
        risk_if_missing: |
          Налоговые органы могут переквалифицировать комиссию в куплю-продажу, доначислив комиссионеру
          НДС и налог на прибыль с полной суммы выручки. Без четкого документооборота (отчеты, акты)
          обе стороны несут значительные налоговые риски.
        legal_base: "НК РФ ст. 156, 251, 54.1"
        severity: "high"
        affected_party: "both"
        detection:
          positive_keywords:
            - "налоговые последствия"
            - "документооборот по комиссии"
            - "доходом является вознаграждение"
            - "счет-фактура"
            - "отчет как первичный документ"
          context_patterns:
            - '(?i)для\s+целей\s+налогообложения\s+доходом\s+комиссионера\s+является\s+вознаграждение'