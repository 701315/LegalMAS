type: contract_6.2
name: Договор комиссии
description: |
  Возмездный посреднический договор, по которому комиссионер обязуется по поручению комитента совершить от своего имени,
  но за счет комитента одну или несколько сделок. По сделке с третьим лицом права и обязанности возникают у комиссионера,
  хотя экономический интерес и право собственности на товар сохраняются за комитентом. Всегда возмездный.
  Регулируется Главой 51 ГК РФ.
version: 2.0
parent: class_6_intermediary
metadata:
  category: contract
  subcategory: intermediary
  complexity: medium-high
  risk_level: medium-high
  legal_base: "Глава 51 ГК РФ (ст. 990–1004)"

# ════════════════════════════════════════════════════════════
# БАЗОВАЯ ИНФОРМАЦИЯ (LEGACY SECTIONS — ОПТИМИЗИРОВАНО)
# ════════════════════════════════════════════════════════════
rules:
  keywords:
    high:
      - "комиссия"
      - "комиссионер"
      - "комитент"
      - "от своего имени"
      - "за счет комитента"
      - "комиссионное вознаграждение"
      - "собственность комитента"
      - "делькредере"
    medium:
      - "отчет комиссионера"
      - "субкомиссия"
      - "консигнация"
      - "реализация товара"
      - "закупка товара"
      - "цена продажи"
      - "дополнительная выгода"
      - "удержание комиссионера"
    low:
      - "товар на комиссии"
      - "посреднические услуги"
      - "обособленный учет"
      - "товарная комиссия"
      - "банкротство комиссионера"
  phrases:
    high:
      - Комиссионер обязуется совершить от своего имени, но за счет Комитента одну или несколько сделок
      - Право собственности на товар, переданный Комиссионеру, сохраняется за Комитентом
      - Комиссионер обязан представить отчет и передать все полученное по договору комиссии
      - Комиссионер приобретает права и становится обязанным по сделке с третьим лицом
      - Комиссионер принимает на себя ручательство за исполнение сделки третьим лицом (делькредере)
    medium:
      - Вознаграждение Комиссионера составляет X процентов от суммы сделки
      - Комиссионер вправе удержать причитающиеся ему суммы из всех сумм, поступивших от комитента
      - Комитент обязан утвердить отчет или заявить возражения в установленный срок
      - Цена продажи товара устанавливается Комитентом и не может быть ниже согласованной
      - Дополнительная выгода делится между сторонами поровну
  patterns:
    required:
      - (?i)(договор\s+комиссии|комиссионер\s+обязуется\s+совершить\s+от\s+своего\s+имени|право\s+собственности\s+сохраняется\s+за\s+комитентом)
    optional:
      - (?i)(комиссионное\s+вознаграждение|отчет\s+комиссионера|субкомисси|делькредере|дополнительная\s+выгода|обособленный\s+учет)
  exclusions:
    - действие от имени комитента (поручение)
    - купля-продажа от своего имени и за свой счет
    - агентский договор по модели поручения
    - договор транспортной экспедиции
  exclusion_logic:
    - condition: "acts_in_principals_name AND not_own_name"
      target: "reclassification_to_mandate"
      confidence: 0.90
      description: "Если исполнитель действует от имени доверителя — это договор поручения, а не комиссии"
    - condition: "owns_goods AND sells_own_property"
      target: "reclassification_to_sale"
      confidence: 0.85
      description: "Если лицо продает собственный товар — это купля-продажа, а не комиссия"
  weights:
    keyword_high: 3.0
    keyword_medium: 1.5
    keyword_low: 0.5
    phrase_high: 2.5
    phrase_medium: 1.0
    pattern_required: 4.0
    pattern_optional: 1.0
  classification:
    min_confidence: 0.75
    max_matches: 2

party_roles:
  - Комитент (Принципал/Клиент) - сторона, дающая поручение, несущая расходы и остающаяся собственником товара/получателем результата
  - Комиссионер (Агент/Посредник) - сторона, совершающая сделки от своего имени, но за счет комитента, за вознаграждение

essential_terms:
  - "Предмет: совершение одной или нескольких определенных сделок (вид, товар, общие параметры) от своего имени, но за счет комитента (ст. 990 ГК РФ)"
  - "Вознаграждение комиссионера (размер, порядок и сроки выплаты) — существенное условие, договор всегда возмездный (ст. 991 ГК РФ)"
  - "Ценовые условия совершения сделок: минимальная цена продажи / максимальная цена закупки (ст. 990, 995 ГК РФ)"
  - "Порядок передачи товара комитента комиссионеру и возврата нереализованного"

specific_risks:
  - "Для комитента: риск неполучения выручки или товара от недобросовестного комиссионера (формальная сторона сделки)"
  - "Для комитента: риск включения его товара в конкурсную массу при банкротстве комиссионера, если товар не отделен (ст. 996 ГК РФ, ст. 134 ФЗ-127)"
  - "Для комиссионера: риск ответственности перед третьими лицами по сделкам, даже если он действовал по указаниям комитента"
  - "Для комиссионера: риск неутверждения отчета и неполучения вознаграждения, несмотря на исполнение (ст. 999 ГК РФ)"
  - "Для обеих сторон: споры о размере и обоснованности расходов комиссионера (ст. 1001 ГК РФ)"
  - "Для обеих сторон: споры о распределении дополнительной выгоды (ст. 992 ГК РФ)"
  - "Для комиссионера: риск ответственности за неисполнение сделки третьим лицом при принятии делькредере (ст. 993 ГК РФ)"
  - "Налоговые риски: переквалификация комиссии в куплю-продажу налоговыми органами"

aliases:
  - Комиссия
  - Договор на реализацию товара
  - Договор на закупку товара
  - Консигнационный договор
  - Комиссионный договор
  - Договор товарной комиссии

section_markers:
  - Предмет договора (какие именно сделки и с какими параметрами совершает комиссионер)
  - Права и обязанности комиссионера
  - Права и обязанности комитента
  - Порядок передачи товара и ответственность за сохранность
  - Цены и условия совершения сделок (лимиты, согласование отклонений)
  - Вознаграждение комиссионера и порядок расчетов
  - Возмещение расходов комиссионера
  - Отчет комиссионера (сроки, форма, приложения)
  - Порядок утверждения отчета комитентом и разрешения разногласий
  - Ответственность сторон
  - Условия о делькредере (ручательство комиссионера за исполнение третьим лицом)
  - Субкомиссия (допустимость, условия)
  - Распределение дополнительной выгоды
  - Срок действия договора
  - Расторжение договора и его последствия
  - Конфиденциальность
  - Разрешение споров

notes: |
  ОСОБЕННОСТИ И ПРАВИЛА ПРИМЕНЕНИЯ:
  1. Всегда возмездный: комиссионер имеет право на вознаграждение (ст. 991 ГК РФ).
  2. Действие от своего имени: комиссионер становится стороной в сделке с третьим лицом (ст. 990 ГК РФ).
  3. Сохранение права собственности: товар комитента не становится собственностью комиссионера (ст. 996 ГК РФ) и должен учитываться обособленно.
  4. Отчетность: комиссионер обязан представить отчет, комитент — утвердить или оспорить в срок (ст. 999 ГК РФ).
  5. Субкомиссия: комиссионер может привлечь субкомиссионера, оставаясь ответственным перед комитентом (ст. 994 ГК РФ).
  6. Делькредере: дополнительная ответственность комиссионера за исполнение сделки третьим лицом (ст. 993 ГК РФ).
  7. Удержание: комиссионер вправе удерживать причитающиеся ему суммы из денег, поступивших за счет комитента (ст. 997 ГК РФ).
  8. Дополнительная выгода: при сделке на более выгодных условиях выгода делится поровну, если иное не установлено договором (ст. 992 ГК РФ).

