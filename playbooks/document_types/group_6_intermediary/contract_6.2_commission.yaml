trigger_definitions:
  sale_commission:
    any_keywords:
      - "(?i)реализаци[яи]\\s+товар[аа]"
      - "(?i)продаж[ааи]\\s+товар[аа]"
      - "(?i)реализоват[ья]"
      - "(?i)минимальн[а-яё]+\\s+цен[аа]\\s+продаж[ии]"

  purchase_commission:
    any_keywords:
      - "(?i)закупк[аа]"
      - "(?i)приобретени[ея]\\s+товар[аа]"
      - "(?i)купить"
      - "(?i)максимальн[а-яё]+\\s+цен[аа]\\s+закупк[ии]"

  consignment_model:
    any_keywords:
      - "(?i)\\bконсигнаци[яяи]\\b"
      - "(?i)товар\\s+на\\s+комисси[ии]"
      - "(?i)склад\\s+комиссионер[аа]"
      - "(?i)нереализованн[ыо]й\\s+товар"

  delcredere_terms:
    any_keywords:
      - "(?i)\\bделькредере\\b"
      - "(?i)ручательств[оо]\\s+за\\s+исполнени[ея]"
      - "(?i)отвечает\\s+за\\s+исполнени[ея]\\s+третьим\\s+лиц[оа]м"

  subcommission_allowed:
    any_keywords:
      - "(?i)\\bсубкомисси[яяи]\\b"
      - "(?i)\\bсубкомиссионер\\b"
      - "(?i)привлечени[ея]\\s+третьих\\s+лиц"

  goods_transfer_model:
    any_keywords:
      - "(?i)передач[аа]\\s+товар[аа]\\s+комиссионер[уу]"
      - "(?i)товар\\s+комитент[аа]"
      - "(?i)при[её]мк[аа]\\s+товар[аа]"
      - "(?i)акт\\s+при[её]ма-?передач[ии]"

  report_approval_required:
    any_keywords:
      - "(?i)отч[её]т\\s+комиссионер[аа]"
      - "(?i)утверждени[ея]\\s+отч[её]т[аа]"
      - "(?i)возражени[яя]\\s+на\\s+отч[её]т"
      - "(?i)молчани[ея]\\s+считаетс[яьа]\\s+согласием"

  retention_right_clause:
    any_keywords:
      - "(?i)прав[оо]\\s+удержани[яя]"
      - "(?i)удерживать\\s+причитающи[ея]ся\\s+сумм[ыы]"
      - "(?i)из\\s+поступивш[иие]х\\s+денежн[ыо]х\\s+средств"

  bankruptcy_segregation_sensitive:
    any_keywords:
      - "(?i)обособленн[ыо]й\\s+уч[её]т"
      - "(?i)раздельн[оа]е\\s+хранени[ея]"
      - "(?i)не\\s+подлежит\\s+взыскани[юю]\\s+по\\s+долг[аа]м\\s+комиссионер[аа]"
      - "(?i)имуществ[оо]\\s+комитент[аа]"

  consumer_retail_commission:
    any_keywords:
      - "(?i)правил[аа]\\s+комиссионн[оа]й\\s+торговл[ии]"
      - "(?i)\\bпотребител[ьяи]\\b"
      - "(?i)розничн[а-яё]+\\s+комисси[яя]"
      - "(?i)физическ[оеая]\\s+лиц[оо]"

