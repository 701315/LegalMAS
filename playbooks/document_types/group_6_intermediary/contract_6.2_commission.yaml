      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки условия об ответственности сторон:
        неустойки за просрочку платежей/отчетов и общие лимиты ответственности.
        Не анализируй базовое вознаграждение или порядок расторжения.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. penalties_and_liability_limits_check_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из полей (late_proceeds_penalty_status,
             late_reporting_penalty_status, liability_cap_status) ≠ "not_defined";
           - "missing" — если все три = "not_defined";
           - "unclear" — если фрагменты есть, но вывод невозможен.

           Если presence = "missing":
           - late_proceeds_penalty_status = "not_defined";
           - late_reporting_penalty_status = "not_defined";
           - liability_cap_status = "not_defined";
           - penalties_summary = "Специальные условия об ответственности и лимитах не установлены (по закону)";
           - не выполняй остальные шаги.

        1. late_proceeds_penalty_status:
           - "defined" — установлена конкретная неустойка за просрочку перечисления выручки;
           - "by_law" — есть отсылка к ст. 395 ГК РФ без конкретного размера;
           - "not_defined" — тема не упомянута.

        2. late_reporting_penalty_status:
           - "defined" — установлена конкретная неустойка за просрочку отчета;
           - "by_law" — есть отсылка к закону без конкретики;
           - "not_defined" — тема не упомянута.

        3. liability_cap_status:
           - "capped" — ответственность ограничена суммой (например, размером вознаграждения);
           - "uncapped" — прямо указано, что ответственность не ограничена;
           - "excluded" — сделана попытка полностью исключить ответственность (красный флаг);
           - "not_defined" — тема не упомянута.

        4. penalties_summary:
           Краткое резюме одной строкой (например, "Пени за просрочку выручки: 0.1% в день | Лимит ответственности: отсутствует").

        5. evidence:
           Массив объектов [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}].
        </task>

        <context_rules>
        - Перед остальными полями заполни penalties_and_liability_limits_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined", penalties_summary = "Специальные условия об ответственности и лимитах не установлены (по закону)".
        - Используй только текст договора.
        - liability_cap_status = "excluded" — это красный флаг (попытка полностью исключить ответственность комиссионера).
        - Не используй "None", "null", пустые строки.
        - Все текстовые значения пиши на русском языке, кроме служебных enum-значений status-полей.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие специальных санкций.
