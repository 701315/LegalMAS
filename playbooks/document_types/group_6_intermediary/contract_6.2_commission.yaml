        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - definitions
      negative_keywords:
        - "означает"
        - "в целях настоящего"
        - "вознаграждение"
        - "отчёт"
        - "субкомиссия"
        - "делькредере"
        - "прекращение"
        - "возврат товара"
      position_bias:
        preferred_range: [0.0, 0.40]
        boost: 0.18
        scope: segment
      context_k: 5
