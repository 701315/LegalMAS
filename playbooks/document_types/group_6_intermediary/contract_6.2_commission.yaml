           → presence = "missing";
             все *_status = "not_defined";
             penalties_summary = "Специальные условия об ответственности и лимитах не установлены (по закону)".

        2. Четкие пени за просрочку перечисления выручки.
           "За просрочку перечисления выручки Комиссионер уплачивает пени 0.1% в день."
           → presence = "present";
             late_proceeds_penalty_status = "defined".

        3. Наличие общего лимита ответственности (cap).
           "Общая ответственность Комиссионера по Договору не может превышать суммы его вознаграждения."
           → presence = "present";
             liability_cap_status = "capped".

        4. Специфика темы: попытка полного исключения ответственности (красный флаг).
           "Комиссионер не несет ответственности за любые прямые или косвенные убытки Комитента."
           → presence = "present";
             liability_cap_status = "excluded".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для penalties_and_liability_limits_check_presence используй только: "present", "missing", "unclear".
        - Для status-полей используй только значения из allowed_values.
        - Fallback при отсутствии данных:
          * penalties_summary → "Специальные условия об ответственности и лимитах не установлены (по закону)";
          * все *_status → "not_defined".
        - Fallback при противоречии или неоднозначности:
          * penalties_summary → "Не удалось определить (противоречие)";
          * соответствующие *_status → "not_defined" или "unclear".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "penalties_and_liability_limits_check_presence"
          type: "string"
