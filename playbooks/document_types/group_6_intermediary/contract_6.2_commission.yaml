        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "от своего имени за счёт комитента совершить одну или несколько сделок реализация товара закупка товара минимальная цена продажи максимальная цена закупки не ниже не выше ценовые лимиты"
      retrieval_profile: "scope_of_work_check"
      preferred_unit_types:
