  - id: self_dealing_and_conflict_check
    name: "Конфликт интересов: запрет или условия покупки товара комиссионером"
    description: >
      Проверяет наличие прямого запрета или, наоборот, разрешения комиссионеру
      выступать покупателем вверенного ему товара (ст. 990 п. 2 ГК РФ).
      Критический риск конфликта интересов.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    display_order: 150

    rules:
      keywords:
        - "комиссионер вправе приобрести"
        - "комиссионер выступает покупателем"
        - "запрет на покупку"
        - "конфликт интересов"
        - "аффилированные лица"
        - "покупка комиссионером"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)комиссионер\\s+вправе\\s+приобрести|купить"
        - "(?i)запрещается\\s+приобретать|не\\s+вправе\\s+выступать\\s+покупателем"
        - "(?i)аффилированн.{0,20}лиц"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор комиссии по Главе 51 ГК РФ.
        Проверяется условие о возможности комиссионера купить товар сам
        (сделки "с самим собой", ст. 990 п. 2 ГК РФ).

        Нормативный ориентир:
        - ст. 990 п. 2 ГК РФ — комиссионер вправе купить вверенный ему товар
          лишь с согласия комитента.

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора.
        - Не оценивай серьёзность риска.
        - Не подставляй нормы закона вместо текста договора: если запрет
          или разрешение не зафиксированы — это not_defined (действует
          общее правило о необходимости согласия комитента).

        [ЗАДАЧА]
        Определи:
        1. Разрешено ли комиссионеру покупать товар, и если да, то на каких условиях.
        2. Есть ли прямой запрет на такие действия.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Если данные не указаны прямо — возвращай "not_defined".
        3. Не используй "None", "null", "N/A", "-" или пустые строки.
        4. В evidence включай только точные цитаты из договора в виде массива объектов.
        5. Верни РОВНО один валидный JSON-объект, пригодный для парсинга
           через json.loads без предварительной обработки. Без markdown,
           без ```json, без текста до или после. Начни ответ сразу с `{` и закончи `}`.

        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1 — прямой запрет (наилучшая практика для комитента):
        Фрагмент:
        "Комиссионер не вправе выступать покупателем вверенного ему товара,
        а также продавать его аффилированным с ним лицам без предварительного
        письменного согласия Комитента."
        Ответ:
        {
          "self_dealing_permission": "prohibited",
          "self_dealing_conditions": "Запрещено без предварительного письменного согласия Комитента",
          "self_dealing_summary": "Запрещено (или требует письменного согласия Комитента)",
          "evidence": [
            {
              "clause_ref": "п. 12.1",
              "quote": "Комиссионер не вправе выступать покупателем вверенного ему товара, а также продавать его аффилированным с ним лицам без предварительного письменного согласия Комитента."
            }
          ]
        }

        Пример 2 — безусловное разрешение (красный флаг):
        Фрагмент:
        "Комиссионер вправе приобрести вверенный ему товар по цене,
        согласованной в Поручении, выступая в качестве покупателя."
        Ответ:
        {
          "self_dealing_permission": "allowed_unconditionally",
          "self_dealing_conditions": "по цене, согласованной в Поручении",
          "self_dealing_summary": "Разрешено безусловно (высокий риск конфликта интересов)",
          "evidence": [
            {
              "clause_ref": "п. 12.1",
              "quote": "Комиссионер вправе приобрести вверенный ему товар по цене, согласованной в Поручении, выступая в качестве покупателя."
            }
          ]
        }

        Пример 3 — данные отсутствуют:
        Фрагмент:
        "Комиссионер обязуется реализовать товар на наиболее выгодных условиях."
        Ответ:
        {
          "self_dealing_permission": "not_defined",
          "self_dealing_conditions": "Данные не определены",
          "self_dealing_summary": "Вопрос покупки товара комиссионером не урегулирован (по закону требует согласия комитента)",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о праве комиссионера купить товар или о запрете на это.
        2. Проверь, что все 4 ключа присутствуют в JSON и значения enum строго из allowed_values.

        [ФОРМАТ ОТВЕТА]
        {
          "self_dealing_permission": "<prohibited / allowed_with_consent / allowed_unconditionally / not_defined>",
          "self_dealing_conditions": "<текст или 'Данные не определены'>",
          "self_dealing_summary": "<краткое резюме одной строкой>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 600

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "комиссионер вправе приобрести комиссионер выступает покупателем запрет на покупку конфликт интересов аффилированные лица покупка комиссионером"
      retrieval_profile: "conflict_of_interest_check"
      preferred_unit_types:
        - obligation
        - limitation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - limitations
        - obligations
      negative_keywords:
        - "в целях настоящего"
        - "субкомиссия"
        - "делькредере"
        - "прекращение"
      position_bias:
        preferred_range: [0.30, 0.80]
        boost: 0.25
        scope: segment
      context_k: 6
      max_chunks: 10
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
        - "invoice"
      preferred_clause_functions:
        - "limitations"
        - "obligations"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 30
      max_snippet_length: 500

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 700
      compact_output: false

      presence_signal:
        field: "self_dealing_and_conflict_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Определи, разрешает ли договор комиссионеру
        выступать покупателем вверенного товара (сделки "с самим собой").
        Не анализируй базовое вознаграждение или порядок расторжения.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. self_dealing_and_conflict_check_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если тема покупки товара комиссионером прямо затронута (запрещена или разрешена);
           - "missing" — если тема вообще не упомянута в договоре;
           - "unclear" — если формулировки противоречивы.

           Если presence = "missing":
           - self_dealing_permission = "not_defined";
           - self_dealing_conditions = "Данные не определены";
           - self_dealing_summary = "Вопрос покупки товара комиссионером не урегулирован (по закону требует согласия комитента)";
           - не выполняй остальные шаги.

        1. self_dealing_permission:
           - "prohibited" — прямо запрещено или разрешено только с согласия;
           - "allowed_with_consent" — разрешено только с предварительного письменного согласия комитента;
           - "allowed_unconditionally" — разрешено безусловно (красный флаг);
           - "not_defined" — тема не упомянута.

        2. self_dealing_conditions:
           Текст условий (или "Данные не определены").

        3. self_dealing_summary:
           Краткое резюме (например, "Запрещено" или "Разрешено только с письменного согласия Комитента").

        4. evidence:
           Массив объектов [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}].
        </task>

        <context_rules>
        - Перед остальными полями заполни self_dealing_and_conflict_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — self_dealing_permission = "not_defined", self_dealing_summary = "Вопрос покупки товара комиссионером не урегулирован (по закону требует согласия комитента)".
        - Используй только текст договора.
        - "allowed_unconditionally" — это красный флаг высокого риска.
        - "prohibited" или "allowed_with_consent" — это наилучшая и самая безопасная практика для комитента.
        - Не используй "None", "null", пустые строки.
        - Все текстовые значения пиши на русском языке, кроме служебных enum-значений status-полей.
        </context_rules>

        <edge_cases>
        1. Полное молчание договора.
