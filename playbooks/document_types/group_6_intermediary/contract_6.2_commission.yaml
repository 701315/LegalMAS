  percentage_pattern: "(?i)\\b\\d+(?:[.,]\\d+)?\\s*%\\b"
  date_pattern: "(?i)\\b\\d{1,2}[.]\\d{1,2}[.]\\d{4}\\b"
  invoice_pattern: "(?i)(?:накладн|акт|счет|счет-фактур|спецификац)\\s*№?\\s*[A-ZА-Я0-9\\-\\/]+"

compliance_rules: []

# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 4: CHECKS_V8 — единственный рабочий слой юридического анализа
#  Читается: DocTypeCheckLoader._load_doc_type_checks()
# ════════════════════════════════════════════════════════════════════════════

checks_v8:

  # ──────────────────────────────────────────────────────────────────────────
  # CHECK 1: Базовое извлечение структуры договора комиссии
  # ──────────────────────────────────────────────────────────────────────────
  - id: commission_subject_extraction
    name: "Базовое извлечение структуры договора комиссии"
    description: >
      Извлекает комитента, комиссионера, модель действия, предмет сделок,
      вознаграждение и ключевые комиссионные параметры.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "комиссионер"
        - "комитент"
        - "от своего имени"
        - "за счет комитента"
        - "комиссионное вознаграждение"
        - "отчет комиссионера"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)(договор\\s+комиссии|комиссионер|комитент)"
        - "(?i)(от\\s+своего\\s+имени|за\\s+счет\\s+комитента)"
        - "(?i)вознаграждени[ея].{0,30}комиссионер"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор комиссии по Главе 51 ГК РФ (ст. 990-1004).
        Проверяется только один вопрос: ключевые параметры договора комиссии.

        Нормативный ориентир:
        - ст. 990 ГК РФ — договор комиссии
        - ст. 991 ГК РФ — вознаграждение комиссионера

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора,
          а чего прямо нет.
        - Не оценивай серьёзность риска.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Комитент (наименование / ФИО).
        2. Комиссионер (наименование / ФИО).
        3. От чьего имени действует комиссионер.
        4. Тип поручаемых сделок (продажа / закупка / смешанные).
        5. Предмет комиссии (какие сделки / товары).
        6. Статус вознаграждения.
        7. Наличие оговорки о собственности комитента.
        8. Наличие отчётности.
        9. Наличие делькредере.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Если данные не указаны прямо — возвращай "not_defined".
        4. Если текстового значения нет — возвращай строго "Данные не определены".
        5. Не используй "None", "null", "not_defined", "not_defined" или пустые строки.
        6. В evidence включай только текст договора.
        7. Верни только один JSON-объект.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — параметры определены:
        Фрагмент:
