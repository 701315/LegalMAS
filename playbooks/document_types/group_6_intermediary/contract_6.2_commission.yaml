        2. Найди прямую цитату о предмете.
        3. Найди прямую цитату о ценовых лимитах.
        4. Если прямой цитаты нет — верни "not_defined".

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "representation_model": "<commission_true_model / mandate_like_model / unclear / not_defined>",
          "subject_specificity": "<specific / generic / not_defined>",
