        Проверяется только один вопрос: предмет договора, модель действия
        и ценовые лимиты.

        Нормативный ориентир:
        - ст. 990 ГК РФ — модель комиссии
        - ст. 995 ГК РФ — ценовые условия

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора.
        - Не оценивай серьёзность риска.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Модель представительства (от своего имени / от имени комитента).
        2. Степень конкретизации предмета.
        3. Наличие ценовых лимитов (минимальная цена продажи, максимальная цена закупки).

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Если условие не указано прямо — возвращай "not_defined".
