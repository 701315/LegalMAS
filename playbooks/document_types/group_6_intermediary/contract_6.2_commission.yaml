shared_patterns:
  money_amount: "(?i)\\b\\d[\\d\\s]*(?:руб|рублей|₽|коп|тыс|млн|млрд)"
  percentage_pattern: "(?i)\\b\\d+(?:[.,]\\d+)?\\s*%\\b"
  date_pattern: "(?i)\\b\\d{1,2}[.]\\d{1,2}[.]\\d{4}\\b"
  invoice_pattern: "(?i)(?:накладн|акт|счет|счет-фактур|спецификац)\\s*№?\\s*[A-ZА-Я0-9\\-\\/]+"

compliance_rules: []

# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 4: CHECKS_V8 — единственный рабочий слой юридического анализа
#  Читается: DocTypeCheckLoader._load_doc_type_checks()
# ════════════════════════════════════════════════════════════════════════════

checks_v8:

  - id: commission_subject_extraction
    name: "Базовое извлечение структуры договора комиссии"
    description: >
      Извлекает комитента, комиссионера, модель действия, предмет сделок,
      статус вознаграждения и ключевые комиссионные параметры (собственность,
      отчётность, делькредере). Фотографический fingerprint по Главе 51 ГК РФ.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    display_order: 10

    rules:
      keywords:
        - "комиссионер"
        - "комитент"
        - "от своего имени"
        - "за счет комитента"
        - "за счёт комитента"
        - "комиссионное вознаграждение"
        - "отчет комиссионера"
        - "отчёт комиссионера"
        - "делькредере"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)(договор\\s+комиссии|комиссионер|комитент)"
        - "(?i)(от\\s+своего\\s+имени|за\\s+сч[её]т\\s+комитента)"
        - "(?i)вознаграждени[ея].{0,30}комиссионер"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор комиссии по Главе 51 ГК РФ (ст. 990–1004).
        Проверяется только один вопрос: ключевые параметры структуры договора комиссии.

        Нормативный ориентир:
        - ст. 990 ГК РФ — договор комиссии
        - ст. 991 ГК РФ — комиссионное вознаграждение
        - ст. 996 ГК РФ — вещи, поступившие комиссионеру
        - ст. 999 ГК РФ — отчёт комиссионера

        Ключевое:
        - Комиссия по ст. 990 ГК РФ — это действия комиссионера «от своего имени,
          но за счёт комитента». Если комиссионер прямо действует «от имени
          комитента» — это уже не комиссия, а поручение (Гл. 49 ГК РФ).
        - Возмездность комиссии — существенный признак (ст. 991 ГК РФ).

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора,
          а чего прямо нет.
        - Не оценивай серьёзность риска.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Комитент (наименование / ФИО).
        2. Комиссионер (наименование / ФИО).
        3. От чьего имени действует комиссионер.
        4. Тип поручаемых сделок (продажа / закупка / смешанные).
        5. Предмет комиссии (какие сделки / товары).
        6. Статус вознаграждения.
        7. Наличие оговорки о собственности комитента.
        8. Наличие отчётности.
        9. Наличие делькредере.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Если данные не указаны прямо в тексте — возвращай "not_defined"
           (для статусных полей) или "Данные не определены" (для текстовых).
        4. Если предмет комиссии сформулирован рамочно (например,
           «сделки в соответствии с поручениями Комитента», «сделки согласно
           приложениям / спецификациям») — верни в subject_of_commission
           строку "Определяется отдельными поручениями Комитента" —
           это валидный факт, а не отсутствие данных.
        5. Не используй "None", "null", "N/A", "-" или пустые строки —
           только явные значения из [ФОРМАТ ОТВЕТА].
        6. В evidence включай только текст договора, без комментариев.
        7. Верни РОВНО один валидный JSON-объект со всеми 10 ключами
           (9 полей + evidence), пригодный для парсинга через json.loads
           без предварительной обработки. Без markdown, без ```json,
           без комментариев, без текста до или после. Начни ответ сразу
           с `{` и закончи `}`.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — параметры определены:
        Фрагмент:
        "Комитент — ООО «Альфа» поручает, а Комиссионер — ООО «Бета» обязуется
        от своего имени, но за счёт Комитента совершить сделки по реализации
        товара. Вознаграждение — 5% от суммы реализации. Право собственности
        на товар сохраняется за Комитентом. Комиссионер представляет отчёт
        ежемесячно."

        Ответ:
        {
          "principal": "ООО «Альфа»",
          "commissioner": "ООО «Бета»",
          "acts_in_name_of": "self",
          "transaction_type": "sale",
          "subject_of_commission": "реализация товара",
          "remuneration_status": "present",
          "goods_ownership_clause": "present",
          "reporting_status": "present",
          "delcredere_status": "absent",
          "evidence": [
            {
              "clause_ref": "п. 1.1",
              "quote": "Комиссионер — ООО «Бета» обязуется от своего имени, но за счёт Комитента совершить сделки по реализации товара."
            },
            {
              "clause_ref": "п. 2.1",
              "quote": "Вознаграждение — 5% от суммы реализации. Право собственности на товар сохраняется за Комитентом. Комиссионер представляет отчёт ежемесячно."
            }
          ]
        }

        Пример 2 — данные отсутствуют:
        Фрагмент:
        "Стороны заключили настоящий договор."

        Ответ:
        {
          "principal": "Данные не определены",
          "commissioner": "Данные не определены",
          "acts_in_name_of": "not_defined",
          "transaction_type": "not_defined",
          "subject_of_commission": "Данные не определены",
          "remuneration_status": "not_defined",
          "goods_ownership_clause": "not_defined",
          "reporting_status": "not_defined",
          "delcredere_status": "not_defined",
          "evidence": []
        }

        Пример 3 — рамочный договор с отсылкой к поручениям:
        Фрагмент:
        "Комиссионер ООО «Гамма» обязуется по поручениям Комитента ООО «Дельта»
        совершать от своего имени сделки, конкретный перечень и условия которых
        определяются отдельными Поручениями. Вознаграждение согласовывается
        сторонами по каждому Поручению."

        Ответ:
        {
          "principal": "ООО «Дельта»",
          "commissioner": "ООО «Гамма»",
          "acts_in_name_of": "self",
          "transaction_type": "not_defined",
          "subject_of_commission": "Определяется отдельными поручениями Комитента",
          "remuneration_status": "present",
          "goods_ownership_clause": "not_defined",
          "reporting_status": "not_defined",
          "delcredere_status": "not_defined",
          "evidence": [
            {
              "clause_ref": "п. 1.1",
              "quote": "Комиссионер ООО «Гамма» обязуется по поручениям Комитента ООО «Дельта» совершать от своего имени сделки, конкретный перечень и условия которых определяются отдельными Поручениями."
            }
          ]
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о комитенте.
        2. Найди прямую цитату о комиссионере.
        3. Найди прямую цитату о модели действия (от своего имени / от имени комитента).
        4. Найди прямую цитату о предмете комиссии (или отсылку к поручениям).
        5. Проверь, что все 10 ключей (9 полей + evidence) присутствуют в JSON
           и значения enum-полей строго из allowed_values.

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "principal": "<текст или 'Данные не определены'>",
          "commissioner": "<текст или 'Данные не определены'>",
          "acts_in_name_of": "<self / principal / unclear / not_defined>",
          "transaction_type": "<sale / purchase / mixed / unclear / not_defined>",
          "subject_of_commission": "<текст или 'Определяется отдельными поручениями Комитента' или 'Данные не определены'>",
          "remuneration_status": "<present / unclear / not_defined>",
          "goods_ownership_clause": "<present / not_defined>",
          "reporting_status": "<present / not_defined>",
          "delcredere_status": "<present / absent / not_defined>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 8
      temperature: 0.0
      max_tokens: 800

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "комитент комиссионер от своего имени за счёт комитента комиссионное вознаграждение предмет договора комиссии отчёт комиссионера"
      retrieval_profile: "scope_of_work_check"
      preferred_unit_types:
        - obligation
        - general_provision
        - representations
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - representations
        - obligations
      negative_keywords:
        - "в целях настоящего"
        - "приложение"
        - "индекс"
        - "субкомиссия"
        - "прекращение"
        - "возврат товара"
      position_bias:
        preferred_range: [0.0, 0.35]
        boost: 0.20
        scope: segment
      context_k: 8
      max_chunks: 12
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
        - "invoice"
      preferred_clause_functions:
        - "representations"
        - "obligations"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 50
      max_snippet_length: 700

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1200
      compact_output: false

      presence_signal:
        field: "commission_subject_extraction_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора комиссии ключевые
        параметры структуры: комитента, комиссионера, модель действия,
        предмет сделок, статус вознаграждения, сохранение собственности,
        отчётность и делькредере.
        Не анализируй субкомиссию, прекращение, ценовые лимиты или размер
        вознаграждения — это отдельные проверки.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие 9 полей + evidence (всего 10 ключей):

        0. commission_subject_extraction_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (acts_in_name_of, transaction_type, remuneration_status,
              goods_ownership_clause, reporting_status, delcredere_status)
             ≠ "not_defined";
           - "missing" — если все шесть содержательных полей = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - acts_in_name_of = "not_defined";
           - transaction_type = "not_defined";
           - remuneration_status = "not_defined";
           - goods_ownership_clause = "not_defined";
           - reporting_status = "not_defined";
           - delcredere_status = "not_defined";
           - principal, commissioner, subject_of_commission = "Данные не определены";
           - не выполняй остальные шаги.

        1. principal — комитент (наименование / ФИО).
        2. commissioner — комиссионер (наименование / ФИО).
        3. acts_in_name_of — "self" / "principal" / "unclear" / "not_defined".
        4. transaction_type — "sale" / "purchase" / "mixed" / "unclear" / "not_defined".
        5. subject_of_commission — предмет комиссии.
        6. remuneration_status — "present" / "unclear" / "not_defined".
        7. goods_ownership_clause — "present" / "not_defined".
        8. reporting_status — "present" / "not_defined".
        9. delcredere_status — "present" / "absent" / "not_defined".
        10. evidence — массив объектов [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}].

        Если данные отсутствуют:
        - текстовое поле = "Данные не определены"
        - статусное поле = "not_defined"

        Если предмет рамочный (отсылка к поручениям / приложениям /
        спецификациям), для subject_of_commission верни
        "Определяется отдельными поручениями Комитента".
        </task>

        <context_rules>
        - Перед остальными полями заполни commission_subject_extraction_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined", все текстовые поля = "Данные не определены".
        - Используй только текст договора.
        - acts_in_name_of:
          * "self" — прямо указано "от своего имени";
          * "principal" — прямо указано "от имени комитента" (внимание: это признак поручения, а не комиссии);
          * "unclear" — формулировка неоднозначна;
          * "not_defined" — не указано.
        - transaction_type:
          * "sale" — только реализация товаров/услуг третьим лицам;
          * "purchase" — только закупка для комитента;
          * "mixed" — оба направления;
          * "unclear" — тип сделок не конкретизирован;
          * "not_defined" — тема не раскрыта.
        - delcredere_status:
          * "present" — комиссионер прямо принимает ручательство за третье лицо;
          * "absent" — прямо указано, что делькредере не предусмотрено;
          * "not_defined" — тема не упомянута.
        - Не используй "None", "null", пустые строки.
        - Все текстовые значения пиши на русском языке, кроме служебных enum-значений status-полей.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни комитента, ни комиссионера, ни предмета, ни условий о вознаграждении или отчётности.
           → presence = "missing";
             все *_status = "not_defined";
             principal, commissioner, subject_of_commission = "Данные не определены".

        2. Рамочный предмет с отсылкой к поручениям.
           "Комиссионер обязуется совершать сделки согласно отдельным поручениям Комитента."
           → presence = "present";
             subject_of_commission = "Определяется отдельными поручениями Комитента";
             transaction_type = "not_defined" (если не указано конкретно).

        3. Противоречие между фрагментами.
           В преамбуле указано "от своего имени", а в разделе обязанностей — "от имени Комитента".
           → presence = "unclear";
             acts_in_name_of = "unclear";
             соответствующие текстовые поля = "Не удалось определить".

        4. Специфика темы: признак поручения вместо комиссии.
           Прямо указано: "Комиссионер действует от имени и за счёт Комитента".
           → presence = "present";
             acts_in_name_of = "principal" (сигнал юристу о риске переквалификации).
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для commission_subject_extraction_presence используй только: "present", "missing", "unclear".
        - Для status-полей используй только значения из allowed_values.
        - Fallback при отсутствии данных:
          * principal, commissioner, subject_of_commission → "Данные не определены";
          * все *_status → "not_defined".
        - Fallback при противоречии или неоднозначности:
          * все текстовые поля → "Не удалось определить";
          * соответствующие *_status → "not_defined" или "unclear".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "commission_subject_extraction_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие базовых параметров структуры договора комиссии. Внутреннее агрегатное signal-поле."
          required: true

        - name: "principal"
          type: "string"
          presentation: "fact"
          label: "Комитент"
          description: "Комитент по договору комиссии."
          required: true
          display_in_grid: true
          display_priority: 1

        - name: "commissioner"
          type: "string"
          presentation: "fact"
          label: "Комиссионер"
          description: "Комиссионер по договору комиссии."
          required: true
          display_in_grid: true
          display_priority: 2

        - name: "acts_in_name_of"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["self", "principal", "unclear", "not_defined"]
          description: "От чьего имени действует комиссионер (self = от своего имени, признак комиссии; principal = от имени комитента, признак поручения)."
          required: true
          display_in_grid: false

        - name: "transaction_type"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["sale", "purchase", "mixed", "unclear", "not_defined"]
          description: "Тип поручаемых сделок."
          required: true
          display_in_grid: false

        - name: "subject_of_commission"
          type: "string"
          presentation: "fact"
          label: "Предмет комиссии"
          description: "Предмет комиссии (сделки, товары) или указание на рамочный характер с отсылкой к поручениям."
          required: true
          display_in_grid: true
          display_priority: 3

        - name: "remuneration_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["present", "unclear", "not_defined"]
          description: "Наличие условия о комиссионном вознаграждении (сигнал возмездности по ст. 991 ГК РФ)."
          required: true
          display_in_grid: false

        - name: "goods_ownership_clause"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["present", "not_defined"]
          description: "Наличие оговорки о сохранении собственности комитента на переданный товар."
          required: true
          display_in_grid: false

        - name: "reporting_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["present", "not_defined"]
          description: "Наличие условия об отчётности комиссионера (ст. 999 ГК РФ)."
          required: true
          display_in_grid: false

        - name: "delcredere_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["present", "absent", "not_defined"]
          description: "Наличие ручательства комиссионера за третье лицо (делькредере, ст. 991 ГК РФ)."
          required: true
          display_in_grid: false

      store_payload: true

  - id: subject_and_representation_model_check
    name: "Предмет комиссии, модель действия и ценовые лимиты"
    description: >
      Оценивает юридическую модель действия комиссионера (комиссия vs поручение),
      степень конкретизации предмета и наличие ценовых лимитов (минимальная цена
      продажи / максимальная цена закупки). Критично для квалификации договора
      и налоговых последствий.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    display_order: 20

    rules:
      keywords:
        - "от своего имени"
        - "за счет комитента"
        - "за счёт комитента"
        - "совершить одну или несколько сделок"
        - "реализация товара"
        - "закупка товара"
        - "минимальная цена продажи"
        - "максимальная цена закупки"
        - "не ниже"
        - "не выше"
        - "ценовые лимиты"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)от\\s+своего\\s+имени"
        - "(?i)за\\s+сч[её]т\\s+комитента"
        - "(?i)одну\\s+или\\s+несколько\\s+сделок"
        - "(?i)минимальн(ая|ой)\\s+цен[аы]\\s+продаж"
        - "(?i)максимальн(ая|ой)\\s+цен[аы]\\s+закуп"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор комиссии по Главе 51 ГК РФ.
        Проверяется один вопрос: модель действия, конкретизация предмета
        и ценовые лимиты.

        Нормативный ориентир:
        - ст. 990 ГК РФ — модель комиссии (от своего имени, за счёт комитента)
        - ст. 992 ГК РФ — исполнение на наиболее выгодных для комитента условиях
        - ст. 995 ГК РФ — ценовые условия и отступление от указаний комитента

        Ключевое:
        - Комиссия (ст. 990) — комиссионер действует «от своего имени,
          но за счёт комитента». Если прямо указано «от имени комитента» —
          это признаки поручения (Гл. 49 ГК РФ), а не комиссии.
        - Ценовые лимиты (ст. 995) — если комитент установил минимальную
          цену продажи или максимальную цену закупки, комиссионер обязан
          их соблюдать. Отступление = обязанность возместить разницу.
        - Конкретизация предмета — если предмет описан абстрактно
          («совершать сделки в интересах»), есть риск незаключённости
          по ст. 432 ГК РФ.

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора,
          а чего прямо нет.
        - Не оценивай серьёзность риска.

        [ЗАДАЧА]
        Найди в тексте договора и классифицируй:
        1. Модель представительства (комиссия / поручение / неясно).
        2. Степень конкретизации предмета.
        3. Наличие и тип ценовых лимитов.
        4. Сформулируй краткое резюме для юриста.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Если данные не указаны прямо — возвращай "not_defined"
           (для статусных полей) или "Данные не определены" (для текстовых).
        4. Не используй "None", "null", "N/A", "-" или пустые строки —
           только явные значения из [ФОРМАТ ОТВЕТА].
        5. В evidence включай только текст договора, без комментариев.
        6. Верни РОВНО один валидный JSON-объект со всеми 5 ключами
           (4 поля + evidence), пригодный для парсинга через json.loads
           без предварительной обработки. Без markdown, без ```json,
           без комментариев, без текста до или после. Начни ответ сразу
           с `{` и закончи `}`.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — полная комиссия с лимитами:
        Фрагмент:
        "Комиссионер обязуется от своего имени, но за счёт Комитента совершить
        сделки по реализации оборудования модели XYZ-100 по цене не ниже
        100 000 рублей за единицу."

        Ответ:
        {
          "representation_model": "commission_true_model",
          "subject_specificity": "specific",
          "pricing_limits_status": "defined",
          "representation_summary": "Модель: комиссия | Предмет: конкретен | Лимиты: определены",
          "evidence": [
            {
              "clause_ref": "п. 2.1",
              "quote": "Комиссионер обязуется от своего имени, но за счёт Комитента совершить сделки по реализации оборудования модели XYZ-100 по цене не ниже 100 000 рублей за единицу."
            }
          ]
        }

        Пример 2 — неясная модель, общий предмет, без лимитов:
        Фрагмент:
        "Комиссионер совершает сделки в интересах Комитента."

        Ответ:
        {
          "representation_model": "unclear",
          "subject_specificity": "generic",
          "pricing_limits_status": "not_defined",
          "representation_summary": "Модель: неясна | Предмет: общий | Лимиты: не установлены",
          "evidence": [
            {
              "clause_ref": "п. 1.1",
              "quote": "Комиссионер совершает сделки в интересах Комитента."
            }
          ]
        }

        Пример 3 — рамочный договор с отсылкой к поручениям:
        Фрагмент:
        "Комиссионер ООО «Гамма» обязуется от своего имени, но за счёт
        Комитента совершать сделки купли-продажи, ассортимент и цены
        которых определяются отдельными Поручениями Комитента. Минимальная
        цена продажи устанавливается Комитентом в каждом Поручении."

        Ответ:
        {
          "representation_model": "commission_true_model",
          "subject_specificity": "framework_specific",
          "pricing_limits_status": "referred",
          "representation_summary": "Модель: комиссия | Предмет: рамочный (по поручениям) | Лимиты: по поручениям",
          "evidence": [
            {
              "clause_ref": "п. 1.1",
              "quote": "Комиссионер ООО «Гамма» обязуется от своего имени, но за счёт Комитента совершать сделки купли-продажи, ассортимент и цены которых определяются отдельными Поручениями Комитента."
            },
            {
              "clause_ref": "п. 1.2",
              "quote": "Минимальная цена продажи устанавливается Комитентом в каждом Поручении."
            }
          ]
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о модели действия (от своего имени / от имени комитента).
        2. Найди прямую цитату о предмете (конкретный товар / рамка / абстракция).
        3. Найди прямую цитату о ценовых лимитах (или об их отсутствии / отсылке).
        4. Сформулируй representation_summary на основе трёх предыдущих полей.
        5. Проверь, что все 5 ключей (4 поля + evidence) присутствуют в JSON
           и значения enum-полей строго из allowed_values.

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "representation_model": "<commission_true_model / mandate_like_model / unclear / not_defined>",
          "subject_specificity": "<specific / framework_specific / generic / not_defined>",
          "pricing_limits_status": "<defined / partial / referred / not_applicable / not_defined>",
          "representation_summary": "<краткое резюме: Модель: ... | Предмет: ... | Лимиты: ...>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 600

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "от своего имени за счёт комитента предмет комиссии реализация закупка минимальная цена максимальная цена ценовые лимиты не ниже не выше"
      retrieval_profile: "scope_of_work_check"
      preferred_unit_types:
        - obligation
        - general_provision
        - representations
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - representations
        - obligations
      negative_keywords:
        - "в целях настоящего"
        - "субкомиссия"
        - "делькредере"
        - "прекращение"
        - "возврат товара"
      position_bias:
        preferred_range: [0.0, 0.40]
        boost: 0.30
        scope: segment
      context_k: 6
      max_chunks: 10
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
        - "invoice"
      preferred_clause_functions:
        - "representations"
        - "obligations"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 600

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 750
      compact_output: false

      presence_signal:
        field: "subject_and_representation_model_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора комиссии
        юридическую классификацию модели действия, оценку конкретизации
        предмета и статус ценовых лимитов.
        Не анализируй вознаграждение, отчётность, субкомиссию или
        прекращение — это отдельные проверки.

        Примечание: сырой факт о модели действия (от чьего имени) уже
        извлекается в базовом fingerprint-чеке (поле acts_in_name_of).
        Здесь ты даёшь юридическую классификацию: является ли конструкция
        комиссией (ст. 990 ГК РФ) или содержит признаки поручения (Гл. 49).
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие 4 поля + evidence (всего 5 ключей):

        0. subject_and_representation_model_check_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (representation_model, subject_specificity, pricing_limits_status)
             ≠ "not_defined";
           - "missing" — если все три содержательных поля = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - representation_model = "not_defined";
           - subject_specificity = "not_defined";
           - pricing_limits_status = "not_defined";
           - representation_summary = "Данные не определены";
           - не выполняй остальные шаги.

        1. representation_model — юридическая модель действия:
           "commission_true_model" / "mandate_like_model" / "unclear" / "not_defined".
        2. subject_specificity — степень конкретизации предмета:
           "specific" / "framework_specific" / "generic" / "not_defined".
        3. pricing_limits_status — наличие и тип ценовых лимитов:
           "defined" / "partial" / "referred" / "not_applicable" / "not_defined".
        4. representation_summary — краткое резюме одной строкой для юриста.
        5. evidence — массив объектов [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}].

        Если данные отсутствуют:
        - статусное поле = "not_defined"
        - summary = "Данные не определены"
        </task>

        <context_rules>
        - Перед остальными полями заполни subject_and_representation_model_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined", representation_summary = "Данные не определены".
        - Используй только текст договора.
        - representation_model:
          * "commission_true_model" — прямо указано «от своего имени, но за счёт комитента» (ст. 990 ГК РФ);
          * "mandate_like_model" — прямо указано «от имени комитента» или «от имени и за счёт комитента» (признаки поручения, Гл. 49 ГК РФ);
          * "unclear" — формулировка неоднозначна (например, «в интересах комитента» без уточнения, от чьего имени);
          * "not_defined" — модель не описана.
        - subject_specificity:
          * "specific" — предмет назван конкретно (наименование товара, модель, ассортимент зафиксирован);
          * "framework_specific" — предмет определён рамочно с отсылкой к поручениям / спецификациям / приложениям;
          * "generic" — абстрактная формулировка без конкретики («совершать сделки в интересах Комитента»);
          * "not_defined" — предмет не описан.
        - pricing_limits_status:
          * "defined" — установлены конкретные лимиты (мин. цена продажи, макс. цена закупки, или оба);
          * "partial" — лимит установлен только для одного направления;
          * "referred" — лимиты определяются отдельным документом (поручением, приложением, спецификацией, прайсом);
          * "not_applicable" — цена утверждается комитентом по каждой сделке индивидуально, понятие лимита неприменимо;
          * "not_defined" — тема ценовых ограничений не упомянута.
        - representation_summary — сформируй строку формата:
          «Модель: {комиссия/поручение/неясна/не определена} | Предмет: {конкретен/рамочный/общий/не определён} | Лимиты: {определены/частичны/по поручениям/неприменимы/не установлены}».
        - Не используй "None", "null", пустые строки.
        - Все текстовые значения пиши на русском языке, кроме служебных enum-значений status-полей.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет описания модели действия, предмета или ценовых условий.
           → presence = "missing";
             все *_status = "not_defined";
             representation_summary = "Данные не определены".

        2. Рамочный предмет с отсылкой к поручениям.
           "Ассортимент и цены определяются отдельными Поручениями Комитента."
           → presence = "present";
             subject_specificity = "framework_specific";
             pricing_limits_status = "referred".

        3. Противоречие между фрагментами.
           В преамбуле указано "от своего имени", а в разделе обязанностей — "от имени Комитента".
           → presence = "unclear";
             representation_model = "unclear";
             representation_summary = "Модель: неясна (противоречие) | Предмет: ... | Лимиты: ...".

        4. Специфика темы: признак поручения вместо комиссии.
           Прямо указано: "Комиссионер действует от имени и за счёт Комитента".
           → presence = "present";
             representation_model = "mandate_like_model" (сигнал юристу о риске переквалификации).
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для subject_and_representation_model_check_presence используй только: "present", "missing", "unclear".
        - Для status-полей используй только значения из allowed_values.
        - Fallback при отсутствии данных:
          * representation_summary → "Данные не определены";
          * все *_status → "not_defined".
        - Fallback при противоречии или неоднозначности:
          * representation_summary → "Не удалось определить (противоречие)";
          * соответствующие *_status → "unclear" или "not_defined".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "subject_and_representation_model_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования по модели действия, предмету и лимитам. Внутреннее агрегатное signal-поле."
          required: true

        - name: "representation_model"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values:
            - "commission_true_model"
            - "mandate_like_model"
            - "unclear"
            - "not_defined"
          description: "Юридическая модель действия: комиссия (ст. 990 ГК РФ) vs поручение (Гл. 49 ГК РФ)."
          required: true
          display_in_grid: false

        - name: "subject_specificity"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values:
            - "specific"
            - "framework_specific"
            - "generic"
            - "not_defined"
          description: "Степень конкретизации предмета комиссии."
          required: true
          display_in_grid: false

        - name: "pricing_limits_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values:
            - "defined"
            - "partial"
            - "referred"
            - "not_applicable"
            - "not_defined"
          description: "Наличие и тип ценовых лимитов (ст. 995 ГК РФ)."
          required: true
          display_in_grid: false

        - name: "representation_summary"
          type: "string"
          presentation: "summary"
          label: "Модель и лимиты"
          description: "Краткое резюме модели действия, конкретизации предмета и ценовых лимитов для DD Grid."
          required: false
          display_in_grid: true
          display_priority: 1

      store_payload: true

  - id: remuneration_expenses_and_retention_check
    name: "Вознаграждение, расходы и удержание комиссионера"
    description: >
      Проверяет определённость комиссионного вознаграждения (размер, формула,
      порядок), механизм возмещения расходов комиссионера и наличие/ограничение
      права удержания причитающихся сумм (ст. 991, 997, 1001 ГК РФ).
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    display_order: 30

    rules:
      keywords:
        - "комиссионное вознаграждение"
        - "вознаграждение комиссионера"
        - "возмещение расходов"
        - "аванс на расходы"
        - "право удержания"
        - "удерживать причитающиеся суммы"
        - "процент от суммы"
        - "расходы включены"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)комиссионн(ое|ого)\\s+вознаграждени"
        - "(?i)возмещени[ея]\\s+расход"
        - "(?i)право\\s+удержан|удерживат[ья].{0,30}причитающ"
        - "(?i)расход[ыа].{0,20}включен[ыа]"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор комиссии по Главе 51 ГК РФ.
        Проверяется один вопрос: вознаграждение, расходы и право удержания.

        Нормативный ориентир:
        - ст. 991 ГК РФ — комиссионное вознаграждение и делькредере
        - ст. 997 ГК РФ — право удержания вещей комитента
        - ст. 1001 ГК РФ — возмещение расходов на исполнение поручения

        Ключевое:
        - Вознаграждение (ст. 991) — существенный признак комиссии.
          Если не определено — применяется ст. 424 ГК РФ (цена,
          взимаемая при сравнимых обстоятельствах).
        - Расходы (ст. 1001) — комитент обязан возместить комиссионеру
          израсходованные на исполнение суммы. На практике часто
          встречается конструкция «расходы включены в вознаграждение»,
          что меняет экономику сделки.
        - Удержание (ст. 997) — императивная норма: комиссионер вправе
          удерживать вещи комитента до уплаты причитающихся сумм.
          Явное исключение или ограничение в договоре — override.
          Молчание = право действует по закону.

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора,
          а чего прямо нет.
        - Не оценивай серьёзность риска.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Определённость вознаграждения (размер, формула, порядок).
        2. Механизм возмещения расходов.
        3. Наличие и объём права удержания.
        4. Сформулируй краткое резюме для юриста.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Если данные не указаны прямо — возвращай "not_defined"
           (для статусных полей) или "Данные не определены" (для текстовых).
        4. Не используй "None", "null", "N/A", "-" или пустые строки —
           только явные значения из [ФОРМАТ ОТВЕТА].
        5. В evidence включай только текст договора, без комментариев.
        6. Верни РОВНО один валидный JSON-объект со всеми 5 ключами
           (4 поля + evidence), пригодный для парсинга через json.loads
           без предварительной обработки. Без markdown, без ```json,
           без комментариев, без текста до или после. Начни ответ сразу
           с `{` и закончи `}`.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — все параметры определены:
        Фрагмент:
        "Вознаграждение Комиссионера составляет 5% от суммы реализации.
        Расходы на хранение и транспортировку возмещаются Комитентом
        по документально подтверждённым затратам. Комиссионер вправе
        удерживать причитающиеся суммы из поступившей выручки."

        Ответ:
        {
          "remuneration_clarity": "defined",
          "expenses_reimbursement_status": "defined",
          "retention_right_status": "defined",
          "remuneration_summary": "Вознаграждение: 5% от реализации | Расходы: возмещаются отдельно | Удержание: разрешено",
          "evidence": [
            {
              "clause_ref": "п. 3.1",
              "quote": "Вознаграждение Комиссионера составляет 5% от суммы реализации."
            },
            {
              "clause_ref": "п. 3.2",
              "quote": "Расходы на хранение и транспортировку возмещаются Комитентом по документально подтверждённым затратам."
            },
            {
              "clause_ref": "п. 3.3",
              "quote": "Комиссионер вправе удерживать причитающиеся суммы из поступившей выручки."
            }
          ]
        }

        Пример 2 — данные отсутствуют:
        Фрагмент:
        "Комиссионер исполняет поручение Комитента."

        Ответ:
        {
          "remuneration_clarity": "not_defined",
          "expenses_reimbursement_status": "not_defined",
          "retention_right_status": "not_defined",
          "remuneration_summary": "Данные не определены",
          "evidence": []
        }

        Пример 3 — расходы включены, удержание ограничено, вознаграждение по приложению:
        Фрагмент:
        "Комиссионное вознаграждение определяется согласно ставкам,
        указанным в Приложении №1 к настоящему Договору. Все расходы
        Комиссионера на исполнение поручения включены в размер
        вознаграждения и отдельно не возмещаются. Комиссионер не вправе
        удерживать имущество Комитента в обеспечение своих требований."

        Ответ:
        {
          "remuneration_clarity": "referred",
          "expenses_reimbursement_status": "included",
          "retention_right_status": "excluded",
          "remuneration_summary": "Вознаграждение: по Приложению №1 | Расходы: включены | Удержание: запрещено",
          "evidence": [
            {
              "clause_ref": "п. 3.1",
              "quote": "Комиссионное вознаграждение определяется согласно ставкам, указанным в Приложении №1 к настоящему Договору."
            },
            {
              "clause_ref": "п. 3.2",
              "quote": "Все расходы Комиссионера на исполнение поручения включены в размер вознаграждения и отдельно не возмещаются."
            },
            {
              "clause_ref": "п. 3.3",
              "quote": "Комиссионер не вправе удерживать имущество Комитента в обеспечение своих требований."
            }
          ]
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о вознаграждении (размер, формула, отсылка).
        2. Найди прямую цитату о возмещении расходов (или включении в вознаграждение).
        3. Найди прямую цитату о праве удержания (или его ограничении/исключении).
        4. Сформулируй remuneration_summary на основе трёх предыдущих полей.
        5. Проверь, что все 5 ключей (4 поля + evidence) присутствуют в JSON
           и значения enum-полей строго из allowed_values.

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "remuneration_clarity": "<defined / partial / referred / not_defined>",
          "expenses_reimbursement_status": "<defined / partial / included / referred / not_defined>",
          "retention_right_status": "<defined / limited / excluded / not_defined>",
          "remuneration_summary": "<краткое резюме: Вознаграждение: ... | Расходы: ... | Удержание: ...>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 500

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "комиссионное вознаграждение размер вознаграждения возмещение расходов аванс право удержания удерживать причитающиеся суммы расходы включены"
      retrieval_profile: "payment_terms_check"
      preferred_unit_types:
        - obligation
        - payment_term
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - procedures
      negative_keywords:
        - "в целях настоящего"
        - "субкомиссия"
        - "делькредере"
        - "прекращение"
        - "возврат товара"
      position_bias:
        preferred_range: [0.15, 0.60]
        boost: 0.30
        scope: segment
      context_k: 6
      max_chunks: 10
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
        - "invoice"
      preferred_clause_functions:
        - "obligations"
        - "procedures"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 580

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 750
      compact_output: false

      presence_signal:
        field: "remuneration_expenses_and_retention_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора комиссии
        финансовые параметры: определённость вознаграждения, механизм
        возмещения расходов и статус права удержания.
        Не анализируй отчётность, субкомиссию, делькредере или
        прекращение — это отдельные проверки.

        Примечание: сигнал наличия вознаграждения (present/unclear)
        уже извлекается в fingerprint-чеке (поле remuneration_status).
        Здесь ты оцениваешь конкретность и механизм.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие 4 поля + evidence (всего 5 ключей):

        0. remuneration_expenses_and_retention_check_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (remuneration_clarity, expenses_reimbursement_status,
              retention_right_status) ≠ "not_defined";
           - "missing" — если все три содержательных поля = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - remuneration_clarity = "not_defined";
           - expenses_reimbursement_status = "not_defined";
           - retention_right_status = "not_defined";
           - remuneration_summary = "Данные не определены";
           - не выполняй остальные шаги.

        1. remuneration_clarity — определённость вознаграждения:
           "defined" / "partial" / "referred" / "not_defined".
        2. expenses_reimbursement_status — механизм возмещения расходов:
           "defined" / "partial" / "included" / "referred" / "not_defined".
        3. retention_right_status — право удержания:
           "defined" / "limited" / "excluded" / "not_defined".
        4. remuneration_summary — краткое резюме одной строкой для юриста.
        5. evidence — массив объектов [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}].

        Если данные отсутствуют — "not_defined" для статусных полей,
        "Данные не определены" для summary.
        </task>

        <context_rules>
        - Перед остальными полями заполни remuneration_expenses_and_retention_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined", remuneration_summary = "Данные не определены".
        - Используй только текст договора.
        - remuneration_clarity:
          * "defined" — размер/формула прямо указаны в тексте (например, «5% от суммы реализации», «10 000 руб. за сделку»);
          * "partial" — вознаграждение упомянуто, но конкретика неполна (например, «вознаграждение согласовывается сторонами» без механизма);
          * "referred" — размер определяется отдельным документом (приложением, поручением, прайсом, спецификацией);
          * "not_defined" — тема вознаграждения не раскрыта.
        - expenses_reimbursement_status:
          * "defined" — механизм возмещения чётко описан (какие расходы, по каким документам, в какой срок);
          * "partial" — возмещение упомянуто, но не для всех видов расходов или без механизма;
          * "included" — прямо указано, что расходы включены в вознаграждение и отдельно не возмещаются;
          * "referred" — порядок возмещения определяется отдельным документом (сметой, приложением);
          * "not_defined" — тема расходов не раскрыта.
        - retention_right_status:
          * "defined" — право удержания прямо закреплено (соответствует ст. 997 ГК РФ);
          * "limited" — право удержания ограничено (например, «только в отношении расходов, но не вознаграждения» или «только в течение 30 дней»);
          * "excluded" — прямо запрещено удержание (override императивной нормы ст. 997 ГК РФ — спорная конструкция, требует внимания юриста);
          * "not_defined" — тема не упомянута (по умолчанию действует ст. 997 ГК РФ).
        - remuneration_summary — сформируй строку формата:
          «Вознаграждение: {определено/частично/по документу/не определено} |
          Расходы: {возмещаются/частично/включены/по документу/не урегулированы} |
          Удержание: {разрешено/ограничено/запрещено/не урегулировано}».
        - Не используй "None", "null", пустые строки.
        - Все текстовые значения пиши на русском языке, кроме служебных enum-значений status-полей.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни упоминания о вознаграждении, ни о расходах, ни о праве удержания.
           → presence = "missing";
             все *_status = "not_defined";
             remuneration_summary = "Данные не определены".

        2. Расходы включены в вознаграждение (альтернативная экономика).
           "Все расходы Комиссионера включены в размер вознаграждения и отдельно не возмещаются."
           → presence = "present";
             expenses_reimbursement_status = "included";
             соответствующие *_status отражают наличие условия.

        3. Противоречие между фрагментами.
           В одном пункте указано "вознаграждение 5%", в другом — "вознаграждение согласовывается сторонами по каждой сделке".
           → presence = "unclear";
             remuneration_clarity = "partial" или "not_defined";
             remuneration_summary = "Не удалось определить (противоречие)".

        4. Специфика темы: запрет удержания (override императивной нормы).
           "Комиссионер не вправе удерживать имущество Комитента в обеспечение своих требований."
           → presence = "present";
             retention_right_status = "excluded" (сигнал юристу о спорной конструкции).
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для remuneration_expenses_and_retention_check_presence используй только: "present", "missing", "unclear".
        - Для status-полей используй только значения из allowed_values.
        - Fallback при отсутствии данных:
          * remuneration_summary → "Данные не определены";
          * все *_status → "not_defined".
        - Fallback при противоречии или неоднозначности:
          * remuneration_summary → "Не удалось определить (противоречие)";
          * соответствующие *_status → "not_defined" или "partial".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "remuneration_expenses_and_retention_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования по вознаграждению/расходам/удержанию. Внутреннее агрегатное signal-поле."
          required: true

        - name: "remuneration_clarity"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values:
            - "defined"
            - "partial"
            - "referred"
            - "not_defined"
          description: "Определённость комиссионного вознаграждения (ст. 991 ГК РФ)."
          required: true
          display_in_grid: false

        - name: "expenses_reimbursement_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values:
            - "defined"
            - "partial"
            - "included"
            - "referred"
            - "not_defined"
          description: "Механизм возмещения расходов комиссионера (ст. 1001 ГК РФ)."
          required: true
          display_in_grid: false

        - name: "retention_right_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values:
            - "defined"
            - "limited"
            - "excluded"
            - "not_defined"
          description: "Право удержания причитающихся сумм (ст. 997 ГК РФ, императивная норма)."
          required: true
          display_in_grid: false

        - name: "remuneration_summary"
          type: "string"
          presentation: "summary"
          label: "Вознаграждение и расходы"
          description: "Краткое резюме финансовых условий комиссии для DD Grid."
          required: false
          display_in_grid: true
          display_priority: 1

      store_payload: true

  - id: reporting_and_proceeds_transfer_check
    name: "Отчёт комиссионера и перечисление выручки"
    description: >
      Проверяет порядок и периодичность отчётности комиссионера,
      срок возражений комитента на отчёт и срок перечисления выручки
      (ст. 999 ГК РФ). Критично для контроля исполнения и cash-flow комитента.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    display_order: 40

    rules:
      keywords:
        - "отчет комиссионера"
        - "отчёт комиссионера"
        - "утверждение отчета"
        - "утверждение отчёта"
        - "возражения на отчет"
        - "возражения на отчёт"
        - "перечисление выручки"
        - "срок перечисления"
        - "молчание считается согласием"
        - "отчет считается принятым"
        - "отчёт считается принятым"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)отч[её]т\\s+комиссионер"
        - "(?i)возражени[яй]\\s+на\\s+отч[её]т|утверждени[ея]\\s+отч[её]та"
        - "(?i)перечислени[ея]\\s+выручк"
        - "(?i)молчани[ея].{0,20}согласи|отч[её]т.{0,20}принят"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор комиссии по Главе 51 ГК РФ.
        Проверяется один вопрос: отчётность комиссионера и перечисление выручки.

        Нормативный ориентир:
        - ст. 999 ГК РФ — отчёт комиссионера, срок возражений, перечисление выручки

        Ключевое:
        - Отчёт (ст. 999 п.1) — комиссионер обязан представить отчёт
          и приложить оправдательные документы.
        - Срок возражений (ст. 999 п.3) — если договором не установлен
          срок, комитент обязан заявить возражения в течение 30 дней
          со дня получения отчёта. Молчание = отчёт принят.
        - Перечисление выручки (ст. 999 п.2) — комиссионер обязан
          перечислить выручку «немедленно» по получении. На практике
          стороны часто конкретизируют срок (N рабочих/календарных дней).

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора,
          а чего прямо нет.
        - Не оценивай серьёзность риска.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Порядок и периодичность отчётности.
        2. Срок возражений комитента на отчёт.
        3. Срок перечисления выручки комитенту.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Если данные не указаны прямо — возвращай "not_defined"
           (для статусных полей) или "Данные не определены" (для текстовых).
        4. Не используй "None", "null", "N/A", "-" или пустые строки —
           только явные значения из [ФОРМАТ ОТВЕТА].
        5. В evidence включай только текст договора, без комментариев.
        6. Верни РОВНО один валидный JSON-объект со всеми 5 ключами
           (4 поля + evidence), пригодный для парсинга через json.loads
           без предварительной обработки. Без markdown, без ```json,
           без комментариев, без текста до или после. Начни ответ сразу
           с `{` и закончи `}`.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — все параметры определены:
        Фрагмент:
        "Комиссионер представляет отчёт ежемесячно до 10-го числа
        следующего месяца. Комитент вправе заявить возражения в течение
        10 рабочих дней с момента получения отчёта. Выручка перечисляется
        не позднее 5 рабочих дней после утверждения отчёта."

        Ответ:
        {
          "reporting_status": "defined",
          "report_objection_period": "defined",
          "proceeds_transfer_timing": "defined",
          "reporting_summary": "Отчёт: ежемесячно до 10-го | Возражения: 10 р.д. | Выручка: 5 р.д. после утверждения",
          "evidence": [
            {
              "clause_ref": "п. 4.1",
              "quote": "Комиссионер представляет отчёт ежемесячно до 10-го числа следующего месяца."
            },
            {
              "clause_ref": "п. 4.2",
              "quote": "Комитент вправе заявить возражения в течение 10 рабочих дней с момента получения отчёта."
            },
            {
              "clause_ref": "п. 4.3",
              "quote": "Выручка перечисляется не позднее 5 рабочих дней после утверждения отчёта."
            }
          ]
        }

        Пример 2 — данные отсутствуют:
        Фрагмент:
        "Комиссионер исполняет поручение Комитента."

        Ответ:
        {
          "reporting_status": "not_defined",
          "report_objection_period": "not_defined",
          "proceeds_transfer_timing": "not_defined",
          "reporting_summary": "Данные не определены",
          "evidence": []
        }

        Пример 3 — отсылка к закону, немедленное перечисление:
        Фрагмент:
        "Комиссионер представляет отчёт по каждому поручению в течение
        5 дней после его исполнения. Порядок утверждения отчёта и срок
        возражений определяются в соответствии с действующим
        законодательством. Комиссионер перечисляет выручку Комитенту
        немедленно по её получении."

        Ответ:
        {
          "reporting_status": "defined",
          "report_objection_period": "by_law",
          "proceeds_transfer_timing": "immediate",
          "reporting_summary": "Отчёт: по каждому поручению за 5 дней | Возражения: по закону (30 дней) | Выручка: немедленно",
          "evidence": [
            {
              "clause_ref": "п. 4.1",
              "quote": "Комиссионер представляет отчёт по каждому поручению в течение 5 дней после его исполнения."
            },
            {
              "clause_ref": "п. 4.2",
              "quote": "Порядок утверждения отчёта и срок возражений определяются в соответствии с действующим законодательством."
            },
            {
              "clause_ref": "п. 4.3",
              "quote": "Комиссионер перечисляет выручку Комитенту немедленно по её получении."
            }
          ]
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о порядке/периодичности отчётности.
        2. Найди прямую цитату о сроке возражений (или отсылку к закону).
        3. Найди прямую цитату о сроке перечисления выручки.
        4. Сформулируй reporting_summary на основе трёх предыдущих полей.
        5. Проверь, что все 5 ключей (4 поля + evidence) присутствуют в JSON
           и значения enum-полей строго из allowed_values.

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "reporting_status": "<defined / partial / referred / not_defined>",
          "report_objection_period": "<defined / by_law / not_defined>",
          "proceeds_transfer_timing": "<defined / immediate / by_law / referred / not_defined>",
          "reporting_summary": "<краткое резюме: Отчёт: ... | Возражения: ... | Выручка: ...>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 500

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "отчёт комиссионера утверждение отчёта возражения на отчёт перечисление выручки срок перечисления немедленно"
      retrieval_profile: "payment_terms_check"
      preferred_unit_types:
        - obligation
        - payment_term
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - procedures
      negative_keywords:
        - "в целях настоящего"
        - "субкомиссия"
        - "делькредере"
        - "прекращение"
        - "возврат товара"
      position_bias:
        preferred_range: [0.25, 0.70]
        boost: 0.30
        scope: segment
      context_k: 6
      max_chunks: 10
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
        - "invoice"
      preferred_clause_functions:
        - "obligations"
        - "procedures"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 580

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 750
      compact_output: false

      presence_signal:
        field: "reporting_and_proceeds_transfer_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора комиссии
        параметры отчётности и движения выручки: порядок отчётности,
        срок возражений на отчёт и срок перечисления выручки.
        Не анализируй вознаграждение, субкомиссию, делькредере или
        прекращение — это отдельные проверки.

        Примечание: сигнал наличия отчётности (present/not_defined)
        уже извлекается в fingerprint-чеке (поле reporting_status).
        Здесь ты оцениваешь конкретность механизмов.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие 4 поля + evidence (всего 5 ключей):

        0. reporting_and_proceeds_transfer_check_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (reporting_status, report_objection_period,
              proceeds_transfer_timing) ≠ "not_defined";
           - "missing" — если все три содержательных поля = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - reporting_status = "not_defined";
           - report_objection_period = "not_defined";
           - proceeds_transfer_timing = "not_defined";
           - reporting_summary = "Данные не определены";
           - не выполняй остальные шаги.

        1. reporting_status — порядок отчётности:
           "defined" / "partial" / "referred" / "not_defined".
        2. report_objection_period — срок возражений на отчёт:
           "defined" / "by_law" / "not_defined".
        3. proceeds_transfer_timing — срок перечисления выручки:
           "defined" / "immediate" / "by_law" / "referred" / "not_defined".
        4. reporting_summary — краткое резюме одной строкой для юриста.
        5. evidence — массив объектов [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}].

        Если данные отсутствуют — "not_defined" для статусных полей,
        "Данные не определены" для summary.
        </task>

        <context_rules>
        - Перед остальными полями заполни reporting_and_proceeds_transfer_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined", reporting_summary = "Данные не определены".
        - Используй только текст договора.
        - reporting_status:
          * "defined" — периодичность и форма отчёта чётко указаны (например, «ежемесячно до 10-го числа», «по каждому поручению»);
          * "partial" — отчётность упомянута, но периодичность или форма не конкретизированы;
          * "referred" — порядок отчётности определяется отдельным документом (регламентом, приложением, поручением);
          * "not_defined" — тема отчётности не раскрыта.
        - report_objection_period:
          * "defined" — срок возражений прямо указан в договоре (например, «в течение 10 рабочих дней»);
          * "by_law" — прямо указано, что срок определяется законодательством, или отсылка к ст. 999 ГК РФ (по умолчанию — 30 дней);
          * "not_defined" — тема возражений не упомянута (по умолчанию действует ст. 999 п.3 — 30 дней, молчание = принятие отчёта).
        - proceeds_transfer_timing:
          * "defined" — конкретный срок указан (например, «в течение 5 рабочих дней после утверждения отчёта»);
          * "immediate" — прямо указано «немедленно» или «незамедлительно» (соответствует ст. 999 п.2 ГК РФ);
          * "by_law" — отсылка к законодательству без конкретизации;
          * "referred" — срок определяется отдельным документом (поручением, графиком, приложением);
          * "not_defined" — тема перечисления выручки не раскрыта (по умолчанию — «немедленно» по ст. 999 п.2 ГК РФ).
        - reporting_summary — сформируй строку формата:
          «Отчёт: {ежемесячно/по поручению/частично/по документу/не урегулирован} |
          Возражения: {N дней/по закону/не урегулированы} |
          Выручка: {N дней/немедленно/по закону/по документу/не урегулирована}».
        - Не используй "None", "null", пустые строки.
        - Все текстовые значения пиши на русском языке, кроме служебных enum-значений status-полей.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни упоминания об отчётности, ни о сроке возражений, ни о перечислении выручки.
           → presence = "missing";
             все *_status = "not_defined";
             reporting_summary = "Данные не определены".

        2. Отсылка к закону (применяются диспозитивные нормы ст. 999 ГК РФ).
           "Порядок утверждения отчёта и срок возражений определяются в соответствии с действующим законодательством."
           → presence = "present";
             report_objection_period = "by_law";
             соответствующие *_status отражают наличие условия.

        3. Противоречие между фрагментами.
           В одном пункте указано "отчёт ежемесячно", в другом — "отчёт по каждому поручению".
           → presence = "unclear";
             reporting_status = "partial" или "not_defined";
             reporting_summary = "Не удалось определить (противоречие)".

        4. Специфика темы: немедленное перечисление выручки (ст. 999 п.2 ГК РФ).
           "Комиссионер перечисляет выручку Комитенту немедленно по её получении."
           → presence = "present";
             proceeds_transfer_timing = "immediate";
             reporting_summary отражает немедленный характер.
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для reporting_and_proceeds_transfer_check_presence используй только: "present", "missing", "unclear".
        - Для status-полей используй только значения из allowed_values.
        - Fallback при отсутствии данных:
          * reporting_summary → "Данные не определены";
          * все *_status → "not_defined".
        - Fallback при противоречии или неоднозначности:
          * reporting_summary → "Не удалось определить (противоречие)";
          * соответствующие *_status → "not_defined" или "partial".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "reporting_and_proceeds_transfer_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования по отчётности/перечислению выручки. Внутреннее агрегатное signal-поле."
          required: true

        - name: "reporting_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values:
            - "defined"
            - "partial"
            - "referred"
            - "not_defined"
          description: "Порядок и периодичность отчётности комиссионера (ст. 999 п.1 ГК РФ)."
          required: true
          display_in_grid: false

        - name: "report_objection_period"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values:
            - "defined"
            - "by_law"
            - "not_defined"
          description: "Срок возражений комитента на отчёт (ст. 999 п.3 ГК РФ, по умолчанию 30 дней)."
          required: true
          display_in_grid: false

        - name: "proceeds_transfer_timing"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values:
            - "defined"
            - "immediate"
            - "by_law"
            - "referred"
            - "not_defined"
          description: "Срок перечисления выручки комитенту (ст. 999 п.2 ГК РФ, по умолчанию немедленно)."
          required: true
          display_in_grid: false

        - name: "reporting_summary"
          type: "string"
          presentation: "summary"
          label: "Отчёт и выручка"
          description: "Краткое резюме отчётности и перечисления выручки для DD Grid."
          required: false
          display_in_grid: true
          display_priority: 1

      store_payload: true

  - id: ownership_and_segregation_check
    name: "Сохранение собственности комитента и обособление товара"
    description: >
      Проверяет оговорки о сохранении права собственности комитента на товар,
      условия обособленного учёта и раздельного хранения, а также защитные
      оговорки от включения имущества комитента в конкурсную массу
      при банкротстве комиссионера (ст. 996 ГК РФ, ст. 132 ФЗ о банкротстве).
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    display_order: 50

    rules:
      keywords:
        - "право собственности сохраняется за комитентом"
        - "собственность комитента"
        - "обособленный учет"
        - "обособленный учёт"
        - "раздельное хранение"
        - "не подлежит взысканию по долгам комиссионера"
        - "маркировка товара"
        - "конкурсная масса"
        - "переход права собственности"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)право\\s+собственности\\s+сохраняется\\s+за\\s+комитентом"
        - "(?i)обособленн(ый|ого)\\s+уч[её]т|раздельн(ое|ого)\\s+хранен"
        - "(?i)не\\s+подлежит\\s+взысканию\\s+по\\s+долгам\\s+комиссионера"
        - "(?i)переход\\s+прав[ао]\\s+собственности"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор комиссии по Главе 51 ГК РФ.
        Проверяется один вопрос: собственность комитента, обособление
        товара и защита от банкротства комиссионера.

        Нормативный ориентир:
        - ст. 996 п.1 ГК РФ — вещи, поступившие комиссионеру от комитента,
          являются собственностью комитента
        - ст. 996 п.2 ГК РФ — комиссионер обязан обособить имущество
          комитента от своего имущества
        - ст. 132 ФЗ «О несостоятельности (банкротстве)» — имущество,
          принадлежащее комитенту, не включается в конкурсную массу
          комиссионера

        Ключевое:
        - Собственность комитента (ст. 996 п.1) — императивная норма.
          Даже без явной оговорки товар принадлежит комитенту.
          Но явная оговорка усиливает позицию в споре.
        - Если в договоре прямо указано, что собственность ПЕРЕХОДИТ
          к комиссионеру — это признак купли-продажи, а не комиссии.
          Красный флаг для квалификации сделки.
        - Обособление (ст. 996 п.2) — императивное требование:
          раздельное хранение + обособленный учёт.
        - Банкротство — на практике явная оговорка «имущество комитента
          не входит в конкурсную массу» упрощает изъятие товара
          при банкротстве комиссионера.

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора,
          а чего прямо нет.
        - Не оценивай серьёзность риска.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Оговорку о сохранении (или переходе) права собственности.
        2. Условия обособления (раздельное хранение, учёт, маркировка).
        3. Защитные оговорки от банкротства комиссионера.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Если данные не указаны прямо — возвращай "not_defined"
           (для статусных полей) или "Данные не определены" (для текстовых).
        4. Не используй "None", "null", "N/A", "-" или пустые строки —
           только явные значения из [ФОРМАТ ОТВЕТА].
        5. В evidence включай только текст договора, без комментариев.
        6. Верни РОВНО один валидный JSON-объект со всеми 5 ключами
           (4 поля + evidence), пригодный для парсинга через json.loads
           без предварительной обработки. Без markdown, без ```json,
           без комментариев, без текста до или после. Начни ответ сразу
           с `{` и закончи `}`.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — полная защита:
        Фрагмент:
        "Право собственности на товар сохраняется за Комитентом до момента
        его реализации третьему лицу. Комиссионер обязан обеспечить
        раздельное хранение и обособленный учёт товара Комитента.
        Имущество Комитента не подлежит взысканию по долгам Комиссионера
        и не включается в его конкурсную массу."

        Ответ:
        {
          "ownership_clause_status": "defined",
          "segregation_status": "defined",
          "bankruptcy_protection_status": "defined",
          "ownership_summary": "Собственность: сохраняется за комитентом | Обособление: раздельное хранение и учёт | Банкротство: защищено",
          "evidence": [
            {
              "clause_ref": "п. 5.1",
              "quote": "Право собственности на товар сохраняется за Комитентом до момента его реализации третьему лицу."
            },
            {
              "clause_ref": "п. 5.2",
              "quote": "Комиссионер обязан обеспечить раздельное хранение и обособленный учёт товара Комитента."
            },
            {
              "clause_ref": "п. 5.3",
              "quote": "Имущество Комитента не подлежит взысканию по долгам Комиссионера и не включается в его конкурсную массу."
            }
          ]
        }

        Пример 2 — данные отсутствуют:
        Фрагмент:
        "Комиссионер принимает товар на хранение."

        Ответ:
        {
          "ownership_clause_status": "not_defined",
          "segregation_status": "not_defined",
          "bankruptcy_protection_status": "not_defined",
          "ownership_summary": "Данные не определены",
          "evidence": []
        }

        Пример 3 — переход собственности (красный флаг) + частичное обособление:
        Фрагмент:
        "Право собственности на товар переходит к Комиссионеру в момент
        его передачи на склад Комиссионера. Комиссионер обеспечивает
        раздельное хранение товара Комитента."

        Ответ:
        {
          "ownership_clause_status": "explicit_transfer",
          "segregation_status": "partial",
          "bankruptcy_protection_status": "not_defined",
          "ownership_summary": "Собственность: переходит к комиссионеру (красный флаг) | Обособление: только раздельное хранение | Банкротство: не урегулировано",
          "evidence": [
            {
              "clause_ref": "п. 5.1",
              "quote": "Право собственности на товар переходит к Комиссионеру в момент его передачи на склад Комиссионера."
            },
            {
              "clause_ref": "п. 5.2",
              "quote": "Комиссионер обеспечивает раздельное хранение товара Комитента."
            }
          ]
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о праве собственности (сохранение / переход).
        2. Найди прямую цитату об обособлении (хранение / учёт / маркировка).
        3. Найди прямую цитату о защите от банкротства (конкурсная масса / взыскание).
        4. Сформулируй ownership_summary на основе трёх предыдущих полей.
        5. Проверь, что все 5 ключей (4 поля + evidence) присутствуют в JSON
           и значения enum-полей строго из allowed_values.

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "ownership_clause_status": "<defined / explicit_transfer / not_defined>",
          "segregation_status": "<defined / partial / referred / not_defined>",
          "bankruptcy_protection_status": "<defined / explicit_waiver / not_defined>",
          "ownership_summary": "<краткое резюме: Собственность: ... | Обособление: ... | Банкротство: ...>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 500

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "право собственности комитент обособленный учёт раздельное хранение взыскание по долгам комиссионера конкурсная масса маркировка"
      retrieval_profile: "title_transfer_check"
      preferred_unit_types:
        - obligation
        - title_transfer
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - representations
      negative_keywords:
        - "в целях настоящего"
        - "субкомиссия"
        - "делькредере"
        - "прекращение"
      position_bias:
        preferred_range: [0.10, 0.55]
        boost: 0.30
        scope: segment
      context_k: 6
      max_chunks: 10
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
        - "invoice"
      preferred_clause_functions:
        - "obligations"
        - "representations"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 600

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 750
      compact_output: false

      presence_signal:
        field: "ownership_and_segregation_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора комиссии
        параметры имущественного режима: сохранение собственности
        комитента, обособление товара и защита от банкротства.
        Не анализируй вознаграждение, отчётность, субкомиссию или
        прекращение — это отдельные проверки.

        Примечание: сигнал наличия оговорки о собственности
        (present/not_defined) уже извлекается в fingerprint-чеке
        (поле goods_ownership_clause). Здесь ты даёшь детальную
        оценку и выявляешь красные флаги (переход собственности,
        отказ от защиты).
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие 4 поля + evidence (всего 5 ключей):

        0. ownership_and_segregation_check_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (ownership_clause_status, segregation_status,
              bankruptcy_protection_status) ≠ "not_defined";
           - "missing" — если все три содержательных поля = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - ownership_clause_status = "not_defined";
           - segregation_status = "not_defined";
           - bankruptcy_protection_status = "not_defined";
           - ownership_summary = "Данные не определены";
           - не выполняй остальные шаги.

        1. ownership_clause_status — оговорка о собственности:
           "defined" / "explicit_transfer" / "not_defined".
        2. segregation_status — обособление товара:
           "defined" / "partial" / "referred" / "not_defined".
        3. bankruptcy_protection_status — защита от банкротства:
           "defined" / "explicit_waiver" / "not_defined".
        4. ownership_summary — краткое резюме имущественного режима для юриста.
        5. evidence — массив объектов [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}].

        Если данные отсутствуют — "not_defined" для статусных полей,
        "Данные не определены" для summary.
        </task>

        <context_rules>
        - Перед остальными полями заполни ownership_and_segregation_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined", ownership_summary = "Данные не определены".
        - Используй только текст договора.
        - ownership_clause_status:
          * "defined" — прямо указано, что собственность сохраняется за комитентом (соответствует ст. 996 п.1 ГК РФ);
          * "explicit_transfer" — прямо указано, что собственность переходит к комиссионеру (красный флаг: признак купли-продажи, а не комиссии);
          * "not_defined" — тема собственности не раскрыта в тексте (по умолчанию действует ст. 996 п.1 — собственность комитента).
        - segregation_status:
          * "defined" — прямо указаны и раздельное хранение, и обособленный учёт (ст. 996 п.2 ГК РФ);
          * "partial" — указано только одно из двух (хранение ИЛИ учёт), или формулировка неполная;
          * "referred" — порядок обособления определяется отдельным регламентом, приложением, инструкцией;
          * "not_defined" — тема обособления не раскрыта (по умолчанию действует ст. 996 п.2 — обязанность обособить).
        - bankruptcy_protection_status:
          * "defined" — прямо указано, что имущество комитента не входит в конкурсную массу / не подлежит взысканию по долгам комиссионера;
          * "explicit_waiver" — прямо указано обратное: комиссионер вправе обратить взыскание на имущество комитента или включить его в конкурсную массу (красный флаг);
          * "not_defined" — тема не упомянута (по умолчанию действует ст. 996 п.2 ГК РФ + ст. 132 ФЗ о банкротстве — имущество комитента защищено).
        - ownership_summary — сформируй строку формата:
          «Собственность: {сохраняется/переходит/не урегулирована} |
          Обособление: {раздельное хранение и учёт/частично/по документу/не урегулировано} |
          Банкротство: {защищено/отказ от защиты/не урегулировано}».
        - Не используй "None", "null", пустые строки.
        - Все текстовые значения пиши на русском языке, кроме служебных enum-значений status-полей.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни упоминания о собственности, ни об обособлении, ни о защите при банкротстве.
           → presence = "missing";
             все *_status = "not_defined";
             ownership_summary = "Данные не определены".

        2. Явный переход собственности (красный флаг).
           "Право собственности на товар переходит к Комиссионеру в момент его передачи."
           → presence = "present";
             ownership_clause_status = "explicit_transfer";
             ownership_summary отражает красный флаг.

        3. Частичное обособление.
           "Комиссионер обеспечивает раздельное хранение товара Комитента" (без упоминания учёта).
           → presence = "present";
             segregation_status = "partial".

        4. Специфика темы: явный отказ от защиты при банкротстве (красный флаг).
           "Имущество Комитента может быть обращено взысканием по долгам Комиссионера."
           → presence = "present";
             bankruptcy_protection_status = "explicit_waiver".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для ownership_and_segregation_check_presence используй только: "present", "missing", "unclear".
        - Для status-полей используй только значения из allowed_values.
        - Fallback при отсутствии данных:
          * ownership_summary → "Данные не определены";
          * все *_status → "not_defined".
        - Fallback при противоречии или неоднозначности:
          * ownership_summary → "Не удалось определить (противоречие)";
          * соответствующие *_status → "not_defined" или "partial".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "ownership_and_segregation_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования по собственности/обособлению/банкротству. Внутреннее агрегатное signal-поле."
          required: true

        - name: "ownership_clause_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values:
            - "defined"
            - "explicit_transfer"
            - "not_defined"
          description: "Оговорка о сохранении собственности комитента (ст. 996 п.1 ГК РФ). explicit_transfer — красный флаг (купля-продажа)."
          required: true
          display_in_grid: false

        - name: "segregation_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values:
            - "defined"
            - "partial"
            - "referred"
            - "not_defined"
          description: "Обособление товара: раздельное хранение и учёт (ст. 996 п.2 ГК РФ)."
          required: true
          display_in_grid: false

        - name: "bankruptcy_protection_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values:
            - "defined"
            - "explicit_waiver"
            - "not_defined"
          description: "Защита от включения имущества комитента в конкурсную массу (ст. 132 ФЗ о банкротстве)."
          required: true
          display_in_grid: false

        - name: "ownership_summary"
          type: "string"
          presentation: "summary"
          label: "Собственность и обособление"
          description: "Краткое резюме имущественного режима для DD Grid."
          required: false
          display_in_grid: true
          display_priority: 1

      store_payload: true

  - id: additional_benefit_check
    name: "Распределение дополнительной выгоды (ст. 992 ГК РФ)"
    description: >
      Проверяет порядок распределения дополнительной выгоды при совершении
      комиссионером сделки на более выгодных условиях, чем было указано
      комитентом. По умолчанию делится поровну (ст. 992 ГК РФ).
    triggers: {}
    ui_mode: "field_extraction"
    severity: "medium"
    severity_if_pass: "pass"
    severity_if_fail: "medium"
    severity_if_unclear: "low"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    display_order: 60

    rules:
      keywords:
        - "дополнительная выгода"
        - "делится поровну"
        - "более выгодные условия"
        - "превышение цены"
        - "выгода распределяется"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)дополнительн(ая|ой)\\s+выгод"
        - "(?i)делитс[яь]\\s+.*поровну"
        - "(?i)более\\s+выгодн(ых|ые)\\s+услови"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор комиссии по Главе 51 ГК РФ.
        Проверяется один вопрос: распределение дополнительной выгоды.

        Нормативный ориентир:
        - ст. 992 ГК РФ — дополнительная выгода

        Ключевое:
        - В случае, когда комиссионер совершил сделку на условиях более
          выгодных, чем те, которые были указаны комитентом (например,
          продал дороже или купил дешевле), возникает дополнительная выгода.
        - Диспозитивная норма закона (ст. 992): дополнительная выгода
          делится между комитентом и комиссионером поровну (50/50),
          если иное не установлено соглашением сторон.
        - Молчание договора = действует закон (выгода делится поровну).
        - Договор может изменять эту пропорцию (например, «вся выгода
          переходит комитенту» или «вся выгода удерживается комиссионером»).

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора,
          а чего прямо нет.
        - Не оценивай серьёзность риска.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Упомянута ли дополнительная выгода.
        2. Какая модель её распределения установлена (поровну, полностью
           одной из сторон, иная пропорция, по закону).

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Если данные не указаны прямо — возвращай "not_defined"
           (для статусных полей) или "Данные не определены" (для текстовых).
        4. Не используй "None", "null", "N/A", "-" или пустые строки —
           только явные значения из [ФОРМАТ ОТВЕТА].
        5. В evidence включай только текст договора, без комментариев.
        6. Верни РОВНО один валидный JSON-объект со всеми 4 ключами
           (3 поля + evidence), пригодный для парсинга через json.loads
           без предварительной обработки. Без markdown, без ```json,
           без комментариев, без текста до или после. Начни ответ сразу
           с `{` и закончи `}`.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — явное распределение поровну:
        Фрагмент:
        "Дополнительная выгода, полученная при совершении сделки на более
        выгодных условиях, делится между Комитентом и Комиссионером поровну."

        Ответ:
        {
          "additional_benefit_status": "defined",
          "distribution_model": "equal_split",
          "additional_benefit_summary": "Выгода делится поровну (50/50)",
          "evidence": [
            {
              "clause_ref": "п. 6.1",
              "quote": "Дополнительная выгода, полученная при совершении сделки на более выгодных условиях, делится между Комитентом и Комиссионером поровну."
            }
          ]
        }

        Пример 2 — данные отсутствуют (применяется закон):
        Фрагмент:
        "Комиссионер совершает сделки по цене, указанной в поручении."

        Ответ:
        {
          "additional_benefit_status": "not_defined",
          "distribution_model": "not_defined",
          "additional_benefit_summary": "Условие отсутствует (по закону — поровну)",
          "evidence": []
        }

        Пример 3 — вся выгода комитенту:
        Фрагмент:
        "Вся дополнительная выгода, полученная в результате продажи товара
        по цене выше согласованной, подлежит перечислению Комитенту
        и не может удерживаться Комиссионером."

        Ответ:
        {
          "additional_benefit_status": "defined",
          "distribution_model": "all_to_principal",
          "additional_benefit_summary": "Вся выгода переходит Комитенту",
          "evidence": [
            {
              "clause_ref": "п. 6.1",
              "quote": "Вся дополнительная выгода, полученная в результате продажи товара по цене выше согласованной, подлежит перечислению Комитенту и не может удерживаться Комиссионером."
            }
          ]
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о дополнительной выгоде (или о её отсутствии).
        2. Найди прямую цитату о пропорции распределения (поровну / одной стороне / иное).
        3. Сформулируй additional_benefit_summary на основе двух предыдущих полей.
        4. Проверь, что все 4 ключа (3 поля + evidence) присутствуют в JSON
           и значения enum-полей строго из allowed_values.

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "additional_benefit_status": "<defined / not_defined>",
          "distribution_model": "<equal_split / all_to_principal / all_to_commissioner / custom / not_defined>",
          "additional_benefit_summary": "<краткое резюме одной строкой>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 500

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "дополнительная выгода делится поровну более выгодные условия превышение цены выгода распределяется"
      retrieval_profile: "payment_terms_check"
      preferred_unit_types:
        - obligation
        - payment_term
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - procedures
      negative_keywords:
        - "в целях настоящего"
        - "субкомиссия"
        - "делькредере"
        - "прекращение"
        - "возврат товара"
      position_bias:
        preferred_range: [0.20, 0.65]
        boost: 0.30
        scope: segment
      context_k: 6
      max_chunks: 10
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
        - "invoice"
      preferred_clause_functions:
        - "obligations"
        - "procedures"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 30
      max_snippet_length: 500

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 750
      compact_output: false

      presence_signal:
        field: "additional_benefit_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора комиссии
        условия распределения дополнительной выгоды.
        Не анализируй размер основного вознаграждения, отчётность,
        субкомиссию или прекращение — это отдельные проверки.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие 3 поля + evidence (всего 4 ключа):

        0. additional_benefit_check_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (additional_benefit_status, distribution_model) ≠ "not_defined";
           - "missing" — если оба содержательных поля = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - additional_benefit_status = "not_defined";
           - distribution_model = "not_defined";
           - additional_benefit_summary = "Условие отсутствует (по закону — поровну)";
           - не выполняй остальные шаги.

        1. additional_benefit_status — наличие условия о выгоде:
           "defined" / "not_defined".
        2. distribution_model — модель распределения выгоды:
           "equal_split" / "all_to_principal" / "all_to_commissioner" / "custom" / "not_defined".
        3. additional_benefit_summary — краткое резюме распределения для юриста.
        4. evidence — массив объектов [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}].

        Если данные отсутствуют — "not_defined" для статусных полей,
        "Условие отсутствует (по закону — поровну)" для summary.
        </task>

        <context_rules>
        - Перед остальными полями заполни additional_benefit_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined", additional_benefit_summary = "Условие отсутствует (по закону — поровну)".
        - Используй только текст договора.
        - additional_benefit_status:
          * "defined" — тема дополнительной выгоды прямо урегулирована;
          * "not_defined" — в тексте нет упоминаний о дополнительной выгоде (в этом случае по умолчанию действует закон — ст. 992 ГК РФ — выгода делится поровну).
        - distribution_model:
          * "equal_split" — прямо указано, что выгода делится поровну (50/50), или дублируется текст ст. 992 ГК РФ;
          * "all_to_principal" — прямо указано, что вся дополнительная выгода переходит к комитенту;
          * "all_to_commissioner" — прямо указано, что вся выгода удерживается комиссионером (или идет сверх вознаграждения);
          * "custom" — установлена иная пропорция (например, 70/30, 60/40);
          * "not_defined" — пропорция не описана (по умолчанию применяется ст. 992 ГК РФ).
        - additional_benefit_summary — сформируй резюме:
          * если "not_defined" → "Условие отсутствует (по закону — поровну)";
          * если "equal_split" → "Выгода делится поровну (50/50)";
          * если "all_to_principal" → "Вся выгода переходит Комитенту";
          * если "all_to_commissioner" → "Вся выгода переходит Комиссионеру";
          * если "custom" → указать пропорцию по договору.
        - Не используй "None", "null", пустые строки.
        - Все текстовые значения пиши на русском языке, кроме служебных enum-значений status-полей.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы (молчание = поровну по закону).
           В тексте нет упоминаний о дополнительной выгоде или её распределении.
           → presence = "missing";
             все *_status = "not_defined";
             additional_benefit_summary = "Условие отсутствует (по закону — поровну)".

        2. Явное распределение поровну (дублирование диспозитивной нормы).
           "Дополнительная выгода делится между Комитентом и Комиссионером поровну."
           → presence = "present";
             additional_benefit_status = "defined";
             distribution_model = "equal_split".

        3. Вся выгода одной из сторон.
           "Вся дополнительная выгода подлежит перечислению Комитенту."
           → presence = "present";
             distribution_model = "all_to_principal".

        4. Специфика темы: кастомная пропорция.
           "Дополнительная выгода распределяется в пропорции 70% Комитенту и 30% Комиссионеру."
           → presence = "present";
             distribution_model = "custom";
             additional_benefit_summary отражает конкретную пропорцию.
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для additional_benefit_check_presence используй только: "present", "missing", "unclear".
        - Для status-полей используй только значения из allowed_values.
        - Fallback при отсутствии данных:
          * additional_benefit_summary → "Условие отсутствует (по закону — поровну)";
          * все *_status → "not_defined".
        - Fallback при противоречии или неоднозначности:
          * additional_benefit_summary → "Не удалось определить (противоречие)";
          * соответствующие *_status → "not_defined".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "additional_benefit_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования по дополнительной выгоде. Внутреннее агрегатное signal-поле."
          required: true

        - name: "additional_benefit_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values:
            - "defined"
            - "not_defined"
          description: "Наличие специального условия о распределении дополнительной выгоды."
          required: true
          display_in_grid: false

        - name: "distribution_model"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values:
            - "equal_split"
            - "all_to_principal"
            - "all_to_commissioner"
            - "custom"
            - "not_defined"
          description: "Модель распределения дополнительной выгоды (ст. 992 ГК РФ)."
          required: true
          display_in_grid: false

        - name: "additional_benefit_summary"
          type: "string"
          presentation: "summary"
          label: "Дополнительная выгода"
          description: "Краткое резюме распределения дополнительной выгоды для DD Grid."
          required: false
          display_in_grid: true
          display_priority: 1

      store_payload: true

  - id: subcommission_check
    name: "Субкомиссия: допустимость, согласие и ответственность"
    description: >
      Проверяет условия привлечения субкомиссионеров, необходимость получения
      согласия комитента и распределение ответственности за действия субкомиссионера
      (ст. 994 ГК РФ).
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    display_order: 70

    rules:
      keywords:
        - "субкомиссия"
        - "субкомиссионер"
        - "привлечение третьих лиц"
        - "привлекать третьих лиц"
        - "согласия комитента"
        - "отвечает за действия субкомиссионера"
        - "запрет на субкомиссию"
        - "лично"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)субкомисси"
        - "(?i)согласи[яе]\\s+комитент"
        - "(?i)отвечает\\s+за\\s+действия\\s+суб"
        - "(?i)привлеч[ее]ни[ея].{0,30}третьих\\s+лиц"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор комиссии по Главе 51 ГК РФ.
        Проверяется один вопрос: правовой режим субкомиссии.

        Нормативный ориентир:
        - ст. 994 ГК РФ — субкомиссия

        Ключевое:
        - Диспозитивная норма закона (ст. 994 п.1): если иное не предусмотрено
          договором, комиссионер вправе в целях исполнения заключить договор
          субкомиссии с другим лицом, оставаясь ответственным за действия
          субкомиссионера перед комитентом.
        - Молчание договора = субкомиссия РАЗРЕШЕНА по закону без согласия,
          но комиссионер несёт полную ответственность за субкомиссионера.
        - Согласие комитента (ст. 994 п.2): до прекращения договора комиссии
          комитент не вправе без согласия комиссионера вступать в непосредственные
          отношения с субкомиссионером, если иное не предусмотрено договором.
        - Запрет: на практике часто встречается условие о личном исполнении
          поручения или прямой запрет субкомиссии.

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора,
          а чего прямо нет.
        - Не оценивай серьёзность риска.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Допускается или запрещена субкомиссия.
        2. Требуется ли согласие комитента на привлечение субкомиссионера.
        3. Предусмотрена ли ответственность комиссионера за действия субкомиссионера.
        4. Сформулируй краткое резюме для юриста.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Если данные не указаны прямо — возвращай "not_defined"
           (для статусных полей) или "Данные не определены" (для текстовых).
        4. Не используй "None", "null", "N/A", "-" или пустые строки —
           только явные значения из [ФОРМАТ ОТВЕТА].
        5. В evidence включай только текст договора, без комментариев.
        6. Верни РОВНО один валидный JSON-объект со всеми 5 ключами
           (4 поля + evidence), пригодный для парсинга через json.loads
           без предварительной обработки. Без markdown, без ```json,
           без комментариев, без текста до или после. Начни ответ сразу
           с `{` и закончи `}`.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — субкомиссия разрешена с согласия:
        Фрагмент:
        "Субкомиссия допускается исключительно с предварительного письменного
        согласия Комитента. Комиссионер отвечает за действия привлечённого
        субкомиссионера как за свои собственные."

        Ответ:
        {
          "subcommission_status": "allowed",
          "principal_consent_required": "yes",
          "commissioner_liability_for_subagent": "defined",
          "subcommission_summary": "Разрешена с письменного согласия | Ответственность: полная",
          "evidence": [
            {
              "clause_ref": "п. 7.1",
              "quote": "Субкомиссия допускается исключительно с предварительного письменного согласия Комитента."
            },
            {
              "clause_ref": "п. 7.2",
              "quote": "Комиссионер отвечает за действия привлечённого субкомиссионера как за свои собственные."
            }
          ]
        }

        Пример 2 — запрет (личное исполнение):
        Фрагмент:
        "Комиссионер обязан исполнить поручение по настоящему Договору лично.
        Привлечение третьих лиц и заключение договоров субкомиссии запрещено."

        Ответ:
        {
          "subcommission_status": "prohibited",
          "principal_consent_required": "not_defined",
          "commissioner_liability_for_subagent": "not_defined",
          "subcommission_summary": "Запрещена (личное исполнение)",
          "evidence": [
            {
              "clause_ref": "п. 7.1",
              "quote": "Комиссионер обязан исполнить поручение по настоящему Договору лично. Привлечение третьих лиц и заключение договоров субкомиссии запрещено."
            }
          ]
        }

        Пример 3 — молчание договора (применяется диспозитивная норма закона):
        Фрагмент:
        "Комиссионер обязуется своевременно совершить все необходимые сделки."

        Ответ:
        {
          "subcommission_status": "not_defined",
          "principal_consent_required": "not_defined",
          "commissioner_liability_for_subagent": "not_defined",
          "subcommission_summary": "По закону (разрешена без согласия, полная ответственность)",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о возможности субкомиссии (или о личном исполнении).
        2. Найди прямую цитату о согласии комитента.
        3. Найди прямую цитату об ответственности за субкомиссионера.
        4. Сформулируй subcommission_summary на основе трёх предыдущих полей.
        5. Проверь, что все 5 ключей (4 поля + evidence) присутствуют в JSON
           и значения enum-полей строго из allowed_values.

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "subcommission_status": "<allowed / prohibited / by_law / unclear / not_defined>",
          "principal_consent_required": "<yes / no / by_law / not_defined>",
          "commissioner_liability_for_subagent": "<defined / by_law / excluded / not_defined>",
          "subcommission_summary": "<краткое резюме одной строкой>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 500

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "субкомиссия субкомиссионер с письменного согласия комитента комиссионер отвечает за действия субкомиссионера запрет на субкомиссию привлечение третьих лиц"
      retrieval_profile: "consent_check"
      preferred_unit_types:
        - obligation
        - general_provision
        - representations
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - limitations
      negative_keywords:
        - "в целях настоящего"
        - "прекращение"
        - "возврат товара"
      position_bias:
        preferred_range: [0.30, 0.75]
        boost: 0.30
        scope: segment
      context_k: 6
      max_chunks: 10
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
        - "invoice"
      preferred_clause_functions:
        - "obligations"
        - "limitations"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 35
      max_snippet_length: 540

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 750
      compact_output: false

      presence_signal:
        field: "subcommission_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора комиссии сведения
        о правовом режиме субкомиссии: её допустимости, требованиях к согласию
        комитента и объёме ответственности комиссионера.
        Не анализируй основное вознаграждение, отчётность или прекращение.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие 4 поля + evidence (всего 5 ключей):

        0. subcommission_check_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (subcommission_status, principal_consent_required,
              commissioner_liability_for_subagent) ≠ "not_defined";
           - "missing" — если все три содержательных поля = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - subcommission_status = "not_defined";
           - principal_consent_required = "not_defined";
           - commissioner_liability_for_subagent = "not_defined";
           - subcommission_summary = "По закону (разрешена без согласия, полная ответственность)";
           - не выполняй остальные шаги.

        1. subcommission_status — допустимость субкомиссии:
           "allowed" / "prohibited" / "by_law" / "unclear" / "not_defined".
        2. principal_consent_required — требование о согласии комитента:
           "yes" / "no" / "by_law" / "not_defined".
        3. commissioner_liability_for_subagent — ответственность комиссионера:
           "defined" / "by_law" / "excluded" / "not_defined".
        4. subcommission_summary — краткое резюме условий субкомиссии для DD Grid.
        5. evidence — массив объектов [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}].

        Если данные отсутствуют — "not_defined" для статусных полей,
        "По закону (разрешена без согласия, полная ответственность)" для summary.
        </task>

        <context_rules>
        - Перед остальными полями заполни subcommission_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined", subcommission_summary = "По закону (разрешена без согласия, полная ответственность)".
        - Используй только текст договора.
        - subcommission_status:
          * "allowed" — субкомиссия прямо разрешена договором;
          * "prohibited" — субкомиссия прямо запрещена договором или установлена обязанность личного исполнения поручения;
          * "by_law" — договор полностью молчит о возможности субкомиссии (применяется ст. 994 п.1 ГК РФ — по закону разрешена);
          * "unclear" — формулировка двойственна;
          * "not_defined" — тема не раскрыта (применяй "by_law", если уверен, что договор молчит).
        - principal_consent_required:
          * "yes" — для привлечения субкомиссионера прямо требуется согласие комитента;
          * "no" — прямо указано, что согласие не требуется;
          * "by_law" — договор молчит о согласии (по закону для общего случая согласие по умолчанию не требуется, но комиссионер несёт риск);
          * "not_defined" — тема согласия не урегулирована.
        - commissioner_liability_for_subagent:
          * "defined" — в договоре прямо прописана ответственность комиссионера за действия субкомиссионера перед комитентом;
          * "by_law" — договор молчит об ответственности, либо содержит прямую отсылку к закону;
          * "excluded" — сделана попытка исключить или ограничить ответственность комиссионера за действия третьих лиц перед комитентом (красный флаг);
          * "not_defined" — тема ответственности не раскрыта.
        - subcommission_summary — сформируй резюме одной строкой формата:
          * если "prohibited" → "Запрещена (личное исполнение)";
          * если "allowed" → "Разрешена | Согласие: {да/нет} | Ответственность: {полная/исключена}";
          * если "by_law" или "not_defined" → "По закону (разрешена без согласия, полная ответственность)".
        - Не используй "None", "null", пустые строки.
        - Все текстовые значения пиши на русском языке, кроме служебных enum-значений status-полей.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы (молчание = по закону).
           В тексте нет упоминаний о субкомиссии, согласии или ответственности за третьих лиц.
           → presence = "missing";
             все *_status = "not_defined";
             subcommission_summary = "По закону (разрешена без согласия, полная ответственность)".

        2. Явный запрет (обязанность личного исполнения).
           "Комиссионер обязан исполнить поручение лично. Привлечение третьих лиц запрещено."
           → presence = "present";
             subcommission_status = "prohibited".

        3. Разрешена с условием согласия.
           "Субкомиссия допускается с предварительного письменного согласия Комитента."
           → presence = "present";
             subcommission_status = "allowed";
             principal_consent_required = "yes".

        4. Специфика темы: попытка исключения ответственности (красный флаг).
           "Комиссионер не несёт ответственности за действия привлечённого субкомиссионера."
           → presence = "present";
             commissioner_liability_for_subagent = "excluded".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для subcommission_check_presence используй только: "present", "missing", "unclear".
        - Для status-полей используй только значения из allowed_values.
        - Fallback при отсутствии данных:
          * subcommission_summary → "По закону (разрешена без согласия, полная ответственность)";
          * все *_status → "not_defined".
        - Fallback при противоречии или неоднозначности:
          * subcommission_summary → "Не удалось определить (противоречие)";
          * соответствующие *_status → "not_defined" или "unclear".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "subcommission_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования по субкомиссии. Внутреннее агрегатное signal-поле."
          required: true

        - name: "subcommission_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values:
            - "allowed"
            - "prohibited"
            - "by_law"
            - "unclear"
            - "not_defined"
          description: "Режим допустимости субкомиссии в договоре (ст. 994 ГК РФ)."
          required: true
          display_in_grid: false

        - name: "principal_consent_required"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values:
            - "yes"
            - "no"
            - "by_law"
            - "not_defined"
          description: "Необходимость согласия комитента на привлечение субкомиссионера."
          required: true
          display_in_grid: false

        - name: "commissioner_liability_for_subagent"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values:
            - "defined"
            - "by_law"
            - "excluded"
            - "not_defined"
          description: "Объём ответственности комиссионера за действия субкомиссионера (excluded — красный флаг)."
          required: true
          display_in_grid: false

        - name: "subcommission_summary"
          type: "string"
          presentation: "summary"
          label: "Субкомиссия"
          description: "Краткое резюме условий субкомиссии для DD Grid."
          required: false
          display_in_grid: true
          display_priority: 1

      store_payload: true

  - id: delcredere_check
    name: "Делькредере: пределы ответственности и допвознаграждение"
    description: >
      Проверяет условия принятия комиссионером ручательства за исполнение
      сделки третьим лицом (делькредере), наличие и размер дополнительного
      вознаграждения, а также характер и основания ответственности комиссионера
      (ст. 991, 993 ГК РФ).
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    display_order: 80

    rules:
      keywords:
        - "делькредере"
        - "ручательство за исполнение"
        - "ручательство комиссионера"
        - "дополнительное вознаграждение"
        - "вознаграждение за делькредере"
        - "ответственность за третье лицо"
        - "неисполнение третьим лицом"
        - "предел ответственности"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)делькредере"
        - "(?i)ручательств(о|а)\\s+за\\s+исполнени"
        - "(?i)дополнительн(ое|ого)\\s+вознаграждени"
        - "(?i)отвечает\\s+за\\s+исполнение\\s+треть"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор комиссии по Главе 51 ГК РФ.
        Проверяется один вопрос: условия ручательства комиссионера (делькредере).

        Нормативный ориентир:
        - ст. 991 п. 1 ГК РФ — право комиссионера на дополнительное вознаграждение
          при принятии делькредере
        - ст. 993 п. 1 ГК РФ — общее правило об отсутствии ответственности комиссионера
          за третье лицо, за исключением принятия ручательства (делькредере)

        Ключевое:
        - По общему правилу ст. 993 ГК РФ комиссионер НЕ отвечает перед комитентом
          за исполнение сделки третьим лицом.
        - Принятие ручательства (делькредере) возлагает на комиссионера риск
          неисполнения обязательств третьим лицом (покупателем/поставщиком).
        - За принятие делькредере комиссионеру обычно причитается отдельное
          дополнительное вознаграждение (ст. 991 п. 1 ГК РФ), либо оно включается
          в общее вознаграждение.
        - Важно определить характер ответственности (солидарная, субсидиарная,
          в пределах суммы сделки или включая штрафные санкции).

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора,
          а чего прямо нет.
        - Не оценивай серьёзность риска.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Предусмотрено ли делькредере (ручательство комиссионера).
        2. Установлено ли отдельное вознаграждение за делькредере.
        3. Определены ли основания и характер ответственности комиссионера.
        4. Сформулируй краткое резюме для юриста.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Если данные не указаны прямо — возвращай "not_defined"
           (для статусных полей) или "Данные не определены" (для текстовых).
        4. Не используй "None", "null", "N/A", "-" или пустые строки —
           только явные значения из [ФОРМАТ ОТВЕТА].
        5. В evidence включай только текст договора, без комментариев.
        6. Верни РОВНО один валидный JSON-объект со всеми 5 ключами
           (4 поля + evidence), пригодный для парсинга через json.loads
           без предварительной обработки. Без markdown, без ```json,
           без комментариев, без текста до или после. Начни ответ сразу
           с `{` и закончи `}`.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — делькредере с допвознаграждением и четкими условиями:
        Фрагмент:
        "Комиссионер принимает на себя делькредере — ручательство за исполнение
        сделки третьим лицом (Покупателем). Дополнительное вознаграждение за делькредере
        составляет 2% от суммы сделки. Ответственность Комиссионера наступает
        при просрочке оплаты Покупателем свыше 30 календарных дней."

        Ответ:
        {
          "delcredere_status": "defined",
          "additional_fee_for_delcredere": "defined",
          "liability_trigger_clarity": "defined",
          "delcredere_summary": "Принято | Допвознаграждение: 2% | Условия: просрочка свыше 30 дней",
          "evidence": [
            {
              "clause_ref": "п. 8.1",
              "quote": "Комиссионер принимает на себя делькредере — ручательство за исполнение сделки третьим лицом (Покупателем)."
            },
            {
              "clause_ref": "п. 8.2",
              "quote": "Дополнительное вознаграждение за делькредере составляет 2% от суммы сделки. Ответственность Комиссионера наступает при просрочке оплаты Покупателем свыше 30 календарных дней."
            }
          ]
        }

        Пример 2 — условие о делькредере отсутствует (общее правило ГК РФ):
        Фрагмент:
        "Комиссионер обязуется от своего имени совершить сделку по реализации товара Комитента."

        Ответ:
        {
          "delcredere_status": "not_defined",
          "additional_fee_for_delcredere": "not_defined",
          "liability_trigger_clarity": "not_defined",
          "delcredere_summary": "Не предусмотрено (по закону без ручательства)",
          "evidence": []
        }

        Пример 3 — прямой отказ от ручательства (ст. 993 ГК РФ прямо зафиксирована):
        Фрагмент:
        "Комиссионер не отвечает перед Комитентом за неисполнение третьим лицом
        сделки, заключенной с ним за счет Комитента. Ручательство (делькредере)
        Комиссионером не предоставляется."

        Ответ:
        {
          "delcredere_status": "absent",
          "additional_fee_for_delcredere": "not_stipulated",
          "liability_trigger_clarity": "not_defined",
          "delcredere_summary": "Прямо исключено (без ручательства)",
          "evidence": [
            {
              "clause_ref": "п. 8.1",
              "quote": "Комиссионер не отвечает перед Комитентом за неисполнение третьим лицом сделки, заключенной с ним за счет Комитента. Ручательство (делькредере) Комиссионером не предоставляется."
            }
          ]
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о делькредере / ручательстве (или о его отсутствии).
        2. Найди прямую цитату о вознаграждении за делькредере (размер / включено / отсутствует).
        3. Найди прямую цитату об основаниях и пределах ответственности комиссионера.
        4. Сформулируй delcredere_summary на основе трёх предыдущих полей.
        5. Проверь, что все 5 ключей (4 поля + evidence) присутствуют в JSON
           и значения enum-полей строго из allowed_values.

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "delcredere_status": "<defined / partial / absent / not_defined>",
          "additional_fee_for_delcredere": "<defined / included / not_stipulated / not_defined>",
          "liability_trigger_clarity": "<defined / subsidiary / solidary / unclear / not_defined>",
          "delcredere_summary": "<краткое резюме одной строкой>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 500

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "делькредере ручательство за исполнение третьим лицом дополнительное вознаграждение за делькредере ответственность комиссионера неисполнение сделки"
      retrieval_profile: "indemnification_check"
      preferred_unit_types:
        - obligation
        - liability_provision
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - limitations
        - remedies
      negative_keywords:
        - "в целях настоящего"
        - "субкомиссия"
        - "прекращение"
        - "возврат товара"
      position_bias:
        preferred_range: [0.25, 0.75]
        boost: 0.30
        scope: segment
      context_k: 6
      max_chunks: 10
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
        - "invoice"
      preferred_clause_functions:
        - "obligations"
        - "limitations"
        - "remedies"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 35
      max_snippet_length: 560

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 750
      compact_output: false

      presence_signal:
        field: "delcredere_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора комиссии сведения
        о делькредере: условия принятия ручательства, дополнительное
        вознаграждение и основания ответственности комиссионера.
        Не анализируй основное вознаграждение комиссионера, субкомиссию
        или прекращение договора — это отдельные проверки.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие 4 поля + evidence (всего 5 ключей):

        0. delcredere_check_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (delcredere_status, additional_fee_for_delcredere,
              liability_trigger_clarity) ≠ "not_defined";
           - "missing" — если все три содержательных поля = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - delcredere_status = "not_defined";
           - additional_fee_for_delcredere = "not_defined";
           - liability_trigger_clarity = "not_defined";
           - delcredere_summary = "Не предусмотрено (по закону без ручательства)";
           - не выполняй остальные шаги.

        1. delcredere_status — статус ручательства (делькредере):
           "defined" / "partial" / "absent" / "not_defined".
        2. additional_fee_for_delcredere — дополнительное вознаграждение:
           "defined" / "included" / "not_stipulated" / "not_defined".
        3. liability_trigger_clarity — основания и вид ответственности:
           "defined" / "subsidiary" / "solidary" / "unclear" / "not_defined".
        4. delcredere_summary — краткое резюме условий делькредере для DD Grid.
        5. evidence — массив объектов [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}].

        Если данные отсутствуют — "not_defined" для статусных полей,
        "Не предусмотрено (по закону без ручательства)" для summary.
        </task>

        <context_rules>
        - Перед остальными полями заполни delcredere_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined", delcredere_summary = "Не предусмотрено (по закону без ручательства)".
        - Используй только текст договора.
        - delcredere_status:
          * "defined" — комиссионер прямо принимает на себя ручательство (делькредере) за исполнение сделки третьим лицом;
          * "partial" — ручательство упомянуто, но условия/объем сформулированы неполно или рамочно;
          * "absent" — в договоре прямо зафиксировано отсутствие делькредере (комиссионер не отвечает за неисполнение третьим лицом);
          * "not_defined" — тема делькредере не упомянута (действует общее правило ст. 993 ГК РФ — комиссионер не отвечает).
        - additional_fee_for_delcredere:
          * "defined" — установлен отдельный размер или порядок выплаты дополнительного вознаграждения за делькредере;
          * "included" — прямо указано, что плата за делькредере включена в состав базового комиссионного вознаграждения;
          * "not_stipulated" — делькредере принято, но условие о дополнительном вознаграждении не предусмотрено;
          * "not_defined" — делькредере не предусмотрено договором.
        - liability_trigger_clarity:
          * "defined" — чётко определены условия и сроки наступления ответственности комиссионера;
          * "solidary" — прямо установлена солидарная ответственность комиссионера с третьим лицом перед комитентом;
          * "subsidiary" — прямо установлена субсидиарная ответственность (после предъявления требований к третьему лицу);
          * "unclear" — условие ответственности размыто;
          * "not_defined" — основания ответственности не раскрыты.
        - delcredere_summary — сформируй резюме одной строкой формата:
          * если "defined" → "Принято | Допвознаграждение: {размер/включено} | Ответственность: {условия/солидарная/субсидиарная}";
          * если "absent" → "Прямо исключено (без ручательства)";
          * если "not_defined" → "Не предусмотрено (по закону без ручательства)".
        - Не используй "None", "null", пустые строки.
        - Все текстовые значения пиши на русском языке, кроме служебных enum-значений status-полей.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы (молчание = по закону).
           В тексте нет упоминаний о делькредере, ручательстве или ответственности за третье лицо.
           → presence = "missing";
             все *_status = "not_defined";
             delcredere_summary = "Не предусмотрено (по закону без ручательства)".

        2. Явный отказ от ручательства.
           "Комиссионер не отвечает перед Комитентом за неисполнение третьим лицом сделки."
           → presence = "present";
             delcredere_status = "absent".

        3. Делькредере принято с чёткими условиями и вознаграждением.
           "Комиссионер принимает делькредере за дополнительное вознаграждение 2%. Ответственность наступает при просрочке свыше 30 дней."
           → presence = "present";
             delcredere_status = "defined";
             additional_fee_for_delcredere = "defined";
             liability_trigger_clarity = "defined".

        4. Специфика темы: делькредере принято, но вознаграждение не оговорено.
           "Комиссионер ручается за исполнение сделки третьим лицом." (без упоминания доп. вознаграждения).
           → presence = "present";
             delcredere_status = "defined";
             additional_fee_for_delcredere = "not_stipulated".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для delcredere_check_presence используй только: "present", "missing", "unclear".
        - Для status-полей используй только значения из allowed_values.
        - Fallback при отсутствии данных:
          * delcredere_summary → "Не предусмотрено (по закону без ручательства)";
          * все *_status → "not_defined".
        - Fallback при противоречии или неоднозначности:
          * delcredere_summary → "Не удалось определить (противоречие)";
          * соответствующие *_status → "not_defined" или "unclear".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "delcredere_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования по делькредере. Внутреннее агрегатное signal-поле."
          required: true

        - name: "delcredere_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values:
            - "defined"
            - "partial"
            - "absent"
            - "not_defined"
          description: "Статус принятия комиссионером ручательства за третье лицо (делькредере, ст. 993 ГК РФ)."
          required: true
          display_in_grid: false

        - name: "additional_fee_for_delcredere"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values:
            - "defined"
            - "included"
            - "not_stipulated"
            - "not_defined"
          description: "Наличие и порядок согласования дополнительного вознаграждения за делькредере (ст. 991 п. 1 ГК РФ)."
          required: true
          display_in_grid: false

        - name: "liability_trigger_clarity"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values:
            - "defined"
            - "subsidiary"
            - "solidary"
            - "unclear"
            - "not_defined"
          description: "Определённость оснований, сроков и характера ответственности комиссионера при делькредере."
          required: true
          display_in_grid: false

        - name: "delcredere_summary"
          type: "string"
          presentation: "summary"
          label: "Делькредере"
          description: "Краткое резюме условий ручательства (делькредере) для DD Grid."
          required: false
          display_in_grid: true
          display_priority: 1

      store_payload: true

  - id: termination_and_unsold_goods_check
    name: "Прекращение договора и возврат нереализованного товара"
    description: >
      Проверяет порядок и основания прекращения договора комиссии
      (отмена поручения комитентом / отказ комиссионера), судьбу и сроки
      возврата нереализованного товара, право комиссионера на реализацию
      невостребованного товара и порядок финальных расчетов (ст. 1002–1004 ГК РФ).
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    display_order: 90

    rules:
      keywords:
        - "отмена поручения"
        - "отказ от договора"
        - "отказ комиссионера"
        - "возврат нереализованного товара"
        - "нереализованный товар"
        - "акт возврата"
        - "срок возврата товара"
        - "распорядиться товаром"
        - "продать товар за счет комитента"
        - "вознаграждение при прекращении"
        - "компенсация расходов при отмене"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)отмен[аы]\\s+поручен|отказ\\s+от\\s+договор"
        - "(?i)нереализованн(ый|ого|ом)\\s+товар"
        - "(?i)акт\\s+возврат|возврат.{0,20}товар"
        - "(?i)распорядиться\\s+имуществом|сдать\\s+на\\s+хранение"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор комиссии по Главе 51 ГК РФ.
        Проверяется один вопрос: прекращение договора, возврат товара и финальные расчеты.

        Нормативный ориентир:
        - ст. 1002 ГК РФ — прекращение договора комиссии
        - ст. 1003 ГК РФ — отмена комиссионного поручения комитентом и обязанность
          распорядиться имуществом
        - ст. 1004 ГК РФ — отказ комиссионера от исполнения договора

        Ключевое:
        - Отмена поручения комитентом (ст. 1003 ГК РФ): комитент вправе в любое время
          отменить поручение. При этом он обязан выплатить комиссионеру вознаграждение
          за совершенные сделки и возместить понесенные расходы.
        - Судьба товара (ст. 1003 п. 2 ГК РФ): комитент обязан распорядиться своим
          товаром, находящимся у комиссионера. Если комитент не сделает этого в установленный
          срок, комиссионер вправе сдать товар на хранение либо продать его по возможно
          более выгодной для комитента цене.
        - Отказ комиссионера (ст. 1004 ГК РФ): если договор бессрочный — комиссионер обязан
          уведомить за 30 дней; если срочный — отказ допускается только если это прямо
          предусмотрено договором.

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора,
          а чего прямо нет.
        - Не оценивай серьёзность риска.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Порядок прекращения договора (отмена комитентом / отказ комиссионера).
        2. Порядок и сроки возврата нереализованного товара (или право на его продажу).
        3. Порядок расчетов при прекращении (вознаграждение за совершенное, расходы).
        4. Сформулируй краткое резюме для юриста.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Если данные не указаны прямо — возвращай "not_defined"
           (для статусных полей) или "Данные не определены" (для текстовых).
        4. Не используй "None", "null", "N/A", "-" или пустые строки —
           только явные значения из [ФОРМАТ ОТВЕТА].
        5. В evidence включай только текст договора, без комментариев.
        6. Верни РОВНО один валидный JSON-объект со всеми 5 ключами
           (4 поля + evidence), пригодный для парсинга через json.loads
           без предварительной обработки. Без markdown, без ```json,
           без комментариев, без текста до или после. Начни ответ сразу
           с `{` и закончи `}`.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — полная регламентация прекращения и возврата:
        Фрагмент:
        "Комитент вправе в любое время отменить поручение, уведомив Комиссионера
        за 15 дней. Нереализованный товар возвращается Комитенту по акту приема-передачи
        в течение 10 рабочих дней с момента прекращения договора. Комиссионер
        сохраняет право на вознаграждение за сделки, совершенные до отмены поручения,
        и возмещение документально подтвержденных расходов."

        Ответ:
        {
          "termination_mechanism_status": "defined",
          "unsold_goods_return_status": "defined",
          "termination_compensation_status": "defined",
          "termination_summary": "Отмена комитентом (за 15 дней) | Возврат товара: 10 раб. дней | Расчет: вознаграждение за совершенное + расходы",
          "evidence": [
            {
              "clause_ref": "п. 9.1",
              "quote": "Комитент вправе в любое время отменить поручение, уведомив Комиссионера за 15 дней."
            },
            {
              "clause_ref": "п. 9.2",
              "quote": "Нереализованный товар возвращается Комитенту по акту приема-передачи в течение 10 рабочих дней с момента прекращения договора."
            },
            {
              "clause_ref": "п. 9.3",
              "quote": "Комиссионер сохраняет право на вознаграждение за сделки, совершенные до отмены поручения, и возмещение документально подтвержденных расходов."
            }
          ]
        }

        Пример 2 — данные отсутствуют (применяются общие нормы ГК РФ):
        Фрагмент:
        "Договор заключен сроком на один год."

        Ответ:
        {
          "termination_mechanism_status": "not_defined",
          "unsold_goods_return_status": "not_defined",
          "termination_compensation_status": "not_defined",
          "termination_summary": "Специальный порядок прекращения и возврата не предусмотрен (по закону)",
          "evidence": []
        }

        Пример 3 — право комиссионера реализовать брошенный товар (ст. 1003 п. 2 ГК РФ):
        Фрагмент:
        "При прекращении договора Комитент обязан вывезти нереализованный товар
        в течение 14 дней. В случае невывоза товара в указанный срок Комиссионер
        вправе самостоятельно реализовать товар по рыночной цене с удержанием
        причитающихся ему сумм."

        Ответ:
        {
          "termination_mechanism_status": "defined",
          "unsold_goods_return_status": "commissioner_sale_right",
          "termination_compensation_status": "defined",
          "termination_summary": "Вывоз товара: 14 дней (при просрочке — право продажи Комиссионером) | Расчет: удержание из выручки",
          "evidence": [
            {
              "clause_ref": "п. 9.1",
              "quote": "При прекращении договора Комитент обязан вывезти нереализованный товар в течение 14 дней."
            },
            {
              "clause_ref": "п. 9.2",
              "quote": "В случае невывоза товара в указанный срок Комиссионер вправе самостоятельно реализовать товар по рыночной цене с удержанием причитающихся ему сумм."
            }
          ]
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о порядке отмены поручения / расторжения договора.
        2. Найди прямую цитату о возврате нереализованного товара или праве на его продажу.
        3. Найди прямую цитату о компенсации расходов и выплате вознаграждения при прекращении.
        4. Сформулируй termination_summary на основе трёх предыдущих полей.
        5. Проверь, что все 5 ключей (4 поля + evidence) присутствуют в JSON
           и значения enum-полей строго из allowed_values.

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "termination_mechanism_status": "<defined / principal_revocation_only / commissioner_refusal_only / by_law / not_defined>",
          "unsold_goods_return_status": "<defined / commissioner_sale_right / by_law / not_defined>",
          "termination_compensation_status": "<defined / pro_rata_commission / expenses_only / excluded / by_law / not_defined>",
          "termination_summary": "<краткое резюме одной строкой>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 500

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "отмена поручения отказ от договора комиссии возврат нереализованного товара распорядиться имуществом срок возврата товара вознаграждение при досрочной отмене компенсация расходов"
      retrieval_profile: "termination_check"
      preferred_unit_types:
        - termination_provision
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - remedies
        - procedures
        - obligations
      negative_keywords:
        - "в целях настоящего"
        - "субкомиссия"
        - "делькредере"
      position_bias:
        preferred_range: [0.50, 0.95]
        boost: 0.30
        scope: segment
      context_k: 6
      max_chunks: 10
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
        - "invoice"
      preferred_clause_functions:
        - "remedies"
        - "procedures"
        - "obligations"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 35
      max_snippet_length: 540

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 750
      compact_output: false

      presence_signal:
        field: "termination_and_unsold_goods_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора комиссии сведения
        о прекращении договора: основаниях отмены/отказа, порядке возврата
        нереализованного товара и финальных расчетах между сторонами.
        Не анализируй размер базового вознаграждения, отчётность или субкомиссию.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие 4 поля + evidence (всего 5 ключей):

        0. termination_and_unsold_goods_check_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (termination_mechanism_status, unsold_goods_return_status,
              termination_compensation_status) ≠ "not_defined";
           - "missing" — если все три содержательных поля = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - termination_mechanism_status = "not_defined";
           - unsold_goods_return_status = "not_defined";
           - termination_compensation_status = "not_defined";
           - termination_summary = "Специальный порядок прекращения и возврата не предусмотрен (по закону)";
           - не выполняй остальные шаги.

        1. termination_mechanism_status — порядок и основания прекращения:
           "defined" / "principal_revocation_only" / "commissioner_refusal_only" / "by_law" / "not_defined".
        2. unsold_goods_return_status — режим возврата нереализованного товара:
           "defined" / "commissioner_sale_right" / "by_law" / "not_defined".
        3. termination_compensation_status — расчеты при прекращении договора:
           "defined" / "pro_rata_commission" / "expenses_only" / "excluded" / "by_law" / "not_defined".
        4. termination_summary — краткое резюме условий прекращения и возврата для DD Grid.
        5. evidence — массив объектов [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}].

        Если данные отсутствуют — "not_defined" для статусных полей,
        "Специальный порядок прекращения и возврата не предусмотрен (по закону)" для summary.
        </task>

        <context_rules>
        - Перед остальными полями заполни termination_and_unsold_goods_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined", termination_summary = "Специальный порядок прекращения и возврата не предусмотрен (по закону)".
        - Используй только текст договора.
        - termination_mechanism_status:
          * "defined" — детально урегулированы условия прекращения для обеих сторон;
          * "principal_revocation_only" — урегулирован только порядок отмены поручения комитентом;
          * "commissioner_refusal_only" — урегулирован только порядок отказа комиссионера;
          * "by_law" — отсылка к порядку, предусмотренному ст. 1002–1004 ГК РФ;
          * "not_defined" — порядок прекращения не раскрыт.
        - unsold_goods_return_status:
          * "defined" — установлен четкий порядок и сроки возврата товара комитенту;
          * "commissioner_sale_right" — прямо предусмотрено право комиссионера продать невостребованный товар при невывозе комитентом (ст. 1003 п. 2 ГК РФ);
          * "by_law" — порядок возврата определяется по закону;
          * "not_defined" — судьба нереализованного товара не урегулирована.
        - termination_compensation_status:
          * "defined" — предусмотрена и выплата вознаграждения за совершенное, и компенсация фактически понесенных расходов;
          * "pro_rata_commission" — предусмотрена только выплата вознаграждения за совершенные сделки;
          * "expenses_only" — предусмотрено только возмещение расходов без вознаграждения;
          * "excluded" — сделана попытка исключить выплату вознаграждения или расходов (красный флаг);
          * "by_law" — расчеты производятся по правилам ст. 1003 ГК РФ;
          * "not_defined" — порядок расчетов не урегулирован.
        - termination_summary — сформируй резюме одной строкой формата:
          * если "defined" → "Прекращение: {срок уведомления} | Товар: {срок возврата/право продажи} | Расчет: {вознаграждение/расходы}";
          * если "not_defined" → "Специальный порядок прекращения и возврата не предусмотрен (по закону)".
        - Не используй "None", "null", пустые строки.
        - Все текстовые значения пиши на русском языке, кроме служебных enum-значений status-полей.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы (молчание = по закону).
           В тексте нет упоминаний о порядке прекращения, возврате товара или финальных расчетах.
           → presence = "missing";
             все *_status = "not_defined";
             termination_summary = "Специальный порядок прекращения и возврата не предусмотрен (по закону)".

        2. Только отмена комитентом урегулирована.
           "Комитент вправе в любое время отменить поручение, уведомив за 15 дней."
           → presence = "present";
             termination_mechanism_status = "principal_revocation_only".

        3. Право комиссионера реализовать брошенный товар.
           "При невывозе товара в течение 14 дней Комиссионер вправе реализовать его по рыночной цене."
           → presence = "present";
             unsold_goods_return_status = "commissioner_sale_right".

        4. Специфика темы: попытка исключить выплату вознаграждения при отмене (красный флаг).
           "При отмене поручения Комитентом вознаграждение Комиссионеру не выплачивается."
           → presence = "present";
             termination_compensation_status = "excluded".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для termination_and_unsold_goods_check_presence используй только: "present", "missing", "unclear".
        - Для status-полей используй только значения из allowed_values.
        - Fallback при отсутствии данных:
          * termination_summary → "Специальный порядок прекращения и возврата не предусмотрен (по закону)";
          * все *_status → "not_defined".
        - Fallback при противоречии или неоднозначности:
          * termination_summary → "Не удалось определить (противоречие)";
          * соответствующие *_status → "not_defined" или "unclear".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "termination_and_unsold_goods_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования по прекращению договора и возврату товара. Внутреннее агрегатное signal-поле."
          required: true

        - name: "termination_mechanism_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values:
            - "defined"
            - "principal_revocation_only"
            - "commissioner_refusal_only"
            - "by_law"
            - "not_defined"
          description: "Порядок и основания прекращения договора комиссии (ст. 1002–1004 ГК РФ)."
          required: true
          display_in_grid: false

        - name: "unsold_goods_return_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values:
            - "defined"
            - "commissioner_sale_right"
            - "by_law"
            - "not_defined"
          description: "Судьба нереализованного товара и право комиссионера на продажу невостребованного имущества (ст. 1003 п. 2 ГК РФ)."
          required: true
          display_in_grid: false

        - name: "termination_compensation_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values:
            - "defined"
            - "pro_rata_commission"
            - "expenses_only"
            - "excluded"
            - "by_law"
            - "not_defined"
          description: "Порядок расчетов и компенсаций при досрочном прекращении комиссии (ст. 1003 п. 1 ГК РФ)."
          required: true
          display_in_grid: false

        - name: "termination_summary"
          type: "string"
          presentation: "summary"
          label: "Прекращение и возврат товара"
          description: "Краткое резюме порядка прекращения комиссии и возврата нереализованного товара для DD Grid."
          required: false
          display_in_grid: true
          display_priority: 1

      store_payload: true

  - id: tax_and_documentation_check
    name: "Налоговые последствия и документооборот по комиссии"
    description: >
      Проверяет наличие налоговых оговорок (НДС с вознаграждения / УСН),
      квалификацию дохода комиссионера (ст. 251 п. 1 пп. 9 НК РФ — только
      вознаграждение) и порядок оформления первичных документов и счетов-фактур
      (ст. 156, 169 НК РФ, ст. 9 Закона № 402-ФЗ).
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    display_order: 100

    rules:
      keywords:
        - "налоговые последствия"
        - "доходом комиссионера является вознаграждение"
        - "не учитываемые при налогообложении"
        - "счет-фактура"
        - "счёт-фактура"
        - "перевыставление счетов-фактур"
        - "отчет как первичный документ"
        - "отчёт как первичный документ"
        - "первичные учетные документы"
        - "журнал учета счетов-фактур"
        - "ст. 156 НК РФ"
        - "ст. 251 НК РФ"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)налогов(ые|ых|ый)\\s+последств|налогообложен"
        - "(?i)доход(ом|ами)\\s+комиссионера\\s+является"
        - "(?i)сч[её]т[- ]фактур|первичн(ый|ого|ые)\\s+документ"
        - "(?i)журнал\\s+учет(а|е)\\s+сч[её]т"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по налоговому и договорному праву.
        Анализируется договор комиссии по Главе 51 ГК РФ.
        Проверяется один вопрос: налоговые условия, квалификация дохода
        и первичный документооборот (счета-фактуры, отчеты, первичка).

        Нормативный ориентир:
        - ст. 156 НК РФ — особенности определения налоговой базы по НДС
          при посреднических сделках (НДС облагается только вознаграждение)
        - ст. 169 НК РФ — порядок составления и перевыставления счетов-фактур комиссионером
        - ст. 251 п. 1 пп. 9 НК РФ — доходы в виде имущества (включая деньги),
          поступившего комиссионеру в связи с исполнением обязательств по договору
          комиссии, не учитываются в доходах комиссионера (кроме вознаграждения)
        - ст. 9 Федерального закона № 402-ФЗ — требования к первичным учетным документам

        Ключевое:
        - Квалификация дохода: критически важно прямое указание на то, что
          доходом комиссионера признается исключительно сумма комиссионного
          вознаграждения. Поступающие от третьих лиц средства за товар являются
          транзитными средствами комитента.
        - Документооборот: отчет комиссионера должен иметь статус первичного
          документа, к нему должны прикладываться заверенные копии первичных
          документов и счетов-фактур по сделкам с третьими лицами.
        - Счета-фактуры: порядок перевыставления счетов-фактур комиссионером
          должен соответствовать правилам ст. 169 НК РФ.

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора,
          а чего прямо нет.
        - Не оценивай серьёзность риска.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Налоговую оговорку и режим НДС с вознаграждения / налоговый режим сторон.
        2. Порядок оформления первичных документов и счетов-фактур.
        3. Наличие подтверждения, что доходом комиссионера является только вознаграждение.
        4. Сформулируй краткое резюме для юриста.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Если данные не указаны прямо — возвращай "not_defined"
           (для статусных полей) или "Данные не определены" (для текстовых).
        4. Не используй "None", "null", "N/A", "-" или пустые строки —
           только явные значения из [ФОРМАТ ОТВЕТА].
        5. В evidence включай только текст договора, без комментариев.
        6. Верни РОВНО один валидный JSON-объект со всеми 5 ключами
           (4 поля + evidence), пригодный для парсинга через json.loads
           без предварительной обработки. Без markdown, без ```json,
           без комментариев, без текста до или после. Начни ответ сразу
           с `{` и закончи `}`.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — полная налоговая оговорка и документооборот:
        Фрагмент:
        "Доходом Комиссионера признается исключительно комиссионное вознаграждение,
        облагаемое НДС по ставке 20%. Денежные средства, поступившие от покупателей
        за товар Комитента, доходом Комиссионера не являются. Комиссионер перевыставляет
        счета-фактуры в порядке ст. 169 НК РФ. Утвержденный Отчет Комиссионера
        является первичным учетным документом с обязательным приложением копий
        УПД и счетов-фактур третьих лиц."

        Ответ:
        {
          "tax_clause_status": "defined",
          "documentation_status": "defined",
          "revenue_qualification_status": "explicit_fee_only",
          "tax_and_docs_summary": "Доход — только вознаграждение (НДС 20%) | Счета-фактуры: ст. 169 НК РФ | Отчет — первичный документ с копиями УПД",
          "evidence": [
            {
              "clause_ref": "п. 10.1",
              "quote": "Доходом Комиссионера признается исключительно комиссионное вознаграждение, облагаемое НДС по ставке 20%."
            },
            {
              "clause_ref": "п. 10.2",
              "quote": "Денежные средства, поступившие от покупателей за товар Комитента, доходом Комиссионера не являются."
            },
            {
              "clause_ref": "п. 10.3",
              "quote": "Комиссионер перевыставляет счета-фактуры в порядке ст. 169 НК РФ. Утвержденный Отчет Комиссионера является первичным учетным документом с обязательным приложением копий УПД и счетов-фактур третьих лиц."
            }
          ]
        }

        Пример 2 — данные отсутствуют (применяются общие правила НК РФ):
        Фрагмент:
        "Комиссионер совершает сделки за счет Комитента за вознаграждение."

        Ответ:
        {
          "tax_clause_status": "not_defined",
          "documentation_status": "not_defined",
          "revenue_qualification_status": "not_defined",
          "tax_and_docs_summary": "Специальные налоговые оговорки и правила документооборота не установлены (по закону)",
          "evidence": []
        }

        Пример 3 — комиссионер на УСН, копии документов по требованию:
        Фрагмент:
        "Комиссионер применяет упрощенную систему налогообложения (УСН) и не является
        плательщиком НДС. Вознаграждение НДС не облагается. Все суммы, полученные
        от реализации, являются транзитными средствами Комитента. Копии документов
        по сделкам с третьими лицами предоставляются по запросу Комитента."

        Ответ:
        {
          "tax_clause_status": "vat_exempt_usn",
          "documentation_status": "partial",
          "revenue_qualification_status": "transit_funds_clause",
          "tax_and_docs_summary": "Комиссионер на УСН (без НДС) | Транзитный характер средств зафиксирован | Первичка: по запросу",
          "evidence": [
            {
              "clause_ref": "п. 10.1",
              "quote": "Комиссионер применяет упрощенную систему налогообложения (УСН) и не является плательщиком НДС."
            },
            {
              "clause_ref": "п. 10.2",
              "quote": "Все суммы, полученные от реализации, являются транзитными средствами Комитента."
            },
            {
              "clause_ref": "п. 10.3",
              "quote": "Копии документов по сделкам с третьими лицами предоставляются по запросу Комитента."
            }
          ]
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о налоговом режиме (НДС / УСН / налоговая оговорка).
        2. Найди прямую цитату о счетах-фактурах, отчете как первичке и копиях документов.
        3. Найди прямую цитату о квалификации дохода комиссионера (только вознаграждение / транзит).
        4. Сформулируй tax_and_docs_summary на основе трёх предыдущих полей.
        5. Проверь, что все 5 ключей (4 поля + evidence) присутствуют в JSON
           и значения enum-полей строго из allowed_values.

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "tax_clause_status": "<defined / vat_included / vat_excluded / vat_exempt_usn / by_law / not_defined>",
          "documentation_status": "<defined / invoice_reinvoicing_specified / copies_required / partial / by_law / not_defined>",
          "revenue_qualification_status": "<explicit_fee_only / transit_funds_clause / by_law / not_defined>",
          "tax_and_docs_summary": "<краткое резюме одной строкой>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 500

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "налоговые последствия доходом комиссионера является вознаграждение счет-фактура перевыставление счетов-фактур отчет первичный документ документооборот НК РФ УСН НДС"
      retrieval_profile: "payment_terms_check"
      preferred_unit_types:
        - obligation
        - payment_term
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - boilerplate
        - obligations
        - procedures
      negative_keywords:
        - "в целях настоящего"
        - "субкомиссия"
        - "делькредере"
        - "прекращение"
        - "возврат товара"
      position_bias:
        preferred_range: [0.50, 1.0]
        boost: 0.30
        scope: segment
      context_k: 6
      max_chunks: 10
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
        - "invoice"
      preferred_clause_functions:
        - "boilerplate"
        - "obligations"
        - "procedures"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 30
      max_snippet_length: 500

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 750
      compact_output: false

      presence_signal:
        field: "tax_and_documentation_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора комиссии налоговые
        условия, квалификацию дохода комиссионера и правила документооборота
        (счета-фактуры, отчет комиссионера, первичные учетные документы).
        Не анализируй размер базового вознаграждения или порядок расторжения договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие 4 поля + evidence (всего 5 ключей):

        0. tax_and_documentation_check_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (tax_clause_status, documentation_status,
              revenue_qualification_status) ≠ "not_defined";
           - "missing" — если все три содержательных поля = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - tax_clause_status = "not_defined";
           - documentation_status = "not_defined";
           - revenue_qualification_status = "not_defined";
           - tax_and_docs_summary = "Специальные налоговые оговорки и правила документооборота не установлены (по закону)";
           - не выполняй остальные шаги.

        1. tax_clause_status — налоговый статус и режим НДС с вознаграждения:
           "defined" / "vat_included" / "vat_excluded" / "vat_exempt_usn" / "by_law" / "not_defined".
        2. documentation_status — статус регламентации документооборота и первички:
           "defined" / "invoice_reinvoicing_specified" / "copies_required" / "partial" / "by_law" / "not_defined".
        3. revenue_qualification_status — квалификация дохода комиссионера (ст. 251 НК РФ):
           "explicit_fee_only" / "transit_funds_clause" / "by_law" / "not_defined".
        4. tax_and_docs_summary — краткое резюме налоговых и документарных условий для DD Grid.
        5. evidence — массив объектов [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}].

        Если данные отсутствуют — "not_defined" для статусных полей,
        "Специальные налоговые оговорки и правила документооборота не установлены (по закону)" для summary.
        </task>

        <context_rules>
        - Перед остальными полями заполни tax_and_documentation_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined", tax_and_docs_summary = "Специальные налоговые оговорки и правила документооборота не установлены (по закону)".
        - Используй только текст договора.
        - tax_clause_status:
          * "defined" — налоговые условия сформулированы подробно;
          * "vat_included" — прямо указано, что вознаграждение включает НДС;
          * "vat_excluded" — прямо указано, что НДС начисляется сверх вознаграждения;
          * "vat_exempt_usn" — прямо указано на освобождение от НДС в связи с УСН / ст. 145 НК РФ;
          * "by_law" — отсылка к налоговому законодательству без конкретизации;
          * "not_defined" — налоговые оговорки не сформулированы.
        - documentation_status:
          * "defined" — урегулированы и перевыставление счетов-фактур, и статус отчета как первички, и передача копий первичных документов третьих лиц;
          * "invoice_reinvoicing_specified" — урегулирован только порядок работы со счетами-фактурами;
          * "copies_required" — прямо указана обязанность передачи копий документов третьих лиц;
          * "partial" — документооборот упомянут фрагментарно;
          * "by_law" — документооборот ведется в общем порядке по законодательству;
          * "not_defined" — порядок документооборота не раскрыт.
        - revenue_qualification_status:
          * "explicit_fee_only" — прямо зафиксировано, что доходом комиссионера признается исключительно сумма комиссионного вознаграждения;
          * "transit_funds_clause" — указано на транзитный характер средств или отсутствие прав комиссионера на денежные средства от покупателей;
          * "by_law" — специальной оговорки нет, действует налоговое законодательство;
          * "not_defined" — тема квалификации дохода не затронута.
        - tax_and_docs_summary — сформируй резюме одной строкой формата:
          * если "defined" → "Доход: {только вознаграждение/транзит} ({режим НДС}) | Первичка: {отчет/копии документов/счета-фактуры}";
          * если "not_defined" → "Специальные налоговые оговорки и правила документооборота не установлены (по закону)".
        - Не используй "None", "null", пустые строки.
        - Все текстовые значения пиши на русском языке, кроме служебных enum-значений status-полей.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы (молчание = по закону).
           В тексте нет упоминаний о налоговом режиме, квалификации дохода или документообороте.
           → presence = "missing";
             все *_status = "not_defined";
             tax_and_docs_summary = "Специальные налоговые оговорки и правила документооборота не установлены (по закону)".

        2. Явная налоговая оговорка (УСН).
           "Комиссионер применяет УСН и не является плательщиком НДС."
           → presence = "present";
             tax_clause_status = "vat_exempt_usn".

        3. Транзитный характер средств (квалификация дохода).
           "Денежные средства, поступившие от покупателей, не являются доходом Комиссионера."
           → presence = "present";
             revenue_qualification_status = "transit_funds_clause".

        4. Специфика темы: фрагментарный документооборот.
           "Копии документов по сделкам с третьими лицами предоставляются по запросу Комитента." (без упоминания счетов-фактур или статуса отчета).
           → presence = "present";
             documentation_status = "partial".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для tax_and_documentation_check_presence используй только: "present", "missing", "unclear".
        - Для status-полей используй только значения из allowed_values.
        - Fallback при отсутствии данных:
          * tax_and_docs_summary → "Специальные налоговые оговорки и правила документооборота не установлены (по закону)";
          * все *_status → "not_defined".
        - Fallback при противоречии или неоднозначности:
          * tax_and_docs_summary → "Не удалось определить (противоречие)";
          * соответствующие *_status → "not_defined" или "unclear".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "tax_and_documentation_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования по налогам и документообороту. Внутреннее агрегатное signal-поле."
          required: true

        - name: "tax_clause_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values:
            - "defined"
            - "vat_included"
            - "vat_excluded"
            - "vat_exempt_usn"
            - "by_law"
            - "not_defined"
          description: "Налоговый режим и условие об НДС с комиссионного вознаграждения (ст. 156 НК РФ)."
          required: true
          display_in_grid: false

        - name: "documentation_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values:
            - "defined"
            - "invoice_reinvoicing_specified"
            - "copies_required"
            - "partial"
            - "by_law"
            - "not_defined"
          description: "Порядок оформления счетов-фактур и статус отчета как первичного учетного документа (ст. 169 НК РФ, Закон № 402-ФЗ)."
          required: true
          display_in_grid: false

        - name: "revenue_qualification_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values:
            - "explicit_fee_only"
            - "transit_funds_clause"
            - "by_law"
            - "not_defined"
          description: "Подтверждение того, что доходом комиссионера является исключительно вознаграждение (ст. 251 п. 1 пп. 9 НК РФ)."
          required: true
          display_in_grid: false

        - name: "tax_and_docs_summary"
          type: "string"
          presentation: "summary"
          label: "Налоги и первичные документы"
          description: "Краткое резюме налогового режима, квалификации дохода и документооборота по комиссии для DD Grid."
          required: false
          display_in_grid: true
          display_priority: 1

      store_payload: true

  - id: goods_liability_and_insurance_check
    name: "Ответственность за товар, переход рисков и страхование"
    description: >
      Проверяет распределение риска утраты, недостачи и повреждения товара
      комитента, порядок приёмки и передачи товара, обязанность страхования
      и пределы ответственности комиссионера за вверенное имущество
      (ст. 996, 998 ГК РФ).
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    display_order: 110

    rules:
      keywords:
        - "утрата товара"
        - "недостача товара"
        - "повреждение товара"
        - "риск случайной гибели"
        - "страхование товара"
        - "акт приёма-передачи"
        - "приёмка товара"
        - "скрытые дефекты"
        - "ответственность за сохранность"
        - "франшиза"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)утрат[аы]|недостач[аи]|повреждени[ея].{0,20}товар"
        - "(?i)риск\\s+случайн(ой|ого)\\s+гибел|случайн(ая|ого)\\s+порч"
        - "(?i)страховани[ея]\\s+товар|застрахова[тн]"
        - "(?i)акт\\s+при[её]м.{0,10}передач|при[её]мк[аи]\\s+товар"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор комиссии по Главе 51 ГК РФ.
        Проверяется один вопрос: ответственность за товар, переход рисков
        и страхование.

        Нормативный ориентир:
        - ст. 996 п. 1 ГК РФ — вещи комитента являются его собственностью
        - ст. 996 п. 2 ГК РФ — комиссионер обязан обособить имущество комитента
        - ст. 998 ГК РФ — ответственность комиссионера за утрату, недостачу
          или повреждение имущества комитента

        Ключевое:
        - Презумпция вины комиссионера (ст. 998): комиссионер отвечает за
          утрату, недостачу или повреждение товара, если не докажет, что
          это произошло не по его вине. Бремя доказывания — на комиссионере.
        - На практике стороны часто пытаются:
          * ограничить ответственность комиссионера cap'ом или франшизой;
          * переложить риск случайной гибели на комитента;
          * обязать одну из сторон застраховать товар;
          * установить особый порядок приёмки (осмотр, скрытые дефекты).
        - Момент передачи товара = момент начала ответственности комиссионера.
          До передачи риск несёт комитент, после — комиссионер (если иное
          не предусмотрено договором).

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора,
          а чего прямо нет.
        - Не оценивай серьёзность риска.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Распределение риска утраты/повреждения товара.
        2. Обязанность страхования (кто, за чей счёт).
        3. Порядок приёмки товара комиссионером.
        4. Ограничение ответственности за товар (cap, франшиза).
        5. Сформулируй краткое резюме для юриста.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Если данные не указаны прямо — возвращай "not_defined"
           (для статусных полей) или "Данные не определены" (для текстовых).
        4. Не используй "None", "null", "N/A", "-" или пустые строки —
           только явные значения из [ФОРМАТ ОТВЕТА].
        5. В evidence включай только текст договора, без комментариев.
        6. Верни РОВНО один валидный JSON-объект со всеми 6 ключами
           (5 полей + evidence), пригодный для парсинга через json.loads
           без предварительной обработки. Без markdown, без ```json,
           без комментариев, без текста до или после. Начни ответ сразу
           с `{` и закончи `}`.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — полная регламентация:
        Фрагмент:
        "Риск случайной гибели и повреждения товара переходит к Комиссионеру
        с момента подписания акта приёма-передачи. Комиссионер обязан
        застраховать товар за свой счёт на полную стоимость. Ответственность
        Комиссионера за утрату или повреждение товара ограничивается суммой
        комиссионного вознаграждения за соответствующую партию. Приёмка товара
        осуществляется в течение 3 рабочих дней с момента доставки."

        Ответ:
        {
          "goods_risk_allocation": "commissioner_bears",
          "insurance_obligation": "commissioner_obliged",
          "goods_acceptance_procedure": "defined",
          "liability_cap_for_goods": "capped",
          "goods_liability_summary": "Риск: на Комиссионере (с момента приёмки) | Страхование: Комиссионер | Ответственность: ограничена вознаграждением | Приёмка: 3 раб. дня",
          "evidence": [
            {
              "clause_ref": "п. 8.1",
              "quote": "Риск случайной гибели и повреждения товара переходит к Комиссионеру с момента подписания акта приёма-передачи."
            },
            {
              "clause_ref": "п. 8.2",
              "quote": "Комиссионер обязан застраховать товар за свой счёт на полную стоимость."
            },
            {
              "clause_ref": "п. 8.3",
              "quote": "Ответственность Комиссионера за утрату или повреждение товара ограничивается суммой комиссионного вознаграждения за соответствующую партию."
            },
            {
              "clause_ref": "п. 8.4",
              "quote": "Приёмка товара осуществляется в течение 3 рабочих дней с момента доставки."
            }
          ]
        }

        Пример 2 — данные отсутствуют (действует презумпция вины):
        Фрагмент:
        "Комитент передаёт товар Комиссионеру для реализации."

        Ответ:
        {
          "goods_risk_allocation": "not_defined",
          "insurance_obligation": "not_defined",
          "goods_acceptance_procedure": "not_defined",
          "liability_cap_for_goods": "not_defined",
          "goods_liability_summary": "По закону (презумпция вины Комиссионера, ст. 998 ГК РФ) | Страхование и приёмка не урегулированы",
          "evidence": []
        }

        Пример 3 — риск на комитенте, страхование не требуется:
        Фрагмент:
        "Риск случайной гибели и порчи товара сохраняется за Комитентом
        до момента его передачи покупателю. Комиссионер не обязан
        страховать товар. Приёмка товара осуществляется по количеству
        мест без вскрытия упаковки."

        Ответ:
        {
          "goods_risk_allocation": "principal_bears",
          "insurance_obligation": "not_required",
          "goods_acceptance_procedure": "partial",
          "liability_cap_for_goods": "not_defined",
          "goods_liability_summary": "Риск: на Комитенте (до передачи покупателю) | Страхование: не требуется | Приёмка: по местам без вскрытия",
          "evidence": [
            {
              "clause_ref": "п. 8.1",
              "quote": "Риск случайной гибели и порчи товара сохраняется за Комитентом до момента его передачи покупателю."
            },
            {
              "clause_ref": "п. 8.2",
              "quote": "Комиссионер не обязан страховать товар."
            },
            {
              "clause_ref": "п. 8.3",
              "quote": "Приёмка товара осуществляется по количеству мест без вскрытия упаковки."
            }
          ]
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о распределении риска утраты/повреждения товара.
        2. Найди прямую цитату о страховании (обязанность или освобождение).
        3. Найди прямую цитату о порядке приёмки товара.
        4. Найди прямую цитату об ограничении ответственности за товар.
        5. Сформулируй goods_liability_summary на основе четырёх предыдущих полей.
        6. Проверь, что все 6 ключей (5 полей + evidence) присутствуют в JSON
           и значения enum-полей строго из allowed_values.

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "goods_risk_allocation": "<commissioner_bears / principal_bears / shared / by_law / not_defined>",
          "insurance_obligation": "<commissioner_obliged / principal_obliged / joint / not_required / not_defined>",
          "goods_acceptance_procedure": "<defined / partial / not_defined>",
          "liability_cap_for_goods": "<capped / unlimited / excluded / not_defined>",
          "goods_liability_summary": "<краткое резюме одной строкой>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 550

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "утрата недостача повреждение товара риск случайной гибели страхование товара акт приёма-передачи приёмка товара ответственность за сохранность"
      retrieval_profile: "indemnification_check"
      preferred_unit_types:
        - obligation
        - liability_provision
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - limitations
        - remedies
      negative_keywords:
        - "в целях настоящего"
        - "субкомиссия"
        - "делькредере"
        - "прекращение"
      position_bias:
        preferred_range: [0.20, 0.70]
        boost: 0.30
        scope: segment
      context_k: 6
      max_chunks: 10
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
        - "invoice"
      preferred_clause_functions:
        - "obligations"
        - "limitations"
        - "remedies"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 35
      max_snippet_length: 560

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 800
      compact_output: false

      presence_signal:
        field: "goods_liability_and_insurance_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора комиссии
        условия ответственности за товар: распределение рисков,
        страхование, порядок приёмки и пределы ответственности
        комиссионера за утрату/повреждение имущества комитента.
        Не анализируй вознаграждение, отчётность, субкомиссию
        или прекращение договора.

        Примечание: обособление товара (раздельное хранение/учёт)
        уже извлекается в чеке ownership_and_segregation_check.
        Здесь фокус на рисках утраты/повреждения и страховании.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие 5 полей + evidence (всего 6 ключей):

        0. goods_liability_and_insurance_check_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (goods_risk_allocation, insurance_obligation,
              goods_acceptance_procedure, liability_cap_for_goods) ≠ "not_defined";
           - "missing" — если все четыре содержательных поля = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - goods_risk_allocation = "not_defined";
           - insurance_obligation = "not_defined";
           - goods_acceptance_procedure = "not_defined";
           - liability_cap_for_goods = "not_defined";
           - goods_liability_summary = "По закону (презумпция вины Комиссионера, ст. 998 ГК РФ) | Страхование и приёмка не урегулированы";
           - не выполняй остальные шаги.

        1. goods_risk_allocation — распределение риска утраты/повреждения:
           "commissioner_bears" / "principal_bears" / "shared" / "by_law" / "not_defined".
        2. insurance_obligation — обязанность страхования товара:
           "commissioner_obliged" / "principal_obliged" / "joint" / "not_required" / "not_defined".
        3. goods_acceptance_procedure — порядок приёмки товара:
           "defined" / "partial" / "not_defined".
        4. liability_cap_for_goods — ограничение ответственности за товар:
           "capped" / "unlimited" / "excluded" / "not_defined".
        5. goods_liability_summary — краткое резюме для DD Grid.
        6. evidence — массив объектов [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}].

        Если данные отсутствуют — "not_defined" для статусных полей,
        "По закону (презумпция вины Комиссионера, ст. 998 ГК РФ) | Страхование и приёмка не урегулированы" для summary.
        </task>

        <context_rules>
        - Перед остальными полями заполни goods_liability_and_insurance_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined", goods_liability_summary = "По закону (презумпция вины Комиссионера, ст. 998 ГК РФ) | Страхование и приёмка не урегулированы".
        - Используй только текст договора.
        - goods_risk_allocation:
          * "commissioner_bears" — риск утраты/повреждения прямо возложен на комиссионера (с момента приёмки или иной точки);
          * "principal_bears" — риск прямо сохранён за комитентом (например, до момента передачи покупателю);
          * "shared" — риск распределён между сторонами;
          * "by_law" — отсылка к ст. 998 ГК РФ без конкретизации;
          * "not_defined" — тема рисков не раскрыта (по умолчанию действует ст. 998 — презумпция вины комиссионера).
        - insurance_obligation:
          * "commissioner_obliged" — комиссионер обязан застраховать товар;
          * "principal_obliged" — комитент обязан застраховать товар;
          * "joint" — страхование распределено между сторонами;
          * "not_required" — прямо указано, что страхование не требуется;
          * "not_defined" — тема страхования не упомянута.
        - goods_acceptance_procedure:
          * "defined" — детально описан порядок приёмки (сроки, осмотр, акт, скрытые дефекты, рекламации по количеству/качеству);
          * "partial" — приёмка упомянута, но порядок неполный (например, только «по количеству мест»);
          * "not_defined" — порядок приёмки не раскрыт.
        - liability_cap_for_goods:
          * "capped" — ответственность ограничена суммой (cap, франшиза, процент от стоимости);
          * "unlimited" — прямо указано, что ответственность не ограничена;
          * "excluded" — сделана попытка полностью исключить ответственность комиссионера за товар (красный флаг, противоречит ст. 998 ГК РФ);
          * "not_defined" — пределы ответственности не установлены (по умолчанию — полная ответственность по ст. 998 ГК РФ).
        - goods_liability_summary — сформируй резюме одной строкой формата:
          «Риск: {на Комиссионере/Комитенте/по закону} | Страхование: {кто/не требуется} | Приёмка: {срок/не урегулирована} | Ответственность: {ограничена/полная}».
        - Не используй "None", "null", пустые строки.
        - Все текстовые значения пиши на русском языке, кроме служебных enum-значений status-полей.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы (молчание = презумпция вины комиссионера).
           В тексте нет упоминаний о рисках, страховании, приёмке или ограничении ответственности.
           → presence = "missing";
             все *_status = "not_defined";
             goods_liability_summary = "По закону (презумпция вины Комиссионера, ст. 998 ГК РФ) | Страхование и приёмка не урегулированы".

        2. Риск на комитенте, страхование не требуется.
           "Риск случайной гибели и порчи товара сохраняется за Комитентом до момента его передачи покупателю. Комиссионер не обязан страховать товар."
           → presence = "present";
             goods_risk_allocation = "principal_bears";
             insurance_obligation = "not_required".

        3. Ограничение ответственности (cap/франшиза).
           "Ответственность Комиссионера за утрату или повреждение товара ограничивается суммой комиссионного вознаграждения."
           → presence = "present";
             liability_cap_for_goods = "capped".

        4. Специфика темы: попытка полностью исключить ответственность комиссионера (красный флаг).
           "Комиссионер не несёт ответственности за утрату или повреждение товара, переданного ему Комитентом."
           → presence = "present";
             liability_cap_for_goods = "excluded".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для goods_liability_and_insurance_check_presence используй только: "present", "missing", "unclear".
        - Для status-полей используй только значения из allowed_values.
        - Fallback при отсутствии данных:
          * goods_liability_summary → "По закону (презумпция вины Комиссионера, ст. 998 ГК РФ) | Страхование и приёмка не урегулированы";
          * все *_status → "not_defined".
        - Fallback при противоречии или неоднозначности:
          * goods_liability_summary → "Не удалось определить (противоречие)";
          * соответствующие *_status → "not_defined" или "unclear".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "goods_liability_and_insurance_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования по рискам, страхованию и ответственности за товар. Внутреннее агрегатное signal-поле."
          required: true

        - name: "goods_risk_allocation"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values:
            - "commissioner_bears"
            - "principal_bears"
            - "shared"
            - "by_law"
            - "not_defined"
          description: "Распределение риска утраты, недостачи и повреждения товара комитента (ст. 998 ГК РФ)."
          required: true
          display_in_grid: false

        - name: "insurance_obligation"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values:
            - "commissioner_obliged"
            - "principal_obliged"
            - "joint"
            - "not_required"
            - "not_defined"
          description: "Обязанность страхования товара и распределение расходов на страхование."
          required: true
          display_in_grid: false

        - name: "goods_acceptance_procedure"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values:
            - "defined"
            - "partial"
            - "not_defined"
          description: "Порядок приёмки товара комиссионером (осмотр, акт, скрытые дефекты)."
          required: true
          display_in_grid: false

        - name: "liability_cap_for_goods"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values:
            - "capped"
            - "unlimited"
            - "excluded"
            - "not_defined"
          description: "Ограничение ответственности комиссионера за утрату/повреждение товара (excluded — красный флаг)."
          required: true
          display_in_grid: false

        - name: "goods_liability_summary"
          type: "string"
          presentation: "summary"
          label: "Риски и страхование товара"
          description: "Краткое резюме распределения рисков, страхования и ответственности за товар для DD Grid."
          required: false
          display_in_grid: true
          display_priority: 1

      store_payload: true

  - id: third_party_claims_and_recourse_check
    name: "Претензии третьих лиц и регрессные требования"
    description: >
      Проверяет порядок урегулирования претензий покупателей (третьих лиц),
      распределение расходов по рекламациям, сроки уведомления комитента
      и регрессные права комиссионера (ст. 990, 998 ГК РФ).
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    display_order: 120

    rules:
      keywords:
        - "претензии третьих лиц"
        - "претензии покупателей"
        - "рекламация"
        - "регрессное требование"
        - "регресс"
        - "уведомление о претензии"
        - "замена товара"
        - "возврат товара покупателем"
        - "некачественный товар"
        - "скрытые недостатки"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)претензи[ия].{0,20}треть|претензи[ия].{0,20}покупател"
        - "(?i)рекламац[ияи]|регресс"
        - "(?i)уведомлени[ея].{0,20}претенз|уведомлени[ея].{0,20}рекламац"
        - "(?i)замен[аы]\\s+товар|возврат.{0,15}покупател"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор комиссии по Главе 51 ГК РФ.
        Проверяется один вопрос: претензии третьих лиц и регрессные требования.

        Нормативный ориентир:
        - ст. 990 п. 1 ГК РФ — по сделке с третьим лицом права и обязанности
          возникают непосредственно у комиссионера
        - ст. 998 п. 2 ГК РФ — комиссионер обязан немедленно уведомить
          комитента о претензиях третьих лиц
        - ст. 475, 477 ГК РФ — последствия передачи товара ненадлежащего качества
          (применяются к отношениям комиссионер — покупатель)

        Ключевое:
        - Юридическая конструкция комиссии: комиссионер заключает сделку
          от своего имени. Это значит, что покупатель предъявляет претензию
          комиссионеру, а не комитенту. Комиссионер — «щит» комитента.
        - После удовлетворения претензии покупателя комиссионер вправе
          предъявить регрессное требование к комитенту (если дефект товара —
          вина комитента).
        - Критические вопросы для договора:
          * Кто фактически рассматривает рекламации (комиссионер сам или
            по согласованию с комитентом)?
          * В какой срок комиссионер обязан уведомить комитента о претензии?
          * Кто несёт расходы по замене/возврату/ремонту товара?
          * Есть ли ограничение регрессных требований?

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора,
          а чего прямо нет.
        - Не оценивай серьёзность риска.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Кто рассматривает претензии покупателей.
        2. Срок уведомления комитента о претензии.
        3. Распределение расходов по рекламациям.
        4. Регрессные права комиссионера.
        5. Сформулируй краткое резюме для юриста.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Если данные не указаны прямо — возвращай "not_defined"
           (для статусных полей) или "Данные не определены" (для текстовых).
        4. Не используй "None", "null", "N/A", "-" или пустые строки —
           только явные значения из [ФОРМАТ ОТВЕТА].
        5. В evidence включай только текст договора, без комментариев.
        6. Верни РОВНО один валидный JSON-объект со всеми 5 ключами
           (4 поля + evidence), пригодный для парсинга через json.loads
           без предварительной обработки. Без markdown, без ```json,
           без комментариев, без текста до или после. Начни ответ сразу
          с `{` и закончи `}`.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — полная регламентация:
        Фрагмент:
        "Комиссионер самостоятельно рассматривает претензии покупателей
        по количеству и качеству товара. О каждой полученной претензии
        Комиссионер уведомляет Комитента в течение 2 рабочих дней.
        Расходы по замене некачественного товара несёт Комитент.
        Комиссионер вправе предъявить регрессное требование к Комитенту
        в размере сумм, выплаченных покупателям по обоснованным претензиям."

        Ответ:
        {
          "claims_handling_model": "commissioner_handles",
          "notification_deadline": "defined",
          "recourse_right_status": "defined",
          "claims_summary": "Претензии: Комиссионер | Уведомление: 2 раб. дня | Расходы: на Комитенте | Регресс: полный",
          "evidence": [
            {
              "clause_ref": "п. 9.1",
              "quote": "Комиссионер самостоятельно рассматривает претензии покупателей по количеству и качеству товара."
            },
            {
              "clause_ref": "п. 9.2",
              "quote": "О каждой полученной претензии Комиссионер уведомляет Комитента в течение 2 рабочих дней."
            },
            {
              "clause_ref": "п. 9.3",
              "quote": "Расходы по замене некачественного товара несёт Комитент. Комиссионер вправе предъявить регрессное требование к Комитенту в размере сумм, выплаченных покупателям по обоснованным претензиям."
            }
          ]
        }

        Пример 2 — данные отсутствуют:
        Фрагмент:
        "Комиссионер реализует товар Комитента третьим лицам."

        Ответ:
        {
          "claims_handling_model": "not_defined",
          "notification_deadline": "not_defined",
          "recourse_right_status": "not_defined",
          "claims_summary": "Порядок урегулирования претензий третьих лиц не установлен (по закону)",
          "evidence": []
        }

        Пример 3 — совместное рассмотрение, регресс ограничен:
        Фрагмент:
        "Все претензии покупателей по качеству товара рассматриваются
        Комиссионером совместно с Комитентом. Комиссионер обязан
        незамедлительно направить копию претензии Комитенту. Регрессные
        требования Комиссионера к Комитенту ограничиваются стоимостью
        некачественного товара без учёта упущенной выгоды."

        Ответ:
        {
          "claims_handling_model": "joint",
          "notification_deadline": "immediate",
          "recourse_right_status": "limited",
          "claims_summary": "Претензии: совместно | Уведомление: незамедлительно | Регресс: ограничен стоимостью товара",
          "evidence": [
            {
              "clause_ref": "п. 9.1",
              "quote": "Все претензии покупателей по качеству товара рассматриваются Комиссионером совместно с Комитентом."
            },
            {
              "clause_ref": "п. 9.2",
              "quote": "Комиссионер обязан незамедлительно направить копию претензии Комитенту."
            },
            {
              "clause_ref": "п. 9.3",
              "quote": "Регрессные требования Комиссионера к Комитенту ограничиваются стоимостью некачественного товара без учёта упущенной выгоды."
            }
          ]
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о порядке рассмотрения претензий покупателей.
        2. Найди прямую цитату о сроке уведомления комитента.
        3. Найди прямую цитату о регрессных правах или распределении расходов.
        4. Сформулируй claims_summary на основе трёх предыдущих полей.
        5. Проверь, что все 5 ключей (4 поля + evidence) присутствуют в JSON
           и значения enum-полей строго из allowed_values.

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "claims_handling_model": "<commissioner_handles / principal_handles / joint / not_defined>",
          "notification_deadline": "<defined / immediate / by_law / not_defined>",
          "recourse_right_status": "<defined / limited / excluded / by_law / not_defined>",
          "claims_summary": "<краткое резюме одной строкой>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 550

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "претензии третьих лиц претензии покупателей рекламация регресс уведомление о претензии замена товара возврат товара покупателем некачественный товар"
      retrieval_profile: "indemnification_check"
      preferred_unit_types:
        - obligation
        - liability_provision
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - remedies
        - procedures
      negative_keywords:
        - "в целях настоящего"
        - "субкомиссия"
        - "делькредере"
        - "прекращение"
      position_bias:
        preferred_range: [0.30, 0.80]
        boost: 0.30
        scope: segment
      context_k: 6
      max_chunks: 10
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
        - "invoice"
      preferred_clause_functions:
        - "obligations"
        - "remedies"
        - "procedures"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 35
      max_snippet_length: 560

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 800
      compact_output: false

      presence_signal:
        field: "third_party_claims_and_recourse_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора комиссии
        условия урегулирования претензий третьих лиц (покупателей):
        порядок рассмотрения, сроки уведомления комитента, распределение
        расходов и регрессные права комиссионера.
        Не анализируй вознаграждение, отчётность, субкомиссию или
        прекращение договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие 4 поля + evidence (всего 5 ключей):

        0. third_party_claims_and_recourse_check_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (claims_handling_model, notification_deadline,
              recourse_right_status) ≠ "not_defined";
           - "missing" — если все три содержательных поля = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - claims_handling_model = "not_defined";
           - notification_deadline = "not_defined";
           - recourse_right_status = "not_defined";
           - claims_summary = "Порядок урегулирования претензий третьих лиц не установлен (по закону)";
           - не выполняй остальные шаги.

        1. claims_handling_model — порядок рассмотрения претензий:
           "commissioner_handles" / "principal_handles" / "joint" / "not_defined".
        2. notification_deadline — срок уведомления комитента:
           "defined" / "immediate" / "by_law" / "not_defined".
        3. recourse_right_status — регрессные права комиссионера:
           "defined" / "limited" / "excluded" / "by_law" / "not_defined".
        4. claims_summary — краткое резюме для DD Grid.
        5. evidence — массив объектов [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}].

        Если данные отсутствуют — "not_defined" для статусных полей,
        "Порядок урегулирования претензий третьих лиц не установлен (по закону)" для summary.
        </task>

        <context_rules>
        - Перед остальными полями заполни third_party_claims_and_recourse_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined", claims_summary = "Порядок урегулирования претензий третьих лиц не установлен (по закону)".
        - Используй только текст договора.
        - claims_handling_model:
          * "commissioner_handles" — комиссионер самостоятельно рассматривает и удовлетворяет претензии покупателей;
          * "principal_handles" — претензии перенаправляются комитенту, комиссионер не принимает решений;
          * "joint" — претензии рассматриваются совместно или по согласованию с комитентом;
          * "not_defined" — порядок не урегулирован (по умолчанию комиссионер как сторона сделки с третьим лицом обязан реагировать сам).
        - notification_deadline:
          * "defined" — установлен конкретный срок уведомления комитента о полученной претензии;
          * "immediate" — прямо указано «немедленно» или «незамедлительно» (соответствует ст. 998 п. 2 ГК РФ);
          * "by_law" — отсылка к законодательству без конкретизации;
          * "not_defined" — срок уведомления не установлен (по умолчанию — «немедленно» по ст. 998 п. 2 ГК РФ).
        - recourse_right_status:
          * "defined" — регрессное право комиссионера к комитенту прямо закреплено с указанием объёма;
          * "limited" — регресс ограничен (например, только стоимость товара без упущенной выгоды, или cap);
          * "excluded" — регрессное право прямо исключено (красный флаг: комиссионер несёт все убытки по претензиям за свой счёт);
          * "by_law" — отсылка к общим нормам о регрессе;
          * "not_defined" — тема регресса не раскрыта.
        - claims_summary — сформируй резюме одной строкой формата:
          «Претензии: {Комиссионер/Комитент/совместно} | Уведомление: {срок} | Регресс: {полный/ограничен/исключён/по закону}».
        - Не используй "None", "null", пустые строки.
        - Все текстовые значения пиши на русском языке, кроме служебных enum-значений status-полей.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы (молчание = по закону, комиссионер как сторона сделки).
           В тексте нет упоминаний о претензиях, уведомлении или регрессе.
           → presence = "missing";
             все *_status = "not_defined";
             claims_summary = "Порядок урегулирования претензий третьих лиц не установлен (по закону)".

        2. Совместное рассмотрение, регресс ограничен.
           "Претензии рассматриваются совместно. Регрессные требования ограничиваются стоимостью некачественного товара."
           → presence = "present";
             claims_handling_model = "joint";
             recourse_right_status = "limited".

        3. Комиссионер самостоятельно рассматривает и удовлетворяет претензии.
           "Комиссионер самостоятельно рассматривает претензии покупателей по количеству и качеству товара."
           → presence = "present";
             claims_handling_model = "commissioner_handles".

        4. Специфика темы: регрессное право прямо исключено (красный флаг).
           "Комиссионер не вправе предъявлять регрессные требования к Комитенту по претензиям третьих лиц."
           → presence = "present";
             recourse_right_status = "excluded".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для third_party_claims_and_recourse_check_presence используй только: "present", "missing", "unclear".
        - Для status-полей используй только значения из allowed_values.
        - Fallback при отсутствии данных:
          * claims_summary → "Порядок урегулирования претензий третьих лиц не установлен (по закону)";
          * все *_status → "not_defined".
        - Fallback при противоречии или неоднозначности:
          * claims_summary → "Не удалось определить (противоречие)";
          * соответствующие *_status → "not_defined" или "unclear".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "third_party_claims_and_recourse_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования по претензиям третьих лиц и регрессу. Внутреннее агрегатное signal-поле."
          required: true

        - name: "claims_handling_model"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values:
            - "commissioner_handles"
            - "principal_handles"
            - "joint"
            - "not_defined"
          description: "Порядок рассмотрения претензий третьих лиц (покупателей) по ст. 990 п. 1 ГК РФ."
          required: true
          display_in_grid: false

        - name: "notification_deadline"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values:
            - "defined"
            - "immediate"
            - "by_law"
            - "not_defined"
          description: "Срок уведомления комитента о претензии третьего лица (ст. 998 п. 2 ГК РФ — немедленно)."
          required: true
          display_in_grid: false

        - name: "recourse_right_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values:
            - "defined"
            - "limited"
            - "excluded"
            - "by_law"
            - "not_defined"
          description: "Регрессное право комиссионера к комитенту по расходам на удовлетворение претензий (excluded — красный флаг)."
          required: true
          display_in_grid: false

        - name: "claims_summary"
          type: "string"
          presentation: "summary"
          label: "Претензии и регресс"
          description: "Краткое резюме порядка урегулирования претензий третьих лиц и регрессных прав для DD Grid."
          required: false
          display_in_grid: true
          display_priority: 1

      store_payload: true

  - id: advance_and_settlement_check
    name: "Авансирование расходов и возврат средств"
    description: >
      Проверяет порядок авансирования расходов комитентом, сроки и механизм
      предоставления средств, возврат неизрасходованного аванса и начисление
      процентов за пользование чужими денежными средствами (ст. 1000, 395 ГК РФ).
    triggers: {}
    ui_mode: "field_extraction"
    severity: "medium"
    severity_if_pass: "pass"
    severity_if_fail: "medium"
    severity_if_unclear: "low"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    display_order: 130

    rules:
      keywords:
        - "аванс на расходы"
        - "авансирование"
        - "предоставление средств"
        - "неизрасходованный аванс"
        - "возврат аванса"
        - "проценты за пользование"
        - "ст. 395 ГК РФ"
        - "кассовый разрыв"
        - "за счет комитента"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)аванс.{0,20}расход|авансирован"
        - "(?i)неизрасходованн(ый|ого)\\s+аванс|возврат\\s+аванс"
        - "(?i)процент[ыа].{0,20}пользован|ст\\.\\s*395"
        - "(?i)предоставлени[ея]\\s+средств|перечислени[ея]\\s+средств"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор комиссии по Главе 51 ГК РФ.
        Проверяется один вопрос: авансирование расходов и возврат средств.

        Нормативный ориентир:
        - ст. 1000 ГК РФ — возмещение расходов на исполнение поручения
        - ст. 395 ГК РФ — проценты за пользование чужими денежными средствами
        - ст. 999 ГК РФ — отчёт комиссионера и перечисление выручки

        Ключевое:
        - Комиссионер действует «за счёт комитента» (ст. 990 ГК РФ).
          Это означает, что все расходы по сделке экономически несёт комитент.
        - На практике два основных механизма:
          * Комитент авансирует расходы (перечисляет средства до сделки).
          * Комиссионер оплачивает за свой счёт, затем возмещает из выручки
            или получает компенсацию по отчёту.
        - Неизрасходованный аванс подлежит возврату комитенту. Задержка
          возврата может повлечь проценты по ст. 395 ГК РФ.
        - Кассовый разрыв — основной операционный риск комиссионера при
          отсутствии авансирования.

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора,
          а чего прямо нет.
        - Не оценивай серьёзность риска.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Предусмотрено ли авансирование расходов комитентом.
        2. Порядок и сроки предоставления средств.
        3. Возврат неизрасходованного аванса.
        4. Сформулируй краткое резюме для юриста.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Если данные не указаны прямо — возвращай "not_defined"
           (для статусных полей) или "Данные не определены" (для текстовых).
        4. Не используй "None", "null", "N/A", "-" или пустые строки —
           только явные значения из [ФОРМАТ ОТВЕТА].
        5. В evidence включай только текст договора, без комментариев.
        6. Верни РОВНО один валидный JSON-объект со всеми 4 ключами
           (3 поля + evidence), пригодный для парсинга через json.loads
           без предварительной обработки. Без markdown, без ```json,
           без комментариев, без текста до или после. Начни ответ сразу
           с `{` и закончи `}`.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — полное авансирование:
        Фрагмент:
        "Комитент перечисляет аванс на расходы в течение 3 банковских дней
        после получения заявки Комиссионера. Неизрасходованный остаток аванса
        возвращается Комитенту в течение 5 рабочих дней после утверждения
        отчёта. За просрочку возврата начисляются проценты по ст. 395 ГК РФ."

        Ответ:
        {
          "advance_provision_status": "defined",
          "unused_advance_return": "defined",
          "advance_summary": "Аванс: в течение 3 дней по заявке | Возврат остатка: 5 раб. дней | Проценты: ст. 395 ГК РФ",
          "evidence": [
            {
              "clause_ref": "п. 7.1",
              "quote": "Комитент перечисляет аванс на расходы в течение 3 банковских дней после получения заявки Комиссионера."
            },
            {
              "clause_ref": "п. 7.2",
              "quote": "Неизрасходованный остаток аванса возвращается Комитенту в течение 5 рабочих дней после утверждения отчёта."
            },
            {
              "clause_ref": "п. 7.3",
              "quote": "За просрочку возврата начисляются проценты по ст. 395 ГК РФ."
            }
          ]
        }

        Пример 2 — без авансирования (комиссионер за свой счёт):
        Фрагмент:
        "Комиссионер оплачивает расходы по исполнению поручения за свой счёт
        с последующим возмещением из выручки, полученной от реализации товара."

        Ответ:
        {
          "advance_provision_status": "not_required",
          "unused_advance_return": "not_defined",
          "advance_summary": "Авансирование не предусмотрено | Возмещение из выручки",
          "evidence": [
            {
              "clause_ref": "п. 7.1",
              "quote": "Комиссионер оплачивает расходы по исполнению поручения за свой счёт с последующим возмещением из выручки, полученной от реализации товара."
            }
          ]
        }

        Пример 3 — данные отсутствуют:
        Фрагмент:
        "Комиссионер совершает сделки за счёт Комитента."

        Ответ:
        {
          "advance_provision_status": "not_defined",
          "unused_advance_return": "not_defined",
          "advance_summary": "Порядок авансирования и возврата средств не урегулирован (по закону)",
          "evidence": []
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату об авансировании или его отсутствии.
        2. Найди прямую цитату о возврате неизрасходованного аванса.
        3. Сформулируй advance_summary на основе двух предыдущих полей.
        4. Проверь, что все 4 ключа (3 поля + evidence) присутствуют в JSON
           и значения enum-полей строго из allowed_values.

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "advance_provision_status": "<defined / not_required / by_law / not_defined>",
          "unused_advance_return": "<defined / offset_against_commission / by_law / not_defined>",
          "advance_summary": "<краткое резюме одной строкой>",
          "evidence": [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}]
        }
      context_k: 5
      temperature: 0.0
      max_tokens: 450

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "аванс на расходы авансирование предоставление средств неизрасходованный аванс возврат аванса проценты за пользование возмещение расходов"
      retrieval_profile: "payment_terms_check"
      preferred_unit_types:
        - obligation
        - payment_term
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - procedures
      negative_keywords:
        - "в целях настоящего"
        - "субкомиссия"
        - "делькредере"
        - "прекращение"
        - "возврат товара"
      position_bias:
        preferred_range: [0.20, 0.65]
        boost: 0.30
        scope: segment
      context_k: 5
      max_chunks: 8
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
        - "invoice"
      preferred_clause_functions:
        - "obligations"
        - "procedures"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 30
      max_snippet_length: 500

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 650
      compact_output: false

      presence_signal:
        field: "advance_and_settlement_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора комиссии
        условия авансирования расходов и возврата средств: порядок
        предоставления средств комитентом, возврат неизрасходованного
        аванса и начисление процентов.
        Не анализируй размер вознаграждения, отчётность или субкомиссию.

        Примечание: общее возмещение расходов (ст. 1001 ГК РФ) уже
        проверяется в чеке remuneration_expenses_and_retention_check.
        Здесь фокус на механизме авансирования и возврата.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие 3 поля + evidence (всего 4 ключа):

        0. advance_and_settlement_check_presence:
           Агрегатное signal-поле — наличие регулирования по теме.
           - "present" — если хотя бы одно из содержательных полей
             (advance_provision_status, unused_advance_return) ≠ "not_defined";
           - "missing" — если оба содержательных поля = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - advance_provision_status = "not_defined";
           - unused_advance_return = "not_defined";
           - advance_summary = "Порядок авансирования и возврата средств не урегулирован (по закону)";
           - не выполняй остальные шаги.

        1. advance_provision_status — авансирование расходов:
           "defined" / "not_required" / "by_law" / "not_defined".
        2. unused_advance_return — возврат неизрасходованного аванса:
           "defined" / "offset_against_commission" / "by_law" / "not_defined".
        3. advance_summary — краткое резюме для DD Grid.
        4. evidence — массив объектов [{"clause_ref": "<пункт>", "quote": "<точная цитата>"}].

        Если данные отсутствуют — "not_defined" для статусных полей,
        "Порядок авансирования и возврата средств не урегулирован (по закону)" для summary.
        </task>

        <context_rules>
        - Перед остальными полями заполни advance_and_settlement_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все *_status = "not_defined", advance_summary = "Порядок авансирования и возврата средств не урегулирован (по закону)".
        - Используй только текст договора.
        - advance_provision_status:
          * "defined" — установлен конкретный порядок и сроки авансирования (например, «в течение 3 дней после заявки»);
          * "not_required" — прямо указано, что комиссионер действует за свой счёт с последующим возмещением (без аванса);
          * "by_law" — отсылка к ст. 1000 ГК РФ без конкретизации;
          * "not_defined" — механизм финансирования не раскрыт.
        - unused_advance_return:
          * "defined" — установлен срок и порядок возврата неизрасходованного аванса (например, «в течение 5 дней после отчёта»);
          * "offset_against_commission" — неизрасходованный аванс засчитывается в счёт вознаграждения;
          * "by_law" — возврат по общим правилам (ст. 1102 ГК РФ — неосновательное обогащение);
          * "not_defined" — возврат аванса не урегулирован.
        - advance_summary — сформируй резюме одной строкой формата:
          * если "defined" → «Аванс: {срок/механизм} | Возврат: {срок/зачёт}»;
          * если "not_required" → «Авансирование не предусмотрено | Возмещение из выручки»;
          * если "not_defined" → «Порядок авансирования не урегулирован (по закону)».
        - Не используй "None", "null", пустые строки.
        - Все текстовые значения пиши на русском языке, кроме служебных enum-значений status-полей.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы (молчание = по закону).
           В тексте нет упоминаний об авансировании или возврате средств.
           → presence = "missing";
             все *_status = "not_defined";
             advance_summary = "Порядок авансирования и возврата средств не урегулирован (по закону)".

        2. Авансирование не предусмотрено (комиссионер за свой счёт).
           "Комиссионер оплачивает расходы по исполнению поручения за свой счёт с последующим возмещением из выручки."
           → presence = "present";
             advance_provision_status = "not_required".

        3. Полное авансирование с возвратом остатка.
           "Комитент перечисляет аванс на расходы в течение 3 банковских дней. Неизрасходованный остаток аванса возвращается Комитенту в течение 5 рабочих дней."
           → presence = "present";
             advance_provision_status = "defined";
             unused_advance_return = "defined".

        4. Специфика темы: неизрасходованный аванс засчитывается в счёт вознаграждения.
           "Неизрасходованный остаток аванса засчитывается в счёт комиссионного вознаграждения Комиссионера."
           → presence = "present";
             unused_advance_return = "offset_against_commission".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для advance_and_settlement_check_presence используй только: "present", "missing", "unclear".
        - Для status-полей используй только значения из allowed_values.
        - Fallback при отсутствии данных:
          * advance_summary → "Порядок авансирования и возврата средств не урегулирован (по закону)";
          * все *_status → "not_defined".
        - Fallback при противоречии или неоднозначности:
          * advance_summary → "Не удалось определить (противоречие)";
          * соответствующие *_status → "not_defined" или "unclear".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "advance_and_settlement_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие регулирования по авансированию и возврату средств. Внутреннее агрегатное signal-поле."
          required: true

        - name: "advance_provision_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values:
            - "defined"
            - "not_required"
            - "by_law"
            - "not_defined"
          description: "Порядок авансирования расходов комитентом (ст. 1000 ГК РФ)."
          required: true
          display_in_grid: false

        - name: "unused_advance_return"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values:
            - "defined"
            - "offset_against_commission"
            - "by_law"
            - "not_defined"
          description: "Порядок и сроки возврата неизрасходованного аванса комитенту."
          required: true
          display_in_grid: false

        - name: "advance_summary"
          type: "string"
          presentation: "summary"
          label: "Авансирование и возврат"
          description: "Краткое резюме механизма авансирования расходов и возврата средств для DD Grid."
          required: false
          display_in_grid: true
          display_priority: 1

      store_payload: true

  - id: penalties_and_liability_limits_check
    name: "Ответственность сторон: неустойка и лимиты ответственности"
    description: >
      Проверяет наличие и размер штрафных санкций (неустойки, пени) за нарушение
      ключевых обязательств (просрочка перечисления выручки, просрочка отчета),
      а также наличие общих ограничений (cap) ответственности комиссионера.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    display_order: 140

    rules:
      keywords:
        - "неустойка"
        - "пени"
        - "штраф"
        - "просрочка перечисления"
        - "просрочка отчета"
        - "ограничение ответственности"
        - "лимит ответственности"
        - "проценты за просрочку"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)неустойк[аи]|пен[ия]|штраф"
        - "(?i)ответственность\\s+ограничен|лимит\\s+ответственности"
        - "(?i)просрочк[аи].{0,30}перечислен|просрочк[аи].{0,30}отчет"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор комиссии по Главе 51 ГК РФ.
        Проверяются условия финансовой ответственности сторон за нарушения.

        Нормативный ориентир:
        - ст. 395 ГК РФ — проценты за пользование чужими денежными средствами
        - ст. 330 ГК РФ — неустойка (штраф, пени)
        - ст. 15, 393 ГК РФ — возмещение убытков

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора.
        - Не оценивай серьёзность риска.
        - Не подставляй нормы закона вместо текста договора: если неустойка
          не зафиксирована — это not_defined (действуют общие нормы ГК РФ).

        [ЗАДАЧА]
        Определи:
        1. Есть ли неустойка за просрочку перечисления выручки комитенту.
        2. Есть ли неустойка за просрочку предоставления отчета комиссионера.
        3. Есть ли общий лимит (cap) ответственности комиссионера.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Если данные не указаны прямо — возвращай "not_defined".
        3. Не используй "None", "null", "N/A", "-" или пустые строки.
        4. В evidence включай только точные цитаты из договора в виде массива объектов.
        5. Верни РОВНО один валидный JSON-объект, пригодный для парсинга
           через json.loads без предварительной обработки. Без markdown,
           без ```json, без текста до или после. Начни ответ сразу с `{` и закончи `}`.

        [ПРИМЕРЫ (FEW-SHOT)]
        Пример 1 — четкие пени и отсутствие лимита:
        Фрагмент:
        "За просрочку перечисления выручки Комиссионер уплачивает Комитенту
        пени в размере 0,1% от суммы задолженности за каждый день просрочки.
        Ответственность Комиссионера не ограничивается суммой вознаграждения."
        Ответ:
        {
          "late_proceeds_penalty_status": "defined",
          "late_reporting_penalty_status": "not_defined",
          "liability_cap_status": "uncapped",
          "penalties_summary": "Пени за просрочку выручки: 0.1% в день | Лимит ответственности: отсутствует",
          "evidence": [
            {
              "clause_ref": "п. 11.1",
              "quote": "За просрочку перечисления выручки Комиссионер уплачивает Комитенту пени в размере 0,1% от суммы задолженности за каждый день просрочки."
            },
            {
              "clause_ref": "п. 11.2",
              "quote": "Ответственность Комиссионера не ограничивается суммой вознаграждения."
            }
          ]
        }

        Пример 2 — данные отсутствуют:
        Фрагмент:
        "Стороны несут ответственность в соответствии с законодательством РФ."
        Ответ:
        {
          "late_proceeds_penalty_status": "not_defined",
