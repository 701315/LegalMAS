        </context>

        <task>
        1. termination_mechanism_status — "defined" / "not_defined".
        2. unsold_goods_return_status — "defined" / "not_defined".
        3. termination_compensation_status — "defined" / "not_defined".
        </task>

        <rules>
        - Используй только текст договора.
        - Верни только JSON.
        </rules>
      fields:
        - name: "termination_mechanism_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Наличие порядка прекращения."
          required: true
        - name: "unsold_goods_return_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Наличие режима возврата нереализованного товара."
          required: true
        - name: "termination_compensation_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Наличие расчётов/компенсации при прекращении."
          required: false
      store_payload: true

  # ──────────────────────────────────────────────────────────────────────────
  # CHECK 10: Налоговые последствия и документооборот
  # ──────────────────────────────────────────────────────────────────────────
  - id: tax_and_documentation_check
    name: "Налоговые последствия и документооборот по комиссии"
    description: >
      Проверяет наличие налоговых оговорок, корректного первичного
      документооборота и подтверждения того, что доходом комиссионера
      является только вознаграждение.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "налоговые последствия"
        - "доходом комиссионера является вознаграждение"
        - "счет-фактура"
        - "отчет как первичный документ"
        - "документооборот по комиссии"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)налогов(ые|ых)\\s+последств"
        - "(?i)доходом\\s+комиссионера\\s+является\\s+вознаграждение"
        - "(?i)счет[- ]фактур|первичн(ый|ого)\\s+документ"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор комиссии по Главе 51 ГК РФ.
        Проверяется только один вопрос: налоговые последствия и документооборот.

        Нормативный ориентир:
        - ст. 156 НК РФ — налоговая база при комиссионной модели
        - ст. 251 НК РФ — доходы, не учитываемые при налогообложении

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора.
        - Не оценивай серьёзность риска.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Есть ли налоговая оговорка.
        2. Есть ли указание на документооборот (счета-фактуры, первичные документы).
        3. Есть ли подтверждение, что доходом комиссионера является только вознаграждение.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Если условие не указано прямо — возвращай "not_defined".
        3. Если текстового значения нет — возвращай строго "Данные не определены".
        4. Не используй "None", "null", "not_defined", "not_defined" или пустые строки.
        5. В evidence включай только текст договора.
        6. Верни только один JSON-объект.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1:
        Фрагмент:
        "Доходом Комиссионера является только комиссионное вознаграждение.
        Счета-фактуры выставляются в порядке, предусмотренном НК РФ.
        Отчёт Комиссионера является первичным документом для учёта."

        Ответ:
        {
          "tax_clause_status": "defined",
          "documentation_status": "defined",
          "revenue_qualification_status": "defined"
        }

        Пример 2:
        Фрагмент:
        "Комиссионер исполняет поручение Комитента."

        Ответ:
        {
          "tax_clause_status": "not_defined",
          "documentation_status": "not_defined",
          "revenue_qualification_status": "not_defined"
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о налоговых последствиях.
        2. Найди прямую цитату о документообороте.
        3. Найди прямую цитату о квалификации дохода комиссионера.
        4. Если прямой цитаты нет — верни "not_defined".

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "tax_clause_status": "<defined / not_defined>",
          "documentation_status": "<defined / not_defined>",
          "revenue_qualification_status": "<defined / not_defined>"
        }
      context_k: 5
      temperature: 0.0
      max_tokens: 340

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "налоговые последствия доходом комиссионера является вознаграждение счёт-фактура отчёт как первичный документ документооборот по комиссии НК РФ"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - boilerplate
        - obligations
      negative_keywords:
        - "означает"
        - "в целях настоящего"
        - "вознаграждение комиссионера"
        - "отчёт"
        - "субкомиссия"
        - "делькредере"
        - "прекращение"
        - "возврат товара"
      position_bias:
        preferred_range: [0.60, 1.0]
        boost: 0.12
        scope: segment
      context_k: 5
      max_chunks: 6
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
        - "invoice"
      preferred_clause_functions:
        - "boilerplate"
        - "obligations"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 30
      max_snippet_length: 500

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 600
      compact_output: false

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора комиссии сведения
        о налоговых оговорках, документообороте и квалификации дохода комиссионера.
        Не анализируй вознаграждение, отчётность или прекращение.
        </role>

        <context>
        {context}
        </context>

        <task>
        1. tax_clause_status — "defined" / "not_defined".
        2. documentation_status — "defined" / "not_defined".
        3. revenue_qualification_status — "defined" / "not_defined".
        </task>

        <rules>
        - Используй только текст договора.
        - Верни только JSON.
        </rules>
      fields:
        - name: "tax_clause_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Наличие налоговой оговорки."
          required: true
        - name: "documentation_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Наличие условия о документообороте."
          required: false
        - name: "revenue_qualification_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Подтверждение, что доход комиссионера — только вознаграждение."
          required: false
      store_payload: true

# ════════════════════════════════════════════════════════════════════════════
# БЛОК 5: DD_REQUEST_TEMPLATES
# Читается: DDRequestTemplateLoader
# ════════════════════════════════════════════════════════════════════════════

dd_request_templates:
  commission_subject_extraction:
    text: >
      Просим предоставить по {doc_names}: базовую структуру договора комиссии —
      комитента, комиссионера, предмет сделок, модель действия от своего имени,
      размер вознаграждения, отчётность, статус товара комитента и наличие делькредере.
    addressee: "Комитент / Комиссионер"

  subject_and_representation_model_check:
    text: >
      Просим уточнить по {doc_names}: какие именно сделки совершает комиссионер,
      от чьего имени он действует, за чей счёт совершаются сделки, а также
      минимальные/максимальные ценовые параметры.
    addressee: "Юридический советник"

  remuneration_expenses_and_retention_check:
    text: >
      Просим предоставить по {doc_names}: структуру вознаграждения комиссионера,
      порядок возмещения расходов, смету/виды расходов, а также условия права удержания.
    addressee: "Комиссионер / Комитент"

  reporting_and_proceeds_transfer_check:
    text: >
      Просим предоставить по {doc_names}: форму и периодичность отчёта комиссионера,
      срок и порядок заявления возражений комитентом, а также сроки перечисления
      выручки комитенту.
    addressee: "Комиссионер / Комитент"

  ownership_and_segregation_check:
    text: >
      Просим предоставить по {doc_names}: оговорки о сохранении собственности комитента,
      правила раздельного хранения/учёта товара, маркировку имущества и меры защиты
      от смешения с имуществом комиссионера.
    addressee: "Комиссионер / Комитент"

  additional_benefit_check:
    text: >
      Просим уточнить по {doc_names}: как распределяется дополнительная выгода,
      если сделка совершена на более выгодных условиях, чем было указано комитентом.
    addressee: "Обе стороны"

  subcommission_check:
    text: >
      По {doc_names} с субкомиссией просим предоставить: условия привлечения
      субкомиссионера, необходимость согласия комитента, объём ответственности
      комиссионера и сведения о субкомиссионере.
    addressee: "Комиссионер / Юридический советник"

  delcredere_check:
    text: >
      По {doc_names} с делькредере просим предоставить: условия наступления
      ответственности комиссионера за третье лицо, предел такой ответственности
      и размер дополнительного вознаграждения.
    addressee: "Комиссионер / Комитент"

  termination_and_unsold_goods_check:
    text: >
      Просим уточнить в {doc_names}: порядок прекращения договора, сроки и форму
      возврата нереализованного товара, оформление акта возврата, а также расчёты
      по вознаграждению и расходам при прекращении.
    addressee: "Комитент / Комиссионер"

  tax_and_documentation_check:
    text: >
      Просим предоставить по {doc_names}: налоговую модель договора комиссии,
      порядок выставления счетов-фактур, первичный документооборот и пояснение,
      почему доходом комиссионера признаётся только вознаграждение, а не вся выручка.
    addressee: "Налоговый консультант / Юридический советник"

  _default:
    text: >
      Просим предоставить дополнительную информацию по вопросу «{check_name}»
      применительно к {doc_names}.
    addressee: "Юридический советник"


