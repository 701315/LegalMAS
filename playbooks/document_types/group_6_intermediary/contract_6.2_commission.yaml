        4. Не используй "None", "null", "not_defined", "not_defined" или пустые строки.
        5. В evidence включай только текст договора.
        6. Верни только один JSON-объект.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1:
        Фрагмент:
        "Комиссионер обязуется от своего имени, но за счёт Комитента совершить
        сделки по реализации товара по цене не ниже 100 000 рублей за единицу."

