        3. Найди упоминание обособления, запрета залога, конкурсной массы или ст. 996 ГК РФ.
        4. Убедись, что значения статусных полей — строго из allowed_values.
        5. Убедись, что title_transfer_summary отражает реальный уровень банкротного риска.

