             (Агент лишь перенаправляет);
           • "agent" — Агент самостоятельно обрабатывает претензии покупателей
             (с регрессом к Принципалу или без);
           • "shared" — совместная обработка (разделение по типам дефектов
             или этапам);
           • "not_defined" — порядок не урегулирован.

        2. warranty_obligations — гарантийные обязательства:
           • "defined" — установлен гарантийный срок и/или объём гарантийных
             обязательств;
           • "not_defined" — гарантия не урегулирована договором.

        3. claims_process — порядок рекламаций:
           • "defined" — описан механизм предъявления, рассмотрения и разрешения
             претензий (сроки, документы, ответственность);
           • "not_defined" — порядок не описан.

        4. returns_handling_details — фактический текст условий о возвратах,
           рекламациях и распределении расходов (до 250 символов).
           Если отсылка к регламенту — «Согласно Регламенту / Приложению №N».
           Если не урегулировано — «Данные не определены».

        5. returns_and_warranty_summary — сводный вывод одной фразой на русском
           для юриста, объединяющий режим рекламаций, гарантию и порядок возвратов.
        </task>

        <rules>
        - Используй только текст договора.
        - При модели «от имени принципала» по закону ответственность за качество
          перед покупателем несёт Принципал (ст. 1005 п. 2 ГК РФ). Если договор
          это прямо подтверждает — returns_handling_regime = "principal".
        - При модели «от своего имени» Агент формально является продавцом для
          покупателя и несёт ответственность. Если договор перекладывает это
          на Принципала — это "shared" или "principal".
        - Отсылка к регламенту/приложению = defined.
        - Верни РОВНО один валидный JSON-объект со всеми 5 ключами, пригодный для
          парсинга через json.loads без предварительной обработки. Без markdown,
          без ```json, без комментариев. Начни с { и закончи }.
        </rules>

        <cove>
        Перед ответом проверь, что все 5 ключей (5 полей) присутствуют в JSON,
        значения статусных полей — строго из allowed_values, и что
        returns_and_warranty_summary согласован с остальными полями.
        </cove>
      fields:
        - name: "returns_handling_regime"
          type: "string"
          presentation: "signal"
          allowed_values: ["principal", "agent", "shared", "not_defined"]
          description: >
            Распределение ответственности за обработку возвратов и рекламаций
            между принципалом и агентом (ст. 475–477, 997 ГК РФ).
          required: true
        - name: "warranty_obligations"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: >
            Наличие гарантийных обязательств и гарантийного срока на товары.
          required: false
        - name: "claims_process"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: >
            Наличие описанного порядка предъявления и рассмотрения рекламаций
            (сроки, документы, механизм).
          required: false
        - name: "returns_handling_details"
          type: "string"
          presentation: "fact"
          label: "Рекламации и возвраты"
          description: >
            Фактический текст условий о порядке рекламаций, возвратах товаров
            и распределении расходов.
          required: true
          display_in_grid: true
          display_priority: 2
        - name: "returns_and_warranty_summary"
          type: "string"
          presentation: "summary"
          label: "Гарантии и рекламации"
          description: >
            Сводный вывод одной фразой: режим рекламаций + гарантия + возвраты.
          required: true
          display_in_grid: true
          display_priority: 1

  - id: brand_and_trademark_usage_check
    name: "Использование товарных знаков и бренда принципала"
    description: >
      Проверяет условия использования агентом товарных знаков, логотипов и фирменного
      наименования принципала (ст. 1484, 1235 ГК РФ), территориальные и предметные
      ограничения, а также постконтрактные обязательства по прекращению использования.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "товарный знак"
        - "торговая марка"
        - "логотип"
        - "фирменное наименование"
        - "бренд"
        - "коммерческое обозначение"
        - "право использования"
        - "лицензия на товарный знак"
        - "маркетинговые материалы"
        - "рекламные материалы"
        - "прекращение использования"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)товарн.{0,5}знак|торгов.{0,5}марк"
        - "(?i)(логотип|бренд|фирменн.{0,10}наименован)"
        - "(?i)коммерческ.{0,10}обозначен"
        - "(?i)(использован|размещен).{0,20}(знак|марк|логотип|бренд)"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе и интеллектуальной собственности.
        Анализируется агентский договор по Главе 52 ГК РФ.
        Проверяется один вопрос: право агента на использование товарных знаков,
        бренда и маркетинговых материалов принципала.

        Нормативный ориентир:
        - ст. 1484 ГК РФ — исключительное право на товарный знак принадлежит
          правообладателю; никто не вправе использовать товарный знак без разрешения.
        - ст. 1235 ГК РФ — лицензионный договор о предоставлении права использования
          результата интеллектуальной деятельности (в т.ч. товарного знака).
        - ст. 1027 ГК РФ — договор коммерческой концессии (франшиза): если агент
          использует комплекс исключительных прав (бренд + технологии + ноу-хау),
          договор может быть переквалифицирован в концессию с регистрацией в Роспатенте.
        - ст. 1538 ГК РФ — коммерческое обозначение (может использоваться без
          регистрации, но право возникает только при достаточной известности).
        - Практика: в дистрибуторских и агентских договорах право на бренд часто
          даётся «внутри» договора без отдельного лицензионного соглашения. Это допустимо
          для простого разрешения, но при переквалификации в концессию — риск
          недействительности без регистрации.

        Важно:
        - Твоя задача — установить, что прямо есть в тексте договора.
        - Не оценивай серьёзность риска.
        - Если право на бренд подразумевается из предмета договора, но прямо
          не описано — это "not_defined" (юридический пробел).

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Явное право агента на использование товарных знаков / бренда принципала.
        2. Ограничения использования (территория, каналы, срок, стандарты качества).
        3. Постконтрактные обязательства по прекращению использования бренда.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Если условия использования бренда определяются брендбуком / регламентом /
           приложением — это defined-факт.
        4. Если данных в тексте прямо нет — статусное поле = "not_defined",
           текстовое поле = "Данные не определены".
        5. Не используй "None", "null", пустые строки или значения вне allowed_values.
        6. В evidence включай только текст договора.
        7. Верни РОВНО один валидный JSON-объект со всеми 5 ключами, пригодный для парсинга
           через json.loads без предварительной обработки. Без markdown, без ```json,
           без комментариев, без текста до или после. Начни ответ сразу с { и закончи }.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — детальное разрешение с ограничениями:
        Фрагмент:
        "Принципал предоставляет Агенту неисключительное право использования товарного
        знака «Альфа» (свидетельство №123456) на территории РФ исключительно для целей
        исполнения настоящего договора. Агент обязан соблюдать стандарты брендбука
        (Приложение №4). При прекращении договора Агент обязан немедленно прекратить
        использование товарного знака и вернуть все маркетинговые материалы."

        Ответ:
        {
          "brand_usage_rights": "licensed",
          "usage_restrictions": "defined",
          "post_termination_brand_obligations": "defined",
          "brand_usage_details": "Неисключительная лицензия на ТЗ «Альфа» (св-во №123456) для целей договора; стандарты брендбука (Приложение №4)",
          "brand_usage_summary": "Лицензия на ТЗ «Альфа» с ограничениями по брендбуку; при прекращении — немедленный запрет использования и возврат материалов"
        }

        Пример 2 — подразумеваемое право без деталей:
        Фрагмент:
        "Агент вправе использовать наименование и логотип Принципала в рекламных
        материалах для продвижения продукции."

        Ответ:
        {
          "brand_usage_rights": "permitted_in_contract",
          "usage_restrictions": "not_defined",
          "post_termination_brand_obligations": "not_defined",
          "brand_usage_details": "Разрешено использование наименования и логотипа в рекламе; ограничения и стандарты не установлены",
          "brand_usage_summary": "Разрешение на бренд в рекламе без ограничений; постконтрактные обязательства не урегулированы"
        }

        Пример 3 — молчание договора:
        Фрагмент:
        "Агент обязуется осуществлять поиск покупателей продукции Принципала."

        Ответ:
        {
          "brand_usage_rights": "not_defined",
          "usage_restrictions": "not_defined",
          "post_termination_brand_obligations": "not_defined",
          "brand_usage_details": "Данные не определены",
          "brand_usage_summary": "Право на использование бренда и товарных знаков в договоре не урегулировано"
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        Проверь, что все 5 ключей присутствуют в JSON:
        1. Найди прямую цитату о праве использования товарного знака / бренда / логотипа.
        2. Найди ограничения (территория, каналы, стандарты, брендбук).
        3. Найди постконтрактные обязательства (прекращение использования, возврат материалов).
        4. Убедись, что значения статусных полей — строго из allowed_values.
        5. Убедись, что brand_usage_summary отражает реальный объём прав на бренд.

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "brand_usage_rights": "<licensed / permitted_in_contract / prohibited / not_defined>",
          "usage_restrictions": "<defined / not_defined>",
          "post_termination_brand_obligations": "<defined / not_defined>",
          "brand_usage_details": "<краткий текст или 'Данные не определены'>",
          "brand_usage_summary": "<сводный вывод одной фразой>"
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 550

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "товарный знак торговая марка логотип фирменное наименование бренд коммерческое обозначение право использования лицензия маркетинговые материалы рекламные материалы прекращение использования брендбук"
      retrieval_profile: "scope_of_work_check"
      preferred_unit_types:
        - obligation
        - general_provision
        - representations
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - limitations
        - rights
      negative_keywords:
        - "означает"
        - "в целях настоящего"
        - "субагент"
        - "расторжение"
      position_bias:
        preferred_range: [0.25, 0.75]
        boost: 0.10
        scope: segment
      context_k: 6
      max_chunks: 8
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
        - "invoice"
      preferred_clause_functions:
        - "obligations"
        - "limitations"
        - "rights"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 35
      max_snippet_length: 600

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 800
      compact_output: false
      store_payload: true
      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста агентского договора сведения
        о праве агента на использование товарных знаков, бренда, логотипа
        и фирменного наименования принципала (ст. 1484, 1235 ГК РФ), ограничениях
        использования и постконтрактных обязательствах.
        Не анализируй вознаграждение, отчётность, субагентство или налоги.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие 5 полей (всего 5 ключей в JSON):

        1. brand_usage_rights — право на использование бренда:
           • "licensed" — предоставлена явная лицензия на товарный знак
             (с указанием номера свидетельства, объёма прав);
           • "permitted_in_contract" — разрешение на использование бренда
             в договоре есть, но без формальной лицензии;
           • "prohibited" — использование бренда прямо запрещено;
           • "not_defined" — право на бренд не урегулировано.

        2. usage_restrictions — ограничения использования:
           • "defined" — установлены ограничения (территория, каналы, стандарты
             качества, брендбук, срок);
           • "not_defined" — ограничения не установлены.

        3. post_termination_brand_obligations — постконтрактные обязательства:
           • "defined" — предусмотрена обязанность прекратить использование бренда
             и вернуть маркетинговые материалы при прекращении договора;
           • "not_defined" — постконтрактные обязательства не урегулированы.

        4. brand_usage_details — фактический текст условий использования бренда
           (объём прав, ограничения, стандарты; до 250 символов).
           Если отсылка к брендбуку/приложению — «Согласно Приложению №N».
           Если не урегулировано — «Данные не определены».

        5. brand_usage_summary — сводный вывод одной фразой на русском для юриста,
           объединяющий права на бренд, ограничения и постконтрактные обязательства.
        </task>

        <rules>
        - Используй только текст договора.
        - Если агент использует бренд де-факто, но в договоре это не описано —
          brand_usage_rights = "not_defined" (юридический пробел).
        - Отсылка к брендбуку/регламенту/приложению = defined.
        - Верни РОВНО один валидный JSON-объект со всеми 5 ключами, пригодный для
          парсинга через json.loads без предварительной обработки. Без markdown,
          без ```json, без комментариев. Начни с { и закончи }.
        </rules>

        <cove>
        Перед ответом проверь, что все 5 ключей (5 полей) присутствуют в JSON,
        значения статусных полей — строго из allowed_values, и что
        brand_usage_summary согласован с остальными полями.
        </cove>
      fields:
        - name: "brand_usage_rights"
          type: "string"
          presentation: "signal"
          allowed_values:
            - "licensed"
            - "permitted_in_contract"
            - "prohibited"
            - "not_defined"
          description: >
            Право агента на использование товарных знаков и бренда принципала
            (ст. 1484, 1235 ГК РФ).
          required: true
        - name: "usage_restrictions"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: >
            Наличие ограничений использования бренда (территория, каналы,
            стандарты качества, брендбук).
          required: false
        - name: "post_termination_brand_obligations"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: >
            Постконтрактные обязательства по прекращению использования бренда
            и возврату маркетинговых материалов.
          required: false
        - name: "brand_usage_details"
          type: "string"
          presentation: "fact"
          label: "Права на бренд и ТЗ"
          description: >
            Фактические условия использования товарных знаков, логотипа
            и бренда принципала.
          required: true
          display_in_grid: true
          display_priority: 2
        - name: "brand_usage_summary"
          type: "string"
          presentation: "summary"
          label: "Бренд и товарные знаки"
          description: >
            Сводный вывод одной фразой: права на бренд + ограничения +
            постконтрактные обязательства.
          required: true
          display_in_grid: true
          display_priority: 1

  - id: tax_regime_and_vat_check
    name: "Налоговый режим и статус налогового агента по НДС"
    description: >
      Проверяет распределение налоговых обязанностей между принципалом и агентом,
      статус налогового агента по НДС (ст. 156, 161 НК РФ), порядок выставления
      счетов-фактур и режим налогообложения агентского вознаграждения.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "НДС"
        - "налог на добавленную стоимость"
        - "налоговый агент"
        - "счёт-фактура"
        - "счет-фактура"
        - "налогообложение вознаграждения"
        - "упрощённая система"
        - "УСН"
        - "общая система налогообложения"
        - "ОСН"
        - "налоговые обязанности"
        - "налоговые последствия"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)НДС|налог.{0,10}добавленн"
        - "(?i)налогов.{0,10}агент"
        - "(?i)сч[её]т.{0,5}фактур"
        - "(?i)(УСН|ОСН|упрощ[её]нн)"
        - "(?i)налогообложен.{0,15}вознагражден"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе и налоговому праву.
        Анализируется агентский договор по Главе 52 ГК РФ.
        Проверяется один вопрос: налоговые последствия агентского договора,
        статус налогового агента по НДС и порядок документооборота.

        Нормативный ориентир:
        - ст. 156 НК РФ — налогоплательщики, получающие доход на основе договоров
          поручения, комиссии или агентских договоров, определяют налоговую базу
          как сумму дохода, полученную в виде вознаграждения (без учёта сумм,
          поступающих в возмещение расходов).
        - ст. 161 п. 1 НК РФ — при реализации товаров/услуг от своего имени
          агент, действующий по поручению иностранного лица, признаётся налоговым
          агентом по НДС.
        - ст. 168, 169 НК РФ — порядок выставления счетов-фактур: при агентской
          модели «от своего имени» агент выставляет счёт-фактуру покупателю от
          своего имени; при модели «от имени принципала» — счёт-фактура выставляется
          от имени принципала.
        - ст. 251 п. 1 пп. 9 НК РФ — средства, поступившие агенту в возмещение
          расходов, не включаются в его доходы при определении налоговой базы
          по налогу на прибыль.
        - Письмо Минфина России от 15.08.2017 № 03-07-11/52398 — разъяснения
          по НДС при агентских схемах.

        Важно:
        - Твоя задача — установить, что прямо есть в тексте договора.
        - Не оценивай серьёзность налогового риска.
        - Если налоговые обязанности определяются отсылкой к закону
          («в соответствии с НК РФ») — это "not_defined" для договорных условий.
        - Молчание договора о налогах — стандартная ситуация; налоговые последствия
          определяются законом в зависимости от модели агентирования.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Режим НДС и статус налогового агента (кто является плательщиком НДС
           по сделкам с третьими лицами).
        2. Порядок выставления счетов-фактур (от чьего имени).
        3. Распределение налоговых расходов и обязанностей.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Если налоговые условия определяются отсылкой к НК РФ или приложению —
           это defined-факт для отсылки, но статус = "not_defined" для конкретных
           договорных условий.
        4. Если данных в тексте прямо нет — статусное поле = "not_defined",
           текстовое поле = "Данные не определены".
        5. Не используй "None", "null", пустые строки или значения вне allowed_values.
        6. В evidence включай только текст договора.
        7. Верни РОВНО один валидный JSON-объект со всеми 5 ключами, пригодный для парсинга
           через json.loads без предварительной обработки. Без markdown, без ```json,
           без комментариев, без текста до или после. Начни ответ сразу с { и закончи }.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — детальные налоговые условия:
        Фрагмент:
        "Агент применяет УСН и не является плательщиком НДС. Принципал является
        плательщиком НДС и выставляет счета-фактуры покупателям через Агента.
        Агентское вознаграждение не облагается НДС. Все налоговые обязанности
        по сделкам с третьими лицами несёт Принципал."

        Ответ:
        {
          "vat_regime_code": "principal_vat",
          "invoice_issuance": "principal",
          "tax_expense_allocation": "defined",
          "vat_regime_details": "Агент на УСН (без НДС); Принципал — плательщик НДС; вознаграждение без НДС",
          "tax_summary": "Агент на УСН; НДС на сделках — Принципал; счета-фактуры от Принципала; налоговые расходы на Принципале"
        }

        Пример 2 — модель «от своего имени», агент — налоговый агент:
        Фрагмент:
        "Агент действует от своего имени и выставляет счета-фактуры покупателям
        от своего имени с выделением НДС. Агент является налоговым агентом
        по НДС в отношении сделок, совершённых за счёт Принципала."

        Ответ:
        {
          "vat_regime_code": "agent_as_tax_agent",
          "invoice_issuance": "agent",
          "tax_expense_allocation": "not_defined",
          "vat_regime_details": "Агент — налоговый агент по НДС; счета-фактуры от имени Агента с выделением НДС",
          "tax_summary": "Агент — налоговый агент по НДС; счета-фактуры от Агента; распределение налоговых расходов не урегулировано"
        }

        Пример 3 — молчание договора:
        Фрагмент:
        "Агент обязуется совершать сделки по продаже товаров Принципала."

        Ответ:
        {
          "vat_regime_code": "not_defined",
          "invoice_issuance": "not_defined",
          "tax_expense_allocation": "not_defined",
          "vat_regime_details": "Данные не определены (налоговые последствия определяются по закону в зависимости от модели агентирования)",
          "tax_summary": "Налоговые условия в договоре не урегулированы; режим НДС определяется по закону (ст. 156, 161 НК РФ)"
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        Проверь, что все 5 ключей присутствуют в JSON:
        1. Найди прямую цитату о НДС, налоговом агенте или системе налогообложения.
        2. Найди прямую цитату о счетах-фактурах и порядке их выставления.
        3. Найди прямую цитату о распределении налоговых расходов.
        4. Убедись, что значения статусных полей — строго из allowed_values.
        5. Убедись, что tax_summary отражает реальные налоговые договорённости.

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "vat_regime_code": "<agent_as_tax_agent / principal_vat / simplified / mixed / not_defined>",
          "invoice_issuance": "<principal / agent / not_defined>",
          "tax_expense_allocation": "<defined / not_defined>",
          "vat_regime_details": "<краткий текст или 'Данные не определены'>",
          "tax_summary": "<сводный вывод одной фразой>"
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 550

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "НДС налог на добавленную стоимость налоговый агент счёт-фактура счет-фактура налогообложение вознаграждения УСН ОСН упрощённая система налоговые обязанности налоговые расходы"
      retrieval_profile: "payment_terms_check"
      preferred_unit_types:
        - obligation
        - payment_term
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - procedures
      negative_keywords:
        - "означает"
        - "в целях настоящего"
        - "субагент"
        - "эксклюзивность"
      position_bias:
        preferred_range: [0.30, 0.80]
        boost: 0.10
        scope: segment
      context_k: 6
      max_chunks: 8
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
        - "invoice"
      preferred_clause_functions:
        - "obligations"
        - "procedures"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 35
      max_snippet_length: 600

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 800
      compact_output: false
      store_payload: true
      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста агентского договора сведения
        о налоговом режиме, статусе налогового агента по НДС (ст. 156, 161 НК РФ),
        порядке выставления счетов-фактур и распределении налоговых расходов.
        Не анализируй размер вознаграждения, отчётность или субагентство.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие 5 полей (всего 5 ключей в JSON):

        1. vat_regime_code — режим НДС и статус налогового агента:
           • "agent_as_tax_agent" — агент признан налоговым агентом по НДС
             (выставляет счета-фактуры от своего имени, удерживает и перечисляет НДС);
           • "principal_vat" — принципал является плательщиком НДС по сделкам,
             агент действует без НДС (на УСН или как посредник);
           • "simplified" — обе стороны на УСН, НДС не применяется;
           • "mixed" — комбинированный режим (разные виды сделок — разный НДС);
           • "not_defined" — налоговый режим в договоре не урегулирован.

        2. invoice_issuance — порядок выставления счетов-фактур:
           • "principal" — счета-фактуры выставляются от имени принципала;
           • "agent" — счета-фактуры выставляются от имени агента;
           • "not_defined" — порядок не указан.

        3. tax_expense_allocation — распределение налоговых расходов:
           • "defined" — в договоре прямо указано, кто несёт налоговые расходы
             (НДС, налог на прибыль, транспортный и т.д.);
           • "not_defined" — распределение не урегулировано.

        4. vat_regime_details — фактический текст налоговых условий договора
           (режим НДС, система налогообложения сторон, счета-фактуры; до 250 символов).
           Если не урегулировано — «Данные не определены (по закону, ст. 156, 161 НК РФ)».

        5. tax_summary — сводный вывод одной фразой на русском для юриста,
           объединяющий налоговый режим, счета-фактуры и распределение расходов.
        </task>

        <rules>
        - Используй только текст договора.
        - Отсылка к НК РФ или «в соответствии с налоговым законодательством» =
          status "not_defined" (договорных условий нет, действует закон).
        - Если агент на УСН — он не плательщик НДС; это должно быть отражено.
        - Верни РОВНО один валидный JSON-объект со всеми 5 ключами, пригодный для
          парсинга через json.loads без предварительной обработки. Без markdown,
          без ```json, без комментариев. Начни с { и закончи }.
        </rules>

        <cove>
        Перед ответом проверь, что все 5 ключей (5 полей) присутствуют в JSON,
        значения статусных полей — строго из allowed_values, и что
        tax_summary согласован с остальными полями.
        </cove>
      fields:
        - name: "vat_regime_code"
          type: "string"
          presentation: "signal"
          allowed_values:
            - "agent_as_tax_agent"
            - "principal_vat"
            - "simplified"
            - "mixed"
            - "not_defined"
          description: >
            Режим НДС и статус налогового агента (ст. 156, 161 НК РФ).
          required: true
        - name: "invoice_issuance"
          type: "string"
          presentation: "signal"
          allowed_values: ["principal", "agent", "not_defined"]
          description: >
            Порядок выставления счетов-фактур: от имени принципала или агента.
          required: false
        - name: "tax_expense_allocation"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: >
            Наличие договорного распределения налоговых расходов между сторонами.
          required: false
        - name: "vat_regime_details"
          type: "string"
          presentation: "fact"
          label: "Налоговый режим и НДС"
          description: >
            Фактические налоговые условия договора: режим НДС, система
            налогообложения, счета-фактуры.
          required: true
          display_in_grid: true
          display_priority: 2
        - name: "tax_summary"
          type: "string"
          presentation: "summary"
          label: "Налоги и НДС"
          description: >
            Сводный вывод одной фразой: налоговый режим + счета-фактуры +
            распределение налоговых расходов.
          required: true
          display_in_grid: true
          display_priority: 1

# ════════════════════════════════════════════════════════════════════════════
# БЛОК 5: DD_REQUEST_TEMPLATES
# Читается: DDRequestTemplateLoader
# ════════════════════════════════════════════════════════════════════════════

dd_request_templates:
  agency_subject_extraction:
    text: >
      Просим предоставить по {doc_names}: базовую структуру агентского договора —
      принципала, агента, предмет действий, модель агентирования, вознаграждение,
      порядок отчётности, exclusivity, субагентство и post-termination условия.
    addressee: "Принципал / Агент"

  agency_model_and_authority_check:
    text: >
      Просим уточнить по {doc_names}: действует ли агент от имени принципала
      или от своего имени, какие права и обязанности возникают у сторон,
      субсидиарный режим (поручение/комиссия) и наличие доверенности.
    addressee: "Юридический советник"

  remuneration_and_payment_trigger_check:
    text: >
      Просим предоставить по {doc_names}: структуру вознаграждения, триггеры оплаты,
      условия tail commission (постконтрактное вознаграждение).
    addressee: "Принципал / Агент"

  reporting_and_settlement_check:
    text: >
      Просим предоставить по {doc_names}: порядок отчётов агента, срок возражений,
      связь отчёта с оплатой.
    addressee: "Агент / Принципал"

  funds_and_assets_control_check:
    text: >
      По {doc_names} просим: порядок учёта средств принципала, сроки перечисления
      выручки, наличие специального счёта или обособленного учёта.
    addressee: "Агент / Принципал"

  exclusivity_and_non_compete_check:
    text: >
      Просим уточнить по {doc_names}: exclusivity, территорию, non-compete,
      последствия нарушения эксклюзивности.
    addressee: "Принципал / Агент"

  subagency_check:
    text: >
      По {doc_names} просим: режим субагентства, необходимость согласия принципала,
      ответственность агента за субагента.
    addressee: "Агент / Юридический советник"

  anti_requalification_and_kpi_check:
    text: >
      Просим предоставить по {doc_names}: анти-трудовые safeguard clauses,
      формулировку самостоятельности агента, KPI и их связь с вознаграждением.
      ВНИМАНИЕ: формулировка KPI должна исключать признаки трудовой функции.
    addressee: "Юридический советник / HR"

  client_database_ownership:
    text: >
      Просим согласовать для {doc_names}: кому принадлежит клиентская база
      (принципалу/агенту/совместно), порядок доступа и передачи при расторжении.
    addressee: "Обе стороны"

  expense_reimbursement_check:
    text: >
      Просим согласовать для {doc_names}: порядок возмещения расходов агента,
      перечень возмещаемых расходов, бюджет, требования к документации.
    addressee: "Обе стороны"

  termination_and_post_contract_check:
    text: >
      Просим уточнить по {doc_names}: порядок прекращения, завершение начатых
      поручений, окончательный расчёт, постконтрактные обязательства.
    addressee: "Обе стороны"

  liability_and_indemnity_check:
    text: >
      Просим согласовать для {doc_names}: распределение ответственности,
      ограничение ответственности, делькредере, неустойки.
    addressee: "Юридический советник"

  _default:
    text: >
      Просим предоставить дополнительную информацию по вопросу «{check_name}»
      применительно к {doc_names}.
    addressee: "Юридический советник"

