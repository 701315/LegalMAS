          presentation: "summary"
          label: "Риск переквалификации и KPI"
          description: >
            Сводная оценка риска переквалификации в трудовой договор (ст. 19.1 ТК РФ) и статус KPI.
          required: true
          display_in_grid: true
          display_priority: 1

