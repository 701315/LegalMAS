compliance_rules: []

# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 4: CHECKS_V8 — единственный рабочий слой юридического анализа
#  Читается: DocTypeCheckLoader._load_doc_type_checks()
# ════════════════════════════════════════════════════════════════════════════

checks_v8:

  # ──────────────────────────────────────────────────────────────────────────
  # CHECK 1: Базовое извлечение структуры агентского договора
  # ──────────────────────────────────────────────────────────────────────────
  - id: agency_subject_extraction
    name: "Базовое извлечение структуры агентского договора"
    description: >
      Извлекает принципала, агента, предмет, модель агентирования, вознаграждение,
      отчётность, exclusivity, субагентство и tail commission.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "агентский договор"
        - "принципал"
        - "агент"
        - "агентское вознаграждение"
        - "отчет агента"
        - "от имени принципала"
        - "от своего имени"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)(агентск(ий|ого)\\s+договор|принципал|агент)"
        - "(?i)(от\\s+имени\\s+принципала|от\\s+своего\\s+имени)"
        - "(?i)вознаграждени[ея].{0,30}агент"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется агентский договор по Главе 52 ГК РФ (ст. 1005-1011).
        Проверяется только один вопрос: ключевые параметры агентского договора.

        Нормативный ориентир:
        - ст. 1005 ГК РФ — агентский договор
        - ст. 1006 ГК РФ — агентское вознаграждение

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора,
          а чего прямо нет.
        - Не оценивай серьёзность риска.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Принципал (наименование / ФИО).
        2. Агент (наименование / ФИО).
        3. Модель агентирования (от имени принципала / от своего имени).
        4. Предмет (сфера действий агента).
        5. Статус вознаграждения.
        6. Наличие отчётности.
        7. Наличие субагентства.
        8. Наличие exclusivity.
        9. Наличие tail commission.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Если данные не указаны прямо — возвращай "not_defined".
        4. Если текстового значения нет — возвращай строго "Данные не определены".
        5. Не используй "None", "null", "not_defined", "not_defined" или пустые строки.
        6. В evidence включай только текст договора.
        7. Верни только один JSON-объект.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — параметры определены:
        Фрагмент:
        "Принципал — ООО «Альфа» поручает, а Агент — Иванов И.И. обязуется
        от своего имени, но за счёт Принципала совершать действия по продвижению
        товаров. Вознаграждение — 10% от суммы сделок. Агент представляет отчёт
        ежемесячно. Субагентство допускается с согласия Принципала."

        Ответ:
        {
          "principal": "ООО «Альфа»",
          "agent": "Иванов И.И.",
          "agency_model": "own_name_model",
          "actions_scope": "продвижение товаров",
          "remuneration_status": "defined",
          "reporting_status": "defined",
          "subagency_status": "defined",
          "exclusivity_status": "not_defined",
          "tail_commission_status": "not_defined"
        }

        Пример 2 — данные отсутствуют:
        Фрагмент:
        "Стороны заключили настоящий договор."

        Ответ:
        {
          "principal": "Данные не определены",
          "agent": "Данные не определены",
          "agency_model": "not_defined",
          "actions_scope": "Данные не определены",
          "remuneration_status": "not_defined",
          "reporting_status": "not_defined",
          "subagency_status": "not_defined",
          "exclusivity_status": "not_defined",
          "tail_commission_status": "not_defined"
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о принципале.
        2. Найди прямую цитату об агенте.
        3. Найди прямую цитату о модели действия.
        4. Найди прямую цитату о предмете.
        5. Если прямой цитаты нет — верни "not_defined" или "Данные не определены".

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "principal": "<текст или 'Данные не определены'>",
          "agent": "<текст или 'Данные не определены'>",
          "agency_model": "<principal_name_model / own_name_model / mixed_or_unclear / not_defined>",
          "actions_scope": "<текст или 'Данные не определены'>",
          "remuneration_status": "<defined / unclear / not_defined>",
          "reporting_status": "<defined / not_defined>",
          "subagency_status": "<defined / not_defined>",
          "exclusivity_status": "<defined / not_defined>",
          "tail_commission_status": "<defined / not_defined>"
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 700

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "агентский договор принципал агент от имени принципала от своего имени агентское вознаграждение отчёт агента предмет действий продвижение товаров поиск клиентов"
      retrieval_profile: "scope_of_work_check"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - definitions
        - obligations
      negative_keywords:
        - "означает"
        - "в целях настоящего"
        - "приложение"
        - "субагент"
        - "эксклюзивность"
        - "расторжение"
        - "прекращение"
      position_bias:
        preferred_range: [0.0, 0.35]
        boost: 0.20
        scope: segment
      context_k: 6
      max_chunks: 10
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
        - "invoice"
      preferred_clause_functions:
        - "definitions"
        - "obligations"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 50
      max_snippet_length: 700

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1150
      compact_output: false

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста агентского договора ключевые
        параметры: принципала, агента, модель, предмет, вознаграждение,
        отчётность, субагентство, exclusivity, tail commission.
        Не анализируй ответственность, споры или прекращение.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        1. principal — принципал.
        2. agent — агент.
        3. agency_model — "principal_name_model" / "own_name_model" / "mixed_or_unclear" / "not_defined".
        4. actions_scope — предмет действий агента.
        5. remuneration_status — "defined" / "unclear" / "not_defined".
        6. reporting_status — "defined" / "not_defined".
        7. subagency_status — "defined" / "not_defined".
        8. exclusivity_status — "defined" / "not_defined".
        9. tail_commission_status — "defined" / "not_defined".

        Если данные отсутствуют:
        - текстовое поле = "Данные не определены"
        - статусное поле = "not_defined"
        </task>

        <rules>
        - Используй только текст договора.
        - agency_model: "principal_name_model" — если прямо указано "от имени принципала";
          "own_name_model" — если прямо указано "от своего имени";
          "mixed_or_unclear" — если формулировка неоднозначна или смешанная;
          "not_defined" — если не указано.
        - Верни только JSON.
        </rules>
      fields:
        - name: "principal"
          type: "string"
          presentation: "fact"
          label: "Принципал"
          description: "Принципал по агентскому договору."
          required: true
          display_in_grid: true
          display_priority: 1
        - name: "agent"
          type: "string"
          presentation: "fact"
          label: "Агент"
          description: "Агент по агентскому договору."
          required: true
          display_in_grid: true
          display_priority: 2
        - name: "agency_model"
          type: "string"
          presentation: "signal"
          allowed_values: ["principal_name_model", "own_name_model", "mixed_or_unclear", "not_defined"]
          description: "Модель агентирования."
          required: true
        - name: "actions_scope"
          type: "string"
          presentation: "fact"
          label: "Предмет действий"
          description: "Сфера действий агента."
          required: true
          display_in_grid: true
          display_priority: 3
        - name: "remuneration_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "unclear", "not_defined"]
          description: "Статус вознаграждения."
          required: false
        - name: "reporting_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Наличие отчётности."
          required: false
        - name: "subagency_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Наличие субагентства."
          required: false
        - name: "exclusivity_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Наличие exclusivity."
          required: false
        - name: "tail_commission_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Наличие tail commission."
          required: false
      store_payload: true

  # ──────────────────────────────────────────────────────────────────────────
  # CHECK 2: Модель агентирования и доверенность
  # ──────────────────────────────────────────────────────────────────────────
  - id: agency_model_and_authority_check
    name: "Модель агентирования и доверенность"
    description: >
      Проверяет выбранную модель действий агента (от имени принципала или
      от своего имени), юридические последствия и наличие доверенности
      при модели «от имени принципала».
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "от имени принципала"
        - "от своего имени"
        - "за счет принципала"
        - "права и обязанности возникают у принципала"
        - "права и обязанности возникают у агента"
        - "доверенность"
        - "полномочия агента"
        - "применяются нормы о договоре поручения"
        - "применяются нормы о договоре комиссии"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)от\\s+имени\\s+принципала"
        - "(?i)от\\s+своего\\s+имени"
        - "(?i)доверенност(ь|и|ью)"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется агентский договор по Главе 52 ГК РФ.
        Проверяется только один вопрос: модель действий агента и доверенность.

        Нормативный ориентир:
        - ст. 1005 ГК РФ — модель агентирования
        - ст. 1011 ГК РФ — субсидиарное применение
        - ст. 185 ГК РФ — доверенность

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора.
        - Не оценивай серьёзность риска.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Модель агентирования (от имени принципала / от своего имени).
        2. Ясность модели.
        3. Субсидиарный режим (поручение / комиссия).
        4. Наличие доверенности (при модели «от имени принципала»).

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Если условие не указано прямо — возвращай "not_defined".
        3. Если текстового значения нет — возвращай строго "Данные не определены".
        4. Не используй "None", "null", "not_defined", "not_defined" или пустые строки.
        5. В evidence включай только текст договора.
        6. Верни только один JSON-объект.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1:
        Фрагмент:
        "Агент действует от имени Принципала на основании доверенности.
        К отношениям сторон применяются нормы о договоре поручения."

        Ответ:
        {
          "agency_model": "principal_name_model",
          "model_clarity": "defined",
          "subsidiary_regime": "mandate",
          "poa_status": "defined"
        }

        Пример 2:
        Фрагмент:
        "Агент обязуется совершать действия в интересах Принципала."

        Ответ:
        {
          "agency_model": "not_defined",
          "model_clarity": "not_defined",
          "subsidiary_regime": "not_defined",
          "poa_status": "not_defined"
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату о модели действия.
        2. Найди прямую цитату о субсидиарном режиме.
        3. Найди прямую цитату о доверенности.
        4. Если прямой цитаты нет — верни "not_defined".

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "agency_model": "<principal_name_model / own_name_model / mixed_or_unclear / not_defined>",
          "model_clarity": "<defined / not_defined>",
          "subsidiary_regime": "<mandate / commission / mixed / not_defined>",
          "poa_status": "<defined / not_defined>"
        }
      context_k: 5
      temperature: 0.0
      max_tokens: 360

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "от имени принципала от своего имени за счёт принципала права и обязанности доверенность полномочия агента применяются нормы о договоре поручения комиссии субсидиарное применение ст. 1011"
      retrieval_profile: "scope_of_work_check"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - definitions
        - obligations
      negative_keywords:
        - "означает"
        - "в целях настоящего"
        - "вознаграждение"
        - "отчёт"
        - "субагент"
        - "эксклюзивность"
        - "расторжение"
      position_bias:
        preferred_range: [0.0, 0.40]
        boost: 0.18
        scope: segment
      context_k: 5
      max_chunks: 8
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
        - "invoice"
      preferred_clause_functions:
        - "definitions"
        - "obligations"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 580

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 600
      compact_output: false

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста агентского договора сведения
        о модели агентирования, субсидиарном режиме и доверенности.
        Не анализируй вознаграждение, отчётность или прекращение.
        </role>

        <context>
        {context}
        </context>

        <task>
        1. agency_model — "principal_name_model" / "own_name_model" / "mixed_or_unclear" / "not_defined".
        2. model_clarity — "defined" / "not_defined".
        3. subsidiary_regime — "mandate" / "commission" / "mixed" / "not_defined".
        4. poa_status — "defined" / "not_defined".
        </task>

        <rules>
        - Используй только текст договора.
        - poa_status = "defined" только если доверенность прямо упомянута.
        - subsidiary_regime: "mandate" — если прямо указаны нормы поручения;
          "commission" — если прямо указаны нормы комиссии;
          "mixed" — если указаны обе;
          "not_defined" — если не указано.
        - Верни только JSON.
        </rules>
      fields:
        - name: "agency_model"
          type: "string"
          presentation: "signal"
          allowed_values: ["principal_name_model", "own_name_model", "mixed_or_unclear", "not_defined"]
          description: "Модель агентирования."
          required: true
        - name: "model_clarity"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Ясность модели."
          required: true
        - name: "subsidiary_regime"
          type: "string"
          presentation: "signal"
          allowed_values: ["mandate", "commission", "mixed", "not_defined"]
          description: "Субсидиарный режим (поручение/комиссия)."
          required: false
        - name: "poa_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Наличие доверенности."
          required: false
      store_payload: true

  # ──────────────────────────────────────────────────────────────────────────
  # CHECK 3: Вознаграждение, триггеры оплаты и tail commission
  # ──────────────────────────────────────────────────────────────────────────
  - id: remuneration_and_payment_trigger_check
    name: "Вознаграждение агента, триггеры оплаты и tail commission"
    description: >
      Проверяет размер/формулу вознаграждения, момент возникновения права
      на оплату и условия постконтрактного вознаграждения (tail commission).
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "агентское вознаграждение"
        - "размер вознаграждения"
        - "процент от сделок"
        - "момент возникновения права на вознаграждение"
        - "постконтрактное вознаграждение"
        - "tail commission"
        - "заключение сделки"
        - "поступление оплаты"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)агентск(ое|ого)\\s+вознаграждени"
        - "(?i)право\\s+на\\s+вознаграждение\\s+возникает"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется агентский договор по Главе 52 ГК РФ.
        Проверяется только один вопрос: вознаграждение, триггеры оплаты
        и tail commission.

        Нормативный ориентир:
        - ст. 1006 ГК РФ — агентское вознаграждение

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора.
        - Не оценивай серьёзность риска.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Определено ли вознаграждение (размер, формула).
        2. Триггер оплаты (заключение сделки / поступление оплаты / иное).
        3. Наличие tail commission (постконтрактное вознаграждение).

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Если условие не указано прямо — возвращай "not_defined".
        3. Если текстового значения нет — возвращай строго "Данные не определены".
