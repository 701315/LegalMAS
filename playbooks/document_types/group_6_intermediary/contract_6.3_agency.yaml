  - id: anti_requalification_and_kpi_check
    name: "Анти-переквалификация в трудовой договор и KPI"
    description: >
      Проверяет наличие защитных оговорок (safeguards) против переквалификации
      агентского договора в трудовой (ст. 19.1 ТК РФ, ст. 15, 56 ТК РФ), отсутствие
      токсичных трудовых признаков (подчинение ПВТР, график, рабочее место, фикс без результата)
      и формулировку коммерческих KPI/планов продаж.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "не являются трудовыми отношениями"
        - "не регулируются трудовым законодательством"
        - "действует самостоятельно и на свой риск"
        - "самостоятельно организует свою деятельность"
        - "свободный график"
        - "KPI"
        - "план продаж"
        - "целевые показатели"
        - "минимальный объем"
        - "минимальный объём"
        - "правила внутреннего трудового распорядка"
        - "ПВТР"
        - "рабочее место"
        - "режим рабочего времени"
        - "должностная инструкция"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)(не\\s+явля(ются|ется)\\s+трудов(ыми|ым)|трудов(ым|ого)\\s+законодательств)"
        - "(?i)самостоятельн.{0,20}(риск|организует|деятельност)"
        - "(?i)(KPI|КПЭ|план\\s+продаж|целев(ые|ых)\\s+показател)"
        - "(?i)(ПВТР|трудов(ого|ому)\\s+распорядк|рабоч(ее|его)\\s+мест|должностн(ая|ой)\\s+инструкци)"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе и трудовому комплаенсу.
        Анализируется агентский договор по Главе 52 ГК РФ.
        Проверяется один вопрос: риск переквалификации агентского договора
        в трудовой (ст. 19.1 ТК РФ) и характер KPI / целевых показателей.

        Нормативный ориентир:
        - ст. 19.1 ТК РФ — признание гражданско-правовых отношений трудовыми
          (неустранимые сомнения толкуются в пользу трудовых отношений).
        - ст. 15, 56 ТК РФ — ключевые признаки трудовых отношений: личный труд
          по должности/профессии, подчинение правилам внутреннего трудового распорядка (ПВТР),
          установление графика работы, обеспечение работодателем рабочего места/оборудования,
          периодическая оплата за процесс труда независимо от коммерческого результата.
        - Постановление Пленума Верховного Суда РФ № 15 от 29.05.2018 — суды оценивают
          фактические отношения, а не наименование договора.
        - Коммерческие KPI (план продаж, процент от сделок, объём выручки) — подтверждают
          гражданско-правовую природу договора. Трудовые KPI (соблюдение графика, отработка часов) —
          прямой маркер трудовых отношений (red flag ⚠️).

        Важно:
        - Твоя задача — установить, что прямо есть в тексте договора.
        - Не оценивай гипотетические риски вне текста.
        - При обнаружении прямых признаков трудовых отношений (подчинение ПВТР, график с 9 до 18,
          выделение рабочего места, отпуск, должностная инструкция) — зафиксируй их в поле labor_risk_markers с пометкой ⚠️.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Наличие защитных анти-трудовых оговорок (safeguards: самостоятельность, свой риск, не трудовой).
        2. Наличие токсичных трудовых маркеров (ПВТР, график, рабочее место, соцгарантии).
        3. Наличие коммерческих KPI / плана продаж и их связь с оплатой.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Если целевые показатели определяются в приложении / плане / регламенте — это defined-факт.
        4. Если данных в тексте прямо нет — статусное поле = "not_defined",
           текстовое поле = "Данные не определены".
        5. Не используй "None", "null", пустые строки или значения вне allowed_values.
        6. В evidence включай только текст договора.
        7. Верни РОВНО один валидный JSON-объект со всеми 7 ключами, пригодный для парсинга
           через json.loads без предварительной обработки. Без markdown, без ```json,
           без комментариев, без текста до или после. Начни ответ сразу с { и закончи }.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — безопасный гражданско-правовой договор с коммерческими KPI:
        Фрагмент:
        "Отношения сторон не являются трудовыми. Агент действует самостоятельно и на свой риск,
        самостоятельно определяет режим своего рабочего времени. Вознаграждение Агента привязано
        к выполнению ежемесячного плана продаж (KPI — привлечение не менее 5 клиентов в месяц)."

        Ответ:
        {
          "anti_labor_clause_status": "defined",
          "independence_language_status": "defined",
          "kpi_present": "defined",
          "kpi_linked_to_remuneration": "defined",
          "anti_labor_safeguards": "Указано, что отношения не трудовые; Агент действует самостоятельно, на свой риск и со свободным графиком",
          "labor_risk_markers": "Не обнаружены",
          "anti_requalification_summary": "Защитные оговорки присутствуют; коммерческий KPI по продажам привязан к оплате; трудовых маркеров нет"
        }

        Пример 2 — высокий риск переквалификации (токсичные трудовые признаки):
        Фрагмент:
        "Агент обязан соблюдать правила внутреннего трудового распорядка Принципала, находиться на
        рабочем месте в офисе Принципала с 09:00 до 18:00 и выполнять распоряжения начальника отдела продаж.
        Агенту выплачивается ежемесячно фиксированная сумма 60 000 рублей."

        Ответ:
        {
          "anti_labor_clause_status": "not_defined",
          "independence_language_status": "not_defined",
          "kpi_present": "not_defined",
          "kpi_linked_to_remuneration": "not_defined",
          "anti_labor_safeguards": "Данные не определены",
          "labor_risk_markers": "⚠️ Прямые признаки трудовых отношений: соблюдение ПВТР, фиксированный график 09:00–18:00, рабочее место в офисе, подчинение руководителю, фиксированная ежемесячная оплата",
          "anti_requalification_summary": "⚠️ Высокий риск переквалификации по ст. 19.1 ТК РФ: установлены ПВТР, рабочий график, рабочее место и фиксированная оплата"
        }

        Пример 3 — нейтральный договор без оговорок и без токсичных условий:
        Фрагмент:
        "Агент обязуется совершать юридические действия по поиску покупателей оборудования."

        Ответ:
        {
          "anti_labor_clause_status": "not_defined",
          "independence_language_status": "not_defined",
          "kpi_present": "not_defined",
          "kpi_linked_to_remuneration": "not_defined",
          "anti_labor_safeguards": "Данные не определены",
          "labor_risk_markers": "Не обнаружены",
          "anti_requalification_summary": "Защитные оговорки отсутствуют; токсичных трудовых маркеров в тексте не выявлено"
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        Проверь, что все 7 ключей присутствуют в JSON:
        1. Найди цитаты о самостоятельности агента и отсутствии трудовых отношений.
        2. Проверь наличие токсичных терминов: ПВТР, график, рабочее место, должностная инструкция, отпуск.
        3. Найди цитаты о коммерческих KPI и их связи с вознаграждением.
        4. Убедись, что значения статусных полей — строго из allowed_values.
        5. Убедись, что anti_requalification_summary отражает реальный уровень риска.

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "anti_labor_clause_status": "<defined / partial / not_defined>",
          "independence_language_status": "<defined / not_defined>",
          "kpi_present": "<defined / not_defined>",
          "kpi_linked_to_remuneration": "<defined / not_defined>",
          "anti_labor_safeguards": "<краткий текст оговорок или 'Данные не определены'>",
          "labor_risk_markers": "<описание рисков или 'Не обнаружены'>",
          "anti_requalification_summary": "<сводный вывод одной фразой>"
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 550

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
