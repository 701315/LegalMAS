      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста агентского договора сведения
        о защитных анти-трудовых оговорках (ст. 19.1 ТК РФ), маркерах трудовых
        отношений и наличии коммерческих KPI / планов продаж.
        Не анализируй субагентство, эксклюзивность или прекращение договора.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие 7 полей (всего 7 ключей в JSON):

        1. anti_labor_clause_status — статус анти-трудовой оговорки:
           • "defined" — прямо указано, что договор не является трудовым;
           • "partial" — оговорка сформулирована размыто;
           • "not_defined" — прямая оговорка отсутствует.

        2. independence_language_status — самостоятельность агента:
           • "defined" — указано, что агент действует самостоятельно, на свой риск
             или со свободным графиком;
           • "not_defined" — условие о самостоятельности отсутствует.

        3. kpi_present — наличие KPI / целевых показателей:
           • "defined" — установлены планы продаж, минимальные объёмы или нормативы сделок;
           • "not_defined" — KPI не предусмотрены.

        4. kpi_linked_to_remuneration — связь KPI с вознаграждением:
           • "defined" — вознаграждение прямо привязано к достижению KPI;
           • "not_defined" — связь отсутствует или KPI не установлены.

        5. anti_labor_safeguards — фактический текст защитных формулировок
           (самостоятельность, свой риск, свободный график; до 200 символов).
           Если отсутствуют — «Данные не определены».

        6. labor_risk_markers — обнаруженные маркеры риска переквалификации в трудовой
           договор (ПВТР, фиксированные рабочие часы/график, предоставление рабочего места,
           должностные инструкции, регулярный фикс без привязки к сделке; до 250 символов).
           Если обнаружены — начни со знака ⚠️. Если маркеров нет — «Не обнаружены».

        7. anti_requalification_summary — сводный вывод одной фразой на русском
           для юриста (оценка риска переквалификации по ст. 19.1 ТК РФ и статус KPI).
        </task>

        <rules>
        - Используй только текст договора.
        - Признаки трудовых отношений (ст. 15, 56 ТК РФ): подчинение ПВТР, установление
          графика работы (например, «с 9:00 до 18:00»), рабочее место у Принципала,
          указание должности вместо конкретных поручений, фикс оплата за процесс.
          Их наличие обязательно фиксируй в labor_risk_markers.
        - Коммерческие KPI (план продаж, число клиентов) являются допустимыми в ГПД.
        - Отсылка к регламенту/плану в приложении = defined.
        - Верни РОВНО один валидный JSON-объект со всеми 7 ключами, пригодный для
          парсинга через json.loads без предварительной обработки. Без markdown,
          без ```json, без комментариев. Начни с { и закончи }.
        </rules>

        <cove>
        Перед ответом проверь, что все 7 ключей (7 полей) присутствуют в JSON,
        значения статусных полей — строго из allowed_values, и что
        anti_requalification_summary отражает реальный уровень риска.
        </cove>
      fields:
        - name: "anti_labor_clause_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "partial", "not_defined"]
          description: >
            Наличие прямой оговорки о том, что договор не является трудовым.
          required: true
        - name: "independence_language_status"
          type: "string"
          presentation: "signal"
