          display_priority: 3
        - name: "termination_summary"
          type: "string"
          presentation: "summary"
          label: "Прекращение и финальные расчёты"
          description: >
            Сводный вывод одной фразой: срок уведомления при отказе + завершение сделок + финальные расчёты.
          required: true
          display_in_grid: true
          display_priority: 1

  - id: liability_and_indemnity_check
    name: "Ответственность сторон и делькредере"
    description: >
      Проверяет условия об ответственности агента за исполнение сделок третьими лицами
      (ручательство делькредере по ст. 993 ГК РФ через ст. 1011 ГК РФ), наличие договорных
      неустоек за нарушение сроков отчётности/перечисления выручки (ст. 330 ГК РФ)
      и ограничений размера ответственности (ст. 15, 400 ГК РФ).
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "ответственность агента"
        - "ответственность принципала"
        - "неустойка"
        - "пени"
        - "штраф"
        - "возмещение убытков"
        - "ограничение ответственности"
        - "агент не отвечает за"
        - "делькредере"
        - "del credere"
        - "ручательство за исполнение сделки"
        - "ручательство за третье лицо"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)ответственност(ь|и)\\s+(агент|принципал)"
        - "(?i)делькредере|del\\s+credere"
        - "(?i)ручательств.{0,20}(треть|сделк|исполнен)"
        - "(?i)(неустойк|пен(я|и)|штраф).{0,20}(просрочк|нарушен)"
        - "(?i)ограничен.{0,15}ответственност"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется агентский договор по Главе 52 ГК РФ.
        Проверяется один вопрос: ответственность сторон, ручательство делькредере
        за третьих лиц, договорные неустойки и лимиты ответственности.

        Нормативный ориентир:
        - ст. 993 ГК РФ (применяется к агентским отношениям через ст. 1011 ГК РФ при действии
          от своего имени) — по умолчанию Агент НЕ отвечает перед Принципалом за неисполнение
          третьим лицом сделки, заключённой с ним за счёт принципала, КРОМЕ случаев, когда
          агент не проявил необходимой осмотрительности в выборе этого лица либо принял на себя
          ручательство за исполнение сделки (делькредере). За делькредере агенту полагается
          дополнительное вознаграждение (ст. 991 ГК РФ).
        - ст. 330, 394 ГК РФ — неустойка (пени за просрочку перечисления выручки принципалу,
          просрочку сдачи отчётов, просрочку выплаты агентского вознаграждения).
        - ст. 15, 393, 400 ГК РФ — возмещение убытков (реальный ущерб vs упущенная выгода),
          ограничение ответственности (cap, лимит суммой вознаграждения).

        Важно:
        - Твоя задача — установить, что прямо есть в тексте договора.
        - Не оценивай серьёзность риска.
        - Отсутствие ручательства делькредере — стандарт по закону (не дефект),
          но юристу важно зафиксировать, есть ли делькредере или отказ от ответственности.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Отвечает ли агент за неисполнение сделок привлечёнными клиентами/третьими лицами
           (принято ли ручательство делькредере / прямо исключена ответственность / полная ответственность).
        2. Наличие договорных неустоек (пени, штрафы за просрочку платежей, отчётов, нарушение эксклюзивности).
        3. Наличие ограничений размера ответственности (liability caps, исключение упущенной выгоды).
        4. Краткое извлечение формулировок об ответственности.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Если ответственность определяется отсылкой к закону («несут ответственность в соответствии
           с законодательством РФ») — статусное поле = "not_defined", фактовое = «По закону РФ».
        4. Если данных в тексте прямо нет — статусное поле = "not_defined",
           текстовое поле = "Данные не определены".
        5. Не используй "None", "null", пустые строки или значения вне allowed_values.
        6. В evidence включай только текст договора.
        7. Верни РОВНО один валидный JSON-объект со всеми 6 ключами, пригодный для парсинга
           через json.loads без предварительной обработки. Без markdown, без ```json,
           без комментариев, без текста до или после. Начни ответ сразу с { и закончи }.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — делькредере + неустойка + лимит:
        Фрагмент:
        "Агент принимает на себя ручательство за исполнение сделок покупателями (делькредере),
        за что получает дополнительное вознаграждение 2% от суммы сделки. За просрочку перечисления
        выручки Агент уплачивает пени 0,1% в день. Совокупная ответственность Агента по договору
        ограничена суммой выплаченного агентского вознаграждения."

        Ответ:
        {
          "agent_liability_for_third_parties": "del_credere",
          "liability_cap_status": "defined",
          "penalty_clause_status": "defined",
          "del_credere_and_third_party_details": "Принято ручательство делькредере с доплатой 2% от суммы сделки",
          "penalty_and_caps_details": "Пени 0,1% в день за просрочку перечисления выручки; лимит ответственности Агента ограничен суммой вознаграждения",
          "liability_summary": "Принято делькредере (+2%); пени 0,1%/день за выручку; ответственность Агента ограничена размером вознаграждения"
        }

        Пример 2 — законный дефолт (агент не отвечает за клиентов) + неустойка за отчёт:
        Фрагмент:
        "Агент не несёт ответственности за неисполнение третьими лицами обязательств по заключённым
        сделкам. За нарушение срока представления отчёта Агент уплачивает Принципалу штраф в размере
        5 000 рублей."

        Ответ:
        {
          "agent_liability_for_third_parties": "no_liability_default",
          "liability_cap_status": "not_defined",
          "penalty_clause_status": "defined",
          "del_credere_and_third_party_details": "Агент прямо не отвечает за неисполнение обязательств третьими лицами",
          "penalty_and_caps_details": "Штраф 5 000 рублей за просрочку представления отчёта; лимиты ответственности не установлены",
          "liability_summary": "Агент не отвечает за третьих лиц (без делькредере); штраф 5 000 руб. за просрочку отчёта; лимитов нет"
        }

        Пример 3 — данные отсутствуют (отсылка к закону):
        Фрагмент:
        "За неисполнение обязательств стороны несут ответственность в соответствии с действующим
        законодательством Российской Федерации."

        Ответ:
        {
          "agent_liability_for_third_parties": "not_defined",
          "liability_cap_status": "not_defined",
          "penalty_clause_status": "not_defined",
          "del_credere_and_third_party_details": "Данные не определены (ответственность по закону)",
          "penalty_and_caps_details": "Данные не определены (по закону РФ, договорные неустойки и лимиты отсутствуют)",
          "liability_summary": "Специальные договорные санкции, делькредере и лимиты ответственности отсутствуют (ответственность по закону)"
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        Проверь, что все 6 ключей присутствуют в JSON:
        1. Найди прямую цитату о делькредере или ответственности агента за исполнение третьими лицами.
        2. Найди условия о неустойках, штрафах или пенях (с указанием ставок и триггеров).
        3. Найди условия об ограничении ответственности (cap, исключение упущенной выгоды).
        4. Убедись, что значения статусных полей — строго из allowed_values.
        5. Убедись, что liability_summary отражает все аспекты одной ёмкой фразой.

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "agent_liability_for_third_parties": "<del_credere / full_guarantee / no_liability_default / not_defined>",
          "liability_cap_status": "<defined / not_defined>",
          "penalty_clause_status": "<defined / not_defined>",
          "del_credere_and_third_party_details": "<краткий текст или 'Данные не определены'>",
          "penalty_and_caps_details": "<краткий текст или 'Данные не определены'>",
          "liability_summary": "<сводный вывод одной фразой>"
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 550

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "ответственность агента принципала неустойка пени штраф возмещение убытков ограничение ответственности агент не отвечает за делькредере del credere ручательство за исполнение сделки третьими лицами"
      retrieval_profile: "indemnification_check"
      preferred_unit_types:
        - liability_provision
        - obligation
        - general_provision
        - indemnification
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - remedies
        - limitations
      negative_keywords:
        - "означает"
        - "в целях настоящего"
        - "субагент"
        - "эксклюзивность"
      position_bias:
        preferred_range: [0.50, 0.95]
        boost: 0.12
        scope: segment
      context_k: 6
      max_chunks: 8
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
        - "invoice"
      preferred_clause_functions:
        - "remedies"
        - "limitations"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 35
      max_snippet_length: 600

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 800
      compact_output: false
      store_payload: true
      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста агентского договора сведения
        об ответственности сторон, ручательстве делькредере за третьих лиц (ст. 993, 1011 ГК РФ),
        договорных неустойках (пени, штрафы) и ограничениях ответственности (caps).
        Не анализируй размер базового вознаграждения, обычный порядок отчётности или субагентство.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие 6 полей (всего 6 ключей в JSON):

        1. agent_liability_for_third_parties — ответственность агента за действия и оплату третьих лиц:
           • "del_credere" — прямо предусмотрено ручательство делькредере (с доплатой или без);
           • "full_guarantee" — агент несёт безусловную солидарную/субсидиарную ответственность
             за третьих лиц без термина «делькредере»;
           • "no_liability_default" — прямо указано, что агент не отвечает за действия третьих лиц;
           • "not_defined" — условие не оговорено (действует законный дефолт ст. 993 ГК РФ).

        2. liability_cap_status — ограничение размера ответственности:
           • "defined" — установлены предельные суммы ответственности (cap, лимит суммой вознаграждения,
             исключение упущенной выгоды);
           • "not_defined" — ограничения ответственности не установлены.

        3. penalty_clause_status — наличие договорных неустоек:
           • "defined" — установлены пени или штрафы (за просрочку отчёта, перечисления выручки, оплату);
           • "not_defined" — договорные неустойки отсутствуют.

        4. del_credere_and_third_party_details — фактический текст условий о делькредере
           и ответственности за неисполнение сделок третьими лицами (до 200 символов).
           Если не урегулировано — «Данные не определены».

        5. penalty_and_caps_details — фактический текст условий о неустойках (ставки, базы)
           и лимитах ответственности (до 250 символов).
           Если не урегулировано — «Данные не определены».

        6. liability_summary — сводный вывод одной фразой на русском для юриста,
           объединяющий делькредере, неустойки и лимиты ответственности.
        </task>

        <rules>
        - Используй только текст договора.
        - По ст. 993 ГК РФ агент не отвечает за третьих лиц, если не принял делькредере.
        - Отсылка к закону («ответственность по ГК РФ») = status-поля "not_defined".
        - Верни РОВНО один валидный JSON-объект со всеми 6 ключами, пригодный для
          парсинга через json.loads без предварительной обработки. Без markdown,
          без ```json, без комментариев. Начни с { и закончи }.
        </rules>

        <cove>
        Перед ответом проверь, что все 6 ключей (6 полей) присутствуют в JSON,
        значения статусных полей — строго из allowed_values, и что
        liability_summary согласован с остальными полями.
        </cove>
      fields:
        - name: "agent_liability_for_third_parties"
          type: "string"
          presentation: "signal"
          allowed_values: ["del_credere", "full_guarantee", "no_liability_default", "not_defined"]
          description: >
            Ответственность агента за исполнение сделок третьими лицами (ст. 993, 1011 ГК РФ):
            делькредере (del_credere), полная гарантия (full_guarantee), прямое исключение
            ответственности (no_liability_default) или не урегулировано (not_defined).
          required: true
        - name: "liability_cap_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: >
            Наличие ограничения ответственности (предельный лимит / cap, исключение упущенной выгоды).
          required: false
        - name: "penalty_clause_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: >
            Наличие договорных неустоек (пени, штрафы за нарушение обязанностей сторонами).
          required: false
        - name: "del_credere_and_third_party_details"
          type: "string"
          presentation: "fact"
          label: "Делькредере и третьи лица"
          description: >
            Фактическое условие договора о ручательстве за третьих лиц (делькредере) и доплате за него.
          required: true
          display_in_grid: true
          display_priority: 2
        - name: "penalty_and_caps_details"
          type: "string"
          presentation: "fact"
          label: "Неустойки и лимиты ответственности"
          description: >
            Фактический размер и ставки договорных неустоек (пени/штрафы) и пределы ответственности.
          required: true
          display_in_grid: true
          display_priority: 3
        - name: "liability_summary"
          type: "string"
          presentation: "summary"
          label: "Ответственность и делькредере"
          description: >
            Сводный вывод одной фразой: режим делькредере + договорные неустойки + лимиты ответственности.
          required: true
          display_in_grid: true
          display_priority: 1

  - id: title_transfer_and_bankruptcy_risk_check
    name: "Переход права собственности и риск банкротства агента"
    description: >
      Проверяет момент и условия перехода права собственности на товары и имущество,
      приобретённые агентом за счёт принципала (ст. 996, 1011 ГК РФ), а также наличие
      договорных механизмов защиты имущества принципала от включения в конкурсную массу
      агента при его банкротстве (ст. 131 ФЗ «О несостоятельности (банкротстве)»).
      Критично при модели «от своего имени».
    triggers:
      any:
        - acts_in_own_name
        - principal_money_flow_sensitive
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "переход права собственности"
        - "право собственности переходит"
        - "собственностью принципала"
        - "собственностью комитента"
        - "статья 996"
        - "ст. 996"
        - "конкурсная масса"
        - "обособленное имущество"
        - "на балансе агента"
        - "на балансе принципала"
        - "риск утраты имущества"
        - "сохранение права собственности"
        - "титульное владение"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)прав.{0,5}собственност.{0,20}(переход|возникает|сохраня)"
        - "(?i)собственност.{0,15}(принципал|комитент)"
        - "(?i)(конкурсн.{0,10}масс|банкротств.{0,15}агент)"
        - "(?i)обособленн.{0,15}имуществ"
        - "(?i)ст\\.?\\s*996"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе и банкротному праву.
        Анализируется агентский договор по Главе 52 ГК РФ.
        Проверяется один вопрос: момент перехода права собственности на товары
        и имущество, приобретённые агентом за счёт принципала, и защищённость
        этого имущества от банкротства агента.

        Нормативный ориентир:
        - ст. 996 п. 1 ГК РФ (применяется через ст. 1011 ГК РФ при модели «от своего
          имени») — имущество, поступившее к комиссионеру (агенту) от комитента
          (принципала) или приобретённое комиссионером за счёт комитента, является
          собственностью комитента. Это ДИСПОЗИТИВНАЯ норма — договором может быть
          установлено иное.
        - ст. 223, 491 ГК РФ — момент перехода права собственности (по умолчанию —
          при передаче, но договором может быть установлен иной момент: оплата,
          доставка, принятие отчёта).
        - ст. 131 ФЗ № 127-ФЗ «О несостоятельности (банкротстве)» — в конкурсную
          массу должника включается всё имущество, принадлежащее ему на праве
          собственности. Если право собственности на товары формально перешло к агенту
          (по договору) — товары попадают в конкурсную массу при банкротстве агента.
        - Практика арбитражных судов: при наличии явной оговорки о сохранении
          собственности за принципалом и фактическом обособлении имущества суды
          исключают его из конкурсной массы агента. При молчании договора —
          применяется ст. 996 ГК РФ (собственность принципала), но доказывание сложнее.

        Важно:
        - Твоя задача — установить, что прямо есть в тексте договора.
        - Не оценивай серьёзность риска.
        - Если договор прямо повторяет ст. 996 ГК РФ («имущество является собственностью
          принципала») — это explicit protection.
        - Если договор устанавливает переход права собственности к агенту до перепродажи —
          это red flag ⚠️ (банкротный риск).

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Момент и условия перехода права собственности на товары/имущество,
           приобретённые агентом за счёт принципала.
        2. Наличие оговорки о сохранении собственности за принципалом (ст. 996 ГК РФ)
           или, наоборот, о переходе собственности к агенту.
        3. Наличие механизмов защиты от банкротства агента (обособление, маркировка,
           запрет залога).

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Если момент перехода определяется через спецификацию / приложение —
           это defined-факт.
        4. Если данных в тексте прямо нет — статусное поле = "not_defined",
           текстовое поле = "Данные не определены".
        5. Не используй "None", "null", пустые строки или значения вне allowed_values.
        6. В evidence включай только текст договора.
        7. Верни РОВНО один валидный JSON-объект со всеми 5 ключами, пригодный для парсинга
           через json.loads без предварительной обработки. Без markdown, без ```json,
           без комментариев, без текста до или после. Начни ответ сразу с { и закончи }.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — явная защита по ст. 996 ГК РФ:
        Фрагмент:
        "Все товары, приобретённые Агентом за счёт Принципала, а также денежные средства,
        полученные от реализации товаров Принципала, являются собственностью Принципала
        с момента их поступления к Агенту (ст. 996 ГК РФ). Агент не вправе передавать
        указанное имущество в залог или включать в обеспечение собственных обязательств.
        Имущество Принципала учитывается на обособленном балансе Агента."

        Ответ:
        {
          "title_transfer_regime": "by_operation_of_law_996",
          "bankruptcy_protection_clause": "explicit_segregation",
          "title_transfer_details": "Собственность Принципала с момента поступления к Агенту (ст. 996 ГК РФ); залог запрещён",
          "bankruptcy_risk_details": "Обособленный баланс; запрет залога имущества Принципала; прямая ссылка на ст. 996 ГК РФ",
          "title_transfer_summary": "Собственность Принципала по ст. 996 ГК РФ; обособление на балансе; залог запрещён — банкротный риск минимален"
        }

        Пример 2 — переход собственности к агенту (red flag):
        Фрагмент:
        "Право собственности на товары переходит к Агенту в момент их получения от
        поставщика. Агент реализует товары от своего имени и за свой счёт, выплачивая
        Принципалу разницу между ценой приобретения и ценой реализации."

        Ответ:
        {
          "title_transfer_regime": "retained_by_agent_until_resale",
          "bankruptcy_protection_clause": "not_defined",
          "title_transfer_details": "⚠️ Право собственности переходит к Агенту при получении от поставщика (до перепродажи)",
          "bankruptcy_risk_details": "⚠️ Механизмы защиты от банкротства Агента отсутствуют; товары на балансе Агента могут попасть в конкурсную массу",
          "title_transfer_summary": "⚠️ Собственность переходит к Агенту до перепродажи; защита от банкротства не предусмотрена — высокий риск утраты товаров"
        }

        Пример 3 — молчание договора:
        Фрагмент:
        "Агент обязуется от своего имени, но за счёт Принципала заключать сделки
        по закупке оборудования."

        Ответ:
        {
          "title_transfer_regime": "not_defined",
          "bankruptcy_protection_clause": "not_defined",
          "title_transfer_details": "Данные не определены (применяется дефолт ст. 996 ГК РФ — собственность Принципала)",
          "bankruptcy_risk_details": "Данные не определены (договорные механизмы обособления отсутствуют)",
          "title_transfer_summary": "Момент перехода собственности не урегулирован (дефолт ст. 996 ГК РФ); договорные механизмы защиты от банкротства отсутствуют"
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        Проверь, что все 5 ключей присутствуют в JSON:
