        - "вознаграждение начисляется при"
        - "заключение сделки"
        - "поступление оплаты"
      keyword_mode: "any"

  - id: "post_termination_remuneration"
    name: "Постконтрактное вознаграждение (tail commission)"
    description: "Право на вознаграждение по сделкам после окончания договора"
    legal_base: "ст. 1006, 1010 ГК РФ"
    severity: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers:
      any: ["tail_commission_terms"]
    rules:
      keywords:
        - "tail commission"
        - "постконтрактное вознаграждение"
        - "сделки, заключенные в период действия"
      keyword_mode: "any"

  - id: "anti_requalification_measures"
    name: "Анти-переквалификация в трудовой договор"
    description: "Положения, исключающие трудовые признаки"
    legal_base: "ТК РФ, судебная практика"
    severity: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
      keywords:
        - "не являются трудовыми отношениями"
        - "агент действует самостоятельно и на свой риск"
        - "свободный график"
      keyword_mode: "any"
      negative_keywords:
        - "рабочий день"
        - "внутренний трудовой распорядок"
        - "ежегодный оплачиваемый отпуск"

  - id: "applicable_law_and_model_clarification"
    name: "Субсидиарное применение норм о поручении или комиссии"
    description: "Оговорка о применении главы 49 или 51 ГК РФ"
    legal_base: "ст. 1011 ГК РФ"
    severity: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
      keywords:
        - "применяются нормы о договоре поручения"
        - "применяются нормы о договоре комиссии"
        - "субсидиарное применение"
      keyword_mode: "any"

  - id: "ip_and_brand_use_controls"
    name: "Использование бренда, ИС и маркетинговых материалов"
    description: "Правила использования ТЗ, брендбука, маркетинговых материалов"
    legal_base: "ГК РФ (ИС), свобода договора"
    severity: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers:
      any: ["marketing_promotion_scope"]
    rules:
      keywords:
        - "товарный знак"
        - "брендбук"
        - "маркетинговые материалы"
        - "использование бренда"
      keyword_mode: "any"

  - id: "termination_and_post_contract_settlement"
    name: "Прекращение договора и постконтрактные расчеты"
    description: "Порядок расторжения, завершение поручений, окончательные расчеты"
    legal_base: "ст. 1010 ГК РФ"
    severity: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
      keywords:
        - "расторжение договора"
        - "прекращение договора"
        - "завершение начатых поручений"
        - "окончательный расчет"
      keyword_mode: "any"

  - id: "power_of_attorney_clause"
    name: "Доверенность (для модели «от имени принципала»)"
    description: "При модели «от имени принципала» агент должен действовать на основании доверенности"
    legal_base: "ст. 185, 1005 ГК РФ"
    severity: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers:
      any: ["acts_in_principal_name"]
    rules:
      keywords:
        - "доверенность"
        - "на основании доверенности"
        - "полномочия агента"
        - "нотариальная доверенность"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)доверенност(ь|и|ью)"

  - id: "force_majeure_agency"
    name: "Форс-мажор"
    description: "Обстоятельства непреодолимой силы"
    legal_base: "ст. 401 ГК РФ"
    severity: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
      keywords:
        - "форс-мажор"
        - "обстоятельства непреодолимой силы"
        - "непредвиденные обстоятельства"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)форс[- ]?мажор"

  - id: "confidentiality_clause_agency"
    name: "Конфиденциальность"
    description: "Защита коммерческой информации сторон"
    legal_base: "ст. 421 ГК РФ, ФЗ-98"
    severity: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
      keywords:
        - "конфиденциальность"
        - "неразглашение"
        - "коммерческая тайна"
        - "NDA"
      keyword_mode: "any"

  - id: "personal_data_agency"
    name: "Персональные данные (при работе с клиентами)"
    description: "Условия обработки ПД при привлечении клиентов"
    legal_base: "ФЗ-152"
    severity: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers:
      any: ["client_data_handling"]
    rules:
      keywords:
        - "персональные данные"
        - "ФЗ-152"
        - "оператор персональных данных"
        - "обработчик"
        - "согласие на обработку"
      keyword_mode: "any"

  - id: "assignment_agency"
    name: "Уступка прав / перемена лиц"
    description: "Ограничения на уступку прав по агентскому договору"
    legal_base: "ст. 388, 391 ГК РФ"
    severity: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "rules"
    triggers: {}
    rules:
      keywords:
        - "уступка прав"
        - "перевод долга"
        - "без согласия"
        - "замена агента"
      keyword_mode: "any"

# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 7: DD_REQUEST_TEMPLATES
#  Читается: DDRequestTemplateLoader
#  Ключи = check_id из checks_v8 и doc_type_checks выше.
#  DDRequestTemplateLoader.render() матчит по exact или prefix.
# ════════════════════════════════════════════════════════════════════════════

dd_request_templates:

  agency_subject_extraction:
    text: >
      Просим предоставить по {doc_names}: базовую структуру агентского договора —
      принципала, агента, предмет действий, модель агентирования,
      вознаграждение, порядок отчетности, exclusivity, субагентство и post-termination условия.
    addressee: "Принципал / Агент"

  agency_model_check:
    text: >
      Просим уточнить по {doc_names}: действует ли агент от имени принципала
      или от своего имени, какие права и обязанности возникают у сторон.
    addressee: "Юридический советник"

  agency_model_specification:
    text: >
      Просим прямо закрепить в {doc_names} выбранную модель агентирования.
    addressee: "Юридический советник"

  agency_model_unclear:
    text: >
      В {doc_names} не выявлена ясность относительно модели агентирования.
      Просим срочно уточнить.
    addressee: "Юридический советник"

  subject_actions_scope:
    text: >
      Просим уточнить в {doc_names}: действия агента, сферу, территорию.
    addressee: "Принципал"

  remuneration_and_payment_trigger_check:
    text: >
      Просим предоставить по {doc_names}: структуру вознаграждения, триггеры оплаты, tail commission.
    addressee: "Принципал / Агент"

  agency_remuneration:
    text: >
      Просим уточнить в {doc_names}: размер, формулу и порядок расчета вознаграждения.
    addressee: "Обе стороны"

  gratuitous_agency_red_flag:
    text: >
      В {doc_names} выявлен риск безвозмездности. Просим урегулировать вознаграждение.
    addressee: "Юридический советник"

  clear_payment_triggers:
    text: >
      Просим уточнить по {doc_names}: триггер выплаты вознаграждения.
    addressee: "Юридический советник / Принципал"

  post_termination_remuneration:
    text: >
      Просим уточнить в {doc_names}: tail commission.
    addressee: "Принципал / Юридический советник"

  reporting_and_settlement_check:
    text: >
      Просим предоставить по {doc_names}: порядок отчетов, срок возражений, связь с оплатой.
    addressee: "Агент / Принципал"

  report_approval_and_dispute_resolution:
    text: >
      Просим уточнить в {doc_names}: порядок утверждения отчета, возражения.
    addressee: "Юридический советник"

  funds_and_assets_control_check:
    text: >
      По {doc_names} просим: порядок учета средств, сроки перечисления, спец. счёт.
    addressee: "Агент / Принципал"

  funds_and_assets_control:
    text: >
      Просим уточнить в {doc_names}: учет и перечисление средств принципала.
    addressee: "Агент"

  money_flow_control_missing:
    text: >
      В {doc_names} — риск отсутствия контроля денежных потоков. Просим урегулировать.
    addressee: "Юридический советник / Агент"

  exclusivity_and_non_compete_check:
    text: >
      Просим уточнить по {doc_names}: exclusivity, территорию, non-compete.
    addressee: "Принципал / Агент"

  exclusivity_and_non_competition:
    text: >
      Просим уточнить в {doc_names}: exclusivity, конкуренты, последствия нарушения.
    addressee: "Юридический советник"

  subagency_check:
    text: >
      По {doc_names} просим: режим субагентства, согласие, ответственность.
    addressee: "Агент / Юридический советник"

  subagency_control:
    text: >
      Просим уточнить в {doc_names}: субагентство.
    addressee: "Юридический советник"

  subagency_without_control:
    text: >
      В {doc_names} — субагентство без контроля. Просим доработать.
    addressee: "Юридический советник"

  anti_requalification_check:
    text: >
      Просим предоставить по {doc_names}: anti-labor safeguards.
    addressee: "Юридический советник / HR / Налоговый консультант"

  anti_requalification_measures:
    text: >
      Просим включить в {doc_names}: anti-labor safeguards.
    addressee: "Юридический советник"

  labor_requalification_red_flag:
    text: >
      В {doc_names} — признаки переквалификации в трудовой. Просим ревизию.
    addressee: "Юридический советник / HR"

  applicable_law_and_model_clarification:
    text: >
      Просим уточнить в {doc_names}: субсидиарный режим.
    addressee: "Юридический советник"

  ip_and_brand_use_controls:
    text: >
      По {doc_names} просим: правила использования бренда, ТЗ, маркетинговых материалов.
    addressee: "Принципал / IP-юрист"

  termination_and_post_contract_settlement:
    text: >
      Просим уточнить по {doc_names}: прекращение, final settlement, клиентская база.
    addressee: "Обе стороны"

  antitrust_exclusive_agency:
    text: >
      ВНИМАНИЕ: {doc_names} содержит эксклюзивные условия.
      Просим получить антимонопольное заключение (ФЗ-135) о допустимости
      вертикальных ограничений, особенно при доле рынка > 35%.
    addressee: "Юридический советник / Антимонопольный консультант"

  currency_control_cross_border_agency:
    text: >
      По {doc_names} — трансграничное агентирование. Просим обеспечить:
      (а) валютный контроль; (б) удержание налога у источника;
      (в) сертификат резидентства (для СОИДН).
    addressee: "Финансовый отдел / Налоговый консультант"

  power_of_attorney_absence:
    text: >
      По {doc_names} агент действует от имени принципала.
      Просим предоставить доверенность с надлежащими полномочиями
      или включить условие о выдаче доверенности.
    addressee: "Принципал"

  client_database_ownership:
    text: >
      Просим согласовать для {doc_names}: кому принадлежит клиентская база
      (принципалу/агенту/совместно), порядок доступа и передачи при расторжении.
    addressee: "Обе стороны"

  expense_reimbursement_check:
    text: >
      Просим согласовать для {doc_names}: порядок возмещения расходов агента,
      перечень возмещаемых расходов, бюджет, требования к документации.
    addressee: "Обе стороны"

  liability_and_indemnity_check:
    text: >
      Просим согласовать для {doc_names}: распределение ответственности,
      ограничение ответственности, делькредере, индемнити.
    addressee: "Юридический советник"

  insurance_requirements_agency:
    text: >
      Просим согласовать для {doc_names} требования к страхованию
      ответственности агента.
    addressee: "Обе стороны"

  dispute_resolution_agency:
    text: >
      Просим согласовать для {doc_names}: порядок разрешения споров,
      претензионный порядок, подсудность.
    addressee: "Юридический советник"

  kpi_and_performance_targets:
    text: >
      Просим согласовать для {doc_names}: KPI/целевые показатели агента.
      ВНИМАНИЕ: формулировка KPI должна исключать признаки трудовой функции
      (использовать «условие вознаграждения», а не «обязанность выполнения»).
    addressee: "Юридический советник / Принципал"

  power_of_attorney_clause:
    text: >
      По {doc_names} (модель «от имени принципала») просим согласовать:
      порядок выдачи и объём полномочий доверенности.
    addressee: "Принципал"

  force_majeure_agency:
    text: >
      Просим уточнить для {doc_names} условия о форс-мажоре.
    addressee: "Юридический советник"

  confidentiality_clause_agency:
    text: >
      Просим согласовать для {doc_names} условия о конфиденциальности.
    addressee: "Юридический советник"

  personal_data_agency:
    text: >
      По {doc_names} (работа с клиентами) просим согласовать:
      роли сторон по ФЗ-152, порядок обработки ПД, согласие субъектов.
    addressee: "DPO / Юридический советник"

  assignment_agency:
    text: >
      Просим уточнить для {doc_names} ограничения на уступку прав.
    addressee: "Юридический советник"
  
  # Generic fallback
  _default:
    text: >
      Просим предоставить дополнительную информацию по вопросу «{check_name}»
      применительно к {doc_names}.
    addressee: "Юридический советник"