          "database_ownership_details": "Исключительная собственность Принципала, режим коммерческой тайны",
          "post_termination_data_details": "Передача выгрузки из CRM за 3 раб. дня и уничтожение всех локальных копий",
          "client_database_summary": "База принадлежит Принципалу; при прекращении — передача выгрузки CRM за 3 дня и удаление копий"
