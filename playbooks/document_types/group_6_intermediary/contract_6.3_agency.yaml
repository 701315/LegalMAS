          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: >
            Наличие в договоре порядка досрочного расторжения или одностороннего отказа (ст. 1010 ГК РФ).
          required: true
        - name: "pending_orders_completion"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: >
            Урегулирован ли порядок завершения начатых поручений и длящихся сделок при прекращении.
          required: false
        - name: "final_settlement_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: >
            Наличие условия о сроках и порядке проведения окончательных взаиморасчётов.
          required: false
        - name: "return_of_poa_and_materials"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: >
            Обязанность агента вернуть оригиналы выданных доверенностей (ст. 189 ГК РФ) и материалы.
          required: false
        - name: "termination_terms_details"
          type: "string"
          presentation: "fact"
          label: "Порядок прекращения и срок уведомления"
          description: >
            Фактические условия расторжения договора, право на односторонний отказ и срок уведомления.
          required: true
          display_in_grid: true
          display_priority: 2
        - name: "post_termination_settlement_details"
          type: "string"
          presentation: "fact"
          label: "Финальные расчёты и завершение поручений"
          description: >
            Фактический порядок завершения сделок, возврата доверенностей, финального отчёта и расчётов.
          required: true
