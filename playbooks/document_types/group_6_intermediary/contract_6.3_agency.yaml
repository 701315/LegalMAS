        и судьба данных при расторжении договора.

        Нормативный ориентир:
        - ст. 1260, 1334 ГК РФ — права на базу данных (составителя и изготовителя базы данных).
        - ст. 1465 ГК РФ — секрет производства (ноу-хау) / коммерческая тайна в отношении сведений о клиентах.
        - Федеральный закон № 152-ФЗ «О персональных данных» — обработка и передача ПДн клиентов.
        - Практический аспект: если договор молчит, агент после прекращения договора может
          продолжать использовать привлечённую базу клиентов в пользу конкурентов Принципала.
          Чёткое закрепление прав за Принципалом и обязанность удалить/передать базу — ключевой safeguard.

        Важно:
        - Твоя задача — установить, что прямо есть в тексте договора.
        - Не оценивай серьёзность риска.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Кому принадлежат права на сформированную клиентскую базу и лиды (Принципалу / Агенту / совместно).
        2. Порядок передачи или удаления данных при прекращении договора.
        3. Ограничения доступа к CRM / базе данных клиентов.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Если порядок передачи базы определяется регламентом / приложением — это defined-факт.
        4. Если данных в тексте прямо нет — статусное поле = "not_defined",
           текстовое поле = "Данные не определены".
        5. Не используй "None", "null", пустые строки или значения вне allowed_values.
        6. В evidence включай только текст договора.
