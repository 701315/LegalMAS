           • "commission_explicit" — прямо указаны нормы о договоре комиссии (гл. 51 ГК РФ);
           • "mixed_explicit" — прямо указаны обе группы норм;
           • "by_operation_of_law" — прямого указания нет, режим применяется автоматически
