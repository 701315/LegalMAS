type: contract_6.3_agency
name: "Агентский договор"

description: |
  Универсальный возмездный посреднический договор, по которому агент обязуется
  за вознаграждение совершать по поручению принципала юридические и/или фактические действия
  либо от имени и за счет принципала, либо от своего имени, но за счет принципала.
  Регулируется Главой 52 ГК РФ с субсидиарным применением норм о поручении или комиссии
  в зависимости от выбранной модели. На практике агентский договор часто имеет рамочный
  и длящийся характер, а конкретизация действий переносится в задания, заявки, отчеты
  и дополнительные соглашения.
  Основные риски связаны с неясностью выбранной модели, спорами о триггерах выплаты
  агентского вознаграждения, переквалификацией в трудовые отношения, контролем
  денежных потоков при модели действия от своего имени, субагентством, условиями
  exclusivity/non-compete и урегулированием постконтрактных последствий.

version: 4.1
parent: class_6_intermediary

metadata:
  category: contract
  subcategory: intermediary
  complexity: high
  risk_level: critical
  jurisdiction: RU
  language: ru
  legal_base: "Глава 52 ГК РФ (ст. 1005-1011)"
  doc_types_supported:
    - "агентский договор"
    - "договор на оказание агентских услуг"
    - "дистрибьюторский агентский договор"
    - "маркетинговый агентский договор"
    - "договор на продвижение товаров"
    - "договор на продвижение услуг"
    - "агентский договор на поиск клиентов"
    - "рамочный агентский договор"
    - "эксклюзивный агентский договор"
    - "договор агентских услуг"
    - "договор продвижения товаров"

    - "sales agency agreement"
    - "agency agreement"
    - "commercial agency agreement"
    - "marketing agency agreement"
    - "distributor agreement"
    - "reseller agreement"
    - "channel partner agreement"
    - "referral agreement"
    - "referral fee agreement"
    - "introducer agreement"
    - "sales representative agreement"
    - "travel agency agreement"
    - "advertising agency agreement"

