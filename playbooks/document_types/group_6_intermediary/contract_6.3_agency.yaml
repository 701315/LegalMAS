  evidence_style: "pinpoint"
  allow_not_found: true
  output_style: "dd_grid"
  prefer_structured_outputs: true

# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 1: КЛАССИФИКАЦИЯ (L1/L2)
#  Читается: YAMLRegistry → L1FilenameClassifier, L2HeaderClassifier
# ════════════════════════════════════════════════════════════════════════════

classification_runtime_v1:

  scoring:
    accept_threshold: 0.82
    strong_signal_threshold: 0.89
    ambiguity_margin: 0.20
    input_quality_weight: 1.0

  rules:

    filename_patterns:
      # Русский — явные агентские договоры

      - pattern: "(?i)агентск[ийого][_\\s-]*договор"
        kind: specific_subject
        weight: 1.0
        # Базовое: агентский договор

      - pattern: "(?i)договор[_\\s-]*агентск[ихие][_\\s-]*услуг"
        kind: specific_subject
        weight: 0.98

      - pattern: "(?i)договор[_\\s-]*на[_\\s-]*оказани[еия][_\\s-]*агентск[ихие][_\\s-]*услуг"
        kind: specific_subject
        weight: 0.98

      - pattern: "(?i)дистрибьюторск[ийого][_\\s-]*агентск[ийого][_\\s-]*договор"
        kind: specific_subject
        weight: 0.95

      - pattern: "(?i)маркетингов[ыйого][_\\s-]*агентск[ийого][_\\s-]*договор"
        kind: specific_subject
        weight: 0.95

      - pattern: "(?i)договор[_\\s-]*на[_\\s-]*продвижени[еия][_\\s-]*товар[оа]"
        kind: specific_subject
        weight: 0.9

      - pattern: "(?i)договор[_\\s-]*на[_\\s-]*продвижени[еия][_\\s-]*услуг"
        kind: specific_subject
        weight: 0.9

      - pattern: "(?i)агентск[ийого][_\\s-]*договор[_\\s-]*на[_\\s-]*поиск[_\\s-]*клиент[оа]в?"
        kind: specific_subject
        weight: 0.95

      - pattern: "(?i)рамочн[ыйого][_\\s-]*агентск[ийого][_\\s-]*договор"
        kind: specific_subject
        weight: 0.95

      - pattern: "(?i)эксклюзивн[ыйого][_\\s-]*агентск[ийого][_\\s-]*договор"
        kind: specific_subject
        weight: 0.95

      - pattern: "(?i)договор[_\\s-]*продвижени[яия][_\\s-]*товар[оа]"
        kind: specific_subject
        weight: 0.9

      # Краткий русский маркер "агентск" с "договор"

      - pattern: "(?i)договор[_\\s-]*агент[аы]"
        kind: specific_subject
        weight: 0.9

      - pattern: "(?i)агент[аы][_\\s-]*договор"
        kind: specific_subject
        weight: 0.9

      - pattern: "(?i)агентск"
        kind: generic_form
        weight: 0.6
        # Любое "агентск" без "договор" – поддержка, не решающий сигнал

      # Английский — agency / sales / distribution / referral

      - pattern: "(?i)sales[_\\s-]*agency[_\\s-]*agreement"
        kind: specific_subject
        weight: 1.0

      - pattern: "(?i)agency[_\\s-]*agreement"
        kind: specific_subject
        weight: 0.98

      - pattern: "(?i)commercial[_\\s-]*agency[_\\s-]*agreement"
        kind: specific_subject
        weight: 0.98

      - pattern: "(?i)marketing[_\\s-]*agency[_\\s-]*agreement"
        kind: specific_subject
        weight: 0.95

      - pattern: "(?i)advertising[_\\s-]*agency[_\\s-]*agreement"
        kind: specific_subject
        weight: 0.95

      - pattern: "(?i)travel[_\\s-]*agency[_\\s-]*agreement"
        kind: specific_subject
        weight: 0.9

      - pattern: "(?i)distributor[_\\s-]*agreement"
        kind: specific_subject
        weight: 0.95

      - pattern: "(?i)distribution[_\\s-]*agreement"
        kind: specific_subject
        weight: 0.9

      - pattern: "(?i)reseller[_\\s-]*agreement"
        kind: specific_subject
        weight: 0.9

      - pattern: "(?i)channel[_\\s-]*partner[_\\s-]*agreement"
        kind: specific_subject
        weight: 0.9

      - pattern: "(?i)referral[_\\s-]*agreement"
        kind: specific_subject
        weight: 0.9

      - pattern: "(?i)referral[_\\s-]*fee[_\\s-]*agreement"
        kind: specific_subject
        weight: 0.9

      - pattern: "(?i)introducer[_\\s-]*agreement"
        kind: specific_subject
        weight: 0.9

      - pattern: "(?i)sales[_\\s-]*representative[_\\s-]*agreement"
        kind: specific_subject
        weight: 0.9

      # Краткие маркеры agency/sales agent – generic/context

      - pattern: "(?i)sales[\\s_.-]*agent"
        kind: generic_form
        weight: 0.6
        # Может быть и job offer, поэтому не specific_subject

      - pattern: "(?i)marketing[\\s_.-]*agent"
        kind: generic_form
        weight: 0.55

      - pattern: "(?i)agency"
        kind: generic_form
        weight: 0.55
        # 'agency' само по себе слишком широкое (рекрутинг, госагентства, ad agency и т.п.)

      - pattern: "(?i)distribution"
        kind: context
        weight: 0.4
        # Distribution в filename – полезный контекст, но не решающий сам по себе

    folder_patterns:
      - pattern: "(?i)агент[аы][сск]?"
        kind: specific_subject
        weight: 0.8
        # Папка "агентские" / "агенты"

      - pattern: "(?i)agency"
        kind: specific_subject
        weight: 0.8
        # Папка agency в договорном контексте

      - pattern: "(?i)sales[_\\s-]*agency"
        kind: specific_subject
        weight: 0.8

      - pattern: "(?i)marketing[_\\s-]*agency"
        kind: specific_subject
        weight: 0.8

      - pattern: "(?i)distribution"
        kind: specific_subject
        weight: 0.75
        # Папка distribution с договорами дистрибьюции/реселлинга

      - pattern: "(?i)reseller"
        kind: specific_subject
        weight: 0.75

      - pattern: "(?i)channel[_\\s-]*partners?"
        kind: specific_subject
        weight: 0.75

      - pattern: "(?i)referral"
        kind: specific_subject
        weight: 0.75

    keywords:

      high:
        - pattern: "(?i)агентск[ийое]\\s+договор"
          weight: 1.0
          distinctiveness: high
          context: header
          description: "Основное название агентского договора"

        - pattern: "(?i)договор\\s+на\\s+оказан[иеия]\\s+агентск[ихие]\\s+услуг"
          weight: 0.95
          distinctiveness: high
          context: header
          description: "Договор на оказание агентских услуг"

        - pattern: "(?i)дистрибьюторск[ийое]\\s+агентск[ийое]\\s+договор"
          weight: 0.9
          distinctiveness: high
          context: header
          description: "Дистрибьюторская агентская модель"

        - pattern: "(?i)маркетингов[ыйое]\\s+агентск[ийое]\\s+договор"
          weight: 0.9
          distinctiveness: high
          context: header
          description: "Маркетинговый агентский договор"

        - pattern: "(?i)договор\\s+на\\s+продвижен[иеия]\\s+товар[овъа]/услуг"
          weight: 0.85
          distinctiveness: medium
          context: header
          description: "Продвижение товаров или услуг в агентской модели"

        - pattern: "(?i)агентск[ийое]\\s+договор\\s+на\\s+поиск\\s+клиент[овъа]"
          weight: 0.9
          distinctiveness: high
          context: header
          description: "Агентский договор на поиск клиентов"

        - pattern: "(?i)рамочн[ыйое]\\s+агентск[ийое]\\s+договор"
          weight: 0.9
          distinctiveness: high
          context: header
          description: "Рамочный агентский договор"

        - pattern: "(?i)эксклюзивн[ыйое]\\s+агентск[ийое]\\s+договор"
          weight: 0.9
          distinctiveness: high
          context: header
          description: "Эксклюзивный агентский договор"

        - pattern: "(?i)sales\\s+agency\\s+agreement"
          weight: 0.95
          distinctiveness: high
          context: header
          description: "English title form for sales agency agreement"

        - pattern: "(?i)marketing\\s+agency\\s+agreement"
          weight: 0.95
          distinctiveness: high
          context: header
          description: "English title form for marketing agency agreement"

        - pattern: "(?i)принципал[а-я]*"
          weight: 0.95
          distinctiveness: high
          context: any
          description: "Принципал как сторона агентского договора"

        - pattern: "(?i)агент[а-я]*"
          weight: 0.8
          distinctiveness: medium
          context: any
          description: "Агент как сторона договора; структурирован осторожно из-за широкой употребимости термина"

        - pattern: "(?i)агентск[оеая]\\s+вознагражден[иеия]"
          weight: 0.9
          distinctiveness: high
          context: any
          description: "Агентское вознаграждение"

        - pattern: "(?i)от\\s+имени\\s+принципал[аыя]"
          weight: 0.8
          distinctiveness: medium
          context: any
          description: "Mandate-like модель агентирования"

        - pattern: "(?i)от\\s+своего\\s+имени"
          weight: 0.75
          distinctiveness: medium
          context: any
          description: "Commission-like модель агентирования"

        - pattern: "(?i)за\\s+сч[её]т\\s+принципал[аыя]"
          weight: 0.85
          distinctiveness: high
          context: any
          description: "Обязательный экономический признак агентской модели"

        - pattern: "(?i)юридическ[иеих]\\s+и\\s+иные\\s+действ[ияий]"
          weight: 0.9
          distinctiveness: high
          context: any
          description: "Прямая формула предмета агентского договора"

      medium:
        - pattern: "(?i)отч[её]т\\s+агент[аа]"
          weight: 0.65
          distinctiveness: medium
          context: any
          description: "Отчет агента принципалу"

        - pattern: "(?i)\\bсубагент\\b"
          weight: 0.65
          distinctiveness: medium
          context: any
          description: "Субагентская модель"

        - pattern: "(?i)\\bтерритори[яя]\\b"
          weight: 0.5
          distinctiveness: medium
          context: any
          description: "Территориальное ограничение деятельности агента"

        - pattern: "(?i)исключительност[ьи]"
          weight: 0.55
          distinctiveness: medium
          context: any
          description: "Условия исключительности"

        - pattern: "(?i)эксклюзивност[ьи]"
          weight: 0.55
          distinctiveness: medium
          context: any
          description: "Эксклюзивная агентская модель"

        - pattern: "(?i)поиск\\s+клиент[оо]в"
          weight: 0.55
          distinctiveness: medium
          context: any
          description: "Поиск клиентов агентом"

        - pattern: "(?i)продвижени[ея]\\s+товар[оо]в"
          weight: 0.5
          distinctiveness: medium
          context: any
          description: "Продвижение товаров в рамках агентирования"

        - pattern: "(?i)маркетингов[ыо]е\\s+услуг[ии]"
          weight: 0.45
          distinctiveness: medium
          context: any
          description: "Маркетинговый функционал агента"

        - pattern: "(?i)\\bдистрибуци[яяи]\\b"
          weight: 0.45
          distinctiveness: medium
          context: any
          description: "Дистрибуционный контекст"

        - pattern: "(?i)\\btail\\s+commission\\b"
          weight: 0.6
          distinctiveness: medium
          context: any
          description: "Отложенное постконтрактное агентское вознаграждение"

        - pattern: "(?i)постконтрактн[оа]е\\s+вознаграждени[ея]"
          weight: 0.6
          distinctiveness: medium
          context: any
          description: "Вознаграждение за сделки после окончания договора"

      low:
        - pattern: "(?i)рамочн[ыо]й\\s+договор"
          weight: 0.25
          distinctiveness: low
          context: any
          description: "Рамочный характер агентских отношений"

        - pattern: "(?i)неконкуренци[яяи]"
          weight: 0.3
          distinctiveness: low
          context: any
          description: "Non-compete оговорка"

        - pattern: "(?i)коммерческ[оа]е\\s+представительств[оо]"
          weight: 0.25
          distinctiveness: low
          context: any
          description: "Соседний представительский контекст"

        - pattern: "(?i)переквалификаци[яяи]\\s+в\\s+трудов[оа]й"
          weight: 0.2
          distinctiveness: low
          context: any
          description: "Риск переквалификации в трудовые отношения"

        - pattern: "(?i)\\bбрендбук\\b"
          weight: 0.2
          distinctiveness: low
          context: any
          description: "Маркетинговый operational-контекст"

        - pattern: "(?i)\\bлид[ыо]?\\b"
          weight: 0.2
          distinctiveness: low
          context: any
          description: "Лиды как результат агентской активности"

        - pattern: "(?i)клиентск[а-яё]+\\s+баз[аа]"
          weight: 0.25
          distinctiveness: low
          context: any
          description: "Клиентская база в рамках агентского канала"

    exclusions:
      - pattern: "(?i)трудов[оа]й\\s+договор"
        severity: hard
        weight: -1.0
        description: "Трудовой договор оформляет трудовую функцию, а не гражданско-правовое агентирование"

      - pattern: "(?i)договор\\s+поручени[яя]"
        severity: hard
        weight: -1.0
        description: "Поручение — отдельная mandate-модель с собственным ownership-marker"

      - pattern: "(?i)договор\\s+комисси[ии]"
        severity: hard
        weight: -1.0
        description: "Комиссия — отдельная commission-модель с иным ownership-marker"

      - pattern: "(?i)коммерческ[а-яё]+\\s+концесси[яяи]"
        severity: hard
        weight: -1.0
        description: "Коммерческая концессия — самостоятельный IP/distribution тип"

      # ── Soft exclusions

      - pattern: "(?i)договор\\s+оказани[яя]\\s+услуг"
        severity: soft
        weight: -0.35
        description: "Общие услуги без агентского ядра снижают уверенность в типе"

      - pattern: "(?i)исполнитель\\b"
        severity: soft
        weight: -0.25
        description: "Service-like терминология исполнителя ослабляет агентскую квалификацию"

      - pattern: "(?i)работник\\b"
        severity: soft
        weight: -0.35
        description: "Трудовая терминология снижает уверенность и повышает риск переквалификации"

# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 2: ТРИГГЕРЫ
#  Читается: TriggerDetector → doc.applicable_triggers
# ════════════════════════════════════════════════════════════════════════════

trigger_definitions:

  acts_in_principal_name:
    any_keywords:
      - "(?i)от\\s+имени\\s+принципал[аа]"
      - "(?i)прав[аа]\\s+и\\s+обязанност[ии]\\s+возникают\\s+у\\s+принципал[аа]"
      - "(?i)\\bдоверенност[ьи]\\b"
      - "(?i)представлени[ея]\\s+интерес[оо]в"

  acts_in_own_name:
    any_keywords:
      - "(?i)от\\s+своего\\s+имени"
      - "(?i)за\\s+сч[её]т\\s+принципал[аа]"
      - "(?i)прав[аа]\\s+и\\s+обязанност[ии]\\s+по\\s+сделк[ее]\\s+возникают\\s+у\\s+агент[аа]"

  mixed_actions_model:
    any_keywords:
      - "(?i)юридическ[иие]+\\s+и\\s+ин[ыа]е\\s+действи[яя]"
      - "(?i)юридическ[иие]+\\s+и\\s+фактическ[иие]+\\s+действи[яя]"
      - "(?i)привлечени[ея]\\s+клиент[оо]в"
      - "(?i)продвижени[ея]\\s+товар[оо]в"

  subagency_allowed:
    any_keywords:
      - "(?i)\\bсубагент\\b"
      - "(?i)субагентск[иоя]+\\s+договор"
      - "(?i)привлечени[ея]\\s+субагент[оо]в"

  exclusivity_terms:
    any_keywords:
      - "(?i)исключительн[ыо]е\\s+прав[аа]"
      - "(?i)эксклюзивност[ьи]"
      - "(?i)единственн[ыо]й\\s+агент"
      - "(?i)запрет\\s+другим\\s+агентам"
      - "(?i)неконкуренци[яяи]"

  report_based_settlement:
    any_keywords:
      - "(?i)отч[её]т\\s+агент[аа]"
      - "(?i)утверждени[ея]\\s+отч[её]т[аа]"
      - "(?i)возражени[яя]\\s+на\\s+отч[её]т"
      - "(?i)на\\s+основани[ии]\\s+отч[её]т[аа]"

  tail_commission_terms:
    any_keywords:
      - "(?i)\\btail\\s+commission\\b"
      - "(?i)постконтрактн[оа]е\\s+вознаграждени[ея]"
      - "(?i)сделк[ии],?\\s+заключенн[ыо]е\\s+в\\s+период\\s+действи[яя]"
      - "(?i)оплаченн[ыо]е\\s+после\\s+окончани[яя]"

  marketing_promotion_scope:
    any_keywords:
      - "(?i)маркетингов[ыо]е\\s+услуг[ии]"
      - "(?i)продвижени[ея]\\s+товар[оо]в"
      - "(?i)\\bреклам[ааы]\\b"
      - "(?i)поиск\\s+клиент[оо]в"
      - "(?i)лидогенераци[яяи]"

  anti_labor_risk:
    any_keywords:
      - "(?i)рабоч[иоя]+\\s+график"
      - "(?i)подчинени[ея]\\s+внутренн[ео]му\\s+распорядк[уу]"
      - "(?i)должностн[а-яё]+\\s+инструкци[яяи]"
      - "(?i)\\bотпуск\\b"
      - "(?i)рабоч[еое]\\s+мест[оо]"

  principal_money_flow_sensitive:
    any_keywords:
      - "(?i)получает\\s+денежн[ыо]е\\s+средств[аа]\\s+от\\s+третьих\\s+лиц"
      - "(?i)перечислени[ея]\\s+выручк[ии]"
      - "(?i)средств[аа]\\s+принципал[аа]"
      - "(?i)специальн[ыо]й\\s+сч[её]т"

  cross_border_agency:
    any_keywords:
      - "(?i)иностранн[ыо]й\\s+принципал"
      - "(?i)иностранн[ыо]й\\s+агент"
      - "(?i)\\bнерезидент\\b"
      - "(?i)международн[оа]е\\s+агентировани[ея]"
      - "(?i)валютн[ыо]й\\s+контрол[ья]"
      - "(?i)налог\\s+у\\s+источник[аа]"
      - "(?i)\\bUSD\\b"
      - "(?i)\\bEUR\\b"
      - "(?i)применим[оа]е\\s+прав[оо]"

  client_data_handling:
    any_keywords:
      - "(?i)клиентск[а-яё]+\\s+баз[аа]"
      - "(?i)персональн[ыо]е\\s+данн[ыо]е"
      - "(?i)\\bCRM\\b"
      - "(?i)баз[аа]\\s+данн[ыо]х\\s+клиент[оо]в"
      - "(?i)\\bлид[ыо]?\\b"
      - "(?i)контактн[ыо]е\\s+данн[ыо]е\\s+клиент[оо]в"

# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 3: SHARED PATTERNS
#  Читается: DocTypeCheckLoader через _resolve_yaml_templates()
# ════════════════════════════════════════════════════════════════════════════

shared_patterns:

  money_amount: "(?i)\\b\\d[\\d\\s]*(?:руб|рублей|₽|коп|тыс|млн|млрд)"
  percentage_pattern: "(?i)\\b\\d+(?:[.,]\\d+)?\\s*%\\b"
  date_pattern: "(?i)\\b\\d{1,2}[.]\\d{1,2}[.]\\d{4}\\b"
  deadline_pattern: "(?i)(?:в течение|не позднее)\\s+\\d+\\s+(?:календарн|рабоч|дн|дня|дней)"
  assignment_or_order_ref: "(?i)(?:задани[ея]|поручени[ея]|заявк[аи]|order|statement\\s+of\\s+work)"

# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 4: COMPLIANCE RULES
#  Читается: DocTypeCheckLoader._exclusion_logic_to_checks()
# ════════════════════════════════════════════════════════════════════════════

compliance_rules:

  - id: "labor_requalification_red_flag"
    name: "Признаки переквалификации в трудовой договор"
    description: "Если в агентском договоре присутствуют признаки трудовых отношений, существует критический риск переквалификации"
    legal_base: "ст. 15, 16 ТК РФ, судебная практика"
    required_triggers: ["anti_labor_risk"]
    severity: "critical"
    result_if_triggered: "fail"
    detector_type: "rules"
    rules:
      keywords:
        - "рабочий день с"
        - "подчиняется правилам внутреннего трудового распорядка"
        - "ежегодный оплачиваемый отпуск"
        - "должностная инструкция"
        - "рабочее место предоставляется"
      keyword_mode: "any"
    retrieval:
      context_k: 5
      boost_keywords:
        - "рабочий график"
        - "внутренний трудовой распорядок"
        - "должностная инструкция"
      rerank: true

  - id: "agency_model_unclear"
    name: "Неясна модель действий агента"
    description: |
      Если неясно, действует агент от имени принципала или от своего имени,
      повышается риск неправильного распределения прав и обязанностей.
      ПРИМЕЧАНИЕ v4.1: эта проверка использует negative_keywords —
      срабатывает, если НИ ОДНО из ключевых слов не найдено.
    legal_base: "ст. 1005, 1011 ГК РФ"
    required_triggers: []
    severity: "critical"
    result_if_triggered: "fail"
    detector_type: "rules"
    rules:
      negative_keywords:
        - "от имени принципала"
        - "от своего имени"
        - "за счет принципала"
      keyword_mode: "any"
    retrieval:
      context_k: 5
      boost_keywords:
        - "от имени принципала"
        - "от своего имени"
        - "за счет принципала"
      rerank: true

  - id: "gratuitous_agency_red_flag"
    name: "Попытка безвозмездной агентской конструкции"
    description: "Агентский договор является возмездным; отсутствие ясной модели вознаграждения создает высокий риск спора"
    legal_base: "ст. 1005, 1006 ГК РФ"
    required_triggers: []
    severity: "critical"
    result_if_triggered: "fail"
    detector_type: "rules"
    rules:
      keywords:
        - "безвозмездно"
        - "без выплаты вознаграждения"
      keyword_mode: "any"
    retrieval:
      context_k: 4
      boost_keywords:
        - "агентское вознаграждение"
        - "безвозмездно"
      rerank: true

  - id: "money_flow_control_missing"
    name: "Неурегулирован контроль денежных потоков принципала"
    description: "При получении агентом средств от третьих лиц отсутствие сроков перечисления и отчетности создает высокий риск"
    legal_base: "ст. 1005, 1008, 1011 ГК РФ"
    required_triggers: ["acts_in_own_name", "principal_money_flow_sensitive"]
    severity: "critical"
    result_if_triggered: "fail"
    detector_type: "rules"
    rules:
      negative_keywords:
        - "перечисление выручки"
        - "срок перечисления"
        - "обособленный учет средств принципала"
        - "отчет о полученных средствах"
      keyword_mode: "any"
    retrieval:
      context_k: 5
      boost_keywords:
        - "перечисление выручки"
        - "средства принципала"
        - "специальный счет"
      rerank: true

  - id: "subagency_without_control"
    name: "Субагентство без достаточного контроля"
    description: "Если допускается субагентство, но нет режима согласия и ответственности, риск для принципала высок"
    legal_base: "ст. 1009 ГК РФ"
    required_triggers: ["subagency_allowed"]
    severity: "high"
    result_if_triggered: "fail"
    detector_type: "rules"
    rules:
      keywords:
        - "субагент"
      negative_keywords:
        - "с согласия принципала"
        - "агент отвечает за действия субагента"
        - "запрет на субагентство"
      keyword_mode: "any"
    retrieval:
      context_k: 5
      boost_keywords:
        - "субагент"
        - "согласие принципала"
        - "ответственность агента"
      rerank: true

  - id: "antitrust_exclusive_agency"
    name: "Антимонопольный риск эксклюзивного агентства (ФЗ-135)"
    description: |
      Эксклюзивный агентский договор с запретом работы с конкурентами
      может быть квалифицирован как вертикальное соглашение, ограничивающее
      конкуренцию (ст. 11 ФЗ-135). Особенно критично для сторон с долей рынка > 35%.
    legal_base: "ФЗ-135 «О защите конкуренции», ст. 11, 12"
    required_triggers: ["exclusivity_terms"]
    severity: "high"
    result_if_triggered: "warn"
    detector_type: "rules"
    rules:
      keywords:
        - "эксклюзивность"
        - "запрет работы с конкурентами"
        - "единственный агент"
        - "вертикальное соглашение"
        - "ФАС"
      keyword_mode: "any"
    retrieval:
      context_k: 4
      boost_keywords:
        - "эксклюзивность"
        - "конкуренция"
        - "антимонопольный"
      rerank: true

  - id: "currency_control_cross_border_agency"
    name: "Валютный контроль при трансграничном агентировании (ФЗ-173)"
    description: |
      При выплате агентского вознаграждения нерезиденту необходимо:
      (а) оформить паспорт сделки; (б) удержать налог у источника;
      (в) соблюсти валютное законодательство.
    legal_base: "ФЗ-173, НК РФ ст. 309, 310"
    required_triggers: ["cross_border_agency"]
    severity: "critical"
    result_if_triggered: "warn"
    detector_type: "rules"
    rules:
      keywords:
        - "валютный контроль"
        - "паспорт сделки"
        - "налог у источника"
        - "нерезидент"
        - "СОИДН"
      keyword_mode: "any"
    retrieval:
      context_k: 4
      boost_keywords:
        - "валютный контроль"
        - "нерезидент"
        - "налог у источника"
      rerank: true

  - id: "power_of_attorney_absence"
    name: "Отсутствие доверенности при модели «от имени принципала» (ст. 185, 1005 ГК РФ)"
    description: |
      При модели «от имени принципала» агент должен действовать на основании
      доверенности. Без неё сделки с третьими лицами не создают прав/обязанностей
      для принципала → агент может быть признан действующим от своего имени.
    legal_base: "ст. 185, 1005 ГК РФ"
    required_triggers: ["acts_in_principal_name"]
    severity: "critical"
    result_if_triggered: "warn"
    detector_type: "rules"
    rules:
      keywords:
        - "доверенность"
        - "на основании доверенности"
        - "полномочия агента"
      keyword_mode: "any"
      negative_keywords:
        - "без доверенности"
    retrieval:
      context_k: 4
      boost_keywords:
        - "доверенность"
        - "полномочия"
        - "от имени принципала"
      rerank: true

# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 5: CHECKS_V8 — LLM/hybrid проверки
#  Читается: DocTypeCheckLoader._load_doc_type_checks()
# ════════════════════════════════════════════════════════════════════════════

checks_v8:

  - id: agency_subject_extraction
    name: "Базовое извлечение структуры агентского договора"
    description: "Извлекает принципала, агента, предмет, модель агентирования, вознаграждение, отчетность и special clauses"
    triggers: {}
    severity: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "агентский договор"
        - "принципал"
        - "агент"
        - "агентское вознаграждение"
        - "отчет агента"
        - "от имени принципала"
        - "от своего имени"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)(агентск(ий|ого)\\s+договор|принципал|агент)"
        - "(?i)(от\\s+имени\\s+принципала|от\\s+своего\\s+имени)"
        - "(?i)вознаграждени[ея].{0,30}агент"
    llm:
      prompt_template: |
        Ты — юридический ассистент, анализирующий агентский договор.
        Извлеки ключевые параметры строго по тексту договора.

        Ответь строго в JSON:
        {
          "principal": "<принципал или not_found>",
          "agent": "<агент или not_found>",
          "agency_model": "<principal_name_model / own_name_model / mixed_or_unclear / not_found>",
          "actions_scope": "<юридические/фактические действия или not_found>",
          "remuneration_status": "<present / unclear / not_found>",
          "reporting_status": "<present / not_found>",
          "subagency_status": "<present / absent / not_found>",
          "exclusivity_status": "<present / absent / not_found>",
          "tail_commission_status": "<present / absent / not_found>"
        }
      prompt_file: null
      context_k: 6
      temperature: 0.0
      max_tokens: 700
    retrieval:
      context_k: 6
      max_chunks: 10
      boost_keywords:
        - "агентский договор"
        - "от имени принципала"
        - "от своего имени"
        - "агентское вознаграждение"
        - "отчет агента"
      rerank: true
      filters: {}
    evidence:
      required: true
      min_snippet_length: 50
      max_snippet_length: 700
    extraction:
      enabled: true
      mode: "hybrid"
      fields:
        - name: "principal"
          type: "string"
          keyword_hints: ["принципал"]
          description: "Принципал"
        - name: "agent"
          type: "string"
          keyword_hints: ["агент"]
          description: "Агент"
        - name: "agency_model"
          type: "string"
          allowed_values: ["principal_name_model", "own_name_model", "mixed_or_unclear", "not_found"]
          description: "Модель агентирования"
        - name: "remuneration_status"
          type: "string"
          allowed_values: ["present", "unclear", "not_found"]
          description: "Статус вознаграждения"
        - name: "exclusivity_status"
          type: "string"
          allowed_values: ["present", "absent", "not_found"]
          description: "Есть ли exclusivity"
      store_payload: true

  - id: agency_model_check
    name: "Модель агентирования: от чьего имени действует агент"
    description: "Проверяет выбранную модель и юридические последствия"
    triggers: {}
    severity: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "от имени принципала"
        - "от своего имени"
        - "за счет принципала"
        - "права и обязанности возникают у принципала"
        - "права и обязанности возникают у агента"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)от\\s+имени\\s+принципала"
        - "(?i)от\\s+своего\\s+имени"
    llm:
      prompt_template: |
        Ты — юридический ассистент, анализирующий агентский договор.
        Проверь модель действий агента.

        Ответь строго в JSON:
        {
          "agency_model": "<principal_name_model / own_name_model / mixed_or_unclear / not_found>",
          "direct_principal_rights_against_third_parties": "<yes / no / unclear / not_found>",
          "model_clarity": "<clear / unclear / not_found>",
          "subsidiary_regime_hint": "<mandate / commission / mixed / not_found>"
        }
      prompt_file: null
      context_k: 5
      temperature: 0.0
      max_tokens: 360
    retrieval:
      context_k: 5
      max_chunks: 8
      boost_keywords:
        - "от имени принципала"
        - "от своего имени"
        - "права и обязанности"
      rerank: true
      filters: {}
    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 580
    extraction:
      enabled: true
      mode: "hybrid"
      fields:
        - name: "agency_model"
          type: "string"
          allowed_values: ["principal_name_model", "own_name_model", "mixed_or_unclear", "not_found"]
          description: "Модель агентирования"
        - name: "model_clarity"
          type: "string"
          allowed_values: ["clear", "unclear", "not_found"]
          description: "Понятность модели"
      store_payload: true

  - id: remuneration_and_payment_trigger_check
    name: "Вознаграждение агента и триггеры оплаты"
    description: "Проверяет размер/формулу вознаграждения, момент возникновения права на оплату и tail commission"
    triggers: {}
    severity: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "агентское вознаграждение"
        - "размер вознаграждения"
        - "процент от сделок"
        - "момент возникновения права на вознаграждение"
        - "постконтрактное вознаграждение"
        - "tail commission"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)агентск(ое|ого)\\s+вознаграждени"
        - "(?i)право\\s+на\\s+вознаграждение\\s+возникает"
    llm:
      prompt_template: |
        Ты — юридический ассистент, анализирующий агентский договор.
        Проверь экономику агентского вознаграждения.

        Ответь строго в JSON:
        {
          "remuneration_clarity": "<clear / partial / not_found>",
          "payment_trigger": "<deal_signed / payment_received / service_completed / mixed / unclear / not_found>",
          "tail_commission_status": "<present / not_found>",
          "payment_dispute_risk": "<high / medium / low / not_found>"
        }
      prompt_file: null
      context_k: 5
      temperature: 0.0
      max_tokens: 360
    retrieval:
      context_k: 5
      max_chunks: 8
      boost_keywords:
        - "агентское вознаграждение"
        - "право на вознаграждение"
        - "постконтрактное вознаграждение"
      rerank: true
      filters: {}
    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 580
    extraction:
      enabled: true
      mode: "hybrid"
      fields:
        - name: "remuneration_clarity"
          type: "string"
          allowed_values: ["clear", "partial", "not_found"]
          description: "Понятность вознаграждения"
        - name: "payment_trigger"
          type: "string"
          allowed_values: ["deal_signed", "payment_received", "service_completed", "mixed", "unclear", "not_found"]
          description: "Триггер оплаты"
        - name: "tail_commission_status"
          type: "string"
          allowed_values: ["present", "not_found"]
          description: "Есть ли tail commission"
      store_payload: true

  - id: reporting_and_settlement_check
    name: "Отчет агента и расчеты по договору"
    description: "Проверяет порядок отчетности, срок возражений и связь отчета с оплатой"
    triggers: {}
    severity: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "отчет агента"
        - "срок представления отчета"
        - "возражения на отчет"
        - "молчание считается согласием"
        - "на основании отчета"
      keyword_mode: "any"
    llm:
      prompt_template: |
        Ты — юридический ассистент, анализирующий агентский договор.
        Проверь порядок отчетности агента и расчетов.

        Ответь строго в JSON:
        {
          "reporting_status": "<present / partial / not_found>",
          "objection_period_status": "<present / not_found>",
          "report_to_payment_linkage": "<present / not_found>",
          "report_approval_risk": "<high / medium / low / not_found>"
        }
      prompt_file: null
      context_k: 5
      temperature: 0.0
      max_tokens: 340
    retrieval:
      context_k: 5
      max_chunks: 7
      boost_keywords:
        - "отчет агента"
        - "возражения на отчет"
      rerank: true
      filters: {}
    evidence:
      required: true
      min_snippet_length: 35
      max_snippet_length: 540
    extraction:
      enabled: true
      mode: "hybrid"
      fields:
        - name: "reporting_status"
          type: "string"
          allowed_values: ["present", "partial", "not_found"]
          description: "Статус отчетности"
        - name: "objection_period_status"
          type: "string"
          allowed_values: ["present", "not_found"]
          description: "Есть ли срок для возражений"
      store_payload: true

  - id: funds_and_assets_control_check
    name: "Контроль средств/имущества принципала у агента"
    description: "Проверяет сроки перечисления выручки, режим учета средств принципала"
    triggers:
      any: ["acts_in_own_name", "principal_money_flow_sensitive"]
    severity: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "перечисление выручки"
        - "срок перечисления"
        - "обособленный учет средств принципала"
        - "специальный счет"
        - "средства принципала"
      keyword_mode: "any"
    llm:
      prompt_template: |
        Ты — юридический ассистент, анализирующий агентский договор.
        Проверь контроль денежных потоков принципала.

        Ответь строго в JSON:
        {
          "proceeds_transfer_timing": "<present / not_found>",
          "segregated_funds_mechanism": "<present / not_found>",
          "agent_holds_principal_money": "<yes / no / unclear / not_found>",
          "principal_cashflow_risk": "<high / medium / low / not_found>"
        }
      prompt_file: null
      context_k: 5
      temperature: 0.0
      max_tokens: 340
    retrieval:
      context_k: 5
      max_chunks: 7
      boost_keywords:
        - "перечисление выручки"
        - "средства принципала"
        - "специальный счет"
      rerank: true
      filters: {}
    evidence:
      required: true
      min_snippet_length: 35
      max_snippet_length: 540
    extraction:
      enabled: true
      mode: "hybrid"
      fields:
        - name: "proceeds_transfer_timing"
          type: "string"
          allowed_values: ["present", "not_found"]
          description: "Есть ли срок перечисления выручки"
        - name: "segregated_funds_mechanism"
          type: "string"
          allowed_values: ["present", "not_found"]
          description: "Есть ли обособление средств"
      store_payload: true

  - id: exclusivity_and_non_compete_check
    name: "Исключительность, территория и запрет конкуренции"
    description: "Проверяет exclusivity/non-compete, территорию"
    triggers:
      any: ["exclusivity_terms"]
    severity: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "исключительные права"
        - "эксклюзивность"
        - "территория действия"
        - "агент не вправе представлять конкурентов"
        - "принципал не вправе заключать договоры с другими агентами"
      keyword_mode: "any"
    llm:
      prompt_template: |
        Ты — юридический ассистент, анализирующий агентский договор.
        Проверь exclusivity/non-compete.

        Ответь строго в JSON:
        {
          "exclusivity_status": "<present / partial / not_found>",
