        (tail commission). Не анализируй отчётность, субагентство, эксклюзивность
        или прекращение. Не путай вознаграждение (ст. 1006) с возмещением
        расходов (ст. 1001).
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие 6 полей (всего 6 ключей в JSON):

        1. remuneration_clarity — определённость вознаграждения:
           • "defined" — размер/формула ясны (фиксированная сумма, процент,
             формула, отсылка к приложению);
           • "partial" — вознаграждение упомянуто, но размер/формула неясны
             (напр., «вознаграждение определяется по соглашению сторон»);
           • "not_defined" — вознаграждение не упомянуто вообще.

        2. remuneration_details — фактический текст условия о вознаграждении
           (кратко, до 200 символов). Если отсылка к приложению —
           «Согласно Приложению №N». Если не определено — «Данные не определены».

        3. payment_trigger — триггер возникновения права на оплату:
           • "deal_signed" — при заключении сделки с клиентом;
           • "payment_received" — при поступлении оплаты от клиента;
           • "service_completed" — при выполнении действий агентом;
           • "report_approved" — после утверждения отчёта агента Принципалом
             (ст. 1008 ГК РФ);
           • "periodic" — фиксированное периодическое (ежемесячное и т.п.);
           • "mixed" — комбинация триггеров;
           • "by_reference" — определяется в приложении/графике;
           • "not_defined" — триггер не указан.

        4. tail_commission_status — наличие хвостового вознаграждения:
           • "defined" — условие о tail commission есть;
           • "not_defined" — условия нет.

        5. tail_commission_details — фактический текст условия о tail commission
           (срок, scope, условия; кратко, до 200 символов).
           Если не определено — «Данные не определены».

        6. remuneration_summary — сводный вывод одной фразой на русском,
           объединяющий все три аспекта для юриста.
        </task>

        <rules>
        - Используй только текст договора.
        - Возмещение расходов (ст. 1001) ≠ вознаграждение (ст. 1006).
          Если в договоре только расходы, но нет вознаграждения —
          remuneration_clarity = "not_defined".
        - Отсылка к приложению/протоколу/прайс-листу = defined.
        - payment_trigger = "report_approved" — если прямо указано
          «после утверждения отчёта» / «после подписания отчёта».
        - Верни РОВНО один валидный JSON-объект со всеми 6 ключами, пригодный
          для парсинга через json.loads без предварительной обработки.
          Без markdown, без ```json, без комментариев. Начни с { и закончи }.
        </rules>

        <cove>
        Перед ответом проверь, что все 6 ключей (6 полей) присутствуют в JSON,
        значения статусных полей — строго из allowed_values, и что
        remuneration_summary согласован с остальными полями.
        </cove>
      fields:
        - name: "remuneration_clarity"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "partial", "not_defined"]
          description: >
            Определённость вознаграждения (ст. 1006 ГК РФ). "partial" —
            вознаграждение упомянуто, но размер/формула неясны.
          required: true
        - name: "remuneration_details"
          type: "string"
          presentation: "fact"
          label: "Вознаграждение"
          description: >
            Фактический текст условия о вознаграждении: размер, формула
            или отсылка к приложению.
          required: true
          display_in_grid: true
          display_priority: 1
        - name: "payment_trigger"
          type: "string"
          presentation: "signal"
          allowed_values:
            - "deal_signed"
            - "payment_received"
            - "service_completed"
            - "report_approved"
            - "periodic"
            - "mixed"
            - "by_reference"
            - "not_defined"
          description: >
            Триггер возникновения права на оплату. "report_approved" —
            после утверждения отчёта (ст. 1008 ГК РФ), наиболее частый
            в российской практике.
          required: true
        - name: "tail_commission_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: >
            Наличие условия о хвостовом вознаграждении (tail commission) —
            вознаграждении за сделки с клиентами, привлечёнными агентом,
            после прекращения договора.
          required: false
        - name: "tail_commission_details"
          type: "string"
          presentation: "fact"
          label: "Tail commission"
          description: >
            Фактический текст условия о хвостовом вознаграждении:
            срок, scope, условия. Или «Данные не определены».
          required: false
          display_in_grid: true
          display_priority: 2
        - name: "remuneration_summary"
          type: "string"
          presentation: "summary"
          label: "Вознаграждение и оплата"
          description: >
            Сводный вывод одной фразой: размер/формула вознаграждения +
            триггер оплаты + наличие tail commission.
          required: true
          display_in_grid: true
          display_priority: 3

  - id: reporting_and_settlement_check
    name: "Отчёт агента и расчёты по договору"
    description: >
      Проверяет порядок и периодичность отчётности агента (ст. 1008 п. 1 ГК РФ),
      срок и последствия возражений принципала на отчёт (ст. 1008 п. 2–3 ГК РФ,
      дефолт — 30 дней, молчание = принятие) и явную связь отчёта с оплатой
      вознаграждения.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "отчет агента"
        - "отчёт агента"
        - "срок представления отчета"
        - "срок представления отчёта"
        - "возражения на отчет"
        - "возражения на отчёт"
        - "молчание считается согласием"
        - "отчёт считается принятым"
        - "отчет считается принятым"
        - "на основании отчета"
        - "на основании отчёта"
        - "утверждение отчёта"
        - "утверждение отчета"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)отч[её]т\\s+агента"
        - "(?i)возражени[ея].{0,20}отч[её]т"
        - "(?i)молчани.{0,15}(согласи|принят)"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется агентский договор по Главе 52 ГК РФ.
        Проверяется один вопрос: порядок отчётности агента, срок и последствия
        возражений принципала, связь отчёта с оплатой.

        Нормативный ориентир:
        - ст. 1008 п. 1 ГК РФ — агент обязан представлять отчёты в порядке
          и в сроки, предусмотренные договором; к отчёту прилагаются
          доказательства расходов
        - ст. 1008 п. 2 ГК РФ — принципал, имеющий возражения, должен сообщить
          о них агенту в течение 30 дней со дня получения отчёта (если договором
          не установлен иной срок)
        - ст. 1008 п. 3 ГК РФ — при отсутствии возражений в установленный срок
          отчёт считается принятым, а значит, и совершённые агентом действия —
          надлежаще исполненными

        Важно:
        - Твоя задача — установить, что прямо есть в тексте договора.
        - Не оценивай серьёзность риска.
        - Если периодичность/срок определяются через приложение / график —
          это валидный факт (defined).
        - Молчание = принятие — это дефолт по закону (ст. 1008 п. 3).
          Если договор прямо повторяет это правило — это defined.
          Если договор устанавливает иное (напр., «молчание ≠ принятие») —
          это тоже defined и юридически значимо.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Порядок и периодичность отчётности.
        2. Срок и последствия возражений на отчёт (включая правило о молчании).
        3. Явную связь отчёта с оплатой вознаграждения.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Если параметр определяется через приложение / график / регламент —
           это defined. В фактовое поле пиши «Согласно Приложению №N» и т.п.
        4. Если данных в тексте прямо нет — статусное поле = "not_defined",
           текстовое поле = "Данные не определены".
        5. Не используй "None", "null", пустые строки или значения вне allowed_values.
        6. В evidence включай только текст договора.
        7. Верни РОВНО один валидный JSON-объект со всеми 5 ключами, пригодный
           для парсинга через json.loads без предварительной обработки.
           Без markdown, без ```json, без комментариев, без текста до или после.
           Начни ответ сразу с { и закончи }.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — все параметры определены:
        Фрагмент:
        "Агент представляет отчёт ежемесячно, не позднее 5-го числа месяца,
        следующего за отчётным. Принципал вправе заявить мотивированные
        возражения в течение 10 календарных дней с момента получения отчёта.
        При отсутствии возражений в указанный срок отчёт считается принятым.
        Вознаграждение выплачивается в течение 5 банковских дней после
        утверждения отчёта."

        Ответ:
        {
          "reporting_status": "defined",
          "reporting_details": "Ежемесячно, не позднее 5-го числа следующего месяца",
          "objection_period_details": "10 календарных дней; молчание = принятие отчёта",
          "report_to_payment_linkage": "defined",
          "reporting_summary": "Отчёт ежемесячно до 5-го числа; возражения — 10 дней, молчание = принятие; оплата после утверждения"
        }

        Пример 2 — отсылка к приложению + молчание не урегулировано:
        Фрагмент:
        "Порядок и форма отчётности определяются в Приложении №2 к настоящему
        договору. Вознаграждение выплачивается на основании утверждённого отчёта."

        Ответ:
        {
          "reporting_status": "defined",
          "reporting_details": "Согласно Приложению №2",
          "objection_period_details": "Данные не определены (дефолт 30 дней по ст. 1008 п. 2 ГК РФ)",
          "report_to_payment_linkage": "defined",
          "reporting_summary": "Отчёт по Приложению №2; срок возражений не установлен (30 дней по закону); оплата по утверждённому отчёту"
        }

        Пример 3 — данные отсутствуют:
        Фрагмент:
        "Агент исполняет поручение Принципала."

        Ответ:
        {
          "reporting_status": "not_defined",
          "reporting_details": "Данные не определены",
          "objection_period_details": "Данные не определены",
          "report_to_payment_linkage": "not_defined",
          "reporting_summary": "Порядок отчётности не установлен; срок возражений не определён; связь с оплатой не указана"
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        Проверь, что все 5 ключей присутствуют в JSON:
        1. Найди прямую цитату о периодичности/порядке отчётности.
        2. Найди прямую цитату о сроке возражений и/или последствиях молчания.
           Если молчание не урегулировано — укажи дефолт 30 дней.
        3. Найди прямую цитату о связи отчёта с оплатой.
        4. Убедись, что значения статусных полей — строго из allowed_values.
        5. Убедись, что reporting_summary отражает все три аспекта одной фразой.

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "reporting_status": "<defined / partial / not_defined>",
          "reporting_details": "<краткий текст условия или 'Данные не определены'>",
          "objection_period_details": "<срок + последствия молчания или 'Данные не определены'>",
          "report_to_payment_linkage": "<defined / not_defined>",
          "reporting_summary": "<сводный вывод одной фразой>"
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 500

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "отчёт агента срок представления отчёта возражения на отчёт молчание считается согласием отчёт считается принятым на основании отчёта утверждение отчёта порядок отчётности периодичность"
      retrieval_profile: "payment_terms_check"
      preferred_unit_types:
        - obligation
        - general_provision
        - notice
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - procedures
      negative_keywords:
        - "означает"
        - "в целях настоящего"
        - "размер вознаграждения"
        - "субагент"
        - "эксклюзивность"
        - "расторжение"
        - "расходы агента"
      position_bias:
        preferred_range: [0.25, 0.70]
        boost: 0.12
        scope: segment
      context_k: 6
      max_chunks: 8
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
        - "invoice"
      preferred_clause_functions:
        - "obligations"
        - "procedures"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 35
      max_snippet_length: 600

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 750
      compact_output: false
      store_payload: true
      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста агентского договора сведения
        об отчётности агента (ст. 1008 ГК РФ): порядок и периодичность,
        срок и последствия возражений принципала, связь отчёта с оплатой.
        Не анализируй размер вознаграждения, субагентство или прекращение.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие 5 полей (всего 5 ключей в JSON):

        1. reporting_status — статус отчётности:
           • "defined" — порядок и периодичность ясны;
           • "partial" — отчётность упомянута, но порядок/периодичность неясны;
           • "not_defined" — отчётность не упомянута.

        2. reporting_details — фактический текст условия об отчётности
           (периодичность, форма, сроки; кратко, до 200 символов).
           Если отсылка к приложению — «Согласно Приложению №N».
           Если не определено — «Данные не определены».

        3. objection_period_details — фактический текст условия о сроке
           возражений и последствиях молчания (кратко, до 200 символов).
           Примеры: «10 календарных дней; молчание = принятие»,
           «30 дней (по закону, ст. 1008 п. 2)».
           Если в договоре срок не установлен — укажи дефолт:
           «Данные не определены (дефолт 30 дней по ст. 1008 п. 2 ГК РФ)».

        4. report_to_payment_linkage — явная связь отчёта с оплатой:
           • "defined" — прямо указано, что оплата привязана к отчёту
             (напр., «после утверждения отчёта»);
           • "not_defined" — явной связки нет.

        5. reporting_summary — сводный вывод одной фразой на русском,
           объединяющий все три аспекта для юриста.
        </task>

        <rules>
        - Используй только текст договора.
        - Дефолт по ст. 1008 п. 2 ГК РФ — 30 дней на возражения.
          Если договор молчит — укажи это в objection_period_details.
        - Дефолт по ст. 1008 п. 3 ГК РФ — молчание = принятие отчёта.
          Если договор прямо устанавливает иное (напр., «молчание не является
          принятием») — это юридически значимо, отрази в objection_period_details.
        - Отсылка к приложению/графику/регламенту = defined.
        - Верни РОВНО один валидный JSON-объект со всеми 5 ключами, пригодный
          для парсинга через json.loads без предварительной обработки.
          Без markdown, без ```json, без комментариев. Начни с { и закончи }.
        </rules>

        <cove>
        Перед ответом проверь, что все 5 ключей (5 полей) присутствуют в JSON,
        значения статусных полей — строго из allowed_values, и что
        reporting_summary согласован с остальными полями.
        </cove>
      fields:
        - name: "reporting_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "partial", "not_defined"]
          description: >
            Статус отчётности агента (ст. 1008 п. 1 ГК РФ). "partial" —
            отчётность упомянута, но порядок/периодичность неясны.
          required: true
        - name: "reporting_details"
          type: "string"
          presentation: "fact"
          label: "Порядок отчётности"
          description: >
            Периодичность, форма и сроки отчётности агента.
            Или отсылка к приложению/регламенту.
          required: true
          display_in_grid: true
          display_priority: 2
        - name: "objection_period_details"
          type: "string"
          presentation: "fact"
          label: "Возражения на отчёт"
          description: >
            Срок возражений принципала на отчёт и последствия молчания
            (ст. 1008 п. 2–3 ГК РФ). Дефолт по закону — 30 дней,
            молчание = принятие.
          required: true
          display_in_grid: true
          display_priority: 3
        - name: "report_to_payment_linkage"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: >
            Наличие явной связки «отчёт → оплата» в тексте договора.
            Детали триггера оплаты — в чеке remuneration_and_payment_trigger_check.
          required: false
        - name: "reporting_summary"
          type: "string"
          presentation: "summary"
          label: "Отчётность и расчёты"
          description: >
            Сводный вывод одной фразой: порядок отчётности + срок возражений +
            связь с оплатой.
          required: true
          display_in_grid: true
          display_priority: 1

  - id: funds_and_assets_control_check
    name: "Контроль средств и имущества принципала у агента"
    description: >
      Проверяет сроки перечисления выручки принципалу, механизм обособления
      средств принципала (специальный счёт, раздельный учёт) и факт получения
      агентом денежных средств от третьих лиц. Критично при модели «от своего
      имени» (ст. 1011 → ст. 996 ГК РФ — имущество комитента не входит
      в конкурсную массу комиссионера).
    triggers:
      any:
        - acts_in_own_name
        - principal_money_flow_sensitive
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "перечисление выручки"
        - "срок перечисления"
        - "обособленный учет"
        - "обособленный учёт"
        - "специальный счет"
        - "специальный счёт"
        - "средства принципала"
        - "денежные средства от третьих лиц"
        - "раздельный учёт"
        - "раздельный учет"
        - "эскроу"
        - "номинальный счёт"
        - "номинальный счет"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)перечислени[ея].{0,20}выручк"
        - "(?i)(обособленн|раздельн).{0,15}(уч[её]т|сч[её]т)"
        - "(?i)специальн.{0,10}сч[её]т"
        - "(?i)(эскроу|номинальн.{0,10}сч[её]т)"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется агентский договор по Главе 52 ГК РФ.
        Проверяется один вопрос: контроль денежных потоков и имущества
        принципала, находящихся у агента.

        Нормативный ориентир:
        - ст. 1011 ГК РФ → ст. 996 п. 1 ГК РФ (комиссия) — имущество,
          поступившее к комиссионеру от комитента или приобретённое за счёт
          комитента, является собственностью комитента; при банкротстве
          комиссионера — не входит в конкурсную массу
        - ст. 1011 ГК РФ → ст. 972 ГК РФ (поручение) — поверенный обязан
          передавать доверителю без промедления всё полученное по сделкам
        - ст. 1005 п. 3 ГК РФ — при модели «от своего имени» права и
          обязанности возникают у агента (агент получает деньги на свой счёт)
        - Обособление средств (спецсчёт, раздельный учёт, эскроу) —
          договорная конструкция; ГК прямо не императив для агентских,
          но критична для защиты от банкротства агента

        Важно:
        - Твоя задача — установить, что прямо есть в тексте договора.
        - Не оценивай серьёзность риска.
        - Если сроки/механизмы определяются через приложение / регламент —
          это валидный факт (defined).

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Срок и порядок перечисления выручки принципалу.
        2. Механизм обособления средств принципала (спецсчёт, раздельный учёт,
           эскроу, номинальный счёт).
        3. Указание на то, что агент получает денежные средства от третьих лиц
           в рамках исполнения поручения.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Если параметр определяется через приложение / регламент / график —
           это defined. В фактовое поле пиши «Согласно Приложению №N» и т.п.
        4. Если данных в тексте прямо нет — статусное поле = "not_defined",
           текстовое поле = "Данные не определены".
        5. Не используй "None", "null", пустые строки или значения вне allowed_values.
        6. В evidence включай только текст договора.
        7. Верни РОВНО один валидный JSON-объект со всеми 6 ключами, пригодный
           для парсинга через json.loads без предварительной обработки.
           Без markdown, без ```json, без комментариев, без текста до или после.
           Начни ответ сразу с { и закончи }.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — модель «от своего имени», все механизмы:
        Фрагмент:
        "Агент получает денежные средства от покупателей на свой расчётный счёт
        и перечисляет выручку Принципалу не позднее 5 рабочих дней с момента
        поступления. Средства Принципала учитываются обособленно на специальном
        банковском счёте Агента."

        Ответ:
        {
          "proceeds_transfer_timing": "defined",
          "proceeds_transfer_details": "Не позднее 5 рабочих дней с момента поступления",
          "segregated_funds_mechanism": "defined",
          "segregation_details": "Обособленный учёт на специальном банковском счёте Агента",
          "agent_holds_principal_money": "defined",
          "funds_control_summary": "Выручка перечисляется в течение 5 раб. дней; средства обособлены на спецсчёте; агент получает оплату от третьих лиц"
        }

        Пример 2 — модель «от имени», деньги идут напрямую:
        Фрагмент:
        "Агент действует от имени и за счёт Принципала. Все платежи от третьих
        лиц поступают непосредственно на расчётный счёт Принципала."

        Ответ:
        {
          "proceeds_transfer_timing": "not_defined",
          "proceeds_transfer_details": "Данные не определены (платежи напрямую Принципалу)",
          "segregated_funds_mechanism": "not_defined",
          "segregation_details": "Данные не определены",
          "agent_holds_principal_money": "not_defined",
          "funds_control_summary": "Платежи от третьих лиц — напрямую на счёт Принципала; обособление не требуется"
        }

        Пример 3 — данные отсутствуют:
        Фрагмент:
        "Агент обязуется совершать сделки по продаже товаров Принципала."

        Ответ:
        {
          "proceeds_transfer_timing": "not_defined",
          "proceeds_transfer_details": "Данные не определены",
          "segregated_funds_mechanism": "not_defined",
          "segregation_details": "Данные не определены",
          "agent_holds_principal_money": "not_defined",
          "funds_control_summary": "Срок перечисления выручки не установлен; обособление средств не предусмотрено; получение средств от третьих лиц не урегулировано"
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        Проверь, что все 6 ключей присутствуют в JSON:
        1. Найди прямую цитату о сроке перечисления выручки.
        2. Найди прямую цитату об обособлении / спецсчёте / раздельном учёте.
        3. Найди прямую цитату о получении агентом средств от третьих лиц.
        4. Убедись, что значения статусных полей — строго из allowed_values.
        5. Убедись, что funds_control_summary отражает все три аспекта.

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "proceeds_transfer_timing": "<defined / not_defined>",
          "proceeds_transfer_details": "<краткий текст условия или 'Данные не определены'>",
          "segregated_funds_mechanism": "<defined / not_defined>",
          "segregation_details": "<краткий текст механизма или 'Данные не определены'>",
          "agent_holds_principal_money": "<defined / not_defined>",
          "funds_control_summary": "<сводный вывод одной фразой>"
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 550

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "перечисление выручки срок перечисления обособленный учёт средств принципала специальный счёт раздельный учёт эскроу номинальный счёт денежные средства от третьих лиц расчётный счёт"
      retrieval_profile: "payment_terms_check"
      preferred_unit_types:
        - obligation
        - payment_term
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - procedures
      negative_keywords:
        - "означает"
        - "в целях настоящего"
        - "размер вознаграждения"
        - "субагент"
        - "эксклюзивность"
        - "расторжение"
      position_bias:
        preferred_range: [0.20, 0.65]
        boost: 0.12
        scope: segment
      context_k: 6
      max_chunks: 8
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
        - "invoice"
      preferred_clause_functions:
        - "obligations"
        - "procedures"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 35
      max_snippet_length: 600

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 800
      compact_output: false
      store_payload: true
      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста агентского договора сведения
        о контроле средств и имущества принципала: сроки перечисления выручки,
        механизм обособления, факт получения агентом денег от третьих лиц.
        Не анализируй вознаграждение, отчётность, субагентство или прекращение.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие 6 полей (всего 6 ключей в JSON):

        1. proceeds_transfer_timing — наличие срока перечисления выручки:
           • "defined" — срок/порядок ясны;
           • "not_defined" — не указано.

        2. proceeds_transfer_details — фактический текст условия о перечислении
           выручки (срок, порядок; кратко, до 200 символов).
           Примеры: «5 рабочих дней с момента поступления»,
           «Ежемесячно, не позднее 10-го числа».
           Если отсылка к приложению — «Согласно Приложению №N».
           Если не определено — «Данные не определены».

        3. segregated_funds_mechanism — наличие обособления средств:
           • "defined" — механизм обособления указан (спецсчёт, раздельный учёт,
             эскроу, номинальный счёт);
           • "not_defined" — обособление не предусмотрено.

        4. segregation_details — фактический текст механизма обособления
           (кратко, до 200 символов).
           Примеры: «Специальный банковский счёт Агента»,
           «Раздельный бухгалтерский учёт», «Эскроу-счёт».
           Если не определено — «Данные не определены».

        5. agent_holds_principal_money — получает ли агент денежные средства
           от третьих лиц в рамках исполнения поручения:
           • "defined" — прямо указано, что агент получает оплату от третьих лиц;
           • "not_defined" — не указано или платежи идут напрямую Принципалу.

        6. funds_control_summary — сводный вывод одной фразой на русском,
           объединяющий все три аспекта для юриста.
        </task>

        <rules>
        - Используй только текст договора.
        - Обособление средств — договорная конструкция. Если в договоре нет
          упоминания спецсчёта / раздельного учёта / эскроу —
          segregated_funds_mechanism = "not_defined".
        - Если платежи идут напрямую на счёт Принципала (модель «от имени») —
          agent_holds_principal_money = "not_defined" (агент не держит деньги).
        - Отсылка к приложению/регламенту = defined.
        - Верни РОВНО один валидный JSON-объект со всеми 6 ключами, пригодный
          для парсинга через json.loads без предварительной обработки.
          Без markdown, без ```json, без комментариев. Начни с { и закончи }.
        </rules>

        <cove>
        Перед ответом проверь, что все 6 ключей (6 полей) присутствуют в JSON,
        значения статусных полей — строго из allowed_values, и что
        funds_control_summary согласован с остальными полями.
        </cove>
      fields:
        - name: "proceeds_transfer_timing"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: >
            Наличие срока перечисления выручки принципалу.
          required: true
        - name: "proceeds_transfer_details"
          type: "string"
          presentation: "fact"
          label: "Срок перечисления выручки"
          description: >
            Фактический текст условия о сроке и порядке перечисления
            выручки принципалу.
          required: true
          display_in_grid: true
          display_priority: 2
        - name: "segregated_funds_mechanism"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: >
            Наличие механизма обособления средств принципала
            (спецсчёт, раздельный учёт, эскроу).
          required: true
        - name: "segregation_details"
          type: "string"
          presentation: "fact"
          label: "Обособление средств"
          description: >
            Фактический текст механизма обособления: спецсчёт,
            раздельный учёт, эскроу, номинальный счёт.
          required: true
          display_in_grid: true
          display_priority: 3
        - name: "agent_holds_principal_money"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: >
            Получает ли агент денежные средства от третьих лиц в рамках
            исполнения поручения. Критично при модели «от своего имени».
          required: false
        - name: "funds_control_summary"
          type: "string"
          presentation: "summary"
          label: "Контроль средств"
          description: >
            Сводный вывод одной фразой: срок перечисления выручки +
            механизм обособления + факт получения средств от третьих лиц.
          required: true
          display_in_grid: true
          display_priority: 1

  - id: exclusivity_and_non_compete_check
    name: "Исключительность, территория и запрет конкуренции"
    description: >
      Проверяет наличие условий об эксклюзивности принципала/агента, территориальных
      ограничений (ст. 1007 ГК РФ) и запрета конкуренции (non-compete). Ловит ничтожные
      условия об ограничении круга покупателей (ст. 1007 п. 3 ГК РФ).
    triggers:
      any:
        - exclusivity_terms
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "ограничение прав"
        - "исключительные права"
        - "эксклюзивность"
        - "территория действия"
        - "не вправе представлять конкурентов"
        - "не вправе заключать договоры"
        - "воздерживаться от осуществления"
        - "определенной категории покупателей"
        - "определенной категории заказчиков"
        - "место нахождения"
        - "non-compete"
        - "запрет конкуренции"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)эксклюзивн(ость|ый|ом)"
        - "(?i)территори(я|и|ей)\\s+действия"
        - "(?i)не\\s+вправе.{0,50}конкурент"
        - "(?i)категори(и|й)\\s+покупателей"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется агентский договор по Главе 52 ГК РФ.
        Проверяется один вопрос: эксклюзивность (exclusivity), территория действия
        и ограничения конкуренции (non-compete).

        Нормативный ориентир:
        - ст. 1007 п. 1 ГК РФ — допустимо обязательство Принципала не заключать аналогичных
          агентских договоров с другими агентами на определённой территории либо воздерживаться
          от самостоятельной аналогичной деятельности на этой территории.
        - ст. 1007 п. 2 ГК РФ — допустимо обязательство Агента не заключать с другими
          принципалами аналогичных договоров, которые должны исполняться на пересекающейся территории.
        - ст. 1007 п. 3 ГК РФ — КРИТИЧЕСКИЙ РИСК! Условия, в силу которых агент обязан продавать
          товары/услуги ИСКЛЮЧИТЕЛЬНО определённой категории покупателей (заказчиков) либо ИСКЛЮЧИТЕЛЬНО
          покупателям, имеющим место нахождения на определённой территории, являются НИЧТОЖНЫМИ.
        - Non-compete после прекращения договора — в РФ практически неисполним и противоречит
          Конституции РФ (свобода труда/предпринимательства), хотя часто включается в международные шаблоны.

        Важно:
        - Твоя задача — установить, что прямо есть в тексте договора.
        - Не оценивай серьёзность риска, но при обнаружении ничтожного условия по ст. 1007 п. 3 ГК РФ
          (ограничение категорий покупателей или их адресов) прямо зафиксируй этот red flag.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Условие об эксклюзивности / исключительности (ограничение Принципала или Агента).
        2. Территорию действия договора (ограничена ли географически).
        3. Запрет конкуренции (non-compete) в период действия или после его прекращения.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Если территория или категории покупателей определяются через приложение / спецификацию —
           это defined-факт.
        4. Если данных в тексте прямо нет — статусное поле = "not_defined",
           текстовое поле = "Данные не определены".
        5. Не используй "None", "null", пустые строки или значения вне allowed_values.
        6. В evidence включай только текст договора.
        7. Верни РОВНО один валидный JSON-объект со всеми 6 ключами, пригодный для парсинга
           через json.loads без предварительной обработки. Без markdown, без ```json,
           без комментариев, без текста до или после. Начни ответ сразу с { и закончи }.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — допустимая двусторонняя эксклюзивность на территории:
        Фрагмент:
        "Агент является эксклюзивным представителем Принципала на территории города Москвы.
        Принципал обязуется не заключать аналогичных агентских договоров с третьими лицами на данной территории.
        Агент обязуется не представлять интересы прямых конкурентов Принципала в период действия договора."

        Ответ:
        {
          "exclusivity_status": "defined",
          "territory_defined": "defined",
          "non_compete_clause": "defined",
          "territory_details": "Город Москва",
          "exclusivity_details": "Эксклюзивность двусторонняя: Принципал не нанимает других агентов в Москве; Агент не работает с конкурентами в период действия договора",
          "exclusivity_summary": "Эксклюзивность в Москве; Принципал ограничен; Агенту запрещено работать с конкурентами"
        }

        Пример 2 — ничтожное ограничение по ст. 1007 п. 3 ГК РФ (red flag):
        Фрагмент:
        "Агент обязуется осуществлять поиск клиентов и продавать услуги Принципала исключительно
        юридическим лицам, зарегистрированным на территории Дальневосточного федерального округа."

        Ответ:
        {
          "exclusivity_status": "defined",
          "territory_defined": "defined",
          "non_compete_clause": "not_defined",
