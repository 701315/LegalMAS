      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста агентского договора сведения
        о моменте перехода права собственности на товары и имущество, приобретённые
        агентом за счёт принципала (ст. 996, 1011 ГК РФ), и о наличии механизмов
        защиты этого имущества от банкротства агента (ст. 131 ФЗ о банкротстве).
        Не анализируй вознаграждение, отчётность, субагентство или прекращение.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие 5 полей (всего 5 ключей в JSON):

        1. title_transfer_regime — момент перехода права собственности:
           • "at_delivery_to_principal" — собственность переходит при передаче
             товаров/имущества от агента принципалу;
           • "at_payment_by_principal" — собственность переходит при оплате
             принципалом;
           • "retained_by_agent_until_resale" — собственность переходит к агенту
             до момента перепродажи третьему лицу (⚠️ банкротный риск);
           • "by_operation_of_law_996" — прямо указано, что имущество является
             собственностью принципала по ст. 996 ГК РФ (или аналогичная формулировка);
           • "not_defined" — момент перехода не урегулирован (применяется дефолт
             ст. 996 ГК РФ — собственность принципала).

        2. bankruptcy_protection_clause — наличие защиты от банкротства агента:
           • "explicit_segregation" — договор содержит явные механизмы обособления
             имущества принципала (обособленный баланс, запрет залога, маркировка,
             запрет включения в обеспечение);
           • "reference_to_996" — договор прямо ссылается на ст. 996 ГК РФ
             (собственность принципала), но без дополнительных механизмов обособления;
           • "not_defined" — защитные оговорки отсутствуют.

        3. title_transfer_details — фактический текст условия о моменте и порядке
           перехода права собственности (до 200 символов).
           Если не урегулировано — «Данные не определены (дефолт ст. 996 ГК РФ)».

        4. bankruptcy_risk_details — фактический текст механизмов обособления
           или их отсутствия (до 250 символов).
           Если обнаружен red flag (собственность переходит к агенту) — начни с ⚠️.
           Если не урегулировано — «Данные не определены».

        5. title_transfer_summary — сводный вывод одной фразой на русском для юриста,
           объединяющий режим перехода собственности и уровень банкротного риска.
        </task>

        <rules>
        - Используй только текст договора.
        - По ст. 996 ГК РФ (дефолт) имущество, приобретённое за счёт принципала, —
          собственность принципала. Если договор молчит — title_transfer_regime = "not_defined",
          но в summary укажи дефолт.
        - Если договор устанавливает переход собственности к агенту — это red flag,
          обязательно отрази в bankruptcy_risk_details с ⚠️.
        - Отсылка к приложению/спецификации = defined.
        - Верни РОВНО один валидный JSON-объект со всеми 5 ключами, пригодный для
