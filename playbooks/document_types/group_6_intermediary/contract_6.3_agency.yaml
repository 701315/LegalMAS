compliance_rules: []

# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 4: CHECKS_V8 — единственный рабочий слой юридического анализа
#  Читается: DocTypeCheckLoader._load_doc_type_checks()
# ════════════════════════════════════════════════════════════════════════════

checks_v8:

  - id: agency_subject_extraction
    name: "Базовое извлечение структуры агентского договора"
    description: >
      Извлекает принципала, агента, предмет, модель агентирования (от имени принципала /
      от своего имени / смешанная), вознаграждение, отчётность, exclusivity, субагентство
      и tail commission. Паспортный чек типа сделки по Главе 52 ГК РФ.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "агентский договор"
        - "принципал"
        - "агент"
        - "агентское вознаграждение"
        - "отчет агента"
        - "отчёт агента"
        - "от имени принципала"
        - "от своего имени"
        - "субагент"
        - "эксклюзивн"
        - "исключительн"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)(агентск(ий|ого)\\s+договор|принципал|агент)"
        - "(?i)(от\\s+имени\\s+принципала|от\\s+своего\\s+имени)"
        - "(?i)вознаграждени[ея].{0,30}агент"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется агентский договор по Главе 52 ГК РФ (ст. 1005-1011).
        Проверяется один вопрос: ключевые параметры агентского договора.

        Нормативный ориентир:
        - ст. 1005 ГК РФ — агентский договор, модели действия агента
        - ст. 1006 ГК РФ — агентское вознаграждение
        - ст. 1007 ГК РФ — ограничения прав сторон (эксклюзивность)
        - ст. 1008 ГК РФ — отчёты агента
        - ст. 1009 ГК РФ — субагентский договор
        - ст. 1011 ГК РФ — применение к агентским отношениям правил о поручении и комиссии

        Важно:
        - Твоя задача — установить, что прямо есть в тексте договора, а чего прямо нет.
        - Не оценивай серьёзность риска.
        - Если параметр определяется через приложение / задание / заявку / отчёт / протокол —
          это валидный факт (defined). В фактовое поле пиши «Согласно Приложению №…»,
          «Согласно ежемесячным заявкам Принципала» и т.п.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Принципал (наименование / ФИО).
        2. Агент (наименование / ФИО).
        3. Модель агентирования (от имени принципала / от своего имени / смешанная).
        4. Предмет (сфера действий агента).
        5. Статус вознаграждения.
        6. Наличие явного условия об отчётности.
        7. Наличие явного условия о субагентстве.
        8. Наличие условия об эксклюзивности (exclusivity).
        9. Наличие условия о хвостовом вознаграждении (tail commission — вознаграждение
           за сделки, совершённые после прекращения договора с клиентами, привлечёнными агентом).

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Если параметр определяется через приложение / заявку / отчёт — это defined,
           значение фактового поля = «Согласно [ссылка]».
        4. Если данных в тексте прямо нет — статусное поле = "not_defined",
           текстовое поле = "Данные не определены".
        5. Не используй "None", "null", пустые строки или значения вне allowed_values.
        6. В evidence включай только текст договора.
        7. Верни РОВНО один валидный JSON-объект со всеми 9 ключами, пригодный для парсинга
           через json.loads без предварительной обработки. Без markdown, без ```json,
           без комментариев, без текста до или после. Начни ответ сразу с { и закончи }.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — параметры определены:
        Фрагмент:
        "Принципал — ООО «Альфа» поручает, а Агент — Иванов И.И. обязуется
        от своего имени, но за счёт Принципала совершать действия по продвижению
        товаров. Вознаграждение — 10% от суммы сделок. Агент представляет отчёт
        ежемесячно. Субагентство допускается с согласия Принципала."

        Ответ:
        {
          "principal": "ООО «Альфа»",
          "agent": "Иванов И.И.",
          "agency_model": "own_name_model",
          "actions_scope": "продвижение товаров",
          "remuneration_status": "defined",
          "reporting_status": "defined",
          "subagency_status": "defined",
          "exclusivity_status": "not_defined",
          "tail_commission_status": "not_defined"
        }

        Пример 2 — данные отсутствуют:
        Фрагмент:
        "Стороны заключили настоящий договор."

        Ответ:
        {
          "principal": "Данные не определены",
          "agent": "Данные не определены",
          "agency_model": "not_defined",
          "actions_scope": "Данные не определены",
          "remuneration_status": "not_defined",
          "reporting_status": "not_defined",
          "subagency_status": "not_defined",
          "exclusivity_status": "not_defined",
          "tail_commission_status": "not_defined"
        }

        Пример 3 — смешанная модель + отсылка к приложению:
        Фрагмент:
        "Агент вправе совершать сделки как от имени Принципала, так и от собственного
        имени в зависимости от указаний Принципала в конкретных заявках. Размер
        агентского вознаграждения определяется в Приложении №1 к настоящему договору."

        Ответ:
        {
          "principal": "Данные не определены",
          "agent": "Данные не определены",
          "agency_model": "mixed_or_unclear",
          "actions_scope": "Согласно заявкам Принципала",
          "remuneration_status": "defined",
          "reporting_status": "not_defined",
          "subagency_status": "not_defined",
          "exclusivity_status": "not_defined",
          "tail_commission_status": "not_defined"
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        Проверь, что все 9 ключей присутствуют в JSON:
        1. Найди прямую цитату о принципале.
        2. Найди прямую цитату об агенте.
        3. Найди прямую цитату о модели действия (от чьего имени и за чей счёт).
        4. Найди прямую цитату о предмете (или отсылку к приложению/заявкам).
        5. Убедись, что значения статусных полей — строго из allowed_values.

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "principal": "<текст или 'Данные не определены'>",
          "agent": "<текст или 'Данные не определены'>",
          "agency_model": "<principal_name_model / own_name_model / mixed_or_unclear / not_defined>",
          "actions_scope": "<текст или 'Данные не определены'>",
          "remuneration_status": "<defined / unclear / not_defined>",
          "reporting_status": "<defined / not_defined>",
          "subagency_status": "<defined / not_defined>",
          "exclusivity_status": "<defined / not_defined>",
          "tail_commission_status": "<defined / not_defined>"
        }
      context_k: 8
      temperature: 0.0
      max_tokens: 750

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "агентский договор принципал агент от имени принципала от своего имени за счёт принципала агентское вознаграждение процент от сделок отчёт агента предмет действий продвижение товаров поиск клиентов субагент эксклюзивность исключительное право хвостовое вознаграждение"
      retrieval_profile: "scope_of_work_check"
      preferred_unit_types:
        - obligation
        - general_provision
        - representations
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - representations
        - procedures
      negative_keywords:
        - "означает"
        - "в целях настоящего"
        - "приложение является"
        - "расторжение"
        - "прекращение"
      position_bias:
        preferred_range: [0.0, 0.35]
        boost: 0.20
        scope: segment
      context_k: 8
      max_chunks: 12
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
        - "invoice"
      preferred_clause_functions:
        - "obligations"
        - "representations"
        - "procedures"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 50
      max_snippet_length: 700

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1200
      compact_output: false
      store_payload: true
      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста агентского договора ключевые
        параметры: принципала, агента, модель агентирования, предмет, вознаграждение,
        отчётность, субагентство, эксклюзивность (exclusivity), хвостовое вознаграждение
        (tail commission). Не анализируй ответственность, споры или прекращение.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие 9 полей (всего 9 ключей в JSON):

        1. principal — принципал (наименование / ФИО).
        2. agent — агент (наименование / ФИО).
        3. agency_model — "principal_name_model" / "own_name_model" / "mixed_or_unclear" / "not_defined".
        4. actions_scope — предмет действий агента (или ссылка на приложение/заявки).
        5. remuneration_status — "defined" / "unclear" / "not_defined".
        6. reporting_status — "defined" / "not_defined".
        7. subagency_status — "defined" / "not_defined".
        8. exclusivity_status — "defined" / "not_defined".
        9. tail_commission_status — "defined" / "not_defined".

        Если данные отсутствуют в тексте:
        - текстовое поле = "Данные не определены"
        - статусное поле = "not_defined"

        Если параметр определяется через приложение / задание / заявку / отчёт /
        протокол — это valid factual value (defined). В текстовое поле пиши
        «Согласно Приложению №…», «Согласно заявкам Принципала» и т.п.
        </task>

        <rules>
        - Используй только текст договора.
        - agency_model:
          • "principal_name_model" — прямо указано «от имени Принципала» / «от имени и за счёт Принципала»;
          • "own_name_model" — прямо указано «от своего имени, но за счёт Принципала» / «от своего имени»;
          • "mixed_or_unclear" — в разных местах договора модель указана по-разному, либо
            допускается выбор модели по каждой сделке / заявке, либо формулировка размыта;
          • "not_defined" — модель не указана вообще.
        - Значения statuс-полей — строго из allowed_values.
        - Верни РОВНО один валидный JSON-объект со всеми 9 ключами, пригодный для
          парсинга через json.loads без предварительной обработки. Без markdown,
          без ```json, без комментариев. Начни с { и закончи }.
        </rules>

        <cove>
        Перед ответом проверь, что все 9 ключей (9 полей) присутствуют в JSON
        и значения статусных полей — строго из allowed_values.
        </cove>
      fields:
        - name: "principal"
          type: "string"
          presentation: "fact"
          label: "Принципал"
          description: "Принципал по агентскому договору."
          required: true
          display_in_grid: true
          display_priority: 1
        - name: "agent"
          type: "string"
          presentation: "fact"
          label: "Агент"
          description: "Агент по агентскому договору."
          required: true
          display_in_grid: true
          display_priority: 2
        - name: "agency_model"
          type: "string"
          presentation: "signal"
          allowed_values: ["principal_name_model", "own_name_model", "mixed_or_unclear", "not_defined"]
          description: "Модель агентирования (машиночитаемый код)."
          required: true
        - name: "agency_model_display"
          type: "string"
          presentation: "fact"
          label: "Модель агентирования"
          description: >
            Модель агентирования в человекочитаемом виде: «От имени принципала» /
            «От своего имени» / «Смешанная / неясно» / «Не определено».
            Формируется backend'ом из agency_model.
          required: true
          display_in_grid: true
          display_priority: 3
        - name: "actions_scope"
          type: "string"
          presentation: "fact"
          label: "Предмет действий"
          description: "Сфера действий агента или ссылка на приложение/заявки."
          required: true
          display_in_grid: true
          display_priority: 4
        - name: "remuneration_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "unclear", "not_defined"]
          description: "Наличие условия о вознаграждении агента."
          required: false
        - name: "reporting_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Наличие явного условия об отчётности агента (ст. 1008 ГК РФ)."
          required: false
        - name: "subagency_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Наличие явного условия о субагентстве (ст. 1009 ГК РФ)."
          required: false
        - name: "exclusivity_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Наличие условия об эксклюзивности / исключительности (ст. 1007 ГК РФ)."
          required: false
        - name: "tail_commission_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: >
            Наличие условия о хвостовом вознаграждении (tail commission) —
            вознаграждении за сделки после прекращения договора с клиентами,
            привлечёнными агентом.
          required: false

  - id: agency_model_and_authority_check
    name: "Модель агентирования и доверенность"
    description: >
      Проверяет выбранную модель действий агента (от имени принципала или
      от своего имени), её последствия — субсидиарный режим (поручение / комиссия
      по ст. 1011 ГК РФ) и наличие доверенности (ст. 185, 1005 ГК РФ) при
      модели «от имени принципала». Формирует сводный вывод для юриста.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "от имени принципала"
        - "от своего имени"
        - "за счет принципала"
        - "за счёт принципала"
        - "права и обязанности возникают у принципала"
        - "права и обязанности возникают у агента"
        - "доверенность"
        - "полномочия агента"
        - "нормы о договоре поручения"
        - "нормы о договоре комиссии"
        - "правила главы 49"
        - "правила главы 51"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)от\\s+имени\\s+принципала"
        - "(?i)от\\s+своего\\s+имени"
        - "(?i)доверенност(ь|и|ью|ей)"
        - "(?i)глав[аы]\\s+(49|51)"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется агентский договор по Главе 52 ГК РФ.
        Проверяется один вопрос: модель действий агента, её субсидиарный режим
        (поручение / комиссия) и наличие доверенности.

        Нормативный ориентир:
        - ст. 1005 ГК РФ — модели действия агента (от имени принципала / от своего имени)
        - ст. 1011 ГК РФ — субсидиарное применение к агентским отношениям правил
          о договоре поручения (при модели «от имени принципала», гл. 49 ГК РФ)
          или о договоре комиссии (при модели «от своего имени», гл. 51 ГК РФ)
        - ст. 185 ГК РФ — доверенность
        - ст. 183 ГК РФ — заключение сделки неуполномоченным лицом

        Ключевые практические замечания:
        - Субсидиарный режим по ст. 1011 применяется АВТОМАТИЧЕСКИ в зависимости
          от модели, даже если договор об этом молчит. Однако в договоре может
          быть и прямое указание — эти ситуации нужно различать.
        - При модели «от имени принципала» доверенность НЕОБХОДИМА (ст. 1005 п. 1
          абз. 3, ст. 185). Её отсутствие в договоре — существенный риск (ст. 183 ГК РФ).
        - При модели «от своего имени» доверенность НЕ ТРЕБУЕТСЯ.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Модель агентирования (от имени принципала / от своего имени / смешанная).
        2. Субсидиарный режим (явно указан в договоре или применяется по закону).
        3. Статус доверенности (выдана / должна быть выдана / не требуется / отсутствует).

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Если статус вычисляется из модели по закону (напр., доверенность
           не требуется при «от своего имени») — используй специальное значение
           ("not_required" / "by_operation_of_law"), а не "not_defined".
        4. Если параметр определяется через приложение (напр., «доверенность
           оформляется по форме Приложения №N») — это defined-факт.
        5. Если данных в тексте прямо нет — используй "not_defined".
        6. Не используй "None", "null", пустые строки или значения вне allowed_values.
        7. В evidence включай только текст договора.
        8. Верни РОВНО один валидный JSON-объект со всеми 4 ключами, пригодный
           для парсинга через json.loads без предварительной обработки.
           Без markdown, без ```json, без комментариев, без текста до или после.
           Начни ответ сразу с { и закончи }.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — «от имени», доверенность выдана, режим явно указан:
        Фрагмент:
        "Агент действует от имени и за счёт Принципала на основании доверенности,
        выданной одновременно с настоящим договором. К отношениям сторон
        применяются нормы о договоре поручения (глава 49 ГК РФ)."

        Ответ:
        {
          "agency_model": "principal_name_model",
          "subsidiary_regime": "mandate_explicit",
          "poa_status": "granted_no_details",
          "authority_summary": "От имени принципала; режим поручения (явно указан); доверенность выдана"
        }

        Пример 2 — «от своего имени», молчание о режиме и доверенности:
        Фрагмент:
        "Агент обязуется от своего имени, но за счёт Принципала совершать сделки
        по продаже товаров Принципала третьим лицам."

        Ответ:
        {
          "agency_model": "own_name_model",
          "subsidiary_regime": "by_operation_of_law",
