      required_kind: "legal_unit"
      retrieval_query: "ответственность агента ответственность принципала неустойка возмещение убытков ограничение ответственности агент не отвечает за делькредере del credere"
      retrieval_profile: "indemnification_check"
      preferred_unit_types:
        - liability_provision
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - remedies
        - limitations
      negative_keywords:
        - "означает"
        - "в целях настоящего"
        - "вознаграждение"
        - "отчёт"
        - "субагент"
        - "эксклюзивность"
        - "расторжение"
      position_bias:
        preferred_range: [0.50, 0.90]
        boost: 0.12
        scope: segment
      context_k: 5
      max_chunks: 6
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
        - "invoice"
      preferred_clause_functions:
        - "remedies"
        - "limitations"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 500

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 500
      compact_output: false

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста агентского договора сведения
        об ответственности сторон, делькредере и неустойках.
        Не анализируй вознаграждение, отчётность или прекращение.
        </role>

        <context>
        {context}
        </context>

        <task>
        1. agent_liability_for_third_parties — "yes" / "no" / "del_credere" / "not_defined".
        2. liability_cap_status — "defined" / "not_defined".
        3. penalty_clause_status — "defined" / "not_defined".
        </task>

        <rules>
        - Используй только текст договора.
        - agent_liability_for_third_parties: "del_credere" — если прямо указано делькредере;
          "yes" — если агент прямо отвечает за третьих лиц;
          "no" — если прямо указано, что не отвечает;
          "not_defined" — если не указано.
        - Верни только JSON.
        </rules>
      fields:
        - name: "agent_liability_for_third_parties"
          type: "string"
          presentation: "signal"
          allowed_values: ["yes", "no", "del_credere", "not_defined"]
          description: "Ответственность агента за третьих лиц."
          required: true
        - name: "liability_cap_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Наличие ограничения ответственности."
          required: false
        - name: "penalty_clause_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Наличие неустойки."
          required: false
      store_payload: true

# ════════════════════════════════════════════════════════════════════════════
# БЛОК 5: DD_REQUEST_TEMPLATES
# Читается: DDRequestTemplateLoader
# ════════════════════════════════════════════════════════════════════════════

dd_request_templates:
  agency_subject_extraction:
    text: >
      Просим предоставить по {doc_names}: базовую структуру агентского договора —
      принципала, агента, предмет действий, модель агентирования, вознаграждение,
      порядок отчётности, exclusivity, субагентство и post-termination условия.
    addressee: "Принципал / Агент"

  agency_model_and_authority_check:
    text: >
      Просим уточнить по {doc_names}: действует ли агент от имени принципала
      или от своего имени, какие права и обязанности возникают у сторон,
      субсидиарный режим (поручение/комиссия) и наличие доверенности.
    addressee: "Юридический советник"

  remuneration_and_payment_trigger_check:
    text: >
      Просим предоставить по {doc_names}: структуру вознаграждения, триггеры оплаты,
      условия tail commission (постконтрактное вознаграждение).
    addressee: "Принципал / Агент"

  reporting_and_settlement_check:
    text: >
      Просим предоставить по {doc_names}: порядок отчётов агента, срок возражений,
      связь отчёта с оплатой.
    addressee: "Агент / Принципал"

  funds_and_assets_control_check:
    text: >
      По {doc_names} просим: порядок учёта средств принципала, сроки перечисления
      выручки, наличие специального счёта или обособленного учёта.
    addressee: "Агент / Принципал"

  exclusivity_and_non_compete_check:
    text: >
      Просим уточнить по {doc_names}: exclusivity, территорию, non-compete,
      последствия нарушения эксклюзивности.
    addressee: "Принципал / Агент"

  subagency_check:
    text: >
      По {doc_names} просим: режим субагентства, необходимость согласия принципала,
      ответственность агента за субагента.
    addressee: "Агент / Юридический советник"

  anti_requalification_and_kpi_check:
    text: >
      Просим предоставить по {doc_names}: анти-трудовые safeguard clauses,
      формулировку самостоятельности агента, KPI и их связь с вознаграждением.
      ВНИМАНИЕ: формулировка KPI должна исключать признаки трудовой функции.
    addressee: "Юридический советник / HR"

  client_database_ownership:
    text: >
      Просим согласовать для {doc_names}: кому принадлежит клиентская база
      (принципалу/агенту/совместно), порядок доступа и передачи при расторжении.
    addressee: "Обе стороны"

  expense_reimbursement_check:
    text: >
      Просим согласовать для {doc_names}: порядок возмещения расходов агента,
      перечень возмещаемых расходов, бюджет, требования к документации.
    addressee: "Обе стороны"

  termination_and_post_contract_check:
    text: >
      Просим уточнить по {doc_names}: порядок прекращения, завершение начатых
      поручений, окончательный расчёт, постконтрактные обязательства.
    addressee: "Обе стороны"

  liability_and_indemnity_check:
    text: >
      Просим согласовать для {doc_names}: распределение ответственности,
      ограничение ответственности, делькредере, неустойки.
    addressee: "Юридический советник"

  _default:
    text: >
      Просим предоставить дополнительную информацию по вопросу «{check_name}»
      применительно к {doc_names}.
    addressee: "Юридический советник"


    