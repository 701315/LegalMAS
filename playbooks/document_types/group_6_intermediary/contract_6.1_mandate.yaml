        Без markdown, без ```json, без комментариев, без текста до или после.
        Начни ответ сразу с { и закончи }.
        </task>

        <rules>
        - Используй только текст договора.
        - Не делай предположений.
        - actions_specificity:
          "specific" — все действия перечислены определённо и проверяемо;
          "partial" — часть действий перечислена конкретно, часть дана общей
          формулой (например, «заключить договор аренды и совершить иные
          необходимые действия»);
          "generic" — только общие формулы («любые необходимые действия»);
          "not_defined" — предмет не описан.
