  date_pattern: "(?i)\\b\\d{1,2}[.]\\d{1,2}[.]\\d{4}\\b"
  poa_pattern: "(?i)доверенн(ость|ости)\\s*(?:№|N|No\\.)?\\s*[A-ZА-Я0-9\\-\\/]*"
