# ════════════════════════════════════════════════════════════════════════════

dd_request_templates:

  mandate_subject_extraction:
    text: >
      Просим предоставить по {doc_names}: сведения о доверителе и поверенном,
      точный предмет поручения, объем полномочий, доверенность, условия отчетности,
      вознаграждение, расходы и порядок прекращения договора.
    addressee: "Доверитель / Поверенный"

  subject_legal_actions_check:
    text: >
      Просим уточнить в {doc_names}: исчерпывающий перечень юридических действий,
      которые должен совершить поверенный, и исключить чрезмерно общие формулы
      вроде "любые необходимые действия".
    addressee: "Юридический советник"

  subject_legal_actions:
    text: >
      Просим конкретизировать по {doc_names} предмет поручения:
      какие именно сделки/заявления/действия должен совершить поверенный,
      в отношении каких лиц и в какие сроки.
    addressee: "Доверитель"

  poa_and_authority_check:
    text: >
      Просим предоставить по {doc_names}: проект доверенности, перечень полномочий,
      сведения о необходимости нотариальной формы и подтверждение того,
      что объем доверенности соответствует предмету поручения.
    addressee: "Доверитель / Юридический советник"

  power_of_attorney_obligation:
    text: >
      Просим уточнить в {doc_names}: обязанность доверителя выдать доверенность,
      ее форму, срок действия, объем полномочий и порядок отзыва.
    addressee: "Доверитель"

  representation_without_poa_logic:
    text: >
      В {doc_names} выявлены представительские действия без достаточной механики доверенности.
      Просим срочно уточнить форму, объем и порядок выдачи доверенности.
    addressee: "Юридический советник / Доверитель"

  authority_limits_and_conflict_check:
    text: >
      Просим уточнить по {doc_names}: пределы полномочий поверенного,
      лимиты сумм/сделок, необходимость предварительного согласования существенных действий,
      а также ограничения, связанные с конфликтом интересов.
    addressee: "Доверитель / Юридический советник"

  scope_of_authority_limitation:
    text: >
      Просим включить/уточнить в {doc_names}: конкретные пределы полномочий поверенного,
      запрет на совершение несанкционированных сделок и лимиты по сумме/видам действий.
    addressee: "Юридический советник"

  conflict_of_interest_prohibition:
    text: >
      Просим включить/уточнить в {doc_names}: запрет на сделки с самим собой,
      двойное представительство без согласия доверителя, а также обязанность
      незамедлительно раскрывать конфликт интересов.
    addressee: "Юридический советник"

  acts_in_own_name_red_flag:
    text: >
      В {doc_names} выявлен риск того, что исполнитель действует от своего имени,
      что противоречит модели поручения и может указывать на комиссию.
      Просим скорректировать договорную модель или подтвердить верную квалификацию сделки.
    addressee: "Юридический советник"

  instructions_of_principal:
    text: >
      Просим уточнить по {doc_names}: какие указания доверителя обязательны для поверенного,
      как они оформляются, как изменяются и как поверенный должен действовать
      при неясных или противоречивых инструкциях.
    addressee: "Доверитель / Юридический советник"

  reporting_and_transfer_check:
    text: >
      Просим предоставить по {doc_names}: форму и периодичность отчета поверенного,
      перечень подтверждающих документов, порядок принятия/оспаривания отчета
      и срок передачи доверителю всего полученного по сделкам.
    addressee: "Поверенный / Доверитель"

  reporting_obligations:
    text: >
      Просим уточнить в {doc_names}: сроки представления отчетов,
      обязательные приложения к отчету и процедуру его согласования доверителем.
    addressee: "Поверенный"

  transfer_of_proceeds_obligation:
    text: >
      Просим уточнить в {doc_names}: срок и порядок передачи доверителю
      всех денежных средств, имущества и документов, полученных поверенным
      в связи с исполнением поручения.
    addressee: "Поверенный"

  expense_reimbursement_procedure:
    text: >
      Просим уточнить по {doc_names}: какие расходы поверенного возмещаются,
      требуется ли предварительное согласование/авансирование,
      и какие документы подтверждают такие расходы.
    addressee: "Доверитель / Поверенный"

  remuneration_terms:
    text: >
      Просим уточнить в {doc_names}: является ли договор возмездным,
      каков размер вознаграждения поверенного, база его расчета
      и порядок выплаты при полном и частичном исполнении поручения.
    addressee: "Обе стороны"

  subdelegation_check:
    text: >
      По {doc_names} с передоверием просим предоставить:
      условия допустимости передоверия, форму согласия доверителя,
      требования к заместителю и распределение ответственности за его действия.
    addressee: "Поверенный / Юридический советник"

  subdelegation_control:
    text: >
      Просим уточнить в {doc_names}: допускается ли передоверие,
      нужно ли письменное согласие доверителя и как контролируется деятельность заместителя.
    addressee: "Юридический советник"

  subdelegation_without_control:
    text: >
      В {doc_names} выявлен риск передоверия без достаточного контроля.
      Просим установить запрет либо четкий режим письменного согласия доверителя
      и ответственности поверенного за выбор заместителя.
    addressee: "Юридический советник"

  termination_and_revocation_check:
    text: >
      Просим уточнить по {doc_names}: порядок отмены поручения,
      отказа поверенного, возврата доверенности, уведомления третьих лиц,
      завершения текущих дел и окончательного расчета между сторонами.
    addressee: "Обе стороны"

  termination_settlement_procedure:
    text: >
      Просим включить/уточнить в {doc_names}: последствия прекращения поручения,
      возврат доверенности и документов, сроки передачи дел и порядок окончательных расчетов.
    addressee: "Юридический советник"

  revocation_notice_gap:
    text: >
      В {doc_names} отсутствует достаточный механизм отзыва доверенности
      и уведомления третьих лиц. Просим срочно уточнить порядок возврата доверенности,
      ее отмены и информирования контрагентов/госорганов.
    addressee: "Юридический советник / Доверитель"

  commercial_representation_specifics:
    text: >
      По {doc_names} с признаками коммерческого представительства просим предоставить:
      обоснование статуса коммерческого представителя, специальные условия,
      письменные согласия на возможное представление обеих сторон сделки
      и порядок раскрытия конфликта интересов.
    addressee: "Юридический советник / Поверенный"

  # Generic fallback
  _default:
    text: >
      Просим предоставить дополнительную информацию по вопросу «{check_name}»
      применительно к {doc_names}.
    addressee: "Юридический советник"