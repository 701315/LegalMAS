  - id: instructions_and_expenses_check
    name: "Указания доверителя и возмещение расходов"
    description: >
      Проверяет наличие указаний доверителя и их обязательность для поверенного
      (ст. 973 ГК РФ), а также порядок возмещения расходов и авансирования
      (ст. 975 ГК РФ). Выявляет риски: отсутствие механизма возмещения
      при фактическом несении расходов поверенным и неопределённость
      указаний, ведущую к спорам о пределах полномочий.
