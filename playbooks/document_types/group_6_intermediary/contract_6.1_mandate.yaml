           Начни ответ сразу с { и закончи }.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — полный режим одобрения:
        Фрагмент:
        "Сделки, совершённые Поверенным с превышением полномочий, считаются
