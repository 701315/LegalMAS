           Если presence = "missing":
           - completion_criterion_status = "not_defined";
           - completion_fixing_status = "not_defined";
           - completion_moment_status = "not_defined";
           - post_completion_duties_status = "not_defined";
           - completion_moment_verdict = "Данные не определены";
           - не выполняй остальные шаги.

        1. completion_criterion_status:
           - "defined" — прямо указано, что считается исполнением поручения
             (совершение сделки, регистрация, передача результата, подписание
             акта и т. п.);
