# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 4: CHECKS_V8 — единственный рабочий слой юридического анализа
#  Читается: DocTypeCheckLoader._load_doc_type_checks()
# ════════════════════════════════════════════════════════════════════════════

checks_v8:


- id: mandate_subject_extraction
  name: "Базовое извлечение структуры договора поручения"
  description: >
    Извлекает доверителя, поверенного, предмет поручения, модель действий
    (от имени доверителя / от своего имени), статус доверенности,
    возмездность, отчетность и условия прекращения.
  triggers: {}
  ui_mode: "field_extraction"
  severity: "critical"
  severity_if_pass: "pass"
  severity_if_fail: "critical"
  severity_if_unclear: "high"
  origin: "DOCUMENT_TYPE"
  detector_type: "hybrid"

  rules:
    keywords:
      - "договор поручения"
      - "поверенный"
      - "доверитель"
      - "от имени доверителя"
      - "доверенность"
      - "юридические действия"
      - "отчет поверенного"
    keyword_mode: "any"
    regex_patterns:
      - "(?i)(договор\\s+поручения|поверенн(ый|ого)|доверител(ь|я))"
      - "(?i)(от\\s+имени\\s+доверителя|за\\s+счет\\s+доверителя)"
      - "(?i)доверенн(ость|ости)"

  llm:
    prompt_template: |
      [КОНТЕКСТ]
      Ты — российский юрист по договорной работе.
      Анализируется договор поручения по Главе 49 ГК РФ (ст. 971–979).
      Проверяется только один вопрос: ключевые параметры договора поручения.

      Нормативный ориентир:
      - ст. 971 ГК РФ — договор поручения
      - ст. 972 ГК РФ — возмездность договора поручения
      - ст. 975 ГК РФ — обязанности поверенного (в том числе представление отчёта)
      - ст. 977 ГК РФ — основания прекращения договора поручения
      - ст. 182 ГК РФ — представительство

      Важно:
      - Твоя задача — только установить, что прямо есть в тексте договора,
        а чего прямо нет.
      - Не оценивай серьёзность риска.

      [ЗАДАЧА]
      Найди в тексте договора:
      1. Доверитель (наименование / ФИО).
      2. Поверенный (наименование / ФИО).
      3. Предмет поручения (перечень юридических действий).
      4. От чьего имени действует поверенный.
      5. Статус доверенности.
      6. Статус возмездности.
      7. Наличие отчётности.
      8. Наличие условий прекращения.

      [ПРАВИЛА]
      1. Используй только текст документа.
      2. Не подставляй нормы закона вместо текста договора.
      3. Для текстовых полей: если данные не указаны прямо — возвращай
         строку "Данные не определены".
      4. Для статусных полей: если данные не указаны прямо — возвращай
         значение "not_defined" из соответствующего enum.
      5. Если условие прямо указано как отсутствующее (например, «отчётность
         не предусмотрена») — используй "absent" (для reporting_status
         и termination_status). Если параметр определяется через отсылку
         к иному документу или соглашению — используй соответствующее
