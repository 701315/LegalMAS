          "dual_representation_status": "present",
          "written_form_status": "present",
          "evidence": "Поверенный действует в качестве коммерческого представителя Доверителя в сфере оптовой торговли. Поверенный вправе одновременно представлять интересы покупателей при условии получения их предварительного письменного согласия."
        }

        Пример 2 — данные отсутствуют (обычное поручение):
        Фрагмент:
        "Поверенный обязуется совершить от имени Доверителя действия по согласованию условий договора поставки."

        Ответ:
        {
          "commercial_rep_status": "not_defined",
          "dual_representation_status": "not_defined",
          "written_form_status": "not_defined",
          "evidence": "Поверенный обязуется совершить от имени Доверителя действия по согласованию условий договора поставки."
        }

        Пример 3 — коммерческий представитель, но двойное представительство запрещено:
        Фрагмент:
        "Поверенный осуществляет коммерческое представительство интересов Доверителя. Поверенному строго запрещается выступать представителем контрагентов Доверителя по совершаемым сделкам."

        Ответ:
        {
          "commercial_rep_status": "present",
          "dual_representation_status": "absent",
          "written_form_status": "not_defined",
          "evidence": "Поверенный осуществляет коммерческое представительство интересов Доверителя. Поверенному строго запрещается выступать представителем контрагентов Доверителя по совершаемым сделкам."
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Проверь, что все 4 ключа (3 поля + evidence) присутствуют в JSON.
        2. Найди прямую цитату о статусе коммерческого представителя (или деятельности в качестве такового).
        3. Найди прямую цитату о возможности или запрете одновременного представительства обеих сторон сделки.
