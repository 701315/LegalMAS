type: contract_6.1_mandate
name: "Договор поручения"
version: 6.0
parent: class_6_intermediary
description: |
  Фидуциарный (лично-доверительный) договор, по которому поверенный обязуется
  совершить от имени и за счет доверителя определенные юридические действия.
  Права и обязанности по сделкам, совершенным поверенным в пределах полномочий,
  возникают непосредственно у доверителя. Для совершения юридически значимых
  действий, требующих представительства перед третьими лицами, как правило,
  необходима доверенность. Каждая сторона вправе в одностороннем порядке
  отказаться от договора в любое время. Регулируется Главой 49 ГК РФ
  во взаимосвязи с нормами о представительстве и доверенности.
  На практике основными рисками являются превышение полномочий поверенным,
  недостаточная конкретизация юридических действий, отсутствие или дефекты
  доверенности, конфликт интересов, передоверие без контроля, споры о расходах,
  отчете и последствиях прекращения договора.
metadata:
  category: contract
  subcategory: intermediary
  complexity: high
  risk_level: critical
  jurisdiction: RU
  language: ru
  legal_base: "Глава 49 ГК РФ (ст. 971-979), Глава 10 ГК РФ (ст. 182-189)"
  doc_types_supported:
    - "договор поручения"
    - "договор представительства"
    - "договор на совершение юридических действий"
    - "договор на представление интересов"
    - "договор поручения на заключение сделок"
    - "договор поручения на судебное представительство"
    - "договор коммерческого представительства"
    - "договор поручения с передоверием"
    - "договор судебного представительства"
    - "mandate agreement"
    - "representation agreement"
    - "authority to act agreement"
    - "agency mandate"
    - "power of attorney with mandate"

