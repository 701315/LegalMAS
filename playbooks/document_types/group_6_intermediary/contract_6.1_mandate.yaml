        - remuneration_verdict — короткая фраза для юриста:
          пример 1: «Возмездный, 50 000 руб., выплата по отчёту»;
          пример 2: «Безвозмездный — прямо указано в договоре»;
          пример 3: «Вознаграждение не оговорено — между предпринимателями
