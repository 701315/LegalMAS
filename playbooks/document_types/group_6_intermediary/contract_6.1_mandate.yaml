  - id: poa_and_authority_check
    name: "Доверенность и объём полномочий"
    description: >
      Проверяет наличие обязанности выдать доверенность, соответствие
      объёма полномочий предмету поручения и указание на нотариальную форму.
      Выявляет риски: отсутствие доверенности при сделках, требующих
      нотариальной формы (ст. 185.1 ГК РФ), и неопределённость полномочий,
      ведущую к риску превышения (ст. 183 ГК РФ).
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
