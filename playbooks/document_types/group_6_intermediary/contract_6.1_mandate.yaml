type: contract_6.1_mandate
name: "Договор поручения"

description: |
  Фидуциарный (лично-доверительный) договор, по которому поверенный обязуется
  совершить от имени и за счет доверителя определенные юридические действия.
  Права и обязанности по сделкам, совершенным поверенным в пределах полномочий,
  возникают непосредственно у доверителя. Для совершения юридически значимых
  действий, требующих представительства перед третьими лицами, как правило,
  необходима доверенность. Каждая сторона вправе в одностороннем порядке
  отказаться от договора в любое время. Регулируется Главой 49 ГК РФ
  во взаимосвязи с нормами о представительстве и доверенности.
  На практике основными рисками являются превышение полномочий поверенным,
  недостаточная конкретизация юридических действий, отсутствие или дефекты
  доверенности, конфликт интересов, передоверие без контроля, споры о расходах,
  отчете и последствиях прекращения договора.

version: 4.0
parent: class_6_intermediary

metadata:
  category: contract
  subcategory: intermediary
  complexity: high
  risk_level: critical
  jurisdiction: RU
  language: ru
  legal_base: "Глава 49 ГК РФ (ст. 971-979), Глава 10 ГК РФ (ст. 182-189)"
  doc_types_supported:
    - "договор поручения"
    - "договор представительства"
    - "договор на совершение юридических действий"
    - "договор на представление интересов"
    - "договор поручения на заключение сделок"
    - "договор поручения на судебное представительство"
    - "договор коммерческого представительства"
    - "договор поручения с передоверием"
    - "mandate agreement"
    - "representation agreement"

engine_expectations:
  evidence_required: true
  evidence_style: "pinpoint"
  allow_not_found: true
  output_style: "dd_grid"
  prefer_structured_outputs: true

# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 1: КЛАССИФИКАЦИЯ (L1/L2)
#  Читается: YAMLRegistry → L1FilenameClassifier, L2HeaderClassifier
# ════════════════════════════════════════════════════════════════════════════

classification_runtime_v1:

  rules:

    filename_patterns:
      - "(?i)поручени"
      - "(?i)доверител"
      - "(?i)поверенн"
      - "(?i)mandate"
      - "(?i)representation"

    folder_patterns:
      - "(?i)mandate"
      - "(?i)representation"
      - "(?i)поручени"
      - "(?i)представител"

    keywords:

      high:
        - "(?i)договор\\s+поручен[ияи]"
        - "(?i)договор\\s+представительств[аы]"
        - "(?i)договор\\s+на\\s+совершен[иеия]\\s+юридическ[ихие]\\s+действ[ийия]"
        - "(?i)договор\\s+на\\s+представлен[иеия]\\s+интерес[овы]"
        - "(?i)договор\\s+поручен[ияи]\\s+на\\s+заключен[иеия]\\s+сдел[окки]"
        - "(?i)договор\\s+поручен[ияи]\\s+на\\s+судебн[оеое\\s]*представительств[оа]"
        - "(?i)договор\\s+коммерческ[огоое]\\s+представительств[аы]"
        - "(?i)договор\\s+поручен[ияи]\\s+с\\s+передовер[иемия]"
        - "(?i)mandate\\s+agreement"
        - "(?i)representation\\s+agreement"
        - "(?i)поверенн[ыйое]\\b"
        - "(?i)доверител[ьяеи]"
        - "(?i)от\\s+имени\\s+доверител[яья]"
        - "(?i)за\\s+сч[её]т\\s+доверител[яья]"
        - "(?i)доверенност[ьи]"
        - "(?i)юридическ[иеих]\\s+действ[ияий]"

      medium:
        - "(?i)отч[её]т\\s+поверенн[оа]го"
        - "(?i)возмещени[ея]\\s+расход[оо]в"
        - "(?i)вознаграждени[ея]\\s+поверенн[оа]го"
        - "(?i)\\bпередовери[ея]\\b"
        - "(?i)указани[яя]\\s+доверител[яя]"
        - "(?i)отмен[аа]\\s+поручени[яя]"
        - "(?i)отказ\\s+от\\s+поручени[яя]"
        - "(?i)\\bпредставительств[ооа]\\b"
        - "(?i)коммерческ[иоя]+\\s+представител[ья]"

      low:
        - "(?i)оправдательн[ыо]е\\s+документ[ыо]"
        - "(?i)конфликт\\s+интерес[оо]в"
        - "(?i)возврат\\s+доверенност[ии]"
        - "(?i)судебн[оа]е\\s+представительств[оо]"
        - "(?i)нотариальн[а-яё]+\\s+доверенност[ьи]"

    exclusions:
      - "(?i)\\bкомисси[яяи]\\b"
      - "(?i)агентск[иоя]+\\s+договор\\s+по\\s+модел[ии]\\s+комисси[ии]"
      - "(?i)договор\\s+оказани[яя]\\s+услуг"
      - "(?i)трудов[оа]й\\s+договор"
      - "(?i)консультационн[ыо]е\\s+услуг[ии]"

# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 2: ТРИГГЕРЫ
#  Читается: TriggerDetector → doc.applicable_triggers
# ════════════════════════════════════════════════════════════════════════════

trigger_definitions:

  representation_required:
    any_keywords:
      - "(?i)заключени[ея]\\s+договор[аа]"
      - "(?i)\\bподписани[ея]\\b"
      - "(?i)государственн[а-яё]+\\s+регистраци[яи]"
      - "(?i)представлени[ея]\\s+интерес[оо]в"
      - "(?i)совершени[ея]\\s+сделк[ии]"
      - "(?i)подач[аа]\\s+документ[оо]в"
      - "(?i)судебн[оа]е\\s+представительств[оо]"

  poa_required:
    any_keywords:
      - "(?i)\\bдоверенност[ьи]\\b"
      - "(?i)полномоч[ияий]"
      - "(?i)\\bпредставител[ья]\\b"
      - "(?i)нотариальн[а-яё]+\\s+доверенност[ьи]"

  subdelegation_allowed:
    any_keywords:
      - "(?i)\\bпередовери[ея]\\b"
      - "(?i)\\bзаместител[ья]\\b"
      - "(?i)\\bсубповеренн[ыо]й\\b"
      - "(?i)передать\\s+исполнени[ея]"

  commercial_representation:
    any_keywords:
      - "(?i)коммерческ[иоя]+\\s+представител[ья]"
      - "(?i)ст\\.\\s*184"
      - "(?i)предпринимательск[а-яё]+\\s+деятельност[ьи]"
      - "(?i)может\\s+представлять\\s+обе\\s+сторон[ыа]"

  litigation_representation:
    any_keywords:
      - "(?i)\\bсуд\\b"
      - "(?i)арбитражн[ыо]й\\s+суд"
      - "(?i)\\bиск\\b"
      - "(?i)судебн[оа]е\\s+представительств[оо]"
      - "(?i)процессуальн[ыо]е\\s+документ[ыо]"

  principal_instructions_present:
    any_keywords:
      - "(?i)указани[яя]\\s+доверител[яя]"
      - "(?i)инструкци[ии]\\s+доверител[яя]"
      - "(?i)по\\s+согласовани[юю]\\s+с\\s+доверител[еем]"
      - "(?i)в\\s+соответстви[ии]\\s+с\\s+указани[яями]"

  reporting_required:
    any_keywords:
      - "(?i)отч[её]т\\s+поверенн[оа]го"
      - "(?i)отчитыватьс[яьа]"
      - "(?i)оправдательн[ыо]е\\s+документ[ыо]"
      - "(?i)отч[её]т\\s+о\\s+выполнени[ии]\\s+поручени[яя]"

  expense_reimbursement:
    any_keywords:
      - "(?i)возмещени[ея]\\s+расход[оо]в"
      - "(?i)аванс\\s+на\\s+расход[ыо]"
      - "(?i)документальн[оа]\\s+подтвержд[её]нн[ыо]е\\s+расход[ыо]"
      - "(?i)смет[аа]\\s+расход[оо]в"

  termination_sensitive:
    any_keywords:
      - "(?i)отмен[аа]\\s+поручени[яя]"
      - "(?i)отказ\\s+от\\s+поручени[яя]"
      - "(?i)прекращени[ея]\\s+договор[аа]"
      - "(?i)возврат\\s+доверенност[ии]"
      - "(?i)смерт[ьи]\\s+сторон[ыа]"

# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 3: SHARED PATTERNS
#  Читается: DocTypeCheckLoader через _resolve_yaml_templates()
# ════════════════════════════════════════════════════════════════════════════

shared_patterns:

  money_amount: "(?i)\\b\\d[\\d\\s]*(?:руб|рублей|₽|коп|тыс|млн|млрд)"
  date_pattern: "(?i)\\b\\d{1,2}[.]\\d{1,2}[.]\\d{4}\\b"
  poa_pattern: "(?i)доверенн(ость|ости)\\s*(?:№|N|No\\.)?\\s*[A-ZА-Я0-9\\-\\/]*"
  deadline_pattern: "(?i)(?:в течение|не позднее)\\s+\\d+\\s+(?:календарн|рабоч|дн|дня|дней)"

# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 4: COMPLIANCE RULES
#  Читается: DocTypeCheckLoader._exclusion_logic_to_checks()
# ════════════════════════════════════════════════════════════════════════════

compliance_rules:

  - id: "acts_in_own_name_red_flag"
    name: "Поверенный действует от своего имени"
    description: "Если по тексту договора исполнитель действует от своего имени, это риск переквалификации в комиссию или иную модель"
    legal_base: "ст. 971 ГК РФ, ст. 990 ГК РФ"
    required_triggers: []
    severity: "critical"
    result_if_triggered: "fail"
    detector_type: "rules"
    rules:
      keywords:
        - "от своего имени"
        - "совершает сделки от своего имени"
      keyword_mode: "any"
    retrieval:
      context_k: 4
      boost_keywords:
        - "от своего имени"
        - "от имени доверителя"
        - "поверенный"
      rerank: true

  - id: "representation_without_poa_logic"
    name: "Представительские действия без механики доверенности"
    description: "Если договор предусматривает юридически значимые действия перед третьими лицами, но не содержит логики выдачи доверенности, конструкция рискованна"
    legal_base: "ст. 182, 185, 975 ГК РФ"
    required_triggers: ["representation_required"]
    severity: "critical"
    result_if_triggered: "fail"
    detector_type: "rules"
    rules:
      negative_keywords:
        - "доверенность"
        - "полномочия"
        - "выдать доверенность"
        - "нотариальная доверенность"
      keyword_mode: "any"
    retrieval:
      context_k: 5
      boost_keywords:
        - "доверенность"
        - "полномочия"
        - "представление интересов"
      rerank: true

  - id: "subdelegation_without_control"
    name: "Передоверие без достаточного контроля"
    description: "Передоверие без ясного режима согласия доверителя и контроля над заместителем создает повышенный фидуциарный риск"
    legal_base: "ст. 976 ГК РФ"
    required_triggers: ["subdelegation_allowed"]
    severity: "critical"
    result_if_triggered: "fail"
    detector_type: "rules"
    rules:
      keywords:
        - "передоверие"
      negative_keywords:
        - "письменное согласие доверителя"
        - "запрет передоверия"
        - "ответственность за выбор заместителя"
      keyword_mode: "any"
    retrieval:
      context_k: 5
      boost_keywords:
        - "передоверие"
        - "согласие доверителя"
        - "заместитель"
      rerank: true

  - id: "revocation_notice_gap"
    name: "Нет механики отзыва доверенности и уведомления третьих лиц"
    description: "При прекращении поручения отсутствие механики возврата доверенности и уведомления третьих лиц создает риск связывания доверителя сделками бывшего представителя"
    legal_base: "ст. 188, 189, 977 ГК РФ"
    required_triggers: ["termination_sensitive", "poa_required"]
    severity: "critical"
    result_if_triggered: "fail"
    detector_type: "rules"
    rules:
      negative_keywords:
        - "возврат доверенности"
        - "уведомление третьих лиц"
        - "отмена доверенности"
        - "реестр отмененных доверенностей"
      keyword_mode: "any"
    retrieval:
      context_k: 5
      boost_keywords:
        - "возврат доверенности"
        - "уведомление третьих лиц"
        - "отмена доверенности"
      rerank: true

# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 5: CHECKS_V8 — LLM/hybrid проверки
#  Читается: DocTypeCheckLoader._load_doc_type_checks()
# ════════════════════════════════════════════════════════════════════════════

checks_v8:

  - id: mandate_subject_extraction
    name: "Базовое извлечение структуры договора поручения"
    description: "Извлекает доверителя, поверенного, предмет поручения, доверенность, отчетность и условия прекращения"
    triggers: {}
    severity: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "договор поручения"
        - "поверенный"
        - "доверитель"
        - "от имени доверителя"
        - "доверенность"
        - "юридические действия"
        - "отчет поверенного"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)(договор\\s+поручения|поверенн(ый|ого)|доверител(ь|я))"
        - "(?i)(от\\s+имени\\s+доверителя|за\\s+счет\\s+доверителя)"
        - "(?i)доверенн(ость|ости)"
    llm:
      prompt_template: |
        Ты — юридический ассистент, анализирующий договор поручения.
        Извлеки ключевые параметры строго по тексту договора.

        Ответь строго в JSON:
        {
          "principal": "<доверитель или not_found>",
          "agent": "<поверенный или not_found>",
          "mandated_actions": "<перечень действий или not_found>",
          "acts_in_name_of": "<principal / agent / unclear / not_found>",
          "poa_status": "<required_and_mentioned / mentioned / not_found>",
          "remuneration_status": "<paid / free / unclear / not_found>",
          "reporting_status": "<present / not_found>",
          "termination_status": "<present / not_found>"
        }

        Используй только явно указанные в тексте сведения.
        Если данных нет — пиши "not_found".
      prompt_file: null
      context_k: 6
      temperature: 0.0
      max_tokens: 700
    retrieval:
      context_k: 6
      max_chunks: 10
      boost_keywords:
        - "поверенный"
        - "доверитель"
        - "доверенность"
        - "отчет поверенного"
        - "отмена поручения"
      rerank: true
      filters: {}
    evidence:
      required: true
      min_snippet_length: 50
      max_snippet_length: 700
    extraction:
      enabled: true
      mode: "hybrid"
      fields:
        - name: "principal"
          type: "string"
          keyword_hints: ["доверитель"]
          description: "Доверитель"
        - name: "agent"
          type: "string"
          keyword_hints: ["поверенный"]
          description: "Поверенный"
        - name: "mandated_actions"
          type: "string"
          keyword_hints: ["совершить действия", "предмет договора", "юридические действия"]
          description: "Предмет поручения"
        - name: "acts_in_name_of"
          type: "string"
          allowed_values: ["principal", "agent", "unclear", "not_found"]
          description: "От чьего имени действует исполнитель"
        - name: "poa_status"
          type: "string"
          allowed_values: ["required_and_mentioned", "mentioned", "not_found"]
          description: "Статус доверенности"
        - name: "remuneration_status"
          type: "string"
          allowed_values: ["paid", "free", "unclear", "not_found"]
          description: "Статус возмездности"
        - name: "reporting_status"
          type: "string"
          allowed_values: ["present", "not_found"]
          description: "Есть ли отчетность"
        - name: "termination_status"
          type: "string"
          allowed_values: ["present", "not_found"]
          description: "Есть ли условия прекращения"
      store_payload: true

  - id: subject_legal_actions_check
    name: "Предмет поручения: конкретные юридические действия"
    description: "Проверяет, что предмет договора выражен в виде конкретных юридических, а не фактических/сервисных действий"
    triggers: {}
    severity: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "совершить юридические действия"
        - "заключение договоров"
        - "представление интересов"
        - "подача документов"
        - "подписание"
        - "государственная регистрация"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)соверш(ить|ает).*юридическ(ие|их)\\s+действ"
        - "(?i)заключени[ея]\\s+договор|представлени[ея]\\s+интерес"
        - "(?i)подписани[ея]|подач[аи]\\s+документ"
    llm:
      prompt_template: |
        Ты — юридический ассистент, анализирующий договор поручения.
        Проверь предмет договора.

        Ответь строго в JSON:
        {
          "actions_specificity": "<specific / generic / not_found>",
          "actions_nature": "<legal / mixed / factual_or_service_like / unclear / not_found>",
          "subject_risk": "<high / medium / low / not_found>"
        }

        - "specific" — если действия перечислены определенно и проверяемо.
        - "generic" — если есть формулы вроде "любые необходимые действия".
      prompt_file: null
      context_k: 5
      temperature: 0.0
      max_tokens: 340
    retrieval:
      context_k: 5
      max_chunks: 8
      boost_keywords:
        - "юридические действия"
        - "предмет договора"
        - "любые необходимые действия"
      rerank: true
      filters: {}
    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 600
    extraction:
      enabled: true
      mode: "hybrid"
      fields:
        - name: "actions_specificity"
          type: "string"
          allowed_values: ["specific", "generic", "not_found"]
          description: "Степень конкретизации действий"
        - name: "actions_nature"
          type: "string"
          allowed_values: ["legal", "mixed", "factual_or_service_like", "unclear", "not_found"]
          description: "Юридическая природа действий"
        - name: "subject_risk"
          type: "string"
          allowed_values: ["high", "medium", "low", "not_found"]
          description: "Риск дефектного предмета"
      store_payload: true

  - id: poa_and_authority_check
    name: "Доверенность и объем полномочий"
    description: "Проверяет наличие обязанности выдать доверенность, соответствие полномочий предмету поручения и риски превышения полномочий"
    triggers: {}
    severity: "critical"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "доверенность"
        - "обязан выдать доверенность"
        - "полномочия"
        - "пределы полномочий"
        - "нотариальная доверенность"
        - "превышение полномочий"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)доверенн(ость|ости)"
        - "(?i)предел(ы|ах)\\s+полномоч"
        - "(?i)нотариальн(ая|ой)\\s+доверенн"
    llm:
      prompt_template: |
        Ты — юридический ассистент, анализирующий договор поручения.
        Проверь механику доверенности и полномочий.

        Ответь строго в JSON:
        {
          "poa_clause_status": "<present / not_found>",
          "authority_scope_clarity": "<clear / unclear / not_found>",
          "notarial_poa_reference": "<present / not_found>",
          "excess_authority_risk": "<high / medium / low / not_found>"
        }

        Используй только текст договора.
      prompt_file: null
      context_k: 5
      temperature: 0.0
      max_tokens: 360
    retrieval:
      context_k: 5
      max_chunks: 8
      boost_keywords:
        - "доверенность"
        - "полномочия"
        - "нотариальная доверенность"
      rerank: true
      filters: {}
    evidence:
