        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "principal": "<текст или 'Данные не определены'>",
          "agent": "<текст или 'Данные не определены'>",
          "mandated_actions": "<текст или 'Данные не определены'>",
          "acts_in_name_of": "<principal / agent / mixed / unclear / not_defined>",
          "poa_status": "<required_and_mentioned / mentioned / attached / not_defined>",
          "remuneration_status": "<paid / free / by_agreement / unclear / not_defined>",
