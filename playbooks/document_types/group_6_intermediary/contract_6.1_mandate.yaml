          по иным сделкам);
          "not_defined" — ограничения не установлены.
        - conflict_of_interest_status:
          "present" — есть комплексная антиконфликтная оговорка (запрет
          сделок с самим собой + запрет двойного представительства +
          аффилированные лица, или общая формулировка «конфликт интересов»);
          "partial" — есть только часть запретов (например, только запрет
          сделок с самим собой, но нет запрета двойного представительства);
          "not_defined" — антиконфликтные оговорки отсутствуют.
        - limits_conflict_verdict — короткая фраза для юриста:
          пример 1: «Ограничения и антиконфликт установлены в полном объёме»;
          пример 2: «Частичные ограничения, антиконфликт не покрывает двойное
          представительство (ст. 182 п.3 ГК РФ)»;
          пример 3: «Ограничения и антиконфликт не установлены — риск
          злоупотребления полномочиями (ст. 10, 174 ГК РФ)»;
          пример 4: «Данные не определены».
        - Верни только JSON.
        </rules>

        <cove>
        Проверь, что все 3 ключа (3 поля) присутствуют в JSON
        и ни один не содержит "None", "null" или пустую строку.
        </cove>
      fields:
        - name: "limits_conflict_verdict"
          type: "string"
          presentation: "summary"
          label: "Ограничения и конфликт — вердикт"
          description: "Краткая сводка об ограничениях полномочий и антиконфликтных оговорках."
          required: false
          display_in_grid: true
          display_priority: 1
        - name: "authority_limits_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["present", "partial", "not_defined"]
          description: "Статус ограничений полномочий поверенного."
          required: true
        - name: "conflict_of_interest_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["present", "partial", "not_defined"]
          description: "Наличие антиконфликтных оговорок."
          required: true

  - id: instructions_and_expenses_check
    name: "Указания доверителя и возмещение расходов"
    description: >
      Проверяет наличие указаний доверителя, их обязательность для поверенного,
      а также порядок возмещения расходов и авансирования.
    triggers:
      any:
        - principal_instructions_present
        - expense_reimbursement
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "указания доверителя"
        - "в соответствии с указаниями"
        - "инструкции доверителя"
        - "согласование действий"
        - "возместить расходы"
        - "аванс на расходы"
        - "смета расходов"
        - "документально подтвержденные расходы"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)указани[яе]\\s+доверител"
        - "(?i)в\\s+соответствии\\s+с\\s+указаниями"
        - "(?i)возместит[ья].{0,20}расход"
        - "(?i)аванс\\s+на\\s+расход"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор поручения по Главе 49 ГК РФ.
        Проверяется только один вопрос: указания доверителя и возмещение расходов.

        Нормативный ориентир:
        - ст. 973 ГК РФ — исполнение поручения:
          п. 1 — поверенный обязан исполнять указания доверителя, если они
          правомерны, осуществимы и конкретны;
          п. 2 — если указания неконкретны, поверенный обязан запросить
          уточнения;
        - ст. 975 п. 1 ГК РФ — обязанности доверителя: обеспечить поверенного
          средствами, возместить понесённые расходы (императивная норма —
          действует даже при молчании договора).

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора,
          а чего прямо нет.
        - Не оценивай серьёзность риска.
        - Отсутствие оговорки о расходах не означает отсутствие обязанности
          (ст. 975 ГК РФ императивна), но для extraction фиксируй только
          наличие / отсутствие текста в договоре.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Есть ли указания доверителя и их обязательность.
        2. Есть ли порядок возмещения расходов.
        3. Есть ли авансирование расходов.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Если данные не указаны прямо — возвращай "not_defined".
        4. Не используй "None", "null", "-", "n/a" или пустые строки.
        5. Если порядок определён через отсылку к приложению, смете
           или иному документу — это валидное значение, а не "not_defined".
        6. В evidence включай только текст договора.
        7. Верни РОВНО один валидный JSON-объект со всеми 3 ключами, пригодный
           для парсинга через json.loads без предварительной обработки.
           Без markdown, без ```json, без комментариев, без текста до или после.
           Начни ответ сразу с { и закончи }.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — все три параметра определены:
        Фрагмент:
        "Поверенный обязан исполнять указания Доверителя, переданные в письменной
        форме. Расходы возмещаются по документально подтверждённым затратам
        в течение 10 рабочих дней. Аванс на расходы — 100 000 рублей,
        перечисляется в течение 3 дней с момента подписания договора."

        Ответ:
        {
          "instructions_status": "defined",
          "expense_reimbursement_status": "defined",
          "advance_status": "defined"
        }

        Пример 2 — указания есть, расходы не описаны:
        Фрагмент:
        "Поверенный действует в соответствии с письменными указаниями Доверителя.
        Вознаграждение Поверенного составляет 50 000 рублей."

        Ответ:
        {
          "instructions_status": "defined",
          "expense_reimbursement_status": "not_defined",
          "advance_status": "not_defined"
        }

        Пример 3 — ничего не указано:
        Фрагмент:
        "Поверенный обязуется совершить от имени Доверителя юридические действия,
        указанные в разделе 2 настоящего договора."

        Ответ:
        {
          "instructions_status": "not_defined",
          "expense_reimbursement_status": "not_defined",
          "advance_status": "not_defined"
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Проверь, что все 3 ключа присутствуют в JSON.
        2. Найди прямую цитату об указаниях доверителя.
        3. Найди прямую цитату о возмещении расходов.
        4. Найди прямую цитату об авансе.
        5. Если прямой цитаты нет — верни "not_defined".

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "instructions_status": "<defined / not_defined>",
          "expense_reimbursement_status": "<defined / not_defined>",
          "advance_status": "<defined / not_defined>"
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 380

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "указания доверителя инструкции доверителя в соответствии с указаниями возместить расходы аванс на расходы смета расходов документально подтвержденные расходы обеспечение средствами"
      retrieval_profile: "scope_of_work_check"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - procedures
      negative_keywords:
        - "в целях настоящего"
        - "отчёт поверенного"
        - "вознаграждение"
        - "отмена поручения"
      position_bias:
        preferred_range: [0.20, 0.65]
        boost: 0.30
        scope: segment
      context_k: 6
      max_chunks: 9
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
        - "invoice"
      preferred_clause_functions:
        - "obligations"
        - "procedures"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 35
      max_snippet_length: 540

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 700
      compact_output: false
      store_payload: true

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора поручения сведения
        об указаниях доверителя и порядке возмещения расходов. Сформулируй
        краткий вердикт для юриста.
        Не анализируй доверенность, отчётность, вознаграждение или прекращение.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие 4 полей + evidence (всего 5 ключей):
        
        Заполни строго следующие 4 поля:

        1. instructions_status — "defined" / "not_defined".
        2. expense_reimbursement_status — "defined" / "not_defined".
        3. advance_status — "defined" / "not_defined".
        4. instructions_expenses_verdict — краткая человекочитаемая сводка
           (одна фраза).

        Если данные отсутствуют:
        - статусные поля = "not_defined";
        - instructions_expenses_verdict = "Данные не определены".

        Если порядок определён через отсылку к приложению, смете
        или иному документу — укажи отсылку, это валидное значение.

        Верни РОВНО один валидный JSON-объект со всеми 4 ключами, пригодный
        для парсинга через json.loads без предварительной обработки.
        Без markdown, без ```json, без комментариев, без текста до или после.
        Начни ответ сразу с { и закончи }.
        </task>

        <rules>
        - Используй только текст договора.
        - Не делай предположений.
        - instructions_status:
          "defined" — в договоре прямо указаны правила исполнения указаний
          доверителя (обязательность, форма, порядок согласования);
          "not_defined" — указания не упомянуты (по умолчанию действуют
          правила ст. 973 ГК РФ).
        - expense_reimbursement_status:
          "defined" — в договоре прямо установлен порядок возмещения расходов
          (сроки, документальное подтверждение, лимиты);
          "not_defined" — порядок не описан (обязанность возмещения
          сохраняется по ст. 975 п.1 ГК РФ, но порядок не конкретизирован —
          риск спора о размере).
        - advance_status:
          "defined" — в договоре прямо предусмотрено авансирование расходов
          (сумма, сроки, порядок);
          "not_defined" — авансирование не упомянуто (обязанность обеспечить
          средствами сохраняется по ст. 975 п.1 ГК РФ при необходимости).
        - instructions_expenses_verdict — короткая фраза для юриста:
          пример 1: «Указания, возмещение расходов и аванс определены»;
          пример 2: «Указания определены, порядок возмещения расходов
          не конкретизирован — риск спора (ст. 975 ГК РФ)»;
          пример 3: «Указания и расходы не оговорены — действуют императивные
          нормы ст. 973, 975 ГК РФ»;
          пример 4: «Данные не определены».
        - Верни только JSON.
        </rules>

        <cove>
        Проверь, что все 4 ключа (4 поля) присутствуют в JSON
        и ни один не содержит "None", "null" или пустую строку.
        </cove>
      fields:
        - name: "instructions_expenses_verdict"
          type: "string"
          presentation: "summary"
          label: "Указания и расходы — вердикт"
          description: "Краткая сводка об указаниях доверителя, возмещении расходов и авансировании."
          required: false
          display_in_grid: true
          display_priority: 1
        - name: "instructions_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "not_defined"]
          description: "Наличие указаний доверителя."
          required: true
