        ненадлежащим исполнением поручения, в полном объёме. Поверенный вправе
        отступить от указаний Доверителя только в случаях, не терпящих отлагательства,
        с немедленным письменным уведомлением Доверителя."

        Ответ:
        {
          "agent_liability_clause": "present",
          "liability_cap_status": "not_defined",
          "deviation_procedure_status": "present",
          "deviation_notification_status": "present"
        }

        Пример 2 — ограниченная ответственность, отступление не оговорено:
        Фрагмент:
        "Ответственность Поверенного ограничивается суммой полученного
        вознаграждения. Поверенный обязан строго следовать указаниям Доверителя."

        Ответ:
        {
          "agent_liability_clause": "present",
          "liability_cap_status": "present",
          "deviation_procedure_status": "not_defined",
          "deviation_notification_status": "not_defined"
        }

        Пример 3 — ничего не указано:
        Фрагмент:
        "Поверенный обязуется совершить от имени Доверителя юридические действия,
        указанные в разделе 2 настоящего договора."

        Ответ:
        {
          "agent_liability_clause": "not_defined",
          "liability_cap_status": "not_defined",
          "deviation_procedure_status": "not_defined",
          "deviation_notification_status": "not_defined"
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Проверь, что все 4 ключа присутствуют в JSON.
        2. Найди прямую цитату об ответственности поверенного.
        3. Найди прямую цитату об ограничении ответственности.
        4. Найди прямую цитату об отступлении от указаний.
        5. Найди прямую цитату об уведомлении об отступлении.
        6. Если прямой цитаты нет — верни "not_defined".

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "agent_liability_clause": "<present / not_defined>",
          "liability_cap_status": "<present / not_defined>",
          "deviation_procedure_status": "<present / not_defined>",
          "deviation_notification_status": "<present / not_defined>"
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 420

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "ответственность поверенного неустойка возмещение убытков ограничение ответственности cap отступление от указаний уведомление об отступлении одобрение отступления ненадлежащее исполнение"
      retrieval_profile: "scope_of_work_check"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - remedies
      negative_keywords:
        - "в целях настоящего"
        - "отчёт поверенного"
        - "передоверие"
        - "отмена поручения"
      position_bias:
        preferred_range: [0.30, 0.80]
        boost: 0.30
        scope: segment
      context_k: 6
      max_chunks: 10
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
        - "invoice"
      preferred_clause_functions:
        - "obligations"
        - "remedies"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 580

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 800
      compact_output: false
      store_payload: true

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора поручения сведения
        об ответственности поверенного за ненадлежащее исполнение, ограничении
        ответственности и порядке отступления от указаний доверителя.
        Сформулируй краткий вердикт для юриста.
        Не анализируй доверенность, отчётность, вознаграждение или прекращение.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие 5 полей + evidence (всего 6 ключей):
        
        Заполни строго следующие 5 полей:

        1. agent_liability_clause — "present" / "not_defined".
        2. liability_cap_status — "present" / "not_defined".
        3. deviation_procedure_status — "present" / "not_defined".
        4. deviation_notification_status — "present" / "not_defined".
        5. agent_liability_verdict — краткая человекочитаемая сводка (одна фраза).

        Если данные отсутствуют:
        - статусные поля = "not_defined";
        - agent_liability_verdict = "Данные не определены".

        Если условия определены через отсылку к приложению или регламенту —
        укажи это, отсылка является валидным значением.

        Верни РОВНО один валидный JSON-объект со всеми 5 ключами, пригодный
        для парсинга через json.loads без предварительной обработки.
        Без markdown, без ```json, без комментариев, без текста до или после.
        Начни ответ сразу с { и закончи }.
        </task>

        <rules>
        - Используй только текст договора.
        - Не делай предположений.
        - agent_liability_clause:
          "present" — в договоре прямо установлена ответственность поверенного
          за ненадлежащее исполнение (неустойка, возмещение убытков, штраф);
          "not_defined" — специальная ответственность не оговорена
          (применяются общие нормы ст. 393, 401 ГК РФ — доказывание убытков
          на доверителе).
        - liability_cap_status:
          "present" — ответственность поверенного ограничена (cap: сумма
          вознаграждения, фиксированная сумма, исключение упущенной выгоды);
          "not_defined" — ограничение ответственности не установлено
          (полная ответственность по ст. 15 ГК РФ).
        - deviation_procedure_status:
          "present" — в договоре урегулирован порядок отступления от указаний
          доверителя (условия допустимости, критерии необходимости);
          "not_defined" — порядок отступления не оговорен (действует
          ст. 973 п.3 ГК РФ — отступление допустимо только при невозможности
          запросить доверителя и в его интересах).
        - deviation_notification_status:
          "present" — установлена обязанность поверенного уведомить доверителя
          об отступлении от указаний (срок, форма уведомления);
          "not_defined" — обязанность уведомления не оговорена.
        - agent_liability_verdict — короткая фраза для юриста:
          пример 1: «Ответственность поверенного установлена в полном объёме, порядок отступления от указаний урегулирован»;
          пример 2: «Ответственность ограничена суммой вознаграждения (cap) — риск недокомпенсации убытков доверителя»;
          пример 3: «Ответственность и порядок отступления не оговорены — применяются общие нормы ст. 393, 973 ГК РФ, риск сложного доказывания убытков»;
          пример 4: «Данные не определены».
        - Верни только JSON.
        </rules>

        <cove>
        Проверь, что все 5 ключей (5 полей) присутствуют в JSON
        и ни один не содержит "None", "null" или пустую строку.
        </cove>
      fields:
        - name: "agent_liability_verdict"
          type: "string"
          presentation: "summary"
          label: "Ответственность и отступление — вердикт"
          description: "Краткая сводка об ответственности поверенного, ограничении ответственности и порядке отступления от указаний."
          required: false
          display_in_grid: true
          display_priority: 1
        - name: "agent_liability_clause"
          type: "string"
          presentation: "signal"
          allowed_values: ["present", "not_defined"]
          description: "Наличие договорных санкций за ненадлежащее исполнение."
          required: true
        - name: "liability_cap_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["present", "not_defined"]
          description: "Наличие ограничения ответственности поверенного."
          required: true
        - name: "deviation_procedure_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["present", "not_defined"]
          description: "Наличие порядка отступления от указаний доверителя."
          required: true
        - name: "deviation_notification_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["present", "not_defined"]
          description: "Наличие обязанности уведомления об отступлении."
          required: true

# ════════════════════════════════════════════════════════════════════════════
# БЛОК 5: DD_REQUEST_TEMPLATES
# Читается: DDRequestTemplateLoader
# ════════════════════════════════════════════════════════════════════════════

dd_request_templates:
  mandate_subject_extraction:
    text: >
      Просим предоставить по {doc_names}: сведения о доверителе и поверенном,
      точный предмет поручения, объём полномочий, доверенность, условия
      отчётности, вознаграждение, расходы и порядок прекращения договора.
    addressee: "Доверитель / Поверенный"

  subject_legal_actions_check:
    text: >
      Просим уточнить в {doc_names}: исчерпывающий перечень юридических действий,
      которые должен совершить поверенный, и исключить чрезмерно общие формулы
      вроде «любые необходимые действия».
    addressee: "Юридический советник"

  poa_and_authority_check:
    text: >
      Просим предоставить по {doc_names}: проект доверенности, перечень полномочий,
      сведения о необходимости нотариальной формы и подтверждение того, что объём
      доверенности соответствует предмету поручения.
    addressee: "Доверитель / Юридический советник"

  authority_limits_and_conflict_check:
    text: >
      Просим уточнить по {doc_names}: пределы полномочий поверенного, лимиты
      сумм/сделок, необходимость предварительного согласования существенных
      действий, а также ограничения, связанные с конфликтом интересов.
    addressee: "Доверитель / Юридический советник"

  instructions_and_expenses_check:
    text: >
      Просим уточнить по {doc_names}: какие указания доверителя обязательны
      для поверенного, как они оформляются, а также порядок возмещения расходов,
      авансирования и подтверждающих документов.
    addressee: "Доверитель / Поверенный"

  remuneration_check:
    text: >
      Просим уточнить в {doc_names}: является ли договор возмездным, каков размер
      вознаграждения поверенного, база его расчёта и порядок выплаты при полном
      и частичном исполнении поручения.
    addressee: "Обе стороны"

  reporting_and_transfer_check:
    text: >
      Просим предоставить по {doc_names}: форму и периодичность отчёта поверенного,
      перечень подтверждающих документов, порядок принятия/оспаривания отчёта
      и срок передачи доверителю всего полученного по сделкам.
    addressee: "Поверенный / Доверитель"

  termination_and_revocation_check:
    text: >
      Просим уточнить по {doc_names}: порядок отмены поручения, отказа поверенного,
      возврата доверенности, уведомления третьих лиц, завершения текущих дел
      и окончательного расчёта между сторонами.
    addressee: "Обе стороны"

  subdelegation_check:
    text: >
      По {doc_names} с передоверием просим предоставить: условия допустимости
      передоверия, форму согласия доверителя, требования к заместителю
      и распределение ответственности за его действия.
    addressee: "Поверенный / Юридический советник"

  commercial_representation_check:
    text: >
      По {doc_names} с признаками коммерческого представительства просим
      предоставить: обоснование статуса коммерческого представителя, специальные
      условия, письменные согласия на возможное представление обеих сторон сделки
      и порядок раскрытия конфликта интересов.
    addressee: "Юридический советник / Поверенный"

  _default:
    text: >
      Просим предоставить дополнительную информацию по вопросу «{check_name}»
      применительно к {doc_names}.
    addressee: "Юридический советник"
