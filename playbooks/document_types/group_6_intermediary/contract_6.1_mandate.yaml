        Не оценивай серьёзность риска — только зафиксируй наблюдаемые параметры.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. subdelegation_check_presence:
           Агрегатное signal-поле — наличие сведений о передоверии.
           - "present" — если хотя бы одно из содержательных полей
             (subdelegation_status, principal_consent_required,
              agent_liability_for_subagent) ≠ "not_defined";
           - "missing" — если все три содержательных поля = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - subdelegation_status = "not_defined";
           - principal_consent_required = "not_defined";
           - agent_liability_for_subagent = "not_defined";
           - subdelegation_verdict = "Данные не определены";
           - не выполняй остальные шаги.

        1. subdelegation_status:
           - "allowed" — передоверие прямо разрешено в договоре;
           - "prohibited" — передоверие прямо запрещено либо установлено строго
             личное исполнение;
           - "unclear" — формулировка допускает двоякое толкование;
           - "not_defined" — условие не упомянуто (действует ст. 976, 187 ГК РФ:
             передоверие возможно лишь при вынужденных обстоятельствах).

        2. principal_consent_required:
           - "yes" — требуется предварительное согласие доверителя;
           - "no" — передоверие разрешено без необходимости получения согласия;
           - "not_defined" — вопрос согласия не урегулирован.

        3. agent_liability_for_subagent:
           - "choice_only" — поверенный отвечает только за выбор заместителя
             (ст. 976 п. 2 ГК РФ);
           - "full_liability" — поверенный отвечает за любые действия заместителя
             как за свои собственные;
           - "not_defined" — ответственность за заместителя в договоре не оговорена.

        4. subdelegation_verdict — краткая фраза-сводка для юриста:
           пример 1: «Передоверие разрешено с согласия доверителя, ответственность за выбор заместителя»;
           пример 2: «Передоверие прямо запрещено — строго личное исполнение»;
           пример 3: «Передоверие разрешено без согласия доверителя»;
           пример 4: «Условие о передоверии не согласовано»;
           пример 5: «Данные не определены».
           Fallback: "Данные не определены" / "Не удалось определить".
        </task>

        <context_rules>
        - Перед остальными полями заполни subdelegation_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все статусные поля = "not_defined", subdelegation_verdict = "Данные не определены".
        - Используй только текст договора.
        - Не подставляй нормы закона, обычную практику или предположения вместо текста договора.
        - Не делай выводов по типовой структуре договора поручения.
        - Если условия передоверия определены через отсылку к приложению или доверенности — это валидное значение, укажи отсылку.
