          "termination_fee_status": "present",
          "lost_profits_recovery": "not_defined",
          "evidence": "В случае досрочной отмены поручения Доверителем последний выплачивает Поверенному фиксированную компенсацию (плату за отказ) в размере 100 000 рублей."
        }

        Пример 2 — данные отсутствуют:
        Фрагмент:
        "Доверитель вправе в любое время отменить поручение, уведомив Поверенного за 30 дней."

        Ответ:
        {
          "termination_fee_status": "not_defined",
          "lost_profits_recovery": "not_defined",
          "evidence": "Доверитель вправе в любое время отменить поручение, уведомив Поверенного за 30 дней."
        }

        Пример 3 — прямой запрет штрафов за отказ:
        Фрагмент:
        "Отмена поручения осуществляется без начисления неустоек, штрафов и без обязанности возмещения упущенной выгоды Поверенного."

        Ответ:
        {
          "termination_fee_status": "absent",
          "lost_profits_recovery": "absent",
          "evidence": "Отмена поручения осуществляется без начисления неустоек, штрафов и без обязанности возмещения упущенной выгоды Поверенного."
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Проверь, что все 3 ключа (2 поля + evidence) присутствуют в JSON.
        2. Найди прямую цитату о плате за отказ, штрафе или компенсации за отмену поручения.
        3. Найди прямую цитату о возмещении упущенной выгоды поверенному.
        4. Если прямой цитаты нет — верни "not_defined" для статусных полей.

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "termination_fee_status": "<present / absent / not_defined>",
          "lost_profits_recovery": "<present / absent / not_defined>",
          "evidence": "<прямая цитата из договора>"
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 450

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "плата за отказ штраф за отмену поручения отзыв доверенности компенсация при досрочном расторжении возмещение упущенной выгоды неустойка за отказ"
      retrieval_profile: "termination_check"
      preferred_unit_types:
        - termination_provision
        - liability_provision
        - obligation
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - remedies
        - limitations
        - procedures
      negative_keywords:
        - "означает"
        - "в целях настоящего"
        - "передоверие"
      position_bias:
        preferred_range: [0.45, 0.95]
        boost: 0.15
        scope: segment
      context_k: 6
      max_chunks: 8
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
        - "invoice"
      preferred_clause_functions:
        - "remedies"
        - "limitations"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 35
      max_snippet_length: 550

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 600
      compact_output: false
      store_payload: true

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора поручения сведения
        о плате за отказ от договора, штрафах за отмену поручения и возмещении упущенной выгоды.
        Не анализируй передоверие или предмет поручения.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие 2 поля + evidence (всего 3 ключа):

        1. termination_fee_status — "present" / "absent" / "not_defined".
        2. lost_profits_recovery — "present" / "absent" / "not_defined".
        3. evidence — точная цитата из договора о плате за отказ, штрафах или упущенной выгоде.
        </task>

        <rules>
        - Используй только текст договора.
        - Не делай предположений.
        - termination_fee_status:
          * "present" — прямо предусмотрена плата за односторонний отказ, штраф, неустойка или фиксированная компенсация за отмену поручения / отзыв доверенности;
          * "absent" — прямо указано, что отмена поручения осуществляется без штрафов и компенсаций;
          * "not_defined" — условие платы за отказ не установлено.
        - lost_profits_recovery:
          * "present" — прямо предусмотрена обязанность доверителя возместить поверенному упущенную выгоду при отмене поручения;
          * "absent" — прямо исключено возмещение упущенной выгоды (возмещаются только фактически понесённые расходы);
          * "not_defined" — условие упущенной выгоды не упомянуто.
        - Верни РОВНО один валидный JSON-объект со всеми 3 ключами (2 поля + evidence), пригодный для парсинга через `json.loads` без предварительной обработки. Без markdown, без ```json, без комментариев, без текста до или после. Начни ответ сразу с `{` и закончи `}`.
        </rules>

      fields:
        - name: "termination_fee_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["present", "absent", "not_defined"]
          description: "Наличие платы за односторонний отказ или штрафа за отмену поручения."
          required: true
        - name: "termination_fee_status_display"
          type: "string"
          presentation: "fact"
          label: "Плата за отмену поручения"
          description: >
            Человекочитаемое отображение платы за отказ / штрафа за отмену
            (backend, by design).
          required: false
          display_in_grid: true
          display_priority: 1
        - name: "lost_profits_recovery"
          type: "string"
          presentation: "signal"
          allowed_values: ["present", "absent", "not_defined"]
          description: "Обязанность возмещения упущенной выгоды поверенного при прекращении."
          required: false
        - name: "lost_profits_recovery_display"
          type: "string"
          presentation: "fact"
          label: "Возмещение упущенной выгоды"
          description: >
            Человекочитаемое отображение условия о возмещении упущенной выгоды
            (backend, by design).
          required: false
          display_in_grid: true
          display_priority: 2


# ════════════════════════════════════════════════════════════════════════════
# БЛОК 5: DD_REQUEST_TEMPLATES
# Читается: DDRequestTemplateLoader
# ════════════════════════════════════════════════════════════════════════════

dd_request_templates:
  mandate_subject_extraction:
    text: >
      Просим предоставить по {doc_names}: сведения о доверителе и поверенном,
      точный предмет поручения, объём полномочий, доверенность, условия
      отчётности, вознаграждение, расходы и порядок прекращения договора.
    addressee: "Доверитель / Поверенный"

  subject_legal_actions_check:
    text: >
      Просим уточнить в {doc_names}: исчерпывающий перечень юридических действий,
      которые должен совершить поверенный, и исключить чрезмерно общие формулы
      вроде «любые необходимые действия».
    addressee: "Юридический советник"

  poa_and_authority_check:
    text: >
      Просим предоставить по {doc_names}: проект доверенности, перечень полномочий,
      сведения о необходимости нотариальной формы и подтверждение того, что объём
      доверенности соответствует предмету поручения.
    addressee: "Доверитель / Юридический советник"

  authority_limits_and_conflict_check:
    text: >
      Просим уточнить по {doc_names}: пределы полномочий поверенного, лимиты
      сумм/сделок, необходимость предварительного согласования существенных
      действий, а также ограничения, связанные с конфликтом интересов.
    addressee: "Доверитель / Юридический советник"

  instructions_and_expenses_check:
    text: >
      Просим уточнить по {doc_names}: какие указания доверителя обязательны
      для поверенного, как они оформляются, а также порядок возмещения расходов,
      авансирования и подтверждающих документов.
    addressee: "Доверитель / Поверенный"

  remuneration_check:
    text: >
      Просим уточнить в {doc_names}: является ли договор возмездным, каков размер
      вознаграждения поверенного, база его расчёта и порядок выплаты при полном
      и частичном исполнении поручения.
    addressee: "Обе стороны"

  reporting_and_transfer_check:
    text: >
      Просим предоставить по {doc_names}: форму и периодичность отчёта поверенного,
      перечень подтверждающих документов, порядок принятия/оспаривания отчёта
      и срок передачи доверителю всего полученного по сделкам.
    addressee: "Поверенный / Доверитель"

  termination_and_revocation_check:
    text: >
      Просим уточнить по {doc_names}: порядок отмены поручения, отказа поверенного,
      возврата доверенности, уведомления третьих лиц, завершения текущих дел
      и окончательного расчёта между сторонами.
    addressee: "Обе стороны"

  subdelegation_check:
    text: >
      По {doc_names} с передоверием просим предоставить: условия допустимости
      передоверия, форму согласия доверителя, требования к заместителю
      и распределение ответственности за его действия.
    addressee: "Поверенный / Юридический советник"

  commercial_representation_check:
    text: >
      По {doc_names} с признаками коммерческого представительства просим
      предоставить: обоснование статуса коммерческого представителя, специальные
      условия, письменные согласия на возможное представление обеих сторон сделки
      и порядок раскрытия конфликта интересов.
    addressee: "Юридический советник / Поверенный"

  _default:
    text: >
      Просим предоставить дополнительную информацию по вопросу «{check_name}»
      применительно к {doc_names}.
    addressee: "Юридический советник"

