            отдельно (например, «все расходы включены в вознаграждение»,
            «расходы несёт Поверенный»);
          * "not_defined" — если вопрос возмещения не упомянут.
        - advance_status:
          * "defined" — если авансирование расходов прямо предусмотрено
            (с указанием суммы или порядка расчёта);
          * "absent" — если прямо указано, что аванс не предоставляется;
          * "not_defined" — если вопрос аванса не упомянут.
        - Верни РОВНО один валидный JSON-объект со всеми 4 ключами
          (3 поля + evidence), пригодный для парсинга через `json.loads`
          без предварительной обработки. Без markdown, без ```json, без
          комментариев, без текста до или после. Начни ответ сразу с `{`
          и закончи `}`.
        </rules>

      fields:
        - name: "instructions_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "partial", "absent", "not_defined"]
          description: >
            Наличие и обязательность указаний доверителя. "partial" —
            указания с оговорками. "absent" — поверенный действует
            по своему усмотрению.
          required: true
        - name: "instructions_status_display"
          type: "string"
          presentation: "fact"
          label: "Указания доверителя"
          description: >
            Человекочитаемое отображение статуса указаний доверителя
            (backend, by design).
          required: false
          display_in_grid: true
          display_priority: 1
        - name: "expense_reimbursement_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "partial", "by_agreement", "absent", "not_defined"]
          description: >
            Наличие порядка возмещения расходов. "by_agreement" — отсылка
            к иному документу. "absent" — расходы не возмещаются отдельно.
          required: true
        - name: "expense_reimbursement_status_display"
          type: "string"
          presentation: "fact"
          label: "Возмещение расходов"
          description: >
            Человекочитаемое отображение порядка возмещения расходов
            (backend, by design).
          required: false
          display_in_grid: true
          display_priority: 2
        - name: "advance_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "absent", "not_defined"]
          description: >
            Наличие авансирования расходов доверителем. "absent" —
            аванс прямо не предусмотрен.
          required: false
        - name: "advance_status_display"
          type: "string"
          presentation: "fact"
          label: "Авансирование расходов"
          description: >
            Человекочитаемое отображение статуса авансирования
            (backend, by design).
          required: false
          display_in_grid: true
          display_priority: 3

  - id: remuneration_check
    name: "Вознаграждение поверенного"
    description: >
      Проверяет наличие вознаграждения или ясной безвозмездности договора поручения
      (ст. 972 ГК РФ), размер и порядок выплаты вознаграждения поверенному.
      Выявляет риски некорректной квалификации сделки и несогласования
      существенных условий возмездности.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "вознаграждение поверенного"
        - "безвозмездно"
        - "размер вознаграждения"
        - "порядок выплаты"
        - "вознаграждение по соглашению"
        - "определяется дополнительным соглашением"
        - "без выплаты вознаграждения"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)вознаграждени[ея].{0,30}поверенн"
        - "(?i)безвозмездн"
        - "(?i)определяется\\s+дополнительн(ым|ого)\\s+соглашени"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор поручения по Главе 49 ГК РФ.
        Проверяется только один вопрос: вознаграждение поверенного.

        Нормативный ориентир:
        - ст. 972 ГК РФ — вознаграждение поверенного (право на вознаграждение, презумпция возмездности в коммерческом обороте)
        - ст. 432 ГК РФ — существенные условия договора

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора.
        - Не оценивай серьёзность риска.
        - Не применяй презумпцию возмездности по ст. 972 ГК РФ: если условие о вознаграждении прямо не указано в тексте — верни "not_defined", не додумывай его исходя из статуса сторон.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Является ли договор возмездным или безвозмездным.
        2. Есть ли размер вознаграждения поверенного.
        3. Есть ли порядок выплаты вознаграждения.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Для статусных полей (remuneration_model, remuneration_amount_status, payment_procedure_status): если данные не указаны прямо — возвращай значение "not_defined" из соответствующего enum.
        4. Не используй "None", "null" или пустые строки. Значение "not_defined" используй только в статусных полях по перечню allowed_values.
        5. Если в договоре прямо указано, что вознаграждение не выплачивается (безвозмездный договор) — используй "free" для remuneration_model и "not_defined" для остальных полей.
        6. Если размер или порядок выплаты определяются отсылкой к иному документу или соглашению (например, «определяется дополнительным соглашением сторон», «устанавливается Спецификацией №1») — используй "by_agreement".
        7. В evidence включай только прямую цитату из текста договора.
        8. Верни РОВНО один валидный JSON-объект со всеми 4 ключами (3 поля + evidence), пригодный для парсинга через `json.loads` без предварительной обработки. Без markdown, без ```json, без комментариев, без текста до или после. Начни ответ сразу с `{` и закончи `}`.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — возмездный договор поручения:
        Фрагмент:
        "Вознаграждение Поверенного составляет 50 000 рублей и выплачивается в течение 5 рабочих дней после подписания отчёта."

        Ответ:
        {
          "remuneration_model": "paid",
          "remuneration_amount_status": "defined",
          "payment_procedure_status": "defined",
          "evidence": "Вознаграждение Поверенного составляет 50 000 рублей и выплачивается в течение 5 рабочих дней после подписания отчёта."
        }

        Пример 2 — безвозмездный договор поручения:
        Фрагмент:
        "Настоящий договор является безвозмездным. Поверенный не вправе требовать выплаты вознаграждения за исполнение поручения."

        Ответ:
        {
          "remuneration_model": "free",
          "remuneration_amount_status": "not_defined",
          "payment_procedure_status": "not_defined",
          "evidence": "Настоящий договор является безвозмездным."
        }

        Пример 3 — вознаграждение по соглашению сторон (отсылка):
        Фрагмент:
        "Размер вознаграждения Поверенного определяется дополнительным соглашением сторон. Выплата вознаграждения производится согласно графику платежей."

        Ответ:
        {
          "remuneration_model": "by_agreement",
          "remuneration_amount_status": "by_agreement",
          "payment_procedure_status": "by_agreement",
          "evidence": "Размер вознаграждения Поверенного определяется дополнительным соглашением сторон. Выплата вознаграждения производится согласно графику платежей."
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Проверь, что все 4 ключа (3 поля + evidence) присутствуют в JSON.
        2. Найди прямую цитату о вознаграждении или безвозмездности.
        3. Найди прямую цитату о размере (или его определении соглашением).
        4. Найди прямую цитату о порядке выплаты (или отсылке к графику).
        5. Если в тексте нет прямого упоминания вознаграждения — верни "not_defined" для всех статусных полей. Не додумывай "paid" на основании ст. 972 ГК РФ.

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "remuneration_model": "<paid / free / by_agreement / unclear / not_defined>",
          "remuneration_amount_status": "<defined / by_agreement / not_defined>",
          "payment_procedure_status": "<defined / by_agreement / not_defined>",
          "evidence": "<прямая цитата из договора>"
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 500

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "вознаграждение поверенного безвозмездно размер вознаграждения порядок выплата вознаграждение по соглашению сторон оплата услуг дополнительное соглашение"
      retrieval_profile: "scope_of_work_check"
      preferred_unit_types:
        - obligation
        - payment_term
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - procedures
      negative_keywords:
        - "означает"
        - "в целях настоящего"
        - "отчёт поверенного"
        - "передоверие"
        - "отмена поручения"
        - "расходы"
      position_bias:
        preferred_range: [0.20, 0.65]
        boost: 0.12
        scope: segment
      context_k: 6
      max_chunks: 8
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
        - "invoice"
      preferred_clause_functions:
        - "obligations"
        - "procedures"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 35
      max_snippet_length: 540

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 600
      compact_output: false
      store_payload: true

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора поручения сведения
        о вознаграждении поверенного: модель, размер и порядок выплаты.
        Не анализируй расходы, отчётность или прекращение.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие 3 поля + evidence (всего 4 ключа):

        1. remuneration_model — "paid" / "free" / "by_agreement" / "unclear" / "not_defined".
        2. remuneration_amount_status — "defined" / "by_agreement" / "not_defined".
        3. payment_procedure_status — "defined" / "by_agreement" / "not_defined".
        4. evidence — точная цитата из договора о вознаграждении поверенного.
        </task>

        <rules>
        - Используй только текст договора.
        - Не делай предположений.
        - Не применяй презумпцию возмездности по ст. 972 ГК РФ: если вознаграждение прямо не упомянуто в тексте — верни remuneration_model = "not_defined".
        - remuneration_model:
          * "paid" — если вознаграждение прямо предусмотрено с указанием его размера или порядка расчёта;
          * "free" — если прямо указано, что договор безвозмездный (например, «без выплаты вознаграждения», «безвозмездный»);
          * "by_agreement" — если размер или условия выплаты вознаграждения определяются дополнительным соглашением или спецификацией;
          * "unclear" — если формулировка неоднозначна;
          * "not_defined" — если не указано вообще.
        - remuneration_amount_status:
          * "defined" — размер вознаграждения прямо и конкретно определён в тексте (например, «50 000 рублей», «10% от суммы сделки»);
          * "by_agreement" — размер определяется отсылкой к иному документу/соглашению сторон;
          * "not_defined" — размер не определён или договор безвозмездный.
        - payment_procedure_status:
          * "defined" — порядок выплаты прямо и конкретно определён (например, «в течение 5 дней после отчёта», «ежемесячно до 10 числа»);
          * "by_agreement" — порядок выплаты определяется отсылкой к иному документу/соглашению;
          * "not_defined" — порядок не определён или договор безвозмездный.
        - Верни РОВНО один валидный JSON-объект со всеми 4 ключами (3 поля + evidence), пригодный для парсинга через `json.loads` без предварительной обработки. Без markdown, без ```json, без комментариев, без текста до или после. Начни ответ сразу с `{` и закончи `}`.
        </rules>

      fields:
        - name: "remuneration_model"
          type: "string"
          presentation: "signal"
          allowed_values: ["paid", "free", "by_agreement", "unclear", "not_defined"]
          description: >
            Модель возмездности договора поручения. "by_agreement" —
            размер определяется отдельным соглашением.
          required: true
        - name: "remuneration_model_display"
          type: "string"
          presentation: "fact"
          label: "Возмездность договора"
          description: >
            Человекочитаемое отображение статуса возмездности договора
            (backend, by design).
          required: false
          display_in_grid: true
          display_priority: 1
        - name: "remuneration_amount_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "by_agreement", "not_defined"]
          description: "Определённость размера вознаграждения поверенного."
          required: false
        - name: "remuneration_amount_status_display"
          type: "string"
          presentation: "fact"
          label: "Размер вознаграждения"
          description: >
            Человекочитаемое отображение определённости размера вознаграждения
            (backend, by design).
          required: false
          display_in_grid: true
          display_priority: 2
        - name: "payment_procedure_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["defined", "by_agreement", "not_defined"]
          description: "Определённость порядка выплаты вознаграждения."
          required: false
        - name: "payment_procedure_status_display"
          type: "string"
          presentation: "fact"
          label: "Порядок выплаты"
          description: >
            Человекочитаемое отображение определённости порядка выплаты вознаграждения
            (backend, by design).
          required: false
          display_in_grid: true
          display_priority: 3

  - id: reporting_and_transfer_check
    name: "Отчётность поверенного и передача всего полученного"
    description: >
      Проверяет порядок и сроки представления отчёта поверенным (ст. 974 ГК РФ),
      требование о приложении оправдательных документов, обязанность передать
      доверителю всё полученное по сделке без промедления и регламент
      приёмки/оспаривания отчёта доверителем.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "отчет поверенного"
        - "оправдательные документы"
        - "передать доверителю все полученное"
        - "все полученное по сделкам"
        - "срок передачи"
        - "возражения по отчету"
        - "утверждение отчета"
        - "подтверждающие документы"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)отчет\\s+поверенн"
        - "(?i)оправдательн(ые|ых)\\s+документ"
        - "(?i)передат[ья].{0,40}все\\s+полученн"
        - "(?i)возражени[яй].{0,20}отчет"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор поручения по Главе 49 ГК РФ.
        Проверяется только один вопрос: отчётность поверенного и передача всего полученного доверителю.

        Нормативный ориентир:
        - ст. 974 ГК РФ — обязанности поверенного (представление отчёта с оправдательными документами, передача всего полученного по сделке без промедления)
        - ст. 314 ГК РФ — срок исполнения обязательства

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора.
        - Не оценивай серьёзность риска.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Есть ли обязанность представлять отчёт поверенного.
        2. Требуются ли оправдательные/подтверждающие документы к отчёту.
        3. Есть ли обязанность передать всё полученное по сделкам доверителю.
        4. Есть ли регламент приёмки, утверждения или направления возражений по отчёту.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Для статусных полей: если данные не указаны прямо — возвращай значение "not_defined" из соответствующего enum.
        4. Не используй "None", "null" или пустые строки. Значение "not_defined" используй только в статусных полях по перечню allowed_values.
        5. Если условие прямо указано как отсутствующее (например, «отчётность не требуется», «оправдательные документы не прикладываются») — используй "absent" или "no".
        6. Если отчётность предусмотрена не регулярно, а только по отдельному требованию доверителя — используй "partial" для reporting_clause_status.
        7. В evidence включай только прямую цитату из текста договора.
        8. Верни РОВНО один валидный JSON-объект со всеми 5 ключами (4 поля + evidence), пригодный для парсинга через `json.loads` без предварительной обработки. Без markdown, без ```json, без комментариев, без текста до или после. Начни ответ сразу с `{` и закончи `}`.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — полный регламент отчётности и передачи:
        Фрагмент:
        "Поверенный обязан представить письменный отчёт с приложением оригиналов оправдательных документов в течение 5 рабочих дней после совершения сделки. Всё полученное по сделке имущество и документы передаются Доверителю в течение 3 дней. Доверитель вправе направить мотивированные возражения по отчёту в течение 10 дней."

        Ответ:
        {
          "reporting_clause_status": "present",
          "supporting_docs_required": "yes",
          "transfer_of_proceeds_status": "present",
          "report_acceptance_mechanism": "present",
          "evidence": "Поверенный обязан представить письменный отчёт с приложением оригиналов оправдательных документов в течение 5 рабочих дней после совершения сделки. Всё полученное по сделке имущество и документы передаются Доверителю в течение 3 дней."
        }

        Пример 2 — данные отсутствуют:
        Фрагмент:
        "Поверенный исполняет поручение лично в интересах Доверителя."

        Ответ:
        {
          "reporting_clause_status": "not_defined",
          "supporting_docs_required": "not_defined",
          "transfer_of_proceeds_status": "not_defined",
          "report_acceptance_mechanism": "not_defined",
