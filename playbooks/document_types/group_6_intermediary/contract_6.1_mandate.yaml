      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора поручения сведения
        об обязанностях и ответственности доверителя: приёмка исполнения,
        сроки выплаты вознаграждения и возмещения расходов, ответственность
        за просрочку, последствия отказа от принятия исполнения.
        Сформулируй краткий вердикт для юриста.
        Не анализируй обязанности поверенного, доверенность, передоверие
        или прекращение поручения.
        Не оценивай серьёзность риска — только зафиксируй наблюдаемые параметры.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. principal_obligations_check_presence:
           Агрегатное signal-поле — наличие сведений об обязанностях
           и ответственности доверителя.
           - "present" — если хотя бы одно из содержательных полей
             (acceptance_duty_status, remuneration_payment_term_status,
              expenses_reimbursement_term_status,
              principal_default_liability_status,
              refusal_to_accept_consequences_status)
             ≠ "not_defined";
           - "missing" — если все пять содержательных полей = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - acceptance_duty_status = "not_defined";
           - remuneration_payment_term_status = "not_defined";
           - expenses_reimbursement_term_status = "not_defined";
           - principal_default_liability_status = "not_defined";
           - refusal_to_accept_consequences_status = "not_defined";
           - principal_obligations_verdict = "Данные не определены";
           - не выполняй остальные шаги.

        1. acceptance_duty_status:
           - "defined" — прямо установлена обязанность доверителя принять
             от поверенного всё исполненное (без промедления или в срок);
           - "not_defined" — обязанность приёмки не оговорена.

        2. remuneration_payment_term_status:
           - "defined" — прямо установлен срок или порядок выплаты
             вознаграждения (сроки, привязка к отчёту, акту, событию);
           - "not_defined" — срок выплаты вознаграждения не оговорён.

        3. expenses_reimbursement_term_status:
           - "defined" — прямо установлен срок или порядок возмещения
             расходов поверенного;
           - "not_defined" — порядок возмещения расходов не оговорён.

        4. principal_default_liability_status:
           - "defined" — установлена ответственность доверителя за просрочку
             выплаты (неустойка, проценты, штраф);
           - "not_defined" — специальная ответственность доверителя
             не оговорена.

        5. refusal_to_accept_consequences_status:
           - "defined" — урегулированы последствия отказа доверителя
             от принятия исполнения (право поверенного на вознаграждение,
             возмещение убытков, депонирование);
           - "not_defined" — последствия отказа от принятия не оговорены.

        6. principal_obligations_verdict — краткая фраза-сводка для юриста:
           пример 1: «Обязанности доверителя и ответственность за просрочку установлены»;
           пример 2: «Срок выплаты вознаграждения установлен, ответственность за просрочку не оговорена»;
           пример 3: «Обязанности доверителя не оговорены»;
           пример 4: «Данные не определены».
           Fallback: "Данные не определены" / "Не удалось определить".
        </task>

        <context_rules>
        - Перед остальными полями заполни principal_obligations_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все статусные поля = "not_defined", principal_obligations_verdict = "Данные не определены".
        - Используй только текст договора.
        - Не подставляй нормы закона, обычную практику или предположения вместо текста договора.
        - Не делай выводов по типовой структуре договора поручения.
        - Если порядок определён через отсылку к приложению или регламенту — это валидное значение, укажи отсылку.
        - Если в разных фрагментах указаны противоречивые данные и конфликт нельзя разрешить по тексту — верни principal_obligations_verdict = "Не удалось определить", статусные поля = "not_defined"; presence = "unclear".
        - Не используй "None", "null", "-", "n/a" или пустые строки.
        - Все текстовые значения пиши на русском языке.
        </context_rules>

