  - id: termination_waiver_check
    name: "Ничтожность отказа от права отмены поручения"
    description: >
      Проверяет наличие пунктов, ограничивающих или исключающих право
      односторонней отмены поручения доверителем или отказа поверенного,
      которые ничтожны по ст. 977 п. 2 ГК РФ.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "не вправе отказаться"
        - "не может быть расторгнут"
        - "отказ от права расторжения"
        - "безотзывное поручение"
        - "одностороннее расторжение запрещено"
        - "досрочное прекращение не допускается"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)не\\s+вправе\\s+отказат"
        - "(?i)не\\s+может\\s+быть\\s+расторгнут"
        - "(?i)отказ\\s+от\\s+права\\s+расторж"
        - "(?i)безотзывн(ое|ого)\\s+поручен"
        - "(?i)односторонн(ее|его)\\s+расторжени[ея]\\s+запрещ"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор поручения по Главе 49 ГК РФ.
        Проверяется только один вопрос: наличие пунктов, ограничивающих
        или исключающих право односторонней отмены поручения.

        Нормативный ориентир:
        - ст. 977 п. 1 ГК РФ — договор поручения может быть прекращён
          вследствие отмены поручения доверителем или отказа поверенного
          в любое время;
        - ст. 977 п. 2 ГК РФ — соглашение об отказе от права отмены
          поручения доверителем или отказа поверенного ничтожно;
        - ст. 168 ГК РФ — недействительность сделки, нарушающей
          требования закона (ничтожность).

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора.
        - Не оценивай серьёзность риска.
        - Пункт об отказе от права отмены является ничтожным по закону,
          но его наличие создаёт ложное ощущение безопасности у контрагента.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Есть ли пункт, прямо исключающий право односторонней отмены/отказа.
        2. Есть ли пункт, ограничивающий право отмены (например, только
           по согласию сторон, только по истечении срока, с неустойкой).

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Если данные не указаны прямо — возвращай "not_defined".
        4. Не используй "None", "null", "-", "n/a" или пустые строки.
        5. В evidence включай только текст договора.
        6. Верни РОВНО один валидный JSON-объект со всеми 2 ключами, пригодный
           для парсинга через json.loads без предварительной обработки.
           Без markdown, без ```json, без комментариев, без текста до или после.
           Начни ответ сразу с { и закончи }.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — прямой запрет одностороннего расторжения:
        Фрагмент:
        "Настоящий договор не может быть расторгнут в одностороннем порядке
        до истечения срока его действия. Отказ от исполнения поручения
        не допускается."

        Ответ:
        {
          "termination_waiver_clause": "present",
          "termination_restriction_clause": "present"
        }

        Пример 2 — косвенное ограничение (неустойка за отказ):
        Фрагмент:
        "Каждая из сторон вправе отказаться от исполнения договора,
        уплатив другой стороне неустойку в размере 500 000 рублей."

        Ответ:
        {
          "termination_waiver_clause": "not_defined",
          "termination_restriction_clause": "present"
        }

        Пример 3 — ограничений нет:
        Фрагмент:
        "Доверитель вправе отменить поручение в любое время. Поверенный
        вправе отказаться от исполнения поручения, уведомив Доверителя
        за 15 дней."

        Ответ:
        {
          "termination_waiver_clause": "not_defined",
          "termination_restriction_clause": "not_defined"
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Проверь, что все 2 ключа присутствуют в JSON.
        2. Найди прямую цитату, исключающую право отмены/отказа.
        3. Найди прямую цитату, ограничивающую право отмены/отказа.
        4. Если прямой цитаты нет — верни "not_defined".

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "termination_waiver_clause": "<present / not_defined>",
          "termination_restriction_clause": "<present / not_defined>"
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 360
    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "одностороннее расторжение отказ от поручения отмена поручения не вправе отказаться не может быть расторгнут досрочное прекращение безотзывное поручение неустойка за отказ"
      retrieval_profile: "termination_check"
      preferred_unit_types:
