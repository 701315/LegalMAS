  - id: subdelegation_check
    name: "Передоверие: допустимость, согласие и ответственность"
    description: >
      Проверяет режим передоверия (ст. 976 ГК РФ), необходимость получения
      предварительного согласия доверителя (ст. 187 ГК РФ), а также объём
      ответственности поверенного за выбор заместителя или за его действия.
    triggers:
      any:
        - subdelegation_allowed
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "передоверие"
        - "заместитель"
        - "письменное согласие доверителя"
        - "ответственность за выбор заместителя"
        - "запрет передоверия"
        - "субповеренный"
        - "личное исполнение"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)передовери"
        - "(?i)письменн(ое|ого)\\s+согласи[ея]\\s+доверител"
        - "(?i)ответственност[ьи].{0,30}за\\s+выбор\\s+заместител"
        - "(?i)лично(е|ему)?\\s+исполнени"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор поручения с условиями о передоверии по Главе 49 ГК РФ.
        Проверяется только один вопрос: режим передоверия и ответственность за заместителя.

        Нормативный ориентир:
        - ст. 976 ГК РФ — передоверие исполнения поручения (ответственность за выбор заместителя vs освобождение от ответственности при поименованном заместителе)
        - ст. 187 ГК РФ — передоверие по доверенности (обязанность извещения доверителя, нотариальная форма передоверия)
        - ст. 403 ГК РФ — ответственность должника за действия третьих лиц

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора.
        - Не оценивай серьёзность риска.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Допускается ли передоверие или установлено обязательное личное исполнение.
        2. Требуется ли предварительное согласие доверителя на передоверие.
        3. Определён ли объём ответственности поверенного за действия или выбор заместителя.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Для статусных полей: если данные не указаны прямо — возвращай значение "not_defined" из соответствующего enum.
        4. Не используй "None", "null" или пустые строки. Значение "not_defined" используй только в статусных полях по перечню allowed_values.
        5. Если в тексте прямо указано «Поверенный обязан исполнить поручение лично» или содержится прямой запрет передоверия — используй "prohibited" для subdelegation_status.
        6. В evidence включай только прямую цитату из текста договора.
        7. Верни РОВНО один валидный JSON-объект со всеми 4 ключами (3 поля + evidence), пригодный для парсинга через `json.loads` без предварительной обработки. Без markdown, без ```json, без комментариев, без текста до или после. Начни ответ сразу с `{` и закончи `}`.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — передоверие с согласия и ответственность за выбор:
        Фрагмент:
        "Поверенный вправе передать исполнение поручения заместителю только с предварительного письменного согласия Доверителя. В этом случае Поверенный отвечает лишь за выбор заместителя."

        Ответ:
        {
          "subdelegation_status": "allowed",
          "principal_consent_required": "yes",
          "agent_liability_for_subagent": "for_selection_only",
          "evidence": "Поверенный вправе передать исполнение поручения заместителю только с предварительного письменного согласия Доверителя. В этом случае Поверенный отвечает лишь за выбор заместителя."
        }

        Пример 2 — запрет передоверия (личное исполнение):
        Фрагмент:
        "Поверенный обязан исполнить данное ему поручение лично. Передоверие не допускается."

        Ответ:
        {
          "subdelegation_status": "prohibited",
          "principal_consent_required": "not_defined",
          "agent_liability_for_subagent": "not_defined",
          "evidence": "Поверенный обязан исполнить данное ему поручение лично. Передоверие не допускается."
        }

        Пример 3 — передоверие без согласия с полной ответственностью:
        Фрагмент:
        "Поверенный вправе привлекать субисполнителей и передоверять полномочия третьим лицам без согласия Доверителя, отвечая за их действия как за свои собственные."

        Ответ:
        {
          "subdelegation_status": "allowed",
          "principal_consent_required": "no",
          "agent_liability_for_subagent": "full",
          "evidence": "Поверенный вправе привлекать субисполнителей и передоверять полномочия третьим лицам без согласия Доверителя, отвечая за их действия как за свои собственные."
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Проверь, что все 4 ключа (3 поля + evidence) присутствуют в JSON.
        2. Найди прямую цитату о возможности передоверия или обязанности личного исполнения.
        3. Найди прямую цитату о необходимости согласия доверителя (письменного/предварительного).
        4. Найди прямую цитату об ответственности поверенного за заместителя (за выбор / полная / освобождён).
        5. Если прямой цитаты нет — верни "not_defined" для статусных полей.

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "subdelegation_status": "<allowed / prohibited / unclear / not_defined>",
          "principal_consent_required": "<yes / no / not_defined>",
          "agent_liability_for_subagent": "<for_selection_only / full / absent / not_defined>",
          "evidence": "<прямая цитата из договора>"
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 500

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "передоверие заместитель письменное согласие доверителя ответственность за выбор заместителя запрет передоверия субповеренный личное исполнение"
      retrieval_profile: "consent_check"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - limitations
      negative_keywords:
        - "означает"
        - "в целях настоящего"
        - "отчёт поверенного"
        - "вознаграждение"
        - "отмена поручения"
        - "расходы"
      position_bias:
        preferred_range: [0.30, 0.75]
        boost: 0.12
        scope: segment
      context_k: 6
      max_chunks: 8
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
        - "invoice"
      preferred_clause_functions:
        - "obligations"
        - "limitations"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 35
      max_snippet_length: 600

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 600
      compact_output: false
      store_payload: true

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора поручения сведения
        о режиме передоверия: допустимость, согласие доверителя и ответственность за заместителя.
        Не анализируй доверенность, отчётность или прекращение.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие 3 поля + evidence (всего 4 ключа):

        1. subdelegation_status — "allowed" / "prohibited" / "unclear" / "not_defined".
        2. principal_consent_required — "yes" / "no" / "not_defined".
        3. agent_liability_for_subagent — "for_selection_only" / "full" / "absent" / "not_defined".
        4. evidence — точная цитата из договора о передоверии и заместителе.
        </task>

        <rules>
        - Используй только текст договора.
        - Не делай предположений.
        - subdelegation_status:
          * "allowed" — если передоверие прямо разрешено (с согласия или без);
          * "prohibited" — если передоверие прямо запрещено или установлено обязательное личное исполнение поручения;
          * "unclear" — формулировка размыта;
          * "not_defined" — условие не упомянуто.
        - principal_consent_required:
          * "yes" — требуется предварительное или письменное согласие доверителя;
          * "no" — прямо разрешено передоверие без согласия доверителя;
          * "not_defined" — условие согласия не урегулировано.
        - agent_liability_for_subagent:
          * "for_selection_only" — поверенный отвечает только за выбор заместителя (ст. 976 п. 2 ГК РФ);
          * "full" — поверенный несёт полную ответственность за действия заместителя как за свои собственные;
          * "absent" — поверенный прямо освобождён от ответственности (например, назначен конкретный названный доверителем заместитель);
          * "not_defined" — объём ответственности не указан.
        - Верни РОВНО один валидный JSON-объект со всеми 4 ключами (3 поля + evidence), пригодный для парсинга через `json.loads` без предварительной обработки. Без markdown, без ```json, без комментариев, без текста до или после. Начни ответ сразу с `{` и закончи `}`.
        </rules>

      fields:
        - name: "subdelegation_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["allowed", "prohibited", "unclear", "not_defined"]
          description: "Допустимость передоверия исполнения поручения."
          required: true
        - name: "subdelegation_status_display"
          type: "string"
          presentation: "fact"
          label: "Передоверие"
          description: >
            Человекочитаемое отображение допустимости передоверия
            (backend, by design).
          required: false
          display_in_grid: true
          display_priority: 1
        - name: "principal_consent_required"
          type: "string"
          presentation: "signal"
          allowed_values: ["yes", "no", "not_defined"]
          description: "Необходимость предварительного согласия доверителя на передоверие."
          required: false
        - name: "principal_consent_required_display"
          type: "string"
          presentation: "fact"
          label: "Согласие на передоверие"
          description: >
            Человекочитаемое отображение требования согласия на передоверие
            (backend, by design).
          required: false
          display_in_grid: true
          display_priority: 2
        - name: "agent_liability_for_subagent"
          type: "string"
          presentation: "signal"
          allowed_values: ["for_selection_only", "full", "absent", "not_defined"]
          description: "Объём ответственности поверенного за заместителя."
          required: false
        - name: "agent_liability_for_subagent_display"
          type: "string"
          presentation: "fact"
          label: "Ответственность за заместителя"
          description: >
            Человекочитаемое отображение ответственности поверенного за заместителя
            (backend, by design).
          required: false
          display_in_grid: true
          display_priority: 3

  - id: commercial_representation_check
    name: "Коммерческое представительство: специальные условия"
    description: >
      Проверяет наличие статуса коммерческого представителя (ст. 184 ГК РФ),
      допустимость одновременного представительства разных сторон сделки
      (двойное представительство) и надлежащую фиксацию полномочий
      в письменной форме. Выявляет риски недействительности сделок
      из-за отсутствия согласия обеих сторон на двойное представительство.
    triggers:
      any:
