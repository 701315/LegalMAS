        2. Доверенность упомянута, но без обязанности, объём размыт.
          «Поверенный действует по доверенности… совершает все необходимые действия».
          → presence = "present";
            poa_clause_status = "mentioned";
            authority_scope_status = "generic";
            notarial_poa_reference = "not_defined".

        3. Противоречие между фрагментами.
          В разных частях договора указаны разные требования к доверенности
          (обязательна / не требуется) или разные объёмы полномочий.
          → presence = "unclear";
            соответствующий *_status = "not_defined";
            poa_verdict = "Не удалось определить".

        4. Отсылка на внешний документ.
          Полномочия или нотариальная форма определяются приложением,
          регламентом или отдельным документом.
          → presence = "present";
            authority_scope_status = "defined" (если ссылка на конкретный документ);
            notarial_poa_reference = "present" (если в тексте есть указание на нотариальную форму).
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для poa_and_authority_check_presence используй только: "present", "missing", "unclear".
        - Для poa_clause_status используй только: "required", "mentioned", "not_defined".
        - Для authority_scope_status используй только: "defined", "generic", "not_defined".
        - Для notarial_poa_reference используй только: "present", "not_defined".
        - Fallback при отсутствии данных:
          * poa_verdict → "Данные не определены";
          * статусные поля → "not_defined".
        - Fallback при противоречии или неоднозначности:
          * poa_verdict → "Не удалось определить";
          * статусные поля → "not_defined".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "poa_and_authority_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие сведений о доверенности и полномочиях. Внутреннее агрегатное signal-поле."
          required: true

        - name: "poa_verdict"
          type: "string"
          presentation: "summary"
          label: "Доверенность и полномочия — вердикт"
          description: "Краткая сводка о доверенности, объёме полномочий и нотариальной форме."
          required: false
          display_in_grid: true
          display_priority: 1

        - name: "poa_clause_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["required", "mentioned", "not_defined"]
          display_in_grid: false
          description: "Наличие обязанности выдать доверенность. Внутреннее enum-поле."
          required: true

        - name: "authority_scope_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "generic", "not_defined"]
          display_in_grid: false
          description: "Определённость объёма полномочий. Внутреннее enum-поле."
          required: true

        - name: "notarial_poa_reference"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["present", "not_defined"]
          display_in_grid: false
          description: "Указание на нотариальную форму доверенности. Внутреннее enum-поле."
          required: true

      store_payload: true

  - id: authority_limits_and_conflict_check
    name: "Пределы полномочий и конфликт интересов"
    description: >
      Проверяет ограничения на действия поверенного, лимиты сумм/сделок,
      запрет двойного представительства и антиконфликтные оговорки.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "пределы полномочий"
        - "максимальная сумма сделки"
        - "предварительное письменное согласование"
        - "конфликт интересов"
        - "не вправе совершать сделки с самим собой"
        - "аффилированные лица"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)максимальн(ая|ой)\\s+сумм[аы]\\s+сделк"
        - "(?i)конфликт\\s+интерес"
        - "(?i)не\\s+вправе\\s+совершать\\s+сделки\\s+с\\s+самим\\s+собой"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор поручения по Главе 49 ГК РФ.
        Проверяется только один вопрос: ограничения полномочий поверенного
        и защита от конфликта интересов.

        Нормативный ориентир:
        - ст. 182 п. 3 ГК РФ — запрет представителю совершать сделки
          от имени представляемого в отношении себя лично и в отношении
          другого лица, представителем которого он одновременно является
          (двойное представительство);
        - ст. 174 ГК РФ — последствия ограничения полномочий (сделка
          может быть признана недействительной);
        - ст. 10 ГК РФ — злоупотребление правом (общий принцип).

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора.
        - Не оценивай серьёзность риска.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Есть ли ограничения полномочий (лимиты сумм, запрет отдельных действий).
        2. Есть ли антиконфликтная оговорка.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Если данные не указаны прямо — возвращай "not_defined".
        4. Не используй "None", "null", "-", "n/a" или пустые строки.
        5. Если ограничения определены через отсылку к приложению, регламенту
          или иному документу — это валидное значение, а не "not_defined".
        6. В evidence включай только текст договора.
        7. Верни РОВНО один валидный JSON-объект со всеми 2 ключами, пригодный
          для парсинга через json.loads без предварительной обработки.
          Без markdown, без ```json, без комментариев, без текста до или после.
          Начни ответ сразу с { и закончи }.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — ограничения и антиконфликт полностью:
        Фрагмент:
        "Поверенный не вправе совершать сделки на сумму свыше 1 000 000 рублей
        без предварительного письменного согласования с Доверителем. Поверенный
        не вправе совершать сделки с самим собой, с аффилированными лицами,
        а также выступать представителем другой стороны по сделке."

        Ответ:
        {
          "authority_limits_status": "present",
          "conflict_of_interest_status": "present"
        }

        Пример 2 — частичные ограничения, частичный антиконфликт:
        Фрагмент:
        "Поверенный не вправе совершать сделки с недвижимостью без согласия
        Доверителя. Поверенный не вправе совершать сделки с самим собой."

        Ответ:
        {
          "authority_limits_status": "partial",
          "conflict_of_interest_status": "partial"
        }

        Пример 3 — ничего не указано:
        Фрагмент:
        "Поверенный действует в интересах Доверителя в пределах полномочий,
        определённых настоящим договором."

        Ответ:
        {
          "authority_limits_status": "not_defined",
          "conflict_of_interest_status": "not_defined"
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Проверь, что все 2 ключа присутствуют в JSON.
        2. Найди прямую цитату об ограничениях полномочий.
        3. Найди прямую цитату о конфликте интересов.
        4. Если прямой цитаты нет — верни "not_defined".

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "authority_limits_status": "<present / partial / not_defined>",
          "conflict_of_interest_status": "<present / partial / not_defined>"
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 380

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "пределы полномочий максимальная сумма сделки предварительное письменное согласование конфликт интересов сделки с самим собой аффилированные лица двойное представительство ограничения поверенного запрет сделок"
      retrieval_profile: "authority_check"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - limitations
      negative_keywords:
        - "в целях настоящего"
        - "отчёт поверенного"
        - "вознаграждение"
        - "отмена поручения"
      position_bias:
        preferred_range: [0.15, 0.60]
        boost: 0.30
        scope: segment
      context_k: 6
      max_chunks: 9
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
        - "invoice"
      preferred_clause_functions:
        - "obligations"
        - "limitations"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 580

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 700

      compact_output: false

      presence_signal:
        field: "authority_limits_and_conflict_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора поручения сведения
        об ограничениях полномочий поверенного и антиконфликтных оговорках.
        Сформулируй краткий вердикт для юриста.
        Не анализируй доверенность, отчётность, вознаграждение или прекращение.
        Не оценивай серьёзность риска — только зафиксируй наблюдаемые параметры
        ограничений и антиконфликтных оговорок.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. authority_limits_and_conflict_check_presence:
          Агрегатное signal-поле — наличие сведений об ограничениях и антиконфликте.
          - "present" — если хотя бы одно из содержательных полей
            (authority_limits_status, conflict_of_interest_status)
            ≠ "not_defined";
          - "missing" — если оба содержательных поля = "not_defined";
          - "unclear" — если фрагменты по теме есть, но из-за противоречий
            вывод невозможен.

          Если presence = "missing":
          - authority_limits_status = "not_defined";
          - conflict_of_interest_status = "not_defined";
          - limits_conflict_verdict = "Данные не определены";
          - не выполняй остальные шаги.

        1. authority_limits_status:
          - "present" — установлены конкретные ограничения (лимиты сумм,
            запрет отдельных видов сделок, требование предварительного
            согласования);
          - "partial" — есть отдельные ограничения, но не системные
            (например, только запрет сделок с недвижимостью без лимитов
            по иным сделкам);
          - "not_defined" — ограничения не установлены.

        2. conflict_of_interest_status:
          - "present" — есть комплексная антиконфликтная оговорка (запрет
            сделок с самим собой + запрет двойного представительства +
            аффилированные лица, или общая формулировка «конфликт интересов»);
          - "partial" — есть только часть запретов (например, только запрет
            сделок с самим собой, но нет запрета двойного представительства);
          - "not_defined" — антиконфликтные оговорки отсутствуют.

        3. limits_conflict_verdict — краткая фраза-сводка для юриста:
          пример 1: «Ограничения и антиконфликт установлены в полном объёме»;
          пример 2: «Частичные ограничения, антиконфликт не покрывает двойное представительство»;
          пример 3: «Ограничения и антиконфликт не установлены»;
          пример 4: «Данные не определены».
          Fallback: "Данные не определены" / "Не удалось определить".
        </task>

        <context_rules>
        - Перед остальными полями заполни authority_limits_and_conflict_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все статусные поля = "not_defined", limits_conflict_verdict = "Данные не определены".
        - Используй только текст договора.
        - Не подставляй нормы закона, обычную практику или предположения вместо текста договора.
        - Не делай выводов по типовой структуре договора поручения.
        - Если ограничения определены через отсылку к приложению, регламенту или иному документу — это валидное значение, укажи отсылку.
        - Если в разных фрагментах указаны противоречивые данные и конфликт нельзя разрешить по тексту — верни limits_conflict_verdict = "Не удалось определить", статусные поля = "not_defined"; presence = "unclear".
        - Не используй "None", "null", "-", "n/a" или пустые строки.
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
          В тексте нет ни ограничений полномочий, ни антиконфликтных оговорок.
          → presence = "missing";
            authority_limits_status = conflict_of_interest_status = "not_defined";
            limits_conflict_verdict = "Данные не определены".

        2. Частичные ограничения.
          Установлены отдельные запреты или лимиты, но без системного покрытия.
          → presence = "present";
            authority_limits_status = "partial" (или "present", если ограничения системные);
            conflict_of_interest_status = "partial" (или "present").

        3. Противоречие между фрагментами.
          В разных частях договора указаны разные лимиты или разные
          антиконфликтные правила.
          → presence = "unclear";
            соответствующий *_status = "not_defined";
            limits_conflict_verdict = "Не удалось определить".

        4. Отсылка на внешний документ.
          Ограничения или антиконфликтные правила определяются приложением,
          регламентом или иным документом.
          → presence = "present";
            соответствующий *_status = "present" (если есть ссылка на конкретный документ);
            limits_conflict_verdict содержит текст отсылки.
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для authority_limits_and_conflict_check_presence используй только: "present", "missing", "unclear".
        - Для authority_limits_status используй только: "present", "partial", "not_defined".
        - Для conflict_of_interest_status используй только: "present", "partial", "not_defined".
        - Fallback при отсутствии данных:
          * limits_conflict_verdict → "Данные не определены";
          * статусные поля → "not_defined".
        - Fallback при противоречии или неоднозначности:
          * limits_conflict_verdict → "Не удалось определить";
          * статусные поля → "not_defined".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "authority_limits_and_conflict_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие сведений об ограничениях полномочий и антиконфликтных оговорках. Внутреннее агрегатное signal-поле."
          required: true

        - name: "limits_conflict_verdict"
          type: "string"
          presentation: "summary"
          label: "Ограничения и конфликт — вердикт"
          description: "Краткая сводка об ограничениях полномочий и антиконфликтных оговорках."
          required: false
          display_in_grid: true
          display_priority: 1

        - name: "authority_limits_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["present", "partial", "not_defined"]
          display_in_grid: false
          description: "Статус ограничений полномочий поверенного. Внутреннее enum-поле."
          required: true

        - name: "conflict_of_interest_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["present", "partial", "not_defined"]
          display_in_grid: false
          description: "Наличие антиконфликтных оговорок. Внутреннее enum-поле."
          required: true

      store_payload: true

  - id: instructions_and_expenses_check
    name: "Указания доверителя и возмещение расходов"
    description: >
      Проверяет наличие указаний доверителя, их обязательность для поверенного,
      а также порядок возмещения расходов и авансирования.
    triggers:
      any:
        - principal_instructions_present
        - expense_reimbursement
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "указания доверителя"
        - "в соответствии с указаниями"
        - "инструкции доверителя"
        - "согласование действий"
        - "возместить расходы"
        - "аванс на расходы"
        - "смета расходов"
        - "документально подтвержденные расходы"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)указани[яе]\\s+доверител"
        - "(?i)в\\s+соответствии\\s+с\\s+указаниями"
        - "(?i)возместит[ья].{0,20}расход"
        - "(?i)аванс\\s+на\\s+расход"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор поручения по Главе 49 ГК РФ.
        Проверяется только один вопрос: указания доверителя и возмещение расходов.

        Нормативный ориентир:
        - ст. 973 ГК РФ — исполнение поручения:
          п. 1 — поверенный обязан исполнять указания доверителя, если они
          правомерны, осуществимы и конкретны;
          п. 2 — если указания неконкретны, поверенный обязан запросить
          уточнения;
        - ст. 975 п. 1 ГК РФ — обязанности доверителя: обеспечить поверенного
          средствами, возместить понесённые расходы (императивная норма —
          действует даже при молчании договора).

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора,
          а чего прямо нет.
        - Не оценивай серьёзность риска.
        - Отсутствие оговорки о расходах не означает отсутствие обязанности
          (ст. 975 ГК РФ императивна), но для extraction фиксируй только
          наличие / отсутствие текста в договоре.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Есть ли указания доверителя и их обязательность.
        2. Есть ли порядок возмещения расходов.
        3. Есть ли авансирование расходов.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Если данные не указаны прямо — возвращай "not_defined".
        4. Не используй "None", "null", "-", "n/a" или пустые строки.
