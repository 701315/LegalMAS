        Нормативный ориентир:
        - ст. 971 ГК РФ — предмет договора поручения (юридические действия);
        - ст. 432 ГК РФ — существенные условия договора;
        - ст. 779 ГК РФ — возмездное оказание услуг (риск переквалификации,
          если действия по сути фактические / сервисные).

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора.
        - Не оценивай серьёзность риска.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Степень конкретизации действий.
        2. Юридическую природу действий.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Если данные не указаны прямо — возвращай "not_defined".
        4. Не используй "None", "null", "-", "n/a" или пустые строки.
        5. Если предмет определён через отсылку к приложению, спецификации
