          "expense_reimbursement_status": "defined",
          "advance_status": "defined",
          "evidence": "Поверенный обязан исполнять указания Доверителя. Расходы возмещаются по документально подтверждённым затратам в течение 10 рабочих дней."
        }

        Пример 2 — данные отсутствуют:
        Фрагмент:
        "Поверенный действует самостоятельно в интересах Доверителя."

        Ответ:
        {
          "instructions_status": "not_defined",
          "expense_reimbursement_status": "not_defined",
          "advance_status": "not_defined",
          "evidence": "Поверенный действует самостоятельно в интересах Доверителя."
