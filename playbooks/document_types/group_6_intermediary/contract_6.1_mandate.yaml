        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие 5 полей + evidence (всего 6 ключей):
        
        Заполни строго следующие 5 полей:

        1. reporting_clause_status — "present" / "partial" / "not_defined".
        2. supporting_docs_required — "yes" / "no" / "not_defined".
        3. transfer_of_proceeds_status — "present" / "not_defined".
        4. report_acceptance_mechanism — "present" / "not_defined".
        5. reporting_transfer_verdict — краткая человекочитаемая сводка (одна фраза).

        Если данные отсутствуют:
        - статусные поля = "not_defined";
        - reporting_transfer_verdict = "Данные не определены".

        Если форма отчёта или порядок определены через отсылку к приложению —
        укажи это, отсылка является валидным значением "present".

        Верни РОВНО один валидный JSON-объект со всеми 5 ключами, пригодный
        для парсинга через json.loads без предварительной обработки.
        Без markdown, без ```json, без комментариев, без текста до или после.
        Начни ответ сразу с { и закончи }.
        </task>

        <rules>
        - Используй только текст договора.
        - Не делай предположений.
        - reporting_clause_status:
          "present" — установлена обязанность представления отчёта с указанием
          сроков и/или формы отчёта;
          "partial" — отчёт упомянут без сроков и конкретной формы;
          "not_defined" — отчётность в договоре не упомянута.
        - supporting_docs_required:
          "yes" — прямо требуется приложение оправдательных (первичных) документов;
          "no" — отчёт предусмотрен, но приложение документов прямо не требуется;
          "not_defined" — отчётность не оговорена.
