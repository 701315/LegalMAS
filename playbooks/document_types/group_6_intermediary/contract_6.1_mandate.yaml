        Нормативный ориентир:
        - ст. 977 ГК РФ — прекращение договора поручения (безусловное право на отмену поручения и отказ от него)
        - ст. 978 ГК РФ — последствия прекращения договора поручения (выплата вознаграждения за выполненную часть, возмещение издержек, убытки)
