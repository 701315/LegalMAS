    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор поручения с условиями коммерческого представительства по Главе 49 ГК РФ.
        Проверяется только один вопрос: специальные условия коммерческого представительства.

        Нормативный ориентир:
        - ст. 184 ГК РФ — коммерческое представительство (самостоятельное постоянное представительство предпринимателей; допустимость одновременного представительства обеих сторон только с их согласия; обязательная письменная форма фиксации полномочий)
        - ст. 182 ГК РФ — представительство

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора.
        - Не оценивай серьёзность риска.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Есть ли прямое указание на статус коммерческого представителя / коммерческого представительства.
        2. Предусмотрена ли возможность одновременного представительства разных сторон в сделке (двойное представительство).
        3. Зафиксированы ли полномочия коммерческого представителя в письменной форме договора или доверенности.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Для статусных полей: если данные не указаны прямо — возвращай значение "not_defined" из соответствующего enum.
        4. Не используй "None", "null" или пустые строки. Значение "not_defined" используй только в статусных полях по перечню allowed_values.
        5. Если условие прямо указано как отсутствующее или запрещённое (например, «Поверенный не вправе представлять интересы контрагента по сделке») — используй "absent".
        6. В evidence включай только прямую цитату из текста договора.
        7. Верни РОВНО один валидный JSON-объект со всеми 4 ключами (3 поля + evidence), пригодный для парсинга через `json.loads` без предварительной обработки. Без markdown, без ```json, без комментариев, без текста до или после. Начни ответ сразу с `{` и закончи `}`.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — коммерческое представительство и согласие на двойное представительство:
        Фрагмент:
        "Поверенный действует в качестве коммерческого представителя Доверителя в сфере оптовой торговли. Поверенный вправе одновременно представлять интересы покупателей при условии получения их предварительного письменного согласия. Полномочия Поверенного определены настоящим договором в письменной форме."

        Ответ:
        {
