  - id: agreement_term_and_renewal_check
    name: "Срок действия договора, момент вступления в силу и пролонгация"
    description: >
      Проверяет срок действия самого договора поручения (не доверенности),
      момент вступления в силу, порядок автоматической пролонгации
      и последствия исполнения после истечения срока.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "срок действия договора"
        - "договор вступает в силу"
        - "пролонгация"
        - "автоматическое продление"
        - "срок поручения"
        - "действует до"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)срок\\s+действи[яе].{0,20}договор"
        - "(?i)договор\\s+вступает\\s+в\\s+силу"
        - "(?i)пролонгац|автоматическ[а-я]+\\s+продлени"
        - "(?i)действу[ею]т?\\s+до\\s+"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор поручения по Главе 49 ГК РФ.
        Проверяется только один вопрос: срок действия самого договора
        поручения, момент вступления в силу и порядок продления.

        Нормативный ориентир:
        - ст. 425 ГК РФ — договор вступает в силу с момента заключения,
          если иное не предусмотрено договором;
        - ст. 971, 977 ГК РФ — поручение может быть срочным или бессрочным,
          прекращается в том числе вследствие отмены поручения или отказа
          поверенного в любое время;
        - п. 5 Информационного письма Президиума ВАС РФ от 23.10.2000 № 57 —
          разъяснения о моменте прекращения поручения;
        - ст. 186 ГК РФ — срок доверенности (независимо от срока договора).

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора.
        - Не оценивай серьёзность риска.
        - Срок доверенности — не то же самое, что срок действия договора.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Момент вступления договора в силу.
        2. Срок действия договора (срочный/бессрочный).
        3. Соответствие срока договора и срока поручения.
        4. Порядок автоматической пролонгации.
        5. Урегулированы ли последствия исполнения после истечения срока.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Если данные не указаны прямо — возвращай "not_defined".
        4. Не используй "None", "null", "-", "n/a" или пустые строки.
        5. Если условия определены через отсылку к приложению — это валидное
           значение, укажи отсылку.
        6. В evidence включай только текст договора.
        7. Верни РОВНО один валидный JSON-объект со всеми 5 ключами, пригодный
           для парсинга через json.loads без предварительной обработки.
           Без markdown, без ```json, без комментариев, без текста до или после.
           Начни ответ сразу с { и закончи }.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — срочный договор с пролонгацией и согласованным сроком:
        Фрагмент:
        "Договор вступает в силу с момента подписания и действует 3 года.
        Срок действия договора соответствует сроку поручения. Если ни одна
        из сторон не заявит о прекращении за 30 дней до истечения срока,
        договор автоматически продлевается на тот же срок."

        Ответ:
        {
          "effectiveness_moment_status": "defined",
          "agreement_term_status": "defined",
          "term_vs_poa_alignment": "aligned",
          "auto_renewal_status": "defined",
          "post_term_effects_status": "not_defined"
        }

        Пример 2 — бессрочный договор без пролонгации:
        Фрагмент:
        "Договор вступает в силу с даты подписания и действует до полного
        исполнения сторонами своих обязательств."

        Ответ:
        {
          "effectiveness_moment_status": "defined",
          "agreement_term_status": "defined",
          "term_vs_poa_alignment": "not_defined",
          "auto_renewal_status": "not_defined",
          "post_term_effects_status": "not_defined"
        }

        Пример 3 — срок и момент вступления не указаны:
        Фрагмент:
        "Поверенный обязуется совершить от имени Доверителя юридические действия,
        указанные в разделе 2 настоящего договора."

        Ответ:
        {
          "effectiveness_moment_status": "not_defined",
          "agreement_term_status": "not_defined",
          "term_vs_poa_alignment": "not_defined",
          "auto_renewal_status": "not_defined",
          "post_term_effects_status": "not_defined"
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Проверь, что все 5 ключей присутствуют в JSON.
        2. Найди прямую цитату о моменте вступления в силу.
        3. Найди прямую цитату о сроке действия договора.
        4. Сравни срок договора со сроком поручения.
        5. Найди прямую цитату о пролонгации.
        6. Найди прямую цитату о последствиях исполнения после истечения срока.
        7. Если прямой цитаты нет — верни "not_defined".

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "effectiveness_moment_status": "<defined / not_defined>",
          "agreement_term_status": "<defined / not_defined>",
          "term_vs_poa_alignment": "<aligned / misaligned / not_defined>",
          "auto_renewal_status": "<defined / not_defined>",
          "post_term_effects_status": "<defined / not_defined>"
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 460
