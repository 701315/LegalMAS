      compact_output: false

      presence_signal:
        field: "unauthorized_transaction_approval_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора поручения сведения
        о режиме одобрения сделок, совершённых поверенным без полномочий
        или с превышением: механизм, сроки, форму, условие о молчании
        и последствия неодобрения.
        Сформулируй краткий вердикт для юриста.
        Не анализируй общий объём полномочий, доверенность или вознаграждение.
        Не оценивай серьёзность риска — только зафиксируй наблюдаемые параметры.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. unauthorized_transaction_approval_check_presence:
           Агрегатное signal-поле — наличие сведений о режиме одобрения
           сделок без полномочий.
           - "present" — если хотя бы одно из содержательных полей
             (approval_mechanism_status, approval_deadline_status,
              approval_form_status, silence_as_approval_status,
              non_approval_consequences_status)
             ≠ "not_defined";
           - "missing" — если все пять содержательных полей = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - approval_mechanism_status = "not_defined";
           - approval_deadline_status = "not_defined";
           - approval_form_status = "not_defined";
           - silence_as_approval_status = "not_defined";
           - non_approval_consequences_status = "not_defined";
           - unauthorized_approval_verdict = "Данные не определены";
           - не выполняй остальные шаги.

        1. approval_mechanism_status:
           - "defined" — прямо урегулирован порядок последующего одобрения
             сделок, совершённых без полномочий или с превышением;
           - "not_defined" — механизм одобрения не оговорён (действует
             ст. 183 п. 2 ГК РФ по общему правилу).

        2. approval_deadline_status:
           - "defined" — установлен срок на одобрение или отказ от одобрения;
           - "not_defined" — срок не оговорён.

        3. approval_form_status:
           - "defined" — прямо указана форма одобрения (письменное согласие,
             конклюдентные действия, акцепт и т. п.);
           - "not_defined" — форма одобрения не оговорена.

        4. silence_as_approval_status:
           - "defined" — прямо предусмотрено, что молчание доверителя
             считается одобрением либо, наоборот, прямо указано, что молчание
             одобрением не является;
           - "not_defined" — вопрос о молчании как форме одобрения
             не урегулирован.

        5. non_approval_consequences_status:
           - "defined" — урегулированы последствия неодобрения для поверенного
             (ответственность перед третьим лицом, возмещение убытков,
             возмещение расходов поверенного);
           - "not_defined" — последствия неодобрения не оговорены.

        6. unauthorized_approval_verdict — краткая фраза-сводка для юриста:
           пример 1: «Режим одобрения сделок без полномочий урегулирован полностью (ст. 183 п. 2 ГК РФ)»;
           пример 2: «Механизм одобрения предусмотрен, срок и последствия неодобрения не оговорены»;
           пример 3: «Режим одобрения не согласован»;
           пример 4: «Данные не определены».
           Fallback: "Данные не определены" / "Не удалось определить".
        </task>

        <context_rules>
        - Перед остальными полями заполни unauthorized_transaction_approval_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все статусные поля = "not_defined", unauthorized_approval_verdict = "Данные не определены".
        - Используй только текст договора.
        - Не подставляй нормы закона, обычную практику или предположения вместо текста договора.
        - Не делай выводов по типовой структуре договора поручения.
        - Если условия определены через отсылку к приложению или регламенту — это валидное значение, укажи отсылку.
        - Если в разных фрагментах указаны противоречивые данные и конфликт нельзя разрешить по тексту — верни unauthorized_approval_verdict = "Не удалось определить", статусные поля = "not_defined"; presence = "unclear".
        - Не используй "None", "null", "-", "n/a" или пустые строки.
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни механизма одобрения, ни сроков, ни формы,
           ни последствий неодобрения.
           → presence = "missing";
             все статусные поля = "not_defined";
             unauthorized_approval_verdict = "Данные не определены".

        2. Неполное раскрытие темы.
           Механизм одобрения предусмотрен, но срок, форма и последствия
           неодобрения не оговорены.
           → presence = "present";
             approval_mechanism_status = "defined";
             approval_deadline_status = "not_defined";
             approval_form_status = "not_defined";
             non_approval_consequences_status = "not_defined".

        3. Противоречие между фрагментами.
           В разных частях договора противоречиво указаны форма одобрения
           или сроки.
           → presence = "unclear";
             соответствующий *_status = "not_defined";
             unauthorized_approval_verdict = "Не удалось определить".

        4. Специальное условие о молчании.
           Договор прямо указывает, что молчание доверителя в течение
           определённого срока считается одобрением.
           → presence = "present";
             approval_mechanism_status = "defined";
             silence_as_approval_status = "defined";
             unauthorized_approval_verdict содержит указание на молчаливое одобрение.
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для unauthorized_transaction_approval_check_presence используй только: "present", "missing", "unclear".
        - Для всех статусных полей используй только: "defined", "not_defined".
        - Fallback при отсутствии данных:
          * unauthorized_approval_verdict → "Данные не определены";
          * статусные поля → "not_defined".
        - Fallback при противоречии или неоднозначности:
          * unauthorized_approval_verdict → "Не удалось определить";
          * статусные поля → "not_defined".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "unauthorized_transaction_approval_check_presence"
          type: "string"
          presentation: "signal"
