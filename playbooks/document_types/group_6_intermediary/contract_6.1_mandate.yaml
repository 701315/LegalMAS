    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 600

      compact_output: false

      presence_signal:
        field: "subject_legal_actions_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора поручения сведения
        о предмете: степень конкретизации действий, их юридическую природу
        и сформулируй краткую сводку для юриста.
        Не анализируй доверенность, отчётность, вознаграждение или прекращение.
        Не оценивай серьёзность риска — только зафиксируй наблюдаемые характеристики
        предмета поручения.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. subject_legal_actions_check_presence:
          Агрегатное signal-поле — наличие сведений о предмете поручения.
          - "present" — если хотя бы одно из содержательных полей
            (actions_specificity, actions_nature) ≠ "not_defined";
          - "missing" — если оба содержательных поля = "not_defined";
          - "unclear" — если фрагменты по теме есть, но из-за противоречий
            вывод невозможен.

          Если presence = "missing":
          - actions_specificity = "not_defined";
          - actions_nature = "not_defined";
          - subject_verdict = "Данные не определены";
          - не выполняй остальные шаги.

        1. actions_specificity:
          - "specific" — все действия перечислены определённо и проверяемо;
          - "partial" — часть действий перечислена конкретно, часть дана
            общей формулой (например, «заключить договор аренды и совершить
            иные необходимые действия»);
          - "generic" — только общие формулы («любые необходимые действия»);
          - "not_defined" — предмет не описан.

        2. actions_nature:
          - "legal" — действия порождают, изменяют или прекращают права
            (заключение договоров, подписание, регистрация, представление в суде);
          - "factual_or_service_like" — действия не создают самостоятельных
            юридических последствий (поиск, показы, переговоры, консультирование);
          - "mixed" — договор содержит одновременно и юридические, и фактические
            действия;
          - "unclear" — природа отдельного действия неоднозначна;
          - "not_defined" — предмет не описан.

        3. subject_verdict — краткая фраза-сводка для юриста, объединяющая
          конкретность и природу действий. Примеры:
          «Действия конкретны и юридические»;
          «Общая формула действий — риск незаключённости (ст. 432 ГК РФ)»;
          «Действия фактические — риск переквалификации в возмездные
          услуги (ст. 779 ГК РФ)»;
          «Часть действий не конкретизирована — риск частичной незаключённости».
          Fallback: "Данные не определены" / "Не удалось определить".
        </task>

        <context_rules>
        - Перед остальными полями заполни subject_legal_actions_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — actions_specificity = actions_nature = "not_defined", subject_verdict = "Данные не определены".
        - Используй только текст договора.
        - Не подставляй нормы закона, обычную практику или предположения вместо текста договора.
        - Если предмет определён через отсылку к приложению, спецификации или иному документу — оценивай конкретность по тексту отсылки, если он есть в контексте.
        - Если в разных фрагментах указаны разные перечни действий и конфликт нельзя разрешить по тексту — верни subject_verdict = "Не удалось определить", а статусные поля = "not_defined" (для specificity) / "unclear" (для nature, если предусмотрено); presence = "unclear".
        - Не используй "None", "null", "-", "n/a" или пустые строки.
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
          В тексте нет упоминания предмета поручения или перечня действий.
          → presence = "missing"; actions_specificity = actions_nature = "not_defined";
            subject_verdict = "Данные не определены".

        2. Общая формула без конкретики.
          «Поверенный совершает любые необходимые действия в интересах Доверителя».
          → presence = "present"; actions_specificity = "generic";
            actions_nature = "unclear"; subject_verdict — с указанием на риск
            незаключённости.

        3. Противоречие между фрагментами.
          В разных частях договора указаны разные перечни действий или разная
          природа действий.
          → presence = "unclear"; actions_specificity = "not_defined";
            actions_nature = "unclear"; subject_verdict = "Не удалось определить".

        4. Отсылка на внешний документ.
          Предмет поручения определяется приложением/спецификацией; конкретность
          оценивается по тексту отсылки, если он есть в контексте.
          → presence = "present"; соответствующие поля заполняются по смыслу.
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для subject_legal_actions_check_presence используй только: "present", "missing", "unclear".
        - Для actions_specificity используй только: "specific", "partial", "generic", "not_defined".
        - Для actions_nature используй только: "legal", "mixed", "factual_or_service_like", "unclear", "not_defined".
        - Fallback при отсутствии данных:
          * subject_verdict → "Данные не определены";
          * actions_specificity, actions_nature → "not_defined".
        - Fallback при противоречии или неоднозначности:
          * subject_verdict → "Не удалось определить";
          * actions_specificity → "not_defined"; actions_nature → "unclear".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "subject_legal_actions_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие сведений о предмете поручения. Внутреннее агрегатное signal-поле."
