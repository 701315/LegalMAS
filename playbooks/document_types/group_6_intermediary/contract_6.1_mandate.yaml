        - name: "reporting_transfer_verdict"
          type: "string"
          presentation: "summary"
          label: "Отчётность и передача — вердикт"
          description: "Краткая сводка об отчётности поверенного, оправдательных документах, передаче полученного и порядке приёмки."
          required: false
