        6. В evidence включай только текст договора.
        7. Верни РОВНО один валидный JSON-объект со всеми 5 ключами, пригодный
           для парсинга через json.loads без предварительной обработки.
           Без markdown, без ```json, без комментариев, без текста до или после.
           Начни ответ сразу с { и закончи }.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — срок доверенности определён, совпадает с поручением, безотзывная:
        Фрагмент:
        "Доверитель выдаёт Поверенному нотариальную доверенность сроком на 3 года,
        совпадающим со сроком действия настоящего договора. Доверенность является
        безотзывной в соответствии со ст. 188.1 ГК РФ. При передоверии заместитель
        действует на основании нотариально удостоверенной доверенности."

