          право отступления в интересах доверителя)
        - ст. 974 ГК РФ — обязанности поверенного (отчёт о расходах с приложением
          оправдательных документов)
        - ст. 975 ГК РФ — обязанности доверителя (возмещение расходов, выдача
          аванса на расходы)

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора.
        - Не оценивай серьёзность риска.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Есть ли указания доверителя и их обязательность для поверенного.
        2. Есть ли порядок возмещения расходов поверенного.
        3. Есть ли авансирование расходов доверителем.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Для статусных полей: если данные не указаны прямо — возвращай
           значение "not_defined" из соответствующего enum.
        4. Не используй "None", "null" или пустые строки. Значение "not_defined"
           используй только в статусных полях по перечню allowed_values.
        5. Если условие прямо указано как отсутствующее (например, «расходы
           не возмещаются отдельно», «аванс не предоставляется», «Поверенный
           действует по своему усмотрению без указаний») — используй "absent".
        6. Если параметр определяется через отсылку к иному документу
           (например, «порядок возмещения определяется отдельным соглашением»,
           «расходы согласно смете в Приложении №2») — используй "by_agreement".
        7. В evidence включай только прямую цитату из текста договора.
        8. Верни РОВНО один валидный JSON-объект со всеми 4 ключами
           (3 поля + evidence), пригодный для парсинга через `json.loads`
           без предварительной обработки. Без markdown, без ```json, без
