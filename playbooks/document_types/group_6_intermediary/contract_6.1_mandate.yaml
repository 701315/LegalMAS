        Без markdown, без ```json, без комментариев, без текста до или после.
        Начни ответ сразу с { и закончи }.
        </task>

        <rules>
        - Используй только текст договора.
        - Не делай предположений.
        - poa_term_status:
          "defined" — срок доверенности прямо указан в договоре;
          "not_defined" — доверенность не упомянута или срок не указан
          (по умолчанию — 1 год по ст. 186 п.1 ГК РФ).
        - poa_term_alignment:
          "aligned" — срок доверенности совпадает со сроком поручения
          или превышает его;
          "misaligned" — срок доверенности короче срока поручения
          (риск потери полномочий до завершения поручения);
          "not_defined" — невозможно сравнить (один из сроков не указан).
        - poa_renewal_mechanism:
          "present" — предусмотрен механизм продления или перевыдачи
          доверенности до истечения срока;
          "not_defined" — механизм не оговорен.
