        2. Неполное раскрытие темы.
           Срок выплаты вознаграждения установлен, но срок возмещения расходов
           и ответственность за просрочку не оговорены.
           → presence = "present";
             remuneration_payment_term_status = "defined";
             expenses_reimbursement_term_status = "not_defined";
             principal_default_liability_status = "not_defined".

        3. Противоречие между фрагментами.
           В разных частях договора указаны разные сроки выплаты
           вознаграждения или противоречивые условия об ответственности.
           → presence = "unclear";
             соответствующий *_status = "not_defined";
             principal_obligations_verdict = "Не удалось определить".

        4. Отсылка на внешний документ.
           Порядок выплаты вознаграждения или возмещения расходов определяется
           приложением, регламентом или графиком платежей.
           → presence = "present";
             соответствующий *_status = "defined";
             principal_obligations_verdict содержит текст отсылки.
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для principal_obligations_check_presence используй только: "present", "missing", "unclear".
        - Для всех статусных полей используй только: "defined", "not_defined".
        - Fallback при отсутствии данных:
          * principal_obligations_verdict → "Данные не определены";
          * статусные поля → "not_defined".
        - Fallback при противоречии или неоднозначности:
          * principal_obligations_verdict → "Не удалось определить";
          * статусные поля → "not_defined".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

