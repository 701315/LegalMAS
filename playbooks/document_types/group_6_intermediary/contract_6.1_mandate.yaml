        Нормативный ориентир:
        - ст. 183 п. 2 ГК РФ — последующее одобрение сделки представляемым
          создаёт, изменяет и прекращает для него гражданские права
          и обязанности по данной сделке с момента её совершения;
        - ст. 183 п. 2 ГК РФ — последующее одобрение может быть выражено
          в форме письменного согласия, конклюдентных действий (принятие
