          пример 3: «Порядок отчётности и передачи не согласован — применяются общие нормы ст. 974 ГК РФ»;
          пример 4: «Данные не определены».
        - Верни только JSON.
        </rules>

        <cove>
        Проверь, что все 5 ключей (5 полей) присутствуют в JSON
        и ни один не содержит "None", "null" или пустую строку.
