        Проверяется только один вопрос: механика доверенности и полномочий.

        Нормативный ориентир:
        - ст. 975 ГК РФ — обязанность доверителя выдать доверенность
        - ст. 185 ГК РФ — доверенность (общие положения)
        - ст. 185.1 ГК РФ — нотариальная форма доверенности
        - ст. 183 ГК РФ — последствия превышения полномочий

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора.
        - Не оценивай серьёзность риска.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Есть ли обязанность выдать доверенность.
        2. Определён ли объём полномочий поверенного.
        3. Есть ли указание на нотариальную форму доверенности.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Для статусных полей: если данные не указаны прямо — возвращай
           значение "not_defined" из соответствующего enum.
        4. Не используй "None", "null" или пустые строки. Значение "not_defined"
           используй только в статусных полях по перечню allowed_values.
        5. Если условие прямо указано как отсутствующее (например, «доверенность
           не требуется», «полномочия определяются настоящим договором без
           выдачи доверенности») — используй "absent".
        6. В evidence включай только прямую цитату из текста договора.
        7. Верни РОВНО один валидный JSON-объект со всеми 4 ключами
           (3 поля + evidence), пригодный для парсинга через `json.loads`
           без предварительной обработки. Без markdown, без ```json, без
           комментариев, без текста до или после. Начни ответ сразу с `{`
           и закончи `}`.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — все параметры определены:
        Фрагмент:
        "Доверитель обязан выдать Поверенному нотариальную доверенность
        на заключение договоров аренды в пределах полномочий, указанных в п. 1.1."

        Ответ:
        {
          "poa_clause_status": "present",
          "authority_scope_status": "defined",
          "notarial_poa_reference": "present",
          "evidence": "Доверитель обязан выдать Поверенному нотариальную доверенность на заключение договоров аренды в пределах полномочий, указанных в п. 1.1."
        }

        Пример 2 — данные отсутствуют:
        Фрагмент:
        "Поверенный действует на основании настоящего договора."

        Ответ:
        {
          "poa_clause_status": "not_defined",
          "authority_scope_status": "not_defined",
          "notarial_poa_reference": "not_defined",
          "evidence": "Поверенный действует на основании настоящего договора."
        }

        Пример 3 — доверенность не требуется, полномочия в приложении:
        Фрагмент:
        "Выдача доверенности не требуется. Полномочия Поверенного определяются
        Приложением №1 к настоящему договору. Доверенность оформляется
        в простой письменной форме только для сделок с недвижимостью."

        Ответ:
        {
          "poa_clause_status": "absent",
          "authority_scope_status": "partial",
          "notarial_poa_reference": "present",
          "evidence": "Выдача доверенности не требуется. Полномочия Поверенного определяются Приложением №1 к настоящему договору."
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Проверь, что все 4 ключа (3 поля + evidence) присутствуют в JSON.
        2. Найди прямую цитату об обязанности выдать доверенность
           (или её отсутствии).
        3. Найди прямую цитату об объёме полномочий (или отсылке к приложению).
        4. Найди прямую цитату о нотариальной форме (или простой письменной).
        5. Если прямой цитаты нет — верни "not_defined" для статусных полей.

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "poa_clause_status": "<present / absent / not_defined>",
          "authority_scope_status": "<defined / partial / not_defined>",
          "notarial_poa_reference": "<present / absent / not_defined>",
          "evidence": "<прямая цитата из договора>"
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 500

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "доверенность обязан выдать доверенность полномочия пределы полномочий объём полномочий нотариальная доверенность простая письменная форма превышение полномочий"
      retrieval_profile: "authority_check"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - definitions
      negative_keywords:
        - "означает"
        - "в целях настоящего"
        - "отчёт поверенного"
        - "вознаграждение"
        - "передоверие"
        - "отмена поручения"
      position_bias:
        preferred_range: [0.10, 0.50]
        boost: 0.15
        scope: segment
      context_k: 6
      max_chunks: 8
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
        - "invoice"
      preferred_clause_functions:
        - "obligations"
        - "definitions"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 600

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 600
      compact_output: false
      store_payload: true

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора поручения сведения
        о доверенности и объёме полномочий поверенного.
        Не анализируй предмет поручения, отчётность или прекращение.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие 3 поля + evidence (всего 4 ключа):

        1. poa_clause_status — "present" / "absent" / "not_defined".
        2. authority_scope_status — "defined" / "partial" / "not_defined".
        3. notarial_poa_reference — "present" / "absent" / "not_defined".
        4. evidence — точная цитата из договора о доверенности и полномочиях.
        </task>

        <rules>
        - Используй только текст договора.
        - Не делай предположений.
        - poa_clause_status:
          * "present" — если обязанность доверителя выдать доверенность
            прямо указана (например, «Доверитель обязан выдать доверенность»);
          * "absent" — если прямо указано, что доверенность не требуется
            или не выдаётся (например, «выдача доверенности не требуется»,
            «Поверенный действует на основании настоящего договора
            без доверенности»);
          * "not_defined" — если вопрос доверенности не упомянут.
        - authority_scope_status:
          * "defined" — если объём полномочий прямо и конкретно определён
            в тексте договора (перечислены сделки, действия, лимиты);
          * "partial" — если полномочия определены частично или через отсылку
