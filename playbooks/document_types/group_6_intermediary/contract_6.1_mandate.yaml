        - "(?i)двойн(ое|ого)\\s+представительств"
        - "(?i)аффилированн(ые|ых|ого)"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор поручения по Главе 49 ГК РФ.
        Проверяется только один вопрос: ограничения полномочий поверенного
        и защита от конфликта интересов.

        Нормативный ориентир:
        - ст. 182 ГК РФ — представительство (п. 3: запрет сделки представителя с самим собой)
        - ст. 183 ГК РФ — последствия превышения полномочий
        - ст. 10 ГК РФ — злоупотребление правом
