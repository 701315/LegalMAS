  - id: completion_moment_check
    name: "Момент исполнения поручения и фиксация результата"
    description: >
      Проверяет критерий исполнения поручения, порядок фиксации результата
      (акт, отчёт, расписка), момент прекращения полномочий поверенного
      и обязанности сторон после исполнения.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "момент исполнения"
        - "исполнение поручения"
        - "акт приёмки"
        - "акт выполненных"
        - "фиксация исполнения"
        - "считается исполненным"
        - "по завершении поручения"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)момент[а-я]*\\s+исполнени"
        - "(?i)считается\\s+исполненн"
        - "(?i)акт[а-я]*\\s+(приёмк|выполненн|сдачи)"
        - "(?i)по\\s+завершени[ию].{0,20}поручени"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор поручения по Главе 49 ГК РФ.
        Проверяется только один вопрос: момент исполнения поручения
        и порядок фиксации результата.

        Нормативный ориентир:
        - ст. 974 ГК РФ — обязанность поверенного передать доверителю
          всё полученное по сделкам и представить отчёт;
        - ст. 975 ГК РФ — обязанность доверителя принять исполнение
          без промедления;
        - ст. 408 ГК РФ — прекращение обязательства исполнением;
        - п. 5 Информационного письма Президиума ВАС РФ от 23.10.2000 № 57 —
          разъяснения о моменте прекращения поручения и последствиях
          исполнения после прекращения.

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора.
        - Не оценивай серьёзность риска.
        - Не путай момент исполнения поручения и момент прекращения
          договора — это разные юридические события.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Критерий исполнения поручения (что считается исполнением).
        2. Порядок фиксации исполнения (акт, отчёт, расписка, иной документ).
        3. Момент прекращения полномочий поверенного при исполнении.
        4. Обязанности сторон после исполнения поручения.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Если данные не указаны прямо — возвращай "not_defined".
        4. Не используй "None", "null", "-", "n/a" или пустые строки.
        5. Если порядок определён через отсылку к приложению или регламенту —
           это валидное значение, укажи отсылку.
        6. В evidence включай только текст договора.
        7. Верни РОВНО один валидный JSON-объект со всеми 4 ключами, пригодный
           для парсинга через json.loads без предварительной обработки.
           Без markdown, без ```json, без комментариев, без текста до или после.
           Начни ответ сразу с { и закончи }.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — полный режим фиксации исполнения:
        Фрагмент:
        "Поручение считается исполненным с момента подписания сторонами
        акта приёмки-передачи результата. Полномочия Поверенного прекращаются
        с момента подписания акта. После исполнения Поверенный обязан вернуть
        Доверителю доверенность и оригиналы документов в течение 5 дней."

        Ответ:
        {
          "completion_criterion_status": "defined",
          "completion_fixing_status": "defined",
          "completion_moment_status": "defined",
          "post_completion_duties_status": "defined"
        }

        Пример 2 — частичное регулирование:
        Фрагмент:
        "По завершении поручения Поверенный представляет Доверителю итоговый
        отчёт."

        Ответ:
        {
          "completion_criterion_status": "not_defined",
          "completion_fixing_status": "defined",
          "completion_moment_status": "not_defined",
          "post_completion_duties_status": "not_defined"
        }

        Пример 3 — момент исполнения не оговорён:
        Фрагмент:
        "Поверенный обязуется совершить от имени Доверителя юридические действия,
        указанные в разделе 2 настоящего договора."

        Ответ:
        {
          "completion_criterion_status": "not_defined",
          "completion_fixing_status": "not_defined",
          "completion_moment_status": "not_defined",
          "post_completion_duties_status": "not_defined"
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Проверь, что все 4 ключа присутствуют в JSON.
        2. Найди прямую цитату о критерии исполнения.
        3. Найди прямую цитату о форме фиксации исполнения.
        4. Найди прямую цитату о моменте прекращения полномочий.
        5. Найди прямую цитату об обязанностях после исполнения.
        6. Если прямой цитаты нет — верни "not_defined".

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "completion_criterion_status": "<defined / not_defined>",
          "completion_fixing_status": "<defined / not_defined>",
          "completion_moment_status": "<defined / not_defined>",
          "post_completion_duties_status": "<defined / not_defined>"
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 420
    retrieval:
      corpus_scope: "primary_segment"
      levels:
