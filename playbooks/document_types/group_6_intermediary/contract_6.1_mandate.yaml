             прекращение полномочий, порядок завершения незавершённых действий);
           - "not_defined" — последствия исполнения после истечения срока
             не оговорены.

        6. agreement_term_verdict — краткая фраза-сводка для юриста:
           пример 1: «Срочный договор с пролонгацией, срок соответствует поручению»;
           пример 2: «Срок договора короче срока поручения»;
           пример 3: «Срок действия договора и момент вступления в силу не указаны»;
           пример 4: «Данные не определены».
           Fallback: "Данные не определены" / "Не удалось определить".
        </task>

        <context_rules>
        - Перед остальными полями заполни agreement_term_and_renewal_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все статусные поля = "not_defined", agreement_term_verdict = "Данные не определены".
        - Используй только текст договора.
        - Не подставляй нормы закона, обычную практику или предположения вместо текста договора.
        - Не делай выводов по типовой структуре договора поручения.
        - Если условия определены через отсылку к приложению — это валидное значение, укажи отсылку.
        - Если в разных фрагментах указаны противоречивые данные и конфликт нельзя разрешить по тексту — верни agreement_term_verdict = "Не удалось определить", статусные поля = "not_defined"; presence = "unclear".
        - Не используй "None", "null", "-", "n/a" или пустые строки.
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни срока договора, ни момента вступления в силу,
           ни пролонгации, ни последствий исполнения после истечения срока.
           → presence = "missing";
             все статусные поля = "not_defined";
             agreement_term_verdict = "Данные не определены".

        2. Неполное раскрытие темы.
           Срок и момент вступления в силу указаны, но пролонгация
           и последствия исполнения после истечения срока не оговорены.
           → presence = "present";
             effectiveness_moment_status = "defined";
             agreement_term_status = "defined";
             auto_renewal_status = "not_defined";
             post_term_effects_status = "not_defined".

        3. Противоречие между фрагментами.
           В разных частях договора указаны разные сроки действия
           или противоречивые условия о вступлении в силу.
           → presence = "unclear";
             соответствующий *_status = "not_defined";
             agreement_term_verdict = "Не удалось определить".

        4. Специальное условие о пролонгации.
           Договор прямо предусматривает автоматическую пролонгацию
           при отсутствии заявлений сторон о прекращении.
           → presence = "present";
             agreement_term_status = "defined";
             auto_renewal_status = "defined";
             agreement_term_verdict содержит указание на пролонгацию.
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для agreement_term_and_renewal_check_presence используй только: "present", "missing", "unclear".
        - Для effectiveness_moment_status, agreement_term_status, auto_renewal_status и post_term_effects_status используй только: "defined", "not_defined".
        - Для term_vs_poa_alignment используй только: "aligned", "misaligned", "not_defined".
        - Fallback при отсутствии данных:
          * agreement_term_verdict → "Данные не определены";
          * статусные поля → "not_defined".
        - Fallback при противоречии или неоднозначности:
          * agreement_term_verdict → "Не удалось определить";
          * статусные поля → "not_defined".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
