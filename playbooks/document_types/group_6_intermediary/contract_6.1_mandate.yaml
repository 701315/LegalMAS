      rerank: true
    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
        - "invoice"
      preferred_clause_functions:
        - "obligations"
        - "representations"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10
    evidence:
      required: true
      min_snippet_length: 35
      max_snippet_length: 540
    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 700

      compact_output: false

      presence_signal:
        field: "commercial_representation_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора поручения сведения
        о коммерческом представительстве: статус представителя, одновременное
        представительство обеих сторон и фиксация полномочий в договоре.
        Сформулируй краткий вердикт для юриста.
        Не анализируй общую отчётность, обычное вознаграждение или прекращение.
        Не оценивай серьёзность риска — только зафиксируй наблюдаемые параметры.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. commercial_representation_check_presence:
           Агрегатное signal-поле — наличие сведений о коммерческом представительстве.
           - "present" — если хотя бы одно из содержательных полей
             (commercial_rep_status, dual_representation_status,
              written_form_status) ≠ "not_defined";
           - "missing" — если все три содержательных поля = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - commercial_rep_status = "not_defined";
           - dual_representation_status = "not_defined";
           - written_form_status = "not_defined";
           - commercial_rep_verdict = "Данные не определены";
           - не выполняй остальные шаги.

        1. commercial_rep_status:
           - "present" — прямо указан статус коммерческого представителя
             либо профессиональное постоянное представительство предпринимателей;
           - "not_defined" — статус коммерческого представителя не упомянут.

        2. dual_representation_status:
           - "present" — прямо предусмотрено право одновременно представлять
             разные стороны сделки (с их согласия или на условиях договора);
           - "not_defined" — одновременное представительство обеих сторон
             не оговорено (действует общий запрет ст. 182 п. 3 ГК РФ).

        3. written_form_status:
           - "present" — полномочия представителя прямо определены в тексте
             письменного договора (ст. 184 п. 3 ГК РФ) без отдельной доверенности;
           - "not_defined" — прямое указание на фиксацию полномочий в договоре
             отсутствует.

        4. commercial_rep_verdict — краткая фраза-сводка для юриста:
           пример 1: «Коммерческое представительство, одновременное представительство разрешено с согласия сторон»;
           пример 2: «Статус коммерческого представителя предусмотрен, двойное представительство не разрешено»;
           пример 3: «Признаки коммерческого представительства отсутствуют»;
           пример 4: «Данные не определены».
           Fallback: "Данные не определены" / "Не удалось определить".
        </task>

        <context_rules>
        - Перед остальными полями заполни commercial_representation_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все статусные поля = "not_defined", commercial_rep_verdict = "Данные не определены".
        - Используй только текст договора.
        - Не подставляй нормы закона, обычную практику или предположения вместо текста договора.
        - Не делай выводов по типовой структуре договора поручения.
        - Если условия определены через отсылку к приложению или отдельному соглашению — это валидное значение, укажи отсылку.
        - Если в разных фрагментах указаны противоречивые данные и конфликт нельзя разрешить по тексту — верни commercial_rep_verdict = "Не удалось определить", статусные поля = "not_defined"; presence = "unclear".
        - Не используй "None", "null", "-", "n/a" или пустые строки.
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни статуса коммерческого представителя, ни условия
           о двойном представительстве, ни фиксации полномочий в договоре.
           → presence = "missing";
             commercial_rep_status = dual_representation_status =
             written_form_status = "not_defined";
             commercial_rep_verdict = "Данные не определены".

        2. Неполное раскрытие темы.
           Статус коммерческого представителя указан, но одновременное
           представительство обеих сторон не оговорено.
           → presence = "present";
             commercial_rep_status = "present";
             dual_representation_status = "not_defined";
             written_form_status = "present" (если полномочия зафиксированы в договоре).

        3. Противоречие между фрагментами.
           В разных частях договора одновременное представительство
           одновременно разрешено и запрещено.
           → presence = "unclear";
             dual_representation_status = "not_defined";
             commercial_rep_verdict = "Не удалось определить".

        4. Специфика темы — обычный договор поручения.
           Признаки коммерческого представительства отсутствуют, отношения
           не связаны с предпринимательской деятельностью.
           → presence = "missing";
             все статусные поля = "not_defined";
             commercial_rep_verdict = "Данные не определены".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для commercial_representation_check_presence используй только: "present", "missing", "unclear".
        - Для commercial_rep_status, dual_representation_status и written_form_status используй только: "present", "not_defined".
        - Fallback при отсутствии данных:
          * commercial_rep_verdict → "Данные не определены";
          * статусные поля → "not_defined".
        - Fallback при противоречии или неоднозначности:
          * commercial_rep_verdict → "Не удалось определить";
          * статусные поля → "not_defined".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "commercial_representation_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие сведений о коммерческом представительстве. Внутреннее агрегатное signal-поле."
          required: true

        - name: "commercial_rep_verdict"
          type: "string"
          presentation: "summary"
          label: "Коммерческое представительство — вердикт"
          description: "Краткая сводка о статусе коммерческого представителя, одновременном представительстве обеих сторон и фиксации полномочий."
          required: false
          display_in_grid: true
          display_priority: 1

        - name: "commercial_rep_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["present", "not_defined"]
          display_in_grid: false
          description: "Наличие статуса коммерческого представителя. Внутреннее enum-поле."
          required: true

        - name: "dual_representation_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["present", "not_defined"]
          display_in_grid: false
          description: "Наличие условия о представлении обеих сторон. Внутреннее enum-поле."
          required: true

        - name: "written_form_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["present", "not_defined"]
          display_in_grid: false
          description: "Наличие фиксации полномочий непосредственно в договоре. Внутреннее enum-поле."
          required: true

      store_payload: true

  - id: poa_term_and_validity_check
    name: "Срок доверенности, безотзывность и нотариальная форма при передоверии"
    description: >
      Проверяет срок доверенности и его соответствие сроку поручения,
      механизм продления или перевыдачи доверенности, наличие условия
      о безотзывной доверенности и требование нотариальной формы
      доверенности при передоверии.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "срок доверенности"
        - "доверенность действительна"
        - "продление доверенности"
        - "перевыдача доверенности"
        - "безотзывная доверенность"
        - "нотариальная доверенность"
        - "передоверие"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)срок\\s+доверенн"
        - "(?i)доверенность\\s+действительн"
        - "(?i)безотзывн(ая|ой)\\s+доверенн"
        - "(?i)продлени[ея]\\s+доверенн|перевыдач[аи]\\s+доверенн"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор поручения по Главе 49 ГК РФ.
        Проверяется только один вопрос: срок доверенности, её действительность
        и специальные условия (безотзывность, нотариальная форма при передоверии).

        Нормативный ориентир:
        - ст. 186 ГК РФ — срок доверенности:
          - п. 1 — если срок не указан, доверенность действует 1 год;
          - максимальный срок не ограничен (с 01.09.2013);
        - ст. 188 ГК РФ — прекращение доверенности (истечение срока,
          отмена, отказ, смерть, банкротство);
        - ст. 188.1 ГК РФ — безотзывная доверенность:
          - п. 1 — в предпринимательских отношениях доверенность может быть
            безотзывной (нотариальная форма, указание на безотзывность);
          - п. 2 — безотзывная доверенность прекращается только по основаниям,
            прямо перечисленным в законе;
        - ст. 187 п. 3 ГК РФ — доверенность в порядке передоверия должна
          быть нотариально удостоверена;
        - ст. 183 ГК РФ — действия без полномочий или с превышением
          (сделки после истечения срока доверенности — недействительны).

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора.
        - Не оценивай серьёзность риска.
        - Если доверенность не упоминается — фиксируй "not_defined".

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Указан ли срок доверенности.
        2. Совпадает ли срок доверенности со сроком поручения.
        3. Есть ли механизм продления или перевыдачи доверенности.
        4. Есть ли условие о безотзывной доверенности.
        5. Есть ли требование нотариальной формы доверенности при передоверии.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Если данные не указаны прямо — возвращай "not_defined".
        4. Не используй "None", "null", "-", "n/a" или пустые строки.
        5. Если срок или условия определены через отсылку к приложению
           или отдельной доверенности — это валидное значение.
        6. В evidence включай только текст договора.
        7. Верни РОВНО один валидный JSON-объект со всеми 5 ключами, пригодный
           для парсинга через json.loads без предварительной обработки.
           Без markdown, без ```json, без комментариев, без текста до или после.
           Начни ответ сразу с { и закончи }.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — срок доверенности определён, совпадает с поручением, безотзывная:
        Фрагмент:
        "Доверитель выдаёт Поверенному нотариальную доверенность сроком на 3 года,
        совпадающим со сроком действия настоящего договора. Доверенность является
        безотзывной в соответствии со ст. 188.1 ГК РФ. При передоверии заместитель
        действует на основании нотариально удостоверенной доверенности."

        Ответ:
        {
          "poa_term_status": "defined",
          "poa_term_alignment": "aligned",
          "poa_renewal_mechanism": "not_defined",
          "irrevocable_poa_status": "present",
          "subdelegation_notarial_requirement": "present"
        }

        Пример 2 — срок доверенности не совпадает с поручением:
        Фрагмент:
        "Срок действия настоящего договора — 3 года. Доверитель выдаёт Поверенному
        доверенность сроком на 1 год."

        Ответ:
        {
          "poa_term_status": "defined",
          "poa_term_alignment": "misaligned",
          "poa_renewal_mechanism": "not_defined",
          "irrevocable_poa_status": "not_defined",
          "subdelegation_notarial_requirement": "not_defined"
        }

        Пример 3 — доверенность не упомянута:
        Фрагмент:
        "Поверенный обязуется совершить от имени Доверителя юридические действия,
        указанные в разделе 2 настоящего договора."

        Ответ:
        {
          "poa_term_status": "not_defined",
          "poa_term_alignment": "not_defined",
          "poa_renewal_mechanism": "not_defined",
          "irrevocable_poa_status": "not_defined",
          "subdelegation_notarial_requirement": "not_defined"
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Проверь, что все 5 ключей присутствуют в JSON.
        2. Найди прямую цитату о сроке доверенности.
        3. Сравни срок доверенности со сроком поручения.
        4. Найди прямую цитату о безотзывности доверенности.
        5. Найди прямую цитату о нотариальной форме при передоверии.
        6. Если прямой цитаты нет — верни "not_defined".

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "poa_term_status": "<defined / not_defined>",
          "poa_term_alignment": "<aligned / misaligned / not_defined>",
          "poa_renewal_mechanism": "<present / not_defined>",
          "irrevocable_poa_status": "<present / not_defined>",
          "subdelegation_notarial_requirement": "<present / not_defined>"
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 420
    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "срок доверенности доверенность действительна продление доверенности перевыдача доверенности безотзывная доверенность нотариальная доверенность передоверие срок действия поручения"
      retrieval_profile: "authority_check"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - procedures
      negative_keywords:
        - "в целях настоящего"
        - "отчёт поверенного"
        - "вознаграждение"
        - "отмена поручения"
      position_bias:
        preferred_range: [0.10, 0.60]
        boost: 0.30
        scope: segment
      context_k: 6
      max_chunks: 10
      rerank: true
    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
        - "invoice"
      preferred_clause_functions:
        - "obligations"
        - "procedures"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10
    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 600
    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 800

      compact_output: false

      presence_signal:
        field: "poa_term_and_validity_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора поручения сведения
        о сроке доверенности, его соответствии сроку поручения, механизме
        продления, безотзывности и нотариальной форме при передоверии.
        Сформулируй краткий вердикт для юриста.
        Не анализируй объём полномочий, отчётность или вознаграждение.
        Не оценивай серьёзность риска — только зафиксируй наблюдаемые параметры.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. poa_term_and_validity_check_presence:
           Агрегатное signal-поле — наличие сведений о сроке и действительности
           доверенности.
           - "present" — если хотя бы одно из содержательных полей
             (poa_term_status, poa_term_alignment, poa_renewal_mechanism,
              irrevocable_poa_status, subdelegation_notarial_requirement)
             ≠ "not_defined";
           - "missing" — если все пять содержательных полей = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - poa_term_status = "not_defined";
           - poa_term_alignment = "not_defined";
           - poa_renewal_mechanism = "not_defined";
           - irrevocable_poa_status = "not_defined";
           - subdelegation_notarial_requirement = "not_defined";
           - poa_validity_verdict = "Данные не определены";
           - не выполняй остальные шаги.

        1. poa_term_status:
           - "defined" — срок доверенности прямо указан в договоре;
           - "not_defined" — доверенность не упомянута или срок не указан
             (по умолчанию — 1 год по ст. 186 п. 1 ГК РФ).

        2. poa_term_alignment:
           - "aligned" — срок доверенности совпадает со сроком поручения
             или превышает его;
           - "misaligned" — срок доверенности короче срока поручения;
           - "not_defined" — невозможно сравнить (один из сроков не указан).

        3. poa_renewal_mechanism:
           - "present" — предусмотрен механизм продления или перевыдачи
             доверенности до истечения срока;
           - "not_defined" — механизм не оговорён.

        4. irrevocable_poa_status:
           - "present" — прямо указано, что доверенность является безотзывной
             (ст. 188.1 ГК РФ — только в предпринимательских отношениях,
             нотариальная форма);
           - "not_defined" — безотзывность не упомянута.

        5. subdelegation_notarial_requirement:
           - "present" — прямо указано требование нотариальной формы
             доверенности при передоверии (ст. 187 п. 3 ГК РФ);
           - "not_defined" — требование не оговорено.

        6. poa_validity_verdict — краткая фраза-сводка для юриста:
           пример 1: «Доверенность на 3 года, совпадает с поручением, безотзывная, нотариальная при передоверии»;
           пример 2: «Срок доверенности (1 год) короче срока поручения (3 года)»;
           пример 3: «Срок доверенности не указан, механизм продления не предусмотрен»;
           пример 4: «Данные не определены».
           Fallback: "Данные не определены" / "Не удалось определить".
        </task>

        <context_rules>
        - Перед остальными полями заполни poa_term_and_validity_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все статусные поля = "not_defined", poa_validity_verdict = "Данные не определены".
        - Используй только текст договора.
        - Не подставляй нормы закона, обычную практику или предположения вместо текста договора.
        - Не делай выводов по типовой структуре договора поручения.
        - Если срок или условия определены через отсылку к приложению или отдельной доверенности — это валидное значение, укажи отсылку.
        - Если в разных фрагментах указаны противоречивые данные и конфликт нельзя разрешить по тексту — верни poa_validity_verdict = "Не удалось определить", статусные поля = "not_defined"; presence = "unclear".
        - Не используй "None", "null", "-", "n/a" или пустые строки.
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни срока доверенности, ни условия о безотзывности,
           ни требования нотариальной формы при передоверии.
           → presence = "missing";
             все статусные поля = "not_defined";
             poa_validity_verdict = "Данные не определены".

        2. Неполное раскрытие темы.
           Срок доверенности указан, но не совпадает со сроком поручения
           либо механизм продления не предусмотрен.
           → presence = "present";
             poa_term_status = "defined";
             poa_term_alignment = "misaligned";
             poa_renewal_mechanism = "not_defined".

        3. Противоречие между фрагментами.
           В разных частях договора указаны разные сроки доверенности
           или противоречивые условия о безотзывности.
           → presence = "unclear";
             соответствующий *_status = "not_defined";
             poa_validity_verdict = "Не удалось определить".

        4. Отсылка на внешний документ.
           Срок или условия доверенности определяются отдельной доверенностью
           или приложением к договору.
           → presence = "present";
             poa_term_status = "defined";
             poa_validity_verdict содержит текст отсылки.
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для poa_term_and_validity_check_presence используй только: "present", "missing", "unclear".
        - Для poa_term_status, poa_renewal_mechanism, irrevocable_poa_status, subdelegation_notarial_requirement используй только: "present", "not_defined" (для статуса — "defined", "not_defined").
        - Для poa_term_alignment используй только: "aligned", "misaligned", "not_defined".
        - Fallback при отсутствии данных:
          * poa_validity_verdict → "Данные не определены";
          * статусные поля → "not_defined".
        - Fallback при противоречии или неоднозначности:
          * poa_validity_verdict → "Не удалось определить";
          * статусные поля → "not_defined".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "poa_term_and_validity_check_presence"
