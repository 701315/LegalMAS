        - Твоя задача — только установить, что прямо есть в тексте договора.
        - Не оценивай серьёзность риска.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Есть ли обязанность представлять отчёт (и в какой срок/форме).
        2. Требуются ли подтверждающие (оправдательные) документы.
        3. Есть ли обязанность передать всё полученное по сделкам.
        4. Есть ли порядок принятия/оспаривания отчёта доверителем.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Если данные не указаны прямо — возвращай "not_defined".
        4. Не используй "None", "null", "-", "n/a" или пустые строки.
        5. Если форма отчёта или порядок передачи определены через отсылку
           к приложению (например, «по форме Приложения № 1») — это валидное
           значение "present", а не "not_defined".
        6. В evidence включай только текст договора.
        7. Верни РОВНО один валидный JSON-объект со всеми 4 ключами, пригодный
           для парсинга через json.loads без предварительной обработки.
           Без markdown, без ```json, без комментариев, без текста до или после.
           Начни ответ сразу с { и закончи }.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — полный порядок отчётности и передачи:
        Фрагмент:
        "Поверенный обязан представить письменный отчёт с приложением
        оправдательных документов в течение 5 рабочих дней. Всё полученное
        по сделке передаётся Доверителю в течение 3 дней. Доверитель обязан
        рассмотреть отчёт и заявить возражения в течение 10 дней."

        Ответ:
        {
          "reporting_clause_status": "present",
          "supporting_docs_required": "yes",
          "transfer_of_proceeds_status": "present",
          "report_acceptance_mechanism": "present"
        }

        Пример 2 — частичная отчётность (нет оправдательных документов и регламента возражений):
        Фрагмент:
        "Поверенный представляет Доверителю итоговый отчёт о выполнении
        поручения. Всё полученное передаётся Доверителю."

        Ответ:
        {
          "reporting_clause_status": "partial",
          "supporting_docs_required": "no",
          "transfer_of_proceeds_status": "present",
          "report_acceptance_mechanism": "not_defined"
        }

        Пример 3 — данные отсутствуют:
        Фрагмент:
        "Поверенный обязуется совершить юридические действия в интересах Доверителя."

        Ответ:
        {
          "reporting_clause_status": "not_defined",
          "supporting_docs_required": "not_defined",
          "transfer_of_proceeds_status": "not_defined",
          "report_acceptance_mechanism": "not_defined"
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Проверь, что все 4 ключа присутствуют в JSON.
        2. Найди прямую цитату об отчёте поверенного.
        3. Найди прямую цитату о подтверждающих (оправдательных) документах.
        4. Найди прямую цитату о передаче всего полученного доверителю.
        5. Найди прямую цитату о порядке принятия отчёта / сроках возражений.
        6. Если прямой цитаты нет — верни "not_defined".

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "reporting_clause_status": "<present / partial / not_defined>",
          "supporting_docs_required": "<yes / no / not_defined>",
          "transfer_of_proceeds_status": "<present / not_defined>",
          "report_acceptance_mechanism": "<present / not_defined>"
