      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора поручения сведения
        о сроке доверенности, его соответствии сроку поручения, механизме
        продления, безотзывности и нотариальной форме при передоверии.
        Сформулируй краткий вердикт для юриста.
        Не анализируй объём полномочий, отчётность или вознаграждение.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие 6 полей + evidence (всего 7 ключей):
        
        Заполни строго следующие 6 полей:

        1. poa_term_status — "defined" / "not_defined".
        2. poa_term_alignment — "aligned" / "misaligned" / "not_defined".
        3. poa_renewal_mechanism — "present" / "not_defined".
        4. irrevocable_poa_status — "present" / "not_defined".
        5. subdelegation_notarial_requirement — "present" / "not_defined".
        6. poa_validity_verdict — краткая человекочитаемая сводка (одна фраза).

