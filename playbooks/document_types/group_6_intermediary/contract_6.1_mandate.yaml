  - id: subject_legal_actions_check
    name: "Предмет поручения: конкретные юридические действия"
    description: >
      Проверяет, что предмет договора выражен в виде конкретных юридических,
      а не фактических/сервисных действий, и степень их конкретизации.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "совершить юридические действия"
        - "заключение договоров"
        - "представление интересов"
        - "подача документов"
        - "подписание"
        - "государственная регистрация"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)соверш(ить|ает).*юридическ(ие|их)\\s+действ"
        - "(?i)заключени[ея]\\s+договор|представлени[ея]\\s+интерес"
        - "(?i)подписани[ея]|подач[аи]\\s+документ"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор поручения по Главе 49 ГК РФ.
        Проверяется только один вопрос: предмет поручения — конкретные
        юридические действия.

        Нормативный ориентир:
        - ст. 971 ГК РФ — предмет договора поручения
        - ст. 432 ГК РФ — существенные условия

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора.
        - Не оценивай серьёзность риска.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Степень конкретизации действий (перечислены конкретно / общая формула).
        2. Природу действий (юридические / смешанные / фактические).

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Если данные не указаны прямо — возвращай "not_defined".
        4. Если текстового значения нет — возвращай строго "Данные не определены".
        5. Не используй "None", "null", "not_defined", "not_defined" или пустые строки.
        6. В evidence включай только текст договора.
        7. Верни только один JSON-объект.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — действия конкретны:
        Фрагмент:
        "Поверенный обязуется: 1) заключить договор аренды от имени Доверителя;
        2) подписать акт приёма-передачи; 3) подать документы на регистрацию."

        Ответ:
        {
          "actions_specificity": "specific",
          "actions_nature": "legal"
        }

        Пример 2 — действия не конкретизированы:
        Фрагмент:
        "Поверенный совершает любые необходимые действия в интересах Доверителя."

        Ответ:
        {
          "actions_specificity": "generic",
          "actions_nature": "unclear"
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Найди прямую цитату с перечнем действий.
        2. Определи, конкретны ли они или даны общей формулой.
        3. Определи, являются ли действия юридическими или фактическими.
        4. Если прямой цитаты нет — верни "not_defined".

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "actions_specificity": "<specific / generic / not_defined>",
          "actions_nature": "<legal / mixed / factual_or_service_like / unclear / not_defined>"
        }
      context_k: 5
      temperature: 0.0
      max_tokens: 340

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "предмет договора юридические действия совершить действия заключение договоров представление интересов подача документов подписание государственная регистрация любые необходимые действия"
      retrieval_profile: "scope_of_work_check"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - definitions
      negative_keywords:
        - "означает"
        - "в целях настоящего"
        - "отчёт поверенного"
        - "вознаграждение"
        - "передоверие"
        - "отмена поручения"
      position_bias:
        preferred_range: [0.0, 0.40]
        boost: 0.18
        scope: segment
      context_k: 5
      max_chunks: 8
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
        - "invoice"
      preferred_clause_functions:
        - "obligations"
        - "definitions"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 600

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 600
      compact_output: false

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора поручения сведения
        о предмете: степень конкретизации действий и их юридическую природу.
        Не анализируй доверенность, отчётность, вознаграждение или прекращение.
        </role>

        <context>
        {context}
        </context>

        <task>
        1. actions_specificity — "specific" / "generic" / "not_defined".
        2. actions_nature — "legal" / "mixed" / "factual_or_service_like" / "unclear" / "not_defined".

        "specific" — если действия перечислены определённо и проверяемо.
        "generic" — если есть формулы вроде "любые необходимые действия".
        "legal" — если действия порождают, изменяют или прекращают права.
        "factual_or_service_like" — если действия не создают юридических последствий.
        </task>

        <rules>
        - Используй только текст договора.
        - Не делай предположений.
        - Верни только JSON.
        </rules>
      fields:
        - name: "actions_specificity"
          type: "string"
          presentation: "signal"
          allowed_values: ["specific", "generic", "not_defined"]
          description: "Степень конкретизации действий."
          required: true
        - name: "actions_nature"
