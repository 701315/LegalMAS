      retrieval_profile: "authority_check"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - definitions
      negative_keywords:
        - "в целях настоящего"
        - "отчёт поверенного"
        - "вознаграждение"
        - "отмена поручения"
      position_bias:
        preferred_range: [0.10, 0.50]
        boost: 0.30
        scope: segment
      context_k: 6
      max_chunks: 10
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
        - "invoice"
      preferred_clause_functions:
        - "obligations"
        - "definitions"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 600

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 700

      compact_output: false

      presence_signal:
        field: "poa_and_authority_check_presence"
        present_values: ["present"]
