      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10
    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 560
    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 700

      compact_output: false

      presence_signal:
        field: "termination_waiver_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора поручения сведения
        о пунктах, ограничивающих или исключающих право односторонней отмены
        поручения. Сформулируй краткий вердикт с указанием ничтожности.
        Не анализируй общий порядок прекращения, доверенность или вознаграждение.
        Не оценивай серьёзность риска — только зафиксируй наблюдаемые параметры.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. termination_waiver_check_presence:
           Агрегатное signal-поле — наличие сведений об ограничениях отмены.
           - "present" — если хотя бы одно из содержательных полей
             (termination_waiver_clause, termination_restriction_clause)
             ≠ "not_defined";
           - "missing" — если оба содержательных поля = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - termination_waiver_clause = "not_defined";
           - termination_restriction_clause = "not_defined";
           - termination_waiver_verdict = "Данные не определены";
           - не выполняй остальные шаги.

        1. termination_waiver_clause:
           - "present" — в договоре есть пункт, прямо исключающий право
             односторонней отмены поручения или отказа от исполнения
             («не может быть расторгнут», «отказ не допускается»,
             «безотзывное поручение»);
           - "not_defined" — прямого запрета на отмену/отказ нет.

        2. termination_restriction_clause:
           - "present" — в договоре есть пункт, косвенно ограничивающий право
             отмены/отказа (неустойка за отказ, обязательное согласование,
             условие о прекращении только по истечении срока);
           - "not_defined" — косвенных ограничений нет.

        3. termination_waiver_verdict — краткая фраза-сводка для юриста:
           пример 1: «Обнаружен пункт об отказе от права расторжения»;
           пример 2: «Обнаружена неустойка за односторонний отказ»;
           пример 3: «Ограничений права отмены поручения не обнаружено»;
           пример 4: «Данные не определены».
           Fallback: "Данные не определены" / "Не удалось определить".
        </task>

        <context_rules>
        - Перед остальными полями заполни termination_waiver_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все статусные поля = "not_defined", termination_waiver_verdict = "Данные не определены".
        - Используй только текст договора.
        - Не подставляй нормы закона, обычную практику или предположения вместо текста договора.
        - Не делай выводов по типовой структуре договора поручения.
        - Если в разных фрагментах указаны противоречивые данные и конфликт нельзя разрешить по тексту — верни termination_waiver_verdict = "Не удалось определить", статусные поля = "not_defined"; presence = "unclear".
        - Не используй "None", "null", "-", "n/a" или пустые строки.
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни прямого запрета на отмену, ни косвенных ограничений.
           → presence = "missing";
             termination_waiver_clause = termination_restriction_clause = "not_defined";
             termination_waiver_verdict = "Данные не определены".

        2. Прямой запрет одностороннего расторжения.
           В договоре есть пункт, исключающий право отказа/отмены.
           → presence = "present";
             termination_waiver_clause = "present";
             termination_restriction_clause = "present" (если есть оба условия).

        3. Косвенное ограничение.
           В договоре установлена неустойка за односторонний отказ или
           обязательное согласование.
           → presence = "present";
             termination_waiver_clause = "not_defined";
             termination_restriction_clause = "present".

        4. Отсутствие ограничений.
           Право на отмену и отказ реализуется в общем порядке без ограничений.
           → presence = "missing";
             termination_waiver_clause = termination_restriction_clause = "not_defined";
             termination_waiver_verdict = "Ограничений права отмены поручения не обнаружено".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для termination_waiver_check_presence используй только: "present", "missing", "unclear".
        - Для termination_waiver_clause и termination_restriction_clause используй только: "present", "not_defined".
        - Fallback при отсутствии данных:
          * termination_waiver_verdict → "Данные не определены";
          * статусные поля → "not_defined".
        - Fallback при противоречии или неоднозначности:
          * termination_waiver_verdict → "Не удалось определить";
          * статусные поля → "not_defined".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "termination_waiver_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие сведений об ограничениях права отмены поручения. Внутреннее агрегатное signal-поле."
          required: true

        - name: "termination_waiver_verdict"
          type: "string"
          presentation: "summary"
          label: "Отказ от права отмены — вердикт"
          description: "Краткая сводка о наличии пунктов, ограничивающих право отмены поручения."
          required: false
          display_in_grid: true
          display_priority: 1

        - name: "termination_waiver_clause"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["present", "not_defined"]
          display_in_grid: false
          description: "Наличие пункта, прямо исключающего право отмены поручения. Внутреннее enum-поле."
          required: true

        - name: "termination_restriction_clause"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["present", "not_defined"]
          display_in_grid: false
          description: "Наличие пункта, косвенно ограничивающего право отмены поручения. Внутреннее enum-поле."
          required: true

      store_payload: true

  - id: agent_liability_and_deviation_check
    name: "Ответственность поверенного и отступление от указаний"
