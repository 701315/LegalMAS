             subdelegation_status = "allowed";
             principal_consent_required = "not_defined";
             agent_liability_for_subagent = "not_defined".

        3. Противоречие между фрагментами.
           В разных частях договора передоверие одновременно разрешено
           и запрещено.
           → presence = "unclear";
             subdelegation_status = "not_defined";
             subdelegation_verdict = "Не удалось определить".

        4. Специфика темы — прямой запрет передоверия.
           В договоре прямо установлено личное исполнение поручения
           и запрет передачи полномочий третьим лицам.
           → presence = "present";
             subdelegation_status = "prohibited";
             principal_consent_required = "not_defined";
             agent_liability_for_subagent = "not_defined".
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для subdelegation_check_presence используй только: "present", "missing", "unclear".
        - Для subdelegation_status используй только: "allowed", "prohibited", "unclear", "not_defined".
        - Для principal_consent_required используй только: "yes", "no", "not_defined".
        - Для agent_liability_for_subagent используй только: "choice_only", "full_liability", "not_defined".
        - Fallback при отсутствии данных:
          * subdelegation_verdict → "Данные не определены";
          * статусные поля → "not_defined".
        - Fallback при противоречии или неоднозначности:
          * subdelegation_verdict → "Не удалось определить";
          * статусные поля → "not_defined".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

