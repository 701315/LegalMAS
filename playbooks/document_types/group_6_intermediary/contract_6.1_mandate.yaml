    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "договор поручения доверитель поверенный от имени доверителя от своего имени за счёт доверителя доверенность юридические действия вознаграждение возмездный безвозмездный отчёт отчётность прекращение поручения отмена отказ отзыв расторжение"
      retrieval_profile: "scope_of_work_check"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
