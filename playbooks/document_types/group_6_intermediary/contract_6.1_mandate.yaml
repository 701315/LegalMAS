          может быть отменена в любое время по ст. 188 ГК РФ).
        - subdelegation_notarial_requirement:
          "present" — прямо указано требование нотариальной формы
          доверенности при передоверии (ст. 187 п.3 ГК РФ);
          "not_defined" — требование не оговорено (нотариальная форма
          обязательна по закону, но отсутствие напоминания в договоре
          создаёт операционный риск).
        - poa_validity_verdict — короткая фраза для юриста:
          пример 1: «Доверенность на 3 года, совпадает с поручением, безотзывная, нотариальная при передоверии»;
          пример 2: «Срок доверенности (1 год) короче срока поручения (3 года) — риск потери полномочий (ст. 183 ГК РФ)»;
          пример 3: «Срок доверенности не указан — действует 1 год по ст. 186 ГК РФ, механизм продления не предусмотрен»;
          пример 4: «Данные не определены».
        - Верни только JSON.
        </rules>

        <cove>
