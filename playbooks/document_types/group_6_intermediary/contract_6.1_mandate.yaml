           пример 1: «Указания, возмещение расходов и аванс определены»;
           пример 2: «Указания определены, порядок возмещения расходов
           не конкретизирован»;
           пример 3: «Указания и расходы не оговорены»;
           пример 4: «Данные не определены».
           Fallback: "Данные не определены" / "Не удалось определить".
        </task>

        <context_rules>
        - Перед остальными полями заполни instructions_and_expenses_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все статусные поля = "not_defined", instructions_expenses_verdict = "Данные не определены".
