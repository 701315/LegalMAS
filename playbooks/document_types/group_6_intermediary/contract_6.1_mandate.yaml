          required: false
          display_in_grid: true
          display_priority: 8

  - id: subject_legal_actions_check
    name: "Предмет поручения: конкретные юридические действия"
    description: >
      Проверяет, что предмет договора выражен в виде конкретных юридических,
      а не фактических/сервисных действий, определяет степень их конкретизации
      и выявляет скрытый риск переквалификации договора поручения
      в договор возмездного оказания услуг (гл. 39 ГК РФ).
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "совершить юридические действия"
        - "заключение договоров"
        - "представление интересов"
        - "подача документов"
        - "подписание"
        - "государственная регистрация"
        - "фактические действия"
        - "оказание услуг"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)соверш(ить|ает).*юридическ(ие|их)\\s+действ"
        - "(?i)заключени[ея]\\s+договор|представлени[ея]\\s+интерес"
        - "(?i)подписани[ея]|подач[аи]\\s+документ"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор поручения по Главе 49 ГК РФ.
        Проверяется только один вопрос: предмет поручения — конкретные юридические действия.

        Нормативный ориентир:
        - ст. 971 ГК РФ — предмет договора поручения (совершение Поверенным определенных юридических действий)
        - ст. 432 ГК РФ — существенные условия (предмет является существенным условием)
        - гл. 39 ГК РФ — возмездное оказание услуг (если действия носят исключительно фактический, а не юридический характер)

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора.
        - Не оценивай серьёзность риска.
        - Отличай юридические действия (влекут возникновение, изменение или прекращение гражданских прав и обязанностей: заключение сделок, подписание договоров, подача заявлений в госорганы) от фактических действий (сервисные услуги: поиск клиентов, ведение переговоров без права подписи, маркетинг, доставка, составление отчетов).

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Степень конкретизации действий (перечислены конкретно / общая формула).
        2. Природу действий (юридические / смешанные / фактические или сервисные).

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Для текстовых полей: если данные не указаны прямо — возвращай строку "Данные не определены".
        4. Для статусных полей (actions_specificity, actions_nature): если данные не указаны прямо — возвращай значение "not_defined" из соответствующего enum.
        5. Не используй "None", "null" или пустые строки. Значение "not_defined" используй только в статусных полях по перечню allowed_values.
        6. В evidence включай только прямую цитату из текста договора.
        7. Верни РОВНО один валидный JSON-объект со всеми 3 ключами (2 поля + evidence), пригодный для парсинга через `json.loads` без предварительной обработки. Без markdown, без ```json, без комментариев, без текста до или после. Начни ответ сразу с `{` и закончи `}`.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — юридические действия конкретизированы:
        Фрагмент:
        "Поверенный обязуется: 1) заключить договор аренды от имени Доверителя; 2) подписать акт приёма-передачи; 3) подать документы на государственную регистрацию."

        Ответ:
        {
          "actions_specificity": "specific",
          "actions_nature": "legal",
          "evidence": "Поверенный обязуется: 1) заключить договор аренды от имени Доверителя; 2) подписать акт приёма-передачи; 3) подать документы на государственную регистрацию."
        }

        Пример 2 — действия не конкретизированы (размытый предмет):
        Фрагмент:
        "Поверенный совершает любые необходимые юридические действия в интересах Доверителя для защиты его прав."

        Ответ:
        {
          "actions_specificity": "generic",
          "actions_nature": "legal",
          "evidence": "Поверенный совершает любые необходимые юридические действия в интересах Доверителя для защиты его прав."
        }

        Пример 3 — фактические/сервисные действия (риск переквалификации в услуги):
        Фрагмент:
        "Поверенный обязуется осуществлять поиск потенциальных покупателей, проводить презентации продукции Доверителя и распространять рекламные материалы."

        Ответ:
        {
          "actions_specificity": "specific",
          "actions_nature": "factual_or_service_like",
          "evidence": "Поверенный обязуется осуществлять поиск потенциальных покупателей, проводить презентации продукции Доверителя и распространять рекламные материалы."
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Проверь, что все 3 ключа (2 поля + evidence) присутствуют в JSON.
        2. Найди прямую цитату с перечнем действий поверенного.
