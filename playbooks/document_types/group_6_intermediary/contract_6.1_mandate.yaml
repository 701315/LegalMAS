             instructions_expenses_verdict = "Не удалось определить".

        4. Отсылка на внешний документ.
           Порядок возмещения расходов или авансирования определяется сметой,
           приложением или отдельным документом.
           → presence = "present";
             соответствующий *_status = "defined";
             instructions_expenses_verdict содержит текст отсылки.
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для instructions_and_expenses_check_presence используй только: "present", "missing", "unclear".
        - Для instructions_status, expense_reimbursement_status, advance_status используй только: "defined", "not_defined".
        - Fallback при отсутствии данных:
          * instructions_expenses_verdict → "Данные не определены";
          * статусные поля → "not_defined".
        - Fallback при противоречии или неоднозначности:
          * instructions_expenses_verdict → "Не удалось определить";
          * статусные поля → "not_defined".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

