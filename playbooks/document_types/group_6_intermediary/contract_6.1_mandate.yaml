        о моменте исполнения поручения: критерий исполнения, порядок фиксации
        результата, момент прекращения полномочий и обязанности сторон
        после исполнения.
        Сформулируй краткий вердикт для юриста.
        Не анализируй общий порядок прекращения договора, доверенность,
        вознаграждение или передоверие.
        Не оценивай серьёзность риска — только зафиксируй наблюдаемые параметры.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. completion_moment_check_presence:
