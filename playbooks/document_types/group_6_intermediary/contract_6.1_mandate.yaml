    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1100
      compact_output: false
      store_payload: true

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора поручения ключевые
        параметры: доверителя, поверенного, предмет поручения, модель действий,
        статус доверенности, возмездность, отчётность и прекращение.
        Не анализируй передоверие, конфликт интересов или конкретные лимиты
        полномочий.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие 8 полей + evidence (всего 9 ключей):

        1. principal — доверитель.
        2. agent — поверенный.
        3. mandated_actions — предмет поручения (перечень юридических действий).
        4. acts_in_name_of — "principal" / "agent" / "mixed" / "unclear"
           / "not_defined".
        5. poa_status — "required_and_mentioned" / "mentioned" / "attached"
           / "not_defined".
        6. remuneration_status — "paid" / "free" / "by_agreement" / "unclear"
           / "not_defined".
        7. reporting_status — "present" / "absent" / "unclear" / "not_defined".
        8. termination_status — "present" / "absent" / "unclear" / "not_defined".
        9. evidence — прямая цитата из договора, подтверждающая извлечённые данные.

        Если данные отсутствуют:
        - текстовое поле = "Данные не определены"
        - статусное поле = "not_defined"
        </task>

        <rules>
        - Используй только текст договора.
        - Не делай предположений.
        - Не применяй презумпцию возмездности по ст. 972 ГК РФ: если условие
          о вознаграждении прямо не указано — верни remuneration_status
          = "not_defined".
        - acts_in_name_of:
          * "principal" — если прямо указано, что поверенный действует
            "от имени доверителя" (все юридические действия);
          * "agent" — если прямо указано, что поверенный действует
            "от своего имени" (это индикатор потенциальной ошибки
            квалификации: договор поручения не допускает действий от имени
            поверенного, это признак договора комиссии или агентирования);
          * "mixed" — если в тексте прямо указано, что часть действий
            совершается от имени доверителя, а часть — от имени поверенного;
          * "unclear" — если формулировка неоднозначна;
          * "not_defined" — если не указано.
        - poa_status:
          * "required_and_mentioned" — если выдача доверенности прямо
            предусмотрена как обязанность доверителя (ст. 975 ГК РФ);
          * "mentioned" — если доверенность упомянута, но не как обязанность;
          * "attached" — если доверенность приложена к договору как приложение
            (например, «доверенность №1 является Приложением №1 к договору»);
          * "not_defined" — если не упомянута.
        - remuneration_status:
          * "paid" — прямо предусмотрено вознаграждение с указанием размера
            или порядка расчёта;
          * "free" — прямо указано, что договор безвозмездный;
          * "by_agreement" — размер / условия вознаграждения определяются
            отдельным соглашением или отсылкой к иному документу;
          * "unclear" — формулировка неоднозначна;
          * "not_defined" — нет упоминания вообще.
        - reporting_status / termination_status:
          * "present" — прямо предусмотрено;
          * "absent" — прямо указано отсутствие (например, «отчётность
            не предусмотрена», «специальные основания прекращения
            не устанавливаются»);
          * "unclear" — формулировка неоднозначна;
          * "not_defined" — нет упоминания.
        - Верни РОВНО один валидный JSON-объект со всеми 9 ключами
          (8 полей + evidence), пригодный для парсинга через `json.loads`
          без предварительной обработки. Без markdown, без ```json, без
          комментариев, без текста до или после. Начни ответ сразу с `{`
          и закончи `}`.
        </rules>

      fields:
        - name: "principal"
          type: "string"
          presentation: "fact"
          label: "Доверитель"
          description: "Доверитель по договору поручения."
          required: true
          display_in_grid: true
          display_priority: 1
        - name: "agent"
          type: "string"
          presentation: "fact"
          label: "Поверенный"
          description: "Поверенный по договору поручения."
          required: true
          display_in_grid: true
          display_priority: 2
        - name: "mandated_actions"
          type: "string"
          presentation: "fact"
          label: "Предмет поручения"
          description: "Перечень юридических действий, составляющих предмет поручения."
          required: true
          display_in_grid: true
          display_priority: 3
          max_value_chars: 800
        - name: "acts_in_name_of"
          type: "string"
          presentation: "signal"
          allowed_values: ["principal", "agent", "mixed", "unclear", "not_defined"]
          description: >
            От чьего имени действует поверенный. Значение "agent" — индикатор
            потенциальной ошибки квалификации (риск переквалификации в комиссию
            или агентирование).
          required: true
        - name: "acts_in_name_of_display"
          type: "string"
