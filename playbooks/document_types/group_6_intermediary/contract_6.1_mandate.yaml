# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 4: CHECKS_V8 — единственный рабочий слой юридического анализа
#  Читается: DocTypeCheckLoader._load_doc_type_checks()
# ════════════════════════════════════════════════════════════════════════════

checks_v8:

  - id: mandate_subject_extraction
    name: "Базовое извлечение структуры договора поручения"
    description: >
      Извлекает доверителя, поверенного, предмет поручения, модель действий
      (от имени доверителя / от своего имени), статус доверенности,
      возмездность, отчётность и условия прекращения.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "договор поручения"
        - "поверенный"
        - "доверитель"
        - "от имени доверителя"
        - "доверенность"
        - "юридические действия"
        - "отчет поверенного"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)(договор\\s+поручения|поверенн(ый|ого)|доверител(ь|я))"
        - "(?i)(от\\s+имени\\s+доверителя|за\\s+счет\\s+доверителя)"
        - "(?i)доверенн(ость|ости)"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор поручения по Главе 49 ГК РФ (ст. 971–979).
        Проверяется только один вопрос: ключевые параметры договора поручения.

        Нормативный ориентир:
        - ст. 971 ГК РФ — понятие договора поручения;
        - ст. 972 ГК РФ — возмездность / безвозмездность поручения;
        - ст. 974 ГК РФ — обязанности поверенного (отчёт);
        - ст. 975 ГК РФ — обязанности доверителя (доверенность);
        - ст. 977 ГК РФ — прекращение договора поручения;
        - ст. 182 ГК РФ — представительство.

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора,
          а чего прямо нет.
        - Не оценивай серьёзность риска.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Доверитель (наименование / ФИО).
        2. Поверенный (наименование / ФИО).
        3. Предмет поручения (перечень юридических действий).
        4. От чьего имени действует поверенный.
        5. Статус доверенности.
        6. Статус возмездности.
        7. Наличие отчётности.
        8. Наличие условий прекращения.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Если данные не указаны прямо — возвращай "not_defined" для статусных
          полей и "Данные не определены" для текстовых.
        4. Не используй "None", "null", "-", "n/a" или пустые строки.
        5. Если параметр определён через отсылку к приложению, спецификации
          или иному документу (например, «согласно Приложению № 1») —
          это валидное значение, а не "not_defined". Укажи текст отсылки.
        6. В evidence включай только текст договора.
        7. Верни РОВНО один валидный JSON-объект со всеми 8 ключами, пригодный
          для парсинга через json.loads без предварительной обработки.
          Без markdown, без ```json, без комментариев, без текста до или после.
          Начни ответ сразу с { и закончи }.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — параметры определены:
        Фрагмент:
        "Доверитель — ООО «Альфа» поручает, а Поверенный — Иванов И.И. обязуется
        от имени и за счёт Доверителя заключить договор аренды. Доверитель выдаёт
        нотариальную доверенность. Вознаграждение — 50 000 рублей. Поверенный
        представляет отчёт по итогам исполнения."

        Ответ:
        {
          "principal": "ООО «Альфа»",
          "agent": "Иванов И.И.",
          "mandated_actions": "заключить договор аренды",
          "acts_in_name_of": "principal",
          "poa_status": "required_and_mentioned",
          "remuneration_status": "paid",
          "reporting_status": "present",
          "termination_status": "not_defined"
        }

        Пример 2 — данные отсутствуют:
        Фрагмент:
        "Стороны заключили настоящий договор."

        Ответ:
        {
          "principal": "Данные не определены",
          "agent": "Данные не определены",
          "mandated_actions": "Данные не определены",
          "acts_in_name_of": "not_defined",
          "poa_status": "not_defined",
          "remuneration_status": "not_defined",
          "reporting_status": "not_defined",
          "termination_status": "not_defined"
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Проверь, что все 8 ключей присутствуют в JSON.
        2. Найди прямую цитату о доверителе.
        3. Найди прямую цитату о поверенном.
        4. Найди прямую цитату о предмете поручения.
        5. Найди прямую цитату о модели действий (от имени / от своего имени).
        6. Если прямой цитаты нет — верни "not_defined" или "Данные не определены".

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "principal": "<текст или 'Данные не определены'>",
          "agent": "<текст или 'Данные не определены'>",
          "mandated_actions": "<текст или 'Данные не определены'>",
          "acts_in_name_of": "<principal / agent / unclear / not_defined>",
          "poa_status": "<required_and_mentioned / mentioned / not_required / not_defined>",
          "remuneration_status": "<paid / free / unclear / not_defined>",
          "reporting_status": "<present / not_defined>",
          "termination_status": "<present / not_defined>"
        }
      context_k: 8
      temperature: 0.0
      max_tokens: 700

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "доверитель поверенный договор поручения от имени доверителя за счёт доверителя доверенность юридические действия предмет поручения отчёт поверенного вознаграждение прекращение отмена поручения"
      retrieval_profile: "scope_of_work_check"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - definitions
        - obligations
      negative_keywords:
        - "в целях настоящего"
        - "приложение"
        - "индекс"
      position_bias:
        preferred_range: [0.0, 0.5]
        boost: 0.30
        scope: segment
      context_k: 8
      max_chunks: 12
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
        - "invoice"
      preferred_clause_functions:
        - "definitions"
        - "obligations"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 50
      max_snippet_length: 700

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1100

      compact_output: false

      presence_signal:
        field: "mandate_subject_extraction_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора поручения ключевые
        параметры: доверителя, поверенного, предмет поручения, модель действий,
        статус доверенности, возмездность, отчётность и прекращение.
        Не анализируй передоверие, конфликт интересов или конкретные лимиты полномочий.
        Не оценивай серьёзность риска.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. mandate_subject_extraction_presence:
          Агрегатное signal-поле — наличие содержательных данных по теме.
          - "present" — если хотя бы одно из содержательных полей
            (principal, agent, mandated_actions, acts_in_name_of, poa_status,
              remuneration_status, reporting_status, termination_status)
            не равно дефолтному fallback-значению
            ("Данные не определены" для текстовых, "not_defined" для статусных);
          - "missing" — если все содержательные поля = соответствующий fallback;
          - "unclear" — если фрагменты по теме есть, но из-за противоречий
            вывод невозможен.

          Если presence = "missing":
          - principal, agent, mandated_actions, mandate_summary = "Данные не определены";
          - acts_in_name_of, poa_status, remuneration_status, reporting_status,
            termination_status = "not_defined";
          - не выполняй остальные шаги.

        1. principal — доверитель (наименование или ФИО).
          Если данных нет — "Данные не определены".
          Если данные противоречивы — "Не удалось определить".

        2. agent — поверенный (наименование или ФИО).
          Если данных нет — "Данные не определены".
          Если данные противоречивы — "Не удалось определить".

        3. mandated_actions — предмет поручения (перечень юридических действий).
          Если предмет определён через отсылку к приложению, спецификации
          или иному документу — укажи текст отсылки.
          Fallback: "Данные не определены" / "Не удалось определить".

        4. mandate_summary — краткая сводка: модель действий + доверенность +
          возмездность + отчётность (одна фраза).
          Fallback: "Данные не определены" / "Не удалось определить".

        5. acts_in_name_of:
          - "principal" — если прямо указано "от имени доверителя";
          - "agent" — если прямо указано "от своего имени";
          - "unclear" — если формулировка неоднозначна;
          - "not_defined" — если не указано.

        6. poa_status:
          - "required_and_mentioned" — если доверенность прямо предусмотрена
            как обязательная;
          - "mentioned" — если упомянута, но не как обязанность;
          - "not_required" — если прямо указано, что доверенность не требуется;
          - "not_defined" — если не упомянута.

        7. remuneration_status:
          - "paid" — если указано вознаграждение;
          - "free" — если прямо указано «безвозмездно»;
          - "unclear" — если формулировка неоднозначна;
          - "not_defined" — если не указано (презумпция безвозмездности
            по ст. 972 ГК РФ применяется на уровне юридического вывода,
            не extraction).

        8. reporting_status:
          - "present" — если обязанность отчёта прямо предусмотрена;
          - "not_defined" — если не указана.

        9. termination_status:
          - "present" — если условия прекращения прямо предусмотрены;
          - "not_defined" — если не указаны.
        </task>

        <context_rules>
        - Перед остальными полями заполни mandate_subject_extraction_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все текстовые = "Данные не определены", все статусные = "not_defined".
        - Используй только текст договора.
        - Не подставляй нормы закона, обычную практику или предположения вместо текста договора.
        - Не делай выводов по типовой структуре договора поручения.
        - Если параметр определён через отсылку к приложению, спецификации или иному документу — это валидное значение, укажи текст отсылки.
        - Если в разных фрагментах указаны противоречивые данные и конфликт нельзя разрешить по тексту — верни "Не удалось определить" для текстовых и "not_defined" для статусных; presence = "unclear".
        - Не используй "None", "null", "-", "n/a" или пустые строки.
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
          В тексте нет ни доверителя, ни поверенного, ни предмета поручения.
          → presence = "missing"; все текстовые = "Данные не определены";
            все статусные = "not_defined".

        2. Неполное раскрытие темы.
          Указан только доверитель или только поверенный, без предмета поручения.
          → presence = "present"; соответствующие текстовые = "Данные не определены";
            связанные статусные = "not_defined".

        3. Противоречие между фрагментами.
          В разных частях договора указаны разные модели действий
          (от имени доверителя / от своего имени) или разные доверители.
          → presence = "unclear"; соответствующий *_status = "not_defined";
            соответствующее текстовое поле = "Не удалось определить".

        4. Отсылка на внешний документ.
          Предмет поручения определяется через приложение, спецификацию,
          дополнительное соглашение.
          → presence = "present"; mandated_actions содержит текст отсылки.
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для mandate_subject_extraction_presence используй только: "present", "missing", "unclear".
        - Для acts_in_name_of используй только: "principal", "agent", "unclear", "not_defined".
        - Для poa_status используй только: "required_and_mentioned", "mentioned", "not_required", "not_defined".
        - Для remuneration_status используй только: "paid", "free", "unclear", "not_defined".
        - Для reporting_status и termination_status используй только: "present", "not_defined".
        - Fallback при отсутствии данных:
          * principal, agent, mandated_actions, mandate_summary → "Данные не определены";
          * статусные поля → "not_defined".
        - Fallback при противоречии или неоднозначности:
          * все текстовые → "Не удалось определить";
          * статусные, где предусмотрено значение "unclear" → "unclear", иначе "not_defined".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "mandate_subject_extraction_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие ключевых параметров договора поручения. Внутреннее агрегатное signal-поле."
          required: true

        - name: "principal"
          type: "string"
          presentation: "fact"
          label: "Доверитель"
          description: >
            Доверитель по договору поручения. Fallback: "Не установлено" / "Не удалось определить".
          required: true
          display_in_grid: true
          display_priority: 1

        - name: "agent"
          type: "string"
          presentation: "fact"
          label: "Поверенный"
          description: >
            Поверенный по договору поручения. Fallback: "Не установлено" / "Не удалось определить".
          required: true
          display_in_grid: true
          display_priority: 2

        - name: "mandated_actions"
          type: "string"
          presentation: "fact"
          label: "Предмет поручения"
          description: >
            Перечень юридических действий, составляющих предмет поручения. Fallback: "Не установлено" / "Не удалось определить".
          required: true
          display_in_grid: true
          display_priority: 3

        - name: "mandate_summary"
          type: "string"
          presentation: "summary"
          label: "Сводка поручения"
          description: "Краткая сводка ключевых параметров поручения."
          required: false
          display_in_grid: true
          display_priority: 4

        - name: "acts_in_name_of"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["principal", "agent", "unclear", "not_defined"]
          display_in_grid: false
          description: "От чьего имени действует поверенный. Внутреннее enum-поле."
          required: true

        - name: "poa_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["required_and_mentioned", "mentioned", "not_required", "not_defined"]
          display_in_grid: false
          description: "Статус доверенности в договоре. Внутреннее enum-поле."
          required: true

        - name: "remuneration_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["paid", "free", "unclear", "not_defined"]
          display_in_grid: false
          description: "Статус возмездности договора поручения. Внутреннее enum-поле."
          required: true

        - name: "reporting_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["present", "not_defined"]
          display_in_grid: false
          description: "Наличие отчётности поверенного. Внутреннее enum-поле."
          required: true

        - name: "termination_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["present", "not_defined"]
          display_in_grid: false
          description: "Наличие условий прекращения договора. Внутреннее enum-поле."
          required: true

      store_payload: true

  - id: subject_legal_actions_check
    name: "Предмет поручения: конкретные юридические действия"
    description: >
      Проверяет, что предмет договора выражен в виде конкретных юридических,
      а не фактических/сервисных действий, и степень их конкретизации.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "совершить юридические действия"
        - "заключение договоров"
        - "представление интересов"
        - "подача документов"
        - "подписание"
        - "государственная регистрация"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)соверш(ить|ает).*юридическ(ие|их)\\s+действ"
        - "(?i)заключени[ея]\\s+договор|представлени[ея]\\s+интерес"
        - "(?i)подписани[ея]|подач[аи]\\s+документ"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор поручения по Главе 49 ГК РФ.
        Проверяется только один вопрос: предмет поручения — конкретные
        юридические действия.

        Нормативный ориентир:
        - ст. 971 ГК РФ — предмет договора поручения (юридические действия);
        - ст. 432 ГК РФ — существенные условия договора;
        - ст. 779 ГК РФ — возмездное оказание услуг (риск переквалификации,
          если действия по сути фактические / сервисные).

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора.
        - Не оценивай серьёзность риска.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Степень конкретизации действий.
        2. Юридическую природу действий.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Если данные не указаны прямо — возвращай "not_defined".
        4. Не используй "None", "null", "-", "n/a" или пустые строки.
        5. Если предмет определён через отсылку к приложению, спецификации
          или иному документу (например, «согласно Приложению № 1») —
          это валидное значение: оценивай конкретность по тексту отсылки,
          если он есть в контексте.
        6. В evidence включай только текст договора.
        7. Верни РОВНО один валидный JSON-объект со всеми 2 ключами, пригодный
          для парсинга через json.loads без предварительной обработки.
          Без markdown, без ```json, без комментариев, без текста до или после.
          Начни ответ сразу с { и закончи }.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — действия конкретны и юридические:
        Фрагмент:
        "Поверенный обязуется: 1) заключить договор аренды от имени Доверителя;
        2) подписать акт приёма-передачи; 3) подать документы на государственную
        регистрацию."

        Ответ:
        {
          "actions_specificity": "specific",
          "actions_nature": "legal"
        }

        Пример 2 — действия не конкретизированы:
        Фрагмент:
        "Поверенный совершает любые необходимые действия в интересах Доверителя."

        Ответ:
        {
          "actions_specificity": "generic",
          "actions_nature": "unclear"
        }

        Пример 3 — фактические (сервисные) действия под видом поручения:
        Фрагмент:
        "Поверенный обязуется: 1) осуществлять поиск потенциальных арендаторов;
        2) проводить показы объекта; 3) вести переговоры об условиях."

        Ответ:
        {
          "actions_specificity": "specific",
          "actions_nature": "factual_or_service_like"
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Проверь, что все 2 ключа присутствуют в JSON.
        2. Найди прямую цитату с перечнем действий.
        3. Определи, конкретны ли они, частично конкретны, или даны общей формулой.
        4. Определи природу: юридические / смешанные / фактические / неоднозначные.
        5. Если прямой цитаты нет — верни "not_defined".

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "actions_specificity": "<specific / partial / generic / not_defined>",
          "actions_nature": "<legal / mixed / factual_or_service_like / unclear / not_defined>"
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 340

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
