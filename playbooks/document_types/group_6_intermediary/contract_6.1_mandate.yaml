        1. Указан ли срок доверенности.
        2. Совпадает ли срок доверенности со сроком поручения.
        3. Есть ли механизм продления или перевыдачи доверенности.
        4. Есть ли условие о безотзывной доверенности.
        5. Есть ли требование нотариальной формы доверенности при передоверии.

        [ПРАВИЛА]
        1. Используй только текст документа.
