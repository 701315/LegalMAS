           комментариев, без текста до или после. Начни ответ сразу с `{`
           и закончи `}`.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — ограничения и антиконфликтная оговорка присутствуют:
        Фрагмент:
        "Поверенный не вправе совершать сделки на сумму свыше 1 000 000 рублей
        без предварительного письменного согласования с Доверителем. Поверенный
        не вправе совершать сделки с самим собой или с аффилированными лицами."

        Ответ:
