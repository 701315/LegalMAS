          required: false
          display_in_grid: true
          display_priority: 4
        - name: "poa_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["required_and_mentioned", "mentioned", "attached", "not_defined"]
          description: "Статус доверенности в договоре."
          required: false
        - name: "poa_status_display"
          type: "string"
