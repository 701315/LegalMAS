          "authority_limits_status": "present",
          "conflict_of_interest_clause": "present",
          "evidence": "Поверенный не вправе совершать сделки на сумму свыше 1 000 000 рублей без предварительного письменного согласования с Доверителем."
        }

        Пример 2 — данные отсутствуют:
        Фрагмент:
        "Поверенный действует в интересах Доверителя."

        Ответ:
        {
          "authority_limits_status": "not_defined",
          "conflict_of_interest_clause": "not_defined",
          "evidence": "Поверенный действует в интересах Доверителя."
        }

        Пример 3 — частичные ограничения, антиконфликтная оговорка отсутствует:
        Фрагмент:
        "Поверенный вправе заключать договоры аренды без согласования.
