          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["legal", "mixed", "factual_or_service_like", "unclear", "not_defined"]
          display_in_grid: false
          description: "Юридическая природа действий. Внутреннее enum-поле."
          required: true

      store_payload: true

  - id: poa_and_authority_check
    name: "Доверенность и объём полномочий"
    description: >
      Проверяет наличие обязанности выдать доверенность, соответствие
      полномочий предмету поручения и указание на нотариальную форму.
    triggers: {}
    ui_mode: "field_extraction"
