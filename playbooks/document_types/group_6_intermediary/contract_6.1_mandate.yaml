  - id: reporting_and_transfer_check
    name: "Отчётность поверенного и передача всего полученного"
    description: >
      Проверяет порядок отчётности, передачу документов и всего полученного
      доверителю по сделкам.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
