    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 700
      compact_output: false
      store_payload: true

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора поручения сведения
        об отчётности поверенного, передаче всего полученного и порядке
