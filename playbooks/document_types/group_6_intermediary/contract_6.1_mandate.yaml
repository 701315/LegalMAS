        1. Урегулирован ли механизм одобрения сделок без полномочий
           или с превышением.
        2. Установлен ли срок на одобрение или отказ.
        3. Требуется ли письменная форма одобрения.
        4. Предусмотрено ли молчание как форма одобрения.
        5. Урегулированы ли последствия неодобрения для поверенного.

        [ПРАВИЛА]
        1. Используй только текст документа.
