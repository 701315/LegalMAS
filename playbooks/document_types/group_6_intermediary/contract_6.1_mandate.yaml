        до истечения срока его действия. Отказ от исполнения поручения
        не допускается."

        Ответ:
        {
          "termination_waiver_clause": "present",
          "termination_restriction_clause": "present"
        }

        Пример 2 — косвенное ограничение (неустойка за отказ):
        Фрагмент:
        "Каждая из сторон вправе отказаться от исполнения договора,
        уплатив другой стороне неустойку в размере 500 000 рублей."

        Ответ:
        {
          "termination_waiver_clause": "not_defined",
          "termination_restriction_clause": "present"
        }

        Пример 3 — ограничений нет:
        Фрагмент:
        "Доверитель вправе отменить поручение в любое время. Поверенный
        вправе отказаться от исполнения поручения, уведомив Доверителя
        за 15 дней."

        Ответ:
        {
          "termination_waiver_clause": "not_defined",
          "termination_restriction_clause": "not_defined"
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Проверь, что все 2 ключа присутствуют в JSON.
        2. Найди прямую цитату, исключающую право отмены/отказа.
