# ════════════════════════════════════════════════════════════════════════════
#  БЛОК 4: CHECKS_V8 — единственный рабочий слой юридического анализа
#  Читается: DocTypeCheckLoader._load_doc_type_checks()
# ════════════════════════════════════════════════════════════════════════════

checks_v8:

  - id: mandate_subject_extraction
    name: "Базовое извлечение структуры договора поручения"
    description: >
      Извлекает доверителя, поверенного, предмет поручения, модель действий
      (от имени доверителя / от своего имени / смешанная), статус доверенности
      (обязательна / упомянута / приложена), возмездность, отчётность
      и условия прекращения. Служит для базовой квалификации сделки
      по гл. 49 ГК РФ и выявления риска переквалификации в комиссию
      или агентирование.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "договор поручения"
        - "поверенный"
        - "доверитель"
        - "от имени доверителя"
        - "от своего имени"
        - "доверенность"
        - "юридические действия"
        - "отчет поверенного"
        - "вознаграждение поверенного"
        - "прекращение поручения"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)(договор\\s+поручения|поверенн(ый|ого)|доверител(ь|я))"
        - "(?i)(от\\s+имени\\s+доверителя|за\\s+счет\\s+доверителя|от\\s+своего\\s+имени)"
        - "(?i)доверенн(ость|ости)"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор поручения по Главе 49 ГК РФ (ст. 971–979).
        Проверяется только один вопрос: ключевые параметры договора поручения.

        Нормативный ориентир:
        - ст. 971 ГК РФ — договор поручения (юридические действия от имени и за счёт доверителя)
        - ст. 972 ГК РФ — возмездность договора поручения
        - ст. 974 ГК РФ — обязанности поверенного (в том числе представление отчёта)
        - ст. 975 ГК РФ — обязанности доверителя (выдача доверенности, оплата издержек)
        - ст. 977 ГК РФ — основания прекращения договора поручения
        - ст. 182 ГК РФ — представительство

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора,
          а чего прямо нет.
        - Не оценивай серьёзность риска.
        - Не применяй презумпцию возмездности по ст. 972 ГК РФ: если условие
          о вознаграждении прямо не указано — верни "not_defined".

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Доверитель (наименование / ФИО).
        2. Поверенный (наименование / ФИО).
        3. Предмет поручения (перечень юридических действий).
        4. От чьего имени действует поверенный.
        5. Статус доверенности.
        6. Статус возмездности.
        7. Наличие отчётности.
        8. Наличие условий прекращения.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Для текстовых полей: если данные не указаны прямо — возвращай
           строку "Данные не определены".
        4. Для статусных полей: если данные не указаны прямо — возвращай
           значение "not_defined" из соответствующего enum.
        5. Если условие прямо указано как отсутствующее (например, «отчётность
           не предусмотрена») — используй "absent" (для reporting_status
           и termination_status). Если параметр определяется через отсылку
           к иному документу или соглашению — используй соответствующее
           значение enum (например, "by_agreement" для remuneration_status).
        6. Не используй "None", "null" или пустые строки.
        7. В evidence включай только текст договора.
        8. Не применяй презумпцию возмездности по ст. 972 ГК РФ — если
           вознаграждение прямо не указано, верни "not_defined".
        9. Верни РОВНО один валидный JSON-объект со всеми 9 ключами
           (8 полей + evidence), пригодный для парсинга через `json.loads`
           без предварительной обработки. Без markdown, без ```json, без
           комментариев, без текста до или после. Начни ответ сразу с `{`
           и закончи `}`.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — параметры определены (классическое поручение):
        Фрагмент:
        "Доверитель — ООО «Альфа» поручает, а Поверенный — Иванов И.И. обязуется
        от имени и за счёт Доверителя заключить договор аренды. Доверитель выдаёт
        нотариальную доверенность. Вознаграждение — 50 000 рублей. Поверенный
        представляет отчёт по итогам исполнения."

        Ответ:
        {
          "principal": "ООО «Альфа»",
          "agent": "Иванов И.И.",
          "mandated_actions": "заключить договор аренды",
          "acts_in_name_of": "principal",
          "poa_status": "required_and_mentioned",
          "remuneration_status": "paid",
          "reporting_status": "present",
          "termination_status": "not_defined",
          "evidence": "Доверитель — ООО «Альфа» поручает, а Поверенный — Иванов И.И. обязуется от имени и за счёт Доверителя заключить договор аренды."
        }

        Пример 2 — данные отсутствуют:
        Фрагмент:
        "Стороны заключили настоящий договор в городе Москве 12 января 2024 года."

        Ответ:
        {
          "principal": "Данные не определены",
          "agent": "Данные не определены",
          "mandated_actions": "Данные не определены",
          "acts_in_name_of": "not_defined",
          "poa_status": "not_defined",
          "remuneration_status": "not_defined",
          "reporting_status": "not_defined",
          "termination_status": "not_defined",
          "evidence": "Стороны заключили настоящий договор в городе Москве 12 января 2024 года."
        }

        Пример 3 — частично определено, отсылка к документу и приложенная доверенность:
        Фрагмент:
        "Поверенный действует на основании доверенности №1 от 12.01.2024, являющейся
        Приложением №1 к настоящему договору. Отчёт представляется по требованию
        Доверителя. Размер вознаграждения определяется дополнительным соглашением сторон."

        Ответ:
        {
          "principal": "Данные не определены",
          "agent": "Данные не определены",
          "mandated_actions": "Данные не определены",
          "acts_in_name_of": "not_defined",
          "poa_status": "attached",
          "remuneration_status": "by_agreement",
          "reporting_status": "present",
          "termination_status": "not_defined",
          "evidence": "Поверенный действует на основании доверенности №1 от 12.01.2024, являющейся Приложением №1 к настоящему договору. Отчёт представляется по требованию Доверителя."
        }

        Пример 4 — риск переквалификации (поверенный действует «от своего имени»):
        Фрагмент:
        "Поверенный обязуется от своего имени, но за счёт Доверителя заключить
        договор поставки товаров у третьих лиц."

        Ответ:
        {
          "principal": "Данные не определены",
          "agent": "Данные не определены",
          "mandated_actions": "заключить договор поставки товаров у третьих лиц",
          "acts_in_name_of": "agent",
          "poa_status": "not_defined",
          "remuneration_status": "not_defined",
          "reporting_status": "not_defined",
          "termination_status": "not_defined",
          "evidence": "Поверенный обязуется от своего имени, но за счёт Доверителя заключить договор поставки товаров у третьих лиц."
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Проверь, что все 9 ключей (8 полей + evidence) присутствуют в JSON.
        2. Найди прямую цитату о доверителе и поверенном.
        3. Найди прямую цитату о предмете поручения.
        4. Найди прямую цитату о модели действий (от имени доверителя /
           от своего имени / смешанная).
        5. Найди прямую цитату о доверенности, возмездности, отчётности
           и прекращении — либо подтверди отсутствие каждой.
        6. Если acts_in_name_of = "agent" — убедись, что в тексте прямо указано
           «от своего имени» (это индикатор потенциальной ошибки квалификации
           сделки: договор поручения не допускает действий от имени поверенного).

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "principal": "<текст или 'Данные не определены'>",
          "agent": "<текст или 'Данные не определены'>",
          "mandated_actions": "<текст или 'Данные не определены'>",
          "acts_in_name_of": "<principal / agent / mixed / unclear / not_defined>",
          "poa_status": "<required_and_mentioned / mentioned / attached / not_defined>",
          "remuneration_status": "<paid / free / by_agreement / unclear / not_defined>",
          "reporting_status": "<present / absent / unclear / not_defined>",
          "termination_status": "<present / absent / unclear / not_defined>",
          "evidence": "<прямая цитата из договора>"
        }
      context_k: 10
      temperature: 0.0
      max_tokens: 800

    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "договор поручения доверитель поверенный от имени доверителя от своего имени за счёт доверителя доверенность юридические действия вознаграждение возмездный безвозмездный отчёт отчётность прекращение поручения отмена отказ"
      retrieval_profile: "scope_of_work_check"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - definitions
        - obligations
      negative_keywords:
        - "означает"
        - "в целях настоящего"
        - "приложение"
        - "индекс"
      position_bias:
        preferred_range: [0.0, 0.35]
        boost: 0.20
        scope: segment
      context_k: 10
      max_chunks: 14
      rerank: true

    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
        - "invoice"
      preferred_clause_functions:
        - "definitions"
        - "obligations"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10

    evidence:
      required: true
      min_snippet_length: 50
      max_snippet_length: 700

    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 1100
      compact_output: false
      store_payload: true

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора поручения ключевые
        параметры: доверителя, поверенного, предмет поручения, модель действий,
        статус доверенности, возмездность, отчётность и прекращение.
        Не анализируй передоверие, конфликт интересов или конкретные лимиты
        полномочий.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие 8 полей + evidence (всего 9 ключей):

        1. principal — доверитель.
        2. agent — поверенный.
        3. mandated_actions — предмет поручения (перечень юридических действий).
        4. acts_in_name_of — "principal" / "agent" / "mixed" / "unclear"
           / "not_defined".
        5. poa_status — "required_and_mentioned" / "mentioned" / "attached"
           / "not_defined".
        6. remuneration_status — "paid" / "free" / "by_agreement" / "unclear"
           / "not_defined".
        7. reporting_status — "present" / "absent" / "unclear" / "not_defined".
        8. termination_status — "present" / "absent" / "unclear" / "not_defined".
        9. evidence — прямая цитата из договора, подтверждающая извлечённые данные.

        Если данные отсутствуют:
        - текстовое поле = "Данные не определены"
        - статусное поле = "not_defined"
        </task>

        <rules>
        - Используй только текст договора.
        - Не делай предположений.
        - Не применяй презумпцию возмездности по ст. 972 ГК РФ: если условие
          о вознаграждении прямо не указано — верни remuneration_status
          = "not_defined".
        - acts_in_name_of:
          * "principal" — если прямо указано, что поверенный действует
            "от имени доверителя" (все юридические действия);
          * "agent" — если прямо указано, что поверенный действует
            "от своего имени" (это индикатор потенциальной ошибки
            квалификации: договор поручения не допускает действий от имени
            поверенного, это признак договора комиссии или агентирования);
          * "mixed" — если в тексте прямо указано, что часть действий
            совершается от имени доверителя, а часть — от имени поверенного;
          * "unclear" — если формулировка неоднозначна;
          * "not_defined" — если не указано.
        - poa_status:
          * "required_and_mentioned" — если выдача доверенности прямо
            предусмотрена как обязанность доверителя (ст. 975 ГК РФ);
          * "mentioned" — если доверенность упомянута, но не как обязанность;
          * "attached" — если доверенность приложена к договору как приложение
            (например, «доверенность №1 является Приложением №1 к договору»);
          * "not_defined" — если не упомянута.
        - remuneration_status:
          * "paid" — прямо предусмотрено вознаграждение с указанием размера
            или порядка расчёта;
          * "free" — прямо указано, что договор безвозмездный;
          * "by_agreement" — размер / условия вознаграждения определяются
            отдельным соглашением или отсылкой к иному документу;
          * "unclear" — формулировка неоднозначна;
          * "not_defined" — нет упоминания вообще.
        - reporting_status / termination_status:
          * "present" — прямо предусмотрено;
          * "absent" — прямо указано отсутствие (например, «отчётность
            не предусмотрена», «специальные основания прекращения
            не устанавливаются»);
          * "unclear" — формулировка неоднозначна;
          * "not_defined" — нет упоминания.
        - Верни РОВНО один валидный JSON-объект со всеми 9 ключами
          (8 полей + evidence), пригодный для парсинга через `json.loads`
          без предварительной обработки. Без markdown, без ```json, без
          комментариев, без текста до или после. Начни ответ сразу с `{`
          и закончи `}`.
        </rules>

      fields:
        - name: "principal"
          type: "string"
          presentation: "fact"
          label: "Доверитель"
          description: "Доверитель по договору поручения."
          required: true
          display_in_grid: true
          display_priority: 1
        - name: "agent"
          type: "string"
          presentation: "fact"
          label: "Поверенный"
          description: "Поверенный по договору поручения."
          required: true
          display_in_grid: true
          display_priority: 2
        - name: "mandated_actions"
          type: "string"
          presentation: "fact"
          label: "Предмет поручения"
          description: "Перечень юридических действий, составляющих предмет поручения."
          required: true
          display_in_grid: true
          display_priority: 3
          max_value_chars: 800
        - name: "acts_in_name_of"
          type: "string"
          presentation: "signal"
          allowed_values: ["principal", "agent", "mixed", "unclear", "not_defined"]
          description: >
            От чьего имени действует поверенный. Значение "agent" — индикатор
            потенциальной ошибки квалификации (риск переквалификации в комиссию
            или агентирование).
          required: true
        - name: "acts_in_name_of_display"
          type: "string"
          presentation: "fact"
          label: "Модель действий"
          description: >
            Человекочитаемое отображение модели действий поверенного
            (backend, by design).
          required: false
          display_in_grid: true
          display_priority: 4
        - name: "poa_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["required_and_mentioned", "mentioned", "attached", "not_defined"]
          description: "Статус доверенности в договоре."
          required: false
        - name: "poa_status_display"
          type: "string"
          presentation: "fact"
          label: "Доверенность"
          description: >
            Человекочитаемое отображение статуса доверенности
            (backend, by design).
          required: false
          display_in_grid: true
          display_priority: 5
        - name: "remuneration_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["paid", "free", "by_agreement", "unclear", "not_defined"]
          description: "Статус возмездности договора."
          required: false
        - name: "remuneration_status_display"
          type: "string"
          presentation: "fact"
          label: "Возмездность"
          description: >
            Человекочитаемое отображение статуса возмездности
            (backend, by design).
          required: false
          display_in_grid: true
          display_priority: 6
        - name: "reporting_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["present", "absent", "unclear", "not_defined"]
          description: "Наличие отчётности поверенного."
          required: false
        - name: "reporting_status_display"
          type: "string"
          presentation: "fact"
          label: "Отчётность поверенного"
          description: >
            Человекочитаемое отображение статуса отчётности
            (backend, by design).
          required: false
          display_in_grid: true
          display_priority: 7
        - name: "termination_status"
          type: "string"
          presentation: "signal"
          allowed_values: ["present", "absent", "unclear", "not_defined"]
          description: "Наличие условий прекращения договора."
          required: false
        - name: "termination_status_display"
          type: "string"
          presentation: "fact"
          label: "Условия прекращения"
          description: >
            Человекочитаемое отображение статуса прекращения
            (backend, by design).
          required: false
          display_in_grid: true
          display_priority: 8

  - id: mandate_subject_extraction
    name: "Базовое извлечение структуры договора поручения"
    description: >
      Извлекает доверителя, поверенного, предмет поручения, модель действий
      (от имени доверителя / от своего имени / смешанная), статус доверенности
      (обязательна / упомянута / приложена), возмездность, отчётность
      и условия прекращения. Служит для базовой квалификации сделки
      по гл. 49 ГК РФ и выявления риска переквалификации в комиссию
      или агентирование.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"

    rules:
      keywords:
        - "договор поручения"
        - "поверенный"
        - "доверитель"
        - "от имени доверителя"
        - "от своего имени"
        - "доверенность"
        - "юридические действия"
        - "отчет поверенного"
        - "вознаграждение поверенного"
        - "прекращение поручения"
        - "отмена поручения"
        - "отказ от поручения"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)(договор\\s+поручения|поверенн(ый|ого)|доверител(ь|я))"
        - "(?i)(от\\s+имени\\s+доверителя|за\\s+счет\\s+доверителя|от\\s+своего\\s+имени)"
        - "(?i)доверенн(ость|ости)"
        - "(?i)(прекращени[ея]|отмен[аы]|отказ)\\s+(поручения|доверенности)"

    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор поручения по Главе 49 ГК РФ (ст. 971–979).
        Проверяется только один вопрос: ключевые параметры договора поручения.

        Нормативный ориентир:
        - ст. 971 ГК РФ — договор поручения (юридические действия от имени и за счёт доверителя)
        - ст. 972 ГК РФ — возмездность договора поручения
        - ст. 974 ГК РФ — обязанности поверенного (в том числе представление отчёта)
        - ст. 975 ГК РФ — обязанности доверителя (выдача доверенности, оплата издержек)
        - ст. 977 ГК РФ — основания прекращения договора поручения
        - ст. 182 ГК РФ — представительство

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора,
          а чего прямо нет.
        - Не оценивай серьёзность риска.
        - Не применяй презумпцию возмездности по ст. 972 ГК РФ: если условие
          о вознаграждении прямо не указано — верни "not_defined".

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Доверитель (наименование / ФИО).
        2. Поверенный (наименование / ФИО).
        3. Предмет поручения (перечень юридических действий).
        4. От чьего имени действует поверенный.
        5. Статус доверенности.
        6. Статус возмездности.
        7. Наличие отчётности.
        8. Наличие условий прекращения.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Для текстовых полей (principal, agent, mandated_actions): если данные
           не указаны прямо — возвращай строку "Данные не определены".
        4. Для статусных полей (acts_in_name_of, poa_status, remuneration_status,
           reporting_status, termination_status): если данные не указаны прямо —
           возвращай значение "not_defined" из соответствующего enum.
        5. Не используй "None", "null" или пустые строки. Значение "not_defined"
           используй только в статусных полях по перечню allowed_values.
        6. Если условие прямо указано как отсутствующее (например, «отчётность
           не предусмотрена», «специальные основания прекращения не устанавливаются») —
           используй "absent" (для reporting_status и termination_status).
           Если параметр определяется через отсылку к иному документу или
           соглашению — используй соответствующее значение enum (например,
           "by_agreement" для remuneration_status).
        7. Не применяй презумпцию возмездности по ст. 972 ГК РФ — если условие
           о вознаграждении прямо не указано, верни remuneration_status = "not_defined".
        8. В evidence включай только прямую цитату из текста договора.
        9. Верни РОВНО один валидный JSON-объект со всеми 9 ключами
           (8 полей + evidence), пригодный для парсинга через `json.loads`
           без предварительной обработки. Без markdown, без ```json, без
           комментариев, без текста до или после. Начни ответ сразу с `{`
           и закончи `}`.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — параметры определены (классическое поручение):
        Фрагмент:
        "Доверитель — ООО «Альфа» поручает, а Поверенный — Иванов И.И. обязуется
        от имени и за счёт Доверителя заключить договор аренды. Доверитель выдаёт
        нотариальную доверенность. Вознаграждение — 50 000 рублей. Поверенный
        представляет отчёт по итогам исполнения."

        Ответ:
        {
          "principal": "ООО «Альфа»",
          "agent": "Иванов И.И.",
          "mandated_actions": "заключить договор аренды",
          "acts_in_name_of": "principal",
          "poa_status": "required_and_mentioned",
          "remuneration_status": "paid",
          "reporting_status": "present",
          "termination_status": "not_defined",
          "evidence": "Доверитель — ООО «Альфа» поручает, а Поверенный — Иванов И.И. обязуется от имени и за счёт Доверителя заключить договор аренды."
        }

        Пример 2 — данные отсутствуют:
        Фрагмент:
        "Стороны заключили настоящий договор в городе Москве 12 января 2024 года."

        Ответ:
        {
          "principal": "Данные не определены",
          "agent": "Данные не определены",
          "mandated_actions": "Данные не определены",
          "acts_in_name_of": "not_defined",
          "poa_status": "not_defined",
          "remuneration_status": "not_defined",
          "reporting_status": "not_defined",
          "termination_status": "not_defined",
          "evidence": "Стороны заключили настоящий договор в городе Москве 12 января 2024 года."
        }

        Пример 3 — частично определено, отсылка к документу и приложенная доверенность:
        Фрагмент:
        "Поверенный действует на основании доверенности №1 от 12.01.2024, являющейся
        Приложением №1 к настоящему договору. Отчёт представляется по требованию
        Доверителя. Размер вознаграждения определяется дополнительным соглашением сторон."

        Ответ:
        {
          "principal": "Данные не определены",
          "agent": "Данные не определены",
          "mandated_actions": "Данные не определены",
          "acts_in_name_of": "not_defined",
          "poa_status": "attached",
          "remuneration_status": "by_agreement",
          "reporting_status": "present",
          "termination_status": "not_defined",
          "evidence": "Поверенный действует на основании доверенности №1 от 12.01.2024, являющейся Приложением №1 к настоящему договору. Отчёт представляется по требованию Доверителя."
        }

        Пример 4 — риск переквалификации (поверенный действует «от своего имени»):
        Фрагмент:
        "Поверенный обязуется от своего имени, но за счёт Доверителя заключить
        договор поставки товаров у третьих лиц."

        Ответ:
        {
          "principal": "Данные не определены",
          "agent": "Данные не определены",
          "mandated_actions": "заключить договор поставки товаров у третьих лиц",
          "acts_in_name_of": "agent",
          "poa_status": "not_defined",
          "remuneration_status": "not_defined",
          "reporting_status": "not_defined",
          "termination_status": "not_defined",
          "evidence": "Поверенный обязуется от своего имени, но за счёт Доверителя заключить договор поставки товаров у третьих лиц."
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Проверь, что все 9 ключей (8 полей + evidence) присутствуют в JSON.
        2. Найди прямую цитату о доверителе и поверенном.
        3. Найди прямую цитату о предмете поручения.
        4. Найди прямую цитату о модели действий (от имени доверителя /
