        - "(?i)отступлени[ея]\\s+от\\s+указан"
        - "(?i)ограничени[ея]\\s+ответственност"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор поручения по Главе 49 ГК РФ.
        Проверяется только один вопрос: ответственность поверенного
        за ненадлежащее исполнение и порядок отступления от указаний.

        Нормативный ориентир:
        - ст. 973 п. 3 ГК РФ — отступление от указаний доверителя:
          поверенный вправе отступить, если это необходимо в интересах
          доверителя и поверенный не мог запросить доверителя или не мог
          предвидеть его отрицательный ответ; обязан немедленно уведомить;
        - ст. 393 ГК РФ — обязанность должника возместить убытки;
        - ст. 401 ГК РФ — основания ответственности за нарушение обязательства
          (вина, если иное не предусмотрено законом или договором);
        - ст. 404 ГК РФ — вина кредитора (если доверитель дал неправомерные
          или неосуществимые указания);
        - ст. 15 ГК РФ — возмещение убытков (реальный ущерб + упущенная выгода).

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора.
        - Не оценивай серьёзность риска.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Есть ли договорные санкции за ненадлежащее исполнение поручения.
        2. Есть ли ограничение ответственности поверенного (cap).
        3. Есть ли порядок отступления от указаний доверителя.
        4. Есть ли обязанность уведомления доверителя об отступлении.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Если данные не указаны прямо — возвращай "not_defined".
        4. Не используй "None", "null", "-", "n/a" или пустые строки.
        5. Если условия определены через отсылку к приложению или регламенту —
           это валидное значение.
        6. В evidence включай только текст договора.
        7. Верни РОВНО один валидный JSON-объект со всеми 4 ключами, пригодный
           для парсинга через json.loads без предварительной обработки.
           Без markdown, без ```json, без комментариев, без текста до или после.
           Начни ответ сразу с { и закончи }.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — полная ответственность и порядок отступления:
        Фрагмент:
        "Поверенный несёт ответственность за убытки, причинённые Доверителю
        ненадлежащим исполнением поручения, в полном объёме. Поверенный вправе
        отступить от указаний Доверителя только в случаях, не терпящих отлагательства,
        с немедленным письменным уведомлением Доверителя."

        Ответ:
        {
          "agent_liability_clause": "present",
          "liability_cap_status": "not_defined",
          "deviation_procedure_status": "present",
          "deviation_notification_status": "present"
        }

        Пример 2 — ограниченная ответственность, отступление не оговорено:
        Фрагмент:
        "Ответственность Поверенного ограничивается суммой полученного
        вознаграждения. Поверенный обязан строго следовать указаниям Доверителя."

        Ответ:
        {
          "agent_liability_clause": "present",
          "liability_cap_status": "present",
          "deviation_procedure_status": "not_defined",
          "deviation_notification_status": "not_defined"
        }

        Пример 3 — ничего не указано:
        Фрагмент:
        "Поверенный обязуется совершить от имени Доверителя юридические действия,
        указанные в разделе 2 настоящего договора."

        Ответ:
        {
          "agent_liability_clause": "not_defined",
          "liability_cap_status": "not_defined",
          "deviation_procedure_status": "not_defined",
          "deviation_notification_status": "not_defined"
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Проверь, что все 4 ключа присутствуют в JSON.
        2. Найди прямую цитату об ответственности поверенного.
        3. Найди прямую цитату об ограничении ответственности.
        4. Найди прямую цитату об отступлении от указаний.
        5. Найди прямую цитату об уведомлении об отступлении.
        6. Если прямой цитаты нет — верни "not_defined".

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "agent_liability_clause": "<present / not_defined>",
          "liability_cap_status": "<present / not_defined>",
          "deviation_procedure_status": "<present / not_defined>",
          "deviation_notification_status": "<present / not_defined>"
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 420
