             окончательный расчёт);
           - "not_defined" — обязанности после исполнения не оговорены.

        5. completion_moment_verdict — краткая фраза-сводка для юриста:
           пример 1: «Критерий, фиксация и момент прекращения полномочий урегулированы»;
           пример 2: «Порядок фиксации установлен, критерий исполнения и момент прекращения полномочий не оговорены»;
           пример 3: «Момент исполнения поручения не урегулирован»;
           пример 4: «Данные не определены».
           Fallback: "Данные не определены" / "Не удалось определить".
        </task>

        <context_rules>
        - Перед остальными полями заполни completion_moment_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все статусные поля = "not_defined", completion_moment_verdict = "Данные не определены".
        - Используй только текст договора.
        - Не подставляй нормы закона, обычную практику или предположения вместо текста договора.
        - Не делай выводов по типовой структуре договора поручения.
        - Если порядок определён через отсылку к приложению или регламенту — это валидное значение, укажи отсылку.
        - Если в разных фрагментах указаны противоречивые данные и конфликт нельзя разрешить по тексту — верни completion_moment_verdict = "Не удалось определить", статусные поля = "not_defined"; presence = "unclear".
        - Не используй "None", "null", "-", "n/a" или пустые строки.
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни критерия исполнения, ни порядка фиксации,
           ни момента прекращения полномочий, ни обязанностей после исполнения.
           → presence = "missing";
             все статусные поля = "not_defined";
             completion_moment_verdict = "Данные не определены".

        2. Неполное раскрытие темы.
           Порядок фиксации исполнения установлен (акт, отчёт), но критерий
           исполнения и момент прекращения полномочий не оговорены.
           → presence = "present";
             completion_fixing_status = "defined";
             completion_criterion_status = "not_defined";
             completion_moment_status = "not_defined".

        3. Противоречие между фрагментами.
           В разных частях договора указаны противоречивые критерии
           исполнения или разные моменты прекращения полномочий.
           → presence = "unclear";
             соответствующий *_status = "not_defined";
             completion_moment_verdict = "Не удалось определить".

        4. Специальное условие о моменте.
           Договор прямо указывает момент исполнения поручения и связанное
           с ним прекращение полномочий поверенного.
           → presence = "present";
             completion_criterion_status = "defined";
             completion_moment_status = "defined";
             completion_moment_verdict содержит указание на момент.
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для completion_moment_check_presence используй только: "present", "missing", "unclear".
        - Для всех статусных полей используй только: "defined", "not_defined".
        - Fallback при отсутствии данных:
          * completion_moment_verdict → "Данные не определены";
          * статусные поля → "not_defined".
        - Fallback при противоречии или неоднозначности:
          * completion_moment_verdict → "Не удалось определить";
          * статусные поля → "not_defined".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "completion_moment_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие сведений о моменте исполнения поручения. Внутреннее агрегатное signal-поле."
          required: true

        - name: "completion_moment_verdict"
          type: "string"
          presentation: "summary"
          label: "Момент исполнения — вердикт"
          description: "Краткая сводка о критерии, фиксации и моменте прекращения полномочий при исполнении поручения."
          required: false
          display_in_grid: true
          display_priority: 1

        - name: "completion_criterion_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Наличие критерия исполнения поручения. Внутреннее enum-поле."
          required: true

        - name: "completion_fixing_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Наличие порядка фиксации исполнения. Внутреннее enum-поле."
          required: true

        - name: "completion_moment_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Наличие момента прекращения полномочий при исполнении. Внутреннее enum-поле."
          required: true

        - name: "post_completion_duties_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Наличие обязанностей сторон после исполнения. Внутреннее enum-поле."
          required: true

      store_payload: true

# ════════════════════════════════════════════════════════════════════════════
# БЛОК 5: DD_REQUEST_TEMPLATES
# Читается: DDRequestTemplateLoader
# ════════════════════════════════════════════════════════════════════════════

dd_request_templates:
  mandate_subject_extraction:
    text: >
      Просим предоставить по {doc_names}: сведения о доверителе и поверенном,
      точный предмет поручения, объём полномочий, доверенность, условия
      отчётности, вознаграждение, расходы и порядок прекращения договора.
    addressee: "Доверитель / Поверенный"

  subject_legal_actions_check:
    text: >
      Просим уточнить в {doc_names}: исчерпывающий перечень юридических действий,
      которые должен совершить поверенный, и исключить чрезмерно общие формулы
      вроде «любые необходимые действия».
    addressee: "Юридический советник"

  poa_and_authority_check:
    text: >
      Просим предоставить по {doc_names}: проект доверенности, перечень полномочий,
      сведения о необходимости нотариальной формы и подтверждение того, что объём
      доверенности соответствует предмету поручения.
    addressee: "Доверитель / Юридический советник"

  authority_limits_and_conflict_check:
    text: >
      Просим уточнить по {doc_names}: пределы полномочий поверенного, лимиты
      сумм/сделок, необходимость предварительного согласования существенных
      действий, а также ограничения, связанные с конфликтом интересов.
    addressee: "Доверитель / Юридический советник"

  instructions_and_expenses_check:
    text: >
      Просим уточнить по {doc_names}: какие указания доверителя обязательны
      для поверенного, как они оформляются, а также порядок возмещения расходов,
      авансирования и подтверждающих документов.
    addressee: "Доверитель / Поверенный"

  remuneration_check:
    text: >
      Просим уточнить в {doc_names}: является ли договор возмездным, каков размер
      вознаграждения поверенного, база его расчёта и порядок выплаты при полном
      и частичном исполнении поручения.
    addressee: "Обе стороны"

  reporting_and_transfer_check:
    text: >
      Просим предоставить по {doc_names}: форму и периодичность отчёта поверенного,
      перечень подтверждающих документов, порядок принятия/оспаривания отчёта
      и срок передачи доверителю всего полученного по сделкам.
    addressee: "Поверенный / Доверитель"

  termination_and_revocation_check:
    text: >
      Просим уточнить по {doc_names}: порядок отмены поручения, отказа поверенного,
      возврата доверенности, уведомления третьих лиц, завершения текущих дел
      и окончательного расчёта между сторонами.
    addressee: "Обе стороны"

  subdelegation_check:
    text: >
      По {doc_names} с передоверием просим предоставить: условия допустимости
      передоверия, форму согласия доверителя, требования к заместителю
      и распределение ответственности за его действия.
    addressee: "Поверенный / Юридический советник"

  commercial_representation_check:
    text: >
      По {doc_names} с признаками коммерческого представительства просим
      предоставить: обоснование статуса коммерческого представителя, специальные
      условия, письменные согласия на возможное представление обеих сторон сделки
      и порядок раскрытия конфликта интересов.
    addressee: "Юридический советник / Поверенный"

  _default:
    text: >
      Просим предоставить дополнительную информацию по вопросу «{check_name}»
      применительно к {doc_names}.
    addressee: "Юридический советник"
