    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 800

      compact_output: false

      presence_signal:
        field: "agent_liability_and_deviation_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора поручения сведения
        об ответственности поверенного за ненадлежащее исполнение, ограничении
        ответственности и порядке отступления от указаний доверителя.
        Сформулируй краткий вердикт для юриста.
        Не анализируй доверенность, отчётность, вознаграждение или прекращение.
        Не оценивай серьёзность риска — только зафиксируй наблюдаемые параметры.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. agent_liability_and_deviation_check_presence:
           Агрегатное signal-поле — наличие сведений об ответственности
           и порядке отступления.
           - "present" — если хотя бы одно из содержательных полей
             (agent_liability_clause, liability_cap_status,
              deviation_procedure_status, deviation_notification_status)
             ≠ "not_defined";
           - "missing" — если все четыре содержательных поля = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - agent_liability_clause = "not_defined";
           - liability_cap_status = "not_defined";
           - deviation_procedure_status = "not_defined";
           - deviation_notification_status = "not_defined";
           - agent_liability_verdict = "Данные не определены";
           - не выполняй остальные шаги.

        1. agent_liability_clause:
           - "present" — в договоре прямо установлена ответственность поверенного
             за ненадлежащее исполнение (неустойка, возмещение убытков, штраф);
           - "not_defined" — специальная ответственность не оговорена.

        2. liability_cap_status:
           - "present" — ответственность поверенного ограничена (cap: сумма
             вознаграждения, фиксированная сумма, исключение упущенной выгоды);
           - "not_defined" — ограничение ответственности не установлено.

        3. deviation_procedure_status:
           - "present" — в договоре урегулирован порядок отступления от указаний
             доверителя (условия допустимости, критерии необходимости);
           - "not_defined" — порядок отступления не оговорён.

        4. deviation_notification_status:
           - "present" — установлена обязанность поверенного уведомить доверителя
             об отступлении от указаний (срок, форма уведомления);
           - "not_defined" — обязанность уведомления не оговорена.

        5. agent_liability_verdict — краткая фраза-сводка для юриста:
           пример 1: «Ответственность поверенного установлена в полном объёме, порядок отступления от указаний урегулирован»;
           пример 2: «Ответственность ограничена суммой вознаграждения (cap)»;
           пример 3: «Ответственность и порядок отступления не оговорены»;
           пример 4: «Данные не определены».
           Fallback: "Данные не определены" / "Не удалось определить".
        </task>

        <context_rules>
        - Перед остальными полями заполни agent_liability_and_deviation_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все статусные поля = "not_defined", agent_liability_verdict = "Данные не определены".
        - Используй только текст договора.
        - Не подставляй нормы закона, обычную практику или предположения вместо текста договора.
        - Не делай выводов по типовой структуре договора поручения.
        - Если условия определены через отсылку к приложению или регламенту — это валидное значение, укажи отсылку.
        - Если в разных фрагментах указаны противоречивые данные и конфликт нельзя разрешить по тексту — верни agent_liability_verdict = "Не удалось определить", статусные поля = "not_defined"; presence = "unclear".
        - Не используй "None", "null", "-", "n/a" или пустые строки.
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни ответственности поверенного, ни ограничения
           ответственности, ни порядка отступления от указаний.
           → presence = "missing";
             agent_liability_clause = liability_cap_status =
             deviation_procedure_status = deviation_notification_status = "not_defined";
             agent_liability_verdict = "Данные не определены".

        2. Неполное раскрытие темы.
           Ответственность поверенного установлена, но ограничение
           ответственности и порядок отступления не оговорены.
           → presence = "present";
             agent_liability_clause = "present";
             liability_cap_status = deviation_procedure_status =
             deviation_notification_status = "not_defined".

        3. Противоречие между фрагментами.
           В разных частях договора указаны противоречивые условия
           об ответственности (полная / ограниченная) или об отступлении.
           → presence = "unclear";
             соответствующий *_status = "not_defined";
             agent_liability_verdict = "Не удалось определить".

        4. Отсылка на внешний документ / регламент.
           Условия ответственности или порядок отступления определяются
           регламентом, приложением или отдельным документом.
           → presence = "present";
             соответствующий *_status = "present";
             agent_liability_verdict содержит текст отсылки.
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для agent_liability_and_deviation_check_presence используй только: "present", "missing", "unclear".
        - Для agent_liability_clause, liability_cap_status, deviation_procedure_status и deviation_notification_status используй только: "present", "not_defined".
        - Fallback при отсутствии данных:
          * agent_liability_verdict → "Данные не определены";
          * статусные поля → "not_defined".
        - Fallback при противоречии или неоднозначности:
          * agent_liability_verdict → "Не удалось определить";
          * статусные поля → "not_defined".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "agent_liability_and_deviation_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие сведений об ответственности поверенного и порядке отступления. Внутреннее агрегатное signal-поле."
          required: true

        - name: "agent_liability_verdict"
          type: "string"
          presentation: "summary"
          label: "Ответственность и отступление — вердикт"
          description: "Краткая сводка об ответственности поверенного, ограничении ответственности и порядке отступления от указаний."
          required: false
          display_in_grid: true
          display_priority: 1

        - name: "agent_liability_clause"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["present", "not_defined"]
          display_in_grid: false
          description: "Наличие договорных санкций за ненадлежащее исполнение. Внутреннее enum-поле."
          required: true

        - name: "liability_cap_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["present", "not_defined"]
          display_in_grid: false
          description: "Наличие ограничения ответственности поверенного. Внутреннее enum-поле."
          required: true

        - name: "deviation_procedure_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["present", "not_defined"]
          display_in_grid: false
          description: "Наличие порядка отступления от указаний доверителя. Внутреннее enum-поле."
          required: true

        - name: "deviation_notification_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["present", "not_defined"]
          display_in_grid: false
          description: "Наличие обязанности уведомления об отступлении. Внутреннее enum-поле."
          required: true

      store_payload: true

