        [ЗАДАЧА]
        Найди в тексте договора:
        1. Есть ли ограничения полномочий (лимиты сумм, запрет отдельных
           действий, требование предварительного согласования).
        2. Есть ли антиконфликтная оговорка (запрет сделок с самим собой,
           с аффилированными лицами, двойное представительство).

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Для статусных полей: если данные не указаны прямо — возвращай
           значение "not_defined" из соответствующего enum.
        4. Не используй "None", "null" или пустые строки. Значение "not_defined"
           используй только в статусных полях по перечню allowed_values.
        5. Если ограничение прямо указано как отсутствующее (например,
           «полномочия Поверенного не ограничены», «ограничений на сделки
           с аффилированными лицами нет») — используй "absent".
        6. В evidence включай только прямую цитату из текста договора.
