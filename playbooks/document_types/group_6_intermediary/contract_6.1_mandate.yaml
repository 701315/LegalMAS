        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора поручения сведения
        о доверенности и объёме полномочий поверенного. Сформулируй краткий
        вердикт для юриста.
        Не анализируй предмет поручения, отчётность, вознаграждение или прекращение.
        Не оценивай серьёзность риска — только зафиксируй наблюдаемые параметры
        доверенности и полномочий.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. poa_and_authority_check_presence:
          Агрегатное signal-поле — наличие сведений о доверенности и полномочиях.
          - "present" — если хотя бы одно из содержательных полей
            (poa_clause_status, authority_scope_status, notarial_poa_reference)
            ≠ "not_defined";
          - "missing" — если все три содержательных поля = "not_defined";
          - "unclear" — если фрагменты по теме есть, но из-за противоречий
            вывод невозможен.

          Если presence = "missing":
          - poa_clause_status = "not_defined";
          - authority_scope_status = "not_defined";
          - notarial_poa_reference = "not_defined";
          - poa_verdict = "Данные не определены";
          - не выполняй остальные шаги.

        1. poa_clause_status:
          - "required" — прямо указана обязанность доверителя выдать доверенность
            («Доверитель обязан выдать…», «Доверитель выдаёт…»);
          - "mentioned" — доверенность упомянута, но обязанность не сформулирована
            явно («Поверенный действует по доверенности», «на основании доверенности»);
          - "not_defined" — доверенность не упомянута.

        2. authority_scope_status:
          - "defined" — объём полномочий конкретизирован (перечень действий,
            ссылка на пункт договора, конкретные сделки);
          - "generic" — общая формула («в рамках настоящего договора»,
