    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор поручения по Главе 49 ГК РФ.
        Проверяется только один вопрос: механика доверенности и полномочий.

        Нормативный ориентир:
        - ст. 975 ГК РФ — обязанность доверителя выдать доверенность;
        - ст. 185 ГК РФ — доверенность (понятие, содержание, объём);
        - ст. 185.1 ГК РФ — нотариальная форма доверенности (сделки с
          недвижимостью, госрегистрация, распоряжение зарегистрированными правами);
        - ст. 183 ГК РФ — действия без полномочий или с превышением;
        - ст. 187 ГК РФ — срок доверенности и передоверие.

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора.
        - Не оценивай серьёзность риска.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Есть ли обязанность выдать доверенность.
        2. Определён ли объём полномочий.
        3. Есть ли указание на нотариальную форму доверенности.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Если данные не указаны прямо — возвращай "not_defined".
        4. Не используй "None", "null", "-", "n/a" или пустые строки.
        5. Если параметр определён через отсылку к приложению или иному
          документу (например, «полномочия согласно Приложению № 1») —
          это валидное значение, а не "not_defined".
        6. В evidence включай только текст договора.
        7. Верни РОВНО один валидный JSON-объект со всеми 3 ключами, пригодный
          для парсинга через json.loads без предварительной обработки.
          Без markdown, без ```json, без комментариев, без текста до или после.
          Начни ответ сразу с { и закончи }.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — доверенность обязательна, полномочия конкретны, нотариальная:
        Фрагмент:
        "Доверитель обязан выдать Поверенному нотариальную доверенность
        на заключение договоров аренды и подписание актов приёма-передачи
        в пределах полномочий, указанных в п. 1.1 настоящего договора."

        Ответ:
        {
          "poa_clause_status": "required",
          "authority_scope_status": "defined",
          "notarial_poa_reference": "present"
        }

        Пример 2 — доверенность упомянута, но без обязанности, объём размыт:
        Фрагмент:
        "Поверенный действует на основании доверенности в рамках настоящего
        договора и совершает все необходимые действия в интересах Доверителя."

        Ответ:
        {
          "poa_clause_status": "mentioned",
          "authority_scope_status": "generic",
          "notarial_poa_reference": "not_defined"
        }

        Пример 3 — доверенность не упомянута:
        Фрагмент:
        "Поверенный обязуется совершить от имени Доверителя юридические
        действия, указанные в разделе 2 настоящего договора."

        Ответ:
        {
          "poa_clause_status": "not_defined",
          "authority_scope_status": "defined",
          "notarial_poa_reference": "not_defined"
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Проверь, что все 3 ключа присутствуют в JSON.
        2. Найди прямую цитату об обязанности выдать доверенность.
        3. Найди прямую цитату об объёме полномочий.
        4. Найди прямую цитату о нотариальной форме.
        5. Если прямой цитаты нет — верни "not_defined".

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "poa_clause_status": "<required / mentioned / not_defined>",
          "authority_scope_status": "<defined / generic / not_defined>",
          "notarial_poa_reference": "<present / not_defined>"
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 400

