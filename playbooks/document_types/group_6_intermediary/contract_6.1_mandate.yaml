  - id: termination_and_revocation_check
    name: "Прекращение поручения, отзыв доверенности и уведомление третьих лиц"
    description: >
      Проверяет порядок отмены поручения, отказа поверенного, возврата
      доверенности, уведомления третьих лиц и окончательного расчёта.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "отмена поручения"
        - "отказ от поручения"
        - "возврат доверенности"
        - "уведомление третьих лиц"
        - "реестр отмененных доверенностей"
        - "последствия прекращения"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)отмен[аы]\\s+поручен"
        - "(?i)отказ\\s+от\\s+поручен"
        - "(?i)возврат\\s+доверенн"
        - "(?i)уведомлени[ея]\\s+третьих\\s+лиц"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор поручения по Главе 49 ГК РФ.
        Проверяется только один вопрос: прекращение поручения, отзыв доверенности
        и уведомление третьих лиц.

        Нормативный ориентир:
        - ст. 977 ГК РФ — прекращение договора поручения:
          - п. 1 — отмена поручения доверителем, отказ поверенного в любое время;
          - п. 2 — соглашение об отказе от права отмены или отказа ничтожно;
        - ст. 978 ГК РФ — последствия прекращения поручения (возмещение
          издержек, выплата части вознаграждения, убытки при коммерческом поручении);
        - ст. 188 ГК РФ — прекращение доверенности;
        - ст. 189 ГК РФ — последствия прекращения доверенности (извещение третьих
          лиц, реестр нотариальной палаты, обязанность немедленного возврата).

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора.
        - Не оценивай серьёзность риска.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Есть ли порядок прекращения (отмена доверителем / отказ поверенного).
        2. Есть ли обязанность возврата/отзыва доверенности.
        3. Есть ли обязанность уведомления третьих лиц об отмене доверенности.
        4. Есть ли порядок окончательного расчёта при прекращении.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Если данные не указаны прямо — возвращай "not_defined".
        4. Не используй "None", "null", "-", "n/a" или пустые строки.
        5. Если порядок определён через отсылку к приложению или регламенту —
           это валидное значение "present", а не "not_defined".
        6. В evidence включай только текст договора.
        7. Верни РОВНО один валидный JSON-объект со всеми 4 ключами, пригодный
           для парсинга через json.loads без предварительной обработки.
           Без markdown, без ```json, без комментариев, без текста до или после.
           Начни ответ сразу с { и закончи }.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — полный порядок прекращения и отзыва доверенности:
        Фрагмент:
        "Доверитель вправе отменить поручение в любое время, уведомив за 3 дня.
        Поверенный обязан немедленно вернуть доверенность и письменно известить
        известных ему третьих лиц. Доверитель возмещает понесённые расходы
        и выплачивает часть вознаграждения в течение 10 рабочих дней."

        Ответ:
        {
          "termination_mechanism_status": "present",
          "poa_return_status": "present",
          "third_party_notice_status": "present",
          "settlement_upon_termination_status": "present"
        }

        Пример 2 — частичные условия (отмена есть, возврат и уведомление не описаны):
        Фрагмент:
        "Каждая из сторон вправе в одностороннем порядке отказаться от исполнения
        настоящего договора, предупредив другую сторону за 15 дней."

        Ответ:
        {
          "termination_mechanism_status": "present",
          "poa_return_status": "not_defined",
          "third_party_notice_status": "not_defined",
          "settlement_upon_termination_status": "not_defined"
        }

        Пример 3 — условия прекращения отсутствуют:
        Фрагмент:
        "Договор вступает в силу с момента подписания и действует до полного
        исполнения сторонами своих обязательств."

        Ответ:
        {
          "termination_mechanism_status": "not_defined",
          "poa_return_status": "not_defined",
          "third_party_notice_status": "not_defined",
          "settlement_upon_termination_status": "not_defined"
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Проверь, что все 4 ключа присутствуют в JSON.
        2. Найди прямую цитату о порядке прекращения / отмены поручения.
        3. Найди прямую цитату о возврате / отзыве доверенности.
        4. Найди прямую цитату об уведомлении третьих лиц об отмене доверенности.
        5. Найди прямую цитату об окончательном расчёте (расходы, часть вознаграждения).
        6. Если прямой цитаты нет — верни "not_defined".

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "termination_mechanism_status": "<present / partial / not_defined>",
          "poa_return_status": "<present / not_defined>",
          "third_party_notice_status": "<present / not_defined>",
          "settlement_upon_termination_status": "<present / not_defined>"
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 400
    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "отмена поручения отказ от поручения прекращение договора возврат доверенности отзыв доверенности уведомление третьих лиц реестр отменённых доверенностей последствия прекращения окончательный расчёт возмещение издержек"
      retrieval_profile: "termination_check"
      preferred_unit_types:
        - termination_provision
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - remedies
        - procedures
      negative_keywords:
        - "в целях настоящего"
        - "передоверие"
      position_bias:
        preferred_range: [0.50, 0.95]
        boost: 0.30
        scope: segment
      context_k: 6
      max_chunks: 10
      rerank: true
    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
        - "invoice"
      preferred_clause_functions:
        - "remedies"
        - "procedures"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10
    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 560
    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 700

      compact_output: false

      presence_signal:
        field: "termination_and_revocation_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора поручения сведения
        о прекращении поручения, возврате доверенности, уведомлении третьих лиц
        и окончательном расчёте. Сформулируй краткий вердикт для юриста.
        Не анализируй предмет поручения, вознаграждение при нормальном исполнении
        или текущую отчётность.
        Не оценивай серьёзность риска — только зафиксируй наблюдаемые параметры.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. termination_and_revocation_check_presence:
           Агрегатное signal-поле — наличие сведений о прекращении и отзыве.
           - "present" — если хотя бы одно из содержательных полей
             (termination_mechanism_status, poa_return_status,
              third_party_notice_status, settlement_upon_termination_status)
             ≠ "not_defined";
           - "missing" — если все четыре содержательных поля = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - termination_mechanism_status = "not_defined";
           - poa_return_status = "not_defined";
           - third_party_notice_status = "not_defined";
           - settlement_upon_termination_status = "not_defined";
           - termination_revocation_verdict = "Данные не определены";
           - не выполняй остальные шаги.

        1. termination_mechanism_status:
           - "present" — прямо описан порядок отмены поручения доверителем
             или отказа поверенного (сроки уведомления, процедура);
           - "partial" — упомянуто право на отказ/отмену без конкретной процедуры;
           - "not_defined" — порядок прекращения в договоре не описан.

        2. poa_return_status:
           - "present" — установлена обязанность поверенного возвратить доверенность
             при прекращении договора;
           - "not_defined" — обязанность возврата не оговорена.

        3. third_party_notice_status:
           - "present" — установлена обязанность известить третьих лиц об отмене
             доверенности или внести сведения в реестр отменённых доверенностей;
           - "not_defined" — обязанность извещения третьих лиц не оговорена.

        4. settlement_upon_termination_status:
           - "present" — согласован порядок окончательного расчёта (возмещение
             фактических расходов и выплата соразмерной части вознаграждения);
           - "not_defined" — порядок расчётов при досрочном прекращении не согласован.

        5. termination_revocation_verdict — краткая фраза-сводка для юриста:
           пример 1: «Порядок отмены, возврат доверенности, уведомление третьих лиц и расчёт согласованы»;
           пример 2: «Отмена поручения предусмотрена, но возврат доверенности и извещение третьих лиц не оговорены»;
           пример 3: «Порядок прекращения не урегулирован»;
           пример 4: «Данные не определены».
           Fallback: "Данные не определены" / "Не удалось определить".
        </task>

        <context_rules>
        - Перед остальными полями заполни termination_and_revocation_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все статусные поля = "not_defined", termination_revocation_verdict = "Данные не определены".
        - Используй только текст договора.
        - Не подставляй нормы закона, обычную практику или предположения вместо текста договора.
        - Не делай выводов по типовой структуре договора поручения.
        - Если порядок определён через отсылку к приложению или регламенту — это валидное значение "present", укажи отсылку.
        - Если в разных фрагментах указаны противоречивые данные и конфликт нельзя разрешить по тексту — верни termination_revocation_verdict = "Не удалось определить", статусные поля = "not_defined"; presence = "unclear".
        - Не используй "None", "null", "-", "n/a" или пустые строки.
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни порядка прекращения, ни возврата доверенности,
           ни уведомления третьих лиц, ни окончательного расчёта.
           → presence = "missing";
             termination_mechanism_status = poa_return_status =
             third_party_notice_status = settlement_upon_termination_status = "not_defined";
             termination_revocation_verdict = "Данные не определены".

        2. Неполное раскрытие темы.
           Отмена/отказ предусмотрены, но возврат доверенности, извещение
           третьих лиц и порядок расчёта не оговорены.
           → presence = "present";
             termination_mechanism_status = "present";
             poa_return_status = third_party_notice_status =
             settlement_upon_termination_status = "not_defined".

        3. Противоречие между фрагментами.
           В разных частях договора указаны разные сроки уведомления
           или разные условия окончательного расчёта.
           → presence = "unclear";
             соответствующий *_status = "not_defined";
             termination_revocation_verdict = "Не удалось определить".

        4. Отсылка на внешний документ / регламент.
           Порядок прекращения или расчёта определяется регламентом,
           приложением или отдельным документом.
           → presence = "present";
             соответствующий *_status = "present";
             termination_revocation_verdict содержит текст отсылки.
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для termination_and_revocation_check_presence используй только: "present", "missing", "unclear".
        - Для termination_mechanism_status используй только: "present", "partial", "not_defined".
        - Для poa_return_status, third_party_notice_status и settlement_upon_termination_status используй только: "present", "not_defined".
        - Fallback при отсутствии данных:
          * termination_revocation_verdict → "Данные не определены";
          * статусные поля → "not_defined".
        - Fallback при противоречии или неоднозначности:
          * termination_revocation_verdict → "Не удалось определить";
          * статусные поля → "not_defined".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "termination_and_revocation_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие сведений о прекращении поручения и отзыве доверенности. Внутреннее агрегатное signal-поле."
          required: true

        - name: "termination_revocation_verdict"
          type: "string"
          presentation: "summary"
          label: "Прекращение и отзыв доверенности — вердикт"
          description: "Краткая сводка об условиях отмены поручения, возврате доверенности, извещении третьих лиц и расчётах."
          required: false
          display_in_grid: true
          display_priority: 1

        - name: "termination_mechanism_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["present", "partial", "not_defined"]
          display_in_grid: false
          description: "Наличие порядка прекращения. Внутреннее enum-поле."
          required: true

        - name: "poa_return_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["present", "not_defined"]
          display_in_grid: false
          description: "Наличие возврата/отзыва доверенности. Внутреннее enum-поле."
          required: true

        - name: "third_party_notice_status"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["present", "not_defined"]
          display_in_grid: false
          description: "Наличие уведомления третьих лиц. Внутреннее enum-поле."
          required: true

        - name: "settlement_upon_termination_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["present", "not_defined"]
          display_in_grid: false
          description: "Наличие окончательного расчёта при прекращении. Внутреннее enum-поле."
          required: true

      store_payload: true

  - id: subdelegation_check
    name: "Передоверие: допустимость, согласие и ответственность"
    description: >
      Проверяет режим передоверия, необходимость согласия доверителя
      и ответственность поверенного за заместителя.
    triggers:
      any:
        - subdelegation_allowed
    ui_mode: "field_extraction"
    severity: "high"
    severity_if_pass: "pass"
    severity_if_fail: "high"
    severity_if_unclear: "medium"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "передоверие"
        - "заместитель"
        - "письменное согласие доверителя"
        - "ответственность за выбор заместителя"
        - "запрет передоверия"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)передовери"
        - "(?i)письменн(ое|ого)\\s+согласи[ея]\\s+доверител"
        - "(?i)ответственност[ьи].{0,30}за\\s+выбор\\s+заместител"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор поручения по Главе 49 ГК РФ.
        Проверяется только один вопрос: режим передоверия исполнения поручения.

        Нормативный ориентир:
        - ст. 976 ГК РФ — передоверие исполнения поручения:
          - п. 1 — поверенный вправе передать исполнение другому лицу (заместителю),
            если это предусмотрено договором либо вызвано силой обстоятельств
            для охраны интересов доверителя;
          - п. 2 — ответственность поверенного: если заместитель назван
            в договоре — поверенный не отвечает; если передоверие разрешено
            без указания лица — отвечает за выбор заместителя;
