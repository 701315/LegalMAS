           - не выполняй остальные шаги.

        1. remuneration_model:
           - "paid" — вознаграждение прямо предусмотрено (фиксированная сумма,
             процент, success fee, почасовая ставка и т.д.);
           - "free" — прямо указано «безвозмездно» или «без вознаграждения»;
           - "unclear" — формулировка неоднозначна (например, «стороны
             дополнительно согласуют размер вознаграждения»);
           - "not_defined" — вознаграждение не упомянуто (между предпринимателями
             действует презумпция возмездности по п. 3 ст. 423 ГК РФ; между
             непредпринимателями — презумпция безвозмездности).

        2. remuneration_amount_status:
           - "defined" — размер вознаграждения конкретизирован (сумма, формула,
             процент, ссылка на прайс-лист);
           - "not_defined" — размер не указан (при возмездном договоре применяется
             п. 3 ст. 424 ГК РФ — цена, обычно взимаемая за аналогичные услуги).

        3. payment_procedure_status:
           - "defined" — порядок выплаты конкретизирован (сроки, условия,
             привязка к отчёту или результату);
           - "not_defined" — порядок не указан.

        4. remuneration_verdict — краткая фраза-сводка для юриста:
           пример 1: «Возмездный, 50 000 руб., выплата по отчёту»;
           пример 2: «Безвозмездный — прямо указано в договоре»;
           пример 3: «Вознаграждение не оговорено»;
           пример 4: «Success fee 5% от суммы сделки, выплата по факту
           поступления средств»;
           пример 5: «Данные не определены».
           Fallback: "Данные не определены" / "Не удалось определить".
        </task>

        <context_rules>
        - Перед остальными полями заполни remuneration_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все статусные поля = "not_defined", remuneration_verdict = "Данные не определены".
        - Используй только текст договора.
        - Не подставляй нормы закона, обычную практику или предположения вместо текста договора.
        - Не делай выводов по типовой структуре договора поручения.
        - Если размер или порядок определены через отсылку к приложению, прайс-листу или иному документу — это валидное значение, укажи отсылку.
        - Если в разных фрагментах указаны противоречивые данные и конфликт нельзя разрешить по тексту — верни remuneration_verdict = "Не удалось определить", статусные поля = "not_defined"; presence = "unclear".
        - Не используй "None", "null", "-", "n/a" или пустые строки.
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни вознаграждения, ни указания на безвозмездность.
           → presence = "missing";
             remuneration_model = remuneration_amount_status = payment_procedure_status = "not_defined";
             remuneration_verdict = "Данные не определены".

        2. Неоднозначная формулировка.
           «Стороны дополнительно согласуют размер вознаграждения» без
           конкретной суммы и порядка.
           → presence = "present";
             remuneration_model = "unclear" (или "paid", если модель ясна, но размер — нет);
             remuneration_amount_status = "not_defined";
             payment_procedure_status = "not_defined".

        3. Противоречие между фрагментами.
           В разных частях договора указаны разные суммы, проценты или
           противоречивые условия о возмездности.
           → presence = "unclear";
             соответствующий *_status = "not_defined";
             remuneration_verdict = "Не удалось определить".

        4. Отсылка на внешний документ.
           Размер или порядок вознаграждения определяется прайс-листом,
           спецификацией или иным документом.
           → presence = "present";
             remuneration_amount_status = "defined" (если ссылка на конкретный документ);
             remuneration_verdict содержит текст отсылки.
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для remuneration_check_presence используй только: "present", "missing", "unclear".
        - Для remuneration_model используй только: "paid", "free", "unclear", "not_defined".
        - Для remuneration_amount_status и payment_procedure_status используй только: "defined", "not_defined".
        - Fallback при отсутствии данных:
          * remuneration_verdict → "Данные не определены";
          * статусные поля → "not_defined".
        - Fallback при противоречии или неоднозначности:
          * remuneration_verdict → "Не удалось определить";
          * статусные поля → "not_defined".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "remuneration_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие сведений о вознаграждении поверенного. Внутреннее агрегатное signal-поле."
          required: true

        - name: "remuneration_verdict"
          type: "string"
          presentation: "summary"
          label: "Вознаграждение — вердикт"
          description: "Краткая сводка о модели, размере и порядке выплаты вознаграждения."
          required: false
          display_in_grid: true
          display_priority: 1

        - name: "remuneration_model"
          type: "string"
          presentation: "signal"
          risk_weight: "high"
          allowed_values: ["paid", "free", "unclear", "not_defined"]
          display_in_grid: false
          description: "Модель возмездности договора. Внутреннее enum-поле."
          required: true

        - name: "remuneration_amount_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Определённость размера вознаграждения. Внутреннее enum-поле."
          required: true

        - name: "payment_procedure_status"
          type: "string"
          presentation: "signal"
          risk_weight: "medium"
          allowed_values: ["defined", "not_defined"]
          display_in_grid: false
          description: "Определённость порядка выплаты. Внутреннее enum-поле."
          required: true

      store_payload: true

  - id: reporting_and_transfer_check
    name: "Отчётность поверенного и передача всего полученного"
    description: >
      Проверяет порядок отчётности, передачу документов и всего полученного
      доверителю по сделкам.
    triggers: {}
    ui_mode: "field_extraction"
    severity: "critical"
    severity_if_pass: "pass"
    severity_if_fail: "critical"
    severity_if_unclear: "high"
    origin: "DOCUMENT_TYPE"
    detector_type: "hybrid"
    rules:
      keywords:
        - "отчет поверенного"
        - "оправдательные документы"
        - "передать доверителю все полученное"
        - "все полученное по сделкам"
        - "срок передачи"
      keyword_mode: "any"
      regex_patterns:
        - "(?i)отчет\\s+поверенн"
        - "(?i)оправдательн(ые|ых)\\s+документ"
        - "(?i)передат[ья].{0,40}все\\s+полученн"
    llm:
      prompt_template: |
        [КОНТЕКСТ]
        Ты — российский юрист по договорной работе.
        Анализируется договор поручения по Главе 49 ГК РФ.
        Проверяется только один вопрос: отчётность поверенного и передача
        всего полученного доверителю.

        Нормативный ориентир:
        - ст. 974 ГК РФ — обязанности поверенного:
          - сообщать доверителю по его требованию сведения о ходе исполнения;
          - передавать доверителю без промедления всё полученное по сделкам;
          - представить отчёт с приложением оправдательных документов
            (если это требуется по договору или характеру поручения);
          - возвратить доверенность, срок которой не истёк.

        Важно:
        - Твоя задача — только установить, что прямо есть в тексте договора.
        - Не оценивай серьёзность риска.

        [ЗАДАЧА]
        Найди в тексте договора:
        1. Есть ли обязанность представлять отчёт (и в какой срок/форме).
        2. Требуются ли подтверждающие (оправдательные) документы.
        3. Есть ли обязанность передать всё полученное по сделкам.
        4. Есть ли порядок принятия/оспаривания отчёта доверителем.

        [ПРАВИЛА]
        1. Используй только текст документа.
        2. Не подставляй нормы закона вместо текста договора.
        3. Если данные не указаны прямо — возвращай "not_defined".
        4. Не используй "None", "null", "-", "n/a" или пустые строки.
        5. Если форма отчёта или порядок передачи определены через отсылку
           к приложению (например, «по форме Приложения № 1») — это валидное
           значение "present", а не "not_defined".
        6. В evidence включай только текст договора.
        7. Верни РОВНО один валидный JSON-объект со всеми 4 ключами, пригодный
           для парсинга через json.loads без предварительной обработки.
           Без markdown, без ```json, без комментариев, без текста до или после.
           Начни ответ сразу с { и закончи }.

        [ПРИМЕРЫ (FEW-SHOT)]

        Пример 1 — полный порядок отчётности и передачи:
        Фрагмент:
        "Поверенный обязан представить письменный отчёт с приложением
        оправдательных документов в течение 5 рабочих дней. Всё полученное
        по сделке передаётся Доверителю в течение 3 дней. Доверитель обязан
        рассмотреть отчёт и заявить возражения в течение 10 дней."

        Ответ:
        {
          "reporting_clause_status": "present",
          "supporting_docs_required": "yes",
          "transfer_of_proceeds_status": "present",
          "report_acceptance_mechanism": "present"
        }

        Пример 2 — частичная отчётность (нет оправдательных документов и регламента возражений):
        Фрагмент:
        "Поверенный представляет Доверителю итоговый отчёт о выполнении
        поручения. Всё полученное передаётся Доверителю."

        Ответ:
        {
          "reporting_clause_status": "partial",
          "supporting_docs_required": "no",
          "transfer_of_proceeds_status": "present",
          "report_acceptance_mechanism": "not_defined"
        }

        Пример 3 — данные отсутствуют:
        Фрагмент:
        "Поверенный обязуется совершить юридические действия в интересах Доверителя."

        Ответ:
        {
          "reporting_clause_status": "not_defined",
          "supporting_docs_required": "not_defined",
          "transfer_of_proceeds_status": "not_defined",
          "report_acceptance_mechanism": "not_defined"
        }

        [ПРОВЕРКА ПЕРЕД ОТВЕТОМ — CoVe]
        1. Проверь, что все 4 ключа присутствуют в JSON.
        2. Найди прямую цитату об отчёте поверенного.
        3. Найди прямую цитату о подтверждающих (оправдательных) документах.
        4. Найди прямую цитату о передаче всего полученного доверителю.
        5. Найди прямую цитату о порядке принятия отчёта / сроках возражений.
        6. Если прямой цитаты нет — верни "not_defined".

        Не выводи шаги проверки. Верни только JSON.

        [ФОРМАТ ОТВЕТА]
        Ответь строго в JSON:
        {
          "reporting_clause_status": "<present / partial / not_defined>",
          "supporting_docs_required": "<yes / no / not_defined>",
          "transfer_of_proceeds_status": "<present / not_defined>",
          "report_acceptance_mechanism": "<present / not_defined>"
        }
      context_k: 6
      temperature: 0.0
      max_tokens: 400
    retrieval:
      corpus_scope: "primary_segment"
      levels:
        - "legal_unit"
        - "section"
      required_kind: "legal_unit"
      retrieval_query: "отчёт поверенного оправдательные документы подтверждающие передать доверителю всё полученное по сделкам срок передачи порядок принятия отчёта возражения рассмотрение отчёта"
      retrieval_profile: "acceptance_check"
      preferred_unit_types:
        - obligation
        - general_provision
      excluded_unit_types:
        - definition
        - structural_anchor
        - technical_fragment
      preferred_clause_functions:
        - obligations
        - procedures
      negative_keywords:
        - "в целях настоящего"
        - "передоверие"
        - "отмена поручения"
      position_bias:
        preferred_range: [0.25, 0.70]
        boost: 0.30
        scope: segment
      context_k: 6
      max_chunks: 10
      rerank: true
    enrichment_hints:
      preferred_segment_types:
        - "contract"
        - "amendment"
      excluded_segment_types:
        - "technical_specification"
        - "price_list"
        - "invoice"
      preferred_clause_functions:
        - "obligations"
        - "procedures"
      confidence_bonus_on_match: 0.08
      confidence_penalty_on_excluded_segment: 0.10
    evidence:
      required: true
      min_snippet_length: 40
      max_snippet_length: 580
    extraction:
      enabled: true
      mode: "hybrid"
      llm_max_tokens: 700

      compact_output: false

      presence_signal:
        field: "reporting_and_transfer_check_presence"
        present_values: ["present"]
        missing_values: ["missing"]
        unclear_values: ["unclear"]

      llm_prompt_extraction: |
        <role>
        Ты — российский юрист. Извлеки из текста договора поручения сведения
        об отчётности поверенного, передаче всего полученного и порядке
        рассмотрения отчёта доверителем. Сформулируй краткий вердикт для юриста.
        Не анализируй доверенность, вознаграждение или прекращение.
        Не оценивай серьёзность риска — только зафиксируй наблюдаемые параметры.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. reporting_and_transfer_check_presence:
           Агрегатное signal-поле — наличие сведений об отчётности и передаче.
           - "present" — если хотя бы одно из содержательных полей
             (reporting_clause_status, supporting_docs_required,
              transfer_of_proceeds_status, report_acceptance_mechanism)
             ≠ "not_defined";
           - "missing" — если все четыре содержательных поля = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - reporting_clause_status = "not_defined";
           - supporting_docs_required = "not_defined";
           - transfer_of_proceeds_status = "not_defined";
           - report_acceptance_mechanism = "not_defined";
           - reporting_transfer_verdict = "Данные не определены";
           - не выполняй остальные шаги.

        1. reporting_clause_status:
           - "present" — установлена обязанность представления отчёта с указанием
             сроков и/или формы отчёта;
           - "partial" — отчёт упомянут без сроков и конкретной формы;
           - "not_defined" — отчётность в договоре не упомянута.

        2. supporting_docs_required:
           - "yes" — прямо требуется приложение оправдательных (первичных) документов;
           - "no" — отчёт предусмотрен, но приложение документов прямо не требуется;
           - "not_defined" — отчётность не оговорена.

        3. transfer_of_proceeds_status:
           - "present" — прямо установлена обязанность передать всё полученное по сделке;
           - "not_defined" — передача полученного в договоре не оговорена.

        4. report_acceptance_mechanism:
           - "present" — урегулирован порядок рассмотрения отчёта доверителем
             (срок на рассмотрение, порядок направления возражений, последствия молчания);
           - "not_defined" — порядок рассмотрения и приёмки отчёта не описан.

        5. reporting_transfer_verdict — краткая фраза-сводка для юриста:
           пример 1: «Отчётность с оправдательными документами, передача всего полученного и регламент возражений согласованы»;
           пример 2: «Отчёт предусмотрен, но оправдательные документы и регламент возражений не согласованы»;
           пример 3: «Порядок отчётности и передачи не согласован»;
           пример 4: «Данные не определены».
           Fallback: "Данные не определены" / "Не удалось определить".
        </task>

        <context_rules>
        - Перед остальными полями заполни reporting_and_transfer_check_presence по правилу из пункта 0 task.
        - Если фрагментов по теме нет — presence = "missing"; не используй "unclear" при полном отсутствии фрагментов.
        - Если presence = "missing" — все статусные поля = "not_defined", reporting_transfer_verdict = "Данные не определены".
        - Используй только текст договора.
        - Не подставляй нормы закона, обычную практику или предположения вместо текста договора.
        - Не делай выводов по типовой структуре договора поручения.
        - Если форма отчёта или порядок передачи определены через отсылку к приложению — это валидное значение "present", укажи отсылку.
        - Если в разных фрагментах указаны противоречивые данные и конфликт нельзя разрешить по тексту — верни reporting_transfer_verdict = "Не удалось определить", статусные поля = "not_defined"; presence = "unclear".
        - Не используй "None", "null", "-", "n/a" или пустые строки.
        - Все текстовые значения пиши на русском языке.
        </context_rules>

        <edge_cases>
        1. Полное отсутствие темы.
           В тексте нет ни отчётности, ни оправдательных документов,
           ни передачи полученного, ни порядка приёмки.
           → presence = "missing";
             reporting_clause_status = supporting_docs_required =
             transfer_of_proceeds_status = report_acceptance_mechanism = "not_defined";
             reporting_transfer_verdict = "Данные не определены".

        2. Неполное раскрытие темы.
           Отчёт предусмотрен, но оправдательные документы и регламент
           рассмотрения отчёта не согласованы.
           → presence = "present";
             reporting_clause_status = "present";
             supporting_docs_required = "not_defined";
             report_acceptance_mechanism = "not_defined".

        3. Противоречие между фрагментами.
           В разных частях договора указаны разные сроки или формы отчёта
           или разные условия передачи полученного.
           → presence = "unclear";
             соответствующий *_status = "not_defined";
             reporting_transfer_verdict = "Не удалось определить".

        4. Отсылка на внешний документ.
           Форма отчёта или порядок передачи определяются приложением
           (например, «по форме Приложения №1»).
           → presence = "present";
             reporting_clause_status = "present";
             reporting_transfer_verdict содержит текст отсылки.
        </edge_cases>

        <output_expectations>
        - Все свободные текстовые поля заполняй на русском языке.
        - Для reporting_and_transfer_check_presence используй только: "present", "missing", "unclear".
        - Для reporting_clause_status используй только: "present", "partial", "not_defined".
        - Для supporting_docs_required используй только: "yes", "no", "not_defined".
        - Для transfer_of_proceeds_status и report_acceptance_mechanism используй только: "present", "not_defined".
        - Fallback при отсутствии данных:
          * reporting_transfer_verdict → "Данные не определены";
          * статусные поля → "not_defined".
        - Fallback при противоречии или неоднозначности:
          * reporting_transfer_verdict → "Не удалось определить";
          * статусные поля → "not_defined".
        - Технический формат JSON (value / confidence / location) задан отдельным контрактом — соблюдай его, но не описывай здесь.
        </output_expectations>

      fields:
        - name: "reporting_and_transfer_check_presence"
          type: "string"
          presentation: "signal"
          risk_weight: "info"
          allowed_values: ["present", "missing", "unclear"]
          display_in_grid: false
          description: "Наличие сведений об отчётности поверенного и передаче полученного. Внутреннее агрегатное signal-поле."
