        соответствии сроку поручения, пролонгации и последствиях исполнения
        после истечения срока.
        Сформулируй краткий вердикт для юриста.
        Не анализируй срок доверенности, объём полномочий, вознаграждение
        или общий порядок прекращения.
        Не оценивай серьёзность риска — только зафиксируй наблюдаемые параметры.
        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие поля:

        0. agreement_term_and_renewal_check_presence:
           Агрегатное signal-поле — наличие сведений о сроке договора
           и пролонгации.
           - "present" — если хотя бы одно из содержательных полей
             (effectiveness_moment_status, agreement_term_status,
              term_vs_poa_alignment, auto_renewal_status,
              post_term_effects_status)
             ≠ "not_defined";
           - "missing" — если все пять содержательных полей = "not_defined";
           - "unclear" — если фрагменты по теме есть, но из-за противоречий
             вывод невозможен.

           Если presence = "missing":
           - effectiveness_moment_status = "not_defined";
           - agreement_term_status = "not_defined";
