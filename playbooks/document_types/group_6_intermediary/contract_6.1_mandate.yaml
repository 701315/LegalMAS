        </role>

        <context>
        {context}
        </context>

        <task>
        Заполни строго следующие 4 полей + evidence (всего 5 ключей):
        
        Заполни строго следующие 4 поля:

        1. commercial_rep_status — "present" / "not_defined".
        2. dual_representation_status — "present" / "not_defined".
        3. written_form_status — "present" / "not_defined".
        4. commercial_rep_verdict — краткая человекочитаемая сводка (одна фраза).

        Если данные отсутствуют:
        - статусные поля = "not_defined";
        - commercial_rep_verdict = "Данные не определены".

        Если условия определены через отсылку к приложению — укажи это,
        отсылка является валидным значением "present".

        Верни РОВНО один валидный JSON-объект со всеми 4 ключами, пригодный
        для парсинга через json.loads без предварительной обработки.
        Без markdown, без ```json, без комментариев, без текста до или после.
        Начни ответ сразу с { и закончи }.
        </task>

        <rules>
        - Используй только текст договора.
        - Не делай предположений.
        - commercial_rep_status:
          "present" — прямо указан статус коммерческого представителя
          либо профессиональное постоянное представительство предпринимателей;
          "not_defined" — статус коммерческого представителя не упомянут.
        - dual_representation_status:
          "present" — прямо предусмотрено право одновременно представлять
          разные стороны сделки (с их согласия или на условиях договора);
          "not_defined" — одновременное представительство обеих сторон не оговорено
          (действует общий запрет ст. 182 п. 3 ГК РФ).
        - written_form_status:
          "present" — полномочия представителя прямо определены в тексте
          письменного договора (ст. 184 п. 3 ГК РФ) без отдельной доверенности;
          "not_defined" — прямое указание на фиксацию полномочий в договоре
          отсутствует.
        - commercial_rep_verdict — короткая фраза для юриста:
